      <h1>Moalim — Le Tuteur IA qui Prédit les Sujets du BAC 2026 au Maroc</h1>
      <p><strong>Moalim (معلم)</strong> est la première plateforme d'intelligence artificielle dédiée aux élèves du <strong>Baccalauréat marocain 2026</strong>, filières Sciences de la Vie et de la Terre (SVT) et Sciences Physiques-Chimiques (PC), programme francophone BIOF.</p>
      <p>Grâce à l'analyse statistique de <strong>20 années d'examens nationaux</strong> (2006–2025), Moalim prédit avec précision les chapitres et exercices les plus probables pour la session normale 2026, et propose un <strong>coaching personnalisé par IA</strong> pour maximiser ta note.</p>

      <h2>Pourquoi choisir Moalim pour le BAC 2026 ?</h2>
      <ul>
        <li><strong>Prédictions BAC 2026 basées sur 20 ans de données</strong> — 9 règles statistiques de rotation des sujets identifiées sur les sessions normale et rattrapage de 2006 à 2025</li>

        <li><strong>Tuteur IA conversationnel</strong> — répond en français, arabe et darija marocaine, explique chaque exercice étape par étape</li>
        <li><strong>Coaching personnalisé</strong> — diagnostic de niveau, identification des lacunes, plan de révision adapté aux dernières semaines avant le BAC</li>
        <li><strong>Examens blancs simulés</strong> — conditions réelles de l'examen national, correction immédiate par l'IA</li>

      <h2>Questions fréquentes (FAQ)</h2>
      <dl class="faq">
        <dt>Quels sont les sujets probables au BAC SVT 2026 au Maroc ?</dt>
        <dd>La Partie I (restitution) aura très probablement CMO — Consommation de la Matière Organique (85 % de probabilité), avec un exercice sur le muscle à l'effort ou les levures. La génétique tombera en Partie II, exercice 2, avec gènes indépendants ou codominance (règle d'alternance). La géologie (subduction ou collision) complétera le sujet.</dd>

        <dt>Quels exercices vont tomber au BAC Physique-Chimie 2026 ?</dt>
        <dd>Les exercices les plus probables sont : dosage acide-base (pH-métrie ou conductimétrie), dipôle RC ou RLC (loi des mailles), mouvement circulaire ou satellite (mécanique), et ondes ou radioactivité. L'analyse de 20 ans de sujets confirme ces tendances avec une précision supérieure à 80 %.</dd>

        <dt>Moalim est-il adapté au programme officiel marocain ?</dt>
        <dd>Oui, Moalim est 100 % aligné sur le Cadre Référentiel du Ministère de l'Éducation Nationale marocain (MEN). Tous les cours, exercices et corrections suivent le programme 2 BAC SVT et Sciences Physiques, filières française (BIOF) et arabisée.</dd>

        <dt>Combien coûte Moalim pour le BAC 2026 ?</dt>
        <dd>Le Pack BAC 2026 + Concours des grandes écoles est à 149 DH. Il inclut l'accès complet au tuteur IA, les 60 examens nationaux corrigés, le coaching personnalisé et la préparation aux concours (ENSA, ENCG, FMP, CPGE).</dd>

        <dt>Comment s'inscrire sur Moalim ?</dt>
        <dd>L'inscription se fait sur moalim.online/inscription. Tu renseignes ton prénom, nom, numéro WhatsApp et ville. L'équipe te contacte sur WhatsApp pour activer ton accès. Filière : 2 BAC Sciences Physiques-Chimiques (programme français).</dd>

        <dt>Moalim fonctionne-t-il en darija et en arabe ?</dt>
        <dd>Oui. Le tuteur IA répond en français, arabe classique et darija marocaine. Les élèves des filières BIOF (françaises) et arabisées peuvent tous utiliser la plateforme.</dd>

        <dt>Quand a lieu le BAC 2026 au Maroc ?</dt>
        <dd>L'examen national session normale est prévu début juin 2026. La session de rattrapage a lieu début juillet 2026. Les dates exactes sont publiées par le Ministère chaque année en mars–avril.</dd>

        <dt>Comment calculer sa moyenne au BAC marocain ?</dt>
        <dd>La moyenne finale du BAC marocain est : 30 % note de l'examen régional (contrôle continu de l'année) + 70 % note de l'examen national. Pour une mention Bien il faut ≥ 14/20, Très Bien ≥ 16/20.</dd>
      </dl>
