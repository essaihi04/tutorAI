<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img"><title>Propagation en une, deux ou trois dimensions</title><rect width="900" height="520" fill="#fff"/><text x="65" y="70" font-size="21" fill="#24473f" font-family="system-ui">Corde : 1D</text><path d="M55 190 L270 190" stroke="#187763" stroke-width="3" fill="none"/><text x="320" y="70" font-size="21" fill="#24473f" font-family="system-ui">Surface : 2D</text><circle cx="425" cy="190" r="35" fill="none" stroke="#366dc1" stroke-width="3"/><circle cx="425" cy="190" r="65" fill="none" stroke="#366dc1" stroke-width="3"/><circle cx="425" cy="190" r="95" fill="none" stroke="#366dc1" stroke-width="3"/><text x="620" y="70" font-size="21" fill="#24473f" font-family="system-ui">Air : 3D</text><circle cx="720" cy="190" r="90" fill="none" stroke="#366dc1" stroke-width="3"/><ellipse cx="720" cy="190" rx="90" ry="30" fill="none" stroke="#366dc1" stroke-width="2"/><ellipse cx="720" cy="190" rx="30" ry="90" fill="none" stroke="#366dc1" stroke-width="2"/><text x="90" y="340" font-size="21" fill="#24473f" font-family="system-ui">une ligne</text><text x="360" y="340" font-size="21" fill="#24473f" font-family="system-ui">un plan</text><text x="650" y="340" font-size="21" fill="#24473f" font-family="system-ui">un volume</text><text x="65" y="440" font-size="21" fill="#24473f" font-family="system-ui">La dimension décrit les directions de propagation accessibles.</text></svg>