<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img"><title>Mesurer la célérité entre deux photographies</title><rect width="900" height="520" fill="#fff"/><text x="60" y="70" font-size="21" fill="#24473f" font-family="system-ui">Même front à deux dates</text><text x="60" y="165" font-size="21" fill="#24473f" font-family="system-ui">t₁</text><text x="60" y="300" font-size="21" fill="#24473f" font-family="system-ui">t₂ > t₁</text><path d="M120 170 L800 170" stroke="#187763" stroke-width="3" fill="none"/><path d="M120 305 L800 305" stroke="#187763" stroke-width="3" fill="none"/><path d="M120 170 L220 170 Q250 70 280 170 L800 170 M120 305 L520 305 Q550 205 580 305 L800 305" fill="none" stroke="#366dc1" stroke-width="4"/><path d="M250 330 L550 330" stroke="#187763" stroke-width="3" fill="none"/><text x="355" y="370" font-size="21" fill="#24473f" font-family="system-ui">d = x₂ − x₁</text><text x="70" y="450" font-size="21" fill="#24473f" font-family="system-ui">Δt = t₂ − t₁   ·   v = d / Δt   ·   d en m ; Δt en s ; v en m/s</text></svg>