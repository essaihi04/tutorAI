<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Du message nerveux à la force : le muscle en trois idées</title><desc id="desc">Le message nerveux provoque la libération de calcium, qui autorise la liaison actine myosine. L’ATP permet le cycle des têtes de myosine. Les filières énergétiques régénèrent l’ATP. La fibre développe une force et libère de la chaleur.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#bdd4c8"/></marker></defs>

<g font-family="Segoe UI,Arial,sans-serif" fill="#ecf8f0">
<text x="52" y="55" font-size="16" fill="#76dece" letter-spacing="3">LE CROQUIS À SAVOIR EXPLIQUER</text><text x="52" y="100" font-size="32" font-weight="700">Le muscle : un signal, un mécanisme, de l’énergie</text>
<text x="75" y="177" font-size="23" font-weight="700">1 · Le signal autorise</text><text x="75" y="221" font-size="21">Message nerveux</text><path d="M215 234V258" stroke="#bdd4c8" stroke-width="3" marker-end="url(#a)"/><text x="75" y="292" font-size="21">Libération de Ca²⁺</text><text x="75" y="328" font-size="17">Les sites de l’actine sont exposés.</text>
<text x="460" y="177" font-size="23" font-weight="700">2 · Les têtes tirent</text><text x="460" y="221" font-size="21">Ponts actine–myosine</text><path d="M600 234V258" stroke="#bdd4c8" stroke-width="3" marker-end="url(#a)"/><text x="460" y="292" font-size="21">Glissement des filaments</text><text x="460" y="328" font-size="17">L’ATP permet de répéter le cycle.</text>
<text x="845" y="177" font-size="23" font-weight="700">3 · La fibre agit</text><text x="845" y="221" font-size="21">Force + chaleur</text><text x="845" y="275" font-size="18">Si la charge le permet :</text><text x="845" y="307" font-size="21">raccourcissement</text><text x="845" y="337" font-size="18">et mouvement.</text>
<g stroke="#bdd4c8" stroke-width="3" marker-end="url(#a)"><path d="M388 248H422"/><path d="M773 248H808"/></g>
<text x="75" y="436" font-size="22" font-weight="700">Ce qui bouge · Ce qui reste constant</text>
<g stroke="#38516e" stroke-width="5"><path d="M100 468V552 M365 468V552 M480 468V552 M715 468V552"/></g><g stroke="#df628c" stroke-width="8"><path d="M100 490H214 M365 490H251 M480 490H594 M715 490H601"/></g><g stroke="#478ce1" stroke-width="13"><path d="M167 525H297 M533 525H663"/></g>
<text x="230" y="581" text-anchor="middle" font-size="17">Repos</text><text x="588" y="581" text-anchor="middle" font-size="17">Stries Z rapprochées</text><path d="M390 516H445" stroke="#bdd4c8" stroke-width="3" marker-end="url(#a)"/>
<text x="845" y="436" font-size="22" font-weight="700">Pour recommencer</text><text x="845" y="477" font-size="18">ATP fixé → tête détachée</text><text x="845" y="515" font-size="18">ATP hydrolysé → tête réarmée</text><text x="845" y="555" font-size="17">Ca²⁺ recapté → relâchement</text><text x="845" y="584" font-size="15" fill="#bdd4c8">Le recaptage consomme aussi de l’ATP.</text>
<text x="75" y="667" font-size="20" fill="white">D’où vient l’ATP ? Phosphocréatine · Glycolyse · Respiration mitochondriale</text><text x="75" y="696" font-size="17" fill="#b9d2e5">Les filières se chevauchent. Le glucose ne tire pas directement sur les filaments.</text>
<text x="52" y="743" font-size="13" fill="#bdd4c8">Croquis simplifié sans échelle · Rose : actine ; bleu : myosine · Chaque filament conserve sa longueur.</text>
</g></svg>
