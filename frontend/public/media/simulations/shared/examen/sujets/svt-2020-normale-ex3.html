<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>National SVT 2020 normale : la BPCO et les fibres musculaires</title>
<!--
  Feuille d'examen (cours svt_ch2_role_muscle_strie_squelettique, diapositive ms_n2_enonce) : SVT 2020 normale,
  deuxième partie, exercice 1 (n° 3 à plat), questions 2 et 3 avec le document 2. Texte copié du scan
  backend/data/exams/svt/2020-normale/pages/sujet_p3.jpg (introduction de l'exercice, bas de page) et sujet_p4.jpg
  (texte du document 2, figures a et b, questions 2 et 3) ; figure a redessinée en SVG, figure b en tableau.
  Le document 1 et la question 1 ne sont pas joués dans le cours. Repères : titre-exo, contexte, intro, fig-doc2a,
  doc2b, tab-1, notes, q-2, q-3, donnee-*.
-->
<link rel="stylesheet" href="/media/simulations/shared/examen/feuille.css">
</head>
<body>
<div id="feuille"></div>
<script>
(function () {
  // Figure a : pourcentage des fibres musculaires (%), barres blanches = personne saine, hachurées = personne atteinte ;
  // fibres de type II : saine 30, atteinte 45 ; fibres de type I : saine 58, atteinte 30.
  const Y0 = 290, K = 3.8, Y = (p) => Y0 - p * K;
  const barre = (x, v, h) => `<rect x="${x}" y="${Y(v)}" width="44" height="${v * K}" fill="${h ? 'url(#hach)' : '#fff'}" stroke="#000" stroke-width="1.6"/>`;
  const grad = [10, 20, 30, 40, 50, 60].map((p) => `<line x1="70" y1="${Y(p)}" x2="78" y2="${Y(p)}" stroke="#000"/><text x="64" y="${Y(p) + 6}" text-anchor="end">${p}</text>`).join('');
  const figA = `<svg viewBox="0 0 440 400" role="img" aria-label="Figure a : pourcentage des fibres de type I et II, personne saine et personne atteinte" font-family="'Times New Roman',Tinos,'Liberation Serif',serif" font-size="18">
    <defs><pattern id="hach" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#fff"/><line x1="0" y1="0" x2="0" y2="5" stroke="#000" stroke-width="1.6"/></pattern></defs>
    <text x="30" y="22">Pourcentage des fibres</text><text x="80" y="44">musculaires (%)</text>
    <line x1="74" y1="${Y0}" x2="74" y2="56" stroke="#000" stroke-width="1.6"/><path d="M68 64 L74 52 L80 64" fill="none" stroke="#000" stroke-width="1.6"/>
    <line x1="74" y1="${Y0}" x2="410" y2="${Y0}" stroke="#000" stroke-width="1.6"/>${grad}
    ${barre(110, 30)}${barre(154, 45, true)}${barre(268, 58)}${barre(312, 30, true)}
    <text x="154" y="${Y0 + 26}" text-anchor="middle">Fibres de type II</text><text x="312" y="${Y0 + 26}" text-anchor="middle">Fibres de type I</text>
    <rect x="40" y="${Y0 + 46}" width="30" height="22" fill="#fff" stroke="#000"/><text x="84" y="${Y0 + 63}">Personne saine</text>
    <rect x="40" y="${Y0 + 78}" width="30" height="22" fill="url(#hach)" stroke="#000"/><text x="84" y="${Y0 + 95}">Personne atteinte</text>
  </svg>`;
  window.FEUILLE = {
    sujet: 'svt/2020-normale',
    exercice: 3,
    id: 'examen-svt-2020-normale-ex3',
    page: '4/7',
    entete: 'courte',
    bareme: 'inline',
    style_titre: 'encadre',
    titre: 'Exercice 1 (7 pts)',
    blocs: [
      { id: 'contexte', libelle: 'Introduction', texte:
        'Les personnes atteintes d’une maladie pulmonaire appelée BPCO (Bronchopneumopathie chronique obstructive) souffrent d’un dysfonctionnement grave de certaines fonctions physiologiques du corps. La détérioration de la fonction musculaire est considérée l’un des symptômes courant de cette maladie. Pour connaître les manifestations et les causes de la détérioration de la fonction des muscles squelettiques striés chez les patients BPCO, on présente les données suivantes :' },
      { id: 'intro', libelle: 'Le document 2', texte:
        'Afin de déterminer les causes de la faible activité musculaire chez les patients atteints de BPCO, on propose le document 2 qui présente les résultats d’une étude de la distribution des types de fibres musculaires chez une personne atteinte de BPCO et chez une personne saine (figure a) et certaines propriétés des fibres musculaires (figure b).' },
      { figure: 'doc2a', id: 'fig-doc2a', legende: 'Figure a', largeur: '50%', svg: figA },
      { id: 'doc2b', libelle: 'Figure b', texte:
        '**Figure b**\n\n' +
        '| Caractéristiques \\ Type de fibres | Fibres de Type I | Fibres de Type II |\n' +
        '| Taille | Petit | Gros |\n' +
        '| Résistance à la fatigue | +++ | + |\n' +
        '| Nombre de mitochondries | [+++]{#donnee-mito-1} | [+]{#donnee-mito-2} |\n' +
        '| Activité des enzymes oxydatives | +++ | + |\n' +
        '| Activité des enzymes glycolytiques | + | +++ |\n' +
        '| Activité de l’enzyme LDH | + | [+++]{#donnee-ldh-2} |\n\n' +
        'Le nombre de signes (+) indique l’importance du caractère.\n\n' +
        'L’enzyme LDH catalyse les réactions de la production de l’acide lactique' },
      { html: '<div class="clair"></div><p style="text-align:center"><em><strong>Document 2</strong></em></p>' },
      { question: '2', points: 1.75, texte: '**En exploitant** le document 2, **Comparez** la distribution les types de fibres musculaires entre la personne atteinte de BPCO et la personne saine et **déduisez**, en **justifiant** votre réponse, la voie métabolique dominante adoptée pour la production de l’énergie au niveau des muscles de la personne atteinte de BPCO.' },
      { question: '3', points: 1, texte: '**En vous basant** sur ce qui précède et vos connaissances, **expliquez** la faible activité musculaire chez la personne atteinte de BPCO.' },
    ],
  };
})();
</script>
<script src="/media/simulations/shared/examen/feuille.js"></script>
</body>
</html>
