<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>National SVT 2016 normale : manque d'exercice et fatigabilité</title>
<!--
  Feuille d'examen (cours svt_ch2_role_muscle_strie_squelettique, diapositive ms_x1_enonce) : SVT 2016 normale,
  deuxième partie, sujet 1, question 1 (documents 1 et 2). Texte copié de backend/data/exams/svt/2016-normale
  (extraction.json, le sujet tel qu'imprimé ; exam.json pour les points) ; modèles des figures : assets/document_1.png
  (tableau, redessiné en tableau) et assets/document_2.png (histogramme, redessiné en SVG). Pas de scan de page pour
  ce sujet. Repères : titre-exo, contexte, intro, tab-1, fig-doc2, remarque, q-1, donnee-*.
-->
<link rel="stylesheet" href="/media/simulations/shared/examen/feuille.css">
</head>
<body>
<div id="feuille"></div>
<script>
(function () {
  // Document 2 : quantité d'acide lactique (barres pointillées, mmol/L) et consommation du dioxygène (barres noires,
  // L/min), personne non entraînée (12 ; 2,5) puis personne entraînée (6 ; 5,5) ; valeurs écrites sur les barres.
  const H = 12.5, Y0 = 262;
  const barre = (x, v, noir) => `<rect x="${x}" y="${Y0 - v * H}" width="44" height="${v * H}" fill="${noir ? '#000' : 'url(#points)'}" stroke="#000" stroke-width="1.4"/>` +
    `<text x="${x + 22}" y="${Y0 - v * H - 7}" text-anchor="middle" font-weight="bold">${String(v).replace(',', '.')}</text>`;
  const doc2 = `<svg viewBox="0 0 500 340" role="img" aria-label="Document 2 : acide lactique et dioxygène, personne non entraînée et personne entraînée" font-family="'Times New Roman',Tinos,'Liberation Serif',serif" font-size="18">
    <defs><pattern id="points" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><circle cx="3" cy="3" r="1" fill="#000"/></pattern></defs>
    <rect x="1" y="1" width="498" height="338" fill="none" stroke="#000" stroke-width="1.2"/>
    <rect x="18" y="14" width="26" height="20" fill="url(#points)" stroke="#000"/><text x="54" y="30" font-weight="bold">Quantité d’acide lactique produit en mmol/L.</text>
    <rect x="18" y="44" width="26" height="20" fill="#000"/><text x="54" y="60" font-weight="bold">Consommation du dioxygène en L/min.</text>
    ${barre(52, 12)}${barre(104, 2.5, true)}${barre(316, 6)}${barre(368, 5.5, true)}
    <line x1="14" y1="${Y0}" x2="486" y2="${Y0}" stroke="#000" stroke-width="1.4"/>
    <text x="100" y="${Y0 + 24}" text-anchor="middle" font-weight="bold">Personne non</text><text x="100" y="${Y0 + 46}" text-anchor="middle" font-weight="bold">entraînée</text>
    <text x="364" y="${Y0 + 24}" text-anchor="middle" font-weight="bold">Personne</text><text x="364" y="${Y0 + 46}" text-anchor="middle" font-weight="bold">entraînée</text>
  </svg>`;
  window.FEUILLE = {
    sujet: 'svt/2016-normale',
    exercice: 2,
    id: 'examen-svt-2016-normale-ex2',
    entete: 'courte',
    bareme: 'gauche',
    style_titre: 'encadre',
    titre: 'Sujet 1 (5 pts)',
    blocs: [
      { id: 'contexte', libelle: 'Introduction', texte:
        'Afin d’étudier l’effet du manque d’exercices sportifs et du tabagisme (usage du tabac) sur les réactions responsables de la libération de l’énergie au niveau du muscle squelettique strié, on propose l’étude des données suivantes :' },
      { id: 'intro', libelle: 'Les documents 1 et 2', texte:
        '- Le manque d’exercices sportifs chez l’Homme augmente sa fatigabilité. Pour expliquer l’origine de cette fatigabilité, une comparaison de certaines caractéristiques des mitochondries a été effectuée chez deux personnes, l’une entraînée pour un exercice physique de puissance donnée et l’autre non entraînée. Le document 1 résume les résultats obtenus, alors que le document 2 donne les résultats de la comparaison de la production d’acide lactique et la consommation du dioxygène chez ces deux personnes.' },
      { id: 'doc1', libelle: 'Document 1', texte:
        '|   | **Personne entraînée** | **Personne non entraînée** |\n' +
        '| Volume total des mitochondries par rapport au volume de la cellule musculaire | [11%]{#donnee-mito-ent} | [5%]{#donnee-mito-non} |\n' +
        '| Activité des enzymes mitochondriales | importante | faible |\n\n' +
        '***Document 1***' },
      { figure: 'doc2', id: 'fig-doc2', legende: '***Document 2***', largeur: '62%', svg: doc2 },
      { id: 'remarque', libelle: 'Remarque', texte: 'Remarque : le phénomène de la fatigue musculaire est lié à la baisse des réserves d’ATP au niveau des fibres musculaires.' },
      { question: '1', points: 1, texte: 'En exploitant les données des documents 1 et 2, expliquez l’augmentation de la fatigabilité observée chez la personne non entraînée.' },
    ],
  };
})();
</script>
<script src="/media/simulations/shared/examen/feuille.js"></script>
</body>
</html>
