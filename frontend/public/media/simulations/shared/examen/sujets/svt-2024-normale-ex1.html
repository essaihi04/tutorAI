<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>National 2024 normale : associer (SVT)</title>
<!--
  Feuille d'examen (cours svt_ch3_notion_information_genetique, diapositive ig_x1e0_enonce) : la question IV de la
  première partie (restitution) du national SVT 2024, session normale, copiée du scan
  backend/data/exams/svt/2024-normale/pages/sujet_p1.jpg (bas de la page 1) : l'énoncé et les deux tableaux
  « Ensemble A » / « Ensemble B » (exam.json garde ces lignes à part, items_left / items_right, que la feuille
  générique n'affiche pas). Repères : titre-exo, q-iv, tab-a, tab-b, ligne-1 … ligne-4, ligne-a … ligne-e.
-->
<link rel="stylesheet" href="/media/simulations/shared/examen/feuille.css">
<style>
  .ens { display: flex; gap: 1.6em; align-items: flex-start; margin: .5em 0 .4em; }
  .ens table { border-collapse: collapse; }
  .ens td, .ens th { border: 1px solid #000; padding: .08em .5em; text-align: left; font-weight: 400; vertical-align: middle; }
  .ens th { background: #d9d9d9; text-align: center; font-weight: 700; }
  .ens .a { flex: 0 0 33%; } .ens .b { flex: 1 1 auto; }
  .ens table { width: 100%; }
</style>
</head>
<body>
<div id="feuille"></div>
<script>
(function () {
  const A = [['1', 'ADN polymérase.'], ['2', 'Centromère.'], ['3', 'Nucléosome.'], ['4', 'Ribosome.']];
  const B = [['a', 'Complexe formé par l’association Histones –ADN.'], ['b', 'Complexe moléculaire participant à la synthèse des protéines.'],
    ['c', 'Complexe protéique assurant la synthèse de l’ARNm.'], ['d', 'Structure reliant les deux chromatides du même chromosome.'],
    ['e', 'Enzyme qui intervient dans la réplication de l’ADN.']];
  const ligne = (id, n, s, rs) => `<tr id="ligne-${id}" data-repere="ligne-${id}" data-professor-point="ligne-${id}" data-professor-label="${n}. ${s}"><td${rs ? ' style="height:2.75em"' : ''}><b>${n}.</b> ${s}</td></tr>`;
  const tabA = `<table id="tab-a" data-repere="tab-a" data-professor-point="tab-a" data-professor-label="Ensemble A"><tr><th>Ensemble A</th></tr>` +
    A.map(([n, s]) => ligne(n, n, s, n === '4')).join('') + '</table>';
  const tabB = `<table id="tab-b" data-repere="tab-b" data-professor-point="tab-b" data-professor-label="Ensemble B"><tr><th>Ensemble B</th></tr>` +
    B.map(([l, s]) => ligne(l, l, s)).join('') + '</table>';
  window.FEUILLE = {
    sujet: 'svt/2024-normale', page: '1/6', id: 'examen-svt-2024-normale-iv', bareme: 'inline', style_titre: 'encadre',
    titre: 'Première partie : Restitution des connaissances (5 points)',
    blocs: [
      { question: 'IV', points: 1, texte: '**Recopier** les couples (1,...), (2,...), (3,...) et (4,...) et **adresser** à chaque numéro de l’ensemble A la lettre correspondante dans l’ensemble B.' },
      { html: `<div class="ens"><div class="a">${tabA}</div><div class="b">${tabB}</div></div>` },
      { html: '<div class="clair"></div>' },
    ],
  };
})();
</script>
<script src="/media/simulations/shared/examen/feuille.js"></script>
</body>
</html>
