<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>National 2017 rattrapage : la thymidine radioactive (SVT)</title>
<!--
  Feuille d'examen (cours svt_ch3_notion_information_genetique, diapositive ig_x3_enonce) : la question 1 de
  l'exercice 2 (3 points) du national SVT 2017, session de rattrapage, et son document 1 redessiné en SVG d'après
  backend/data/exams/svt/2017-rattrapage/assets/document_7.png (pas de page scannée pour ce sujet). Introduction
  et remarque copiées de extraction.json (le sujet tel qu'imprimé ; exam.json n'en garde qu'un résumé), ajoutées le
  21/11/2026 : l'énoncé est affiché et lu avant le document. La question 2 (documents 2 à 4, la maladie XPB) relève du chapitre 4 et n'est pas reprise ici.
  Repères : titre-exo, contexte, intro, remarque, fig-doc1, q-1 ; dans la figure : donnee-cycle1, donnee-cycle2, donnee-observation,
  donnee-legende, donnee-resultat1, donnee-resultat2.
-->
<link rel="stylesheet" href="/media/simulations/shared/examen/feuille.css">
<style>
  /* une donnée de la figure SVG surlignée par le tuteur : le fond d'une case se colore (le fond CSS ne vaut rien en SVG) */
  svg g.surligne > rect:first-child { fill: rgba(255, 221, 0, .55); }
  svg g.surligne { filter: drop-shadow(0 0 3px rgba(255, 200, 0, 1)) drop-shadow(0 0 7px rgba(255, 200, 0, .8)); }
</style>
</head>
<body>
<div id="feuille"></div>
<script>
(function () {
  const t = (x, y, s, o = '') => `<text x="${x}" y="${y}" ${o}>${s}</text>`;
  // une plantule de fève dans son bécher ; `radio` : thymidine radioactive (trèfle) ou non (cercles blancs)
  const trefle = (x, y) => `<g transform="translate(${x} ${y})"><circle r="5.5" fill="#fff" stroke="#000" stroke-width="1"/>` +
    [0, 120, 240].map((a) => `<path d="M0 0 L${(5 * Math.cos((a - 30) * Math.PI / 180)).toFixed(1)} ${(5 * Math.sin((a - 30) * Math.PI / 180)).toFixed(1)} A5 5 0 0 1 ${(5 * Math.cos((a + 30) * Math.PI / 180)).toFixed(1)} ${(5 * Math.sin((a + 30) * Math.PI / 180)).toFixed(1)} Z" fill="#000"/>`).join('') +
    '<circle r="1.4" fill="#fff"/></g>';
  const rond = (x, y) => `<circle cx="${x}" cy="${y}" r="5" fill="#fff" stroke="#000" stroke-width="1.1"/>`;
  const plantule = (cx, radio) => {
    const y0 = 200;
    const pts = [[-34, 22], [-14, 30], [8, 20], [28, 30], [-24, 44], [18, 46], [36, 14], [-38, 38]];
    return `<g>
      <path d="M${cx} ${y0 - 18} C${cx - 4} ${y0 - 50} ${cx + 6} ${y0 - 78} ${cx + 2} ${y0 - 98}" stroke="#000" stroke-width="2" fill="none"/>
      ${[[-28, -78], [24, -84], [-22, -58], [28, -64], [-12, -96], [14, -100]].map(([dx, dy], i) => `<ellipse cx="${cx + dx}" cy="${y0 + dy}" rx="15" ry="7" transform="rotate(${i % 2 ? -30 : 30} ${cx + dx} ${y0 + dy})" fill="#fff" stroke="#000" stroke-width="1.2"/>`).join('')}
      <ellipse cx="${cx}" cy="${y0 - 14}" rx="16" ry="10" fill="#fff" stroke="#000" stroke-width="1.4"/>
      <path d="M${cx - 50} ${y0} L${cx - 50} ${y0 + 58} Q${cx} ${y0 + 66} ${cx + 50} ${y0 + 58} L${cx + 50} ${y0}" fill="#fff" stroke="#000" stroke-width="1.6"/>
      <ellipse cx="${cx}" cy="${y0}" rx="50" ry="7" fill="#fff" stroke="#000" stroke-width="1.4"/>
      <path d="M${cx} ${y0 - 4} L${cx - 2} ${y0 + 50} M${cx} ${y0 + 12} L${cx - 14} ${y0 + 34} M${cx} ${y0 + 20} L${cx + 14} ${y0 + 40}" stroke="#000" stroke-width="1.6" fill="none"/>
      ${pts.map(([dx, dy]) => (radio ? trefle : rond)(cx + dx, y0 + dy)).join('')}
    </g>`;
  };
  // un chromosome métaphasique : deux chromatides accolées au centromère ; `m` = [gauche marquée, droite marquée]
  const chromosome = (x, y, ang, L, m) => {
    const ch = (dx, marq) => `<rect x="${dx - 5}" y="${-L / 2}" width="10" height="${L}" rx="5" fill="${marq ? 'url(#damier)' : '#fff'}" stroke="#000" stroke-width="1.2"/>`;
    return `<g transform="translate(${x} ${y}) rotate(${ang})">${ch(-5.5, m[0])}${ch(5.5, m[1])}</g>`;
  };
  const C1 = [[55, 372, -18, 50], [88, 364, 24, 46], [122, 374, -6, 54], [146, 394, 30, 40], [68, 416, 70, 42], [110, 422, -60, 40]];
  const svg = `<svg viewBox="0 0 520 492" role="img" aria-label="Document 1 : transfert d'une plantule de fève d'un milieu radioactif à un milieu non radioactif ; chromosomes métaphasiques après le premier et le deuxième cycle cellulaire" font-family="'Times New Roman',Tinos,'Liberation Serif',serif" font-size="15">
    <defs>
      <pattern id="damier" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><rect width="3" height="3" fill="#000"/><rect x="3" y="3" width="3" height="3" fill="#000"/></pattern>
      <marker id="pointe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#000"/></marker>
    </defs>
    <g id="donnee-cycle1" data-repere="donnee-cycle1" data-professor-point="donnee-cycle1" data-professor-label="1er transfert : milieu radioactif">
      <rect x="10" y="6" width="205" height="70" fill="#fff" stroke="#000" stroke-dasharray="2 2"/>
      ${t(112, 24, 'Transfert d’une plantule de', 'text-anchor="middle"')}${t(112, 41, 'fève d’un milieu normal à', 'text-anchor="middle"')}${t(112, 58, 'un milieu radioactif', 'text-anchor="middle"')}${t(112, 73, 'pendant un cycle cellulaire', 'text-anchor="middle"')}
    </g>
    <g id="donnee-cycle2" data-repere="donnee-cycle2" data-professor-point="donnee-cycle2" data-professor-label="2e transfert : milieu non radioactif">
      <rect x="250" y="6" width="190" height="56" fill="#fff" stroke="#000" stroke-dasharray="2 2"/>
      ${t(345, 24, 'Transfert de cette plantule', 'text-anchor="middle"')}${t(345, 41, 'à un milieu non radioactif', 'text-anchor="middle"')}${t(345, 57, 'pendant un cycle cellulaire', 'text-anchor="middle"')}
    </g>
    ${plantule(90, true)}${plantule(318, false)}
    <path d="M165 224 L232 224 L232 216 L250 228 L232 240 L232 232 L165 232 Z" fill="#fff" stroke="#000" stroke-width="1.2"/>
    <g id="donnee-legende" data-repere="donnee-legende" data-professor-point="donnee-legende" data-professor-label="la légende">
      ${trefle(392, 160)}${t(404, 165, 'Thymidine')}${t(404, 181, 'radioactive')}
      ${rond(392, 206)}${t(404, 211, 'Thymidine non')}${t(404, 227, 'radioactive')}
      <rect x="384" y="296" width="16" height="12" fill="url(#damier)" stroke="#000"/>${t(406, 307, 'radioactivité')}
    </g>
    <g id="donnee-observation" data-repere="donnee-observation" data-professor-point="donnee-observation" data-professor-label="l'observation">
      ${t(214, 290, 'Observation des chromosomes', 'text-anchor="middle"')}${t(214, 307, 'métaphasiques des cellules de la racine', 'text-anchor="middle"')}
    </g>
    <line x1="90" y1="272" x2="90" y2="330" stroke="#000" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#pointe)"/>
    <line x1="318" y1="272" x2="318" y2="330" stroke="#000" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#pointe)"/>
    <g id="donnee-resultat1" data-repere="donnee-resultat1" data-professor-point="donnee-resultat1" data-professor-label="premier cycle : les chromosomes métaphasiques">
      <rect x="22" y="334" width="150" height="112" fill="#fff" stroke="#000" stroke-width="1.2"/>
      ${C1.map(([x, y, a, L]) => chromosome(x, y, a, L, [true, true])).join('')}
      ${t(97, 466, 'Premier cycle cellulaire', 'text-anchor="middle"')}
    </g>
    <g id="donnee-resultat2" data-repere="donnee-resultat2" data-professor-point="donnee-resultat2" data-professor-label="deuxième cycle : les chromosomes métaphasiques">
      <rect x="250" y="334" width="150" height="112" fill="#fff" stroke="#000" stroke-width="1.2"/>
      ${C1.map(([x, y, a, L], i) => chromosome(x + 228, y, a, L, i % 2 ? [true, false] : [false, true])).join('')}
      ${t(325, 466, 'Deuxième cycle cellulaire', 'text-anchor="middle"')}
    </g>
    ${t(512, 486, 'Document 1', 'text-anchor="end" font-weight="700" font-style="italic" text-decoration="underline"')}
  </svg>`;
  window.FEUILLE = {
    sujet: 'svt/2017-rattrapage', id: 'examen-svt-2017-rattrapage-ex2', bareme: 'gauche', style_titre: 'encadre',
    titre: 'Exercice 2 (3 points)',
    blocs: [
      { id: 'contexte', libelle: 'Introduction', texte:
        'Pour étudier certains aspects de la transmission et d’expression de l’information génétique, on propose les données suivantes.' },
      { id: 'intro', libelle: 'Le document 1', texte:
        '- Au cours de chaque cycle cellulaire, la cellule subit un ensemble de phénomènes biologiques qui interviennent dans le maintien de l’information génétique lors de sa transmission d’une cellule à une autre. Pour mettre en évidence un de ces phénomènes ainsi que son importance, on propose l’expérience présentée par le document 1.' },
      { id: 'remarque', libelle: 'Remarque', texte: '*Remarque :* La thymidine (T) est utilisée dans la synthèse d’ADN.' },
      { figure: 'doc1', svg, legende: '', largeur: '80%' },
      { question: '1', points: 1.5, texte: 'Expliquez les résultats de l’expérience du document 1, en justifiant votre réponse à l’aide d’un schéma adéquat du phénomène biologique mis en évidence.' },
      { html: '<div class="clair"></div>' },
    ],
  };
})();
</script>
<script src="/media/simulations/shared/examen/feuille.js"></script>
</body>
</html>
