<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>National 2024 normale : une onde à la surface de l'eau</title>
<!--
  Exemple complet de feuille d'examen (cours phys_ch1_waves_exemple) : l'exercice 2 du national 2024, session normale,
  copié du scan backend/data/exams/physique/2024-normale/pages/sujet_p3.jpg (et le haut de sujet_p4.jpg), figure
  redessinée en SVG. Repères : titre-exo, contexte, q-1, q-2, fig-cuve, donnees-tableau, donnee-t1, donnee-r1,
  donnee-r2, q-2.1, q-2.2, q-3, donnee-relation, q-3.1, q-3.2. Usage : shared/examen/feuille.js.
-->
<link rel="stylesheet" href="/media/simulations/shared/examen/feuille.css">
</head>
<body>
<div id="feuille"></div>
<script>
(function () {
  const t = (x, y, s, o = '') => `<text x="${x}" y="${y}" ${o}>${s}</text>`;
  const fleche = (x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#000" stroke-width="1.6" marker-end="url(#pointe)"/>`;
  // Figure du sujet (page 3/6) : O sur le bord de la cuve, fronts d'onde demi-circulaires de rayons r1 = 14 cm et r2 = 56 cm
  // (r1 = r2 / 4), l'axe r(cm), les trois étiquettes encadrées et leurs flèches.
  const O = [190, 205], R2 = 124, R1 = R2 / 4;
  const arc = (r) => `M${O[0]} ${O[1] - r} A${r} ${r} 0 0 1 ${O[0]} ${O[1] + r}`;
  const pt = (r, deg) => [O[0] + r * Math.cos(deg * Math.PI / 180), O[1] - r * Math.sin(deg * Math.PI / 180)].map((v) => +v.toFixed(1));
  const [a1x, a1y] = pt(R1 + 3, 50), [a2x, a2y] = pt(R2 + 3, -38);
  const cuve = `<svg viewBox="0 0 480 400" role="img" aria-label="Aspect de la surface de l'eau aux instants t1 et t2" font-family="'Times New Roman',Tinos,'Liberation Serif',serif" font-size="21">
    <defs><marker id="pointe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#000"/></marker></defs>
    <line x1="${O[0]}" y1="${O[1] - R2}" x2="${O[0]}" y2="${O[1] + R2}" stroke="#000" stroke-width="1.6"/>
    <path d="${arc(R2)}" fill="none" stroke="#000" stroke-width="3.2"/>
    <path d="${arc(R1)}" fill="none" stroke="#000" stroke-width="3.2"/>
    <line x1="${O[0]}" y1="${O[1]}" x2="378" y2="${O[1] - 2}" stroke="#000" stroke-width="1.6" marker-end="url(#pointe)"/>
    <circle cx="${O[0]}" cy="${O[1]}" r="3.6"/>
    ${t(O[0] - 21, O[1] + 24, 'O')}
    ${t(O[0] + R1 + 2, O[1] - 7, 'r<tspan font-size="14" dy="5">1</tspan>')}
    ${t(O[0] + R2 + 3, O[1] - 7, 'r<tspan font-size="14" dy="5">2</tspan>')}
    ${t(352, O[1] - 14, 'r(cm)')}
    <rect x="30" y="102" width="112" height="56" fill="#fff" stroke="#000" stroke-width="1.3"/>${t(86, 137, 'Caillou', 'text-anchor="middle"')}
    ${fleche(122, 158, O[0] - 4, O[1] - 5)}
    <rect x="318" y="8" width="148" height="78" fill="#fff" stroke="#000" stroke-width="1.3"/>
    ${t(332, 40, 'L’aspect à')}${t(332, 72, 'l’instant  t<tspan font-size="14" dy="5">1</tspan>')}
    ${fleche(336, 60, a1x, a1y)}
    <rect x="328" y="306" width="140" height="82" fill="#fff" stroke="#000" stroke-width="1.3"/>
    ${t(344, 338, 'L’aspect à')}${t(344, 372, 'l’instant  t<tspan font-size="14" dy="5">2</tspan>')}
    ${fleche(334, 318, a2x, a2y)}
  </svg>`;

  window.FEUILLE = {
    sujet: 'physique/2024-normale',
    exercice: 2,
    id: 'examen-physique-2024-normale-ex2',
    page: '3/6',
    titre: 'EXERCICE 2 (2,5 points) : Propagation d’un signal à la surface de l’eau',
    blocs: [
      { id: 'contexte', libelle: 'Introduction', texte:
        'On se propose dans cet exercice d’étudier la propagation d’un signal mécanique à la surface de l’eau.\n' +
        'Un caillou jeté, en un point O, dans une cuve contenant de l’eau de profondeur h, provoque la formation d’une onde circulaire qui se propage à la surface de l’eau. (Figure ci-dessous)' },
      { question: '1', points: 0.5, texte: 'Choisir la proposition juste parmi les propositions suivantes :', choix: [
        ['A', 'Une onde progressive périodique est caractérisée par sa célérité.'],
        ['B', 'Un milieu est dispersif si la célérité de l’onde dépend de sa période T.'],
        ['C', 'Lors de la diffraction dans un même milieu, la célérité de l’onde est modifiée.'],
        ['D', 'Les ondes mécaniques progressives peuvent se propager dans le vide.'],
      ] },
      { question: '2', texte: 'La figure suivante donne l’aspect de la surface de l’eau à deux instants $\\mathrm{t_1}$ et $\\mathrm{t_2}$.' },
      { figure: 'cuve', id: 'fig-cuve', legende: '', place: 'droite', largeur: '40%', svg: cuve },
      { id: 'donnees-tableau', libelle: 'Tableau des rayons du front d’onde', texte:
        'Le tableau suivant donne les valeurs des rayons du front d’onde à des instants donnés :\n\n' +
        '| **t(s)** | 0 | [$\\mathrm{t_1}$]{#donnee-t1} | $\\mathrm{t_2 = t_1 + 1,5}$ |\n' +
        '| **r(cm)** | 0 | [$\\mathrm{r_1 = 14}$]{#donnee-r1} | [$\\mathrm{r_2 = 56}$]{#donnee-r2} |' },
      { question: '2-1', points: 0.5, texte: 'Déterminer la valeur de la célérité v de l’onde.' },
      { question: '2-2', points: 0.5, texte: 'En déduire la valeur de l’instant $\\mathrm{t_2}$.' },
      { question: '3', texte: 'On peut estimer la célérité v de l’onde qui se propage à la surface d’eau par la relation : ' +
        '[$\\mathrm{v = \\sqrt{g.h}}$ avec $\\mathrm{g = 9,8\\ m.s^{-2}}$]{#donnee-relation} étant l’intensité de la pesanteur et h la profondeur de l’eau.' },
      { question: '3-1', points: 0.5, texte: 'En utilisant les équations aux dimensions, vérifier l’homogénéité de cette relation.' },
      { question: '3-2', points: 0.5, texte: 'Calculer h.' },
      { html: '<div class="clair"></div>' },
    ],
  };
})();
</script>
<script src="/media/simulations/shared/examen/feuille.js"></script>
</body>
</html>
