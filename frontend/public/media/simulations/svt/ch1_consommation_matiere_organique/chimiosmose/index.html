<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Chimiosmose — au tableau</title>
  <link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css" />
  <style>
    #legende { max-width: 44%; }
    #legende .metriques { display: flex; flex-wrap: wrap; gap: .2em .9em; margin-top: .25em; color: var(--craie-faible); font-size: .85em; }
    #legende .warn { color: var(--rouge); }
    .barre .curseur { min-width: 11em; }
    @media (max-width: 720px) { #legende { max-width: 60%; } #legende .metriques { display: none; } .barre .curseur { min-width: 8em; } }
  </style>
</head>
<body>
<!-- Pont tuteur (shared/tableau/tableau.js, Tableau.protocole) : window.parent.postMessage de `simulation_manifest` au chargement et de `simulation_state` à chaque action ; commandes `simulation_control` : start, set_variant, set_parameters, reset, replay. -->
<div class="tableau">
  <header class="titre">
    <div><small>SVT · 2 BAC · membrane interne mitochondriale</small><h1>Chaîne respiratoire et chimiosmose</h1><p class="objectif" id="objectif"></p></div>
    <nav class="onglets" id="onglets" aria-label="Conditions"></nav>
  </header>
  <section class="scene">
    <canvas id="canvas" role="img" aria-label="Chaîne respiratoire et ATP synthase dans la membrane interne mitochondriale, dessinées à la craie"></canvas>
    <div class="panneau bas-gauche" id="legende" data-professor-point="legende" data-professor-label="interprétation"><h3 id="title"></h3><p id="text"></p><div class="metriques"><span id="electronMetric"></span><span id="atpMetric"></span><span id="conclusion"></span></div></div>
  </section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start replay">Lancer</button>
    <button class="craie-btn secondaire" id="reset" data-professor-control="reset">Réinitialiser</button>
    <span id="gradientBox"></span>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
    <span class="lecture" id="status">Prêt</span>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script>
(function () {
  'use strict';
  const { Craie, ecrire, bulle, onglets, curseur, protocole, explication } = window.Tableau;
  const $ = id => document.getElementById(id);
  const CONFIG = { id: 'svt_ch1_chimiosmose', variants: [{ id: 'avec_o2', label: 'Avec dioxygène' }, { id: 'sans_o2', label: 'Sans dioxygène' }], objectives: ['Relier chaîne respiratoire, gradient de protons, ATP synthase et rôle terminal du dioxygène.'], commands: ['start', 'set_variant', 'set_parameters', 'reset', 'replay'] };
  const S = { o2: true, gradient: 80, simulationStatus: 'idle', variantsCompleted: [], ouvert: performance.now(), anim: null, dirty: true };
  const variant = () => S.o2 ? 'avec_o2' : 'sans_o2';
  const pont = protocole({ id: CONFIG.id, commandes: CONFIG.commands, config: Object.assign(CONFIG, { controls: { oxygen_present: { type: 'boolean' }, gradient_percent: { type: 'range', min: 10, max: 100, unit: '%' } } }), executer,
    etat: () => ({ simulation_status: S.simulationStatus, current_variant: variant(), variants_completed: S.variantsCompleted, oxygen_present: S.o2, proton_gradient_percent: S.o2 ? S.gradient : 0, electron_flow: S.o2 ? 'actif' : 'bloqué', relative_atp_output_percent: S.o2 ? S.gradient : 0, scientific_interpretation: S.o2 ? 'O₂ accepte les électrons en fin de chaîne; le gradient de H⁺ alimente l’ATP synthase.' : 'Sans O₂, la chaîne se bloque et le gradient de H⁺ n’est plus entretenu.' }),
    progression: () => S.variantsCompleted.length / 2,
    texte: 'Chaîne respiratoire, gradient de protons et ATP synthase dessinés au tableau, avec ou sans dioxygène.' });
  const emit = () => pont.emettre();
  const redraw = () => { S.dirty = true; };
  const gradientCtl = curseur({ id: 'gradient', label: 'Gradient de H⁺', min: 10, max: 100, step: 10, valeur: 80, unite: '%', commande: 'set_parameters', onchange: v => setParameters({ gradient_percent: v }) });
  gradientCtl.dataset.professorPoint = 'gradient'; gradientCtl.dataset.professorLabel = 'réglage du gradient';
  $('gradientBox').replaceWith(gradientCtl);
  // Script d'explication : le tuteur dit chaque phrase pendant que le professeur montre le repère du doigt.
  explication({
    avec_o2: [{ repere: 'electrons', texte: 'Les électrons apportés par NADH,H⁺ et FADH₂ passent de complexe en complexe le long de la membrane interne.' }, { repere: 'complexe_i', texte: 'En les transférant, les complexes pompent des protons de la matrice vers l’espace intermembranaire.' }, { repere: 'protons', texte: 'Il se crée un gradient de H⁺ : concentration élevée dehors, faible dans la matrice.' }, { repere: 'atp_synthase', texte: 'Les protons redescendent par l’ATP synthase ; sa rotation phosphoryle l’ADP en ATP.' }, { repere: 'o2', texte: 'En bout de chaîne, le dioxygène accepte les électrons et forme de l’eau : c’est l’accepteur final.' }],
    sans_o2: [{ repere: 'o2', texte: 'Sans dioxygène, il n’y a plus d’accepteur final : les électrons ne peuvent plus sortir de la chaîne.' }, { repere: 'complexe_iv', texte: 'Les transporteurs restent réduits et la chaîne se bloque.' }, { repere: 'protons', texte: 'Le gradient de H⁺ n’est plus entretenu.' }, { repere: 'atp_synthase', texte: 'L’ATP synthase ne tourne presque plus : la production d’ATP s’effondre.' }, { repere: 'atp', texte: 'La cellule ne peut alors compter que sur la glycolyse et la fermentation.' }],
  });

  function render() {
    onglets($('onglets'), CONFIG.variants, variant(), id => setO2(id !== 'sans_o2'), new Set(S.variantsCompleted));
    gradientCtl.maj(S.gradient);
    ecrire($('title'), S.o2 ? 'Avec dioxygène' : 'Sans dioxygène');
    ecrire($('text'), S.o2 ? 'La chaîne transfère les électrons jusqu’à O₂. Le gradient de H⁺ entraîne l’ATP synthase et permet la phosphorylation de l’ADP.' : 'Sans O₂, le transfert final des électrons s’arrête. Les transporteurs restent réduits, le gradient n’est plus entretenu et la synthèse d’ATP chute.', { vitesse: 55 });
    $('electronMetric').textContent = 'Flux d’électrons : ' + (S.o2 ? 'actif' : 'bloqué');
    $('atpMetric').textContent = 'Production relative d’ATP : ' + (S.o2 ? S.gradient : 0) + ' %';
    $('conclusion').textContent = S.o2 ? 'O₂ = accepteur final' : 'Chaîne arrêtée sans O₂'; $('conclusion').classList.toggle('warn', !S.o2);
    $('status').textContent = { idle: 'Prêt', running: 'En cours', finished: 'Terminé' }[S.simulationStatus];
    redraw();
  }
  function setO2(value, report = true) { S.o2 = !!value; S.simulationStatus = 'idle'; S.anim = null; render(); if (report) { pont.noter('set_variant', { variant: variant() }); emit(); } }
  function setParameters(p, report = true) { if (typeof p.gradient_percent === 'number') S.gradient = Math.max(10, Math.min(100, p.gradient_percent)); if (typeof p.oxygen_present === 'boolean') S.o2 = p.oxygen_present; render(); if (report) { pont.noter('set_parameters', { oxygen_present: S.o2, gradient_percent: S.gradient }); emit(); } }
  function start() { S.simulationStatus = 'running'; S.anim = { t0: performance.now(), duree: 2600 }; render(); bulle($('feedback'), S.o2 ? 'Suis les électrons jusqu’à O₂ et les protons dans l’ATP synthase.' : 'Observe : sans accepteur final, les électrons s’arrêtent.'); pont.noter('start', { oxygen_present: S.o2, gradient_percent: S.gradient }); emit(); setTimeout(finish, 2600); }
  function finish() { if (S.simulationStatus !== 'running') return; S.simulationStatus = 'finished'; const v = variant(); if (!S.variantsCompleted.includes(v)) S.variantsCompleted.push(v); render(); bulle($('feedback'), S.o2 ? 'ADP + Pᵢ → ATP grâce au flux de H⁺ ; O₂ + 4 e⁻ + 4 H⁺ → 2 H₂O' : 'Chaîne bloquée : plus de gradient, presque plus d’ATP.', S.o2 ? 'good' : 'bad'); pont.noter('finish', { variant: v }); emit(); }
  function reset() { S.simulationStatus = 'idle'; S.gradient = 80; S.o2 = true; S.anim = null; S.ouvert = performance.now(); bulle($('feedback'), 'Conditions initiales.'); pont.noter('reset'); render(); emit(); }
  function executer(c, p) { if (c === 'start' || c === 'replay') start(); else if (c === 'reset') reset(); else if (c === 'set_variant') setO2((p.variant_id || p.variant) !== 'sans_o2'); else if (c === 'set_parameters') setParameters(p); }

  // ── Dessin à la craie (repère logique 850 × 420) ──────────────────────────
  const craie = new Craie($('canvas'), { onresize: redraw });
  const complexes = [[110, 'I'], [260, 'III'], [410, 'IV']];
  function draw() {
    const W = craie.W, H = craie.H; if (W < 1 || H < 1) return true;
    craie.debut(11, (performance.now() - S.ouvert) / 1000);
    const c = craie.ctx, s = Math.min(W / 850, H / 420); c.translate((W - 850 * s) / 2, (H - 420 * s) / 2); c.scale(s, s); craie.echelle = s; craie.tailleMin = 11;
    const running = S.simulationStatus === 'running' || S.simulationStatus === 'finished';
    const k = S.anim ? Math.min(1, (performance.now() - S.anim.t0) / S.anim.duree) : 0, now = performance.now() / 1000;
    const g = S.o2 ? S.gradient / 100 : 0;
    // Espace intermembranaire, membrane, matrice
    craie.texte('espace intermembranaire : [H⁺] élevée', 30, 40, { couleur: 'rose', taille: 17 });
    craie.rect(20, 175, 810, 84, { couleur: 'faible', arrondi: 26, fond: 'cyan', fondAlpha: .07, duree: .7 });
    for (let x = 40; x < 820; x += 22) { craie.cercle(x, 188, 5, { couleur: 'tresfaible', largeur: 1.2, duree: .01 }); craie.cercle(x, 246, 5, { couleur: 'tresfaible', largeur: 1.2, duree: .01 }); }
    craie.texte('membrane interne', 828, 168, { couleur: 'faible', taille: 14, align: 'right' });
    craie.texte('matrice mitochondriale', 28, 300, { couleur: 'cyan', taille: 16 });
    craie.repere('espace_intermembranaire', 24, 18, 560, 34, 'espace intermembranaire').repere('protons', 40, 55, 560, 80, 'protons H⁺ accumulés').repere('membrane', 18, 170, 814, 94, 'membrane interne').repere('matrice', 22, 280, 300, 36, 'matrice mitochondriale');
    craie.pause(.15);
    complexes.forEach(([x, nom]) => craie.rect(x, 150, 75, 122, { couleur: 'cyan', arrondi: 16, fond: 'cyan', duree: .35 }).texte(nom, x + 37, 218, { couleur: 'cyan', taille: 20, align: 'center' }).repere('complexe_' + nom.toLowerCase(), x - 4, 146, 83, 130, 'complexe ' + nom));
    craie.texte('chaîne respiratoire', 298, 135, { couleur: 'cyan', taille: 15, align: 'center' });
    // Électrons : chemin pointillé sous les complexes, de NADH vers O₂
    craie.texte('électrons : NADH,H⁺ / FADH₂  →  O₂', 95, 318, { couleur: 'jaune', taille: 15 });
    craie.ligne(95, 340, 515, 340, { couleur: 'jaune', largeur: 2, pointille: [8, 7], duree: .5 });
    craie.repere('electrons', 88, 300, 440, 56, 'trajet des électrons');
    // ATP synthase
    craie.trait([[625, 150], [640, 118], [665, 108], [690, 118], [705, 150], [695, 265], [665, 290], [635, 265]], { couleur: 'violet', largeur: 2.6, ferme: true });
    craie.cercle(665, 250, 30, { couleur: 'violet', fond: 'violet' });
    craie.texte('ATP synthase', 665, 322, { couleur: 'violet', taille: 17, align: 'center' });
    craie.repere('atp_synthase', 618, 100, 96, 232, 'ATP synthase').repere('o2', 494, 362, 236, 40, 'O₂, accepteur final').repere('atp', 720, 282, 82, 110, 'ATP produit');
    craie.texte('H⁺', 605, 95, { couleur: 'rose', taille: 16 });
    craie.pause(.2);
    craie.texte('ADP + Pᵢ', 730, 395, { couleur: 'faible', taille: 15 });
    craie.fleche(735, 385, 740, 372, { couleur: 'vert', largeur: 1.6 });
    // Parties animées
    craie.direct(() => {
      // Protons pompés dans l'espace intermembranaire (plus le gradient est fort, plus il y en a)
      const nb = Math.round(3 + 9 * (S.o2 ? S.gradient / 100 : .15));
      for (let i = 0; i < nb; i++) { const x = 60 + (i * 61) % 520, y = 70 + (i * 37) % 60 + (running && S.o2 ? 4 * Math.sin(now * 3 + i) : 0); craie.point(x, y, 6, 'rose'); craie.texte('+', x, y + 4, { couleur: 'blanc', taille: 11, align: 'center' }); }
      if (running) {
        // Électron qui parcourt la chaîne ; sans O₂ il s'arrête au complexe IV
        const ex = 115 + (S.o2 ? 400 : 330) * Math.min(1, (S.anim ? ((now - S.anim.t0 / 1000) % 2.2) / 2.2 : 0)), ey = 340;
        craie.point(ex, ey, 9, 'jaune'); craie.texte('e⁻', ex, ey + 5, { couleur: '#111', taille: 13, align: 'center', alpha: 1 });
        if (!S.o2) { craie.texte('✗ pas d’accepteur final', 525, 372, { couleur: 'rouge', taille: 15 }); }
        // Protons qui traversent l'ATP synthase (seulement avec O₂, débit selon le gradient)
        if (S.o2) for (let i = 0; i < 3; i++) { const ph = ((now * (0.6 + g) + i / 3) % 1); const py = 90 + 200 * ph, px = 652 + 26 * ((i * 7) % 3) / 2; craie.point(px, py, 6, 'rose'); }
        // Rotor
        const a = S.o2 ? now * (2 + 4 * g) : 0;
        craie.ligne(665 + 26 * Math.cos(a), 250 + 26 * Math.sin(a), 665 - 26 * Math.cos(a), 250 - 26 * Math.sin(a), { couleur: 'blanc', largeur: 4 });
        craie.ligne(665 + 26 * Math.cos(a + Math.PI / 2), 250 + 26 * Math.sin(a + Math.PI / 2), 665 - 26 * Math.cos(a + Math.PI / 2), 250 - 26 * Math.sin(a + Math.PI / 2), { couleur: 'blanc', largeur: 4 });
        // Eau formée et ATP produit
        if (S.o2 && k > .6) craie.texte('O₂ + 4 e⁻ + 4 H⁺ → 2 H₂O', 500, 390, { couleur: 'bleu', taille: 16 });
        const atpA = S.o2 ? .35 + .65 * g : .15, bounce = S.o2 ? 8 * Math.abs(Math.sin(now * 3)) : 0;
        craie.cercle(760, 350 - bounce, 32, { couleur: 'vert', fond: 'vert', alpha: atpA }).texte('ATP', 760, 358 - bounce, { couleur: 'vert', taille: 20, align: 'center', alpha: atpA });
        craie.texte(`${S.o2 ? S.gradient : 0} %`, 760, 300, { couleur: 'vert', taille: 15, align: 'center' });
      } else {
        craie.ligne(639, 250, 691, 250, { couleur: 'blanc', largeur: 4 }); craie.ligne(665, 224, 665, 276, { couleur: 'blanc', largeur: 4 });
        craie.cercle(760, 350, 32, { couleur: 'vert', fond: 'vert', alpha: .3 }).texte('ATP', 760, 358, { couleur: 'vert', taille: 20, align: 'center', alpha: .4 });
      }
    });
    const complet = craie.fin();
    return complet && !running;
  }
  function frame() { if (S.dirty || S.anim || S.simulationStatus !== 'idle') S.dirty = !draw(); requestAnimationFrame(frame); }
  $('run').onclick = start; $('reset').onclick = reset;
  $('onglets').addEventListener('click', e => { const b = e.target.closest('[data-variant]'); if (b) setO2(b.dataset.variant !== 'sans_o2'); });
  ecrire($('objectif'), 'Objectif : montrer que le transfert d’électrons crée un gradient de H⁺ utilisé par l’ATP synthase, et que O₂ est l’accepteur final.', { vitesse: 70 });
  render(); bulle($('feedback'), 'Choisis la condition, règle le gradient puis lance.'); requestAnimationFrame(frame);
})();
</script>
<script src="/media/simulations/professor-locate.js" defer></script>
</body>
</html>
