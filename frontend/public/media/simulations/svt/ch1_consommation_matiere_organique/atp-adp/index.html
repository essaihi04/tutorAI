<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Cycle ATP–ADP — au tableau</title>
  <link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css" />
  <style>
    #legende { max-width: 46%; }
    #legende .metriques { display: flex; flex-wrap: wrap; gap: .2em .9em; margin-top: .25em; color: var(--craie-faible); font-size: .85em; }
    #legende .metriques span { white-space: nowrap; }
    @media (max-width: 720px) { #legende { max-width: 62%; } #legende .metriques { display: none; } }
  </style>
</head>
<body>
<!-- Pont tuteur (shared/tableau/tableau.js, Tableau.protocole) : window.parent.postMessage de `simulation_manifest` au chargement et de `simulation_state` à chaque action ; commandes `simulation_control` : start, set_variant, reset, replay. -->
<div class="tableau">
  <header class="titre">
    <div><small>SVT · 2 BAC · consommation de la matière organique</small><h1 id="h1"></h1><p class="objectif" id="objectif"></p></div>
    <nav class="onglets" id="onglets" aria-label="Réactions"></nav>
  </header>
  <section class="scene">
    <canvas id="canvas" role="img" aria-label="Cycle ATP–ADP dessiné à la craie : hydrolyse, phosphorylation, couplage"></canvas>
    <div class="panneau bas-gauche" id="legende" data-professor-point="legende" data-professor-label="légende de la réaction"><h3 id="title"></h3><p id="interpretation"></p><div class="metriques"><span id="inputMetric"></span><span id="outputMetric"></span><span id="energyMetric"></span></div></div>
  </section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start replay">Observer</button>
    <button class="craie-btn secondaire" id="reset" data-professor-control="reset">Recommencer</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
    <span class="lecture" id="statusBadge">Prêt</span>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script>
(function () {
  'use strict';
  const { Craie, ecrire, bulle, onglets, protocole, explication } = window.Tableau;
  const $ = id => document.getElementById(id);
  const CONFIG = { id: 'svt_ch1_atp_adp', variants: [{ id: 'hydrolyse', label: 'Hydrolyse de l’ATP' }, { id: 'phosphorylation', label: 'Phosphorylation de l’ADP' }, { id: 'couplage', label: 'Couplage énergétique' }], objectives: ['Expliquer que l’ATP transfère temporairement l’énergie entre réactions libératrices et activités consommatrices.'], commands: ['start', 'set_variant', 'reset', 'replay'] };
  const content = {
    hydrolyse: { title: 'Hydrolyse de l’ATP', text: 'Le phosphate terminal est détaché. L’énergie transférée peut alimenter un travail cellulaire.', input: 'Entrée : ATP + H₂O', output: 'Sortie : ADP + Pᵢ', energy: 'Transfert d’énergie : vers le travail', equation: 'ATP + H₂O → ADP + Pᵢ + énergie' },
    phosphorylation: { title: 'Phosphorylation de l’ADP', text: 'Une réaction libératrice d’énergie permet de reformer l’ATP à partir d’ADP et de phosphate inorganique.', input: 'Entrée : ADP + Pᵢ', output: 'Sortie : ATP + H₂O', energy: 'Énergie fournie : respiration/fermentation', equation: 'ADP + Pᵢ + énergie → ATP + H₂O' },
    couplage: { title: 'Couplage énergétique', text: 'L’ATP n’est pas une réserve durable : il est continuellement consommé puis régénéré.', input: 'Matière organique → énergie', output: 'ATP → travail cellulaire', energy: 'Cycle rapide ATP ⇄ ADP', equation: 'respiration → ATP → travail, puis ADP + Pᵢ → ATP' },
  };
  const state = { variant: 'hydrolyse', simulationStatus: 'idle', variantsCompleted: [], ouvert: performance.now(), anim: null, dirty: true };
  // Script d'explication : le tuteur dit chaque phrase pendant que le professeur montre le repère du doigt.
  explication({
    hydrolyse: [{ repere: 'adenosine', texte: 'L’ATP est formé d’une adénosine et de trois groupements phosphate.' }, { repere: 'liaison_riche', texte: 'La liaison du phosphate terminal est une liaison riche en énergie.' }, { repere: 'phosphate_terminal', texte: 'L’hydrolyse détache ce phosphate : ATP + H₂O → ADP + Pᵢ, avec libération d’énergie.' }, { repere: 'travail', texte: 'Cette énergie est transférée à un travail cellulaire : contraction, transport actif, synthèses.' }],
    phosphorylation: [{ repere: 'phosphate_terminal', texte: 'On part d’ADP et d’un phosphate inorganique Pᵢ.' }, { repere: 'cycle', texte: 'Une réaction libératrice d’énergie, la respiration ou la fermentation, fournit l’énergie nécessaire.' }, { repere: 'phosphates', texte: 'Le phosphate se rattache à l’ADP : ADP + Pᵢ + énergie → ATP + H₂O.' }, { repere: 'bilan', texte: 'L’ATP est ainsi régénéré en permanence dans la cellule.' }],
    couplage: [{ repere: 'cycle', texte: 'L’ATP n’est pas une réserve durable : il est consommé puis reformé sans arrêt.' }, { repere: 'travail', texte: 'Son hydrolyse alimente le travail cellulaire…' }, { repere: 'phosphate_terminal', texte: '…puis l’ADP est rephosphorylé grâce à l’énergie tirée de la matière organique.' }, { repere: 'bilan', texte: 'C’est le couplage énergétique : l’ATP sert d’intermédiaire entre réactions libératrices et activités consommatrices.' }],
  });
  const pont = protocole({ id: CONFIG.id, commandes: CONFIG.commands, config: CONFIG, executer,
    etat: () => ({ simulation_status: state.simulationStatus, current_variant: state.variant, variants_completed: state.variantsCompleted, observation: content[state.variant].text, scientific_guardrail: 'L’ATP est un intermédiaire énergétique renouvelé, pas une réserve à long terme.' }),
    progression: () => state.variantsCompleted.length / CONFIG.variants.length,
    texte: 'Cycle ATP ADP dessiné au tableau : hydrolyse, phosphorylation et couplage énergétique.' });
  const emit = extra => pont.emettre(extra);
  const redraw = () => { state.dirty = true; };

  function setVariant(id, report = true) {
    if (!content[id]) return;
    state.variant = id; state.simulationStatus = 'idle'; state.anim = null;
    onglets($('onglets'), CONFIG.variants, id, v => setVariant(v), new Set(state.variantsCompleted));
    const c = content[id];
    ecrire($('h1'), c.title); ecrire($('title'), c.title); ecrire($('interpretation'), c.text, { vitesse: 50 });
    $('inputMetric').textContent = c.input; $('outputMetric').textContent = c.output; $('energyMetric').textContent = c.energy;
    $('statusBadge').textContent = 'Prêt'; bulle($('feedback'), 'Observe la réaction, puis explique-la au tuteur.');
    redraw();
    if (report) { pont.noter('set_variant', { variant: id }); emit(); }
  }
  function start() {
    state.simulationStatus = 'running'; $('statusBadge').textContent = 'Observation…';
    const duree = state.variant === 'couplage' ? 2600 : 1600;
    state.anim = { t0: performance.now(), duree };
    pont.noter('start', { variant: state.variant }); emit(); redraw();
    setTimeout(finish, duree + 100);
  }
  function finish() {
    if (state.simulationStatus !== 'running') return;
    state.simulationStatus = 'finished';
    if (!state.variantsCompleted.includes(state.variant)) state.variantsCompleted.push(state.variant);
    onglets($('onglets'), CONFIG.variants, state.variant, v => setVariant(v), new Set(state.variantsCompleted));
    $('statusBadge').textContent = 'Terminé'; bulle($('feedback'), content[state.variant].equation, 'good');
    pont.noter('finish', { variant: state.variant }); emit(); redraw();
  }
  function reset() { state.simulationStatus = 'idle'; state.anim = null; $('statusBadge').textContent = 'Prêt'; bulle($('feedback'), 'Nouvel essai.'); pont.noter('reset'); redraw(); emit(); }
  function executer(command, p) { if (command === 'set_variant') setVariant(p.variant_id || p.variant); else if (command === 'start' || command === 'replay') start(); else if (command === 'reset') reset(); }

  // ── Dessin à la craie (repère logique 820 × 400) ──────────────────────────
  const craie = new Craie($('canvas'), { onresize: redraw });
  const ease = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
  function draw() {
    const W = craie.W, H = craie.H; if (W < 1 || H < 1) return true;
    craie.debut(3, (performance.now() - state.ouvert) / 1000);
    const c = craie.ctx, s = Math.min(W / 820, H / 400); c.translate((W - 820 * s) / 2, (H - 400 * s) / 2); c.scale(s, s); craie.echelle = s; craie.tailleMin = 11;
    const v = state.variant, raw = state.anim ? Math.min(1, (performance.now() - state.anim.t0) / state.anim.duree) : 0;
    // Couplage : hydrolyse pendant la première moitié, régénération pendant la seconde.
    let detach = 0, join = 0, energie = 0, travail = 0;
    if (v === 'hydrolyse') { detach = ease(raw); energie = raw; travail = raw; }
    else if (v === 'phosphorylation') { join = ease(raw); energie = raw; detach = 1 - join; }
    else { const a = Math.min(1, raw * 2), b = Math.max(0, raw * 2 - 1); detach = ease(a) * (1 - ease(b)); energie = a; travail = a; join = b; }
    const fini = state.simulationStatus === 'finished';
    const piLoin = v === 'phosphorylation' ? 1 - join : detach; // 0 = lié, 1 = détaché
    // Molécule
    craie.texte(v === 'phosphorylation' && !fini ? 'ADP + Pᵢ' : fini && v === 'couplage' ? 'ATP régénéré' : fini && v === 'hydrolyse' ? 'ADP + Pᵢ' : 'ATP', 250, 50, { taille: 26, align: 'center' });
    craie.rect(60, 100, 150, 76, { couleur: 'bleu', arrondi: 18, fond: 'bleu' }).texte('Adénosine', 135, 146, { couleur: 'bleu', taille: 22, align: 'center' });
    craie.repere('adenosine', 55, 95, 160, 86, 'adénosine').repere('phosphates', 224, 102, 162, 72, 'phosphates liés').repere('liaison_riche', 376, 114, 44, 48, 'liaison riche en énergie');
    craie.ligne(210, 138, 226, 138, { couleur: 'jaune', largeur: 4 });
    craie.cercle(260, 138, 32, { couleur: 'cyan', fond: 'cyan' }).texte('P', 260, 147, { couleur: 'cyan', taille: 24, align: 'center' });
    craie.ligne(292, 138, 320, 138, { couleur: 'jaune', largeur: 4 });
    craie.cercle(352, 138, 32, { couleur: 'cyan', fond: 'cyan' }).texte('P', 352, 147, { couleur: 'cyan', taille: 24, align: 'center' });
    craie.texte('liaisons riches en énergie', 300, 200, { couleur: 'jaune', taille: 15, align: 'center' });
    craie.pause(.2);
    // Travail cellulaire (machine) et cycle
    craie.rect(625, 92, 125, 96, { couleur: 'vert', arrondi: 20, fond: 'vert' }).cercle(688, 140, 24, { couleur: 'vert', largeur: 3 });
    [[688, 105, 688, 118], [688, 162, 688, 175], [653, 140, 666, 140], [710, 140, 723, 140]].forEach(l => craie.ligne(...l, { couleur: 'vert', largeur: 3 }));
    craie.texte('travail cellulaire', 688, 221, { couleur: 'vert', taille: 17, align: 'center' });
    craie.texte('(contraction, transport, synthèses…)', 688, 243, { couleur: 'faible', taille: 13, align: 'center' });
    craie.repere('travail', 618, 86, 140, 165, 'travail cellulaire').repere('cycle', 248, 208, 334, 70, 'cycle ATP ⇄ ADP').repere('bilan', 232, 282, 476, 30, 'bilan');
    craie.courbe(u => [250 + (580 - 250) * u, 215 + 55 * Math.sin(Math.PI * u)], 40, { couleur: 'cyan', largeur: 2.2 });
    craie.fleche(268, 232, 252, 218, { couleur: 'cyan', largeur: 2.2 });
    craie.texte(v === 'phosphorylation' ? 'respiration / fermentation → énergie → ADP + Pᵢ → ATP' : 'l’ATP est rapidement renouvelé : ATP ⇄ ADP + Pᵢ', 470, 300, { couleur: 'cyan', taille: 17, align: 'center', max: 470 });
    // Parties animées : phosphate terminal, éclair d'énergie, machine qui travaille
    craie.direct(() => {
      const px = 445 + 55 * piLoin, py = 138 + 125 * piLoin;
      if (piLoin < .55) craie.ligne(384, 138, 413, 138, { couleur: 'jaune', largeur: 4, pointille: piLoin > .1 ? [8, 6] : null, alpha: 1 - piLoin });
      craie.cercle(px, py, 32, { couleur: 'orange', fond: 'orange', alpha: 1 - .5 * piLoin }).texte('P', px, py + 9, { couleur: 'orange', taille: 24, align: 'center' });
      craie.repere('phosphate_terminal', px - 36, py - 36, 72, 72, 'phosphate terminal (Pᵢ)');
      if (piLoin > .5) craie.texte('Pᵢ', px + 40, py + 8, { couleur: 'orange', taille: 18 });
      if (energie > 0 && energie < 1) {
        const k = energie, ex = v === 'phosphorylation' ? 560 - 120 * k : 480 + 150 * k, ey = v === 'phosphorylation' ? 300 - 150 * k : 120 + 20 * Math.sin(k * 6);
        craie.trait([[ex, ey - 30], [ex + 24, ey - 30], [ex + 10, ey - 6], [ex + 30, ey - 6], [ex - 4, ey + 40], [ex + 8, ey + 6], [ex - 10, ey + 6]], { couleur: 'jaune', largeur: 2.6, ferme: true, alpha: .95 });
        craie.texte('énergie', ex + 40, ey + 10, { couleur: 'jaune', taille: 16 });
      }
      if (travail > 0 && travail < 1) { const a = Math.sin(travail * Math.PI * 4); craie.ligne(688 + 18 * Math.cos(a), 140 + 18 * Math.sin(a), 688 - 18 * Math.cos(a), 140 - 18 * Math.sin(a), { couleur: 'vert', largeur: 3 }); }
      else craie.ligne(670, 140, 706, 140, { couleur: 'vert', largeur: 3 });
    });
    const complet = craie.fin(); return complet && (!state.anim || raw >= 1);
  }
  function frame() { if (state.dirty || state.anim) state.dirty = !draw(); requestAnimationFrame(frame); }
  $('run').onclick = start; $('reset').onclick = reset;
  $('onglets').addEventListener('click', e => { const b = e.target.closest('[data-variant]'); if (b) setVariant(b.dataset.variant); });
  setVariant('hydrolyse', false); ecrire($('objectif'), 'Objectif : relier l’hydrolyse de l’ATP au travail cellulaire et sa phosphorylation à une réaction libératrice d’énergie.', { vitesse: 70 });
  requestAnimationFrame(frame);
})();
</script>
<script src="/media/simulations/professor-locate.js" defer></script>
</body>
</html>
