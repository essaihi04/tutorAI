<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Filières énergétiques de l'effort — au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css">
<style>
  .pose { position: absolute; transform: translate(-50%, -50%); font-size: .95em; }
  .pose[aria-pressed="true"] { color: var(--jaune); background: rgba(250, 204, 21, .12); }
  .pathway[aria-pressed="true"] { color: var(--vert); background: rgba(74, 222, 128, .12); }
</style>
</head>
<body>
<div class="tableau">
  <header class="titre"><div><small>SVT · 2 BAC · exercice</small><h1 id="title"></h1><p class="objectif">Clique sur un effort, puis sur la filière qui fournit surtout l’ATP.</p></div></header>
  <section class="scene">
    <canvas id="canvas" role="img" aria-label="Axe des durées d’effort et trois filières énergétiques, à la craie"></canvas>
    <div class="calque">
      <button class="craie-btn pose scenario" data-id="sprint" aria-pressed="false">Sprint 60 m · ≈ 7 s</button>
      <button class="craie-btn pose scenario" data-id="tour" aria-pressed="false">Tour de piste · ≈ 50 s</button>
      <button class="craie-btn pose scenario" data-id="marathon" aria-pressed="false">Marathon · ≈ 3 h</button>
      <button class="craie-btn pose pathway" data-id="pcr" aria-pressed="false">⚡ ATP–phosphocréatine</button>
      <button class="craie-btn pose pathway" data-id="lactique" aria-pressed="false">🔥 Fermentation lactique</button>
      <button class="craie-btn pose pathway" data-id="respiration" aria-pressed="false">O₂ Respiration</button>
    </div>
  </section>
  <footer class="barre">
    <button class="craie-btn attention" id="check" data-professor-control="check">Vérifier</button>
    <button class="craie-btn secondaire" id="reset" data-professor-control="reset">Recommencer</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script>
  const { Craie, ecrire, bulle, appuyer } = window.Tableau;
  window.SIMULATION_CONFIG={id:'filieres_effort_svt',variants:[{id:'exercise',label:'Filières selon l’effort'}],commands:['start','reset','check','set_variant']};
  const expected={sprint:'pcr',tour:'lactique',marathon:'respiration'},positions={sprint:.06,tour:.3,marathon:.9};let scenario=null,pathway=null,actions=[],verdict=null,verdictAt=null;
  const $=id=>document.getElementById(id),S={ouvert:performance.now(),dirty:true};const scene=()=>(performance.now()-S.ouvert)/1000;
  ecrire($('title'),'Choisis l’effort puis sa filière dominante');
  document.querySelectorAll('.scenario').forEach(b=>b.onclick=()=>{document.querySelectorAll('.scenario').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');scenario=b.dataset.id;actions.push('scenario_'+scenario);verdict=null;S.dirty=true});
  document.querySelectorAll('.pathway').forEach(b=>b.onclick=()=>{document.querySelectorAll('.pathway').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');pathway=b.dataset.id;actions.push('pathway_'+pathway);verdict=null;S.dirty=true});
  function submit(){const correct=!!(scenario&&pathway&&expected[scenario]===pathway);verdict=correct;verdictAt=scene();S.dirty=true;bulle($('feedback'),correct?'✓ Association correcte':'↺ Relie surtout la durée à la vitesse de production d’ATP',correct?'good':'bad');actions.push(correct?'correct':'incorrect');window.parent.postMessage({type:'simulation_state',simulation_id:'filieres_effort_svt',student_actions:actions,current_state:{simulation_status:'finished',correct,scenario,pathway,expected:scenario?expected[scenario]:null,skill:'choisir_filiere_energetique'},objective_progress:correct?1:0.3,timestamp:Date.now()},'*')}
  function reset(){scenario=null;pathway=null;verdict=null;actions.push('reset');document.querySelectorAll('.pose').forEach(b=>b.setAttribute('aria-pressed','false'));bulle($('feedback'),'');S.ouvert=performance.now();S.dirty=true}
  window.runVariant=reset;window.executeAICommand=(command)=>{appuyer(command);if(command==='reset'||command==='start'||command==='set_variant')reset();else if(command==='check')submit()};$('check').onclick=submit;$('reset').onclick=reset;
  addEventListener('message',e=>{const d=e.data;if(d?.type==='simulation_control'&&(!d.simulation_id||d.simulation_id==='filieres_effort_svt'))window.executeAICommand(d.command,d.parameters||{})});
  window.__SIMULATION_MANIFEST_SENT__=true;parent.postMessage({type:'simulation_manifest',simulation_id:'filieres_effort_svt',capabilities:{commands:SIMULATION_CONFIG.commands,config:SIMULATION_CONFIG,globals:['executeAICommand','runVariant']},page_text:'Exercice au tableau : relier la durée d’un effort (sprint, tour de piste, marathon) à la filière dominante de régénération de l’ATP.'},'*');

  // ── Tableau : axe des durées, trois zones, les boutons posés sur le dessin ──
  const canvas=$('canvas'),craie=new Craie(canvas,{onresize:()=>{S.dirty=true}});const geom={s:1,ox:0,oy:0};
  const place=(sel,x,y)=>{const b=document.querySelector(sel);b.style.left=(geom.ox+x*geom.s)+'px';b.style.top=(geom.oy+y*geom.s)+'px'};
  function draw(){const W=craie.W,H=craie.H;if(W<1||H<1)return true;craie.debut(9,scene());const c=craie.ctx,s=Math.min(W/760,H/380);geom.s=s;geom.ox=(W-760*s)/2;geom.oy=(H-380*s)/2;c.translate(geom.ox,geom.oy);c.scale(s,s);
    const x0=70,x1=700,y=190;const X=f=>x0+(x1-x0)*f;
    craie.texte('durée de l’effort →',385,120,{couleur:'faible',taille:15,align:'center'});
    [[0,.13,'jaune','ATP–PCr','≈ 10 s'],[.13,.42,'orange','glycolyse lactique','10 s – 2 min'],[.42,1,'vert','respiration','> 2 min']].forEach(([a,b,col,l,d])=>{craie.ligne(X(a),y,X(b),y,{couleur:col,largeur:7,alpha:.7});craie.texte(l,(X(a)+X(b))/2,y+40,{couleur:col,taille:15,align:'center'});craie.texte(d,(X(a)+X(b))/2,y+60,{couleur:'faible',taille:12,align:'center'})});
    craie.axe(x0,y,x1+30,y,[],{});[['7 s',.06],['50 s',.3],['3 h',.9]].forEach(([l,f])=>{craie.ligne(X(f),y-8,X(f),y+8,{largeur:1.6});craie.texte(l,X(f),y+22,{couleur:'faible',taille:12,align:'center'})});
    craie.direct(()=>{if(scenario){const x=X(positions[scenario]);craie.ligne(x,y-40,x,y+12,{couleur:'jaune',largeur:3,tremble:0});craie.texte('▼',x,y-44,{couleur:'jaune',taille:16,align:'center'})}});
    place('[data-id=sprint]',130,80);place('[data-id=tour]',385,80);place('[data-id=marathon]',640,80);place('[data-id=pcr]',130,300);place('[data-id=lactique]',385,300);place('[data-id=respiration]',640,300);
    if(verdict!=null){craie.depuis(verdictAt);const col=verdict?'vert':'rouge';if(scenario&&pathway){const xs={pcr:130,lactique:385,respiration:640}[pathway],xe={sprint:130,tour:385,marathon:640}[scenario];craie.trait([[xe,100],[X(positions[scenario]),y-12]],{couleur:col,largeur:2}).trait([[X(positions[scenario]),y+12],[xs,282]],{couleur:col,largeur:2})}
      craie.texte(verdict?'✓':'✗',385,370,{couleur:col,taille:26,align:'center'})}
    return craie.fin()}
  function frame(){if(S.dirty)S.dirty=!draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script>
<script src="/media/simulations/professor-locate.js" defer></script>
</body>
</html>
