<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reconnaître les myogrammes — au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css">
<style>
  #labels { position: absolute; left: 50%; bottom: .4em; transform: translateX(-50%); display: flex; gap: 1.6em; }
  #labels .craie-champ { white-space: nowrap; }
  #labels .craie-champ select { width: 9em; text-align: left; }
  @media (max-width: 720px) { #labels { gap: .6em; flex-wrap: wrap; justify-content: center; width: 96%; } }
</style>
</head>
<body>
<div class="tableau">
  <header class="titre"><div><small>SVT · 2 BAC · exercice</small><h1 id="title"></h1><p class="objectif">Tension relative en fonction du temps. Les traits jaunes indiquent les stimulations ; courbes schématiques.</p></div></header>
  <section class="scene">
    <canvas id="canvas" role="img" aria-label="Trois myogrammes schématiques A, B et C, dessinés à la craie"></canvas>
    <div id="labels"></div>
  </section>
  <footer class="barre">
    <button class="craie-btn attention" id="check" data-professor-control="check">Vérifier</button>
    <button class="craie-btn secondaire" id="reset" data-professor-control="reset">Recommencer</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script>
  const { Craie, ecrire, bulle, appuyer } = window.Tableau;
  window.SIMULATION_CONFIG={id:'myogrammes_svt',variants:[{id:'exercise',label:'Reconnaissance de myogrammes'}],commands:['start','reset','check','set_variant']};
  const names=[['secousse','Secousse'],['sommation','Sommation'],['tetanos','Tétanos complet']];const expected={A:'secousse',B:'sommation',C:'tetanos'};let selected={A:null,B:null,C:null},actions=[],verdict=null,verdictAt=null;
  const $=id=>document.getElementById(id),S={ouvert:performance.now(),dirty:true};const scene=()=>(performance.now()-S.ouvert)/1000;
  ecrire($('title'),'Identifie les trois myogrammes');
  function render(){const root=$('labels');root.innerHTML='';['A','B','C'].forEach(key=>{const label=document.createElement('label');label.className='craie-champ';label.append('Tracé '+key+' : ');const select=document.createElement('select');select.setAttribute('aria-label','Réponse pour le tracé '+key);select.innerHTML='<option value="">choisir…</option>';names.forEach(([id,text])=>{const o=document.createElement('option');o.value=id;o.textContent=text;select.appendChild(o)});select.value=selected[key]||'';select.onchange=()=>{selected[key]=select.value||null;actions.push('choose_'+key+'_'+select.value);verdict=null;S.dirty=true};label.appendChild(select);root.appendChild(label)})}
  function submit(){const correct=Object.keys(expected).every(key=>selected[key]===expected[key]);verdict=correct;verdictAt=scene();S.dirty=true;bulle($('feedback'),correct?'✓ Les trois tracés sont reconnus':'↺ Compare durée, amplitude et fusion des secousses',correct?'good':'bad');actions.push(correct?'correct':'incorrect');window.parent.postMessage({type:'simulation_state',simulation_id:'myogrammes_svt',student_actions:actions,current_state:{simulation_status:correct?'finished':'running',correct,answers:selected,skill:'analyser_myogrammes'},objective_progress:correct?1:0.3,timestamp:Date.now()},'*')}
  function reset(){selected={A:null,B:null,C:null};verdict=null;actions.push('reset');bulle($('feedback'),'');render();S.ouvert=performance.now();S.dirty=true}
  window.runVariant=reset;window.executeAICommand=(command)=>{appuyer(command);if(command==='reset'||command==='start'||command==='set_variant')reset();else if(command==='check')submit()};$('check').onclick=submit;$('reset').onclick=reset;render();
  addEventListener('message',e=>{const d=e.data;if(d?.type==='simulation_control'&&(!d.simulation_id||d.simulation_id==='myogrammes_svt'))window.executeAICommand(d.command,d.parameters||{})});
  window.__SIMULATION_MANIFEST_SENT__=true;parent.postMessage({type:'simulation_manifest',simulation_id:'myogrammes_svt',capabilities:{commands:SIMULATION_CONFIG.commands,config:SIMULATION_CONFIG,globals:['executeAICommand','runVariant']},page_text:'Exercice au tableau : reconnaître secousse, sommation et tétanos sur trois myogrammes.'},'*');

  const canvas=$('canvas'),craie=new Craie(canvas,{onresize:()=>{S.dirty=true}});
  const twitch=(t,c,w)=>{const x=(t-c)/w;return x>0?x*Math.exp(1-x):0};
  function trace(x0,titre,fn,stims){const y0=230,y1=70,w=215;
    craie.texte(titre,x0+8,52,{couleur:'jaune',taille:20});
    craie.axe(x0,y0,x0+w+8,y0,[],{}).axe(x0,y0,x0,y1-8,[],{}).texte('tension',x0+6,y1-12,{couleur:'faible',taille:12}).texte('temps',x0+w,y0+20,{couleur:'faible',taille:12,align:'right'});
    stims.forEach(f=>craie.ligne(x0+8+f*(w-16),y0+2,x0+8+f*(w-16),y0+12,{couleur:'jaune',largeur:2,duree:.05}));
    craie.courbe(u=>[x0+8+u*(w-16),y0-Math.min(1,fn(u))*140],90,{couleur:'violet',largeur:3});
  }
  function draw(){const W=craie.W,H=craie.H;if(W<1||H<1)return true;craie.debut(6,scene());const c=craie.ctx,s=Math.min(W/760,H/380);c.translate((W-760*s)/2,(H-380*s)/2);c.scale(s,s);
    trace(30,'A',u=>.55*twitch(u,.2,.09),[.2]);
    const sB=[.06,.3,.54];trace(275,'B',u=>sB.reduce((a,cc,i)=>a+(.35+i*.08)*twitch(u,cc,.11),0),sB);
    const sC=Array.from({length:16},(_,i)=>.06+i*.05);trace(520,'C',u=>Math.min(1,sC.reduce((a,cc)=>a+.28*twitch(u,cc,.1),0)),sC);
    if(verdict!=null){craie.depuis(verdictAt);craie.texte(verdict?'A : une secousse · B : sommation · C : tétanos complet':'Compare la durée, l’amplitude et la fusion des secousses',380,275,{couleur:verdict?'vert':'rouge',taille:16,align:'center',max:700})}
    return craie.fin()}
  function frame(){if(S.dirty)S.dirty=!draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script>
<script src="/media/simulations/professor-locate.js" defer></script>
</body>
</html>
