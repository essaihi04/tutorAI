<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Glycolyse — au tableau</title>
  <link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css" />
  <style>
    #etape { max-width: 40%; }
    #etape .flux { display: flex; flex-wrap: wrap; gap: .1em .6em; margin-top: .2em; font-size: .85em; }
    #etape .flux .entree { color: var(--cyan); } #etape .flux .sortie { color: var(--jaune); }
    @media (max-width: 720px) { #etape { max-width: 58%; } #etape .flux { display: none; } }
  </style>
</head>
<body>
<div class="tableau">
  <header class="titre">
    <div><small>SVT · 2 BAC · voyage du glucose dans le cytoplasme</small><h1>La glycolyse</h1><p class="objectif" id="objectif"></p></div>
    <span class="lecture" id="progression"></span>
  </header>
  <section class="scene">
    <canvas id="canvas" role="img" aria-label="Glycolyse dessinée à la craie : glucose à six carbones coupé en deux pyruvates dans le cytoplasme, près de la mitochondrie"></canvas>
    <div class="panneau haut-droite" id="etape" data-professor-point="etape" data-professor-label="étape en cours"><h3 id="stageTitle"></h3><p id="hint"></p><div class="flux"><span class="entree">entrée : <b id="inputValue"></b></span><span class="sortie">sortie : <b id="outputValue"></b></span></div></div>
  </section>
  <footer class="barre">
    <button class="craie-btn principal" id="startBtn" data-professor-control="start replay pause">Démarrer</button>
    <button class="craie-btn secondaire" id="nextBtn" data-professor-control="next step">Étape suivante</button>
    <button class="craie-btn secondaire" id="resetBtn" data-professor-control="reset set_variant">Recommencer</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
    <span class="legende">● carbone &nbsp; ● phosphate &nbsp; ● NADH,H⁺</span>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script>
(function () {
  'use strict';
  const { Craie, ecrire, bulle } = window.Tableau;
  const $ = id => document.getElementById(id);
  const EXPLICATION = [{ repere: 'cytoplasme', texte: 'La glycolyse se déroule dans le cytoplasme, en dehors de la mitochondrie.' }, { repere: 'glucose', texte: 'Le glucose est une molécule à six atomes de carbone.' }, { repere: 'atp_consommes', texte: 'La cellule investit d’abord deux ATP pour activer le glucose.' }, { repere: 'coupure', texte: 'La chaîne C₆ est coupée en deux chaînes à trois carbones.' }, { repere: 'entrees', texte: 'NAD⁺, ADP et Pᵢ entrent dans la phase de récupération.' }, { repere: 'atp_produits', texte: 'Quatre ATP et deux NADH,H⁺ sont formés : le bilan net est de deux ATP par glucose.' }, { repere: 'pyruvates', texte: 'Les deux pyruvates entreront ensuite dans la mitochondrie si le dioxygène est présent.' }];
  window.Tableau.explication(EXPLICATION);
  const SIMULATION_CONFIG = { id: 'glycolyse_glucose_cytoplasme', commands: ['start', 'next', 'pause', 'reset', 'set_variant', 'highlight'], variants: [{ id: 'glycolyse', label: 'Glycolyse complète', params: {} }], objectives: ['Suivre les six carbones du glucose', 'Relier ATP consommés, ATP produits et NADH,H⁺', 'Établir le bilan net de la glycolyse'] };
  const labels = [['1 · Glucose dans le cytoplasme', 'La glycolyse commence dans le cytoplasme de la cellule.'], ['2 · Activation', 'Deux ATP entrent ; deux ADP sortent après le transfert des phosphates.'], ['3 · Coupure C₆ → 2 × C₃', 'Une chaîne à six carbones donne deux chaînes à trois carbones.'], ['4 · Formation des pyruvates', 'NAD⁺, ADP et Pi entrent ; deux pyruvates, NADH,H⁺ et ATP sont formés.'], ['5 · Près de la mitochondrie', 'Les deux pyruvates restent représentés dans le cytoplasme, à côté de la mitochondrie.']];
  const flows = [['Glucose (C₆)', 'Glycolyse dans le cytoplasme'], ['Glucose + 2 ATP', 'Molécule activée + 2 ADP'], ['Molécule C₆ activée', '2 molécules C₃'], ['2 C₃ + 2 NAD⁺ + 4 ADP + 4 Pi', '2 pyruvates + 2 NADH,H⁺ + 4 ATP'], ['2 pyruvates dans le cytoplasme', 'À proximité de la mitochondrie']];
  const state = { step: 0, running: false, status: 'idle', actions: [], current_state: {}, ouvert: performance.now(), marques: [0, null, null, null, null], tween: { from: 0, to: 0, t0: 0 }, dirty: true };
  let timer = null;
  function publish(action) {
    state.actions.push(action);
    state.current_state = { step: state.step + 1, stage: labels[state.step][0], reaction_input: flows[state.step][0], reaction_output: flows[state.step][1], atp_consumed: state.step >= 1 ? 2 : 0, atp_produced: state.step >= 3 ? 4 : 0, atp_net: state.step >= 3 ? 2 : state.step >= 1 ? -2 : 0, nadh_h_plus: state.step >= 3 ? 2 : 0, pyruvate_count: state.step >= 3 ? 2 : 0, carbon_balance: 'C6 = 2 × C3', location: state.step >= 4 ? 'cytoplasme, à proximité de la mitochondrie' : 'cytoplasme de la cellule', simulation_status: state.status, current_variant: 'glycolyse', variants_completed: state.status === 'finished' ? ['glycolyse'] : [] };
    window.parent.postMessage({ type: 'simulation_state', simulation_id: SIMULATION_CONFIG.id, student_actions: state.actions, current_state: state.current_state, objective_progress: state.step / 4, timestamp: Date.now() }, '*');
  }
  function render() {
    ecrire($('stageTitle'), labels[state.step][0]); ecrire($('hint'), labels[state.step][1], { vitesse: 45 });
    $('inputValue').textContent = flows[state.step][0]; $('outputValue').textContent = flows[state.step][1];
    $('startBtn').textContent = state.running ? 'Pause' : state.status === 'finished' ? 'Rejouer' : 'Démarrer';
    $('progression').textContent = `étape ${state.step + 1} / 5`;
    if (state.marques[state.step] == null) state.marques[state.step] = (performance.now() - state.ouvert) / 1000;
    state.dirty = true;
  }
  function goTo(step) { state.tween = { from: state.tween.to, to: step, t0: performance.now() }; state.step = step; }
  function stopTimer() { if (timer) { clearTimeout(timer); timer = null; } }
  function next() {
    if (state.step >= 4) return;
    goTo(state.step + 1); const finished = state.step >= 4; if (finished) state.running = false; state.status = finished ? 'finished' : 'running';
    publish('next_step_' + (state.step + 1)); render();
    if (state.running && state.step < 4) timer = setTimeout(next, 2200); else if (finished) { publish('finish_simulation'); bulle($('feedback'), 'Bilan net : 1 glucose → 2 pyruvates + 2 ATP + 2 NADH,H⁺', 'good'); }
  }
  function start() { stopTimer(); if (state.step >= 4) { goTo(0); state.actions = []; state.marques = [0, null, null, null, null]; state.ouvert = performance.now(); } state.running = true; state.status = 'running'; publish('start_simulation'); render(); bulle($('feedback'), 'Suis les six carbones orange.'); timer = setTimeout(next, 1500); }
  function pause() { stopTimer(); state.running = false; state.status = 'idle'; publish('pause_simulation'); render(); }
  function reset() { stopTimer(); goTo(0); state.running = false; state.status = 'idle'; state.actions = []; state.marques = [0, null, null, null, null]; state.ouvert = performance.now(); publish('reset_simulation'); render(); bulle($('feedback'), 'Retour au glucose intact.'); }
  $('startBtn').onclick = () => state.running ? pause() : start(); $('resetBtn').onclick = reset; $('nextBtn').onclick = () => { stopTimer(); state.running = false; next(); };
  window.executeAICommand = (command, params = {}) => {
    if (command === 'highlight') { window.Tableau.surligner(params.target || params.repere || params.id); return; }
    window.Tableau.appuyer(command);
    if (command === 'start' || command === 'replay') start(); else if (command === 'next' || command === 'step') { state.running = false; stopTimer(); next(); } else if (command === 'pause') pause(); else if (command === 'reset') reset(); else if (command === 'set_variant') reset();
  };
  window.addEventListener('message', e => { const d = e.data || {}; if (d.type === 'simulation_control' && d.simulation_id === SIMULATION_CONFIG.id) executeAICommand(d.command, d.parameters || {}); });
  window.SIMULATION_CONFIG = SIMULATION_CONFIG; window.__SIMULATION_MANIFEST_SENT__ = true;
  // Les repères pointables sont connus après le premier dessin : le manifeste est renvoyé une fois complet.
  function manifeste() {
    window.parent.postMessage({ type: 'simulation_manifest', simulation_id: SIMULATION_CONFIG.id, capabilities: { commands: SIMULATION_CONFIG.commands, config: SIMULATION_CONFIG, buttons: ['startBtn', 'nextBtn', 'resetBtn'], command_schema: { highlight: { target: Object.keys(window.Tableau.listeReperes()).join(' | ') } }, reperes: window.Tableau.listeReperes(), explication: EXPLICATION }, page_text: 'Dessiné au tableau : dans le cytoplasme de la cellule, la glycolyse transforme un glucose C6 en exactement 2 pyruvates C3. Les deux pyruvates sont représentés à proximité de la mitochondrie, sans être placés à l’intérieur.' }, '*');
  }
  manifeste(); setTimeout(manifeste, 1800);

  // ── Dessin à la craie (repère logique 760 × 430) ──────────────────────────
  const craie = new Craie($('canvas'), { onresize: () => { state.dirty = true; } });
  const ease = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
  const lerp = (a, b, k) => a + (b - a) * k;
  // Position d'une chaîne selon l'étape : le glucose avance puis se coupe en deux trioses qui glissent vers la mitochondrie.
  function chaine(step, which) { // which 0 = glucose/triose A, 1 = triose B
    if (step <= 1) return { x: step === 0 ? 90 : 190, y: 225, n: 6, alpha: which ? 0 : 1 };
    const x = step === 2 ? 300 : step === 3 ? 330 : 400, y = which ? 280 : 180;
    return { x, y, n: 3, alpha: 1 };
  }
  function draw() {
    const W = craie.W, H = craie.H; if (W < 1 || H < 1) return true;
    const temps = (performance.now() - state.ouvert) / 1000;
    craie.debut(5, temps);
    const c = craie.ctx, s = Math.min(W / 760, H / 430); c.translate((W - 760 * s) / 2, (H - 430 * s) / 2); c.scale(s, s); craie.echelle = s; craie.tailleMin = 11;
    const k = ease(Math.min(1, (performance.now() - state.tween.t0) / 800)), step = state.step;
    // Cellule et mitochondrie
    craie.trait([[30, 60], [120, 35], [420, 30], [640, 55], [735, 150], [725, 330], [560, 405], [230, 410], [40, 350], [18, 200]], { couleur: 'faible', largeur: 2.4, ferme: true, duree: 1 });
    craie.texte('CYTOPLASME', 75, 125, { couleur: 'cyan', taille: 17 });
    craie.trait([[560, 150], [640, 140], [700, 190], [700, 280], [640, 330], [560, 320], [520, 240]], { couleur: 'rose', largeur: 2.6, ferme: true, duree: .6 });
    craie.trait([[575, 160], [640, 155], [685, 195], [685, 275], [640, 315], [575, 310], [540, 240]], { couleur: 'rose', largeur: 1.4, ferme: true, duree: .4 });
    [[585, 170], [615, 165], [645, 170]].forEach(([x, y]) => craie.trait([[x, y], [x + 4, y + 50], [x, y + 100]], { couleur: 'rose', largeur: 1.4, duree: .1 }));
    craie.texte('MITOCHONDRIE', 610, 350, { couleur: 'rose', taille: 15, align: 'center' });
    craie.repere('cytoplasme', 60, 100, 180, 36, 'cytoplasme').repere('mitochondrie', 515, 132, 195, 232, 'mitochondrie');
    craie.courbe(u => [75 + (480 - 75) * u, 225 - 30 * Math.sin(Math.PI * u)], 30, { couleur: 'tresfaible', largeur: 2, pointille: [8, 10], duree: .6 });
    craie.fleche(470, 219, 490, 227, { couleur: 'tresfaible', largeur: 2, duree: .1 });
    craie.pause(.2);
    // Étape 2 : ATP consommés, ADP produits (apparaissent à l'étape)
    if (step >= 1) {
      craie.depuis(state.marques[1] ?? temps);
      [190, 245].forEach(x => craie.cercle(x, 88, 17, { couleur: 'jaune', fond: 'jaune' }).texte('ATP', x, 93, { couleur: 'jaune', taille: 13, align: 'center' }));
      craie.fleche(195, 108, 222, 160, { couleur: 'cyan', largeur: 1.8 }).fleche(245, 108, 252, 160, { couleur: 'cyan', largeur: 1.8 });
      craie.rect(320, 72, 62, 32, { couleur: 'jaune', arrondi: 14 }).texte('2 ADP', 351, 93, { couleur: 'jaune', taille: 13, align: 'center' });
      craie.fleche(296, 168, 346, 111, { couleur: 'jaune', largeur: 1.8 });
      craie.repere('atp_consommes', 168, 66, 100, 46, '2 ATP consommés').repere('adp', 316, 68, 70, 40, '2 ADP libérés');
      if (step <= 1) craie.texte('activation : 2 ATP consommés', 215, 320, { couleur: 'faible', taille: 15 });
    }
    // Étape 3 : coupure
    if (step >= 2) { craie.depuis(state.marques[2] ?? temps); craie.ligne(300, 200, 300, 262, { couleur: 'rouge', largeur: 2, pointille: [6, 6] }).texte('C₆ → 2 × C₃', 300, 335, { couleur: 'rose', taille: 16, align: 'center' }).repere('coupure', 284, 194, 32, 76, 'coupure C₆ → 2 C₃'); }
    // Étape 4 : entrées et sorties de la phase de récupération
    if (step >= 3) {
      craie.depuis(state.marques[3] ?? temps);
      craie.rect(350, 352, 78, 30, { couleur: 'cyan', arrondi: 14 }).texte('2 NAD⁺', 389, 372, { couleur: 'cyan', taille: 13, align: 'center' });
      craie.rect(445, 352, 122, 30, { couleur: 'cyan', arrondi: 14 }).texte('4 ADP + 4 Pᵢ', 506, 372, { couleur: 'cyan', taille: 13, align: 'center' });
      craie.fleche(385, 350, 365, 300, { couleur: 'cyan', largeur: 1.8 }).fleche(500, 350, 420, 290, { couleur: 'cyan', largeur: 1.8 });
      craie.cercle(150, 305, 17, { couleur: 'vert', fond: 'vert' }).texte('N', 150, 311, { couleur: 'vert', taille: 15, align: 'center' }).texte('2 NADH,H⁺', 150, 277, { couleur: 'vert', taille: 13, align: 'center' });
      craie.cercle(235, 305, 17, { couleur: 'jaune', fond: 'jaune' }).texte('A', 235, 311, { couleur: 'jaune', taille: 15, align: 'center' }).texte('4 ATP', 235, 277, { couleur: 'jaune', taille: 13, align: 'center' });
      craie.fleche(318, 215, 172, 296, { couleur: 'vert', largeur: 1.8 }).fleche(318, 268, 258, 296, { couleur: 'jaune', largeur: 1.8 });
      craie.texte('bilan net : 2 ATP + 2 NADH,H⁺', 110, 360, { couleur: 'vert', taille: 16 });
      craie.repere('entrees', 346, 346, 226, 42, 'NAD⁺, ADP et Pᵢ entrants').repere('nadh', 124, 262, 52, 66, '2 NADH,H⁺ produits').repere('atp_produits', 209, 262, 52, 66, '4 ATP produits').repere('bilan', 106, 342, 262, 26, 'bilan net');
    }
    if (step >= 4) { craie.depuis(state.marques[4] ?? temps); craie.fleche(470, 230, 515, 238, { couleur: 'rose', largeur: 2 }); craie.texte('les pyruvates entrent ensuite dans la mitochondrie', 60, 65, { couleur: 'faible', taille: 14 }); }
    // Chaînes de carbone (animées entre deux étapes)
    craie.direct(() => {
      const prev = state.tween.from;
      for (const which of [0, 1]) {
        const a = chaine(prev, which), b = chaine(step, which);
        const x = lerp(a.x, b.x, k), y = lerp(a.y, b.y, k), alpha = lerp(a.alpha, b.alpha, k), n = k < .5 ? a.n : b.n;
        if (alpha <= .02) continue;
        const pas = n === 6 ? 24 : 36, col = n === 6 ? 'orange' : 'rose';
        craie.ligne(x, y, x + pas * (n - 1), y, { couleur: 'jaune', largeur: 7, alpha: .5 * alpha });
        for (let i = 0; i < n; i++) craie.cercle(x + i * pas, y, 17, { couleur: col, fond: col, fondAlpha: .35 * alpha, alpha });
        if (n === 6 && alpha > .5) { craie.texte('Glucose · C₆', x, y + 44, { couleur: 'orange', taille: 16, alpha }); craie.repere('glucose', x - 20, y - 22, pas * (n - 1) + 40, 70, 'glucose C₆'); }
        if (n === 3) { craie.texte(step >= 3 ? 'pyruvate · C₃' : `triose ${which ? 'B' : 'A'} · C₃`, x, y + (which ? 44 : -30), { couleur: 'rose', taille: 15, alpha }); if (!which) craie.repere('pyruvates', x - 20, y - 36, pas * 2 + 40, 164, step >= 3 ? 'les deux pyruvates' : 'les deux trioses'); }
      }
    });
    const complet = craie.fin();
    return complet && k >= 1;
  }
  function frame() { if (state.dirty || state.running) state.dirty = !draw(); requestAnimationFrame(frame); }
  ecrire($('objectif'), 'Objectif : suivre les six carbones du glucose, compter les ATP consommés et produits, établir le bilan.', { vitesse: 70 });
  render(); publish('ready'); bulle($('feedback'), 'Observe la chaîne : chaque boule orange représente un carbone.'); requestAnimationFrame(frame);
})();
</script>
<script src="/media/simulations/professor-locate.js" defer></script>
</body>
</html>
