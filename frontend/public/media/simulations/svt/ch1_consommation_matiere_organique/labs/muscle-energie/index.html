<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhysioLab Muscle — myogramme, sarcomère et filières ATP, au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css">
<style>
  #hypothese { min-width: 13em; }
  #console { max-width: 44%; }
  #console .choix { flex-direction: row; gap: .8em; margin: .1em 0; }
  #console .row[hidden] { display: none; }
  #console .row { margin-top: .15em; }
  #console .row > span { color: var(--craie-faible); font-size: .9em; margin-right: .5em; }
  @media (max-width: 720px) { #console { max-width: 58%; } #hypothese { min-width: 0; max-width: 40%; } }
</style>
</head>
<body>
<div class="tableau">
  <header class="titre">
    <div><small>SVT · 2 BAC · PhysioLab muscle</small><h1 id="missionTitle"></h1><p class="objectif" id="missionPrompt"></p></div>
    <nav class="onglets" id="missions" aria-label="Enquêtes"></nav>
  </header>
  <section class="scene">
    <canvas id="canvas" role="img" aria-label="Préparation musculaire, sarcomère, filières énergétiques et myogramme dessinés à la craie"></canvas>
    <div class="panneau haut-droite" id="hypothese" data-professor-point="hypothese" data-professor-label="ton hypothèse"><h3>Hypothèse</h3><p id="predictQuestion"></p><div class="choix" id="choices"></div></div>
    <div class="panneau bas-gauche" id="console" data-professor-control="set_parameters" data-professor-point="console" data-professor-label="console expérimentale">
      <h3>Console expérimentale</h3>
      <div class="row" id="freqRow"></div>
      <div class="row" id="calciumRow"><span>Ca²⁺</span><div class="choix" style="display:inline-flex"><label><input type="radio" name="ca" value="true" checked> avec</label><label><input type="radio" name="ca" value="false"> sans</label></div></div>
      <div class="row" id="atpRow"><span>ATP</span><div class="choix" style="display:inline-flex"><label><input type="radio" name="atp" value="true" checked> avec</label><label><input type="radio" name="atp" value="false"> sans</label></div></div>
      <div class="row" id="durationRow"></div>
      <div class="row" id="intensityRow"></div>
      <div class="row" id="oxygenRow"><span>Apport en O₂</span><div class="choix" style="display:inline-flex"><label><input type="radio" name="o2" value="true" checked> normal</label><label><input type="radio" name="o2" value="false"> limité</label></div></div>
    </div>
  </section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="run_trial start">ϟ Stimuler et enregistrer</button>
    <button class="craie-btn secondaire" id="reset" data-professor-control="reset">Recommencer</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
    <button class="craie-btn secondaire" id="help" data-professor-control="reveal_hint">Un indice</button>
    <span class="lecture" id="progressText"></span>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script>
(() => {
const { Craie, fr, bulle, ecrire, onglets, curseur, appuyer, surligner, listeReperes, explication } = window.Tableau;
// Script d'explication : le tuteur dit chaque phrase pendant que le professeur montre le repère du doigt.
const EXPLICATION = {
  frequency: [
    { repere: 'stimulateur', texte: 'Le stimulateur envoie des impulsions électriques au nerf, à la fréquence choisie.' },
    { repere: 'muscle', texte: 'Le muscle isolé se contracte à chaque message nerveux reçu.' },
    { repere: 'capteur', texte: 'Le capteur enregistre la tension développée : c’est le myogramme.' },
    { repere: 'myogramme', texte: 'À basse fréquence, une secousse isolée ; en rapprochant les stimulations, les secousses se somment ; très rapprochées, la tension se maintient au maximum : tétanos.' },
  ],
  crossbridge: [
    { repere: 'actine', texte: 'Les filaments fins d’actine sont accrochés aux stries Z.' },
    { repere: 'myosine', texte: 'Les filaments épais de myosine portent des têtes qui s’accrochent à l’actine et tirent.' },
    { repere: 'calcium', texte: 'Le Ca²⁺ libéré déplace la tropomyosine et dévoile les sites de fixation sur l’actine.' },
    { repere: 'atp', texte: 'L’hydrolyse de l’ATP fait pivoter la tête puis la détache : sans ATP, les ponts restent fixés.' },
    { repere: 'myogramme', texte: 'Le raccourcissement du sarcomère se lit sur le tracé : les stries Z se rapprochent.' },
  ],
  energy: [
    { repere: 'atp_muscle', texte: 'Le muscle n’a que quelques secondes d’ATP en réserve : il doit le régénérer en continu.' },
    { repere: 'filiere_pcr', texte: 'La phosphocréatine redonne un phosphate à l’ADP : très rapide, mais la réserve dure une dizaine de secondes.' },
    { repere: 'filiere_lactique', texte: 'La glycolyse lactique fournit vite de l’ATP sans O₂, en produisant du lactate.' },
    { repere: 'filiere_respiration', texte: 'Avec du dioxygène et du temps, la respiration mitochondriale prend le relais : lente mais durable.' },
    { repere: 'conditions', texte: 'Durée, intensité et apport en O₂ décident de la filière dominante.' },
  ],
};
explication(EXPLICATION);
window.SIMULATION_CONFIG={id:'svt_ch1_physiolab_muscle_v2',title:'PhysioLab Muscle — myogramme, sarcomère et filières ATP',protocol_version:'2.0',learning_objectives:['Relier fréquence et forme du myogramme','Expliquer le rôle du Ca2+ et de l’ATP dans le cycle actine-myosine','Choisir la voie de régénération de l’ATP selon l’effort'],commands:['start','reset','set_variant','set_parameters','run_trial','highlight','get_state'],measurements:['tension_relative','heat_relative','lactate_relative','shortening_percent'],variants:[{id:'frequency',label:'Enquête 1 · Du stimulus au tétanos',objective:'Relier la fréquence des stimulations à la sommation puis au tétanos.',completion:'Comparer secousse, sommation et tétanos'},{id:'crossbridge',label:'Enquête 2 · Le moteur actine–myosine',objective:'Distinguer les rôles du Ca2+ et de l’ATP dans le cycle des ponts.',completion:'Tester les rôles du Ca2+ et de l’ATP'},{id:'energy',label:'Enquête 3 · D’où vient l’ATP ?',objective:'Relier durée, intensité et oxygénation à la filière dominante.',completion:'Comparer effort bref, moyen et prolongé'}]};
const missions={frequency:{title:'Comment la fréquence transforme-t-elle la force ?',prompt:'Enregistre une secousse, une sommation puis un tétanos.',need:3,q:'Avec la fréquence réglée, quel tracé prévois-tu ?',answers:[['twitch','Secousse'],['summation','Sommation'],['tetanus','Tétanos']]},crossbridge:{title:'Quelles conditions permettent le glissement ?',prompt:'Isole les rôles du Ca²⁺ et de l’ATP avec trois essais contrôlés.',need:3,q:'Avec les réglages Ca²⁺ et ATP choisis, que prévois-tu ?',answers:[['none','Aucun pont'],['locked','Ponts bloqués'],['normal','Cycle normal']]},energy:{title:'Quelle voie régénère l’ATP pendant l’effort ?',prompt:'Compare un effort explosif, intense moyen et prolongé.',need:3,q:'Avec cette durée, cette intensité et cet apport en O₂, quelle voie domine ?',answers:[['pcr','Phosphocréatine'],['lactic','Glycolyse lactique'],['respiration','Respiration']]}};
const S={id:window.SIMULATION_CONFIG.id,variant:'frequency',freq:1,calcium:true,atp:true,duration:10,intensity:70,oxygen:true,prediction:null,trials:[],covered:{frequency:new Set(),crossbridge:new Set(),energy:new Set()},last:null,status:'ready',actions:[],ouvert:performance.now(),progress:0,running:false,resultAt:null,dirty:true};
const $=id=>document.getElementById(id);let anim=null;
const scene=()=>(performance.now()-S.ouvert)/1000,redraw=()=>{S.dirty=true};
const feedback=(t,kind='')=>bulle($('feedback'),t,kind==='warn'?'bad':kind);
const variantes=window.SIMULATION_CONFIG.variants.map(v=>({id:v.id,label:v.label.split('· ')[1]}));
const done=id=>S.covered[id].size>=missions[id].need;
function init(){
  $('freqRow').append(curseur({id:'freq',label:'Fréquence des stimulations',min:1,max:50,step:1,valeur:1,unite:'Hz',onchange:v=>setParams({frequency_hz:v},true)}));
  $('durationRow').append(curseur({id:'duration',label:'Durée de l’effort',min:5,max:180,step:5,valeur:10,unite:'s',onchange:v=>setParams({duration_s:v},true)}));
  $('intensityRow').append(curseur({id:'intensity',label:'Intensité',min:20,max:100,step:5,valeur:70,unite:'%',onchange:v=>setParams({intensity_percent:v},true)}));
  $('calciumRow').addEventListener('change',e=>setParams({calcium_present:e.target.value==='true'},true));
  $('atpRow').addEventListener('change',e=>setParams({atp_present:e.target.value==='true'},true));
  $('oxygenRow').addEventListener('change',e=>setParams({oxygen_present:e.target.value==='true'},true));
  $('run').onclick=runTrial;$('reset').onclick=resetSimulation;$('help').onclick=()=>feedback('Change une seule variable, prédis le résultat, stimule puis compare les tracés.');
  runVariant('frequency',false);setTimeout(sendManifest,350);setTimeout(sendManifest,2000)}
function renderMissions(){onglets($('missions'),variantes,S.variant,id=>runVariant(id),new Set(Object.keys(missions).filter(done)))}
function runVariant(id,report=true){if(!missions[id])return;cancel();S.variant=id;S.last=null;S.prediction=null;S.status='ready';S.resultAt=null;S.ouvert=performance.now();renderMissions();ecrire($('missionTitle'),missions[id].title);ecrire($('missionPrompt'),missions[id].prompt,{vitesse:60});ecrire($('predictQuestion'),missions[id].q);showRows();renderChoices();feedback('Sélectionne une hypothèse avant la mesure.');updateProgress();redraw();if(report)emit('select_variant',{variant:id},'running')}
function showRows(){const map={frequency:['freqRow'],crossbridge:['calciumRow','atpRow'],energy:['durationRow','intensityRow','oxygenRow']};['freqRow','calciumRow','atpRow','durationRow','intensityRow','oxygenRow'].forEach(id=>$(id).hidden=!map[S.variant].includes(id))}
function renderChoices(){const box=$('choices');box.innerHTML='';missions[S.variant].answers.forEach(([id,label])=>{const l=document.createElement('label'),i=document.createElement('input');i.type='radio';i.name='hypothese';i.value=id;i.checked=S.prediction===id;i.onchange=()=>{S.prediction=id;S.actions.push({action:'predict',variant:S.variant,value:id});feedback('Hypothèse notée : vérifie-la expérimentalement.','good');emit('predict',{value:id},'running')};l.append(i,' '+label);box.appendChild(l)})}
function setParams(p,user=false){cancel();S.last=null;S.resultAt=null;S.status='ready';if('frequency_hz'in p)S.freq=Math.max(1,Math.min(50,+p.frequency_hz));if('calcium_present'in p)S.calcium=!!p.calcium_present;if('atp_present'in p)S.atp=!!p.atp_present;if('duration_s'in p)S.duration=Math.max(5,Math.min(180,+p.duration_s));if('intensity_percent'in p)S.intensity=Math.max(20,Math.min(100,+p.intensity_percent));if('oxygen_present'in p)S.oxygen=!!p.oxygen_present;
  $('freq').closest('.curseur').maj(S.freq);$('duration').closest('.curseur').maj(S.duration);$('intensity').closest('.curseur').maj(S.intensity);
  for(const [n,v] of [['ca',S.calcium],['atp',S.atp],['o2',S.oxygen]]){const r=document.querySelector(`[name=${n}][value="${v}"]`);if(r)r.checked=true}
  redraw();if(user){S.actions.push({action:'change_parameters',parameters:p});emit('change_parameters',p,'running')}}
function model(){if(S.variant==='frequency'){const type=S.freq<=3?'secousse isolée':S.freq<28?'sommation / tétanos incomplet':'tétanos complet';const force=S.freq<=3?34:Math.min(100,45+S.freq*1.5);return{response_type:type,tension_relative:+force.toFixed(0),heat_relative:+(force*.36).toFixed(0),pathway:'ATP immédiat',lactate_relative:0,shortening_percent:+(force*.12).toFixed(0)}}if(S.variant==='crossbridge'){let type,force,short;if(!S.calcium){type='repos : sites masqués';force=3;short=0}else if(!S.atp){type='ponts fixés, cycle bloqué';force=42;short=2}else{type='cycles de ponts actifs';force=88;short=18}return{response_type:type,tension_relative:force,heat_relative:S.atp&&S.calcium?35:5,pathway:S.atp?'hydrolyse ATP':'ATP absent',lactate_relative:0,shortening_percent:short}}const demand=S.intensity*S.duration/100;const effort=S.intensity/100;const weights={'phosphocréatine':3*Math.exp(-S.duration/12),'glycolyse lactique':(.3+1.8*effort*effort)*(1-Math.exp(-S.duration/8))*Math.exp(-S.duration/110),'respiration cellulaire':(S.oxygen?1.8:.18)*(1-Math.exp(-S.duration/40))};const pathway=Object.keys(weights).reduce((best,key)=>weights[key]>weights[best]?key:best);const lactate=pathway==='glycolyse lactique'?Math.min(100,demand*1.35):Math.min(28,demand*.12),force=Math.max(25,S.intensity-(S.duration>70?S.duration*.12:0)-(S.oxygen?0:15));return{response_type:S.duration<=10?'effort explosif':S.duration<=60?'effort intense':'effort prolongé',tension_relative:+force.toFixed(0),heat_relative:+Math.min(100,demand*.55).toFixed(0),pathway,lactate_relative:+lactate.toFixed(0),shortening_percent:+(force*.13).toFixed(0),weights}}
function runTrial(){if(!S.prediction){feedback('Formule d’abord ton hypothèse.','warn');return}cancel();S.status='running';S.running=true;S.progress=0;S.resultAt=null;$('run').disabled=true;const r=model(),trial={n:S.trials.length+1,variant:S.variant,frequency_hz:S.freq,calcium_present:S.calcium,atp_present:S.atp,duration_s:S.duration,intensity_percent:S.intensity,oxygen_present:S.oxygen,prediction:S.prediction,...r};S.last=trial;S.actions.push({action:'run_trial',parameters:parameters()});feedback('Enregistrement en cours…');const t0=performance.now();anim=setInterval(()=>{S.progress=Math.min(1,(performance.now()-t0)/2400);redraw();if(S.progress>=1){cancel();finish(trial)}},40);emit('run_trial_started',{parameters:parameters()},'running')}
function parameters(){return S.variant==='frequency'?{frequency_hz:S.freq}:S.variant==='crossbridge'?{calcium_present:S.calcium,atp_present:S.atp}:{duration_s:S.duration,intensity_percent:S.intensity,oxygen_present:S.oxygen}}
function twitch(t,c,w=.09){const x=(t-c)/w;return x>0?x*Math.exp(1-x):0}
// Tension (0..1) et stimulus (0/1) à l'abscisse relative q, pour le tracé en cours
function tension(q){const r=S.last;let t=0,emg=0;if(S.variant==='frequency'){const pulses=Math.max(1,Math.round(S.freq/4));for(let k=0;k<pulses;k++){const c=.08+k*(.78/Math.max(1,pulses-1));t+=twitch(q,c,.12);if(Math.abs(q-c)<.012)emg=1}t=Math.min(1,t/(S.freq<4?1:Math.max(.7,pulses*.24)))}else{const active=r.tension_relative/100;t=q<.15?q/.15*active:q<.78?active:Math.max(0,(1-q)/.22*active);emg=Math.abs(q-.09)<.012?1:0}return[t,emg]}
function shortType(t){return t.includes('tétanos')?'tétanos':t.includes('sommation')?'sommation':t.includes('secousse')?'secousse':t.includes('bloqué')?'bloqué':t.includes('actifs')?'glissement':t.includes('repos')?'repos':t}function shortPath(p){return p==='phosphocréatine'?'PCr':p==='glycolyse lactique'?'lactique':p==='respiration cellulaire'?'respiration':'ATP'}
function finish(t){S.trials.push(t);S.running=false;S.progress=1;S.resultAt=scene();$('run').disabled=false;const key=S.variant==='frequency'?(S.freq<=3?'secousse':S.freq<28?'sommation':'tetanos'):S.variant==='crossbridge'?(!S.calcium?'sans_ca':!S.atp?'ca_sans_atp':'ca_atp'):(S.duration<=10?'bref':S.duration<=60?'moyen':'prolonge');S.covered[S.variant].add(key);const expected=t.variant==='frequency'?(t.frequency_hz<=3?'twitch':t.frequency_hz<28?'summation':'tetanus'):t.variant==='crossbridge'?(!t.calcium_present?'none':!t.atp_present?'locked':'normal'):(t.pathway==='phosphocréatine'?'pcr':t.pathway==='glycolyse lactique'?'lactic':'respiration');const correct=t.prediction===expected;feedback(correct?'Hypothèse cohérente avec l’enregistrement. Compare les autres conditions.':'Le tracé te donne un indice : révise ton hypothèse puis compare.',correct?'good':'warn');updateProgress();renderMissions();redraw();const fini=done(S.variant);S.status=fini?'finished':'running';emit('trial_completed',{trial:t,coverage:[...S.covered[S.variant]],scientific_interpretation:interpret(t),mission_complete:fini},S.status);if(fini)setTimeout(()=>feedback('Mission accomplie — utilise les données pour expliquer le mécanisme.','good'),2500)}
function interpret(t){if(S.variant==='frequency')return t.frequency_hz<=3?'Chaque stimulus produit une secousse séparée.':t.frequency_hz<28?'Le Ca²⁺ n’est pas entièrement recapté : les secousses se somment.':'La stimulation très rapprochée maintient une tension maximale : tétanos.';if(S.variant==='crossbridge')return !t.calcium_present?'Sans Ca²⁺, la tropomyosine masque les sites de l’actine.':!t.atp_present?'Le Ca²⁺ autorise les ponts, mais sans ATP les têtes restent fixées.':'Ca²⁺ expose les sites et l’hydrolyse d’ATP alimente le cycle des ponts.';return t.pathway==='phosphocréatine'?'La phosphocréatine régénère très vite l’ATP, mais ses réserves sont faibles.':t.pathway==='glycolyse lactique'?'La glycolyse lactique fournit rapidement de l’ATP et s’accompagne de lactate.':'Avec O₂ et une durée longue, la respiration mitochondriale devient dominante.'}
function updateProgress(){const n=S.covered[S.variant].size,need=missions[S.variant].need;$('progressText').textContent=`plan ${n} / ${need}`}
function resetSimulation(){cancel();S.trials=[];S.last=null;S.covered={frequency:new Set(),crossbridge:new Set(),energy:new Set()};S.actions.push({action:'reset'});setParams({frequency_hz:1,calcium_present:true,atp_present:true,duration_s:10,intensity_percent:70,oxygen_present:true});runVariant(S.variant,false);emit('reset',{},'running')}
function cancel(){$('run').disabled=false;S.running=false;if(anim){clearInterval(anim);anim=null}}
function semanticState(status){return{simulation_status:status||S.status,active_mission:S.variant,mission_title:missions[S.variant].title,student_prediction:S.prediction,variables:parameters(),measurements:S.last?{tension_relative:S.last.tension_relative,heat_relative:S.last.heat_relative,lactate_relative:S.last.lactate_relative,shortening_percent:S.last.shortening_percent,response_type:S.last.response_type,dominant_atp_pathway:S.last.pathway}:null,scientific_observation:S.last?interpret(S.last):null,mission_coverage:[...S.covered[S.variant]],trial_history:S.trials.slice(-8),model_limits:'Modèle qualitatif : valeurs relatives, contributions simultanées des filières. Seuils de fréquence illustratifs, variables selon le muscle.'}}
function emit(action,payload,status){window.parent.postMessage({type:'simulation_state',simulation_id:S.id,student_actions:[...S.actions.slice(-12),{action,...payload}],current_state:semanticState(status),objective_progress:Math.min(1,(S.covered.frequency.size/3+S.covered.crossbridge.size/3+S.covered.energy.size/3)/3),timestamp:new Date().toISOString()},'*')}
function sendManifest(){window.__SIMULATION_MANIFEST_SENT__=true;window.parent.postMessage({type:'simulation_manifest',simulation_id:S.id,capabilities:{reperes:listeReperes(),explication:EXPLICATION,commands:window.SIMULATION_CONFIG.commands,globals:['executeAICommand','runVariant','runTrial','resetSimulation','getSimulationState'],config:window.SIMULATION_CONFIG,controls:{frequency_hz:{type:'range',min:1,max:50,unit:'Hz'},calcium_present:{type:'boolean'},atp_present:{type:'boolean'},duration_s:{type:'range',min:5,max:180,unit:'s'},intensity_percent:{type:'range',min:20,max:100,unit:'%'},oxygen_present:{type:'boolean'}},command_schema:{set_variant:{variant_id:{type:'enum',values:['frequency','crossbridge','energy']}},set_parameters:{frequency_hz:'number 1..50',calcium_present:'boolean',atp_present:'boolean',duration_s:'number 5..180',intensity_percent:'number 20..100',oxygen_present:'boolean'},run_trial:{},highlight:{target:'repère pointable (voir reperes)',control_id:'DOM id facultatif'},reset:{}},state_contract:{variables:'réglages réellement utilisés',measurements:'force, chaleur, lactate, raccourcissement et voie ATP',student_prediction:'hypothèse choisie',mission_coverage:'conditions déjà testées',trial_history:'essais comparables',scientific_observation:'interprétation causale issue du modèle'}},page_text:'Laboratoire d’investigation dessiné au tableau : prédire, stimuler, enregistrer un myogramme et relier contraction, calcium, ATP et filières énergétiques.'},'*')}
window.runVariant=runVariant;window.runTrial=runTrial;window.resetSimulation=resetSimulation;window.getSimulationState=()=>semanticState();
window.executeAICommand=(command,p={})=>{appuyer(command);if(command==='set_variant')runVariant(p.variant_id);else if(command==='start'){feedback('À toi : formule une hypothèse puis règle la console.');emit('guided_start',{},'running')}else if(command==='reset')resetSimulation();else if(command==='set_parameters'||command==='setParameter')setParams(p,true);else if(command==='run_trial'||command==='runSimulation')runTrial();else if(command==='highlight'){if(!(p.target&&surligner(p.target))){const e=document.getElementById(p.control_id||p.target||'run');if(e){e.classList.add('presse');setTimeout(()=>e.classList.remove('presse'),2200)}}}else if(command==='get_state')emit('state_requested',{},S.status)};
window.addEventListener('message',event=>{const d=event.data||{};if(d.type!=='simulation_control')return;if(d.simulation_id&&d.simulation_id!==S.id)return;if(d.guidance_text)feedback(d.guidance_text);window.executeAICommand(d.command,d.parameters||{})});

// ── Dessin à la craie ─────────────────────────────────────────────────────
const canvas=$('canvas'),craie=new Craie(canvas,{onresize:redraw});
function draw(){
  const W=craie.W,H=craie.H;if(W<1||H<1)return true;const temps=scene();craie.debut(5,temps);Object.keys(window.Tableau.REPERES).forEach(k=>delete window.Tableau.REPERES[k]);   // seuls les repères de l'enquête affichée restent pointables
  const c=craie.ctx,s=Math.min(W/760,H/380);c.translate((W-760*s)/2,(H-380*s)/2);c.scale(s,s);
  const p=S.progress,r=S.last;
  if(S.variant==='frequency'){
    // Préparation muscle–nerf : muscle fusiforme, nerf, stimulateur et capteur de tension
    craie.repere('muscle',64,146,212,80,'muscle').repere('nerf',154,104,78,62,'nerf').repere('stimulateur',114,54,92,50,'stimulateur').repere('capteur',324,160,64,70,'capteur de tension').repere('frequence',114,270,124,30,'fréquence réglée');
    craie.ligne(60,250,60,120,{largeur:3}).ligne(40,120,80,120,{largeur:3}).texte('fixe',30,110,{couleur:'faible',taille:13});
    craie.courbe(u=>[70+u*200,185-Math.sin(u*Math.PI)*34],40,{couleur:'rose',largeur:3}).courbe(u=>[70+u*200,185+Math.sin(u*Math.PI)*34],40,{couleur:'rose',largeur:3}).texte('muscle',170,192,{couleur:'rose',taille:16,align:'center'});
    craie.courbe(u=>[160+u*60,120+u*40+Math.sin(u*12)*4],30,{couleur:'jaune',largeur:2}).texte('nerf',205,112,{couleur:'jaune',taille:14});
    craie.rect(120,60,80,40,{couleur:'jaune',arrondi:5}).texte('stimulateur',160,85,{couleur:'jaune',taille:13,align:'center'}).ligne(160,100,160,120,{couleur:'jaune',largeur:1.5});
    craie.ligne(270,185,330,185,{largeur:2}).rect(330,165,50,40,{arrondi:5,couleur:'violet'}).texte('capteur',355,190,{couleur:'violet',taille:12,align:'center'}).texte('tension',355,222,{couleur:'violet',taille:13,align:'center'});
    craie.texte(`f = ${S.freq} Hz`,120,290,{couleur:'jaune',taille:17});
    craie.direct(()=>{if(S.running&&tension(p)[1])craie.texte('ϟ',200,120,{couleur:'jaune',taille:30})});
  } else if(S.variant==='crossbridge'){
    // Sarcomère : stries Z, actine fine (rose), myosine épaisse (violet) et ses têtes
    const short=r&&r.shortening_percent>8?p*18:0;const z1=70+short,z2=390-short;
    craie.repere('sarcomere',z1,74,z2-z1,184,'sarcomère').repere('strie_z',z1-12,72,26,186,'strie Z').repere('actine',z1,94,122,22,'filament d’actine').repere('myosine',148,124,166,82,'myosine et ses têtes').repere('calcium',56,274,150,26,'Ca²⁺').repere('atp',226,274,150,26,'ATP');
    craie.ligne(z1,80,z1,250,{largeur:3}).texte('Z',z1-4,70,{taille:14}).ligne(z2,80,z2,250,{largeur:3}).texte('Z',z2-4,70,{taille:14});
    craie.direct(()=>{[105,165,225].forEach(y=>{craie.ligne(z1,y,z1+115,y,{couleur:'rose',largeur:2});craie.ligne(z2-115,y,z2,y,{couleur:'rose',largeur:2})});
      [135,195].forEach(y=>{craie.ligne(150,y,310,y,{couleur:'violet',largeur:5});for(let i=0;i<6;i++){const x=165+i*26;craie.ligne(x,y,x-6,y-12,{couleur:'violet',largeur:2});craie.ligne(x+8,y,x+14,y+12,{couleur:'violet',largeur:2})}});
      if(S.calcium)for(let i=0;i<10;i++)craie.point(90+(i*31)%280,90+(i*53)%150,2.5,'jaune')});
    craie.texte('actine',80,98,{couleur:'rose',taille:13}).texte('myosine',230,128,{couleur:'violet',taille:13});
    craie.texte(`Ca²⁺ : ${S.calcium?'présent':'absent'}`,60,290,{couleur:'jaune',taille:16}).texte(`ATP : ${S.atp?'présent':'absent'}`,230,290,{couleur:'cyan',taille:16});
  } else {
    // Filières : trois réservoirs vers l'ATP du muscle
    craie.courbe(u=>[60+u*160,62-Math.sin(u*Math.PI)*20],30,{couleur:'rose',largeur:2.6}).courbe(u=>[60+u*160,62+Math.sin(u*Math.PI)*20],30,{couleur:'rose',largeur:2.6}).texte('muscle',140,68,{couleur:'rose',taille:15,align:'center'});
    craie.repere('muscle',56,36,170,54,'muscle').repere('atp_muscle',110,100,60,32,'ATP du muscle').repere('filiere_pcr',38,156,118,64,'ATP–phosphocréatine').repere('filiere_lactique',163,156,118,64,'glycolyse lactique').repere('filiere_respiration',288,156,118,64,'respiration').repere('conditions',246,44,232,50,'durée, intensité, O₂');
    craie.texte('ATP',140,122,{couleur:'cyan',taille:20,align:'center'}).fleche(140,104,140,92,{couleur:'cyan'});
    const w=r&&r.weights?r.weights:null,tot=w?Object.values(w).reduce((a,b)=>a+b,0):1;
    [['phosphocréatine','PCr → ATP','jaune',40,'très vite, réserve faible'],['glycolyse lactique','glycogène → lactate','orange',165,'vite, sans O₂'],['respiration cellulaire','O₂ → mitochondrie','vert',290,'lent, durable']].forEach(([k,l,col,x,note],i)=>{
      craie.rect(x,160,112,56,{couleur:col,arrondi:8}).texte(l,x+56,183,{couleur:col,taille:13,align:'center',max:104}).texte(note,x+56,205,{couleur:'faible',taille:11,align:'center',max:106});
      craie.fleche(x+56,158,140+(i-1)*18,134,{couleur:col,largeur:1.4});
      craie.direct(()=>{if(w){const f=w[k]/tot;craie.ctx.globalAlpha=.25;craie.ctx.fillStyle=craie.couleur(col);craie.ctx.fillRect(x+2,216-54*f*p,108,54*f*p);craie.ctx.globalAlpha=1}})});
    craie.texte(`durée ${S.duration} s · intensité ${S.intensity} %`,250,62,{couleur:'jaune',taille:15,max:230}).texte(`O₂ ${S.oxygen?'normal':'limité'}`,250,86,{couleur:'jaune',taille:15});
  }
  // Myogramme (ou réponse enregistrée) à droite
  const gx=430,gy=230,gw=290,gh=160;
  craie.repere('myogramme',gx-10,gy-gh-14,gw+32,gh+34,'myogramme').repere('legende',gx,gy+8,250,22,'légende du tracé');
  if(r)craie.repere('resultats',gx-4,gy+30,gw+20,48,'mesures de l’essai');if(S.trials.length)craie.repere('carnet',gx-4,gy+84,gw+20,60,'carnet');
  craie.axe(gx,gy,gx+gw,gy,[],{}).axe(gx,gy,gx,gy-gh,[],{}).texte('temps',gx+gw-6,gy+20,{couleur:'faible',taille:13,align:'right'}).texte('réponse relative',gx+6,gy-gh+2,{couleur:'faible',taille:13});
  [['tension','violet'],['stimulus','rose'],['chaleur','orange']].forEach(([l,col],i)=>{craie.ligne(gx+4+i*78,gy+16,gx+18+i*78,gy+16,{couleur:col,largeur:2.5}).texte(l,gx+22+i*78,gy+21,{couleur:col,taille:12})});
  craie.direct(()=>{if(!r)return;
    craie.courbe(u=>u>p?null:[gx+6+u*(gw-12),gy-tension(u)[0]*(gh-30)],120,{couleur:'violet',largeur:2.4,tremble:.3});
    for(let i=0;i<=120;i++){const u=i/120;if(u<=p&&tension(u)[1])craie.ligne(gx+6+u*(gw-12),gy,gx+6+u*(gw-12),gy-40,{couleur:'rose',largeur:1.4,tremble:0})}
    craie.courbe(u=>u>p?null:[gx+6+u*(gw-12),gy-Math.min(r.heat_relative/100,u*1.2)*p*70],60,{couleur:'orange',largeur:1.8,tremble:.3})});
  if(S.resultAt!=null&&r){craie.depuis(S.resultAt);
    craie.texte(`tension max : ${r.tension_relative} u.a. · ${shortType(r.response_type)} · chaleur ${r.heat_relative} · voie ${shortPath(r.pathway)}`,gx,gy+42,{couleur:'jaune',taille:14,max:300});
    craie.texte(interpret(r),gx,gy+64,{couleur:'faible',taille:13,max:300});
    if(S.trials.length){craie.texte('Carnet :',gx,gy+96,{couleur:'violet',taille:14});S.trials.slice(-3).forEach((t,i)=>craie.texte(`#${t.n} ${t.variant==='frequency'?t.frequency_hz+' Hz':t.variant==='crossbridge'?(t.calcium_present?'Ca+':'Ca−')+'/'+(t.atp_present?'ATP+':'ATP−'):t.duration_s+' s'} → ${shortType(t.response_type)} · ${t.tension_relative}`,gx+60,gy+96+i*18,{couleur:'faible',taille:12,max:230,duree:.3}))}}
  return craie.fin();
}

init();requestAnimationFrame(frame);
})();
