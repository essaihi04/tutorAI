<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contraction musculaire — au tableau</title><link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="simulation.css"></head><body>
<div class="tableau">
  <header class="titre">
    <div><small>Le muscle · une expérience à la fois</small><h1>Qu’est-ce qui fait glisser l’actine ?</h1><p class="objectif" id="objectif"></p></div>
    <div class="conditions choix" data-professor-control="set_parameters set_variant"><label><input id="calcium" name="calcium_present" type="checkbox" checked> Ca²⁺ disponible</label><label><input id="atp" name="atp_present" type="checkbox" checked> ATP disponible</label></div>
  </header>
  <section class="scene" aria-label="Observation du sarcomère">
    <canvas id="scene" role="img" aria-label="Sarcomère dessiné à la craie : stries Z, actine, myosine et ses têtes ; les filaments glissent sans raccourcir"></canvas>
    <div class="panneau haut-gauche explanation" aria-live="polite"><span id="step" class="legende"></span><h3 id="title"></h3><p id="text"></p></div>
  </section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start replay">Animer</button>
    <button class="craie-btn secondaire" id="next" data-professor-control="next">Étape suivante</button>
    <button class="craie-btn secondaire" id="reset" data-professor-control="reset">Tout réinitialiser</button>
    <p class="bulle" id="feedback" role="status"></p>
    <span class="lecture lectures">bande A : <b>constante</b> · bandes I et H : <b id="bands">au repos</b></span><span class="lecture" id="length" hidden></span><span class="lecture" id="status">Prêt</span><span class="lecture" id="coverage"></span>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script><script src="simulation.js"></script><script src="/media/simulations/professor-locate.js" defer></script></body></html>
