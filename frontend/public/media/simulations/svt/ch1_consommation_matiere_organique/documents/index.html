<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Documents EXAO — au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css">
<style>
  .titre h1 { font-size: 1.25em; }
  #step { color: var(--cyan); }
</style>
</head>
<body>
<div class="tableau">
  <header class="titre"><div><small>SVT · 2 BAC · document d’étude</small><h1 id="title"></h1><p class="objectif" id="objectifs"></p></div></header>
  <section class="scene"><canvas id="canvas" role="img" aria-label="Dispositif expérimental et courbes, dessinés à la craie étape par étape"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="play" data-professor-control="start pause replay">Pause</button>
    <button class="craie-btn secondaire" id="previous" data-professor-control="previous">← Précédent</button>
    <button class="craie-btn secondaire" id="next" data-professor-control="next">Suivant →</button>
    <button class="craie-btn secondaire" id="reset" data-professor-control="reset">Recommencer</button>
    <p class="bulle" id="interpretation" role="status" aria-live="polite"></p>
    <span class="lecture" id="step"></span>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="/media/simulations/svt/reactions_responsables_liberation_energie-tableau/peinture.js"></script>
<script>
(() => {
  const { Craie, ecrire, bulle, appuyer, surligner, listeReperes, explication } = window.Tableau;
  const key=new URLSearchParams(location.search).get('scene')||'mitochondries';
  // Chaque étape porte ses valeurs mesurées : la courbe est tracée à partir d'elles.
  const scenes={
    mitochondries:{id:'svt_ch1_mitochondries_isolees',title:'Document 6 — mitochondries isolées et nature du substrat',objectifs:['Décrire le montage','Déduire le substrat utilisé par la mitochondrie'],axes:{x:'temps (min)',y:'[O₂] (µmol/L)',max:140},series:[{key:'o2',label:'O₂',couleur:'bleu'}],
      steps:[{t:'Enceinte fermée : [O₂] stable avant toute injection',o2:120},{t:'Injection de glucose à t₁ : aucune variation de [O₂]',o2:120,tag:'glucose'},{t:'Injection de pyruvate à t₂ : la consommation d’O₂ démarre',o2:120,tag:'pyruvate'},{t:'Les mitochondries isolées utilisent le pyruvate, pas directement le glucose',o2:55}]},
    aerobie:{id:'svt_ch1_exao_aerobie',title:'Document 1 — respiration des levures en aérobiose',objectifs:['Décrire le protocole EXAO','Interpréter les échanges gazeux'],axes:{x:'temps (min)',y:'concentration (µmol/L)',max:300},series:[{key:'o2',label:'O₂',couleur:'bleu'},{key:'co2',label:'CO₂',couleur:'rouge'}],
      steps:[{t:'Avant le glucose : O₂ et CO₂ restent stables',o2:270,co2:25},{t:'Injection de glucose : la respiration démarre',o2:245,co2:50,tag:'glucose'},{t:'Les levures consomment O₂ et rejettent CO₂',o2:150,co2:170},{t:'Respiration aérobie : oxydation complète du glucose',o2:80,co2:280}]},
    anaerobie:{id:'svt_ch1_fermentation_anaerobie',title:'Document 2 — fermentation des levures en anaérobiose',objectifs:['Décrire le montage anaérobie','Identifier les produits de la fermentation'],axes:{x:'temps (s)',y:'concentration (mg/L)',max:300},series:[{key:'o2',label:'O₂',couleur:'bleu'},{key:'co2',label:'CO₂',couleur:'rouge'},{key:'ethanol',label:'Éthanol',couleur:'orange'}],
      steps:[{t:'Le flacon est fermé : le dioxygène devient rapidement nul',o2:12,co2:25,ethanol:0},{t:'Le glucose est consommé malgré l’absence de O₂',o2:0,co2:90,ethanol:35,tag:'O₂ épuisé',note:'Bandelette réactive : le glucose du milieu diminue'},{t:'CO₂ trouble l’eau de chaux et l’éthanol s’accumule',o2:0,co2:190,ethanol:110,note:'Eau de chaux troublée → CO₂ identifié'},{t:'Fermentation alcoolique : glucose → éthanol + CO₂ + 2 ATP',o2:0,co2:260,ethanol:200}]},
    levures:{id:'svt_ch1_levures_comparaison',title:'Document 3 — métabolisme et équipement mitochondrial',objectifs:['Comparer deux cultures','Relier métabolisme et présence de mitochondries'],
      steps:[{t:'Deux cellules de levure de taille comparable'},{t:'Aérobiose : nombreuses mitochondries allongées à crêtes développées',left:1,row:1},{t:'Anaérobiose : grandes vacuoles et rares petites mitochondries',left:1,right:1,row:2},{t:'La respiration est liée aux mitochondries ; la fermentation se déroule dans le hyaloplasme',left:1,right:1,row:2}]}
  };
  const cfg=scenes[key]||scenes.mitochondries;const acquisition=!!cfg.axes;
  // Script d'explication de la scène : le tuteur dit chaque phrase pendant que le professeur montre le repère.
  const SCRIPTS={
    mitochondries:[{repere:'enceinte',texte:'Des mitochondries isolées sont placées dans une enceinte fermée, avec une sonde à dioxygène.'},{repere:'seringue_glucose',texte:'On injecte d’abord du glucose : la concentration en O₂ ne bouge pas.'},{repere:'seringue_pyruvate',texte:'On injecte ensuite du pyruvate : l’O₂ est aussitôt consommé.'},{repere:'graphe',texte:'La mitochondrie n’utilise donc pas le glucose directement, mais le pyruvate issu de la glycolyse du cytoplasme.'}],
    aerobie:[{repere:'bioreacteur',texte:'Des levures en suspension reçoivent de l’air : le milieu est aéré.'},{repere:'sondes',texte:'Deux sondes suivent O₂ et CO₂ dissous, reliées à l’interface EXAO.'},{repere:'graphe',texte:'Dès l’injection de glucose, O₂ diminue et CO₂ augmente : les levures respirent.'},{repere:'ordinateur',texte:'L’ordinateur trace les courbes en temps réel : c’est l’intérêt de l’EXAO.'}],
    anaerobie:[{repere:'flacon_ferme',texte:'Le flacon est bouché : le dioxygène dissous s’épuise rapidement.'},{repere:'bandelette',texte:'La bandelette montre que le glucose est quand même consommé.'},{repere:'eau_de_chaux',texte:'Le gaz dégagé trouble l’eau de chaux : c’est du CO₂.'},{repere:'graphe',texte:'Sans O₂, l’éthanol s’accumule : fermentation alcoolique, glucose → éthanol + CO₂ + 2 ATP.'}],
    levures:[{repere:'cellule_aerobie',texte:'En aérobiose, la levure possède de nombreuses mitochondries allongées, aux crêtes développées.'},{repere:'cellule_anaerobie',texte:'En anaérobiose, elle a de grandes vacuoles et seulement de rares petites mitochondries.'},{repere:'conclusion',texte:'La respiration dépend des mitochondries ; la fermentation se déroule dans le hyaloplasme.'}],
  };
  const EXPLICATION={scene:SCRIPTS[key]||SCRIPTS.mitochondries};explication(EXPLICATION);
  let step=0,timer=null;const actions=[];const S={ouvert:performance.now(),stepAt:[0],dirty:true};
  const $=id=>document.getElementById(id);const scene=()=>(performance.now()-S.ouvert)/1000;
  window.SIMULATION_CONFIG={id:cfg.id,title:cfg.title,variants:[{id:'scene',label:'Scène'}],objectives:cfg.objectifs,learning_objectives:cfg.objectifs,commands:['start','next','previous','reset','replay','highlight','pause','set_variant'],command_schema:{highlight:{target:'repère pointable (voir reperes) ; sans target : dernière étape'}}};
  ecrire($('title'),cfg.title);ecrire($('objectifs'),cfg.objectifs.join(' · '),{vitesse:60});

  function render(){const st=cfg.steps[step];if(S.stepAt[step]==null)S.stepAt[step]=scene();S.dirty=true;
    $('step').textContent=`étape ${step+1} / ${cfg.steps.length}`;bulle($('interpretation'),st.t+(st.note?' — '+st.note:''));
    $('play').textContent=timer?'Pause':step>=cfg.steps.length-1?'Rejouer':'Lecture';
    emit(step>=cfg.steps.length-1?'finished':'running',st.t)}
  function emit(status,text){const last=step>=cfg.steps.length-1;const values={};(cfg.series||[]).forEach(se=>{values[se.key]=cfg.steps[step][se.key]});
    parent.postMessage({type:'simulation_state',simulation_id:cfg.id,student_actions:actions.slice(-12),current_state:{simulation_status:status,current_variant:'scene',variants_completed:last?['scene']:[],step,max_step:cfg.steps.length-1,scientific_interpretation:text,...values},objective_progress:step/(cfg.steps.length-1),timestamp:Date.now()},'*')}
  function stop(){if(timer){clearInterval(timer);timer=null}}
  function play(){stop();render();timer=setInterval(()=>{if(step>=cfg.steps.length-1){stop();render();return}step++;render()},5200);render()}
  function restart(){stop();step=0;S.ouvert=performance.now();S.stepAt=[0]}
  window.executeAICommand=(command,params={})=>{actions.push({action:command,step});
    if(command==='highlight'&&params&&params.target&&surligner(params.target))return;   // le professeur montre un repère
    appuyer(command);
    if(command==='next'){stop();step=Math.min(step+1,cfg.steps.length-1);render()}
    else if(command==='previous'){stop();step=Math.max(0,step-1);render()}
    else if(command==='reset'){restart();render()}
    else if(command==='highlight'){stop();step=cfg.steps.length-1;render()}
    else if(command==='pause'){stop();render()}
    else if(command==='replay'){restart();play()}
    // `start` arrive après le manifeste alors que la lecture a déjà commencé : ne pas repartir du début.
    else if(command==='start'){if(!timer){if(step>=cfg.steps.length-1)restart();play()}}
    else if(command==='set_variant'){/* une seule variante */}};
  $('play').onclick=()=>window.executeAICommand(timer?'pause':step>=cfg.steps.length-1?'replay':'start');
  $('next').onclick=()=>window.executeAICommand('next');$('previous').onclick=()=>window.executeAICommand('previous');$('reset').onclick=()=>window.executeAICommand('reset');
  addEventListener('message',e=>{const d=e.data;if(d?.type==='simulation_control'&&(!d.simulation_id||d.simulation_id===cfg.id))window.executeAICommand(d.command,d.parameters||{})});
  const manifeste=()=>{parent.postMessage({type:'simulation_manifest',simulation_id:cfg.id,capabilities:{commands:SIMULATION_CONFIG.commands,config:SIMULATION_CONFIG,command_schema:SIMULATION_CONFIG.command_schema,controls:{},reperes:listeReperes(),explication:EXPLICATION},page_text:cfg.title+' — '+cfg.steps.map(x=>x.t).join(' ')},'*');window.__SIMULATION_MANIFEST_SENT__=true};
  setTimeout(()=>{manifeste();play()},250);setTimeout(manifeste,2000);

  // ── Dessin à la craie ──────────────────────────────────────────────────
  const canvas=$('canvas'),craie=new Craie(canvas,{onresize:()=>{S.dirty=true}});
  // ── Peinture (16 novembre 2026) : verrerie, levures, mitochondries, sondes, seringues et ordinateur en couleur ;
  //    la craie garde les noms, les flèches et le graphique. ──
  const P=window.SVTPeinture;
  const Pt={
    mito(c,x,y,rx,ry,ang=0,cretes=0){c.save();c.translate(x,y);c.rotate(ang);
      const g=c.createLinearGradient(0,-ry,0,ry);g.addColorStop(0,'#f4b183');g.addColorStop(1,'#a8482a');c.fillStyle=g;c.beginPath();c.ellipse(0,0,rx,ry,0,0,Math.PI*2);c.fill();
      c.fillStyle='rgba(120,170,196,.75)';c.beginPath();c.ellipse(0,0,rx*.78,ry*.62,0,0,Math.PI*2);c.fill();
      c.strokeStyle='rgba(250,220,170,.95)';c.lineWidth=Math.max(.8,ry*.18);for(let k=0;k<cretes;k++){const px=-rx*.55+k*rx*1.1/Math.max(1,cretes-1),h=k%2?1:-1;c.beginPath();c.moveTo(px,h*ry*.62);c.lineTo(px,-h*ry*.05);c.stroke()}
      c.restore()},
    vacuole(c,x,y,r){const g=c.createRadialGradient(x-r*.3,y-r*.3,2,x,y,r);g.addColorStop(0,'rgba(200,235,255,.5)');g.addColorStop(1,'rgba(90,160,210,.32)');c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();c.strokeStyle='rgba(160,210,240,.7)';c.lineWidth=1.4;c.stroke()},
    paroi(c,x,y,r){c.save();c.strokeStyle='rgba(200,170,110,.55)';c.lineWidth=7;c.beginPath();c.arc(x,y,r+2,0,Math.PI*2);c.stroke();c.restore()},
    sonde(c,x,y0,y1,col){const k={bleu:[96,165,250],rouge:[248,113,113]}[col]||[200,200,200];c.save();const g=c.createLinearGradient(x-3,0,x+3,0);g.addColorStop(0,'#64748b');g.addColorStop(.5,'#e2e8f0');g.addColorStop(1,'#475569');
      c.fillStyle=g;c.beginPath();c.roundRect(x-3,y0,6,y1-y0,3);c.fill();c.fillStyle=P.rgba(k,1);c.beginPath();c.roundRect(x-3.5,y1-14,7,14,3);c.fill();c.restore()},
    seringue(c,x,y,w,h,k,vide){c.save();c.fillStyle='rgba(220,235,245,.18)';c.strokeStyle='rgba(220,235,245,.75)';c.lineWidth=1.4;c.beginPath();c.roundRect(x,y,w,h,3);c.fill();c.stroke();
      const n=vide?.15:.7;c.fillStyle=P.rgba(k,.75);c.fillRect(x+2,y+h*(1-n),w-4,h*n-2);
      c.fillStyle='#94a3b8';c.fillRect(x+3,y+h*(1-n)-4,w-6,4);c.fillRect(x+w/2-1.5,y-14,3,h*(1-n)+10);c.fillRect(x+w/2-7,y-16,14,3);
      c.strokeStyle='#cbd5e1';c.lineWidth=1.3;c.beginPath();c.moveTo(x+w/2,y+h);c.lineTo(x+w/2,y+h+30);c.stroke();c.restore()},
    couvercle(c,x,y,w){const g=c.createLinearGradient(0,y,0,y+6);g.addColorStop(0,'#cbd5e1');g.addColorStop(1,'#64748b');c.fillStyle=g;c.beginPath();c.roundRect(x,y,w,6,2);c.fill()},
    bouchon(c,x,y,w,h){const g=c.createLinearGradient(0,y,0,y+h);g.addColorStop(0,'#c08a52');g.addColorStop(1,'#7a4a22');c.fillStyle=g;c.beginPath();c.moveTo(x,y);c.lineTo(x+w,y);c.lineTo(x+w-6,y+h);c.lineTo(x+6,y+h);c.closePath();c.fill();
      c.fillStyle='rgba(60,30,10,.35)';for(let i=0;i<14;i++){c.beginPath();c.arc(x+8+(i*13)%(w-14),y+5+(i*7)%(h-9),1.2,0,Math.PI*2);c.fill()}},
    tube(c,pts){c.save();c.lineCap='round';c.lineJoin='round';for(const[w,col]of[[6,'rgba(220,235,245,.35)'],[2,'rgba(255,255,255,.55)']]){c.strokeStyle=col;c.lineWidth=w;c.beginPath();pts.forEach(([a,b],i)=>i?c.lineTo(a,b):c.moveTo(a,b));c.stroke()}c.restore()},
    bandelette(c,x,y,w,h,vire){c.fillStyle='#f1f5f9';c.beginPath();c.roundRect(x,y,w,h,2);c.fill();const v=Math.max(0,Math.min(1,+vire||0)),m=(a,b)=>Math.round(a+(b-a)*v);c.fillStyle=`rgb(${m(101,163)},${m(163,163)},${m(13,90)})`;c.fillRect(x+2,y+6,w-4,12)},   // vire : 0 (vert, beaucoup de glucose) → 1 (glucose diminué)
    trouble(c,x,y,w,h,a){c.save();c.globalAlpha=Math.max(0,a);const g=c.createLinearGradient(0,y,0,y+h);g.addColorStop(0,'rgba(240,245,250,.25)');g.addColorStop(1,'rgba(240,245,250,.6)');c.fillStyle=g;c.fillRect(x,y,w,h);c.restore()},
    exao(c,x,y){c.save();const g=c.createLinearGradient(0,y,0,y+30);g.addColorStop(0,'#3f3f46');g.addColorStop(1,'#18181b');c.fillStyle=g;c.beginPath();c.roundRect(x,y,70,30,5);c.fill();c.strokeStyle='rgba(250,204,21,.7)';c.lineWidth=1.2;c.stroke();
      c.fillStyle='#4ade80';c.beginPath();c.arc(x+62,y+6,2,0,Math.PI*2);c.fill();
      const m=c.createLinearGradient(0,y-14,0,y+32);m.addColorStop(0,'#52525b');m.addColorStop(1,'#27272a');c.fillStyle=m;c.beginPath();c.roundRect(x+90,y-14,62,46,5);c.fill();
      c.fillStyle='#0b2a3a';c.fillRect(x+95,y-9,52,34);c.strokeStyle='#38bdf8';c.lineWidth=1.3;c.beginPath();c.moveTo(x+98,y+4);c.lineTo(x+112,y+4);c.lineTo(x+126,y+18);c.lineTo(x+143,y+20);c.stroke();
      c.fillStyle='#52525b';c.fillRect(x+118,y+32,6,8);c.fillRect(x+104,y+39,34,3);c.restore()},
  };
  function exao(x,y){ // interface + ordinateur (peints), noms à la craie
    craie.direct(()=>Pt.exao(craie.ctx,x,y));
    craie.texte('interface',x+35,y+20,{couleur:'jaune',taille:12,align:'center'});
    craie.ligne(x+70,y+15,x+90,y+15,{couleur:'faible',largeur:1.2});
    craie.texte('ordinateur',x+121,y+58,{taille:12,align:'center'})}
  function sonde(x,yHaut,yBas,label,col){craie.direct(()=>Pt.sonde(craie.ctx,x,yHaut,yBas,col));craie.texte(label,x-8,yHaut-6,{couleur:col,taille:13})}
  function dispositif(){
    if(key==='mitochondries'){
      craie.repere('enceinte',58,142,184,168,'enceinte fermée').repere('mitochondries',78,164,144,120,'mitochondries isolées').repere('sonde_o2',94,100,32,156,'sonde O₂').repere('seringue_glucose',134,62,54,104,'seringue de glucose').repere('seringue_pyruvate',190,62,50,104,'seringue de pyruvate').repere('interface_exao',236,96,78,40,'interface EXAO').repere('ordinateur',326,80,72,84,'ordinateur');
      craie.direct(()=>{const c=craie.ctx;Pt.couvercle(c,60,146,180);P.becher(c,70,150,160,140,{niveau:.86});for(let i=0;i<24;i++)Pt.mito(c,85+(i*37)%135,175+(i*53)%100,7,3.6,i*.8)});
      craie.texte('enceinte fermée',150,310,{couleur:'blanc',taille:13,align:'center'});craie.texte('mitochondries isolées',150,280,{couleur:'vert',taille:12,align:'center'});
      sonde(110,110,250,'O₂','bleu');
      craie.direct(()=>{Pt.seringue(craie.ctx,160,80,18,50,[250,204,21],step>=1);Pt.seringue(craie.ctx,200,80,18,50,[251,146,60],step>=2)});
      craie.texte('glucose',178,74,{couleur:'jaune',taille:12,align:'right'});   // (16 novembre 2026) les deux noms ne se touchent plus
      craie.texte('pyruvate',196,74,{couleur:'orange',taille:12});
      craie.trait([[110,110],[110,60],[260,60],[260,100]],{couleur:'faible',largeur:1.2});exao(240,100);
    } else if(key==='aerobie'){
      craie.repere('bioreacteur',58,132,174,168,'bioréacteur aéré').repere('arrivee_air',18,84,72,64,'arrivée d’air').repere('sonde_o2',104,90,32,156,'sonde O₂').repere('sonde_co2',148,90,38,156,'sonde CO₂').repere('sondes',100,82,92,164,'sondes O₂ et CO₂').repere('interface_exao',236,96,78,40,'interface EXAO').repere('ordinateur',326,80,72,84,'ordinateur');
      craie.direct(()=>{const c=craie.ctx;P.becher(c,70,140,150,150,{niveau:.6,teinte:[150,170,120]});for(let i=0;i<9;i++)P.levure(c,88+(i*41)%120,222+(i*29)%50,5.5,{graine:30+i})});
      craie.texte('levures + glucose',145,308,{couleur:'blanc',taille:13,align:'center'});
      craie.fleche(30,100,78,142,{couleur:'vert',largeur:1.8}).texte('air',24,92,{couleur:'vert',taille:14});
      sonde(120,100,240,'O₂','bleu');sonde(165,100,240,'CO₂','rouge');
      craie.trait([[120,100],[120,60],[260,60],[260,100]],{couleur:'faible',largeur:1.2}).trait([[165,100],[165,72],[270,72],[270,100]],{couleur:'faible',largeur:1.2});exao(240,100);
      craie.direct(()=>{if(timer)for(let i=0;i<6;i++){const ph=(scene()*1.1+i*.4)%1;P.bulleGaz(craie.ctx,90+(i*23)%110,285-ph*75,3.2)}});
    } else if(key==='anaerobie'){
      craie.repere('flacon_ferme',62,116,136,198,'flacon fermé').repere('eau_de_chaux',232,156,78,160,'eau de chaux').repere('sonde_o2',94,80,32,166,'sonde O₂').repere('sonde_co2',124,80,40,166,'sonde CO₂').repere('interface_exao',232,14,78,40,'interface EXAO').repere('ordinateur',320,0,74,82,'ordinateur');
      if(step>=1)craie.repere('bandelette',35,175,24,70,'bandelette glucose');
      craie.direct(()=>{const c=craie.ctx;P.becher(c,70,150,120,140,{niveau:.57,teinte:[170,150,100]});for(let i=0;i<7;i++)P.levure(c,86+(i*37)%90,232+(i*23)%42,5.5,{graine:50+i,bourgeon:false});
        Pt.bouchon(c,95,120,70,30);Pt.tube(c,[[165,135],[230,135],[230,220],[262,220]]);P.becher(c,250,180,40,110,{niveau:.55,teinte:[200,215,225],alpha:.35})});
      craie.texte('bouchon',90,140,{couleur:'blanc',taille:12,align:'right'}).texte('levures + glucose',130,308,{couleur:'blanc',taille:13,align:'center'});
      craie.texte('eau de chaux',270,308,{couleur:'blanc',taille:13,align:'center'});
      craie.direct(()=>{if(timer&&step>=2)for(let i=0;i<5;i++){const ph=(scene()*1.1+i*.3)%1;P.bulleGaz(craie.ctx,262+(i*9)%22,285-ph*70,2.6)}});
      sonde(110,90,240,'O₂','bleu');sonde(140,90,240,'CO₂','rouge');
      craie.trait([[110,90],[110,64],[256,64],[256,48]],{couleur:'faible',largeur:1.2}).trait([[140,90],[140,76],[276,76],[276,48]],{couleur:'faible',largeur:1.2});exao(236,18);   // (17 novembre 2026) au-dessus de l’eau de chaux : l’écran n’empiète plus sur le graphique
      if(step>=1){craie.depuis(S.stepAt[1]);const vire=step>=2?1:Math.max(0,Math.min(1,(scene()-S.stepAt[1]-.6)/1.6));if(vire<1)S.anim=true;craie.direct(()=>Pt.bandelette(craie.ctx,40,180,14,60,vire));craie.texte('bandelette',40,258,{couleur:'jaune',taille:12,align:'center'}).texte('glucose',40,274,{couleur:'jaune',taille:12,align:'center'})}
      if(step>=2){craie.depuis(S.stepAt[2]);if(step===2&&scene()-S.stepAt[2]<1.5)S.anim=true;craie.direct(()=>Pt.trouble(craie.ctx,252,230,36,58,Math.min(1,(scene()-S.stepAt[2])/1.5)));craie.texte('trouble',270,170,{couleur:'blanc',taille:12,align:'center'})}
    }
  }
  function graphe(){
    // (17 novembre 2026) x0 400 → 432 : « 140 » / « 300 » touchaient l’écran de l’ordinateur
    const A=cfg.axes,x0=432,x1=722,y0=300,y1=90,n=cfg.steps.length;const px=i=>x0+(x1-x0)*(n>1?i/(n-1):0),py=v=>y0-(y0-y1)*Math.max(0,Math.min(1,(v||0)/A.max));
    craie.repere('graphe',x0-36,y1-72,x1-x0+60,y0-y1+106,'courbes').repere('axe_temps',x0,y0-4,x1-x0+30,34,'axe des temps').repere('axe_concentration',x0-30,y1-30,34,y0-y1+36,'axe des concentrations');
    craie.axe(x0,y0,x1+20,y0,[],{}).axe(x0,y0,x0,y1-15,[],{});
    craie.texte('0',x0-10,y0+5,{couleur:'blanc',taille:13,align:'right'}).texte(String(A.max),x0-10,y1+5,{couleur:'blanc',taille:13,align:'right'}).texte(A.x,(x0+x1)/2,y0+26,{couleur:'blanc',taille:13,align:'center'}).texte(A.y,x0-6,y1-34,{couleur:'blanc',taille:13});
    cfg.series.forEach((se,i)=>{craie.ligne(x1-280+i*85,y1-58,x1-256+i*85,y1-58,{couleur:se.couleur,largeur:2.5}).texte(se.label,x1-250+i*85,y1-53,{couleur:se.couleur,taille:14})});
    for(let i=1;i<=step;i++){craie.depuis(S.stepAt[i]);
      for(const se of cfg.series)craie.ligne(px(i-1),py(cfg.steps[i-1][se.key]),px(i),py(cfg.steps[i][se.key]),{couleur:se.couleur,largeur:2.6,tremble:.5});
      const st=cfg.steps[i];if(st.tag){craie.ligne(px(i),y1-6,px(i),y0,{couleur:'jaune',largeur:1,pointille:[4,4]}).texte(st.tag,px(i),y1-14,{couleur:'jaune',taille:13,align:'center'})}}
    if(step===0){craie.pause(.2);for(const se of cfg.series)craie.point(px(0),py(cfg.steps[0][se.key]),4,se.couleur)}
  }
  function cellule(cx,cy,titre,aerobie){
    // (16 novembre 2026) la levure PEINTE : paroi, hyaloplasme, noyau ; mitochondries allongées à crêtes (aérobiose) ou vacuoles et rares petites mitochondries (anaérobiose)
    craie.direct(()=>{const c=craie.ctx,a=Math.min(1,scene()/.8);c.save();c.globalAlpha=a;
      Pt.paroi(c,cx,cy,110);P.cellule(c,cx,cy,106,106,{noyau:{x:cx+40,y:cy+40,r:26},grains:110,graine:cx});
      if(aerobie){for(let i=0;i<7;i++){const t=i*.9+.3;Pt.mito(c,cx+72*Math.cos(t),cy+66*Math.sin(t),22,9,0,3)}}
      else{Pt.vacuole(c,cx-30,cy-20,42);Pt.vacuole(c,cx+30,cy-55,26);Pt.vacuole(c,cx-55,cy+50,24);Pt.mito(c,cx+70,cy-15,10,5,0,1);Pt.mito(c,cx+4,cy+82,9,4.5,0,1)}
      c.restore()});
    craie.texte(titre,cx,cy-128,{couleur:'jaune',taille:16,align:'center'});
    craie.texte('noyau',cx+40,cy+80,{couleur:'violet',taille:12,align:'center'});
  }
  function draw(){const W=craie.W,H=craie.H;if(W<1||H<1)return true;S.anim=false;craie.debut(3,scene());const c=craie.ctx,s=Math.min(W/760,H/380);c.translate((W-760*s)/2,(H-380*s)/2);c.scale(s,s);craie.echelle=s;craie.tailleMin=15;
    if(key==='levures'){craie.repere('cellule_aerobie',84,80,232,244,'levure en aérobiose').repere('cellule_anaerobie',444,80,232,244,'levure en anaérobiose').repere('mitochondries',100,110,200,180,'mitochondries').repere('vacuoles',478,116,142,162,'vacuoles');if(step>=3)craie.repere('conclusion',40,354,680,26,'conclusion');
      cellule(200,200,'Aérobiose',true);cellule(560,200,'Anaérobiose',false);
      if(step>=1){craie.depuis(S.stepAt[1]);craie.texte('mitochondries allongées, crêtes développées',200,345,{couleur:'rouge',taille:13,align:'center',max:300})}
      if(step>=2){craie.depuis(S.stepAt[2]);craie.texte('grandes vacuoles',380,108,{couleur:'cyan',taille:13,align:'center'}).fleche(410,116,512,168,{couleur:'cyan',largeur:1.3}).texte('rares petites mitochondries',560,345,{couleur:'rouge',taille:13,align:'center',max:300})}
      if(step>=3){craie.depuis(S.stepAt[3]);craie.texte('respiration ↔ mitochondries ; fermentation dans le hyaloplasme',380,372,{couleur:'vert',taille:15,align:'center',max:700})}
    } else {dispositif();graphe()}
    craie.direct(()=>craie.texte(`étape ${step+1}/${cfg.steps.length}`,740,acquisition?372:24,{couleur:'cyan',taille:14,align:'right'}));   // sous le graphique : il était dans la légende
    return craie.fin()&&!S.anim}
  function frame(){if(S.dirty||timer)S.dirty=!draw();requestAnimationFrame(frame)}
  requestAnimationFrame(frame);
})();
</script>
