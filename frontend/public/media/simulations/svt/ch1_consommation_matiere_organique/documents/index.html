<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Documents EXAO — au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css">
<style>
  .titre h1 { font-size: 1.25em; }
  #step { color: var(--cyan); }
</style>
</head>
<body>
<div class="tableau">
  <header class="titre"><div><small>SVT · 2 BAC · document d’étude</small><h1 id="title"></h1><p class="objectif" id="objectifs"></p></div></header>
  <section class="scene"><canvas id="canvas" role="img" aria-label="Dispositif expérimental et courbes, dessinés à la craie étape par étape"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="play" data-professor-control="start pause replay">Pause</button>
    <button class="craie-btn secondaire" id="previous" data-professor-control="previous">← Précédent</button>
    <button class="craie-btn secondaire" id="next" data-professor-control="next">Suivant →</button>
    <button class="craie-btn secondaire" id="reset" data-professor-control="reset">Recommencer</button>
    <p class="bulle" id="interpretation" role="status" aria-live="polite"></p>
    <span class="lecture" id="step"></span>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script>
(() => {
  const { Craie, ecrire, bulle, appuyer, surligner, listeReperes, explication } = window.Tableau;
  const key=new URLSearchParams(location.search).get('scene')||'mitochondries';
  // Chaque étape porte ses valeurs mesurées : la courbe est tracée à partir d'elles.
  const scenes={
    mitochondries:{id:'svt_ch1_mitochondries_isolees',title:'Document 6 — mitochondries isolées et nature du substrat',objectifs:['Décrire le montage','Déduire le substrat utilisé par la mitochondrie'],axes:{x:'temps (min)',y:'[O₂] (µmol/L)',max:140},series:[{key:'o2',label:'O₂',couleur:'bleu'}],
      steps:[{t:'Enceinte fermée : [O₂] stable avant toute injection',o2:120},{t:'Injection de glucose à t₁ : aucune variation de [O₂]',o2:120,tag:'glucose'},{t:'Injection de pyruvate à t₂ : la consommation d’O₂ démarre',o2:120,tag:'pyruvate'},{t:'Les mitochondries isolées utilisent le pyruvate, pas directement le glucose',o2:55}]},
    aerobie:{id:'svt_ch1_exao_aerobie',title:'Document 1 — respiration des levures en aérobiose',objectifs:['Décrire le protocole EXAO','Interpréter les échanges gazeux'],axes:{x:'temps (min)',y:'concentration (µmol/L)',max:300},series:[{key:'o2',label:'O₂',couleur:'bleu'},{key:'co2',label:'CO₂',couleur:'rouge'}],
      steps:[{t:'Avant le glucose : O₂ et CO₂ restent stables',o2:270,co2:25},{t:'Injection de glucose : la respiration démarre',o2:245,co2:50,tag:'glucose'},{t:'Les levures consomment O₂ et rejettent CO₂',o2:150,co2:170},{t:'Respiration aérobie : oxydation complète du glucose',o2:80,co2:280}]},
    anaerobie:{id:'svt_ch1_fermentation_anaerobie',title:'Document 2 — fermentation des levures en anaérobiose',objectifs:['Décrire le montage anaérobie','Identifier les produits de la fermentation'],axes:{x:'temps (s)',y:'concentration (mg/L)',max:300},series:[{key:'o2',label:'O₂',couleur:'bleu'},{key:'co2',label:'CO₂',couleur:'rouge'},{key:'ethanol',label:'Éthanol',couleur:'orange'}],
      steps:[{t:'Le flacon est fermé : le dioxygène devient rapidement nul',o2:12,co2:25,ethanol:0},{t:'Le glucose est consommé malgré l’absence de O₂',o2:0,co2:90,ethanol:35,tag:'O₂ épuisé',note:'Bandelette réactive : le glucose du milieu diminue'},{t:'CO₂ trouble l’eau de chaux et l’éthanol s’accumule',o2:0,co2:190,ethanol:110,note:'Eau de chaux troublée → CO₂ identifié'},{t:'Fermentation alcoolique : glucose → éthanol + CO₂ + 2 ATP',o2:0,co2:260,ethanol:200}]},
    levures:{id:'svt_ch1_levures_comparaison',title:'Document 3 — métabolisme et équipement mitochondrial',objectifs:['Comparer deux cultures','Relier métabolisme et présence de mitochondries'],
      steps:[{t:'Deux cellules de levure de taille comparable'},{t:'Aérobiose : nombreuses mitochondries allongées à crêtes développées',left:1,row:1},{t:'Anaérobiose : grandes vacuoles et rares petites mitochondries',left:1,right:1,row:2},{t:'La respiration est liée aux mitochondries ; la fermentation se déroule dans le hyaloplasme',left:1,right:1,row:2}]}
  };
  const cfg=scenes[key]||scenes.mitochondries;const acquisition=!!cfg.axes;
  // Script d'explication de la scène : le tuteur dit chaque phrase pendant que le professeur montre le repère.
  const SCRIPTS={
    mitochondries:[{repere:'enceinte',texte:'Des mitochondries isolées sont placées dans une enceinte fermée, avec une sonde à dioxygène.'},{repere:'seringue_glucose',texte:'On injecte d’abord du glucose : la concentration en O₂ ne bouge pas.'},{repere:'seringue_pyruvate',texte:'On injecte ensuite du pyruvate : l’O₂ est aussitôt consommé.'},{repere:'graphe',texte:'La mitochondrie n’utilise donc pas le glucose directement, mais le pyruvate issu de la glycolyse du cytoplasme.'}],
    aerobie:[{repere:'bioreacteur',texte:'Des levures en suspension reçoivent de l’air : le milieu est aéré.'},{repere:'sonde_o2',texte:'Deux sondes suivent O₂ et CO₂ dissous, reliées à l’interface EXAO.'},{repere:'graphe',texte:'Dès l’injection de glucose, O₂ diminue et CO₂ augmente : les levures respirent.'},{repere:'ordinateur',texte:'L’ordinateur trace les courbes en temps réel : c’est l’intérêt de l’EXAO.'}],
    anaerobie:[{repere:'flacon_ferme',texte:'Le flacon est bouché : le dioxygène dissous s’épuise rapidement.'},{repere:'bandelette',texte:'La bandelette montre que le glucose est quand même consommé.'},{repere:'eau_de_chaux',texte:'Le gaz dégagé trouble l’eau de chaux : c’est du CO₂.'},{repere:'graphe',texte:'Sans O₂, l’éthanol s’accumule : fermentation alcoolique, glucose → éthanol + CO₂ + 2 ATP.'}],
    levures:[{repere:'cellule_aerobie',texte:'En aérobiose, la levure possède de nombreuses mitochondries allongées, aux crêtes développées.'},{repere:'cellule_anaerobie',texte:'En anaérobiose, elle a de grandes vacuoles et seulement de rares petites mitochondries.'},{repere:'conclusion',texte:'La respiration dépend des mitochondries ; la fermentation se déroule dans le hyaloplasme.'}],
  };
  const EXPLICATION={scene:SCRIPTS[key]||SCRIPTS.mitochondries};explication(EXPLICATION);
  let step=0,timer=null;const actions=[];const S={ouvert:performance.now(),stepAt:[0],dirty:true};
  const $=id=>document.getElementById(id);const scene=()=>(performance.now()-S.ouvert)/1000;
  window.SIMULATION_CONFIG={id:cfg.id,title:cfg.title,variants:[{id:'scene',label:'Scène'}],objectives:cfg.objectifs,learning_objectives:cfg.objectifs,commands:['start','next','previous','reset','replay','highlight','pause','set_variant'],command_schema:{highlight:{target:'repère pointable (voir reperes) ; sans target : dernière étape'}}};
  ecrire($('title'),cfg.title);ecrire($('objectifs'),cfg.objectifs.join(' · '),{vitesse:60});

  function render(){const st=cfg.steps[step];if(S.stepAt[step]==null)S.stepAt[step]=scene();S.dirty=true;
    $('step').textContent=`étape ${step+1} / ${cfg.steps.length}`;bulle($('interpretation'),st.t+(st.note?' — '+st.note:''));
    $('play').textContent=timer?'Pause':step>=cfg.steps.length-1?'Rejouer':'Lecture';
    emit(step>=cfg.steps.length-1?'finished':'running',st.t)}
  function emit(status,text){const last=step>=cfg.steps.length-1;const values={};(cfg.series||[]).forEach(se=>{values[se.key]=cfg.steps[step][se.key]});
    parent.postMessage({type:'simulation_state',simulation_id:cfg.id,student_actions:actions.slice(-12),current_state:{simulation_status:status,current_variant:'scene',variants_completed:last?['scene']:[],step,max_step:cfg.steps.length-1,scientific_interpretation:text,...values},objective_progress:step/(cfg.steps.length-1),timestamp:Date.now()},'*')}
  function stop(){if(timer){clearInterval(timer);timer=null}}
  function play(){stop();render();timer=setInterval(()=>{if(step>=cfg.steps.length-1){stop();render();return}step++;render()},5200);render()}
  function restart(){stop();step=0;S.ouvert=performance.now();S.stepAt=[0]}
  window.executeAICommand=(command,params={})=>{actions.push({action:command,step});
    if(command==='highlight'&&params&&params.target&&surligner(params.target))return;   // le professeur montre un repère
    appuyer(command);
    if(command==='next'){stop();step=Math.min(step+1,cfg.steps.length-1);render()}
    else if(command==='previous'){stop();step=Math.max(0,step-1);render()}
    else if(command==='reset'){restart();render()}
    else if(command==='highlight'){stop();step=cfg.steps.length-1;render()}
    else if(command==='pause'){stop();render()}
    else if(command==='replay'){restart();play()}
    // `start` arrive après le manifeste alors que la lecture a déjà commencé : ne pas repartir du début.
    else if(command==='start'){if(!timer){if(step>=cfg.steps.length-1)restart();play()}}
    else if(command==='set_variant'){/* une seule variante */}};
  $('play').onclick=()=>window.executeAICommand(timer?'pause':step>=cfg.steps.length-1?'replay':'start');
  $('next').onclick=()=>window.executeAICommand('next');$('previous').onclick=()=>window.executeAICommand('previous');$('reset').onclick=()=>window.executeAICommand('reset');
  addEventListener('message',e=>{const d=e.data;if(d?.type==='simulation_control'&&(!d.simulation_id||d.simulation_id===cfg.id))window.executeAICommand(d.command,d.parameters||{})});
  const manifeste=()=>{parent.postMessage({type:'simulation_manifest',simulation_id:cfg.id,capabilities:{commands:SIMULATION_CONFIG.commands,config:SIMULATION_CONFIG,command_schema:SIMULATION_CONFIG.command_schema,controls:{},reperes:listeReperes(),explication:EXPLICATION},page_text:cfg.title+' — '+cfg.steps.map(x=>x.t).join(' ')},'*');window.__SIMULATION_MANIFEST_SENT__=true};
  setTimeout(()=>{manifeste();play()},250);setTimeout(manifeste,2000);

  // ── Dessin à la craie ──────────────────────────────────────────────────
  const canvas=$('canvas'),craie=new Craie(canvas,{onresize:()=>{S.dirty=true}});
  function exao(x,y){ // interface + ordinateur
    craie.rect(x,y,70,30,{arrondi:5,couleur:'jaune'}).texte('interface',x+35,y+20,{couleur:'jaune',taille:12,align:'center'});
    craie.ligne(x+70,y+15,x+90,y+15,{couleur:'faible',largeur:1.2});
    craie.rect(x+90,y-14,62,46,{arrondi:5}).ligne(x+104,y+40,x+138,y+40,{largeur:2}).ligne(x+121,y+32,x+121,y+40,{largeur:2}).texte('ordinateur',x+121,y+58,{taille:12,align:'center'})}
  function sonde(x,yHaut,yBas,label,col){craie.ligne(x,yHaut,x,yBas,{couleur:col,largeur:3}).texte(label,x-8,yHaut-6,{couleur:col,taille:13})}
  function dispositif(){
    if(key==='mitochondries'){
      craie.repere('enceinte',58,142,184,168,'enceinte fermée').repere('mitochondries',78,164,144,120,'mitochondries isolées').repere('sonde_o2',94,100,32,156,'sonde O₂').repere('seringue_glucose',152,62,34,102,'seringue de glucose').repere('seringue_pyruvate',192,62,38,102,'seringue de pyruvate').repere('interface_exao',236,96,78,40,'interface EXAO').repere('ordinateur',326,82,70,76,'ordinateur');
      craie.trait([[70,150],[70,290],[230,290],[230,150]],{largeur:2.6}).ligne(60,150,240,150,{largeur:2}).texte('enceinte fermée',150,310,{couleur:'faible',taille:13,align:'center'});
      craie.direct(()=>{for(let i=0;i<24;i++)craie.cercle(85+(i*37)%135,175+(i*53)%100,3,{couleur:'vert',largeur:1,tremble:0})});craie.texte('mitochondries isolées',150,280,{couleur:'vert',taille:12,align:'center'});
      sonde(110,110,250,'O₂','bleu');
      craie.rect(160,80,18,50,{arrondi:3,couleur:'jaune'}).ligne(169,130,169,160,{couleur:'jaune',largeur:2}).texte('glucose',169,72,{couleur:'jaune',taille:12,align:'center'});
      craie.rect(200,80,18,50,{arrondi:3,couleur:'orange'}).ligne(209,130,209,160,{couleur:'orange',largeur:2}).texte('pyruvate',214,72,{couleur:'orange',taille:12,align:'center'});
      craie.trait([[110,110],[110,60],[260,60],[260,100]],{couleur:'faible',largeur:1.2});exao(240,100);
    } else if(key==='aerobie'){
      craie.repere('bioreacteur',58,132,174,168,'bioréacteur aéré').repere('arrivee_air',18,84,72,64,'arrivée d’air').repere('sonde_o2',104,90,32,156,'sonde O₂').repere('sonde_co2',148,90,38,156,'sonde CO₂').repere('interface_exao',236,96,78,40,'interface EXAO').repere('ordinateur',326,82,70,76,'ordinateur');
      craie.trait([[70,140],[70,290],[220,290],[220,140]],{largeur:2.6}).ligne(60,140,230,140,{largeur:2}).ligne(72,200,218,200,{couleur:'cyan',largeur:1.2,pointille:[6,5]}).texte('levures + glucose',145,278,{couleur:'faible',taille:12,align:'center'});
      craie.fleche(30,100,78,142,{couleur:'vert',largeur:1.8}).texte('air',24,92,{couleur:'vert',taille:14});
      sonde(120,100,240,'O₂','bleu');sonde(165,100,240,'CO₂','rouge');
      craie.trait([[120,100],[120,60],[260,60],[260,100]],{couleur:'faible',largeur:1.2}).trait([[165,100],[165,72],[270,72],[270,100]],{couleur:'faible',largeur:1.2});exao(240,100);
      craie.direct(()=>{if(timer)for(let i=0;i<6;i++){const ph=(scene()*1.1+i*.4)%1;craie.cercle(90+(i*23)%110,285-ph*75,3,{couleur:'cyan',largeur:1,tremble:0})}});
    } else if(key==='anaerobie'){
      craie.repere('flacon_ferme',58,108,144,192,'flacon fermé').repere('eau_de_chaux',238,168,64,146,'eau de chaux').repere('sonde_o2',94,80,32,166,'sonde O₂').repere('sonde_co2',124,80,40,166,'sonde CO₂').repere('interface_exao',306,96,78,40,'interface EXAO').repere('ordinateur',396,82,70,76,'ordinateur');
      if(step>=1)craie.repere('bandelette',32,172,34,88,'bandelette glucose');
      craie.trait([[70,150],[70,290],[190,290],[190,150]],{largeur:2.6}).rect(95,120,70,30,{arrondi:4}).texte('bouchon',130,112,{couleur:'faible',taille:12,align:'center'}).ligne(72,210,188,210,{couleur:'cyan',largeur:1.2,pointille:[6,5]}).texte('levures + glucose',130,278,{couleur:'faible',taille:12,align:'center'});
      craie.trait([[165,135],[230,135],[230,220],[262,220]],{couleur:'faible',largeur:2}).trait([[250,180],[250,290],[290,290],[290,180]],{largeur:2.2}).texte('eau de chaux',270,305,{couleur:'faible',taille:12,align:'center'});
      craie.direct(()=>{if(timer&&step>=2)for(let i=0;i<5;i++){const ph=(scene()*1.1+i*.3)%1;craie.cercle(262+(i*9)%22,285-ph*70,2.5,{couleur:'blanc',largeur:1,tremble:0})}});
      sonde(110,90,240,'O₂','bleu');sonde(140,90,240,'CO₂','rouge');
      craie.trait([[110,90],[110,60],[330,60],[330,100]],{couleur:'faible',largeur:1.2}).trait([[140,90],[140,74],[340,74],[340,100]],{couleur:'faible',largeur:1.2});exao(310,100);
      if(step>=1){craie.depuis(S.stepAt[1]);craie.rect(40,180,14,60,{couleur:'jaune',arrondi:2}).texte('bandelette glucose',47,255,{couleur:'jaune',taille:11,align:'center'})}
      if(step>=2){craie.depuis(S.stepAt[2]);craie.direct(()=>{craie.ctx.globalAlpha=.3;craie.ctx.fillStyle='#fff';craie.ctx.fillRect(252,230,36,58);craie.ctx.globalAlpha=1});craie.texte('trouble',270,170,{couleur:'blanc',taille:12,align:'center'})}
    }
  }
  function graphe(){
    const A=cfg.axes,x0=400,x1=700,y0=300,y1=90,n=cfg.steps.length;const px=i=>x0+(x1-x0)*(n>1?i/(n-1):0),py=v=>y0-(y0-y1)*Math.max(0,Math.min(1,(v||0)/A.max));
    craie.repere('graphe',x0-16,y1-58,x1-x0+50,y0-y1+90,'courbes').repere('axe_temps',x0,y0-4,x1-x0+30,34,'axe des temps').repere('axe_concentration',x0-30,y1-30,34,y0-y1+36,'axe des concentrations');
    craie.axe(x0,y0,x1+20,y0,[],{}).axe(x0,y0,x0,y1-15,[],{});
    craie.texte('0',x0-10,y0+5,{couleur:'faible',taille:13,align:'right'}).texte(String(A.max),x0-10,y1+5,{couleur:'faible',taille:13,align:'right'}).texte(A.x,(x0+x1)/2,y0+26,{couleur:'faible',taille:13,align:'center'}).texte(A.y,x0,y1-24,{couleur:'faible',taille:13});
    cfg.series.forEach((se,i)=>{craie.ligne(x0+30+i*90,y1-40,x0+54+i*90,y1-40,{couleur:se.couleur,largeur:2.5}).texte(se.label,x0+60+i*90,y1-35,{couleur:se.couleur,taille:13})});
    for(let i=1;i<=step;i++){craie.depuis(S.stepAt[i]);
      for(const se of cfg.series)craie.ligne(px(i-1),py(cfg.steps[i-1][se.key]),px(i),py(cfg.steps[i][se.key]),{couleur:se.couleur,largeur:2.6,tremble:.5});
      const st=cfg.steps[i];if(st.tag){craie.ligne(px(i),y1-6,px(i),y0,{couleur:'jaune',largeur:1,pointille:[4,4]}).texte(st.tag,px(i),y1-14,{couleur:'jaune',taille:13,align:'center'})}}
    if(step===0){craie.pause(.2);for(const se of cfg.series)craie.point(px(0),py(cfg.steps[0][se.key]),4,se.couleur)}
  }
  function cellule(cx,cy,titre,aerobie){
    craie.cercle(cx,cy,110,{largeur:2.6,depart:.4}).texte(titre,cx,cy-128,{couleur:'jaune',taille:16,align:'center'});
    craie.cercle(cx+40,cy+40,26,{couleur:'violet',largeur:1.8,fond:'violet',fondAlpha:.1}).texte('noyau',cx+40,cy+80,{couleur:'violet',taille:12,align:'center'});
    if(aerobie){for(let i=0;i<7;i++){const a=i*.9+.3,mx=cx+72*Math.cos(a),my=cy+66*Math.sin(a);craie.rect(mx-22,my-9,44,18,{couleur:'rouge',arrondi:9,largeur:1.6});craie.ligne(mx-10,my-9,mx-10,my+2,{couleur:'rouge',largeur:1});craie.ligne(mx,my+9,mx,my-2,{couleur:'rouge',largeur:1});craie.ligne(mx+10,my-9,mx+10,my+2,{couleur:'rouge',largeur:1})}}
    else{craie.cercle(cx-30,cy-20,42,{couleur:'cyan',largeur:1.8}).cercle(cx+30,cy-55,26,{couleur:'cyan',largeur:1.8}).cercle(cx-55,cy+50,24,{couleur:'cyan',largeur:1.8});craie.rect(cx+60,cy-20,20,10,{couleur:'rouge',arrondi:5,largeur:1.4}).rect(cx-5,cy+78,18,9,{couleur:'rouge',arrondi:5,largeur:1.4})}
  }
  function draw(){const W=craie.W,H=craie.H;if(W<1||H<1)return true;craie.debut(3,scene());const c=craie.ctx,s=Math.min(W/760,H/380);c.translate((W-760*s)/2,(H-380*s)/2);c.scale(s,s);
    if(key==='levures'){craie.repere('cellule_aerobie',86,70,228,262,'levure en aérobiose').repere('cellule_anaerobie',446,70,228,262,'levure en anaérobiose').repere('mitochondries',100,110,200,180,'mitochondries').repere('vacuoles',474,118,116,124,'vacuoles');if(step>=3)craie.repere('conclusion',40,354,680,26,'conclusion');
      cellule(200,200,'Aérobiose',true);cellule(560,200,'Anaérobiose',false);
      if(step>=1){craie.depuis(S.stepAt[1]);craie.texte('mitochondries allongées, crêtes développées',200,345,{couleur:'rouge',taille:13,align:'center',max:300})}
      if(step>=2){craie.depuis(S.stepAt[2]);craie.texte('grandes vacuoles',500,110,{couleur:'cyan',taille:13}).texte('rares petites mitochondries',560,345,{couleur:'rouge',taille:13,align:'center',max:300})}
      if(step>=3){craie.depuis(S.stepAt[3]);craie.texte('respiration ↔ mitochondries ; fermentation dans le hyaloplasme',380,372,{couleur:'vert',taille:15,align:'center',max:700})}
    } else {dispositif();graphe()}
    craie.direct(()=>craie.texte(`étape ${step+1}/${cfg.steps.length}`,740,24,{couleur:'cyan',taille:14,align:'right'}));
    return craie.fin()}
  function frame(){if(S.dirty||timer)S.dirty=!draw();requestAnimationFrame(frame)}
  requestAnimationFrame(frame);
})();
</script>
<script src="/media/simulations/professor-locate.js" defer></script>
</body>
</html>
