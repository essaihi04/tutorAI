    <button class="craie-btn principal" id="run" data-professor-control="start reset pause resume play_until set_time">Lancer</button>

</div>

<script>
/*
 * Le national joué au tableau, cours SVT « Libération de l’énergie » (2ᵉ passe, 18 novembre 2026 ; règles 33, 35 et 41
 * du professeur, règle 14 de simulations-au-tableau). Un exercice d’examen n’est pas montré fini : le document naît de
 * l’animation, une étape par moment, puis le tableau ; la correction de chaque consigne reste cachée tant que l’élève
 * n’a pas répondu.
 *   ?vue=sportifs    : examen 2016 N, documents 1 et 2 — personne entraînée / non entraînée, même effort :
 *                      O₂ consommé 5,5 / 2,5 L/min, acide lactique 6 / 12 mmol/L, mitochondries 11 % / 5 % du volume
 *                      de la cellule, enzymes mitochondriales importante / faible ; puis le tableau, la comparaison du
 *                      barème, l’explication de la fatigabilité.
 *                      Moments : effort 2,6 ; o2 6 ; lactique 9,4 ; mitochondries 12,8 ; tableau 16 ; comparaison 19,6 ;
 *                      explication 24.
 *   ?vue=restitution : examen 2024 R (définir la fermentation lactique ; sens des protons) et 2022 N (QCM 1).
 *                      Moments : cadres 2,4 ; nature 4,6 ; lieu 6,6 ; produit 8,6 ; phrase 10,6 ; membrane 13,6 ;
 *                      fleche_chaine 16 ; fleche_sphere 18,4 ; qcm 21,4 ; elimine_a 23,6 ; elimine_c 25,4 ;
 *                      elimine_d 27 ; bonne 28,6.
 *   ?vue=levures     : deux cultures de levures avec et sans O₂ : glucose consommé 150 g / 45 g, levures formées
 *                      1,970 g / 0,255 g, éthanol absent / présent ; puis le tableau et le rapport par gramme de glucose.
 *                      Moments : flacons 2,4 ; aerobie 7 ; anaerobie 11 ; tableau 14,6 ; rapport 18.
 *   ?vue=marquage    : glucose marqué au ¹⁴C suivi de T0 à T4 (milieu extracellulaire, hyaloplasme, mitochondrie) ;
 *                      les molécules radioactives bougent, les « + » s’écrivent, puis le tableau.
 *                      Moments : t0 2,4 ; t1 5 ; t2 7,6 ; t3 10,2 ; t4 12,8 ; tableau 16.
 *   ?vue=reactions   : examen 2020 R, restitution III — relier la glycolyse, le cycle de Krebs, la fermentation lactique et
 *                      la fermentation alcoolique aux réactions bilans a à e (d est l’intrus) ; ce que donne chaque réaction
 *                      est souligné, puis le lien est tracé ; la réponse comme le barème.
 *                      Moments : enonce 2 ; phenomenes 4 ; reactions 7,6 ; a_produit 10 ; a_lien 12 ; b_produit 14 ;
 *                      b_lien 16 ; c_produit 18 ; c_lien 20 ; de_produit 22,4 ; e_lien 24,6 ; couples 27.
 * Options : ?depart=<moment> (la page s’ouvre figée sur ce moment, ce qui précède déjà au tableau) ;
 *           ?cacher=<moment> : ce moment et tout ce qui le suit ne s’écrivent pas (la correction attend la réponse de
 *           l’élève) ; set_parameters {conclusions: true} les montre, {conclusions: false} les cache de nouveau.
 * Page nouvelle : aucune diapositive du cours en ligne ne l’utilise.
 * Repères calculés (déclarés ici en toutes lettres pour le contrôle voix ↔ simulation) : sportifs 'muscle_A', 'muscle_B',
 * 'o2_A', 'o2_B', 'lac_A', 'lac_B', 'fibre_A', 'fibre_B', 'tableau', 'ligne_mito', 'ligne_enz', 'ligne_o2', 'ligne_lact',
 * 'comparaison', 'explication' ; restitution 'enonce', 'cadre_nature', 'cadre_lieu', 'cadre_produit', 'phrase', 'membrane',
 * 'chaine', 'sphere', 'fleche_chaine', 'fleche_sphere', 'prop_a', 'prop_b', 'prop_c', 'prop_d', 'qcm' ; levures
 * 'flacon_aero', 'flacon_anaero', 'mesures_aero', 'mesures_anaero', 'ethanol', 'tableau', 'rapport' ; marquage 'milieu',
 * 'hyaloplasme', 'mitochondrie', 'lecture', 'tableau' ; reactions 'enonce', 'phenomenes', 'phen_1', 'phen_2', 'phen_3',
 * 'phen_4', 'reactions', 'reac_a', 'reac_b', 'reac_c', 'reac_d', 'reac_e', 'produit_a', 'produit_b', 'produit_c', 'produit_d',
 * 'produit_e', 'lien_a', 'lien_b', 'lien_c', 'lien_d', 'lien_e', 'couples'.
 */
const { bulle, protocole } = window.Tableau;
const { Scene, Chrono, Apparitions, Allumage, fr, doux, mix } = window.SVTTableau;
const P = window.SVTPeinture, TAU = Math.PI * 2;
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const VUE = Q.get('vue') || 'sportifs';
const CACHER = Q.get('cacher');
const R = { conclusions: !CACHER };
let TK = 1;
const tk = v => Math.round(v * TK);

/* Le découpage d’un texte en lignes qui tiennent dans une largeur (mesuré avec le kit). */
function couper(c, s, w, taille) {
  const mots = s.split(' '), lignes = []; let cur = '';
  for (const m of mots) { const e = cur ? cur + ' ' + m : m; if (c.largeurTexte(e, taille) > w && cur) { lignes.push(cur); cur = m; } else cur = e; }
  if (cur) lignes.push(cur);
  return lignes;
}

/* Petit muscle peint (règle 32 ; même peinture que le cours du muscle). f : 0 au repos, 1 contracté. */
function peindreMuscle(ctx, x, yc, H, W, f) {
  const L = (H - 20) * (1 - 0.12 * f), Wd = W * (1 + 0.14 * f), y1 = yc - L / 2, y2 = yc + L / 2;
  const tendon = (ya, yb) => { const g = ctx.createLinearGradient(x - 4, 0, x + 4, 0); g.addColorStop(0, '#bdb8ae'); g.addColorStop(.5, '#ffffff'); g.addColorStop(1, '#cbc5ba'); ctx.fillStyle = g; ctx.fillRect(x - 3, Math.min(ya, yb), 6, Math.abs(yb - ya)); };
  tendon(yc - H / 2, y1 + 3); tendon(y2 - 3, yc + H / 2);
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 5; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
  const g = ctx.createLinearGradient(x - Wd / 2, 0, x + Wd / 2, 0);
  g.addColorStop(0, '#7a1626'); g.addColorStop(.3, '#c23a4a'); g.addColorStop(.45, '#e0707a'); g.addColorStop(.7, '#b83242'); g.addColorStop(1, '#6d1220');
  ctx.beginPath(); ctx.moveTo(x - 4, y1); ctx.bezierCurveTo(x - Wd * .62, y1 + L * .25, x - Wd * .58, y1 + L * .7, x - 4, y2); ctx.lineTo(x + 4, y2);
  ctx.bezierCurveTo(x + Wd * .58, y1 + L * .7, x + Wd * .62, y1 + L * .25, x + 4, y1); ctx.closePath(); ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(255,200,205,.25)'; ctx.lineWidth = 1;   // les fibres
  for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(x + k * Wd * .08, y1 + 6); ctx.quadraticCurveTo(x + k * Wd * .16, yc, x + k * Wd * .08, y2 - 6); ctx.stroke(); }
  ctx.restore();
}

/* Un tableau écrit à la craie, une ligne à la fois. lignes[0] = en-têtes ; quand[r] = instant d’apparition de la ligne r. */
function tableau(c, ecrit, cle, x0, y0, cw, hl, lignes, quand, t, couleurs) {
  const w = cw.reduce((a, b) => a + b, 0), xs = cw.reduce((a, v, i) => (a.push(i ? a[i - 1] + cw[i - 1] : x0), a), []);
  lignes.forEach((ln, r) => {
    if (t < quand[r]) return;
    const y = y0 + r * hl;
    ecrit.ecrire(c, cle + r, () => {
      c.ligne(x0, y + hl - 4, x0 + w, y + hl - 4, { couleur: 'tresfaible', largeur: 1.2, duree: .15 });
      ln.forEach((s, j) => {
        const taille = tk(r === 0 ? 17 : 18), morceaux = String(s).split('\n');
        morceaux.forEach((m, k) => c.texte(m, xs[j] + cw[j] / 2, y + hl / 2 + 6 + (k - (morceaux.length - 1) / 2) * tk(21), { couleur: r === 0 ? 'blanc' : (couleurs ? couleurs(r, j) : 'blanc'), taille, align: 'center', max: cw[j] - 8, gras: r > 0 && j > 0 }));
      });
    });
  });
  return { x0, y0, w, xs };
}

/* ── Vues ── */
const V = {};

/* ─── 2016 N, documents 1 et 2 : entraînée / non entraînée ─── */
V.sportifs = (() => {
  const M = { effort: 2.6, o2: 6, lactique: 9.4, mitochondries: 12.8, tableau: 16, comparaison: 19.6, explication: 24 }, FIN = 24.4;
  const MOTIFS = { effort: 'deux personnes, le même effort', o2: 'O₂ consommé : 5,5 L/min (entraînée), 2,5 L/min (non entraînée)',
    lactique: 'acide lactique : 6 mmol/L (entraînée), 12 mmol/L (non entraînée)', mitochondries: 'mitochondries : 11 % du volume (entraînée), 5 % (non entraînée)',
    tableau: 'le tableau des documents 1 et 2', comparaison: 'la comparaison, comme au barème', explication: 'l’explication de la fatigabilité' };
  const P2 = [
    { id: 'A', nom: 'Personne entraînée', couleur: 'cyan', o2: 5.5, lac: 6, mito: 11, enz: 'importante', nmito: 7 },
    { id: 'B', nom: 'Personne non entraînée', couleur: 'orange', o2: 2.5, lac: 12, mito: 5, enz: 'faible', nmito: 3 },
  ];
  const PH = { o2: [3.2, 6], lac: [6.6, 9.4], mito: [10, 12.8] }, T_TAB = 13.4;
  function dessiner(c) {
    const L = scene.L, t = chrono.t;
    if (t < T_TAB) {
      const cw = (L - 40) / 2, u = cw / 360;
      P2.forEach((p, k) => {
        const x0 = 20 + cw * k, xc = x0 + cw / 2;
        ecrit.ecrire(c, 'nom' + k, () => c.texte(p.nom, xc, 34, { couleur: p.couleur, taille: tk(20), align: 'center', gras: true, max: cw - 10 }));
        if (k === 1) ecrit.ecrire(c, 'sep', () => c.ligne(x0 - 4, 20, x0 - 4, 400, { couleur: 'tresfaible', largeur: 1.2, pointille: [6, 6] }));
        // le muscle peint, qui se contracte au même rythme chez les deux (le même effort)
        const f = t > 0.6 ? Math.sin((t - 0.6) * Math.PI * 1.6) ** 2 : 0;
        const xm = x0 + 34 * u;
        c.direct(() => peindreMuscle(c.ctx, xm, 205, 230, 34 * Math.min(1.2, u), f));
        c.repere('muscle_' + p.id, xm - 30, 84, 60, 250, 'le muscle de la ' + p.nom.toLowerCase());
        // les deux jauges : O₂ consommé, acide lactique
        const yb = 330, H = 200, bw = 38 * Math.min(1.25, u);
        [['o2', p.o2, 6, 'O₂', '(L/min)', 'cyan', 86], ['lac', p.lac, 14, 'ac. lactique', '(mmol/L)', 'rose', 156]].forEach(([id, v, max, n1, n2, col, px]) => {
          const [a, b] = PH[id], bx = x0 + px * u;
          if (t < a) return;
          const h = H * v / max * doux(chrono.part(a, b, t)), val = v * doux(chrono.part(a, b, t));
          c.direct(() => { const g = c.ctx, gr = g.createLinearGradient(bx, yb - h, bx + bw, yb); gr.addColorStop(0, c.couleur(col)); gr.addColorStop(1, 'rgba(255,255,255,.25)'); g.globalAlpha = .8; g.fillStyle = gr; g.fillRect(bx, yb - h, bw, h); g.globalAlpha = 1; });
          c.rect(bx - 2, yb - H - 2, bw + 4, H + 4, { couleur: 'tresfaible', arrondi: 4, duree: .2 });
          c.direct(() => c.texte(fr(val, 1), bx + bw / 2, yb - h - 8, { couleur: col, taille: tk(19), align: 'center', gras: true }));
          ecrit.ecrire(c, `lab${id}${k}`, () => { c.texte(n1, bx + bw / 2, yb + tk(24), { couleur: col, taille: tk(16), align: 'center' }); c.texte(n2, bx + bw / 2, yb + tk(44), { couleur: col, taille: tk(16), align: 'center' }); });
          c.repere(`${id}_${p.id}`, bx - 10, yb - H - 26, bw + 20, H + 76, `${id === 'o2' ? 'le dioxygène consommé' : 'l’acide lactique'}, ${p.nom.toLowerCase()}`);
        });
        // la coupe d’une fibre : ses mitochondries (part du volume de la cellule)
        const [a, b] = PH.mito;
        if (t >= a) {
          const fx = x0 + cw - 70 * u, fy = 168, fr0 = 62 * Math.min(1.2, u), al = doux(chrono.part(a, a + 1.2, t));
          c.direct(() => {
            const g = c.ctx; g.save(); g.globalAlpha = al;
            P.cellule(g, fx, fy, fr0, fr0 * .92, { graine: 31 + k, grains: 40 });
            const n = Math.round(p.nmito * doux(chrono.part(a + .4, b - .4, t)));
            for (let i = 0; i < n; i++) { const an = i * TAU / p.nmito + .4, d = fr0 * (i % 2 ? .52 : .6); P.mitochondrie(g, fx + Math.cos(an) * d, fy + Math.sin(an) * d * .9, 17, 9, { angle: an, cretes: 4, grains: 4, graine: 7 + i }); }
            g.restore();
          });
          if (t >= b - .6) ecrit.ecrire(c, 'mito' + k, () => {
            c.texte(`mitochondries : ${p.mito} %`, fx, fy + fr0 + tk(28), { couleur: p.couleur, taille: tk(17), align: 'center', gras: true, max: 180 * u });
            c.texte('du volume de la cellule', fx, fy + fr0 + tk(50), { couleur: p.couleur, taille: tk(15), align: 'center', max: 180 * u });
            c.texte(`enzymes : ${p.enz}`, fx, fy + fr0 + tk(74), { couleur: p.couleur, taille: tk(16), align: 'center', max: 180 * u });
          });
          c.repere('fibre_' + p.id, fx - fr0 - 6, fy - fr0 - 6, 2 * fr0 + 12, 2 * fr0 + 90, 'les mitochondries de la ' + p.nom.toLowerCase());
        }
      });
      if (t >= 0.8 && t < PH.o2[0] + 1) ecrit.ecrire(c, 'effort', () => c.texte('même effort physique', L / 2, 404, { couleur: 'jaune', taille: tk(18), align: 'center' }));
      return;
    }
    // le tableau des documents 1 et 2 : les valeurs viennent de l’animation
    const w = Math.min(L - 40, 760), x0 = (L - w) / 2, cw = [w * .46, w * .27, w * .27];
    ecrit.ecrire(c, 'titre_tab', () => c.texte('Documents 1 et 2 (examen 2016 N), même effort', L / 2, 30, { couleur: 'jaune', taille: tk(18), align: 'center', max: L - 30 }));
    const lignes = [['', 'entraînée', 'non entraînée'], ['volume des mitochondries (%)', '11', '5'], ['activité des enzymes mitochondriales', 'importante', 'faible'],
      ['consommation de O₂ (L/min)', '5,5', '2,5'], ['acide lactique produit (mmol/L)', '6', '12']];
    const T0 = 13.6, tb = tableau(c, ecrit, 'tab', x0, 42, cw, tk(36), lignes, [T0, T0 + .5, T0 + 1, T0 + 1.5, T0 + 2], t, (r, j) => (j === 0 ? 'blanc' : j === 1 ? 'cyan' : 'orange'));
    c.repere('tableau', x0, 42, w, 5 * tk(36), 'le tableau des documents 1 et 2');
    ['ligne_mito', 'ligne_enz', 'ligne_o2', 'ligne_lact'].forEach((id, r) => c.repere(id, x0, 42 + (r + 1) * tk(36), w, tk(36), lignes[r + 1][0]));
    const ok = k => t >= M[k] - 2.4 && permis(k);
    const yC = 42 + 5 * tk(36) + tk(24);
    if (ok('comparaison')) {
      const L3 = ['Chez la personne non entraînée, par rapport à l’entraînée :', '• volume des mitochondries plus faible (5 % contre 11 %), enzymes mitochondriales peu actives ;',
        '• consommation de O₂ plus faible (2,5 L/min contre 5,5 L/min) ;', '• acide lactique plus élevé (12 mmol/L contre 6 mmol/L).'];
      L3.forEach((s, i) => { if (t >= M.comparaison - 2.4 + i * .6) ecrit.ecrire(c, 'cmp' + i, () => c.texte(s, 24, yC + i * tk(24), { couleur: i ? 'blanc' : 'cyan', taille: tk(16), max: L - 40 })); });
      c.repere('comparaison', 20, yC - tk(18), L - 40, 4 * tk(24) + 6, 'la comparaison écrite comme le barème');
    }
    if (ok('explication')) {
      const yE = yC + 4 * tk(24) + tk(8);
      const E = ['Explication : la personne non entraînée renouvelle son ATP surtout par la fermentation lactique', '→ peu d’ATP produit (2 ATP par glucose) → fatigabilité élevée.'];
      E.forEach((s, i) => { if (t >= M.explication - 2.4 + i * 1.2) ecrit.ecrire(c, 'exp' + i, () => c.texte(s, 24, yE + i * tk(24), { couleur: 'rose', taille: tk(16), max: L - 40, gras: true })); });
      c.repere('explication', 20, yE - tk(18), L - 40, 2 * tk(24) + 6, 'l’explication de la fatigabilité');
    }
  }
  function voit() {
    const t = chrono.t, m = ['Examen 2016 N, documents 1 et 2 : personne entraînée et non entraînée, même effort.'];
    if (t >= PH.o2[1]) m.push('O₂ consommé : 5,5 L/min (entraînée), 2,5 L/min (non entraînée).');
    if (t >= PH.lac[1]) m.push('Acide lactique : 6 mmol/L (entraînée), 12 mmol/L (non entraînée).');
    if (t >= PH.mito[1]) m.push('Mitochondries : 11 % du volume (entraînée), 5 % (non entraînée) ; enzymes mitochondriales : importante, faible.');
    if (t >= T_TAB) m.push('Les valeurs sont maintenant dans le tableau.');
    if (t >= M.comparaison - 2.4 && permis('comparaison')) m.push('La comparaison du barème est écrite.');
    if (t >= M.explication - 2.4 && permis('explication')) m.push('L’explication est écrite : fermentation lactique, peu d’ATP, fatigabilité élevée.');
    else if (!R.conclusions) m.push('(La correction reste cachée jusqu’à la réponse de l’élève.)');
    return m.join(' ');
  }
  return { M, FIN, MOTIFS, dessiner, voit, titre: 'Qui respire, qui fermente ? (2016 N)', depart: 'Deux personnes, le même effort…' };
})();

/* ─── Restitution : 2024 R (définir, sens des protons) et 2022 N (QCM 1) ─── */
V.restitution = (() => {
  const M = { cadres: 2.4, nature: 4.6, lieu: 6.6, produit: 8.6, phrase: 10.6, membrane: 13.6, fleche_chaine: 16, fleche_sphere: 18.4,
    qcm: 21.4, elimine_a: 23.6, elimine_c: 25.4, elimine_d: 27, bonne: 28.6 }, FIN = 29;
  const MOTIFS = { cadres: 'définir : nature, lieu et conditions, produits', nature: 'nature : dégradation incomplète du glucose', lieu: 'lieu : hyaloplasme, sans dioxygène',
    produit: 'produits : acide lactique et peu d’énergie', phrase: 'la définition en une phrase', membrane: 'la membrane interne, refaite de mémoire',
    fleche_chaine: 'chaîne respiratoire : matrice → espace intermembranaire', fleche_sphere: 'sphère pédonculée : espace intermembranaire → matrice',
    qcm: 'le QCM 2022 N', elimine_a: 'a : le sens est faux', elimine_c: 'c : membrane externe, faux', elimine_d: 'd : membrane externe, faux', bonne: 'la réponse : (1, b)' };
  const T_PROT = 12.4;
  const CADRES = [['1. nature', ['dégradation', 'incomplète', 'du glucose'], 'nature'], ['2. lieu et conditions', ['dans le hyaloplasme,', 'en absence', 'de dioxygène'], 'lieu'],
    ['3. produits', ['acide lactique', '+ faible quantité', 'd’énergie (2 ATP)'], 'produit']];
  const PROPS = [['a', 'la sphère pédonculée transporte H⁺ vers l’espace intermembranaire ;', 'elimine_a', 'le sens'],
    ['b', 'la sphère pédonculée est responsable de la phosphorylation de l’ADP ;', 'bonne', ''],
    ['c', 'la membrane externe contient des protéines qui transportent les électrons vers le dioxygène ;', 'elimine_c', 'externe'],
    ['d', 'la membrane externe contient des enzymes d’oxydoréduction.', 'elimine_d', 'externe']];
  const ok = (k, avance = 0) => chrono.t >= M[k] - avance && permis(k);
  function dessiner(c) {
    const L = scene.L, t = chrono.t;
    if (t < T_PROT) {
      ecrit.ecrire(c, 'enonce', () => c.texte('Définir la fermentation lactique. (2024 R, 0,5 pt)', L / 2, 36, { couleur: 'jaune', taille: tk(20), align: 'center', max: L - 30 }));
      c.repere('enonce', 20, 14, L - 40, 32, 'la consigne : définir la fermentation lactique');
      const w = (L - 80) / 3;
      CADRES.forEach(([titre, lignes, k], i) => {
        if (t < 0.8 + i * .5) return;
        const x = 20 + i * (w + 20), y = 70, h = 170;
        ecrit.ecrire(c, 'cadre' + i, () => { c.rect(x, y, w, h, { couleur: 'cyan', fond: 'cyan', fondAlpha: .08, arrondi: 10 }); c.texte(titre, x + w / 2, y + tk(28), { couleur: 'cyan', taille: tk(18), align: 'center', gras: true, max: w - 12 }); });
        c.repere('cadre_' + k, x, y, w, h, titre);
        if (ok(k, 1.2)) lignes.forEach((s, j) => ecrit.ecrire(c, `c${i}${j}`, () => c.texte(s, x + w / 2, y + tk(70) + j * tk(30), { couleur: 'blanc', taille: tk(19), align: 'center', max: w - 12 })));
      });
      if (ok('phrase', 1.6)) {
        const s = 'La fermentation lactique est une dégradation incomplète du glucose dans le hyaloplasme, en absence de dioxygène, avec production d’acide lactique et d’une faible quantité d’énergie.';
        const ls = couper(c, s, L - 60, tk(18));

/* ─── Le glucose marqué au ¹⁴C, de T0 à T4 ─── */
V.marquage = (() => {
  const M = { t0: 2.4, t1: 5, t2: 7.6, t3: 10.2, t4: 12.8, tableau: 16 }, FIN = 16.4;
  const MOTIFS = { t0: 'T0 : glucose radioactif dans le milieu', t1: 'T1 : le glucose entre dans le hyaloplasme', t2: 'T2 : acide pyruvique radioactif dans le hyaloplasme',
    t3: 'T3 : acide pyruvique et composés nouveaux dans la mitochondrie', t4: 'T4 : CO₂ radioactif dans le milieu', tableau: 'le tableau des résultats' };
  const MOL = { g: { nom: 'glucose', c: [250, 214, 60], col: 'jaune' }, p: { nom: 'acide pyruvique', c: [250, 140, 50], col: 'orange' },
    k: { nom: 'composés du cycle de Krebs', c: [240, 110, 190], col: 'rose' }, co2: { nom: 'CO₂', c: [170, 180, 195], col: 'blanc' } };
  // [milieu, hyaloplasme, mitochondrie] : liste [type, nombre de +]
  const ETATS = [
    [[['g', 3]], [], []],
    [[['g', 1]], [['g', 2]], []],
    [[], [['p', 2]], [['p', 1]]],
    [[], [], [['p', 3], ['k', 1]]],
    [[['co2', 1]], [], [['k', 3]]],
  ];
  const TS = [M.t0, M.t1, M.t2, M.t3, M.t4], T_TAB = 14;
  const plus = n => '+'.repeat(n);
  function dessiner(c) {
    const L = scene.L, t = chrono.t;
    if (t < T_TAB) {
      const k = TS.reduce((a, v, i) => (t >= v - 1.6 ? i : a), 0), u = doux(chrono.part(TS[k] - 1.6, TS[k] - .4, t));
      const cx = Math.min(L * .36, 300), cy = 220, rx = Math.min(250, L * .3), ry = 150;
      const mx = cx + rx * .28, my = cy + 30;
      c.direct(() => {
        const g = c.ctx;
        P.cellule(g, cx, cy, rx, ry, { graine: 21, grains: 70 });
        P.mitochondrie(g, mx, my, 80, 40, { cretes: 6, graine: 9 });
        // les molécules radioactives : billes avec un halo (la radioactivité), placées dans leur compartiment
        const zone = (z, i, n) => {
          if (z === 0) return [cx + rx * .15 + i * 58, cy - ry - 16 - (i % 2) * 16];   // au-dessus de la cellule, à droite de son nom (pas de 58 : la chaîne du glucose)
          if (z === 1) return [cx - rx * .55 + i * 58, cy - ry * .35 + (i % 2) * 28];
          return [mx - 46 + i * 30, my + (i % 2 ? 10 : -10)];
        };
        const peindreEtat = (E, a) => E.forEach((liste, z) => { let i = 0; liste.forEach(([ty, n]) => { for (let j = 0; j < n; j++, i++) {
          const [x, y] = zone(z, i, n), m = MOL[ty];
          const R = ty === 'g' ? 30 : 20, h = g.createRadialGradient(x, y, 2, x, y, R); h.addColorStop(0, `rgba(255,255,160,${.35 * a})`); h.addColorStop(1, 'rgba(255,255,160,0)'); g.fillStyle = h; g.beginPath(); g.ellipse(x, y, R, 16, 0, 0, TAU); g.fill();
          // lexique visuel commun (18/11/2026) : glucose = chaîne de 6 carbones jaunes, acide pyruvique = 3, composés du cycle = 4 ; CO₂ à carbone jaune
          const Lx = window.Lexique, o = { echelle: .32, alpha: a };
          if (ty === 'co2') Lx.co2(g, x, y, { echelle: 1.1, alpha: a }); else if (ty === 'g') Lx.glucose(g, x, y, o); else if (ty === 'p') Lx.acidePyruvique(g, x, y, o); else Lx.moleculeOrganique(g, x, y, { ...o, n: 4 });
        } }); });
        if (k > 0 && u < 1) peindreEtat(ETATS[k - 1], 1 - u);
        peindreEtat(ETATS[k], k === 0 ? doux(chrono.part(.6, 1.8, t)) : u);
      });
      ecrit.ecrire(c, 'zones', () => {
        c.texte('milieu extracellulaire', cx - rx, 40, { couleur: 'blanc', taille: tk(17) });
        c.texte('hyaloplasme', cx - rx * .55, cy + ry * .5, { couleur: 'vert', taille: tk(17) });
        c.texte('mitochondrie', mx, my + 62, { couleur: 'orange', taille: tk(17), align: 'center' });
      });
      c.repere('milieu', cx - rx, 14, rx * 1.4, 50, 'le milieu extracellulaire');
      c.repere('hyaloplasme', cx - rx * .8, cy - ry * .6, rx * .7, ry * 1.1, 'le hyaloplasme');
      c.repere('mitochondrie', mx - 84, my - 44, 168, 88, 'la mitochondrie');
      // à droite : le temps et les « + » de chaque compartiment, écrits à l’instant où ils se voient
      const xd = cx + rx + 30, wd = L - xd - 12;
      if (t >= TS[k] - .6) {
        c.direct(() => {
          c.texte('T' + k, xd, 50, { couleur: 'jaune', taille: tk(30), gras: true });
          ['milieu', 'hyaloplasme', 'mitochondrie'].forEach((nz, z) => {
            const y = 100 + z * tk(90);
            c.texte(nz, xd, y, { couleur: 'faible', taille: tk(16), max: wd });
            const liste = ETATS[k][z];
            if (!liste.length) c.texte('—', xd, y + tk(28), { couleur: 'faible', taille: tk(18) });
            liste.forEach(([ty, n], j) => c.texte(`${MOL[ty].nom} ${plus(n)}`, xd, y + tk(28) + j * tk(24), { couleur: MOL[ty].col, taille: tk(18), gras: true, max: wd }));
          });
        });
        c.repere('lecture', xd - 4, 20, wd, 300, 'ce qui est radioactif à T' + k);
      }
      ecrit.ecrire(c, 'legende', () => c.texte('+ = quantité de molécules radioactives (¹⁴C)', 20, 408, { couleur: 'faible', taille: tk(15), max: L - 30 }));
      return;
    }
    const w = Math.min(L - 30, 800), x0 = (L - w) / 2, cw = [w * .1, w * .26, w * .3, w * .34];
    const z = (E, i) => (E[i].length ? E[i].map(([ty, n]) => `${ty === 'k' ? 'cycle de Krebs' : MOL[ty].nom} ${plus(n)}`).join('\n') : '—');
    const lignes = [['', 'milieu extracellulaire', 'hyaloplasme', 'mitochondrie']].concat(ETATS.map((E, i) => ['T' + i, z(E, 0), z(E, 1), z(E, 2)]));
    tableau(c, ecrit, 'tab', x0, 10, cw, tk(62), lignes, [14.2, 14.5, 14.8, 15.1, 15.4, 15.7], t, (r, j) => (j === 0 ? 'jaune' : 'blanc'));
    c.repere('tableau', x0, 10, w, 6 * tk(62), 'le tableau des résultats');
  }
  function voit() {
    const t = chrono.t;
    if (t >= T_TAB) return 'Le tableau des résultats T0 à T4 est écrit (milieu extracellulaire, hyaloplasme, mitochondrie).';
    const k = TS.reduce((a, v, i) => (t >= v - 1.6 ? i : a), 0), E = ETATS[k];
    return `Glucose marqué au ¹⁴C. T${k} : ` + ['milieu', 'hyaloplasme', 'mitochondrie'].map((n, i) => `${n} : ${E[i].length ? E[i].map(([ty, q]) => MOL[ty].nom + ' ' + plus(q)).join(', ') : 'rien'}`).join(' ; ') + '.';
  }
  return { M, FIN, MOTIFS, dessiner, voit, titre: 'Le glucose marqué, de T0 à T4', depart: 'Le glucose radioactif est dans le milieu…' };
})();

  const MOTIFS = { enonce: 'la consigne : relier chaque phénomène à sa réaction bilan', phenomenes: 'quatre phénomènes, numérotés de 1 à 4',
    reactions: 'cinq réactions, a à e : une de trop', a_produit: 'a : ce qu’elle donne, éthanol + CO₂', a_lien: 'a → fermentation alcoolique : (4 ; a)',
    b_produit: 'b : regarder ce qu’elle donne', b_lien: 'b → acide lactique, fermentation lactique : (3 ; b)',
    c_produit: 'c : regarder ce qu’elle donne', c_lien: 'c → acide pyruvique + NADH,H⁺, glycolyse : (1 ; c)',
    de_produit: 'd et e : il reste le cycle de Krebs', e_lien: 'e → cycle de Krebs : (2 ; e) ; d est l’intrus',
    couples: 'la réponse comme le barème : (1 ; c) ; (2 ; e) ; (3 ; b) ; (4 ; a)' };
  const PHEN = [['1', 'La glycolyse', 'vert'], ['2', 'Le cycle de Krebs', 'cyan'], ['3', 'La fermentation lactique', 'orange'], ['4', 'La fermentation alcoolique', 'rose']];
  // [lettre, réactifs, produits, phénomène (index) ou -1, moment du produit, moment du lien, note du produit, note du lien]
  const REAC = [
    ['a', 'C₆H₁₂O₆ + 2 ADP + 2 Pi', '2 CH₃CH₂OH + 2 CO₂ + 2 ATP', 3, 'a_produit', 'a_lien', 'donne : éthanol (CH₃CH₂OH) + CO₂', 'éthanol + CO₂ → fermentation alcoolique → (4 ; a)'],
    ['b', 'C₆H₁₂O₆ + 2 ADP + 2 Pi', '2 CH₃CHOHCOOH + 2 ATP', 2, 'b_produit', 'b_lien', 'donne : ?', 'CH₃CHOHCOOH = acide lactique → (3 ; b)'],
    ['c', 'C₆H₁₂O₆ + 2 ADP + 2 Pi + 2 NAD⁺', '2 CH₃COCOOH + 2 ATP + 2 NADH,H⁺', 0, 'c_produit', 'c_lien', 'donne : ?', 'glucose → 2 acides pyruviques + 2 NADH,H⁺ → (1 ; c)'],
    ['d', 'CH₃COCOOH + 2 ATP', 'CH₃COOH + 2 ADP + 2 Pi', -1, 'de_produit', 'e_lien', 'elle part de quoi ? elle donne quoi ?', 'intrus : aucun des quatre phénomènes'],
    ['e', 'CH₃CO-SCoA + 3 NAD⁺ + 3 H₂O + FAD + GDP + Pi', '2 CO₂ + HSCoA + 3 NADH,H⁺ + FADH₂ + GTP', 1, 'de_produit', 'e_lien', 'elle part de quoi ? elle donne quoi ?', 'acétyl-CoA → 2 CO₂ + 3 NADH,H⁺ + FADH₂ → (2 ; e)'],
  ];
  const ok = (k, avance = 0) => chrono.t >= M[k] - avance && permis(k);
  function dessiner(c) {
    const L = scene.L, t = chrono.t, te = tk(18), ti = tk(24);
    ecrit.ecrire(c, 'enonce', () => c.texte('Reliez chaque phénomène à la réaction bilan qui lui convient. (2020 R, 1 pt)', L / 2, 30, { couleur: 'jaune', taille: tk(19), align: 'center', max: L - 30 }));
    c.repere('enonce', 20, 10, L - 40, 30, 'la consigne de 2020 R');
    // les quatre phénomènes, à gauche
    const wp = Math.min(260, Math.max(180, L * .22)), hp = tk(50), xp = 16;
    const yP = PHEN.map((_, i) => 62 + i * (hp + tk(16)));
    PHEN.forEach(([n, nom, col], i) => {
      if (t < M.phenomenes - 1.6 + i * .3) return;
      ecrit.ecrire(c, 'ph' + i, () => { c.rect(xp, yP[i], wp, hp, { couleur: col, fond: col, fondAlpha: .14, arrondi: 10 }); c.texte(n + '- ' + nom, xp + 10, yP[i] + hp / 2 + 6, { couleur: col, taille: tk(18), gras: true, max: wp - 16 }); });
      c.repere('phen_' + n, xp, yP[i], wp, hp, 'le phénomène ' + n + ' : ' + nom);
    });
    if (t >= M.phenomenes - 1.6) c.repere('phenomenes', xp - 4, 56, wp + 8, 4 * (hp + tk(16)), 'les quatre phénomènes');
    // les cinq réactions, à droite : une ligne (ou deux), puis la note de ce qu’elle donne
    const xr = xp + wp + tk(46), wr = L - xr - 14;
    let y = 66;
    const lignesDe = (R0) => {
      const [l, g, d] = R0, plein = l + '- ' + g + ' → ' + d;
      return c.largeurTexte(plein, te) <= wr - 4 ? [[l + '- ' + g + ' → ', d]] : [[l + '- ' + g, ''], ['      → ', d]];
    };
    const yR = [];
    REAC.forEach((R0, i) => {
      const [l, , , ph, kp, kl, noteP, noteL] = R0, lignes = lignesDe(R0), y0 = y;
      yR.push(y0);
      if (t >= M.reactions - 2.4 + i * .45) ecrit.ecrire(c, 'r' + i, () => lignes.forEach(([g, d], j) => {
        c.texte(g, xr, y0 + j * ti, { couleur: 'blanc', taille: te, max: wr });
        if (d) c.texte(d, xr + c.largeurTexte(g, te), y0 + j * ti, { couleur: 'blanc', taille: te, max: wr - c.largeurTexte(g, te) });
      }));
      c.repere('reac_' + l, xr - 6, y0 - te, wr + 6, lignes.length * ti + 4, 'la réaction ' + l);
      const yn = y0 + (lignes.length - 1) * ti + tk(24);
      // ce que donne la réaction : souligné (où regarder), puis sa note
      if (t >= M[kp] - 1.2) {
        const [g, d] = lignes[lignes.length - 1], x1 = xr + c.largeurTexte(g, te), yb = y0 + (lignes.length - 1) * ti + 5;
        ecrit.ecrire(c, 'sou' + i, () => { c.ligne(x1, yb, x1 + Math.min(wr - (x1 - xr), c.largeurTexte(d, te)), yb, { couleur: 'jaune', largeur: 2.6 });
          if (!(ok(kl, 1) && noteL)) c.texte(noteP, xr + 26, yn, { couleur: 'jaune', taille: tk(16), max: wr - 30 }); });
        c.repere('produit_' + l, x1 - 4, yb - te - 2, Math.min(wr - (x1 - xr), c.largeurTexte(d, te)) + 8, te + 10, 'ce que donne la réaction ' + l);
      }
      if (ok(kl, 1)) {
        const col = ph >= 0 ? PHEN[ph][2] : 'rouge';
        ecrit.ecrire(c, 'lien' + i, () => {
          if (ph >= 0) c.fleche(xp + wp + 4, yP[ph] + hp / 2, xr - 8, y0 - te * .35, { couleur: col, largeur: 2.6 });
          else lignes.forEach(([g, d], j) => { const yy = y0 + j * ti - te * .32; c.ligne(xr, yy, xr + Math.min(wr, c.largeurTexte(g + d, te)), yy, { couleur: 'rouge', largeur: 2 }); });
        });
        ecrit.ecrire(c, 'note' + i, () => c.texte(noteL, xr + 26, yn, { couleur: col, taille: tk(16), gras: true, max: wr - 30 }));
        c.repere('lien_' + l, xr - 6, y0 - te, wr + 6, yn - y0 + te + 6, noteL);
      }
      y = yn + tk(32);
    });
    if (t >= M.reactions - 2.4) c.repere('reactions', xr - 8, 44, wr + 8, y - 44, 'les cinq réactions');
    if (ok('couples', 1)) {
      ecrit.ecrire(c, 'couples', () => c.texte('Réponse : (1 ; c) ; (2 ; e) ; (3 ; b) ; (4 ; a)', xp, Math.min(406, Math.max(yP[3] + hp + tk(40), y + 4)), { couleur: 'vert', taille: tk(21), gras: true, max: L - 30 }));
      c.repere('couples', xp, 370, L - 30, 44, 'la réponse comme le barème');
    }
  }
  function voit() {
    const t = chrono.t, m = ['Consigne 2020 R : relier les phénomènes 1 à 4 (glycolyse, cycle de Krebs, fermentation lactique, fermentation alcoolique) aux réactions bilans a à e.'];
    if (t >= M.reactions) m.push('Les cinq réactions a, b, c, d, e sont écrites.');
    REAC.forEach(([l, , , , kp, kl, noteP, noteL]) => { if (t >= M[kp] - 1.2) m.push(`Réaction ${l} : ce qu’elle donne est souligné.`); if (ok(kl, 1)) m.push(`Réaction ${l} : ${noteL}.`); });
    if (ok('couples', 1)) m.push('Réponse écrite : (1 ; c) ; (2 ; e) ; (3 ; b) ; (4 ; a).');
    if (!R.conclusions) m.push('(La correction reste cachée jusqu’à la réponse de l’élève.)');
    return m.join(' ');
  }
  return { M, FIN, MOTIFS, dessiner, voit, titre: 'Relier phénomènes et réactions (2020 R)', depart: 'La consigne d’abord…' };
})();

const VU = V[VUE] || V.sportifs;
/* Ce qui appartient à la correction d’une consigne (moment ≥ cacher) n’est montré qu’après la réponse. */
function permis(k) { return R.conclusions || !(CACHER in VU.M) || VU.M[k] < VU.M[CACHER]; }

function dessiner(c) {
  scene.cadre(41);
  TK = scene.L >= 1000 ? 1.15 : 1;
  VU.dessiner(c);
  lum.lueurs(c);
  return c.fin();
}
const canvas = $('canvas');
const scene = Scene(canvas, dessiner, { large: true });
const ecrit = Apparitions(scene);
const chrono = Chrono({ fin: () => VU.FIN, moments: () => VU.M, motifs: VU.MOTIFS, bouton: $('run'), bulle: $('feedback'), pont: () => pont,
  depart: VU.depart, reinit: () => ecrit.oublier(), fini: () => VU.titre + ' : tout est au tableau.' });
scene.avancer = (dt) => { const a = chrono.avancer(dt); if (a) scene.sale = true; return a || VUE === 'sportifs' && chrono.t > 0 && chrono.t < 13.4 && chrono.running; };
$('run').onclick = chrono.clic;
/* Démonstration jouée sur le document (règle 17) : la ligne qui s’écrit allume ce qu’elle utilise ; la correction de la
 * consigne se montre alors (la démonstration EST la correction). */
const lum = Allumage(scene, chrono, { moments: () => VU.M, avant: () => { R.conclusions = true; } });
window.Tableau.explication({ [VUE]: Object.keys(VU.M).map(k => ({ repere: k, texte: VU.MOTIFS[k] })) });
const commandes = ['start', 'reset', 'pause', 'resume', 'set_time', 'play_until', 'set_parameters', 'allume', 'eteins'];
const config = { id: 'svt_energie_national', version: '1.0', title: 'Le national joué au tableau', variants: Object.keys(V).map(id => ({ id, label: V[id].titre })), commands: commandes,
  command_schema: { play_until: { moment: Object.keys(VU.M).join(' | ') }, set_time: { moment: Object.keys(VU.M).join(' | ') },
    set_parameters: { conclusions: 'true | false (false : la correction de la consigne reste cachée)' },
    allume: { cible: 'moment ou repère (ou liste) : ' + Object.keys(VU.M).join(' | ') }, eteins: {} } };
const pont = protocole({ id: config.id, commandes, config,
  texte: VU.titre + '. Document d’examen rejoué étape par étape ; la correction attend la réponse de l’élève.',
  etat: () => ({ simulation_status: chrono.statut(), current_variant: VUE, ce_qui_se_voit: VU.voit() + (lum.liste().length ? ' Allumé sur le document : ' + lum.liste().join(', ') + '.' : ''), moments: VU.M, time_s: +chrono.t.toFixed(2), parameters: { ...R }, allumes: lum.liste() }),
  progression: () => (chrono.statut() === 'finished' ? 1 : chrono.t / VU.FIN),
  executer: (cmd, p) => ({ start: chrono.start, pause: chrono.pause, resume: chrono.resume, reset: () => { lum.eteins(); chrono.reset(); },
    allume: () => { lum.allume(p); pont.noter('allume', { cible: p && p.cible }); pont.emettre(); }, eteins: () => { lum.eteins(); pont.emettre(); },
    set_time: () => { chrono.setTime(p); scene.sale = true; }, play_until: () => chrono.playUntil(p),
    set_parameters: () => { if (p && 'conclusions' in p) R.conclusions = p.conclusions !== false && p.conclusions !== 'false'; scene.sale = true; pont.noter('set_parameters', { ...R }); pont.emettre(); } })[cmd]?.() });
bulle($('feedback'), VU.titre);
window.__sim = { chrono, scene, VU, R };
</script>
