<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L’ATP, petite monnaie de la cellule — au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="svt.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Une molécule d'ATP peinte : l'adénosine et trois phosphates reliés par deux liaisons ; la dernière liaison se rompt, l'énergie libérée fait contracter une fibre musculaire (30,5 kJ par mole d'ATP), il reste ADP + Pi ; puis l'énergie de la respiration ou de la fermentation raccroche le Pi : l'ATP est reformé ; le petit cycle hydrolyse / phosphorylation s'écrit en bas"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start reset pause resume play_until set_time">Lancer</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="commun.js"></script>
<script src="peinture.js"></script>
<script>
/*
 * L’ATP, la petite monnaie de la cellule (cours SVT « Libération de l’énergie »), 10 novembre 2026.
 * Ce qui se voit, dans l’ordre (t en s de la scène) — un moment par chose que dit le tuteur (17 novembre 2026 :
 * avant, la fibre, les 30,5 kJ et l’équation s’écrivaient bien avant d’être dits ; le cycle d’un coup) :
 *   atp_entier (2,4)        : une molécule d’ATP peinte : l’adénosine + trois phosphates (billes P) reliés par deux liaisons ;
 *   liaison_brille (4,4)    : la dernière liaison s’illumine ;
 *   liaison_rompue (5,6)    : elle se rompt (un éclat), le troisième phosphate sort ;
 *   energie_liberee (7,9)   : l’énergie part vers un travail de la cellule : une fibre musculaire apparaît et se contracte ;
 *   adp_pi (9)              : il reste ADP + Pi ;
 *   hydrolyse (10,4)        : ATP + H2O → ADP + Pi + énergie : hydrolyse, écrit ;
 *   kj (11,4)               : 30,5 kJ par mole d’ATP, écrit ;
 *   recharge (15)           : l’énergie de la respiration ou de la fermentation (un glucose dégradé) arrive vers le Pi ;
 *   atp_reforme (16,6)      : le Pi se raccroche, l’ATP est reformé ;
 *   phosphorylation (18)    : ADP + Pi + énergie → ATP : phosphorylation, écrit ;
 *   cycle_hydrolyse (19,4), cycle_phosphorylation (20,8) : le petit cycle, un arc puis l’autre ;
 *   regenere (22,2)         : « l’ATP ne se stocke presque pas : il est régénéré en permanence ».
 * Aucune enzyme nommée. Le rythme est celui d’une explication.
 */
const { bulle, protocole } = window.Tableau;
const { Scene, Chrono, Apparitions, doux, mix, fr } = window.SVTTableau;
const P = window.SVTPeinture;
const $ = id => document.getElementById(id);

const M = { atp_entier: 2.4, liaison_brille: 4.4, liaison_rompue: 5.6, energie_liberee: 7.9, adp_pi: 9, hydrolyse: 10.4, kj: 11.4,
  recharge: 15, atp_reforme: 16.6, phosphorylation: 18, cycle_hydrolyse: 19.4, cycle_phosphorylation: 20.8, regenere: 22.2 };
const FIN = 22.6;
const MOTIFS = {
  atp_entier: 'l’ATP : une adénosine et trois phosphates',
  liaison_brille: 'la dernière liaison, celle du troisième phosphate',
  liaison_rompue: 'la dernière liaison se rompt : le phosphate sort',
  energie_liberee: 'l’énergie libérée sert à un travail : la fibre musculaire se contracte',
  adp_pi: 'il reste ADP + Pi',
  hydrolyse: 'ATP + H2O → ADP + Pi + énergie : l’hydrolyse de l’ATP',
  kj: '30,5 kJ par mole d’ATP',
  recharge: 'l’énergie de la respiration ou de la fermentation arrive',
  atp_reforme: 'le Pi se raccroche : l’ATP est reformé',
  phosphorylation: 'ADP + Pi + énergie → ATP : la phosphorylation',
  cycle_hydrolyse: 'le cycle : l’hydrolyse d’un côté',
  cycle_phosphorylation: 'le cycle : la phosphorylation de l’autre',
  regenere: 'l’ATP ne se stocke presque pas : il est régénéré en permanence',
};
const AD = { x: 150, y: 135, w: 130, h: 64 }, PX = [255, 325, 395], PY = 135, PR = 19, LIBRE = { x: 458, y: 200 };
const FIB = { x: 640, y: 140, w: 200, h: 44 }, SOURCE = { x: 640, y: 262 };
const PHOS = [240, 150, 60], ADENO = [150, 120, 200], CARBONE = [250, 204, 21], MUSCLE = [196, 84, 84];

const canvas = $('canvas');
const scene = Scene(canvas, (c) => { scene.cadre(31); MOS.dessiner(c, () => dessiner(c)); return c.fin(); }, { large: true });
/* Tableau large (portable) : la molécule, la fibre et les équations à gauche, agrandies ; le cycle et la phrase à droite. */
const MOS = window.SVTLarge.Mosaique(scene, (L) => L >= 1000 ? { police: 1.3, colonnes: [
  { blocs: [[0, 0, 760, 304]], max: 1.3 },
  { blocs: [[120, 304, 360, 116], [480, 326, 280, 64]], max: 1.3 } ] } : null);
const ecrit = Apparitions(scene);
const chrono = Chrono({ fin: () => FIN, moments: () => M, motifs: MOTIFS, bouton: $('run'), bulle: $('feedback'), pont: () => pont,
  depart: 'Observe la molécule d’ATP…', reinit: () => ecrit.oublier(),
  fini: () => 'ATP ⇄ ADP + Pi : hydrolyse (énergie libérée), phosphorylation (énergie apportée).' });
scene.avancer = chrono.avancer;

/* Le troisième phosphate : attaché, puis libre (Pi), puis raccroché. */
function pos3(t) {
  const u1 = doux(chrono.part(4.5, 5.5, t)), u2 = doux(chrono.part(15.0, 16.4, t));
  return [mix(mix(PX[2], LIBRE.x, u1), PX[2], u2), mix(mix(PY, LIBRE.y, u1), PY, u2)];
}
const lie3 = (t) => t < 4.5 || t >= 16.4;
/* L’adénosine peinte : deux masses arrondies soudées (pour l’œil seulement). */
function adenosine(ctx, a) {
  P.proteine(ctx, AD.x - 18, AD.y, AD.w - 40, AD.h, { couleur: ADENO, alpha: .85 * a });
  P.proteine(ctx, AD.x + 34, AD.y + 4, 56, 46, { couleur: [130, 110, 190], alpha: .85 * a });
}
/* Une liaison peinte entre deux billes ; `eclat` la fait briller. */
function liaison(ctx, x1, x2, y, a, brille = 0) {
  ctx.save(); ctx.globalAlpha = a; ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(250,230,160,.9)'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke();
  ctx.strokeStyle = 'rgba(120,80,30,.6)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x1, y + 2); ctx.lineTo(x2, y + 2); ctx.stroke();
  ctx.restore();
  if (brille > 0) P.eclat(ctx, (x1 + x2) / 2, y, 12 + 14 * brille, .5 + .5 * brille);
}
/* Une fibre musculaire peinte, striée ; `w` diminue quand elle se contracte. */
function fibre(ctx, cx, cy, w, h) {
  ctx.save();
  const g = ctx.createLinearGradient(0, cy - h / 2, 0, cy + h / 2);
  g.addColorStop(0, P.rgba(MUSCLE.map(v => Math.min(255, v + 50)), .75)); g.addColorStop(1, P.rgba(MUSCLE, .7));
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(cx - w / 2, cy - h / 2, w, h, h / 2); ctx.fill();
  ctx.clip();
  const n = 15, pas = w / n;
  for (let k = 1; k < n; k++) { ctx.fillStyle = k % 2 ? 'rgba(90,20,30,.35)' : 'rgba(255,220,220,.18)'; ctx.fillRect(cx - w / 2 + k * pas - pas * .22, cy - h / 2, pas * .44, h); }
  ctx.fillStyle = 'rgba(120,90,170,.6)';
  for (const [dx, dy] of [[-.3, -.22], [.12, .25], [.36, -.18]]) { ctx.beginPath(); ctx.ellipse(cx + dx * w, cy + dy * h, 7, 3.5, 0, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
  ctx.save(); ctx.strokeStyle = 'rgba(255,200,200,.55)'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.roundRect(cx - w / 2, cy - h / 2, w, h, h / 2); ctx.stroke(); ctx.restore();
}
function accolade(c, x1, x2, nom, couleur) {
  c.trait([[x1, 94], [x1, 88], [x2, 88], [x2, 94]], { couleur, largeur: 1.8 });
  c.texte(nom, (x1 + x2) / 2, 80, { couleur, taille: 17, align: 'center' });
}
/* Arc de cycle (de x1 vers x2), bombé vers le haut (h < 0) ou le bas (h > 0), avec sa tête. */
function arc(c, x1, x2, y, h, couleur) {
  const pts = []; for (let i = 0; i <= 16; i++) { const u = i / 16; pts.push([mix(x1, x2, u), y + h * 4 * u * (1 - u)]); }
  c.trait(pts, { couleur, largeur: 2 });
  const [xa, ya] = pts[14], [xb, yb] = pts[16], a = Math.atan2(yb - ya, xb - xa);
  c.trait([[xb - 11 * Math.cos(a - .45), yb - 11 * Math.sin(a - .45)], [xb, yb], [xb - 11 * Math.cos(a + .45), yb - 11 * Math.sin(a + .45)]], { couleur, largeur: 2, duree: .1 });
}

function dessiner(c) {
  const t = chrono.t;
  const a0 = doux(chrono.part(.2, 1.4, t));
  const contraction = doux(chrono.part(7.0, 7.8, t)) * (1 - doux(chrono.part(11.4, 12.2, t)));
  const aFib = doux(chrono.part(5.6, 6.1, t));   // la fibre n’apparaît que quand l’énergie part vers elle
  const fw = FIB.w * (1 - .25 * contraction);
  const [x3, y3] = pos3(t);
  // ── la peinture ──
  c.direct(() => {
    const ctx = c.ctx;
    if (aFib > 0) { ctx.save(); ctx.globalAlpha = aFib; fibre(ctx, FIB.x, FIB.y, fw, FIB.h * (1 + .12 * contraction)); ctx.restore(); }
    if (a0 > 0) {
      adenosine(ctx, a0);
      liaison(ctx, AD.x + 62, PX[0] - PR + 2, PY, a0);
      liaison(ctx, PX[0] + PR - 2, PX[1] - PR + 2, PY, a0);
      const brille = t >= 3 && t < 4.5 ? .4 + .6 * chrono.part(3, 4.5, t) * (.75 + .25 * Math.sin(t * 14)) : (t >= 16.4 && t < 17.4 ? 1 - chrono.part(16.4, 17.4, t) : 0);
      if (lie3(t)) liaison(ctx, PX[1] + PR - 2, x3 - PR + 2, PY, a0, brille);
      for (const x of PX.slice(0, 2)) P.bille(ctx, x, PY, PR, PHOS, { alpha: a0 });
      P.bille(ctx, x3, y3, PR, PHOS, { alpha: a0 });
    }
    // l’éclat de la rupture
    if (t >= 4.2 && t < 5.8) { const v = chrono.part(4.5, 5.8, t); P.eclat(ctx, 360, PY, 30 + 18 * v, t < 4.5 ? chrono.part(4.2, 4.5, t) : 1 - v); }
    // l’énergie qui part vers la fibre
    if (t >= 5.7 && t < 7.6) {
      for (let k = 0; k < 3; k++) { const u = doux(chrono.part(5.7 + k * .18, 7.2 + k * .18, t)); if (u > 0 && u < 1) P.eclat(ctx, mix(362, 545, u), mix(126, 136, u), 13 - k * 2, .9 - k * .2); }
    }
    if (contraction > .05) P.eclat(ctx, FIB.x, FIB.y, 50 * contraction, .35 * contraction);
    // la source d’énergie : un glucose dégradé par la respiration ou la fermentation
    if (t >= 12.4) {
      const a = chrono.part(12.4, 13.0, t);
      for (let i = 0; i < 6; i++) { const an = i / 6 * Math.PI * 2; P.bille(ctx, SOURCE.x + Math.cos(an) * 15, SOURCE.y + Math.sin(an) * 9, 6, CARBONE, { alpha: a }); }
      if (t < 15.4) for (let k = 0; k < 3; k++) { const u = doux(chrono.part(13.2 + k * .25, 14.5 + k * .25, t)); if (u > 0 && u < 1) P.eclat(ctx, mix(SOURCE.x - 34, LIBRE.x + 18, u), mix(SOURCE.y - 10, LIBRE.y + 10, u), 12 - k * 2, .9 - k * .2); }
    }
  });
  // ── la craie ──
  if (t >= 5.6) ecrit.ecrire(c, 'fibre', () => {
    c.texte('un travail de la cellule :', FIB.x, 88, { couleur: 'blanc', taille: 15, align: 'center' });
    c.texte('fibre musculaire', FIB.x, 108, { couleur: 'orange', taille: 16, gras: true, align: 'center' });
  });
  if (a0 > 0) {
    ecrit.ecrire(c, 'adenosine', () => c.texte('adénosine', AD.x, 186, { couleur: 'violet', taille: 16, gras: true, align: 'center' }));
    ecrit.ecrire(c, 'lettresP', () => { for (const x of PX.slice(0, 2)) c.texte('P', x, PY + 6, { couleur: '#3a1600', gras: true, taille: 15, align: 'center', duree: .1 }); });
    c.direct(() => c.texte('P', x3, y3 + 6, { couleur: '#3a1600', gras: true, taille: 15, align: 'center' }));
  }
  if (t >= 1.2 && t < 4.5) ecrit.ecrire(c, 'accATP1', () => accolade(c, 85, 414, 'ATP', 'jaune'));
  if ((t >= 1.2 && t < 4.5) || t >= 16.4) ecrit.ecrire(c, t < 4.5 ? 'trois1' : 'trois2', () => c.texte('3 phosphates', PX[1], 186, { couleur: 'orange', taille: 16, gras: true, align: 'center' }));
  if (t >= 2) ecrit.ecrire(c, 'atp_entier', () => c.texte('ATP : adénosine + 3 phosphates', 250, 228, { couleur: 'cyan', taille: 18, gras: true, align: 'center' }));
  if (t >= 3 && t < 4.5) ecrit.ecrire(c, 'brille', () => c.texte('la dernière liaison', 360, 112, { couleur: 'jaune', taille: 15, gras: true, align: 'center' }));
  if (t >= 7.2) ecrit.ecrire(c, 'energie', () => { c.fleche(424, 120, 530, 124, { couleur: 'jaune', largeur: 1.8 }); c.texte('énergie', 476, 108, { couleur: 'jaune', taille: 16, gras: true, align: 'center' }); });
  if (t >= 7.3) ecrit.ecrire(c, 'contracte', () => c.texte('elle se contracte', FIB.x, 186, { couleur: 'orange', taille: 16, align: 'center' }));
  if (t >= 10.6) ecrit.ecrire(c, 'kj', () => c.texte('30,5 kJ par mole d’ATP', FIB.x, 210, { couleur: 'jaune', taille: 17, gras: true, align: 'center' }));
  if (t >= 8.2 && t < 16.4) {
    ecrit.ecrire(c, 'accADP', () => accolade(c, 85, 346, 'ADP', 'blanc'));
    if (t < 15.0) ecrit.ecrire(c, 'pi', () => c.texte('Pi', LIBRE.x + 26, LIBRE.y + 6, { couleur: 'orange', taille: 16 }));
  }
  if (t >= 9.2) c.direct(() => P.carte(c.ctx, 12, 243, 436, t >= 16.8 ? 52 : 28, { alpha: .82, arrondi: 12 }));   // (16 novembre 2026) les deux équations sur une carte
  if (t >= 9.2) ecrit.ecrire(c, 'hydrolyse', () => c.texte('ATP + H_{2}O → ADP + Pi + énergie : hydrolyse', 24, 262, { couleur: 'blanc', taille: 17, gras: true }));
  if (t >= 12.6) ecrit.ecrire(c, 'source', () => c.texte('respiration ou fermentation (glucose)', 628, 300, { couleur: 'vert', taille: 15, align: 'center' }));
  if (t >= 13.2) ecrit.ecrire(c, 'fl_recharge', () => c.fleche(606, 254, 490, 212, { couleur: 'vert', largeur: 1.8 }));
  if (t >= 16.4) ecrit.ecrire(c, 'accATP2', () => accolade(c, 85, 414, 'ATP', 'jaune'));
  if (t >= 16.8) ecrit.ecrire(c, 'phospho', () => c.texte('ADP + Pi + énergie → ATP : phosphorylation', 24, 286, { couleur: 'blanc', taille: 17, gras: true }));
  if (t >= 18.2) ecrit.ecrire(c, 'cycle1', () => {
    c.texte('ATP', 170, 368, { couleur: 'jaune', taille: 19, align: 'center' });
    c.texte('ADP + Pi', 430, 368, { couleur: 'blanc', taille: 18, align: 'center' });
    arc(c, 205, 392, 350, -26, 'orange');
    c.texte('hydrolyse : énergie libérée', 300, 318, { couleur: 'orange', taille: 16, gras: true, align: 'center' });
  });
  if (t >= 19.6) ecrit.ecrire(c, 'cycle2', () => {
    arc(c, 392, 205, 376, 22, 'vert');
    c.texte('phosphorylation : énergie apportée', 300, 414, { couleur: 'vert', taille: 16, gras: true, align: 'center' });
  });
  if (t >= 21.0) ecrit.ecrire(c, 'regenere', () => {
    c.texte('l’ATP ne se stocke presque pas :', 618, 352, { couleur: 'cyan', taille: 16, gras: true, align: 'center' });
    c.texte('il est régénéré en permanence', 618, 374, { couleur: 'cyan', taille: 16, gras: true, align: 'center' });
  });
  // ── repères ──
  // (17 novembre 2026) un repère n’existe que quand son objet est dessiné, serré sur lui
  if (a0 > 0) c.repere('adenosine', AD.x - 66, AD.y - 34, 130, 68, 'l’adénosine');
  if (a0 > 0 && lie3(t)) c.repere('phosphates', PX[0] - PR - 2, PY - PR - 2, PX[2] - PX[0] + 2 * PR + 4, 2 * PR + 4, 'les trois phosphates');
  if (a0 > 0 && lie3(t)) c.repere('atp', 80, 60, 340, 136, 'une molécule d’ATP');
  if (a0 > 0 && t < 4.5) c.repere('liaison', PX[1] + PR - 4, PY - 12, PX[2] - PX[1] - 2 * PR + 8, 24, 'la dernière liaison, celle qui se rompt');
  if (t >= 4.5 && t < 16.4) c.repere('phosphate_libre', x3 - PR - 2, y3 - PR - 2, 2 * PR + 34, 2 * PR + 4, 'le phosphate libre : Pi');
  if (t >= 8.2 && t < 16.4) c.repere('adp', 80, 60, 272, 136, 'l’ADP : adénosine + 2 phosphates');
  if (t >= 7.2) c.repere('energie', 424, 92, 108, 36, 'l’énergie libérée');
  if (t >= 5.6) c.repere('travail', 534, 76, 214, 120, 'le travail : une fibre musculaire qui se contracte');
  if (t >= 10.6) c.repere('kj', 540, 194, 200, 22, '30,5 kJ par mole d’ATP');
  if (t >= 12.4) c.repere('recharge', 486, 226, 264, 82, 'la recharge : énergie de la respiration ou de la fermentation');
  if (t >= 9.2) c.repere('ecrit_hydrolyse', 16, 246, 428, 22, 'ATP + H2O → ADP + Pi + énergie : hydrolyse');
  if (t >= 16.8) c.repere('ecrit_phosphorylation', 16, 270, 428, 22, 'ADP + Pi + énergie → ATP : phosphorylation');
  if (t >= 9.2) c.repere('equation', 14, 242, 432, t >= 16.8 ? 54 : 30, 'les équations : hydrolyse et phosphorylation');
  if (t >= 18.2) c.repere('cycle', 130, 300, 340, 120, 'le cycle ATP ⇄ ADP + Pi');
  if (t >= 21.0) c.repere('ecrit_regenere', 500, 334, 236, 46, 'l’ATP est régénéré en permanence');
}

function phase(t) {
  if (t < 1.2) return 'La molécule d’ATP apparaît.';
  if (t < 3) return 'Une molécule d’ATP : l’adénosine (masse violette) et trois phosphates (billes P) reliés par deux liaisons ; « ATP : adénosine + 3 phosphates ».';
  if (t < 4.5) return 'La dernière liaison, entre le 2e et le 3e phosphate, s’illumine : « la dernière liaison ».';
  if (t < 5.6) return 'La dernière liaison s’est rompue : un éclat ; le troisième phosphate sort.';
  if (t < 8.2) return 'L’énergie libérée part vers une fibre musculaire (« un travail de la cellule »), qui se contracte.';
  if (t < 9.2) return 'Il reste ADP (adénosine + 2 phosphates) et Pi.';
  if (t < 10.6) return 'Écrit sur la carte : ATP + H2O → ADP + Pi + énergie : hydrolyse.';
  if (t < 12.4) return 'Écrit sous la fibre : 30,5 kJ par mole d’ATP.';
  if (t < 15) return 'Un glucose dégradé (« respiration ou fermentation (glucose) ») envoie de l’énergie vers le Pi.';
  if (t < 16.4) return 'Le Pi revient se raccrocher à l’ADP, grâce à cette énergie.';
  if (t < 18.2) return 'L’ATP est reformé (3 phosphates) ; écrit : ADP + Pi + énergie → ATP : phosphorylation.';
  if (t < 19.6) return 'Le cycle à la craie : ATP → ADP + Pi, flèche orange « hydrolyse : énergie libérée ».';
  if (t < 21) return 'Le cycle se ferme : ADP + Pi → ATP, flèche verte « phosphorylation : énergie apportée ».';
  return 'Le cycle hydrolyse / phosphorylation ; « l’ATP ne se stocke presque pas : il est régénéré en permanence ».';
}
function ceQuiSeVoit() {
  const t = chrono.t;
  return `t = ${fr(t, 1)} s${chrono.running ? ' (ça avance)' : chrono.fait ? ' (fin)' : ' (arrêté)'}. ${phase(t)} Molécule affichée : ${lie3(t) ? 'ATP (3 phosphates liés)' : 'ADP + Pi'} ; fibre musculaire ${t < 5.6 ? 'pas encore dessinée' : t >= 7 && t < 12.2 ? 'contractée' : 'au repos'}.`;
}

$('run').onclick = chrono.clic;
window.Tableau.explication({ atp: [
  { repere: 'adenosine', texte: 'L’ATP, c’est une adénosine…' },
  { repere: 'phosphates', texte: '… et trois phosphates reliés par deux liaisons.' },
  { repere: 'liaison', texte: 'Quand la dernière liaison se rompt, de l’énergie est libérée.' },
  { repere: 'travail', texte: 'Cette énergie sert à un travail de la cellule, ici une contraction : 30,5 kJ par mole d’ATP.' },
  { repere: 'equation', texte: 'ATP + H2O donne ADP + Pi + énergie : c’est l’hydrolyse.' },
  { repere: 'recharge', texte: 'L’énergie de la respiration ou de la fermentation raccroche le Pi : c’est la phosphorylation.' },
  { repere: 'cycle', texte: 'L’ATP ne se stocke presque pas : il est régénéré en permanence.' } ] });
const commandes = ['start', 'reset', 'pause', 'resume', 'set_time', 'play_until'];
const config = { id: 'svt_energie_atp', version: '1.0', title: 'L’ATP, la petite monnaie de la cellule', variants: [{ id: 'atp', label: 'ATP' }], commands: commandes,
  command_schema: { set_time: { time_s: `0..${FIN} (arrêt sur cet instant)` }, play_until: { moment: Object.keys(M).join(' | ') + ' (rejoue et se fige à cet instant clé)', time_s: 'ou un instant en s' } } };
const pont = protocole({ id: config.id, commandes, config,
