</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="/media/simulations/svt/notion_information_genetique-tableau/commun.js"></script>
<script src="/media/simulations/svt/notion_information_genetique-tableau/etapes.js"></script>

<script>
/*
 * Départ de zéro du cours « Libération de l’énergie emmagasinée dans la matière organique » (14 novembre 2026,
 * règle 34 du skill professeur) : ce que le cours utilisait comme connu (la cellule, le hyaloplasme, la mitochondrie,
 * le glucose, l’énergie chimique) enseigné avant, chaque notion dite deux fois autrement.
 * Moteur : celui des pages « tableau » de la génétique (etapes.js : vues, moments, play_until, autoDepart).
 * Vue cellule : une cellule peinte ; membrane, hyaloplasme, noyau, mitochondries (leur rôle est vu plus tard) ;
 *   puis autrement : une petite ville (la mairie = noyau, les rues = hyaloplasme, de petites usines = mitochondries).
 * Vue glucose : du pain (amidon) au sang (glucose), la molécule C6H12O6 et ses six carbones, l’énergie chimique
 *   rangée dans ses liaisons, libérée quand on la casse ; puis autrement : une bûche qui brûle d’un coup, la cellule
 *   qui la « brûle » pas à pas.
 */
const { rampe, entre, Peint } = window.Etapes;
const TAU = Math.PI * 2;

function mitochondrie(x, cx, cy, L, H, ang, a) {
  // (16 novembre 2026) la mitochondrie commune (deux membranes, crêtes, matrice bleue), assez grande pour être reconnue
  x.save(); x.globalAlpha = a; window.SVTPeinture.mitochondrie(x, cx, cy, L, H, { angle: ang, cretes: 5, graine: 3, grains: 8 }); x.restore();
}
function usine(x, cx, cy, a) {
  x.save(); x.globalAlpha = a;
  const g = x.createLinearGradient(cx - 30, 0, cx + 30, 0); g.addColorStop(0, '#94a3b8'); g.addColorStop(1, '#475569');
  x.fillStyle = g; x.fillRect(cx - 30, cy - 14, 60, 30); x.fillStyle = '#334155'; x.fillRect(cx + 14, cy - 40, 10, 28);
  x.fillStyle = 'rgba(203,213,225,.6)'; for (let i = 0; i < 3; i++) { x.beginPath(); x.arc(cx + 19 + i * 6, cy - 48 - i * 8, 5 + i * 2, 0, TAU); x.fill(); }
  x.fillStyle = '#fde68a'; for (let i = 0; i < 3; i++) x.fillRect(cx - 24 + i * 14, cy - 6, 8, 8);
  x.restore();
}
function maisonnette(x, cx, cy, a, couleur) {
  x.save(); x.globalAlpha = a; x.fillStyle = couleur; x.fillRect(cx - 14, cy - 8, 28, 20);
  x.fillStyle = '#9a3412'; x.beginPath(); x.moveTo(cx - 18, cy - 8); x.lineTo(cx, cy - 22); x.lineTo(cx + 18, cy - 8); x.closePath(); x.fill(); x.restore();
}

/* ── Vue cellule ─────────────────────────────────────────────────────────── */
/* (17 novembre 2026) un moment par chose dite : la ville d’abord (ses maisons), puis la mairie, les rues et les usines,
 * chacune dessinée et écrite quand la voix la nomme (avant, tout s’écrivait d’un coup bien avant d’être dit). */
const MC = { d_cellule: 2.0, d_membrane: 3.6, d_hyaloplasme: 5.2, d_noyau: 6.8, d_mitochondries: 8.8, d_ville: 10.0, d_mairie: 11.0, d_rues: 12.0, d_usines: 13.0 };
// (17 novembre 2026) positions vérifiées : chaque mitochondrie (40 × 17) reste à ≤ 0,87 du bord de la cellule
// (ellipse 200 × 140) et loin du noyau ; avant, celle du haut à gauche mordait la membrane et celle du haut à droite débordait
const MITOS = [[160, 175, .55], [200, 305, -.2], [320, 312, .1], [355, 158, .55], [115, 240, 1.35]];
function dessinerCellule(c, k) {
  const t = k.t;
  c.direct(() => {
    const x = c.ctx;
    Peint.cellule(x, 250, 230, 200, 140, rampe(t, .3, .8));
    Peint.noyau(x, 280, 220, 52, rampe(t, .5, .8));
    MITOS.forEach(([mx, my, an], i) => mitochondrie(x, mx, my, 40, 17, an, rampe(t, 7.4 + i * .2, .5)));
    if (t >= 8.9) { const a = rampe(t, 8.9, .6);   // l’autre façon : une petite ville (ses maisons d’abord)
      maisonnette(x, 560, 140, a, '#e2e8f0'); maisonnette(x, 700, 140, a, '#e2e8f0'); maisonnette(x, 560, 250, a, '#fecaca');
    }
    if (t >= 10.0) { const a = rampe(t, 10.0, .5);   // la mairie (= le noyau)
      x.save(); x.globalAlpha = a; const gm = x.createLinearGradient(0, 220, 0, 270); gm.addColorStop(0, '#fef3c7'); gm.addColorStop(1, '#d6b36a'); x.fillStyle = gm; x.fillRect(672, 222, 56, 44); x.fillStyle = '#92400e'; x.beginPath(); x.moveTo(666, 222); x.lineTo(700, 200); x.lineTo(734, 222); x.closePath(); x.fill(); x.restore();
    }
    if (t >= 11.0) { const a = rampe(t, 11.0, .5);   // les rues (= le hyaloplasme)
      x.save(); x.globalAlpha = a; x.fillStyle = 'rgba(148,163,184,.45)'; x.fillRect(520, 170, 220, 14); x.fillRect(620, 110, 14, 190); x.restore();
    }
    if (t >= 12.0) { const a = rampe(t, 12.0, .5); usine(x, 690, 330, a); usine(x, 580, 340, a); }   // les usines (= les mitochondries)
  });
  c.texte('La cellule : où tout se passe', 14, 26, { couleur: 'cyan', taille: 18 });
  c.repere('cellule', 50, 90, 400, 280, 'une cellule');
  if (k.ecrit(c, 'mem', 2.6)) { c.fleche(40, 350, 82, 300, { couleur: 'faible', largeur: 1.4 }); k.T(c, 'la membrane plasmique', 14, 372, { couleur: 'blanc', taille: 14 }); }
  if (t >= 2.6) c.repere('membrane', 46, 200, 34, 70, 'la membrane plasmique');
  if (k.ecrit(c, 'hya', 4.2)) { c.fleche(250, 392, 250, 340, { couleur: 'faible', largeur: 1.4 }); k.T(c, 'le hyaloplasme (le liquide intérieur)', 190, 408, { couleur: 'blanc', taille: 14 }); }
  if (t >= 4.2) c.repere('hyaloplasme', 232, 282, 90, 50, 'le hyaloplasme');
  if (k.ecrit(c, 'noy', 5.8)) { c.fleche(372, 84, 300, 168, { couleur: 'faible', largeur: 1.4 }); k.T(c, 'le noyau : il commande', 340, 72, { couleur: 'blanc', taille: 14 }); }
  if (t >= 5.8) c.repere('noyau', 226, 166, 108, 108, 'le noyau');
  if (k.ecrit(c, 'mit', 8.0)) { c.fleche(96, 124, 130, 158, { couleur: 'faible', largeur: 1.4 }); k.T(c, 'des mitochondries', 8, 96, { couleur: 'orange', taille: 14 }); k.T(c, '(leur rôle : plus loin)', 8, 117, { couleur: 'faible', taille: 12 }); }   // étiquette en haut à gauche : avant, elle recouvrait la maison de la petite ville
  if (t >= 8.0) c.repere('mitochondries', 125, 150, 72, 52, 'une mitochondrie');
  if (t >= 8.9) c.repere('ville', 510, 100, 240, 270, 'la cellule vue comme une petite ville');
  if (k.ecrit(c, 'vil', 9.2)) k.T(c, 'autrement : une petite ville', 630, 96, { couleur: 'cyan', taille: 14, align: 'center' });
  if (t >= 10.0) c.repere('mairie', 664, 198, 74, 70, 'la mairie (= le noyau)');
  if (k.ecrit(c, 'mai', 10.2)) k.T(c, 'mairie = noyau', 568, 392, { couleur: 'blanc', taille: 12, align: 'center' });
  if (t >= 11.0) c.repere('rues', 518, 166, 224, 22, 'les rues (= le hyaloplasme)');
  if (k.ecrit(c, 'rue', 11.2)) k.T(c, 'rues = hyaloplasme', 692, 392, { couleur: 'blanc', taille: 12, align: 'center' });
  if (t >= 12.0) c.repere('usines', 548, 272, 174, 86, 'de petites usines (= les mitochondries)');
  if (k.ecrit(c, 'usi', 12.2)) k.T(c, 'petites usines = mitochondries', 630, 410, { couleur: 'orange', taille: 12, align: 'center' });
}
function voitCellule(k) {
  const t = k.t, m = ['Une cellule peinte, rose, avec un noyau violet.'];
  if (t >= 2.6) m.push('Légendes : la membrane plasmique ; le hyaloplasme (le liquide intérieur) ; le noyau (il commande).');
  if (t >= 8.0) m.push('Des mitochondries peintes, orange, avec des replis : « des mitochondries (leur rôle : plus loin) ».');
  if (t >= 9.2) m.push('À droite, une petite ville : des maisons.');
  if (t >= 10.2) m.push('La mairie est dessinée : « mairie = noyau ».');
  if (t >= 11.2) m.push('Les rues sont tracées : « rues = hyaloplasme ».');
  if (t >= 12.2) m.push('Deux petites usines fument : « petites usines = mitochondries ».');
  return m;
}

/* ── Vue glucose ─────────────────────────────────────────────────────────── */
/* (17 novembre 2026) la bûche, puis le feu (« quand il brûle »), puis la cellule pas à pas : chacun à son moment. */
const MG = { g_pain: 1.8, g_sang: 4.4, g_molecule: 7.2, g_liaisons: 9.4, g_casser: 11.8, g_buche: 13.0, g_feu: 14.2, g_pas_a_pas: 16.2 };
function pain(x, cx, cy, a) {
  x.save(); x.globalAlpha = a;
  const g = x.createRadialGradient(cx - 14, cy - 14, 4, cx, cy, 52); g.addColorStop(0, '#fcd34d'); g.addColorStop(.7, '#d97706'); g.addColorStop(1, '#92400e');
  x.fillStyle = g; x.beginPath(); x.ellipse(cx, cy, 54, 30, 0, 0, TAU); x.fill();
  x.strokeStyle = 'rgba(120,53,15,.8)'; x.lineWidth = 2; for (let i = -1; i <= 1; i++) { x.beginPath(); x.moveTo(cx + i * 22 - 8, cy - 14); x.lineTo(cx + i * 22 + 8, cy + 6); x.stroke(); }
  x.restore();
}
/* Le glucose du lexique visuel commun (18 novembre 2026, règle 15) : la chaîne DROITE de 6 billes jaunes, comme dans
 * toutes les simulations du site (il était un anneau ici). Quand les liaisons cassent, les carbones se séparent. */
function chaineGlucose(x, cx, cy, a, casse) {
  const L = window.Lexique, pts = L.positionsChaine(6, cx, cy).map(([px, py], i) => [px + (i - 2.5) * casse * 6, py + (i % 2 ? 1 : -1) * casse * 16]);
  L.chaine(x, pts, { alpha: a, liaisons: [0, 1, 2, 3, 4].map(() => 1 - casse) });
}
function eclairs(x, cx, cy, a, n = 7, R = 70) {
  x.save(); x.globalAlpha = a; x.strokeStyle = '#facc15'; x.lineWidth = 3; x.lineCap = 'round';
  for (let i = 0; i < n; i++) { const an = i * TAU / n + .3, r0 = R * .7, r1 = R * 1.15; x.beginPath(); x.moveTo(cx + Math.cos(an) * r0, cy + Math.sin(an) * r0); x.lineTo(cx + Math.cos(an + .08) * (r0 + r1) / 2, cy + Math.sin(an + .08) * (r0 + r1) / 2); x.lineTo(cx + Math.cos(an) * r1, cy + Math.sin(an) * r1); x.stroke(); }
  x.restore();
}
function buche(x, cx, cy, a, feu) {
  x.save(); x.globalAlpha = a;
  const g = x.createLinearGradient(0, cy - 14, 0, cy + 14); g.addColorStop(0, '#a16207'); g.addColorStop(1, '#451a03');
  x.fillStyle = g; x.beginPath(); x.ellipse(cx, cy, 60, 14, -.08, 0, TAU); x.fill();
  x.fillStyle = '#d6a76c'; x.beginPath(); x.ellipse(cx + 58, cy - 4, 6, 13, -.08, 0, TAU); x.fill();
  if (feu > 0) for (let i = -2; i <= 2; i++) { const fx = cx + i * 20, h = 40 + (i % 2) * 14; const gf = x.createRadialGradient(fx, cy - 8, 2, fx, cy - h / 2, h); gf.addColorStop(0, '#fef08a'); gf.addColorStop(.5, '#fb923c'); gf.addColorStop(1, 'rgba(239,68,68,0)'); x.globalAlpha = a * feu; x.fillStyle = gf; x.beginPath(); x.moveTo(fx, cy - 8 - h); x.quadraticCurveTo(fx + 16, cy - 16, fx, cy - 6); x.quadraticCurveTo(fx - 16, cy - 16, fx, cy - 8 - h); x.fill(); }
  x.restore();
}
function dessinerGlucose(c, k) {
  const t = k.t, casse = rampe(t, 10.0, 1.4);
  c.direct(() => {
    const x = c.ctx;
    pain(x, 90, 130, rampe(t, .3, .7));
    if (t >= 2.4) { // le vaisseau sanguin, avec des petits glucoses qui passent
      const a = rampe(t, 2.4, .6), g = x.createLinearGradient(0, 112, 0, 152); g.addColorStop(0, '#7f1d1d'); g.addColorStop(.5, '#dc2626'); g.addColorStop(1, '#7f1d1d');
      x.save(); x.globalAlpha = a; x.fillStyle = g; x.beginPath(); x.moveTo(190, 112); x.lineTo(470, 112); x.lineTo(470, 152); x.lineTo(190, 152); x.fill();
      for (let i = 0; i < 4; i++) { const px = 214 + ((t * 40 + i * 52) % 224); window.Lexique.glucose(x, px, 132, { echelle: .26, alpha: a }); }
      x.restore();
    }
    if (t >= 5.6) chaineGlucose(x, 230, 296, rampe(t, 5.6, .6), casse);
    if (t >= 8.2 && t < 10.2) { x.save(); x.globalAlpha = .5 * rampe(t, 8.2, .5); x.strokeStyle = '#facc15'; x.lineWidth = 10; x.lineCap = 'round'; x.beginPath(); x.moveTo(230 - 70, 296); x.lineTo(230 + 70, 296); x.stroke(); x.restore(); }
    if (casse > 0) eclairs(x, 230, 296, casse * (1 - rampe(t, 12.6, 1.2) * .5), 8, 64);
    if (t >= 12.0) { const a = rampe(t, 12.0, .6); buche(x, 620, 300, a, rampe(t, 13.2, .6)); }
    if (t >= 14.4) {   // la cellule, elle, descend l’escalier : une petite étincelle à chaque marche
      for (let i = 0; i < 4; i++) { const u = rampe(t, 14.4 + i * .4, .3); if (u <= 0) continue;
        x.save(); x.globalAlpha = u; x.strokeStyle = '#e2e8f0'; x.lineWidth = 2.2; x.lineCap = 'round';
        x.beginPath(); x.moveTo(548 + i * 40, 393 + i * 6); x.lineTo(588 + i * 40, 393 + i * 6); x.lineTo(588 + i * 40, 399 + i * 6); x.stroke(); x.restore();
        eclairs(x, 568 + i * 40, 383 + i * 6, u, 5, 9); }
    }
  });
  c.texte('Le glucose : de l’énergie rangée dans une molécule', 14, 26, { couleur: 'cyan', taille: 18 });
  c.repere('pain', 34, 96, 112, 70, 'du pain : de l’amidon');
  if (k.ecrit(c, 'pain', .6)) k.T(c, 'le pain : de l’amidon', 90, 184, { couleur: 'blanc', taille: 13, align: 'center' });
  if (t >= 2.4) c.repere('sang', 190, 108, 280, 48, 'le glucose dans le sang');
  if (k.ecrit(c, 'sang', 2.8)) { c.fleche(150, 132, 186, 132, { couleur: 'faible', largeur: 1.4 }); k.T(c, 'digestion → du glucose dans le sang', 330, 98, { couleur: 'blanc', taille: 13, align: 'center' }); c.fleche(474, 132, 520, 132, { couleur: 'faible', largeur: 1.4 }); k.T(c, '→ les cellules', 590, 136, { couleur: 'blanc', taille: 13, align: 'center' }); }
  if (t >= 5.6) c.repere('molecule', 144, 266, 172, 60, 'une molécule de glucose');
  if (k.ecrit(c, 'mol', 6.0)) { k.T(c, 'glucose : C₆H₁₂O₆', 230, 196, { couleur: 'jaune', taille: 16, align: 'center' }); k.T(c, 'six carbones en chaîne', 230, 392, { couleur: 'faible', taille: 13, align: 'center' }); }
  if (t >= 8.2) c.repere('liaisons', 150, 276, 160, 40, 'les liaisons entre les atomes');
  if (k.ecrit(c, 'lia', 8.4)) { k.T(c, 'l’énergie est rangée', 352, 262, { couleur: 'jaune', taille: 14 }); k.T(c, 'dans les liaisons :', 352, 284, { couleur: 'jaune', taille: 14 }); k.T(c, 'énergie chimique', 352, 306, { couleur: 'orange', taille: 15 }); }
  if (k.ecrit(c, 'cas', 10.6)) k.T(c, 'liaisons cassées → énergie libérée', 230, 415, { couleur: 'vert', taille: 14, align: 'center' });
  if (t >= 12.0) c.repere('buche', 556, 282, 132, 34, 'une bûche');
  if (t >= 13.2) c.repere('feu', 560, 236, 120, 58, 'le feu : la chaleur d’un coup');
  if (k.ecrit(c, 'buc', 12.3)) k.T(c, 'autrement : une bûche de bois', 620, 226, { couleur: 'cyan', taille: 13, align: 'center' });
  if (k.ecrit(c, 'feu', 13.4)) k.T(c, 'elle brûle : la chaleur sort d’un coup', 620, 340, { couleur: 'orange', taille: 13, align: 'center' });
  if (t >= 14.4) c.repere('pas_a_pas', 540, 348, 176, 70, 'la cellule : pas à pas');
  if (k.ecrit(c, 'pas', 14.4)) k.T(c, 'la cellule, elle, avance pas à pas', 620, 362, { couleur: 'vert', taille: 13, align: 'center' });
}
function voitGlucose(k) {
  const t = k.t, m = ['En haut à gauche, du pain peint (de l’amidon).'];
  if (t >= 2.8) m.push('Un vaisseau sanguin rouge où passent de petits hexagones jaunes : la digestion donne du glucose dans le sang, qui va aux cellules.');
  if (t >= 6.0) m.push('Une molécule de glucose en grand : une chaîne droite de six carbones (billes jaunes) ; écrit « glucose : C₆H₁₂O₆ ».');
  if (t >= 8.4) m.push('Les liaisons brillent : « l’énergie est rangée dans les liaisons : énergie chimique ».');
  if (t >= 10.6) m.push('La chaîne se casse, des éclairs jaunes en sortent : « liaisons cassées → énergie libérée ».');
  if (t >= 12.3) m.push('À droite, une bûche de bois peinte.');
  if (t >= 13.4) m.push('La bûche brûle, de grandes flammes : « elle brûle : la chaleur sort d’un coup ».');
  if (t >= 14.4) m.push('En dessous, un petit escalier, une étincelle à chaque marche : « la cellule, elle, avance pas à pas ».');
  return m;
}

/* Tableau large (portable 1366 × 613, 15 novembre 2026) : le cadre prend la largeur du tableau (option large du Scene
 * de la génétique, qu'on demande ici sans toucher à etapes.js) et la mosaïque (SVTLarge.Mosaique, peinture.js) centre le dessin, textes
 * 1,15 fois plus gros ; grand écran : inchangé. */
let MOS = null;
{
  const S0 = window.GenetiqueTableau.Scene;
  window.GenetiqueTableau.Scene = (canvas, dessiner, o = {}) => {
    const sc = S0(canvas, dessiner, { ...o, large: true });
    MOS = window.SVTLarge.Mosaique(sc, (L) => L >= 1000 ? (() => { const z = Math.min(1.11, (L - 30) / 760); return { police: 1.15, blocs: [{ src: [0, 40, 760, 380], X: (L - 760 * z) / 2 - (L - 760) / 2, Y: (420 - 380 * z) / 2, s: z }] }; })()   /* etapes.js centre déjà le dessin (L − 760)/2 : on ne le décale pas deux fois ; le titre interne (bande du haut) est laissé hors du bloc, la figure prend la hauteur */ : null);
    return sc;
  };
}
const enMosaique = (f) => (c, k) => (MOS ? MOS.dessiner(c, () => f(c, k)) : f(c, k));
window.Etapes.lancer({
  id: 'svt_depart_energie', titre: 'La cellule et le glucose', graine: 53,
  vues: {
    cellule: { titre: 'La cellule', fin: 13.6, moments: MC, autoDepart: false, dessiner: enMosaique(dessinerCellule), voit: voitCellule,
      motifs: { d_cellule: 'une cellule', d_membrane: 'la membrane plasmique', d_hyaloplasme: 'le hyaloplasme', d_noyau: 'le noyau', d_mitochondries: 'des mitochondries', d_ville: 'la cellule vue comme une petite ville', d_mairie: 'la mairie : le noyau', d_rues: 'les rues : le hyaloplasme', d_usines: 'de petites usines : les mitochondries' },
      conclusion: 'La cellule : une membrane, le hyaloplasme, un noyau, des mitochondries.',
      texte: 'Une cellule : membrane plasmique, hyaloplasme (liquide intérieur), noyau (il commande), mitochondries (rôle vu plus tard) ; comme une petite ville.',
      explication: [{ repere: 'membrane', texte: 'La membrane entoure la cellule.' }, { repere: 'hyaloplasme', texte: 'Le hyaloplasme est le liquide intérieur.' }, { repere: 'mitochondries', texte: 'Des mitochondries : leur rôle est vu plus loin.' }] },
    glucose: { titre: 'Le glucose et l’énergie chimique', fin: 16.8, moments: MG, autoDepart: false, dessiner: enMosaique(dessinerGlucose), voit: voitGlucose,
      motifs: { g_pain: 'du pain : de l’amidon', g_sang: 'du glucose dans le sang', g_molecule: 'une molécule de glucose, six carbones', g_liaisons: 'l’énergie chimique, dans les liaisons', g_casser: 'liaisons cassées : énergie libérée', g_buche: 'une bûche de bois', g_feu: 'la bûche brûle : la chaleur d’un coup', g_pas_a_pas: 'la cellule avance pas à pas' },
      conclusion: 'Le glucose contient de l’énergie chimique, rangée dans ses liaisons ; la cellule la libère pas à pas.',
      texte: 'Du pain (amidon) au glucose du sang ; la molécule C₆H₁₂O₆ (six carbones) ; énergie chimique dans les liaisons, libérée quand elles se cassent ; comme une bûche qui brûle, mais pas à pas.',
      explication: [{ repere: 'molecule', texte: 'Le glucose : six carbones en chaîne.' }, { repere: 'liaisons', texte: 'L’énergie est rangée dans les liaisons.' }, { repere: 'buche', texte: 'Comme une bûche qui brûle, mais la cellule avance pas à pas.' }] },
  },
});
