<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Le carrefour de l’acide pyruvique — au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="svt.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Une cellule peinte : dans le hyaloplasme, la glycolyse coupe le glucose en deux acides pyruviques, au carrefour ; un interrupteur O2 décide : avec dioxygène, l'acide pyruvique entre dans la mitochondrie (respiration cellulaire : acétyl-CoA et cycle de Krebs dans la matrice, chaîne respiratoire sur la membrane interne) ; sans dioxygène, il reste dans le hyaloplasme (fermentation) ; en bas, les bilans des deux voies"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start reset pause resume play_until set_time set_parameters">Lancer</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="commun.js"></script>
<script src="peinture.js"></script>
<script>
/*
 * Le carrefour de l’acide pyruvique (cours SVT « Libération de l’énergie »), 10 novembre 2026.
 * Vues (?vue=) : plan (cases vides « ? » pour les produits et les ATP) et complet (les bilans se remplissent).
 * Ce qui se voit (t en s de la scène) :
 *   glycolyse_faite (3)       : glucose → 2 acides pyruviques, dans le hyaloplasme ;
 *   carrefour (4,2)           : le carrefour entouré, deux routes en pointillé ;
 *   question_o2 (5,4)         : « avec ou sans dioxygène ? » (l’interrupteur O2 attend) ;
 *   avec_o2_vers_matrice (9)  : O2 présent : l’acide pyruvique entre dans la mitochondrie : respiration cellulaire ;
 *   sans_o2_sur_place         : O2 absent : il reste dans le hyaloplasme : fermentation (13 ; 16 en vue complète) ;
 *   complet seulement (17 novembre 2026 : un moment par chose dite, rien d’écrit avant d’être dit) :
 *     glycolyse_bilan (3,6) : + 2 ATP, 2 NADH,H+ ; matrice_krebs (9,8) : matrice : acétyl-CoA → cycle de Krebs ;
 *     chaine_respiratoire (10,6) : membrane interne : chaîne respiratoire ; bilan_38 (12) : 6 CO2 + 6 H2O, 38 ATP ;
 *     degradation_complete (13) ; bilan_2 (17,2) : acide lactique, ou éthanol + CO2 ; 2 ATP ; degradation_incomplete (18,2).
 * Poignée : l’interrupteur O2 (glisser vers « présent » ou « absent ») = set_parameters {o2: true | false} ;
 * il rejoue jusqu’au moment de la voie choisie. C’est l’acide pyruvique qui entre dans la mitochondrie, pas le glucose.
 */
const { bulle, protocole } = window.Tableau;
const { Scene, Chrono, Apparitions, doux, mix, fr } = window.SVTTableau;
const P = window.SVTPeinture;
const $ = id => document.getElementById(id);

const VUES = ['plan', 'complet'];
const demande = new URLSearchParams(location.search).get('vue');
const vue = VUES.includes(demande) ? demande : 'complet';
const COMPLET = vue === 'complet';
const M = COMPLET
  ? { glycolyse_faite: 3, glycolyse_bilan: 3.6, carrefour: 4.2, question_o2: 5.4, avec_o2_vers_matrice: 9, matrice_krebs: 9.8, chaine_respiratoire: 10.6,
      bilan_38: 12, degradation_complete: 13, sans_o2_sur_place: 16, bilan_2: 17.2, degradation_incomplete: 18.2 }
  : { glycolyse_faite: 3, carrefour: 4.2, question_o2: 5.4, avec_o2_vers_matrice: 9, sans_o2_sur_place: 13 };
const FIN = COMPLET ? 19 : 14.5;
/* Les instants où chaque écrit commence (un peu avant son moment). */
const T = COMPLET ? { avec: 7.4, krebs: 9.2, chaine: 10.0, b38: 11.2, compl: 12.5, sans: 15.2, b2: 16.4, incompl: 17.7 } : { avec: 7.4, sans: 11.2 };
const MOTIFS = {
  glycolyse_faite: 'la glycolyse a donné deux acides pyruviques',
  glycolyse_bilan: 'la glycolyse donne aussi 2 ATP et 2 NADH,H+',
  carrefour: 'un carrefour : deux routes',
  question_o2: 'au carrefour : avec ou sans dioxygène ?',
  matrice_krebs: 'dans la matrice : acétyl-CoA puis cycle de Krebs',
  chaine_respiratoire: 'dans la membrane interne : la chaîne respiratoire',
  degradation_complete: 'respiration : dégradation complète',
  degradation_incomplete: 'fermentation : dégradation incomplète',
  avec_o2_vers_matrice: 'avec O2 : l’acide pyruvique entre dans la mitochondrie',
  sans_o2_sur_place: 'sans O2 : il reste dans le hyaloplasme, c’est la fermentation',
  bilan_38: 'le bilan de la respiration : 38 ATP',
  bilan_2: 'le bilan de la fermentation : 2 ATP',
};
/* Les périodes de la ligne de temps où l’interrupteur est sur « présent » / « absent ». */
const AVEC = COMPLET ? [[6, 14]] : [[6, 10]], SANS = COMPLET ? [[14, 99]] : [[10, 99]];
const dans = (L, t) => L.find(([a, b]) => t >= a && t < b);
const o2At = (t) => (dans(AVEC, t) ? true : dans(SANS, t) ? false : null);

/* Mise en page du 16 novembre 2026 (cadre étroit, textes ≥ 15 px) : cellule agrandie ; la mitochondrie en bas à droite, son nom
 * juste au-dessus, les trois lignes de la respiration au-dessus encore ; la fermentation en bas à gauche ; rien ne se recouvre. */
const CEL = { x: 300, y: 182, rx: 294, ry: 160 }, MITO = { x: 425, y: 262, rx: 105, ry: 46 };
const GLU = { x: 110, y: 125 }, CAR = { x: 215, y: 165 }, RAIL = { x0: 640, x1: 724, y: 112 };
const CARBONE = [250, 204, 21];
let poigneeX = null;   // position de l’interrupteur pendant qu’on le glisse

const canvas = $('canvas');
const scene = Scene(canvas, (c) => { scene.cadre(COMPLET ? 71 : 73); MOS.dessiner(c, () => { dessiner(c); }); return c.fin(); }, { large: true });
/* Tableau large (portable 1366 × 613) : la page est rangée sur toute la largeur (SVTLarge.Mosaique, dans peinture.js) ; grand écran : inchangée. */
const MOS = window.SVTLarge.Mosaique(scene, (L) => L >= 1140 ? (() => {
  // cadre large et bas (16 novembre 2026) : la cellule prend toute la hauteur à gauche ; à droite, l'interrupteur puis les deux bilans empilés
  const z = 1.16, x0 = 14 + 598 * z + 20, Wr = L - x0 - 14, sb = Math.min(1.04, Wr / 380);
  return { police: 1.15, blocs: [
    { src: [0, 14, 598, 334], X: 14, Y: (420 - 334 * z) / 2, s: z, police: 1 },
    { src: [598, 10, 162, 200], X: x0 + (Wr - 162 * 1.25) / 2, Y: 2, s: 1.25 },
    { src: [0, 346, 380, 74], X: x0 + (Wr - 380 * sb) / 2, Y: 258, s: sb },
    { src: [380, 346, 380, 74], X: x0 + (Wr - 380 * sb) / 2, Y: 258 + 78 * sb, s: sb }] }; })()
  : L >= 1000 ? { police: 1.15, blocs: [
  { src: [0, 0, 598, 346], X: 14 + Math.max(0, (L - 1218) / 2), Y: 0, s: 1, police: 1 },                      // la cellule, le carrefour, la mitochondrie
  { src: [598, 10, 162, 200], X: Math.min(L, 1218) - 162 * 1.55 - 14 + Math.max(0, (L - 1218) / 2), Y: 6, s: 1.55 },          // l’interrupteur O2 et la question
  { src: [0, 346, 760, 74], X: Math.min(L, 1218) - 774 + Math.max(0, (L - 1218) / 2), Y: 346, s: 1 }] } : null);
const ecrit = Apparitions(scene);
const chrono = Chrono({ fin: () => FIN, moments: () => M, motifs: MOTIFS, bouton: $('run'), bulle: $('feedback'), pont: () => pont,
  depart: 'Le glucose arrive dans le hyaloplasme…', reinit: () => ecrit.oublier(),
  fini: () => COMPLET ? 'Avec O2 : respiration, 38 ATP. Sans O2 : fermentation, 2 ATP.' : 'Avec O2 : la mitochondrie. Sans O2 : le hyaloplasme. Et les bilans ?' });
scene.avancer = chrono.avancer;

/* Les 6 carbones : glucose (deux rangées de 3), puis deux acides pyruviques au carrefour.
 * 17 novembre 2026 (faciliter le suivi, règle 40 du professeur) : le glucose ne disparaît pas de sa place — il y reste,
 * pâli et marqué « (dégradé) » ; ce sont ses 6 carbones (copies) qui glissent vers le carrefour et deviennent les deux
 * acides pyruviques. La baguette qui montre « le glucose » tombe toujours sur un glucose, et l'élève voit d'où viennent
 * les acides pyruviques. */
function carbone(i, t) {
  const u = doux(chrono.part(1.6, 2.9, t));
  const x0 = GLU.x + (i % 3 - 1) * 18, y0 = GLU.y + (i < 3 ? -9 : 9);
  const x1 = CAR.x + (i % 3 - 1) * 18, y1 = CAR.y + (i < 3 ? -14 : 14);
  return [mix(x0, x1, u), mix(y0, y1, u)];
}
/* Les copies qui entrent dans la mitochondrie, pendant chaque période « présent ». */
function entree(t) { const p = dans(AVEC, t); return p ? doux(chrono.part(p[0] + .4, p[0] + 2.4, t)) : 0; }

function boite(c, x, y, w, titre, lignes, couleur) {
  c.rect(x, y, w, 66, { couleur, largeur: 1.6 });
  c.texte(titre, x + 10, y + 18, { couleur, taille: 14 });
  lignes.forEach((s, i) => c.texte(s, x + 10, y + 39 + i * 21, { couleur: s.includes('?') ? 'faible' : 'blanc', taille: 13, max: w - 20 }));
}

function dessiner(c) {
  const t = chrono.t, o2 = poigneeX != null ? poigneeX > (RAIL.x0 + RAIL.x1) / 2 : o2At(t), e = entree(t);
  c.direct(() => {
    const ctx = c.ctx;
    P.cellule(ctx, CEL.x, CEL.y, CEL.rx, CEL.ry, { grains: 130, graine: 31 });
    ctx.save(); if (o2 === false) ctx.globalAlpha = .7;
    P.mitochondrie(ctx, MITO.x, MITO.y, MITO.rx, MITO.ry, { cretes: 6, graine: 9 }); ctx.restore();
    const a = doux(chrono.part(.3, 1.3, t));
    // le glucose reste à sa place : pâli dès que la glycolyse l'a coupé
    const reste = a * mix(1, .32, doux(chrono.part(1.6, 2.9, t)));
    const glu = (i) => [GLU.x + (i % 3 - 1) * 18, GLU.y + (i < 3 ? -9 : 9)];
    for (const i of [0, 1, 3, 4]) { const [x1, y1] = glu(i), [x2, y2] = glu(i + 1); P.liaison(ctx, x1, y1, x2, y2, { alpha: reste, epaisseur: 3.6 }); }
    for (let i = 0; i < 6; i++) { const [x, y] = glu(i); P.bille(ctx, x, y, 9, CARBONE, { alpha: reste }); }
    // ses carbones (copies) qui deviennent les deux acides pyruviques : deux chaînes de 3 carbones
    if (t > 1.6) for (const i of [0, 1, 3, 4]) { const [x1, y1] = carbone(i, t), [x2, y2] = carbone(i + 1, t); P.liaison(ctx, x1, y1, x2, y2, { alpha: a, epaisseur: 3.6 }); }
    if (t > 1.6) for (let i = 0; i < 6; i++) { const [x, y] = carbone(i, t); P.bille(ctx, x, y, 9, CARBONE, { alpha: a }); }
    // les acides pyruviques qui entrent dans la matrice (copies, pour montrer le chemin)
    if (e > 0) for (let g = 0; g < 2; g++) for (let i = 0; i < 3; i++) {
      const x = mix(CAR.x + (i - 1) * 18, MITO.x - 30 + (i - 1) * 16, e), y = mix(CAR.y + (g ? 14 : -14), MITO.y + (g ? 12 : -12), e);
      P.bille(ctx, x, y, 8, CARBONE, { alpha: .95 });
    }
    // l’interrupteur O2 (peint : un rail et un bouton)
    const kx = poigneeX ?? (o2 === true ? RAIL.x1 : o2 === false ? RAIL.x0 : (RAIL.x0 + RAIL.x1) / 2);
    ctx.save(); ctx.fillStyle = o2 === true ? 'rgba(74,222,128,.28)' : o2 === false ? 'rgba(248,113,113,.22)' : 'rgba(226,232,240,.12)';
    ctx.beginPath(); ctx.roundRect(RAIL.x0 - 14, RAIL.y - 12, RAIL.x1 - RAIL.x0 + 28, 24, 12); ctx.fill(); ctx.restore();
    P.bille(ctx, kx, RAIL.y, 11, o2 === true ? [74, 222, 128] : o2 === false ? [248, 113, 113] : [200, 200, 200]);
  });
  // ── craie fixe ──
  // (le titre interne répétait celui de la diapositive : retiré)
  c.texte(COMPLET ? 'vue complète' : 'à compléter', 742, 30, { couleur: 'faible', taille: 13, align: 'right' });
  c.texte('hyaloplasme', 20, 200, { couleur: 'vert', taille: 14 });
  c.texte('mitochondrie', MITO.x, MITO.y - MITO.ry - 8, { couleur: 'orange', taille: 14, align: 'center' });
  c.texte('O_{2} : présent / absent', 672, 78, { couleur: 'cyan', taille: 14, align: 'center' });
  c.rect(RAIL.x0 - 14, RAIL.y - 12, RAIL.x1 - RAIL.x0 + 28, 24, { couleur: 'faible', largeur: 1.4, arrondi: 12 });
  c.texte('absent', RAIL.x0, 142, { couleur: 'rouge', taille: 13, align: 'center' });
  c.texte('présent', RAIL.x1, 142, { couleur: 'vert', taille: 13, align: 'center' });
  c.repere('o2', RAIL.x0 - 30, 60, RAIL.x1 - RAIL.x0 + 60, 90, 'l’interrupteur O2 : présent ou absent');
  c.repere('mitochondrie', MITO.x - MITO.rx - 4, MITO.y - MITO.ry - 26, 2 * MITO.rx + 8, 2 * MITO.ry + 30, 'la mitochondrie');

  if (t >= .6) ecrit.ecrire(c, 'glucose', () => c.texte('glucose', GLU.x, GLU.y - 22, { couleur: 'jaune', taille: 14, align: 'center' }));
  if (t >= 1.4) ecrit.ecrire(c, 'glycolyse', () => {
    c.fleche(GLU.x + 34, GLU.y + 18, CAR.x - 40, CAR.y - 22, { couleur: 'blanc', largeur: 1.6 });
    c.texte('glycolyse', 142, 184, { couleur: 'blanc', taille: 14, align: 'center' });   // sous la flèche : le mot et le processus au même endroit
  });
  if (t >= 2.9) ecrit.ecrire(c, 'degrade', () => c.texte('(dégradé)', GLU.x + 30, GLU.y - 22, { couleur: 'faible', taille: 13 }));
  if (t >= .6) c.repere('glucose', GLU.x - 40, GLU.y - 40, 80, 64, t < 1.6 ? 'le glucose' : 'le glucose, dégradé par la glycolyse');
  c.repere('hyaloplasme', 14, 184, 96, 22, 'le hyaloplasme');
  if (t >= 1.4) c.repere('glycolyse', 106, 128, 76, 64, 'la glycolyse, dans le hyaloplasme');   // la flèche et son nom, pas la place du glucose
  if (t >= 2.9) {
    ecrit.ecrire(c, 'pyruviques', () => c.texte('2 acides pyruviques', CAR.x, CAR.y + 60, { couleur: 'jaune', taille: 14, align: 'center' }));
    c.repere('carrefour', CAR.x - 52, CAR.y - 46, 104, 100, 'le carrefour : deux acides pyruviques');
  }
  if (COMPLET && t >= 3.1) {   // la glycolyse donne aussi 2 ATP et 2 NADH,H+ (dit dans la vue complète)
    ecrit.ecrire(c, 'glyBilan', () => c.texte('+ 2 ATP, 2 NADH,H+', 176, 246, { couleur: 'jaune', taille: 13 }));
    c.repere('bilan_glycolyse', 172, 232, 128, 20, 'la glycolyse : 2 ATP et 2 NADH,H+');
  }
  if (t >= 3.4) ecrit.ecrire(c, 'carrefour', () => {   // le carrefour : deux routes (pointillés) avant la question
    c.cercle(CAR.x, CAR.y, 40, { couleur: 'jaune', largeur: 1.6 });
    c.texte('carrefour', CAR.x, CAR.y - 48, { couleur: 'jaune', taille: 14, align: 'center' });
    c.trait([[CAR.x + 40, CAR.y + 8], [CAR.x + 76, CAR.y + 26]], { couleur: 'tresfaible', largeur: 1.6, pointille: [5, 5] });
    c.trait([[CAR.x - 30, CAR.y + 28], [CAR.x - 48, CAR.y + 52]], { couleur: 'tresfaible', largeur: 1.6, pointille: [5, 5] });
  });
  if (t >= 4.6) {
    ecrit.ecrire(c, 'question', () => {
      c.texte('avec ou sans', 682, 176, { couleur: 'jaune', taille: 15, align: 'center' });
      c.texte('dioxygène ?', 682, 196, { couleur: 'jaune', taille: 15, align: 'center' });
    });
    c.repere('question', 626, 160, 112, 42, 'avec ou sans dioxygène ?');
  }
  if (o2 === null && t >= 4.6) c.direct(() => c.texte('?', (RAIL.x0 + RAIL.x1) / 2, RAIL.y + 6, { couleur: 'blanc', taille: 16, align: 'center' }));
  // avec O2 : vers la mitochondrie
  if (t >= T.avec) {
    ecrit.ecrire(c, 'avec', () => {
      c.fleche(CAR.x + 30, CAR.y + 28, MITO.x - MITO.rx + 10, MITO.y - 14, { couleur: 'vert', largeur: 1.8 });
      c.texte('avec O_{2}', 332, 224, { couleur: 'vert', taille: 13, align: 'center' });
      c.texte('respiration cellulaire : mitochondrie', 572, 144, { couleur: 'vert', taille: 14, align: 'right' });
    });
    c.repere('respiration', 276, 128, 300, 186, 'la respiration cellulaire, dans la mitochondrie');
    ecrit.ecrire(c, 'boiteR', () => boite(c, 385, 350, 365, 'respiration (avec O_{2})', COMPLET && t >= T.b38 ? [] : ['produits : ?', 'ATP : ?'], 'vert'));
  }
  if (COMPLET && t >= T.krebs) {
    ecrit.ecrire(c, 'krebs', () => c.texte('matrice : acétyl-CoA → cycle de Krebs', 572, 166, { couleur: 'bleu', taille: 13, align: 'right' }));
    c.repere('ecrit_krebs', 330, 152, 246, 20, 'matrice : acétyl-CoA → cycle de Krebs');
  }
  if (COMPLET && t >= T.chaine) {
    ecrit.ecrire(c, 'chaine', () => c.texte('membrane interne : chaîne respiratoire', 572, 188, { couleur: 'orange', taille: 13, align: 'right' }));
    c.repere('ecrit_chaine', 330, 174, 246, 20, 'membrane interne : chaîne respiratoire');
  }
  // sans O2 : sur place, dans le hyaloplasme
  if (t >= T.sans) {
    ecrit.ecrire(c, 'sans', () => {
      c.courbe((u) => [CAR.x - 65 + 20 * Math.cos(Math.PI * (.2 + 1.65 * u)), CAR.y + 85 + 13 * Math.sin(Math.PI * (.2 + 1.65 * u))], 22, { couleur: 'rouge', largeur: 1.8 });
      c.texte('sans O_{2} : il reste sur place', 205, 282, { couleur: 'rouge', taille: 13, align: 'center' });
      c.texte('fermentation : hyaloplasme', 225, 304, { couleur: 'rouge', taille: 14, align: 'center' });
    });
    c.repere('fermentation', 92, 234, 240, 78, 'la fermentation, dans le hyaloplasme');
    ecrit.ecrire(c, 'boiteF', () => boite(c, 10, 350, 365, 'fermentation (sans O_{2})', COMPLET && t >= T.b2 ? [] : ['produits : ?', 'ATP : ?'], 'rouge'));
  }
  if (t >= T.avec) c.repere('bilan_respiration', 385, 350, 365, 66, 'le bilan de la respiration');
  if (t >= T.sans) c.repere('bilan_fermentation', 10, 350, 365, 66, 'le bilan de la fermentation');
  if (t >= T.sans) c.repere('bilans', 10, 350, 740, 66, 'les bilans : produits et ATP');
  // les bilans (vue complète), chacun écrit quand il est dit
  if (COMPLET && t >= T.b38) ecrit.ecrire(c, 'bilanR', () => {
    c.texte('produits : 6 CO_{2} + 6 H_{2}O', 395, 389, { couleur: 'blanc', taille: 13 });
    c.texte('38 ATP', 395, 410, { couleur: 'jaune', taille: 13 });
  });
  if (COMPLET && t >= T.compl) {
    ecrit.ecrire(c, 'complete', () => c.texte('dégradation complète', 740, 410, { couleur: 'jaune', taille: 13, align: 'right' }));
    c.repere('ecrit_complete', 596, 396, 148, 20, 'dégradation complète');
  }
  if (COMPLET && t >= T.b2) ecrit.ecrire(c, 'bilanF', () => {
    c.texte('produits : acide lactique, ou éthanol + CO_{2}', 20, 389, { couleur: 'blanc', taille: 13 });
    c.texte('2 ATP', 20, 410, { couleur: 'jaune', taille: 13 });
  });
  if (COMPLET && t >= T.incompl) {
    ecrit.ecrire(c, 'incomplete', () => c.texte('dégradation incomplète', 365, 410, { couleur: 'jaune', taille: 13, align: 'right' }));
    c.repere('ecrit_incomplete', 206, 396, 164, 20, 'dégradation incomplète');
  }
}

function phase(t) {
  if (t < 1.6) return 'Une cellule peinte : hyaloplasme et une mitochondrie ; un glucose (6 billes de carbone) dans le hyaloplasme.';
  if (t < 3.4) return 'Glycolyse, dans le hyaloplasme : les 6 carbones du glucose forment 2 acides pyruviques ; le glucose reste à sa place, pâli, marqué « (dégradé) ».' + (COMPLET && t >= 3.1 ? ' Écrit : « + 2 ATP, 2 NADH,H+ ».' : '');
  if (t < 4.6) return 'Le carrefour est entouré : deux routes en pointillé partent des acides pyruviques.';
  if (t < 6) return 'Au carrefour : « avec ou sans dioxygène ? » ; l’interrupteur O2 attend (au milieu, « ? »).';
  const sansT = COMPLET ? 14 : 10;
  if (t < sansT) {
    let s = 'O2 présent : les acides pyruviques entrent dans la mitochondrie : « respiration cellulaire : mitochondrie ».';
    if (COMPLET && t >= T.krebs) s += ' « matrice : acétyl-CoA → cycle de Krebs ».';
    if (COMPLET && t >= T.chaine) s += ' « membrane interne : chaîne respiratoire ».';
    if (COMPLET && t >= T.b38) s += ' Bilan : 6 CO2 + 6 H2O, 38 ATP' + (t >= T.compl ? ', dégradation complète.' : '.');
    return s + (COMPLET ? '' : ' Case « respiration » : produits ?, ATP ?');
  }
  let s = 'O2 absent : la mitochondrie est grisée ; les acides pyruviques restent dans le hyaloplasme : fermentation.';
  if (!COMPLET) return s + ' Cases vides : produits ?, ATP ?';
  if (t >= T.b2) s += ' Bilan : acide lactique, ou éthanol + CO2 ; 2 ATP' + (t >= T.incompl ? ' ; dégradation incomplète.' : '.');
  return s;
}
function ceQuiSeVoit() {
  const t = chrono.t, o2 = o2At(t);
  return `Vue ${vue}. t = ${fr(t, 1)} s${chrono.running ? ' (ça avance)' : chrono.fait ? ' (fin)' : ' (arrêté)'}. ${phase(t)} Interrupteur O2 : ${o2 === true ? 'présent' : o2 === false ? 'absent' : 'pas encore choisi'}.`;
}

/* ── Réglage : l’interrupteur O2 ── */
const bool = v => !(v === false || v === 'false' || v === 0 || v === '0' || v === 'non' || v === 'absent');
function setParameters(p) {
  if (!p || !('o2' in p)) return;
  const avec = bool(p.o2);
  const moment = avec ? (COMPLET ? 'bilan_38' : 'avec_o2_vers_matrice') : (COMPLET ? 'bilan_2' : 'sans_o2_sur_place');
  bulle($('feedback'), avec ? 'O2 présent : vers la mitochondrie…' : 'O2 absent : sur place, dans le hyaloplasme…');
  pont.noter('set_parameters', { o2: avec });
  chrono.playUntil({ moment });
}
window.Tableau.glisser(canvas, {
  toucher: (px, py) => { const [x, y] = scene.local(px, py); return x > RAIL.x0 - 20 && x < RAIL.x1 + 20 && Math.abs(y - RAIL.y) < 18 ? 'o2' : null; },
  bouger: (id, px, py) => { const [x] = scene.local(px, py); poigneeX = Math.min(RAIL.x1, Math.max(RAIL.x0, x)); scene.sale = true; },
  lacher: () => { const avec = (poigneeX ?? RAIL.x1) > (RAIL.x0 + RAIL.x1) / 2; poigneeX = null; setParameters({ o2: avec }); },
});

$('run').onclick = chrono.clic;
const EXPL = [
  { repere: 'glycolyse', texte: 'Le glucose est d’abord coupé par la glycolyse, dans le hyaloplasme.' },
  { repere: 'carrefour', texte: 'On obtient deux acides pyruviques : c’est le carrefour.' },
  { repere: 'o2', texte: 'Tout dépend du dioxygène.' },
  { repere: 'respiration', texte: 'Avec O2, l’acide pyruvique entre dans la mitochondrie : c’est la respiration cellulaire.' },
  { repere: 'fermentation', texte: 'Sans O2, il reste dans le hyaloplasme : c’est la fermentation.' } ];
window.Tableau.explication({ [vue]: COMPLET ? EXPL.concat([
  { repere: 'bilan_respiration', texte: 'Respiration : 6 CO2 et 6 H2O, 38 ATP, dégradation complète.' },
  { repere: 'bilan_fermentation', texte: 'Fermentation : acide lactique, ou éthanol et CO2 ; 2 ATP ; dégradation incomplète.' } ]) : EXPL.concat([
  { repere: 'bilan_respiration', texte: 'Quels produits, et combien d’ATP, avec dioxygène ?' },
  { repere: 'bilan_fermentation', texte: 'Et sans dioxygène ?' } ]) });
const commandes = ['start', 'reset', 'pause', 'resume', 'set_time', 'set_parameters', 'play_until'];
const config = { id: 'svt_energie_carrefour', version: '1.0', title: 'Le carrefour de l’acide pyruvique — ' + vue, variants: [{ id: vue, label: vue }], commands: commandes,
  command_schema: {
    set_time: { time_s: `0..${FIN} (arrêt sur cet instant)` },
    set_parameters: { o2: `true | false (dioxygène présent ou absent ; rejoue jusqu’à ${COMPLET ? 'bilan_38 ou bilan_2' : 'avec_o2_vers_matrice ou sans_o2_sur_place'})` },
    play_until: { moment: Object.keys(M).join(' | ') + ' (rejoue et se fige à cet instant clé)', time_s: 'ou un instant en s' } } };
const pont = protocole({ id: config.id, commandes, config,
  texte: 'Le carrefour de l’acide pyruvique. La glycolyse, dans le hyaloplasme, coupe le glucose en deux acides pyruviques. Avec dioxygène, l’acide pyruvique entre dans la mitochondrie : respiration cellulaire (acétyl-CoA et cycle de Krebs dans la matrice, chaîne respiratoire sur la membrane interne) ; bilan : 6 CO2 + 6 H2O, 38 ATP, dégradation complète. Sans dioxygène, il reste dans le hyaloplasme : fermentation ; bilan : acide lactique, ou éthanol + CO2 ; 2 ATP ; dégradation incomplète.' + (COMPLET ? '' : ' Vue d’ensemble : les produits et les ATP sont à compléter (« ? »).'),
  etat: () => ({ simulation_status: chrono.statut(), ce_qui_se_voit: ceQuiSeVoit(), current_variant: vue, time_s: +chrono.t.toFixed(2), parameters: { o2: o2At(chrono.t) }, moments: M }),
  progression: () => chrono.t / FIN,
  executer: (cmd, p) => ({ start: chrono.start, reset: chrono.reset, pause: chrono.pause, resume: chrono.resume, set_time: () => chrono.setTime(p), set_parameters: () => setParameters(p), play_until: () => chrono.playUntil(p) })[cmd]?.() });
bulle($('feedback'), 'Une cellule : un glucose va être dégradé…');
setTimeout(() => { if (!chrono.pilote && !chrono.running && chrono.t === 0) chrono.start(); }, 1600);
window.__sim = { chrono, scene, M };
</script>
<script src="/media/simulations/professor-locate.js" defer></script>
</body></html>
