<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L'énoncé du national — énergie</title>
<!--
  L'énoncé du national tel qu'à l'examen (professeur règle 46) pour le cours SVT ch1 « Libération de l'énergie » : la feuille
  refaite en code avec le gabarit commun shared/examen/feuille.js (en-tête officiel, titre, questions et barème, figures
  redessinées en SVG). Texte et points : backend/data/exams/svt/<sujet>/exam.json, dans l'ordre du scan (pages/sujet_pN.jpg ;
  pour 2016 N et 2017 N, pas de page scannée : les documents extraits assets/document_N.png servent de modèle).
    ?n=2024r : 2024 rattrapage, première partie, question I (page 1/6)  — repères q-I, q-I.1, q-I.2, q-I.2.a, q-I.2.b
    ?n=2022n : 2022 normale, première partie, question II (page 1/6)   — q-II, donnee-1, prop-1a … prop-1d
    ?n=2020r : 2020 rattrapage, première partie, question III (page 2/8) — q-III, phen-1 … phen-4, reac-a … reac-e
    ?n=2016n : 2016 normale, deuxième partie, sujet 1, documents 1 et 2, question 1 — contexte, fig-doc1, fig-doc2, q-1
    ?n=2017n : 2017 normale, première partie, question IV (schéma)     — q-IV, fig-chaine
  Repères (en toutes lettres pour le contrôle voix ↔ simulation) : 'entete', 'titre-exo', 'q-I', 'q-I.1', 'q-I.2', 'q-I.2.a',
  'q-I.2.b', 'q-II', 'donnee-1', 'prop-1a', 'prop-1b', 'prop-1c', 'prop-1d', 'q-III', 'phen-1', 'phen-2', 'phen-3', 'phen-4',
  'reac-a', 'reac-b', 'reac-c', 'reac-d', 'reac-e', 'contexte', 'fig-doc1', 'fig-doc2', 'donnee-mito', 'donnee-enzymes', 'q-1',
  'q-IV', 'fig-chaine'.
-->
<link rel="stylesheet" href="/media/simulations/shared/examen/feuille.css">
<style>
  .grille { width: 100%; border-collapse: collapse; margin: .4em 0 .6em; }
  .grille td { border: 1px dashed #555; vertical-align: top; padding: .3em .5em; width: 50%; }
  .grille .tete { font-weight: 700; }
  .grille .p { padding-left: 1.6em; text-indent: -1.1em; margin: .05em 0; }
  .relier { display: flex; gap: 4%; align-items: flex-start; margin: .4em 0 .6em; }
  .relier table { border-collapse: collapse; }
  .relier td, .relier th { border: 1px solid #000; padding: .25em .5em; text-align: left; }
  .relier th { text-align: center; }
  .relier .phen td { border-top: 0; border-bottom: 0; padding: .55em .5em; }
  .relier .reac td { border-top: 0; border-bottom: 0; }
  .doc1 { border-collapse: collapse; margin: 0 auto; }
  .doc1 td { border: 1px solid #000; padding: .35em .7em; text-align: center; vertical-align: middle; }
  .doc-titre { text-align: center; font-weight: 700; font-style: italic; text-decoration: underline; margin-top: .3em; }
</style>
</head>
<body>
<div id="feuille"></div>
<script>
(function () {
  const n = new URLSearchParams(location.search).get('n') || '2024r';
  const rep = (id, lib) => `id="${id}" data-repere="${id}" data-professor-point="${id}" data-professor-label="${lib}"`;
  const F = {};

  /* 2024 rattrapage (RS 34F), page 1/6 : Première partie, I. */
  F['2024r'] = {
    sujet: 'svt/2024-rattrapage', page: '1/6', bareme: 'inline', id: 'examen-svt-2024-rattrapage-I',
    titre: 'Première partie : Restitution des connaissances (5 points)',
    blocs: [
      { question: 'I', id: 'q-I', texte: '**Répondre** sur votre feuille de rédaction aux questions suivantes :', sous: [
        { question: '1', id: 'q-I.1', points: 0.5, texte: '**Définir** la fermentation lactique.' },
        { question: '2', id: 'q-I.2', texte: '**Déterminer** le sens de déplacement des protons H⁺ dans la mitochondrie au cours :', sous: [
          { question: 'a', id: 'q-I.2.a', points: 0.25, texte: 'du fonctionnement de la chaîne respiratoire.' },
          { question: 'b', id: 'q-I.2.b', points: 0.25, texte: 'du fonctionnement de la sphère pédonculée.' },
        ] },
      ] },
    ],
  };

  /* 2022 normale (NS 34F), page 1/6 : Partie I, II (le cadre des quatre données). */
  const D22 = [
    ['1', 'Dans la mitochondrie :', [['a', 'la sphère pédonculée transporte H⁺ vers l’espace intermembranaire ;'], ['b', 'la sphère pédonculée est responsable de la phosphorylation de l’ADP ;'],
      ['c', 'la membrane externe contient des protéines qui transportent les électrons vers le dioxygène ;'], ['d', 'la membrane externe contient des enzymes d’oxydoréduction.']]],
    ['2', 'La réduction de NAD⁺ en NADH, H⁺ se fait au cours :', [['a', 'de la glycolyse et du cycle de Krebs ;'], ['b', 'de la glycolyse et des réactions de la chaîne respiratoire ;'],
      ['c', 'du cycle de Krebs et des réactions de la chaîne respiratoire ;'], ['d', 'des réactions de la chaîne respiratoire et de la phosphorylation de l’ADP.']]],
    ['3', 'L’ultrastructure du sarcomère montre que :', [['a', 'la bande sombre est limitée par deux stries Z ;'], ['b', 'la bande sombre est limitée par deux bandes H ;'],
      ['c', 'le sarcomère est limitée par deux stries Z ;'], ['d', 'le sarcomère est limité par deux bandes H.']]],
    ['4', 'Les filaments fins de la myofibrille sont formés :', [['a', 'd’actine, de myosine et de troponine ;'], ['b', 'd’actine, de myosine et de tropomyosine ;'],
      ['c', 'd’actine, de troponine et de tropomyosine ;'], ['d', 'de myosine, de troponine et de tropomyosine.']]],
  ];
  const cellule = ([k, tete, props]) => `<td ${rep('donnee-' + k, 'Donnée ' + k)}><div class="tete">${k}- ${tete}</div>` +
    props.map(([l, t]) => `<div class="p" ${rep(`prop-${k}${l}`, `Donnée ${k}, proposition ${l}`)}>${l}. ${t}</div>`).join('') + '</td>';
  F['2022n'] = {
    sujet: 'svt/2022-normale', page: '1/6', bareme: 'inline', style_titre: 'encadre', id: 'examen-svt-2022-normale-II',
    titre: 'Partie I : Restitution des connaissances (5 pts)',
    blocs: [
      { question: 'II', id: 'q-II', points: 2, texte: 'Pour chacune des données numérotées de 1 à 4, il y a une seule proposition correcte. **Recopiez** sur votre feuille de rédaction les couples (1, …) ; (2, …) ; (3, …) ; (4, …), et **adressez** à chaque numéro la lettre qui correspond à la suggestion correcte.' },
      { html: `<table class="grille"><tr>${cellule(D22[0])}${cellule(D22[1])}</tr><tr>${cellule(D22[2])}${cellule(D22[3])}</tr></table>` },
    ],
  };

  /* 2020 rattrapage (RS 34F), page 2/8 : III (Phénomène / Réaction bilan). */
  const s = (x) => `<sub>${x}</sub>`;
  const PHEN = ['La glycolyse', 'Le cycle de Krebs', 'La fermentation lactique', 'La fermentation alcoolique'];
  const REAC = [
    ['a', `C${s(6)}H${s(12)}O${s(6)} + 2 ADP + 2 Pi → 2 CH${s(3)}CH${s(2)}OH + 2 CO${s(2)} + 2 ATP`],
    ['b', `C${s(6)}H${s(12)}O${s(6)} + 2 ADP + 2 Pi → 2CH${s(3)}CHOHCOOH + 2ATP`],
    ['c', `C${s(6)}H${s(12)}O${s(6)} + 2 ADP + 2 Pi + 2 NAD<sup>+</sup> → 2 CH${s(3)}COCOOH +2ATP + 2NADH,H<sup>+</sup>`],
    ['d', `CH${s(3)}COCOOH + 2ATP → CH${s(3)}COOH + 2ADP + 2Pi`],
    ['e', `CH${s(3)}CO-SCoA +3NAD<sup>+</sup> + 3H${s(2)}O + FAD + GDP +Pi → 2CO${s(2)} +HSCoA + 3NADH,H<sup>+</sup> + FADH${s(2)} + GTP`],
  ];
  F['2020r'] = {
    sujet: 'svt/2020-rattrapage', page: '2/8', entete: 'courte', bareme: 'inline', id: 'examen-svt-2020-rattrapage-III', titre: '',
    blocs: [
      { question: 'III', id: 'q-III', points: 1, texte: '**Reliez** chaque phénomène à la réaction bilan qui lui convient. **Recopiez** les couples (1;…) ; (2;…) ; (3;…) ; (4;…) et **adressez** à chaque numéro la lettre correspondante.' },
      { html: `<div class="relier"><table class="phen" style="width:30%"><tr><th>Phénomène</th></tr>${PHEN.map((p, i) => `<tr><td ${rep('phen-' + (i + 1), p)}>${i + 1}- ${p}</td></tr>`).join('')}<tr><td style="border-bottom:1px solid #000"></td></tr></table>` +
        `<table class="reac" style="width:66%"><tr><th>Réaction bilan</th></tr>${REAC.map(([l, r]) => `<tr><td ${rep('reac-' + l, 'Réaction ' + l)}>${l}- ${r}</td></tr>`).join('')}<tr><td style="border-bottom:1px solid #000;padding:0"></td></tr></table></div>` },
    ],
  };

  /* 2016 normale (NS 34F), deuxième partie, sujet 1 : documents 1 et 2, question 1 (pas de page scannée : modèle assets/document_1.png et _2.png). */
  const barres = (() => {
    // Document 2 : barres pointillées (acide lactique, mmol/L) et pleines (O₂, L/min), valeurs écrites au-dessus.
    const H = 156, y0 = 250, k = H / 12, b = (x, v, plein, lab) => `<rect x="${x}" y="${y0 - v * k}" width="44" height="${v * k}" fill="${plein ? '#000' : 'url(#pts)'}" stroke="#000" stroke-width="1.4"/>` +
      `<text x="${x + 22}" y="${y0 - v * k - 8}" text-anchor="middle" font-weight="700">${lab}</text>`;
    return `<svg viewBox="0 0 520 330" role="img" aria-label="Document 2 : acide lactique et consommation de dioxygène" font-family="'Times New Roman',Tinos,'Liberation Serif',serif" font-size="19">
      <defs><pattern id="pts" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><circle cx="3" cy="3" r="1" fill="#000"/></pattern></defs>
      <rect x="4" y="4" width="512" height="322" fill="none" stroke="#000" stroke-width="1.2"/>
      <rect x="22" y="16" width="26" height="18" fill="url(#pts)" stroke="#000"/><text x="58" y="31" font-weight="700">Quantité d’acide lactique produit en mmol/L.</text>
      <rect x="22" y="44" width="26" height="18" fill="#000"/><text x="58" y="59" font-weight="700">Consommation du dioxygène en L/min.</text>
      <line x1="30" y1="${y0}" x2="230" y2="${y0}" stroke="#000" stroke-width="1.6"/><line x1="290" y1="${y0}" x2="500" y2="${y0}" stroke="#000" stroke-width="1.6"/>
      ${b(56, 12, false, '12')}${b(110, 2.5, true, '2.5')}${b(330, 6, false, '6')}${b(384, 5.5, true, '5.5')}
      <text x="105" y="${y0 + 26}" text-anchor="middle" font-weight="700">Personne non</text><text x="105" y="${y0 + 48}" text-anchor="middle" font-weight="700">entraînée</text>
      <text x="380" y="${y0 + 26}" text-anchor="middle" font-weight="700">Personne</text><text x="380" y="${y0 + 48}" text-anchor="middle" font-weight="700">entraînée</text></svg>`;
  })();
  F['2016n'] = {
    sujet: 'svt/2016-normale', entete: 'courte', bareme: 'gauche', style_titre: 'encadre', id: 'examen-svt-2016-normale-sujet1',
    titre: 'Deuxième partie (15 points) — Sujet 1 (5 points)',
    blocs: [
      { id: 'contexte', libelle: 'Introduction', texte: 'Afin d’étudier l’effet du manque d’exercices sportifs et du tabagisme (usage du tabac) sur les réactions responsables de la libération de l’énergie au niveau du muscle squelettique strié, on propose l’étude des données suivantes.' },
      { figure: 'doc1', id: 'fig-doc1', place: 'gauche', largeur: '46%', legende: '', html:
        `<table class="doc1"><tr><td style="border:0"></td><td>Personne entraînée</td><td>Personne non entraînée</td></tr>` +
        `<tr><td ${rep('donnee-mito', 'Volume des mitochondries')}>Volume total des mitochondries par rapport au volume de la cellule musculaire</td><td>11%</td><td>5%</td></tr>` +
        `<tr><td ${rep('donnee-enzymes', 'Activité des enzymes')}>Activité des enzymes mitochondriales</td><td>importante</td><td>faible</td></tr></table><div class="doc-titre">Document 1</div>` },
      { figure: 'doc2', id: 'fig-doc2', place: 'droite', largeur: '50%', legende: '', html: barres + '<div class="doc-titre">Document 2</div>' },
      { html: '<div class="clair"></div>' },
      { question: '1', id: 'q-1', points: 1, texte: 'En exploitant les données des documents 1 et 2, **expliquez** l’augmentation de la fatigabilité observée chez la personne non entraînée.' },
    ],
  };

  /* 2017 normale (NS 34F), première partie, IV : le schéma de la chaîne respiratoire (modèle : assets/document_1.png). */
  const chaine = (() => {
    const t = (x, y, c, o = '') => `<text x="${x}" y="${y}" ${o}>${c}</text>`;
    const tetes = (y) => Array.from({ length: 56 }, (_, i) => `<circle cx="${92 + i * 11}" cy="${y}" r="4.6" fill="#fff" stroke="#000" stroke-width="1"/>`).join('');
    const queues = (y1, y2) => Array.from({ length: 56 }, (_, i) => `<path d="M${90 + i * 11} ${y1} q2 ${(y2 - y1) / 2} 0 ${y2 - y1} M${94 + i * 11} ${y1} q-2 ${(y2 - y1) / 2} 0 ${y2 - y1}" stroke="#000" stroke-width=".7" fill="none"/>`).join('');
    const raye = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="url(#rayes)" stroke="#000" stroke-width="1.4"/>`;
    const boule = (x, y, r, lab) => `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#grise)" stroke="#000" stroke-width="1.4"/>` + t(x - 8, y + 6, lab, 'font-weight="700"');
    const e = (x, y) => `<circle cx="${x}" cy="${y}" r="12" fill="#000"/>` + t(x - 6, y + 5, 'e', 'fill="#fff" font-weight="700" font-size="17"') + t(x + 5, y - 5, '-', 'fill="#fff" font-size="13"');
    const fh = (x, y1, y2) => `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="#000" stroke-width="2.6" marker-end="url(#pointe)"/>`;
    const H = (x, y) => t(x - 10, y, 'H<tspan font-size="13" dy="-8">+</tspan>', 'font-weight="700"');
    return `<svg viewBox="0 0 780 320" role="img" aria-label="Schéma de la chaîne respiratoire : transporteurs T1 à T6, sphère pédonculée, numéros 1, 2, 3 et réactions A, B, C" font-family="'Times New Roman',Tinos,'Liberation Serif',serif" font-size="18">
      <defs><marker id="pointe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#000"/></marker>
        <pattern id="rayes" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><line x1="3" y1="0" x2="3" y2="6" stroke="#000" stroke-width="1"/></pattern>
        <radialGradient id="grise"><stop offset="0" stop-color="#ddd"/><stop offset="1" stop-color="#888"/></radialGradient>
        <pattern id="pois" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#fff"/><circle cx="2.5" cy="2.5" r=".9" fill="#000"/></pattern></defs>
      ${queues(106, 146)}${tetes(102)}${tetes(150)}
      ${raye(132, 88, 40, 80)}${t(142, 132, 'T<tspan font-size="12" dy="5">1</tspan>', 'font-weight="700"')}
      ${raye(222, 140, 46, 40)}${t(234, 168, 'T<tspan font-size="12" dy="5">2</tspan>', 'font-weight="700"')}
      ${boule(292, 88, 20, 'T<tspan font-size="12" dy="5">3</tspan>')}
      ${raye(346, 84, 40, 84)}${t(354, 116, 'T<tspan font-size="12" dy="5">4</tspan>', 'font-weight="700"')}
      ${boule(432, 84, 20, 'T<tspan font-size="12" dy="5">5</tspan>')}
      ${raye(484, 88, 36, 80)}${t(490, 116, 'T<tspan font-size="12" dy="5">6</tspan>', 'font-weight="700"')}
      <path d="M572 90 h28 v80 h-28 z M610 90 h28 v80 h-28 z" fill="url(#pois)" stroke="#000" stroke-width="1.2"/>
      <ellipse cx="584" cy="190" rx="20" ry="16" fill="url(#pois)" stroke="#000"/><ellipse cx="626" cy="190" rx="20" ry="16" fill="url(#pois)" stroke="#000"/><ellipse cx="605" cy="215" rx="20" ry="16" fill="url(#pois)" stroke="#000"/>
      ${e(200, 104)}${e(282, 132)}${e(436, 58)}${e(490, 150)}
      <path d="M210 104 Q250 60 278 80 M300 108 Q330 130 344 122 M400 92 Q410 48 424 52 M446 58 Q480 52 488 82" stroke="#000" stroke-width="1.6" stroke-dasharray="6 5" fill="none" marker-end="url(#pointe)"/>
      ${fh(152, 230, 34)}${H(160, 26)}${fh(366, 236, 34)}${H(374, 26)}${fh(502, 230, 34)}${H(510, 26)}${fh(606, 34, 262)}${H(616, 26)}
      ${t(46, 216, 'NADH,H<tspan font-size="12" dy="-8">+</tspan>')}${t(162, 216, 'NAD<tspan font-size="12" dy="-8">+</tspan>')}<path d="M110 200 Q150 170 160 204" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#pointe)"/>
      ${t(196, 246, 'FADH<tspan font-size="12" dy="5">2</tspan>')}${t(276, 246, 'FAD')}<path d="M232 228 Q250 196 276 230" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#pointe)"/>
      ${t(440, 228, 'O<tspan font-size="12" dy="5">2</tspan><tspan dy="-5">+4H</tspan><tspan font-size="12" dy="-8">+</tspan>')}${t(530, 228, '2H<tspan font-size="12" dy="5">2</tspan><tspan dy="-5">O</tspan>')}<path d="M488 212 Q510 186 530 214" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#pointe)"/>
      ${t(560, 286, 'ADP+Pi')}${t(660, 286, 'ATP')}<path d="M596 268 Q630 240 664 270" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#pointe)"/>
      <path d="M46 256 v10 h270 v-10" fill="none" stroke="#000" stroke-width="1.4"/>${t(130, 290, 'Réaction A', 'font-weight="700"')}
      <path d="M440 240 v10 h140 v-10" fill="none" stroke="#000" stroke-width="1.4"/>${t(470, 272, 'Réaction B', 'font-weight="700"')}
      <path d="M552 296 v8 h150 v-8" fill="none" stroke="#000" stroke-width="1.4"/>${t(590, 318, 'Réaction C', 'font-weight="700"')}
      ${t(40, 130, '3', 'font-weight="700" font-size="22"')}<line x1="58" y1="124" x2="128" y2="124" stroke="#000" stroke-width="1.6" marker-end="url(#pointe)"/>
      <path d="M696 100 h10 v52 h-10" fill="none" stroke="#000" stroke-width="1.6"/>${t(722, 134, '1', 'font-weight="700" font-size="22"')}
      ${t(722, 214, '2', 'font-weight="700" font-size="22"')}<line x1="716" y1="207" x2="650" y2="207" stroke="#000" stroke-width="1.6" marker-end="url(#pointe)"/>
    </svg>`;
  })();
  F['2017n'] = {
    sujet: 'svt/2017-normale', entete: 'courte', bareme: 'gauche', style_titre: 'encadre', id: 'examen-svt-2017-normale-IV',
    titre: 'Première partie : Restitution des connaissances (5 points)',
    blocs: [
      { question: 'IV', id: 'q-IV', points: 1.5, texte: 'Le document ci-dessous représente la chaîne respiratoire. **Nommez** chacune des structures désignées par les numéros 1, 2, 3 et des réactions désignées par les lettres A, B, C.' },
      { figure: 'chaine', id: 'fig-chaine', legende: '', html: chaine },
    ],
  };

  window.FEUILLE = F[n] || F['2024r'];
})();
</script>
<script src="/media/simulations/shared/examen/feuille.js"></script>
</body>
</html>
