<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Le cycle de Krebs — au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="svt.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Dans la matrice peinte, le cycle de Krebs dessiné à la craie : un composé à 4 carbones reçoit l’acétyl (2 C) de l’acétyl-CoA et devient un composé à 6 C ; à chaque cran une sortie : CO2 et NADH,H+, encore CO2 et NADH,H+, ATP, FADH2, NADH,H+ ; le composé à 4 C est retrouvé ; un compteur fait le bilan d’un tour puis pour un glucose"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start reset pause resume play_until set_time">Lancer</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="commun.js"></script>
<script src="peinture.js"></script>
<script>
/*
 * Le cycle de Krebs dans la matrice (cours SVT « Libération de l’énergie »), 10 novembre 2026.
 * Aucun nom de composé intermédiaire (hors programme) : des composés anonymes « 4 C », « 6 C », « 5 C ».
 * Ce qui se voit, dans l’ordre (t en s de la scène) :
 *   acetyl_entre (3)          : l’acétyl (2 C), porté par le CoA, arrive par la gauche jusqu’au composé à 4 C ;
 *   compose_6c (5)            : le CoA repart, l’acétyl s’accroche : composé à 6 C ;
 *   co2_et_nadh_1 (8)         : CO2 + NADH,H+ sortent ; reste 5 C ;
 *   co2_et_nadh_2 (11)        : CO2 + NADH,H+ ; reste 4 C ;
 *   atp (13)                  : ADP + Pi → ATP ;
 *   fadh2 (15)                : FAD → FADH2 ;
 *   nadh_3 (17)               : NAD+ → NADH,H+ ;
 *   retour_4c (19)            : le composé à 4 C est retrouvé : un tour du cycle ; compteur d’un tour et son équation ;
 *   second_tour (27)          : un second acétyl-CoA (second acide pyruvique du même glucose) fait un autre tour, plus vite ;
 *   compteur_par_glucose (29) : la colonne × 2 du tableau, puis le bilan pour un glucose.
 */
const { fr, bulle, protocole } = window.Tableau;
const { Scene, Chrono, Apparitions, doux, mix } = window.SVTTableau;
const P = window.SVTPeinture;
const $ = id => document.getElementById(id);

const M = { acetyl_entre: 3, compose_6c: 5, co2_et_nadh_1: 8, co2_et_nadh_2: 11, atp: 13, fadh2: 15, nadh_3: 17, retour_4c: 19, second_tour: 27, compteur_par_glucose: 29 };
const FIN = 31;
const MOTIFS = {
  acetyl_entre: 'l’acétyl (2 C), porté par le coenzyme A, arrive au composé à 4 C',
  compose_6c: 'l’acétyl s’est accroché : un composé à 6 C',
  co2_et_nadh_1: 'un CO2 et un NADH,H+ sortent : reste 5 C',
  co2_et_nadh_2: 'encore un CO2 et un NADH,H+ : reste 4 C',
  atp: 'ADP + Pi → ATP',
  fadh2: 'FAD → FADH2',
  nadh_3: 'NAD+ → NADH,H+',
  retour_4c: 'le composé à 4 C est retrouvé : un tour du cycle',
  second_tour: 'le second acétyl-CoA du même glucose a fait un second tour du cycle',
  compteur_par_glucose: 'le bilan pour un glucose',
};
const CARBONE = [250, 204, 21], NADC = [34, 190, 220], FADC = [230, 140, 60], ATPC = [250, 190, 60], COA = [168, 110, 220];
const RO = { x: 280, y: 205, r: 95 };                      // la roue
const DEG = Math.PI / 180, HAUT = -90;
/* Les crans du cycle : angle sur la roue (sens horaire depuis la droite), sortie, carbones qui restent. */
const CRANS = [
  { id: 'co2_et_nadh_1', ang: -30, sort: ['co2', 'nadh'], reste: 5, texte: 'CO_{2} + NADH,H+', align: 'left' },
  { id: 'co2_et_nadh_2', ang: 30, sort: ['co2', 'nadh'], reste: 4, texte: 'CO_{2} + NADH,H+', align: 'left' },
  { id: 'atp', ang: 90, sort: ['atp'], reste: 4, texte: 'ADP + Pi → ATP', align: 'center' },
  { id: 'fadh2', ang: 150, sort: ['fadh2'], reste: 4, texte: 'FAD → FADH_{2}', align: 'right' },
  { id: 'nadh_3', ang: 200, sort: ['nadh'], reste: 4, texte: 'NAD+ → NADH,H+', align: 'right' },
];
/* Deux tours : le premier lent (explication), le second plus rapide. Instants des crans calculés ici. */
function tour(debut, vitesse) {
  const k = vitesse;
  const T = { arrive: debut + 2 * k, colle: debut + 4 * k, crans: [], retour: 0 };
  let ang = HAUT, t = T.colle;
  for (const cr of CRANS) { const dep = t, arr = t + (cr.ang - ang) / 60 * 2 * k; T.crans.push({ ...cr, dep, arr, ev: arr + .5 * k, a0: ang }); ang = cr.ang; t = arr + 1 * k; }
  T.retourDep = t; T.retour = t + (270 - ang) / 60 * 2 * k; T.a5 = ang; T.debut = debut;
  return T;
}
/* Premier tour : acétyl dès 1 s ; ajustement des durées pour tomber sur les instants ronds du cours. */
const T1 = { debut: 1, arrive: 3, colle: 5, retour: 19, a5: 200, crans: [
  { ...CRANS[0], a0: -90, dep: 5, arr: 7.5, ev: 8 }, { ...CRANS[1], a0: -30, dep: 8.5, arr: 10.5, ev: 11 },
  { ...CRANS[2], a0: 30, dep: 11.3, arr: 12.6, ev: 13 }, { ...CRANS[3], a0: 90, dep: 13.3, arr: 14.6, ev: 15 },
  { ...CRANS[4], a0: 150, dep: 15.3, arr: 16.6, ev: 17 } ], retourDep: 17.3 };
const T2 = tour(21, .27);                                  // fini vers 26,7 s, avant second_tour (27)
const TOURS = [T1, T2];

const canvas = $('canvas');
const scene = Scene(canvas, (c) => { scene.cadre(47); dessiner(c); return c.fin(); });
const ecrit = Apparitions(scene);
const chrono = Chrono({ fin: () => FIN, moments: () => M, motifs: MOTIFS, bouton: $('run'), bulle: $('feedback'), pont: () => pont,
  depart: 'Observe la matrice : le composé à 4 C attend l’acétyl…', reinit: () => ecrit.oublier(),
  fini: () => 'Un tour du cycle : 2 CO2, 3 NADH,H+, 1 FADH2, 1 ATP ; deux tours pour un glucose.' });
scene.avancer = chrono.avancer;

/* ── Peinture : la matrice et un bord de membrane interne ── */
const R = P.graine(31), GM = []; for (let i = 0; i < 110; i++) GM.push([16 + R() * 728, 64 + R() * 348, .7 + R() * 1.3]);
function peindre(ctx) {
  ctx.save(); ctx.beginPath(); ctx.roundRect ? ctx.roundRect(12, 44, 736, 372, 22) : ctx.rect(12, 44, 736, 372); ctx.clip();
  const g = ctx.createRadialGradient(RO.x, RO.y, 30, RO.x + 120, RO.y, 520);
  g.addColorStop(0, P.rgba(P.T.matrice, .48)); g.addColorStop(1, P.rgba(P.T.matrice, .26));
  ctx.fillStyle = g; ctx.fillRect(12, 44, 736, 372);
  ctx.fillStyle = 'rgba(230,240,250,.18)'; for (const [x, y, r] of GM) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
  P.membrane(ctx, 12, 44, 736, 16, { pas: 8 });
  ctx.restore();
}
const surRoue = (ang, dr = 0) => [RO.x + Math.cos(ang * DEG) * (RO.r + dr), RO.y + Math.sin(ang * DEG) * (RO.r + dr)];
function capsule(c, x, y, w, couleur, nom, a = 1) {
  c.direct(() => { P.proteine(c.ctx, x, y, w, 20, { couleur, alpha: .85 * a }); c.texte(nom, x, y + 5, { couleur: 'blanc', taille: 12, align: 'center', alpha: a }); });
}
/* Un amas de n billes de carbone autour de (x, y). */
function amas(c, x, y, n, a = 1) {
  const pos = [[-9, -9], [9, -9], [-9, 9], [9, 9], [-27, -9], [-27, 9]];
  c.direct(() => { for (let i = 0; i < n; i++) P.bille(c.ctx, x + pos[i][0] + (n > 4 ? 9 : 0), y + pos[i][1], 8, CARBONE, { alpha: a }); });
}

/* L’état du composé à l’instant t, pour un tour : angle sur la roue, nombre de carbones, cran courant. */
function compose(T, t) {
  if (t < T.colle) return { ang: HAUT, n: 4 };
  let ang = HAUT, n = 6;
  for (const cr of T.crans) {
    if (t < cr.dep) return { ang, n };
    if (t < cr.arr) return { ang: mix(cr.a0, cr.ang, doux(chrono.part(cr.dep, cr.arr, t))), n };
    ang = cr.ang; if (t >= cr.ev) n = cr.reste;
  }
  if (t < T.retourDep) return { ang, n };
  return { ang: mix(T.a5, 270, doux(chrono.part(T.retourDep, T.retour, t))), n: 4 };
}
/* Combien de chaque sortie au premier tour, à l’instant t. */
function compteur(t) {
  const k = { co2: 0, nadh: 0, fadh2: 0, atp: 0 };
  for (const cr of T1.crans) if (t >= cr.ev) for (const s of cr.sort) k[s]++;
  return k;
}
/* Une sortie qui part du cran vers l’extérieur pendant la seconde de l’événement. */
function sortie(c, cr, t, dur) {
  const u = chrono.part(cr.ev - .5 * dur, cr.ev + .4 * dur, t); if (u <= 0 || u >= 1) return;
  const [x0, y0] = surRoue(cr.ang, 0), [x1, y1] = surRoue(cr.ang, 30), v = doux(u), x = mix(x0, x1, v), y = mix(y0, y1, v), a = Math.sin(u * Math.PI);
  cr.sort.forEach((s, i) => {
    const dx = cr.sort.length > 1 ? (i ? 16 : -16) : 0;
    if (s === 'co2') c.direct(() => { P.bille(c.ctx, x + dx, y, 6, CARBONE, { alpha: a }); P.bulleGaz(c.ctx, x + dx, y, 10); });
    else if (s === 'nadh') capsule(c, x + dx + 10, y, 30, NADC, '', a);
    else if (s === 'fadh2') capsule(c, x, y, 30, FADC, '', a);
    else capsule(c, x, y, 30, ATPC, '', a);
  });
  c.direct(() => P.eclat(c.ctx, x0, y0, 16, a));
}

function dessiner(c) {
  const t = chrono.t;
  c.direct(() => peindre(c.ctx));
  c.texte('Le cycle de Krebs, dans la matrice', 18, 30, { couleur: 'cyan', taille: 20 });
  c.texte('membrane interne', 742, 80, { couleur: 'faible', taille: 12, align: 'right' });
  c.texte('matrice', 24, 82, { couleur: 'bleu', taille: 15 });
  // la roue : un cercle et trois flèches dans le sens horaire
  c.cercle(RO.x, RO.y, RO.r, { couleur: 'blanc', largeur: 2, depart: -Math.PI / 2 });
  for (const a of [0, 120, 240]) {
    const [x, y] = surRoue(a), d = (a + 90) * DEG, s = 10;
    c.trait([[x - s * Math.cos(d - .5), y - s * Math.sin(d - .5)], [x, y], [x - s * Math.cos(d + .5), y - s * Math.sin(d + .5)]], { couleur: 'blanc', largeur: 2, duree: .1 });
  }
  c.repere('roue', RO.x - RO.r, RO.y - RO.r, 2 * RO.r, 2 * RO.r, 'le cycle de Krebs');
  // le compteur, à droite (tableau : un tour, puis × 2)
  c.texte('Compteur', 664, 104, { couleur: 'jaune', taille: 17, align: 'center' });
  c.texte('un tour', 670, 128, { couleur: 'faible', taille: 13, align: 'center' });
  c.ligne(584, 136, 746, 136, { couleur: 'tresfaible', largeur: 1.2 });
  const LIGNES = [['co2', 'CO_{2}', 160], ['nadh', 'NADH,H+', 184], ['fadh2', 'FADH_{2}', 208], ['atp', 'ATP', 232]];
  for (const [, nom, y] of LIGNES) c.texte(nom, 588, y, { couleur: 'blanc', taille: 14 });
  c.repere('compteur', 580, 88, 120, 156, 'le compteur d’un tour du cycle');

  const k = compteur(t);
  for (const [id, , y] of LIGNES) {
    ecrit.ecrire(c, 'n' + id + k[id], () => c.texte(String(k[id]), 670, y, { couleur: k[id] ? 'vert' : 'tresfaible', taille: 15, align: 'center' }));
    const cr = T1.crans.find(cr => cr.sort.includes(id) && t >= cr.ev && t < cr.ev + 1.2);
    if (cr) c.direct(() => P.eclat(c.ctx, 646, y - 5, 12, .7 * (1 - chrono.part(cr.ev, cr.ev + 1.2, t))));
  }

  // quel tour est en cours
  const T = t >= T2.debut ? T2 : T1, dur = T === T1 ? 1 : .5;
  // l’acétyl (2 C), porté par le CoA, arrive par la gauche ; le CoA repart
  if (t >= T.debut && t < T.colle) {
    const u = doux(chrono.part(T.debut, T.arrive, t)), [xh, yh] = surRoue(HAUT);
    const xa = mix(112, xh - 40, u), ya = mix(118, yh, u);
    const va = doux(chrono.part(T.arrive, T.colle, t));
    const xg = mix(xa, xh - 18, va);
    c.direct(() => { P.bille(c.ctx, xg - 9, ya, 8, CARBONE); P.bille(c.ctx, xg + 9, ya, 8, CARBONE); });
    const xc = t < T.arrive ? xa - 34 : mix(xa - 34, 70, va);
    capsule(c, xc, t < T.arrive ? ya : mix(ya, 112, va), 44, COA, 'CoA', 1 - .7 * va);
    c.repere('acetyl', xg - 30, ya - 14, 90, 28, 'l’acétyl-CoA : l’acétyl (2 C) porté par le coenzyme A');
  }
  if (t >= T1.debut) ecrit.ecrire(c, 'acetyl', () => c.texte('acétyl-CoA (2 C)', 112, 100, { couleur: 'violet', taille: 14, align: 'center' }));
  // le composé du cycle
  const e = t < T2.debut ? compose(T1, t) : compose(T2, t), [xc, yc] = surRoue(e.ang);
  amas(c, xc, yc, e.n, doux(chrono.part(0, 1, t)));
  ecrit.ecrire(c, 'centre' + e.n, () => c.texte(`${e.n} C`, RO.x, RO.y + 9, { couleur: 'jaune', taille: 28, align: 'center' }));
  if (e.n === 6) c.repere('compose_6c', xc - 34, yc - 20, 68, 40, 'le composé à 6 C');
  // les crans : flèche vers l’extérieur et ce qui sort, écrits au premier tour
  for (const cr of T1.crans) {
    if (t < cr.ev - .4) continue;
    const [x0, y0] = surRoue(cr.ang, 8), [x1, y1] = surRoue(cr.ang, 40), [xt, yt] = surRoue(cr.ang, 54);
    ecrit.ecrire(c, 'cran' + cr.id, () => {
      c.fleche(x0, y0, x1, y1, { couleur: 'orange', largeur: 1.6, tete: 8 });
      c.texte(cr.texte, xt + (cr.align === 'left' ? 2 : cr.align === 'right' ? -2 : 0), yt + 5, { couleur: 'blanc', taille: 14, align: cr.align });
    });
  }
  for (const T of TOURS) for (const cr of T.crans) sortie(c, cr, t, T === T1 ? 1 : .5);
  const rep = (id, cr, w = 130) => { const [x, y] = surRoue(cr.ang, 54); const x0 = cr.align === 'left' ? x - 50 : cr.align === 'right' ? x - w : x - w / 2; c.repere(id, x0, y - 16, w + 40, 30, cr.texte.replace(/_\{2\}/, '2')); };
  if (t >= T1.crans[0].ev) rep('co2', T1.crans[0], 120);
  if (t >= T1.crans[0].ev) rep('nadh', T1.crans[0], 120);
  if (t >= T1.crans[2].ev) rep('atp', T1.crans[2], 110);
  if (t >= T1.crans[3].ev) rep('fadh2', T1.crans[3], 100);
  // un tour du cycle : le composé à 4 C est retrouvé
  if (t >= T1.retour - .2) {
    ecrit.ecrire(c, 'cycle', () => {
      c.texte('4 C retrouvé :', RO.x, RO.y + 36, { couleur: 'vert', taille: 14, align: 'center' });
      c.texte('c’est un cycle', RO.x, RO.y + 54, { couleur: 'vert', taille: 14, align: 'center' });
    });
    ecrit.ecrire(c, 'eqtour', () => c.texte('un tour : CH_3-CO-CoA + 3 NAD+ + FAD + ADP + Pi + 3 H_{2}O → 2 CO_{2} + 3 NADH,H+ + FADH_{2} + ATP + CoA-H', 380, 380, { couleur: 'faible', taille: 13, align: 'center', max: 724 }));
    c.repere('equation', 16, 366, 728, 20, 'l’équation d’un tour du cycle');
  }
  if (t >= T2.debut) ecrit.ecrire(c, 'second', () => c.texte('2ᵉ tour', RO.x, RO.y - 30, { couleur: 'violet', taille: 14, align: 'center' }));
  if (t >= T2.debut) ecrit.ecrire(c, 'second2', () => c.texte('(second acide pyruvique', 95, 222, { couleur: 'faible', taille: 12, align: 'center' }));
  if (t >= T2.debut) ecrit.ecrire(c, 'second3', () => c.texte('du même glucose)', 95, 238, { couleur: 'faible', taille: 12, align: 'center' }));
  // le bilan pour un glucose
  if (t >= M.second_tour + .4) {
    ecrit.ecrire(c, 'x2', () => {
      c.texte('× 2', 724, 128, { couleur: 'jaune', taille: 14, align: 'center' });
      c.ligne(698, 112, 698, 240, { couleur: 'tresfaible', largeur: 1.2 });
      for (const [id, , y] of LIGNES) c.texte(String(2 * { co2: 2, nadh: 3, fadh2: 1, atp: 1 }[id]), 724, y, { couleur: 'jaune', taille: 15, align: 'center' });
      c.texte('pour un glucose', 664, 262, { couleur: 'jaune', taille: 13, align: 'center' });
    });
    c.repere('tableau_glucose', 700, 112, 46, 156, 'le bilan du cycle pour un glucose (× 2)');
  }
  if (t >= M.compteur_par_glucose - .3) {
    ecrit.ecrire(c, 'glucose', () => {
      c.texte('pour un glucose : 10 NADH,H+ (2 glycolyse + 2 acétyl-CoA + 6 Krebs), 2 FADH_{2}, 6 CO_{2}', 380, 398, { couleur: 'jaune', taille: 14, align: 'center', max: 724 });
      c.texte('l’énergie est surtout portée par NADH,H+ et FADH_{2}', 380, 416, { couleur: 'vert', taille: 14, align: 'center', max: 724 });
    });
  }
}

function phase(t) {
  const k = compteur(t), cpt = `Compteur d’un tour : CO2 ${k.co2}, NADH,H+ ${k.nadh}, FADH2 ${k.fadh2}, ATP ${k.atp}.`;
  if (t < 1) return 'La roue du cycle dans la matrice ; en haut le composé à 4 C (au centre : « 4 C »). ' + cpt;
  if (t < 3) return 'L’acétyl (2 C), porté par le coenzyme A (CoA), arrive par la gauche vers le composé à 4 C. ' + cpt;
  if (t < 5) return 'Le CoA repart ; l’acétyl s’accroche au composé à 4 C. ' + cpt;
  if (t < 7.5) return 'Composé à 6 C (au centre : « 6 C ») ; il avance d’un cran sur la roue. ' + cpt;
  if (t < 8.5) return 'Premier cran : un CO2 et un NADH,H+ sortent (flèche vers l’extérieur) ; reste 5 C. ' + cpt;
  if (t < 11.3) return 'Deuxième cran : encore un CO2 et un NADH,H+ ; reste 4 C. ' + cpt;
  if (t < 13.3) return 'Troisième cran : ADP + Pi → ATP. ' + cpt;
  if (t < 15.3) return 'Quatrième cran : FAD → FADH2. ' + cpt;
  if (t < 17.3) return 'Cinquième cran : NAD+ → NADH,H+. ' + cpt;
  if (t < 18.8) return 'Le composé à 4 C revient en haut de la roue. ' + cpt;
  if (t < 21) return 'Le composé à 4 C est retrouvé, prêt pour un autre acétyl : c’est un cycle (écrit au centre). En bas, l’équation d’un tour. ' + cpt;
  if (t < M.second_tour) return 'Un second acétyl-CoA (du second acide pyruvique du même glucose) fait un second tour du cycle, plus vite (écrit : 2ᵉ tour). ' + cpt;
  if (t < M.second_tour + .4) return 'Le second tour est fini : le composé à 4 C est de nouveau en haut. ' + cpt;
  if (t < M.compteur_par_glucose - .3) return 'Le tableau reçoit sa colonne × 2 : pour un glucose 4 CO2, 6 NADH,H+, 2 FADH2, 2 ATP. ' + cpt;
  return 'Tableau × 2 : 4 CO2, 6 NADH,H+, 2 FADH2, 2 ATP. En bas : pour un glucose, 10 NADH,H+ (2 glycolyse + 2 acétyl-CoA + 6 Krebs), 2 FADH2, 6 CO2 ; l’énergie est surtout portée par NADH,H+ et FADH2. ' + cpt;
}
function ceQuiSeVoit() {
  const t = chrono.t, e = t < T2.debut ? compose(T1, t) : compose(T2, t);
  return `t = ${fr(t, 1)} s${chrono.running ? ' (ça avance)' : chrono.fait ? ' (fin)' : ' (arrêté)'}. ${phase(t)} Composé sur la roue : ${e.n} C.`;
}

$('run').onclick = chrono.clic;
window.Tableau.explication({ krebs: [
  { repere: 'roue', texte: 'Dans la matrice, le cycle de Krebs.' },
  { repere: 'acetyl', texte: 'L’acétyl, deux carbones, arrive porté par le coenzyme A.' },
  { repere: 'compose_6c', texte: 'Il s’accroche à un composé à quatre carbones : six carbones.' },
  { repere: 'co2', texte: 'Deux décarboxylations : deux CO2 sortent, avec deux NADH,H+.' },
  { repere: 'atp', texte: 'Un ATP se forme.' },
  { repere: 'fadh2', texte: 'Un FAD devient FADH2, puis un dernier NADH,H+.' },
  { repere: 'compteur', texte: 'Un tour : deux CO2, trois NADH,H+, un FADH2, un ATP.' },
  { repere: 'equation', texte: 'L’équation d’un tour du cycle.' },
  { repere: 'tableau_glucose', texte: 'Deux acétyl-CoA par glucose : tout est multiplié par deux.' } ] });
const commandes = ['start', 'reset', 'pause', 'resume', 'set_time', 'play_until'];
const config = { id: 'svt_energie_krebs', version: '1.0', title: 'Le cycle de Krebs dans la matrice', variants: [{ id: 'krebs', label: 'cycle de Krebs' }], commands: commandes,
  command_schema: { set_time: { time_s: `0..${FIN} (arrêt sur cet instant)` }, play_until: { moment: Object.keys(M).join(' | ') + ' (rejoue et se fige à cet instant clé)', time_s: 'ou un instant en s' } } };
const pont = protocole({ id: config.id, commandes, config,
  texte: 'Le cycle de Krebs, dans la matrice : l’acétyl (2 C) de l’acétyl-CoA s’accroche à un composé à 4 C → composé à 6 C ; puis CO2 + NADH,H+ (reste 5 C), CO2 + NADH,H+ (reste 4 C), ADP + Pi → ATP, FAD → FADH2, NAD+ → NADH,H+ ; le composé à 4 C est retrouvé : c’est un cycle. Un tour : CH3-CO-CoA + 3 NAD+ + FAD + ADP + Pi + 3 H2O → 2 CO2 + 3 NADH,H+ + FADH2 + ATP + CoA-H. Pour un glucose, deux tours : 4 CO2, 6 NADH,H+, 2 FADH2, 2 ATP ; au total 10 NADH,H+ (2 glycolyse + 2 acétyl-CoA + 6 Krebs), 2 FADH2, 6 CO2 ; l’énergie est surtout portée par NADH,H+ et FADH2.',

  progression: () => chrono.t / FIN,

bulle($('feedback'), 'La matrice de la mitochondrie : le cycle de Krebs…');
