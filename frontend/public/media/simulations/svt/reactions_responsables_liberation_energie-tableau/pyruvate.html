<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L’acide pyruvique devient acétyl-CoA — au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="svt.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="L’acide pyruvique (trois billes de carbone, CH3-CO-COOH) passe du hyaloplasme à la matrice à travers les deux membranes de la mitochondrie ; son groupe COOH part en CO2 (décarboxylation), un NAD+ prend deux hydrogènes (déshydrogénation), le coenzyme A s’accroche : acétyl-CoA, CH3-CO-CoA"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start reset pause resume play_until set_time">Lancer</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="commun.js"></script>
<script src="/media/simulations/shared/lexique/lexique.js"></script>
<script src="peinture.js"></script>
<script>
/*
 * La formation de l’acétyl-CoA dans la matrice (cours SVT « Libération de l’énergie »), 10 novembre 2026.
 * Ce qui se voit, dans l’ordre (t en s de la scène) :
 *   (17 novembre 2026 : un moment par chose dite, chaque écrit quand le tuteur le dit)
 *   pyruvate_hyaloplasme (0,9) : l’acide pyruvique (3 C) dans le hyaloplasme ;
 *   entre_dans_matrice (3) : il traverse les deux membranes et entre dans la matrice ;
 *   cooh_entoure (5)       : son groupe COOH est entouré ;
 *   co2_part (7,5)         : la bille COOH part en CO2 ;   decarboxylation (8,4) : « décarboxylation », il reste 2 carbones ;
 *   taxi_prend_2h (11)     : un NAD+ prend deux hydrogènes : NADH,H+ ;   deshydrogenation (12) : « déshydrogénation » ;
 *   coa_s_accroche (14)    : le coenzyme A (CoA-H) s’accroche à CH3-CO ;   coa_transporteur (15,2) : « transporteur du groupement acétyl » ;
 *   acetyl_coa (16,2)      : acétyl-CoA, CH3-CO-CoA ;   equation (17,6) : l’équation ;   fois_deux (18,6) : pour un glucose : × 2.
 * Le coenzyme A n’est pas une enzyme : c’est un transporteur du groupement acétyl.
 */
const { fr, bulle, protocole } = window.Tableau;
const { Scene, Chrono, Apparitions, doux, mix } = window.SVTTableau;
const P = window.SVTPeinture;
const ENCRE = '#0b1f2a';   // (16 novembre 2026) texte sombre et gras sur les capsules et protéines claires : bien lisible
const $ = id => document.getElementById(id);

const M = { pyruvate_hyaloplasme: 0.9, entre_dans_matrice: 3, cooh_entoure: 5, co2_part: 7.5, decarboxylation: 8.4, taxi_prend_2h: 11, deshydrogenation: 12,
  coa_s_accroche: 14, coa_transporteur: 15.2, acetyl_coa: 16.2, equation: 17.6, fois_deux: 18.6 };
const FIN = 19;
const MOTIFS = {
  pyruvate_hyaloplasme: 'l’acide pyruvique, dans le hyaloplasme',
  entre_dans_matrice: 'l’acide pyruvique a traversé les deux membranes : il est dans la matrice',
  cooh_entoure: 'le groupe COOH de l’acide pyruvique',
  co2_part: 'un CO2 part de l’acide pyruvique',
  decarboxylation: 'décarboxylation : un CO2 part, il reste deux carbones',
  taxi_prend_2h: 'un NAD+ prend deux hydrogènes : NADH,H+',
  deshydrogenation: 'déshydrogénation : on a enlevé des hydrogènes',
  coa_s_accroche: 'le coenzyme A s’accroche au groupement acétyl CH3-CO',
  coa_transporteur: 'le coenzyme A : un transporteur du groupement acétyl, pas une enzyme',
  acetyl_coa: 'l’acétyl-CoA, CH3-CO-CoA',
  equation: 'l’équation de la formation de l’acétyl-CoA',
  fois_deux: 'pour un glucose : deux fois',
};
const CARBONE = [250, 204, 21], HYDRO = [235, 240, 245], TAXI = [34, 190, 220], COA = window.Lexique.C.coa;
const PAS = 34, Y = 214, X0 = 120, X1 = 470;            // les billes de l’acide pyruvique, son départ et son arrivée
const CO2 = [660, 140], TX = { depart: [470, 404], pose: [470, 296] }, CA = { depart: [700, 214], pose: [X1 + 11 + 30, 214] };
const MEMB = { ext: 250, esp: 262, int: 288, mat: 304 };

const canvas = $('canvas');
const scene = Scene(canvas, (c) => { scene.cadre(43); MOS.dessiner(c, () => { dessiner(c); }); return c.fin(); }, { large: true });
/* Tableau large (portable 1366 × 613) : la page est rangée sur toute la largeur (SVTLarge.Mosaique, dans peinture.js) ; grand écran : inchangée. */
/* 16 novembre 2026 : plus de colonne de titre (la diapositive le dit) ; en cadre large le dessin est centré, le hyaloplasme et la
 * matrice peints s'étendent jusqu'aux bords du tableau (peindre). */
const MOS = window.SVTLarge.Mosaique(scene, () => null);
const ecrit = Apparitions(scene);
const chrono = Chrono({ fin: () => FIN, moments: () => M, motifs: MOTIFS, bouton: $('run'), bulle: $('feedback'), pont: () => pont,
  depart: 'Observe l’acide pyruvique dans le hyaloplasme…', reinit: () => ecrit.oublier(),
  fini: () => 'CH3-CO-COOH + CoA-H + NAD+ → CH3-CO-CoA + CO2 + NADH,H+ (deux fois pour un glucose).' });
scene.avancer = chrono.avancer;

/* ── Peinture : hyaloplasme, les deux membranes, la matrice ── */
const R = P.graine(29), GH = [], GM = [];
for (let i = 0; i < 40; i++) GH.push([16 + R() * 230, 50 + R() * 360, .7 + R() * 1.4]);
for (let i = 0; i < 70; i++) GM.push([310 + R() * 432, 50 + R() * 360, .7 + R() * 1.3]);
function peindre(ctx) {
  // (16 novembre 2026) couleurs vives et volumes : hyaloplasme vert d'eau, membrane externe corail, espace pêche, membrane interne
  // dorée en double couche, matrice bleu lumineux ; en cadre large, les deux milieux vont jusqu'aux bords du tableau.
  const e = Math.max(0, (scene.L - 760) / 2), y0 = 8, h = 408;
  P.fondHyalo(ctx, 8 - e, y0, MEMB.ext - 8 + e, h);
  let g = ctx.createLinearGradient(MEMB.ext, 0, MEMB.esp, 0); g.addColorStop(0, '#9a3412'); g.addColorStop(.45, '#fb7d4f'); g.addColorStop(1, '#c2410c');
  ctx.fillStyle = g; ctx.fillRect(MEMB.ext, y0, MEMB.esp - MEMB.ext, h);
  g = ctx.createLinearGradient(MEMB.esp, 0, MEMB.int, 0); g.addColorStop(0, 'rgba(255,186,120,.75)'); g.addColorStop(1, 'rgba(255,214,160,.55)');
  ctx.fillStyle = g; ctx.fillRect(MEMB.esp, y0, MEMB.int - MEMB.esp, h);
  P.fondMatrice(ctx, MEMB.mat, y0, 752 + e - MEMB.mat, h, { cx: 560, cy: 214 });
  ctx.save(); ctx.transform(0, 1, -1, 0, MEMB.mat, y0); P.membrane(ctx, 0, 0, h, MEMB.mat - MEMB.int, { pas: 8 }); ctx.restore();
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(MEMB.ext + 3, y0); ctx.lineTo(MEMB.ext + 3, y0 + h); ctx.stroke(); ctx.restore();
}
function capsule(c, x, y, w, couleur, nom, a = 1) {
  c.direct(() => { P.capsule(c.ctx, x, y, w, 24, couleur, { alpha: a }); c.texte(nom, x, y + 5, { couleur: ENCRE, gras: true, taille: 14, align: 'center', alpha: a }); });
}

/* Le centre de l’acide pyruvique à l’instant t. */
const centre = (t) => mix(X0, X1, doux(chrono.part(1, 3, t)));

function dessiner(c) {
  const t = chrono.t, cx = centre(t);
  c.direct(() => peindre(c.ctx));
  c.texte('hyaloplasme', 24, 96, { couleur: 'vert', taille: 18, gras: true });
  c.texte('membrane externe', 244, 52, { couleur: 'orange', taille: 15, gras: true, align: 'right' });
  c.fleche(240, 58, 254, 80, { couleur: 'orange', largeur: 1.6, tete: 7 });
  c.texte('membrane interne', 316, 52, { couleur: 'jaune', taille: 15, gras: true });
  c.fleche(322, 58, 300, 80, { couleur: 'jaune', largeur: 1.6, tete: 7 });
  c.texte('matrice', 700, 96, { couleur: 'cyan', taille: 20, gras: true, align: 'center' });
  c.repere('hyaloplasme', 14, 80, 230, 40, 'le hyaloplasme');
  c.repere('membranes', MEMB.ext - 4, 80, MEMB.mat - MEMB.ext + 8, 300, 'les deux membranes de la mitochondrie');
  c.repere('matrice', 640, 80, 104, 24, 'la matrice');

  const a = doux(chrono.part(0, .8, t));
  // les billes de carbone : 1 (CH3), 2 (CO), 3 (COOH, qui part en CO2)
  c.direct(() => { P.liaison(c.ctx, cx - PAS, Y, cx, Y, { alpha: Math.max(.05, a) }); P.bille(c.ctx, cx - PAS, Y, 11, CARBONE, { alpha: Math.max(.05, a) }); P.bille(c.ctx, cx, Y, 11, CARBONE, { alpha: Math.max(.05, a) }); });
  const u3 = doux(chrono.part(5.5, 7.3, t));
  const b3 = [mix(cx + PAS, CO2[0], u3), mix(Y, CO2[1], u3)];
  c.direct(() => {
    if (u3 <= 0) P.bille(c.ctx, b3[0], b3[1], 11, CARBONE, { alpha: Math.max(.05, a) });
    else { P.bille(c.ctx, b3[0], b3[1], 11 - 3 * u3, CARBONE, { alpha: 1 - u3 }); P.co2(c.ctx, b3[0], b3[1], 1.3, u3); P.bulleGaz(c.ctx, b3[0], b3[1], 16 + 6 * u3); }   // le carbone part en CO2 : O = C = O
  });
  // les deux hydrogènes, sous la molécule, jusqu’au NAD+
  const uh = doux(chrono.part(9.8, 10.6, t));
  if (t < 10.6) for (let i = 0; i < 2; i++) c.direct(() => P.bille(c.ctx, mix(cx - PAS - 4 + 16 * i, TX.pose[0] - 9 + 18 * i, uh), mix(Y + 24, TX.pose[1] - 4, uh), 5, HYDRO, { alpha: Math.max(.05, a) }));
  // la formule au-dessus
  const fx = t < 6.3 ? cx : t < 13.9 ? cx - PAS / 2 : (cx - PAS + CA.pose[0] + 28) / 2;
  const formule = t < 6.3 ? 'CH_3-CO-COOH' : t < 13.9 ? 'CH_3-CO' : 'CH_3-CO-CoA';
  if (a > .3) {
    ecrit.ecrire(c, 'f' + formule, () => c.texte(formule, fx, Y - 26, { couleur: 'jaune', taille: 18, gras: true, align: 'center' }));
    c.repere('formule', fx - 60, Y - 46, 120, 26, 'la formule ' + formule.replace(/_/g, ''));
    c.repere('pyruvate', cx - PAS - 16, Y - 16, 2 * PAS + 32, 32, t < 6.3 ? 'l’acide pyruvique' : 'le groupement acétyl CH3-CO');
  }
  if (t < 3.2 && a > .3) ecrit.ecrire(c, 'nom', () => c.texte('acide pyruvique (3 C)', cx, Y + 50, { couleur: 'blanc', taille: 16, gras: true, align: 'center' }));
  // le groupe COOH entouré
  if (t >= 3.6 && t < 6.3) {
    const W = c.largeurTexte('CH3-CO-COOH', 16), d = cx - W / 2 + c.largeurTexte('CH3-CO-', 16);
    const x0 = Math.min(d - 3, cx + PAS - 15), x1 = Math.max(cx + W / 2, cx + PAS + 13) + 6;
    ecrit.ecrire(c, 'cooh', () => c.rect(x0, Y - 46, x1 - x0, 64, { couleur: 'orange', largeur: 1.8, arrondi: 12 }));
    c.repere('cooh', x0, Y - 46, x1 - x0, 64, 'le groupe COOH');
  }
  // le CO2 parti
  if (u3 > .5) c.repere('co2', b3[0] - 22, b3[1] - 22, t >= 7.2 ? 74 : 44, 44, 'le CO2 qui part');   // il suit la bulle qui s’en va
  if (t >= 7.2) ecrit.ecrire(c, 'co2', () => c.texte('CO_{2}', CO2[0] + 30, CO2[1] + 6, { couleur: 'blanc', taille: 17, gras: true }));
  if (t >= 7.6) {
    ecrit.ecrire(c, 'decarb', () => {
      c.texte('décarboxylation : un CO_{2} part', 326, 122, { couleur: 'orange', taille: 17, gras: true });
      c.texte('(il reste 2 carbones)', 326, 146, { couleur: 'blanc', taille: 15 });
    });
    c.repere('ecrit_decarboxylation', 322, 104, 270, 48, 'décarboxylation : un CO2 part');
  }
  // le NAD+ prend deux hydrogènes
  if (t >= 8.6) {
    const u = doux(chrono.part(8.6, 9.6, t)), plein = t >= 10.6, w = (plein ? 78 : 50) / 2 + 3;
    capsule(c, mix(TX.depart[0], TX.pose[0], u), mix(TX.depart[1], TX.pose[1], u), plein ? 78 : 50, TAXI, plein ? 'NADH,H+' : 'NAD+', doux(chrono.part(8.6, 9.1, t)));
    if (t >= 9.6) c.repere('taxi', TX.pose[0] - w, TX.pose[1] - 14, 2 * w, 28, plein ? 'NADH,H+' : 'NAD+');
  }
  if (t >= 11.2) {
    ecrit.ecrire(c, 'deshydro', () => c.texte('déshydrogénation', 520, 302, { couleur: 'cyan', taille: 17, gras: true }));
    c.repere('ecrit_deshydrogenation', 516, 286, 150, 22, 'déshydrogénation');
  }
  // le coenzyme A s’accroche
  if (t >= 12.2) {
    const u = doux(chrono.part(12.2, 13.7, t));
    capsule(c, mix(CA.depart[0], CA.pose[0], u), mix(CA.depart[1], CA.pose[1], u), 56, COA, t >= 13.9 ? 'CoA' : 'CoA-H', doux(chrono.part(12.2, 12.7, t)));
    if (t >= 13.7) c.repere('coa', CA.pose[0] - 31, Y - 14, 62, 28, 'le coenzyme A');
  }
  if (t >= 14.2) {
    ecrit.ecrire(c, 'coa', () => {
      c.texte('coenzyme A (CoA-H) :', 552, 196, { couleur: 'violet', taille: 15 });
      c.texte('transporteur du', 552, 214, { couleur: 'violet', taille: 15 });
      c.texte('groupement acétyl', 552, 232, { couleur: 'violet', taille: 15 });
    });
    c.repere('ecrit_coa', 548, 180, 160, 58, 'le coenzyme A : transporteur du groupement acétyl');
  }
  // l’acétyl-CoA, l’équation, × 2
  if (t >= 15.4) {
    ecrit.ecrire(c, 'acetyl', () => c.texte('acétyl-CoA : CH_3-CO-CoA', fx, 260, { couleur: 'jaune', taille: 18, gras: true, align: 'center' }));
    c.repere('acetyl', fx - 110, 242, 220, 24, 'l’acétyl-CoA');
  }
  if (t >= 16.4) {
    c.direct(() => { c.ctx.save(); c.ctx.globalAlpha = doux(chrono.part(16.4, 17, t)); P.carte(c.ctx, 312, 330, 436, 62, { alpha: .86 }); c.ctx.restore(); });
    ecrit.ecrire(c, 'equation', () => c.texte('CH_3-CO-COOH + CoA-H + NAD+ → CH_3-CO-CoA + CO_{2} + NADH,H+', 530, 354, { couleur: 'blanc', taille: 16, gras: true, align: 'center', max: 420 }));
    c.repere('equation', 312, 334, 436, 28, 'l’équation de la formation de l’acétyl-CoA');
  }
  if (t >= 17.9) {
    ecrit.ecrire(c, 'x2', () => c.texte('pour un glucose : × 2', 530, 380, { couleur: 'jaune', taille: 17, gras: true, align: 'center' }));
    c.repere('fois_deux', 440, 364, 180, 22, 'pour un glucose : deux fois');
  }
}

function phase(t) {
  if (t < 1) return 'L’acide pyruvique (3 billes de carbone, formule CH3-CO-COOH au-dessus) apparaît dans le hyaloplasme, à gauche des deux membranes de la mitochondrie.';
  if (t < 3) return 'L’acide pyruvique traverse la membrane externe puis la membrane interne.';
  if (t < 3.6) return 'L’acide pyruvique (3 C) est dans la matrice.';
  if (t < 5.5) return 'Le groupe COOH (la bille de droite) est entouré.';
  if (t < 7.6) return 'La bille COOH part en CO2 (bulle) ; il reste 2 carbones (CH3-CO).';
  if (t < 8.6) return 'Écrit : « décarboxylation : un CO2 part (il reste 2 carbones) ».';
  if (t < 10.6) return 'Un NAD+ arrive sous la molécule et prend deux hydrogènes.';
  if (t < 11.2) return 'Le NAD+ est devenu NADH,H+.';
  if (t < 12.2) return 'Écrit sous lui : « déshydrogénation ».';
  if (t < 14.2) return 'Le coenzyme A (CoA-H, capsule violette) arrive et s’accroche à CH3-CO ; la formule devient CH3-CO-CoA.';
  if (t < 15.4) return 'Écrit : « coenzyme A (CoA-H) : transporteur du groupement acétyl ».';
  if (t < 16.4) return 'Écrit : acétyl-CoA : CH3-CO-CoA.';
  if (t < 17.9) return 'En bas, l’équation : CH3-CO-COOH + CoA-H + NAD+ → CH3-CO-CoA + CO2 + NADH,H+.';
  return 'L’équation et « pour un glucose : × 2 ».';
}
function ceQuiSeVoit() {
  const t = chrono.t;
  return `t = ${fr(t, 1)} s${chrono.running ? ' (ça avance)' : chrono.fait ? ' (fin)' : ' (arrêté)'}. De gauche à droite : hyaloplasme, membrane externe, espace intermembranaire, membrane interne, matrice. ${phase(t)} Produits visibles : CO2 ${t >= 7.3 ? 1 : 0}, NADH,H+ ${t >= 10.6 ? 1 : 0}, acétyl-CoA ${t >= 13.9 ? 1 : 0}.`;
}

$('run').onclick = chrono.clic;
window.Tableau.explication({ acetyl_coa: [
  { repere: 'hyaloplasme', texte: 'L’acide pyruvique formé par la glycolyse est dans le hyaloplasme.' },
  { repere: 'membranes', texte: 'Il traverse les deux membranes de la mitochondrie.' },
  { repere: 'matrice', texte: 'Il arrive dans la matrice.' },
  { repere: 'cooh', texte: 'Son groupe COOH…' },
  { repere: 'co2', texte: '…part en CO2 : c’est une décarboxylation.' },
  { repere: 'taxi', texte: 'Un NAD+ prend deux hydrogènes : déshydrogénation, il devient NADH,H+.' },
  { repere: 'coa', texte: 'Le coenzyme A, transporteur du groupement acétyl, s’accroche.' },
  { repere: 'acetyl', texte: 'On obtient l’acétyl-CoA, CH3-CO-CoA.' },
  { repere: 'equation', texte: 'L’équation, deux fois pour un glucose.' } ] });
const commandes = ['start', 'reset', 'pause', 'resume', 'set_time', 'play_until'];
const config = { id: 'svt_energie_pyruvate', version: '1.0', title: 'L’acide pyruvique devient acétyl-CoA dans la matrice', variants: [{ id: 'acetyl_coa', label: 'formation de l’acétyl-CoA' }], commands: commandes,
  command_schema: { set_time: { time_s: `0..${FIN} (arrêt sur cet instant)` }, play_until: { moment: Object.keys(M).join(' | ') + ' (rejoue et se fige à cet instant clé)', time_s: 'ou un instant en s' } } };
const pont = protocole({ id: config.id, commandes, config,
  texte: 'L’acide pyruvique (CH3-CO-COOH) traverse les deux membranes de la mitochondrie et entre dans la matrice. Son groupe COOH part en CO2 (décarboxylation), un NAD+ prend deux hydrogènes et devient NADH,H+ (déshydrogénation), le coenzyme A (CoA-H, transporteur du groupement acétyl) s’accroche : acétyl-CoA, CH3-CO-CoA. CH3-CO-COOH + CoA-H + NAD+ → CH3-CO-CoA + CO2 + NADH,H+ ; pour un glucose : × 2.',
  etat: () => ({ simulation_status: chrono.statut(), ce_qui_se_voit: ceQuiSeVoit(), current_variant: 'acetyl_coa', time_s: +chrono.t.toFixed(2), parameters: {}, moments: M }),
  progression: () => chrono.t / FIN,
  executer: (cmd, p) => ({ start: chrono.start, reset: chrono.reset, pause: chrono.pause, resume: chrono.resume, set_time: () => { chrono.setTime(p); scene.sale = true; }, play_until: () => chrono.playUntil(p) })[cmd]?.() });
bulle($('feedback'), 'L’acide pyruvique, dans le hyaloplasme…');
setTimeout(() => { if (!chrono.pilote && !chrono.running && chrono.t === 0) chrono.start(); }, 1600);
window.__sim = { chrono, scene, M, ecrit };
</script>
<script src="/media/simulations/professor-locate.js" defer></script>
</body></html>
