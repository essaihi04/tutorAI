<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La mitochondrie — au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="svt.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Une mitochondrie peinte en coupe dans le hyaloplasme, avec ses deux membranes, ses crêtes et sa matrice, et à droite une crête agrandie portant des sphères pédonculées tournées vers la matrice ; les légendes s'écrivent une par une à la craie"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start reset pause resume play_until set_time set_parameters">Lancer</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="commun.js"></script>
<script src="peinture.js"></script>
<script>
/*
 * L’ultrastructure de la mitochondrie, à légender (cours SVT « Libération de l’énergie », 10 novembre 2026).
 * Une grande mitochondrie peinte en coupe (deux membranes, crêtes, matrice) dans le hyaloplasme ; à droite, une crête
 * agrandie : la membrane interne repliée, l’espace intermembranaire dans le repli, les sphères pédonculées têtes vers
 * la matrice. Les légendes s’écrivent une par une (t en s de la scène) :
 *   membrane_externe (2)  membrane_interne (4)  cretes (6)  espace_intermembranaire (8)  matrice (10)
 *   spheres_pedonculees (12,5)  lieux (16) : où se passe chaque étape.
 * set_parameters {legendes: 'noms' | 'numeros'} (aussi ?legendes=numeros) : en « numeros », seuls les numéros 1 à 6.
 * Vue « construire » (?vue=construire, schéma à légender comme au bac, 15 novembre 2026) : la même mitochondrie sans ses
 * noms, six étiquettes à glisser au bout des flèches ; bien posée, une étiquette devient verte et s’aimante.
 *   etiquettes (2,5)  corrige (6,5) ; set_parameters {corrige: true} : le tuteur pose toutes les étiquettes.
 *   Lecture seule (pour le lecteur) : legende_total, legende_places, legende_erreurs (étiquette lâchée sur le schéma
 *   loin de sa place), legende_mal (noms, séparés par des virgules).
 */
const { fr, bulle, protocole } = window.Tableau;
const { Scene, Chrono, Apparitions, doux } = window.SVTTableau;
const P = window.SVTPeinture;
const $ = id => document.getElementById(id);

const MI = { x: 270, y: 236, rx: 215, ry: 112, n: 12 };
const MED = { x: 556, y: 64, w: 192, h: 252 };        // médaillon : une crête agrandie
const ZOOM = { x: 336, y: 126, w: 40, h: 80 };         // cadre du zoom sur une crête de la grande mitochondrie
const M = { membrane_externe: 2, membrane_interne: 4, cretes: 6, espace_intermembranaire: 8, matrice: 10, spheres_pedonculees: 12.5, lieux: 16 };
const FIN = 18;
const MOTIFS = {
  membrane_externe: 'la membrane externe, qui limite la mitochondrie',
  membrane_interne: 'la membrane interne, sous la membrane externe',
  cretes: 'les crêtes : la membrane interne repliée vers l’intérieur',
  espace_intermembranaire: 'l’espace intermembranaire, entre les deux membranes',
  matrice: 'la matrice, à l’intérieur de la membrane interne',
  spheres_pedonculees: 'les sphères pédonculées, sur la membrane interne, têtes vers la matrice',
  lieux: 'où se passe chaque étape de la respiration',
};
const q = new URLSearchParams(location.search);
const S = { legendes: q.get('legendes') === 'numeros' ? 'numeros' : 'noms', corrige: false };
const CONSTRUIRE = q.get('vue') === 'construire';

/* Les six légendes : numéro, nom, position du texte, pointe de la flèche, instant où elle commence à s’écrire. */
const LEG = [
  { id: 'membrane_externe', n: 1, nom: 'membrane externe', x: 30, y: 74, de: [70, 80], a: [110, 158], couleur: 'orange' },
  { id: 'membrane_interne', n: 2, nom: 'membrane interne', x: 30, y: 384, de: [70, 370], a: [88, 284], couleur: 'jaune' },
  { id: 'cretes', n: 3, nom: 'crêtes', x: 176, y: 74, de: [200, 80], a: [218, 166], couleur: 'jaune' },
  { id: 'espace_intermembranaire', n: 4, nom: 'espace intermembranaire', x: 258, y: 74, de: [300, 80], a: [254, 128], couleur: 'orange' },
  { id: 'matrice', n: 5, nom: 'matrice', x: 282, y: 384, de: [300, 370], a: [272, 250], couleur: 'bleu' },
  { id: 'spheres_pedonculees', n: 6, nom: 'sphères pédonculées', x: 652, y: 344, align: 'center', de: [672, 330], a: [700, 214], couleur: 'jaune' },
];
LEG.forEach(l => { l.t0 = M[l.id] - 1.3; });

const canvas = $('canvas');
const scene = Scene(canvas, (c) => { scene.cadre(31); MOS.dessiner(c, () => { dessiner(c); }); return c.fin(); }, { large: true });
/* Tableau large (portable 1366 × 613) : la page est rangée sur toute la largeur (SVTLarge.Mosaique, dans peinture.js) ; grand écran : inchangée. */
const MOS = window.SVTLarge.Mosaique(scene, (L) => L >= 1000 && !CONSTRUIRE ? (() => { const s = Math.min(1.2, (L - 300) / 752, 412 / 392), B = 752 * s, wc = Math.min(300, L - B - 24), x0 = (L - wc - 16 - B) / 2, X = x0 + wc + 16; return { police: 1.12, blocs: [
  { src: [8, 28, 752, 392], X, Y: (420 - 392 * s) / 2, s },
  { src: [790, 0, 270, 100], X: x0, Y: 40, s: Math.min(1.05, wc / 270), police: 1 }] }; })() : null);
const ecrit = Apparitions(scene);
const chrono = Chrono({ fin: () => (CONSTRUIRE ? FIN_C : FIN), moments: () => (CONSTRUIRE ? MC : M), motifs: MOTIFS, bouton: $('run'), bulle: $('feedback'), pont: () => pont,
  depart: CONSTRUIRE ? 'À toi : légende la mitochondrie.' : 'Observe la mitochondrie en coupe…', reinit: () => ecrit.oublier(),
  fini: () => CONSTRUIRE ? `Étiquettes bien posées : ${compte(positions())} sur ${ORDRE.length}.` : 'Deux membranes : la membrane externe et la membrane interne repliée en crêtes, qui porte les sphères pédonculées.' });
scene.avancer = chrono.avancer;

/* ── Peinture ──────────────────────────────────────────────────────────────────────────────── */
const GRAINS = (() => { const r = P.graine(19), g = []; for (let i = 0; i < 120; i++) g.push([16 + r() * 728, 48 + r() * 366, .7 + r() * 1.4]); return g; })();
function hyaloplasme(ctx) {
  const g = ctx.createRadialGradient(280, 236, 40, 380, 236, 470);
  g.addColorStop(0, P.rgba(P.T.hyalo, .20)); g.addColorStop(1, P.rgba(P.T.hyalo, .06));
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(12, 44, 736, 372, 26) : ctx.rect(12, 44, 736, 372); ctx.fill();
  ctx.fillStyle = P.rgba([200, 220, 180], .14);
  for (const [x, y, r] of GRAINS) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
}
/* Une sphère pédonculée orientée : `angle` 0 = tête vers le bas, π/2 = vers la gauche, −π/2 = vers la droite. */
function sphere(ctx, x, y, angle, ep) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(angle); P.spherePedonculee(ctx, 0, 0, ep, 1, { r: 8 }); ctx.restore();
}
/* Une bande de membrane interne (double couche) entre deux points, peinte avec P.membrane dans un repère tourné. */
function bande(ctx, x1, y1, x2, y2, ep) {
  const L = Math.hypot(x2 - x1, y2 - y1), a = Math.atan2(y2 - y1, x2 - x1);
  ctx.save(); ctx.translate(x1, y1); ctx.rotate(a); P.membrane(ctx, 0, -ep / 2, L, ep, { pas: 7 }); ctx.restore();
}
const CR = { x: 652, haut: 112, bas: 244, demi: 18, ep: 12 };   // la crête du médaillon : un doigt de membrane
function medaillon(ctx) {
  const { x, y, w, h } = MED;
  ctx.save(); ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, 12) : ctx.rect(x, y, w, h); ctx.clip();
  // matrice partout, espace intermembranaire en haut et dans le doigt de la crête
  // (16 novembre 2026) matrice bleu lumineux et espace intermembranaire pêche vif, comme dans tout le cours
  ctx.restore(); P.fondMatrice(ctx, x, y, w, h, { arrondi: 12, cx: x + w / 2, cy: y + h * .6 });
  ctx.save(); ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, 12) : ctx.rect(x, y, w, h); ctx.clip();
  let g;
  ctx.fillStyle = 'rgba(255,190,130,.72)'; ctx.fillRect(x, y, w, CR.haut - 12 - y);
  ctx.beginPath(); ctx.moveTo(CR.x - CR.demi, CR.haut - 14); ctx.lineTo(CR.x - CR.demi, CR.bas); ctx.arc(CR.x, CR.bas, CR.demi, Math.PI, 0, true); ctx.lineTo(CR.x + CR.demi, CR.haut - 14); ctx.closePath(); ctx.fill();
  // membrane externe (en haut)
  ctx.strokeStyle = P.rgba(P.T.mitoExt, .95); ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x, y + 14); ctx.lineTo(x + w, y + 14); ctx.stroke();
  // membrane interne : à plat en haut, puis repliée en crête
  const e = CR.ep, yh = CR.haut - 6, xg = CR.x - CR.demi - e / 2, xd = CR.x + CR.demi + e / 2;
  bande(ctx, x, yh, xg + e / 2, yh, e); bande(ctx, xd - e / 2, yh, x + w, yh, e);
  bande(ctx, xg, yh, xg, CR.bas, e); bande(ctx, xd, yh, xd, CR.bas, e);
  const R = CR.demi + e / 2;
  for (let k = 0; k < 8; k++) { const a1 = k / 8 * Math.PI, a2 = (k + 1) / 8 * Math.PI; bande(ctx, CR.x + R * Math.cos(a1), CR.bas + R * Math.sin(a1), CR.x + R * Math.cos(a2), CR.bas + R * Math.sin(a2), e); }
  // sphères pédonculées : têtes vers la matrice
  for (const yy of [150, 186, 222]) { sphere(ctx, xg, yy, Math.PI / 2, e); sphere(ctx, xd, yy, -Math.PI / 2, e); }
  for (const xx of [580, 724]) sphere(ctx, xx, yh, 0, e);
  sphere(ctx, CR.x, CR.bas + CR.demi + e / 2, 0, e);
  ctx.restore();
}
function peindre(ctx) {
  hyaloplasme(ctx);
  P.mitochondrie(ctx, MI.x, MI.y, MI.rx, MI.ry, { cretes: MI.n, graine: 7 });
  medaillon(ctx);
}

function legende(c, l) {
  const num = S.legendes === 'numeros';
  c.fleche(l.de[0], l.de[1], l.a[0], l.a[1], { couleur: 'blanc', largeur: 1.5, tete: 9 });
  if (num) {
    const [x, y] = l.de, cx = x, cy = l.y > 200 ? y + 8 : y - 10;
    c.cercle(cx, cy, 10, { couleur: 'blanc', largeur: 1.5 }); c.texte(String(l.n), cx, cy + 5, { couleur: 'blanc', taille: 15, align: 'center' });
  } else c.texte(l.nom, l.x, l.y, { couleur: l.couleur, taille: 15, align: l.align || 'left' });
}
function lieux(c) {
  const num = S.legendes === 'numeros';
  c.texte((num ? 'dans 5 : ' : '') + 'formation de l’acétyl-CoA, cycle de Krebs', num ? 282 : 282, 404, { couleur: 'vert', taille: 14, gras: true });
  c.texte((num ? 'sur 2 : ' : '') + 'chaîne respiratoire, synthèse d’ATP', 30, 404, { couleur: 'vert', taille: 14, gras: true });
  c.texte('hyaloplasme : glycolyse', 548, 384, { couleur: 'vert', taille: 14, gras: true });
  c.texte('(hors de la mitochondrie)', 548, 404, { couleur: 'vert', taille: 14 });
}

function dessiner(c) {
  if (CONSTRUIRE) return dessinerConstruire(c);
  const t = chrono.t;
  c.direct(() => peindre(c.ctx));
  if (MOS.actif()) c.direct(() => ['La mitochondrie :', 'un organite', 'à deux membranes'].forEach((l, i) => c.texte(l, 800, 30 + i * 28, { couleur: 'cyan', taille: 22 })));   // tableau large : le titre en colonne à gauche
  else c.texte('La mitochondrie : un organite à deux membranes', 18, 30, { couleur: 'cyan', taille: 20 });
  c.texte('une crête agrandie', MED.x + MED.w / 2, 56, { couleur: 'blanc', taille: 15, gras: true, align: 'center' });
  c.rect(MED.x, MED.y, MED.w, MED.h, { couleur: 'jaune', largeur: 1.8, arrondi: 12 });
  c.rect(ZOOM.x, ZOOM.y, ZOOM.w, ZOOM.h, { couleur: 'jaune', largeur: 1.4, arrondi: 4 });
  c.ligne(ZOOM.x + ZOOM.w, ZOOM.y, MED.x, MED.y + 12, { couleur: 'tresfaible', largeur: 1.1, pointille: [5, 5] });
  c.ligne(ZOOM.x + ZOOM.w, ZOOM.y + ZOOM.h, MED.x, MED.y + MED.h - 12, { couleur: 'tresfaible', largeur: 1.1, pointille: [5, 5] });
  for (const l of LEG) {
    if (t < l.t0) continue;
    // la structure qu’on légende brille un instant
    const u = t - l.t0; if (u < 2) c.direct(() => P.eclat(c.ctx, l.a[0], l.a[1], 18, Math.sin(Math.min(1, u / 2) * Math.PI) * .8));
    ecrit.ecrire(c, l.id + S.legendes, () => legende(c, l));
  }
  if (t >= M.lieux - 1.4) ecrit.ecrire(c, 'lieux' + S.legendes, () => lieux(c));
  // repères
  for (const l of LEG) c.repere(l.id, l.a[0] - 22, l.a[1] - 18, 44, 36, l.nom);
  c.repere('medaillon', MED.x, MED.y, MED.w, MED.h, 'une crête agrandie');
}

/* ── Vue construire : la même mitochondrie sans ses noms, six étiquettes à poser (schéma à légender, 15 novembre 2026) ── */
const MC = { etiquettes: 2.5, corrige: 6.5 }, FIN_C = 8, T_CORR = 4.6;
MOTIFS.etiquettes = 'pose chaque étiquette au bout de sa flèche';
MOTIFS.corrige = 'la correction : toutes les étiquettes à leur place';
const FX = 76, FY = 0, FS = .8;                       // le dessin d’origine, réduit, laisse la place aux étiquettes en bas
const tr = (x, y) => [FX + FS * x, FY + FS * y];
const NOMS = Object.fromEntries(LEG.map(l => [l.id, l.nom]));
/* La place de chaque étiquette (centre, en coordonnées du cadre) ; la flèche part de là vers la structure. */
const SLOT = { membrane_externe: [140, 60], cretes: [262, 60], espace_intermembranaire: [414, 60], membrane_interne: [150, 312], matrice: [330, 312], spheres_pedonculees: [598, 292] };
const ORDRE = ['matrice', 'spheres_pedonculees', 'membrane_interne', 'cretes', 'espace_intermembranaire', 'membrane_externe'];
const largeurEt = id => 18 + 8.2 * NOMS[id].length;
const COLS_BAS = (() => {                              // deux rangées d’étiquettes sous le schéma
  const out = {}, rangs = [ORDRE.slice(0, 3), ORDRE.slice(3)], ys = [362, 398];
  rangs.forEach((r, j) => { const tot = r.reduce((a, id) => a + largeurEt(id), 0) + 28 * (r.length - 1); let x = 380 - tot / 2; for (const id of r) { out[id] = [x + largeurEt(id) / 2, ys[j]]; x += largeurEt(id) + 28; } });
  return out;
})();
/* (16 novembre 2026, « remets en page les vues qui laissent une bande vide ») : sur un tableau large (L ≥ 1150), les
 * étiquettes passent en colonne à droite et tout le document est agrandi KC fois (coordonnées d'origine inchangées :
 * l'agrandissement est fait au dessin et défait par localC). */
const COL_X = 836, COLS_DROITE = Object.fromEntries(ORDRE.map((id, i) => [id, [COL_X, 70 + 44 * i]]));
let COLS = COLS_BAS, KC = 1, OXC = 0, DXC = 0;
function disposerConstruire(L) {
  const large = L >= 1150, avant = COLS;
  if (large) { KC = Math.min(L / 960, 420 / 342); DXC = Math.max(0, (L - 760) / 2); OXC = Math.max(6, (L - 950 * KC) / 2); COLS = COLS_DROITE; }
  else { KC = 1; DXC = 0; OXC = 0; COLS = COLS_BAS; }
  if (COLS !== avant) for (const id of ORDRE) if (ET[id] && !ET[id].ok) { const [x, y] = COLS[id]; ET[id] = { x, y, ok: false }; }
}
const localC = (px, py) => { const [x, y] = scene.local(px, py); return KC > 1 ? [(x + DXC - OXC) / KC, y / KC] : [x, y]; };
let ET = {}, ERREURS = 0, MAL = new Set(), dernierT = 0;
function remiseEtiquettes() { ET = {}; ERREURS = 0; MAL = new Set(); for (const id of ORDRE) { const [x, y] = COLS[id]; ET[id] = { x, y, ok: false }; } }
remiseEtiquettes();
const rampe = (t, a, d) => doux(Math.max(0, Math.min(1, (t - a) / d)));
/** Positions affichées (la correction les amène à leur place). */
function positions() {
  const t = chrono.t, out = {};
  ORDRE.forEach((id, i) => {
    const e = ET[id];
    if (S.corrige && t >= T_CORR) { const u = rampe(t, T_CORR + .15 * i, 1.0), [sx, sy] = SLOT[id]; out[id] = { x: e.x + (sx - e.x) * u, y: e.y + (sy - e.y) * u, ok: e.ok || u >= 1 }; }
    else out[id] = { ...e };
  });
  return out;
}
const compte = pos => ORDRE.filter(id => pos[id].ok).length;
/** Ce que le lecteur lit pour noter et commenter le schéma (lecture seule). */
function legende() { return { legende_total: ORDRE.length, legende_places: ORDRE.filter(id => ET[id].ok).length, legende_erreurs: ERREURS, legende_mal: [...MAL].join(', ') }; }
function dessinerConstruire(c) {
  disposerConstruire(scene.L);
  if (KC === 1) return dessinerConstruire0(c);
  const ctx = c.ctx, e0 = c.echelle;
  ctx.save(); ctx.translate(OXC - DXC, 0); ctx.scale(KC, KC); if (e0) c.echelle = e0 * KC;
  try { dessinerConstruire0(c); } finally { ctx.restore(); c.echelle = e0; }
}
function dessinerConstruire0(c) {
  const t = chrono.t, ctx = c.ctx;
  if (t + .3 < dernierT) remiseEtiquettes();
  dernierT = t;
  ctx.save(); ctx.translate(FX, FY); ctx.scale(FS, FS);
  c.direct(() => {   // le schéma est déjà au tableau : seules les flèches et les étiquettes s'écrivent
    peindre(ctx);
    c.rect(MED.x, MED.y, MED.w, MED.h, { couleur: 'jaune', largeur: 1.8, arrondi: 12 });
    c.rect(ZOOM.x, ZOOM.y, ZOOM.w, ZOOM.h, { couleur: 'jaune', largeur: 1.4, arrondi: 4 });
    c.ligne(ZOOM.x + ZOOM.w, ZOOM.y, MED.x, MED.y + 12, { couleur: 'tresfaible', largeur: 1.1, pointille: [5, 5] });
    c.ligne(ZOOM.x + ZOOM.w, ZOOM.y + ZOOM.h, MED.x, MED.y + MED.h - 12, { couleur: 'tresfaible', largeur: 1.1, pointille: [5, 5] });
  });
  ctx.restore();
  c.direct(() => c.texte('une crête agrandie', ...tr(MED.x + MED.w / 2, 56), { couleur: 'blanc', taille: 15, gras: true, align: 'center' }));
  c.texte('Légende la mitochondrie : pose les étiquettes', 18, 24, { couleur: 'cyan', taille: 18, duree: .8 });
  // les flèches et les places vides (pointillés), écrites vite
  for (const l of LEG) {
    const [sx, sy] = SLOT[l.id], [ax, ay] = tr(l.a[0], l.a[1]), haut = sy < 200, w = largeurEt(l.id);
    c.fleche(sx + (ax - sx) * .12, haut ? sy + 14 : sy - 14, ax, ay, { couleur: 'blanc', largeur: 1.5, tete: 9, duree: .12 });
    c.direct(() => c.rect(sx - w / 2, sy - 13, w, 26, { couleur: 'faible', largeur: 1.2, pointille: [4, 4], arrondi: 6 }));
  }
  c.repere('schema', FX + FS * 12, FY + FS * 44, FS * 736, FS * 372, 'la mitochondrie à légender');
  c.repere('zone_membranes', 60, 40, 480, 110, 'les flèches du haut : membrane externe, crêtes, espace intermembranaire');
  c.repere('zone_interieur', 60, 180, 340, 145, 'les flèches du bas : membrane interne, matrice');
  c.repere('medaillon', ...tr(MED.x, MED.y), FS * MED.w, FS * MED.h + 50, 'la crête agrandie et ses sphères pédonculées');
  if (t >= 1.0) { if (KC > 1) c.repere('etiquettes', COL_X - 112, 50, 224, 44 * 6, 'les étiquettes à poser'); else c.repere('etiquettes', 140, 346, 480, 70, 'les étiquettes à poser'); }
  const pos = positions();
  if (t >= 1.0) ecrit.ecrire(c, 'et', () => {
    ORDRE.forEach(id => {
      const p = pos[id], w = largeurEt(id), coul = p.ok ? 'vert' : 'blanc';
      c.rect(p.x - w / 2, p.y - 13, w, 26, { couleur: coul, largeur: 1.6, fond: p.ok ? '#14532d' : '#1e293b', fondAlpha: .88, arrondi: 6, duree: .06 });
      c.texte(NOMS[id], p.x, p.y + 6, { couleur: coul, taille: 16, align: 'center', duree: .25 });
    });
  });
  if (S.corrige && t >= T_CORR + 1.9) ecrit.ecrire(c, 'bravo', () => c.texte('corrigé : les 6 étiquettes sont à leur place', KC > 1 ? 940 : 740, 24, { couleur: 'vert', taille: 15, align: 'right' }));
}
function voitConstruire() {
  const t = chrono.t, pos = positions(), m = [];
  m.push(`t = ${fr(t, 1)} s. La mitochondrie peinte en coupe SANS ses noms (deux membranes, crêtes, matrice) et, à droite, une crête agrandie avec ses sphères pédonculées ; six flèches finissent sur une place vide en pointillés.`);
  if (t < 1.0) return m.join(' ');
  const col = [], bien = [], ailleurs = [];
  for (const id of ORDRE) {
    const p = pos[id], [cx0, cy0] = COLS[id];
    if (p.ok) bien.push(`« ${NOMS[id]} »`);
    else if (Math.hypot(p.x - cx0, p.y - cy0) < 4) col.push(`« ${NOMS[id]} »`);
    else { let best = null, d = 1e9; for (const [s2, [sx, sy]] of Object.entries(SLOT)) { const dd = Math.hypot(p.x - sx, p.y - sy); if (dd < d) { d = dd; best = s2; } } ailleurs.push(`« ${NOMS[id]} » (posée près de la place de « ${NOMS[best]} »)`); }
  }
  if (col.length) m.push(`${KC > 1 ? 'En colonne à droite' : 'Sous le schéma'}, étiquettes à poser : ${col.join(', ')}.`);
  if (bien.length) m.push(`Bien posées (vertes, aimantées) : ${bien.join(', ')}.`);
  if (ailleurs.length) m.push(`Mal posées (blanches) : ${ailleurs.join(', ')}.`);
  if (S.corrige && t >= T_CORR && t < T_CORR + 1.9) m.push('Correction : les étiquettes glissent vers leur place.');
  m.push(`Bien posées : ${compte(pos)} sur ${ORDRE.length}. Erreurs de l’élève : ${ERREURS}.`);
  return m.join(' ');
}
window.Tableau.glisser(canvas, {
  toucher: (px, py) => {
    if (!CONSTRUIRE || chrono.t < 1.2 || (S.corrige && chrono.t >= T_CORR)) return null;
    const [x, y] = localC(px, py);
    for (let i = ORDRE.length - 1; i >= 0; i--) { const id = ORDRE[i], e = ET[id]; if (Math.abs(x - e.x) <= largeurEt(id) / 2 + 4 && Math.abs(y - e.y) <= 16) return id; }
    return null;
  },
  bouger: (id, px, py) => { const [x, y] = localC(px, py); ET[id] = { x: Math.min(KC > 1 ? 940 : 740, Math.max(20, x)), y: Math.min(KC > 1 ? 336 : 408, Math.max(40, y)), ok: false }; scene.sale = true; },
  lacher: (id) => {
    const [sx, sy] = SLOT[id], e = ET[id], [cx0, cy0] = COLS[id];
    if (Math.hypot(e.x - sx, e.y - sy) <= 40) ET[id] = { x: sx, y: sy, ok: true };
    // lâchée sur le schéma, loin de sa place : une erreur (la reposer en bas, parmi les étiquettes, n’en est pas une)
    else if ((KC > 1 ? e.x < 720 : e.y < 340) && Math.hypot(e.x - cx0, e.y - cy0) > 30) { ERREURS += 1; MAL.add(NOMS[id]); }
    const n = legende().legende_places;
    bulle($('feedback'), ET[id].ok ? `Bien placée : « ${NOMS[id]} » (${n} sur ${ORDRE.length}).` : `« ${NOMS[id]} » n’est pas à sa place.`, ET[id].ok ? 'good' : undefined);
    pont.noter('glisser', { poignee: id, parameters: params() }); pont.emettre(); scene.sale = true;
  },
});

/* ── Ce qui se voit ────────────────────────────────────────────────────────────────────────── */
function ceQuiSeVoit() {
  if (CONSTRUIRE) return voitConstruire();
  const t = chrono.t, num = S.legendes === 'numeros';
  const ecrites = LEG.filter(l => t >= M[l.id]).map(l => (num ? `${l.n} (${l.nom})` : l.nom));
  const cours = LEG.find(l => t >= l.t0 && t < M[l.id]);
  let s = `t = ${fr(t, 1)} s${chrono.running ? ' (ça avance)' : chrono.fait ? ' (fin)' : ' (arrêté)'}. Légendes en ${num ? 'numéros seuls (1 à 6, sans les noms)' : 'noms'}. Une mitochondrie peinte en coupe dans le hyaloplasme (deux membranes, nombreuses crêtes, matrice) ; à droite, une crête agrandie : membrane interne repliée, sphères pédonculées têtes vers la matrice. `;
  s += ecrites.length ? `Légendes écrites : ${ecrites.join(', ')}.` : 'Aucune légende encore.';
  if (cours) s += ` En train d’écrire : ${num ? cours.n + ' (' + cours.nom + ')' : cours.nom}.`;
  if (t >= M.lieux) s += num ? ' Lieux écrits : dans 5 formation de l’acétyl-CoA et cycle de Krebs ; sur 2 chaîne respiratoire et synthèse d’ATP ; hyaloplasme : glycolyse (hors de la mitochondrie).'
    : ' Lieux écrits : matrice → formation de l’acétyl-CoA, cycle de Krebs ; membrane interne → chaîne respiratoire, synthèse d’ATP ; hyaloplasme : glycolyse (hors de la mitochondrie).';
  return s;
}

/* ── Réglages ──────────────────────────────────────────────────────────────────────────────── */
const bool = v => v === true || v === 'true' || v === 1 || v === '1';
function params() { return CONSTRUIRE ? { legendes: S.legendes, corrige: S.corrige, ...legende() } : { legendes: S.legendes }; }
function setParameters(p) {
  if (CONSTRUIRE && 'corrige' in p) {
    S.corrige = bool(p.corrige);
    if (S.corrige) chrono.playUntil({ moment: 'corrige' }); else { remiseEtiquettes(); chrono.start(); }
    bulle($('feedback'), S.corrige ? 'Correction : regarde où va chaque étiquette.' : 'À toi : pose les étiquettes.');
    pont.noter('set_parameters', { corrige: S.corrige }); pont.emettre(); scene.sale = true;
    return;
  }
  if (p.legendes !== 'noms' && p.legendes !== 'numeros') return;
  S.legendes = p.legendes;
  chrono.running = false; chrono.jusqua = null; chrono.t = 0; chrono.fait = false; ecrit.oublier(); $('run').textContent = 'Lancer'; scene.sale = true;
  bulle($('feedback'), S.legendes === 'numeros' ? 'Légendes en numéros seuls : à toi de trouver les noms.' : 'Légendes avec les noms.');
  pont.noter('set_parameters', { legendes: S.legendes }); pont.emettre();
}

$('run').onclick = chrono.clic;
const EXPL = [
  { repere: 'membrane_externe', texte: 'La membrane externe limite la mitochondrie.' },
  { repere: 'membrane_interne', texte: 'Juste dessous, la membrane interne.' },
  { repere: 'cretes', texte: 'Elle se replie vers l’intérieur : ce sont les crêtes.' },
  { repere: 'espace_intermembranaire', texte: 'Entre les deux membranes : l’espace intermembranaire.' },
  { repere: 'matrice', texte: 'À l’intérieur : la matrice.' },
  { repere: 'medaillon', texte: 'Agrandissons une crête.' },
  { repere: 'spheres_pedonculees', texte: 'La membrane interne porte les sphères pédonculées, têtes vers la matrice.' } ];
window.Tableau.explication({ noms: EXPL, numeros: EXPL, construire: [
  { repere: 'etiquettes', texte: 'Glisse chaque étiquette au bout de sa flèche.' },
  { repere: 'zone_membranes', texte: 'En haut : les deux membranes et l’espace entre elles.' },
  { repere: 'zone_interieur', texte: 'En bas : la membrane interne et l’intérieur, la matrice.' },
  { repere: 'medaillon', texte: 'Dans la crête agrandie : les sphères pédonculées.' } ] });
const commandes = ['start', 'reset', 'pause', 'resume', 'set_time', 'set_parameters', 'play_until'];

  command_schema: {
    set_parameters: CONSTRUIRE ? { corrige: 'true | false (true : toutes les étiquettes vont à leur place)', legende_total: 'lecture seule : étiquettes à poser', legende_places: 'lecture seule : étiquettes bien posées', legende_erreurs: 'lecture seule : étiquettes lâchées loin de leur place', legende_mal: 'lecture seule : les étiquettes mal posées au moins une fois' }
      : { legendes: 'noms | numeros (numéros 1 à 6 seuls)' },

const pont = protocole({ id: config.id, commandes, config,
  texte: (CONSTRUIRE ? 'Schéma à légender : la mitochondrie sans ses noms, six étiquettes à glisser au bout des flèches (membrane externe, membrane interne, crêtes, espace intermembranaire, matrice, sphères pédonculées) ; bien posée, une étiquette devient verte et s’aimante ; corrige : toutes à leur place. ' : '') + 'L’ultrastructure de la mitochondrie en coupe : 1 membrane externe, 2 membrane interne, 3 crêtes (replis de la membrane interne), 4 espace intermembranaire, 5 matrice, 6 sphères pédonculées sur la membrane interne, têtes vers la matrice (crête agrandie à droite). Lieux : matrice → formation de l’acétyl-CoA et cycle de Krebs ; membrane interne → chaîne respiratoire et synthèse d’ATP ; hyaloplasme → glycolyse, hors de la mitochondrie.',
  etat: () => ({ simulation_status: chrono.statut(), ce_qui_se_voit: ceQuiSeVoit(), current_variant: CONSTRUIRE ? 'construire' : S.legendes, time_s: +chrono.t.toFixed(2), parameters: params(), moments: CONSTRUIRE ? MC : M }),
  progression: () => chrono.t / (CONSTRUIRE ? FIN_C : FIN),
  executer: (cmd, p) => ({ start: chrono.start, reset: chrono.reset, pause: chrono.pause, resume: chrono.resume, set_time: () => { chrono.setTime(p); scene.sale = true; },
    set_parameters: () => setParameters(p || {}), play_until: () => chrono.playUntil(p) })[cmd]?.() });
bulle($('feedback'), CONSTRUIRE ? 'La mitochondrie sans ses noms : à toi de la légender…' : 'Une mitochondrie en coupe, dans le hyaloplasme…');
setTimeout(() => { if (!chrono.pilote && !chrono.running && chrono.t === 0) chrono.start(); }, 1600);
