<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AquaLab — pollution de l’eau, au tableau</title>
  <link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css">
  <style>
    /* AquaLab — réglages propres ; le style craie vient de shared/tableau/tableau.css */
    .scene { display: grid; grid-template-columns: minmax(0, 1fr) minmax(16em, 32%); gap: 1vw; }
    .dessin { position: relative; min-height: 0; }
    .colonne { display: flex; flex-direction: column; gap: .6em; min-height: 0; }
    .colonne .panneau { position: static; max-width: none; }
    .colonne .panneau.console { flex: 1 1 auto; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: .35em; }
    .reglages { display: flex; flex-direction: column; gap: .3em; }
    .reglages .curseur { min-width: 0; }
    .reglages[hidden] { display: none; }
    .interrupteurs { display: flex; flex-wrap: wrap; gap: .35em; }
    .interrupteurs .craie-btn { font-size: .88em; padding: .15em .6em; color: var(--craie-faible); }
    .interrupteurs .craie-btn[aria-pressed="true"] { color: var(--vert); }
    .carnet { flex: 0 0 auto; }
    .carnet .lecture-table { width: 100%; font-size: .85em; }
    .carnet .lecture-table td:nth-child(2), .carnet .lecture-table th:nth-child(2) { text-align: left; }
    .carnet .vide { color: var(--craie-tres-faible); font-size: .85em; }
    @media (max-width: 720px) { .scene { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1.2fr) minmax(0, 1fr); } .colonne .panneau { font-size: .9em; } .carnet { display: none; } }
  </style>
</head>
<body>
<div class="tableau">
  <header class="titre">
    <div><small>SVT · 2 BAC · pollution de l’eau</small><h1 id="missionTitle"></h1><p class="objectif" id="missionPrompt"></p></div>
    <nav class="onglets" id="missions" aria-label="Missions"></nav>
  </header>
  <section class="scene">
    <div class="dessin"><canvas id="canvas" role="img" aria-label="Réservoir, réseau trophique ou dispositifs de restauration, dessinés à la craie"></canvas></div>
    <div class="colonne">
      <div class="panneau console" data-professor-point="prediction reglages" data-professor-label="prédiction et réglages">
        <h3 id="predictQuestion"></h3>
        <div class="choix" id="predictGrid"></div>
        <div class="reglages" id="controls"></div>
      </div>
      <div class="panneau carnet" data-professor-point="carnet" data-professor-label="carnet comparatif"><h3>Carnet comparatif <span class="legende" id="trialCount">0 essai</span></h3><div id="log"></div></div>
    </div>
  </section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="run_trial start">Lancer l’analyse</button>
    <button class="craie-btn secondaire" id="reset" data-professor-control="reset">Recommencer</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
    <button class="craie-btn secondaire" id="help" data-professor-control="reveal_hint">Un indice</button>
    <span class="lecture" id="progressText"></span>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script>
(() => {
  'use strict';
  const { Craie, fr, bulle, ecrire, onglets, curseur, glisser, appuyer, explication, listeReperes, surligner } = window.Tableau;
  // Script d'explication : le tuteur dit chaque phrase pendant que le professeur montre le repère du doigt.
  const EXPLICATION = {
    eutrophication: [
      { repere: 'apports', texte: 'Les nitrates et les phosphates arrivent au réservoir avec les engrais et les eaux usées.' },
      { repere: 'algues', texte: 'Ces nutriments font proliférer les algues : l’eau verdit, c’est l’eutrophisation.' },
      { repere: 'courbes', texte: 'Quand les algues meurent, les décomposeurs respirent et consomment le dioxygène dissous : la courbe de O₂ s’effondre.' },
      { repere: 'poissons', texte: 'Sous 3 mg/L, les poissons manquent d’oxygène : c’est l’hypoxie, et la mortalité monte.' },
      { repere: 'reglages', texte: 'Une eau chaude et peu brassée aggrave le phénomène ; compare une charge faible, moyenne et forte.' },
    ],
    biomagnification: [
      { repere: 'eau', texte: 'Le polluant est dilué dans l’eau, à une concentration très faible.' },
      { repere: 'plancton', texte: 'Le plancton l’absorbe et le stocke : c’est la bioaccumulation.' },
      { repere: 'oiseau', texte: 'À chaque maillon, un prédateur mange beaucoup de proies : la concentration augmente jusqu’à l’oiseau piscivore, c’est la biomagnification.' },
      { repere: 'barres', texte: 'L’échelle est logarithmique : le facteur de biomagnification peut dépasser mille entre l’eau et le dernier maillon.' },
      { repere: 'reglages', texte: 'Plus le polluant est persistant, moins il est éliminé par les organismes : teste une faible puis une forte persistance.' },
    ],
    remediation: [
      { repere: 'eau_polluee', texte: 'L’eau polluée arrive des champs et de la ville, chargée en nitrates et en matière organique.' },
      { repere: 'bande_vegetalisee', texte: 'La bande végétalisée retient une partie des nitrates avant le cours d’eau : c’est de la prévention.' },
      { repere: 'zone_humide', texte: 'La zone humide filtre et dégrade lentement les polluants grâce à ses plantes et à ses bactéries.' },
      { repere: 'station', texte: 'La station d’épuration traite les eaux usées : c’est le dispositif le plus efficace, mais pas suffisant seul.' },
      { repere: 'bilan', texte: 'Les barrières se multiplient : combinées, elles retirent la plus grande part de la charge et le lac retrouve O₂ et biodiversité.' },
    ],
  };
  explication(EXPLICATION);
  window.SIMULATION_CONFIG={id:'svt_ch3_aqualab_pollution_v2',title:'AquaLab — eutrophisation, biomagnification et dépollution',protocol_version:'2.1',learning_objectives:['Relier les apports en nitrates et phosphates à la prolifération algale puis à l’hypoxie','Distinguer bioaccumulation et biomagnification dans un réseau trophique','Comparer des moyens de prévention et de traitement de la pollution de l’eau'],commands:['start','reset','set_variant','set_parameters','run_trial','highlight','reveal_hint','get_state'],measurements:['chlorophyll_a_ug_l','dissolved_oxygen_mg_l','fish_survival_percent','bod_mg_l','trophic_concentration_ug_kg','pollutant_removal_percent'],variants:[{id:'eutrophication',label:'Mission 1 · Eutrophisation',objective:'Établir la chaîne causale nutriments → algues → décomposition → hypoxie.',completion:'Comparer trois charges nutritives'},{id:'biomagnification',label:'Mission 2 · Réseau trophique',objective:'Suivre un polluant persistant de l’eau jusqu’au prédateur.',completion:'Tester faible et forte persistance'},{id:'remediation',label:'Mission 3 · Restaurer le lac',objective:'Choisir et évaluer une combinaison de dispositifs de dépollution.',completion:'Comparer état initial et solution combinée'}]};
  const missions={
    eutrophication:{title:'Pourquoi les poissons manquent-ils d’oxygène ?',prompt:'Fais varier les nutriments, la température et le brassage. Suis les algues et O₂ pendant 20 jours.',need:3,q:'Une forte charge en nitrates et phosphates provoque…',answers:[['hypoxia','une prolifération puis une hypoxie'],['oxygen','une hausse durable de O₂'],['neutral','aucun changement']],hint:'Une bonne enquête change une variable, conserve les autres et compare au témoin. Compare une charge faible, moyenne et forte.'},
    biomagnification:{title:'Où se concentre le polluant persistant ?',prompt:'Injecte une faible dose dans l’eau puis suis-la à chaque niveau du réseau trophique.',need:2,q:'La concentration la plus élevée sera chez…',answers:[['bird','l’oiseau piscivore'],['water','l’eau du lac'],['plankton','le plancton']],hint:'Le polluant n’est pas éliminé par les organismes : à chaque maillon, il se concentre. Teste une faible puis une forte persistance.'},
    remediation:{title:'Peux-tu restaurer le réservoir ?',prompt:'Active les dispositifs, mesure l’abattement et compare la qualité de l’eau avant/après.',need:2,q:'La stratégie la plus robuste consiste à…',answers:[['combined','combiner prévention et traitement'],['single','utiliser un seul dispositif'],['dilute','diluer la pollution']],hint:'Mesure d’abord le témoin sans dispositif, puis combine au moins deux barrières.'}
  };
  const LEVELS=['Plancton','Petits poissons','Prédateur','Oiseau'];
  const S={id:window.SIMULATION_CONFIG.id,variant:'eutrophication',nutrients:65,temp:25,mixing:25,pesticide:.4,persistence:70,solutions:{buffer:false,wetland:false,treatment:false},prediction:null,trials:[],covered:{eutrophication:new Set(),biomagnification:new Set(),remediation:new Set()},last:null,status:'ready',actions:[],anim:null,result:null,p:0,fini:null,ouvert:performance.now(),dirty:true,pulse:null,hints:0};
  const $=id=>document.getElementById(id);
  const scene=()=>(performance.now()-S.ouvert)/1000;
  const redraw=()=>{S.dirty=true};
  const feedback=(t,kind='')=>bulle($('feedback'),t,kind==='good'?'good':kind==='warn'?'bad':'');
  function init(){bind();selectVariant('eutrophication',false);sendManifest();setTimeout(sendManifest,350);setTimeout(sendManifest,1800);requestAnimationFrame(frame)}
  function bind(){$('run').onclick=runTrial;$('reset').onclick=resetSimulation;$('help').onclick=hint}
  function hint(){S.hints++;feedback('Indice : '+missions[S.variant].hint);S.actions.push({action:'reveal_hint',variant:S.variant});emit('reveal_hint',{},'running')}
  function selectVariant(id,report=true){if(!missions[id])return;cancel();S.variant=id;S.prediction=null;S.status='ready';S.result=null;S.p=0;S.fini=null;S.ouvert=performance.now();const m=missions[id];onglets($('missions'),window.SIMULATION_CONFIG.variants.map(v=>({id:v.id,label:v.label.split('· ')[1]})),id,v=>selectVariant(v),new Set(Object.keys(S.covered).filter(k=>S.covered[k].size>=missions[k].need)));ecrire($('missionTitle'),m.title);ecrire($('missionPrompt'),m.prompt,{vitesse:60});ecrire($('predictQuestion'),m.q,{vitesse:40});renderPredictions();renderControls();feedback('Choisis une prédiction avant l’analyse.');updateProgress();redraw();if(report)emit('select_variant',{variant:id},'running')}
  function renderPredictions(){const box=$('predictGrid');box.innerHTML=missions[S.variant].answers.map(([value,label])=>`<label><input type="radio" name="prediction" value="${value}" ${S.prediction===value?'checked':''}> ${label}</label>`).join('');box.querySelectorAll('input').forEach(r=>r.onchange=()=>{S.prediction=r.value;S.actions.push({action:'predict',variant:S.variant,value:r.value});feedback('Hypothèse notée. Lance maintenant la mesure.','good');emit('predict',{value:r.value},'running')})}
  const sliders={};
  function renderControls(){const box=$('controls');box.innerHTML='';box.dataset.professorControl='set_parameters';const add=(id,key,label,min,max,step,unit,decimales)=>{const el=curseur({id,label,min,max,step,valeur:S[key],unite:unit,decimales,onchange:v=>setParameters({[key]:v},true)});sliders[key]=el;box.append(el)};
    if(S.variant==='eutrophication'){add('nutrient','nutrients','Charge N + P',5,100,5,'%');add('temp','temp','Température',10,35,1,'°C');add('mix','mixing','Brassage de l’eau',0,100,5,'%')}
    else if(S.variant==='biomagnification'){add('pesticide','pesticide','Pesticide dans l’eau',.05,2,.05,'µg/L',2);add('persistence','persistence','Persistance',10,100,5,'%')}
    else{const w=document.createElement('div');w.innerHTML=`<span class="legende">Dispositifs actifs</span><div class="interrupteurs">${[['buffer','Bande végétalisée'],['wetland','Zone humide'],['treatment','Station d’épuration']].map(([k,l])=>`<button class="craie-btn" data-solution="${k}" aria-pressed="${S.solutions[k]}">${l}</button>`).join('')}</div>`;box.append(w);w.querySelectorAll('[data-solution]').forEach(b=>b.onclick=()=>toggleSolution(b.dataset.solution,true))}}
  function setParameters(p,user=false){const map={nutrient_load_percent:'nutrients',temperature_c:'temp',water_mixing_percent:'mixing',pesticide_ug_l:'pesticide',pollutant_persistence_percent:'persistence'};Object.keys(map).forEach(k=>{if(k in p)p[map[k]]=p[k]});if('nutrients'in p)S.nutrients=clamp(+p.nutrients,5,100);if('temp'in p)S.temp=clamp(+p.temp,10,35);if('mixing'in p)S.mixing=clamp(+p.mixing,0,100);if('pesticide'in p)S.pesticide=clamp(+p.pesticide,.05,2);if('persistence'in p)S.persistence=clamp(+p.persistence,10,100);['vegetated_buffer','constructed_wetland','wastewater_treatment'].forEach((k,i)=>{if(k in p)S.solutions[['buffer','wetland','treatment'][i]]=!!p[k]});syncControls();redraw();if(user){S.actions.push({action:'change_parameters',parameters:{...p}});emit('change_parameters',p,'running')}}
  function syncControls(){Object.entries({nutrients:S.nutrients,temp:S.temp,mixing:S.mixing,pesticide:S.pesticide,persistence:S.persistence}).forEach(([k,v])=>{if(sliders[k]&&sliders[k].isConnected)sliders[k].maj(v)});document.querySelectorAll('[data-solution]').forEach(b=>b.setAttribute('aria-pressed',String(S.solutions[b.dataset.solution])))}
  function toggleSolution(key,user=false){S.solutions[key]=!S.solutions[key];syncControls();redraw();if(user){S.actions.push({action:'toggle_solution',solution:key,active:S.solutions[key]});emit('change_parameters',{[key]:S.solutions[key]},'running')}}
  function eutrophicationModel(){const warmth=.55+.7*Math.exp(-Math.pow((S.temp-27)/9,2)),load=S.nutrients/100,mix=S.mixing/100;const chlorophyll=clamp(4+112*load*warmth*(1-.35*mix),3,125);const bod=clamp(1.6+chlorophyll*.082,1.5,12);const oxygen=clamp(10.4-bod*.62-(S.temp-18)*.105+mix*2.5,.6,12);const survival=clamp((oxygen-1.2)/5.5*100,0,100);return{chlorophyll_a_ug_l:round(chlorophyll,1),dissolved_oxygen_mg_l:round(oxygen,1),fish_survival_percent:Math.round(survival),bod_mg_l:round(bod,1),state:oxygen<3?'hypoxie sévère':oxygen<5?'stress respiratoire':'oxygénation compatible avec la vie'}}
  function foodWebModel(){const factor=2.2+S.persistence/24,water=S.pesticide;const c=[water*factor,water*factor*3.1,water*factor*3.1*3.4,water*factor*3.1*3.4*2.5];return{water_ug_l:round(water,2),trophic_concentration_ug_kg:c.map(v=>round(v,1)),biomagnification_factor:round(c[3]/water,0),risk:c[3]>120?'élevé':c[3]>35?'modéré':'faible'}}
  function remediationModel(){const active=Object.keys(S.solutions).filter(k=>S.solutions[k]);const efficiencies={buffer:.32,wetland:.47,treatment:.68};let remaining=1;active.forEach(k=>remaining*=1-efficiencies[k]);const removal=(1-remaining)*100,nitrate=18*remaining,oxygen=clamp(3.1+removal*.068,3.1,9.4),biodiversity=clamp(28+removal*.77,28,96);return{active_solutions:active,pollutant_removal_percent:Math.round(removal),nitrate_out_mg_l:round(nitrate,1),dissolved_oxygen_mg_l:round(oxygen,1),biodiversity_index:Math.round(biodiversity),state:active.length>=2?'restauration multi-barrières':active.length===1?'amélioration partielle':'témoin pollué'}}
  function runTrial(){if(!S.prediction){feedback('Fais une prédiction avant de mesurer.','warn');return}cancel();S.status='running';$('run').disabled=true;S.result=S.variant==='eutrophication'?eutrophicationModel():S.variant==='biomagnification'?foodWebModel():remediationModel();S.p=0;S.fini=null;S.anim=performance.now();redraw();emit('run_trial_started',{variables:variables()},'running')}
  function finishTrial(r){const trial={n:S.trials.length+1,variant:S.variant,variables:variables(),measurements:r,prediction:S.prediction};S.last=trial;S.trials.push(trial);S.actions.push({action:'run_trial',variant:S.variant,variables:trial.variables});const key=S.variant==='eutrophication'?(S.nutrients<35?'faible':S.nutrients>70?'forte':'moyenne'):S.variant==='biomagnification'?(S.persistence<50?'faible':'forte'):r.active_solutions.length===0?'temoin':r.active_solutions.length>=2?'combinee':'unique';S.covered[S.variant].add(key);const correct=(S.variant==='eutrophication'&&S.prediction==='hypoxia')||(S.variant==='biomagnification'&&S.prediction==='bird')||(S.variant==='remediation'&&S.prediction==='combined');feedback(correct?'Les mesures confirment ton hypothèse. Compare maintenant avec une autre condition.':'Les données invitent à corriger l’hypothèse : observe le résultat clé.',correct?'good':'warn');S.fini=scene();renderLog();updateProgress();const done=S.covered[S.variant].size>=missions[S.variant].need;S.status=done?'finished':'running';$('run').disabled=false;redraw();emit('trial_completed',{trial,mission_coverage:[...S.covered[S.variant]],scientific_observation:observation(r),mission_complete:done},S.status);if(done)setTimeout(()=>feedback('Mission accomplie — explique maintenant la chaîne causale.','good'),1800)}
  function observation(r){if(S.variant==='eutrophication')return r.dissolved_oxygen_mg_l<5.5?'L’excès de nutriments stimule les algues ; leur décomposition augmente la DBO et consomme O₂.':'Le faible apport nutritif et le brassage limitent l’hypoxie.';if(S.variant==='biomagnification')return `Le polluant persistant est peu dilué par l’organisme et sa concentration augmente à chaque transfert trophique (×${r.biomagnification_factor}).`;return r.active_solutions.length>=2?'Les barrières complémentaires agissent sur plusieurs sources et restaurent progressivement O₂ et biodiversité.':'Un dispositif isolé laisse une fraction importante de la charge polluante.'}
  function metrics(r,p){if(S.variant==='eutrophication')return[['Chlorophylle a',r.chlorophyll_a_ug_l*p,'µg/L'],['O₂ dissous',10.4+(r.dissolved_oxygen_mg_l-10.4)*p,'mg/L'],['Survie des poissons',r.fish_survival_percent*p,'%'],['DBO',r.bod_mg_l*p,'mg/L']];if(S.variant==='biomagnification'){const v=r.trophic_concentration_ug_kg;return[['Dans l’eau',r.water_ug_l*p,'µg/L'],['Plancton',v[0]*p,'µg/kg'],['Prédateur',v[2]*p,'µg/kg'],['Oiseau',v[3]*p,'µg/kg']]}return[['Abattement',r.pollutant_removal_percent*p,'%'],['Nitrates en sortie',r.nitrate_out_mg_l,'mg/L'],['O₂ récupéré',r.dissolved_oxygen_mg_l,'mg/L'],['Biodiversité',r.biodiversity_index*p,'/ 100']]}
  const fmt=v=>Math.abs(v)<10?fr(v,1):String(Math.round(v));
  function highlightLevel(level){if(S.variant!=='biomagnification'||!S.last)return;S.pulse={level,at:performance.now()};redraw();feedback(`Niveau ${level} (${LEVELS[level-1]}) : ${S.last.measurements.trophic_concentration_ug_kg[level-1]} µg/kg. La concentration augmente avec les transferts trophiques.`);emit('inspect_trophic_level',{level,concentration_ug_kg:S.last.measurements.trophic_concentration_ug_kg[level-1]},'running')}
  function variables(){return{nutrient_load_percent:S.nutrients,temperature_c:S.temp,water_mixing_percent:S.mixing,pesticide_ug_l:S.pesticide,pollutant_persistence_percent:S.persistence,vegetated_buffer:S.solutions.buffer,constructed_wetland:S.solutions.wetland,wastewater_treatment:S.solutions.treatment}}
  function renderLog(){const rows=S.trials.slice(-4).reverse();$('trialCount').textContent=S.trials.length+' essai'+(S.trials.length>1?'s':'');$('log').innerHTML=rows.length?`<table class="lecture-table"><thead><tr><th>#</th><th>Mission</th><th>Condition</th><th>Résultat</th></tr></thead><tbody>${rows.map(t=>{let condition,result;if(t.variant==='eutrophication'){condition=t.variables.nutrient_load_percent+' % N+P';result=t.measurements.dissolved_oxygen_mg_l+' mg/L O₂'}else if(t.variant==='biomagnification'){condition=t.variables.pollutant_persistence_percent+' % pers.';result='×'+t.measurements.biomagnification_factor}else{condition=t.measurements.active_solutions.length+' dispositif(s)';result=t.measurements.pollutant_removal_percent+' % retiré'}return `<tr><td>${t.n}</td><td>${t.variant==='eutrophication'?'Eutroph.':t.variant==='biomagnification'?'Trophique':'Restauration'}</td><td>${condition}</td><td><b>${result}</b></td></tr>`}).join('')}</tbody></table>`:'<p class="vide">Les mesures apparaîtront ici.</p>'}
  function updateProgress(){const n=S.covered[S.variant].size,need=missions[S.variant].need;$('progressText').textContent='preuves '+n+' / '+need}
  function resetSimulation(){cancel();S.trials=[];S.covered={eutrophication:new Set(),biomagnification:new Set(),remediation:new Set()};S.nutrients=65;S.temp=25;S.mixing=25;S.pesticide=.4;S.persistence=70;S.solutions={buffer:false,wetland:false,treatment:false};S.last=null;S.actions.push({action:'reset'});renderLog();selectVariant(S.variant,false);emit('reset',{},'running')}
  function semanticState(status){return{simulation_status:status||S.status,active_mission:S.variant,current_variant:S.variant,mission_title:missions[S.variant].title,student_prediction:S.prediction,variables:variables(),measurements:S.last&&S.last.variant===S.variant?S.last.measurements:null,mission_coverage:[...S.covered[S.variant]],trial_history:S.trials.slice(-8),scientific_observation:S.last&&S.last.variant===S.variant?observation(S.last.measurements):null,hints_used:S.hints,model_limits:'Modèle pédagogique causal et valeurs indicatives ; il ne remplace pas une modélisation hydrodynamique de terrain.'}}
  function objectiveProgress(){return Math.min(1,(S.covered.eutrophication.size/3+S.covered.biomagnification.size/2+S.covered.remediation.size/2)/3)}
  function emit(action,payload,status){window.parent.postMessage({type:'simulation_state',simulation_id:S.id,student_actions:[...S.actions.slice(-12),{action,...payload}],current_state:semanticState(status),objective_progress:objectiveProgress(),timestamp:new Date().toISOString()},'*')}
  function sendManifest(){window.__SIMULATION_MANIFEST_SENT__=true;window.parent.postMessage({type:'simulation_manifest',simulation_id:S.id,capabilities:{commands:window.SIMULATION_CONFIG.commands,globals:['executeAICommand','selectVariant','runTrial','resetSimulation','getSimulationState'],config:window.SIMULATION_CONFIG,controls:{nutrient_load_percent:{type:'range',min:5,max:100,step:5,unit:'%'},temperature_c:{type:'range',min:10,max:35,step:1,unit:'°C'},water_mixing_percent:{type:'range',min:0,max:100,step:5,unit:'%'},pesticide_ug_l:{type:'range',min:.05,max:2,step:.05,unit:'µg/L'},pollutant_persistence_percent:{type:'range',min:10,max:100,step:5,unit:'%'},vegetated_buffer:{type:'boolean'},constructed_wetland:{type:'boolean'},wastewater_treatment:{type:'boolean'}},command_schema:{set_variant:{variant_id:{type:'enum',values:['eutrophication','biomagnification','remediation']}},set_parameters:{nutrient_load_percent:'number 5..100',temperature_c:'number 10..35',water_mixing_percent:'number 0..100',pesticide_ug_l:'number 0.05..2',pollutant_persistence_percent:'number 10..100',vegetated_buffer:'boolean',constructed_wetland:'boolean',wastewater_treatment:'boolean'},run_trial:{},highlight:{target:{type:'enum',values:['nutrient','mix','pesticide','buffer','wetland','treatment','level1','level2','level3','level4'].concat(Object.keys(listeReperes()))}},reveal_hint:{},reset:{}},reperes:listeReperes(),explication:EXPLICATION,state_contract:{variables:'réglages réellement utilisés',measurements:'mesures calculées du dernier essai',student_prediction:'hypothèse choisie avant acquisition',mission_coverage:'conditions déjà comparées',trial_history:'essais disponibles pour le raisonnement comparatif',scientific_observation:'relation causale produite par le modèle'}},page_text:'Laboratoire d’investigation dessiné au tableau : eutrophisation d’un réservoir (algues, O₂, DBO sur 20 jours), biomagnification d’un polluant persistant le long d’un réseau trophique, restauration d’un lac par bande végétalisée, zone humide et station d’épuration. L’élève prédit, règle, mesure et compare.'},'*')}
  function cancel(){S.anim=null;$('run').disabled=false}
  function clamp(n,a,b){return Math.max(a,Math.min(b,n))}function round(n,d=1){const p=10**d;return Math.round(n*p)/p}

  // ── Dessin à la craie (repère logique 760 × 380) ───────────────────────
  const canvas=$('canvas'),craie=new Craie(canvas,{onresize:redraw});const geom={s:1,ox:0,oy:0};
  const toLogical=(x,y)=>[(x-geom.ox)/geom.s,(y-geom.oy)/geom.s];
  const NODES=[[90,'eau',null],[240,'plancton',1],[390,'petits poissons',2],[540,'prédateur',3],[690,'oiseau',4]];
  function poisson(x,y,w,col){craie.trait([[x,y],[x+w*.4,y-w*.22],[x+w*.75,y],[x+w,y-w*.2],[x+w,y+w*.2],[x+w*.75,y],[x+w*.4,y+w*.22],[x,y]],{couleur:col,largeur:1.6,duree:.12})}
  function drawEutrophication(){const r=S.result,p=S.p;
    craie.trait([[40,120],[70,300],[330,300],[360,120]],{couleur:'blanc',largeur:2.6}).ligne(40,150,360,150,{couleur:'cyan',largeur:2});craie.texte('réservoir',200,112,{couleur:'faible',taille:14,align:'center'});
    craie.fleche(10,135,48,140,{couleur:'orange',largeur:2}).texte('N + P',14,125,{couleur:'orange',taille:14});
    craie.repere('reservoir',40,100,320,205,'réservoir').repere('apports',4,108,52,42,'apports N + P').repere('algues',70,152,240,70,'algues').repere('poissons',110,225,200,60,'poissons').repere('sonde_o2',298,160,52,32,'sonde O₂').repere('courbes',400,70,350,190,'courbes sur 20 jours');
    craie.texte(`${S.nutrients} % · ${S.temp} °C · brassage ${S.mixing} %`,200,335,{couleur:'faible',taille:13,align:'center'});
    craie.direct(()=>{const n=Math.round((r?r.chlorophyll_a_ug_l*p:S.nutrients*.3)/4);for(let i=0;i<n;i++){const x=75+(i*53)%240,y=160+(i*31)%60;craie.trait([[x,y],[x+6,y-5],[x+11,y+2],[x+5,y+6],[x,y]],{couleur:'vert',largeur:1.4,tremble:.4})}
      const survival=r?r.fish_survival_percent*p:100;[[120,250],[220,270],[280,235]].forEach(([x,y],i)=>{const alive=survival>=(i+1)*30;poisson(x,y,30,alive?'cyan':'rouge');if(!alive)craie.ligne(x+8,y-8,x+22,y+8,{couleur:'rouge',largeur:1.2})});
      if(r){craie.rect(300,165,46,22,{couleur:'jaune',largeur:1.4,arrondi:4});craie.texte(`O₂ ${fr(10.4+(r.dissolved_oxygen_mg_l-10.4)*p,1)}`,323,181,{couleur:'jaune',taille:12,align:'center'})}});
    const gx=410,gy=250,gw=320,gh=170;craie.axe(gx,gy,gx+gw+10,gy,[[0,'0'],[.5,'10 j'],[.97,'20 j']],{taille:12}).axe(gx,gy,gx,gy-gh,[],{});craie.texte('algues',gx+gw-30,gy-gh+12,{couleur:'vert',taille:13}).texte('O₂',gx+gw-30,gy-gh+28,{couleur:'cyan',taille:13}).texte('mortalité',gx+gw-30,gy-gh+44,{couleur:'rouge',taille:13});
    if(r){craie.direct(()=>{const n=Math.max(1,Math.round(20*p));const series=[[],[],[]];for(let d=0;d<=20;d++){const bloom=r.chlorophyll_a_ug_l*(1-Math.exp(-d/4))*Math.exp(-Math.max(0,d-14)/16),o2=clamp(10.4-(bloom/r.chlorophyll_a_ug_l)*(10.4-r.dissolved_oxygen_mg_l),.5,12),mort=clamp((5-o2)*23,0,100);series[0].push(bloom/130);series[1].push(o2/12);series[2].push(mort/100)}series.forEach((s,k)=>craie.courbe(u=>{const d=u*n;const i=Math.floor(d),f=d-i,v=i>=20?s[20]:s[i]+(s[i+1]-s[i])*f;return[gx+d/20*gw,gy-v*(gh-20)]},40,{couleur:['vert','cyan','rouge'][k],largeur:2.2}))})}
    if(r&&S.fini!=null){craie.depuis(S.fini);metrics(r,1).forEach(([l,v,u],i)=>craie.texte(`${l} = ${fmt(v)} ${u}`,gx+(i%2)*165,290+Math.floor(i/2)*26,{couleur:i===1?'cyan':i===2?'jaune':'blanc',taille:14}));craie.texte(r.state,gx,350,{couleur:'violet',taille:15})}
    else if(r){craie.direct(()=>metrics(r,p).forEach(([l,v,u],i)=>craie.texte(`${l} = ${fmt(v)} ${u}`,gx+(i%2)*165,290+Math.floor(i/2)*26,{couleur:'faible',taille:14})))}}
  function drawFoodWeb(){const r=S.result,p=S.p,y=110;
    craie.texte('réseau trophique : où va le polluant ?',380,32,{couleur:'faible',taille:15,align:'center'});
    NODES.forEach(([x,label,level],i)=>{if(i)craie.fleche(NODES[i-1][0]+40,y,x-40,y,{couleur:'faible',largeur:1.6});craie.cercle(x,y,34,{couleur:level?['vert','cyan','orange','rose'][level-1]:'bleu',largeur:2});craie.texte(label,x,y+56,{couleur:'blanc',taille:13,align:'center',max:120});
      if(level===null)craie.courbe(u=>[x-22+44*u,y+4*Math.sin(u*9)],20,{couleur:'bleu',largeur:1.6});else if(level===1)for(let k=0;k<5;k++)craie.point(x-12+k*6,y+(k%2?6:-6),2,'vert');else if(level===2)poisson(x-16,y,32,'cyan');else if(level===3)poisson(x-24,y,48,'orange');else craie.trait([[x-20,y+8],[x-6,y-10],[x+6,y-2],[x+22,y-12],[x+8,y+6],[x-20,y+8]],{couleur:'rose',largeur:1.6})});
    craie.texte(`pesticide ${fr(S.pesticide,2)} µg/L · persistance ${S.persistence} %`,380,200,{couleur:'faible',taille:13,align:'center'});
    [['eau','eau du lac'],['plancton','plancton'],['petits_poissons','petits poissons'],['predateur','poisson prédateur'],['oiseau','oiseau piscivore']].forEach(([id,label],i)=>craie.repere(id,NODES[i][0]-38,y-38,76,110,label));
    craie.repere('barres',150,220,590,120,'concentrations par maillon').repere('facteur',100,350,560,24,'facteur de biomagnification');
    const base=330;craie.ligne(150,base,740,base,{couleur:'faible',largeur:1.4});craie.texte('concentration (échelle log)',150,base+22,{couleur:'faible',taille:12});
    if(r){craie.direct(()=>{const vals=r.trophic_concentration_ug_kg,max=Math.log10(Math.max(...vals)+1);vals.forEach((v,i)=>{const h=Math.log10(v*p+1)/max*100,x=NODES[i+1][0];craie.rect(x-24,base-h,48,h,{couleur:['vert','cyan','orange','rose'][i],largeur:1.8,arrondi:3,fond:['vert','cyan','orange','rose'][i],fondAlpha:.15});craie.texte(fr(v*p,1),x,base-h-8,{couleur:'blanc',taille:13,align:'center'})});
      if(S.pulse&&performance.now()-S.pulse.at<1500){const k=(performance.now()-S.pulse.at)/1500,x=NODES[S.pulse.level][0];craie.cercle(x,y,40+k*22,{couleur:'jaune',largeur:2,alpha:1-k});S.dirty=true}});
      if(S.fini!=null){craie.depuis(S.fini);craie.texte(`facteur de biomagnification ×${r.biomagnification_factor} (eau → oiseau) · risque ${r.risk}`,380,365,{couleur:'violet',taille:15,align:'center',max:600})}}}
  function drawRemediation(){const r=S.result,p=S.p,y=200,act=S.solutions;
    craie.texte('eau polluée',40,150,{couleur:'orange',taille:14}).fleche(40,165,120,165,{couleur:'orange',largeur:2.4});
    const dev=[['buffer','bande végétalisée',180,act.buffer],['wetland','zone humide',340,act.wetland],['treatment','station d’épuration',500,act.treatment]];
    dev.forEach(([k,label,x,on],i)=>{const col=on?'vert':'faible';if(k==='buffer')for(let j=0;j<7;j++)craie.trait([[x-30+j*10,y],[x-26+j*10,y-22-(j%3)*5]],{couleur:col,largeur:1.6,duree:.05});else if(k==='wetland'){craie.courbe(u=>[x-40+80*u,y+4*Math.sin(u*12)],30,{couleur:on?'cyan':'faible',largeur:1.6});for(let j=0;j<4;j++)craie.ligne(x-24+j*16,y,x-24+j*16,y-30,{couleur:col,largeur:1.6,duree:.05})}else{craie.rect(x-36,y-40,72,40,{couleur:col,largeur:2,arrondi:4});craie.cercle(x-14,y-20,8,{couleur:col,largeur:1.4});craie.cercle(x+14,y-20,8,{couleur:col,largeur:1.4})}
      craie.texte(label,x,y+24,{couleur:col,taille:13,align:'center',max:130}).texte(on?'actif':'inactif',x,y+42,{couleur:on?'vert':'tresfaible',taille:12,align:'center'});craie.fleche(x+48,165,x+112,165,{couleur:on?'cyan':'orange',largeur:2,pointille:on?[]:[5,4]})});
    craie.trait([[620,140],[640,230],[740,230],[755,140]],{couleur:'cyan',largeur:2.2}).ligne(620,165,755,165,{couleur:'cyan',largeur:1.6}).texte('lac',688,130,{couleur:'cyan',taille:14,align:'center'});
    craie.repere('eau_polluee',30,130,100,45,'eau polluée').repere('bande_vegetalisee',130,150,100,100,'bande végétalisée').repere('zone_humide',290,150,100,100,'zone humide').repere('station',455,150,100,100,'station d’épuration').repere('lac',615,120,145,120,'lac').repere('bilan',200,255,420,115,'charge restante / pollution retirée');
    const gy=345,gw=130;craie.ligne(120,gy,720,gy,{couleur:'faible',largeur:1.4});
    if(r){craie.direct(()=>{const removed=r.pollutant_removal_percent*p,remaining=100-removed;craie.rect(220,gy-remaining*.75,gw,remaining*.75,{couleur:'rouge',largeur:1.8,arrondi:3,fond:'rouge',fondAlpha:.15});craie.rect(460,gy-removed*.75,gw,removed*.75,{couleur:'vert',largeur:1.8,arrondi:3,fond:'vert',fondAlpha:.15});craie.texte(`charge restante ${Math.round(remaining)} %`,285,gy+20,{couleur:'rouge',taille:13,align:'center'}).texte(`pollution retirée ${Math.round(removed)} %`,525,gy+20,{couleur:'vert',taille:13,align:'center'})});
      if(S.fini!=null){craie.depuis(S.fini);craie.texte(`nitrates en sortie ${fr(r.nitrate_out_mg_l,1)} mg/L · O₂ ${fr(r.dissolved_oxygen_mg_l,1)} mg/L · biodiversité ${r.biodiversity_index} / 100`,380,275,{couleur:'blanc',taille:14,align:'center',max:620}).texte(r.state,380,300,{couleur:'violet',taille:15,align:'center'})}}
    else craie.texte('teste d’abord l’état initial, puis combine au moins deux solutions',380,285,{couleur:'faible',taille:14,align:'center'})}
  function draw(){const W=craie.W,H=craie.H;if(W<1||H<1)return true;craie.debut(13,scene());const c=craie.ctx,s=Math.min(W/760,H/380);geom.s=s;geom.ox=(W-760*s)/2;geom.oy=(H-380*s)/2;c.translate(geom.ox,geom.oy);c.scale(s,s);
    if(S.variant==='eutrophication')drawEutrophication();else if(S.variant==='biomagnification')drawFoodWeb();else drawRemediation();return craie.fin()}
  glisser(canvas,{toucher:(x,y)=>{if(S.variant!=='biomagnification'||!S.last)return null;const [lx,ly]=toLogical(x,y);const n=NODES.find(([nx,,level])=>level&&Math.hypot(lx-nx,ly-110)<40);return n?n[2]:null},bouger:()=>{},lacher:level=>highlightLevel(level)});
  function frame(now){if(S.anim){S.p=Math.min(1,(now-S.anim)/1300);S.dirty=true;if(S.p>=1){S.anim=null;finishTrial(S.result)}}if(S.dirty){S.dirty=false;if(!draw())S.dirty=true}requestAnimationFrame(frame)}

  window.selectVariant=selectVariant;window.runVariant=selectVariant;window.runTrial=runTrial;window.resetSimulation=resetSimulation;window.getSimulationState=()=>semanticState();
  window.executeAICommand=(command,p={})=>{appuyer(command);if(command==='set_variant')selectVariant(p.variant_id);else if(command==='start'){feedback('Commence par une prédiction, puis ne change qu’une variable.');emit('guided_start',{},'running')}else if(command==='reset')resetSimulation();else if(command==='set_parameters'||command==='setParameter')setParameters(p,true);else if(command==='run_trial'||command==='runSimulation')runTrial();else if(command==='reveal_hint')hint();else if(command==='highlight'){const t=String(p.target||'');surligner(t);const niveau={plancton:1,petits_poissons:2,predateur:3,oiseau:4}[t];if(niveau){highlightLevel(niveau);return}if(/^level[1-4]$/.test(t)){highlightLevel(Number(t.slice(5)));return}const selectors={nutrient:'#nutrient',mix:'#mix',pesticide:'#pesticide',buffer:'[data-solution="buffer"]',wetland:'[data-solution="wetland"]',treatment:'[data-solution="treatment"]'};const e=document.querySelector(p.selector||selectors[t]);if(e){const target=e.closest('.curseur')||e;target.classList.add('presse');setTimeout(()=>target.classList.remove('presse'),1500)}}else if(command==='get_state')emit('state_requested',{},S.status)};
  window.addEventListener('message',event=>{const d=event.data||{};if(d.type!=='simulation_control')return;if(d.simulation_id&&d.simulation_id!==S.id)return;if(d.guidance_text)feedback(d.guidance_text);window.executeAICommand(d.command,d.parameters||{})});
  init();
})();
