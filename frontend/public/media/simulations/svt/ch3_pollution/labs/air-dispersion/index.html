<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AtmosLab — pollution de l’air, au tableau</title>
  <link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css">
  <style>
    /* AtmosLab — réglages propres ; le style craie vient de shared/tableau/tableau.css */
    .scene { display: grid; grid-template-columns: minmax(0, 1fr) minmax(16em, 32%); gap: 1vw; }
    .dessin { position: relative; min-height: 0; }
    .colonne { display: flex; flex-direction: column; gap: .6em; min-height: 0; }
    .colonne .panneau { position: static; max-width: none; }
    .colonne .panneau.console { flex: 1 1 auto; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: .35em; }
    .reglages { display: flex; flex-direction: column; gap: .3em; }
    .reglages .curseur { min-width: 0; }
    .reglages .choix { flex-direction: row; gap: 1em; }
    .interrupteurs { display: flex; flex-wrap: wrap; gap: .35em; }
    .interrupteurs .craie-btn { font-size: .88em; padding: .15em .6em; color: var(--craie-faible); }
    .interrupteurs .craie-btn[aria-pressed="true"] { color: var(--vert); }
    .carnet { flex: 0 0 auto; }
    .carnet .lecture-table { width: 100%; font-size: .85em; }
    .carnet .lecture-table td:nth-child(2), .carnet .lecture-table th:nth-child(2) { text-align: left; }
    .carnet .vide { color: var(--craie-tres-faible); font-size: .85em; }
    @media (max-width: 720px) { .scene { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1.2fr) minmax(0, 1fr); } .colonne .panneau { font-size: .9em; } .carnet { display: none; } }
  </style>
</head>
<body>
<div class="tableau">
  <header class="titre">
    <div><small>SVT · 2 BAC · pollution de l’air</small><h1 id="missionTitle"></h1><p class="objectif" id="missionPrompt"></p></div>
    <nav class="onglets" id="missions" aria-label="Missions"></nav>
  </header>
  <section class="scene">
    <div class="dessin"><canvas id="canvas" role="img" aria-label="Ville, panache de smog, pluies acides et solutions, dessinés à la craie"></canvas></div>
    <div class="colonne">
      <div class="panneau console">
        <h3 id="predictQuestion"></h3>
        <div class="choix" id="predictGrid"></div>
        <div class="reglages" id="controls"></div>
      </div>
      <div class="panneau carnet"><h3>Carnet comparatif <span class="legende" id="trialCount">0 essai</span></h3><div id="log"></div></div>
    </div>
  </section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="run_trial start">Lancer la modélisation</button>
    <button class="craie-btn secondaire" id="reset" data-professor-control="reset">Recommencer</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
    <button class="craie-btn secondaire" id="help" data-professor-control="reveal_hint">Un indice</button>
    <span class="lecture" id="progressText"></span>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script>
(() => {'use strict';
  const { Craie, fr, bulle, ecrire, onglets, curseur, appuyer } = window.Tableau;
  window.SIMULATION_CONFIG={id:'svt_ch3_atmoslab_pollution_v2',title:'AtmosLab — dispersion, pluies acides et qualité de l’air',protocol_version:'2.1',learning_objectives:['Relier émissions et météorologie à la concentration des polluants atmosphériques','Expliquer la formation et les effets des dépôts acides','Évaluer l’efficacité combinée de mesures de réduction à la source et d’exposition'],commands:['start','reset','set_variant','set_parameters','run_trial','highlight','reveal_hint','get_state'],measurements:['pm25_ug_m3','no2_ug_m3','visibility_km','rain_ph','lake_ph','fish_hatching_percent','emission_reduction_percent'],variants:[{id:'dispersion',label:'Mission 1 · Smog urbain',objective:'Tester le rôle du vent et de l’inversion thermique sur la dispersion.',completion:'Comparer vent faible/fort et inversion'},{id:'acid_rain',label:'Mission 2 · Dépôts acides',objective:'Relier SO₂/NOₓ, transport atmosphérique, pH et effets biologiques.',completion:'Comparer émissions faibles et fortes'},{id:'solutions',label:'Mission 3 · Air respirable',objective:'Construire une stratégie multi-actions et mesurer son impact.',completion:'Comparer témoin et combinaison'}]};
  const missions={dispersion:{title:'Pourquoi le smog reste-t-il au-dessus de la ville ?',prompt:'Fais varier sources, vent et profil thermique. Mesure la concentration dans les quartiers sous le vent.',need:3,q:'La concentration au sol est maximale avec…',answers:[['inversion','vent faible + inversion'],['wind','vent fort sans inversion'],['none','zéro émission']],hint:'Compare deux essais en ne changeant qu’un paramètre : vent faible, vent fort, puis inversion thermique.'},acid_rain:{title:'Des cheminées au lac : quel trajet ?',prompt:'Règle SO₂, NOₓ, pluie et pouvoir tampon, puis mesure le pH du lac et l’éclosion.',need:2,q:'Les dépôts acides résultent surtout de…',answers:[['sox','SO₂ et NOₓ transformés dans l’air'],['co2','CO₂ seul dans la pluie'],['dust','poussières inertes']],hint:'Mesure d’abord une situation peu polluée, puis augmente fortement les émissions industrielles et routières.'},solutions:{title:'Obtiens un air durablement plus respirable',prompt:'Active plusieurs leviers, puis compare émissions, PM2.5, visibilité et exposition.',need:2,q:'La réduction la plus robuste repose sur…',answers:[['combined','plusieurs actions complémentaires'],['trees','les arbres seuls'],['shift','déplacer les cheminées']],hint:'Teste le témoin sans action, puis au moins trois leviers ensemble.'}};
  const S={id:window.SIMULATION_CONFIG.id,variant:'dispersion',traffic:70,industry:60,wind:8,inversion:false,rainfall:20,buffer:45,solutions:{transport:false,filters:false,renewables:false,greenbelt:false},prediction:null,trials:[],covered:{dispersion:new Set(),acid_rain:new Set(),solutions:new Set()},last:null,status:'ready',actions:[],anim:null,result:null,p:0,fini:null,ouvert:performance.now(),dirty:true,hints:0};
  const $=id=>document.getElementById(id);const scene=()=>(performance.now()-S.ouvert)/1000;const redraw=()=>{S.dirty=true};
  const feedback=(t,kind='')=>bulle($('feedback'),t,kind==='good'?'good':kind==='warn'?'bad':'');
  function init(){$('run').onclick=runTrial;$('reset').onclick=resetSimulation;$('help').onclick=hint;selectVariant('dispersion',false);sendManifest();setTimeout(sendManifest,350);requestAnimationFrame(frame)}
  function hint(){S.hints++;feedback('Indice : '+missions[S.variant].hint);S.actions.push({action:'reveal_hint',variant:S.variant});emit('reveal_hint',{},'running')}
  function selectVariant(id,report=true){if(!missions[id])return;cancel();S.variant=id;S.prediction=null;S.status='ready';S.result=null;S.p=0;S.fini=null;S.ouvert=performance.now();const m=missions[id];onglets($('missions'),window.SIMULATION_CONFIG.variants.map(v=>({id:v.id,label:v.label.split('· ')[1]})),id,v=>selectVariant(v),new Set(Object.keys(S.covered).filter(k=>S.covered[k].size>=missions[k].need)));ecrire($('missionTitle'),m.title);ecrire($('missionPrompt'),m.prompt,{vitesse:60});ecrire($('predictQuestion'),m.q,{vitesse:40});renderPredictions();renderControls();feedback('Choisis une prédiction avant la mesure.');updateProgress();redraw();if(report)emit('select_variant',{variant:id},'running')}
  function renderPredictions(){const box=$('predictGrid');box.innerHTML=missions[S.variant].answers.map(([value,label])=>`<label><input type="radio" name="prediction" value="${value}"> ${label}</label>`).join('');box.querySelectorAll('input').forEach(r=>r.onchange=()=>{S.prediction=r.value;S.actions.push({action:'predict',variant:S.variant,value:r.value});feedback('Hypothèse notée. Lance la modélisation.','good');emit('predict',{value:r.value},'running')})}
  const sliders={};
  function renderControls(){const box=$('controls');box.innerHTML='';box.dataset.professorControl='set_parameters';const add=(id,key,label,min,max,step,unit)=>{const el=curseur({id,label,min,max,step,valeur:S[key],unite:unit,onchange:v=>setParameters({[key]:v},true)});sliders[key]=el;box.append(el)};
    if(S.variant==='dispersion'){add('traffic','traffic','Trafic routier',0,100,5,'%');add('industry','industry','Émissions industrielles',0,100,5,'%');add('wind','wind','Vitesse du vent',0,30,1,'km/h');const w=document.createElement('div');w.innerHTML=`<span class="legende">Profil thermique</span><div class="choix"><label><input type="radio" name="inversion" value="false" ${!S.inversion?'checked':''}> normal</label><label><input type="radio" name="inversion" value="true" ${S.inversion?'checked':''}> inversion</label></div>`;box.append(w);w.querySelectorAll('input').forEach(r=>r.onchange=()=>setParameters({inversion:r.value==='true'},true))}
    else if(S.variant==='acid_rain'){add('traffic','traffic','Trafic routier',0,100,5,'%');add('industry','industry','Émissions industrielles',0,100,5,'%');add('rainfall','rainfall','Précipitations',2,50,2,'mm');add('buffer','buffer','Pouvoir tampon du sol',0,100,5,'%')}
    else{const w=document.createElement('div');w.innerHTML=`<span class="legende">Mesures actives</span><div class="interrupteurs">${[['transport','Tram + bus'],['filters','Filtres industriels'],['renewables','Renouvelables'],['greenbelt','Ceinture verte']].map(([k,l])=>`<button class="craie-btn" data-solution="${k}" aria-pressed="${S.solutions[k]}">${l}</button>`).join('')}</div>`;box.append(w);w.querySelectorAll('[data-solution]').forEach(b=>b.onclick=()=>toggleSolution(b.dataset.solution,true))}}
  function setParameters(p,user=false){const map={traffic_emissions_percent:'traffic',industrial_emissions_percent:'industry',wind_speed_kmh:'wind',temperature_inversion:'inversion',rainfall_mm:'rainfall',soil_buffering_percent:'buffer'};Object.keys(map).forEach(k=>{if(k in p)p[map[k]]=p[k]});if('traffic'in p)S.traffic=clamp(+p.traffic,0,100);if('industry'in p)S.industry=clamp(+p.industry,0,100);if('wind'in p)S.wind=clamp(+p.wind,0,30);if('inversion'in p)S.inversion=!!p.inversion;if('rainfall'in p)S.rainfall=clamp(+p.rainfall,2,50);if('buffer'in p)S.buffer=clamp(+p.buffer,0,100);['public_transport','industrial_filters','renewable_energy','green_belt'].forEach((k,i)=>{if(k in p)S.solutions[['transport','filters','renewables','greenbelt'][i]]=!!p[k]});syncControls();redraw();if(user){S.actions.push({action:'change_parameters',parameters:{...p}});emit('change_parameters',p,'running')}}
  function syncControls(){Object.entries({traffic:S.traffic,industry:S.industry,wind:S.wind,rainfall:S.rainfall,buffer:S.buffer}).forEach(([k,v])=>{if(sliders[k]&&sliders[k].isConnected)sliders[k].maj(v)});document.querySelectorAll('input[name=inversion]').forEach(r=>r.checked=(r.value==='true')===S.inversion);document.querySelectorAll('[data-solution]').forEach(b=>b.setAttribute('aria-pressed',String(S.solutions[b.dataset.solution])))}
  function toggleSolution(key,user=false){S.solutions[key]=!S.solutions[key];syncControls();redraw();if(user){S.actions.push({action:'toggle_solution',solution:key,active:S.solutions[key]});emit('change_parameters',{[key]:S.solutions[key]},'running')}}
  function dispersionModel(){const source=.58*S.traffic+.72*S.industry,dispersion=1+S.wind*.17,mult=S.inversion?2.15:.82;const pm=clamp(7+source*mult/dispersion,5,180),no2=clamp(10+(.8*S.traffic+.38*S.industry)*mult/dispersion,8,210),visibility=clamp(27-pm*.13,2,26),risk=clamp(Math.round(pm/35*100),10,300);return{pm25_ug_m3:round(pm,1),no2_ug_m3:round(no2,1),visibility_km:round(visibility,1),exposure_index:risk,plume_state:S.inversion?'polluants piégés sous l’inversion':S.wind<5?'dispersion faible':'panache dilué et transporté'}}
  function acidModel(){const precursor=(.62*S.industry+.38*S.traffic)/100,wet=.78+S.rainfall/90;const rainPH=clamp(5.6-1.65*precursor*wet,3.7,5.6),lakePH=clamp(rainPH+S.buffer*.015,3.8,7.1),hatch=clamp((lakePH-4.5)/2*100,0,100),aluminum=clamp((5.8-lakePH)*70,0,160);return{rain_ph:round(rainPH,2),lake_ph:round(lakePH,2),fish_hatching_percent:Math.round(hatch),mobilized_aluminum_relative:Math.round(aluminum),state:lakePH<5?'écosystème très acidifié':lakePH<6?'acidification biologique':'pH partiellement tamponné'}}
  function solutionModel(){const active=Object.keys(S.solutions).filter(k=>S.solutions[k]);const red={transport:.25,filters:.38,renewables:.32,greenbelt:.08};let remaining=1;active.forEach(k=>remaining*=1-red[k]);const reduction=(1-remaining)*100,pm=58*remaining*(S.solutions.greenbelt?.88:1),visibility=clamp(11+reduction*.16,11,27),exposure=clamp(pm*(S.solutions.greenbelt?.82:1),5,80);return{active_solutions:active,emission_reduction_percent:Math.round(reduction),pm25_ug_m3:round(pm,1),visibility_km:round(visibility,1),exposure_index:Math.round(exposure),state:active.length>=3?'transition cohérente':active.length?'amélioration partielle':'scénario témoin'}}
  function runTrial(){if(!S.prediction){feedback('Fais une prédiction avant la modélisation.','warn');return}cancel();S.status='running';$('run').disabled=true;S.result=S.variant==='dispersion'?dispersionModel():S.variant==='acid_rain'?acidModel():solutionModel();S.p=0;S.fini=null;S.anim=performance.now();redraw();emit('run_trial_started',{variables:variables()},'running')}
  function finishTrial(r){const trial={n:S.trials.length+1,variant:S.variant,variables:variables(),measurements:r,prediction:S.prediction};S.last=trial;S.trials.push(trial);S.actions.push({action:'run_trial',variant:S.variant,variables:trial.variables});const key=S.variant==='dispersion'?(S.inversion?'inversion':S.wind>=15?'vent_fort':'vent_faible'):S.variant==='acid_rain'?(S.industry+S.traffic>120?'fortes':'faibles'):r.active_solutions.length===0?'temoin':r.active_solutions.length>=3?'combinee':'partielle';S.covered[S.variant].add(key);const correct=(S.variant==='dispersion'&&S.prediction==='inversion')||(S.variant==='acid_rain'&&S.prediction==='sox')||(S.variant==='solutions'&&S.prediction==='combined');feedback(correct?'Les mesures confirment ton hypothèse. Compare une autre condition.':'Observe les indicateurs : le modèle ne confirme pas encore cette hypothèse.',correct?'good':'warn');S.fini=scene();renderLog();updateProgress();const done=S.covered[S.variant].size>=missions[S.variant].need;S.status=done?'finished':'running';$('run').disabled=false;redraw();emit('trial_completed',{trial,mission_coverage:[...S.covered[S.variant]],scientific_observation:observation(r),mission_complete:done},S.status);if(done)setTimeout(()=>feedback('Mission accomplie — justifie maintenant avec les mesures.','good'),1800)}
  function observation(r){if(S.variant==='dispersion')return S.inversion?'L’air chaud en altitude bloque le mélange vertical : les polluants s’accumulent près du sol.':S.wind>=10?'Le vent dilue localement le panache mais peut transporter les polluants plus loin.':'Le faible vent limite la dispersion et augmente l’exposition locale.';if(S.variant==='acid_rain')return r.lake_ph<5.5?'SO₂ et NOₓ forment des acides ; le faible pouvoir tampon abaisse le pH et réduit l’éclosion.':'Le sol tamponne une partie de l’acidité, sans supprimer les émissions responsables.';return r.active_solutions.length>=3?'Agir sur transport, industrie et énergie réduit la source ; la végétation réduit surtout l’exposition locale.':'Une action seule ne maîtrise qu’une fraction des sources.'}
  function metrics(r,p){if(S.variant==='dispersion')return[['PM2.5',r.pm25_ug_m3*p,'µg/m³'],['NO₂',r.no2_ug_m3*p,'µg/m³'],['Visibilité',r.visibility_km,'km'],['Exposition',r.exposure_index*p,'indice']];if(S.variant==='acid_rain')return[['pH pluie',7+(r.rain_ph-7)*p,''],['pH lac',7+(r.lake_ph-7)*p,''],['Éclosion',r.fish_hatching_percent*p,'%'],['Aluminium libéré',r.mobilized_aluminum_relative*p,'indice']];return[['Émissions évitées',r.emission_reduction_percent*p,'%'],['PM2.5',r.pm25_ug_m3,'µg/m³'],['Visibilité',r.visibility_km,'km'],['Exposition',r.exposure_index,'indice']]}
  const fmt=v=>Math.abs(v)<10?fr(v,1):String(Math.round(v));
  function variables(){return{traffic_emissions_percent:S.traffic,industrial_emissions_percent:S.industry,wind_speed_kmh:S.wind,temperature_inversion:S.inversion,rainfall_mm:S.rainfall,soil_buffering_percent:S.buffer,public_transport:S.solutions.transport,industrial_filters:S.solutions.filters,renewable_energy:S.solutions.renewables,green_belt:S.solutions.greenbelt}}
  function renderLog(){const rows=S.trials.slice(-4).reverse();$('trialCount').textContent=S.trials.length+' essai'+(S.trials.length>1?'s':'');$('log').innerHTML=rows.length?`<table class="lecture-table"><thead><tr><th>#</th><th>Mission</th><th>Condition</th><th>Résultat</th></tr></thead><tbody>${rows.map(t=>{let c,r;if(t.variant==='dispersion'){c=(t.variables.temperature_inversion?'inversion · ':'')+t.variables.wind_speed_kmh+' km/h';r=t.measurements.pm25_ug_m3+' µg/m³'}else if(t.variant==='acid_rain'){c=(t.variables.industrial_emissions_percent+t.variables.traffic_emissions_percent)+' % sources';r='pH '+t.measurements.lake_ph}else{c=t.measurements.active_solutions.length+' action(s)';r=t.measurements.emission_reduction_percent+' % évité'}return `<tr><td>${t.n}</td><td>${t.variant==='dispersion'?'Smog':t.variant==='acid_rain'?'Acide':'Solutions'}</td><td>${c}</td><td><b>${r}</b></td></tr>`}).join('')}</tbody></table>`:'<p class="vide">Les mesures apparaîtront ici.</p>'}
  function updateProgress(){const n=S.covered[S.variant].size,need=missions[S.variant].need;$('progressText').textContent='preuves '+n+' / '+need}
  function resetSimulation(){cancel();S.trials=[];S.covered={dispersion:new Set(),acid_rain:new Set(),solutions:new Set()};S.traffic=70;S.industry=60;S.wind=8;S.inversion=false;S.rainfall=20;S.buffer=45;S.solutions={transport:false,filters:false,renewables:false,greenbelt:false};S.last=null;S.actions.push({action:'reset'});renderLog();selectVariant(S.variant,false);emit('reset',{},'running')}
  function semanticState(status){return{simulation_status:status||S.status,active_mission:S.variant,mission_title:missions[S.variant].title,student_prediction:S.prediction,variables:variables(),measurements:S.last&&S.last.variant===S.variant?S.last.measurements:null,mission_coverage:[...S.covered[S.variant]],trial_history:S.trials.slice(-8),scientific_observation:S.last&&S.last.variant===S.variant?observation(S.last.measurements):null,hints_used:S.hints,model_limits:'Modèle pédagogique semi-quantitatif ; les valeurs illustrent les relations causales et ne constituent pas une prévision réglementaire.'}}
  function objectiveProgress(){return Math.min(1,(S.covered.dispersion.size/3+S.covered.acid_rain.size/2+S.covered.solutions.size/2)/3)}function emit(action,payload,status){window.parent.postMessage({type:'simulation_state',simulation_id:S.id,student_actions:[...S.actions.slice(-12),{action,...payload}],current_state:semanticState(status),objective_progress:objectiveProgress(),timestamp:new Date().toISOString()},'*')}
  function sendManifest(){window.__SIMULATION_MANIFEST_SENT__=true;window.parent.postMessage({type:'simulation_manifest',simulation_id:S.id,capabilities:{commands:window.SIMULATION_CONFIG.commands,globals:['executeAICommand','selectVariant','runTrial','resetSimulation','getSimulationState'],config:window.SIMULATION_CONFIG,controls:{traffic_emissions_percent:{type:'range',min:0,max:100,step:5,unit:'%'},industrial_emissions_percent:{type:'range',min:0,max:100,step:5,unit:'%'},wind_speed_kmh:{type:'range',min:0,max:30,step:1,unit:'km/h'},temperature_inversion:{type:'boolean'},rainfall_mm:{type:'range',min:2,max:50,step:2,unit:'mm'},soil_buffering_percent:{type:'range',min:0,max:100,step:5,unit:'%'},public_transport:{type:'boolean'},industrial_filters:{type:'boolean'},renewable_energy:{type:'boolean'},green_belt:{type:'boolean'}},command_schema:{set_variant:{variant_id:{type:'enum',values:['dispersion','acid_rain','solutions']}},set_parameters:{traffic_emissions_percent:'number 0..100',industrial_emissions_percent:'number 0..100',wind_speed_kmh:'number 0..30',temperature_inversion:'boolean',rainfall_mm:'number 2..50',soil_buffering_percent:'number 0..100',public_transport:'boolean',industrial_filters:'boolean',renewable_energy:'boolean',green_belt:'boolean'},run_trial:{},highlight:{target:{type:'enum',values:['traffic','industry','wind','inversion','rainfall','buffer','transport','filters','renewables','greenbelt']}},reveal_hint:{},reset:{}},state_contract:{variables:'sources, météo et solutions réellement choisies',measurements:'indicateurs calculés du dernier essai',student_prediction:'hypothèse choisie avant simulation',mission_coverage:'conditions déjà comparées',trial_history:'essais exploitables par le coach',scientific_observation:'relation causale explicitée par le modèle'}},page_text:'Laboratoire dessiné au tableau sur la dispersion du smog (cheminées, panache, vent, inversion thermique, station PM2.5), les dépôts acides (SO₂ et NOₓ → pluie → lac, pH et éclosion) et les solutions de qualité de l’air. L’élève formule une hypothèse, modifie sources et météo, puis compare des mesures.'},'*')}
  function cancel(){S.anim=null;$('run').disabled=false}function clamp(n,a,b){return Math.max(a,Math.min(b,n))}function round(n,d=1){const p=10**d;return Math.round(n*p)/p}

  // ── Dessin à la craie (repère logique 760 × 380) ───────────────────────
  const canvas=$('canvas'),craie=new Craie(canvas,{onresize:redraw});
  function ville(x0,sol,n,col='faible'){for(let i=0;i<n;i++){const w=22+(i*7)%16,h=30+(i*23)%55;craie.rect(x0+i*34,sol-h,w,h,{couleur:col,largeur:1.6,arrondi:1,duree:.08});for(let k=0;k<2;k++)craie.point(x0+i*34+6+k*9,sol-h+10,1.5,col)}}
  function cheminee(x,sol,col='blanc'){craie.rect(x,sol-90,16,90,{couleur:col,largeur:2,arrondi:2});craie.ligne(x-4,sol-90,x+20,sol-90,{couleur:col,largeur:2.4,duree:.05})}
  function drawDispersion(){const r=S.result,p=S.p,sol=250;
    craie.ligne(30,sol,730,sol,{couleur:'blanc',largeur:2.2});ville(260,sol,9);cheminee(90,sol);cheminee(140,sol);craie.texte('industrie',120,sol+20,{couleur:'faible',taille:13,align:'center'}).texte('quartiers sous le vent',420,sol+20,{couleur:'faible',taille:13,align:'center'});
    craie.fleche(560,70,560+Math.max(30,S.wind*5),70,{couleur:'cyan',largeur:2}).texte(`vent ${S.wind} km/h`,560,58,{couleur:'cyan',taille:14});
    if(S.inversion){craie.ligne(30,135,730,135,{couleur:'rouge',largeur:1.6,pointille:[8,6]});craie.texte('inversion thermique : air chaud en altitude',380,126,{couleur:'rouge',taille:13,align:'center'})}
    craie.direct(()=>{const pm=r?r.pm25_ug_m3*p:40;const haut=S.inversion?138:30,spread=.4+S.wind/20;const n=Math.round(pm/3);for(let i=0;i<n;i++){const u=(i*37%100)/100,x=108+u*(200+S.wind*14)*spread,y=S.inversion?sol-100+Math.min(0,-(u*60))+(i*13%40):sol-90-u*(120+S.wind*4)+(i*17%50)-25;if(y>haut)craie.point(x,y,2+(i%3),'faible')}
      if(S.inversion&&r)craie.courbe(u=>[108+u*560,140+10*Math.sin(u*6)],30,{couleur:'orange',largeur:1.4,pointille:[3,5]});
      if(r){craie.rect(452,sol-32,60,24,{couleur:'jaune',largeur:1.4,arrondi:4});craie.texte(`PM ${fmt(r.pm25_ug_m3*p)}`,482,sol-15,{couleur:'jaune',taille:13,align:'center'});craie.ligne(482,sol-8,482,sol,{couleur:'jaune',largeur:1.4})}});
    const gx=60,gy=360,gw=300,gh=80;craie.axe(gx,gy,gx+gw+10,gy,[[0,'source'],[.95,'loin']],{taille:12}).axe(gx,gy,gx,gy-gh,[],{});craie.texte('concentration sous le vent',gx+gw/2,gy-gh-4,{couleur:'faible',taille:13,align:'center'});
    craie.ligne(gx,gy-(35/180)*(gh-10),gx+gw,gy-(35/180)*(gh-10),{couleur:'rouge',largeur:1.2,pointille:[4,4]}).texte('seuil',gx+gw+14,gy-(35/180)*(gh-10)+4,{couleur:'rouge',taille:12});
    if(r){craie.direct(()=>{const pts=[];for(let i=0;i<18;i++){const distance=i/17,spread=.2+S.wind/18,shape=Math.exp(-Math.pow((distance-.2-spread*.2)/(spread*.42),2)),ground=(S.inversion?1.15:.65)*shape+.12*Math.exp(-distance*2);pts.push(clamp(ground*r.pm25_ug_m3/180,0,1))}const n=Math.max(1,Math.round(17*p));craie.courbe(u=>{const d=u*n,i=Math.floor(d),f=d-i,v=i>=17?pts[17]:pts[i]+(pts[i+1]-pts[i])*f;return[gx+d/17*gw,gy-v*(gh-10)]},40,{couleur:'bleu',largeur:2.2})});
      if(S.fini!=null){craie.depuis(S.fini);metrics(r,1).forEach(([l,v,u],i)=>craie.texte(`${l} = ${fmt(v)} ${u}`,420,300+i*20,{couleur:i===0?'jaune':'blanc',taille:14}));craie.texte(r.plume_state,580,372,{couleur:'violet',taille:14,align:'center',max:330})}else craie.direct(()=>metrics(r,p).forEach(([l,v,u],i)=>craie.texte(`${l} = ${fmt(v)} ${u}`,420,300+i*20,{couleur:'faible',taille:14})))}}
  function drawAcid(){const r=S.result,p=S.p,sol=240;

    craie.texte(`SO₂ · NOₓ (industrie ${S.industry} %, trafic ${S.traffic} %)`,60,sol+22,{couleur:'orange',taille:13});
    craie.fleche(135,140,260,95,{couleur:'orange',largeur:1.8,pointille:[5,4]});craie.courbe(u=>[290+170*u,80+16*Math.sin(u*Math.PI*3)],40,{couleur:'faible',largeur:2});craie.courbe(u=>[300+150*u,96+6*Math.sin(u*Math.PI*2)],20,{couleur:'faible',largeur:2});
    craie.texte('H₂SO₄ · HNO₃',375,70,{couleur:'orange',taille:14,align:'center'});
    for(let i=0;i<Math.round(S.rainfall/5)+2;i++)craie.ligne(310+i*18,110,304+i*18,135,{couleur:'cyan',largeur:1.4,duree:.03});craie.texte(`pluie ${S.rainfall} mm`,470,128,{couleur:'cyan',taille:13});

    craie.ligne(330,sol,420,200,{couleur:'blanc',largeur:2.2});craie.texte(`sol tampon ${S.buffer} %`,360,215,{couleur:'vert',taille:13,align:'center'});
    craie.direct(()=>{if(!r)return;const hatch=r.fish_hatching_percent*p;[[480,255],[560,270],[640,250]].forEach(([x,y],i)=>{const ok=hatch>=(i+1)*30;craie.trait([[x,y],[x+12,y-7],[x+22,y],[x+30,y-6],[x+30,y+6],[x+22,y],[x+12,y+7],[x,y]],{couleur:ok?'vert':'rouge',largeur:1.5});if(!ok)craie.ligne(x+8,y-8,x+22,y+8,{couleur:'rouge',largeur:1.2})});craie.texte(`pH ${fr(7+(r.lake_ph-7)*p,2)}`,690,215,{couleur:'jaune',taille:14,align:'right'})});
    const base=360,labels=['neutre','pluie normale','pluie reçue','lac','éclosion'];craie.ligne(60,base,380,base,{couleur:'faible',largeur:1.4});
    if(r){craie.direct(()=>{const vals=[7,5.6,r.rain_ph,r.lake_ph,r.fish_hatching_percent/16];vals.forEach((v,i)=>{const h=clamp(v/7*55*p,0,55),x=70+i*64;craie.rect(x,base-h,40,h,{couleur:['bleu','cyan','orange','rouge','vert'][i],largeur:1.6,arrondi:3,fond:['bleu','cyan','orange','rouge','vert'][i],fondAlpha:.15});craie.texte(labels[i],x+20,base+16,{couleur:'faible',taille:11,align:'center'})})});
      if(S.fini!=null){craie.depuis(S.fini);metrics(r,1).forEach(([l,v,u],i)=>craie.texte(`${l} = ${fmt(v)} ${u}`,420,312+i*17,{couleur:i===1?'jaune':'blanc',taille:13}));craie.texte(r.state,420,372+6,{couleur:'violet',taille:13})}else craie.direct(()=>metrics(r,p).forEach(([l,v,u],i)=>craie.texte(`${l} = ${fmt(v)} ${u}`,420,312+i*17,{couleur:'faible',taille:13})))}
    else craie.direct(()=>labels.forEach((l,i)=>craie.texte(l,90+i*64,base+16,{couleur:'tresfaible',taille:11,align:'center'})))}
  function drawSolutions(){const r=S.result,p=S.p,sol=230,act=S.solutions;
    craie.ligne(30,sol,730,sol,{couleur:'blanc',largeur:2.2});ville(300,sol,8);cheminee(90,sol);
    if(act.filters){craie.rect(84,sol-104,28,14,{couleur:'vert',largeur:1.6,arrondi:3});craie.texte('filtre',98,sol-110,{couleur:'vert',taille:12,align:'center'})}else craie.direct(()=>{for(let i=0;i<8;i++)craie.point(100+i*9,sol-100-i*7,2+(i%2),'faible')});
    if(act.transport){craie.rect(140,sol-24,70,22,{couleur:'vert',largeur:1.6,arrondi:4});craie.point(152,sol,3,'vert');craie.point(198,sol,3,'vert');craie.texte('tram',175,sol-30,{couleur:'vert',taille:12,align:'center'})}else{for(let i=0;i<3;i++)craie.rect(140+i*28,sol-14,20,12,{couleur:'faible',largeur:1.3,arrondi:3});craie.texte('voitures',175,sol-20,{couleur:'faible',taille:12,align:'center'})}
    if(act.renewables)for(let i=0;i<2;i++){const x=620+i*50;craie.ligne(x,sol,x,sol-60,{couleur:'vert',largeur:1.6});for(let k=0;k<3;k++){const a=k*Math.PI*2/3-Math.PI/2;craie.ligne(x,sol-60,x+22*Math.cos(a),sol-60+22*Math.sin(a),{couleur:'vert',largeur:1.4,duree:.05})}}else craie.texte('centrale fossile',650,sol-40,{couleur:'faible',taille:12,align:'center'});
    if(act.greenbelt)for(let i=0;i<6;i++){const x=560+i*20;craie.ligne(x,sol,x,sol-14,{couleur:'vert',largeur:1.4,duree:.04});craie.cercle(x,sol-22,9,{couleur:'vert',largeur:1.4,duree:.06})}
    craie.direct(()=>{const pm=r?r.pm25_ug_m3:58;const n=Math.round(pm/3);for(let i=0;i<n;i++)craie.point(300+(i*47)%300,sol-120+(i*29)%70,2,'faible')});
    const base=355,gx=120;craie.ligne(gx,base,700,base,{couleur:'faible',largeur:1.4});craie.texte('avant / après la stratégie',410,255,{couleur:'faible',taille:13,align:'center'});
    if(r){craie.direct(()=>{const vals=[100,100-r.emission_reduction_percent,58,r.pm25_ug_m3],labels=['ém. avant','ém. après','PM avant','PM après'];vals.forEach((v,i)=>{const h=v/100*85*p,x=gx+40+i*140;craie.rect(x,base-h,70,h,{couleur:i%2?'vert':'rouge',largeur:1.6,arrondi:3,fond:i%2?'vert':'rouge',fondAlpha:.15});craie.texte(labels[i],x+35,base+16,{couleur:'faible',taille:12,align:'center'});craie.texte(fmt(v),x+35,base-h-6,{couleur:'blanc',taille:12,align:'center'})})});
      if(S.fini!=null){craie.depuis(S.fini);craie.texte(metrics(r,1).map(([l,v,u])=>`${l} ${fmt(v)} ${u}`).join(' · '),380,280,{couleur:'blanc',taille:13,align:'center',max:640}).texte(r.state,380,300,{couleur:'violet',taille:14,align:'center'})}}}
  function draw(){const W=craie.W,H=craie.H;if(W<1||H<1)return true;craie.debut(17,scene());const c=craie.ctx,s=Math.min(W/760,H/380);c.translate((W-760*s)/2,(H-380*s)/2);c.scale(s,s);if(S.variant==='dispersion')drawDispersion();else if(S.variant==='acid_rain')drawAcid();else drawSolutions();return craie.fin()}
  function frame(now){if(S.anim){S.p=Math.min(1,(now-S.anim)/1300);S.dirty=true;if(S.p>=1){S.anim=null;finishTrial(S.result)}}if(S.dirty){S.dirty=false;if(!draw())S.dirty=true}requestAnimationFrame(frame)}
  window.selectVariant=selectVariant;window.runVariant=selectVariant;window.runTrial=runTrial;window.resetSimulation=resetSimulation;window.getSimulationState=()=>semanticState();
  window.executeAICommand=(command,p={})=>{appuyer(command);if(command==='set_variant')selectVariant(p.variant_id);else if(command==='start'){feedback('Prédit, manipule une seule variable, puis compare les mesures.');emit('guided_start',{},'running')}else if(command==='reset')resetSimulation();else if(command==='set_parameters'||command==='setParameter')setParameters(p,true);else if(command==='run_trial'||command==='runSimulation')runTrial();else if(command==='reveal_hint')hint();else if(command==='highlight'){const selectors={traffic:'#traffic',industry:'#industry',wind:'#wind',inversion:'input[name=inversion][value=true]',rainfall:'#rainfall',buffer:'#buffer',transport:'[data-solution="transport"]',filters:'[data-solution="filters"]',renewables:'[data-solution="renewables"]',greenbelt:'[data-solution="greenbelt"]'};const e=document.querySelector(p.selector||selectors[p.target]);if(e){const target=e.closest('.curseur, .choix')||e;target.classList.add('presse');setTimeout(()=>target.classList.remove('presse'),1500)}}else if(command==='get_state')emit('state_requested',{},S.status)};
  window.addEventListener('message',event=>{const d=event.data||{};if(d.type!=='simulation_control')return;if(d.simulation_id&&d.simulation_id!==S.id)return;if(d.guidance_text)feedback(d.guidance_text);window.executeAICommand(d.command,d.parameters||{})});init();
})();
