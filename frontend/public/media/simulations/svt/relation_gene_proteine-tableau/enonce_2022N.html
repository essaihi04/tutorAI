(function () {

  const Y = v => 330 - v * 5, b = (x, v, hach) => `<rect x="${x}" y="${Y(v)}" width="40" height="${v * 5}" fill="${hach ? 'url(#hach)' : '#555'}" stroke="#000"/>`;

    ${t(30, 34, 'Quantité des sous-unités des', 'font-size="17"')}${t(30, 56, 'ribosomes (UA)', 'font-size="17"')}
    ${[0, 10, 20, 30, 40, 50].map(v => `<line x1="70" y1="${Y(v)}" x2="380" y2="${Y(v)}" stroke="#999"/>` + t(56, Y(v) + 5, String(v), 'text-anchor="end" font-size="15" font-weight="700"')).join('')}

    <rect x="30" y="378" width="34" height="16" fill="#555" stroke="#000"/>${t(74, 392, 'Grandes sous-unités du ribosome', 'font-size="17"')}
    <rect x="30" y="406" width="34" height="16" fill="url(#hach)" stroke="#000"/>${t(74, 420, 'Petites sous-unités du ribosome', 'font-size="17"')}
    <rect x="300" y="436" width="100" height="32" fill="#fff" stroke="#000"/>${tc(350, 458, 'Figure (a)', 'font-size="17" font-weight="700"')}`;
  // Figure b : sous-unités libres → ribosomes sur l'ARNm de l'hémoglobine ; sain : 5 ribosomes, 5 hémoglobines ; malade : 2
  const G = (x, y) => `<circle cx="${x}" cy="${y}" r="15" fill="#ccc" stroke="#000"/>`, Pt = (x, y) => `<path d="M${x - 12} ${y - 4} h24 a12 9 0 0 1 -24 0 z" fill="#ccc" stroke="#000"/>`;
  const hb = (x, y) => `<path d="M${x} ${y} c-8 -10 6 -16 8 -6 c2 10 -12 12 -6 20 c6 6 12 -4 8 -10" fill="none" stroke="#000" stroke-width="1.6"/>`;
  const rang = (y0, n, libelle, hbN, hbLib) => `
    ${[[30, 0], [64, -6], [100, 8], [34, 34], [70, 30]].map(([x, y]) => G(x, y0 + y)).join('')}
    ${Array.from({ length: n === 5 ? 4 : 2 }, (_, i) => Pt(30 + i * 34, y0 + 78 + (i % 2) * 8)).join('')}

  const doc1 = svg(1010, 478, `<g>${figa}</g><g transform="translate(414 0)">${figb}</g>`, 'Document 1 : quantité des grandes et des petites sous-unités des ribosomes (figure a) ; synthèse de l’hémoglobine chez un individu sain et chez un individu malade (figure b)');
  window.FEUILLE = {
    sujet: 'svt/2022-normale', page: '2/6', code: 'NS 34F', style_titre: 'encadre', bareme: 'inline',

    id: 'examen-svt-2022-normale-ex1',
    titre: 'Exercice 1 (5 pts)',
    blocs: [
      { id: 'contexte', libelle: 'Introduction', texte:
        'Dans le cadre de l’étude de l’expression et de la transmission de l’information génétique, on présente les données suivantes :\n\n' +
        '**I.** L’anémie de Blackfan-Diamont est une maladie héréditaire rare, caractérisée particulièrement par un manque important en globules rouges et en hémoglobine contenue dans ces cellules. Elle est caractérisée aussi par une faiblesse musculaire et des problèmes cardiaques et respiratoires.\n\n' +
        'Afin de déterminer l’origine génétique de cette maladie, on propose les données suivantes :' },
      { id: 'donnee-1', libelle: 'Donnée 1', texte: '• **Donnée 1 :** On mesure la quantité des grandes sous-unités et celle des petites sous unités des ribosomes chez un individu sain et chez un individu malade. La figure (a) du document 1 donne les résultats obtenus. La figure (b) montre l’intervention des ribosomes au cours de la synthèse de l’hémoglobine au niveau des cellules précurseurs des globules rouges chez un individu sain et chez un individu malade.' },
      { figure: 'doc1', id: 'fig-doc1', legende: '**Document 1**', largeur: '100%', svg: doc1 },
      { question: '1', points: 1, texte: '**En vous basant** sur la figure (a) du document 1, **comparez** la quantité des petites sous unités à celle des grandes sous-unités des ribosomes chez l’individu sain puis chez l’individu malade. **Expliquez** à partir de la figure (b), le manque en hémoglobine observé chez l’individu malade.' },
