<script>
/*
 * Préparer l’examen (cours « Expression de l’information génétique », 2 Bac PC BIOF, 11 novembre 2026). Capacités RGP2, RGP10.
 * Documents des sujets nationaux redessinés à la craie et rédaction comme le barème (valeurs des corrigés officiels) :
 *   document_ldl  (2023 N, HCF) : cellules saine / malade, récepteurs LDL, puis la relation protéine – caractère maillon par maillon ;
 *   reperages     (2025 N, ALD) : quatre repérages avant d’écrire (maladie, protéine, brin donné, type de mutation) ;
 *   lignes        (paramètre sujet 2025N | 2024N | 2023N) : les lignes alignées du barème, ce qui diffère encadré en rouge ;
 *   phrase        (paramètre type) : la phrase de l’origine génétique, puis les versions à trous ;
 *   restitution   : six cartes de définitions, mot pour mot ;
 *   amelogenine   (2024 N) : le document 1 redessiné et les trois questions résolues l’une après l’autre.
 * Le vivant est peint (cellules, récepteurs, LDL, améloblastes, dents) ; la craie écrit les textes et les flèches.
 */
const { rampe, entre } = window.Etapes;
const M = window.Molecules;
const TAU = Math.PI * 2;

/* ── Outils d’écriture : taille effective, coupure des lignes, maillons fléchés ── */
const eff = (c, t) => Math.max(t, c.tailleMin && c.echelle ? c.tailleMin / c.echelle : 0);
const larg = (c, s, t) => c.largeurTexte(s, eff(c, t));
/** Coupe `s` en lignes de largeur ≤ max (taille t). */
function couper(c, s, max, t) {
  const mots = String(s).split(' '), out = []; let cur = '';
  for (const m of mots) { const e = cur ? cur + ' ' + m : m; if (cur && larg(c, e, t) > max) { out.push(cur); cur = m; } else cur = e; }
  if (cur) out.push(cur);
  return out;
}
/** Dispose des maillons à la suite, reliés par des flèches, en revenant à la ligne quand il le faut. */
function flux(c, items, x0, y0, xmax, t, dy, retrait = 14) {
  const out = []; let x = x0, y = y0;
  items.forEach((it, i) => {
    const w = larg(c, it.s, t); let f = null;
    if (i > 0 && !it.sans) { if (x + 26 + w > xmax) { y += dy; x = x0 + retrait; } f = [x + 4, x + 21]; x += 26; }
    else if (i > 0) { x += 7; if (x + w > xmax) { y += dy; x = x0 + retrait; } }
    out.push({ ...it, x, y, w, f }); x += w;
  });
  return out;
}
function boite(L, t) {
  const x0 = Math.min(...L.map(o => (o.f ? o.f[0] : o.x))), x1 = Math.max(...L.map(o => o.x + o.w));
  const y0 = Math.min(...L.map(o => o.y)) - t, y1 = Math.max(...L.map(o => o.y)) + t * .4;
  return [x0 - 4, y0 - 2, x1 - x0 + 8, y1 - y0 + 4];
}
function ecrireItem(c, k, it, t, duree) {
  if (it.f) c.fleche(it.f[0], it.y - t * .32, it.f[1], it.y - t * .32, { couleur: it.fleche || 'faible', largeur: 1.5, tete: 6, duree: .12 });
  k.T(c, it.s, it.x, it.y, { couleur: it.couleur || 'blanc', taille: t, ...(duree ? { duree } : {}) });
}
/** Un texte en morceaux de couleurs différentes : [[texte, couleur], …], écrit à la suite à partir de x. */
function morceaux(c, k, parts, x, y, t, duree = .12) {
  let px = x;
  for (const [s, coul] of parts) { k.T(c, s, px, y, { couleur: coul, taille: t, duree }); px += larg(c, s, t); }
}
const largMorceaux = (c, parts, t) => parts.reduce((w, [s]) => w + larg(c, s, t), 0);
const bord = (c, x, y, w, h, couleur, largeur = 2) => c.direct(() => c.rect(x, y, w, h, { couleur, largeur, arrondi: 6 }));

/* ── Peintures propres à cette page ── */
/** Plasma sanguin : rectangle arrondi rose pâle. */
function sang(x, x0, y0, w, h, a = 1) {
  x.save(); x.globalAlpha *= a;
  const g = x.createLinearGradient(0, y0, 0, y0 + h); g.addColorStop(0, 'rgba(254,202,202,.16)'); g.addColorStop(1, 'rgba(248,113,113,.22)');
  x.fillStyle = g; x.beginPath(); x.roundRect(x0, y0, w, h, 12); x.fill(); x.restore();
}
/** Récepteur LDL (protéine membranaire) posé en (px, py), tourné selon `ang` ; normal = coupe en U, anormal = site déformé. */
function recepteur(x, px, py, ang, normal, a = 1) {
  x.save(); x.globalAlpha *= a; x.translate(px, py); x.rotate(ang);
  const col = normal ? ['#cffafe', '#0e7490'] : ['#fed7aa', '#b45309'];
  const g = x.createLinearGradient(-9, 0, 9, 0); g.addColorStop(0, col[1]); g.addColorStop(.45, col[0]); g.addColorStop(1, col[1]);
  x.fillStyle = g; x.beginPath(); x.roundRect(-3, -12, 6, 22, 2); x.fill();
  x.strokeStyle = g; x.lineWidth = 4.5; x.lineCap = 'round'; x.beginPath();
  if (normal) { x.moveTo(-9, -25); x.quadraticCurveTo(-9, -12, 0, -12); x.quadraticCurveTo(9, -12, 9, -25); }
  else { x.moveTo(-3, -17); x.quadraticCurveTo(-6, -12, 0, -12); x.quadraticCurveTo(10, -11, 14, -15); }
  x.stroke(); x.restore();
}
const ldl = (x, px, py, a = 1, r = 6) => M.sphere(x, px, py, r, '#facc15', a);
/** Améloblastes : n cellules allongées côte à côte (cytoplasme rosé, noyau bleuté), et l’amélogénine sécrétée dessous. */
function ameloblastes(x, x0, y0, n, h, normale, a = 1) {
  x.save(); x.globalAlpha *= a;
  for (let i = 0; i < n; i++) {
    const cx = x0 + i * 18 + 9;
    const g = x.createLinearGradient(cx - 8, 0, cx + 8, 0); g.addColorStop(0, 'rgba(219,112,160,.55)'); g.addColorStop(.45, 'rgba(255,228,236,.6)'); g.addColorStop(1, 'rgba(219,112,160,.6)');
    x.fillStyle = g; x.beginPath(); x.roundRect(cx - 8, y0, 16, h, 6); x.fill();
    x.strokeStyle = 'rgba(190,70,120,.85)'; x.lineWidth = 1.2; x.stroke();
    const gn = x.createRadialGradient(cx - 2, y0 + 12, 1, cx, y0 + 14, 7); gn.addColorStop(0, 'rgba(219,234,254,.95)'); gn.addColorStop(1, 'rgba(59,130,246,.85)');
    x.fillStyle = gn; x.beginPath(); x.ellipse(cx, y0 + 14, 5, 8, 0, 0, TAU); x.fill();
  }
  for (let j = 0; j < 14; j++) {
    const px = x0 + 4 + (j * 37) % (n * 18 - 8), py = y0 + h + 5 + (j % 3) * 4;
    if (normale) M.sphere(x, px, py, 2.6, '#4ade80');
    else { x.fillStyle = j % 2 ? '#c2410c' : '#f97316'; x.beginPath(); x.ellipse(px, py, 3.2, 1.8, j, 0, TAU); x.fill(); }
  }
  x.restore();
}
/** Une dent (couronne + deux racines) ; `atteinte` : émail mince, jaune-brun, piqueté. */
function dent(x, cx, top, atteinte, a = 1) {
  x.save(); x.globalAlpha *= a;
  const p = new Path2D();
  p.moveTo(cx - 24, top + 38);
  p.bezierCurveTo(cx - 28, top + 18, cx - 24, top + 2, cx - 12, top + 2);
  p.quadraticCurveTo(cx, top + 10, cx + 12, top + 2);
  p.bezierCurveTo(cx + 24, top + 2, cx + 28, top + 18, cx + 24, top + 38);
  p.bezierCurveTo(cx + 22, top + 56, cx + 16, top + 70, cx + 11, top + 74);
  p.quadraticCurveTo(cx + 6, top + 60, cx, top + 50);
  p.quadraticCurveTo(cx - 6, top + 60, cx - 11, top + 74);
  p.bezierCurveTo(cx - 16, top + 70, cx - 22, top + 56, cx - 24, top + 38);
  p.closePath();
  const gd = x.createLinearGradient(cx - 26, 0, cx + 26, 0); gd.addColorStop(0, '#c9b894'); gd.addColorStop(.45, '#f3ead6'); gd.addColorStop(1, '#b8a47c');
  x.fillStyle = gd; x.fill(p);
  x.save(); x.clip(p);
  const ge = x.createLinearGradient(cx - 26, top, cx + 26, top + 34);
  if (!atteinte) { ge.addColorStop(0, '#ffffff'); ge.addColorStop(.5, '#e0f2fe'); ge.addColorStop(1, '#bfd3e6'); x.fillStyle = ge; x.fillRect(cx - 30, top - 2, 60, 36); x.fillStyle = 'rgba(255,255,255,.75)'; x.beginPath(); x.ellipse(cx - 11, top + 14, 4, 9, -.3, 0, TAU); x.fill(); }
  else {
    ge.addColorStop(0, '#e9c46a'); ge.addColorStop(1, '#a16207'); x.fillStyle = ge; x.beginPath(); x.moveTo(cx - 30, top - 2); x.lineTo(cx + 30, top - 2); x.lineTo(cx + 30, top + 18);
    for (let i = 0; i <= 10; i++) x.lineTo(cx + 30 - i * 6, top + 20 + (i % 2 ? 5 : -1)); x.closePath(); x.fill();
    x.fillStyle = 'rgba(92,52,10,.75)'; for (const [dx, dy, r] of [[-12, 8, 2.4], [4, 12, 2], [13, 6, 2.6], [-4, 18, 1.8], [16, 18, 1.6]]) { x.beginPath(); x.ellipse(cx + dx, top + dy, r, r * .8, 0, 0, TAU); x.fill(); }
  }
  x.restore();
  x.strokeStyle = 'rgba(120,100,70,.8)'; x.lineWidth = 1.2; x.stroke(p);
  x.restore();
}

/* ════════ Vue document_ldl (2023 N, HCF) ════════ */
const LDL_PANNEAUX = [{ cx: 195, normal: true }, { cx: 565, normal: false }];
const CEL = { cy: 202, rx: 155, ry: 50 };
const DX_REC = [-110, -66, -22, 22, 66, 110];
function surMembrane(cx, dx) {
  const dy = -CEL.ry * Math.sqrt(Math.max(0, 1 - (dx / CEL.rx) ** 2)), nx = dx / CEL.rx ** 2, ny = dy / CEL.ry ** 2, n = Math.hypot(nx, ny);
  const ang = Math.atan2(nx / n, -ny / n);
  return { px: cx + dx, py: CEL.cy + dy, ang, lx: cx + dx + Math.sin(ang) * 21, ly: CEL.cy + dy - Math.cos(ang) * 21 };
}
const MD = { deux_cellules: 3.6, ligne_saine: 7.2, ligne_malade: 10.8, relation: 12.8 };
const CHAINE_SAINE = [
  { s: 'saine :', couleur: 'vert', t0: 4.0 }, { s: 'récepteur LDL normal', t0: 4.4, sans: true }, { s: 'entrée des LDL dans la cellule', t0: 5.1 },
  { s: 'taux normal de cholestérol sanguin', t0: 5.8 }, { s: 'phénotype normal', couleur: 'vert', t0: 6.5 }];
const CHAINE_MALADE = [
  { s: 'malade :', couleur: 'rouge', t0: 7.6 }, { s: 'récepteur LDL anormal', t0: 8.0, sans: true }, { s: 'pas d’entrée des LDL', t0: 8.7 },
  { s: 'accumulation des LDL dans le sang', t0: 9.4 }, { s: 'hypercholestérolémie (phénotype malade)', couleur: 'rouge', t0: 10.1 }];
const RELATION_LDL = 'Tout changement de la protéine (récepteur LDL) change le caractère : d’où la relation protéine – caractère.';
function posLDL(P, i, t) {
  const cx = P.cx, r = surMembrane(cx, DX_REC[i]);
  const s = [cx - 90 + i * 46 + (i % 2) * 8, 112 + (i % 3) * 11];
  const u = rampe(t, .9 + .22 * i, .9);
  let px = entre(s[0], r.lx, u), py = entre(s[1], r.ly, u), dedans = 0;
  if (P.normal) {
    const v = rampe(t, 2.3 + .15 * i, .8), dest = [[cx - 95, 200], [cx - 72, 216], [cx - 48, 204], [cx + 48, 204], [cx + 72, 216], [cx + 95, 200]][i];
    px = entre(px, dest[0], v); py = entre(py, dest[1], v); dedans = v;
  } else {
    const v = rampe(t, 1.8 + .22 * i, .6); px = entre(px, s[0] + 6, v); py = entre(py, 128 + (i % 2) * 8, v);
  }
  return { px, py, dedans };
}
function dessinerLDL(c, k) {
  const t = k.t, a = rampe(t, .2, .6), T = 14, dy = 19;
  c.direct(() => {
    const x = c.ctx;
    for (const P of LDL_PANNEAUX) {
      sang(x, P.cx - 172, 56, 344, 150, a);
      M.cytoplasme(x, P.cx, CEL.cy, CEL.rx, CEL.ry, { alpha: a });
      DX_REC.forEach(dx => { const r = surMembrane(P.cx, dx); recepteur(x, r.px, r.py, r.ang, P.normal, a); });
      ldl(x, P.cx + 152, 71, a);                                   // légende
      for (let i = 0; i < 6; i++) {
        if (t < .6) continue;
        const q = posLDL(P, i, t), al = rampe(t, .6, .4);
        if (q.dedans > .5) { x.save(); x.globalAlpha = al * .8; x.strokeStyle = 'rgba(250,204,21,.7)'; x.lineWidth = 1.2; x.beginPath(); x.arc(q.px, q.py, 9, 0, TAU); x.stroke(); x.restore(); }
        ldl(x, q.px, q.py, al);
      }
      if (!P.normal) for (let i = 0; i < 7; i++) {                // d’autres LDL arrivent et s’accumulent dehors
        const al = rampe(t, 2.0 + .2 * i, .4); if (al <= 0) continue;
        ldl(x, P.cx - 120 + ((i * 53) % 250), 118 + ((i * 17) % 26), al);
      }
    }
  });
  c.texte('Document (2023 N) : l’hypercholestérolémie familiale (HCF)', 380, 24, { couleur: 'cyan', taille: 19, align: 'center' });
  if (t >= .2) {
    const [S, Ma] = LDL_PANNEAUX;
    c.repere('cellule_saine', S.cx - 155, 150, 310, 102, 'la cellule de la personne saine');
    c.repere('cellule_malade', Ma.cx - 155, 150, 310, 102, 'la cellule de la personne malade');
    const r0 = surMembrane(S.cx, DX_REC[0]), r1 = surMembrane(Ma.cx, DX_REC[0]);
    c.repere('recepteur_normal', r0.px - 16, r0.py - 32, 32, 44, 'un récepteur LDL normal');
    c.repere('recepteur_anormal', r1.px - 16, r1.py - 32, 32, 44, 'un récepteur LDL anormal');
    c.repere('ldl', Ma.cx - 128, 104, 270, 40, 'les particules LDL accumulées dans le sang');
    c.repere('ldl_legende', S.cx + 120, 60, 44, 22, 'une particule LDL');
  }
  if (k.ecrit(c, 'pan', .5)) for (const P of LDL_PANNEAUX) {
    k.T(c, P.normal ? 'personne saine' : 'personne malade (HCF)', P.cx, 48, { couleur: P.normal ? 'vert' : 'rouge', taille: 15, align: 'center', duree: .4 });
    k.T(c, 'sang', P.cx - 162, 74, { couleur: 'faible', taille: 13, duree: .2 });
    k.T(c, 'LDL', P.cx + 140, 76, { couleur: 'jaune', taille: 13, align: 'right', duree: .2 });
    k.T(c, P.normal ? 'récepteur LDL normal' : 'récepteur LDL anormal', P.cx - 162, 95, { couleur: P.normal ? 'vert' : 'rouge', taille: 13, duree: .4 });
    c.fleche(P.cx - 140, 100, P.cx - 113, 132, { couleur: 'faible', largeur: 1.3, tete: 6, duree: .12 });
    k.T(c, 'cellule', P.cx, 209, { couleur: 'faible', taille: 13, align: 'center', duree: .2 });
  }
  if (k.ecrit(c, 'res', 2.9)) {
    k.T(c, 'les LDL se fixent et entrent', LDL_PANNEAUX[0].cx, 238, { couleur: 'vert', taille: 13, align: 'center', duree: .4 });
    k.T(c, 'les LDL restent dehors', LDL_PANNEAUX[1].cx, 238, { couleur: 'rouge', taille: 13, align: 'center', duree: .4 });
  }
  const yS = 290, LS = flux(c, CHAINE_SAINE, 18, yS, 744, T, dy);
  const yM = Math.max(...LS.map(o => o.y)) + 44, LM = flux(c, CHAINE_MALADE, 18, yM, 744, T, dy);
  LS.forEach((it, i) => { if (k.ecrit(c, 's' + i, it.t0)) ecrireItem(c, k, it, T, .55); });
  if (t >= CHAINE_SAINE[0].t0) c.repere('ligne_saine', ...boite(LS, T), 'la ligne de la personne saine');
  LM.forEach((it, i) => { if (k.ecrit(c, 'm' + i, it.t0)) ecrireItem(c, k, it, T, .55); });
  if (t >= CHAINE_MALADE[0].t0) c.repere('ligne_malade', ...boite(LM, T), 'la ligne de la personne malade');
  const yR = Math.min(410, Math.max(...LM.map(o => o.y)) + 30), LR = couper(c, RELATION_LDL, 724, 15);
  const y0R = yR - (LR.length - 1) * 19;
  if (k.ecrit(c, 'rel', 11.2)) LR.forEach((l, i) => k.T(c, l, 18, y0R + i * 19, { couleur: 'jaune', taille: 15, duree: .7 }));
  if (t >= 11.2) c.repere('relation', 14, y0R - 17, Math.max(...LR.map(l => larg(c, l, 15))) + 10, 19 * LR.length + 4, 'la relation protéine – caractère');
}
function voitLDL(k) {
  const t = k.t, m = [];
  if (t >= .2) m.push('Deux cellules peintes côte à côte : à gauche celle d’une personne saine, à droite celle d’une personne malade (HCF) ; au-dessus, le sang avec des particules LDL (petites sphères jaunes) ; sur la membrane, six récepteurs LDL (protéines).');
  if (t >= .9) m.push(t < 2.3 ? 'Les LDL descendent vers les récepteurs.' : 'À gauche, les LDL se sont fixées sur les récepteurs normaux (coupes bleu clair) et entrent dans la cellule. À droite, les récepteurs anormaux (orange, déformés) ne fixent pas les LDL : elles restent dehors et s’accumulent dans le sang.');
  if (t >= 2.9) m.push('Écrit sous les cellules : « les LDL se fixent et entrent » (vert, à gauche), « les LDL restent dehors » (rouge, à droite).');
  const ecr = L => L.filter(o => t >= o.t0).map(o => o.s);
  const s = ecr(CHAINE_SAINE), ma = ecr(CHAINE_MALADE);
  if (s.length) m.push(`Ligne écrite en bas : « ${s[0]} ${s.slice(1).join(' → ')} ».`);
  if (ma.length) m.push(`Ligne écrite dessous : « ${ma[0]} ${ma.slice(1).join(' → ')} ».`);
  if (t >= 11.2) m.push(`Écrit en jaune : « ${RELATION_LDL} »`);
  return m;
}

/* ════════ Vue reperages (2025 N, ALD) ════════ */
const ENONCE = [
  { s: 'Sujet national 2025 (session normale), exercice 2 :', couleur: 'cyan' },
  { s: 'L’adrénoleucodystrophie (ALD) est une maladie héréditaire du système nerveux.' },
  { s: 'La protéine ALDP assure le transport des acides gras à longue chaîne (AGLC) dans le peroxysome, où ils sont dégradés.' },
  { s: 'Chez les malades, les AGLC s’accumulent dans le cytoplasme.' },
  { s: 'Document 2 : fragment du brin non transcrit du gène ABCD1 (triplets 147 à 152) :' },
  { s: 'allèle normal : … GTC AAC AGT GCC ATC CGT …', couleur: 'jaune' },
  { s: 'allèle muté : … GTC AAC AGA GCC ATC CGT …', couleur: 'jaune' },
];
const MR = { maladie: 4.6, proteine: 6.6, brin: 8.6, type_mutation: 10.8 };
const CASES = [
  { id: 'case_maladie', titre: '1. La maladie', t0: 3.4, l: [[['ALD (adrénoleucodystrophie),', 'blanc']], [['maladie héréditaire', 'faible']]] },
  { id: 'case_proteine', titre: '2. La protéine', t0: 5.2, l: [[['ALDP : transport des AGLC', 'blanc']], [['dans le peroxysome', 'blanc']]] },
  { id: 'case_brin', titre: '3. Le brin donné', t0: 7.2, l: [[['brin ', 'blanc'], ['NON', 'rouge'], [' transcrit', 'blanc']], [['→ ARNm : on le recopie, T devient U', 'faible']]] },
  { id: 'case_mutation', titre: '4. Le type de mutation', t0: 9.2, l: [[['substitution (triplet 149 : AGT → AGA)', 'blanc']], [['un nucléotide remplacé, pas de décalage', 'faible']]] },
];
const CX0 = 388, CW = 354, CH = 78, CY = [44, 132, 220, 308];
function disposerEnonce(c) {
  const out = []; let y = 64;
  ENONCE.forEach((p, ip) => { couper(c, p.s, 334, 14).forEach(l => { out.push({ s: l, x: 26, y, p: ip, couleur: p.couleur || 'blanc' }); y += 19; }); y += 5; });
  return out;
}
/** Position d’un passage dans l’énoncé disposé : [x, y, largeur]. */
function chercher(c, L, p, mot, re) {
  for (const l of L) { if (l.p !== p) continue; const i = re ? l.s.search(re) : l.s.indexOf(mot); if (i >= 0) return [l.x + larg(c, l.s.slice(0, i), 14), l.y, larg(c, mot, 14)]; }
  return null;
}
function dessinerReperages(c, k) {
  const t = k.t, L = disposerEnonce(c), yb = L[L.length - 1].y + 14;
