<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ce qu'il faut retenir — expression de l'information génétique</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="genetique.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Fiche de révision écrite à la craie sur une page : pour chaque partie du cours sur l’expression de l’information génétique, la définition à apprendre, les formules et le point d'attention ; deuxième page : ce que l'élève doit retravailler"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="suiv" data-professor-control="next previous start reset play_until">Ma page →</button>
    <button class="craie-btn secondaire" id="imprimer" title="Imprimer ou enregistrer en PDF">🖨️ Imprimer / PDF</button>
    <span class="lecture" id="page"></span>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="commun.js"></script>
<script src="/media/simulations/shared/tableau/imprimer.js"></script>
<script>
/*
 * « Ce qu'il faut retenir » du cours « Expression de l'information génétique » (diapositive rg_b1_bilan), adapté de
 * svt/notion_information_genetique-tableau/bilan.html. Une page : huit blocs (un par compétence C1 à C8), définition, formule, piège.
 * play_until {moment: <bloc>} écrit ce bloc et le met en lumière ; page 2 = la page de l'élève (set_parameters {lacunes, acquis, acquis_ids}).
 * Contenu : cadre de référence 2 Bac PC (SVT), RGP1 à RGP10.
 */
const { fr, bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);

const BLOCS = [
  { id: 'gene', titre: '1 · Gène, allèle, mutation', comps: ['C1'],
    def: "Gène : portion d’ADN à un locus d’un chromosome, qui détermine un caractère. Allèle : une des formes d’un gène, au même locus. Mutation : modification de la séquence des nucléotides d’un gène.",
    attention: "L’allèle n’est pas le caractère : c’est la forme du gène qui le commande." },
  { id: 'proteine', titre: '2 · Caractère et protéine', comps: ['C2'],
    def: "Protéine fonctionnelle → caractère normal ; protéine non fonctionnelle → caractère modifié (organisme, cellule, molécule). Drépanocytose : 6e acide aminé Glu → Val.",
    attention: "Lire le rôle de la protéine dans le document, ne pas réciter." },
  { id: 'arn', titre: '3 · L’ARN, intermédiaire', comps: ['C3'],
    def: "ARN : un seul brin, ribose, U à la place de T (ARNm, ARNt, ARNr). Marquage : l’ARN est fait dans le noyau puis passe au cytoplasme, où se font les protéines.",
    attention: "L’ADN ne sort jamais du noyau : c’est l’ARNm qui sort." },
  { id: 'transcription', titre: '4 · La transcription', comps: ['C4'], formules: ['A → U ; T → A ; C → G ; G → C', 'brin transcrit 3′→5′ ; ARNm 5′→3′'],
    def: "Dans le noyau, l’ARN polymérase copie un seul brin du gène, le brin transcrit, en un ARNm complémentaire.",
    attention: "Brin non transcrit donné : on recopie, T → U." },
  { id: 'code', titre: '5 · Le code génétique', comps: ['C5'], formules: ['4³ = 64 codons', 'AUG = Met ; UAA, UAG, UGA = stop'],
    def: "Codon : trois nucléotides de l’ARNm. Code universel, redondant, lu sans chevauchement.",
    attention: "On cherche le codon de l’ARNm, jamais l’anticodon." },
  { id: 'traduction', titre: '6 · La traduction', comps: ['C6'], formules: ['ADN (gène) → ARNm → protéine → caractère'],
    def: "Dans le cytoplasme, sur les ribosomes : initiation (AUG, ARNt-Met), élongation (liaisons peptidiques), terminaison (codon stop).",
    attention: "ARN polymérase = transcription ; ribosome = traduction." },
  { id: 'mutation', titre: '7 · Les mutations', comps: ['C7'],
    def: "Substitution : silencieuse, faux-sens ou non-sens (codon stop trop tôt). Délétion ou insertion d’un nucléotide : décalage du cadre de lecture.",
    attention: "Trois nucléotides perdus : un acide aminé en moins, pas de décalage." },
  { id: 'redaction', titre: '8 · Rédiger', comps: ['C8'],
    def: "Lignes alignées : triplets, brin, ARNm, acides aminés. Mutation → codon → acide aminé → protéine non fonctionnelle → maladie.",
    attention: "Nommer le nucléotide, le numéro du triplet et le brin." },
];
const STATUTS = { non_acquis: ['à reprendre', 'rouge'], partiel: ['à revoir', 'orange'], acquis: ['acquis', 'vert'] };
const AVANT = -1e9;   // instant d'un bloc déjà dit : il est écrit d'un coup
// apparu[i] : null = pas encore dit (pas écrit) ; un nombre = l'instant (s de la scène) où il commence à s'écrire.
const S = { page: 1, focus: null, lacunes: null, acquis: null, acquis_ids: null, apparu: [] };
window.__debordeBlocs = [];   // vérification : un bloc dont le texte dépasse son cadre

/* Coupe un texte en lignes qui tiennent dans `max` px (mesure sans les « _ » des indices). */
function lignes(c, texte, taille, max) {
  const ctx = c.ctx; ctx.font = `${taille}px ${window.Tableau.POLICE}`;
  const out = []; let ligne = '';
  for (const mot of String(texte).split(/\s+/)) {
    const essai = ligne ? ligne + ' ' + mot : mot;
    if (ctx.measureText(essai.replace(/_/g, '')).width > max && ligne) { out.push(ligne); ligne = mot; } else ligne = essai;
  }
  if (ligne) out.push(ligne);
  return out;
}
function paragraphe(c, texte, x, y, taille, max, o = {}, lh = 1.2) {
  for (const l of lignes(c, texte, taille, max)) { c.texte(l, x, y, { taille, ...o }); y += taille * lh; }
  return y;
}

// Trois colonnes de trois blocs, dans le cadre 760 × 420.
const COL = [{ x: 18, w: 228 }, { x: 264, w: 228 }, { x: 510, w: 228 }], HAUT = 48, HBLOC = 122;
/* Tableau large (scene.L ≥ 1000 ; 15 novembre 2026, « ce qu'il faut retenir : cases serrées, petits textes qui se
 * chevauchent ») : les blocs coulent en colonnes sur toute la largeur, chacun à sa hauteur, avec des textes plus gros
 * (le texte ne descend jamais sous 15 px à l'écran : à 1366 × 613 cela fait ~18 unités, et l'interligne suit la vraie
 * taille). On essaie 3 colonnes puis 4 et on garde la première qui tient. Sinon (L < 1000) : la grille d'origine. */
const T0 = { ti: 14, fo: 13, de: 11.5, at: 11, st: 11, lh: 1.2 };
let T = T0, POS = null, POS_L = 0;
const TM = [T0, T0];
/** Une formule plus large que le bloc passe à la ligne avant un « = » ou une « → » (au lieu d'être rétrécie sous 15 px). */
function morceauxFormule(c, f, taille, w) {
  c.ctx.font = `${taille}px ${window.Tableau.POLICE}`;
  const larg = s => c.ctx.measureText(s.replace(/_/g, '')).width + 14, out = [];
  if (larg(f) <= w) return [f];
  for (const p of f.split(/ (?=[=→] )/)) { const d = out.length - 1; if (d >= 0 && larg(out[d] + ' ' + p) <= w) out[d] += ' ' + p; else out.push(p); }
  return out;
}
function hauteurBloc(c, b, w, t) {
  let h = t.ti * 1.25;
  if (b.formules) {
    let fx = 0, rangs = 1;
    for (const f of b.formules) {
      const m = morceauxFormule(c, f, t.fo, w); c.ctx.font = `${t.fo}px ${window.Tableau.POLICE}`;
      const l = Math.min(w, Math.max(...m.map(s => c.ctx.measureText(s).width)) + 14);
      if (fx > 0 && (fx + l > w || m.length > 1)) { fx = 0; rangs++; }
      if (m.length > 1) { rangs += m.length - 1; fx = w; } else fx += l + 7;
    }
    h += rangs * (t.fo + 9) + 4;
  }
  h += lignes(c, b.def, t.de, w).length * t.de * t.lh + lignes(c, b.attention, t.at, w - 18).length * t.at * t.lh;
  return h + 12;
}
/* Les huit blocs ne tiennent pas tous sur un tableau large sans passer sous 15 px : en large, la fiche montre une
 * moitié à la fois (blocs 1 à 4, puis 5 à 8) ; la moitié affichée suit le bloc que dit la voix (focus) ou le dernier
 * écrit, et « Ma page → » passe de la 1re moitié à la 2de avant la page de l'élève. */
const MOITIES = [[0, 1, 2, 3], [4, 5, 6, 7]];
const moitieDe = i => (i >= 4 ? 1 : 0);
function moitieVue() {
  if (!POS) return null;
  const f = BLOCS.findIndex(b => b.id === S.focus);
  if (f >= 0) return (S.moitie = moitieDe(f));
  if (S.manuel) return S.moitie || 0;   // « Ma page → » a choisi la moitié : elle reste
  let dern = -1, tDern = -Infinity;
  S.apparu.forEach((a, i) => { if (a != null && a !== AVANT && a >= tDern) { tDern = a; dern = i; } });
  if (dern >= 0 && S.moitieAuto !== dern) { S.moitieAuto = dern; S.moitie = moitieDe(dern); }
  return S.moitie || 0;
}
function disposer(c, L) {
  const cle = L + ':' + (c.echelle || 1).toFixed(3);
  if (cle === POS_L) return; POS_L = cle;
  // la grille d'origine seulement si ses petites tailles restent ≥ 15 px à l'écran ; sinon le kit les agrandit et
  // les lignes, coupées à la taille nominale, se chevauchent : on passe aux blocs qui coulent (tailles réelles)
  if (L < 1000 && Math.min(T0.de, T0.at) * (c.echelle || 1) >= 15) { T = T0; POS = null; return; }
  const minimum = 15 / Math.max(.01, c.echelle || 1);       // la taille plancher, en unités du dessin
  // la plus grande taille qui tient d'abord (quatre blocs par moitié : 2, 3 ou 4 colonnes)
  const essais = [];
  for (let f = 1.8; f > .93; f -= .05) for (const n of [2, 3, 4]) essais.push([n, f]);
  // chaque moitié de la fiche prend la plus grande taille qui lui tient (TM[moitié])
  const pos = [];
  MOITIES.forEach((moitie, m) => {
    for (const [n, f] of essais) {
      const g = L >= 1000 ? 1 : 0;   // tableau étroit agrandi : on part du plancher de 15 px, pas des grandes tailles du tableau large
      const t = { ti: Math.max(21 * g, minimum * 1.1) * f, fo: Math.max(18 * g, minimum) * f, de: Math.max(19 * g, minimum) * f, at: Math.max(18 * g, minimum) * f, st: Math.max(15, minimum), lh: g ? 1.13 : 1.25 };
      const gap = 22, w = (L - 36 - (n - 1) * gap) / n;
      let ok = true, col = 0, y = HAUT + 4;
      for (const i of moitie) {
        const h = hauteurBloc(c, BLOCS[i], w, t);
        if (y + h > 416 && y > HAUT + 4) { col++; y = HAUT + 4; }
        pos[i] = { x: 18 + col * (w + gap), w, y0: y, h }; y += h + 10;
        if (col >= n || y > 426) ok = false;
      }
      TM[m] = t;
      if (ok) break;
    }
  });
  T = TM[0]; POS = pos;
  // le dernier bloc de chaque colonne descend jusqu'au bas du tableau (pas de vide sous les cases)
  const basDe = {};
  POS.forEach((p, i) => { const cle = moitieDe(i) + ':' + Math.round(p.x); if (!basDe[cle] || p.y0 > POS[basDe[cle]].y0) basDe[cle] = i; });
  for (const i of Object.values(basDe)) POS[i].h = Math.max(POS[i].h, 414 - POS[i].y0);
}
const place = i => (POS ? POS[i] : { x: COL[Math.floor(i / 3)].x, w: COL[Math.floor(i / 3)].w, y0: HAUT + (i % 3) * HBLOC, h: HBLOC });
function bloc(c, b, i) {
  const { x, w, y0, h } = place(i), enLumiere = S.focus === b.id, st = statut(b);
  const cx = x - 6, cy = y0 - 6, cw = w + 12, ch = h - 6;
  // Le cadre de lumière et l'état de l'élève apparaissent d'un coup : ils ne décalent pas l'écriture du bloc.
  c.direct(() => {
    if (enLumiere) c.rect(cx, cy, cw, ch, { couleur: 'jaune', arrondi: 10, largeur: 1.6, alpha: .7 });
    else if (st && STATUTS[st] && st !== 'acquis') c.rect(cx, cy, cw, ch, { couleur: STATUTS[st][1], arrondi: 10, largeur: 1.4, pointille: [5, 6], alpha: .8 });
    if (st === 'acquis') c.texte('✓', x + w - 10, y0 + 12, { couleur: 'vert', taille: T.st + 4 });
    else if (st && STATUTS[st]) c.texte(STATUTS[st][0], x + w, y0 + 12, { couleur: STATUTS[st][1], taille: T.st, align: 'right' });
  });
  let y = y0 + Math.round(T.ti * .9);
  c.texte(b.titre, x, y, { couleur: 'jaune', taille: T.ti, max: st ? w - 62 * T.st / 11 : w });
  y += Math.round(T.ti * 1.2);
  if (b.formules) {
    // formules encadrées, à la ligne quand la suivante ne tient plus
    let fx = x;
    for (const f of b.formules) {
      const m = morceauxFormule(c, f, T.fo, w); c.ctx.font = `${T.fo}px ${window.Tableau.POLICE}`;
      const l = Math.min(w, Math.max(...m.map(s => c.ctx.measureText(s.replace(/_/g, '')).width)) + 14);
      if (fx > x && (fx + l > x + w || m.length > 1)) { fx = x; y += T.fo + 8; }
      c.rect(fx, y - T.fo, l, T.fo + 6 + (m.length - 1) * (T.fo + 9), { couleur: 'faible', arrondi: 6, largeur: 1.2, duree: .25 });
      m.forEach((s, k) => c.texte(s, fx + 7, y + 1 + k * (T.fo + 9), { couleur: 'jaune', taille: T.fo, max: l - 10 }));
      if (m.length > 1) { y += (m.length - 1) * (T.fo + 9); fx = x + w; } else fx += l + 7;
    }
    y += T.fo + 7;
  }
  y = paragraphe(c, b.def, x, y, T.de, w, { couleur: 'blanc' }, T.lh);
  c.texte('⚠', x, y, { couleur: 'orange', taille: T.at });
  y = paragraphe(c, b.attention, x + T.at * 1.3, y, T.at, w - T.at * 1.3, { couleur: 'orange', alpha: .92 }, T.lh);
  if (y - T.at > cy + ch && !window.__debordeBlocs.includes(b.id)) window.__debordeBlocs.push(b.id);
  c.repere(b.id, cx, cy, cw, ch, b.titre.replace(/^\d+ · /, ''));
}

function dessinerFiche(c) {
  disposer(c, scene.L);
  if (S.apparu.some(a => a === AVANT)) c.cur = AVANT;   // la voix est déjà passée : le titre est écrit d'un coup
  const xd = (POS ? scene.L : 760) - 18;
  c.texte('Ce qu’il faut retenir', 18, 30, { couleur: 'jaune', taille: POS ? 26 : 22 });
  const mv = moitieVue();
  if (mv != null) T = TM[mv];
  c.direct(() => c.texte(mv == null ? 'définition · formule · ⚠ piège' : `${mv ? 'blocs 5 à 8 (2/2)' : 'blocs 1 à 4 (1/2)'} · définition · formule · ⚠ piège`, xd, 28, { couleur: 'faible', taille: POS ? 16 : 12, align: 'right' }));
  c.ligne(18, 38, xd, 38, { couleur: 'tresfaible', largeur: 1.4 });
  const debut = c.cur;
  let fin = c.cur;
  BLOCS.forEach((b, i) => {
    if (S.apparu[i] == null) return;   // pas encore dit : il attend son moment
    if (mv != null && moitieDe(i) !== mv) return;   // tableau large : l'autre moitié de la fiche
    // déjà dit : écrit d'un coup ; dit maintenant : s'écrit dès cet instant (le premier attend la fin du titre)
    c.cur = S.apparu[i] === AVANT ? AVANT : Math.max(debut, S.apparu[i]); bloc(c, b, i); fin = Math.max(fin, c.cur);
  });
  c.cur = fin;
}

function dessinerLacunes(c) {
  const lg = scene.L >= 1000, W = lg ? scene.L - 60 : 700, K = lg ? 1.4 : 1, k = v => Math.round(v * K);
  c.texte('Ta page : ce qu’il te reste à retravailler', 22, 30, { couleur: 'jaune', taille: k(22) });
  c.ligne(22, 38, lg ? scene.L - 20 : 740, 38, { couleur: 'tresfaible', largeur: 1.4 });
  let y = 70;
  const lac = S.lacunes, acq = S.acquis || [];
  if (!lac) {
    c.texte('Pas encore de réponses notées.', 22, y, { couleur: 'faible', taille: k(18) }); y += k(28);
    paragraphe(c, 'Réponds aux questions du cours : ton bilan par compétence s’écrira ici, et le professeur y reviendra en mode libre.', 22, y, k(16), W, { couleur: 'faible' });
    return;
  }
  if (!lac.length) {
    c.texte('✓ Toutes les compétences évaluées sont acquises. Bravo !', 22, y, { couleur: 'vert', taille: k(20) }); y += k(30);
  } else {
    c.texte('À reprendre en mode libre, avec le professeur :', 22, y, { couleur: 'orange', taille: k(15) }); y += k(24);
    const y0 = y - 18;
    for (const l of lac.slice(0, 5)) {
      const [etiq, coul] = STATUTS[l.statut] || STATUTS.non_acquis;
      c.texte(l.statut === 'partiel' ? '⟳' : '✗', 22, y, { couleur: coul, taille: k(17) });
      y = paragraphe(c, `${l.label} — ${etiq}`, 42, y, k(16), W - 10, { couleur: 'blanc' });
      if (l.reprendre_avec && l.reprendre_avec.length) y = paragraphe(c, 'reprendre avec ' + l.reprendre_avec.join(', puis '), 42, y, k(13), W - 10, { couleur: coul, alpha: .85 });
      y += 4;
    }
    if (lac.length > 5) { c.texte(`… et ${lac.length - 5} autre(s)`, 42, y, { couleur: 'faible', taille: k(13) }); y += k(18); }
    c.repere('lacunes', 18, y0, W + 20, y - y0, 'ce qu’il reste à retravailler');
  }
  if (acq.length) {
    y += 6; c.texte('✓ Acquis', 22, y, { couleur: 'vert', taille: k(15) }); y += k(20);
    paragraphe(c, acq.join(' · '), 22, y, k(14), W, { couleur: 'vert', alpha: .85 });
  }
}

const canvas = $('canvas');
const scene = window.GenetiqueTableau.Scene(canvas, (c) => { scene.cadre(41 + S.page); if (S.page === 1) dessinerFiche(c); else dessinerLacunes(c); return c.fin(); }, { large: true });
const maintenant = () => (performance.now() - scene.ouvert) / 1000;

/* Page n ; `focus` = le bloc que la voix dit maintenant ; `tout` = toute la fiche d'un coup. */
function aller(n, par, focus, tout) {
  n = n === 2 ? 2 : 1;
  if (par === 'start' || par === 'reset') { scene.reecrire(); S.apparu = []; }   // rejouer : la fiche se réécrit depuis le début
  else if (n !== S.page) {
    // changement de page : on repart d'une page vierge, mais les blocs déjà dits restent écrits (d'un coup)
    scene.reecrire(); S.apparu = S.apparu.map(a => (a == null ? null : AVANT));
  }
  if (n === 1) {
    const k = focus ? BLOCS.findIndex(b => b.id === focus) : -1;
    if (tout) BLOCS.forEach((b, i) => { if (S.apparu[i] == null) S.apparu[i] = AVANT; });
    if (k >= 0) {
      for (let i = 0; i < k; i++) if (S.apparu[i] == null) S.apparu[i] = AVANT;   // sautés : écrits d'un coup
      if (S.apparu[k] == null) S.apparu[k] = par === 'start' || par === 'reset' ? 0 : maintenant();
    }
  }
  if (focus) S.manuel = false;   // la voix reprend la main sur la moitié affichée
  S.page = n; S.focus = n === 1 ? (focus || null) : null; scene.sale = true;
  $('page').textContent = `${n} / 2`; $('suiv').textContent = n === 1 ? 'Ma page →' : '← La fiche';
  bulle($('feedback'), n === 2 ? 'Ta page à toi.' : focus ? BLOCS.find(b => b.id === focus).titre.replace(/^\d+ · /, '') : 'La fiche du chapitre.');
  pont.noter(par || 'page', { page: n, moment: focus || (n === 2 ? 'lacunes' : 'fiche') }); pont.emettre();
}
function statut(b) {
  if (!S.lacunes) return null;
  const lac = S.lacunes.filter(l => b.comps.includes(l.id));
  if (lac.some(l => l.statut === 'non_acquis')) return 'non_acquis';
  if (lac.length) return 'partiel';
  return (S.acquis_ids || []).some(a => b.comps.includes(a)) ? 'acquis' : null;
}
function moments() { const m = { fiche: 1 }; BLOCS.forEach(b => { m[b.id] = 1; }); m.lacunes = 2; return m; }
function playUntil(p) {
  const nom = p.moment in moments() ? p.moment : null;
  if (!nom && !Number.isFinite(+p.time_s)) return;
  if (nom === 'lacunes' || (!nom && +p.time_s === 2)) aller(2, 'play_until');
  else if (nom === 'fiche' || !nom) aller(1, 'play_until', null, true);
  else aller(1, 'play_until', nom);
}
function setParameters(p) {
  if (Array.isArray(p.lacunes)) S.lacunes = p.lacunes.map(l => ({ id: String(l.id || ''), label: String(l.label || l.id || ''), statut: String(l.statut || 'non_acquis'), reprendre_avec: Array.isArray(l.reprendre_avec) ? l.reprendre_avec.map(String) : [] }));
  if (Array.isArray(p.acquis)) S.acquis = p.acquis.map(String);
  if (Array.isArray(p.acquis_ids)) S.acquis_ids = p.acquis_ids.map(String);
  scene.sale = true; pont.noter('set_parameters', { lacunes: (S.lacunes || []).length, acquis: (S.acquis || []).length }); pont.emettre();
}
function ceQuiSeVoit() {
  if (S.page === 2) return `Page 2/2, la page de l'élève : ${!S.lacunes ? 'pas encore de bilan' : S.lacunes.length ? 'à retravailler : ' + S.lacunes.map(l => l.label).join(' ; ') : 'toutes les compétences évaluées sont acquises'}.`;
  const f = S.focus && BLOCS.find(b => b.id === S.focus);
  const ecrits = BLOCS.filter((b, i) => S.apparu[i] != null).length;

}

  if (S.page === 1 && POS && moitieVue() === 0) { S.moitie = 1; S.focus = null; S.manuel = true; scene.sale = true; return; }

});
