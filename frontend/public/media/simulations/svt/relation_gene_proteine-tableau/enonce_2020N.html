<script>
(function () {

  const f = (x, y, s, o = '') => t(x, y, s, `font-size="14" font-weight="700" ${o}`);
  const doc1 = svg(860, 300, `
    <rect x="2" y="2" width="560" height="240" fill="none" stroke="#000" stroke-dasharray="4 3"/>
    <rect x="566" y="2" width="292" height="240" fill="none" stroke="#000" stroke-dasharray="4 3"/>
    ${t(492, 24, 'Figure a', 'font-size="15"')}${t(790, 24, 'Figure b', 'font-size="15"')}
    <circle cx="70" cy="62" r="46" fill="none" stroke="#000"/>${f(48, 40, 'CH₃')}${f(22, 58, 'CH₃')}${f(80, 58, 'CH₃')}${f(62, 76, 'N')}${f(56, 102, 'CH₂-CH₂')}
    <circle cx="160" cy="104" r="40" fill="none" stroke="#000"/>${f(128, 102, 'O-C-CH₃')}${f(148, 122, 'O')}${f(150, 144, 'OH')}
    ${f(124, 54, 'Acétylcholine')}
    ${enzyme(160, 196)}
    ${t(6, 182, 'Site de fixation de', 'font-size="14"')}${t(18, 200, 'l’acétylcholine', 'font-size="14"')}${fl(118, 192, 150, 172)}
    ${fl(218, 160, 290, 160)}
    ${tc(320, 214, 'Enzyme  AChE', 'font-size="15"')}${fl(260, 206, 198, 192)}${fl(380, 206, 416, 196)}
    <circle cx="352" cy="96" r="48" fill="none" stroke="#000"/>${f(330, 54, 'Choline')}${f(320, 86, 'CH₃  CH₃')}${f(304, 100, 'CH₃')}${f(340, 112, 'N')}${f(320, 136, 'CH₂-CH₂-OH')}
    ${tc(420, 112, '+', 'font-size="20" font-weight="700"')}
    <ellipse cx="490" cy="104" rx="56" ry="30" fill="none" stroke="#000"/>${f(458, 62, 'Acétate')}${f(450, 108, 'HO - C- CH₃')}${f(474, 124, 'O')}
    ${enzyme(452, 206)}
    <circle cx="640" cy="90" r="50" fill="none" stroke="#000"/>${f(596, 34, 'Carbamate')}${f(612, 76, 'O ‖ C —N')}${f(672, 66, 'R')}${f(672, 92, 'R')}${f(596, 108, 'O')}${f(612, 132, 'X')}${f(612, 152, 'OH')}
    ${enzyme(620, 206)}${fl(682, 160, 740, 160)}${enzyme(790, 206)}
    ${f(764, 50, '+ XOH')}${f(770, 92, 'O ‖ C —N')}${f(830, 82, 'R')}${f(830, 104, 'R')}${f(778, 130, 'O')}
    ${tc(728, 230, 'AChE', 'font-size="15"')}${fl(752, 222, 776, 214)}${fl(700, 222, 650, 210)}
    <rect x="200" y="248" width="656" height="48" fill="none" stroke="#000" stroke-dasharray="4 3"/>
    ${t(210, 268, '<tspan font-weight="700">Remarque :</tspan> l’acétylcholine est un neurotransmetteur qui assure la transmission de l’influx', 'font-size="14"')}
    ${t(210, 288, 'nerveux au niveau des synapses.', 'font-size="14"')}`, 'Document 1 : la réaction enzymatique de l’acétylcholinestérase (figure a) et l’action du carbamate sur son site actif (figure b)');
  // Document 2, figure b : % de mortalité en fonction de la concentration (échelle logarithmique 0,1 → 10⁴)
  const X = c => 60 + (Math.log10(c) + 1) * 66, Y = p => 250 - p * 2.1;
  const figb = svg(420, 300, `
    <rect x="2" y="2" width="416" height="296" fill="none" stroke="#000" stroke-dasharray="4 3"/>${t(344, 22, 'Figure b', 'font-size="15"')}
    ${t(20, 24, 'Pourcentage de mortalité (%)', 'font-size="15" font-weight="700"')}
    <polyline points="${X(.1)},${Y(105)} ${X(.1)},${Y(0)} ${X(1e4)},${Y(0)} ${X(1e4)},${Y(100)} ${X(.1)},${Y(100)}" fill="none" stroke="#000" stroke-width="1.3"/>
    ${[0, 50, 100].map(p => t(X(.1) - 8, Y(p) + 5, String(p), 'text-anchor="end" font-weight="700" font-size="15"')).join('')}
    ${['0,1', '1', '10', '10²', '10³', '10⁴'].map((s, i) => tc(X(10 ** (i - 1)), Y(0) + 20, s, 'font-weight="700" font-size="15"') + `<line x1="${X(10 ** (i - 1))}" y1="${Y(0)}" x2="${X(10 ** (i - 1))}" y2="${Y(0) - 6}" stroke="#000"/>`).join('')}
    ${tc(X(10), Y(0) + 42, 'Concentration en insecticide (mg/L)', 'font-weight="700" font-size="15"')}
    <line x1="${X(.11)}" y1="${Y(0)}" x2="${X(1)}" y2="${Y(100)}" stroke="#000" stroke-width="2"/>
    <line x1="${X(220)}" y1="${Y(0)}" x2="${X(1200)}" y2="${Y(100)}" stroke="#000" stroke-width="2" stroke-dasharray="9 4 2 4"/>
    ${fl(X(3), Y(80), X(1.3), Y(80))}${t(X(3) + 4, Y(80) + 5, 'Souche S', 'font-weight="700" font-size="15"')}
    ${t(X(10) - 6, Y(45) + 5, 'Souche R', 'font-weight="700" font-size="15"')}${fl(X(150), Y(45), X(500), Y(45))}`, 'Document 2, figure b : pourcentage de mortalité des souches S et R en fonction de la concentration en insecticide');
  const figa = '<p style="text-align:left;margin:.1em 0">Figure a</p><table class="t"><tr><td colspan="2">Concentration de l’insecticide en mg.L<sup>-1</sup></td><td>0</td><td>10<sup>-2</sup></td><td>1</td></tr>' +
    '<tr><td rowspan="2">Activité de l’acétylcholinestérase chez la souche (en %)</td><td>S "sauvages"</td><td>97</td><td>8</td><td>0</td></tr>' +
    '<tr><td>R "mutants"</td><td>32</td><td>32</td><td>28</td></tr></table>';
  const doc3 = '<p style="text-align:right;margin:.1em 2em;font-weight:700">⟶ Sens de lecture</p>' + sequences([
    ['Numéro des triplets :', [243, 244, 245, 246, 247, 248, 249, 250, 251]],
    ['Allèle Ace-S de la souche S :', 'ATC TTC GGG GGT GGC TTC TAC TCC GGG'.split(' ')],
    ['Allèle Ace-R de la souche R :', 'ATC TTC GGG GGT AGC TTC TAC TCC GGG'.split(' ')],
  ], { ids: { '1,4': 's-247', '2,4': 'r-247' } }).replace('<table class="seq">', '<table class="seq sans-bord">') + '<style>table.seq.sans-bord td{border:none!important;padding:.1em .45em;font-weight:400}table.seq.sans-bord td.nom{font-weight:700;text-align:right}</style>';
  const C4 = [['UUA<br>UUG', 'Leu'], ['GGU<br>GGC<br>GGA<br>GGG', 'Gly'], ['AGU<br>AGC<br>UCU<br>UCC', 'Ser'], ['AUU<br>AUC<br>AUA', 'Ile'], ['UUU<br>UUC', 'Phe'], ['UAU<br>UAC', 'Tyr'], ['CGU<br>CGC<br>CGA<br>CGG', 'Arg'], ['CCU<br>CCC<br>CCA<br>CCG', 'Pro'], ['UAA<br>UAG<br>UGA', 'Stop']];
  const doc4 = '<table class="t" style="font-weight:400"><tr><td>Codons</td>' + C4.map(([c]) => `<td style="vertical-align:top;font-weight:400">${c}</td>`).join('') + '</tr><tr><td>Acides aminés</td>' + C4.map(([, a]) => `<td style="font-weight:400">${a}</td>`).join('') + '</tr></table>';
  window.FEUILLE = {
    sujet: 'svt/2020-normale', page: '5/7', code: 'NS 34F', style_titre: 'encadre', bareme: 'inline',
    exam: { year: 2020, session: 'Normale', duration_minutes: 180, coefficient: 5 },
    id: 'examen-svt-2020-normale-ex2',
    titre: 'Exercice 2 : (4 pts)',
    blocs: [
      { id: 'contexte', libelle: 'Introduction', texte:
        'Les moustiques *Culex pipiens* transmettent, par leurs piqûres, de nombreuses maladies (filariose, fièvre du Nil…), ils deviennent actuellement résistants aux insecticides à base de carbamates. Pour expliquer l’origine de cette résistance on propose les données suivantes :\n\n' +
        'L’acétylcholinestérase (AChE) est une enzyme qui hydrolyse l’acétylcholine au niveau des synapses cholinergique. Cette dégradation est indispensable au bon fonctionnement du système nerveux des insectes. Les carbamates agissent au niveau du système nerveux des insectes en inhibant l’activité de l’acétylcholinestérase. Le document 1 présente la réaction enzymatique de l’acétylcholinestérase (figure a) et l’action du carbamate sur le site actif de cette enzyme spécifique à la fixation de l’acétylcholine (figure b).' },
      { figure: 'doc1', id: 'fig-doc1', legende: '**Document 1**', largeur: '96%', svg: doc1 },
      { question: '1', points: 1, texte: '**En vous basant** sur le document 1, **décrivez** le mode d’action de l’acétylcholinestérase et l’effet du carbamate sur cette enzyme.' },
      { id: 'donnee-2', libelle: 'Le document 2', texte: 'Chez les moustiques *Culex pipiens*, la synthèse de l’acétylcholinestérase est contrôlée par un gène ayant deux allèles différents. Les moustiques résistants (souche R) possèdent deux allèles mutés (allèles Ace-R) alors que les moustiques sensibles (souche S) possèdent deux allèles sauvages (allèles Ace-S). Le document 2 présente les résultats des études de l’action d’un insecticide à base de carbamates sur les deux souches de moustiques, la figure (a) présente des mesures de l’activité de l’acétylcholinestérase de chaque souche en fonction de la concentration en insecticide, à base de carbamates, appliqué. La figure (b) montre le taux de mortalité de chaque souche en fonction de la concentration en insecticide appliqué.' },
      { figure: 'doc2', id: 'fig-doc2', legende: '**Document 2**', html: `<div style="display:flex;gap:1em;align-items:center;justify-content:center;flex-wrap:wrap"><div>${figa}</div><div style="width:min(420px,100%)">${figb}</div></div>` },
      { question: '2', points: 1, texte: '**En exploitant** le document 2, **montrez** la relation entre la mortalité des souches de moustiques S et R et l’activité de l’acétylcholinestérase, puis **proposez** une hypothèse pour **expliquer** la résistance des souches R à l’insecticide utilisé.' },
      { id: 'donnee-3', libelle: 'Documents 3 et 4', texte: 'Pour vérifier votre hypothèse, on propose le document 3 qui donne la séquence nucléotidique d’un fragment de l’allèle (brin non transcrit) du gène Ace codant pour la synthèse de l’acétylcholinestérase chez la souche S et la souche R et le document 4 qui présente un extrait du code génétique.' },
      { figure: 'doc3', id: 'fig-doc3', legende: '**Document 3**', html: doc3 },
      { figure: 'doc4', id: 'fig-doc4', legende: '**Document 4**', html: doc4 },
      { question: '3', points: 2, texte: '**En utilisant** les données des documents 3 et 4, **déterminez** l’ARNm et la séquence des acides aminés correspondantes à chaque fragment du gène Ace chez les deux souches S et R et **vérifiez** votre hypothèse en mettant en évidence la relation caractère - gène.' },
    ],
  };
})();
</script>
