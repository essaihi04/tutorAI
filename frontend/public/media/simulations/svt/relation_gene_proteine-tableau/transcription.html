<script src="commun.js"></script>
<script src="etapes.js"></script>
<script src="molecules.js"></script>
<script>
/*
 * La transcription (cours « Expression de l’information génétique », 2 Bac PC BIOF, 11 novembre 2026). Capacité RGP5.
 * Trois vues :
 *   transcription : le gène (5 triplets) dans le nucléoplasme ; l’ARN polymérase se fixe, ouvre l’œil, lit le brin transcrit
 *                   (en bas, 3′ → 5′) et pose les nucléotides d’ARN complémentaires ; l’ARNm s’allonge de 5′ vers 3′,
 *                   quitte l’ADN derrière la polymérase (la double hélice s’y referme), se détache ; l’ADN est refermé, inchangé ;
 *   brins         : brin non transcrit, brin transcrit, ARNm alignés par triplets — chemin 1 (complémentaire du brin transcrit)
 *                   et chemin 2 (le brin non transcrit recopié, T → U) ;
 *   noyau         : la cellule entière : l’ARNm sort du noyau par un pore, l’ADN reste dans le noyau.
 * Règle 7 : le vivant est PEINT (Molecules) — ADN bleu-violet, ARNm orange, bases A rouge, T jaune, C bleu, G vert, U magenta,
 * polymérase ovale rose-violet translucide ; la craie pour les légendes. Hors programme exclu : ni promoteur, ni facteurs, ni hélicase.
 */
const { lisse, rampe, entre } = window.Etapes;
const M = window.Molecules;
const TAU = Math.PI * 2;
const clamp = v => Math.max(0, Math.min(1, v));
const COMP = M.COMP_ADN;

/* ── Peintures propres à cette page (les brins courbes de l’œil) ── */
/** Une base peinte (bâtonnet coloré + lettre blanche), du squelette (px, y) vers `sens` (+1 bas, −1 haut). */
function baseP(x, px, y, L, sens, lb, pas, a = 1, lettre = true) {
  const col = M.BASE[L]; if (!col || a <= 0) return;
  x.save(); x.globalAlpha *= a;
  const w = Math.min(6, pas * .32);
  const g = x.createLinearGradient(px - w, 0, px + w, 0); g.addColorStop(0, M.ombre(col, .75)); g.addColorStop(.45, col); g.addColorStop(1, M.ombre(col, .6));
  x.fillStyle = g; x.beginPath(); if (x.roundRect) x.roundRect(px - w, Math.min(y, y + sens * lb), 2 * w, lb, 3); else x.rect(px - w, Math.min(y, y + sens * lb), 2 * w, lb); x.fill();
  if (lettre) { x.fillStyle = '#fff'; x.font = `700 ${Math.round(Math.min(13, pas * .62))}px sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(L, px, y + sens * lb * .55); }
  x.restore();
}
/** Squelette sucre-phosphate ombré le long de `pts` (type 'adn' bleu-violet, 'arn' orange). */
function squelette(x, pts, type, a = 1) {
  if (pts.length < 2 || a <= 0) return;
  const [cl, cf] = type === 'arn' ? ['#fdba74', '#ea580c'] : ['#a5b4fc', '#4f46e5'];
  x.save(); x.globalAlpha *= a; x.lineCap = 'round'; x.lineJoin = 'round';
  const trace = (dy) => { x.beginPath(); pts.forEach(([px, py], i) => (i ? x.lineTo(px, py + dy) : x.moveTo(px, py + dy))); x.stroke(); };
  x.strokeStyle = M.ombre(cf, .62); x.lineWidth = 7.5; trace(.6);
  x.strokeStyle = cf; x.lineWidth = 5; trace(-.4);
  x.globalAlpha *= .85; x.strokeStyle = cl; x.lineWidth = 2; trace(-1.8);
  x.strokeStyle = 'rgba(255,255,255,.5)'; x.lineWidth = 1; trace(-2.3);
  x.restore();
}
/** Un brin dont le squelette suit yAt(u) (u en bases, 0 = début du gène) ; bases i de `de` à `a`. */
function brinCourbe(x, X0, pas, lettres, type, sens, yAt, o = {}) {
  const de = o.de ?? 0, a = o.a ?? lettres.length, lb = o.lb ?? 25, al = o.alpha ?? 1;
  const u0 = o.u0 ?? de, u1 = o.u1 ?? a;
  for (let i = de; i < a; i++) { const u = i + .5; baseP(x, X0 + u * pas, yAt(u), lettres[i], sens, lb, pas, (o.alphaBase ? o.alphaBase(i) : 1) * al, o.lettres !== false); }
  const pts = []; for (let u = u0; u <= u1 + 1e-6; u += .2) pts.push([X0 + u * pas, yAt(u)]);
  squelette(x, pts, type, al);
}
/** Nucléotide d’ARN libre (sphère orange + base avec sa lettre) ; la base pointe dans la direction `ang`. */
function nucLibre(x, px, py, L, ang, a = 1) {
  if (a <= 0) return;
  x.save(); x.globalAlpha *= a; x.translate(px, py); x.rotate(ang + Math.PI / 2);
  const col = M.BASE[L];
  const g = x.createLinearGradient(-5, 0, 5, 0); g.addColorStop(0, M.ombre(col, .75)); g.addColorStop(.45, col); g.addColorStop(1, M.ombre(col, .6));
  x.fillStyle = g; x.beginPath(); if (x.roundRect) x.roundRect(-5.5, -24, 11, 20, 3); else x.rect(-5.5, -24, 11, 20); x.fill();
  M.sphere(x, 0, 0, 5.5, '#ea580c');
  x.translate(0, -14); x.rotate(-(ang + Math.PI / 2));
  x.fillStyle = '#fff'; x.font = '700 11px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(L, 0, .5);
  x.restore();
}
/** L’ARN polymérase : ovale rose-violet translucide (les bases restent lisibles à travers). */
function polymerase(x, cx, cy, s = 1, a = 1) {
  if (a <= 0) return;
  x.save(); x.globalAlpha *= a;
  const rx = 46 * s, ry = 74 * s;
  const g = x.createRadialGradient(cx - rx * .35, cy - ry * .45, 4, cx, cy, Math.max(rx, ry));
  g.addColorStop(0, 'rgba(250,232,255,.55)'); g.addColorStop(.5, 'rgba(232,121,249,.30)'); g.addColorStop(1, 'rgba(147,51,234,.42)');
  x.fillStyle = g; x.beginPath(); x.ellipse(cx, cy, rx, ry, 0, 0, TAU); x.fill();
  x.strokeStyle = 'rgba(192,38,211,.85)'; x.lineWidth = 2; x.stroke();
  x.strokeStyle = 'rgba(255,255,255,.35)'; x.lineWidth = 1.4; x.beginPath(); x.ellipse(cx - rx * .15, cy - ry * .2, rx * .62, ry * .62, 0, Math.PI * 1.05, Math.PI * 1.45); x.stroke();
  x.restore();
}

/* ════════════════ Vue « transcription » ════════════════ */
const NT = 'ATGCGCAGTCAGTAG', TR = 'TACGCGTCAGTCATC', ARN = 'AUGCGCAGUCAGUAG';
const X0 = 120, PAS = 30, N = 15, X1 = X0 + N * PAS;            // 120 → 570
const YH = 140, YB = 190, LB = 25, YARN = 196, YLANE = 300, YPOL = 178;
const FL_G = 'C', FL_D = 'A';                                       // une base de chaque côté du gène (pâle, sans lettre)
const MT = { gene: 1.5, polymerase_se_fixe: 4.0, ouverture_oeil: 6.0, premier_nucleotide: 8.0, allongement: 11.0, regle_ecrite: 14.0, fin_du_gene: 19.0, liberation_arnm: 21.5, refermeture: 24.0 };
const xu = u => X0 + u * PAS;
/** Nombre de nucléotides d’ARN posés (réel) : A en face de T (6,4 → 7,2 s), U en face de A (7,2 → 8,0 s), puis 13 bases jusqu’à 18,6 s. */
function nbT(t) { if (t < 6.4) return 0; if (t < 8) return (t - 6.4) / .8; return Math.min(N, 2 + (t - 8) * 13 / 10.6); }
function etatT(t) {
  const nb = nbT(t);
  const o = rampe(t, 4.4, 1.2) * (1 - rampe(t, 21.8, 1.6));          // ouverture de l’œil (0 fermé → 1 ouvert)
  const L = Math.max(nb - 6, -1), R = nb + 1.8;                       // bords de l’œil (en bases)
  const f = u => o * lisse(clamp((u - L) / 1.3)) * lisse(clamp((R - u) / 1.3));
  const lib = rampe(t, 19.6, 1.6);                                    // libération de la fin de l’ARNm
  const d = u => Math.max(lib, lisse(clamp((L + 1.5 - u) / 3)));     // 0 apparié dans l’œil → 1 détaché (en dessous)
  const yT = u => YH - 30 * f(u), yB = u => YB + 56 * f(u), yA = u => entre(YARN, YLANE, d(u));
  const nA = Math.min(N, Math.floor(nb + 1e-9));
  // la polymérase : se fixe (2,4 → 3,6 s), avance avec le front, puis quitte le gène (19,2 → 20,6 s)
  let px, py = YPOL, ps = 1, pa = rampe(t, 2.4, .8);
  const xFront = xu(nb + .3);
  if (t < 3.6) px = entre(X0 - 90, xu(.3), lisse((t - 2.4) / 1.2));
  else px = xFront;
  const dep = rampe(t, 19.2, 1.4);
  if (dep > 0) { px = entre(xu(N + .3), 690, dep); py = entre(YPOL, 150, dep); ps = entre(1, .7, dep); }
  return { nb, o, L, R, f, lib, d, yT, yB, yA, nA, px, py, ps, pa, dep };
}
function nucleotidesLibres(t) {
  const out = [];
  for (let i = 0; i < 10; i++) {
    out.push({ L: 'AUCG'[(i * 3) % 4], x: 140 + ((i * 46 + t * 6) % 460), y: 361 + Math.sin(t * 1.3 + i * 1.7) * 6, ang: -Math.PI / 2 + Math.sin(t * .8 + i) * .4 });
  }
  return out;
}
function dessinerTranscription(c, k) {
  const t = k.t, E = etatT(t);
  c.direct(() => {
    const x = c.ctx;
    M.milieu(x, 4, 34, 752, 384, 'noyau');
    // l’ARN polymérase, derrière les brins (translucide : les lettres restent lisibles)
    polymerase(x, E.px, E.py, E.ps, E.pa * (t >= 2.4 ? 1 : 0));
    // brin non transcrit (haut, 5′ à gauche) et brin transcrit (bas, 3′ à gauche), avec une base pâle de chaque côté
    const ntP = FL_G + NT + FL_D, trP = COMP[FL_G] + TR + COMP[FL_D];
    const pale = i => (i === 0 || i === N + 1 ? .35 : 1);
    for (const [s, sens, fy] of [[ntP, 1, E.yT], [trP, -1, E.yB]]) {
      for (const i of [0, N + 1]) baseP(x, xu(i - .5), fy(i - .5), s[i], sens, LB, PAS, pale(i), false);
      brinCourbe(x, X0, PAS, s.slice(1, N + 1), 'adn', sens, fy, { lb: LB, u0: -1.5, u1: N + 1.5 });
    }
    // l’ARNm : apparié dans l’œil, détaché derrière (il passe devant le brin transcrit)
    if (E.nA > 0) brinCourbe(x, X0, PAS, ARN, 'arn', 1, E.yA, { lb: LB, de: 0, a: E.nA, u0: 0, u1: E.nA });
    // nucléotides d’ARN libres, dans le nucléoplasme
    if (t >= 2.4) for (const n of nucleotidesLibres(t)) nucLibre(x, n.x, n.y, n.L, n.ang, rampe(t, 2.4, .8));
    // le nucléotide qui arrive en face de sa base complémentaire
    if (t >= 6.4 && E.nb < N) {
      const i = E.nA, u = lisse(clamp(E.nb - i)), xi = xu(i + .5);
      const sx = xi + 34, sy = 352, cx = xi + 44, cy = 262, ex = xi, ey = YARN;
      const q = 1 - u, bx = q * q * sx + 2 * q * u * cx + u * u * ex, by = q * q * sy + 2 * q * u * cy + u * u * ey;
      nucLibre(x, bx, by, ARN[i], -Math.PI / 2 + Math.PI * u);
    }
  });
  c.texte('La transcription : du gène à l’ARNm', 380, 24, { couleur: 'cyan', taille: 19, align: 'center' });
  // ── légendes qui suivent les brins ──
  const yT0 = E.yT(-1.5), yB0 = E.yB(-1.5), yT1 = E.yT(N + 1.5), yB1 = E.yB(N + 1.5);
  c.repere('brin_non_transcrit', X0, E.yT(7.5) - 4, X1 - X0, LB + 8, 'le brin non transcrit (5′ → 3′)');
  c.repere('brin_transcrit', X0, E.yB(7.5) - LB - 4, X1 - X0, LB + 8, 'le brin transcrit (3′ → 5′)');
  c.repere('triplets', X0, 78, X1 - X0, 24, 'les numéros des triplets');
  if (k.ecrit(c, 'adn', .5)) {
    k.T(c, 'brin non', 6, 118, { couleur: 'bleu', taille: 13 }); k.T(c, 'transcrit', 6, 133, { couleur: 'bleu', taille: 13 });
    k.T(c, 'brin', 6, 210, { couleur: 'violet', taille: 13 }); k.T(c, 'transcrit', 6, 225, { couleur: 'violet', taille: 13 });
    k.T(c, '5′', xu(-1.5) - 12, yT0 + 5, { couleur: 'vert', taille: 15, align: 'center' }); k.T(c, '3′', xu(N + 1.5) + 12, yT1 + 5, { couleur: 'vert', taille: 15, align: 'center' });
    k.T(c, '3′', xu(-1.5) - 12, yB0 + 5, { couleur: 'vert', taille: 15, align: 'center' }); k.T(c, '5′', xu(N + 1.5) + 12, yB1 + 5, { couleur: 'vert', taille: 15, align: 'center' });
    k.T(c, 'triplets', 104, 92, { couleur: 'faible', taille: 13, align: 'right' });
    for (let j = 0; j < 5; j++) { c.ligne(xu(3 * j) + 4, 98, xu(3 * j + 3) - 4, 98, { couleur: 'faible', largeur: 1.4, duree: .08 }); k.T(c, String(j + 1), xu(3 * j + 1.5), 92, { couleur: 'blanc', taille: 14, align: 'center', duree: .1 }); }
    k.T(c, 'dans le noyau (nucléoplasme)', 750, 50, { couleur: 'faible', taille: 13, align: 'right' });
  }
  if (t < 9.4 && k.ecrit(c, 'rappel', .9)) k.T(c, 'rappel : A en face de T, C en face de G ; deux brins antiparallèles', X0, 46, { couleur: 'faible', taille: 14 });
  // ── la polymérase ──
  if (t >= 2.4) {
    const rx = 46 * E.ps, ry = 74 * E.ps;
    c.repere('polymerase', E.px - rx, E.py - ry, 2 * rx, 2 * ry, 'l’ARN polymérase');
    c.repere('nucleotides_libres', 130, 330, 470, 46, 'des nucléotides d’ARN libres');
  }
  if (k.ecrit(c, 'pol', 2.8)) {
    if (E.dep <= 0) k.T(c, 'ARN polymérase', Math.max(E.px - 16, 100), 284, { couleur: 'rose', taille: 14, align: 'right' });
    else if (E.dep >= 1) k.T(c, 'ARN polymérase', 690, 228, { couleur: 'rose', taille: 14, align: 'center' });
    k.T(c, 'nucléotides libres', X0 + 10, 388, { couleur: 'faible', taille: 13 });
  }
  // ── l’œil ──
  const xL = xu(Math.max(E.L, -1.5)), xR = xu(Math.min(E.R, N + 1.5));
  if (t >= 4.4) c.repere('oeil', xL, 100, Math.max(30, xR - xL), 160, 'l’œil de transcription : l’ADN ouvert');
  if (t < 12 && k.ecrit(c, 'oeil', 4.8)) k.T(c, '← œil de transcription', E.px + 44, 284, { couleur: 'blanc', taille: 14 });
  // ── l’ARNm ──
  if (t >= 6.4) {
    const nA = Math.max(1, E.nA), y0 = E.yA(.5), yN = E.yA(nA - .5);
    let ymin = Infinity, ymax = -Infinity; for (let u = 0; u <= nA; u += .5) { ymin = Math.min(ymin, E.yA(u)); ymax = Math.max(ymax, E.yA(u)); }
    c.repere('arnm', X0, ymin - 4, nA * PAS, ymax - ymin + LB + 8, 'l’ARNm');
    c.repere('extremite_5_arnm', X0 - 24, y0 - 8, 44, LB + 14, 'l’extrémité 5′ de l’ARNm');
    c.repere('extremite_3_arnm', xu(nA - 1) - 4, yN - 18, PAS + 22, LB + 22, 'l’extrémité 3′ de l’ARNm');
  }
  if (t >= 7.2) c.repere('nucleotide_u', xu(1) + 2, E.yA(1.5) - 4, PAS - 4, LB + 8, 'le U posé en face de A');
  if (k.ecrit(c, 'arn5', 6.8)) {
    const y0 = E.yA(.5), nA = Math.max(1, E.nA), yN = E.yA(nA - .5), enLigne = E.d(nA - .5) > .5;
    if (E.d(.5) > .5) { k.T(c, '5′', X0 - 12, y0 + 5, { couleur: 'vert', taille: 15, align: 'center' }); k.T(c, 'ARNm', 6, y0 + 5, { couleur: 'orange', taille: 15 }); }
    else { k.T(c, '5′', X0 + 1, YARN - 9, { couleur: 'vert', taille: 14, align: 'center' }); k.T(c, 'ARNm', 6, 174, { couleur: 'orange', taille: 15 }); }
    if (enLigne) k.T(c, '3′', xu(nA) + 12, yN + 5, { couleur: 'vert', taille: 15, align: 'center' });
    else k.T(c, '3′', xu(nA - .5), yN - 10, { couleur: 'vert', taille: 14, align: 'center' });
  }
  if (k.ecrit(c, 'prem', 7.4)) k.T(c, 'en face de T : A ; en face de A : U', 260, 388, { couleur: 'rose', taille: 14 });
  // ── le sens ──
  if (k.ecrit(c, 'sens', 9.6)) {
    k.T(c, 'l’ARN polymérase lit le brin transcrit de 3′ vers 5′', X0, 46, { couleur: 'jaune', taille: 14 });
    c.fleche(450, 41, 530, 41, { couleur: 'jaune', largeur: 1.8 });
    k.T(c, 'l’ARNm s’allonge de 5′ vers 3′', X0, 68, { couleur: 'orange', taille: 14 });
    c.fleche(334, 63, 414, 63, { couleur: 'orange', largeur: 1.8 });
  }
  if (t >= 9.6) c.repere('sens_lecture', X0, 30, 420, 42, 'le sens : lecture 3′ → 5′, allongement 5′ → 3′');
  // ── la règle ──
  if (k.ecrit(c, 'regle', 12.4)) {
    k.T(c, 'brin transcrit', 615, 256, { couleur: 'blanc', taille: 14 });
    k.T(c, '→ ARNm :', 615, 274, { couleur: 'blanc', taille: 14 });
    const R = [['A', 'U', 'rouge', 'rose'], ['T', 'A', 'jaune', 'rouge'], ['C', 'G', 'bleu', 'vert'], ['G', 'C', 'vert', 'bleu']];
    R.forEach(([a, b, ca, cb], i) => { const y = 298 + i * 21; k.T(c, a, 632, y, { couleur: ca, taille: 17, align: 'center', duree: .15 }); k.T(c, '→', 656, y, { couleur: 'blanc', taille: 16, align: 'center', duree: .1 }); k.T(c, b, 680, y, { couleur: cb, taille: 17, align: 'center', duree: .15 }); });
  }
  if (t >= 12.4) c.repere('regle', 608, 240, 146, 150, 'la règle : A → U, T → A, C → G, G → C');
  // ── fin, libération, refermeture ──
  if (k.ecrit(c, 'fin', 18.6)) k.T(c, 'fin du gène', 596, 84, { couleur: 'blanc', taille: 14 });
  if (t >= 18.6) c.repere('fin_du_gene', 560, 70, 120, 30, 'la fin du gène');
  if (k.ecrit(c, 'lib', 20.4)) k.T(c, 'l’ARNm se détache', X0 + 10, 408, { couleur: 'orange', taille: 14 });
  if (k.ecrit(c, 'ref', 23.0)) k.T(c, 'l’ADN se referme : il est inchangé', 300, 408, { couleur: 'vert', taille: 14 });
}
function voitTranscription(k) {
  const t = k.t, E = etatT(t), m = [];
  m.push('Dans le noyau (fond bleuté), un gène de 5 triplets numérotés 1 à 5. En haut le brin non transcrit 5′ ATG CGC AGT CAG TAG 3′, en bas le brin transcrit 3′ TAC GCG TCA GTC ATC 5′ (squelettes bleu-violet, bases A rouge, T jaune, C bleu, G vert, lettres écrites) ; A en face de T, C en face de G.');
  if (t < 2.4) m.push('L’ADN est fermé ; aucune polymérase encore.');
  else if (t < 3.6) m.push('L’ARN polymérase (ovale rose-violet) arrive sur le début du gène.');
  else if (E.dep <= 0 && E.nb < .05) m.push('L’ARN polymérase (ovale rose-violet) est fixée sur le début du gène (triplet 1).');
  if (E.o > .05 && E.nb < N - .01) m.push(`Sous la polymérase, la double hélice est ouverte (œil de transcription) ${E.nb < 1 ? 'au début du gène' : `vers le triplet ${Math.min(5, Math.floor(E.nb / 3) + 1)}`} : les deux brins sont écartés.`);
  if (t >= 2.4) m.push('Des nucléotides d’ARN libres (A, U, C, G sur une sphère orange) flottent en bas dans le nucléoplasme.');
  if (E.nA > 0) {
    const s = ARN.slice(0, E.nA).match(/.{1,3}/g).join(' ');
    m.push(`L’ARNm (squelette orange, bases dont U magenta) compte ${E.nA} nucléotide${E.nA > 1 ? 's' : ''} : 5′ ${s}${E.nA === N ? ' 3′' : ' …'} ; il est complémentaire du brin transcrit (en face de T : A, de A : U, de C : G, de G : C).`);
  }
