<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L'ADN et l'ARN — au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="genetique.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="À gauche un morceau d'ADN à deux brins, à droite un morceau d'ARN à un seul brin orange ; leurs sucres puis leurs bases s'écrivent ; dans l'ARN, U prend la place de T ; puis les trois sortes d'ARN"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start pause resume play_until">Comparer</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="commun.js"></script>
<script src="molecules.js"></script>
<script>
/*
 * L'ADN et l'ARN côte à côte (14 novembre 2026, règle 28 du professeur) : remplace le tableau ADN / ARN de la diapo rg_a1_arn.
 * Les différences apparaissent l'une après l'autre, sur les molécules elles-mêmes :
 *   brins  : l'ADN se dessine avec deux brins (bleu-violet), l'ARN avec un seul (orange) → « 2 brins » / « 1 brin » ;
 *   sucre  : les sucres s'allument → « désoxyribose » / « ribose » ;
 *   bases  : les bases s'écrivent ; dans l'ARN, là où l'on attendrait T, un T barré puis U (uracile) → « A, T, C, G » / « A, U, C, G » ;
 *   sortes : sous l'ARN, ses trois sortes : ARNm (messager), ARNt (de transfert), ARNr (des ribosomes).
 * Pas de transcription ici (elle vient plus tard) : l'ARN n'est pas « copié », il est seulement montré à côté.
 * Couleurs du cours : ADN bleu-violet, ARN orange ; A rouge, T jaune, C bleu, G vert, U magenta.
 * Moments (s de la scène) : brins 2,6 ; sucre 4,6 ; bases 7,4 ; sortes 10.
 */
const { fr, bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);
const BASE = { A: '#f87171', T: '#facc15', C: '#60a5fa', G: '#4ade80', U: '#e879f9' };
const VIOLET = '#a78bfa', ORANGE = '#fb923c';
const HAUT = ['A', 'T', 'G', 'C', 'T', 'A'], BAS = ['T', 'A', 'C', 'G', 'A', 'T'];
const ARN = ['A', 'U', 'G', 'C', 'U', 'A'];
const XA = i => 66 + i * 54, XR = i => 436 + i * 54, YH = 132, YB = 244;
const M = { brins: 2.6, sucre: 4.6, bases: 7.4, sortes: 10 };
const FIN = 10.4;
const MOTIFS = { brins: 'l’ADN a deux brins, l’ARN un seul', sucre: 'les sucres : désoxyribose dans l’ADN, ribose dans l’ARN',
  bases: 'les bases : A, T, C, G dans l’ADN ; A, U, C, G dans l’ARN', sortes: 'les trois sortes d’ARN : ARNm, ARNt, ARNr' };
const S = { t: 0, running: false, pause: false, fait: false, jusqua: null, motif: '', emis: 0 };
const part = (a, b) => Math.max(0, Math.min(1, (S.t - a) / (b - a)));

/* ── Peinture (règle 32) : les molécules sont peintes, la craie garde les lettres, les noms et la comparaison ── */
const MOL = window.Molecules;
// Teintes peintes du cours (molecules.js) : squelette ADN bleu-violet, ARN orange ; bases A rouge, T jaune, C bleu, G vert, U magenta.
const TEINTE = { adn: ['#c7d2fe', '#6366f1', '#3730a3'], arn: ['#fed7aa', '#f97316', '#9a3412'] };
const BASE_PEINTE = MOL.BASE;
function chemin5(x, cx, cy, r) {
  x.beginPath();
  for (let k = 0; k < 5; k++) { const a = -Math.PI / 2 + k * 2 * Math.PI / 5; k ? x.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a)) : x.moveTo(cx + r * Math.cos(a), cy + r * Math.sin(a)); }
  x.closePath();
}
// Un brin peint : ruban sucre-phosphate, sucres (pentagones en relief), phosphates (petites sphères), jusqu'à la part u.
function peindreBrin(x, X, y, type, u, sucreAllume) {
  const [cl, cm, cf] = TEINTE[type], n = Math.ceil(6 * u - 1e-9), xa = X(0) - 20, xb = xa + (X(5) - X(0) + 40) * u;
  x.save();
  const gs = x.createLinearGradient(0, y - 5, 0, y + 5); gs.addColorStop(0, cl); gs.addColorStop(.5, cm); gs.addColorStop(1, cf);
  x.strokeStyle = gs; x.lineWidth = 7; x.lineCap = 'round'; x.beginPath(); x.moveTo(xa, y); x.lineTo(xb, y); x.stroke();
  x.strokeStyle = 'rgba(255,255,255,.4)'; x.lineWidth = 1.3; x.beginPath(); x.moveTo(xa + 2, y - 2); x.lineTo(xb - 2, y - 2); x.stroke();
  for (let i = 0; i < n; i++) {
    const px = X(i);
    x.save();
    x.shadowColor = sucreAllume ? cl : 'rgba(0,0,0,.4)'; x.shadowBlur = sucreAllume ? 12 : 4; x.shadowOffsetY = sucreAllume ? 0 : 2;
    const g = x.createRadialGradient(px - 4, y - 5, 1, px, y, 12);
    g.addColorStop(0, '#ffffff'); g.addColorStop(.35, sucreAllume ? cl : cm); g.addColorStop(1, cf);
    chemin5(x, px, y, 11); x.fillStyle = g; x.fill();
    x.restore();
    x.strokeStyle = 'rgba(255,255,255,.55)'; x.lineWidth = 1; chemin5(x, px, y, 11); x.stroke();
    if (i < 5) MOL.sphere(x, px + 27, y, 5.5, cm);
  }
  x.restore();
}
// Une base peinte : un bâtonnet coloré en relief, du sucre (ya) vers l'intérieur (yb).
function peindreBase(x, px, ya, yb, L) {
  const coul = BASE_PEINTE[L], y0 = Math.min(ya, yb), h = Math.abs(yb - ya);
  x.save(); x.shadowColor = 'rgba(0,0,0,.35)'; x.shadowBlur = 4; x.shadowOffsetX = 1.5; x.shadowOffsetY = 1.5;
  const g = x.createLinearGradient(px - 11, 0, px + 11, 0);
  g.addColorStop(0, MOL.ombre(coul, .6)); g.addColorStop(.4, coul); g.addColorStop(.55, coul); g.addColorStop(1, MOL.ombre(coul, .5));
  x.fillStyle = g; x.beginPath(); x.roundRect(px - 11, y0, 22, h, 5); x.fill();
  x.restore();
  x.fillStyle = 'rgba(255,255,255,.28)'; x.beginPath(); x.roundRect(px - 7, y0 + 3, 4, h - 6, 2); x.fill();
}
// Le nom du sucre, à la craie, quand les sucres s'allument.
function brin(c, X, y, couleur, u, sucreAllume, nomSucre) {
  if (sucreAllume && u > 0 && nomSucre) c.texte(nomSucre, X(0) - 14, y - 22, { couleur, taille: 13 });
}

/* Tableau large (15 novembre 2026, « mieux exploiter tout le tableau ») : les molécules (x 16..748, y 40..300) sont
 * agrandies à gauche sur toute la hauteur ; la comparaison passe dans une colonne à droite (une ligne par différence,
 * ADN et ARN côte à côte), en grand. Tableau étroit : la disposition d'origine (comparaison sous les molécules). */
let LG = null;
function disposer(L) {
  if (L < 1150) return null;
  const W = Math.min(420, Math.max(300, L * .25)), z = Math.min(1.54, (L - W - 48) / 732);
  const fx = 12, fy = (420 - 260 * z) / 2;
  const x0 = fx + 732 * z + 26, w = L - 12 - x0;
  return { z, ox: fx - 16 * z, oy: fy - 40 * z, x0, w, xa: x0 + w * .25, xb: x0 + w * .75 };
}
function dessiner(c) {
  scene.cadre(53);
  LG = disposer(scene.L);
  if (LG && scene.mesurant) { c.point(4, 4, 0); c.point(scene.L - 4, 416, 0); return c.fin(); }   // la disposition large remplit déjà le cadre
  const base = c.ctx.getTransform(), ech = c.echelle;
  if (LG) {
    c.ctx.translate(LG.ox, LG.oy); c.ctx.scale(LG.z, LG.z); c.echelle = ech * LG.z;
    c.cadre = null;
  }
  const aPlat = fn => { if (!LG) return fn(); const m = c.ctx.getTransform(); c.ctx.setTransform(base); c.echelle = ech; try { fn(); } finally { c.ctx.setTransform(m); c.echelle = ech * LG.z; } };
  c.direct(() => {
    c.texte('ADN', 196, 64, { couleur: VIOLET, taille: 22, align: 'center' });
    c.texte('ARN', 566, 64, { couleur: ORANGE, taille: 22, align: 'center' });
  });
  c.ligne(380, 50, 380, LG ? 300 : 380, { couleur: 'tresfaible', largeur: 1.2 });
  c.repere('adn', 16, 40, 356, 240, 'l’ADN');
  c.repere('arn', 388, 40, 360, 240, 'l’ARN');
  c.direct(() => {
    if (S.t <= 0) return;
    const sucre = S.t >= M.brins + 0.3, x = c.ctx;
    // Les brins.
    const u = part(0.2, M.brins - 0.4);
    // Les bases (bâtonnets peints) : apparaissent à partir de « sucre ».
    const ub = part(M.sucre + 0.1, M.sucre + 1.6), nb = Math.ceil(6 * ub - 1e-9);
    const vU = part(M.sucre + 1.8, M.bases - 0.6);
    const lettreARN = i => (ARN[i] === 'U' && vU < 0.5 ? 'T' : ARN[i]);
    for (let i = 0; i < Math.min(6, nb); i++) {
      peindreBase(x, XA(i), YH + 8, YH + 51, HAUT[i]);
      peindreBase(x, XA(i), YB - 8, YB - 51, BAS[i]);
      peindreBase(x, XR(i), YH + 8, YH + 51, lettreARN(i));
    }
    peindreBrin(x, XA, YH, 'adn', u, sucre);
    peindreBrin(x, XA, YB, 'adn', u, sucre);
    peindreBrin(x, XR, YH, 'arn', u, sucre);
    brin(c, XA, YH, VIOLET, u, sucre, 'désoxyribose');
    brin(c, XR, YH, ORANGE, u, sucre, 'ribose');
    // La craie : les lettres des bases et les liaisons entre bases complémentaires.
    for (let i = 0; i < 6; i++) {
      if (i >= nb) break;
      // ADN : deux bases face à face, reliées.
      c.ligne(XA(i), YH + 50, XA(i), YB - 50, { couleur: 'blanc', largeur: 1.2, pointille: [3, 4] });
      c.texte(HAUT[i], XA(i), YH + 46, { couleur: 'blanc', taille: 20, align: 'center' });
      c.texte(BAS[i], XA(i), YB - 32, { couleur: 'blanc', taille: 20, align: 'center' });
      // ARN : une base, sans partenaire.
      if (ARN[i] === 'U') {
        if (vU < 0.5) c.texte('T', XR(i), YH + 46, { couleur: 'blanc', taille: 20, align: 'center', alpha: .9 });
        else {
          c.texte('T', XR(i) + 20, YH + 44, { couleur: BASE.T, taille: 15, align: 'center', alpha: .85 });
          c.ligne(XR(i) + 12, YH + 46, XR(i) + 26, YH + 30, { couleur: 'rouge', largeur: 1.8 });
          c.texte('U', XR(i), YH + 46, { couleur: 'blanc', taille: 22, align: 'center' });
        }
      } else c.texte(ARN[i], XR(i), YH + 46, { couleur: 'blanc', taille: 20, align: 'center' });
    }
    if (S.t >= M.bases - 0.6) c.repere('uracile', XR(1) - 16, YH + 22, 48, 32, 'U, l’uracile, à la place de T');
  });
  // Ce qui s'écrit, au moment où on le voit : la comparaison, ligne par ligne.
  const ROW = { 330: ['brins', 0], 358: ['sucre', 1], 386: ['bases', 2] };
  const ligne = (y, gauche, droite, couleur) => {
    if (LG) return aPlat(() => {
      const [nom, i] = ROW[y], yy = 116 + i * 108, enleve = s => s.replace(/^(sucre|bases) : /, '');
      if (i === 0) { c.texte('ADN', LG.xa, 60, { couleur: VIOLET, taille: 30, align: 'center' }); c.texte('ARN', LG.xb, 60, { couleur: ORANGE, taille: 30, align: 'center' }); c.ligne(LG.x0, 72, LG.x0 + LG.w, 72, { couleur: 'tresfaible', largeur: 1.2 }); }
      c.texte(nom, LG.x0 + LG.w / 2, yy, { couleur: 'faible', taille: 21, align: 'center' });
      c.texte(enleve(gauche), LG.xa, yy + 42, { couleur, taille: 28, align: 'center', max: LG.w / 2 - 8 });
      c.texte(enleve(droite), LG.xb, yy + 42, { couleur, taille: 28, align: 'center', max: LG.w / 2 - 8 });
    });
 c.texte(gauche, 196, y, { couleur, taille: 16, align: 'center', max: 340 }); c.texte(droite, 566, y, { couleur, taille: 16, align: 'center', max: 340 }); };
  if (S.t >= M.brins - 0.4) { ecrit.ecrire(c, 'brins', () => ligne(330, '2 brins', '1 seul brin', 'blanc')); c.repere('adn_brins', 40, YH - 16, 316, YB - YH + 32, 'les deux brins de l’ADN'); c.repere('arn_brin', 410, YH - 16, 330, 34, 'le brin unique de l’ARN (orange)'); }
  if (S.t >= M.sucre - 0.4) { ecrit.ecrire(c, 'sucre', () => ligne(358, 'sucre : désoxyribose', 'sucre : ribose', 'cyan')); c.repere('sucre_adn', 40, YH - 40, 160, 54, 'le désoxyribose'); c.repere('sucre_arn', 410, YH - 40, 160, 54, 'le ribose'); }
  if (S.t >= M.bases - 0.4) { ecrit.ecrire(c, 'bases', () => ligne(386, 'bases : A, T, C, G', 'bases : A, U, C, G', 'jaune')); c.repere('bases_adn', 40, YH + 22, 316, YB - YH - 44, 'les bases de l’ADN : A, T, C, G'); c.repere('bases_arn', 410, YH + 22, 330, 60, 'les bases de l’ARN : A, U, C, G'); }
  if (S.t >= M.sortes - 1.6) {
    // Peints : ARNm (un brin orange et ses bases), ARNt (la forme du cours, qui porte un acide aminé),
    // ARNr (dans le ribosome, ses deux sous-unités). Ils apparaissent en fondu, la craie écrit les noms.
    c.direct(() => {
      const x = c.ctx, a = part(M.sortes - 1.6, M.sortes - 1.0);
      x.save(); x.globalAlpha = a;
      MOL.brin(x, 420, 242, 80 / 6, 'AUGCUA', 'arn', 1, { lb: 13, lettres: false, epaisseur: 6 });
      x.save(); x.translate(566, 258); x.scale(.62, .62); x.translate(-566, -258);
      MOL.arnt(x, 566, 258, 'UAC', 'Met', { pas: 12 });
      x.restore();
      MOL.ribosome(x, 672, 246, .4);
      x.strokeStyle = TEINTE.arn[1]; x.lineWidth = 2.4; x.lineCap = 'round'; x.beginPath();
      for (let k = 0; k <= 24; k++) { const v = k / 24, px = 658 + 28 * v, py = 232 + 4 * Math.sin(v * 9); k ? x.lineTo(px, py) : x.moveTo(px, py); }
      x.stroke();
      x.restore();
    });
    ecrit.ecrire(c, 'sortes', () => {
      // ARNm : un brin ; ARNt : porte un acide aminé ; ARNr : dans le ribosome.
      c.texte('ARNm', 460, 276, { couleur: ORANGE, taille: 15, align: 'center' });
      c.texte('messager', 460, 293, { couleur: 'faible', taille: 12, align: 'center' });
      c.texte('ARNt', 566, 276, { couleur: ORANGE, taille: 15, align: 'center' });
      c.texte('de transfert', 566, 293, { couleur: 'faible', taille: 12, align: 'center' });
      c.texte('ARNr', 672, 276, { couleur: ORANGE, taille: 15, align: 'center' });
      c.texte('des ribosomes', 672, 293, { couleur: 'faible', taille: 12, align: 'center' });
    });
    c.repere('sortes', 410, 212, 336, 88, 'les trois sortes d’ARN : ARNm, ARNt, ARNr');
  }
  if (S.t >= M.brins - 0.4) { if (LG) aPlat(() => c.repere('comparaison', LG.x0, 40, LG.w, 320, 'la comparaison ADN / ARN, ligne par ligne')); else c.repere('comparaison', 16, 312, 732, 82, 'la comparaison ADN / ARN, ligne par ligne'); }
  if (LG) { c.ctx.setTransform(base); c.echelle = ech; }
  return c.fin();
}

const canvas = $('canvas');
// Agrandissement (15 novembre 2026) : cadre au format du tableau, la boîte de l'encre de la scène complète le remplit.
const scene = window.GenetiqueTableau.Scene(canvas, dessiner, { large: true, ajuster: true,
  complet: fn => { const t = S.t, app = ecrit.garder(); S.t = FIN; try { fn(); } finally { S.t = t; ecrit.remettre(app); } } });
// Ce qui apparaît pendant la scène s'écrit à la craie à partir de cet instant (comme le professeur qui l'écrit en le disant).
const ecrit = (() => {
  const APP = {};
  return {
    ecrire(c, cle, fn) { if (!(cle in APP)) APP[cle] = (performance.now() - scene.ouvert) / 1000; const cur = c.cur; c.depuis(APP[cle]); try { fn(); } finally { c.cur = cur; } },
    oublier() { for (const k of Object.keys(APP)) delete APP[k]; scene.sale = true; },
    garder() { const a = { ...APP }; for (const k of Object.keys(APP)) delete APP[k]; return a; },
    remettre(a) { for (const k of Object.keys(APP)) delete APP[k]; Object.assign(APP, a); },
  };
})();
scene.avancer = dt => {
  if (!S.running) return false;
  S.t = Math.min(FIN, S.t + dt);
  if (S.jusqua != null && S.t >= S.jusqua) {
    S.t = S.jusqua; S.jusqua = null; S.running = false; S.pause = true; $('run').textContent = 'Reprendre';
    bulle($('feedback'), 'Arrêt sur image : ' + (S.motif || 'instant choisi') + '.'); pont.noter('pause'); pont.emettre(); return true;
  }
  if (S.t >= FIN) {
    S.running = false; S.fait = true; $('run').textContent = 'Comparer';
    bulle($('feedback'), 'ARN : un seul brin, du ribose, U à la place de T ; trois sortes.', 'good'); pont.noter('finished'); pont.emettre();
  } else if (performance.now() - S.emis > 400) { S.emis = performance.now(); pont.emettre(); }
  return true;
};
function playUntil(p) {
  const nom = p.moment in M ? p.moment : null, cible = nom ? M[nom] : +p.time_s;
  if (!Number.isFinite(cible)) return;
  if (S.fait || S.t >= cible - 1e-3) { S.t = 0; ecrit.oublier(); }
  S.jusqua = Math.min(FIN, cible); S.motif = nom ? MOTIFS[nom] : ''; S.running = true; S.pause = false; S.fait = false;
  $('run').textContent = 'Pause'; bulle($('feedback'), 'Observe…'); pont.noter('play_until', { moment: nom }); pont.emettre();
}
function start() { S.jusqua = null; S.t = 0; ecrit.oublier(); S.running = true; S.pause = false; S.fait = false; $('run').textContent = 'Pause'; bulle($('feedback'), 'L’ADN à gauche, l’ARN à droite…'); pont.noter('start'); pont.emettre(); }
function pause() { if (!S.running) return; S.jusqua = null; S.running = false; S.pause = true; $('run').textContent = 'Reprendre'; bulle($('feedback'), 'Arrêt sur image.'); pont.noter('pause'); pont.emettre(); }
function resume() { if (S.running) return; if (!S.pause || S.fait) return start(); S.running = true; S.pause = false; $('run').textContent = 'Pause'; pont.noter('resume'); pont.emettre(); }
function reset() { S.t = 0; S.running = false; S.pause = false; S.fait = false; S.jusqua = null; ecrit.oublier(); $('run').textContent = 'Comparer'; bulle($('feedback'), 'Compare l’ADN et l’ARN, différence après différence.'); pont.emettre(); }
function ceQuiSeVoit() {
  const m = ['À gauche l’ADN (bleu-violet), à droite l’ARN (orange).'];
  if (S.t <= 0) m.push('Rien de dessiné encore.');
  if (S.t > 0) m.push(S.t < M.brins ? 'Les brins se dessinent.' : 'ADN : 2 brins ; ARN : 1 seul brin.');
  if (S.t >= M.sucre - 0.4) m.push('Sucres allumés : désoxyribose (ADN), ribose (ARN).');
  if (S.t >= M.sucre + 0.1) m.push(S.t < M.bases - 0.6 ? 'Les bases s’écrivent.' : 'Bases : ADN A, T, C, G ; ARN A, U, C, G : le T attendu est barré, U (uracile) à sa place.');
  if (S.t >= M.sortes - 1.6) m.push('Sous l’ARN : ARNm (messager), ARNt (de transfert), ARNr (des ribosomes).');
  return m.join(' ');
}
$('run').onclick = () => (S.running ? pause() : S.pause ? resume() : start());
window.Tableau.explication({ adn_arn: [
  { repere: 'adn_brins', texte: 'L’ADN a deux brins.' }, { repere: 'arn_brin', texte: 'L’ARN n’en a qu’un.' },
  { repere: 'sucre_arn', texte: 'Son sucre est le ribose, celui de l’ADN le désoxyribose.' },
  { repere: 'uracile', texte: 'Dans l’ARN, U, l’uracile, prend la place de T.' },
  { repere: 'sortes', texte: 'Trois sortes : ARN messager, de transfert, des ribosomes.' } ] });
const commandes = ['start', 'pause', 'resume', 'reset', 'play_until'];
const config = { id: 'genetique_tableau_adn_arn', version: '1.0', title: 'L’ADN et l’ARN', variants: [{ id: 'adn_arn', label: 'adn_arn' }], commands: commandes,
  command_schema: { play_until: { moment: Object.keys(M).join(' | ') + ' (rejoue et se fige à cet instant clé)' } } };
const pont = protocole({ id: config.id, commandes, config,
  texte: 'ADN et ARN comparés : l’ADN a deux brins, l’ARN un seul ; sucre : désoxyribose (ADN), ribose (ARN) ; bases : A, T, C, G (ADN), A, U, C, G (ARN) — l’uracile U remplace la thymine T ; trois sortes d’ARN : ARNm (messager), ARNt (de transfert), ARNr (des ribosomes).',
  etat: () => ({ simulation_status: S.running ? 'running' : S.pause ? 'paused' : (S.fait ? 'finished' : 'idle'), ce_qui_se_voit: ceQuiSeVoit(), moments: M, time_s: +S.t.toFixed(2) }),
  progression: () => (S.fait ? 1 : S.t / FIN),
  executer: (cmd, p) => ({ start, pause, resume, reset, play_until: () => playUntil(p) })[cmd]?.() });
bulle($('feedback'), 'Compare l’ADN et l’ARN, différence après différence.');
</script>
<script src="/media/simulations/professor-locate.js" defer></script>
</body></html>
