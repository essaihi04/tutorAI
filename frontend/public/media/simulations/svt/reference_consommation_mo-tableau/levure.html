<script>
/*
 * La levure : une seule cellule — cours de référence SVT (docs/reference-svt/ARCHITECTURE.md § 3, diapo rf_r3_levure),
 * 27 novembre 2026. Trois tableaux peints qui se remplacent :
 *   1. microscope, champ : un microscope optique (pied, potence, platine, lame et valets, tourelle d'objectifs, tube,
 *      oculaire, vis de mise au point, lampe) ; une goutte de suspension est déposée sur la lame, la lame va sur la platine ;
 *      puis le champ rond : des levures bourgeonnantes (Lexique.levure) et la barre d'échelle « 1,5 µm ».
 *   2. leg_paroi, leg_membrane, leg_noyau, leg_vacuole, leg_hyaloplasme, leg_mitochondrie, une_cellule : UNE levure
 *      agrandie, en coupe et en couleur ; chaque nom s'écrit à côté avec son trait de rappel, un par moment ; le tableau 1
 *      est rangé, en petit, en bas à gauche. Couleurs du lexique : hyaloplasme vert d'eau, membrane dorée, noyau violet,
 *      vacuole gris-bleu (celle de Lexique.levure), mitochondries = Lexique.mitochondrie, paroi beige-brun de la levure.
 *   3. aerobie, anaerobie : deux bocaux côte à côte (ouvert : le dioxygène de l'air entre ; fermé par un couvercle : il ne
 *      peut plus entrer) et les deux mots découpés : aéro·bie (air, vie), an·aéro·bie (sans, air, vie).
 * Repères : microscope, lame, champ, echelle, cellule, paroi, membrane, noyau, vacuole, hyaloplasme, mitochondrie,
 *           unicellulaire, bocal_ouvert, bocal_ferme, mot_aerobie, mot_anaerobie.
 */
const R = window.Ref, LX = window.Lexique, { doux, mix, borne, rgba, TAU, rr, graine } = R;
const MOMENTS = [
  ['microscope', 9, 'le microscope optique ; une goutte de suspension de levures sur la lame'],
  ['champ', 15, 'le champ du microscope : des levures bourgeonnantes ; barre d’échelle 1,5 µm'],
  ['leg_paroi', 21, 'une levure agrandie, en coupe : la paroi'],
  ['leg_membrane', 24.5, 'la membrane'], ['leg_noyau', 28, 'le noyau'], ['leg_vacuole', 31.5, 'la vacuole'],
  ['leg_hyaloplasme', 35, 'le hyaloplasme'], ['leg_mitochondrie', 39, 'les mitochondries'],
  ['une_cellule', 43, 'la levure : une seule cellule (unicellulaire)'],
  ['aerobie', 52, 'bocal ouvert : aéro·bie, vit avec dioxygène'],
  ['anaerobie', 61, 'bocal fermé : an·aéro·bie, vit sans dioxygène'] ];
const LEGS = ['paroi', 'membrane', 'noyau', 'vacuole', 'hyaloplasme', 'mitochondrie'];
const COUL = { paroi: '#e2bd7c', membrane: '#fad468', noyau: '#c4a2ff', vacuole: '#bcd6e6', hyaloplasme: '#7fe0b0', mitochondrie: '#ff9a6a', levure: '#f0d69a' };
const NOMS = { paroi: 'paroi', membrane: 'membrane', noyau: 'noyau', vacuole: 'vacuole', hyaloplasme: 'hyaloplasme', mitochondrie: 'mitochondries' };
const UNI = 'une seule cellule : la levure est unicellulaire';
const CAP1 = 'sur la lame : une goutte de suspension de levures', CAP2 = 'au microscope : des levures ; certaines portent un bourgeon';
const CONCL = ['vit avec dioxygène', 'vit sans dioxygène'];

/* ── La géométrie ── */
function geo(L, compact) {
  const g = { table: 336, s: 1 };
  g.mx = Math.max(118, L * .155); g.my = 334;
  g.rF = Math.min(140, 132 + (L - 760) * .04); g.cxF = Math.min(L * .71, L - g.rF - 94); g.cyF = 190;
  g.ocu = [g.mx + 73, g.my - 288];
  g.lameT = [g.mx + 204 + 62, g.my - 5]; g.lameP = [g.mx + 204 - 135, g.my - 117];
  // la cellule
  const k = Math.min(1.1, 1 + (L - 760) / 2600);
  g.k = k; g.X = L / 2; g.Y = 206; g.rx = 170 * k; g.ry = 132 * k;
  g.xl = g.X - g.rx - 24; g.xr = g.X + g.rx + 24;
  g.vig = { f: .3, x: 8 - (g.mx - 8) * .3, y: 410 - 336 * .3 };
  // les deux bocaux
  const demi = L / 2;
  g.boc = [0, 1].map(i => {
    const x0 = i * demi, xc = x0 + demi / 2;
    if (compact) return { x0, xc, jar: { x: x0 + 14, y: 64, w: 112, h: 146 }, mot: { x: x0 + 132 + (demi - 132) / 2, y: 104, t: 32 }, sens: [0, 1, 2].map(j => ({ x: x0 + 132 + (demi - 132) / 2, y: 138 + j * 25 })), colonne: true };
    const w = 146 * k, e3 = Math.min(118, (demi - 96) / 2);
    return { x0, xc, jar: { x: xc - w / 2 + 14, y: 52, w, h: 170 }, mot: { x: xc, y: 278, t: 40 }, sens: i ? [-1, 0, 1].map(j => ({ x: xc + j * e3, y: 323 })) : [-.55, .55].map(j => ({ x: xc + j * e3 * 1.2, y: 323 })), concl: { x: xc, y: 376 } };
  });
  return g;
}

/* ════════════════════════════ Tableau 1 : le microscope ════════════════════════════ */
/* Dessiné dans un repère local (origine : coin bas du pied, 204 × 290), puis retourné : platine à gauche, potence à droite. */
function microscope(ctx, mx, my, s, o = {}) {
  const l = o.lumiere || 0;
  ctx.save(); ctx.globalAlpha *= o.alpha ?? 1; ctx.translate(mx + 204 * s, my); ctx.scale(-s, s); ctx.lineJoin = 'round';
  const email = (x0, x1) => { const g = ctx.createLinearGradient(x0, 0, x1, 0); g.addColorStop(0, 'rgb(140,149,165)'); g.addColorStop(.5, 'rgb(218,224,233)'); g.addColorStop(.84, 'rgb(252,253,255)'); g.addColorStop(1, 'rgb(190,198,211)'); return g; };
  const chrome = (x0, x1) => { const g = ctx.createLinearGradient(x0, 0, x1, 0); g.addColorStop(0, 'rgb(84,90,104)'); g.addColorStop(.3, 'rgb(176,182,194)'); g.addColorStop(.62, 'rgb(250,251,253)'); g.addColorStop(.8, 'rgb(150,157,170)'); g.addColorStop(1, 'rgb(94,100,114)'); return g; };
  const noir = (x0, x1) => { const g = ctx.createLinearGradient(x0, 0, x1, 0); g.addColorStop(0, 'rgb(16,18,24)'); g.addColorStop(.66, 'rgb(86,92,106)'); g.addColorStop(.8, 'rgb(120,126,140)'); g.addColorStop(1, 'rgb(34,36,44)'); return g; };
  const bloc = (x, y, w, h, r, style, bordure = 'rgba(20,24,34,.7)') => { rr(ctx, x, y, w, h, r); ctx.fillStyle = style; ctx.fill(); if (bordure) { ctx.strokeStyle = bordure; ctx.lineWidth = .9; ctx.stroke(); } };
  // l'ombre posée
  ctx.fillStyle = 'rgba(0,0,0,.36)'; ctx.beginPath(); ctx.ellipse(96, 3, 108, 6.5, 0, 0, TAU); ctx.fill();
  // la potence (le bras courbe qui porte le tube)
  const bras = () => { ctx.beginPath(); ctx.moveTo(40, -24); ctx.bezierCurveTo(24, -92, 28, -172, 58, -206); ctx.quadraticCurveTo(78, -226, 114, -218); };
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgb(88,96,112)'; ctx.lineWidth = 39; bras(); ctx.stroke();
  ctx.strokeStyle = 'rgb(212,218,228)'; ctx.lineWidth = 36.5; bras(); ctx.stroke();
  ctx.save(); ctx.translate(8, -2); ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 8; bras(); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.translate(-10, 3); ctx.strokeStyle = 'rgba(80,90,112,.38)'; ctx.lineWidth = 11; bras(); ctx.stroke(); ctx.restore();
  ctx.lineCap = 'butt';
  // le pied (lourd, émaillé) et la colonne où s'attache la potence
  bloc(12, -46, 62, 30, 7, email(12, 74));
  const gp = ctx.createLinearGradient(0, -20, 0, 0); gp.addColorStop(0, 'rgb(240,243,248)'); gp.addColorStop(.3, 'rgb(206,212,222)'); gp.addColorStop(1, 'rgb(128,136,152)');
  bloc(0, -20, 188, 20, [10, 10, 3, 3], gp);
  ctx.fillStyle = 'rgba(255,255,255,.75)'; rr(ctx, 6, -18.5, 176, 2.4, 1.2); ctx.fill();
  ctx.fillStyle = 'rgb(18,20,26)'; ctx.fillRect(14, 0, 28, 3.4); ctx.fillRect(146, 0, 28, 3.4);
  bloc(66, -13, 40, 7, 2, 'rgb(64,72,92)', null);
  ctx.fillStyle = l > .3 ? '#86efac' : '#3c4a44'; ctx.beginPath(); ctx.arc(28, -10, 2.8, 0, TAU); ctx.fill();
  // la lampe dans le pied, son faisceau
  bloc(112, -37, 38, 18, [5, 5, 0, 0], noir(112, 150));
  if (l > 0) {
    const gf = ctx.createLinearGradient(0, -36, 0, -112); gf.addColorStop(0, `rgba(255,244,180,${.6 * l})`); gf.addColorStop(1, `rgba(255,244,180,${.22 * l})`);
    ctx.fillStyle = gf; ctx.beginPath(); ctx.moveTo(120, -37); ctx.lineTo(142, -37); ctx.lineTo(138, -112); ctx.lineTo(124, -112); ctx.closePath(); ctx.fill();
    const gl = ctx.createRadialGradient(131, -37, 0, 131, -37, 26); gl.addColorStop(0, `rgba(255,246,190,${.85 * l})`); gl.addColorStop(1, 'rgba(255,246,190,0)'); ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(131, -37, 26, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = l > 0 ? rgba([mix(70, 255, l), mix(76, 248, l), mix(88, 200, l)], 1) : 'rgb(70,76,88)'; ctx.beginPath(); ctx.ellipse(131, -37, 13, 3.6, 0, 0, TAU); ctx.fill();
  // le support de la platine, le condenseur et son diaphragme
  bloc(50, -116, 44, 14, 3, email(50, 94));
  bloc(119, -104, 24, 17, 2, chrome(119, 143)); bloc(114, -92, 34, 5.5, 2, noir(114, 148)); ctx.fillStyle = 'rgb(30,32,40)'; ctx.fillRect(148, -91, 9, 2.6);
  // la platine : le dessus (vu un peu de haut), le chant, le côté
  const gpl = ctx.createLinearGradient(74, 0, 204, 0); gpl.addColorStop(0, 'rgb(40,44,54)'); gpl.addColorStop(.75, 'rgb(84,90,104)'); gpl.addColorStop(1, 'rgb(56,60,72)');
  ctx.fillStyle = gpl; ctx.beginPath(); ctx.moveTo(74, -112); ctx.lineTo(196, -112); ctx.lineTo(204, -123); ctx.lineTo(82, -123); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgb(20,22,28)'; ctx.fillRect(74, -112, 122, 8.5);
  ctx.fillStyle = 'rgb(44,48,58)'; ctx.beginPath(); ctx.moveTo(196, -112); ctx.lineTo(204, -123); ctx.lineTo(204, -114.5); ctx.lineTo(196, -103.5); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.fillRect(74, -112.6, 122, 1.2);
  ctx.fillStyle = l > 0 ? `rgba(255,246,196,${.35 + .65 * l})` : 'rgb(12,13,18)'; ctx.beginPath(); ctx.ellipse(135, -117.5, 9, 3.2, 0, 0, TAU); ctx.fill();
  // la lame sous ses deux valets
  if (o.lame) { ctx.save(); ctx.translate(135, -117.5); lameDessin(ctx, o.goutte, l); ctx.restore(); }
  for (const [px, tx] of [[100, 114], [172, 157]]) {
    ctx.lineCap = 'round'; ctx.strokeStyle = 'rgb(40,44,54)'; ctx.lineWidth = 4.6; ctx.beginPath(); ctx.moveTo(px, -121.5); ctx.lineTo(tx, -116.5); ctx.stroke();
    ctx.strokeStyle = 'rgb(224,229,237)'; ctx.lineWidth = 3; ctx.stroke(); ctx.lineCap = 'butt';
    const gv = ctx.createRadialGradient(px + .8, -122.3, .3, px, -121.5, 3.4); gv.addColorStop(0, '#ffffff'); gv.addColorStop(1, 'rgb(96,102,116)'); ctx.fillStyle = gv; ctx.beginPath(); ctx.arc(px, -121.5, 3.2, 0, TAU); ctx.fill();
  }
  // la tourelle (revolver) et ses trois objectifs ; celui du milieu est en service, au-dessus de la lame
  const objectif = (ang, len, bague) => {
    ctx.save(); ctx.translate(131, -186); ctx.rotate(ang);
    ctx.fillStyle = chrome(-8, 8); ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(8, 0); ctx.lineTo(8, len - 12); ctx.lineTo(4.4, len); ctx.lineTo(-4.4, len); ctx.lineTo(-8, len - 12); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(20,24,34,.75)'; ctx.lineWidth = .9; ctx.stroke();
    ctx.fillStyle = 'rgb(28,30,38)'; ctx.fillRect(-8, 5, 16, 6); ctx.fillStyle = bague; ctx.fillRect(-8, len * .5, 16, 4.2);
    ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.fillRect(2.4, 11, 2, len - 24);
    ctx.restore();
  };
  objectif(.62, 40, 'rgb(226,58,50)'); objectif(-.62, 46, 'rgb(246,200,40)'); objectif(0, 58, 'rgb(52,120,232)');
  ctx.fillStyle = noir(104, 158); ctx.beginPath(); ctx.moveTo(104, -186); ctx.lineTo(158, -186); ctx.lineTo(151, -202); ctx.lineTo(111, -202); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.ellipse(131, -186, 27, 7.5, 0, 0, TAU); ctx.fill(); ctx.strokeStyle = 'rgba(150,158,172,.6)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(131, -186, 27, 7.5, 0, 0, Math.PI); ctx.stroke();
  // la tête, le tube optique, l'oculaire et son œilleton
  bloc(119, -266, 24, 34, 2, noir(119, 143));
  bloc(98, -236, 68, 37, 11, email(98, 166));
  ctx.fillStyle = 'rgba(255,255,255,.7)'; rr(ctx, 106, -233, 52, 3, 1.5); ctx.fill();
  bloc(116.5, -241, 29, 6, 2, chrome(116.5, 145.5));
  bloc(122, -283, 18, 18, 2, chrome(122, 140)); bloc(118.5, -291, 25, 9.5, 3.5, noir(118.5, 143.5));
  // les deux vis de mise au point (la grosse et la fine), sur la potence
  const kx = 40, ky = -88;
  const gk = ctx.createRadialGradient(kx + 5, ky - 6, 1, kx, ky, 18); gk.addColorStop(0, 'rgb(128,136,152)'); gk.addColorStop(1, 'rgb(26,28,36)');
  ctx.fillStyle = gk; ctx.beginPath(); ctx.arc(kx, ky, 17.5, 0, TAU); ctx.fill(); ctx.strokeStyle = 'rgba(10,12,18,.9)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.strokeStyle = 'rgba(200,206,218,.5)'; ctx.lineWidth = 1; for (let i = 0; i < 28; i++) { const a = i / 28 * TAU; ctx.beginPath(); ctx.moveTo(kx + Math.cos(a) * 14.4, ky + Math.sin(a) * 14.4); ctx.lineTo(kx + Math.cos(a) * 17, ky + Math.sin(a) * 17); ctx.stroke(); }
  const gk2 = ctx.createRadialGradient(kx + 3, ky - 3, .5, kx, ky, 9); gk2.addColorStop(0, '#ffffff'); gk2.addColorStop(1, 'rgb(108,114,128)');
  ctx.fillStyle = gk2; ctx.beginPath(); ctx.arc(kx, ky, 8.6, 0, TAU); ctx.fill(); ctx.strokeStyle = 'rgba(20,24,34,.8)'; ctx.stroke();
  ctx.restore();
}
/** La lame de verre (vue un peu de haut), centrée à l'origine ; goutte 0..1 : la goutte de suspension posée dessus. */
function lameDessin(ctx, goutte = 0, lum = 0) {
  ctx.beginPath(); ctx.moveTo(-36, 3.6); ctx.lineTo(32, 3.6); ctx.lineTo(38, -3.6); ctx.lineTo(-30, -3.6); ctx.closePath();
  ctx.fillStyle = 'rgba(196,230,248,.62)'; ctx.fill(); ctx.strokeStyle = 'rgba(244,251,255,.95)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.moveTo(-28, 2.4); ctx.lineTo(-14, 2.4); ctx.lineTo(-9, -2.6); ctx.lineTo(-23, -2.6); ctx.closePath(); ctx.fill();
  if (goutte > 0) {
    const r = 8.5 * goutte, g = ctx.createRadialGradient(1.5, -1.4, .4, 0, 0, r); g.addColorStop(0, `rgba(255,${246 + 4 * lum},${214 + 20 * lum},.98)`); g.addColorStop(1, 'rgba(206,172,104,.92)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 0, r, r * .42, 0, 0, TAU); ctx.fill(); ctx.strokeStyle = 'rgba(120,90,40,.6)'; ctx.lineWidth = .8; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.ellipse(2.4, -1.2, r * .22, r * .1, 0, 0, TAU); ctx.fill();
  }
}
/** Le compte-gouttes : tube de verre effilé, poire en caoutchouc, un peu de suspension ; `pend` : la goutte au bout. */
function pipette(ctx, x, y, a, pend) {
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y);
  ctx.fillStyle = 'rgba(214,186,124,.85)'; ctx.beginPath(); ctx.moveTo(-1.2, -2); ctx.lineTo(1.2, -2); ctx.lineTo(3.4, -26); ctx.lineTo(3.4, -52); ctx.lineTo(-3.4, -52); ctx.lineTo(-3.4, -26); ctx.closePath(); ctx.fill();
  const gv = ctx.createLinearGradient(-5, 0, 5, 0); gv.addColorStop(0, 'rgba(240,250,255,.6)'); gv.addColorStop(.4, 'rgba(255,255,255,.12)'); gv.addColorStop(1, 'rgba(240,250,255,.45)');
  ctx.fillStyle = gv; ctx.beginPath(); ctx.moveTo(-1.6, 0); ctx.lineTo(1.6, 0); ctx.lineTo(4.6, -26); ctx.lineTo(4.6, -88); ctx.lineTo(-4.6, -88); ctx.lineTo(-4.6, -26); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(236,246,252,.9)'; ctx.lineWidth = 1.1; ctx.stroke();
  const gb = ctx.createRadialGradient(-3, -106, 1, 0, -102, 16); gb.addColorStop(0, 'rgb(236,120,96)'); gb.addColorStop(1, 'rgb(128,36,30)');
  ctx.fillStyle = gb; ctx.beginPath(); ctx.ellipse(0, -102, 9.5, 16, 0, 0, TAU); ctx.fill(); ctx.fillRect(-6, -90, 12, 5);
  if (pend > 0) { ctx.fillStyle = 'rgba(226,198,134,.95)'; ctx.beginPath(); ctx.ellipse(0, 2 + pend * 2, 2.6 * pend + .6, 3.4 * pend + .6, 0, 0, TAU); ctx.fill(); }
  ctx.restore();
}

/* ── Le champ rond du microscope ── */
const graineLevure = (i, bourgeon) => { for (let s = 300 + i * 41; ; s++) if ((graine(s)() > .45) === bourgeon) return s; };
const CHAMP = [[-.56, -.44, .112, 1, -.9], [-.12, -.64, .098, 1, .4], [.34, -.5, .118, 0, .2], [.64, -.16, .1, 1, 2.2], [.04, -.16, .128, 1, -.3], [-.44, .04, .108, 0, 1],
  [-.72, .3, .092, 1, 3.4], [-.2, .36, .112, 1, 1.9], [.34, .22, .11, 1, .6], [.68, .3, .088, 0, 0], [-.3, -.26, .07, 0, 0], [.42, .58, .08, 0, 1.2], [-.5, .62, .086, 1, -2.4]]
  .map((l, i) => [...l, graineLevure(i, !!l[3])]);
function champ(ctx, cx, cy, r, e, o) {
  const h = e.horloge, a = o.alpha ?? 1;
  ctx.save(); ctx.globalAlpha *= a;
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 5; ctx.fillStyle = 'rgb(8,10,14)'; ctx.beginPath(); ctx.arc(cx, cy, r + 7, 0, TAU); ctx.fill(); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.clip();
  const g = ctx.createRadialGradient(cx, cy, r * .15, cx, cy, r); g.addColorStop(0, 'rgb(236,244,250)'); g.addColorStop(.72, 'rgb(212,228,240)'); g.addColorStop(1, 'rgb(140,164,186)');
  ctx.fillStyle = g; ctx.fillRect(cx - r, cy - r, 2 * r, 2 * r);
  if (o.net > 0) {
    ctx.save(); ctx.globalAlpha *= o.net; if (o.net < 1 && 'filter' in ctx) ctx.filter = `blur(${((1 - o.net) * 5).toFixed(1)}px)`;
    CHAMP.forEach(([x, y, q, b, an, gr], i) => {
      const dx = Math.sin(h * .5 + i * 1.9) * 1.6, dy = Math.cos(h * .42 + i * 2.7) * 1.6;
      LX.levure(ctx, cx + x * r + dx, cy + y * r + dy, q * r, { angle: an + Math.sin(h * .2 + i) * .05, graine: gr, bourgeon: !!b });
    });
    ctx.restore();
  }
  if (o.echelle > 0) {
    const lb = r * .24, bx = cx + r * .06, by = cy + r * .74;

function dessiner(c, e) {

  /* ── Tableau 1 : ce qui s'écrit ── */
  const aT1 = (1 - borne(S.range * 5)) * .96;

    const nom = (s, x, y, cx, cy, o = {}) => { c.texte(s, x, y, { couleur: 'blanc', taille: 17, align: o.align || 'right', alpha: aT1, duree: .32 }); c.ligne(x + (o.align ? -2 : 5), y - tf * .32 + (o.dy || 0), cx, cy, { couleur: 'blanc', largeur: 1.3, alpha: .7 * aT1, duree: .12 }); };

    });
    if (e.p('microscope', .36, 1) > 0) e.ecrire(c, 't1_cap1', () => c.texte(CAP1, e.L / 2, 372, { couleur: 'blanc', taille: 18, align: 'center', alpha: aT1 }));
    if (S.noms) {
      const xd = G.cxF + G.rF + 12, l1 = CHAMP[3], l2 = CHAMP[8], p = (l, bud) => { const r = l[2] * G.rF, an = l[4]; return bud ? [G.cxF + l[0] * G.rF + (r * 1.25 * Math.cos(an) + r * .35 * Math.sin(an)), G.cyF + l[1] * G.rF + (r * 1.25 * Math.sin(an) - r * .35 * Math.cos(an))] : [G.cxF + l[0] * G.rF + r * .7, G.cyF + l[1] * G.rF]; };

        c.texte('bourgeon', xd, G.cyF + 66, { couleur: COUL.levure, taille: 17, alpha: aT1, gras: true }); c.ligne(xd - 3, G.cyF + 66 - tf * .3, b[0], b[1], { couleur: '#0b1f2a', largeur: 1.5, alpha: .85 * aT1 });
      });

  }
  if (e.compact && enT1) { if (S.noms) e.bandeau = { texte: CAP2, couleur: 'blanc' }; else if (e.p('microscope', .36, 1) > 0) e.bandeau = { texte: CAP1, couleur: 'blanc' }; }

      if (S.lameA > .5) { const p = S.va >= 1 ? G.lameP : G.lameT; if (S.va <= 0 || S.va >= 1) c.repere('lame', p[0] - 42, p[1] - 12, 84, 22, 'la lame et sa goutte de suspension de levures'); }
      if (S.champ > .9) c.repere('champ', G.cxF - G.rF - 6, G.cyF - G.rF - 6, 2 * G.rF + 12, 2 * G.rF + 12, 'le champ du microscope : des levures bourgeonnantes');

    } else if (S.range >= 1 && !e.compact) {
      const f = G.vig.f, vx = G.vig.x, vy = G.vig.y;

      c.repere('champ', vx + (G.cxF - G.rF) * f, vy + (G.cyF - G.rF) * f, 2 * G.rF * f, 2 * G.rF * f, 'le champ du microscope (rangé)');

  /* ── Tableau 2 : les six noms, un par moment, puis « unicellulaire » ── */

    for (const id of LEGS) {
      if (!quandLeg(e, id)) continue;
      const [cote, ly, tx, ty] = PLACES[id], x = cote < 0 ? G.xl : G.xr, y = Y + ly * k * pas + tlf * .34, px = X + tx * k, py = Y + ty * k, w = c.largeurTexte(NOMS[id], tlf) * 1.08;
      e.ecrire(c, 'leg_' + id, () => {

        c.ligne(x + cote * -6, y - tlf * .34, px, py, { couleur: COUL[id], largeur: 1.8, alpha: .9 * S.t2 });

    }
    if (S.t2 > .5) {
      const B = (x, y, w, h) => [X + x * k, Y + y * k, w * k, h * k], [vx, vy, vrx, vry] = ORG.vac, [nx, ny, nr] = ORG.noy, m = ORG.mitos[0];
      c.repere('cellule', ...B(-172, -150, 344, 284), 'la levure agrandie, en coupe');
      c.repere('paroi', ...B(-172, -70, 30, 140), 'la paroi (l’enveloppe épaisse, à l’extérieur)');
      c.repere('membrane', ...B(104, 44, 44, 44), 'la membrane (le liseré doré sous la paroi)');
      c.repere('noyau', ...B(nx - nr - 3, ny - nr - 3, 2 * nr + 6, 2 * nr + 6), 'le noyau (violet)');
      c.repere('vacuole', ...B(vx - vrx - 3, vy - vry - 3, 2 * vrx + 6, 2 * vry + 6), 'la vacuole (gris-bleu)');
      c.repere('hyaloplasme', ...B(-136, -66, 44, 44), 'le hyaloplasme (le liquide vert de la cellule)');

      ORG.mitos.slice(1).forEach((q, i) => c.repere('mitochondrie_' + (i + 2), ...B(q[0] - 40, q[1] - 22, 80, 44), 'une autre mitochondrie'));
    }

        e.ecrire(c, 'uni', () => { c.texte(UNI, X, y, { couleur: 'vert', taille: t, align: 'center', gras: true, alpha: aT2 }); c.rect(X - w / 2, y - 23, w, 33, { couleur: 'vert', largeur: 1.8, arrondi: 8, fond: 'vert', fondAlpha: .09 * S.t2, alpha: .9 * S.t2 }); });

    if (e.p(pid, t0 + .13, 1) > 0) e.ecrire(c, 'coupe_' + i, () => parts.slice(1).forEach((s, j) => c.texte('·', xs[j + 1] - esp / 2, M_.y - tm * .06, { couleur: 'blanc', taille: M_.t, align: 'center', gras: true, duree: .12 })));

    sens.forEach(([txt, quand, coul], j) => {

/* ── Téléphone : la boîte à montrer pour l'étape en cours ── */
function foyer(e) {
  const G = geo(e.L, true), id = e.etape(), { mx, my, X, Y, k } = G;
  const scope = { x: mx - 108, y: 30, w: 440, h: 312 }, vue = { x: G.cxF - G.rF - 70, y: G.cyF - G.rF - 14, w: 2 * G.rF + 140, h: 2 * G.rF + 28 };
  const cell = { x: X - 250, y: 36, w: 500, h: 330 };
  if (id === 'microscope') return scope;
  if (id === 'champ') return e.p('champ') < .12 ? scope : vue;
  if (id.startsWith('leg_')) {
    const nom = id.slice(4);
    if (nom === 'paroi' && e.p(id) < .5) return e.p(id) < .1 ? vue : cell;
    const [cote, ly, tx, ty] = PLACES[nom], cy = Y + (ly * 1.12 + ty) / 2 * k;
    return { x: cote < 0 ? G.xl - 130 : G.xr + 136 - 420, y: Math.max(34, Math.min(420 - 204, cy - 102)), w: 420, h: 204 };
  }
  if (id === 'une_cellule') return cell;
  const B = G.boc[id === 'anaerobie' && e.p('anaerobie') > 0 ? 1 : 0];
  if (id === 'aerobie' && e.p('aerobie') < .1) return cell;
  return { x: B.x0, y: 6, w: e.L / 2, h: 218 };
}

/* ── Ce qui se voit ── */
function voit(e) {
  const S = etat(e);
  if (!e.des('leg_paroi')) {
    if (S.scope < .5) return 'Tableau 1 : la paillasse est encore vide.';
    let s = 'Tableau 1. Un microscope optique peint (pied, potence, platine, tourelle à trois objectifs, tube, oculaire, vis de mise au point, lampe)';
    s += S.va >= 1 ? ` ; la lame, avec sa goutte de suspension de levures, est sur la platine, sous les valets${S.lum > .5 ? ' ; la lampe est allumée' : ''}.`
      : S.goutte ? ' ; à sa droite, sur la paillasse, une lame porte une goutte de suspension de levures.' : S.pip > 0 ? ' ; un compte-gouttes dépose une goutte de suspension de levures sur une lame posée sur la paillasse.' : ' ; une lame de verre est posée sur la paillasse.';
    if (S.labels) s += ' Noms écrits : oculaire, objectifs, lame, platine, lumière, mise au point.';
    if (S.champ > .5) s += ` À droite, le champ rond du microscope${S.net >= 1 ? ' : treize levures (cellules ovales beiges), la plupart avec un bourgeon' : ' (la mise au point se fait)'}${S.noms ? ' ; « levure » et « bourgeon » sont écrits à côté' : ''}${S.ech >= 1 ? ' ; en bas du champ, la barre d’échelle « 1,5 µm »' : ''}.`;
    return s;
  }
  if (!e.des('aerobie') || S.t2 > .5) {
    if (S.cell < 1) return 'Le microscope et son champ se rangent en petit, en bas à gauche ; une levure du champ s’agrandit au centre.';
    const faits = LEGS.filter(id => quandLeg(e, id)).map(id => NOMS[id]);
    return `Tableau 2. Une levure agrandie, peinte en coupe, avec son bourgeon : paroi épaisse beige, membrane dorée dessous, hyaloplasme vert, grande vacuole gris-bleu, noyau violet, trois mitochondries (deux membranes et des crêtes). Noms déjà écrits, avec leur trait de rappel : ${faits.length ? faits.join(', ') : 'aucun encore'}.${e.des('une_cellule') ? ` En bas, encadré en vert : « ${UNI} ».` : ''} Le microscope est rangé en petit, en bas à gauche.`;
  }
  let s = 'Tableau 3. ';
  s += S.b1 < .5 ? 'La levure s’efface.' : `À gauche, un bocal ouvert contient une suspension de levures${S.air1 > 0 ? ' ; des molécules de dioxygène (deux billes rouges) de l’air y entrent, des bulles montent dans le liquide' : ''}.`;
  if (e.p('aerobie', .44, 1) > 0) s += ` Dessous, le mot « aéro·bie » en jaune${e.p('aerobie', .6, 1) > 0 ? ', découpé : aéro = air' : ''}${e.p('aerobie', .72, 1) > 0 ? ', bie = vie' : ''}${e.p('aerobie', .84, 1) > 0 ? ' ; encadré en vert : « vit avec dioxygène »' : ''}.`;
  if (e.des('anaerobie')) {
    s += S.b2 < .5 ? '' : ` À droite, un deuxième bocal${S.couv >= 1 ? ' fermé par un couvercle rouge vissé : les molécules de dioxygène rebondissent dessus, aucune n’entre' : S.couv > 0 ? ' : le couvercle se visse' : ''}.`;
    if (e.p('anaerobie', .4, 1) > 0) s += ` Dessous, le mot « an·aéro·bie »${e.p('anaerobie', .56, 1) > 0 ? ', découpé : an = sans' : ''}${e.p('anaerobie', .68, 1) > 0 ? ', aéro = air' : ''}${e.p('anaerobie', .76, 1) > 0 ? ', bie = vie' : ''}${e.p('anaerobie', .84, 1) > 0 ? ' ; encadré en vert : « vit sans dioxygène »' : ''}.`;
  }
  return s;
}
