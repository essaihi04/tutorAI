<script>
/*
 * La centrifugation (cours de référence SVT, diapositives rf_m1_principe et rf_m1_etapes), 27 novembre 2026.
 *   ?vue=principe (défaut) : manege (l'essoreuse à salade : en tournant vite, l'eau est chassée vers le bord) → tube (un tube
 *     qui tourne autour d'un axe, grains lourds et légers) → culot (les lourds au fond = culot, le liquide = surnageant).
 *   ?vue=etapes : foie (fragments de foie dans la solution de saccharose) → broyage (le piston écrase, les cellules éclatent :
 *     noyaux et mitochondries libérés, dans la loupe) → centri1 (la centrifugeuse tourne à faible vitesse, le compteur monte)
 *     → culot_noyaux (les noyaux se déposent un à un au fond du tube agrandi) — ARRÊT pour l'observation : les petits grains
 *     orange restent en suspension, rien ne les nomme dans le tube — → surnageant (versé dans un nouveau tube) → centri2
 *     (grande vitesse) → culot_mitochondries (elles se déposent une à une) → bilan (les deux culots, comptés 1 et 2).
 * Document du professeur : aucune valeur chiffrée (« faible vitesse », « grande vitesse ») ; les tours par minute de
 * l'afficheur (1 000 puis 12 000) ne sont qu'un ordre de grandeur pour l'œil. Les rotations sont calculées sur t : une image
 * figée est stable. Noyau = violet du lexique, mitochondrie = Lexique.mitochondrie. La verrerie (tube conique de
 * centrifugation qui s'incline, broyeur à piston) est peinte ici : Lexique.chimie.tube est un tube à essais droit, sans culot.
 */
const R2 = window.Ref2, P = window.SVTPeinture, LX = window.Lexique, { mix, doux, borne, rgba, TAU } = R2;
const VUE = R2.QS.get('vue') === 'etapes' ? 'etapes' : 'principe';
const fmt = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

/* Profil de vitesse en trapèze (monte sur [0, a], plein sur [a, b], redescend sur [b, 1]) et son intégrale. */
const trapV = (u, a, b) => (u <= 0 || u >= 1 ? 0 : u < a ? u / a : u > b ? (1 - u) / (1 - b) : 1);
const trapI = (u, a, b) => { u = borne(u); if (u < a) return u * u / (2 * a); if (u <= b) return a / 2 + (u - a); const d = 1 - b, x = u - b; return a / 2 + (b - a) + x - x * x / (2 * d); };

/* ── La verrerie peinte ─────────────────────────────────────────────────────────────────────────── */
const fond = (w, rond) => (rond ? .5 : .95) * w;
function formeTube(ctx, w, h, rond) {
  const b = fond(w, rond); ctx.beginPath(); ctx.moveTo(-w / 2, 0); ctx.lineTo(-w / 2, h - b);
  ctx.bezierCurveTo(-w / 2, h - b * .35, -w * .2, h, 0, h); ctx.bezierCurveTo(w * .2, h, w / 2, h - b * .35, w / 2, h - b); ctx.lineTo(w / 2, 0);
}
/** Demi-largeur intérieure du tube à la profondeur y. */
function demi(y, w, h, rond) { const b = fond(w, rond); if (y <= h - b) return w / 2; const v = (y - (h - b)) / b; return w / 2 * Math.sqrt(Math.max(0, 1 - v * v * .97)); }
/**
 * Un tube de verre : (x, y) = milieu de l'ouverture, o.ang (rotation autour de l'ouverture), o.liq (teinte), o.niveau
 * (ligne de surface, relative à l'ouverture : horizontale dans le monde, ou le long du tube si o.local), contenu(ctx) dessiné
 * dans le verre (coordonnées du tube : x de −w/2 à w/2, y de 0 à h).
 */
function tube(ctx, x, y, w, h, o = {}, contenu) {
  const a = o.alpha ?? 1; if (a <= .02) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); if (o.ang) ctx.rotate(o.ang);
  ctx.fillStyle = 'rgba(200,225,240,.10)'; formeTube(ctx, w, h, o.rond); ctx.fill();
  ctx.save(); formeTube(ctx, w, h, o.rond); ctx.closePath(); ctx.clip();
  if (o.liq) {
    ctx.save(); if (o.ang && !o.local) ctx.rotate(-o.ang);
    const g = ctx.createLinearGradient(0, o.niveau, 0, o.niveau + h), la = o.la ?? .5;
    g.addColorStop(0, rgba(o.liq.map(v => Math.min(255, v + 30)), la)); g.addColorStop(1, rgba(o.liq, la + .2));
    ctx.fillStyle = g; ctx.fillRect(-h * 1.3, o.niveau, h * 2.6, h * 2.6);
    ctx.fillStyle = 'rgba(240,248,255,.55)'; ctx.fillRect(-h * 1.3, o.niveau - .8, h * 2.6, 1.6);
    ctx.restore();
  }
  contenu && contenu(ctx);
  ctx.restore();
  ctx.strokeStyle = 'rgba(225,240,252,.9)'; ctx.lineWidth = o.trait ?? 2; formeTube(ctx, w, h, o.rond); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, 0, w / 2 + 2, Math.max(1.5, w * .06), 0, 0, TAU); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = Math.max(1, w * .09); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-w / 2 + w * .17, w * .2); ctx.lineTo(-w / 2 + w * .17, h - w * 1.05); ctx.stroke();
  if (o.grad) { ctx.strokeStyle = 'rgba(225,240,252,.4)'; ctx.lineWidth = 1; for (let i = 1; i < 6; i++) { const yy = h * i / 7 + 6; ctx.beginPath(); ctx.moveTo(w / 2 - 9, yy); ctx.lineTo(w / 2 - 2, yy); ctx.stroke(); } }
  ctx.restore();
}
/** Les places d'un dépôt de n grains de rayon r au fond du tube (du fond vers le haut). */
function pile(n, r, w, h, rond, serre = 1.72) {
  const out = []; let y = h - r - 3;
  while (out.length < n && y > 0) {
    const hw = Math.max(0, demi(y + r * .7, w, h, rond) - r - 2.5), k = Math.floor(hw / r) + 1, pas = k > 1 ? 2 * hw / (k - 1) : 0;
    for (let i = 0; i < k && out.length < n; i++) out.push([k > 1 ? -hw + i * pas : 0, y]);
    y -= r * serre;
  }
  return out;
}
/** n places au hasard (fixe) dans le liquide du tube. */
function semis(n, graine, r, w, h, rond, haut) {
  const g = P.graine(graine), out = [];
  for (let i = 0; i < n; i++) { const y = haut + r + g() * (h - haut - 3 * r - 6), hw = Math.max(0, demi(y + r, w, h, rond) - r - 3); out.push([(g() * 2 - 1) * hw, y, g() * TAU]); }
  return out;
}
/** Un noyau libre : boule violette du lexique, avec son nucléole. */
function noyau(ctx, x, y, r, a = 1) {
  if (a <= .02) return;
  ctx.save(); ctx.globalAlpha *= a;
  const g = ctx.createRadialGradient(x - r * .3, y - r * .3, r * .1, x, y, r);
  g.addColorStop(0, rgba([210, 180, 255], .98)); g.addColorStop(.6, rgba(P.T.noyau, .96)); g.addColorStop(1, rgba([78, 50, 150], .98));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.strokeStyle = rgba([60, 36, 120], .9); ctx.lineWidth = Math.max(.8, r * .12); ctx.stroke();
  ctx.fillStyle = rgba([60, 30, 120], .7); ctx.beginPath(); ctx.arc(x + r * .25, y + r * .18, r * .3, 0, TAU); ctx.fill();
  ctx.restore();
}
/** Une petite mitochondrie libre (celle du lexique, en petit). */
function mito(ctx, x, y, rx, ang, a = 1) {
  if (a <= .02) return;
  ctx.save(); ctx.globalAlpha *= a; LX.mitochondrie(ctx, x, y, rx, rx * .52, { angle: ang, cretes: rx > 9 ? 4 : 3, grains: 0 }); ctx.restore();
}

/* ══ Vue « principe » ══════════════════════════════════════════════════════════════════════════════ */
const FEUILLES = (() => { const g = P.graine(5), out = []; for (let i = 0; i < 11; i++) out.push([.15 + g() * .45, g() * TAU, 13 + g() * 9, g() * TAU, g()]); return out; })();
function essoreuse(ctx, cx, cy, R, ang, k, t) {
  ctx.save();
  // le bol transparent, son ombre
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(cx + 4, cy + 8, R * 1.02, R * 1.02, 0, 0, TAU); ctx.fill();
  const gb = ctx.createRadialGradient(cx - R * .3, cy - R * .35, R * .1, cx, cy, R);
  gb.addColorStop(0, 'rgba(225,240,248,.30)'); gb.addColorStop(.8, 'rgba(170,205,225,.20)'); gb.addColorStop(1, 'rgba(235,245,252,.45)');
  ctx.fillStyle = gb; ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(235,245,252,.85)'; ctx.lineWidth = 3; ctx.stroke();
  // l'eau chassée contre la paroi du bol
  if (k > 0) { ctx.strokeStyle = rgba([90, 180, 240], .3 + .6 * k); ctx.lineWidth = 2 + 7 * k; ctx.beginPath(); ctx.arc(cx, cy, R - 5, 0, TAU); ctx.stroke(); }
  // le panier à fentes (il tourne)
  const rp = R * .8;
  ctx.fillStyle = 'rgba(70,170,90,.22)'; ctx.beginPath(); ctx.arc(cx, cy, rp, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(96,205,120,.95)'; ctx.lineWidth = 7; ctx.stroke();
  ctx.strokeStyle = 'rgba(12,50,26,.85)'; ctx.lineWidth = 2.6;
  for (let i = 0; i < 28; i++) { const a = ang + i * TAU / 28; ctx.beginPath(); ctx.moveTo(cx + (rp - 3.4) * Math.cos(a), cy + (rp - 3.4) * Math.sin(a)); ctx.lineTo(cx + (rp + 3.4) * Math.cos(a), cy + (rp + 3.4) * Math.sin(a)); ctx.stroke(); }
  // la salade : des feuilles plaquées vers le panier quand ça tourne
  for (const [d, a0, s, rot, v] of FEUILLES) {
    const d2 = mix(d, .5 + .22 * v, k) * rp, a = a0 + ang, x = cx + d2 * Math.cos(a), y = cy + d2 * Math.sin(a);
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot + ang);
    const g = ctx.createRadialGradient(-s * .3, -s * .3, 1, 0, 0, s); g.addColorStop(0, rgba([190, 235, 120], .98)); g.addColorStop(1, rgba([60 + 40 * v, 150 + 30 * v, 60], .96));
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-s, 0); ctx.bezierCurveTo(-s * .6, -s * .9, s * .5, -s * .8, s, -s * .1); ctx.bezierCurveTo(s * .7, s * .7, -s * .4, s * .9, -s, 0); ctx.fill();
    ctx.strokeStyle = 'rgba(225,250,190,.55)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-s * .8, 0); ctx.quadraticCurveTo(0, -s * .15, s * .8, -s * .05); ctx.stroke();
    ctx.restore();
  }
  // les gouttes d'eau qui traversent le panier et filent vers le bord
  if (k > 0) for (let i = 0; i < 30; i++) {
    const p = (t * 1.25 + i * .618) % 1, a = i * 2.399 + ang * .55 + p * .7, rr = mix(rp * .92, R - 7, p);
    LX.bille(ctx, cx + rr * Math.cos(a), cy + rr * Math.sin(a), 3.6, [150, 215, 255], { alpha: k * (1 - p * .5) });
  }
  // le couvercle : le bouton et sa manivelle
  ctx.fillStyle = 'rgba(40,46,56,.95)'; ctx.beginPath(); ctx.arc(cx, cy, R * .17, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(190,200,214,.95)'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + R * .34 * Math.cos(ang * 1.0), cy + R * .34 * Math.sin(ang * 1.0)); ctx.stroke();
  LX.bille(ctx, cx + R * .34 * Math.cos(ang), cy + R * .34 * Math.sin(ang), 6.5, [230, 90, 70]);
  LX.bille(ctx, cx, cy, 5, [150, 158, 172]);
  ctx.restore();
}
const TP = { w: 40, h: 130, r0: 20, niv: 18 };
const LOURDS = semis(9, 31, 4.6, TP.w, TP.h, false, TP.niv), LEGERS = semis(16, 47, 2.4, TP.w, TP.h, false, TP.niv), PILE_L = pile(9, 4.6, TP.w, TP.h, false);
function principe(c, t, e) {
  const { ctx, sx, M, DEB } = e, tt = e.tel ? e.taille(17) : e.taille(17);
  const S = { x: sx(150), y: 215, R: 105 }, A = { x: sx(540), y: 228 };
  // l'essoreuse : elle accélère pendant « manege », puis continue de tourner
  const tau = Math.max(0, t - .4), rampe = 2.2, w = 7.5, ang = tau < rampe ? w * tau * tau / (2 * rampe) : w * (tau - rampe / 2), k = doux(borne(tau / rampe));
  c.direct(() => essoreuse(ctx, S.x, S.y, S.R, ang, k, t));
  c.repere('essoreuse', S.x - S.R - 4, S.y - S.R - 4, 2 * S.R + 8, 2 * S.R + 8, 'l’essoreuse à salade');
  e.si('manege', .05, 'n_ess', () => c.texte('l’essoreuse à salade', S.x, 92, { couleur: 'jaune', taille: 18, align: 'center' }));
  e.si('manege', .55, 'eau', () => c.texte('l’eau est chassée vers le bord', S.x, 334 + tt, { couleur: 'blanc', taille: 17, align: 'center' }));
  if (e.vu('manege', .55)) c.repere('bord', S.x - e.larg('l’eau est chassée vers le bord', 17) / 2 - 4, 334, e.larg('l’eau est chassée vers le bord', 17) + 8, tt * 1.4, 'l’eau est chassée vers le bord');

  // le tube qui tourne autour de son axe
  if (!e.vu('tube', .02)) return;
  const tStop = DEB.culot + .45 * (M.culot - DEB.culot), uT = borne((t - DEB.tube) / (tStop - DEB.tube));
  const th = Math.PI / 2 - TAU * 6 * (1 - trapI(uT, .25, .7) / trapI(1, .25, .7)), v = trapV(uT, .25, .7), sd = doux(borne((uT - .18) / .62));
  const ap = e.d('tube', .02, .15), rB = TP.r0 + TP.h;
  const unTube = (a, al) => tube(ctx, A.x + TP.r0 * Math.cos(a), A.y + TP.r0 * Math.sin(a), TP.w, TP.h, { ang: a - Math.PI / 2, liq: [150, 200, 235], niveau: TP.niv, local: true, alpha: al }, al > .5 ? (g) => {
    LEGERS.forEach(([x, y, ph], i) => LX.bille(g, x + 1.5 * Math.sin(t * 2 + ph), y + 1.5 * Math.cos(t * 1.7 + ph), 2.4, [250, 236, 180]));
    LOURDS.forEach(([x, y], i) => { const s = doux(borne(sd * 1.6 - i * .06)); LX.bille(g, mix(x, PILE_L[i][0], s), mix(y, PILE_L[i][1], s), 4.6, [150, 84, 56]); });
  } : null);
  c.direct(() => {
    ctx.save(); ctx.globalAlpha = ap;
    ctx.setLineDash([4, 7]); ctx.strokeStyle = 'rgba(226,232,240,.22)'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(A.x, A.y, rB + 2, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    for (let g = 3; g >= 1; g--) if (v > .15) unTube(th - g * .16 * v, .1 * v);      // la traînée du mouvement
    ctx.strokeStyle = 'rgba(170,178,192,.95)'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(A.x + TP.r0 * Math.cos(th), A.y + TP.r0 * Math.sin(th)); ctx.stroke();
    unTube(th, 1);
    LX.bille(ctx, A.x, A.y, 9, [150, 158, 172]);
    ctx.restore();
  });
  e.si('tube', .1, 'n_tube', () => c.texte('un tube qui tourne très vite', A.x, 64, { couleur: 'jaune', taille: 18, align: 'center' }));
  if (v > 0) e.si('tube', .2, 'sens', () => { const pts = []; for (let i = 0; i <= 10; i++) { const a = -2.5 + i * .1; pts.push([A.x + (rB + 12) * Math.cos(a), A.y + (rB + 12) * Math.sin(a)]); } c.trait(pts, { couleur: 'faible', largeur: 2 }); const [x, y] = pts[10]; c.trait([[x - 11, y - 2], [x, y], [x - 5, y + 10]], { couleur: 'faible', largeur: 2, duree: .1 }); });
  const arrete = uT >= 1;
  if (arrete) c.repere('tube', A.x - TP.w / 2 - 5, A.y + TP.r0 - 5, TP.w + 10, TP.h + 10, 'le tube, à l’arrêt');
  else c.repere('tube', A.x - rB - 4, A.y - rB - 4, 2 * rB + 8, 2 * rB + 8, 'le tube qui tourne autour de l’axe');
  // la clé des grains : entre l'essoreuse et le tube (téléphone : à droite du cercle, la fenêtre ne montre pas l'essoreuse)
  if (e.S.legendes && e.vu('tube', .55)) {
    const xg = e.tel ? A.x + rB + 30 : A.x - rB - 14 - e.larg('grains lourds', 17), y1 = (e.tel ? 300 : 340) + tt * .2, y2 = y1 + tt * 1.25;
    e.ecrire('n_grains', () => { c.texte('grains lourds', xg, y1, { couleur: 'blanc', taille: 17 }); c.texte('grains légers', xg, y2, { couleur: 'blanc', taille: 17 }); });
    c.direct(() => { LX.bille(ctx, xg - 12, y1 - tt * .3, 4.6, [150, 84, 56]); LX.bille(ctx, xg - 12, y2 - tt * .3, 2.6, [250, 236, 180]); });
  }
  // les deux mots : le culot (au fond), le surnageant (le liquide au-dessus)
  const yT = A.y + TP.r0, xl = A.x + TP.w / 2 + 26;
  if (e.si('culot', .5, 'm_culot', () => { c.ligne(A.x + TP.w / 2 - 2, yT + TP.h - 14, xl - 5, yT + TP.h - 14, { couleur: 'jaune', largeur: 1.6 }); c.texte('culot', xl, yT + TP.h - 8, { couleur: 'jaune', taille: 19 }); }))
    c.repere('culot', A.x - TP.w / 2 - 4, yT + TP.h - 34, TP.w + 34 + e.larg('culot', 19), 38, 'le culot : ce qui est lourd, au fond');
  if (e.si('culot', .72, 'm_surn', () => { c.ligne(A.x + TP.w / 2 - 2, yT + 52, xl - 5, yT + 52, { couleur: 'jaune', largeur: 1.6 }); c.texte('surnageant', xl, yT + 58, { couleur: 'jaune', taille: 19 }); }))
    c.repere('surnageant', A.x - TP.w / 2 - 4, yT + 18, TP.w + 34 + e.larg('surnageant', 19), 64, 'le surnageant : le liquide au-dessus du culot');
  if (e.si('culot', .88, 'concl', () => R2.encadre(c, 'le plus lourd va au fond', A.x, 407, { taille: 18 })))
    c.repere('conclusion', A.x - e.larg('le plus lourd va au fond', 18) / 2 - 12, 387, e.larg('le plus lourd va au fond', 18) + 24, 32, 'le plus lourd va au fond');
}
function phasePrincipe(t, e) {
  if (!e.vu('manege')) return 'Une essoreuse à salade peinte, vue de dessus, à l’arrêt : le bol, le panier vert à fentes, les feuilles de salade.';
  if (!e.vu('tube', .02)) return 'L’essoreuse à salade tourne vite : les feuilles sont plaquées contre le panier, les gouttes d’eau traversent le panier et filent vers le bord du bol' + (e.vu('manege', .55) ? ' ; écrit : « l’eau est chassée vers le bord ».' : '.');
  if (!e.vu('culot')) return 'À droite, un tube rempli d’un liquide tourne très vite autour d’un axe ; dedans, des grains lourds (gros, bruns) et des grains légers (petits, clairs) : les grains lourds glissent vers le fond du tube, les légers restent dans le liquide.';
  if (!e.vu('culot', .5)) return 'Le tube ralentit et s’arrête, le fond vers le bas : tous les grains lourds sont tassés au fond.';
  return 'Le tube est à l’arrêt. Les grains lourds, au fond, forment le « culot »' + (e.vu('culot', .72) ? ' ; le liquide au-dessus, avec les grains légers, est le « surnageant »' : '') + (e.vu('culot', .88) ? ' ; encadré : « le plus lourd va au fond ».' : '.');
}

/* ══ Vue « étapes » ════════════════════════════════════════════════════════════════════════════════ */
const TA = { y: 110, w: 64, h: 220, niv: 40 }, TC = { y: 110, w: 56, h: 200, niv: 34 }, LOUPE = { y: 262, r: 58 };
const SACC = [150, 200, 235], BROYAT = [208, 150, 122], SURN = [226, 190, 140], CLAIR = [196, 214, 228];
const MORCEAUX = (() => { const g = P.graine(12), out = []; for (let i = 0; i < 7; i++) { const pts = [], n = 6; for (let j = 0; j < n; j++) pts.push([Math.cos(j * TAU / n) * (.7 + g() * .5), Math.sin(j * TAU / n) * (.7 + g() * .5)]); out.push({ x: (g() * 2 - 1) * 16, y: TA.h - 22 - (i % 4) * 15 - g() * 6, s: 9 + g() * 4, pts, rot: g() * TAU }); } return out; })();

/** Le piston du broyeur : tige de métal, poignée, tête de téflon rainurée (yT : le haut de la tête). */

/** La centrifugeuse de paillasse : corps de métal, cuve, rotor à six tubes inclinés (angle th), couvercle transparent, afficheur. */
function centrifugeuse(ctx, cx, th, v, o) {

    ctx.strokeStyle = 'rgba(28,36,48,.85)'; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    if (o.liq) { ctx.strokeStyle = rgba(o.liq, .95); ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(mix(x1, x2, .3), mix(y1, y2, .3)); ctx.lineTo(x2, y2); ctx.stroke(); }

function etapes(c, t, e) {
  const { ctx, sx, M, DEB } = e, X = { A: sx(70), L: sx(190), B: sx(350), C: sx(560), D: sx(690) }, tt = e.taille(17), leg = e.S.legendes;

    c.repere('loupe', X.L - r - 3, cy - r - 3, 2 * r + 6, 2 * r + 6, e.vu('broyage', .68) ? 'à la loupe : les cellules ont éclaté' : 'à la loupe : les cellules du foie');
    const yc = cy + r + 4 + tt;

    // la clé : les deux organites libérés

      const yk = yc + tt * 1.4, wn = e.larg('noyau', 17), wm = e.larg('mitochondrie', 17), x0 = Math.max(10, X.L - (wn + wm + 66) / 2);

    const ecrisCulot = (nom, a, cle, x, l2, id, label) => {
      if (e.vu(nom, a)) c.repere(id, x - TC.w / 2 - 3, TC.y + TC.h - 62, TC.w + 6, 66, label);
      if (leg) e.si(nom, a, cle, () => { c.texte('culot riche', x, TC.y + TC.h + 10 + tt, { couleur: 'jaune', taille: 17, align: 'center' }); c.texte(l2, x, TC.y + TC.h + 10 + tt * 2.18, { couleur: 'jaune', taille: 17, align: 'center' }); });
    };
    if (pv < .02) ecrisCulot('culot_noyaux', .9, 'n_culot1', X.C, 'en noyaux', 'culot_noyaux', 'le 1er culot : riche en noyaux');
    else if (leg && e.fait('culot_noyaux')) e.ecrire('n_culot1', () => { c.texte('culot riche', X.C, TC.y + TC.h + 10 + tt, { couleur: 'jaune', taille: 17, align: 'center' }); c.texte('en noyaux', X.C, TC.y + TC.h + 10 + tt * 2.18, { couleur: 'jaune', taille: 17, align: 'center' }); });
    ecrisCulot('culot_mitochondries', .9, 'n_culot2', X.D, 'en mitochondries', 'culot_mitochondries', 'le 2e culot : riche en mitochondries');
    // le surnageant : le liquide au-dessus du culot (dans le tube 1, puis dans le nouveau tube une fois versé)
    if (e.vu('culot_noyaux', .6)) {
      if (q > .5 && pv < .02) c.repere('surnageant', X.C - TC.w / 2 - 3, TC.y + TC.niv - 4, TC.w + 6, TC.h - TC.niv - 62, 'le surnageant : le liquide au-dessus du culot');
      else if (q <= .5 && !e.vu('culot_mitochondries', .45)) c.repere('surnageant', X.D - TC.w / 2 - 3, TC.y + TC.niv - 4, TC.w + 6, TC.h - TC.niv - 8, 'le surnageant, versé dans un nouveau tube');
      else if (e.vu('culot_mitochondries', .45)) c.repere('surnageant', X.D - TC.w / 2 - 3, TC.y + TC.niv - 4, TC.w + 6, TC.h - TC.niv - 62, 'le dernier surnageant');
    }
    if (!(e.tel && e.etape === 'centri2')) e.si('surnageant', .9, 'm_surn', () => c.texte('surnageant', X.D, TC.y - 14, { couleur: 'jaune', taille: 18, align: 'center' }));
  }
  // ── le bilan ──
  if (e.vu('bilan', .35)) {
    const s = 'du plus lourd (noyaux) au plus léger (mitochondries)', x = e.tel ? 729 : Math.min(sx(500), e.L - e.larg(s, 18) / 2 - 22);
    e.ecrire('bilan', () => R2.encadre(c, s, x, 404, { taille: 18 }));
    c.repere('conclusion', x - e.larg(s, 18) / 2 - 12, 384, e.larg(s, 18) + 24, 32, 'on sépare les organites du plus lourd au plus léger');
  }
}
function comptesEtapes(t, e) { return e.vu('bilan', .05) ? [{ id: 'culot_noyaux', n: 1, fort: e.u('bilan') < .3 }, { id: 'culot_mitochondries', n: 2, fort: e.u('bilan') >= .3 }] : []; }
function phaseEtapes(t, e) {
  if (!e.vu('foie')) return 'À gauche le broyeur (un tube de verre rempli d’une solution de saccharose), au centre la centrifugeuse à l’arrêt (compteur à 0 tr/min).';
  if (!e.vu('broyage')) return 'Des fragments de foie, rouge sombre, tombent dans la solution de saccharose du tube de verre.';
  if (!e.vu('centri1')) return 'Le piston du broyeur descend et remonte dans le tube : les fragments de foie sont écrasés, le liquide devient un broyat trouble. À la loupe, les cellules éclatent : leurs noyaux (gros, violets) et leurs mitochondries (petites, orange) sont libérés dans le liquide.';
  if (!e.vu('culot_noyaux')) return `Un tube de broyat est placé dans la centrifugeuse ; le couvercle se ferme, le rotor et ses tubes inclinés tournent : « faible vitesse », le compteur monte jusqu’à ${fmt(1000)} tr/min (il affiche ${fmt(Math.round(trapV(borne((t - e.DEB.centri1 - 1.5) / 4.85), .5, .74) * 100) * 10)}).`;
  if (!e.vu('surnageant')) return 'La centrifugeuse ralentit et s’arrête. Le tube, agrandi à droite : les noyaux (gros grains violets) se déposent un à un au fond et forment un culot ; écrit « culot riche en noyaux ». De petits grains orange restent en suspension dans le liquide au-dessus (rien ne les nomme dans le tube : à l’élève de dire où sont les mitochondries).';
  if (!e.vu('centri2')) return 'Le tube est penché : son liquide, le surnageant, coule dans un nouveau tube, avec les petits grains orange ; le culot de noyaux reste au fond du premier tube. Écrit au-dessus du nouveau tube : « surnageant ».';
  if (!e.vu('culot_mitochondries')) return `Le nouveau tube est placé dans la centrifugeuse, qui tourne beaucoup plus vite : « grande vitesse », le compteur monte jusqu’à ${fmt(12000)} tr/min.`;
  if (!e.vu('bilan')) return 'La centrifugeuse s’arrête. Dans le second tube, les mitochondries (petits grains orange) se déposent une à une au fond : « culot riche en mitochondries ».';
  return 'Bilan : les deux culots sont allumés et comptés — 1 : culot riche en noyaux (faible vitesse) ; 2 : culot riche en mitochondries (grande vitesse). Encadré : « du plus lourd (noyaux) au plus léger (mitochondries) ».';
}
