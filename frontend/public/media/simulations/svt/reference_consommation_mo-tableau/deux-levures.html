<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deux levures au microscope électronique — au tableau</title>

<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Deux clichés de microscope électronique, côte à côte, au même grossissement. À gauche, une levure cultivée en milieu aérobie : noyau, une vacuole, hyaloplasme et de nombreuses grandes mitochondries à crêtes. À droite, une levure cultivée en milieu anaérobie : noyau, plusieurs vacuoles, hyaloplasme et seulement deux petites mitochondries. Chaque cliché porte sa barre d’échelle de 0,6 micromètre."></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start reset pause resume play_until set_time set_parameters">Lancer</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="../reactions_responsables_liberation_energie-tableau/commun.js"></script>
<script src="/media/simulations/shared/lexique/lexique.js"></script>
<script src="../reactions_responsables_liberation_energie-tableau/peinture.js"></script>
<script src="demarche.js"></script>
<script src="reference.js"></script>
<script>
/*
 * Deux levures au microscope électronique — cours de référence SVT (docs/reference-svt/ARCHITECTURE.md § 2 et § 3),
 * 27 novembre 2026. Document recréé : deux électronographies (microscope électronique à transmission, × 20 000 environ,
 * barre d'échelle 0,6 µm), aucune photo : les deux coupes sont PEINTES (peindreCoupe) dans un canvas caché, une fois par
 * taille, puis posées sur le tableau comme deux clichés.
 *   Milieu 1, aérobie   : noyau, une vacuole, hyaloplasme, 8 mitochondries grandes, à crêtes.
 *   Milieu 2, anaérobie : noyau, 3 vacuoles, hyaloplasme, 2 mitochondries petites, presque sans crêtes.
 * Les deux cellules ont la même taille (même grossissement) : 1 µm = 60 unités de la coupe, la barre de 0,6 µm en fait 36.
 *
 * Moments : aerobie, anaerobie ║ arrêt pour l'observation (rien d'allumé, de compté, de légendé) ║ mitochondries_aerobie
 * (les mitochondries du milieu 1 s'allument une à une : chacune se colorise aux couleurs du lexique et reçoit son numéro ;
 * total écrit), mitochondries (celles du milieu 2 ; total écrit), leg_noyau, leg_vacuole, leg_hyaloplasme, legendes,
 * conclusion_respiration, conclusion.
 */
const R = window.Ref, LX = window.Lexique, { doux, mix, borne, rgba, TAU, graine, rr } = R, T = LX.T;

/* ── Les deux coupes : tout est donné dans le repère de la cellule (origine au centre, grand axe 138, petit axe 114) ── */
const UM = 60;                     // unités de la coupe par micromètre
const COUPES = {
  a: { id: 'a', graine: 71, tilt: -.09, a: 138, b: 114, phase: .6, cicatrice: 3.75,
    noyau: { x: 45, y: -45, rx: 40, ry: 37, nucleole: [-.36, .34], g: 5 },
    vacuoles: [{ x: 50, y: 45, rx: 36, ry: 33, g: 3 }],
    mitos: [                                        // dans l'ordre où elles sont comptées ; num : où s'écrit le numéro
      { x: -78, y: -52, rx: 27, ry: 11.5, a: -.58, cretes: 7, courbe: .18, num: [-106, -68] },
      { x: -18, y: -80, rx: 28, ry: 11.5, a: .04, cretes: 7, courbe: -.2, num: [-58, -88] },
      { x: -28, y: -36, rx: 26, ry: 11, a: .36, cretes: 6, courbe: .12, num: [-37, -11] },
      { x: 103, y: 2, rx: 25, ry: 10.5, a: 1.5, cretes: 6, courbe: -.16, num: [102, -37] },
      { x: -98, y: 8, rx: 26, ry: 11, a: 1.36, cretes: 6, courbe: .2, num: [-130, 10] },
      { x: -38, y: 14, rx: 28, ry: 11.5, a: -.1, cretes: 7, courbe: -.14, num: [3, 12] },
      { x: -70, y: 55, rx: 27, ry: 11.5, a: .6, cretes: 7, courbe: .16, num: [-47, 39] },
      { x: -9, y: 73, rx: 26, ry: 11, a: -.14, cretes: 6, courbe: -.2, num: [-12, 102] },
    ],
    lipides: [[-68, -19, 5], [3, 39, 5.5], [112, -40, 4.5]],
    cibles: { noyau: [60, -60], mitochondrie: [110, 4], vacuole: [68, 47], hyaloplasme: [31, 89] },
    boites: { hyaloplasme: [14, 76, 40, 24] },
  },
  b: { id: 'b', graine: 113, tilt: .08, a: 138, b: 114, phase: 2.1, cicatrice: -.62,
    noyau: { x: -52, y: -42, rx: 40, ry: 37, nucleole: [.3, -.38], g: 9 },
    vacuoles: [{ x: -50, y: 47, rx: 34, ry: 30, g: 7 }, { x: 58, y: -8, rx: 42, ry: 39, g: 11 }, { x: 29, y: 68, rx: 20, ry: 16.5, g: 13 }],
    mitos: [
      { x: -105, y: 2, rx: 11.5, ry: 7.5, a: 1.4, cretes: 1, courbe: .1, petite: true, num: [-80, 4] },
      { x: 4, y: -72, rx: 12, ry: 7.5, a: -.2, cretes: 0, courbe: -.1, petite: true, num: [31, -75] },
    ],
    lipides: [[0, -20, 5.5], [101, 45, 5], [-20, -89, 4.5], [66, 58, 4.5]],
    cibles: { noyau: [-70, -58], mitochondrie: [-112, 2], vacuole: [-68, 49], hyaloplasme: [-6, 88] },
    boites: { hyaloplasme: [-16, -8, 34, 46] },
  },
};
[COUPES.a, COUPES.b].forEach(S => S.mitos.forEach((m, i) => { m.g = S.graine + i * 7.3; }));
const NA = COUPES.a.mitos.length, NB = COUPES.b.mitos.length;

/* ── Peinture ── */
/** Un gris de cliché, très légèrement sépia. */
const gr = (v, a = 1) => `rgba(${Math.round(Math.min(255, v * 1.01 + 3))},${Math.round(Math.min(255, v * .99 + 1))},${Math.round(v * .935)},${a})`;
/** Un ovale un peu irrégulier (contour d'une cellule, d'un noyau, d'une vacuole). */
function ovale(ctx, a, b, wob = 0, ph = 0, n = 120) {
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const th = i / n * TAU, f = 1 + wob * (Math.sin(3 * th + ph) * .6 + Math.sin(5 * th + ph * 2.3) * .4 + Math.sin(2 * th + ph * .7) * .55);
    const x = a * f * Math.cos(th), y = b * f * Math.sin(th);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}
/** Le contour d'une mitochondrie (bâtonnet arrondi, un peu courbé), dans son repère (grand axe horizontal). */
function formeMito(ctx, m, retrait = 0) {
  const rx = m.rx - retrait, ry = m.ry - retrait, n = 64, ex = .8;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const th = i / n * TAU, cs = Math.cos(th), sn = Math.sin(th);
    const ux = Math.sign(cs) * Math.pow(Math.abs(cs), ex), uy = Math.sign(sn) * Math.pow(Math.abs(sn), ex), f = 1 + .028 * Math.sin(3 * th + m.g);
    const x = rx * ux * f, y = ry * uy * f + (m.courbe || 0) * m.ry * (ux * ux - .5);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}
const PALETTE = {
  gris: (m) => ({ ext: gr(34), esp: gr(158), int: gr(40), mat0: gr(m.petite ? 122 : 100), mat1: gr(m.petite ? 104 : 76), bord: gr(38), lumen: gr(176), grain: gr(30, .55), lExt: 1.5, lInt: 1.3 }),
  couleur: () => ({ ext: rgba(T.mitoExt.map(v => v * .82), 1), esp: rgba(T.mitoEsp, 1), int: rgba(T.crete, 1), mat0: rgba(T.matrice.map(v => Math.min(255, v + 62)), 1), mat1: rgba(T.matrice.map(v => v * .86), 1),
    bord: rgba(T.crete, 1), lumen: rgba(T.mitoEsp, 1), grain: 'rgba(235,248,255,.5)', lExt: 2, lInt: 1.5 }),
};
/**
 * Une mitochondrie en coupe : membrane externe, espace intermembranaire, membrane interne, matrice, crêtes transversales
 * (replis de la membrane interne : deux traits de membrane et, entre eux, la lumière de la crête). La même forme sert au
 * cliché (mode 'gris') et à la mitochondrie allumée (mode 'couleur' : couleurs du lexique).
 */
function mito(ctx, m, mode) {
  const P = PALETTE[mode](m), rnd = graine(Math.round(m.g * 97) + 13), ret = m.petite ? 2 : 2.7, rx = m.rx - ret, ry = m.ry - ret;
  ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(m.a); ctx.lineJoin = 'round';
  formeMito(ctx, m, 0); ctx.fillStyle = P.esp; ctx.fill();
  formeMito(ctx, m, ret);
  const g = ctx.createLinearGradient(0, -ry, 0, ry); g.addColorStop(0, P.mat0); g.addColorStop(1, P.mat1); ctx.fillStyle = g; ctx.fill();
  ctx.save(); formeMito(ctx, m, ret); ctx.clip();
  // les granules de la matrice
  ctx.fillStyle = P.grain;
  for (let k = 0; k < (m.petite ? 5 : 16); k++) { const x = (rnd() * 2 - 1) * rx * .9, y = (rnd() * 2 - 1) * ry * .8; ctx.beginPath(); ctx.arc(x, y, .5 + rnd() * .6, 0, TAU); ctx.fill(); }
  // les crêtes : alternativement d'un bord et de l'autre, elles ne traversent pas toute la matrice
  const n = m.cretes, trac = [];
  for (let j = 0; j < n; j++) {
    const s = j % 2 ? 1 : -1, x0 = -rx + (j + .5 + (rnd() - .5) * .3) * 2 * rx / n, prof = m.petite ? .3 + rnd() * .12 : .58 + rnd() * .26;
    const dec = (m.courbe || 0) * m.ry * ((x0 / m.rx) ** 2 - .5), x1 = x0 + (rnd() - .5) * 5, xm = x0 + (rnd() - .5) * 4;
    trac.push([x0, s * (ry + 3) + dec, xm, s * ry * (1 - prof) + dec, x1, s * ry * (1 - 2 * prof) + dec]);
  }
  const lb = m.petite ? 2.6 : Math.max(3, m.ry * .31);
  ctx.lineCap = 'round';
  for (const [lw, st] of [[lb, P.bord], [lb * .4, P.lumen]]) {
    ctx.lineWidth = lw; ctx.strokeStyle = st;
    for (const t of trac) { ctx.beginPath(); ctx.moveTo(t[0], t[1]); ctx.quadraticCurveTo(t[2], t[3], t[4], t[5]); ctx.stroke(); }
  }
  ctx.restore();
  formeMito(ctx, m, ret); ctx.lineWidth = P.lInt; ctx.strokeStyle = P.int; ctx.stroke();
  formeMito(ctx, m, 0); ctx.lineWidth = P.lExt; ctx.strokeStyle = P.ext; ctx.stroke();
  ctx.restore();
}

/** Le grain du film : une tuile de bruit, tirée une fois (déterministe). */
let TUILE = null;
function tuileGrain() {
  if (TUILE) return TUILE;
  const n = 192, cv = document.createElement('canvas'); cv.width = cv.height = n;
  const cx = cv.getContext('2d'), im = cx.createImageData(n, n), r = graine(4099);
  for (let i = 0; i < n * n; i++) { const v = 128 + ((r() + r() + r()) / 3 - .5) * 330; im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = Math.max(0, Math.min(255, v)); im.data[i * 4 + 3] = 255; }
  cx.putImageData(im, 0, 0);
  return (TUILE = cv);
}
/** Des taches douces, claires ou sombres (hétérogénéité d'une plage). */
function marbrures(ctx, rnd, n, zone, r0, r1, alpha) {
  for (let k = 0; k < n; k++) {
    const x = zone[0] + rnd() * zone[2], y = zone[1] + rnd() * zone[3], rad = r0 + rnd() * (r1 - r0), cl = rnd() < .5, a = alpha * (.5 + rnd() * .5);
    const g = ctx.createRadialGradient(x, y, 0, x, y, rad); g.addColorStop(0, cl ? `rgba(255,252,240,${a})` : `rgba(10,10,8,${a})`); g.addColorStop(1, cl ? 'rgba(255,252,240,0)' : 'rgba(10,10,8,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, rad, 0, TAU); ctx.fill();
  }
}

/**
 * Peint une coupe de levure « façon microscope électronique à transmission » dans la boîte (0, 0, w, h) :
 * résine du fond, paroi épaisse et claire, membrane plasmique (trait sombre), hyaloplasme gris et granuleux (ribosomes),
 * réticulum, noyau (double enveloppe, pores, nucléole), vacuole(s), mitochondries, globules lipidiques, puis le grain du
 * film et le vignettage. S : la coupe (listes d'organites) ; k : le grossissement ; o.teinte : hyaloplasme teinté (0..1).
 */
function peindreCoupe(ctx, S, w, h, k, o = {}) {
  const rnd = graine(S.graine), A = S.a, B = S.b;
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, w, h); ctx.clip();
  /* la résine d'inclusion */
  const gf = ctx.createLinearGradient(0, 0, w, h); gf.addColorStop(0, gr(176)); gf.addColorStop(.5, gr(168)); gf.addColorStop(1, gr(158));
  ctx.fillStyle = gf; ctx.fillRect(0, 0, w, h);
  marbrures(ctx, rnd, 46, [0, 0, w, h], 14, 46, .05);
  ctx.save(); ctx.strokeStyle = 'rgba(20,20,16,.035)'; ctx.lineWidth = 1.2;       // les fines stries du couteau
  for (let x = -h; x < w; x += 7 + rnd() * 9) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + h * .5, h); ctx.stroke(); }
  ctx.restore();
  for (let i = 0; i < 26; i++) { ctx.fillStyle = gr(70 + rnd() * 50, .25 + rnd() * .3); ctx.beginPath(); ctx.arc(rnd() * w, rnd() * h, .4 + rnd() * .9, 0, TAU); ctx.fill(); }

  ctx.translate(w / 2, h / 2); ctx.rotate(S.tilt); ctx.scale(k, k);
  /* la paroi : épaisse, claire, feuilletée ; un liseré sombre et flou dehors */
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 9 * k; ovale(ctx, A, B, .012, S.phase); ctx.fillStyle = gr(206); ctx.fill(); ctx.restore();
  if (S.cicatrice != null) {     // la cicatrice de bourgeon : un bourrelet de paroi, en anneau vu en coupe (deux lèvres)
    const an = S.cicatrice;
    for (const d of [-.085, .085]) { const x = Math.cos(an + d) * (A + 1.5), y = Math.sin(an + d) * (B + 1.5);
      ctx.fillStyle = gr(202); ctx.beginPath(); ctx.ellipse(x, y, 5.2, 3.4, an + d, 0, TAU); ctx.fill(); ctx.strokeStyle = gr(96, .7); ctx.lineWidth = 1; ctx.stroke(); }
    ctx.fillStyle = gr(206); ctx.beginPath(); ctx.ellipse(Math.cos(an) * (A - 3), Math.sin(an) * (B - 3), 9, 6, an + Math.PI / 2, 0, TAU); ctx.fill();
  }
  ovale(ctx, A, B, .012, S.phase); ctx.fillStyle = gr(208); ctx.fill();
  ctx.save(); ovale(ctx, A, B, .012, S.phase); ctx.clip();
  ctx.lineWidth = 3.4; ctx.strokeStyle = gr(132, .55); ovale(ctx, A, B, .012, S.phase); ctx.stroke();                 // couche externe, plus dense
  ctx.lineWidth = 3.6; ctx.strokeStyle = gr(232, .8); ovale(ctx, A - 5.2, B - 5.2, .012, S.phase); ctx.stroke();      // couche interne, très claire
  ctx.lineWidth = .7; ctx.strokeStyle = gr(150, .45); ovale(ctx, A - 3.3, B - 3.3, .012, S.phase); ctx.stroke();
  for (let i = 0; i < 520; i++) { const th = rnd() * TAU, d = rnd() * 9; ctx.fillStyle = gr(120 + rnd() * 80, .28); ctx.fillRect(Math.cos(th) * (A - d), Math.sin(th) * (B - d), .9, .9); }
  ctx.restore();
  ctx.lineWidth = 1.1; ctx.strokeStyle = gr(84, .8); ovale(ctx, A, B, .012, S.phase); ctx.stroke();

  /* le hyaloplasme : gris moyen, granuleux */
  const ai = A - 9.6, bi = B - 9.6, cyto = () => ovale(ctx, ai, bi, .013, S.phase + .25, 160);
  cyto(); const gc = ctx.createRadialGradient(-20, -16, 10, 0, 0, A); gc.addColorStop(0, gr(122)); gc.addColorStop(1, gr(104)); ctx.fillStyle = gc; ctx.fill();
  ctx.save(); cyto(); ctx.clip();
  marbrures(ctx, rnd, 90, [-A, -B, 2 * A, 2 * B], 6, 22, .085);
  // les ribosomes : de fins points sombres, par milliers
  for (let i = 0; i < 5200; i++) {
    const x = (rnd() * 2 - 1) * ai, y = (rnd() * 2 - 1) * bi, s = rnd();
    ctx.fillStyle = gr(20 + s * 30, .5 + s * .4); ctx.beginPath(); ctx.arc(x, y, .5 + s * .5, 0, TAU); ctx.fill();
  }
  for (let i = 0; i < 700; i++) { ctx.fillStyle = gr(190, .16 + rnd() * .14); ctx.beginPath(); ctx.arc((rnd() * 2 - 1) * ai, (rnd() * 2 - 1) * bi, .5 + rnd() * .7, 0, TAU); ctx.fill(); }
  // le réticulum endoplasmique : quelques citernes, sous la membrane et dans le hyaloplasme
  ctx.lineCap = 'round';
  const citerne = (fn) => { for (const [lw, st] of [[2.3, gr(40, .8)], [.8, gr(178, .9)]]) { ctx.lineWidth = lw; ctx.strokeStyle = st; ctx.beginPath(); fn(); ctx.stroke(); } };
  for (let i = 0; i < 9; i++) {
    const t0 = rnd() * TAU, len = .16 + rnd() * .26, dd = 5.5 + rnd() * 3;
    citerne(() => { for (let j = 0; j <= 14; j++) { const th = t0 + len * j / 14, wv = Math.sin(j * 1.3 + i) * .7; const x = Math.cos(th) * (ai - dd + wv), y = Math.sin(th) * (bi - dd + wv); j ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } });
  }
  if (o.teinte) { ctx.globalCompositeOperation = 'color'; ctx.fillStyle = rgba(T.hyalo, .42 * o.teinte); ctx.fillRect(-A, -B, 2 * A, 2 * B); ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = rgba(T.hyalo, .07 * o.teinte); ctx.fillRect(-A, -B, 2 * A, 2 * B); }
  ctx.restore();
  /* la membrane plasmique : un trait sombre, net, contre la paroi */
  ctx.lineWidth = 1.9; ctx.strokeStyle = gr(30); cyto(); ctx.stroke();

  /* les vacuoles : très claires, presque vides, bordées du tonoplaste */
  for (const v of S.vacuoles) {
    const r2 = graine(S.graine * 3 + v.g);
    ctx.save(); ctx.translate(v.x, v.y);
    ovale(ctx, v.rx, v.ry, .03, v.g, 72);
    const gv = ctx.createRadialGradient(-v.rx * .2, -v.ry * .2, 2, 0, 0, v.rx); gv.addColorStop(0, gr(242)); gv.addColorStop(.8, gr(234)); gv.addColorStop(1, gr(220));
    ctx.fillStyle = gv; ctx.fill();
    ctx.save(); ovale(ctx, v.rx, v.ry, .03, v.g, 72); ctx.clip();
    for (let i = 0; i < v.rx * 3; i++) { ctx.fillStyle = gr(170 + r2() * 40, .22); ctx.beginPath(); ctx.arc((r2() * 2 - 1) * v.rx, (r2() * 2 - 1) * v.ry, .5 + r2() * 1.1, 0, TAU); ctx.fill(); }
    const na = 3 + Math.floor(r2() * 3);                               // quelques granules denses, parfois accolés
    for (let i = 0; i < na; i++) { const an = r2() * TAU, d = r2() * .62, x = Math.cos(an) * v.rx * d, y = Math.sin(an) * v.ry * d, rad = 1.1 + r2() * 1.7;
      ctx.fillStyle = gr(52 + r2() * 30, .9); ctx.beginPath(); ctx.arc(x, y, rad, 0, TAU); ctx.fill();
      if (r2() < .5) { ctx.beginPath(); ctx.arc(x + rad * 1.2, y + rad * .5, rad * .6, 0, TAU); ctx.fill(); } }
    ctx.restore();
    ctx.lineWidth = 1.25; ctx.strokeStyle = gr(48); ovale(ctx, v.rx, v.ry, .03, v.g, 72); ctx.stroke();
    ctx.restore();
  }

  /* le noyau : plus clair que le hyaloplasme, double enveloppe percée de pores, nucléole sombre */
  { const N = S.noyau, r2 = graine(S.graine * 5 + N.g), forme = (d = 0) => ovale(ctx, N.rx + d, N.ry + d, .022, N.g, 90);
    ctx.save(); ctx.translate(N.x, N.y);
    forme(); const gn = ctx.createRadialGradient(-6, -6, 3, 0, 0, N.rx); gn.addColorStop(0, gr(184)); gn.addColorStop(1, gr(168)); ctx.fillStyle = gn; ctx.fill();
    ctx.save(); forme(); ctx.clip();
    marbrures(ctx, r2, 26, [-N.rx, -N.ry, 2 * N.rx, 2 * N.ry], 4, 12, .09);
    for (let i = 0; i < 900; i++) { const s = r2(); ctx.fillStyle = gr(96 + s * 40, .3 + s * .25); ctx.beginPath(); ctx.arc((r2() * 2 - 1) * N.rx, (r2() * 2 - 1) * N.ry, .45 + s * .45, 0, TAU); ctx.fill(); }
    for (let i = 0; i < 7; i++) { const an = r2() * TAU, x = Math.cos(an) * N.rx * .86, y = Math.sin(an) * N.ry * .86, rad = 4 + r2() * 5;     // chromatine dense, contre l'enveloppe
      const g = ctx.createRadialGradient(x, y, 0, x, y, rad); g.addColorStop(0, gr(70, .42)); g.addColorStop(1, gr(70, 0)); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, rad, 0, TAU); ctx.fill(); }
    // le nucléole : une masse dense, granuleuse, excentrée
    const nx = N.nucleole[0] * N.rx, ny = N.nucleole[1] * N.ry, na = Math.atan2(ny, nx) + Math.PI / 2;
    ctx.save(); ctx.translate(nx, ny); ctx.rotate(na); ctx.shadowColor = gr(50, .8); ctx.shadowBlur = 5 * k;
    ctx.fillStyle = gr(58); ctx.beginPath(); ctx.ellipse(0, 0, N.rx * .36, N.ry * .25, 0, 0, TAU); ctx.fill(); ctx.shadowBlur = 0;
    for (let i = 0; i < 160; i++) { const an = r2() * TAU, d = Math.sqrt(r2()); ctx.fillStyle = r2() < .5 ? gr(26, .6) : gr(104, .45); ctx.beginPath(); ctx.arc(Math.cos(an) * N.rx * .36 * d, Math.sin(an) * N.ry * .25 * d, .5 + r2() * .6, 0, TAU); ctx.fill(); }

const CACHE = new Map();

/* ── Les moments (s de la scène) ── */
const MOMENTS = [

/* ── La géométrie : deux clichés qui remplissent la largeur, une colonne de légendes entre eux ── */

/** Un point de la cellule (repère de la coupe) → sa place sur le tableau. */

/* ── L'état à l'instant t : quelles mitochondries sont allumées ── */
function etat(e) {

/** Les mitochondries allumées : colorisées (couleurs du lexique), un éclat quand elles s'allument, leur numéro. */

/* ── Le dessin ── */

/* ── Téléphone : la phrase de l'étape, et la boîte à montrer ── */

  if (e.des('conclusion_respiration')) return e.p('conclusion_respiration') >= .25 ? { texte: CONCL.a, couleur: 'vert', repere: 'conclusion_respiration', label: 'la conclusion : ' + CONCL.a } : { texte: 'Les quatre légendes : noyau, vacuole, hyaloplasme, mitochondrie', couleur: 'blanc' };

function foyer(e) {
  const G = geo(e), bo = (cl) => ({ x: cl.x - 5, y: cl.y - 5, w: cl.w + 10, h: cl.h + 10 }), deux = { x: G.a.x - 5, y: G.a.y - 5, w: G.b.x + G.b.w - G.a.x + 10, h: G.a.h + 10 };
  const avecCol = (cl) => (cl === G.a ? { x: G.a.x - 5, y: G.a.y - 5, w: G.xCol + G.col / 2 - G.a.x + 7, h: G.a.h + 10 } : { x: G.xCol - G.col / 2 - 2, y: G.b.y - 5, w: G.b.x + G.b.w - G.xCol + G.col / 2 + 7, h: G.b.h + 10 });
  if (e.des('conclusion')) return avecCol(e.p('conclusion') >= .08 ? G.b : G.a);
  if (e.des('leg_noyau')) return avecCol(G.a);
  if (e.des('mitochondries')) return bo(G.b);
  if (e.des('mitochondries_aerobie')) return bo(G.a);
  if (e.des('anaerobie')) return e.p('anaerobie') >= .72 ? deux : bo(G.b);
  return bo(G.a);
}

/* ── Ce qui se voit ── */
function voit(e) {
  const E = etat(e);
  const dA = 'À gauche, le cliché du milieu aérobie (avec O2) : une levure ovale à paroi épaisse et claire, hyaloplasme gris granuleux, un noyau (en haut à droite), une grande vacuole très claire, de nombreux ovales sombres à crêtes ; barre d’échelle 0,6 µm.';
  const dB = 'À droite, le cliché du milieu anaérobie (sans O2), au même grossissement : une levure de même taille, un noyau (en haut à gauche), trois vacuoles très claires, et seulement deux petits ovales sombres ; barre d’échelle 0,6 µm.';
  if (E.aA <= 0) return 'Deux levures au microscope électronique : le tableau est encore vide (seul le titre « Deux levures au microscope électronique (× 20 000) » est écrit).';
  if (!e.des('anaerobie')) return `Un seul cliché en niveaux de gris, façon microscope électronique${E.aA < 1 ? ' (il apparaît)' : ''}. ${dA} Rien n’est légendé ni compté.`;
  let s = `Deux clichés en niveaux de gris, côte à côte${E.aB < 1 ? ' (le second apparaît)' : ''}. ${dA} ${dB}`;
  if (!e.des('mitochondries_aerobie')) return s + ' Arrêt pour l’observation : rien n’est allumé, compté, légendé ni conclu ; aucune étiquette d’organite.';
  s = 'Deux clichés de microscope électronique, côte à côte, au même grossissement (barre 0,6 µm) : à gauche la levure du milieu aérobie, à droite celle du milieu anaérobie.';
  s += ` Milieu aérobie : ${E.na} mitochondrie${E.na > 1 ? 's' : ''} sur ${NA} allumée${E.na > 1 ? 's' : ''} (colorisée${E.na > 1 ? 's' : ''} : membrane externe orange, matrice bleue, crêtes claires ; numérotée${E.na > 1 ? 's' : ''} de 1 à ${E.na})${E.totalA ? ` ; total écrit sous le cliché : « ${TOTAUX.a} »` : ''}.`;
  if (e.des('mitochondries')) s += ` Milieu anaérobie : ${E.nb} mitochondrie${E.nb > 1 ? 's' : ''} sur ${NB} allumée${E.nb > 1 ? 's' : ''}${E.totalB ? ` ; total écrit : « ${TOTAUX.b} »` : ''}.`;
  else s += ' Rien n’est encore allumé sur le cliché anaérobie.';
  const legs = LEG.filter(l => e.des(l.moment)).map(l => l.mot);
  if (legs.length) s += ` Légendes écrites à la craie entre les deux clichés, avec un trait de rappel vers chaque cellule : ${legs.join(', ')}.`;
  const cc = [];
  if (e.des('conclusion_respiration') && e.p('conclusion_respiration') >= .25) cc.push(`sous le cliché aérobie « ${CONCL.a} »`);
  if (e.des('conclusion') && e.p('conclusion') >= .4) cc.push(`sous le cliché anaérobie « ${CONCL.b} »`);
  if (cc.length) s += ` Conclusion écrite en vert, encadrée : ${cc.join(' ; ')}.`;
  if (E.teinte > .5) s += ' Le hyaloplasme de la levure du milieu anaérobie est teinté en vert.';
  return s;
}

R.page({
  id: 'svt_reference_deux_levures', vue: 'deux_levures', titre: 'Deux levures au microscope électronique', moments: MOMENTS, dessiner, foyer, voit, vivant: () => false,
  texte: `Document : deux électronographies de levures (microscope électronique à transmission, × 20 000 environ, barre d’échelle 0,6 µm). Milieu aérobie (avec O2) : noyau, une vacuole, hyaloplasme, ${NA} mitochondries grandes, à crêtes bien visibles (nombreuses et bien développées). Milieu anaérobie (sans O2) : noyau, trois vacuoles, hyaloplasme, ${NB} mitochondries petites, presque sans crêtes (rares et réduites). Conclusion : respiration ↔ mitochondries ; fermentation ↔ hyaloplasme (elle n’a pas besoin de mitochondries).`,
  explications: [{ repere: 'levure_aerobie', texte: 'La levure cultivée avec du dioxygène.' }, { repere: 'levure_anaerobie', texte: 'La levure cultivée sans dioxygène, au même grossissement.' },
    { repere: 'mitochondries_aerobie', texte: `Avec dioxygène : ${NA} mitochondries, grandes.` }, { repere: 'mitochondries_anaerobie', texte: `Sans dioxygène : ${NB} mitochondries, petites.` },
    { repere: 'conclusion_respiration', texte: 'La respiration se fait dans les mitochondries.' }, { repere: 'conclusion', texte: 'La fermentation se fait dans le hyaloplasme.' }],
  accueil: 'Deux levures, au microscope électronique…',

});
