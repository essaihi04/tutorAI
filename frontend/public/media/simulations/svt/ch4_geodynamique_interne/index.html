<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>Laboratoire de géodynamique interne</title>
  <style>
    :root{--ink:#172033;--muted:#667085;--line:#dce3ee;--blue:#3157c8;--blue2:#1f3d9d;--orange:#ed7a31;--teal:#087f75;--ok:#087f5b;--bad:#c92a45;--paper:#fbfaf7;--panel:#f2f5f9}*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#111b42;color:var(--ink)}button,input,select{font:inherit}.app{width:100%;height:100vh;display:flex;flex-direction:column;gap:1.25vh;padding:1.4vh 1vw;background:radial-gradient(circle at 8% 3%,#3658da 0,#1d2f79 28%,#101b43 62%)}
    .topbar{flex:0 0 8vh;display:grid;grid-template-columns:minmax(260px,1fr) auto minmax(150px,.55fr);align-items:center;gap:1vw;color:white}.brand{display:flex;align-items:center;gap:.8vw}.brand-icon{width:3.2rem;height:3.2rem;border-radius:14px;background:#64dbc8;display:grid;place-items:center;font-size:1.65rem;box-shadow:0 8px 22px #08102b44}.eyebrow{font-size:clamp(.55rem,.72vw,.7rem);font-weight:900;letter-spacing:.12em;opacity:.75}.brand h1{font-size:clamp(1.05rem,1.75vw,1.55rem);line-height:1.08}.lab-nav{display:flex;gap:.5vw}.lab-tab{border:1px solid #ffffff20;background:#ffffff08;color:#ffffff65;border-radius:999px;padding:.72vh .8vw;font-weight:900;font-size:clamp(.56rem,.7vw,.68rem);white-space:nowrap}.lab-tab-short{display:none}.lab-tab.active{background:white;color:var(--blue2)}.lab-tab.done{border-color:#6fe0b5;color:#9ff3d1}.lab-tab:disabled{cursor:not-allowed}.xp{justify-self:end;min-width:12vw}.xp-row{display:flex;justify-content:space-between;font-size:clamp(.55rem,.68vw,.66rem);font-weight:900}.xp-track{height:.55vh;margin-top:.35vh;background:#ffffff25;border-radius:99px;overflow:hidden}.xp-fill{height:100%;width:0;background:linear-gradient(90deg,#ffcc67,#ff8a52);transition:.3s}
    main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:42% 58%;gap:.85vw}.visual-card,.lab-card{min-height:0;border-radius:22px;background:var(--paper);overflow:hidden;box-shadow:0 18px 50px #07102e48}.visual-card{position:relative}.visual-card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s ease,filter .4s}.visual-card.scan img{transform:scale(1.035);filter:saturate(1.08) contrast(1.04)}.visual-card:after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,#081126dc)}.visual-title{position:absolute;z-index:3;left:1.1vw;right:1.1vw;bottom:1.3vh;color:#fff}.visual-step{display:inline-block;padding:.4vh .55vw;border-radius:7px;background:#132047bb;font-size:clamp(.52rem,.65vw,.63rem);font-weight:900;letter-spacing:.08em}.visual-title h2{font-size:clamp(1.05rem,1.55vw,1.45rem);margin-top:.7vh}.visual-title p{font-size:clamp(.62rem,.77vw,.76rem);margin-top:.35vh;opacity:.85;max-width:88%}.hotspot{position:absolute;z-index:4;transform:translate(-50%,-50%);border:1px solid #fff8;border-radius:999px;background:#152450d9;color:white;padding:.45vh .55vw;font-size:clamp(.52rem,.64vw,.62rem);font-weight:900;box-shadow:0 0 0 5px #ffffff18;cursor:pointer}.hotspot.teal{background:#087f75dc}.hotspot.orange{background:#d96525df}.hotspot.violet{background:#5d4ac8e3}.hotspot.coral{background:#c94461df}.hotspot.pulse{animation:pulse 1s ease 2}@keyframes pulse{50%{box-shadow:0 0 0 18px #ffce6655;transform:translate(-50%,-50%) scale(1.1)}}
    .lab-card{display:flex;flex-direction:column;padding:1.25vh 1.15vw;gap:.9vh}.lab-head{flex:0 0 auto;display:flex;align-items:flex-start;justify-content:space-between;gap:1vw}.mode-kicker{color:var(--blue);font-weight:900;font-size:clamp(.58rem,.75vw,.72rem);letter-spacing:.1em}.lab-head h2{font-size:clamp(1rem,1.55vw,1.35rem);line-height:1.15;margin-top:.2vh}.instruction{color:var(--muted);font-size:clamp(.62rem,.78vw,.77rem);line-height:1.3;margin-top:.25vh}.status-pill{flex:0 0 auto;border-radius:999px;background:#edf0ff;color:var(--blue2);padding:.5vh .7vw;font-size:clamp(.55rem,.68vw,.66rem);font-weight:900}.workbench{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:.7vh;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:1vh .9vw;overflow:hidden}.bench-label{font-size:clamp(.52rem,.65vw,.64rem);font-weight:900;color:var(--muted);letter-spacing:.07em;text-transform:uppercase}.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:.45vw;min-height:8vh}.drop-slot,.target-zone{min-width:0;border:2px dashed #b9c5d7;border-radius:12px;background:#fff;display:grid;place-items:center;padding:.55vh .3vw;color:#8d99ab;font-size:clamp(.57rem,.72vw,.7rem);font-weight:850;cursor:pointer;text-align:center}.drop-slot.filled{border-style:solid;border-color:#8d99ee;background:#eef0ff;color:#303c9c}.drop-slot.good{border-color:#69cfa4;background:#e9fff4;color:var(--ok)}.drop-slot.bad{border-color:#ff9aaa;background:#fff0f2;color:var(--bad)}.bank{display:flex;flex-wrap:wrap;gap:.42vw;justify-content:center}.token{border:0;border-radius:11px;padding:.65vh .72vw;background:#fff;color:#25324d;font-weight:900;font-size:clamp(.58rem,.76vw,.74rem);box-shadow:0 3px 10px #19243a16;cursor:grab}.token:hover,.token.selected{transform:translateY(-2px);background:#ffedd8;color:#a64614}.token.used{opacity:.25;pointer-events:none}.feedback{flex:0 0 auto;min-height:3.5vh;border-radius:12px;padding:.55vh .7vw;background:#fff;color:var(--muted);font-size:clamp(.57rem,.72vw,.7rem);font-weight:800;display:flex;align-items:center}.feedback.ok{background:#e8fff4;color:var(--ok)}.feedback.no{background:#fff0f2;color:var(--bad)}.actions{flex:0 0 auto;display:flex;gap:.5vw;align-items:center}.actions button{border:0;border-radius:10px;padding:.62vh .72vw;font-size:clamp(.56rem,.7vw,.68rem);font-weight:900;background:#e7ebf2;color:#465269;cursor:pointer}.actions .primary{margin-left:auto;background:var(--blue);color:white}.actions .hint{background:#fff1cc;color:#8c5b00}.guide{position:absolute;z-index:8;left:50%;bottom:2vh;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#101b3ded;color:#fff;padding:.75vh 1vw;border-radius:12px;font-size:.72rem;font-weight:800;transition:.2s}.guide.show{opacity:1;transform:translate(-50%,0)}
    .control-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.55vw}.control-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:.75vh .65vw}.control-box b{display:block;font-size:clamp(.55rem,.7vw,.68rem);color:var(--muted);margin-bottom:.45vh}.seg{display:flex;gap:.25vw}.seg button{flex:1;border:1px solid var(--line);border-radius:8px;padding:.5vh .25vw;background:#f7f8fb;font-size:clamp(.55rem,.68vw,.66rem);font-weight:850}.seg button.active{background:var(--blue);color:white;border-color:var(--blue)}input[type=range]{width:100%;accent-color:var(--blue)}.result-line{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:12px;padding:.65vh .7vw;font-size:clamp(.58rem,.74vw,.72rem);font-weight:850}.result-name{color:var(--blue2);font-size:clamp(.72rem,.92vw,.9rem)}.structure-targets{display:grid;grid-template-columns:repeat(3,1fr);gap:.45vw}.structure-chip{border-radius:10px;background:#e4e8ef;color:#697487;text-align:center;padding:.55vh .3vw;font-size:clamp(.55rem,.7vw,.67rem);font-weight:900}.structure-chip.seen{background:#dcfaec;color:var(--ok)}.deform-svg{width:100%;height:18vh;background:#fff;border:1px solid var(--line);border-radius:12px}.deform-svg path{fill:none;stroke-width:7;stroke-linecap:round}.deform-svg .fault{stroke:#8d4037;stroke-width:4}.pt-layout{display:grid;grid-template-columns:1.2fr .8fr;gap:.6vw;min-height:0;flex:1}.pt-chart{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;padding:.4vh .4vw;min-height:0}.pt-chart svg{width:100%;height:100%}.pt-controls{display:flex;flex-direction:column;gap:.55vh;min-height:0}.pt-value{display:flex;justify-content:space-between;font-size:clamp(.55rem,.68vw,.66rem);font-weight:900}.sample-grid{display:grid;grid-template-columns:1fr 1fr;gap:.35vw}.sample-btn{border:1px solid var(--line);border-radius:9px;background:#fff;padding:.5vh .3vw;font-size:clamp(.52rem,.65vw,.63rem);font-weight:850}.sample-btn.seen{background:#dcfaec;color:var(--ok)}.signature{background:#fff;border:1px solid var(--line);border-radius:10px;padding:.65vh .55vw;font-size:clamp(.55rem,.69vw,.67rem);line-height:1.3}.granite-layout{display:grid;grid-template-columns:1fr 1fr;gap:.55vw;flex:1;min-height:0}.target-zone{display:flex;flex-direction:column;justify-content:flex-start;gap:.45vh;padding:.7vh .55vw;overflow:hidden}.target-zone h3{font-size:clamp(.68rem,.9vw,.86rem);color:var(--blue2)}.evidence-chip{width:100%;border:0;border-radius:8px;background:#eef1f6;padding:.5vh .4vw;font-size:clamp(.52rem,.66vw,.64rem);font-weight:850;color:#3b465b}.target-zone.active{border-color:var(--orange);background:#fffaf2}
    @media(max-width:760px){.app{padding:.8vh 1.2vw}.topbar{flex-basis:15vh;grid-template-columns:1fr auto;grid-template-rows:1fr auto}.brand-icon{width:2.55rem;height:2.55rem}.brand h1{font-size:.95rem}.lab-nav{display:grid;grid-template-columns:repeat(4,1fr);grid-column:1/-1;gap:1vw;width:100%}.lab-tab{padding:.55vh .2vw;font-size:.53rem}.lab-tab-full{display:none}.lab-tab-short{display:inline}.xp{min-width:25vw}main{grid-template-columns:1fr;grid-template-rows:32% 68%;gap:.7vh}.visual-title p{display:none}.lab-card{padding:.8vh 1.6vw}.slots{min-height:6.2vh}.hotspot{font-size:.54rem}.control-grid{grid-template-columns:1fr 1fr 1fr}.pt-layout{grid-template-columns:1.05fr .95fr}.deform-svg{height:13vh}.actions button{padding:.52vh 1.1vw}.workbench{padding:.7vh 1.2vw}}
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brand-icon">⛰️</div><div><div class="eyebrow">LABORATOIRE INTERACTIF · BIOF</div><h1>Géodynamique interne</h1></div></div>
    <nav class="lab-nav" id="labNav" aria-label="Expériences"></nav>
    <div class="xp"><div class="xp-row"><span>Progression</span><span id="xpText">0/4</span></div><div class="xp-track"><div class="xp-fill" id="xpFill"></div></div></div>
  </header>
  <main>
    <section class="visual-card" id="visualCard"><img id="sceneImage" alt=""><div id="hotspots"></div><div class="visual-title"><span class="visual-step" id="visualStep"></span><h2 id="visualHeading"></h2><p id="visualCaption"></p></div></section>
    <section class="lab-card">
      <div class="lab-head"><div><div class="mode-kicker" id="kicker"></div><h2 id="labTitle"></h2><p class="instruction" id="instruction"></p></div><span class="status-pill" id="statusPill">En manipulation</span></div>
      <div class="workbench" id="workbench"></div>
      <div class="feedback" id="feedback">Observe la scène puis commence la manipulation.</div>
      <div class="actions"><button id="undoBtn">↶ Annuler</button><button class="hint" id="hintBtn">💡 Indice</button><button id="resetBtn">Réinitialiser</button><button class="primary" id="checkBtn">Vérifier l’expérience</button></div>
    </section>
  </main>
  <div class="guide" id="guide"></div>
</div>
<script>
  window.SIMULATION_CONFIG={
    id:'svt_internal_geodynamics_advanced_lab',title:'Laboratoire avancé de géodynamique interne',version:'1.0',
    variants:[
      {id:'chains',label:'Chaînes',objective:'Reconstituer océanisation, subduction, obduction et collision et reconnaître leurs indices'},
      {id:'deformations',label:'Déformations',objective:'Relier comportement des roches et compression aux plis, failles inverses et nappes'},
      {id:'metamorphism',label:'Métamorphisme',objective:'Relier pression, température, minéraux index, faciès et contexte tectonique'},
      {id:'granitization',label:'Granitisation',objective:'Distinguer granite d’anatexie et granite intrusif par leurs relations avec les roches encaissantes'}
    ],
    learning_objectives:['Reconnaître subduction, obduction et collision','Relier contraintes et déformations','Interpréter un diagramme pression-température','Comparer anatexie, intrusion et métamorphisme de contact'],
    commands:['start','set_variant','reset','place_stage','set_deformation_parameters','run_deformation_test','set_pt','record_pt','assign_granite_evidence','check','reveal_hint','highlight'],
    command_schema:{set_variant:{variant_id:'chains | deformations | metamorphism | granitization'},place_stage:{slot:'0..3',stage:'Océanisation | Subduction | Obduction | Collision'},set_deformation_parameters:{constraint:'compression | extension',behavior:'ductile | brittle',shortening:'0..100'},run_deformation_test:{},set_pt:{pressure_gpa:'0.1..2.5',temperature_c:'200..850'},record_pt:{},assign_granite_evidence:{evidence_id:'migmatite | fusion | transition | pluton | aureole | corneenne',granite_type:'anatexie | intrusif'},reveal_hint:{level:'1..3'},highlight:{target:'hotspot id'}},
    state_schema:{simulation_status:'idle | running | finished',current_variant:'variant id',skill:'compétence',attempts:'nombre',hints_used:'nombre',student_answer:'construction réelle',expected_answer:'attendu',deformation_tests:'essais observés',pt_conditions:'pression et température',metamorphic_records:'faciès enregistrés',granite_assignments:'classement',completed_variants:'liste'}
  };
  const IMG='/media/images/svt/ch4_geodynamique_interne/';
  const DATA={
    chains:{image:IMG+'cycle_orogenique_3d.webp',alt:'Cycle orogénique de l’océan à la chaîne de collision',kicker:'CHAÎNES RÉCENTES',title:'Reconstruis l’histoire d’une chaîne',instruction:'Touche ou glisse les quatre étapes dans l’ordre chronologique.',visualTitle:'De l’océan à la montagne',visualCaption:'Les roches et les structures gardent la mémoire des étapes.',expected:['Océanisation','Subduction','Obduction','Collision'],bank:['Collision','Océanisation','Obduction','Subduction'],skill:'reconstituer_une_histoire_orogenique',observations:['Une fosse et un arc volcanique indiquent une subduction','Une ophiolite sur un continent indique une obduction','Une racine crustale et des nappes indiquent une collision']},
    deformations:{image:IMG+'plis_failles_charriage.webp',alt:'Bloc géologique montrant plis, faille inverse et nappe',kicker:'DÉFORMATIONS',title:'Fais travailler les roches',instruction:'Change la contrainte, le comportement et le raccourcissement, puis simule.',visualTitle:'Compression et raccourcissement',visualCaption:'Une même contrainte produit des structures différentes selon le comportement.',expected:['Pli','Faille inverse','Chevauchement / nappe'],skill:'relier_contrainte_et_deformation',observations:['La compression raccourcit les couches','Un comportement ductile favorise les plis','Un comportement cassant favorise failles inverses et chevauchements']},
    metamorphism:{image:IMG+'roches_metamorphiques_lames_minces.webp',alt:'Roches métamorphiques et minéraux observés en lame mince',kicker:'PRESSION · TEMPÉRATURE',title:'Explore les domaines métamorphiques',instruction:'Déplace P et T ou choisis un échantillon, puis enregistre quatre signatures.',visualTitle:'Les minéraux sont des thermobaromètres',visualCaption:'Glaucophane, grenat ou foliation révèlent les conditions subies.',expected:['Schiste bleu','Éclogite','Gneiss','Cornéenne'],skill:'interpreter_un_diagramme_pt',observations:['Le schiste bleu traduit HP-BT en subduction','L’éclogite traduit une subduction profonde','Le gneiss traduit un métamorphisme régional thermodynamique','La cornéenne traduit un métamorphisme de contact']},
    granitization:{image:IMG+'granitisation_anatexie_intrusion.webp',alt:'Comparaison granite d’anatexie et granite intrusif',kicker:'GRANITISATION',title:'Classe les indices des deux granites',instruction:'Sélectionne un indice, puis attribue-le à l’anatexie ou à l’intrusion.',visualTitle:'Deux granites, deux relations',visualCaption:'La largeur des transformations et les roches voisines permettent de conclure.',expected:{migmatite:'anatexie',fusion:'anatexie',transition:'anatexie',pluton:'intrusif',aureole:'intrusif',corneenne:'intrusif'},skill:'distinguer_anatexie_et_intrusion',observations:['Le granite d’anatexie prolonge une fusion partielle régionale','Le granite intrusif recoupe les roches','Une intrusion crée une auréole de contact limitée']}
  };
  const EVIDENCE={migmatite:'Migmatite + gneiss',fusion:'Fusion partielle profonde',transition:'Transition régionale large',pluton:'Pluton aux limites nettes',aureole:'Auréole limitée',corneenne:'Cornéenne de contact'};
  const SAMPLE_PT={blue:{label:'Schiste bleu',p:1.35,t:400},eclogite:{label:'Éclogite',p:2.15,t:580},gneiss:{label:'Gneiss',p:.85,t:700},hornfels:{label:'Cornéenne',p:.25,t:650}};
  const requested=new URLSearchParams(location.search).get('variant');
  const initial=DATA[requested]?requested:'chains';
  const state={actions:[],currentVariant:initial,simulationStatus:'idle',variantsCompleted:[],attempts:0,hintsUsed:0,observedHotspots:[],stageOrder:Array(4).fill(null),selectedStage:null,deformationParams:{constraint:'compression',behavior:'ductile',shortening:35},deformationTests:[],pt:{p:1.35,t:400},metamorphicRecords:[],graniteAssignments:{},selectedEvidence:null,speed:1};
  const els={nav:document.getElementById('labNav'),xpText:document.getElementById('xpText'),xpFill:document.getElementById('xpFill'),visualCard:document.getElementById('visualCard'),image:document.getElementById('sceneImage'),hotspots:document.getElementById('hotspots'),visualStep:document.getElementById('visualStep'),visualHeading:document.getElementById('visualHeading'),visualCaption:document.getElementById('visualCaption'),kicker:document.getElementById('kicker'),title:document.getElementById('labTitle'),instruction:document.getElementById('instruction'),status:document.getElementById('statusPill'),bench:document.getElementById('workbench'),feedback:document.getElementById('feedback'),guide:document.getElementById('guide'),undo:document.getElementById('undoBtn'),hint:document.getElementById('hintBtn'),reset:document.getElementById('resetBtn'),check:document.getElementById('checkBtn')};
  function record(action,details={}){state.actions.push({action,variant:state.currentVariant,details,timestamp:Date.now()});if(state.actions.length>60)state.actions=state.actions.slice(-60)}
  function currentAnswer(){if(state.currentVariant==='chains')return [...state.stageOrder];if(state.currentVariant==='deformations')return [...state.deformationTests];if(state.currentVariant==='metamorphism')return [...state.metamorphicRecords];return {...state.graniteAssignments}}
  function snapshot(extra={}){const d=DATA[state.currentVariant];const base={simulation_status:state.simulationStatus,current_variant:state.currentVariant,variant_label:window.SIMULATION_CONFIG.variants.find(v=>v.id===state.currentVariant)?.label,skill:d.skill,attempts:state.attempts,hints_used:state.hintsUsed,student_answer:currentAnswer(),expected_answer:d.expected,completed_variants:[...state.variantsCompleted],observed_hotspots:[...state.observedHotspots],observations:d.observations,deformation_parameters:{...state.deformationParams},deformation_tests:[...state.deformationTests],pt_conditions:{pressure_gpa:state.pt.p,temperature_c:state.pt.t,...classifyPT(state.pt.p,state.pt.t)},metamorphic_records:[...state.metamorphicRecords],granite_assignments:{...state.graniteAssignments}};return Object.assign(base,extra)}
  function sendState(extra={}){window.parent.postMessage({type:'simulation_state',simulation_id:window.SIMULATION_CONFIG.id,student_actions:state.actions,current_state:snapshot(extra),objective_progress:state.variantsCompleted.length/4,timestamp:Date.now()},'*')}
  function setFeedback(text,type=''){els.feedback.className='feedback'+(type?' '+type:'');els.feedback.textContent=text}
  function showGuidance(text){if(!text)return;els.guide.textContent='🤖 '+text;els.guide.classList.add('show');clearTimeout(showGuidance.timer);showGuidance.timer=setTimeout(()=>els.guide.classList.remove('show'),4200)}
  function scan(){els.visualCard.classList.remove('scan');void els.visualCard.offsetWidth;els.visualCard.classList.add('scan')}
  function updateProgress(){els.xpText.textContent=state.variantsCompleted.length+'/4';els.xpFill.style.width=(state.variantsCompleted.length/4*100)+'%';renderNav()}
  function renderNav(){const shortLabels={chains:'Chaînes',deformations:'Défo.',metamorphism:'Métam.',granitization:'Granite'};els.nav.innerHTML='';window.SIMULATION_CONFIG.variants.forEach((v,i)=>{const b=document.createElement('button');const fullLabel=(i+1)+' · '+v.label;b.className='lab-tab'+(v.id===state.currentVariant?' active':'')+(state.variantsCompleted.includes(v.id)?' done':'');b.setAttribute('aria-label',fullLabel);b.innerHTML='<span class="lab-tab-full">'+fullLabel+'</span><span class="lab-tab-short">'+(i+1)+' '+shortLabels[v.id]+'</span>';b.onclick=()=>runVariant(v.id);els.nav.appendChild(b)})}
  function renderHotspots(){const sets={chains:[['ridge','Dorsale',12,45,'violet'],['trench','Fosse',39,42,'teal'],['arc','Arc volcanique',54,34,'orange'],['ophiolite','Ophiolite',69,48,'teal'],['root','Racine crustale',85,69,'coral']],deformations:[['fold','Pli',23,52,'violet'],['reverse_fault','Faille inverse',58,64,'coral'],['nappe','Nappe',79,44,'orange']],metamorphism:[['greenschist','Schiste vert',13,37,'teal'],['glaucophane','Glaucophane',38,38,'violet'],['garnet','Grenat',64,38,'coral'],['gneiss','Gneiss',88,38,'orange']],granitization:[['migmatite','Migmatite',21,45,'violet'],['anatexis','Anatexie',34,72,'orange'],['pluton','Pluton',72,54,'coral'],['aureole','Auréole',82,47,'teal']]}[state.currentVariant];els.hotspots.innerHTML='';sets.forEach(([id,label,x,y,color])=>{const b=document.createElement('button');b.className='hotspot '+color;b.id='hotspot-'+id;b.textContent=label;b.style.left=x+'%';b.style.top=y+'%';b.onclick=()=>{if(!state.observedHotspots.includes(id))state.observedHotspots.push(id);record('inspect_hotspot',{target:id});highlightTarget(id);sendState({last_inspected_structure:id})};els.hotspots.appendChild(b)})}
  function highlightTarget(target){const b=document.getElementById('hotspot-'+target);if(b){b.classList.remove('pulse');void b.offsetWidth;b.classList.add('pulse')}showGuidance('Observe : '+target)}
  function renderWorkbench(){if(state.currentVariant==='chains')renderChains();else if(state.currentVariant==='deformations')renderDeformations();else if(state.currentVariant==='metamorphism')renderMetamorphism();else renderGranitization()}
  function renderChains(){els.bench.innerHTML='<div class="bench-label">Chronologie · du plus ancien au plus récent</div><div class="slots" id="stageSlots"></div><div class="bench-label">Étapes géodynamiques · glisser ou toucher</div><div class="bank" id="stageBank"></div><div class="result-line"><span>Indice final attendu</span><span class="result-name">Raccourcissement + racine crustale</span></div>';renderStageSlots();renderStageBank()}
  function renderStageSlots(){const h=document.getElementById('stageSlots');if(!h)return;h.innerHTML='';for(let i=0;i<4;i++){const b=document.createElement('button');b.className='drop-slot'+(state.stageOrder[i]?' filled':'');b.textContent=state.stageOrder[i]||('Étape '+(i+1));b.ondragover=e=>e.preventDefault();b.ondrop=e=>{e.preventDefault();placeStage(i,e.dataTransfer.getData('text/plain'))};b.onclick=()=>{if(state.selectedStage)placeStage(i,state.selectedStage);else if(state.stageOrder[i]){record('remove_stage',{slot:i,stage:state.stageOrder[i]});state.stageOrder[i]=null;renderChains();sendState()}};h.appendChild(b)}}
  function renderStageBank(){const h=document.getElementById('stageBank');if(!h)return;h.innerHTML='';DATA.chains.bank.forEach(stage=>{const b=document.createElement('button');b.className='token'+(state.selectedStage===stage?' selected':'')+(state.stageOrder.includes(stage)?' used':'');b.textContent=stage;b.draggable=true;b.ondragstart=e=>e.dataTransfer.setData('text/plain',stage);b.onclick=()=>{state.selectedStage=stage;const i=state.stageOrder.findIndex(v=>!v);if(i>=0)placeStage(i,stage);else renderStageBank()};h.appendChild(b)})}
  function placeStage(slot,stage){if(!DATA.chains.expected.includes(stage)||slot<0||slot>3)return;const old=state.stageOrder.indexOf(stage);if(old>=0)state.stageOrder[old]=null;state.stageOrder[slot]=stage;state.selectedStage=null;record('place_stage',{slot,stage});renderChains();setFeedback('Étape placée. Observe la scène pour vérifier la chronologie.');sendState({last_manipulation:{type:'place_stage',slot,stage}})}
  function deformationResult(){const p=state.deformationParams;if(p.constraint==='extension')return{structure:'Faille normale',note:'Extension : ce n’est pas la contrainte dominante d’une chaîne de collision.'};if(p.behavior==='ductile')return{structure:'Pli',note:'La roche ductile se déforme sans rupture.'};if(p.shortening>=65)return{structure:'Chevauchement / nappe',note:'Fort raccourcissement cassant : déplacement sur une faille inverse peu inclinée.'};return{structure:'Faille inverse',note:'Compression cassante : le compartiment supérieur remonte.'}}
  function deformPaths(result){if(result==='Pli')return'<path d="M20 120 Q110 15 200 120 T380 120 T560 120" stroke="#d17b39"/><path d="M20 145 Q110 40 200 145 T380 145 T560 145" stroke="#526fb9"/>';if(result==='Faille normale')return'<path d="M20 80 L250 80 M340 125 L580 125" stroke="#d17b39"/><path class="fault" d="M300 20 L260 165"/>';if(result==='Faille inverse')return'<path d="M20 120 L290 120 M245 78 L580 78" stroke="#d17b39"/><path class="fault" d="M300 20 L255 165"/>';return'<path d="M20 130 L260 130 Q340 115 580 75" stroke="#d17b39"/><path d="M20 150 L255 150 Q350 135 580 95" stroke="#526fb9"/><path class="fault" d="M245 150 Q350 125 580 82"/>'}
  function renderDeformations(){const p=state.deformationParams,r=deformationResult();els.bench.innerHTML=`<div class="control-grid"><div class="control-box"><b>Contrainte</b><div class="seg"><button data-constraint="compression" class="${p.constraint==='compression'?'active':''}">Compression</button><button data-constraint="extension" class="${p.constraint==='extension'?'active':''}">Extension</button></div></div><div class="control-box"><b>Comportement</b><div class="seg"><button data-behavior="ductile" class="${p.behavior==='ductile'?'active':''}">Ductile</button><button data-behavior="brittle" class="${p.behavior==='brittle'?'active':''}">Cassant</button></div></div><div class="control-box"><b>Raccourcissement · <span id="shortValue">${p.shortening}%</span></b><input id="shortRange" type="range" min="0" max="100" value="${p.shortening}"></div></div><svg class="deform-svg" viewBox="0 0 600 180" role="img" aria-label="Résultat schématique de la déformation">${deformPaths(r.structure)}</svg><div class="result-line"><span>${r.note}</span><button class="token" id="runDeformation">Tester · ${r.structure}</button></div><div class="structure-targets">${DATA.deformations.expected.map(x=>`<div class="structure-chip ${state.deformationTests.some(t=>t.structure===x)?'seen':''}">${state.deformationTests.some(t=>t.structure===x)?'✓ ':''}${x}</div>`).join('')}</div>`;document.querySelectorAll('[data-constraint]').forEach(b=>b.onclick=()=>setDeformation({constraint:b.dataset.constraint}));document.querySelectorAll('[data-behavior]').forEach(b=>b.onclick=()=>setDeformation({behavior:b.dataset.behavior}));const range=document.getElementById('shortRange');range.onchange=()=>{state.deformationParams.shortening=Number(range.value);renderDeformations();sendState({last_manipulation:{type:'set_shortening',shortening:state.deformationParams.shortening}})};document.getElementById('runDeformation').onclick=runDeformationTest}
  function setDeformation(params){Object.assign(state.deformationParams,params);record('set_deformation_parameters',{...state.deformationParams});renderDeformations();sendState({last_manipulation:{type:'set_deformation_parameters',...state.deformationParams}})}
  function runDeformationTest(){const result=deformationResult();const test={...state.deformationParams,structure:result.structure,observation:result.note};if(!state.deformationTests.some(t=>t.structure===test.structure))state.deformationTests.push(test);record('run_deformation_test',test);renderDeformations();scan();setFeedback(result.structure+' observé. Change les paramètres pour obtenir une autre structure.','ok');sendState({last_manipulation:{type:'run_deformation_test',...test}})}
  function classifyPT(p,t){if(p>=1.8&&t>=450&&t<=700)return{facies:'Éclogite',minerals:['Grenat','Jadéite'],context:'Subduction profonde · HP'};if(p>=1.0&&t<=520)return{facies:'Schiste bleu',minerals:['Glaucophane'],context:'Subduction · HP-BT'};if(p<=.45&&t>=580)return{facies:'Cornéenne',minerals:['Minéraux non foliés'],context:'Métamorphisme thermique de contact'};if(p>=.5&&p<=1.3&&t>=600)return{facies:'Gneiss',minerals:['Biotite','Feldspath','Quartz'],context:'Collision · métamorphisme régional'};if(t<500)return{facies:'Schiste vert',minerals:['Chlorite','Actinote'],context:'Faible degré'};return{facies:'Amphibolite',minerals:['Hornblende','Plagioclase'],context:'Degré moyen'} }
  function renderMetamorphism(){const s=classifyPT(state.pt.p,state.pt.t);const px=52+(state.pt.t-200)/650*455,py=245-(state.pt.p-.1)/2.4*205;els.bench.innerHTML=`<div class="pt-layout"><div class="pt-chart"><svg viewBox="0 0 540 270" role="img" aria-label="Diagramme pression température"><rect x="52" y="30" width="455" height="215" rx="9" fill="#f7f9fc"/><path d="M52 210 L230 210 L245 135 L52 135 Z" fill="#d7f5e8" opacity=".9"/><path d="M120 135 L330 135 L310 65 L170 55 Z" fill="#dce8ff" opacity=".95"/><path d="M290 105 L507 115 L507 30 L335 30 Z" fill="#ffe4df" opacity=".9"/><path d="M280 210 L507 210 L507 125 L335 115 Z" fill="#fff0c7" opacity=".9"/><text x="75" y="190" font-size="15">Schiste vert</text><text x="180" y="98" font-size="15">Schiste bleu</text><text x="395" y="72" font-size="15">Éclogite</text><text x="390" y="180" font-size="15">Gneiss / HT</text><line x1="52" y1="245" x2="507" y2="245" stroke="#596579"/><line x1="52" y1="30" x2="52" y2="245" stroke="#596579"/><text x="210" y="263" font-size="13">Température (°C)</text><text x="5" y="135" font-size="13" transform="rotate(-90 12 135)">Pression (GPa)</text><circle cx="${px}" cy="${py}" r="9" fill="#3157c8" stroke="white" stroke-width="4"/></svg></div><div class="pt-controls"><div class="pt-value"><span>Pression</span><span>${state.pt.p.toFixed(2)} GPa</span></div><input id="pRange" type="range" min="0.1" max="2.5" step="0.05" value="${state.pt.p}"><div class="pt-value"><span>Température</span><span>${state.pt.t} °C</span></div><input id="tRange" type="range" min="200" max="850" step="10" value="${state.pt.t}"><div class="sample-grid">${Object.entries(SAMPLE_PT).map(([id,x])=>`<button class="sample-btn ${state.metamorphicRecords.some(r=>r.facies===x.label)?'seen':''}" data-sample="${id}">${state.metamorphicRecords.some(r=>r.facies===x.label)?'✓ ':''}${x.label}</button>`).join('')}</div><div class="signature"><b>${s.facies}</b><br>${s.minerals.join(' + ')}<br><span>${s.context}</span></div><button class="token" id="recordPt">Enregistrer cette signature</button></div></div>`;document.getElementById('pRange').onchange=e=>setPT(Number(e.target.value),state.pt.t,false);document.getElementById('tRange').onchange=e=>setPT(state.pt.p,Number(e.target.value),false);document.querySelectorAll('[data-sample]').forEach(b=>b.onclick=()=>{const x=SAMPLE_PT[b.dataset.sample];setPT(x.p,x.t,true)});document.getElementById('recordPt').onclick=recordPT}
  function setPT(p,t,fromPreset=false){state.pt={p:Math.max(.1,Math.min(2.5,p)),t:Math.max(200,Math.min(850,t))};record('set_pt',{pressure_gpa:state.pt.p,temperature_c:state.pt.t,from_preset:fromPreset});renderMetamorphism();sendState({last_manipulation:{type:'set_pt',pressure_gpa:state.pt.p,temperature_c:state.pt.t}})}
  function recordPT(){const s=classifyPT(state.pt.p,state.pt.t),item={pressure_gpa:state.pt.p,temperature_c:state.pt.t,...s};if(!state.metamorphicRecords.some(r=>r.facies===s.facies))state.metamorphicRecords.push(item);record('record_pt',item);renderMetamorphism();scan();setFeedback(s.facies+' enregistré : '+s.context+'.','ok');sendState({last_manipulation:{type:'record_pt',...item}})}
  function renderGranitization(){const assigned=state.graniteAssignments;els.bench.innerHTML=`<div class="bench-label">Indices à classer · touche une carte puis une zone</div><div class="bank">${Object.entries(EVIDENCE).map(([id,label])=>`<button class="token ${state.selectedEvidence===id?'selected':''} ${assigned[id]?'used':''}" data-evidence="${id}">${label}</button>`).join('')}</div><div class="granite-layout"><button class="target-zone" data-granite="anatexie"><h3>Granite d’anatexie</h3>${Object.entries(assigned).filter(([,v])=>v==='anatexie').map(([id])=>`<span class="evidence-chip">${EVIDENCE[id]}</span>`).join('')}</button><button class="target-zone" data-granite="intrusif"><h3>Granite intrusif</h3>${Object.entries(assigned).filter(([,v])=>v==='intrusif').map(([id])=>`<span class="evidence-chip">${EVIDENCE[id]}</span>`).join('')}</button></div>`;document.querySelectorAll('[data-evidence]').forEach(b=>b.onclick=()=>{state.selectedEvidence=b.dataset.evidence;renderGranitization()});document.querySelectorAll('[data-granite]').forEach(b=>b.onclick=()=>{if(state.selectedEvidence)assignGraniteEvidence(state.selectedEvidence,b.dataset.granite)})}
  function assignGraniteEvidence(id,type){if(!EVIDENCE[id]||!['anatexie','intrusif'].includes(type))return;state.graniteAssignments[id]=type;state.selectedEvidence=null;record('assign_granite_evidence',{evidence_id:id,granite_type:type});renderGranitization();sendState({last_manipulation:{type:'assign_granite_evidence',evidence_id:id,granite_type:type}})}
  function runVariant(id){if(!DATA[id])return;state.currentVariant=id;state.simulationStatus='running';state.attempts=0;state.hintsUsed=0;state.selectedStage=null;state.selectedEvidence=null;if(id==='chains')state.stageOrder=Array(4).fill(null);if(id==='deformations')state.deformationTests=[];if(id==='metamorphism')state.metamorphicRecords=[];if(id==='granitization')state.graniteAssignments={};const d=DATA[id];record('set_variant',{variant_id:id});els.image.src=d.image;els.image.alt=d.alt;els.kicker.textContent=d.kicker;els.title.textContent=d.title;els.instruction.textContent=d.instruction;els.visualStep.textContent='EXPÉRIENCE '+(window.SIMULATION_CONFIG.variants.findIndex(v=>v.id===id)+1)+'/4';els.visualHeading.textContent=d.visualTitle;els.visualCaption.textContent=d.visualCaption;els.status.textContent='En manipulation';els.check.textContent='Vérifier l’expérience';renderHotspots();renderWorkbench();updateProgress();setFeedback('Observe la scène puis commence la manipulation.');scan();sendState()}
  function checkExperiment(){state.attempts++;let correct=false,errors=[];const d=DATA[state.currentVariant];if(state.currentVariant==='chains'){correct=d.expected.every((v,i)=>state.stageOrder[i]===v);errors=d.expected.map((v,i)=>state.stageOrder[i]===v?null:{position:i+1,student:state.stageOrder[i]||'vide',expected:v}).filter(Boolean);document.querySelectorAll('.drop-slot').forEach((x,i)=>x.classList.add(state.stageOrder[i]===d.expected[i]?'good':'bad'))}else if(state.currentVariant==='deformations'){const seen=state.deformationTests.map(x=>x.structure);correct=d.expected.every(x=>seen.includes(x));errors=d.expected.filter(x=>!seen.includes(x))}else if(state.currentVariant==='metamorphism'){const seen=state.metamorphicRecords.map(x=>x.facies);correct=d.expected.every(x=>seen.includes(x));errors=d.expected.filter(x=>!seen.includes(x))}else{correct=Object.entries(d.expected).every(([k,v])=>state.graniteAssignments[k]===v);errors=Object.entries(d.expected).filter(([k,v])=>state.graniteAssignments[k]!==v).map(([k,v])=>({evidence:EVIDENCE[k],student:state.graniteAssignments[k]||'non classé',expected:v}))}record('check_experiment',{correct,errors});if(!correct){setFeedback(errors.length+' élément(s) restent à corriger. Utilise l’image et les indices.','no');sendState({correct:false,errors});return}if(!state.variantsCompleted.includes(state.currentVariant))state.variantsCompleted.push(state.currentVariant);state.simulationStatus='finished';els.status.textContent='Expérience réussie';setFeedback('✓ Expérience réussie. Explique maintenant ton indice principal au tuteur.','ok');record('finish_simulation',{correct:true});updateProgress();scan();sendState({correct:true,errors:[],validated_evidence:currentAnswer()})}
  function revealHint(level){state.hintsUsed++;const hints={chains:['Commence par créer un domaine océanique.','La subduction précède la fermeture complète.','Ordre : Océanisation · Subduction · Obduction · Collision'],deformations:['Compression + ductile donne un pli.','Compression + cassant donne une faille inverse.','Augmente le raccourcissement cassant pour obtenir une nappe.'],metamorphism:['HP-BT : cherche le glaucophane.','Grenat + jadéite indiquent l’éclogite.','N’oublie pas gneiss régional et cornéenne de contact.'],granitization:['Migmatite et fusion partielle vont ensemble.','Une auréole limitée entoure une intrusion.','Anatexie : migmatite, fusion, transition large. Intrusif : pluton, auréole, cornéenne.']}[state.currentVariant];const text=hints[Math.min((level||state.hintsUsed)-1,2)];record('request_hint',{level:level||state.hintsUsed});setFeedback('💡 '+text);showGuidance(text);sendState({last_hint:text})}
  function undoLast(){if(state.currentVariant==='chains'){const i=[...state.stageOrder].map((v,i)=>v?i:-1).filter(i=>i>=0).pop();if(i!==undefined)state.stageOrder[i]=null}else if(state.currentVariant==='deformations')state.deformationTests.pop();else if(state.currentVariant==='metamorphism')state.metamorphicRecords.pop();else{const k=Object.keys(state.graniteAssignments).pop();if(k)delete state.graniteAssignments[k]}record('undo');renderWorkbench();sendState()}
  function resetSimulation(){record('reset_simulation');runVariant(state.currentVariant)}function startSimulation(){state.simulationStatus='running';record('start_simulation');sendState()}
  window.runVariant=runVariant;window.startSimulation=startSimulation;window.resetSimulation=resetSimulation;window.placeStage=placeStage;window.setDeformationParameters=setDeformation;window.runDeformationTest=runDeformationTest;window.setPT=setPT;window.recordPT=recordPT;window.assignGraniteEvidence=assignGraniteEvidence;window.checkExperiment=checkExperiment;window.highlightTarget=highlightTarget;
  window.executeAICommand=function(command,p={}){switch(command){case'start':startSimulation();break;case'set_variant':runVariant(p.variant_id);break;case'reset':resetSimulation();break;case'place_stage':if(state.currentVariant!=='chains')runVariant('chains');placeStage(Number(p.slot),p.stage);break;case'set_deformation_parameters':if(state.currentVariant!=='deformations')runVariant('deformations');setDeformation({constraint:p.constraint||state.deformationParams.constraint,behavior:p.behavior||state.deformationParams.behavior,shortening:Number.isFinite(Number(p.shortening))?Number(p.shortening):state.deformationParams.shortening});break;case'run_deformation_test':runDeformationTest();break;case'set_pt':if(state.currentVariant!=='metamorphism')runVariant('metamorphism');setPT(Number(p.pressure_gpa),Number(p.temperature_c),true);break;case'record_pt':recordPT();break;case'assign_granite_evidence':if(state.currentVariant!=='granitization')runVariant('granitization');assignGraniteEvidence(p.evidence_id,p.granite_type);break;case'check':checkExperiment();break;case'reveal_hint':revealHint(Number(p.level)||1);break;case'highlight':highlightTarget(p.target);break;default:console.warn('[GeoLab] Commande inconnue',command)}};
  window.addEventListener('message',e=>{const d=e.data||{};if(d.type==='simulation_control'&&(!d.simulation_id||d.simulation_id===window.SIMULATION_CONFIG.id)){if(d.guidance_text)showGuidance(d.guidance_text);window.executeAICommand(d.command,d.parameters||{})}});
  els.check.onclick=checkExperiment;els.hint.onclick=()=>revealHint();els.reset.onclick=resetSimulation;els.undo.onclick=undoLast;
  function sendManifest(){window.__SIMULATION_MANIFEST_SENT__=true;window.parent.postMessage({type:'simulation_manifest',simulation_id:window.SIMULATION_CONFIG.id,capabilities:{commands:window.SIMULATION_CONFIG.commands,globals:['executeAICommand','runVariant','startSimulation','resetSimulation','placeStage','setDeformationParameters','runDeformationTest','setPT','recordPT','assignGraniteEvidence','checkExperiment','highlightTarget'],config:window.SIMULATION_CONFIG,command_schema:window.SIMULATION_CONFIG.command_schema,state_schema:window.SIMULATION_CONFIG.state_schema},page_text:'Laboratoire avancé de géodynamique interne. Quatre expériences manipulables : chronologie d’une chaîne, déformations sous contrainte, diagramme pression-température et comparaison granite d’anatexie / granite intrusif. Chaque action, paramètre, observation et erreur est envoyé au tuteur IA.'},'*')}
  runVariant(initial);sendManifest();setTimeout(sendManifest,350);
</script>
