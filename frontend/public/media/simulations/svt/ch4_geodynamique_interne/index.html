<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>Géodynamique interne — au tableau</title>
  <link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css">
  <style>
    /* Géodynamique interne — réglages propres ; le style craie vient de shared/tableau/tableau.css */
    .scene { display: grid; grid-template-columns: minmax(0, 1fr) minmax(17em, 38%); gap: 1vw; }
    .dessin { position: relative; min-height: 0; }
    .panneau.etape { position: static; max-width: none; overflow: auto; display: flex; flex-direction: column; gap: .4em; }
    .panneau.etape h3 { font-size: 1.1em; }
    .jetons { display: flex; flex-wrap: wrap; gap: .35em; }
    .jetons .craie-btn, .cases .craie-btn { font-size: .92em; padding: .18em .7em; }
    .craie-btn.utilise { opacity: .35; }
    .cases { display: flex; flex-direction: column; gap: .3em; }
    .cases .craie-btn { text-align: left; color: var(--craie-faible); }
    .cases .craie-btn.rempli { color: var(--jaune); }
    .cases .craie-btn.bon { color: var(--vert); } .cases .craie-btn.faux { color: var(--rouge); }
    .cases .craie-btn::before { content: attr(data-n) '. '; color: var(--craie-faible); }
    .zones { display: grid; grid-template-columns: 1fr 1fr; gap: .4em; }
    .zones .craie-btn { white-space: normal; text-align: left; min-height: 5em; display: flex; flex-direction: column; align-items: flex-start; gap: .15em; }
    .zones .craie-btn b { font-weight: 400; color: var(--cyan); }
    .zones .craie-btn span { font-size: .85em; color: var(--jaune); }
    .reglages { display: flex; flex-direction: column; gap: .35em; }
    .reglages .choix { flex-direction: row; gap: 1em; flex-wrap: wrap; }
    .reglages .curseur { min-width: 0; }
    .signature { color: var(--jaune); }
    .signature b { font-weight: 400; color: var(--vert); font-size: 1.1em; }
    .signature span { color: var(--craie-faible); font-size: .9em; }
    .vu { color: var(--vert); }
    .objectifs-liste { margin: 0; padding-left: 1.2em; color: var(--craie-faible); font-size: .9em; }
    @media (max-width: 720px) { .scene { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1.1fr) minmax(0, 1fr); } .panneau.etape { font-size: .9em; } .zones { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="tableau">
  <header class="titre">
    <div><small>SVT · 2 BAC · géodynamique interne</small><h1 id="labTitle"></h1><p class="objectif" id="instruction"></p></div>
    <nav class="onglets" id="labNav" aria-label="Expériences"></nav>
  </header>
  <section class="scene">
    <div class="dessin"><canvas id="canvas" role="img" aria-label="Schéma géologique dessiné à la craie"></canvas></div>
    <div class="panneau etape" id="workbench" data-professor-point="atelier" data-professor-label="l’atelier"></div>
  </section>
  <footer class="barre">
    <button class="craie-btn principal" id="checkBtn" data-professor-control="check">Vérifier l’expérience</button>
    <button class="craie-btn secondaire" id="undoBtn" data-professor-control="undo">↶ Annuler</button>
    <button class="craie-btn secondaire" id="resetBtn" data-professor-control="reset">Recommencer</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
    <button class="craie-btn secondaire" id="hintBtn" data-professor-control="reveal_hint">Un indice</button>
    <span class="lecture" id="xpText"></span>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script>
(() => {
  'use strict';
  const { Craie, fr, bulle, ecrire, onglets, curseur, glisser, protocole, explication } = window.Tableau;
  // Script d'explication : le tuteur dit chaque phrase pendant que le professeur montre le repère du doigt.
  explication({
    chains: [
      { repere: 'ridge', texte: 'Tout commence par l’océanisation : à la dorsale, la lithosphère océanique se forme et s’écarte.' },
      { repere: 'trench', texte: 'Puis la lithosphère océanique, devenue dense, plonge sous l’autre plaque : c’est la subduction, marquée par une fosse.' },
      { repere: 'arc', texte: 'Au-dessus de la plaque plongeante, la fusion du manteau nourrit un arc volcanique.' },
      { repere: 'ophiolite', texte: 'Quand un morceau de croûte océanique est charrié sur le continent, c’est l’obduction : on retrouve une ophiolite en altitude.' },
      { repere: 'root', texte: 'Enfin, les deux continents entrent en collision : la croûte s’épaissit, forme des nappes et une racine crustale.' },
    ],
    deformations: [
      { repere: 'contrainte', texte: 'Dans une chaîne de collision, la contrainte dominante est la compression : les couches sont raccourcies.' },
      { repere: 'couches', texte: 'Une roche ductile, chaude et en profondeur, se plisse sans se casser : c’est le pli.' },
      { repere: 'reverse_fault', texte: 'Une roche cassante, froide et superficielle, se rompt : un compartiment chevauche l’autre, c’est la faille inverse.' },
      { repere: 'nappe', texte: 'Avec un fort raccourcissement, des paquets de roches glissent sur des kilomètres : ce sont les nappes de charriage.' },
    ],
    metamorphism: [
      { repere: 'diagramme', texte: 'Le diagramme pression–température situe chaque roche métamorphique selon les conditions qu’elle a subies.' },
      { repere: 'schiste_bleu', texte: 'Le schiste bleu, à glaucophane, traduit une haute pression et une basse température : la plaque froide qui plonge en subduction.' },
      { repere: 'eclogite', texte: 'Plus profond encore, l’éclogite à grenat et jadéite marque une subduction très profonde.' },
      { repere: 'gneiss_ht', texte: 'Le gneiss, à haute température et pression moyenne, est typique de la racine d’une collision.' },
      { repere: 'point_pt', texte: 'Glisse le point sur le diagramme : les minéraux index changent avec le domaine traversé.' },
    ],
    granitization: [
      { repere: 'migmatite', texte: 'À la base de la croûte épaissie, les gneiss fondent partiellement : la migmatite mêle parties fondues et parties solides.' },
      { repere: 'granite_anatexie', texte: 'Cette fusion partielle, l’anatexie, donne un granite qui passe progressivement aux roches encaissantes : la transition est large.' },
      { repere: 'pluton', texte: 'Le granite intrusif, lui, vient d’un magma monté de plus bas et refroidi en place : le pluton a des limites nettes.' },
      { repere: 'aureole', texte: 'Sa chaleur cuit les roches voisines sur une auréole limitée : c’est le métamorphisme de contact, avec des cornéennes.' },
    ],
  });
  window.SIMULATION_CONFIG={
    id:'svt_internal_geodynamics_advanced_lab',title:'Laboratoire avancé de géodynamique interne',version:'2.0',
    variants:[
      {id:'chains',label:'Chaînes',objective:'Reconstituer océanisation, subduction, obduction et collision et reconnaître leurs indices'},
      {id:'deformations',label:'Déformations',objective:'Relier comportement des roches et compression aux plis, failles inverses et nappes'},
      {id:'metamorphism',label:'Métamorphisme',objective:'Relier pression, température, minéraux index, faciès et contexte tectonique'},
      {id:'granitization',label:'Granitisation',objective:'Distinguer granite d’anatexie et granite intrusif par leurs relations avec les roches encaissantes'}
    ],
    learning_objectives:['Reconnaître subduction, obduction et collision','Relier contraintes et déformations','Interpréter un diagramme pression-température','Comparer anatexie, intrusion et métamorphisme de contact'],
    commands:['start','set_variant','reset','undo','place_stage','set_deformation_parameters','run_deformation_test','set_pt','record_pt','assign_granite_evidence','check','reveal_hint','highlight'],
    command_schema:{set_variant:{variant_id:'chains | deformations | metamorphism | granitization'},place_stage:{slot:'0..3',stage:'Océanisation | Subduction | Obduction | Collision'},set_deformation_parameters:{constraint:'compression | extension',behavior:'ductile | brittle',shortening:'0..100'},run_deformation_test:{},set_pt:{pressure_gpa:'0.1..2.5',temperature_c:'200..850'},record_pt:{},assign_granite_evidence:{evidence_id:'migmatite | fusion | transition | pluton | aureole | corneenne',granite_type:'anatexie | intrusif'},reveal_hint:{level:'1..3'},highlight:{target:'hotspot id'}},
    state_schema:{simulation_status:'idle | running | finished',current_variant:'variant id',skill:'compétence',attempts:'nombre',hints_used:'nombre',student_answer:'construction réelle',expected_answer:'attendu',deformation_tests:'essais observés',pt_conditions:'pression et température',metamorphic_records:'faciès enregistrés',granite_assignments:'classement',completed_variants:'liste'}
  };
  const CFG=window.SIMULATION_CONFIG;
  const DATA={
    chains:{kicker:'CHAÎNES RÉCENTES',title:'Reconstruis l’histoire d’une chaîne',instruction:'Place les quatre étapes dans l’ordre chronologique, puis vérifie.',expected:['Océanisation','Subduction','Obduction','Collision'],bank:['Collision','Océanisation','Obduction','Subduction'],skill:'reconstituer_une_histoire_orogenique',observations:['Une fosse et un arc volcanique indiquent une subduction','Une ophiolite sur un continent indique une obduction','Une racine crustale et des nappes indiquent une collision']},
    deformations:{kicker:'DÉFORMATIONS',title:'Fais travailler les roches',instruction:'Change la contrainte, le comportement et le raccourcissement, puis teste jusqu’à obtenir pli, faille inverse et nappe.',expected:['Pli','Faille inverse','Chevauchement / nappe'],skill:'relier_contrainte_et_deformation',observations:['La compression raccourcit les couches','Un comportement ductile favorise les plis','Un comportement cassant favorise failles inverses et chevauchements']},
    metamorphism:{kicker:'PRESSION · TEMPÉRATURE',title:'Explore les domaines métamorphiques',instruction:'Glisse le point sur le diagramme ou choisis un échantillon, puis enregistre quatre signatures.',expected:['Schiste bleu','Éclogite','Gneiss','Cornéenne'],skill:'interpreter_un_diagramme_pt',observations:['Le schiste bleu traduit HP-BT en subduction','L’éclogite traduit une subduction profonde','Le gneiss traduit un métamorphisme régional thermodynamique','La cornéenne traduit un métamorphisme de contact']},
    granitization:{kicker:'GRANITISATION',title:'Classe les indices des deux granites',instruction:'Choisis un indice, puis attribue-le à l’anatexie ou à l’intrusion.',expected:{migmatite:'anatexie',fusion:'anatexie',transition:'anatexie',pluton:'intrusif',aureole:'intrusif',corneenne:'intrusif'},skill:'distinguer_anatexie_et_intrusion',observations:['Le granite d’anatexie prolonge une fusion partielle régionale','Le granite intrusif recoupe les roches','Une intrusion crée une auréole de contact limitée']}
  };
  const EVIDENCE={migmatite:'Migmatite + gneiss',fusion:'Fusion partielle profonde',transition:'Transition régionale large',pluton:'Pluton aux limites nettes',aureole:'Auréole limitée',corneenne:'Cornéenne de contact'};
  const SAMPLE_PT={blue:{label:'Schiste bleu',p:1.35,t:400},eclogite:{label:'Éclogite',p:2.15,t:580},gneiss:{label:'Gneiss',p:.85,t:700},hornfels:{label:'Cornéenne',p:.25,t:650}};
  // Repères (hotspots) dessinés à la craie : [id, libellé, x, y] dans le repère logique 760 × 380.
  const HOTSPOTS={chains:[['ridge','Dorsale',120,118],['trench','Fosse',318,140],['arc','Arc volcanique',400,60],['ophiolite','Ophiolite',525,78],['root','Racine crustale',650,330]],deformations:[['fold','Pli',125,352],['reverse_fault','Faille inverse',380,352],['nappe','Nappe',635,352]],metamorphism:[['greenschist','Schiste vert',140,300],['glaucophane','Glaucophane',250,180],['garnet','Grenat',520,80],['gneiss','Gneiss',560,250]],granitization:[['migmatite','Migmatite',150,120],['anatexis','Anatexie',150,320],['pluton','Pluton',560,230],['aureole','Auréole',560,95]]};
  const requested=new URLSearchParams(location.search).get('variant');
  const initial=DATA[requested]?requested:'chains';
  const state={currentVariant:initial,simulationStatus:'idle',variantsCompleted:[],attempts:0,hintsUsed:0,observedHotspots:[],stageOrder:Array(4).fill(null),selectedStage:null,deformationParams:{constraint:'compression',behavior:'ductile',shortening:35},deformationTests:[],pt:{p:1.35,t:400},metamorphicRecords:[],graniteAssignments:{},selectedEvidence:null,checked:null,pulse:null,ouvert:performance.now(),dirty:true};
  const $=id=>document.getElementById(id);
  const els={nav:$('labNav'),xpText:$('xpText'),title:$('labTitle'),instruction:$('instruction'),bench:$('workbench'),feedback:$('feedback'),undo:$('undoBtn'),hint:$('hintBtn'),reset:$('resetBtn'),check:$('checkBtn')};
  const scene=()=>(performance.now()-state.ouvert)/1000;
  const redraw=()=>{state.dirty=true};
  function currentAnswer(){if(state.currentVariant==='chains')return [...state.stageOrder];if(state.currentVariant==='deformations')return [...state.deformationTests];if(state.currentVariant==='metamorphism')return [...state.metamorphicRecords];return {...state.graniteAssignments}}
  function snapshot(){const d=DATA[state.currentVariant];return{simulation_status:state.simulationStatus,current_variant:state.currentVariant,variant_label:CFG.variants.find(v=>v.id===state.currentVariant)?.label,skill:d.skill,attempts:state.attempts,hints_used:state.hintsUsed,student_answer:currentAnswer(),expected_answer:d.expected,completed_variants:[...state.variantsCompleted],observed_hotspots:[...state.observedHotspots],observations:d.observations,deformation_parameters:{...state.deformationParams},deformation_tests:[...state.deformationTests],pt_conditions:{pressure_gpa:state.pt.p,temperature_c:state.pt.t,...classifyPT(state.pt.p,state.pt.t)},metamorphic_records:[...state.metamorphicRecords],granite_assignments:{...state.graniteAssignments}}}
  const pont=protocole({id:CFG.id,commandes:CFG.commands,config:CFG,etat:snapshot,progression:()=>state.variantsCompleted.length/4,executer,
    texte:'Laboratoire de géodynamique interne dessiné au tableau. Quatre expériences : chronologie d’une chaîne (coupe océan → collision), déformations sous contrainte (pli, faille inverse, nappe), diagramme pression-température avec point glissable, comparaison granite d’anatexie / granite intrusif. Chaque action, paramètre, observation et erreur est envoyé au tuteur.'});
  function record(action,details={}){pont.noter(action,{...details,variant:state.currentVariant})}
  function sendState(extra={}){pont.emettre(extra)}
  function setFeedback(text,type=''){bulle(els.feedback,text,type==='ok'?'good':type==='no'?'bad':'')}
  function showGuidance(text){if(text)setFeedback(text)}
  function updateProgress(){els.xpText.textContent=state.variantsCompleted.length+' / 4';onglets(els.nav,CFG.variants.map((v,i)=>({id:v.id,label:(i+1)+' · '+v.label})),state.currentVariant,runVariant,new Set(state.variantsCompleted))}

  // ── Atelier (panneau de droite) ─────────────────────────────────────────
  function renderWorkbench(){if(state.currentVariant==='chains')renderChains();else if(state.currentVariant==='deformations')renderDeformations();else if(state.currentVariant==='metamorphism')renderMetamorphism();else renderGranitization();redraw()}
  function renderChains(){const checked=state.checked;els.bench.innerHTML=`<h3>Chronologie · du plus ancien au plus récent</h3><div class="cases" data-professor-control="place_stage">${[0,1,2,3].map(i=>`<button class="craie-btn ${state.stageOrder[i]?'rempli':''} ${checked?(state.stageOrder[i]===DATA.chains.expected[i]?'bon':'faux'):''}" data-slot="${i}" data-n="${i+1}">${state.stageOrder[i]||'…'}</button>`).join('')}</div><h3>Étapes géodynamiques</h3><div class="jetons">${DATA.chains.bank.map(stage=>`<button class="craie-btn ${state.selectedStage===stage?'attention':''} ${state.stageOrder.includes(stage)?'utilise':''}" data-stage="${stage}" draggable="true">${stage}</button>`).join('')}</div><p class="legende">Clique une étape : elle prend la première case libre. Clique une case pour la vider. Indice final attendu : raccourcissement + racine crustale.</p>`;
    els.bench.querySelectorAll('[data-slot]').forEach(b=>{const i=Number(b.dataset.slot);b.ondragover=e=>e.preventDefault();b.ondrop=e=>{e.preventDefault();placeStage(i,e.dataTransfer.getData('text/plain'))};b.onclick=()=>{if(state.selectedStage)placeStage(i,state.selectedStage);else if(state.stageOrder[i]){record('remove_stage',{slot:i,stage:state.stageOrder[i]});state.stageOrder[i]=null;state.checked=null;renderChains();sendState()}}});
    els.bench.querySelectorAll('[data-stage]').forEach(b=>{const stage=b.dataset.stage;b.ondragstart=e=>e.dataTransfer.setData('text/plain',stage);b.onclick=()=>{state.selectedStage=stage;const i=state.stageOrder.findIndex(v=>!v);if(i>=0)placeStage(i,stage);else renderChains()}})}
  function placeStage(slot,stage){if(!DATA.chains.expected.includes(stage)||slot<0||slot>3)return;const old=state.stageOrder.indexOf(stage);if(old>=0)state.stageOrder[old]=null;state.stageOrder[slot]=stage;state.selectedStage=null;state.checked=null;record('place_stage',{slot,stage});renderChains();setFeedback('Étape placée. Observe la coupe pour vérifier la chronologie.');sendState({last_manipulation:{type:'place_stage',slot,stage}})}
  function deformationResult(){const p=state.deformationParams;if(p.constraint==='extension')return{structure:'Faille normale',note:'Extension : ce n’est pas la contrainte dominante d’une chaîne de collision.'};if(p.behavior==='ductile')return{structure:'Pli',note:'La roche ductile se déforme sans rupture.'};if(p.shortening>=65)return{structure:'Chevauchement / nappe',note:'Fort raccourcissement cassant : déplacement sur une faille inverse peu inclinée.'};return{structure:'Faille inverse',note:'Compression cassante : le compartiment supérieur remonte.'}}
  let shortEl=null;
  function renderDeformations(){const p=state.deformationParams,r=deformationResult();els.bench.innerHTML=`<h3>Réglages</h3><div class="reglages"><div><span class="legende">Contrainte</span><div class="choix" data-professor-control="set_deformation_parameters"><label><input type="radio" name="constraint" value="compression" ${p.constraint==='compression'?'checked':''}> compression</label><label><input type="radio" name="constraint" value="extension" ${p.constraint==='extension'?'checked':''}> extension</label></div></div><div><span class="legende">Comportement</span><div class="choix"><label><input type="radio" name="behavior" value="ductile" ${p.behavior==='ductile'?'checked':''}> ductile</label><label><input type="radio" name="behavior" value="brittle" ${p.behavior==='brittle'?'checked':''}> cassant</label></div></div><div id="short-box"></div></div><p class="signature">→ <b>${r.structure}</b><br><span>${r.note}</span></p><button class="craie-btn attention" id="runDeformation" data-professor-control="run_deformation_test">Tester · ${r.structure}</button><p class="legende">Structures observées : ${DATA.deformations.expected.map(x=>state.deformationTests.some(t=>t.structure===x)?`<span class="vu">✓ ${x}</span>`:x).join(' · ')}</p>`;
    els.bench.querySelectorAll('input[name=constraint]').forEach(b=>b.onchange=()=>setDeformation({constraint:b.value}));els.bench.querySelectorAll('input[name=behavior]').forEach(b=>b.onchange=()=>setDeformation({behavior:b.value}));
    shortEl=curseur({id:'shortRange',label:'Raccourcissement',min:0,max:100,step:1,valeur:p.shortening,unite:'%',onchange:v=>{state.deformationParams.shortening=v;renderDeformations();sendState({last_manipulation:{type:'set_shortening',shortening:v}})}});$('short-box').append(shortEl);$('runDeformation').onclick=runDeformationTest}
  function setDeformation(params){Object.assign(state.deformationParams,params);record('set_deformation_parameters',{...state.deformationParams});renderDeformations();sendState({last_manipulation:{type:'set_deformation_parameters',...state.deformationParams}})}
  function runDeformationTest(){const result=deformationResult();const test={...state.deformationParams,structure:result.structure,observation:result.note};if(!state.deformationTests.some(t=>t.structure===test.structure))state.deformationTests.push(test);state.lastTest=test;state.ouvert=performance.now();record('run_deformation_test',test);renderDeformations();setFeedback(result.structure+' observé. Change les paramètres pour obtenir une autre structure.','ok');sendState({last_manipulation:{type:'run_deformation_test',...test}})}
  function classifyPT(p,t){if(p>=1.8&&t>=450&&t<=700)return{facies:'Éclogite',minerals:['Grenat','Jadéite'],context:'Subduction profonde · HP'};if(p>=1.0&&t<=520)return{facies:'Schiste bleu',minerals:['Glaucophane'],context:'Subduction · HP-BT'};if(p<=.45&&t>=580)return{facies:'Cornéenne',minerals:['Minéraux non foliés'],context:'Métamorphisme thermique de contact'};if(p>=.5&&p<=1.3&&t>=600)return{facies:'Gneiss',minerals:['Biotite','Feldspath','Quartz'],context:'Collision · métamorphisme régional'};if(t<500)return{facies:'Schiste vert',minerals:['Chlorite','Actinote'],context:'Faible degré'};return{facies:'Amphibolite',minerals:['Hornblende','Plagioclase'],context:'Degré moyen'} }
  let pEl=null,tEl=null;
  function renderMetamorphism(){const s=classifyPT(state.pt.p,state.pt.t);els.bench.innerHTML=`<h3>Conditions</h3><div class="reglages" data-professor-control="set_pt"><div id="p-box"></div><div id="t-box"></div></div><nav class="onglets" style="max-width:none;justify-content:flex-start" aria-label="Échantillons">${Object.entries(SAMPLE_PT).map(([id,x])=>`<button class="onglet ${state.metamorphicRecords.some(r=>r.facies===x.label)?'fait':''}" data-sample="${id}" aria-pressed="${Math.abs(state.pt.p-x.p)<.01&&state.pt.t===x.t}">${x.label}</button>`).join('')}</nav><p class="signature"><b>${s.facies}</b><br>${s.minerals.join(' + ')}<br><span>${s.context}</span></p><button class="craie-btn attention" id="recordPt" data-professor-control="record_pt">Enregistrer cette signature</button><p class="legende">Signatures : ${DATA.metamorphism.expected.map(x=>state.metamorphicRecords.some(r=>r.facies===x)?`<span class="vu">✓ ${x}</span>`:x).join(' · ')}</p>`;
    pEl=curseur({id:'pRange',label:'Pression',min:.1,max:2.5,step:.05,valeur:state.pt.p,unite:'GPa',decimales:2,onchange:v=>setPT(v,state.pt.t,false)});tEl=curseur({id:'tRange',label:'Température',min:200,max:850,step:10,valeur:state.pt.t,unite:'°C',onchange:v=>setPT(state.pt.p,v,false)});$('p-box').append(pEl);$('t-box').append(tEl);
    els.bench.querySelectorAll('[data-sample]').forEach(b=>b.onclick=()=>{const x=SAMPLE_PT[b.dataset.sample];setPT(x.p,x.t,true)});$('recordPt').onclick=recordPT}
  function setPT(p,t,fromPreset=false){state.pt={p:Math.round(Math.max(.1,Math.min(2.5,p))*100)/100,t:Math.round(Math.max(200,Math.min(850,t)))};record('set_pt',{pressure_gpa:state.pt.p,temperature_c:state.pt.t,from_preset:fromPreset});renderMetamorphism();sendState({last_manipulation:{type:'set_pt',pressure_gpa:state.pt.p,temperature_c:state.pt.t}})}
  function recordPT(){const s=classifyPT(state.pt.p,state.pt.t),item={pressure_gpa:state.pt.p,temperature_c:state.pt.t,...s};if(!state.metamorphicRecords.some(r=>r.facies===s.facies))state.metamorphicRecords.push(item);record('record_pt',item);renderMetamorphism();setFeedback(s.facies+' enregistré : '+s.context+'.','ok');sendState({last_manipulation:{type:'record_pt',...item}})}
