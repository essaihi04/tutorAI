<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Le national au tableau — muscle</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="muscle.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Un document d’examen national rejoué au tableau, étape par étape"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start pause resume play_until">Lancer</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="commun.js"></script>
<script src="recit.js"></script>
<script>
/*
 * Le national joué au tableau (18 novembre 2026, logique du cours ; règles 35 et 41 du professeur) : un document
 * d’examen n’est pas montré fini ; ses valeurs naissent de l’animation, une étape par moment, puis le tableau.
 *   ?vue=nageurs : examen 2017 R, document 1 — métabolites du muscle (10⁻⁶ mol/g) au repos, après 100 m (1 min),
 *                  après 1500 m (15 min) ; les jauges bougent, les nombres s’écrivent, puis le tableau du sujet.
 *                  Moments : repos 2,4 ; cent_m 6,2 ; mille5 10,2 ; tableau 13,2.
 *   ?vue=voies   : examen 2017 R, document 2 — part de chaque voie dans la consommation des métabolites ;
 *                  la barre du 1500 m d’abord, puis celle du 100 m. Moments : axes 1,6 ; barre_1500 5,2 ; barre_100 8,8 ;
 *                  conclusion 11,2 (cachée tant que conclusions = false : c’est l’élève qui la trouve).
 *   ?vue=fibres  : examen 2020 N (BPCO), document 2 — % de fibres de type I et II (personne saine, personne atteinte),
 *                  puis les caractéristiques des deux types, une ligne à la fois. Moments : saine 4,2 ; malade 7,2 ;
 *                  fatigue 9,6 ; mitochondries 11 ; oxydatives 12,2 ; glycolytiques 13,2 ; ldh 14,4.
 *   ?vue=chaine  : examen 2020 N, question 3 — la chaîne de l’explication, une case par moment : fibres2 2 ;
 *                  mito 4 ; respiration 6 ; fermentation 8 ; peu_atp 10 ; fatigue 12.
 * Les valeurs sont celles des sujets (lues sur leurs figures, backend/data/exams/svt).
 *
 * 2ᵉ passe (18 novembre 2026) — vues nouvelles, une consigne à la fois ; ?cacher=<moment> tait la suite jusqu’à la réponse :
 *   ?vue=entraine    : examen 2016 N, documents 1 et 2 — fibres peintes et mitochondries (11 % / 5 %), enzymes, barres O₂
 *                      et acide lactique, la comparaison du barème, puis la déduction et la chaîne de l’explication.
 *                      Moments : doc1 3 ; enzymes 4,8 ; o2 7,4 ; lactique 10 ; comparer 12,4 ; deduction 15 ; m1 … m5 16,4 … 22.
 *   ?vue=intensite   : effort d’intensité croissante (document des manuels) — muscle et compteurs, un point par mesure,
 *                      le palier du O₂, puis le tableau et la conclusion. Moments : axes, p44, p58, p68, p79, p101, palier,
 *                      tableau, conclusion.
 *   ?vue=trois_voies : la part de chaque voie au cours de l’effort, une courbe et sa fiche par moment : pc, lactique,
 *                      aerobie, tableau.
 *   ?vue=restitution : un QCM éliminé proposition par proposition (propositions, regle, barre_b, barre_c, garde_a),
 *                      puis un vrai ou faux et son mot qui décide (item2, verdict2).
 */
const { bulle, protocole } = window.Tableau;
const { Chrono, Apparitions, fr, doux } = window.MuscleRecit;
const $ = id => document.getElementById(id);
const VUE = (new URLSearchParams(location.search).get('vue') || 'nageurs');
const R = { conclusions: true };
/* ?cacher=<moment> (2ᵉ passe, vues nouvelles seulement) : voir montre() plus bas. */
const CACHER = new URLSearchParams(location.search).get('cacher');
let REVELE = !CACHER;
let TK = 1;
const tk = v => Math.round(v * TK);

/* ── Vues : moments, fin, motifs, dessin, ce qui se voit ── */
const V = {};

/* Petit muscle peint (règle 32, même peinture que inhibiteurs.html et chaleur.html). */
function peindreMuscle(ctx, x, yc, H, W, f) {
  const L = (H - 20) * (1 - 0.12 * f), Wd = W * (1 + 0.14 * f), y1 = yc - L / 2, y2 = yc + L / 2;
  const tendon = (ya, yb) => { const g = ctx.createLinearGradient(x - 4, 0, x + 4, 0); g.addColorStop(0, '#bdb8ae'); g.addColorStop(.5, '#ffffff'); g.addColorStop(1, '#cbc5ba'); ctx.fillStyle = g; ctx.fillRect(x - 3, Math.min(ya, yb), 6, Math.abs(yb - ya)); };
  tendon(yc - H / 2, y1 + 3); tendon(y2 - 3, yc + H / 2);
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 5; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
  const g = ctx.createLinearGradient(x - Wd / 2, 0, x + Wd / 2, 0);
  g.addColorStop(0, '#7a1626'); g.addColorStop(.3, '#c23a4a'); g.addColorStop(.45, '#e0707a'); g.addColorStop(.7, '#b83242'); g.addColorStop(1, '#6d1220');
  ctx.beginPath(); ctx.moveTo(x - 4, y1); ctx.bezierCurveTo(x - Wd * .62, y1 + L * .25, x - Wd * .58, y1 + L * .7, x - 4, y2); ctx.lineTo(x + 4, y2);
  ctx.bezierCurveTo(x + Wd * .58, y1 + L * .7, x + Wd * .62, y1 + L * .25, x + 4, y1); ctx.closePath(); ctx.fillStyle = g; ctx.fill(); ctx.restore();
}

/* ─── 2017 R, document 1 : les métabolites, l’animation puis le tableau ─── */
/* Repères déclarés par cette vue (ids calculés ci-dessous) : 'lactique_100', 'pc_100', 'glycogene_100', 'atp_100',
 * 'lactique_1500', 'pc_1500', 'glycogene_1500', 'atp_1500', 'col_repos', 'col_100', 'col_1500'. */
V.nageurs = (() => {
  const M = { repos: 2.4, cent_m: 6.2, mille5: 10.2, tableau: 13.2 }, FIN = 13.6;
  const MOTIFS = { repos: 'au repos', cent_m: 'après 100 m nage libre (1 min)', mille5: 'après 1500 m nage libre (15 min)', tableau: 'le tableau du sujet' };
  const MET = [
    { id: 'lactique', nom: 'acide lactique', couleur: 'orange', max: 32, v: [1.1, 30.5, 3] },
    { id: 'glycogene', nom: 'glycogène', couleur: 'vert', max: 80, v: [80, 60, 38] },
    { id: 'pc', nom: 'phosphocréatine', couleur: 'rose', max: 17, v: [17, 10, 16] },
    { id: 'atp', nom: 'ATP', couleur: 'jaune', max: 5, v: [4.6, 3.4, 4.7] },
  ];
  const COLS = [{ id: 'col_repos', nom: 'au repos', a: 0, b: 2 }, { id: 'col_100', nom: 'après 100 m (1 min)', a: 2.8, b: 6 }, { id: 'col_1500', nom: 'après 1500 m (15 min)', a: 6.6, b: 10 }];
  const val = (m, k, t) => { if (k === 0) return m.v[0]; const C = COLS[k]; return m.v[0] + (m.v[k] - m.v[0]) * doux(chrono.part(C.a, C.b, t)); };
  function dessiner(c) {
    const L = scene.L, t = chrono.t;
    if (t < 10.6) {
      const pas = (L - 40) / 3;
      COLS.forEach((C, k) => {
        if (t < C.a && k > 0) return;
        const x0 = 20 + pas * k, xc = x0 + pas / 2;
        ecrit.ecrire(c, 'tete' + k, () => c.texte(C.nom, xc, 30, { couleur: k === 0 ? 'blanc' : k === 1 ? 'orange' : 'cyan', taille: tk(18), align: 'center', max: pas - 10 }));
        const f = k === 0 ? 0 : Math.sin(Math.min(1, chrono.part(C.a, C.b, t)) * Math.PI * 6) ** 2 * (t < C.b ? 1 : 0);
        c.direct(() => peindreMuscle(c.ctx, x0 + 26, 210, 120, 26, f));
        const gw = Math.min(30, (pas - 70) / 4 - 10), gx0 = x0 + 56, gh = 210, gy = 300;
        MET.forEach((m, i) => {
          const gx = gx0 + i * ((pas - 66) / 4) + 4, v = val(m, k, t), h = gh * Math.min(1, v / m.max);
          c.direct(() => { const g = c.ctx; g.globalAlpha = .65; g.fillStyle = c.couleur(m.couleur); g.fillRect(gx, gy - h, gw, h); g.globalAlpha = 1; });
          c.rect(gx - 2, gy - gh - 2, gw + 4, gh + 4, { couleur: 'tresfaible', arrondi: 4, duree: .2 });
          c.direct(() => c.texte(fr(v, 1), gx + gw / 2, gy - h - 8, { couleur: m.couleur, taille: tk(16), align: 'center', gras: true }));
          ecrit.ecrire(c, `n${k}${i}`, () => c.texte(m.id === 'lactique' ? 'ac. lact.' : m.id === 'glycogene' ? 'glyc.' : m.id === 'pc' ? 'PC' : 'ATP', gx + gw / 2, gy + tk(20), { couleur: m.couleur, taille: tk(15), align: 'center' }));
          if (k > 0) c.repere(`${m.id}_${k === 1 ? '100' : '1500'}`, gx - 8, gy - gh - 24, gw + 16, gh + 50, `${m.nom} ${C.nom}`);
        });
        c.repere(C.id, x0, 8, pas, 330, C.nom);
      });
      ecrit.ecrire(c, 'unite', () => c.texte('concentrations en 10⁻⁶ mol/g de muscle', L / 2, 360, { couleur: 'faible', taille: tk(15), align: 'center' }));
    } else {
      const x0 = Math.max(20, L / 2 - 330), w = Math.min(L - 40, 660), cw = [w * .34, w * .17, w * .17, w * .17, w * .15];
      const xs = cw.reduce((a, v, i) => (a.push(i ? a[i - 1] + cw[i - 1] : x0), a), []);
      const lignes = [['', 'ac. lactique', 'glycogène', 'PC', 'ATP'], ['repos', ...MET.map(m => fr(m.v[0], 1))], ['100 m (1 min)', ...MET.map(m => fr(m.v[1], 1))], ['1500 m (15 min)', ...MET.map(m => fr(m.v[2], 1))]];
      ecrit.ecrire(c, 'tab', () => {
        c.texte('Document 1 (examen 2017 R) — 10⁻⁶ mol/g de muscle', L / 2, 40, { couleur: 'jaune', taille: tk(18), align: 'center', max: L - 40 });
        lignes.forEach((ln, r) => {
          const y = 96 + r * 62;
          c.ligne(x0, y + 22, x0 + w, y + 22, { couleur: 'tresfaible', largeur: 1.2, duree: .15 });
          ln.forEach((s, j) => c.texte(s, xs[j] + cw[j] / 2, y, { couleur: r === 0 ? 'faible' : j === 0 ? 'blanc' : MET[j - 1].couleur, taille: tk(r === 0 ? 16 : 19), align: 'center', max: cw[j] - 6 }));
        });
      });
      c.repere('tableau', x0, 60, w, 270, 'le tableau du document 1');
      c.repere('ligne_100', x0, 166, w, 52, 'la ligne du 100 m');
      c.repere('ligne_1500', x0, 228, w, 52, 'la ligne du 1500 m');
    }
  }
  function voit() {
    const t = chrono.t, k = t >= COLS[2].a ? 2 : t >= COLS[1].a ? 1 : 0;
    if (t >= 10.6) return 'Le tableau du document 1 : repos ' + MET.map(m => `${m.nom} ${fr(m.v[0], 1)}`).join(', ') + ' ; 100 m ' + MET.map(m => `${m.nom} ${fr(m.v[1], 1)}`).join(', ') + ' ; 1500 m ' + MET.map(m => `${m.nom} ${fr(m.v[2], 1)}`).join(', ') + '.';
    return `Colonnes visibles jusqu’à « ${COLS[k].nom} » ; ` + MET.map(m => `${m.nom} ${fr(val(m, k, t), 1)}`).join(', ') + ' (10⁻⁶ mol/g).';
  }
  return { M, FIN, MOTIFS, dessiner, voit, titre: 'Deux nageurs : les métabolites (2017 R)', depart: 'Au repos, puis après chaque course…' };
})();

/* ─── 2017 R, document 2 : la part de chaque voie ─── */
V.voies = (() => {
  const M = { axes: 1.6, barre_1500: 5.2, barre_100: 8.8, conclusion: 11.2 }, FIN = 11.6;
  const MOTIFS = { axes: 'l’axe : pourcentage de la consommation des métabolites', barre_1500: 'le 1500 m : 93 % aérobie', barre_100: 'le 100 m : 85 % phosphocréatine', conclusion: 'la voie dominante selon l’effort' };
  const SEG = { aero: { nom: 'aérobie du glucose (respiration)', couleur: 'cyan' }, pc: { nom: 'anaérobie de la phosphocréatine', couleur: 'rose' }, lact: { nom: 'anaérobie du glucose (fermentation lactique)', couleur: 'orange' } };
  const BARRES = [
    { id: 'barre_100', nom: '100 m', a: 5.6, b: 8.6, segs: [['pc', 85], ['lact', 10], ['aero', 5]] },
    { id: 'barre_1500', nom: '1500 m', a: 2, b: 5, segs: [['lact', 7], ['aero', 93]] },
  ];
  function dessiner(c) {
    const L = scene.L, t = chrono.t, x0 = 90, yb = 350, H = 290, bw = tk(86), lg = L >= 1000;
    const xb = [x0 + 90, x0 + 90 + bw + tk(90)];
    ecrit.ecrire(c, 'axes', () => {
      c.fleche(x0, yb, x0, yb - H - 24, { couleur: 'faible', largeur: 1.6 });
      c.ligne(x0, yb, xb[1] + bw + 40, yb, { couleur: 'faible', largeur: 1.6 });
      [0, 50, 100].forEach(p => c.texte(p + ' %', x0 - 10, yb - H * p / 100 + 6, { couleur: 'faible', taille: tk(15), align: 'right' }));
      c.texte('consommation des métabolites (%)', x0 - 20, 30, { couleur: 'blanc', taille: tk(16) });
    });
    c.repere('axes', x0 - 70, 14, 280, yb - 10, 'l’axe des pourcentages');
    BARRES.forEach((B, i) => {
      if (t < B.a) return;
      const x = xb[i], u = doux(chrono.part(B.a, B.b, t));
      let y = yb;
      B.segs.forEach(([k, p], j) => {
        const S = SEG[k], h = H * p / 100 * Math.min(1, Math.max(0, u * B.segs.length - j));
        c.direct(() => { const g = c.ctx; g.globalAlpha = .7; g.fillStyle = c.couleur(S.couleur); g.fillRect(x, y - h, bw, h); g.globalAlpha = 1; });
        if (u >= (j + 1) / B.segs.length - 1e-3 && p >= 7) ecrit.ecrire(c, `p${i}${j}`, () => c.texte(p + ' %', x + bw / 2, y - h / 2 + 7, { couleur: '#0b1f2a', taille: tk(18), align: 'center', gras: true }));
        if (i === 0 && k === 'pc') c.repere('seg_pc_100', x - 4, y - h - 4, bw + 8, h + 8, 'la phosphocréatine au 100 m');
        if (i === 1 && k === 'aero') c.repere('seg_aero_1500', x - 4, y - h - 4, bw + 8, h + 8, 'la respiration au 1500 m');
        y -= H * p / 100;
      });
      ecrit.ecrire(c, 'nom' + i, () => c.texte(B.nom, x + bw / 2, yb + tk(26), { couleur: 'blanc', taille: tk(19), align: 'center', gras: true }));
      c.repere(B.id, x - 10, yb - H - 10, bw + 20, H + 50, 'la barre du ' + B.nom);
    });
    const xl = xb[1] + bw + tk(60);
    ecrit.ecrire(c, 'legende', () => Object.values(SEG).forEach((S, j) => {
      const y = 80 + j * tk(52);
      c.rect(xl, y - 16, 22, 22, { couleur: S.couleur, fond: S.couleur, fondAlpha: .7, arrondi: 3, duree: .1 });
      c.texte(S.nom, xl + 32, y, { couleur: S.couleur, taille: tk(16), max: L - xl - 44 });
    }));
    c.repere('legende', xl - 6, 52, L - xl, 3 * tk(52) + 10, 'la légende des trois voies');
    if (t >= 9.2 && R.conclusions) {
      ecrit.ecrire(c, 'conclusion', () => {
        c.texte('100 m (court, intense) : surtout la phosphocréatine', xl, 300, { couleur: 'rose', taille: tk(17), max: L - xl - 10 });
        c.texte('1500 m (long) : surtout la respiration', xl, 300 + tk(30), { couleur: 'cyan', taille: tk(17), max: L - xl - 10 });
      });
      c.repere('conclusion', xl - 6, 276, L - xl, tk(70), 'la voie dominante selon l’effort');
    }
    if (!lg) {} // le cadre étroit garde la même disposition (la légende passe sous 760 px en se réduisant)
  }
  function voit() {
    const t = chrono.t, m = ['Document 2 (2017 R) : part des voies dans la consommation des métabolites.'];
    if (t >= 5) m.push('1500 m : 7 % anaérobie du glucose, 93 % aérobie.');
    if (t >= 8.6) m.push('100 m : 85 % phosphocréatine, 10 % anaérobie du glucose, 5 % aérobie.');
    if (t >= 9.2 && R.conclusions) m.push('Conclusion écrite : 100 m surtout la phosphocréatine ; 1500 m surtout la respiration.');
    return m.join(' ');
  }
  return { M, FIN, MOTIFS, dessiner, voit, titre: 'Quelle voie domine ? (2017 R)', depart: 'Le 1500 m d’abord…' };
})();

/* ─── 2020 N (BPCO), document 2 : les fibres de type I et II ─── */
/* Repères déclarés par cette vue : 'type1_saine', 'type2_saine', 'type1_malade', 'type2_malade', 'graphe', 'tableau_fibres',
 * 'ligne_fatigue', 'ligne_mito', 'ligne_oxy', 'ligne_glyco', 'ligne_ldh'. */
V.fibres = (() => {
  const M = { saine: 4.2, malade: 7.2, fatigue: 9.6, mitochondries: 11, oxydatives: 12.2, glycolytiques: 13.2, ldh: 14.4 }, FIN = 14.8;
  const MOTIFS = { saine: 'personne saine : 58 % de type I, 30 % de type II', malade: 'personne atteinte : 30 % de type I, 45 % de type II',
    fatigue: 'résistance à la fatigue : I +++, II +', mitochondries: 'mitochondries : I +++, II +', oxydatives: 'enzymes oxydatives : I +++, II +',
    glycolytiques: 'enzymes glycolytiques : I +, II +++', ldh: 'enzyme LDH (acide lactique) : I +, II +++' };
  const B = [ // [type, qui, valeur, début, fin]
    ['I', 'saine', 58, 1.4, 4], ['II', 'saine', 30, 1.4, 4], ['I', 'malade', 30, 4.6, 7], ['II', 'malade', 45, 4.6, 7] ];
  const LIG = [['taille', 'petite', 'grosse', 8.2], ['résistance à la fatigue', '+++', '+', 9.4, 'ligne_fatigue'], ['nombre de mitochondries', '+++', '+', 10.8, 'ligne_mito'],
    ['enzymes oxydatives', '+++', '+', 12, 'ligne_oxy'], ['enzymes glycolytiques', '+', '+++', 13, 'ligne_glyco'], ['enzyme LDH (acide lactique)', '+', '+++', 14.2, 'ligne_ldh']];
  function dessiner(c) {
    const L = scene.L, t = chrono.t, lg = L >= 1000, x0 = 60, yb = 320, H = 240, bw = tk(40);
    const gx = { I: x0 + 50, II: x0 + 50 + 2 * bw + tk(60) };
    ecrit.ecrire(c, 'axes', () => {
      c.fleche(x0, yb, x0, yb - H - 26, { couleur: 'faible', largeur: 1.6 });
      c.ligne(x0, yb, gx.II + 2 * bw + 30, yb, { couleur: 'faible', largeur: 1.6 });
      [0, 30, 60].forEach(p => c.texte(String(p), x0 - 8, yb - H * p / 60 + 6, { couleur: 'faible', taille: tk(15), align: 'right' }));
      c.texte('% de fibres', x0 - 30, 34, { couleur: 'blanc', taille: tk(16) });
      c.texte('type I', gx.I + bw, yb + tk(26), { couleur: 'blanc', taille: tk(17), align: 'center' });
      c.texte('type II', gx.II + bw, yb + tk(26), { couleur: 'blanc', taille: tk(17), align: 'center' });
      c.rect(x0, yb + tk(44), 18, 18, { couleur: 'blanc', fond: 'blanc', fondAlpha: .7, duree: .1 }); c.texte('saine', x0 + 26, yb + tk(44) + 15, { couleur: 'blanc', taille: tk(15) });
      c.rect(x0 + 110, yb + tk(44), 18, 18, { couleur: 'rose', fond: 'rose', fondAlpha: .7, duree: .1 }); c.texte('atteinte', x0 + 136, yb + tk(44) + 15, { couleur: 'rose', taille: tk(15) });
    });
    B.forEach(([ty, qui, v, a, b]) => {
      if (t < a) return;
      const x = gx[ty] + (qui === 'malade' ? bw : 0), h = H * v / 60 * doux(chrono.part(a, b, t));
      c.direct(() => { const g = c.ctx; g.globalAlpha = .7; g.fillStyle = c.couleur(qui === 'saine' ? 'blanc' : 'rose'); g.fillRect(x + 2, yb - h, bw - 4, h); g.globalAlpha = 1; });
      if (t >= b) ecrit.ecrire(c, `v${ty}${qui}`, () => c.texte(v + ' %', x + bw / 2, yb - h - 8, { couleur: qui === 'saine' ? 'blanc' : 'rose', taille: tk(16), align: 'center', gras: true }));
      c.repere(`type${ty === 'I' ? 1 : 2}_${qui}`, x - 2, yb - H - 6, bw + 4, H + 10, `fibres de type ${ty}, personne ${qui === 'saine' ? 'saine' : 'atteinte'}`);
    });
    c.repere('graphe', x0 - 40, 14, gx.II + 2 * bw + 40 - x0 + 40, yb + 60, 'le graphique : % de fibres de type I et II');
    if (t >= 7.2) ecrit.ecrire(c, 'compare', () => c.texte('atteinte : type I ↓, type II ↑', x0 + 40, 400, { couleur: 'rose', taille: tk(16) }));
    // le tableau des caractéristiques, une ligne à la fois
    const tx0 = Math.max(gx.II + 2 * bw + tk(70), lg ? L * .44 : 380), tw = L - tx0 - 14, c1 = tw * .56, c2 = tw * .22;
    if (t >= 7.6) {
      ecrit.ecrire(c, 'ttete', () => { c.texte('fibres', tx0 + c1 / 2, 40, { couleur: 'faible', taille: tk(15), align: 'center' }); c.texte('type I', tx0 + c1 + c2 / 2, 40, { couleur: 'blanc', taille: tk(16), align: 'center' }); c.texte('type II', tx0 + c1 + c2 * 1.5, 40, { couleur: 'rose', taille: tk(16), align: 'center' }); });
      c.repere('tableau_fibres', tx0, 16, tw, 6 * tk(50) + 44, 'les caractéristiques des fibres de type I et II');
    }
    LIG.forEach(([nom, i1, i2, quand, rep], r) => {
      if (t < quand) return;
      const y = 84 + r * tk(48);
      ecrit.ecrire(c, 'l' + r, () => {

/* ═══ 2ᵉ passe (18 novembre 2026) : quatre vues nouvelles, jouées une consigne à la fois ═══
 * Ces vues ont, en plus de leurs moments M, l’instant S où chaque moment commence à s’écrire. Avec ?cacher=<moment>,
 * tout ce qui s’écrit à partir de ce moment reste caché (la réponse de l’élève vient avant la correction) jusqu’à
 * set_parameters {conclusions: true}. Sans ce paramètre, rien n’est caché ; les vues anciennes ne changent pas. */
const montre = (debut, conclusion = false) => chrono.t >= debut
  && !(!REVELE && CACHER && VU.S && VU.S[CACHER] != null && debut >= VU.S[CACHER] - 1e-6)
  && !(conclusion && !R.conclusions);

/* Un nombre écrit comme dans le sujet (12, 6, 2,17, 1,985), sans décimale ajoutée. */
const nb = v => String(v).replace('.', ',');

/* Une case de chaîne de causes, le texte coupé en lignes et centré (même dessin que la vue chaine). */
function caseTexte(c, x, y, w, h, s, col, taille) {
  c.rect(x, y, w, h, { couleur: col, fond: col, fondAlpha: .2, arrondi: 10 });
  const mots = s.split(' '), lignes = []; let cur = '';
  for (const m of mots) { const e = cur ? cur + ' ' + m : m; if (c.largeurTexte(e, taille) > w - 18 && cur) { lignes.push(cur); cur = m; } else cur = e; }
  lignes.push(cur);
  lignes.forEach((l, j) => c.texte(l, x + w / 2, y + h / 2 + (j - (lignes.length - 1) / 2) * (taille + 4) + 6, { couleur: col, taille, align: 'center', max: w - 10, gras: true }));
}

/* Une fibre musculaire peinte (règle 32) : cylindre rouge strié, et ses mitochondries (deux membranes, crêtes). */
function peindreFibre(ctx, x0, x1, yc, h, nMito, part) {
  const r = h / 2;
  ctx.save();
  const g = ctx.createLinearGradient(0, yc - r, 0, yc + r);
  g.addColorStop(0, '#6d1220'); g.addColorStop(.25, '#c23a4a'); g.addColorStop(.5, '#e0707a'); g.addColorStop(.75, '#b83242'); g.addColorStop(1, '#5e0f1b');
  ctx.beginPath(); ctx.moveTo(x0 + r, yc - r); ctx.lineTo(x1 - r, yc - r); ctx.arc(x1 - r, yc, r, -Math.PI / 2, Math.PI / 2); ctx.lineTo(x0 + r, yc + r); ctx.arc(x0 + r, yc, r, Math.PI / 2, Math.PI * 1.5); ctx.closePath();
  ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 5; ctx.shadowOffsetY = 2; ctx.fillStyle = g; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.clip();
  ctx.globalAlpha = .22; ctx.strokeStyle = '#3a0610'; ctx.lineWidth = 2;
  for (let x = x0 + 6; x < x1; x += 9) { ctx.beginPath(); ctx.moveTo(x, yc - r); ctx.lineTo(x, yc + r); ctx.stroke(); }
  ctx.globalAlpha = 1;
  const n = Math.round(nMito * Math.min(1, part)), pas = (x1 - x0 - 30) / Math.max(1, nMito);
  for (let i = 0; i < n; i++) {
    const cx = x0 + 22 + pas * (i + .5), cy = yc + (i % 2 ? 6 : -6), rx = Math.min(30, pas * .42), ry = h * .26;
    const gm = ctx.createRadialGradient(cx - rx * .3, cy - ry * .4, 2, cx, cy, rx);
    gm.addColorStop(0, '#ffe08a'); gm.addColorStop(.6, '#f2a93b'); gm.addColorStop(1, '#b9651a');
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); ctx.fillStyle = gm; ctx.fill();
    ctx.lineWidth = 1.6; ctx.strokeStyle = '#6b3a0c'; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx, cy, rx - 3, ry - 3, 0, 0, Math.PI * 2); ctx.lineWidth = 1; ctx.stroke();
    ctx.beginPath(); for (let k = -2; k <= 2; k++) { const xx = cx + k * rx * .32; ctx.moveTo(xx, cy - ry + 4); ctx.lineTo(xx, cy + ry * .25); } ctx.lineWidth = 1.3; ctx.stroke();
  }
  ctx.restore();
}

        c.direct(() => c.texte(v, xc + wc / 2, y + tk(32), { couleur: col, taille: tk(21), align: 'center', gras: true, max: wc - 12 }));
      });
      c.repere('compteurs', xc - 4, 60, wc + 8, 3 * tk(90), 'les trois compteurs');
      /* le graphique, un point par mesure */
      const gx0 = xc + wc + tk(70), gx1 = L - tk(60), yb = 330, H = 250;
      const X = i => gx0 + (i / 110) * (gx1 - gx0), Yo = v => yb - H * v / 4, Yl = v => yb - H * v / 40;
      ecrit.ecrire(c, 'axes', () => {
        c.fleche(gx0, yb, gx1 + 24, yb, { couleur: 'faible', largeur: 1.6 });
        c.fleche(gx0, yb, gx0, yb - H - 20, { couleur: 'cyan', largeur: 1.6 });
        c.fleche(gx1, yb, gx1, yb - H - 20, { couleur: 'orange', largeur: 1.6 });
        [0, 2, 4].forEach(v => c.texte(String(v), gx0 - 8, Yo(v) + 6, { couleur: 'cyan', taille: tk(15), align: 'right' }));
        [0, 20, 40].forEach(v => c.texte(String(v), gx1 + 8, Yl(v) + 6, { couleur: 'orange', taille: tk(15) }));
        [50, 100].forEach(v => c.texte(String(v), X(v), yb + tk(20), { couleur: 'blanc', taille: tk(15), align: 'center' }));
        c.texte('intensité (kJ/min)', (gx0 + gx1) / 2, yb + tk(44), { couleur: 'blanc', taille: tk(15), align: 'center' });
        c.texte('O₂ (L/min)', gx0 + 6, 52, { couleur: 'cyan', taille: tk(15) });
        c.texte('acide lactique (g/L)', gx1 - 6, 52, { couleur: 'orange', taille: tk(15), align: 'right' });
      });
      c.repere('graphe', gx0 - 40, 30, gx1 - gx0 + 90, yb + 30, 'le graphique : O₂ et acide lactique selon l’intensité');
      P.forEach(([I0, o, l], i) => {
        if (t < M[K[i]] - .3) return;
        c.direct(() => {
          if (i > 0) { const q = P[i - 1], g = c.ctx; g.save(); g.lineWidth = 3; g.strokeStyle = c.couleur('cyan'); g.beginPath(); g.moveTo(X(q[0]), Yo(q[1])); g.lineTo(X(I0), Yo(o)); g.stroke();
            g.strokeStyle = c.couleur('orange'); g.beginPath(); g.moveTo(X(q[0]), Yl(q[2] || 0)); g.lineTo(X(I0), Yl(l || 0)); g.stroke(); g.restore(); }
          c.point(X(I0), Yo(o), 5, 'cyan'); c.point(X(I0), Yl(l || 0), 5, 'orange');
        });
        c.repere(K[i].replace('p', 'pt'), X(I0) - 14, Yo(o) - 14, 28, Yl(l || 0) - Yo(o) + 28, MOTIFS[K[i]]);
      });
      if (montre(S.palier)) {
        ecrit.ecrire(c, 'palier', () => { c.ligne(X(68), Yo(3.04) - 12, X(101), Yo(3.04) - 12, { couleur: 'cyan', largeur: 1.4 }); c.texte('palier', (X(68) + X(79.5)) / 2, Yo(3.04) - 20, { couleur: 'cyan', taille: tk(16), align: 'center', gras: true }); });
        c.repere('palier', X(68) - 6, Yo(3.04) - 40, X(101) - X(68) + 12, 40, 'le palier du O₂ consommé : 3,04 L/min');
      }
    } else {
      /* l’animation devient le tableau, puis la conclusion */
      const w = Math.min(L - 40, 700), x0 = (L - w) / 2, cw = [w * .36, w * .32, w * .32];
      const xs = [x0, x0 + cw[0], x0 + cw[0] + cw[1]];
      const lignes = [['intensité (kJ/min)', 'O₂ consommé (L/min)', 'acide lactique (g/L)'], ...P.map(([I0, o, l]) => [nb(I0), nb(o), lu(l, 3)])];
      ecrit.ecrire(c, 'tab', () => lignes.forEach((ln, r) => {
        const y = 52 + r * tk(42);
        c.ligne(x0, y + 14, x0 + w, y + 14, { couleur: 'tresfaible', largeur: 1.2, duree: .1 });
        ln.forEach((s, j) => c.texte(s, xs[j] + cw[j] / 2, y, { couleur: r === 0 ? 'blanc' : ['jaune', 'cyan', 'orange'][j], taille: tk(r === 0 ? 16 : 18), align: 'center', gras: r > 0, max: cw[j] - 8 }));
      }));
      c.repere('tableau', x0, 24, w, 6 * tk(42) + 10, 'le tableau des mesures');
      if (montre(S.conclusion, true)) {
        const y = 52 + 6 * tk(42) + 6;
        ecrit.ecrire(c, 'concl', () => {
          c.texte('À partir de 68 kJ/min : O₂ au palier (3,04 L/min) et acide lactique ↑', L / 2, y, { couleur: 'jaune', taille: tk(17), align: 'center', max: L - 30 });
          c.texte('→ la fermentation lactique s’ajoute à la respiration, qui ne suffit plus', L / 2, y + tk(30), { couleur: 'jaune', taille: tk(17), align: 'center', gras: true, max: L - 30 });
        });
        c.repere('conclusion', 16, y - 24, L - 32, tk(64), 'la conclusion');
      }
    }
  }
  function voit() {
    const k = dernier();
    if (montre(S.tableau)) return 'Le tableau des mesures : ' + P.map(([I0, o, l]) => `${nb(I0)} kJ/min → O₂ ${nb(o)} L/min, acide lactique ${lu(l, 3)}`).join(' ; ') + '.'
      + (montre(S.conclusion, true) ? ' Conclusion écrite : la fermentation lactique s’ajoute à la respiration, qui ne suffit plus.' : '');
    if (k < 0) return 'Les axes : intensité de l’effort (kJ/min), O₂ consommé (L/min), acide lactique du sang (g/L).';
    return 'Points tracés jusqu’à ' + MOTIFS[K[k]] + '.' + (montre(S.palier) ? ' Le O₂ consommé reste à 3,04 L/min : palier.' : '');
  }
  return { M, S, FIN, MOTIFS, dessiner, voit, titre: 'Un effort de plus en plus intense', depart: 'L’effort augmente peu à peu…' };
})();

/* ─── Les trois voies au début d’un effort : la part de chacune dans le temps, puis leur fiche, une ligne à la fois ─── */
/* Repères : 'graphe', 'courbe_pc', 'courbe_lact', 'courbe_aero', 'voie_pc', 'voie_lact', 'voie_aero', 'examen'. */
V.trois_voies = (() => {
  const M = { pc: 3.4, lactique: 6.8, aerobie: 10.2, tableau: 12.8 }, FIN = 13.2;
  const S = { pc: .4, lactique: 3.8, aerobie: 7.2, tableau: 10.8 };
  const MOTIFS = { pc: 'la phosphocréatine : immédiate, quelques secondes', lactique: 'la fermentation lactique : rapide, 1 à 2 minutes',
    aerobie: 'la respiration : lente à démarrer, durable', tableau: 'à l’examen : le nom de la voie et son équation' };
  const V3 = [
    { k: 'pc', id: 'voie_pc', cid: 'courbe_pc', col: 'rose', nom: 'anaérobie alactique (phosphocréatine)', l: ['sans O₂ · sans acide lactique', 'immédiate · quelques secondes', '1 ATP par PC'], f: u => (u < .03 ? u / .03 : Math.exp(-(u - .03) / .06)), lab: [.05, 1] },
    { k: 'lactique', id: 'voie_lact', cid: 'courbe_lact', col: 'orange', nom: 'anaérobie lactique (fermentation)', l: ['sans O₂ · acide lactique', 'rapide · 1 à 2 minutes', '2 ATP par glucose'], f: u => .78 * Math.exp(-(((u - .42) / .15) ** 2)), lab: [.42, .78] },
    { k: 'aerobie', id: 'voie_aero', cid: 'courbe_aero', col: 'cyan', nom: 'aérobie (respiration)', l: ['avec O₂ · sans acide lactique', 'lente à démarrer · durable', '36 ou 38 ATP par glucose'], f: u => .92 / (1 + Math.exp(-(u - .58) / .08)), lab: [.9, .92] },
  ];
  function dessiner(c) {
    const L = scene.L, t = chrono.t, T = L >= 1000 ? 17 : 16;
    const gx0 = 70, gx1 = Math.round(L * .46), yb = 320, H = 220, X = u => gx0 + u * (gx1 - gx0), Y = v => yb - H * v;
    ecrit.ecrire(c, 'axes', () => {
      c.fleche(gx0, yb, gx1 + 16, yb, { couleur: 'faible', largeur: 1.6 });
      c.fleche(gx0, yb, gx0, yb - H - 30, { couleur: 'faible', largeur: 1.6 });
      c.texte('part de l’ATP fourni', gx0 - 10, 46, { couleur: 'blanc', taille: tk(15) });
      [['0', 0], ['10 s', .18], ['1 min', .5], ['2 min', .72]].forEach(([s, u]) => c.texte(s, X(u), yb + tk(22), { couleur: 'blanc', taille: tk(15), align: 'center' }));
      c.texte('durée de l’effort', (gx0 + gx1) / 2, yb + tk(46), { couleur: 'blanc', taille: tk(15), align: 'center' });
    });
    c.repere('graphe', gx0 - 20, 24, gx1 - gx0 + 50, yb + 30, 'la part de chaque voie au cours de l’effort');
    const tx0 = gx1 + 40, tw = L - tx0 - 14, hC = 104;
    V3.forEach((v, i) => {
      if (t < S[v.k]) return;
      const u1 = Math.max(.01, doux(chrono.part(S[v.k], M[v.k] - .6, t)));
      c.direct(() => { const g = c.ctx; g.save(); g.lineWidth = 4; g.strokeStyle = c.couleur(v.col); g.beginPath(); for (let j = 0; j <= 120; j++) { const u = u1 * j / 120; j ? g.lineTo(X(u), Y(v.f(u))) : g.moveTo(X(u), Y(v.f(u))); } g.stroke(); g.restore(); });
      if (t >= M[v.k] - .6) ecrit.ecrire(c, 'lab' + i, () => {
        const [u, h] = v.lab, nom = ['phosphocréatine', 'fermentation lactique', 'respiration'][i];
        c.texte(nom, i === 0 ? X(u) + 8 : i === 2 ? X(1) : X(u), Y(h) - 12, { couleur: v.col, taille: tk(16), gras: true, align: i === 0 ? 'left' : i === 2 ? 'right' : 'center' });
      });
      c.repere(v.cid, gx0, Y(v.lab[1]) - 30, gx1 - gx0, yb - Y(v.lab[1]) + 30, 'la courbe de la voie ' + v.nom);
      const y = 22 + i * (hC + 8);
      if (t >= S[v.k] + 1) {
        ecrit.ecrire(c, 'fiche' + i, () => {
          c.rect(tx0, y, tw, hC, { couleur: v.col, fond: v.col, fondAlpha: .12, arrondi: 10 });
          c.texte(v.nom, tx0 + 12, y + 26, { couleur: v.col, taille: T + 1, gras: true, max: tw - 20 });
          v.l.forEach((s, j) => c.texte(s, tx0 + 12, y + 52 + j * 22, { couleur: 'blanc', taille: T, max: tw - 20 }));
        });
        c.repere(v.id, tx0 - 4, y - 4, tw + 8, hC + 8, 'la voie ' + v.nom);
      }
    });
    if (t >= S.tableau) {
      ecrit.ecrire(c, 'examen', () => c.texte('À l’examen : le nom de la voie + son équation avec ADP et Pi', L / 2, 394, { couleur: 'jaune', taille: tk(17), align: 'center', gras: true, max: L - 30 }));
      c.repere('examen', 16, 372, L - 32, 32, 'à l’examen : le nom de la voie et son équation');
    }
  }
  function voit() {
    const vus = V3.filter(v => chrono.t >= S[v.k] + 1).map(v => `${v.nom} : ${v.l.join(', ')}`);
    return vus.length ? 'Courbes et fiches écrites : ' + vus.join(' ; ') + '.' + (chrono.t >= S.tableau ? ' À l’examen : nom de la voie et équation avec ADP et Pi.' : '') : 'Les axes : part de l’ATP fourni selon la durée de l’effort.';
  }
  return { M, S, FIN, MOTIFS, dessiner, voit, titre: 'Les trois voies au cours de l’effort', depart: 'Dès la première seconde…' };
})();

/* ─── Restitution jouée : un QCM éliminé proposition par proposition, puis un vrai ou faux et son mot qui décide ─── */
/* Repères : 'enonce', 'prop_a', 'prop_b', 'prop_c', 'regle', 'raison_b', 'raison_c', 'raison_a', 'affirmation', 'mot_decide', 'verdict'. */
V.restitution = (() => {
  const M = { propositions: 3, regle: 6.4, barre_b: 8.8, barre_c: 11.2, garde_a: 13.4, item2: 16.2, verdict2: 18.6 }, FIN = 19;
  const S = { propositions: .4, regle: 4.2, barre_b: 7.2, barre_c: 9.6, garde_a: 11.8, item2: 14.4, verdict2: 17 };
  const MOTIFS = { propositions: 'le QCM et ses trois propositions', regle: 'je me redis le cours d’abord', barre_b: 'b rayée : la phosphocréatine donne la chaleur initiale',
    barre_c: 'c rayée : la fermentation lactique se fait sans O₂', garde_a: 'a gardée : les réactions aérobies', item2: 'vrai ou faux : la bande sombre raccourcit ?', verdict2: 'faux : la bande sombre garde sa longueur' };
  const PROPS = [['a', 'la régénération de l’ATP par les réactions aérobies'], ['b', 'l’hydrolyse de la phosphocréatine'], ['c', 'la fermentation lactique']];
  const AFF = '« Lors de la contraction, la bande sombre raccourcit. »';
  function dessiner(c) {
    const L = scene.L, t = chrono.t, x0 = 34, yP = i => 86 + i * tk(38);
    if (!montre(S.item2)) {
      ecrit.ecrire(c, 'q', () => c.texte('QCM — La chaleur retardée est liée à…', x0, 40, { couleur: 'blanc', taille: tk(18), gras: true, max: L - 60 }));
      c.repere('enonce', x0 - 6, 16, L - 60, 34, 'l’énoncé du QCM');
      PROPS.forEach(([l, s], i) => {
        if (t < S.propositions + .6 * i) return;
        ecrit.ecrire(c, 'p' + i, () => c.texte(`${l}.  ${s}`, x0 + 14, yP(i), { couleur: 'blanc', taille: tk(17), max: L - 80 }));
        c.repere('prop_' + l, x0, yP(i) - 22, Math.min(L - 70, c.largeurTexte(`${l}.  ${s}`, tk(17)) + 24), 32, 'la proposition ' + l);
      });
      const yG = yP(3) + 10;
      if (montre(S.regle)) {
        ecrit.ecrire(c, 'regle', () => {
          c.texte('Je me redis le cours :', x0, yG, { couleur: 'cyan', taille: tk(16), gras: true });
          c.texte('chaleur initiale → pendant la contraction (ATP, phosphocréatine)', x0 + 14, yG + tk(26), { couleur: 'cyan', taille: tk(16), max: L - 80 });
          c.texte('chaleur retardée → après, et elle disparaît sans O₂', x0 + 14, yG + tk(50), { couleur: 'cyan', taille: tk(16), max: L - 80 });
        });
        c.repere('regle', x0 - 6, yG - 22, L - 60, tk(60) + 20, 'le cours redit avant de lire les propositions');
      }
      const yR = yG + tk(88);
      const raison = (cle, i, debut, texte, col, garde) => {
        if (!montre(debut)) return;
        const w = c.largeurTexte(`${PROPS[i][0]}.  ${PROPS[i][1]}`, tk(17)), r = ['b', 'c', 'a'].indexOf(cle);
        ecrit.ecrire(c, 'r' + cle, () => {
          if (garde) c.cercle(x0 + 20, yP(i) - 6, 16, { couleur: 'vert', largeur: 2.4 });
          else c.ligne(x0 + 8, yP(i) - 6, x0 + 22 + w, yP(i) - 6, { couleur: 'rouge', largeur: 3 });
          c.texte(texte, x0, yR + r * tk(26), { couleur: col, taille: tk(16), gras: garde, max: L - 60 });
        });
        c.repere('raison_' + cle, x0 - 6, yR + r * tk(26) - 20, L - 60, 28, texte);
      };
      raison('b', 1, S.barre_b, 'b ✗ : la phosphocréatine sert pendant la contraction → chaleur initiale', 'rouge', false);
      raison('c', 2, S.barre_c, 'c ✗ : la fermentation lactique se fait sans O₂ ; or sans O₂, pas de chaleur retardée', 'rouge', false);
      raison('a', 0, S.garde_a, 'a ✓ : les réactions aérobies utilisent le O₂ → réponse a', 'vert', true);
    } else {
      ecrit.ecrire(c, 'vf', () => c.texte('Vrai ou faux ?', x0, 46, { couleur: 'blanc', taille: tk(18), gras: true }));
      ecrit.ecrire(c, 'aff', () => c.texte(AFF, L / 2, 110, { couleur: 'blanc', taille: tk(19), align: 'center', max: L - 40 }));
      c.repere('affirmation', 20, 84, L - 40, 40, 'l’affirmation');
      const w = c.largeurTexte(AFF, tk(19)), xd = L / 2 - w / 2, wa = c.largeurTexte('« Lors de la contraction, la ', tk(19)), wb = c.largeurTexte('bande sombre', tk(19));
      if (t >= S.item2 + 1.2) ecrit.ecrire(c, 'mot', () => {
        c.ligne(xd + wa, 120, xd + wa + wb, 120, { couleur: 'jaune', largeur: 3 });
        c.texte('le mot qui décide', xd + wa + wb / 2, 152, { couleur: 'jaune', taille: tk(16), align: 'center' });
      });
      c.repere('mot_decide', xd + wa - 10, 90, wb + 20, 72, 'le mot qui décide : la bande sombre');
      if (montre(S.verdict2, true)) {
        ecrit.ecrire(c, 'verd', () => {
          c.texte('Je me redis la règle : bande claire et zone H raccourcissent ;', L / 2, 220, { couleur: 'cyan', taille: tk(17), align: 'center', max: L - 40 });
          c.texte('bande sombre et filaments gardent leur longueur.', L / 2, 220 + tk(28), { couleur: 'cyan', taille: tk(17), align: 'center', max: L - 40 });
          c.texte('Faux : la bande sombre (longueur de la myosine) ne change pas.', L / 2, 300, { couleur: 'rouge', taille: tk(19), align: 'center', gras: true, max: L - 40 });
        });
        c.repere('verdict', 20, 196, L - 40, 120, 'la règle et le verdict : faux');
      }
    }
  }
  function voit() {
    const t = chrono.t;
    if (montre(S.item2)) return 'Vrai ou faux : « Lors de la contraction, la bande sombre raccourcit. » Le mot qui décide est souligné : bande sombre.'
      + (montre(S.verdict2, true) ? ' Verdict écrit : faux, la bande sombre ne change pas.' : '');
    if (t < S.propositions) return 'Le tableau est vide.';
    const m = ['QCM : la chaleur retardée est liée à… a) la régénération de l’ATP par les réactions aérobies ; b) l’hydrolyse de la phosphocréatine ; c) la fermentation lactique.'];
    if (montre(S.regle)) m.push('Le cours est redit : chaleur initiale pendant la contraction ; chaleur retardée après, disparaît sans O₂.');
    if (montre(S.barre_b)) m.push('b rayée.');
    if (montre(S.barre_c)) m.push('c rayée.');
    if (montre(S.garde_a)) m.push('a entourée : c’est la réponse.');
    return m.join(' ');
  }
  return { M, S, FIN, MOTIFS, dessiner, voit, titre: 'Restitution : éliminer les propositions', depart: 'L’énoncé d’abord…' };
})();

const VU = V[VUE] || V.nageurs;
function dessiner(c) {
  scene.cadre(29);
  TK = scene.L >= 1000 ? 1.25 : 1;
  VU.dessiner(c);
  return c.fin();
}
const canvas = $('canvas');
const scene = window.MuscleTableau.Scene(canvas, dessiner, { large: true });
const ecrit = Apparitions(scene);
const chrono = Chrono({ fin: () => VU.FIN, moments: () => VU.M, motifs: VU.MOTIFS, bouton: $('run'), bulle: $('feedback'), pont: () => pont,
  depart: VU.depart, reinit: () => ecrit.oublier(), fini: () => VU.titre + ' : tout est au tableau.' });
scene.avancer = (dt) => { const a = chrono.avancer(dt); if (a) scene.sale = true; return a; };
$('run').onclick = chrono.clic;
window.Tableau.explication({ [VUE]: Object.keys(VU.M).map(k => ({ repere: k, texte: VU.MOTIFS[k] })) });
const commandes = ['start', 'pause', 'resume', 'reset', 'set_time', 'play_until', 'set_parameters'];
const config = { id: 'muscle_tableau_national', version: '1.0', title: 'Le national au tableau', variants: Object.keys(V).map(id => ({ id, label: V[id].titre })), commands: commandes,
  command_schema: { play_until: { moment: Object.keys(VU.M).join(' | ') }, set_parameters: { conclusions: 'true | false (false : la conclusion reste cachée ; true : montre aussi ce que ?cacher= tait)' } } };
const pont = protocole({ id: config.id, commandes, config,
  texte: VU.titre + '. Document d’examen national rejoué étape par étape ; valeurs du sujet.',
  etat: () => ({ simulation_status: chrono.statut(), current_variant: VUE, ce_qui_se_voit: VU.voit(), moments: VU.M, time_s: +chrono.t.toFixed(2), parameters: CACHER ? { ...R, cacher: CACHER, revele: REVELE } : { ...R } }),
  progression: () => (chrono.statut() === 'finished' ? 1 : chrono.t / VU.FIN),
  executer: (cmd, p) => ({ start: chrono.start, pause: chrono.pause, resume: chrono.resume, reset: chrono.reset,
    set_time: () => chrono.setTime(p), play_until: () => chrono.playUntil(p),
    set_parameters: () => { if (p && 'conclusions' in p) { R.conclusions = p.conclusions !== false && p.conclusions !== 'false'; REVELE = R.conclusions || !CACHER; } scene.sale = true; } })[cmd]?.() });
bulle($('feedback'), VU.titre);
</script>
