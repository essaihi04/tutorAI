<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Le noyau commande — au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="genetique.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Expériences qui localisent l’information génétique dans le noyau : amibe coupée en deux, acétabulaire sectionnée, greffe de noyaux entre deux espèces d’acétabulaire, transfert de noyau chez la grenouille"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start reset pause resume play_until">Lancer</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="commun.js"></script>
<script src="etapes.js"></script>
<script>
/*
 * Le noyau commande (cours « Notion de l’information génétique », 2 Bac PC BIOF, 11 novembre 2026). Capacité NIG1.
 * Quatre vues : amibe (mérotomie), acetabulaire (section en trois), greffe (échange des noyaux entre A. mediterranea,
 * chapeau lisse, et A. crenulata, chapeau crénelé), gurdon (noyau d’une cellule de têtard albinos dans un ovule irradié).
 * Le vivant est peint (règle 7) ; la craie écrit les légendes, les flèches et les conclusions.
 */
const { lisse, rampe, entre, Peint } = window.Etapes;
const TAU = Math.PI * 2;

/* ── Peinture ──────────────────────────────────────────────────────── */
/** Amibe : masse grise translucide, pseudopodes qui ondulent ; `vie` 1 = active, 0 = morte (ronde, brunie). */
function amibe(x, cx, cy, R, t, graine, vie, a = 1) {
  x.save(); x.globalAlpha = a;
  const pseudo = .22 * vie;
  const pts = [];
  for (let i = 0; i < 64; i++) {
    const th = i / 64 * TAU;
    const r = R * (1 + pseudo * (Math.sin(3 * th + t * .8 + graine) * .9 + Math.sin(5 * th - t * .55 + graine * 2) * .5 + Math.max(0, Math.sin(2 * th + graine + t * .3)) * .8));
    pts.push([cx + r * Math.cos(th), cy + r * .78 * Math.sin(th)]);
  }
  const g = x.createRadialGradient(cx - R * .3, cy - R * .3, 4, cx, cy, R * 1.3);
  const morte = 1 - vie;
  g.addColorStop(0, `rgba(${220 - 40 * morte},${225 - 70 * morte},${230 - 110 * morte},.62)`);
  g.addColorStop(1, `rgba(${150 - 20 * morte},${160 - 60 * morte},${175 - 100 * morte},.55)`);
  x.fillStyle = g; x.beginPath(); pts.forEach(([px, py], i) => (i ? x.lineTo(px, py) : x.moveTo(px, py))); x.closePath(); x.fill();
  x.strokeStyle = `rgba(${200 - 60 * morte},${215 - 90 * morte},${225 - 120 * morte},.85)`; x.lineWidth = 1.4; x.stroke();
  x.save(); x.clip(); x.fillStyle = `rgba(90,100,110,${.3 + .3 * morte})`;
  for (let i = 0; i < 40; i++) { const an = i * 2.4 + graine, rr = R * (.15 + .75 * ((i * 53) % 29) / 29); x.beginPath(); x.arc(cx + Math.cos(an) * rr, cy + Math.sin(an) * rr * .75, 1.4 + morte * .8, 0, TAU); x.fill(); }
  x.restore(); x.restore();
}
function noyauSombre(x, cx, cy, r, a = 1, couleur = ['#6d5a8a', '#2e1f45']) {
  x.save(); x.globalAlpha = a;
  const g = x.createRadialGradient(cx - r * .35, cy - r * .35, 1, cx, cy, r);
  g.addColorStop(0, couleur[0]); g.addColorStop(1, couleur[1]);
  x.fillStyle = g; x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.fill(); x.restore();
}
/** Acétabulaire : rhizoïde ramifié (base yb), tige jusqu’à yh, chapeau (lisse ou crénelé) de rayon rc ; `gris` 0..1 = mort. */
const VERT_MED = ['rgba(120,220,120,.75)', 'rgba(40,140,60,.8)'], VERT_CREN = ['rgba(190,220,110,.75)', 'rgba(110,140,40,.8)'];
function rhizoide(x, cx, yb, teinte, gris = 0, a = 1) {
  x.save(); x.globalAlpha = a * (1 - .5 * gris);
  const g = x.createRadialGradient(cx, yb - 12, 2, cx, yb - 8, 22); g.addColorStop(0, teinte[0]); g.addColorStop(1, teinte[1]);
  x.fillStyle = g; x.beginPath(); x.ellipse(cx, yb - 10, 13, 11, 0, 0, TAU); x.fill();
  x.strokeStyle = teinte[1]; x.lineWidth = 2.2; x.lineCap = 'round';
  for (const [dx, dy] of [[-22, 10], [-12, 14], [2, 15], [14, 12], [24, 8]]) { x.beginPath(); x.moveTo(cx + dx * .3, yb - 4); x.quadraticCurveTo(cx + dx * .7, yb + 2, cx + dx, yb + dy - 4); x.stroke(); }
  x.restore();
}
function tige(x, cx, y0, y1, teinte, gris = 0, a = 1) {
  if (y1 >= y0) return;
  x.save(); x.globalAlpha = a * (1 - .5 * gris);
  const g = x.createLinearGradient(cx - 3, 0, cx + 3, 0); g.addColorStop(0, teinte[1]); g.addColorStop(.5, teinte[0]); g.addColorStop(1, teinte[1]);
  x.fillStyle = g; x.fillRect(cx - 2.6, y1, 5.2, y0 - y1);
  x.restore();
}
function chapeau(x, cx, cy, rc, crenele, teinte, gris = 0, a = 1) {
  if (rc <= .5) return;
  x.save(); x.globalAlpha = a * (1 - .5 * gris);
  const g = x.createRadialGradient(cx, cy - 4, 1, cx, cy, rc); g.addColorStop(0, teinte[0]); g.addColorStop(1, teinte[1]);
  x.fillStyle = g; x.beginPath();
  const n = 15;
  for (let i = 0; i <= 60; i++) {
    const th = Math.PI + i / 60 * Math.PI;
    let r = rc;
    if (crenele) r = rc * (.84 + .16 * Math.abs(Math.sin(i / 60 * n * Math.PI / 2 * 2)));
    const px = cx + r * Math.cos(th), py = cy + r * .42 * Math.sin(th);
    i ? x.lineTo(px, py) : x.moveTo(px, py);
  }
  x.quadraticCurveTo(cx, cy + rc * .12, cx - rc, cy); x.closePath(); x.fill();
  x.strokeStyle = 'rgba(30,80,30,.45)'; x.lineWidth = .7;
  for (let i = 1; i < 10; i++) { const th = Math.PI + i / 10 * Math.PI; x.beginPath(); x.moveTo(cx, cy); x.lineTo(cx + rc * .9 * Math.cos(th), cy + rc * .38 * Math.sin(th)); x.stroke(); }
  if (gris > .5) { x.fillStyle = `rgba(120,110,90,${.4 * gris})`; x.fill(); }
  x.restore();
}
function algue(x, cx, yb, yh, rc, crenele, teinte, o = {}) {
  rhizoide(x, cx, yb, teinte, o.grisR || 0, o.a ?? 1);
  tige(x, cx, yb - 18, yh, teinte, o.grisT || 0, o.a ?? 1);
  chapeau(x, cx, yh, rc, crenele, teinte, o.grisC || 0, o.a ?? 1);
}
/** Grenouille simple, vue de dessus ; `albinos` : blanc rosé, yeux rouges. */
function grenouille(x, cx, cy, s, albinos, a = 1) {
  x.save(); x.globalAlpha = a; x.translate(cx, cy); x.scale(s, s);
  const c0 = albinos ? '#fff1f2' : '#9bc46a', c1 = albinos ? '#f4c2cc' : '#4d6b2a';
  x.strokeStyle = c1; x.lineWidth = 6; x.lineCap = 'round';
  for (const sg of [-1, 1]) {
    x.beginPath(); x.moveTo(sg * 12, 12); x.quadraticCurveTo(sg * 34, 20, sg * 26, 34); x.lineTo(sg * 38, 40); x.stroke();
    x.beginPath(); x.moveTo(sg * 10, -10); x.lineTo(sg * 24, -2); x.lineTo(sg * 28, 6); x.stroke();
  }
  const g = x.createRadialGradient(-6, -8, 2, 0, 0, 30); g.addColorStop(0, c0); g.addColorStop(1, c1);
  x.fillStyle = g; x.beginPath(); x.ellipse(0, 6, 20, 26, 0, 0, TAU); x.fill();
  x.beginPath(); x.ellipse(0, -20, 16, 12, 0, 0, TAU); x.fill();
  if (!albinos) { x.fillStyle = 'rgba(40,55,20,.55)'; for (const [px, py, r] of [[-8, 4, 3.5], [7, 12, 4], [-3, 20, 3], [9, -2, 2.6]]) { x.beginPath(); x.arc(px, py, r, 0, TAU); x.fill(); } }
  for (const sg of [-1, 1]) { x.fillStyle = albinos ? '#ef4444' : '#1f2937'; x.beginPath(); x.arc(sg * 9, -26, 3.6, 0, TAU); x.fill(); x.fillStyle = 'rgba(255,255,255,.7)'; x.beginPath(); x.arc(sg * 9 - 1, -27, 1.1, 0, TAU); x.fill(); }
  x.restore();
}
function tetard(x, cx, cy, s, albinos, t, a = 1) {
  x.save(); x.globalAlpha = a; x.translate(cx, cy); x.scale(s, s);
  const c0 = albinos ? '#fff1f2' : '#6b7a4a', c1 = albinos ? '#f0b8c4' : '#3a4526';
  x.fillStyle = c1; x.beginPath(); x.moveTo(8, -5);
  for (let i = 0; i <= 12; i++) { const u = i / 12; x.lineTo(8 + u * 34, Math.sin(u * 5 + t * 4) * 4 * u - 5 * (1 - u)); }
  for (let i = 12; i >= 0; i--) { const u = i / 12; x.lineTo(8 + u * 34, Math.sin(u * 5 + t * 4) * 4 * u + 5 * (1 - u)); }
  x.fill();
  const g = x.createRadialGradient(-4, -4, 1, 0, 0, 14); g.addColorStop(0, c0); g.addColorStop(1, c1);
  x.fillStyle = g; x.beginPath(); x.ellipse(0, 0, 13, 10, 0, 0, TAU); x.fill();
  x.fillStyle = albinos ? '#ef4444' : '#111'; x.beginPath(); x.arc(-6, -3, 2, 0, TAU); x.fill();
  x.restore();
}
function ovule(x, cx, cy, r, a = 1) {
  x.save(); x.globalAlpha = a;
  const g = x.createRadialGradient(cx - r * .3, cy - r * .5, 2, cx, cy, r);
  g.addColorStop(0, '#6b5a4a'); g.addColorStop(.5, '#3f3328'); g.addColorStop(.62, '#d9c9a8'); g.addColorStop(1, '#bfae88');
  x.fillStyle = g; x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.fill();
  x.strokeStyle = 'rgba(240,230,200,.5)'; x.lineWidth = 3; x.beginPath(); x.arc(cx, cy, r + 3, 0, TAU); x.stroke();
  x.restore();
}

/* ── Vue amibe ─────────────────────────────────────────────────────── */
const A = { cx: 300, cy: 215, R: 70 };
const AM = { presentation: 2.2, coupe: 5.0, sans_noyau_meurt: 9.0, avec_noyau_regenere: 12.0, division: 15.4 };
function dessinerAmibe(c, k) {
  const t = k.t;
  const sep = rampe(t, 4.6, 1.1);
  const xG = entre(272, 175, sep), xD = entre(322, 440, sep);
  const meurt = rampe(t, 5.8, 3.0), regen = rampe(t, 6.0, 5.8), div = rampe(t, 12.3, 3.0);
  c.direct(() => {
    const x = c.ctx;
    if (t < 4.6) {
      amibe(x, A.cx, A.cy, A.R, t, .7, 1);
      noyauSombre(x, A.cx + 26, A.cy - 6, 15);
      if (t >= 3.0) { const yA = entre(90, 330, rampe(t, 3.0, 1.6)); x.save(); x.strokeStyle = 'rgba(220,235,255,.95)'; x.lineWidth = 2; x.beginPath(); x.moveTo(282, 70); x.lineTo(282, yA); x.stroke(); x.restore(); }
    } else {
      amibe(x, xG, A.cy + 4, entre(A.R * .62, A.R * .5, meurt), t, 2.1, 1 - meurt);
      if (div <= 0) {
        amibe(x, xD, A.cy, A.R * entre(.74, 1, regen), t, .7, 1);
        noyauSombre(x, xD + 14, A.cy - 6, 15);
      } else {
        const d = 72 * div, R = A.R * entre(1, .72, div);
        amibe(x, xD, A.cy - d, R, t, .7, 1); amibe(x, xD, A.cy + d * .9, R, t, 3.3, 1);
        noyauSombre(x, xD + 10, A.cy - d - 4, entre(15, 12, div)); noyauSombre(x, xD + 10, A.cy + d * .9 - 4, entre(15, 12, div));
      }
    }
  });
  c.texte('Mérotomie d’une amibe', 14, 26, { couleur: 'cyan', taille: 19 });
  frise(c, t, [[0, 'jour 0'], [AM.sans_noyau_meurt, 'quelques jours']]);
  if (t < 4.6) { c.repere('amibe', A.cx - 90, A.cy - 70, 180, 140, 'l’amibe'); c.repere('noyau', A.cx + 10, A.cy - 22, 32, 32, 'le noyau'); }
  if (t < 4.6 && k.ecrit(c, 'pres', AM.presentation - 1.2)) {
    k.T(c, 'amibe : une seule cellule', 70, 110, { couleur: 'blanc', taille: 16 });
    c.ligne(330, 196, 360, 120, { couleur: 'blanc', largeur: 1.3 }); k.T(c, 'noyau', 362, 116, { couleur: 'violet', taille: 16 });
    c.ligne(250, 250, 200, 330, { couleur: 'blanc', largeur: 1.3 }); k.T(c, 'cytoplasme', 150, 348, { couleur: 'blanc', taille: 16 });
  }
  if (k.ecrit(c, 'coupe', AM.coupe - .4)) {
    k.T(c, 'fragment sans noyau', xG, 330, { couleur: 'orange', taille: 15, align: 'center' });
    k.T(c, 'fragment avec noyau', 440, 330, { couleur: 'vert', taille: 15, align: 'center' });
  }
  if (t >= 4.6) { c.repere('fragment_anucle', xG - 50, A.cy - 45, 100, 95, 'le fragment sans noyau'); }
  if (t >= 4.6 && div <= 0) c.repere('fragment_nucle', xD - 75, A.cy - 60, 150, 125, 'le fragment avec noyau');
  if (k.ecrit(c, 'meurt', AM.sans_noyau_meurt - .5)) {
    c.ligne(xG - 22, A.cy - 18, xG + 22, A.cy + 22, { couleur: 'rouge', largeur: 2.4 }); c.ligne(xG + 22, A.cy - 18, xG - 22, A.cy + 22, { couleur: 'rouge', largeur: 2.4 });
    k.T(c, 'il meurt', xG, 360, { couleur: 'rouge', taille: 16, align: 'center' });
  }
  if (k.ecrit(c, 'regen', AM.avec_noyau_regenere - .5)) k.T(c, 'il se nourrit et grandit', 440, 360, { couleur: 'vert', taille: 15, align: 'center' });
  if (div > 0) c.repere('division', xD - 70, A.cy - 130, 150, 260, 'les deux amibes filles');
  if (k.ecrit(c, 'div', AM.division - .3)) {
    k.T(c, 'il se divise :', 560, 200, { couleur: 'vert', taille: 16 });
    k.T(c, 'deux amibes', 560, 222, { couleur: 'vert', taille: 16 });
    k.T(c, 'Le fragment nucléé vit et se divise.', 380, 396, { couleur: 'jaune', taille: 17, align: 'center' });
  }
}
function voitAmibe(k) {
  const t = k.t, m = [];
  if (t < 4.6) m.push('Une amibe peinte (masse grise translucide aux pseudopodes) avec son noyau sombre' + (t >= 3 ? ' ; un fin fil de verre descend pour la couper en deux.' : '.'));
  if (t >= AM.presentation - 1.2 && t < 4.6) m.push('Écrit : « amibe : une seule cellule », « noyau », « cytoplasme ».');
  if (t >= 4.6) m.push('L’amibe est coupée : à gauche le fragment sans noyau (écrit en orange), à droite le fragment avec noyau (écrit en vert).');
  if (t >= 5.8 && t < AM.sans_noyau_meurt) m.push('Le fragment sans noyau s’arrondit, perd ses pseudopodes et brunit.');
  if (t >= AM.sans_noyau_meurt - .5) m.push('Le fragment sans noyau est mort : barré d’une croix rouge, écrit « il meurt ».');
  if (t >= 6 && t < 12.3) m.push('Le fragment avec noyau refait ses pseudopodes et grandit.');
  if (t >= 12.3) m.push('Le fragment avec noyau se divise en deux amibes, chacune avec un noyau ; écrit « il se divise : deux amibes » et « Le fragment nucléé vit et se divise. »');
  return m;
}

/* ── Vue acétabulaire ──────────────────────────────────────────────── */
const AC = { yb: 330, yh: 118, rc: 42, xM: 110, xC: 300, xE: 560 };
const ACM = { presentation: 3.0, section: 7.4, fragments_meurent: 11.2, rhizoide_regenere: 15.4 };
function yCoupe(P) { return AC.yb - 18 - P.coupe_basse * (AC.yb - 18 - AC.yh - 30); }
function dessinerAcetabulaire(c, k) {
  const t = k.t, P = k.P, yc = yCoupe(P), yHaut = AC.yh + 26;
  const exp = rampe(t, 3.6, .8), ecart = rampe(t, 5.8, 1.2);
  const x1 = entre(AC.xE, 470, ecart), x2 = entre(AC.xE, 580, ecart), x3 = entre(AC.xE, 690, ecart);
  const mort1 = rampe(t, 8.0, 2.4), chap2 = rampe(t, 7.8, 1.5) * .45, mort2 = rampe(t, 9.4, 1.6);
  const pousse = rampe(t, 11.6, 1.8), chap3 = rampe(t, 13.2, 2.0);
  c.direct(() => {
    const x = c.ctx;
    algue(x, AC.xM, AC.yb, AC.yh, AC.rc, false, VERT_MED);
    algue(x, AC.xC, AC.yb, AC.yh, AC.rc, true, VERT_CREN);
    noyauSombre(x, AC.xM, AC.yb - 10, 5, 1, ['#3f7a3f', '#123d12']); noyauSombre(x, AC.xC, AC.yb - 10, 5, 1, ['#7a6a2a', '#3d300c']);
    if (exp > 0) {
      x.save(); x.globalAlpha = exp;
      if (t < 5.8) algue(x, AC.xE, AC.yb, AC.yh, AC.rc, false, VERT_MED);
      else {
        chapeau(x, x1, AC.yh, AC.rc, false, VERT_MED, mort1); tige(x, x1, yHaut + 2, AC.yh, VERT_MED, mort1);
        tige(x, x2, yc - 4, yHaut + 6, VERT_MED, mort2); chapeau(x, x2, yHaut + 6, AC.rc * chap2, false, VERT_MED, mort2);
        rhizoide(x, x3, AC.yb, VERT_MED); tige(x, x3, AC.yb - 18, entre(yc + 4, AC.yh, pousse), VERT_MED);
        if (chap3 > 0) chapeau(x, x3, AC.yh, AC.rc * chap3, false, VERT_MED);
      }
      noyauSombre(x, t < 5.8 ? AC.xE : x3, AC.yb - 10, 5, 1, ['#3f7a3f', '#123d12']);
      x.restore();
      if (t < 5.8) { // la position de la coupe basse : une poignée sur la tige
        x.save(); x.strokeStyle = 'rgba(250,204,21,.9)'; x.lineWidth = 2; x.setLineDash([3, 3]); x.beginPath(); x.moveTo(AC.xE - 16, yc); x.lineTo(AC.xE + 16, yc); x.stroke(); x.restore();
        x.save(); x.fillStyle = 'rgba(250,204,21,.95)'; x.beginPath(); x.arc(AC.xE + 22, yc, 5, 0, TAU); x.fill(); x.restore();
      }
    }
  });
  c.texte('L’acétabulaire : une algue d’une seule cellule', 14, 26, { couleur: 'cyan', taille: 19 });
  c.repere('mediterranea', AC.xM - 45, AC.yh - 25, 90, AC.yb - AC.yh + 40, 'Acetabularia mediterranea');
  c.repere('crenulata', AC.xC - 45, AC.yh - 25, 90, AC.yb - AC.yh + 40, 'Acetabularia crenulata');
  c.repere('chapeau', AC.xM - 44, AC.yh - 22, 88, 30, 'le chapeau'); c.repere('tige', AC.xM - 8, AC.yh + 20, 16, 200, 'la tige (pédoncule)');
  c.repere('rhizoide', AC.xM - 26, AC.yb - 24, 52, 34, 'le rhizoïde'); c.repere('noyau', AC.xM - 9, AC.yb - 19, 18, 18, 'le noyau, dans le rhizoïde');
  if (k.ecrit(c, 'pres', 1.0)) {
    k.T(c, 'A. mediterranea', AC.xM, 64, { couleur: 'vert', taille: 15, align: 'center' });
    k.T(c, 'A. crenulata', AC.xC, 64, { couleur: 'jaune', taille: 15, align: 'center' });
    k.T(c, 'chapeau lisse', AC.xM, 90, { couleur: 'blanc', taille: 14, align: 'center' });
    k.T(c, 'chapeau crénelé', AC.xC, 90, { couleur: 'blanc', taille: 14, align: 'center' });
    c.ligne(AC.xM + 6, 230, AC.xM + 60, 214, { couleur: 'blanc', largeur: 1.2 }); k.T(c, 'tige (pédoncule)', AC.xM + 62, 210, { couleur: 'blanc', taille: 14 });
    c.ligne(AC.xC - 20, AC.yb - 8, AC.xC - 60, AC.yb + 26, { couleur: 'blanc', largeur: 1.2 }); k.T(c, 'rhizoïde', AC.xC - 64, AC.yb + 40, { couleur: 'blanc', taille: 14, align: 'right' });
    c.cercle(AC.xM, AC.yb - 10, 9, { couleur: 'violet', largeur: 1.6 });
    c.ligne(AC.xM + 10, AC.yb - 6, AC.xM + 48, AC.yb + 22, { couleur: 'violet', largeur: 1.2 }); k.T(c, 'noyau', AC.xM + 50, AC.yb + 36, { couleur: 'violet', taille: 14 });
    c.cote(28, AC.yh - 10, 28, AC.yb, '', { couleur: 'faible' }); k.T(c, '4 à 6 cm', 34, 250, { couleur: 'faible', taille: 13 });
  }
  if (t >= 3.6) frise(c, t, [[3.6, 'jour 0'], [ACM.fragments_meurent, 'quelques semaines']]);
  if (k.ecrit(c, 'exp', 4.2)) k.T(c, 'on coupe A. mediterranea', 600, 74, { couleur: 'cyan', taille: 15, align: 'center' });
  if (t >= 3.6 && t < 5.8) c.repere('coupe', AC.xE - 18, yc - 10, 50, 20, 'la coupe basse (poignée)');
  if (k.ecrit(c, 'section', ACM.section - 1.2)) {
    k.T(c, '1', x1 + 30, AC.yh + 30, { couleur: 'jaune', taille: 17 }); k.T(c, '2', x2 + 12, (yc + yHaut) / 2, { couleur: 'jaune', taille: 17 }); k.T(c, '3', x3 + 18, AC.yb - 30, { couleur: 'jaune', taille: 17 });
  }
