<script>
/*
 * Documents du chapitre « Notion de l’information génétique » (2 Bac PC BIOF, 11 novembre 2026), écrits à la craie au rythme du tuteur.
 * Vue ouverture : parents, enfant, cellule-œuf et les quatre questions du chapitre.
 * Vue courbe : document d’examen (quantité d’ADN, 0–30 h) puis la réponse rédigée comme le barème (décrire avec les valeurs, expliquer).
 * Vue durees (14 novembre 2026, règle 28) : d’abord l’animation (boîte de culture, cellules qui se divisent, minuteur, compteur ;
 *   puis 20 cellules au microscope triées par phase), ensuite le tableau et le calcul : 2 doublements = 2 cycles → 20 h ;
 *   G1 = 45 % × 20 h = 9 h ; S = 20 − (9 + 4 + 1) = 6 h.
 * Vue restitution : un QCM corrigé leurre par leurre (phase G1).
 */
const { lisse, rampe, entre, Peint } = window.Etapes;
const TAU = Math.PI * 2;

/* ── Vue ouverture ─────────────────────────────────────────────────── */
function personne(x, cx, cy, s, couleur, a = 1) {

}
const MO = { parents: 2.0, cellule_oeuf: 4.6, q1: 6.6, q2: 8.6, q3: 10.6, q4: 12.6 };
const QUESTIONS = [['1. Où est l’information génétique ?'], ['2. Comment passe-t-elle d’une cellule', 'à ses cellules filles ?'], ['3. De quoi est-elle faite ?'], ['4. Comment se copie-t-elle ?']];

/* ── Vue courbe ──────────────────────────────────────────────────── */
const GC = { x0: 70, x1: 430, y0: 226, ux: 12, uy: 22 }, gx = h => GC.x0 + h * GC.ux, gy = q => GC.y0 - q * GC.uy;

const MCB = { document: 2.6, lecture_axes: 4.2, decrire_g1: 6.2, decrire_s: 8.2, decrire_g2: 10.2, decrire_m: 12.2, expliquer: 15.0 };
const SEGS = { decrire_g1: [0, 8], decrire_s: [8, 14], decrire_g2: [14, 19], decrire_m: [19, 20] };
const REP = [['decrire_g1', '• de 0 à 8 h : la quantité d’ADN reste constante, 3 UA ;', 282], ['decrire_s', '• de 8 à 14 h : elle augmente de 3 à 6 UA : elle double ;', 302], ['decrire_g2', '• de 14 à 19 h : elle reste constante, 6 UA ;', 322], ['decrire_m', '• de 19 à 20 h : elle chute de 6 à 3 UA.', 342]];
function dessinerCourbe(c, k) {

  c.axe(GC.x0, GC.y0, GC.x0, gy(7.3), [1, 2, 3, 4, 5, 6, 7].map(v => [v * GC.uy / (GC.y0 - gy(7.3)), String(v)]), { vertical: true, taille: 12 });
  c.texte('quantité d’ADN (UA)', GC.x0 + 8, gy(7.3) + 4, { couleur: 'faible', taille: 13, duree: .3 }); c.texte('temps (h)', gx(31.5), GC.y0 + 34, { couleur: 'faible', taille: 13, align: 'right', duree: .3 });
  c.direct(() => {
    const x = c.ctx; x.save(); x.strokeStyle = '#f8fafc'; x.lineWidth = 2.6; x.beginPath(); const n = Math.ceil(hMax * 8);
    for (let i = 0; i <= n; i++) { const h = hMax * i / Math.max(1, n); x[i ? 'lineTo' : 'moveTo'](gx(h), gy(ADN(h))); } x.stroke(); x.restore();
    for (const [nom, [a, b]] of Object.entries(SEGS)) if (t >= MCB[nom] - 1.2 && t < MCB[nom] + 1.6) { x.save(); x.strokeStyle = 'rgba(250,204,21,.85)'; x.lineWidth = 6; x.globalAlpha = .55; x.beginPath(); for (let h = a; h <= b + 1e-6; h += .1) x[h === a ? 'moveTo' : 'lineTo'](gx(h), gy(ADN(h))); x.stroke(); x.restore(); }
  });
  c.repere('courbe', GC.x0, gy(6.5), gx(30) - GC.x0, GC.y0 - gy(6.5), 'la courbe');
  c.repere('axe_temps', GC.x0, GC.y0 - 4, gx(31.5) - GC.x0, 24, 'l’axe du temps (h)'); c.repere('axe_adn', GC.x0 - 30, gy(7.3), 34, GC.y0 - gy(7.3), 'l’axe de la quantité d’ADN (UA)');
  c.repere('palier_g1', gx(0), gy(3) - 8, gx(8) - gx(0), 16, 'de 0 à 8 h'); c.repere('montee_s', gx(8), gy(6) - 4, gx(14) - gx(8), gy(3) - gy(6) + 8, 'de 8 à 14 h'); c.repere('palier_g2', gx(14), gy(6) - 8, gx(19) - gx(14), 16, 'de 14 à 19 h'); c.repere('chute_m', gx(19) - 4, gy(6) - 4, 20, gy(3) - gy(6) + 8, 'de 19 à 20 h');
  if (k.ecrit(c, 'ax', MCB.lecture_axes - 1.0)) {
    c.ligne(GC.x0, gy(3), gx(31), gy(3), { couleur: 'tresfaible', largeur: 1, pointille: [3, 5] }); c.ligne(GC.x0, gy(6), gx(31), gy(6), { couleur: 'tresfaible', largeur: 1, pointille: [3, 5] });
    k.T(c, 'q = 3 UA', gx(31) + 6, gy(3) + 5, { couleur: 'jaune', taille: 14 }); k.T(c, '2q = 6 UA', gx(31) + 6, gy(6) + 5, { couleur: 'jaune', taille: 14 });
    k.T(c, '1 graduation = 4 h', 560, 160, { couleur: 'faible', taille: 13 });

  for (const [nom, txt, y] of REP) if (k.ecrit(c, nom, MCB[nom] - 1.0)) k.T(c, txt, 40, y, { couleur: 'blanc', taille: 14 });
  if (k.ecrit(c, 'expl', MCB.expliquer - 1.6)) {
    k.T(c, 'Explication :', 30, 370, { couleur: 'cyan', taille: 15 });
    k.T(c, '8 à 14 h : réplication de l’ADN (phase S) ;', 140, 370, { couleur: 'vert', taille: 14 });
    k.T(c, '19 à 20 h : répartition égale de l’ADN entre deux cellules filles (mitose).', 40, 392, { couleur: 'vert', taille: 14 });

function voitCourbe(k) {
  const t = k.t, m = ['Document d’examen : courbe « quantité d’ADN (UA) en fonction du temps (h) », de 0 à 30 h : 3 UA de 0 à 8 h, montée de 3 à 6 UA de 8 à 14 h, 6 UA de 14 à 19 h, chute à 3 UA entre 19 et 20 h, puis 3 UA jusqu’à 28 h et nouvelle montée.'];
  if (t >= MCB.lecture_axes - 1) m.push('Écrit : « q = 3 UA », « 2q = 6 UA », « 1 graduation = 4 h ».');
  const d = REP.filter(([n]) => t >= MCB[n] - 1).map(([, s]) => s.replace('• ', ''));
  if (d.length) m.push('Réponse écrite sous la courbe : « Description : ' + d.join(' ') + ' »');
  for (const [nom, [a, b]] of Object.entries(SEGS)) if (t >= MCB[nom] - 1.2 && t < MCB[nom] + 1.6) m.push(`Le segment de ${a} à ${b} h est surligné en jaune.`);
  if (t >= MCB.expliquer - 1.6) m.push('« Explication : 8 à 14 h : réplication de l’ADN (phase S) ; 19 à 20 h : répartition égale de l’ADN entre deux cellules filles (mitose). »');
  return m;
}

/* ── Vue durées (14 novembre 2026 : l’animation d’abord, le tableau ensuite) ─────────────────
 * ① Une boîte de culture peinte (milieu rose orangé, bord de verre) : dix cellules peintes, une cellule ≈ 250 cellules.
 *    Le minuteur peint tourne de 0 à 40 h ; à 20 h chaque cellule s’étire, s’étrangle et donne deux cellules, puis encore
 *    à 40 h. Le compteur monte : 2,5·10³ → 5·10³ → 10·10³ et chaque relevé s’écrit sous le minuteur (0 h, 20 h, 40 h).
 * ② La boîte s’efface ; les relevés volent dans le tableau « temps / nombre de cellules » ; ×2, ×2 ; 2 doublements = 2 cycles ;
 *    durée d’un cycle = 40 h / 2 = 20 h.
 * ③ Une lame au microscope : 20 cellules peintes (1 cellule = 5 %) ; celles en G1, G2 et M sont triées dans leurs colonnes,
 *    les compteurs montent (45 %, 20 %, 5 %) ; les cellules en S restent sur la lame (« ? ») ; les pourcentages volent dans
 *    le tableau des phases. Puis les durées : G1 = 45 % × 20 h = 9 h ; G2 4 h ; M 1 h ; S = 20 − (9 + 4 + 1) = 6 h, et les
 *    six cellules en S rejoignent enfin leur colonne (6 cellules = 30 % = 6 h).
 */
const MD = { depart: 3.7, quarante_heures: 7.4, doublements: 13.2, duree_cycle: 19.6, pourcentages: 24.6, duree_g1: 27.6, duree_s: 32.2 };
const BOITE = { cx: 150, cy: 236, r: 116 }, MINU = { cx: 330, cy: 88, r: 32 };
const NB = ['2,5·10³', '5·10³', '10·10³'], HEURES = [0, 20, 40];
const tHeure = h => 4.0 + 3.0 * h / 40;                       // le minuteur : 0 h à 4,0 s, 40 h à 7,0 s
const heure = t => 40 * Math.min(1, Math.max(0, (t - 4.0) / 3.0));
const tReleve = [2.0, tHeure(20) + .1, tHeure(40) + .1];
const LOGY = [196, 220, 244], ROWY = [134, 160, 186];
const tVolLog = i => 7.9 + i * .3;
const division = (h, k) => Math.min(1, Math.max(0, (h - (k === 1 ? 16.5 : 36.5)) / 3.5));
/* Les cellules de la boîte : dix au départ, chacune donne 2 puis 4 cellules (positions fixes, tirées une fois). */
const CELLS0 = (() => {
  let s = 977; const rnd = () => { s = (Math.imul(s, 1103515245) + 12345) >>> 0; return s / 4294967296; };
  const P = [];
  while (P.length < 10) {
    const a = rnd() * TAU, d = 18 + rnd() * 62, x = BOITE.cx + Math.cos(a) * d, y = BOITE.cy + Math.sin(a) * d;
    if (P.every(p => Math.hypot(p.x - x, p.y - y) > 40)) P.push({ x, y, th: rnd() * Math.PI });
  }
  return P;
})();
const CR = 9;   // rayon d’une cellule peinte
const TEINTE_BOITE = ['rgba(255,247,235,.92)', 'rgba(244,226,206,.85)', 'rgba(196,150,120,.9)'];
function boite(x, cx, cy, r, a) {
  x.save(); x.globalAlpha = a;
  x.fillStyle = 'rgba(0,0,0,.28)'; x.beginPath(); x.ellipse(cx + 4, cy + 7, r, r * .98, 0, 0, TAU); x.fill();
  const g = x.createRadialGradient(cx - r * .35, cy - r * .35, r * .1, cx, cy, r);    // milieu de culture (rouge de phénol)
  g.addColorStop(0, 'rgba(244,140,120,.62)'); g.addColorStop(1, 'rgba(190,70,72,.62)');
  x.fillStyle = g; x.beginPath(); x.arc(cx, cy, r * .95, 0, TAU); x.fill();
  x.strokeStyle = 'rgba(225,240,250,.35)'; x.lineWidth = 7; x.beginPath(); x.arc(cx, cy, r * .97, 0, TAU); x.stroke();
  x.strokeStyle = 'rgba(232,244,252,.9)'; x.lineWidth = 2.4; x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.stroke();
  x.strokeStyle = 'rgba(255,255,255,.55)'; x.lineWidth = 3; x.lineCap = 'round'; x.beginPath(); x.arc(cx, cy, r * .86, Math.PI * 1.08, Math.PI * 1.42); x.stroke();
  x.restore();
}
function minuteur(x, cx, cy, r, h, a, cycles) {
  x.save(); x.globalAlpha = a;
  const gb = x.createRadialGradient(cx - r * .4, cy - r * .4, 2, cx, cy, r + 6); gb.addColorStop(0, '#e5e7eb'); gb.addColorStop(1, '#4b5563');
  x.fillStyle = gb; x.beginPath(); x.arc(cx, cy, r + 6, 0, TAU); x.fill();
  x.fillStyle = '#6b7280'; x.fillRect(cx - 5, cy - r - 13, 10, 7);                                    // le bouton du minuteur
  const gf = x.createRadialGradient(cx - r * .3, cy - r * .3, 2, cx, cy, r); gf.addColorStop(0, '#fffdf5'); gf.addColorStop(1, '#e7dcc4');
  x.fillStyle = gf; x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.fill();
  const ang = u => -Math.PI / 2 + u * TAU;
  if (cycles > 0) {   // les deux cycles : 0–20 h en orange, 20–40 h en bleu
    for (const [u0, u1, col] of [[0, .5, 'rgba(251,146,60,.55)'], [.5, 1, 'rgba(56,189,248,.5)']]) { x.fillStyle = col; x.globalAlpha = a * cycles; x.beginPath(); x.moveTo(cx, cy); x.arc(cx, cy, r * .9, ang(u0), ang(u1)); x.closePath(); x.fill(); }
    x.globalAlpha = a;
  } else if (h > 0) { x.fillStyle = 'rgba(250,204,21,.4)'; x.beginPath(); x.moveTo(cx, cy); x.arc(cx, cy, r * .9, ang(0), ang(h / 40)); x.closePath(); x.fill(); }
  x.strokeStyle = '#374151';
  for (let i = 0; i < 40; i += 2) { const an = ang(i / 40), l = i % 10 === 0 ? 7 : 3.5; x.lineWidth = i % 10 === 0 ? 1.8 : 1; x.beginPath(); x.moveTo(cx + Math.cos(an) * (r - 1), cy + Math.sin(an) * (r - 1)); x.lineTo(cx + Math.cos(an) * (r - 1 - l), cy + Math.sin(an) * (r - 1 - l)); x.stroke(); }
  const an = ang(h / 40);
  x.strokeStyle = '#b91c1c'; x.lineWidth = 2.4; x.lineCap = 'round'; x.beginPath(); x.moveTo(cx, cy); x.lineTo(cx + Math.cos(an) * r * .8, cy + Math.sin(an) * r * .8); x.stroke();
  x.fillStyle = '#111827'; x.beginPath(); x.arc(cx, cy, 3, 0, TAU); x.fill();
  x.restore();
}
/** Une cellule peinte dans une phase : G1 petit noyau, S noyau moyen, G2 gros noyau, M chromosomes condensés. */
function cellulePhase(x, cx, cy, r, phase, a = 1, lueur = 0, teinte) {
  if (lueur > 0) Peint.halo(x, cx, cy, r * 2.3, 'rgba(253,230,138,.6)', a * lueur);
  Peint.cellule(x, cx, cy, r, r * .86, a, teinte);
  if (phase === 'M') { for (let i = 0; i < 3; i++) Peint.chromosome(x, cx + (i - 1) * r * .32, cy, r * .78, Math.PI / 2 + (i - 1) * .3, Peint.VIOLET, { epaisseur: Math.max(1.6, r * .2), deux: true, ecart: r * .11, alpha: a }); }
  else Peint.noyau(x, cx + r * .05, cy, r * (phase === 'G1' ? .34 : phase === 'S' ? .43 : .52), a, { chromatine: false });
}
/** Une cellule de la boîte qui se divise : u = 0 une cellule, 0 < u < 1 elle s’étire et s’étrangle, u = 1 deux cellules. */
function celluleDivise(x, cx, cy, th, d, u, a) {
  if (u <= 0) return cellulePhase(x, cx, cy, CR, 'G1', a, 0, TEINTE_BOITE);
  const e = lisse(u), dx = Math.cos(th) * d * e, dy = Math.sin(th) * d * e, r = CR * (1 - .12 * Math.sin(Math.PI * e));
  for (const s of [-1, 1]) cellulePhase(x, cx + s * dx, cy + s * dy, r, u < .55 ? 'M' : 'G1', a, 0, TEINTE_BOITE);
}
/* La lame au microscope : 20 cellules (1 cellule = 5 % des cellules = 1 h du cycle de 20 h). */
const PHASES = ['G1', 'S', 'G2', 'M'], NPH = { G1: 9, S: 6, G2: 4, M: 1 }, PCT = { G1: 45, S: null, G2: 20, M: 5 }, DUREE = { G1: 9, S: 6, G2: 4, M: 1 };
const COLX = { G1: 515, S: 585, G2: 655, M: 725 }, CRAIE_PH = { G1: 'vert', S: 'orange', G2: 'bleu', M: 'violet' };
const LAME = { cx: 575, cy: 118, rx: 160, ry: 54 }, PIED = 296, TABY = { ph: 324, pct: 352, h: 380 };
const LAMEC = (() => {
  const ordre = ['G1', 'S', 'G2', 'G1', 'M', 'S', 'G1', 'G2', 'S', 'G1', 'G1', 'S', 'G2', 'G1', 'S', 'G1', 'G2', 'G1', 'S', 'G1'];
  const vu = { G1: 0, S: 0, G2: 0, M: 0 };
  return ordre.map((ph, i) => {
    const col = i % 10, rang = Math.floor(i / 10), n = vu[ph]++;
    return { ph, n, x: LAME.cx - 135 + col * 30 + (rang ? 14 : 0), y: LAME.cy - 16 + rang * 32 + ((i * 7) % 5 - 2) * 1.6 };
  });
})();
const caseCol = (ph, n) => [COLX[ph] + (n % 2 ? 11 : -11), PIED - 9 - Math.floor(n / 2) * 18];
const TRI = LAMEC.filter(c => c.ph !== 'S');
const tTri = c => 20.4 + TRI.indexOf(c) * (2.1 / (TRI.length - 1));
const tS = c => 29.8 + c.n * .16;
const VOLC = .5;
const tVolPct = j => 23.3 + j * .2;
function compteur(ph, t) {   // cellules posées dans la colonne
  return LAMEC.filter(c => c.ph === ph && t >= (ph === 'S' ? tS(c) : tTri(c)) + VOLC).length;
