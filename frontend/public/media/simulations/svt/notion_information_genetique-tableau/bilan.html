<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ce qu'il faut retenir — information génétique</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="genetique.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Fiche de révision écrite à la craie sur une page : pour chaque partie du cours sur la notion de l’information génétique, la définition à apprendre, les formules et le point d'attention ; deuxième page : ce que l'élève doit retravailler"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="suiv" data-professor-control="next previous start reset play_until">Ma page →</button>
    <button class="craie-btn secondaire" id="imprimer" title="Imprimer ou enregistrer en PDF">🖨️ Imprimer / PDF</button>
    <span class="lecture" id="page"></span>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="commun.js"></script>
<script src="/media/simulations/shared/tableau/imprimer.js"></script>
<script>
/*
 * « Ce qu'il faut retenir » du cours « Notion de l'information génétique » (diapositive ig_b1_bilan), adapté de
 * svt/role_muscle_strie_squelettique-tableau/bilan.html. Une page : huit blocs (un par compétence C1 à C8), définition, formule, piège.
 * play_until {moment: <bloc>} écrit ce bloc et le met en lumière ; page 2 = la page de l'élève (set_parameters {lacunes, acquis, acquis_ids}).
 * Contenu : cadre de référence 2 Bac PC (SVT), NIG1 à NIG11.
 */
const { fr, bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);

const BLOCS = [
  { id: 'localisation', titre: '1 · Le noyau commande', comps: ['C1'],
    def: "Amibe coupée, acétabulaire (section, greffe de noyaux), transfert de noyau : le caractère suit le noyau. L’information génétique est dans le noyau.",
    attention: "La section seule donne une hypothèse ; la greffe la vérifie." },
  { id: 'chromatine', titre: '2 · Chromatine et chromosome', comps: ['C2'], formules: ['1 chromatide = 1 molécule d’ADN'],
    def: "Interphase : chromatine (ADN enroulé sur des histones). Division : chromosomes condensés, à une ou deux chromatides reliées par le centromère.",
    attention: "En G1 une chromatide ; après la phase S, deux." },
  { id: 'cycle', titre: '3 · Cycle et quantité d’ADN', comps: ['C3'], formules: ['q → 2q', 'cycle cellulaire = G1 + S + G2 + M'],
    def: "La quantité d’ADN double en phase S (réplication), puis revient à q à la fin de la mitose.",
    attention: "L’ADN se copie en phase S, jamais pendant la mitose." },
  { id: 'mitose', titre: '4 · La mitose', comps: ['C4'], formules: ['2n = 4'],
    def: "Prophase, métaphase, anaphase, télophase : deux cellules filles génétiquement identiques (reproduction conforme).",
    attention: "Anaphase : chromatides sœurs vers les pôles opposés." },
  { id: 'support', titre: '5 · L’ADN, support', comps: ['C5'],
    def: "Griffith : des R vivants deviennent S au contact de S tués. Avery : sans ADN, pas de transformation. L’ADN est le support de l’information génétique.",
    attention: "Conclure sur la molécule détruite, pas sur l’enzyme." },
  { id: 'structure', titre: '6 · La molécule d’ADN', comps: ['C6'], formules: ['A = T ; C ≡ G', "5' → 3' / 3' ← 5'"],
    def: "Nucléotide : acide phosphorique, désoxyribose, base (A, T, C, G). Deux brins complémentaires et antiparallèles, en double hélice.",
    attention: "Brin complémentaire : bases échangées et extrémités inversées." },
  { id: 'replication', titre: '7 · La réplication', comps: ['C7'], formules: ['d(hybride) = (1,710 + 1,724) / 2 = 1,717 g·cm⁻³'],
    def: "Semi-conservative : chaque molécule fille garde un brin de la molécule mère. L’ADN polymérase pose les nucléotides complémentaires, de 5′ vers 3′.",
    attention: "La bande hybride ne disparaît jamais." },
  { id: 'rediger', titre: '8 · Rédiger', comps: ['C8'],
    def: "Décrire avec les valeurs, puis expliquer chaque variation ; nommer une phase avec « car » et son critère ; schéma avec titre et légendes.",
    attention: "On observe que…, on déduit donc que…" },
];
const STATUTS = { non_acquis: ['à reprendre', 'rouge'], partiel: ['à revoir', 'orange'], acquis: ['acquis', 'vert'] };
const AVANT = -1e9;   // instant d'un bloc déjà dit : il est écrit d'un coup
// apparu[i] : null = pas encore dit (pas écrit) ; un nombre = l'instant (s de la scène) où il commence à s'écrire.
const S = { page: 1, focus: null, lacunes: null, acquis: null, acquis_ids: null, apparu: [] };
window.__debordeBlocs = [];   // vérification : un bloc dont le texte dépasse son cadre

/* Coupe un texte en lignes qui tiennent dans `max` px (mesure sans les « _ » des indices). */
function lignes(c, texte, taille, max) {
  const ctx = c.ctx; ctx.font = `${taille}px ${window.Tableau.POLICE}`;
  const out = []; let ligne = '';
  for (const mot of String(texte).split(/\s+/)) {
    const essai = ligne ? ligne + ' ' + mot : mot;
    if (ctx.measureText(essai.replace(/_/g, '')).width > max && ligne) { out.push(ligne); ligne = mot; } else ligne = essai;
  }
  if (ligne) out.push(ligne);
  return out;
}
function paragraphe(c, texte, x, y, taille, max, o = {}) {
  for (const l of lignes(c, texte, taille, max)) { c.texte(l, x, y, { taille, ...o }); y += taille * 1.25; }
  return y;
}

/* Disposition sur toute la largeur du tableau (15 novembre 2026, « cases serrées, petits textes qui se chevauchent ») :
 * le cadre prend le format du tableau (Scene { large }, largeur scene.L, hauteur 420). Toutes les tailles sont MESURÉES à
 * la taille réellement écrite (le kit relève tout texte à 15 px à l'écran : te(t) = max(t, 15 / scene.s)), interlignes et
 * hauteurs de cases compris. On essaie 4, 3 ou 2 colonnes et la plus grande taille de texte où chaque bloc tient dans sa
 * case ; si les huit blocs ne tiennent pas ensemble (petit tableau, bande de formules sous la simulation), la fiche est
 * partagée en deux feuilles de quatre blocs : on voit la feuille du bloc que la voix dit. */
const HAUT = 46, MARGE = 16, ECART = 14;
const te = t => Math.max(t, 15 / (scene.s || 1));
let DISPO = null;
/* Écrit (ou mesure, dessiner = false) le contenu d'un bloc à partir de (x, y0), largeur w, taille de base t ; renvoie le bas. */
function contenuBloc(c, b, x, y0, w, t, dessiner, st) {
  const tt = te(t * 1.18), tf = te(t * 1.04), td = te(t), ta = te(t * .95), ctx = c.ctx;
  let y = y0 + tt * .95;
  if (dessiner) c.texte(b.titre, x, y, { couleur: 'jaune', taille: tt, max: st ? w - te(11) * 6 : w });
  y += tt * .4;
  if (b.formules) {
    // formules encadrées, à la ligne quand la suivante ne tient plus
    let fx = x, base = y + tf * 1.1;
    for (const f of b.formules) {
      ctx.font = `${tf}px ${window.Tableau.POLICE}`;
      const l = Math.min(w, ctx.measureText(f.replace(/_/g, '')).width + tf);
      if (fx > x && fx + l > x + w) { fx = x; base += tf * 1.65; }
      if (dessiner) { c.rect(fx, base - tf * 1.02, l, tf * 1.42, { couleur: 'faible', arrondi: 6, largeur: 1.2, duree: .25 }); c.texte(f, fx + tf * .5, base, { couleur: 'jaune', taille: tf, max: l - tf * .7 }); }
      fx += l + tf * .5;
    }
    y = base + tf * .55;
  }
  y += td * .25;
  for (const l of lignes(c, b.def, td, w)) { y += td * 1.2; if (dessiner) c.texte(l, x, y, { taille: td, couleur: 'blanc' }); }
  y += ta * .2;
  const retrait = ta * 1.25, la = lignes(c, b.attention, ta, w - retrait);
  if (dessiner) c.texte('⚠', x, y + ta * 1.2, { couleur: 'orange', taille: ta });
  for (const l of la) { y += ta * 1.2; if (dessiner) c.texte(l, x + retrait, y, { taille: ta, couleur: 'orange', alpha: .92 }); }
  return y + ta * .3;
}
/* La meilleure disposition pour ce tableau (mémorisée tant que L et l'échelle ne changent pas). */
function disposition(c) {
  const cle = scene.L + ':' + scene.s.toFixed(4);
  if (DISPO && DISPO.cle === cle) return DISPO;
  let meilleur = null;
  for (const parFeuille of [8, 4]) {
    for (const cols of parFeuille === 8 ? [4, 3, 2] : [4, 2]) {
      const rows = Math.ceil(parFeuille / cols), w = (scene.L - 2 * MARGE - (cols - 1) * ECART) / cols - 12;
      const h = (420 - HAUT - MARGE - (rows - 1) * ECART) / rows;
      for (let t = 26; t >= 9; t -= .5) {
        if (BLOCS.every(b => contenuBloc(c, b, 0, 0, w, t, false) + 8 <= h)) {
          if (!meilleur || te(t) > meilleur.eff + .01) meilleur = { parFeuille, cols, rows, w, h, t, eff: te(t) };
          break;
        }
      }
    }
    if (meilleur) break;   // la fiche entière sur une feuille dès qu'elle tient
  }
  if (!meilleur) { const cols = 4, w = (scene.L - 2 * MARGE - 3 * ECART) / cols - 12; meilleur = { parFeuille: 4, cols, rows: 1, w, h: 420 - HAUT - MARGE, t: 9, eff: te(9) }; }
  DISPO = { cle, ...meilleur };
  return DISPO;
}
/* La feuille montrée : celle du bloc en lumière, sinon celle du dernier bloc écrit. */
function feuille(d) {
  if (d.parFeuille >= BLOCS.length) return 0;
  let i = S.focus ? BLOCS.findIndex(b => b.id === S.focus) : -1;
  if (i < 0) for (let k = BLOCS.length - 1; k >= 0; k--) if (S.apparu[k] != null) { i = k; break; }
  return Math.max(0, Math.floor(i / d.parFeuille));
}
const RECTS = [];   // cadres des blocs écrits (toucher un bloc)
function bloc(c, b, i, d) {
  const j = i % d.parFeuille, col = j % d.cols, row = Math.floor(j / d.cols);
  const x = MARGE + 6 + col * (d.w + 12 + ECART), y0 = HAUT + row * (d.h + ECART), w = d.w;
  const enLumiere = S.focus === b.id, st = statut(b);
  const cx = x - 6, cy = y0 - 4, cw = w + 12, ch = d.h;
  RECTS[i] = [cx, cy, cw, ch];
  // Le cadre de lumière et l'état de l'élève apparaissent d'un coup : ils ne décalent pas l'écriture du bloc.
  c.direct(() => {
    if (enLumiere) c.rect(cx, cy, cw, ch, { couleur: 'jaune', arrondi: 10, largeur: 1.6, alpha: .7 });
    else if (st && STATUTS[st] && st !== 'acquis') c.rect(cx, cy, cw, ch, { couleur: STATUTS[st][1], arrondi: 10, largeur: 1.4, pointille: [5, 6], alpha: .8 });
    if (st === 'acquis') c.texte('✓', x + w - te(15), y0 + te(15), { couleur: 'vert', taille: te(15) });
    else if (st && STATUTS[st]) c.texte(STATUTS[st][0], x + w, y0 + te(11), { couleur: STATUTS[st][1], taille: te(11), align: 'right' });
  });
  const bas = contenuBloc(c, b, x, y0, w, d.t, true, st);
  if (bas > cy + ch && !window.__debordeBlocs.includes(b.id)) window.__debordeBlocs.push(b.id);
  c.repere(b.id, cx, cy, cw, ch, b.titre.replace(/^\d+ · /, ''));
}

function dessinerFiche(c) {
  const d = disposition(c), f = feuille(d), L = scene.L;
  RECTS.length = 0;
  if (S.apparu.some(a => a === AVANT)) c.cur = AVANT;   // la voix est déjà passée : le titre est écrit d'un coup
  c.texte('Ce qu’il faut retenir' + (d.parFeuille < BLOCS.length ? `  (${f + 1}/${Math.ceil(BLOCS.length / d.parFeuille)})` : ''), MARGE + 2, 31, { couleur: 'jaune', taille: te(26) });
  c.texte('définition · formule · ⚠ piège', L - MARGE, 29, { couleur: 'faible', taille: te(13), align: 'right' });
  c.ligne(MARGE, 38, L - MARGE, 38, { couleur: 'tresfaible', largeur: 1.4 });
  const debut = c.cur;
  let fin = c.cur;
  BLOCS.forEach((b, i) => {
    if (S.apparu[i] == null) return;   // pas encore dit : il attend son moment
    if (Math.floor(i / d.parFeuille) !== f) return;   // sur l'autre feuille
    // déjà dit : écrit d'un coup ; dit maintenant : s'écrit dès cet instant (le premier attend la fin du titre)
    c.cur = S.apparu[i] === AVANT ? AVANT : Math.max(debut, S.apparu[i]); bloc(c, b, i, d); fin = Math.max(fin, c.cur);
  });
  c.cur = fin;
}

function dessinerLacunes(c) {
  const L = scene.L, W = L - 44;
  c.texte('Ta page : ce qu’il te reste à retravailler', 22, 30, { couleur: 'jaune', taille: te(22) });
  c.ligne(22, 38, L - 20, 38, { couleur: 'tresfaible', largeur: 1.4 });
  let y = 70;
  const lac = S.lacunes, acq = S.acquis || [];
  if (!lac) {
    c.texte('Pas encore de réponses notées.', 22, y, { couleur: 'faible', taille: te(20) }); y += te(20) * 1.6;
    paragraphe(c, 'Réponds aux questions du cours : ton bilan par compétence s’écrira ici, et le professeur y reviendra en mode libre.', 22, y, te(18), W, { couleur: 'faible' });
    return;
  }
  if (!lac.length) {
    c.texte('✓ Toutes les compétences évaluées sont acquises. Bravo !', 22, y, { couleur: 'vert', taille: te(20) }); y += te(20) * 1.5;
  } else {
    c.texte('À reprendre en mode libre, avec le professeur :', 22, y, { couleur: 'orange', taille: te(16) }); y += te(16) * 1.6;
    const y0 = y - te(16) * 1.2;
    for (const l of lac.slice(0, 5)) {
      const [etiq, coul] = STATUTS[l.statut] || STATUTS.non_acquis;
      c.texte(l.statut === 'partiel' ? '⟳' : '✗', 22, y, { couleur: coul, taille: te(17) });
      y = paragraphe(c, `${l.label} — ${etiq}`, 22 + te(17) * 1.3, y, te(16), W - te(17) * 1.3, { couleur: 'blanc' });
      if (l.reprendre_avec && l.reprendre_avec.length) y = paragraphe(c, 'reprendre avec ' + l.reprendre_avec.join(', puis '), 22 + te(17) * 1.3, y, te(14), W - te(17) * 1.3, { couleur: coul, alpha: .85 });
      y += 4;
    }
    if (lac.length > 5) { c.texte(`… et ${lac.length - 5} autre(s)`, 42, y, { couleur: 'faible', taille: te(14) }); y += te(14) * 1.4; }
    c.repere('lacunes', 18, y0, L - 40, y - y0, 'ce qu’il reste à retravailler');
  }
  if (acq.length) {
    y += 6; c.texte('✓ Acquis', 22, y, { couleur: 'vert', taille: te(16) }); y += te(16) * 1.35;
    paragraphe(c, acq.join(' · '), 22, y, te(15), W, { couleur: 'vert', alpha: .85 });
  }
}

const canvas = $('canvas');
const scene = window.GenetiqueTableau.Scene(canvas, (c) => { scene.cadre(41 + S.page); if (S.page === 1) dessinerFiche(c); else dessinerLacunes(c); return c.fin(); }, { large: true });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { DISPO = null; scene.sale = true; });   // mesures refaites avec la police du tableau
const maintenant = () => (performance.now() - scene.ouvert) / 1000;

/* Page n ; `focus` = le bloc que la voix dit maintenant ; `tout` = toute la fiche d'un coup. */
function aller(n, par, focus, tout) {
  n = n === 2 ? 2 : 1;
  if (par === 'start' || par === 'reset') { scene.reecrire(); S.apparu = []; }   // rejouer : la fiche se réécrit depuis le début
  else if (n !== S.page) {
    // changement de page : on repart d'une page vierge, mais les blocs déjà dits restent écrits (d'un coup)
    scene.reecrire(); S.apparu = S.apparu.map(a => (a == null ? null : AVANT));
  }
  if (n === 1) {
    const k = focus ? BLOCS.findIndex(b => b.id === focus) : -1;
    if (tout) BLOCS.forEach((b, i) => { if (S.apparu[i] == null) S.apparu[i] = AVANT; });
    if (k >= 0) {
      for (let i = 0; i < k; i++) if (S.apparu[i] == null) S.apparu[i] = AVANT;   // sautés : écrits d'un coup
      if (S.apparu[k] == null) S.apparu[k] = par === 'start' || par === 'reset' ? 0 : maintenant();
    }
  }
  S.page = n; S.focus = n === 1 ? (focus || null) : null; scene.sale = true;
  $('page').textContent = `${n} / 2`; $('suiv').textContent = n === 1 ? 'Ma page →' : '← La fiche';
  bulle($('feedback'), n === 2 ? 'Ta page à toi.' : focus ? BLOCS.find(b => b.id === focus).titre.replace(/^\d+ · /, '') : 'La fiche du chapitre.');
  pont.noter(par || 'page', { page: n, moment: focus || (n === 2 ? 'lacunes' : 'fiche') }); pont.emettre();
}
function statut(b) {
  if (!S.lacunes) return null;
  const lac = S.lacunes.filter(l => b.comps.includes(l.id));
  if (lac.some(l => l.statut === 'non_acquis')) return 'non_acquis';
  if (lac.length) return 'partiel';
  return (S.acquis_ids || []).some(a => b.comps.includes(a)) ? 'acquis' : null;
}
function moments() { const m = { fiche: 1 }; BLOCS.forEach(b => { m[b.id] = 1; }); m.lacunes = 2; return m; }
function playUntil(p) {
  const nom = p.moment in moments() ? p.moment : null;
  if (!nom && !Number.isFinite(+p.time_s)) return;
  if (nom === 'lacunes' || (!nom && +p.time_s === 2)) aller(2, 'play_until');
  else if (nom === 'fiche' || !nom) aller(1, 'play_until', null, true);
  else aller(1, 'play_until', nom);
}
function setParameters(p) {
  if (Array.isArray(p.lacunes)) S.lacunes = p.lacunes.map(l => ({ id: String(l.id || ''), label: String(l.label || l.id || ''), statut: String(l.statut || 'non_acquis'), reprendre_avec: Array.isArray(l.reprendre_avec) ? l.reprendre_avec.map(String) : [] }));
  if (Array.isArray(p.acquis)) S.acquis = p.acquis.map(String);
  if (Array.isArray(p.acquis_ids)) S.acquis_ids = p.acquis_ids.map(String);
  scene.sale = true; pont.noter('set_parameters', { lacunes: (S.lacunes || []).length, acquis: (S.acquis || []).length }); pont.emettre();
}
function ceQuiSeVoit() {
  if (S.page === 2) return `Page 2/2, la page de l'élève : ${!S.lacunes ? 'pas encore de bilan' : S.lacunes.length ? 'à retravailler : ' + S.lacunes.map(l => l.label).join(' ; ') : 'toutes les compétences évaluées sont acquises'}.`;
  const f = S.focus && BLOCS.find(b => b.id === S.focus);
  const ecrits = BLOCS.filter((b, i) => S.apparu[i] != null).length;
  return `Page 1/2, la fiche du chapitre de l’information génétique : ${ecrits}/8 blocs écrits (définition, formule, piège)${f ? ` ; en lumière « ${f.titre} » : ${f.def}${f.formules ? ' Formules : ' + f.formules.join(' ; ') + '.' : ''} Piège : ${f.attention}` : '.'}${S.lacunes ? ` Blocs à reprendre : ${BLOCS.filter(b => statut(b) && statut(b) !== 'acquis').map(b => b.titre).join(', ') || 'aucun'}.` : ''}`;
}
$('suiv').onclick = () => (S.page === 1 ? aller(2, 'next') : aller(1, 'previous', null, true));
// Imprimer / PDF : la fiche entière et la page de l'élève, sur fond blanc (shared/tableau/imprimer.js).
$('imprimer').onclick = () => {
  const avant = { page: S.page, focus: S.focus, apparu: S.apparu.slice() };
  window.Tableau.imprimer({ titre: 'Ce qu’il faut retenir — notion de l’information génétique', scene,
    pages: [{ nom: 'la fiche', preparer: () => { S.page = 1; S.focus = null; S.apparu = BLOCS.map(() => AVANT); } },
            { nom: 'ta page : à retravailler', preparer: () => { S.page = 2; S.focus = null; } }],
    restaurer: () => { Object.assign(S, avant); } });
  pont.noter('imprimer', { pages: 2 }); pont.emettre();
};
canvas.addEventListener('pointerdown', e => {
  if (S.page !== 1) return;
  const r = canvas.getBoundingClientRect(), [x, y] = scene.local(e.clientX - r.left, e.clientY - r.top);
  const i = RECTS.findIndex(r => r && x >= r[0] && x <= r[0] + r[2] && y >= r[1] && y <= r[1] + r[3]);
  if (i < 0) return;
  S.focus = BLOCS[i].id; scene.sale = true; bulle($('feedback'), BLOCS[i].def);
  pont.noter('touche', { moment: BLOCS[i].id }); pont.emettre();
});

window.Tableau.explication({ bilan: BLOCS.map(b => ({ repere: b.id, texte: b.def })) });
const commandes = ['start', 'reset', 'play_until', 'set_parameters', 'next', 'previous'];
const config = { id: 'genetique_bilan', version: '1.0', title: 'Ce qu’il faut retenir — information génétique', variants: [{ id: 'bilan', label: 'fiche' }], commands: commandes,
  command_schema: { play_until: { moment: Object.keys(moments()).join(' | ') + ' (écrit ce bloc de la fiche et le met en lumière ; fiche = toute la fiche ; lacunes = la page de l’élève)' },
    set_parameters: { lacunes: '[{id: C1..C9, label, statut: non_acquis|partiel, reprendre_avec: [..]}] (bilan de l’élève)', acquis: '[labels acquis]', acquis_ids: '[C1, ..]' } } };
