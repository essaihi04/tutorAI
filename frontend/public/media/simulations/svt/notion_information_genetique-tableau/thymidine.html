<script>
/*
 * La thymidine radioactive (cours « Notion de l’information génétique », 2 Bac PC BIOF, 11 novembre 2026). Capacité NIG9 ; d’après le
 * national 2017 R. Des cellules de racine de fève : un cycle en milieu à thymidine radioactive, puis un cycle en milieu normal.
 * Au centre, un chromosome suivi ; à droite, ses molécules d’ADN : brin ancien bleu, brin radioactif rouge lumineux (pointillés),
 * brin nouveau non radioactif blanc. Une chromatide marquée est couverte de grains noirs (autoradiographie).
 */
const { lisse, rampe, entre, Peint } = window.Etapes;
const TAU = Math.PI * 2;
const BLEU = '#3b82f6', ROUGE = '#ef4444', BLANC = '#f1f5f9';
// (17 novembre 2026) La règle « la thymidine n'entre que dans l'ADN » a son moment (`regle`), quand la voix la dit ; en
// 2e cycle, « une chromatide marquée sur deux » et le schéma des brins s'écrivent un peu plus tôt (la baguette tombait avant).
const MT = { milieu_radioactif: 2.6, regle: 3.3, replication_1: 6.2, metaphase_1: 8.8, milieu_normal: 11.2, replication_2: 14.6, metaphase_2: 17.2, schema_brins: 20.2 };

function plantule(x, a, radio) {
  x.save(); x.globalAlpha = a;
  const cx = 92, yl = 236; // bécher
  const g = x.createLinearGradient(40, 0, 144, 0);
  g.addColorStop(0, radio > 0 ? `rgba(134,239,172,${.25 + .25 * radio})` : 'rgba(186,230,253,.3)'); g.addColorStop(1, radio > 0 ? `rgba(74,222,128,${.2 + .25 * radio})` : 'rgba(125,211,252,.28)');
  x.fillStyle = g; x.fillRect(42, yl, 100, 92);
  if (radio > 0) Peint.halo(x, cx, yl + 46, 70, `rgba(134,239,172,${.18 * radio})`);
  x.strokeStyle = 'rgba(226,240,250,.8)'; x.lineWidth = 1.6; x.beginPath(); x.moveTo(40, 190); x.lineTo(40, 330); x.lineTo(144, 330); x.lineTo(144, 190); x.stroke();
  // la graine de fève, posée sur le bord, ses racines dans le liquide, deux petites feuilles
  x.strokeStyle = '#f5f0e1'; x.lineWidth = 3; x.lineCap = 'round'; x.beginPath(); x.moveTo(cx, 196); x.quadraticCurveTo(cx + 4, 260, cx - 2, 312); x.stroke();
  x.lineWidth = 1.5; for (const [dx, dy] of [[-16, 280], [14, 270], [-10, 300]]) { x.beginPath(); x.moveTo(cx + 1, dy - 22); x.lineTo(cx + dx, dy); x.stroke(); }
  const gs = x.createRadialGradient(cx - 8, 180, 2, cx, 186, 26); gs.addColorStop(0, '#d6c08a'); gs.addColorStop(1, '#7c5a2a');
  x.fillStyle = gs; x.beginPath(); x.ellipse(cx, 186, 26, 15, -.2, 0, TAU); x.fill();
  x.fillStyle = '#65a30d'; for (const s of [-1, 1]) { x.beginPath(); x.ellipse(cx + s * 10, 160, 10, 5, s * .6, 0, TAU); x.fill(); }
  x.strokeStyle = '#4d7c0f'; x.lineWidth = 2; x.beginPath(); x.moveTo(cx, 172); x.lineTo(cx, 160); x.stroke();
  x.restore();
}
/** Une chromatide (bâtonnet violet) ; `marquee` : couverte de grains noirs d’autoradiographie. */
function chromatide(x, cx, cy, L, marquee, a = 1, dx = 0) {
  Peint.chromatide(x, [[cx + dx, cy - L / 2], [cx + dx * .3, cy], [cx + dx, cy + L / 2]], Peint.VIOLET, 13, a);
  if (marquee) { x.save(); x.globalAlpha = a; x.fillStyle = 'rgba(10,10,10,.9)'; for (let i = 0; i < 26; i++) { const u = (i * 37 % 26) / 26 - .5; x.beginPath(); x.arc(cx + dx * (Math.abs(u) * 2 * .7 + .3) + Math.sin(i * 2.7) * 4.5, cy + u * L, 1.6, 0, TAU); x.fill(); } x.restore(); }
}
/** Molécule d’ADN horizontale à deux brins colorés (rouge = radioactif, en pointillés lumineux). */
function moleculeH(x, x0, y, L, haut, bas, a = 1) {
  x.save(); x.globalAlpha = a;
  // barreaux (bases) entre les deux brins, puis les brins en tubes peints ; le brin radioactif luit et porte des grains
  for (let i = 1; i < L / 10; i++) Peint.barreau(x, x0 + i * 10, y - 4, x0 + i * 10, y + 4, ['#ef4444', '#eab308', '#3b82f6', '#22c55e'][i % 4], 3.2);
  for (const [coul, yy] of [[haut, y - 6], [bas, y + 6]]) {
    if (coul === ROUGE) Peint.halo(x, x0 + L / 2, yy, L / 2, 'rgba(239,68,68,.25)');
    Peint.ruban(x, () => { x.beginPath(); x.moveTo(x0, yy); x.lineTo(x0 + L, yy); }, coul, 6);
    if (coul === ROUGE) { x.fillStyle = 'rgba(255,230,200,.9)'; for (let i = 0; i < L / 9; i++) { x.beginPath(); x.arc(x0 + 4 + i * 9, yy, 1.1, 0, TAU); x.fill(); } }
  }
  x.restore();
}
function dessiner(c, k) {
  const t = k.t;
  const radio = t < 9.4 ? rampe(t, .4, .8) : 1 - rampe(t, 9.4, 1.2);
  const rep1 = rampe(t, 3.4, 2.4), cond1 = rampe(t, 6.6, 1.6), mito = rampe(t, 9.4, 1.4), rep2 = rampe(t, 11.8, 2.4), cond2 = rampe(t, 15.0, 1.6);
  const CXc = 300, CYc = 210;
  c.direct(() => {
    const x = c.ctx;
    plantule(x, rampe(t, .2, .6), radio);
    // le chromosome suivi
    if (t < 9.4) {
      const L = entre(150, 96, cond1), ec = entre(0, 12, rep1) - 5 * cond1;
      chromatide(x, CXc - ec, CYc, L, cond1 > .5, 1, -cond1 * 8); if (rep1 > 0) chromatide(x, CXc + ec, CYc, L, cond1 > .5, rep1, cond1 * 8);
      if (cond1 > 0) { x.save(); x.fillStyle = '#2e1065'; x.beginPath(); x.arc(CXc, CYc, 5, 0, TAU); x.fill(); x.restore(); }
    } else {
      // après la mitose : on suit une cellule fille, son chromosome à une chromatide (bleu + rouge), puis la réplication en milieu normal
      const Lc = cond2 > 0 ? entre(150, 96, cond2) : entre(96, 150, mito), ec = entre(0, 12, rep2) - 5 * cond2;
      chromatide(x, CXc - ec, CYc, Lc, cond2 > .5 ? false : false, 1, -cond2 * 8);
      if (rep2 > 0) chromatide(x, CXc + ec, CYc, Lc, cond2 > .5, rep2, cond2 * 8);
      if (cond2 > 0) { x.save(); x.fillStyle = '#2e1065'; x.beginPath(); x.arc(CXc, CYc, 5, 0, TAU); x.fill(); x.restore(); }
    }
    // les molécules d’ADN, à droite
    const X0 = 470, LL = 230;
    if (t < 9.4) {
      if (rep1 <= 0) moleculeH(x, X0, 200, LL, BLEU, BLEU, rampe(t, .3, .5));
      else { const d = 34 * rep1; moleculeH(x, X0, 200 - d, LL, BLEU, ROUGE, 1); moleculeH(x, X0, 200 + d, LL, ROUGE, BLEU, 1); }
    } else {
      if (rep2 <= 0) moleculeH(x, X0, 200, LL, BLEU, ROUGE, 1);
      else { const d = 34 * rep2; moleculeH(x, X0, 200 - d, LL, BLEU, BLANC, 1); moleculeH(x, X0, 200 + d, LL, BLANC, ROUGE, 1); }
    }
  });
  c.texte('La thymidine radioactive (national 2017 R)', 14, 26, { couleur: 'cyan', taille: 19 });
  c.repere('plantule', 40, 140, 106, 192, 'la plantule de fève'); c.repere('milieu', 42, 236, 100, 92, 'le milieu de culture');
  c.repere('chromosome', CXc - 50, CYc - 80, 100, 160, 'le chromosome suivi'); c.repere('molecules', 460, 140, 250, 120, 'les molécules d’ADN');
  if (k.ecrit(c, 'mr', 1.0)) { k.T(c, 'cellules de racine de fève', 92, 120, { couleur: 'blanc', taille: 13, align: 'center' }); }
  if (t < 9.4 && k.ecrit(c, 'radio', 1.4)) { k.T(c, 'milieu à thymidine', 92, 356, { couleur: 'vert', taille: 14, align: 'center' }); k.T(c, 'radioactive', 92, 372, { couleur: 'vert', taille: 14, align: 'center' }); }
  if (t >= 10.6 && k.ecrit(c, 'norm', 10.6)) { k.T(c, 'milieu normal', 92, 356, { couleur: 'cyan', taille: 14, align: 'center' }); k.T(c, '(non radioactif)', 92, 372, { couleur: 'cyan', taille: 13, align: 'center' }); }
  if (k.ecrit(c, 'regle', MT.regle - .3)) k.T(c, 'La thymidine radioactive n’entre que dans l’ADN, lors de la réplication.', 380, 404, { couleur: 'jaune', taille: 15, align: 'center' });
  if (k.ecrit(c, 'c1', t < 9.4 ? 0 : 99)) k.T(c, '1er cycle : milieu radioactif', 585, 72, { couleur: 'vert', taille: 15, align: 'center' });
  if (t >= 9.4 && k.ecrit(c, 'c2', 9.4)) k.T(c, '2e cycle : milieu normal', 585, 72, { couleur: 'cyan', taille: 15, align: 'center' });
  if (t >= 3.4) { c.repere('brin_ancien', 460, 150, 250, 20, 'un brin ancien (bleu)'); c.repere('brin_radioactif', 460, 180, 250, 30, 'un brin radioactif (rouge)'); }
  if (t < 9.4 && k.ecrit(c, 'm1', MT.metaphase_1 - .6)) { k.T(c, 'chromosome en métaphase :', CXc, 316, { couleur: 'blanc', taille: 14, align: 'center' }); k.T(c, 'les deux chromatides sont marquées', CXc, 336, { couleur: 'vert', taille: 14, align: 'center' }); c.repere('chromatide_marquee', CXc - 30, CYc - 50, 60, 100, 'chromatides marquées'); }
  if (t >= 9.4 && k.ecrit(c, 'm2', MT.metaphase_2 - 1.4)) {
    k.T(c, 'chromosome en métaphase :', CXc, 316, { couleur: 'blanc', taille: 14, align: 'center' }); k.T(c, 'une chromatide marquée sur deux', CXc, 336, { couleur: 'orange', taille: 14, align: 'center' });
    c.repere('chromatide_marquee', CXc + 2, CYc - 50, 30, 100, 'la chromatide marquée'); c.repere('chromatide_non_marquee', CXc - 32, CYc - 50, 30, 100, 'la chromatide non marquée');
  }
  if (k.ecrit(c, 'schema', MT.schema_brins - 2.0)) {
    k.T(c, 'brin ancien', 720, 134, { couleur: 'bleu', taille: 13, align: 'right' }); k.T(c, 'brin radioactif', 720, 300, { couleur: 'rouge', taille: 13, align: 'right' }); k.T(c, 'brin non radioactif', 720, 316, { couleur: 'blanc', taille: 13, align: 'right' });
    k.T(c, 'La réplication est semi-conservative.', 585, 360, { couleur: 'vert', taille: 16, align: 'center' });
    c.repere('schema', 460, 120, 290, 250, 'le schéma des brins');
  }
}
function voit(k) {
  const t = k.t, m = ['À gauche une plantule de fève, ses racines dans un bécher ; au centre un chromosome suivi ; à droite ses molécules d’ADN (bleu : brin ancien, rouge pointillé lumineux : brin radioactif, blanc : brin nouveau non radioactif).'];
  m.push(t < 9.4 ? 'Milieu à thymidine radioactive (liquide vert lumineux) ; écrit « La thymidine radioactive n’entre que dans l’ADN, lors de la réplication. »' : 'Milieu normal, non radioactif (liquide bleu clair).');
  if (t < 3.4) m.push('Une molécule d’ADN à deux brins bleus ; le chromosome a une chromatide.');
  if (t >= 3.4 && t < 9.4) m.push('1er cycle : réplication : deux molécules, chacune un brin bleu ancien et un brin rouge radioactif ; le chromosome a deux chromatides' + (t >= 6.6 ? ', condensées en métaphase et TOUTES LES DEUX couvertes de grains noirs (écrit « les deux chromatides sont marquées »).' : '.'));
  if (t >= 9.4 && t < 11.8) m.push('Après la mitose, on suit une cellule fille : son chromosome a une chromatide, une molécule bleu + rouge.');
  if (t >= 11.8) m.push('2e cycle en milieu normal : chaque brin sert de modèle à un brin blanc non radioactif : une molécule bleu + blanc (non marquée) et une molécule blanc + rouge (marquée)' + (t >= 15 ? ' ; en métaphase, UNE chromatide sur deux est couverte de grains noirs (écrit « une chromatide marquée sur deux »).' : '.'));
  if (t >= MT.schema_brins - 2.0) m.push('Légendes « brin ancien », « brin radioactif », « brin non radioactif » et « La réplication est semi-conservative. »');
  return m;
}


/* ── Vue document (18 novembre 2026, 2ᵉ passe : l’exercice du national 2017 R joué pas à pas) ──────────────────────
 * Le DOCUMENT du sujet, sans son explication : la plantule de fève dans le milieu à thymidine radioactive pendant un
 * cycle, le chromosome métaphasique (autoradiographie : les deux chromatides couvertes de grains noirs) ; puis la même
 * plantule transférée dans un milieu normal pendant un 2e cycle, le chromosome métaphasique (une chromatide marquée sur
 * deux). Ni molécules, ni brins : c’est à l’élève de les expliquer (diapositives ig_x3…). `conclusions: false` (ou
 * ?conclusions=false) tait la légende du 2e résultat : l’élève le décrit lui-même avant qu’elle s’écrive.
 * Moments : cycle_1 2,4 ; metaphase_1 5,2 ; transfert 7,6 ; metaphase_2 10,4. */
const MDOC = { cycle_1: 2.4, metaphase_1: 5.2, transfert: 7.6, metaphase_2: 10.4 };
/* (19 novembre 2026, démonstration sur le document — skill simulations-au-tableau règle 17) Les lignes de la correction
 * allument ce qu'elles utilisent : `milieu`, `chromosome_1`, `chromosome_2`, `chromatide_marquee`, `chromatide_non_marquee`
 * (repères), et ce que seule la démonstration fait paraître : `brins_1` (à côté de chaque chromatide du 1er résultat, sa
 * molécule d'ADN : brin ancien bleu + brin radioactif rouge), `brins_2` (2e résultat : bleu + blanc à côté de la chromatide
 * non marquée, blanc + rouge à côté de la marquée), `molecule_marquee`, `molecule_non_marquee`. Mêmes couleurs que la vue
 * experience (un objet, un dessin). Rien de cela sans allumage : le document reste celui du sujet. */
function moleculeV(x, cx, y0, L, droite, gauche, a = 1) {
  x.save(); x.translate(cx, y0); x.rotate(Math.PI / 2); moleculeH(x, 0, 0, L, droite, gauche, a); x.restore();
}
function dessinerDocument(c, k) {
  const t = k.t, radio = t < 6.6 ? rampe(t, .3, .8) : 1 - rampe(t, 6.6, 1.0);
  const m1 = rampe(t, 3.6, 1.2), m2 = rampe(t, 8.8, 1.2);
  const X1 = 360, X2 = 600, CY = 205, DX = 42;
  const B1 = k.allume('brins_1'), B2 = k.allume('brins_2') || k.allume('molecule_marquee') || k.allume('molecule_non_marquee');
  c.direct(() => {
    const x = c.ctx;
    plantule(x, rampe(t, .1, .5), radio);
    if (m1 > 0) { chromatide(x, X1 - 9, CY, 132, true, m1, -9); chromatide(x, X1 + 9, CY, 132, true, m1, 9); x.save(); x.globalAlpha = m1; x.fillStyle = '#2e1065'; x.beginPath(); x.arc(X1, CY, 5, 0, TAU); x.fill(); x.restore(); }
    if (m2 > 0) { chromatide(x, X2 - 9, CY, 132, false, m2, -9); chromatide(x, X2 + 9, CY, 132, true, m2, 9); x.save(); x.globalAlpha = m2; x.fillStyle = '#2e1065'; x.beginPath(); x.arc(X2, CY, 5, 0, TAU); x.fill(); x.restore(); }
    // la molécule d'ADN de chaque chromatide, seulement quand la démonstration l'allume
    const lien = (x0, x1) => { x.save(); x.strokeStyle = 'rgba(241,245,249,.55)'; x.setLineDash([3, 4]); x.lineWidth = 1.4; x.beginPath(); x.moveTo(x0, CY); x.lineTo(x1, CY); x.stroke(); x.restore(); };
    if (B1 && m1 > 0) { lien(X1 - 26, X1 - 36); lien(X1 + 26, X1 + 36); moleculeV(x, X1 - DX, CY - 52, 104, ROUGE, BLEU); moleculeV(x, X1 + DX, CY - 52, 104, BLEU, ROUGE); }
    if (B2 && m2 > 0) { lien(X2 - 26, X2 - 36); lien(X2 + 26, X2 + 36); moleculeV(x, X2 - DX, CY - 52, 104, BLANC, BLEU); moleculeV(x, X2 + DX, CY - 52, 104, BLANC, ROUGE); }
  });
  if (B1 && m1 > 0) c.repere('brins_1', X1 - DX - 10, CY - 56, 2 * DX + 20, 112, 'les molécules d’ADN des deux chromatides (1er cycle)');
  if (B2 && m2 > 0) {
    c.repere('brins_2', X2 - DX - 10, CY - 56, 2 * DX + 20, 112, 'les molécules d’ADN des deux chromatides (2e cycle)');
    c.repere('molecule_marquee', X2 + DX - 10, CY - 56, 20, 112, 'la molécule au brin radioactif'); c.repere('molecule_non_marquee', X2 - DX - 10, CY - 56, 20, 112, 'la molécule sans brin radioactif');
  }
  c.repere('plantule', 40, 140, 106, 192, 'la plantule de fève'); c.repere('milieu', 42, 236, 100, 92, 'le milieu de culture');
  if (k.ecrit(c, 'tete', .3)) k.T(c, 'cellules de racine de fève', 92, 120, { couleur: 'blanc', taille: 15, align: 'center' });
  if (t < 6.6 && k.ecrit(c, 'radio', .8)) { k.T(c, 'milieu à thymidine', 92, 356, { couleur: 'vert', taille: 15, align: 'center' }); k.T(c, 'radioactive', 92, 374, { couleur: 'vert', taille: 15, align: 'center' }); }
  if (t >= 6.6 && k.ecrit(c, 'norm', 6.6)) { k.T(c, 'milieu normal', 92, 356, { couleur: 'cyan', taille: 15, align: 'center' }); k.T(c, '(non radioactif)', 92, 374, { couleur: 'cyan', taille: 15, align: 'center' }); }
  if (k.ecrit(c, 'c1', 1.2)) {
    k.T(c, '1er cycle', X1, 90, { couleur: 'vert', taille: 17, align: 'center' }); k.T(c, 'milieu radioactif', X1, 110, { couleur: 'vert', taille: 15, align: 'center' });
    c.fleche(160, 220, X1 - 60, 205, { couleur: 'faible', largeur: 1.5 });
  }
  if (m1 > 0) c.repere('chromosome_1', X1 - 50, CY - 74, 100, 148, 'le chromosome métaphasique après le 1er cycle');
  if (k.ecrit(c, 'r1', MDOC.metaphase_1 - .4)) { k.T(c, 'chromosome métaphasique', X1, 300, { couleur: 'blanc', taille: 15, align: 'center' }); k.T(c, 'les deux chromatides marquées', X1, 320, { couleur: 'vert', taille: 15, align: 'center' }); }
  if (k.ecrit(c, 'c2', MDOC.transfert - .8)) {
    k.T(c, '2e cycle', X2, 90, { couleur: 'cyan', taille: 17, align: 'center' }); k.T(c, 'milieu normal', X2, 110, { couleur: 'cyan', taille: 15, align: 'center' });
    c.fleche(X1 + 60, 205, X2 - 60, 205, { couleur: 'faible', largeur: 1.5 });
  }
  if (m2 > 0) c.repere('chromosome_2', X2 - 50, CY - 74, 100, 148, 'le chromosome métaphasique après le 2e cycle');
  if (m2 > 0) { c.repere('chromatide_marquee', X2 + 2, CY - 68, 32, 136, 'la chromatide marquée'); c.repere('chromatide_non_marquee', X2 - 34, CY - 68, 32, 136, 'la chromatide non marquée'); }
  if (k.ecrit(c, 'r2a', MDOC.metaphase_2 - .4)) k.T(c, 'chromosome métaphasique', X2, 300, { couleur: 'blanc', taille: 15, align: 'center' });
  if (k.P.conclusions && k.ecrit(c, 'r2b', MDOC.metaphase_2 - .3)) k.T(c, 'une chromatide marquée sur deux', X2, 320, { couleur: 'orange', taille: 15, align: 'center' });
  if (k.ecrit(c, 'grains', 1.6)) k.T(c, 'grains noirs = radioactivité (autoradiographie)', 480, 396, { couleur: 'blanc', taille: 15, align: 'center' });
  // la légende des brins, en dernier (l'écriture en direct suit l'ordre du dessin : rien d'autre n'est réécrit)
  if ((B1 && m1 > 0) || (B2 && m2 > 0)) {
    if (k.ecrit(c, 'leg_brins', 0)) {
      k.T(c, 'brin ancien', 300, 356, { couleur: 'bleu', taille: 15, align: 'center' });
      k.T(c, 'brin radioactif', 450, 356, { couleur: 'rouge', taille: 15, align: 'center' });
      k.T(c, 'brin nouveau non radioactif', 640, 356, { couleur: 'blanc', taille: 15, align: 'center' });
    }
  } else delete k.S.vu.leg_brins;
}
function voitDocument(k) {
  const t = k.t, m = ['Document d’examen (national 2017 R) : à gauche une plantule de fève, ses racines dans un bécher' + (t < 6.6 ? ' de milieu à thymidine radioactive.' : ' de milieu normal, non radioactif.')];
  if (t >= 3.8) m.push('1er cycle en milieu radioactif : chromosome métaphasique, ses deux chromatides couvertes de grains noirs (écrit « les deux chromatides marquées »).');
  if (t >= 6.8) m.push('Transfert dans un milieu normal pour un 2e cycle.');
  if (t >= 9) m.push('2e cycle : chromosome métaphasique, une seule de ses deux chromatides couverte de grains noirs' + (k.P.conclusions && t >= MDOC.metaphase_2 - .3 ? ' (écrit « une chromatide marquée sur deux »).' : ' (rien d’écrit dessous : l’élève doit le décrire).'));
  if (k.allume('brins_1') && t >= 3.8) m.push('Démonstration : à côté de chaque chromatide du 1er résultat, sa molécule d’ADN verticale : un brin ancien bleu et un brin radioactif rouge (les deux chromatides ont un brin radioactif).');
  if ((k.allume('brins_2') || k.allume('molecule_marquee') || k.allume('molecule_non_marquee')) && t >= 9) m.push('Démonstration : à côté de la chromatide non marquée, une molécule bleu + blanc (aucun brin radioactif) ; à côté de la chromatide marquée, une molécule blanc + rouge (un brin radioactif).');
  return m;
}
