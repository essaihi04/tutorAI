<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meselson et Stahl — au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="genetique.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="L’expérience de Meselson et Stahl : trois hypothèses de réplication, des bactéries cultivées sur azote lourd puis léger, l’ADN centrifugé dont les bandes brillent à leur densité, génération après génération, et l’arbre des molécules"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start reset pause resume play_until">Lancer</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="commun.js"></script>
<script src="etapes.js"></script>
<script>
/*
 * Meselson et Stahl (cours « Notion de l’information génétique », 2 Bac PC BIOF, 11 novembre 2026). Capacité NIG9.
 * Densités : ADN léger (¹⁴N) 1,710 g·cm⁻³ ; lourd (¹⁵N) 1,724 ; hybride 1,717. G1 : 100 % hybride ; G2 : 50 % hybride,
 * 50 % léger ; G3 : 25 % hybride, 75 % léger. Brins anciens (¹⁵N) en BLEU, brins nouveaux (¹⁴N) en BLANC.
 * Vue experience : hypothèses, culture, transfert, centrifugation, tubes dont les bandes d’ADN brillent sous UV, hypothèses barrées, arbre.
 * Vue predictions : le tableau hypothèse × génération, comparé aux résultats observés.
 */
const { lisse, rampe, entre, Peint } = window.Etapes;
const TAU = Math.PI * 2;
const ANC = '#3b82f6', NOUV = '#f1f5f9';

/** Une molécule d’ADN en deux barres verticales ; `brins` = [couleur gauche, couleur droite] ou 'mosaique'. */
function molecule(x, cx, cy, h, brins, a = 1, e = 1) {
  x.save(); x.globalAlpha = a; const w = 4.5 * e, sep = 4 * e;
  for (const [k2, xx] of [[0, cx - sep], [1, cx + sep]]) {
    if (brins === 'mosaique') { for (let j = 0; j < 4; j++) { x.fillStyle = (j + k2) % 2 ? ANC : NOUV; x.fillRect(xx - w / 2, cy - h / 2 + j * h / 4, w, h / 4); } }
    else { x.fillStyle = brins[k2]; x.fillRect(xx - w / 2, cy - h / 2, w, h); }
  }
  x.strokeStyle = 'rgba(148,163,184,.6)'; x.lineWidth = .6; for (let j = 1; j < 5; j++) { const yy = cy - h / 2 + j * h / 5; x.beginPath(); x.moveTo(cx - sep, yy); x.lineTo(cx + sep, yy); x.stroke(); }
  x.restore();
}
const HYP = [
  { id: 'h_conservative', nom: 'conservative', x: 70, filles: [[ANC, ANC], [NOUV, NOUV]] },
  { id: 'h_semi', nom: 'semi-conservative', x: 315, filles: [[ANC, NOUV], [NOUV, ANC]] },
  { id: 'h_dispersive', nom: 'dispersive', x: 560, filles: ['mosaique', 'mosaique'] },
];
const dY = d => 232 + (d - 1.710) / .014 * 72;            // densité → hauteur dans le tube (le plus lourd descend le plus bas)
const TUBES = [{ id: 'tube_leger', x: 300, lib: 'léger', bandes: [[1.710, 1]] }, { id: 'tube_lourd', x: 350, lib: 'lourd', bandes: [[1.724, 1]] },
  { id: 'tube_g0', x: 410, lib: 'G0', bandes: [[1.724, 1]] }, { id: 'tube_g1', x: 460, lib: 'G1', bandes: [[1.717, 1]] },
  { id: 'tube_g2', x: 510, lib: 'G2', bandes: [[1.717, .5], [1.710, .5]] }, { id: 'tube_g3', x: 560, lib: 'G3', bandes: [[1.717, .25], [1.710, .75]] }];
const ME = { hypotheses: 3.4, culture_15N: 6.0, transfert_14N: 8.4, centrifugation: 11.0, temoins: 13.4, g0: 15.0, g1_bande: 17.0, calcul_moyenne: 18.8, conservative_rejetee: 20.4, g2_bandes: 22.4, dispersive_rejetee: 24.0, g3: 26.0, arbre_g0_g3: 29.0 };
const APP = { tube_leger: 12.0, tube_lourd: 12.0, tube_g0: 14.0, tube_g1: 16.0, tube_g2: 21.4, tube_g3: 25.0 };
function tubeCentri(x, cx, bandes, a, choisi) {
  x.save(); x.globalAlpha = a;
  const y0 = 188, h = 172, w = 30;
  const g = x.createLinearGradient(cx - w / 2, 0, cx + w / 2, 0); g.addColorStop(0, 'rgba(120,140,170,.35)'); g.addColorStop(.5, 'rgba(180,200,225,.22)'); g.addColorStop(1, 'rgba(120,140,170,.35)');
  x.fillStyle = g; x.beginPath(); x.moveTo(cx - w / 2, y0); x.lineTo(cx - w / 2, y0 + h - 12); x.quadraticCurveTo(cx, y0 + h + 8, cx + w / 2, y0 + h - 12); x.lineTo(cx + w / 2, y0); x.closePath(); x.fill();
  x.strokeStyle = choisi ? 'rgba(250,204,21,.95)' : 'rgba(226,232,240,.7)'; x.lineWidth = choisi ? 2.4 : 1.2; x.stroke();
  for (const [d, f] of bandes) { const y = dY(d), e = 2 + 7 * f; Peint.halo(x, cx, y, 18 + 10 * f, 'rgba(125,211,252,.55)'); x.fillStyle = '#e0f2fe'; x.fillRect(cx - w / 2 + 3, y - e / 2, w - 6, e); }
  x.restore();
}
function dessinerExperience(c, k) {
  const t = k.t;
  c.direct(() => {
    const x = c.ctx;
    HYP.forEach((H, i) => {
      const a = rampe(t, .3 + i * .8, .6); if (a <= 0) return;
      molecule(x, H.x + 20, 82, 40, [ANC, ANC], a);
      molecule(x, H.x + 100, 82, 40, H.filles[0], a); molecule(x, H.x + 140, 82, 40, H.filles[1], a);
    });
    // flacon : ¹⁵N (violet) puis ¹⁴N (bleu clair)
    if (t >= 4.0) {
      const a = rampe(t, 4.0, .6), u = rampe(t, 7.0, 1.0), cx = 100, cy = 250;
      x.save(); x.globalAlpha = a;
      x.fillStyle = `rgba(${entre(167, 125, u)},${entre(139, 211, u)},${entre(250, 252, u)},.45)`;
      x.beginPath(); x.moveTo(cx - 14, cy - 50); x.lineTo(cx - 14, cy - 18); x.lineTo(cx - 46, cy + 34); x.quadraticCurveTo(cx, cy + 46, cx + 46, cy + 34); x.lineTo(cx + 14, cy - 18); x.lineTo(cx + 14, cy - 50); x.closePath();
      x.save(); x.clip(); x.fillRect(cx - 50, cy - 4, 100, 60); x.restore();
      x.strokeStyle = 'rgba(226,240,250,.8)'; x.lineWidth = 1.4; x.stroke(); x.restore();
      for (let i = 0; i < 10; i++) { x.save(); x.globalAlpha = a * .9; x.fillStyle = '#c4b5fd'; x.beginPath(); x.ellipse(cx - 28 + (i % 5) * 14, cy + 12 + Math.floor(i / 5) * 12, 4, 2, i, 0, TAU); x.fill(); x.restore(); }
    }
    if (t >= 9.0) { // la centrifugeuse
      const a = rampe(t, 9.0, .5), cx = 100, cy = 352, an = t < 10.8 ? (t - 9) * 14 : 25.2;
      x.save(); x.globalAlpha = a; const g = x.createRadialGradient(cx - 6, cy - 6, 2, cx, cy, 30); g.addColorStop(0, '#e2e8f0'); g.addColorStop(1, '#475569');
      x.fillStyle = g; x.beginPath(); x.arc(cx, cy, 28, 0, TAU); x.fill();
      x.strokeStyle = '#0f172a'; x.lineWidth = 3; for (let i = 0; i < 4; i++) { const b = an + i * Math.PI / 2; x.beginPath(); x.moveTo(cx, cy); x.lineTo(cx + 22 * Math.cos(b), cy + 22 * Math.sin(b)); x.stroke(); }
      x.restore();
    }
    for (const T of TUBES) if (t >= APP[T.id]) tubeCentri(x, T.x, T.bandes, rampe(t, APP[T.id], .6), k.P.generation != null && T.lib === 'G' + k.P.generation);
    if (t >= 26.4) { // l’arbre des molécules G0 → G3
      const gens = [[[ANC, ANC]], [[ANC, NOUV], [NOUV, ANC]], [[ANC, NOUV], [NOUV, NOUV], [NOUV, NOUV], [NOUV, ANC]], [[ANC, NOUV], [NOUV, NOUV], [NOUV, NOUV], [NOUV, NOUV], [NOUV, NOUV], [NOUV, NOUV], [NOUV, NOUV], [NOUV, ANC]]];
      gens.forEach((G, g) => { const a = rampe(t, 26.4 + g * .5, .4); G.forEach((m, j) => molecule(x, 690 + (j - (G.length - 1) / 2) * 15, 206 + g * 46, 26, m, a, .55)); });
    }
  });
  c.texte('Meselson et Stahl (1958)', 14, 26, { couleur: 'cyan', taille: 19 });
  c.repere('hypotheses', 50, 56, 680, 90, 'les trois hypothèses');
  HYP.forEach((H, i) => {
    c.repere(H.id, H.x - 4, 56, 180, 84, 'hypothèse ' + H.nom);
    if (k.ecrit(c, 'h' + i, .5 + i * .8)) { c.fleche(H.x + 40, 82, H.x + 78, 82, { couleur: 'faible', largeur: 1.4 }); k.T(c, H.nom, H.x + 80, 126, { couleur: 'blanc', taille: 15, align: 'center' }); }
  });
  if (k.ecrit(c, 'leg', 2.6)) { k.T(c, 'bleu : brin ancien', 610, 20, { couleur: 'bleu', taille: 12 }); k.T(c, 'blanc : brin nouveau', 610, 36, { couleur: 'blanc', taille: 12 }); }
  if (t >= 4.0) c.repere('flacon', 50, 196, 100, 100, 'le flacon de bactéries');
  if (k.ecrit(c, 'cult', 4.4)) { k.T(c, 'bactéries sur ¹⁵N', 100, 176, { couleur: 'violet', taille: 14, align: 'center' }); k.T(c, '(azote lourd)', 100, 192, { couleur: 'violet', taille: 12, align: 'center' }); }
  if (k.ecrit(c, 'transf', 7.2)) k.T(c, 'puis sur ¹⁴N (léger)', 100, 312, { couleur: 'cyan', taille: 13, align: 'center' });
  if (t >= 9.0) c.repere('centrifugeuse', 70, 322, 60, 60, 'la centrifugeuse');
  if (k.ecrit(c, 'centri', 9.4)) k.T(c, 'centrifugation', 100, 400, { couleur: 'faible', taille: 13, align: 'center' });
  if (k.ecrit(c, 'axe', 12.0)) {
    c.ligne(262, 196, 262, 350, { couleur: 'faible', largeur: 1.2 });
    for (const [d, lib] of [[1.710, '1,710'], [1.717, '1,717'], [1.724, '1,724']]) { c.ligne(258, dY(d), 266, dY(d), { couleur: 'faible', largeur: 1.2 }); k.T(c, lib, 254, dY(d) + 5, { couleur: 'faible', taille: 13, align: 'right' }); }
    k.T(c, 'densité', 230, 188, { couleur: 'faible', taille: 12, align: 'center' });
    c.repere('axe_densite', 210, 196, 60, 160, 'l’axe des densités (g·cm⁻³)');
  }
  for (const T of TUBES) if (t >= APP[T.id]) { c.repere(T.id, T.x - 16, 186, 32, 176, 'tube ' + T.lib); if (k.ecrit(c, 'l' + T.id, APP[T.id] + .2)) k.T(c, T.lib, T.x, 382, { couleur: T.lib[0] === 'G' ? 'jaune' : 'faible', taille: 13, align: 'center' }); }
  if (k.ecrit(c, 'calc', ME.calcul_moyenne - .8)) { k.T(c, '(1,710 + 1,724) / 2 = 1,717 g·cm⁻³ : ADN hybride', 214, 166, { couleur: 'jaune', taille: 15 }); c.repere('calcul', 210, 150, 380, 22, 'le calcul de la moyenne'); }
  const barre = (H, txt) => { c.ligne(H.x - 4, 60, H.x + 168, 116, { couleur: 'rouge', largeur: 2.6 }); c.ligne(H.x - 4, 116, H.x + 168, 60, { couleur: 'rouge', largeur: 2.6 }); k.T(c, txt, H.x + 80, 144, { couleur: 'rouge', taille: 13, align: 'center' }); };
  if (k.ecrit(c, 'rejC', ME.conservative_rejetee - .8)) barre(HYP[0], 'elle prévoyait deux bandes');
  if (k.ecrit(c, 'rejD', ME.dispersive_rejetee - .8)) barre(HYP[2], 'elle prévoyait une seule bande');
  if (t >= 26.4) c.repere('arbre', 610, 186, 150, 180, 'l’arbre des molécules G0 → G3');
  if (k.ecrit(c, 'arbre', 26.4)) ['G0', 'G1', 'G2', 'G3'].forEach((g, i) => k.T(c, g, 604, 212 + i * 46, { couleur: 'jaune', taille: 13 }));
  if (k.ecrit(c, 'conc', ME.arbre_g0_g3 - .6)) { k.T(c, 'Réplication semi-conservative : chaque molécule fille', 440, 398, { couleur: 'vert', taille: 15, align: 'center' }); k.T(c, 'garde un brin de la molécule mère.', 440, 414, { couleur: 'vert', taille: 15, align: 'center' }); }
}
function voitExperience(k) {
  const t = k.t, m = ['En haut, trois hypothèses dessinées (brins anciens bleus, brins nouveaux blancs) : conservative (une molécule toute bleue + une toute blanche), semi-conservative (deux molécules bleu-blanc), dispersive (deux molécules en mosaïque).'];
  if (t >= 4) m.push(t < 7 ? 'Un flacon de bactéries cultivées sur ¹⁵N (azote lourd, liquide violet).' : 'Les bactéries sont transférées sur ¹⁴N (azote léger, liquide bleu clair).');
  if (t >= 9) m.push('Une centrifugeuse' + (t < 10.8 ? ' qui tourne.' : '.'));
  if (t >= 12) m.push('Tubes de centrifugation, axe des densités : 1,710 en haut, 1,717, 1,724 en bas (le plus lourd descend le plus bas). Témoins : ADN léger, bande à 1,710 ; ADN lourd, bande à 1,724.');
  if (t >= 14) m.push('G0 : une bande lourde à 1,724.');
  if (t >= 16) m.push('G1 : une seule bande, à 1,717 (hybride).');
  if (t >= ME.calcul_moyenne - .8) m.push('Écrit « (1,710 + 1,724) / 2 = 1,717 g·cm⁻³ : ADN hybride ».');
  if (t >= ME.conservative_rejetee - .8) m.push('L’hypothèse conservative est barrée en rouge : « elle prévoyait deux bandes ».');
  if (t >= 21.4) m.push('G2 : deux bandes de même épaisseur, hybride (1,717) et légère (1,710), 50 % / 50 %.');
  if (t >= ME.dispersive_rejetee - .8) m.push('L’hypothèse dispersive est barrée : « elle prévoyait une seule bande ».');
  if (t >= 25) m.push('G3 : bande légère épaisse (75 %), bande hybride mince (25 %), qui ne disparaît pas.');
  if (t >= 26.4) m.push('À droite, l’arbre des molécules G0 → G3 : 1, 2, 4, 8 molécules ; il reste toujours 2 molécules avec un brin bleu ancien.');
  if (t >= ME.arbre_g0_g3 - .6) m.push('Écrit : « Réplication semi-conservative : chaque molécule fille garde un brin de la molécule mère. »');
  if (k.P.generation != null) m.push(`Le tube G${k.P.generation} est entouré en jaune.`);
  return m;
}

/* ── Vue prédictions ─────────────────────────────────────────────── */
const PR = { tableau: 2.0, ligne_conservative: 4.4, ligne_semi: 6.8, ligne_dispersive: 9.2, observe: 11.6, comparaison: 14.2 };
const LIGNES = [
  { id: 'l_conservative', nom: 'conservative', y: 150, g1: [[1.724, .5], [1.710, .5]], g2: [[1.724, .25], [1.710, .75]], t: 3.4, ok: false },
  { id: 'l_semi', nom: 'semi-conservative', y: 220, g1: [[1.717, 1]], g2: [[1.717, .5], [1.710, .5]], t: 5.8, ok: true },
  { id: 'l_dispersive', nom: 'dispersive', y: 290, g1: [[1.717, 1]], g2: [[1.7135, 1]], t: 8.2, ok: false },
  { id: 'observe', nom: 'observé', y: 360, g1: [[1.717, 1]], g2: [[1.717, .5], [1.710, .5]], t: 10.6, ok: null },
];
function miniTube(x, cx, cy, bandes, a) {
  x.save(); x.globalAlpha = a; const y0 = cy - 28, h = 56, w = 22;
  x.fillStyle = 'rgba(160,180,210,.22)'; x.beginPath(); x.moveTo(cx - w / 2, y0); x.lineTo(cx - w / 2, y0 + h - 8); x.quadraticCurveTo(cx, y0 + h + 4, cx + w / 2, y0 + h - 8); x.lineTo(cx + w / 2, y0); x.closePath(); x.fill();
  x.strokeStyle = 'rgba(226,232,240,.7)'; x.lineWidth = 1; x.stroke();
  for (const [d, f] of bandes) { const y = y0 + 12 + (d - 1.710) / .014 * 30, e = 1.5 + 4 * f; Peint.halo(x, cx, y, 10 + 6 * f, 'rgba(125,211,252,.5)'); x.fillStyle = '#e0f2fe'; x.fillRect(cx - w / 2 + 2, y - e / 2, w - 4, e); }
  x.restore();
}
function dessinerPredictions(c, k) {
  const t = k.t, XG1 = 330, XG2 = 440;
  c.direct(() => { const x = c.ctx; for (const L of LIGNES) if (t >= L.t) { const a = rampe(t, L.t, .6); miniTube(x, XG1, L.y - 6, L.g1, a); miniTube(x, XG2, L.y - 6, L.g2, a); } });
  c.texte('Ce que prévoit chaque hypothèse', 14, 26, { couleur: 'cyan', taille: 19 });
  c.repere('tableau', 30, 80, 470, 320, 'le tableau des prédictions');
  if (k.ecrit(c, 'tab', .4)) {
    k.T(c, 'hypothèse', 40, 100, { couleur: 'faible', taille: 15 }); k.T(c, 'G1', XG1, 100, { couleur: 'jaune', taille: 16, align: 'center' }); k.T(c, 'G2', XG2, 100, { couleur: 'jaune', taille: 16, align: 'center' });
    c.ligne(30, 112, 500, 112, { couleur: 'faible', largeur: 1.2 }); c.ligne(270, 84, 270, 396, { couleur: 'tresfaible', largeur: 1.1 }); c.ligne(30, 325, 500, 325, { couleur: 'faible', largeur: 1.2 });
    for (const L of LIGNES) k.T(c, L.nom, 40, L.y, { couleur: L.ok === null ? 'vert' : 'blanc', taille: 15 });
  }
  for (const L of LIGNES) if (t >= L.t) c.repere(L.id, 30, L.y - 36, 470, 64, L.nom);
  if (k.ecrit(c, 'cmp', PR.comparaison - 1.2)) {
    for (const L of LIGNES) if (L.ok !== null) k.T(c, L.ok ? '✓' : '✗', 486, L.y, { couleur: L.ok ? 'vert' : 'rouge', taille: 22, align: 'center' });
    k.T(c, 'Seule l’hypothèse', 520, 200, { couleur: 'jaune', taille: 16 }); k.T(c, 'semi-conservative', 520, 222, { couleur: 'jaune', taille: 16 }); k.T(c, 'explique les résultats.', 520, 244, { couleur: 'jaune', taille: 16 });
    c.repere('conclusion', 514, 182, 240, 70, 'la conclusion');
  }
}
function voitPredictions(k) {
  const t = k.t, m = ['Tableau hypothèse × génération (colonnes G1 et G2), une petite image de tube dans chaque case.'];
  if (t >= 3.4) m.push('Conservative : G1 deux bandes (lourde et légère), G2 deux bandes (lourde 25 %, légère 75 %).');
  if (t >= 5.8) m.push('Semi-conservative : G1 une bande hybride ; G2 hybride + légère.');
  if (t >= 8.2) m.push('Dispersive : G1 une bande hybride ; G2 une seule bande, entre hybride et légère.');
  if (t >= 10.6) m.push('Ligne « observé » (en vert) : G1 une bande hybride ; G2 hybride + légère.');
  if (t >= PR.comparaison - 1.2) m.push('Coche verte devant semi-conservative, croix rouges devant les deux autres ; écrit « Seule l’hypothèse semi-conservative explique les résultats. »');
  return m;
}

const GEN = ['g0', 'g1_bande', 'g2_bandes', 'g3'];
window.Etapes.lancer({
  id: 'genetique_meselson', titre: 'Meselson et Stahl', graine: 41,
  parametres: { generation: { defaut: null, schema: '0..3 (vue experience : la génération montrée et entourée)', lire: v => Math.min(3, Math.max(0, Math.round(+v))) } },
  vues: {
    experience: { titre: 'L’expérience de Meselson et Stahl', fin: 30, moments: ME, dessiner: dessinerExperience, voit: voitExperience,
      motifs: { hypotheses: 'trois hypothèses : conservative, semi-conservative, dispersive', culture_15N: 'bactéries cultivées sur azote lourd ¹⁵N', transfert_14N: 'bactéries transférées sur azote léger ¹⁴N', centrifugation: 'l’ADN extrait est centrifugé', temoins: 'les témoins : ADN léger 1,710 en haut, ADN lourd 1,724 en bas', g0: 'G0 : une bande lourde', g1_bande: 'G1 : une seule bande, hybride', calcul_moyenne: '1,717 est la moyenne de 1,710 et 1,724', conservative_rejetee: 'la conservative est rejetée : elle prévoyait deux bandes', g2_bandes: 'G2 : deux bandes égales, hybride et légère', dispersive_rejetee: 'la dispersive est rejetée : elle prévoyait une seule bande', g3: 'G3 : 25 % hybride, 75 % léger', arbre_g0_g3: 'l’arbre des molécules : chaque molécule fille garde un brin de la mère' },
      conclusion: 'La réplication est semi-conservative.',
      surReglage: (k, cles, api) => { if (cles.includes('generation')) api.playUntil({ moment: GEN[k.P.generation] }); },
      texte: 'Meselson et Stahl : bactéries sur ¹⁵N puis ¹⁴N, ADN centrifugé. Témoins 1,710 (léger) et 1,724 (lourd) g·cm⁻³. G1 : une bande à 1,717 (hybride) → conservative rejetée ; G2 : hybride + légère → dispersive rejetée ; G3 : 25 % hybride, 75 % léger. Réplication semi-conservative.',
