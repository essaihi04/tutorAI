<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Histogramme et courbe de fréquence — au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="/media/simulations/svt/tc_sortie_ecologique-tableau/sortie.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Construction de l’histogramme de fréquence : à gauche la liste des espèces avec leur indice ; les axes se dessinent et se graduent ; pour chaque indice I à V, les espèces s’allument une à une et un bloc monte dans la barre ; puis la courbe relie les milieux des sommets, et on lit si elle est unimodale ou bimodale"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start pause resume play_until">Lancer</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="/media/simulations/svt/tc_sortie_ecologique-tableau/commun.js"></script>
<script>
/*
 * L'histogramme et la courbe de fréquence (diapos se_a3_histogramme, se_a3_formes, se_a3_faune_histo ; réutilisable par le
 * cours de révision).
 *  ?vue=histogramme (ou flore, défaut) : les 18 espèces de Maâmora et leur indice (recalculés : I 2, II 6, III 4, IV 3, V 3).
 *  ?vue=faune : les 13 invertébrés de l'Oued Bouregreg (recalculés : I 6, II 2, III 0, IV 1, V 4 ; le document du prof
 *    dessine II = 1 et IV = 2, erreur de comptage : Mysta et Nephthys sont dans 2 relevés sur 6 → 33,3 % → II ;
 *    Glycera dans 4 sur 6 → 66,7 % → IV).
 *    Moments des deux vues : tableau 0,4 ; axes 2 ; I 4 ; II, III, IV, V ensuite (une espèce allumée toutes les 0,45 s, un
 *    bloc monte dans la barre à chaque espèce) ; courbe (la courbe relie les milieux des sommets) ; forme (lecture :
 *    unimodale → homogène / bimodale → hétérogène) ; fin. set_parameters {conclusions: false} cache la lecture.
 *  ?vue=formes : deux petites courbes types, unimodale puis bimodale, et leur sens. Moments : uni 0,5 ; uni_sens 3 ; bi 5 ;
 *    bi_sens 7,5 ; fin 9.
 */
const { lueur } = window.Sortie;
const vp = window.Sortie.param('vue', 'histogramme');
const VUE = vp === 'faune' ? 'faune' : vp === 'formes' ? 'formes' : 'flore';
const CL = ['I', 'II', 'III', 'IV', 'V'];
const LISTES = {
  flore: [['Quercus suber', 'V'], ['Cytisus a.', 'V'], ['Thymelaea l.', 'II'], ['Daphne g.', 'II'], ['Chamaerops h.', 'III'], ['Cistus s.', 'V'], ['Lavandula s.', 'II'], ['Rubia p.', 'III'], ['Carex d.', 'IV'],
    ['Carlina c.', 'I'], ['Ranunculus p.', 'II'], ['Holcus l.', 'I'], ['Urginea m.', 'II'], ['Anthoxanthum o.', 'III'], ['Brachypodium d.', 'IV'], ['Ornithopus i.', 'IV'], ['Andryala i.', 'III'], ['Anagalis a.', 'II']],
  faune: [['Nemertes', 'I'], ['Capitella c.', 'I'], ['Diopata n.', 'I'], ['Glycera c.', 'IV'], ['Mysta p.', 'II'], ['Nephthys h.', 'II'], ['Nereis d.', 'V'],
    ['Natica sp', 'I'], ['Ceratoderma e.', 'V'], ['Scrobicularia p.', 'V'], ['Tapes d.', 'V'], ['Nassarius p.', 'I'], ['Carcinus m.', 'I']],
};
/* ── horaire : chaque barre se construit espèce par espèce ── */
function horaire(liste) {
  const M = { tableau: .4, axes: 2 }; let t = 4;
  const H = {};
  CL.forEach(k => { const n = liste.filter(e => e[1] === k).length; M[k] = t; H[k] = { debut: t, n }; t += Math.max(1, n * .45 + .55); });
  M.courbe = t + .3; M.forme = t + 2.8; return { M, H, fin: t + 4.6 };
}
function dessinerHisto(c, S, scene, liste, H) {
  const L = scene.L, pt = scene.petit, compte = CL.map(k => liste.filter(e => e[1] === k).length);
  const tz = (n, p) => (pt ? p : n);   // taille normale / taille du petit cadre (téléphone en paysage)
  // l'indice qu'on est en train de compter (le petit cadre ne montre que ses espèces)
  let kCur = null; CL.forEach(k => { if (S.a(k)) kCur = k; }); if (S.a('courbe')) kCur = null;
  const rang = {}; CL.forEach(k => { rang[k] = 0; });
  const ordre = liste.map(([nom, k]) => ({ nom, k, q: rang[k]++ }));
  const nRows = Math.ceil(liste.length / 2), lx = 30, colW = 150, ly = 48, rh = Math.min(32, 300 / nRows);
  if (!pt) {
    c.texte(VUE === 'flore' ? 'Maâmora : espèce → IF' : 'Bouregreg : espèce → IF', lx, 24, { couleur: 'faible', taille: 16 });
    ordre.forEach((e, i) => {
      const x = lx + Math.floor(i / nRows) * colW, y = ly + (i % nRows) * rh;
      c.texte(e.nom, x, y + 6, { couleur: 'blanc', taille: 15, max: colW - 40, duree: .12 });
      c.texte(e.k, x + colW - 14, y + 6, { couleur: 'vert', taille: 16, gras: true, align: 'right', duree: .05 });
      e.x = x; e.y = y; e.w = colW - 8; e.h = rh - 4;
    });
    c.repere('liste', lx - 4, ly - 18, colW * 2, nRows * rh + 4, 'la liste des espèces et leur indice');
  } else if (kCur) {
    // petit cadre : seulement les espèces de l'indice qu'on compte, en grand
    c.texte('indice ' + kCur, 20, 44, { couleur: 'vert', taille: 34, gras: true });
    ordre.filter(e => e.k === kCur).forEach((e, q) => {
      e.x = 42; e.y = 92 + q * 44; e.w = 250; e.h = 40;
      c.texte(e.nom, e.x + 6, e.y + 10, { couleur: 'blanc', taille: 30 });
    });
    if (!ordre.some(e => e.k === kCur)) c.texte('aucune espèce', 42, 102, { couleur: 'rose', taille: 30 });
    c.repere('liste', 10, 14, 290, 330, 'les espèces de l’indice ' + kCur);
  }
  // les axes
  const gx0 = pt ? (kCur ? 340 : 74) : lx + colW * 2 + 40, gx1 = L - 24, gy0 = pt ? 352 : 352, gyT = pt ? 76 : 66, u = (gy0 - gyT - 10) / 7, bw = (gx1 - gx0 - 30) / 5;
  const XB = i => gx0 + 18 + i * bw, Yn = n => gy0 - n * u;
  if (S.t <= 0 || S.ecrit(c, 'axes')) {
    c.fleche(gx0, gy0, gx1, gy0, { couleur: 'blanc', largeur: 2 }); c.fleche(gx0, gy0, gx0, gyT - 18, { couleur: 'blanc', largeur: 2 });
    c.texte(pt ? 'espèces' : 'Nombre d’espèces', gx0 + 8, gyT - 18, { couleur: 'blanc', taille: tz(17, 30) });
    c.texte('IF', gx1, gy0 + tz(26, 40), { couleur: 'blanc', taille: tz(18, 30), gras: true, align: 'right' });
    for (let n = 1; n <= 7; n++) { if (pt && n % 2 === 1 && n !== 1) continue; c.ligne(gx0 - 5, Yn(n), gx0 + 5, Yn(n), { couleur: 'blanc', largeur: 1.3, duree: .03 }); c.texte(String(n), gx0 - 10, Yn(n) + tz(6, 10), { couleur: 'jaune', taille: tz(16, 28), align: 'right', duree: .05 }); }
    c.texte('0', gx0 - 10, gy0 + tz(6, 10), { couleur: 'jaune', taille: tz(16, 28), align: 'right' });
    CL.forEach((k, i) => c.texte(k, XB(i) + bw / 2, gy0 + tz(26, 40), { couleur: 'vert', taille: tz(19, 32), gras: true, align: 'center' }));
    c.repere('axes', gx0 - 30, gyT - 30, gx1 - gx0 + 30, gy0 - gyT + 66, 'les axes : indices de fréquence en abscisse, nombre d’espèces en ordonnée');
  }
  // les barres : chaque espèce de l'indice s'allume, un bloc monte
  const sommets = [];
  CL.forEach((k, i) => {
    const h = H[k], n = h.n, xb = XB(i), w = bw;   // barres collées : chaque barre occupe toute la largeur de sa classe
    c.repere('barre_' + k, xb, Yn(Math.max(n, .3)), w, gy0 - Yn(Math.max(n, .3)), 'barre ' + k + ' : ' + n + ' espèces');
    if (!S.a(k)) return;
    const vus = n === 0 ? 0 : Math.min(n, Math.floor((S.t - h.debut) / .45) + 1), fini = S.t >= h.debut + n * .45 + .3;
    const courant = !fini;
    ordre.filter(e => e.k === k).forEach((e, q) => {
      if (q < vus && e.x != null && (!pt || k === kCur)) lueur(c, e.x - 4, e.y - (pt ? 22 : 14), e.w, e.h, { vive: courant && q === vus - 1, numero: courant || pt ? q + 1 : null, nx: e.x - 8, ny: e.y + (pt ? 10 : 6), taille: tz(16, 28), align: 'right' });
    });
    c.direct(() => {
      const g = c.ctx;
      for (let q = 0; q < vus; q++) {
        const age = Math.min(1, (S.t - h.debut - q * .45) / .35), y = Yn(q + 1) + (1 - age) * 30;
        g.save(); g.globalAlpha = age; const gr = g.createLinearGradient(xb, 0, xb + w, 0); gr.addColorStop(0, 'rgba(96,165,250,.95)'); gr.addColorStop(1, 'rgba(37,99,235,.95)');
        g.fillStyle = gr; g.fillRect(xb, y + 1, w, u - 2); g.strokeStyle = 'rgba(219,234,254,.9)'; g.lineWidth = 1.2; g.strokeRect(xb, y + 1, w, u - 2); g.restore();
        if (courant) c.texte(String(q + 1), xb + w / 2, y + u / 2 + tz(6, 10), { couleur: 'blanc', taille: tz(16, 28), gras: true, align: 'center' });
      }
      if (fini) c.texte(String(n), xb + w - 4, Yn(n) - 8, { couleur: 'jaune', taille: tz(20, 32), gras: true, align: 'right' });
    });
    if (courant) lueur(c, xb - 4, Yn(Math.max(n, 1)) - 4, w + 8, gy0 - Yn(Math.max(n, 1)) + 8, { vive: true });
    sommets.push([xb + w / 2, Yn(n)]);
  });
  // la courbe : relie les milieux des sommets
  if (S.ecrit(c, 'courbe') && sommets.length === 5) {
    sommets.forEach(([x, y]) => c.point(x, y, pt ? 7 : 5.5, 'rouge'));
    c.trait(sommets, { couleur: 'rouge', largeur: pt ? 4 : 3, duree: 1.6, tremble: .2 });
    c.repere('courbe', XB(0), gyT, XB(4) + bw - XB(0), gy0 - gyT, 'la courbe de fréquence');
  }
  if (S.ecrit(c, 'forme') && S.conclusions) {
    const modes = [];
    compte.forEach((v, i) => { const g = i ? compte[i - 1] : -1, d = i < 4 ? compte[i + 1] : -1; if (v > g && v >= d && v > 0) modes.push(i); });
    modes.forEach(i => { c.cercle(XB(i) + bw / 2, Yn(compte[i]), pt ? 22 : 16, { couleur: 'jaune', largeur: 2.4 }); });
    const uni = modes.length === 1, tx = XB(2) + (pt ? 30 : -6), mx = gx1 - tx;
    c.texte(uni ? 'courbe unimodale' : 'courbe bimodale', tx, tz(96, 90), { couleur: 'jaune', taille: tz(20, 32), gras: true, max: pt ? 0 : mx });
    if (!pt) c.texte(uni ? '(un seul sommet)' : '(deux sommets)', tx, 120, { couleur: 'jaune', taille: 17, max: mx });
    c.texte(uni ? '→ homogène' : '→ hétérogène', tx, tz(146, 134), { couleur: uni ? 'vert' : 'orange', taille: tz(20, 32), gras: true, max: pt ? 0 : mx });
    c.repere('lecture', XB(2) - 10, 60, gx1 - XB(2) + 10, 90, uni ? 'courbe unimodale : homogène' : 'courbe bimodale : hétérogène');
  }
}
/* ── vue formes ── */
function petiteCourbe(c, S, x0, y0, w, h, donnees, nom, apparu, pt) {
  const u = h / 7, bw = w / 5;
  c.fleche(x0, y0, x0 + w + 10, y0, { couleur: 'blanc', largeur: 1.6 }); c.fleche(x0, y0, x0, y0 - h - 10, { couleur: 'blanc', largeur: 1.6 });
  CL.forEach((k, i) => c.texte(k, x0 + bw * (i + .5), y0 + (pt ? 34 : 22), { couleur: 'vert', taille: pt ? 28 : 16, align: 'center' }));
  c.direct(() => donnees.forEach((v, i) => { const g = c.ctx; g.save(); g.fillStyle = 'rgba(59,130,246,.75)'; g.fillRect(x0 + bw * i, y0 - v * u, bw, v * u); g.strokeStyle = 'rgba(219,234,254,.9)'; g.lineWidth = 1.2; g.strokeRect(x0 + bw * i, y0 - v * u, bw, v * u); g.restore(); }));
  const pts = donnees.map((v, i) => [x0 + bw * (i + .5), y0 - v * u]);
  c.trait(pts, { couleur: 'rouge', largeur: 3, tremble: .2, duree: 1 });
  c.texte(pt ? nom.split(' ')[0] : nom, x0 + w / 2, y0 - h - 22, { couleur: 'jaune', taille: pt ? 32 : 20, gras: true, align: 'center' });
}
const MF = { uni: .5, uni_sens: 3, bi: 5, bi_sens: 7.5 };
function dessinerFormes(c, S, scene) {
  const L = scene.L, pt = scene.petit, w = (L - 120) / 2 - 20, h = pt ? 170 : 190, y0 = pt ? 270 : 290;
  if (S.t <= 0 || S.ecrit(c, 'uni')) { petiteCourbe(c, S, 50, y0, w, h, [1, 3, 6, 3, 1], 'unimodale (un sommet)', 0, pt); c.repere('unimodale', 40, y0 - h - 40, w + 20, h + 70, 'courbe unimodale'); }
  if (S.t <= 0 || S.ecrit(c, 'uni_sens')) { c.texte(pt ? '→ homogène' : 'groupement homogène', 50 + w / 2, y0 + (pt ? 82 : 62), { couleur: 'vert', taille: pt ? 32 : 19, align: 'center' }); if (!pt) c.texte('milieu stable', 50 + w / 2, y0 + 88, { couleur: 'vert', taille: 17, align: 'center' }); }
  const xb = L / 2 + 40;
  if (S.t <= 0 || S.ecrit(c, 'bi')) { petiteCourbe(c, S, xb, y0, w, h, [5, 2, 1, 3, 5], 'bimodale (deux sommets)', 0, pt); c.repere('bimodale', xb - 10, y0 - h - 40, w + 20, h + 70, 'courbe bimodale'); }
  if (S.t <= 0 || S.ecrit(c, 'bi_sens')) { c.texte(pt ? '→ hétérogène' : 'groupement hétérogène', xb + w / 2, y0 + (pt ? 82 : 62), { couleur: 'orange', taille: pt ? 32 : 19, align: 'center' }); if (!pt) c.texte('milieu qui évolue', xb + w / 2, y0 + 88, { couleur: 'orange', taille: 17, align: 'center' }); }
}

let CONF;
if (VUE === 'formes') CONF = { moments: MF, fin: 9, dessiner: dessinerFormes, titre: 'Courbe unimodale ou bimodale', accueil: 'Deux formes de courbe de fréquence.', fini: 'Unimodale : homogène ; bimodale : hétérogène.',
  motifs: { uni: 'la courbe unimodale', uni_sens: 'unimodale : homogène', bi: 'la courbe bimodale', bi_sens: 'bimodale : hétérogène' },
  voir: S => 'À gauche une courbe à un sommet (unimodale)' + (S.a('uni_sens') || S.t <= 0 ? ' : groupement homogène, milieu stable' : '') + '. ' + (S.a('bi') || S.t <= 0 ? 'À droite une courbe à deux sommets (bimodale)' + (S.a('bi_sens') || S.t <= 0 ? ' : groupement hétérogène, milieu qui évolue.' : '.') : '') };
else {
  const liste = LISTES[VUE], { M, H, fin } = horaire(liste), compte = CL.map(k => liste.filter(e => e[1] === k).length);
  const uni = VUE === 'flore';
  CONF = { moments: M, fin, dessiner: (c, S, sc) => dessinerHisto(c, S, sc, liste, H), titre: 'Histogramme et courbe de fréquence',
    accueil: VUE === 'flore' ? 'Maâmora : construisons l’histogramme, indice par indice.' : 'Bouregreg : construisons l’histogramme des invertébrés.',
    fini: uni ? 'Un seul sommet (II) : courbe unimodale, groupement homogène.' : 'Deux sommets (I et V) : courbe bimodale, répartition hétérogène.',
    motifs: Object.assign({ tableau: 'la liste des espèces et leur indice', axes: 'les axes gradués', courbe: 'la courbe relie les milieux des sommets', forme: 'la lecture de la courbe' }, Object.fromEntries(CL.map((k, i) => [k, 'indice ' + k + ' : ' + compte[i] + ' espèce' + (compte[i] > 1 ? 's' : '')]))),
    voir: S => {
      const m = [(VUE === 'flore' ? 'Liste des 18 espèces de Maâmora' : 'Liste des 13 invertébrés du Bouregreg') + ' avec leur indice ; graphique : IF en abscisse (I à V), nombre d’espèces en ordonnée (0 à 7).'];
      const faites = CL.filter(k => S.a(k)); if (faites.length) m.push('Barres construites : ' + faites.map(k => k + ' = ' + compte[CL.indexOf(k)]).join(', ') + '.');
      if (S.a('courbe')) m.push('Courbe rouge reliant les milieux des sommets.');
      if (S.a('forme') && S.conclusions) m.push(uni ? 'Un seul sommet entouré (II) : courbe unimodale → groupement homogène.' : 'Deux sommets entourés (I et V) : courbe bimodale → répartition hétérogène.');
      return m.join(' ');
    } };
}
window.Sortie.sim({
  id: 'tc_sortie_histogramme_' + VUE, titre: CONF.titre, vue: VUE === 'flore' ? 'histogramme' : VUE, moments: CONF.moments, fin: CONF.fin, graine: 31,
  motifs: CONF.motifs, accueil: CONF.accueil, fini: CONF.fini, dessiner: CONF.dessiner, ceQuiSeVoit: CONF.voir,
  texte: 'Histogramme de fréquence : en abscisse les indices de fréquence I à V, en ordonnée le nombre d’espèces. La courbe de fréquence relie les milieux des sommets des barres. Courbe unimodale : groupement homogène (milieu stable) ; bimodale ou multimodale : groupement hétérogène (milieu en évolution). Maâmora : I 2, II 6, III 4, IV 3, V 3 (unimodale). Bouregreg : I 6, II 2, III 0, IV 1, V 4 (bimodale).',
  explication: { histogramme: [{ repere: 'axes', texte: 'En abscisse les indices, en ordonnée le nombre d’espèces.' }, { repere: 'courbe', texte: 'La courbe relie les milieux des sommets.' }, { repere: 'lecture', texte: 'Un sommet : homogène ; deux : hétérogène.' }] },
});
</script>
<script src="/media/simulations/professor-locate.js" defer></script>
</body></html>
