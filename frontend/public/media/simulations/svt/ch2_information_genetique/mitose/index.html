<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TP — Mitose, au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="lab.css"></head>
<body>
<div class="tableau">
  <header class="titre">
    <div><small>SVT · 2 BAC · information génétique</small><h1 id="title">TP — La mitose dans la racine d’oignon</h1><p class="objectif" id="objective"></p></div>
    <nav class="onglets" id="steps" aria-label="Étapes du TP" data-professor-control="go_to_step" data-professor-point="etapes" data-professor-label="les cinq étapes du TP"></nav>
  </header>
  <section class="scene">
    <div class="microscope">
      <canvas id="scope" role="img" aria-label="Champ du microscope dessiné à la craie : cellules du méristème de racine d’oignon colorées à l’orcéine"></canvas>
      <div class="outils">
        <div class="onglets objectifs" role="group" aria-label="Objectif" data-professor-point="objectifs" data-professor-label="objectifs ×10 et ×40">
          <button class="onglet" id="obj10" data-professor-control="set_objective" aria-pressed="true">objectif ×10</button>
          <button class="onglet" id="obj40" data-professor-control="set_objective" aria-pressed="false">objectif ×40</button>
        </div>
        <div id="focus-box" data-professor-point="mise_au_point" data-professor-label="mise au point"></div>
        <output class="lecture" id="scope-status"></output>
      </div>
    </div>
    <div class="panneau etape" id="panel" data-professor-point="etape" data-professor-label="l’étape en cours"></div>
  </section>
  <footer class="barre">
    <button class="craie-btn principal" id="next-btn" data-professor-control="go_to_step start next">Observer →</button>
    <button class="craie-btn secondaire" id="undo" data-professor-control="protocol_undo" hidden>↶ Annuler</button>
    <button class="craie-btn secondaire" id="reset" data-professor-control="reset">Recommencer</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
    <button class="craie-btn secondaire" id="hint" data-professor-control="reveal_hint">Un indice</button>
  </footer>
</div>
<noscript>Mitose : prophase (chromosomes condensés), métaphase (plaque équatoriale), anaphase (séparation des chromatides), télophase (deux noyaux, nouvelle paroi). IM = cellules en division / total × 100.</noscript>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script type="module" src="lab.js"></script>
<script src="/media/simulations/professor-locate.js" defer></script>
</body></html>
