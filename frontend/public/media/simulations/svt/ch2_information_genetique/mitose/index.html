<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TP — Mitose</title><link rel="stylesheet" href="lab.css"></head>
<body>
<header>
  <div><small>SVT · 2 BAC PC · INFORMATION GÉNÉTIQUE</small><h1>TP — La mitose dans la racine d’oignon</h1></div>
  <ol id="steps" aria-label="Étapes du TP"></ol>
</header>
<main>
  <section class="bench">
    <div class="scope-wrap">
      <canvas id="scope" role="img" aria-label="Champ du microscope : cellules du méristème de racine d’oignon colorées à l’orcéine"></canvas>
      <output id="scope-status"></output>
    </div>
    <div class="scope-tools">
      <div class="group" role="group" aria-label="Objectif">
        <button id="obj10" data-professor-control="set_objective" aria-pressed="true">Objectif ×10</button>
        <button id="obj40" data-professor-control="set_objective" aria-pressed="false">Objectif ×40</button>
      </div>
      <label class="focus">Mise au point<input id="focus" type="range" min="0" max="1" step="0.01" value="0.95" data-professor-control="set_focus"></label>
      <div class="group pan" role="group" aria-label="Déplacer la lame">
        <button data-pan="-1,0" aria-label="Déplacer à gauche">←</button><button data-pan="0,-1" aria-label="Déplacer vers le haut">↑</button><button data-pan="0,1" aria-label="Déplacer vers le bas">↓</button><button data-pan="1,0" aria-label="Déplacer à droite">→</button>
      </div>
    </div>
  </section>
  <aside>
    <div id="panel"></div>
    <p id="feedback" role="status" aria-live="polite"></p>
    <div class="actions"><button id="hint" data-professor-control="reveal_hint">Un indice</button><button id="reset" data-professor-control="reset">Recommencer le TP</button></div>
  </aside>
</main>
<footer>Cellules dessinées d’après des préparations réelles de méristème ; proportions de phases réalistes, champ reproductible.</footer>
<noscript>Mitose : prophase (chromosomes condensés), métaphase (plaque équatoriale), anaphase (séparation des chromatides), télophase (deux noyaux, nouvelle paroi). IM = cellules en division / total × 100.</noscript>
<script type="module" src="lab.js"></script><script src="/media/simulations/professor-locate.js" defer></script>
</body></html>
