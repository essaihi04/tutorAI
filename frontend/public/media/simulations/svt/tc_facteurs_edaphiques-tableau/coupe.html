<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Où pousse le chêne-liège ? — au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="sol.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Coupe géologique du nord-ouest au sud-est, de la forêt de Temara au plateau de Zaer : les roches (sable, calcaire, schiste, sable et argile, quartzite, granite) ; le chêne-liège apparaît sur le sable, le schiste, le sable et argile et le granite, jamais sur le calcaire"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start pause resume play_until">Lancer</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="commun.js"></script>
<script>
/*
 * Doc 2 a de l’activité 2 : répartition du chêne-liège entre la forêt de Temara et le plateau de Zaer (diapositive
 * fe_c2_chene_liege), recréée à la craie (règle de l’utilisateur, 22 novembre 2026 : pas de photocopie de document).
 * Coupe NW → SE (schéma, d’après le document) ; les roches sont nommées sous la coupe ; le chêne-liège apparaît site après
 * site : Temara (sable), Beni Abid (schiste), Sidi Bettach (sable et argile), Zaer (granite) ; puis les calcaires
 * (près de Temara et à Merchouch) sont montrés : aucun chêne-liège.
 * Moments : coupe 3 ; temara 5 ; beniabid 6,5 ; sidibettach 8 ; zaer 9,5 ; calcaire 11,5 ; conclusion 13 ; fin 13,5.
 */
const ST = window.SolTableau, { doux } = ST;
const $ = id => document.getElementById(id);
const M = { coupe: 3, temara: 5, beniabid: 6.5, sidibettach: 8, zaer: 9.5, calcaire: 11.5, conclusion: 13 };
const FIN = 13.5;
const MOTIFS = { coupe: 'la coupe, de Temara (NW) à Zaer (SE)', temara: 'forêt de Temara : chêne-liège sur le sable', beniabid: 'Beni Abid : chêne-liège sur le schiste',
  sidibettach: 'Sidi Bettach : chêne-liège sur sable et argile', zaer: 'plateau de Zaer : chêne-liège sur le granite', calcaire: 'sur le calcaire : pas de chêne-liège', conclusion: 'le chêne-liège est calcifuge' };
/* Les bandes de roche (fractions de la largeur) et l’altitude de la surface (m) au début et à la fin de chaque bande. */
const ROCHES = [
  { id: 'sable', nom: 'sable', de: 0, a: .17, z: [20, 40], c: ['#e2c37e', '#b99350'], motif: 'points', rang: 0 },
  { id: 'calcaire1', nom: 'calcaire', de: .17, a: .25, z: [40, 120], c: ['#e8e4d6', '#b8b2a0'], motif: 'briques', rang: 1 },
  { id: 'schiste', nom: 'schiste', de: .25, a: .44, z: [120, 380], c: ['#9aa5ad', '#66727b'], motif: 'traits', rang: 0 },
  { id: 'sablargile', nom: 'sable + argile', de: .44, a: .6, z: [400, 470], c: ['#d6b48a', '#a2774c'], motif: 'tirets', rang: 1 },
  { id: 'calcaire2', nom: 'calcaire', de: .6, a: .71, z: [100, 650], c: ['#e8e4d6', '#b8b2a0'], motif: 'briques', rang: 0 },
  { id: 'quartzite', nom: 'quartzite', de: .71, a: .8, z: [650, 820], c: ['#cdbfd6', '#8f7f9c'], motif: 'ronds', rang: 1 },
  { id: 'granite', nom: 'granite', de: .8, a: 1, z: [800, 780], c: ['#e6b3a8', '#a8756a'], motif: 'croix', rang: 0 },
];
const SITES = [
  { id: 'temara', nom: 'Forêt de Temara', court: 'Temara', roche: 'sable', x: .09, n: 3 },
  { id: 'beniabid', nom: 'Forêt de Beni Abid', court: 'Beni Abid', roche: 'schiste', x: .36, n: 3 },
  { id: 'sidibettach', nom: 'Plateau de Sidi Bettach', court: 'S. Bettach', roche: 'sablargile', x: .52, n: 3 },
  { id: 'zaer', nom: 'Plateau de Zaer', court: 'Zaer', roche: 'granite', x: .9, n: 4 },
];
function chene(g, x, y, k) {
  g.fillStyle = '#6b4a2a'; g.fillRect(x - 3 * k, y - 26 * k, 6 * k, 26 * k);
  for (const [dx, dy, r] of [[0, -40, 15], [-12, -32, 11], [12, -32, 11], [0, -28, 10]]) { const gg = g.createRadialGradient(x + (dx - 5) * k, y + (dy - 5) * k, 2, x + dx * k, y + dy * k, r * k); gg.addColorStop(0, '#86cf6e'); gg.addColorStop(1, '#2d7a30'); g.fillStyle = gg; g.beginPath(); g.arc(x + dx * k, y + dy * k, r * k, 0, 6.28); g.fill(); }
}
function dessiner(c) {
  scene.cadre(23);
  const t = B.chrono.t, L = scene.L, K = scene.compact, x0 = 30, x1 = L - 30, yb = 320, kz = .2;
  const X = f => x0 + (x1 - x0) * f, Z = z => yb - z * kz;
  const surf = f => { const r = ROCHES.find(R => f >= R.de && f <= R.a) || ROCHES[ROCHES.length - 1]; const u = (f - r.de) / (r.a - r.de); return r.z[0] + (r.z[1] - r.z[0]) * u + (r.id === 'calcaire2' ? -Math.sin(u * Math.PI) * 0 : 0); };
  const a = doux(t / 2);
  c.direct(() => {
    const g = c.ctx; g.save(); g.globalAlpha = a;
    ROCHES.forEach(R => {
      g.save(); g.beginPath(); g.moveTo(X(R.de), yb);
      for (let k = 0; k <= 20; k++) { const f = R.de + (R.a - R.de) * k / 20; g.lineTo(X(f), Z(surf(f))); }
      g.lineTo(X(R.a), yb); g.closePath(); g.clip();
      const gr = g.createLinearGradient(0, Z(900), 0, yb); gr.addColorStop(0, R.c[0]); gr.addColorStop(1, R.c[1]); g.fillStyle = gr; g.fillRect(X(R.de), Z(900), X(R.a) - X(R.de), yb - Z(900));
      g.strokeStyle = 'rgba(40,30,25,.45)'; g.fillStyle = 'rgba(40,30,25,.5)'; g.lineWidth = 1.3;
      for (let y = Z(850); y < yb; y += 14) for (let x = X(R.de) - 14; x < X(R.a) + 14; x += 18) {
        const xx = x + ((y / 14) % 2) * 9;
        if (R.motif === 'points') { g.beginPath(); g.arc(xx, y, 2, 0, 6.28); g.fill(); }
        else if (R.motif === 'traits') { g.beginPath(); g.moveTo(xx, y + 6); g.lineTo(xx + 10, y - 6); g.stroke(); }
        else if (R.motif === 'tirets') { g.beginPath(); g.moveTo(xx, y); g.lineTo(xx + 9, y); g.stroke(); }
        else if (R.motif === 'ronds') { g.beginPath(); g.arc(xx, y, 3.5, 0, 6.28); g.stroke(); }
        else if (R.motif === 'croix') { g.beginPath(); g.moveTo(xx - 3, y); g.lineTo(xx + 3, y); g.moveTo(xx, y - 3); g.lineTo(xx, y + 3); g.stroke(); }
        else { g.strokeRect(xx - 8, y - 6, 18, 14); }
      }
      g.restore();
    });
    g.strokeStyle = 'rgba(226,232,240,.85)'; g.lineWidth = 2.4; g.beginPath();
    for (let k = 0; k <= 200; k++) { const f = k / 200; k ? g.lineTo(X(f), Z(surf(f))) : g.moveTo(X(f), Z(surf(f))); } g.stroke();
    g.beginPath(); g.moveTo(x0, yb); g.lineTo(x1, yb); g.stroke();
    g.restore();
  });
  c.texte('NW', x0, 30, { couleur: 'faible', taille: 17 }); c.texte('SE', x1, 30, { couleur: 'faible', taille: 17, align: 'right' });
  c.repere('coupe', x0, 60, x1 - x0, yb - 60, 'la coupe géologique');
  // les noms des roches sous la coupe, en deux rangées (le texte ne se chevauche pas)
  if (t >= M.coupe - 1) ROCHES.forEach(R => {
    const xm = X((R.de + R.a) / 2), y = yb + (R.rang ? 62 : 32);
    ecrit.ecrire(c, 'r_' + R.id, () => { c.ligne(xm, yb + 2, xm, y - 20, { couleur: 'faible', largeur: 1.2, duree: .1 }); c.texte(R.nom, xm, y, { couleur: R.id.startsWith('calcaire') ? 'rouge' : 'blanc', taille: 17, align: 'center' }); });
  });
  // le chêne-liège, site après site, et le nom du site au-dessus
  SITES.forEach(S => {
    const ts = M[S.id]; if (t < ts - 1.2) return;
    const u = doux((t - ts + 1.2) / 1), k = K ? 1.2 : 1;
    c.direct(() => { const g = c.ctx; g.save(); g.globalAlpha = u; for (let j = 0; j < S.n; j++) { const f = S.x - .03 + j * .06 / Math.max(1, S.n - 1) * (S.n > 1 ? 1 : 0); chene(g, X(f), Z(surf(f)) + 2, k * u); } g.restore(); });
    const yNom = Z(surf(S.x)) - 64 * k;
    ecrit.ecrire(c, 'n_' + S.id, () => c.texte(K ? S.court : S.nom, X(S.x), yNom, { couleur: 'vert', taille: 17, align: 'center' }));
    c.repere(S.id, X(S.x) - 50, yNom - 20, 100, Z(surf(S.x)) - yNom + 24, `${S.nom} : chêne-liège sur ${ROCHES.find(R => R.id === S.roche).nom}`);
  });
  // les calcaires : aucun chêne-liège
  if (t >= M.calcaire - 1.2) {
    ['calcaire1', 'calcaire2'].forEach(id => {
      const R = ROCHES.find(r => r.id === id), xm = X((R.de + R.a) / 2), ys = Z(surf((R.de + R.a) / 2));
      ecrit.ecrire(c, 'x_' + id, () => { c.ligne(xm - 14, ys - 34, xm + 14, ys - 10, { couleur: 'rouge', largeur: 3 }); c.ligne(xm + 14, ys - 34, xm - 14, ys - 10, { couleur: 'rouge', largeur: 3 }); });
      ST.lueur(c, X(R.de), ys - 44, X(R.a) - X(R.de), 50, t < M.calcaire + 1.4);
    });
    c.repere('calcaire', X(.17), 60, X(.71) - X(.17), 120, 'les calcaires : pas de chêne-liège');
  }
  if (t >= M.conclusion - 1.2 && !K) {
    ecrit.ecrire(c, 'conclusion', () => c.texte('Chêne-liège : sur les sols siliceux (acides), jamais sur le calcaire → calcifuge', L / 2, 30, { couleur: 'jaune', taille: 19, align: 'center', max: L - 140 }));
    c.repere('conclusion', 70, 10, L - 140, 28, 'le chêne-liège est calcifuge');
  }
  return c.fin();
}
const canvas = $('canvas');
const scene = ST.Scene(canvas, dessiner, { large: true });
const ecrit = ST.Apparitions(scene);
ST.brancher.scene = scene; ST.brancher.ecrit = ecrit;
function voir(t) {
  const m = ['Coupe géologique NW → SE, de la forêt de Temara au plateau de Zaer ; roches nommées sous la coupe : sable, calcaire, schiste, sable et argile, calcaire, quartzite, granite.'];
  SITES.forEach(S => { if (t >= M[S.id]) m.push(`${S.nom} : chêne-liège sur ${ROCHES.find(R => R.id === S.roche).nom}.`); });
  if (t >= M.calcaire) m.push('Sur les deux calcaires (près de Temara et à Merchouch) : une croix rouge, aucun chêne-liège.');
  if (t >= M.conclusion) m.push('Conclusion : le chêne-liège vit sur les sols siliceux acides, pas sur le calcaire ; il est calcifuge.');
  return m.join(' ');
}
const B = ST.brancher({ id: 'edaph_coupe', titre: 'Où pousse le chêne-liège ?', M, FIN, motifs: MOTIFS,
  texte: 'Doc 2 a : de la forêt de Temara au plateau de Zaer, le chêne-liège pousse sur le sable (Temara), le schiste (Beni Abid), le sable et argile (Sidi Bettach) et le granite (Zaer) : des sols siliceux, acides ; jamais sur le calcaire. Le chêne-liège est silicicole et calcifuge.',
  voir, depart: 'Une coupe de terrain…', fini: () => 'Le chêne-liège fuit le calcaire : il est calcifuge.',
  explication: { coupe: SITES.map(S => ({ repere: S.id, texte: S.nom })) } });
window.Tableau.bulle($('feedback'), 'Où pousse le chêne-liège ?');
</script>
<script src="/media/simulations/professor-locate.js" defer></script>
</body></html>
