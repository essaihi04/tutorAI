<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TP — Dipôle RC, au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="lab.css"></head>
<body>
<div class="tableau">
  <header class="titre">
    <div><small>Physique · 2 BAC PC · électricité</small><h1 id="title">TP — Charge et décharge d’un condensateur</h1></div>
    <ol id="steps" class="etapes" aria-label="Étapes du TP" data-professor-point="etapes" data-professor-label="les six étapes"></ol>
  </header>
  <section class="scene">
    <div class="paillasse">
      <canvas id="board" role="img" aria-label="Montage RC (générateur E, interrupteur K, conducteur ohmique R, condensateur C, voltmètre) et courbe u_C(t), dessinés à la craie"></canvas>
      <div class="calque">
        <div id="switch" class="zone-k" tabindex="0" role="button" aria-label="Interrupteur K : basculer entre 1 (charge) et 2 (décharge)" data-professor-control="set_switch"></div>
        <output id="cursor-reading" class="lecture lecture-courbe">Clique sur la courbe pour lire t et u_C.</output>
      </div>
    </div>
    <aside class="panneau fixe" id="panel-wrap" data-professor-point="panneau" data-professor-label="panneau des étapes"><div id="panel"></div></aside>
  </section>
  <footer class="barre">
    <button class="craie-btn secondaire" id="show-model" aria-pressed="false" data-professor-control="show_model">Tracer la courbe</button>
    <button class="craie-btn secondaire" id="show-63" aria-pressed="false" data-professor-control="show_63">Ligne 0,63 E</button>
    <button class="craie-btn secondaire" id="show-tangent" aria-pressed="false" data-professor-control="show_tangent">Tangente</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
    <button class="craie-btn secondaire" id="hint" data-professor-control="reveal_hint">Un indice</button>
    <button class="craie-btn secondaire" id="reset" data-professor-control="reset">Recommencer</button>
    <output class="lecture" id="clock">t = <b>0,000</b> s</output>
  </footer>
</div>
<noscript>Charge : u_C = E(1 − e^(−t/τ)), τ = R·C. À t = τ, u_C = 0,63 E ; la tangente à l’origine coupe u = E en t = τ. Décharge : u_C = U₀·e^(−t/τ), 0,37 U₀ à t = τ.</noscript>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script type="module" src="lab.js"></script>
<script src="/media/simulations/professor-locate.js" defer></script>
</body></html>
