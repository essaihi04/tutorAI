<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TP — Dipôle RC</title><link rel="stylesheet" href="lab.css"></head>
<body>
<header>
  <div><small>PHYSIQUE · 2 BAC PC · ÉLECTRICITÉ</small><h1>TP — Charge et décharge d’un condensateur</h1></div>
  <ol id="steps" aria-label="Étapes du TP"></ol>
</header>
<main>
  <section class="bench">
    <svg id="circuit" viewBox="0 0 420 210" role="img" aria-labelledby="circuit-title">
      <title id="circuit-title">Montage : générateur E, interrupteur K, conducteur ohmique R, condensateur C et voltmètre aux bornes de C</title>
      <g class="wire" fill="none">
        <path d="M60 85 V40 H146 M214 40 H260 M320 40 H370 V90 M370 120 V170 H60 V125"/>
        <path id="discharge-wire" d="M150 94 V170"/>
      </g>
      <path id="loop-charge" d="M60 85 V40 H260 H370 V170 H60 Z" fill="none" stroke="none"/>
      <path id="loop-discharge" d="M370 90 V40 H150 V170 H370 Z" fill="none" stroke="none"/>
      <g class="component"><line x1="44" y1="85" x2="76" y2="85" stroke-width="3"/><line x1="50" y1="125" x2="70" y2="125" stroke-width="6"/></g>
      <text x="20" y="110" class="label" id="emf-label">E</text>
      <g id="switch" class="switch" tabindex="0" role="button" aria-label="Interrupteur K : basculer entre 1 (charge) et 2 (décharge)" data-professor-control="set_switch">
        <rect x="128" y="18" width="98" height="86" fill="transparent" stroke="none"/>
        <circle cx="150" cy="40" r="4"/><circle cx="150" cy="90" r="4"/><circle cx="210" cy="40" r="4"/>
        <line id="switch-blade" x1="210" y1="40" x2="155" y2="44"/>
        <text x="172" y="24" class="label">K</text><text x="136" y="32" class="small">1</text><text x="134" y="100" class="small">2</text>
      </g>
      <rect x="260" y="30" width="60" height="20" rx="3" class="component-box"/><text x="283" y="22" class="label">R</text>
      <g class="component"><line x1="352" y1="90" x2="388" y2="90" stroke-width="4"/><line x1="352" y1="120" x2="388" y2="120" stroke-width="4"/></g>
      <text x="394" y="110" class="label">C</text>
      <g class="meter"><circle cx="300" cy="105" r="20"/><text x="300" y="111" text-anchor="middle" class="label">V</text>
        <path d="M300 85 V66 H370 M300 125 V150 H370" fill="none" stroke-dasharray="3 3"/></g>
      <text x="250" y="200" text-anchor="middle" class="reading" id="meter-reading">u_C = 0,00 V</text>
      <circle id="electron" r="4" class="electron" cx="-10" cy="-10"/>
    </svg>
    <div class="graph-wrap">
      <canvas id="graph" role="img" aria-label="Courbe u_C en fonction du temps"></canvas>
      <output id="cursor-reading">Clique sur la courbe pour lire t et u_C.</output>
    </div>
    <div class="tools" id="graph-tools">
      <button id="show-model" aria-pressed="false" data-professor-control="show_model">Tracer la courbe</button>
      <button id="show-63" aria-pressed="false" data-professor-control="show_63">Ligne 0,63 E</button>
      <button id="show-tangent" aria-pressed="false" data-professor-control="show_tangent">Tangente à l’origine</button>
      <output id="clock">t = 0,000 s</output>
    </div>
  </section>
  <aside>
    <div id="panel"></div>
    <p id="feedback" role="status" aria-live="polite"></p>
    <div class="actions"><button id="hint" data-professor-control="reveal_hint">Un indice</button><button id="reset" data-professor-control="reset">Recommencer le TP</button></div>
  </aside>
</main>
<footer>Modèle idéal : générateur sans résistance interne, condensateur sans fuite. Lectures arrondies à 0,01 V.</footer>
<noscript>Charge : u_C = E(1 − e^(−t/τ)), τ = R·C. À t = τ, u_C = 0,63 E ; la tangente à l’origine coupe u = E en t = τ. Décharge : u_C = U₀·e^(−t/τ), 0,37 U₀ à t = τ.</noscript>
<script type="module" src="lab.js"></script><script src="/media/simulations/professor-locate.js" defer></script>
</body></html>
