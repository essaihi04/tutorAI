<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Le principe d’inertie : un palet de curling glisse sur la glace ; un autoporteur lancé en tournant (éclateur A au centre, éclateur B au bord) ; les axes de symétrie et le centre d’inertie G ; un autoporteur en translation ; le poids et la réaction ; système isolé et pseudo-isolé ; l’énoncé du principe d’inertie"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start pause resume play_until">Lancer</button>

  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="/media/simulations/shared/lexique/lexique-physique.js"></script>
<script src="/media/simulations/shared/lexique/lexique-maths.js"></script>
<script src="/media/simulations/physics/tc_mouvement_inertie-tableau/commun.js"></script>
<script>
/*
 * Le principe d'inertie (diapos mi_i1_curling … mi_i8_enonce). Contrat : docs/tcf/ARCHITECTURE_tc_phys_mouvement_inertie.md.
 *  ?vue=curling     : palet de granit sur la glace, positions toutes les 0,5 s (intervalles allumés un à un), P⃗ et R⃗.
 *                     Moments : lance 0,5 ; glisse 1,5 ; positions 6 ; forces 8 ; question 10 ; fin 11,5.
 *  ?vue=rotation    : autoporteur lancé en tournant : A (centre) points alignés équidistants ; B (bord, 0,7 r) cycloïde
 *                     à boucles, un point tous les τ. Moments : lance 0,5 ; trace 1 ; A 7 ; B 9 ; fin 11.
 *  ?vue=axes        : lancer 1 (sur une face) → Δ₁ ; lancer 2 (sur la tranche) → Δ₂ ; G à l'intersection.
 *                     Moments : delta1 0,5 ; delta2 3 ; G 5,5 ; mru 7,5 ; fin 10.
 *  ?vue=corps       : sphère, cylindre, disque, barre homogènes : axes de symétrie et G. Moments : sphere 0,5 ;
 *                     cylindre 3 ; disque 5,5 ; barre 8 ; fin 10.
 *  ?vue=translation : autoporteur lancé sans rotation : rangées de points de A (= G) et de B à pas égaux.
 *                     Moments : lance 0,5 ; trace 1 ; mru 6 ; fin 8.
 *  ?vue=forces      : de côté : P⃗ (en G, vers le bas), R⃗ (au contact, vers le haut) ; P⃗ + R⃗ = 0⃗ ; pseudo-isolé.
 *                     Moments : systeme 0,5 ; P 2 ; R 4 ; compense 6 ; pseudo 8 ; fin 10.
 *  ?vue=isole       : sonde loin de tout (isolé) / autoporteur (pseudo-isolé). Moments : sonde 0,5 ; isole 2,5 ;
 *                     autoporteur 5 ; pseudo 7 ; fin 9.
 *  ?vue=enonce      : G au repos, G en MRU, l'énoncé. Moments : repos 0,5 ; mru 3 ; enonce 6 ; fin 9.
 * Le palet de curling et la sonde spatiale ne servent que dans cette page : ils sont peints ici (palet, glace, sonde).
 */
const { P, lueur, panneau, vecteur, texteV, HEX, TAU } = window.Mvt;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ── Objets peints propres à cette page ─────────────────────────────────────────────────────────────────── */
/** La glace bleutée vue de côté : surface claire (reflets, grain) et tranche bleue. */
function glace(g, x, y, w, h) {
  g.save();
  const hs = h * .52, gs = g.createLinearGradient(0, y, 0, y + hs); gs.addColorStop(0, '#f0f9ff'); gs.addColorStop(1, '#bae6fd');
  g.fillStyle = gs; g.fillRect(x, y, w, hs);
  const gf = g.createLinearGradient(0, y + hs, 0, y + h); gf.addColorStop(0, '#7dd3fc'); gf.addColorStop(1, '#0c4a6e');
  g.fillStyle = gf; g.fillRect(x, y + hs, w, h - hs);
  g.globalAlpha = .5; g.strokeStyle = '#ffffff'; g.lineWidth = 1;
  for (let i = 0; i < 14; i++) { const xx = x + ((i * 97) % 101) / 101 * w, yy = y + 3 + ((i * 41) % 13) / 13 * (hs - 6); g.beginPath(); g.moveTo(xx, yy); g.lineTo(xx + 30 + (i % 4) * 12, yy); g.stroke(); }
  g.globalAlpha = .35; g.fillStyle = '#0369a1';
  for (let i = 0; i < 70; i++) g.fillRect(x + ((i * 53) % 197) / 197 * w, y + 2 + ((i * 29) % 31) / 31 * (hs - 4), 1.4, 1.4);
  g.globalAlpha = 1; g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(x, y + .5); g.lineTo(x + w, y + .5); g.stroke();
  g.restore();
}
/** Le palet de curling en granit vu de côté (posé en (x, yb)), poignée rouge ; renvoie G. */
function palet(g, x, yb, w) {
  const h = w * .52, wb = w * .66, wt = w * .8, ym = yb - h * .45;
  g.save();
  g.fillStyle = 'rgba(12,74,110,.35)'; g.beginPath(); g.ellipse(x, yb + 2, w * .45, 4, 0, 0, TAU); g.fill();
  const corps = () => { g.beginPath(); g.moveTo(x - wb / 2, yb); g.bezierCurveTo(x - w / 2 - 2, yb - 2, x - w / 2 - 2, ym, x - w / 2, ym); g.bezierCurveTo(x - w / 2, yb - h * .85, x - wt / 2 - 2, yb - h, x - wt / 2, yb - h); g.lineTo(x + wt / 2, yb - h); g.bezierCurveTo(x + wt / 2 + 2, yb - h, x + w / 2, yb - h * .85, x + w / 2, ym); g.bezierCurveTo(x + w / 2 + 2, ym, x + w / 2 + 2, yb - 2, x + wb / 2, yb); g.closePath(); };
  P.ombre(g, () => { const gr = g.createLinearGradient(x - w / 2, 0, x + w / 2, 0); gr.addColorStop(0, '#4b5563'); gr.addColorStop(.35, '#d1d5db'); gr.addColorStop(.7, '#9ca3af'); gr.addColorStop(1, '#374151'); g.fillStyle = gr; corps(); g.fill(); }, 6);
  g.save(); corps(); g.clip();
  for (let i = 0; i < 120; i++) { g.fillStyle = i % 3 ? 'rgba(31,41,55,.45)' : 'rgba(255,255,255,.55)'; g.fillRect(x - w / 2 + ((i * 37) % 113) / 113 * w, yb - h + ((i * 59) % 97) / 97 * h, 1.6, 1.6); }
  g.fillStyle = 'rgba(17,24,39,.55)'; g.fillRect(x - w / 2, ym - 2, w, 3);   // la bande de frappe
  g.restore();
  g.fillStyle = '#3f3f46'; g.beginPath(); g.ellipse(x, yb - h, wt / 2, w * .06, 0, 0, TAU); g.fill();
  // la poignée (plastique rouge) : un pied, puis la prise vers l'arrière
  const gp = g.createLinearGradient(0, yb - h - 22, 0, yb - h); gp.addColorStop(0, '#fca5a5'); gp.addColorStop(.5, '#dc2626'); gp.addColorStop(1, '#7f1d1d');
  g.fillStyle = gp; g.beginPath(); g.roundRect(x - 8, yb - h - 14, 16, 14, 3); g.fill();
  g.beginPath(); g.roundRect(x - w * .42, yb - h - 22, w * .5, 10, 5); g.fill();
  g.restore();
  return [x, yb - h * .5];
}
/** La sonde spatiale : corps doré, deux panneaux solaires, antenne parabolique. */
function sonde(g, x, y, s) {
  g.save();
  g.strokeStyle = '#94a3b8'; g.lineWidth = 2; g.beginPath(); g.moveTo(x - s * 1.7, y); g.lineTo(x + s * 1.7, y); g.stroke();
  for (const sx of [-1, 1]) {
    const px = x + sx * s * 1.05 - (sx < 0 ? s * 1.5 : 0), gr = g.createLinearGradient(px, y - s * .5, px + s * 1.5, y + s * .5); gr.addColorStop(0, '#1e3a8a'); gr.addColorStop(.5, '#3b82f6'); gr.addColorStop(1, '#1e40af');
    g.fillStyle = gr; g.fillRect(px, y - s * .45, s * 1.5, s * .9);
    g.strokeStyle = 'rgba(191,219,254,.6)'; g.lineWidth = 1; for (let k = 1; k < 5; k++) { g.beginPath(); g.moveTo(px + k * s * .3, y - s * .45); g.lineTo(px + k * s * .3, y + s * .45); g.stroke(); }
    g.beginPath(); g.moveTo(px, y); g.lineTo(px + s * 1.5, y); g.stroke();
  }
  P.ombre(g, () => { const gr = g.createLinearGradient(x - s * .5, y - s * .5, x + s * .5, y + s * .5); gr.addColorStop(0, '#fde68a'); gr.addColorStop(.5, '#d97706'); gr.addColorStop(1, '#78350f'); g.fillStyle = gr; g.fillRect(x - s * .5, y - s * .5, s, s); }, 8);
  g.strokeStyle = 'rgba(120,53,15,.6)'; g.lineWidth = 1; for (let k = 1; k < 4; k++) { g.beginPath(); g.moveTo(x - s * .5, y - s * .5 + k * s / 4); g.lineTo(x + s * .5, y - s * .5 + k * s / 4 + 3); g.stroke(); }
  g.strokeStyle = '#cbd5e1'; g.lineWidth = 2; g.beginPath(); g.moveTo(x, y - s * .5); g.lineTo(x, y - s * .85); g.stroke();
  g.fillStyle = '#e2e8f0'; g.beginPath(); g.ellipse(x, y - s * .95, s * .45, s * .16, 0, Math.PI, TAU); g.fill();
  g.fillStyle = '#94a3b8'; g.beginPath(); g.ellipse(x, y - s * .95, s * .45, s * .07, 0, 0, TAU); g.fill();
  g.restore();
}
/** L'espace : un cadre sombre étoilé (la sonde y est loin de tout astre). */
function espace(g, x, y, w, h) {
  g.save(); const gr = g.createRadialGradient(x + w * .7, y + h * .3, 10, x + w / 2, y + h / 2, w * .8); gr.addColorStop(0, '#1e1b4b'); gr.addColorStop(1, '#020617');
  g.fillStyle = gr; g.beginPath(); g.roundRect(x, y, w, h, 10); g.fill();
  for (let i = 0; i < 60; i++) { g.globalAlpha = .35 + (i % 5) * .13; g.fillStyle = '#f8fafc'; const r = i % 7 === 0 ? 1.6 : .9; g.beginPath(); g.arc(x + 6 + ((i * 73) % 211) / 211 * (w - 12), y + 6 + ((i * 47) % 157) / 157 * (h - 12), r, 0, TAU); g.fill(); }
  g.restore();
}
/** La table à coussin d'air vue de côté : plateau bleu nuit dans un cadre de métal, deux pieds. */
function tableCote(g, x, y, w, hp = 26, pied = 90) {
  g.save();
  g.fillStyle = '#475569'; g.fillRect(x + 24, y + hp, 14, pied); g.fillRect(x + w - 38, y + hp, 14, pied);
  g.fillStyle = '#334155'; g.fillRect(x + 18, y + hp + pied - 6, 26, 6); g.fillRect(x + w - 44, y + hp + pied - 6, 26, 6);
  P.ombre(g, () => { const gr = g.createLinearGradient(0, y, 0, y + hp); gr.addColorStop(0, '#cbd5e1'); gr.addColorStop(1, '#475569'); g.fillStyle = gr; g.fillRect(x, y, w, hp); }, 6);
  g.fillStyle = '#1e3a5f'; g.fillRect(x + 4, y, w - 8, 6);
  g.restore();
}
/** Un disque homogène vu de dessus (même bois orangé que P.disque), un repère au bord pour voir qu'il tourne. */
function disqueDessus(g, x, y, r, a, alpha = 1) {
  g.save(); g.globalAlpha = alpha;
  P.ombre(g, () => { g.fillStyle = '#9a3412'; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); }, 6);
  const gr = g.createRadialGradient(x - r * .3, y - r * .3, r * .1, x, y, r); gr.addColorStop(0, '#fed7aa'); gr.addColorStop(1, '#ea580c');
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r * .92, 0, TAU); g.fill();
  g.strokeStyle = '#431407'; g.lineWidth = 3; g.beginPath(); g.moveTo(x + Math.cos(a) * r * .35, y + Math.sin(a) * r * .35); g.lineTo(x + Math.cos(a) * r * .9, y + Math.sin(a) * r * .9); g.stroke();
  g.restore();
}
/** Le même disque posé sur sa tranche, vu de dessus : un rectangle 2r × e qui tourne. */
function disqueTranche(g, x, y, r, e, a, alpha = 1) {
  g.save(); g.globalAlpha = alpha; g.translate(x, y); g.rotate(a);
  P.ombre(g, () => { const gr = g.createLinearGradient(0, -e / 2, 0, e / 2); gr.addColorStop(0, '#fed7aa'); gr.addColorStop(.5, '#f97316'); gr.addColorStop(1, '#9a3412'); g.fillStyle = gr; g.beginPath(); g.roundRect(-r, -e / 2, 2 * r, e, 3); g.fill(); }, 6);
  g.fillStyle = '#431407'; g.fillRect(r - 8, -e / 2, 4, e);
  g.restore();
}
/** Le point laissé par l'éclateur B (orange cerclé de sombre, pour le distinguer de la rangée jaune de A). */
function pointB(g, x, y, r = 4.5) { g.save(); g.fillStyle = '#1f2937'; g.beginPath(); g.arc(x, y, r + 1.6, 0, TAU); g.fill(); g.fillStyle = '#fb923c'; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); g.restore(); }
/** Un point de la trace du centre d'inertie (rose cerclé, comme P.G en plus petit). */
const pointG = (g, x, y) => P.G(g, x, y, 3.6);

/* ── vue curling ── */
const MC = { lance: .5, glisse: 1.5, positions: 6, forces: 8, question: 10 };
function dessinerCurling(c, S, sc) {
  const L = sc.L, pt = sc.petit, t = S.t <= 0 ? 99 : S.t;
  const yS = 286, yb = 300, wP = 128, x0 = 120, dx = (L - 270) / 9, X = i => x0 + i * dx, yP = 316;
  c.direct(() => glace(c.ctx, 0, yS, L, 52));
  c.repere('glace', 0, yS, L, 52, 'la glace');
  const k = clamp((t - MC.glisse) / .5, 0, 9), xs = x0 + k * dx, n = t >= MC.glisse ? Math.floor(k + 1e-6) : -1;
  for (let i = 0; i <= n; i++) c.direct(() => P.point(c.ctx, X(i), yP, 4.5));
  if (n >= 0) c.repere('positions', X(0) - 10, yP - 12, X(n) - X(0) + 20, 24, 'les positions du palet toutes les 0,5 s');
  // les intervalles égaux allumés un à un (positions 6 → 7,8 s), puis restent allumés
  if (S.t > 0 && S.a('positions')) for (let i = 0; i < 9; i++) if (t >= MC.positions + i * .2) {
    lueur(c, X(i) + 8, yP - 9, dx - 16, 18, { vive: t < MC.positions + (i + 1) * .2, numero: i + 1, nx: (X(i) + X(i + 1)) / 2, ny: pt ? 374 : 366, align: 'center', taille: pt ? 28 : 19 });
  }
  const G = (() => { let r; c.direct(() => { r = palet(c.ctx, xs, yb, wP); }); return r; })();
  c.repere('palet', xs - wP / 2, yb - 100, wP, 100, 'le palet de granit');
  if (S.t > 0 && S.a('lance') && !S.a('glisse')) c.fleche(xs - wP / 2 - 80, yb - 30, xs - wP / 2 - 10, yb - 30, { couleur: 'blanc', largeur: 2.6, duree: .2 });
  if (S.t > 0 && S.a('glisse') && t < MC.positions) c.fleche(xs + wP / 2 + 10, yb - 30, xs + wP / 2 + 60, yb - 30, { couleur: 'vert', largeur: 2.6, duree: .1 });
  if (S.t <= 0 || S.ecrit(c, 'forces')) {
    c.direct(() => P.G(c.ctx, G[0], G[1], 4));
    vecteur(c, G[0] - 4, G[1], G[0] - 4, G[1] + 118, { couleur: 'rouge', nom: 'P', nx: G[0] + 10, ny: G[1] + 126, taille: pt ? 30 : 22, point: false });
    c.repere('P', G[0] - 16, G[1], 50, 136, 'le poids P du palet, vers le bas');
    vecteur(c, G[0] + 4, yb, G[0] + 4, yb - 118, { couleur: 'bleu', nom: 'R', nx: G[0] + 16, ny: yb - 104, taille: pt ? 30 : 22 });
    c.repere('R', G[0] - 6, yb - 122, 50, 122, 'la réaction R de la glace, vers le haut');
  }
  panneau(c, S, sc, 20, 46, L - 320, [
    { m: 'lance', t: 'On lance le palet sur la glace', c: 'blanc' },
    { m: 'positions', t: 'Toutes les 0,5 s : distances égales', c: 'jaune', g: true, r: 'l_positions' },
    { m: 'forces', t: '^P + ^R = ^0 : elles se compensent', c: 'jaune', g: true, r: 'somme' },
    { m: 'question', t: 'Pourquoi garde-t-il sa vitesse ?', c: 'cyan', g: true, r: 'question' },
  ], { dy: 46, px: 20, py: 52, pw: L - 40, taille: 22 });
}

/* ── vues rotation et translation : l'autoporteur sur la feuille, éclateurs A et B ── */
function autoporteurLance(c, S, sc, o) {
  const L = sc.L, pt = sc.petit, t = S.t <= 0 ? 99 : S.t;
  const tx = 10, ty = 22, tw = L - 20, th = 272, yc = ty + th / 2, r = 54, x0 = tx + 96, x1 = tx + tw - 96;
  const v = (x1 - x0) / (o.T1 - o.T0);
  const pos = u => { const uu = clamp(u, o.T0, o.T1) - o.T0, x = x0 + v * uu, a = o.angle(uu); return { x, a, bx: x + Math.cos(a) * r * .7, by: yc + Math.sin(a) * r * .7 }; };
  c.direct(() => P.table(c.ctx, tx, ty, tw, th, { feuille: true }));
  c.repere('table', tx, ty, tw, th, 'la table à coussin d’air et sa feuille');
  const nb = t < o.Tp ? -1 : Math.floor((Math.min(t, o.T1) - o.Tp) / o.tau + 1e-6);
  if (o.lueurs) o.lueurs(x0, x1, yc, r);
  if (o.courbe && nb > 0) c.direct(() => { const g = c.ctx; g.save(); g.strokeStyle = 'rgba(234,88,12,.6)'; g.lineWidth = 2; g.beginPath(); for (let k = 0; k <= nb * 4; k++) { const q = pos(o.Tp + k * o.tau / 4); k ? g.lineTo(q.bx, q.by) : g.moveTo(q.bx, q.by); } g.stroke(); g.restore(); });
  c.direct(() => { const g = c.ctx; for (let k = 0; k <= nb; k++) { const p = pos(o.Tp + k * o.tau); P.point(g, p.x, yc, 4); pointB(g, p.bx, p.by, 4); } });
  const p = pos(t), fini = t >= o.T1;
  if (S.t > 0 && !fini && t >= o.Tp) { const f = ((t - o.Tp) / o.tau) % 1; if (f < .35) c.direct(() => { P.etincelle(c.ctx, p.x, yc, 14, 1 - f * 2.8); P.etincelle(c.ctx, p.bx, p.by, 14, 1 - f * 2.8); }); }
  c.direct(() => P.autoporteur(c.ctx, p.x, yc, r, { b: true, angle: p.a, alpha: fini ? .35 : 1 }));
  c.repere('autoporteur', p.x - r, yc - r, 2 * r, 2 * r, 'l’autoporteur');
  return { pos, p, x0, x1, yc, r, nb, fini, t, L, pt };
}

const MRo = { lance: .5, trace: 1, A: 7, B: 9 };
function dessinerRotation(c, S, sc) {
  const t0 = S.t <= 0 ? 99 : S.t;
  const R = autoporteurLance(c, S, sc, { T0: MRo.lance, T1: MRo.A, Tp: MRo.trace, tau: .15, courbe: true, angle: u => -Math.PI / 2 + u * TAU / 1.2,
    lueurs: (x0, x1, yc) => {
      if (S.t > 0 && S.a('A')) lueur(c, x0 - 12, yc - 11, x1 - x0 + 24, 22, { vive: !S.a('B') });
      if (S.t > 0 && S.a('B')) lueur(c, x0 - 50, yc - 48, x1 - x0 + 100, 96, { vive: true, couleur: '251, 146, 60', r: 30 });
    } });
  const { p, x0, x1, yc, r, L, pt } = R;
  c.repere('A', p.x - 10, yc - 10, 20, 20, 'l’éclateur A, au centre');
  c.repere('B', p.bx - 9, p.by - 9, 18, 18, 'l’éclateur B, au bord');
  if (R.nb >= 0) { c.repere('traceA', x0 - 10, yc - 10, x1 - x0 + 20, 20, 'la trace de A'); c.repere('traceB', x0 - 44, yc - 44, x1 - x0 + 88, 88, 'la trace de B'); }
  legende(c, S, sc, 'lance', 'trace', 'lancé en tournant sur lui-même');
  const xr = L * .5;
  if (pt) {
    const der = !S.conclusions ? null : (S.t <= 0 || S.a('B')) ? 'B' : S.a('A') ? 'A' : null;
    if (der === 'A') { S.ecrit(c, 'A'); c.texte('A : points alignés, à pas égaux', xr, 386, { couleur: 'jaune', taille: 30, gras: true, max: L - xr - 10 }); }
    if (der === 'B') { if (S.t > 0) S.ecrit(c, 'B'); c.texte('B : des boucles', xr, 386, { couleur: 'orange', taille: 30, gras: true, max: L - xr - 10 }); }
  } else panneau(c, S, sc, xr, 336, L - xr - 14, [
    { m: 'A', t: 'A : points alignés, à pas égaux', c: 'jaune', g: true, r: 'l_A', conclusion: true },
    { m: 'B', t: 'B : des boucles', c: 'orange', g: true, r: 'l_B', conclusion: true },
  ], { dy: 42, taille: 21 });
  void t0;
}
/** La légende sous la table : ce qu'on fait (moment m1), puis les deux éclateurs (moment m2). */
function legende(c, S, sc, m1, m2, quoi, nomA = 'A : éclateur du centre') {
  const pt = sc.petit, x = 24;
  if (pt) {
    if (S.t <= 0 || S.ecrit(c, m2)) { c.direct(() => { P.point(c.ctx, x + 6, 330, 6); pointB(c.ctx, x + 6, 380, 6); }); c.texte(nomA.split(' : ')[0] + ' : centre', x + 22, 342, { couleur: 'rouge', taille: 30, gras: true }); c.texte('B : bord', x + 22, 392, { couleur: 'orange', taille: 30, gras: true }); }
    return;
  }
  if (S.t <= 0 || S.ecrit(c, m1)) c.texte(quoi, x, 322, { couleur: 'blanc', taille: 20, max: sc.L * .5 - 40 });
  if (S.t <= 0 || S.ecrit(c, m2)) {
    c.direct(() => { P.point(c.ctx, x + 6, 352, 5); pointB(c.ctx, x + 6, 388, 5); });
