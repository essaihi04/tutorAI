<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Appliquer le principe d’inertie — au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="/media/simulations/physics/tc_mouvement_inertie-tableau/mvt.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Appliquer le principe d’inertie : une grue monte un bloc de béton à vitesse constante (système, forces P et T, mouvement rectiligne uniforme, T = P = m·g) ; un seau d’eau monté à vitesse constante dans un puits"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start pause resume play_until">Lancer</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="/media/simulations/shared/lexique/lexique-physique.js"></script>
<script src="/media/simulations/shared/lexique/lexique-maths.js"></script>
<script src="/media/simulations/physics/tc_mouvement_inertie-tableau/commun.js"></script>
<script>
/*
 * Appliquer le principe d'inertie (diapos mi_i10_grue, mi_i11_eleve). Contrat : docs/tcf/ARCHITECTURE_tc_phys_mouvement_inertie.md.
 *  ?vue=methode : la grue monte un bloc de béton (m = 1 500 kg) à vitesse constante. Méthode en 4 étapes :
 *                 1) système {bloc} ; 2) forces P⃗ (rouge) et T⃗ (orange) ; 3) G en MRU → principe d'inertie dans le
 *                 référentiel terrestre (galiléen) : P⃗ + T⃗ = 0⃗ ; 4) T = P = m·g = 1 500 × 10 = 1,5 × 10⁴ N.
 *                 Moments : monte 0,5 ; systeme 3 ; forces 5 ; mru 7 ; principe 9 ; calcul 11 ; fin 13.
 *  ?vue=eleve   : un seau d'eau (m = 8 kg) monté à vitesse constante dans un puits : T = P = 80 N.
 *                 Moments : monte 0,5 ; forces 3 ; calcul 5 ; fin 7. `conclusions:false` cache T⃗ et le calcul.
 * Le bloc monte à vitesse constante pendant toute la scène (montée de 12 px/s au tableau, seau 25,4 px/s).
 */
const { P, lueur, panneau, vecteur, HEX, TAU, ME: MECA } = window.Mvt;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/** Un câble d'acier (peint) de (x1, y1) à (x2, y2). */
function cable(g, x1, y1, x2, y2, e = 2.6) {
  g.save(); g.lineCap = 'round';
  g.strokeStyle = '#1f2937'; g.lineWidth = e; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
  g.strokeStyle = 'rgba(226,232,240,.55)'; g.lineWidth = e * .35; g.beginPath(); g.moveTo(x1 + .6, y1); g.lineTo(x2 + .6, y2); g.stroke();
  g.restore();
}
/** Le crochet de la grue (acier) dont la pointe est en (x, y). */
function crochet(g, x, y) {
  g.save();
  g.fillStyle = '#facc15'; g.beginPath(); g.roundRect(x - 9, y - 22, 18, 12, 3); g.fill();
  g.strokeStyle = '#475569'; g.lineWidth = 4; g.beginPath(); g.moveTo(x, y - 10); g.lineTo(x, y - 4); g.arc(x - 5, y - 4, 5, 0, Math.PI * .9); g.stroke();
  g.restore();
}
/** Une corde de chanvre (peinte). */
function corde(g, x1, y1, x2, y2) {
  g.save(); g.lineCap = 'round'; g.strokeStyle = '#a16207'; g.lineWidth = 3.2; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
  g.strokeStyle = 'rgba(254,243,199,.6)'; g.lineWidth = 1; g.setLineDash([3, 4]); g.beginPath(); g.moveTo(x1 + .8, y1); g.lineTo(x2 + .8, y2); g.stroke(); g.restore();
}

/* ── vue méthode : la grue ── */
const MM = { monte: .5, systeme: 3, forces: 5, mru: 7, principe: 9, calcul: 11 };
const VB = 12, BW = 120, BH = 64;
const ybBloc = t => 398 - VB * (clamp(t, MM.monte, 13) - MM.monte);
function dessinerMethode(c, S, sc) {
  const L = sc.L, pt = sc.petit, t = S.t <= 0 ? 99 : S.t;
  let ch;
  c.direct(() => { const g = c.ctx; P.sol(g, 0, 400, L, 20); ch = P.grue(g, 110, 400, 330, 300); });
  c.repere('grue', 60, 40, 360, 360, 'la grue');
  const xb = ch[0], yb = ybBloc(t), top = yb - BH, crx = top - 24, G = [xb, top + BH / 2];
  c.direct(() => {
    const g = c.ctx;
    cable(g, xb, ch[1], xb, crx - 20);
    crochet(g, xb, crx);
    g.strokeStyle = '#334155'; g.lineWidth = 2; g.beginPath(); g.moveTo(xb - 5, crx - 2); g.lineTo(xb - BW / 2 + 12, top); g.moveTo(xb - 5, crx - 2); g.lineTo(xb + BW / 2 - 12, top); g.stroke();
    P.bloc(g, xb - BW / 2, yb, BW, BH);
  });
  c.repere('bloc', xb - BW / 2, top, BW, BH, 'le bloc de béton, m = 1 500 kg');
  if (S.t > 0 && S.a('monte') && !S.a('systeme')) c.fleche(xb + BW / 2 + 24, top + 50, xb + BW / 2 + 24, top - 10, { couleur: 'vert', largeur: 2.6, duree: .15 });
  // 1) le système
  if (S.t <= 0 || S.ecrit(c, 'systeme')) {
    if (S.t > 0 && !S.a('forces')) lueur(c, xb - BW / 2 - 8, top - 8, BW + 16, BH + 16, { vive: true });
    c.repere('systeme', xb - BW / 2 - 8, top - 8, BW + 16, BH + 16, 'le système : le bloc');
  }
  // 2) les forces
  const lg = 70;
  if (S.t <= 0 || S.ecrit(c, 'forces')) {
    c.direct(() => P.G(c.ctx, G[0], G[1], 4.5));
    vecteur(c, G[0] - 4, G[1], G[0] - 4, G[1] + lg, { couleur: MECA.P, nom: 'P', nx: G[0] - 42, ny: G[1] + lg - 2, taille: pt ? 30 : 24, point: false });
    c.repere('P', G[0] - 46, G[1], 50, lg + 4, 'le poids P du bloc, vers le bas');
    vecteur(c, xb + 4, top, xb + 4, top - lg, { couleur: MECA.T, nom: 'T', nx: xb + 16, ny: top - lg + 22, taille: pt ? 30 : 24 });
    c.repere('T', xb - 4, top - lg - 4, 50, lg + 4, 'la tension T du câble, vers le haut');
  }
  // 3) G en MRU : ses positions toutes les 2 s, à distances égales, allumées une à une
  if (S.t <= 0 || S.a('mru')) {
    const xm = xb - BW / 2 - 30, yG = tt => ybBloc(tt) - BH / 2, ts = [1, 3, 5, 7];
    c.direct(() => ts.forEach(tt => P.G(c.ctx, xm, yG(tt), 4)));
    if (S.t > 0) for (let i = 0; i < 3; i++) if (t >= MM.mru + i * .5) lueur(c, xm - 7, yG(ts[i + 1]) + 4, 14, yG(ts[i]) - yG(ts[i + 1]) - 8, { vive: t < MM.mru + (i + 1) * .5 && t < MM.principe, r: 5, numero: pt ? null : i + 1, nx: xm - 14, ny: (yG(ts[i]) + yG(ts[i + 1])) / 2 + 6, align: 'right', taille: 18 });
    c.repere('positions', xm - 12, yG(7) - 6, 24, yG(1) - yG(7) + 12, 'les positions de G toutes les 2 s : distances égales');
  }
  const x = Math.max(450, L - 392);
  panneau(c, S, sc, x, 44, L - x - 12, [
    { m: 'monte', t: 'm = 1 500 kg ; g = 10 N/kg', c: 'blanc', r: 'donnees' },
    { m: 'systeme', t: '1) Système : {le bloc}', c: 'jaune', g: true, r: 'l_systeme' },
    { m: 'forces', t: '2) Forces : ^P (poids), ^T (tension)', c: 'blanc', r: 'l_forces' },
    { m: 'mru', t: '3) Mouvement de G : MRU', c: 'vert', g: true, r: 'l_mru' },
    { m: 'principe', t: 'réf. terrestre (galiléen) : principe', c: 'blanc', r: 'l_principe' },
    { m: 'principe', t: 'd’inertie : ^P + ^T = ^0', c: 'vert', g: true, r: 'somme' },
    { m: 'calcul', t: '4) T = P = m·g', c: 'jaune', g: true, r: 'relation' },
    { m: 'calcul', t: 'T = 1 500 × 10 = 1,5 × 10⁴ N', c: 'vert', g: true, taille: 22, r: 'calcul' },
  ], { dy: 42, taille: 20, px: x - 10, py: 60, pw: L - x - 4, petit: 1 });
}

/* ── vue élève : le seau du puits ── */
const ME = { monte: .5, forces: 3, calcul: 5 };
const ybSeau = t => 395 - 25.4 * (clamp(t, ME.monte, 7) - ME.monte);
function dessinerEleve(c, S, sc) {
  const L = sc.L, pt = sc.petit, t = S.t <= 0 ? 99 : S.t, xp = 230, sol = 300, sw = 60;
  const yb = ybSeau(t), hs = sw * .9, G = [xp, yb - hs / 2];
  let att;
  c.direct(() => {
    const g = c.ctx;
    // la terre (coupe) et le puits
    let gr = g.createLinearGradient(0, sol, 0, 420); gr.addColorStop(0, '#a16207'); gr.addColorStop(1, '#451a03');
    g.fillStyle = gr; g.fillRect(0, sol, 470, 112);
    gr = g.createLinearGradient(175, 0, 285, 0); gr.addColorStop(0, '#0c0a09'); gr.addColorStop(.5, '#292524'); gr.addColorStop(1, '#0c0a09');
    g.fillStyle = gr; g.fillRect(175, sol, 110, 112);
    g.strokeStyle = 'rgba(168,162,158,.35)'; g.lineWidth = 1; for (let y = sol + 12; y < 412; y += 14) { g.beginPath(); g.moveTo(175, y); g.lineTo(181, y); g.moveTo(279, y); g.lineTo(285, y); g.stroke(); }
    gr = g.createLinearGradient(0, 396, 0, 412); gr.addColorStop(0, '#38bdf8'); gr.addColorStop(1, '#0c4a6e'); g.fillStyle = gr; g.fillRect(175, 396, 110, 16);
    // le seau, puis sa corde
    att = P.seau(g, xp, yb, sw);
    corde(g, xp, 90, att[0], att[1]);
    // la margelle (devant), les montants et le treuil
    P.margelle(g, xp, sol, 190);
    gr = g.createLinearGradient(0, 0, 14, 0);
    for (const px of [146, 302]) { const gw = g.createLinearGradient(px, 0, px + 12, 0); gw.addColorStop(0, '#92400e'); gw.addColorStop(.5, '#d97706'); gw.addColorStop(1, '#78350f'); g.fillStyle = gw; g.fillRect(px, 66, 12, 204); }
    const gl = g.createLinearGradient(0, 72, 0, 90); gl.addColorStop(0, '#fcd34d'); gl.addColorStop(.5, '#b45309'); gl.addColorStop(1, '#78350f');
    g.fillStyle = gl; g.beginPath(); g.roundRect(136, 72, 196, 18, 8); g.fill();
    g.strokeStyle = '#78350f'; g.lineWidth = 3; g.beginPath(); g.moveTo(332, 81); g.lineTo(352, 81); g.lineTo(352, 110); g.stroke();
    g.strokeStyle = 'rgba(161,98,7,.9)'; g.lineWidth = 2; for (let k = 0; k < 5; k++) { g.beginPath(); g.moveTo(205 + k * 12, 73); g.lineTo(209 + k * 12, 89); g.stroke(); }
  });
  c.repere('puits', 135, 270, 190, 142, 'le puits et sa margelle');
  c.repere('seau', xp - sw / 2, yb - hs, sw, hs, 'le seau d’eau, m = 8 kg');
  if (S.t > 0 && S.a('monte') && !S.a('forces')) c.fleche(xp + sw / 2 + 30, yb - 10, xp + sw / 2 + 30, yb - 70, { couleur: 'vert', largeur: 2.6, duree: .15 });
  const lg = 50;
  if (S.t <= 0 || S.ecrit(c, 'forces')) {
    c.direct(() => P.G(c.ctx, G[0], G[1], 4));
    vecteur(c, G[0] - 4, G[1], G[0] - 4, G[1] + lg, { couleur: MECA.P, nom: 'P', nx: G[0] - 40, ny: G[1] + lg - 2, taille: pt ? 30 : 24, point: false });
    c.repere('P', G[0] - 44, G[1], 50, lg + 4, 'le poids P du seau, vers le bas');
    if (S.conclusions) {
      vecteur(c, att[0] + 4, att[1], att[0] + 4, att[1] - lg, { couleur: MECA.T, nom: 'T', nx: att[0] + 16, ny: att[1] - lg + 22, taille: pt ? 30 : 24 });
      c.repere('T', att[0] - 4, att[1] - lg - 4, 50, lg + 4, 'la tension T de la corde, vers le haut');
    }
  }
  const x = Math.max(410, L - 392);
  panneau(c, S, sc, x, 50, L - x - 12, [
    { m: 'monte', t: 'm = 8 kg ; g = 10 N/kg', c: 'blanc', r: 'donnees' },
    { m: 'monte', t: 'il monte à vitesse constante', c: 'blanc' },
    { m: 'forces', t: 'Système : {le seau d’eau}', c: 'jaune', g: true, r: 'systeme' },
    { m: 'forces', t: 'MRU : ^P + ^T = ^0', c: 'vert', g: true, r: 'somme', conclusion: true },
    { m: 'calcul', t: 'T = P = m·g', c: 'jaune', g: true, r: 'relation', conclusion: true },
    { m: 'calcul', t: 'T = 8 × 10 = 80 N', c: 'vert', g: true, taille: 24, r: 'calcul', conclusion: true },
  ], { dy: 46, taille: 21, px: x - 10, py: 60, pw: L - x - 4 });
}

window.Mvt.vues('tc_mi_grue', {
  methode: { titre: 'Appliquer le principe d’inertie : la grue', moments: MM, fin: 13, dessiner: dessinerMethode,
    motifs: { monte: 'la grue monte le bloc', systeme: '1) le système', forces: '2) les forces P et T', mru: '3) G en mouvement rectiligne uniforme', principe: 'le principe d’inertie : P + T = 0', calcul: '4) le calcul de T' },
    accueil: 'Une grue monte un bloc de béton de 1 500 kg à vitesse constante.', fini: 'T = P = m·g = 1,5 × 10⁴ N.',
    voir: S => ['Une grue jaune ; un bloc de béton de 1 500 kg pend à son câble et monte lentement à vitesse constante.', S.a('monte') && 'Données écrites : m = 1 500 kg, g = 10 N/kg.', S.a('systeme') && '1) Système : le bloc (allumé).', S.a('forces') && '2) P⃗ rouge en G vers le bas, T⃗ orange vers le haut le long du câble, même longueur.', S.a('mru') && '3) Les positions de G toutes les 2 s : trois intervalles égaux allumés un à un ; G en mouvement rectiligne uniforme.', S.a('principe') && 'Référentiel terrestre (galiléen), principe d’inertie : P⃗ + T⃗ = 0⃗.', S.a('calcul') && '4) T = P = m·g = 1 500 × 10 = 1,5 × 10⁴ N.'].filter(Boolean).join(' '),
    texte: 'Méthode : 1) système {bloc} ; 2) forces : poids P et tension T du câble ; 3) G en mouvement rectiligne uniforme, donc dans le référentiel terrestre (galiléen) P + T = 0 ; 4) T = P = m·g = 1 500 × 10 = 1,5 × 10⁴ N.' },
  eleve: { titre: 'À toi : le seau du puits', moments: ME, fin: 7, dessiner: dessinerEleve,
    motifs: { monte: 'le seau monte à vitesse constante', forces: 'les forces', calcul: 'le calcul de T' },
    accueil: 'Un seau d’eau de 8 kg monté à vitesse constante.', fini: 'T = P = m·g = 80 N.',
    voir: S => ['Un puits (coupe) avec sa margelle de pierre et un treuil ; un seau d’eau de 8 kg monte au bout d’une corde.', S.a('monte') && 'Écrit : m = 8 kg, g = 10 N/kg ; il monte à vitesse constante.', S.a('forces') && ('Système : le seau d’eau. P⃗ rouge en G vers le bas.' + (S.conclusions ? ' T⃗ orange vers le haut le long de la corde ; P⃗ + T⃗ = 0⃗.' : ' T⃗ n’est pas dessinée.')), S.a('calcul') && (S.conclusions ? 'T = P = m·g = 8 × 10 = 80 N.' : 'Le calcul n’est pas écrit.')].filter(Boolean).join(' '),
    texte: 'Un seau d’eau de masse 8 kg est monté à vitesse constante dans un puits. Système {seau} ; forces P et T ; mouvement rectiligne uniforme : P + T = 0, donc T = P = m·g = 8 × 10 = 80 N.' },
});
</script>
<script src="/media/simulations/professor-locate.js" defer></script>
</body></html>
