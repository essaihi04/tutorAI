<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exercices du national joués pas à pas — au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="ondes.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Exercice du national rejoué : le phénomène se produit, puis chaque lecture et chaque calcul apparaît à son étape"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start pause resume play_until">Lancer</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="eau.js"></script>
<script src="commun.js"></script>
<script>
/*
 * Les exercices du national du chapitre « Ondes mécaniques progressives périodiques », joués pas à pas
 * (2ᵉ passe du 18 novembre 2026, professeur règle 41, simulations-au-tableau règle 14) : la figure de l’examen n’est
 * plus montrée finie ; le phénomène se produit d’abord (l’onde part de S, le spot de l’oscilloscope trace la courbe),
 * puis chaque lecture et chaque calcul s’écrit à SON instant. Rien d’une étape n’est écrit avant elle : le tuteur fige la
 * scène juste avant le résultat (`play_until`), l’élève répond, puis la scène continue.
 *
 * Vues (?vue=) — valeurs de l’examen :
 *   oscillo : oscillogramme à deux voies, S_H = 0,1 ms/div, une période = 5 divisions (T = 0,5 ms, N = 2000 Hz).
 *   2017    : national 2017 N, coupe de la surface de l’eau, N = 50 Hz, λ = 4 cm, v = 2 m/s, front à 6 cm à t = 0,03 s,
 *             puis M reprend le mouvement de S avec 30 ms de retard : y_M(t) = y_S(t − 0,03).
 *   2020    : national 2020 N, rides circulaires, 1 cm couvre 2 λ, v = 0,25 m/s → λ = 0,5 cm, N = 50 Hz,
 *             d = 5 cm → τ = 0,2 s ; puis une ouverture de largeur voisine de λ : l’onde diffractée garde N, λ et v.
 *   2022    : national 2022 R, M à L = 2,5 cm de S : l’onde part de S, atteint M, le spot trace y_M(t) ;
 *             τ = 10 ms, T = 20 ms, a = 6 mm, N = 50 Hz, v = 2,5 m/s, λ = 5 cm.
 * Règle 50 (21 novembre 2026) : chaque lecture et chaque calcul commence par le numéro de la question du sujet
 * (2022 R : « 2 : τ », « 1 : T, N », « 3 : v », « 4 : λ » ; 2017 N : « 1 » à « 4 » ; 2020 N : « II-1 » à « II-3 », « I-4 »).
 * ?depart=<moment> : la page s’ouvre figée sur cet instant (une diapositive qui continue l’exercice), `reset` y revient.
 * set_parameters {conclusions: false} : aucune valeur ni conclusion écrite (question d’observation), true les rend.
 * Le temps de la scène est un ralenti : quelques millisecondes réelles par seconde d’écran (dit dans la bulle).
 */
const { fr, bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const VUES = ['oscillo', '2017', '2020', '2022'];
const vue = VUES.includes(Q.get('vue')) ? Q.get('vue') : '2017';
const E = window.EauPeinte;
const S = { t: 0, running: false, jusqua: null, motif: '', fait: false, emis: 0, conclusions: true };
const borne = (x, a, b) => Math.max(a, Math.min(b, x));
const lin = (t, t0, t1, v0, v1) => v0 + (v1 - v0) * borne((t - t0) / (t1 - t0), 0, 1);
/* La simulation d’abord (18 novembre 2026) : cadre large (scene.L), textes à leur taille RÉELLE (au moins 15,5 px à
 * l’écran : TX, et TF pour une fraction dont les étages sont écrits à 0,78 × la taille) ; les colonnes de calculs se
 * placent à droite du dessin d’après leur largeur mesurée, les lignes s’espacent selon leur hauteur réelle — rien ne se
 * chevauche, sur un grand écran comme sur un téléphone en paysage. */
const TX = n => Math.max(15.5 / (scene.s || 1), Math.min(n, 26 / (scene.s || 1)));        // 15,5 à 26 px à l’écran
const TF = n => Math.max(15.5 / 0.78 / (scene.s || 1), Math.min(n, 30 / (scene.s || 1)));
const aFraction = s => String(s).includes('⟦');
/** Une colonne de lignes (positions fixes, qu’elles soient écrites ou pas encore) : [{ s, couleur, taille, voir, rep: [id, nom] }]. */
function pile(c, x, y, lignes, o = {}) {
  let yy = y;
  for (const l of lignes) {
    if (l.cache) continue;
    const sz = aFraction(l.s) ? TF(l.taille || 18) : TX(l.taille || 18), E = aFraction(l.s) ? window.OndesTableau.etages(c, sz, l.s) : { T: sz, haut: 0, bas: 0 };
    yy += E.haut + 0.95 * E.T;
    if (l.voir !== false) {
      c.texte(l.s, x, yy, { couleur: l.couleur || 'vert', taille: sz, align: o.align });
      if (l.rep) { const w = c.largeurTexte(l.s, sz); c.repere(l.rep[0], (o.align === 'right' ? x - w : x) - 6, yy - 0.95 * E.T - E.haut - 4, w + 12, E.T * 1.25 + E.haut + E.bas + 8, l.rep[1]); }
    }
    yy += E.bas + E.T * (o.inter ?? 0.42);
  }
  return yy;
}
const largeurPile = (c, lignes) => Math.max(0, ...lignes.filter(l => !l.cache).map(l => c.largeurTexte(l.s, aFraction(l.s) ? TF(l.taille || 18) : TX(l.taille || 18))));

/* ─────────────────────────── Les vues ─────────────────────────── */
const V = {
  /* ── Oscillogramme : le spot trace les deux voies, puis on compte, puis on calcule ── */
  oscillo: {
    titre: 'Oscillogramme à deux voies (0,1 ms/div)',
    M: { trace: 5.3, cretes: 6.1, divisions: 7.4, relation: 8.1, periode: 8.9, frequence: 9.7 }, fin: 9.9,
    motifs: { trace: 'les deux courbes sont tracées', cretes: 'deux crêtes voisines de la voie 1', divisions: 'les divisions d’une période, comptées',
      relation: 'la relation T = n × S_H', periode: 'T calculée', frequence: 'N calculée' },
    resultats: ['periode', 'frequence'],
    dessiner(c) {
      const t = TX(20), col = [
        { s: 'S_H = 0,1 ms/div', couleur: 'jaune', taille: 23, rep: ['sensibilite', 'la sensibilité horizontale : 0,1 ms par division'] },
        { s: 'T = n × S_H', couleur: 'blanc', taille: 23, voir: vu('relation'), rep: ['relation', 'T = n × S_H'] },
        { s: 'T = 5 × 0,1 ms', taille: 23, voir: montre('periode'), rep: ['calcul', 'T = 5 × 0,1 ms = 0,5 ms'] },
        { s: 'T = 0,5 ms', taille: 23, voir: montre('periode') },
        { s: 'T = 5×10⁻⁴ s', taille: 23, voir: montre('periode') },
        { s: 'N = ⟦1|T⟧ = 2000 Hz', taille: 23, voir: montre('frequence'), rep: ['frequence', 'N = 1/T = 2000 Hz'] }];
      const wc = largeurPile(c, col), wO = Math.max(380, Math.min(scene.L - 50 - wc - 50, 640));
      const O = { x: 50, y: 40, w: wO, h: Math.min(320, 412 - 40 - 2.4 * t - 16), nx: 10, ny: 8 }, DX = O.w / O.nx, DY = O.h / O.ny, yc = O.y + O.h / 2;
      const f1 = d => yc - 2.5 * DY * Math.sin(2 * Math.PI * d / 5), f2 = d => yc - 1.5 * DY * Math.sin(2 * Math.PI * (d - 1) / 5);
      const b1 = borne((S.t - 0.4) / 2.4, 0, 1), b2 = borne((S.t - 3.0) / 2.2, 0, 1);
      const xt = Math.max(O.x + O.w + 30, scene.L - wc - 16), yN = O.y + O.h + 14 + 0.95 * t;
      c.direct(() => {
        const ctx = c.ctx;
        peindreEcran(ctx, O, DX, DY);
        c.repere('ecran', O.x, O.y, O.w, O.h, 'l’écran de l’oscilloscope');
        c.texte('t', O.x + O.w + 14, O.y + O.h + 0.35 * t, { couleur: 'blanc', taille: t });
        spot(ctx, d => f1(d), O, DX, b1, '#22d3ee');
        spot(ctx, d => f2(d), O, DX, b2, '#fb923c');
        if (b1 > 0) c.texte('voie 1', O.x + 8, O.y + 4 + 0.95 * t, { couleur: 'cyan', taille: t });
        if (b2 > 0) c.texte('voie 2', O.x + 8, O.y + O.h - 8, { couleur: 'orange', taille: t });
        c.repere('courbe_1', O.x, yc - 2.5 * DY - 6, O.w, 5 * DY + 12, 'la courbe de la voie 1');
        const xa = O.x + 1.25 * DX, xb = O.x + 6.25 * DX;
        if (vu('cretes')) {
          for (const x of [xa, xb]) c.ligne(x, yc - 2.5 * DY - 4, x, O.y + O.h + 4, { couleur: 'jaune', largeur: 1.6, pointille: [5, 4] });
          c.repere('cretes', xa - 8, O.y, xb - xa + 16, O.h, 'deux crêtes voisines : une période');
        }
        if (S.t >= M().cretes + 0.2) {   // les divisions se comptent une à une, de cretes à divisions
          const n = Math.min(5, Math.floor(lin(S.t, M().cretes + 0.2, M().divisions, 0, 5.999)));
          for (let k = 1; k <= n; k++) c.texte(String(k), xa + (k - 0.5) * DX, yN, { couleur: 'jaune', taille: t, align: 'center' });
          if (vu('divisions')) {
            c.texte('une période : 5 div', xb + 12, yN, { couleur: 'jaune', taille: t });
            c.repere('periode', xa, O.y, xb - xa, O.h + 2 * t, 'une période : 5 divisions');
          }
        }
        pile(c, xt, O.y - 4, col);
      });
    },
    voir() {
      const m = ['Écran d’oscilloscope 10 × 8 divisions, sensibilité horizontale 0,1 ms/div.'];
      const b1 = borne((S.t - 0.4) / 2.4, 0, 1), b2 = borne((S.t - 3.0) / 2.2, 0, 1);
      if (b1 > 0 && b1 < 1) m.push('Le spot trace la voie 1.'); if (b1 >= 1) m.push('Voie 1 (cyan) : une sinusoïde, 5 divisions par période.');
      if (b2 > 0 && b2 < 1) m.push('Le spot trace la voie 2.'); if (b2 >= 1) m.push('Voie 2 (orange) : plus petite, décalée d’une division.');
      if (vu('cretes')) m.push('Pointillés jaunes sur deux crêtes voisines de la voie 1.');
      if (vu('divisions')) m.push('Divisions numérotées 1 à 5 : une période = 5 divisions.');
      if (vu('relation')) m.push('Écrit : T = n × S_H.');
      if (montre('periode')) m.push('Écrit : T = 5 × 0,1 ms = 0,5 ms = 5×10⁻⁴ s.');
      if (montre('frequence')) m.push('Écrit : N = 1/T = 2000 Hz.');
      return m;
    },
    ralenti: 'balayage du spot ralenti',
  },

  /* ── National 2017 N : la coupe de l’eau ── */
  '2017': {
    titre: 'Coupe de la surface de l’eau (national 2017 N)',
    M: { onde_part: 0.9, photo: 4.6, regle: 5.5, cretes: 6.4, lambda: 7.2, front: 8.1, v: 9.0, t: 9.9, graphes: 10.6, m_demarre: 11.2, m_suit: 14.8, relation: 15.5 }, fin: 15.7,
    motifs: { onde_part: 'S commence à vibrer, l’onde part des deux côtés', photo: 'la photo : l’onde arrêtée à l’instant t', regle: 'la règle et l’échelle',
      cretes: 'deux crêtes voisines marquées', lambda: 'λ lue sur la règle', front: 'le front, à 6 cm de S', v: 'v calculée', t: 'l’instant t calculé',
      graphes: 'les élongations de S et de M en fonction du temps', m_demarre: 'M commence à bouger', m_suit: 'M refait le mouvement de S, en retard', relation: 'y_M(t) = y_S(t − 0,03)' },
    resultats: ['lambda', 'v', 't', 'relation'],
    // temps de l’onde (ms) : 0 → 30 ms pendant la propagation, arrêt (la photo), puis 30 → 52 ms quand M bouge
    tau() { return S.t < 10.8 ? lin(S.t, 0.5, 4.5, 0, 30) : lin(S.t, 10.8, 14.8, 30, 52); },
    dessiner(c) {
      const compact = c.W < 700 || c.H < 250, t = TX(19), xs = scene.L / 2, k = 34, A = 24, xg = 9.3, tau = this.tau();
      const ys = A + 22 + 0.95 * TX(19) + 6 + (compact ? 0 : 1.3 * TX(18)), bas = ys + 62;   // la coupe monte sous le titre (le titre se tait sur téléphone)
      const yS = t => (t <= 0 ? 0 : Math.sin(2 * Math.PI * t / 20));
      const f = x => yS(tau - Math.abs(x) / 0.2);             // x en cm, v = 0,2 cm/ms, T = 20 ms
      const yr = bas + 6, yN = yr + 26 + 0.95 * t, yb = yN + 0.75 * t;
      const calc = [
        { s: '2 : v = λ·N = 4×10⁻² × 50 = 2 m/s', taille: 22, voir: montre('v'), rep: ['calcul_v', 'v = 2 m/s'] },
        { s: '3 : t = ⟦SM|v⟧ = ⟦6×10⁻²|2⟧ = 0,03 s', taille: 22, voir: montre('t'), rep: ['calcul_t', 't = 0,03 s'] }];
      c.direct(() => {
        const ctx = c.ctx;
        c.texte('Coupe verticale de la surface de l’eau', 20, 4 + 0.95 * TX(18), { couleur: 'cyan', taille: TX(18) });
        E.cote(ctx, { x0: xs - xg * k, x1: xs + xg * k, y: ys, bas, k: A }, px => f((px - xs) / k), 380);
        E.tige(ctx, xs, ys - 70, ys - A * f(0), 5);
        c.texte('S', xs + 10, ys - 52, { couleur: 'blanc', taille: TX(19) });
        c.repere('point_s', xs - 14, ys - 72, 34, 80, 'la source S');
        c.repere('surface', xs - xg * k, ys - A - 8, 2 * xg * k, 2 * A + 16, 'la surface de l’eau');
        if (vu('photo') && !vu('graphes')) c.texte('photo à l’instant t', scene.L - 10, 4 + 0.95 * t, { couleur: 'jaune', taille: t, align: 'right' });
        if (vu('regle')) {
          regleBois(ctx, xs - 9 * k - 6, xs + 9 * k + 6, yr, k, xs - 9 * k);
          const un = k < c.largeurTexte('18', t) + 6;   // pas la place pour tous les nombres : un sur deux
          for (let i = 0; i <= 18; i++) if (!un || i % 2 === 0) c.texte(String(i), xs + (i - 9) * k, yN, { couleur: 'blanc', taille: t, align: 'center' });
          c.repere('regle', xs - 9 * k, yr, 18 * k, 24, 'la règle graduée');
          c.repere('echelle', xs + 7 * k - 4, yr - 2, k + 8, 28, 'l’échelle : 1 cm entre deux nombres de la règle');
        }
        const xa = xs + 1 * k, xb = xs + 5 * k;
        if (vu('cretes')) {
          for (const x of [xa, xb]) c.ligne(x, ys - A - 2, x, ys - A - 20, { couleur: 'jaune', largeur: 1.5, pointille: [4, 4] });
          c.cote(xa, ys - A - 14, xb, ys - A - 14, '', { couleur: 'jaune' });
          c.texte(montre('lambda') ? '1 : λ = 4 cm' : '1 : λ = ?', (xa + xb) / 2, ys - A - 22, { couleur: 'jaune', taille: TX(19), align: 'center' });
          c.repere('cretes', xa - 10, ys - A - 62, xb - xa + 20, 64, 'deux crêtes voisines');
          if (montre('lambda')) c.repere('lambda', xa, ys - A - 62, xb - xa, 34, 'λ = 4 cm');
        }
        const xf = xs + 6 * k;
        if (vu('front')) {
          c.point(xf, ys - A * f(6), 5, 'orange').texte('M', xf + 8, ys - 14, { couleur: 'orange', taille: TX(18) });
          c.ligne(xf, ys + 4, xf, yb + 4, { couleur: 'orange', largeur: 1.2, pointille: [4, 4] });
          c.cote(xs, yb, xf, yb, '', { couleur: 'orange' });
          c.texte('SM = 6 cm', xs - 10, yb + 0.35 * t, { couleur: 'orange', taille: t, align: 'right' });
          c.repere('point_m', xf - 10, ys - 34, 60, 44, 'M, au front de l’onde');
          c.repere('front', xs, yb - 12, xf - xs, 40, 'le front est à 6 cm de S');
        }
        // en bas : les calculs à gauche, les graphes à droite
        const wc = largeurPile(c, calc);
        pile(c, 20, yb + 0.6 * t + 2, calc, { inter: 0.3 });
        if (vu('graphes')) graphesSM(c, tau, montre('relation'), 20 + wc + 30, yb + 0.6 * t + 4);
      });
    },
    voir() {
      const tau = this.tau(), m = [`Coupe de la surface de l’eau, S au milieu ; l’onde part de S des deux côtés (temps de l’onde : ${fr(tau, 0)} ms, front à ${fr(Math.min(9.3, 0.2 * tau), 1)} cm de S).`];
      if (vu('photo')) m.push('Arrêt : la photo à l’instant t.');
      if (vu('regle')) m.push('Une règle graduée en cm sous l’eau, échelle 1 cm.');
      if (vu('cretes')) m.push(`Deux crêtes voisines marquées en jaune : ${montre('lambda') ? 'λ = 4 cm' : 'λ = ? (pas encore lue)'}.`);
      if (vu('front')) m.push('M au front de l’onde, cote SM = 6 cm.');
      if (montre('v')) m.push('Écrit : v = λ·N = 2 m/s.');
      if (montre('t')) m.push('Écrit : t = SM/v = 0,03 s.');
      if (vu('graphes')) m.push(`En bas à droite, y_S(t) (orange) et y_M(t) (cyan) jusqu’à ${fr(tau, 0)} ms : M reste au repos jusqu’à 30 ms, puis fait le même mouvement que S.`);
      if (montre('relation')) m.push('Écrit : y_M(t) = y_S(t − 0,03).');
      return m;
    },
    ralenti: 'ralenti : environ 7 ms par seconde',
  },

  /* ── National 2020 N : rides circulaires, puis une ouverture ── */
  '2020': {
    titre: 'Rides circulaires, puis une ouverture (national 2020 N)',
    M: { onde_part: 0.9, photo: 4.6, intervalles: 5.6, lambda: 6.4, n: 7.3, retard: 8.2, obstacle: 9.1, ouverture_atteinte: 11.3, diffractee: 14.3, meme_lambda: 15.1 }, fin: 15.3,
    motifs: { onde_part: 'S vibre, les rides partent en cercles', photo: 'la photo des rides et l’échelle 1 cm', intervalles: 'les intervalles dans 1 cm', lambda: 'λ calculée',
      n: 'N calculée', retard: 'le retard τ calculé', obstacle: 'une ouverture de largeur voisine de λ', ouverture_atteinte: 'l’onde atteint l’ouverture',
      diffractee: 'l’onde après l’ouverture', meme_lambda: 'même λ avant et après l’ouverture' },
    resultats: ['lambda', 'n', 'retard', 'meme_lambda'],
    dessiner(c) {
      const t = TX(20), xs = 205, ys = 196, L = 36, phi = lin(S.t, 0.5, 4.5, 0, 4), apres = vu('obstacle');
      // à droite : la donnée et les calculs ; quand l’ouverture arrive, les calculs s’effacent (sauf λ) et la cuve à ouverture prend leur place
      const col = [
        { s: 'Donnée : v = 0,25 m/s', couleur: 'cyan' },
        { s: 'II-1 : 1 cm = 2λ', voir: montre('lambda'), rep: ['calcul_lambda', 'λ = 0,5 cm'] },
        { s: 'λ = 0,5 cm = 5×10⁻³ m', voir: montre('lambda') },
        { s: 'II-2 : N = ⟦v|λ⟧ = ⟦0,25|5×10⁻³⟧ = 50 Hz', voir: montre('n'), cache: apres, rep: ['calcul_n', 'N = 50 Hz'] },
        { s: 'd = 5 cm', voir: montre('retard'), cache: apres },
        { s: 'II-3 : τ = ⟦d|v⟧ = ⟦5×10⁻²|0,25⟧ = 0,2 s', voir: montre('retard'), cache: apres, rep: ['calcul_tau', 'τ = 0,2 s'] }];
      c.direct(() => {
        const ctx = c.ctx;
        const r = { x: xs - 4 * L - 26, y: ys - 4 * L - 26, w: 8 * L + 52, h: 8 * L + 52 };
        ctx.save(); E.chemin(ctx, r); ctx.clip(); E.fond(ctx, r, { reflets: false });
        if (phi > 0) E.rides(ctx, { forme: 'radial', x: xs, y: ys, umax: 4.6 * L, pas: 2, zone: r, onde: u => (u > phi * L ? null : { h: Math.cos(2 * Math.PI * (phi - u / L)), s: Math.cos(2 * Math.PI * (phi - u / L)) * .9 }) });
        ctx.restore();
        ctx.save(); ctx.strokeStyle = '#3d4a54'; ctx.lineWidth = 6; E.chemin(ctx, r); ctx.stroke(); ctx.restore();
        E.pointe(ctx, xs, ys, 6);
        c.texte('S', xs, ys - 12, { couleur: 'blanc', taille: TX(18), align: 'center' });
        c.repere('point_s', xs - 14, ys - 30, 28, 40, 'la source S');
        c.repere('cuve', r.x, r.y, r.w, r.h, 'la cuve vue de dessus');
        if (vu('photo')) {
          for (let k = 1; k <= 4; k++) c.cercle(xs, ys, k * L, { couleur: 'blanc', largeur: 2 });
          const yb = r.y + r.h + 10;
          c.ligne(xs + 2 * L, ys, xs + 2 * L, yb + 6, { couleur: 'faible', largeur: 1.2, pointille: [5, 5] }).ligne(xs + 4 * L, ys, xs + 4 * L, yb + 6, { couleur: 'faible', largeur: 1.2, pointille: [5, 5] });
          c.cote(xs + 2 * L, yb, xs + 4 * L, yb, '', { couleur: 'blanc' });
          c.texte('1 cm', xs + 4 * L + 10, yb + 0.35 * t, { couleur: 'blanc', taille: t });
          c.repere('cercles', xs - 4 * L, ys - 4 * L, 8 * L, 8 * L, 'les rides : des crêtes circulaires');
          c.repere('echelle', xs + 2 * L - 6, yb - 12, 2 * L + 12, 40, '1 cm');
        }
        if (vu('intervalles')) {
          c.texte('1', xs + 2.5 * L, ys - 8, { couleur: 'cyan', taille: TX(18), align: 'center' }).texte('2', xs + 3.5 * L, ys - 8, { couleur: 'cyan', taille: TX(18), align: 'center' });
          c.repere('intervalles', xs + 2 * L, ys - 28, 2 * L, 28, 'deux intervalles dans 1 cm');
        }
        const xt = Math.max(r.x + r.w + 24, Math.min(446, scene.L - 1.08 * largeurPile(c, col.map(l => ({ ...l, taille: 23 }))) - 12));
        const yFin = pile(c, xt, 6, col.map(l => ({ ...l, taille: 23 })));
        if (apres) diffraction(c, L, xt, yFin + 6);
      });
    },
    voir() {

  bulle($('feedback'), VU.ralenti + '…');
  pont.noter('play_until', { moment: nom }); pont.emettre();
}
function start() { S.jusqua = null; S.t = 0; S.running = true; S.fait = false; $('run').textContent = 'Pause'; bulle($('feedback'), VU.ralenti + '…'); pont.noter('start'); pont.emettre(); }

function reset() { S.t = DEPART; S.running = false; S.fait = false; S.jusqua = null; scene.sale = true; $('run').textContent = DEPART ? 'Reprendre' : 'Lancer'; bulle($('feedback'), DEPART ? 'On reprend l’exercice ici.' : 'Prêt.'); pont.noter('reset'); pont.emettre(); }
function setTime(p) { const t = +p.time_s; if (!Number.isFinite(t)) return; S.running = false; S.jusqua = null; S.t = borne(t, 0, VU.fin); S.fait = S.t >= VU.fin; scene.sale = true; pont.emettre(); }

}

}
