  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start reset pause resume play_until set_time set_parameters">Lancer</button>

  </footer>
</div>

<script>
/*
 * Exercices du national JOUÉS pas à pas (cours phys_ch3_ondes_lumineuses, 2ᵉ passe du 18 novembre 2026 ; professeur
 * règle 41, simulations-au-tableau règle 14). La figure de l’énoncé est redessinée puis animée avec les valeurs de
 * l’examen ; chaque étape du raisonnement a son moment ; un résultat que l’élève doit trouver n’est JAMAIS écrit avant
 * sa réponse : `?conclusions=0` (ou set_parameters {conclusions:false}) le garde caché, et il n’est écrit qu’à un
 * moment à part (pente_valeur, vitesses, indice) que la diapositive suivante joue, après la question.
 *
 * Vues (?vue=) :
 *  - 2023  : national 2023 R. Laser jaune λ₀ = 580 nm, fente HORIZONTALE (taches sur une ligne verticale), D = 1,4 m,
 *            L = 2,7 cm ; puis source rouge, mêmes a et D : L_R = 3,4 cm. (a = 2λ₀D/L ≈ 60 µm ; λ₀R ≈ 730 nm : jamais écrits.)
 *  - 2021p : national 2021 N, partie prisme. Lumière blanche → spectre ; radiation jaune (λ₀j = 589 nm dans le vide,
 *            λ_j = 355 nm dans le prisme), radiation rouge (λ_r = 474 nm, ν_r = 3,91·10¹⁴ Hz) ; les deux trains d’onde
 *            dans le verre, chacun à sa célérité exacte (v = λ·ν : 1,81·10⁸ et 1,85·10⁸ m/s).
 *  - 2021c : national 2021 N, la courbe L = f(D) : fente a = 0,06 mm, λ = 600 nm ; l’écran recule (50, 100, 150, 200 cm),
 *            chaque mesure donne un point (L = 2λD/a = 0,02·D) ; la droite ; la pente (ΔL = 4 cm, ΔD = 200 cm) ; puis le
 *            cheveu à D₁ = 2 m : L₁ = 3 cm (d = 80 µm, jamais écrit).
 *  - 2025  : national 2025 R. Dans l’air L = 2,4 cm ; même expérience dans un liquide : L’ = 1,8 cm (n = L/L’ ≈ 1,33).
 * ?depart=<moment> : la page s’ouvre figée sur cet instant (la diapositive reprend où la précédente s’est arrêtée) ;
 * `reset` y revient. Le schéma de côté exagère l’angle (c’est écrit) ; l’écran vu de face est à l’échelle (règle en cm).
 */
const { fr, bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const VUES = ['2023', '2021p', '2021c', '2025'];
const vue = VUES.includes(Q.get('vue')) ? Q.get('vue') : '2023';

const SUITES = {
  '2023': [['montage', 1.6, 'le montage de l’énoncé : laser jaune, fente horizontale, écran à 1,4 m'], ['lumiere', 3.4, 'le laser éclaire la fente : taches sur une ligne verticale'],
    ['mesure_L', 5.2, 'la largeur de la tache centrale : L = 2,7 cm'], ['triangle', 7.0, 'le triangle : θ, L/2 et D'],
    ['rouge', 9.2, 'source rouge, mêmes a et D : la tache s’élargit'], ['mesure_LR', 10.8, 'la nouvelle largeur, en rouge : 3,4 cm'], ['fin', 12.0, 'fin']],
  '2021p': [['blanche', 2.0, 'la lumière blanche traverse le prisme : un spectre sur l’écran'], ['spectre', 3.6, 'le spectre : le rouge le moins dévié, le violet le plus dévié'],
    ['jaune', 5.8, 'la radiation jaune seule : λ₀j = 589 nm dans le vide, λ_j = 355 nm dans le prisme'], ['rouge', 7.8, 'la radiation rouge : λ_r = 474 nm dans le prisme, ν_r = 3,91·10¹⁴ Hz'],
    ['course', 10.6, 'les deux ondes avancent dans le verre : le front rouge est un peu devant'], ['vitesses', 12.4, 'les deux célérités'], ['fin', 13.4, 'fin']],
  '2021c': [['axes', 1.6, 'les axes : D en cm en bas, L en cm à gauche'], ['d1', 3.4, 'écran à 50 cm : L = 1 cm, premier point'], ['d2', 5.0, 'écran à 100 cm : L = 2 cm'],
    ['d3', 6.6, 'écran à 150 cm : L = 3 cm'], ['d4', 8.2, 'écran à 200 cm : L = 4 cm'], ['droite', 9.8, 'les points sont sur une droite qui passe par l’origine'],
    ['pente', 11.6, 'deux points de la droite : l’origine et (200 cm ; 4 cm)'], ['pente_valeur', 13.4, 'la pente k'], ['cheveu', 15.4, 'un cheveu à la place de la fente : D₁ = 2 m, L₁ = 3 cm'], ['fin', 16.6, 'fin']],
  '2025': [['montage', 1.6, 'le montage : laser, fente, cuve vide, écran'], ['air', 3.4, 'dans l’air : la figure de diffraction'], ['mesure_L', 5.2, 'dans l’air : L = 2,4 cm'],
    ['liquide', 7.0, 'la cuve se remplit du liquide'], ['resserre', 8.6, 'dans le liquide, la tache se resserre'], ['mesure_Lp', 10.2, 'dans le liquide : L’ = 1,8 cm'],
    ['indice', 12.0, 'le rapport des deux largeurs'], ['fin', 13.2, 'fin']],
};
const SUITE = SUITES[vue];
const M = {}; for (const [n, t] of SUITE) M[n] = t;
const FIN = M.fin, AV = 1.4;                            // une annotation s’écrit pendant les 1,4 s qui précèdent son instant
const moments = () => ({ ...M });
const depart = Q.get('depart') in M ? Q.get('depart') : null;
const S = { t: depart ? M[depart] : 0, running: false, jusqua: null, motif: '', fait: false, emis: 0,
  conclusions: !['0', 'false'].includes(Q.get('conclusions')) };
const T0 = () => (depart ? M[depart] : 0);

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lisse = u => { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); };
const avant = n => (n in M ? M[n] - AV : Infinity);
const vu = n => n in M && S.t >= avant(n) - 1e-6;
/** Écrit `fn` à la craie au rythme de la scène, à partir du début d’écriture du moment `nom`. */
function ecrit(c, nom, fn) {
  if (!vu(nom)) return;
  const t = c.t, cur = c.cur, comp = c.complet;
  c.t = S.fait || S.t >= FIN ? Infinity : S.t; c.cur = avant(nom);
  try { fn(); } finally { c.t = t; c.cur = cur; c.complet = comp; }
}
const TX = (c, s, x, y, o = {}) => c.texte(s, x, y, { taille: 18, duree: .35, ...o });
/** Une puissance de dix écrite en trois morceaux (« 1,81·10 », « 8 » plus haut, « m/s ») : l’exposant garde lui aussi
 *  15 px à l’écran au moins (l’exposant du kit fait 62 % de la ligne). */
function TXP(c, avant, exp, apres, x, y, o = {}) {
  const e = c.echelle || 1, t = Math.max(o.taille || 18, 15 / e), te = Math.max(t * .62, 15 / e); o = { duree: .18, ...o };
  TX(c, avant, x, y, { ...o, taille: t }); const w = c.largeurTexte(avant, t);
  TX(c, exp, x + w + 1, y - t * .42, { ...o, taille: te }); const we = c.largeurTexte(exp, te);
  return TX(c, apres, x + w + we + 3, y, { ...o, taille: t });
}
/* Tableau large (téléphone en paysage, lecteur large : 18 novembre 2026, professeur règle 42) : les lignes écrites sous la
 * figure passent dans une colonne à droite, plus grandes ; la figure garde sa place. Sinon elles restent en bas. */
const XCOL = 784;
const LARGE = () => scene.L >= 960;
const B = (k, x, y) => (LARGE() ? [XCOL, 60 + k * 58] : [x, y]);
function TB(c, k, s, x, y, o = {}) {
  const [bx, by] = B(k, x, y);
  if (!LARGE()) return TX(c, s, bx, by, o);
  const t = (o.taille || 18) + 2, dispo = scene.L - XCOL - 8, oo = { ...o, align: 'left', taille: t };
  if (c.largeurTexte(s, t) <= dispo) return TX(c, s, bx, by, oo);
  // trop long pour la colonne : coupé en deux lignes au séparateur le plus proche du milieu (jamais dans une fraction)
  let best = -1;
  for (const sep of [' ; ', ', ', ' : ', ' = ', ' ']) {
    let i = -1;
    while ((i = s.indexOf(sep, i + 1)) >= 0) { const av = s.slice(0, i); if ((av.split('⟦').length === av.split('⟧').length) && (best < 0 || Math.abs(i - s.length / 2) < Math.abs(best - s.length / 2))) best = i; }
    if (best >= 0) { const l1 = s.slice(0, best + (sep === ' = ' ? 0 : sep.trimEnd().length)).trim(), l2 = (sep === ' = ' ? s.slice(best + 1) : s.slice(best + sep.length)).trim();
      const h = s.includes('⟦') ? t * 1.6 : t * 1.15;
      TX(c, l1, bx, by, { ...oo, max: dispo }); return TX(c, l2, bx + (sep === ' = ' ? 12 : 0), by + h, { ...oo, max: dispo }); }
  }
  return TX(c, s, bx, by, { ...oo, max: dispo });
}

/* ── Couleurs des radiations ─────────────────────────────────────────────────────────────── */
const JAUNE = [255, 214, 40], ROUGE = [255, 50, 40], ORANGE_R = [255, 90, 30];
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const SPECTRE = [[255, 40, 40], [255, 130, 20], [255, 225, 40], [60, 220, 80], [60, 160, 255], [80, 60, 255], [170, 70, 255]];

/* ── Peinture : objets réels (règle 7) ───────────────────────────────────────────────────── */
function chemin(ctx, x, y, w, h, r = 6) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
/* Un objet, un dessin (simulations-au-tableau règle 15) : le laser, la fente, l’écran, la cuve et le prisme ont ici
 * les couleurs et les formes de diffraction.html et prisme-dispersion.html, vus plus tôt dans le cours. */
function laser(ctx, x, y, coul, allume) {                 // boîtier ombré, ouverture qui brille de la couleur de la source
  const g = ctx.createLinearGradient(0, y - 15, 0, y + 15);
  g.addColorStop(0, '#6b7280'); g.addColorStop(.35, '#374151'); g.addColorStop(1, '#111827');
  ctx.fillStyle = g; chemin(ctx, x, y - 15, 76, 30, 5); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(x + 4, y - 13, 68, 2);
  const o = ctx.createRadialGradient(x + 76, y, 0, x + 76, y, 9);
  o.addColorStop(0, allume > 0 ? rgba(coul.map(v => Math.min(255, v + 90)), allume) : '#0b0f14'); o.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = o; ctx.beginPath(); ctx.arc(x + 76, y, 9, 0, 7); ctx.fill();
}
function faisceau(ctx, pts, coul, a, l = 3) {             // un rayon de lumière : halo + cœur
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  for (const [w, al] of [[l * 4, .12], [l * 2, .25], [l, .9]]) {
    ctx.strokeStyle = rgba(coul, al * a); ctx.lineWidth = w; ctx.beginPath(); pts.forEach(([px, py], i) => (i ? ctx.lineTo(px, py) : ctx.moveTo(px, py))); ctx.stroke();
  }
  ctx.restore();
}
function cone(ctx, x0, y0, x1, h, coul, a, vertical = true) {   // lumière qui s’étale après la fente
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createLinearGradient(x0, 0, x1, 0); g.addColorStop(0, rgba(coul, .55 * a)); g.addColorStop(1, rgba(coul, .22 * a));
  ctx.fillStyle = g; ctx.beginPath();
  if (vertical) { ctx.moveTo(x0, y0 - 1.5); ctx.lineTo(x1, y0 - h / 2); ctx.lineTo(x1, y0 + h / 2); ctx.lineTo(x0, y0 + 1.5); }
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function plaque(ctx, x, y0, y1, yc, fente = true, label) {        // plaque opaque percée d’une fente (vue de côté)
  const g = ctx.createLinearGradient(x - 4, 0, x + 4, 0); g.addColorStop(0, '#9ca3af'); g.addColorStop(.4, '#4b5563'); g.addColorStop(1, '#1f2937');
  ctx.fillStyle = g;
  if (fente) { ctx.fillRect(x - 4, y0, 8, yc - 3 - y0); ctx.fillRect(x - 4, yc + 3, 8, y1 - yc - 3); }
  else { ctx.fillRect(x - 4, y0, 8, y1 - y0); }
  void label;
}
function ecranCote(ctx, x, y0, y1) {                      // écran vu par la tranche (comme diffraction.html)
  const g = ctx.createLinearGradient(x, 0, x + 7, 0); g.addColorStop(0, '#5b6472'); g.addColorStop(.5, '#3b414c'); g.addColorStop(1, '#22262e');
  ctx.fillStyle = g; ctx.fillRect(x, y0, 7, y1 - y0);
}
/** Figure de diffraction peinte sur l’écran vu de face : [sin u / u]², éclat √I (pour l’œil), extinctions exactes. */
function figure(ctx, cx, cy, Lpx, coul, a, vertical, long = 260, epais = 34) {
  if (a <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const pas = 1.5, demi = long / 2;
  for (let s = -demi; s <= demi; s += pas) {
    const u = Math.PI * s / (Lpx / 2), I = Math.abs(u) < 1e-6 ? 1 : (Math.sin(u) / u) ** 2;
    const al = Math.sqrt(I) * a; if (al < .02) continue;
    ctx.fillStyle = rgba(coul, al);
    if (vertical) ctx.fillRect(cx - epais / 2, cy + s, epais, pas + .3); else ctx.fillRect(cx + s, cy - epais / 2, pas + .3, epais);
  }
  ctx.restore();
}
function panneau(ctx, x, y, w, h) {                       // l’écran vu de face : une surface sombre et mate
  const g = ctx.createLinearGradient(x, y, x, y + h); g.addColorStop(0, '#20242c'); g.addColorStop(.5, '#262a33'); g.addColorStop(1, '#1a1d24');
  ctx.fillStyle = g; chemin(ctx, x, y, w, h, 8); ctx.fill();
}
function prisme(ctx, P) {                                 // verre : dégradé bleuté, reflet sur une arête
  const g = ctx.createLinearGradient(P[0][0], P[0][1], P[2][0], P[2][1]);
  g.addColorStop(0, 'rgba(190,225,255,.20)'); g.addColorStop(1, 'rgba(110,160,210,.10)');
  ctx.fillStyle = g; ctx.beginPath(); P.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(230,245,255,.75)'; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(P[0][0] - 3, P[0][1] + 10); ctx.lineTo(P[1][0] + 6, P[1][1] - 18); ctx.stroke();
}
function verre(ctx, x, y, w, h) {                         // une barre de verre (le prisme « déplié » pour voir l’onde dedans)
  const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, 'rgba(200,230,255,.30)'); g.addColorStop(.5, 'rgba(120,170,220,.16)'); g.addColorStop(1, 'rgba(200,230,255,.28)');
  ctx.fillStyle = g; chemin(ctx, x, y, w, h, 5); ctx.fill(); ctx.strokeStyle = 'rgba(230,245,255,.55)'; ctx.lineWidth = 1.2; ctx.stroke();
}
function cuve(ctx, x, y, w, h, rempli) {                  // cuve de verre, liquide qui monte
  if (rempli > 0) {
    const hh = h * rempli, g = ctx.createLinearGradient(0, y + h - hh, 0, y + h);
    g.addColorStop(0, 'rgba(56,132,196,.30)'); g.addColorStop(1, 'rgba(56,132,196,.34)');
    ctx.fillStyle = g; ctx.fillRect(x + 2, y + h - hh, w - 4, hh - 2);
    ctx.strokeStyle = 'rgba(200,235,255,.7)'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(x + 2, y + h - hh); ctx.lineTo(x + w - 2, y + h - hh); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(200,230,255,.55)'; ctx.lineWidth = 2.5; ctx.strokeRect(x, y, w, h);
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1; ctx.strokeRect(x + 3, y + 3, w - 6, h - 6);
  ctx.fillStyle = 'rgba(255,255,255,.10)'; ctx.fillRect(x + 6, y + 6, 5, h - 12);
}

/* ── Vue 2023 : fente horizontale, puis source rouge ─────────────────────────────────────── */
const K23 = 26;                                           // px par cm sur l’écran vu de face (règle à l’échelle)
function L2023() {                                        // largeur de la tache (cm) à l’instant : 2,7 puis 3,4
  const u = lisse((S.t - (M.rouge - 1.5)) / 1.0);
  return 2.7 + (3.4 - 2.7) * u;
}
function couleur2023() { const u = lisse((S.t - (M.rouge - 1.7)) / .4); return JAUNE.map((v, i) => Math.round(v + (ROUGE[i] - v) * u)); }
function dessiner2023(c) {
  const ctx = c.ctx, YC = 190, XL = 26, XF = 190, XE = 450, lum = lisse((S.t - (M.lumiere - 1.6)) / .6), L = L2023(), coul = couleur2023();
  const montre = vu('montage');
  // peinture (avant la craie)
  c.direct(() => {
    if (montre) {
      laser(ctx, XL, YC, coul, lum);
      if (lum > 0) { faisceau(ctx, [[XL + 78, YC], [XF - 4, YC]], coul, lum, 2.4); cone(ctx, XF + 4, YC, XE, L * 34, coul, lum); }
      plaque(ctx, XF, 92, 288, YC); ecranCote(ctx, XE, 70, 310);
      panneau(ctx, 520, 46, 168, 300);
      figure(ctx, 590, YC, L * K23, coul, lum, true, 290, 36);
    }
  });
  ecrit(c, 'montage', () => {
    TX(c, 'Vue de côté (angle exagéré)', 26, 40, { couleur: 'faible', taille: 16 });
    TX(c, 'Écran vu de face', 604, 36, { couleur: 'faible', taille: 16, align: 'center' });
    TX(c, 'laser', XL + 2, YC - 26, { couleur: 'blanc', taille: 17 });
    TX(c, 'fente horizontale', XF - 60, 82, { couleur: 'blanc', taille: 17 });
    TX(c, 'écran', XE - 18, 62, { couleur: 'blanc', taille: 17 });
    c.cote(XF, 330, XE, 330, 'D = 1,4 m', { couleur: 'jaune', taille: 18 });
  });
  // la règle graduée (cm) le long de l’écran de face
  ecrit(c, 'montage', () => {
    c.ligne(668, YC - 5 * K23, 668, YC + 5 * K23, { couleur: 'faible', largeur: 1.4 });
    for (let k = -5; k <= 5; k++) c.ligne(663, YC + k * K23, 673, YC + k * K23, { couleur: 'faible', largeur: 1.2, duree: .02 });
    TX(c, 'cm', 676, YC - 5 * K23 + 6, { couleur: 'faible', taille: 15 });
  });
  ecrit(c, 'montage', () => {
    TB(c, 0, 'λ₀ = 580 nm (jaune)', 26, 372, { couleur: 'jaune', taille: 18 });
    TB(c, 1, 'a = ?', 26, 400, { couleur: 'rose', taille: 18 });
  });
  ecrit(c, 'mesure_L', () => { const h = 2.7 * K23 / 2; c.cote(640, YC - h, 640, YC + h, '', { couleur: 'vert' }); TB(c, 2, 'L = 2,7 cm', 604, 372, { couleur: 'vert', taille: 19, align: 'center' }); });
  ecrit(c, 'triangle', () => {
    const h = 2.7 * 17;                                   // demi-tache dans la vue de côté (exagérée)
    c.ligne(XF, YC, XE, YC, { couleur: 'faible', largeur: 1.3, pointille: [6, 6] });
    c.ligne(XF, YC, XE, YC - h, { couleur: 'jaune', largeur: 2 });
    c.ligne(XE - 8, YC, XE - 8, YC - h, { couleur: 'vert', largeur: 2 });
    TX(c, 'L/2', XE - 50, YC - h / 2 + 6, { couleur: 'vert', taille: 18 });
    c.trait([[XF + 52, YC], [XF + 51, YC - 6], [XF + 49, YC - 11]], { couleur: 'rose', largeur: 2 });
    TX(c, 'θ', XF + 58, YC - 6, { couleur: 'rose', taille: 20 });
  });
  ecrit(c, 'rouge', () => { TB(c, 3, 'source rouge : λ₀ = ?', 230, 372, { couleur: 'rouge', taille: 18 }); TB(c, 4, 'même a, même D', 230, 400, { couleur: 'faible', taille: 17 }); });
  ecrit(c, 'mesure_LR', () => { const h = 3.4 * K23 / 2; c.cote(654, YC - h, 654, YC + h, '', { couleur: 'orange' }); TB(c, 5, 'L (rouge) = 3,4 cm', 604, 402, { couleur: 'orange', taille: 19, align: 'center' }); });
  // repères
  c.direct(() => {
    if (!montre) return;
    c.repere('laser', XL, YC - 18, 80, 36, 'le laser'); c.repere('fente', XF - 10, 92, 20, 196, 'la fente horizontale');
    c.repere('ecran', XE - 4, 70, 16, 240, 'l’écran'); c.repere('vue_cote', 20, 24, 450, 300, 'la vue de côté'); c.repere('vue_face', 520, 46, 168, 300, 'l’écran vu de face');
    c.repere('D', XF, 312, XE - XF, 28, 'la distance D'); c.repere('lambda0', ...(()=>{ const [rx, ry] = B(0, 26, 372); return [rx - 4, ry - 22, 200, 28]; })(), 'λ₀ = 580 nm');
    if (vu('rouge')) c.repere('source_rouge', ...(()=>{ const [rx, ry] = B(3, 230, 372); return [rx - 4, ry - 22, 230, 28]; })(), 'la source rouge');
    if (vu('lumiere')) c.repere('taches', 570, YC - 140, 40, 280, 'les taches');
    if (vu('mesure_L')) { c.repere('L', 620, YC - 2.7 * K23 / 2 - 4, 40, 2.7 * K23 + 8, 'la largeur L'); c.repere('valeur_L', ...(()=>{ const [rx, ry] = B(2, 544, 372); return [rx - 4, ry - 22, 130, 28]; })(), 'L = 2,7 cm'); }

/* ── Vue 2021p : le prisme, puis les deux radiations dans le verre ───────────────────────── */
const PR = [[250, 46], [190, 210], [310, 210]];
const ECR = 600, BV = 400;            // BV : longueur des barres de verre (px)
const C21 = { j: { lam: 355, nu: 5.093e14, coul: JAUNE, y: 272, nom: 'jaune' }, r: { lam: 474, nu: 3.91e14, coul: ROUGE, y: 362, nom: 'rouge' } };
const v21 = k => C21[k].lam * 1e-9 * C21[k].nu;           // v = λ·ν (m/s), exact
function rayonsPrisme(ctx, liste, a) {
  // faisceau incident horizontal sur la face gauche, rayons déviés vers le bas après la face droite ; le violet le plus dévié
  const xe = 222, ye = 128, xs = 286, ys = 140;
  faisceau(ctx, [[80, 128], [xe, ye]], liste.length > 1 ? [255, 255, 255] : liste[0][1], a, 2.6);
  for (const [k, coul] of liste) {
    const dev = .12 + .02 * k;                           // k = rang dans le spectre (0 rouge … 6 violet)
    faisceau(ctx, [[xe, ye], [xs, ys + k * .8]], coul, a * .8, 1.6);
    faisceau(ctx, [[xs, ys + k * .8], [ECR, ys + k * .8 + (ECR - xs) * Math.tan(dev)]], coul, a, 2);
  }
}
const yEcran = k => 140 + k * .8 + (ECR - 286) * Math.tan(.12 + .02 * k);
function dessiner2021p(c) {

  const jaune = lisse((S.t - (M.jaune - 1.5)) / .4) * (1 - lisse((S.t - (M.rouge - 1.7)) / .4));

    if (jaune > 0) rayonsPrisme(ctx, [[2, JAUNE]], jaune);

    if (vu('jaune')) { verre(ctx, 70, C21.j.y - 20, BV, 40); verre(ctx, 70, C21.r.y - 20, BV, 40); }
  });
  ecrit(c, 'blanche', () => { TX(c, 'source S', 6, 104, { couleur: 'blanc', taille: 17 }); TX(c, 'prisme (verre)', 318, 214, { couleur: 'blanc', taille: 17 }); TX(c, 'écran', ECR - 20, 112, { couleur: 'blanc', taille: 17 }); if (!vu('jaune')) TX(c, 'lumière blanche', 90, 120, { couleur: 'faible', taille: 16 }); });
  if (!vu('jaune')) ecrit(c, 'spectre', () => { TX(c, 'rouge', ECR + 14, yEcran(0) + 6, { couleur: 'rouge', taille: 17 }); TX(c, 'violet', ECR + 14, yEcran(6) + 6, { couleur: 'violet', taille: 17 }); TX(c, 'spectre', ECR + 14, (yEcran(0) + yEcran(6)) / 2 + 6, { couleur: 'blanc', taille: 17 }); });
  ecrit(c, 'jaune', () => {

    TX(c, 'jaune : λ₀ = 589 nm (vide)', 484, C21.j.y - 12, { couleur: 'jaune', taille: 16 });
    TX(c, 'dans le verre : λ = 355 nm', 484, C21.j.y + 16, { couleur: 'jaune', taille: 16 });
  });
  ecrit(c, 'rouge', () => { TXP(c, 'rouge : ν = 3,91·10', '14', ' Hz', 484, C21.r.y - 12, { couleur: 'rouge', taille: 16 }); TX(c, 'dans le verre : λ = 474 nm', 484, C21.r.y + 16, { couleur: 'rouge', taille: 16 }); });
  // les trains d’onde dans les barres de verre : crêtes espacées de λ (à l’échelle : 0,1 px par nm), fronts à la célérité exacte
  const tC = M.course - 2.0, DUREE = 1.6, ech = (BV - 20) / (1.85e8 * DUREE);  // le rouge parcourt la barre en 1,6 s
  for (const k of ['j', 'r']) {

const MES = [['d1', 50], ['d2', 100], ['d3', 150], ['d4', 200]];
function D2021() {                                        // position de l’écran (cm) : il recule d’une mesure à l’autre

}

    if (vu('vitesses') && S.conclusions) m.push('Écrit : v_j ≈ 1,81·10⁸ m/s, v_r ≈ 1,85·10⁸ m/s.'); else m.push('Les célérités ne sont pas écrites : l’élève les calcule (v = λ·ν).');
  } else if (vue === '2021c') {
    m.push('Exercice du national 2021 N, la courbe L = f(D) ; fente a = 0,06 mm.');
    const pts = MES.filter(([n]) => vu(n)).map(([, d]) => `(${d} cm ; ${fr(.02 * d, 0)} cm)`);
    if (pts.length) m.push('Points placés : ' + pts.join(', ') + '.');
    if (vu('droite')) m.push('Une droite qui passe par l’origine : L = k·D.');
    if (vu('pente')) m.push('Pointillés : ΔL = 4 cm et ΔD = 200 cm (de l’origine au point (200 ; 4)).');
    if (vu('pente_valeur') && S.conclusions) m.push('Écrit : k = ΔL/ΔD = 4 cm/(200 cm) = 2·10⁻² (sans unité).'); else m.push('La valeur de k n’est pas écrite : l’élève la calcule.');
    if (vu('cheveu')) m.push('Un cheveu remplace la fente ; D₁ = 2 m, L₁ = 3 cm ; d inconnu.');
  } else {
    m.push('Exercice du national 2025 R. Vue de dessus (laser, fente, cuve, écran ; angle exagéré) et écran vu de face (règle en cm).');
    if (vu('mesure_L')) m.push('Dans l’air : L = 2,4 cm.');
    if (vu('liquide')) m.push('La cuve se remplit du liquide ; même fente, même D.');
    if (vu('resserre')) m.push('Dans le liquide la tache se resserre (l’ancienne largeur reste en pointillé).');
    if (vu('mesure_Lp')) m.push('Dans le liquide : L’ = 1,8 cm.');
    if (vu('indice') && S.conclusions) m.push('Écrit : n = L/L’ = 2,4/1,8 ≈ 1,33.'); else m.push('L’indice n’est pas écrit : l’élève le calcule.');
  }
  return m.join(' ');
}

function playUntil(p) {
  const nom = p && p.moment in M ? p.moment : null, cible = nom ? M[nom] : +(p && p.time_s);
  if (!Number.isFinite(cible)) return;
  if (S.fait || S.t >= cible - 1e-4) S.t = cible >= T0() ? T0() : 0;
  S.jusqua = Math.min(FIN, Math.max(0.001, cible));
  S.motif = nom ? SUITE.find(s => s[0] === nom)[2] : '';
  S.running = true; S.fait = false; $('run').textContent = 'Pause'; bulle($('feedback'), 'Observe…');
  pont.noter('play_until', { moment: nom, time_s: S.jusqua }); pont.emettre();
}
function start() { S.jusqua = null; S.t = T0(); S.running = true; S.fait = false; $('run').textContent = 'Pause'; bulle($('feedback'), 'Observe…'); pont.noter('start'); pont.emettre(); }
function reset() { S.jusqua = null; S.t = T0(); S.running = false; S.fait = false; $('run').textContent = 'Lancer'; scene.sale = true; bulle($('feedback'), depart ? 'On reprend où on s’était arrêté.' : 'Le montage de l’énoncé.'); pont.noter('reset'); pont.emettre(); }
function pause() { if (!S.running) return; S.running = false; S.jusqua = null; $('run').textContent = 'Reprendre'; bulle($('feedback'), 'Arrêt sur image.'); pont.noter('pause', { time_s: +S.t.toFixed(3) }); pont.emettre(); }
function resume() { if (S.running) return; if (S.fait || S.t >= FIN) return start(); S.running = true; $('run').textContent = 'Pause'; bulle($('feedback'), 'Observe…'); pont.noter('resume'); pont.emettre(); }
function setTime(p) {
  const t = +(p && p.time_s); if (!Number.isFinite(t)) return;
  S.running = false; S.jusqua = null; S.t = clamp(t, 0, FIN); S.fait = S.t >= FIN;
  $('run').textContent = S.fait ? 'Rejouer' : 'Reprendre'; scene.sale = true;
  bulle($('feedback'), `Arrêt sur image : t = ${fr(S.t, 2)} s.`); pont.noter('set_time', { time_s: S.t }); pont.emettre();
}
function setParameters(p) {
  p = p || {};
  if ('conclusions' in p) S.conclusions = p.conclusions === true || p.conclusions === 'true' || p.conclusions === 1;
  scene.sale = true; pont.noter('set_parameters', { conclusions: S.conclusions }); pont.emettre();
}
$('run').onclick = () => (S.running ? pause() : (S.t > T0() && S.t < FIN && !S.fait ? resume() : start()));

const EXPLICATIONS = {
  '2023': [{ repere: 'vue_cote', texte: 'La vue de côté : le laser, la fente horizontale, l’écran.' }, { repere: 'vue_face', texte: 'L’écran vu de face : les taches sur une ligne verticale.' },
    { repere: 'L', texte: 'L = 2,7 cm : de la première extinction à l’autre.' }, { repere: 'triangle', texte: 'Le triangle : tan θ = (L/2)/D.' }, { repere: 'LR', texte: 'Source rouge : L_R = 3,4 cm.' }],
  '2021p': [{ repere: 'prisme', texte: 'Le prisme décompose la lumière blanche.' }, { repere: 'spectre', texte: 'Le spectre : du rouge au violet.' },
    { repere: 'jaune', texte: 'Dans le verre, λ_j = 355 nm.' }, { repere: 'rouge', texte: 'Dans le verre, λ_r = 474 nm.' }, { repere: 'fronts', texte: 'Le front rouge avance un peu plus vite.' }],
  '2021c': [{ repere: 'axe_D', texte: 'En bas, D en cm.' }, { repere: 'axe_L', texte: 'À gauche, L en cm.' }, { repere: 'points', texte: 'Chaque position de l’écran donne un point.' },
    { repere: 'droite', texte: 'Une droite qui passe par l’origine : L = k·D.' }, { repere: 'pente', texte: 'ΔL = 4 cm, ΔD = 200 cm.' }],
  '2025': [{ repere: 'L', texte: 'Dans l’air, L = 2,4 cm.' }, { repere: 'cuve', texte: 'On remplit la cuve du liquide.' }, { repere: 'tache_centrale', texte: 'La tache se resserre.' }, { repere: 'Lp', texte: 'Dans le liquide, L’ = 1,8 cm.' }],
};
window.Tableau.explication({ [vue]: EXPLICATIONS[vue] });
const commandes = ['start', 'reset', 'pause', 'resume', 'set_time', 'set_parameters', 'play_until'];
const config = { id: 'ondes_lumineuses_national', version: '1.0', title: 'Exercice du national joué — ' + vue, variants: [{ id: vue, label: vue }], commands: commandes,
  command_schema: {
    set_parameters: { conclusions: 'true | false (false : les résultats que l’élève doit calculer ne s’écrivent pas)' },
    set_time: { time_s: `0..${fr(FIN, 1)} (arrêt sur cet instant, s)` },
    play_until: { moment: Object.keys(M).join(' | ') + ' (rejoue et se fige à cet instant)', time_s: 'ou un instant en s' } } };
const pont = protocole({ id: config.id, commandes, config,
  texte: 'Exercice du national rejoué au tableau, étape par étape, avec les valeurs de l’énoncé. Les résultats que l’élève doit calculer ne sont écrits qu’après sa réponse.',
  etat: () => ({ simulation_status: S.running ? 'running' : (S.fait ? 'finished' : (S.t > 0 ? 'paused' : 'idle')), ce_qui_se_voit: ceQuiSeVoit(), current_variant: vue,
    time_s: +S.t.toFixed(3), parameters: { conclusions: S.conclusions, depart }, moments: moments() }),
  progression: () => (S.fait ? 1 : 0),
  executer: (cmd, p) => ({ start, reset, pause, resume, set_time: () => setTime(p), set_parameters: () => setParameters(p), play_until: () => playUntil(p) })[cmd]?.() });
bulle($('feedback'), depart ? 'On reprend où on s’était arrêté.' : 'Le montage de l’énoncé.');
if (depart) $('run').textContent = 'Reprendre';
