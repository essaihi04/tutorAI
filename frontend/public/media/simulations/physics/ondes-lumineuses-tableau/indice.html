<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L'indice de réfraction — au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="lumiere.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Trois éclairs de lumière partent ensemble dans le vide, puis entrent dans l'air, l'eau et le verre : ils ralentissent, v et n = c / v s'écrivent à l'arrivée"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start pause resume play_until">Allumer</button>
    <span id="reglage" data-professor-control="set_parameters"></span>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="commun.js"></script>
<script src="exposants.js"></script>
<script>
/*
 * L'indice de réfraction n = c / v (14 novembre 2026, règle 28 du professeur) : remplace le tableau « vide | milieu »
 * de la diapo ol_n4_indice. Trois éclairs partent au même instant : à gauche dans le vide (tous à c), à droite chacun
 * entre dans son milieu (air, eau, verre) et ralentit (v = c / n) ; son onde se resserre. À l'arrivée, v et n = c / v
 * s'écrivent au bout de la piste. Curseur : l'indice du troisième bloc (1,00 à 2,40 ; verre 1,5 ; diamant 2,4).
 * Mouvement ralenti énormément (la vraie lumière fait les 3 km du dessin en dix microsecondes).
 */
const { fr, bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
let XL = 104, XV = 324, XR = 564, VPX = 200;                   // pistes : vide de XL à XV, milieu de XV à XR ; c = 200 px/s à l'image
const T0 = 0.3;
/* Agrandissement du 15 novembre 2026 : sur un tableau large (scene.L ≥ 1000), les pistes s'allongent (KX) et c (VPX)
 * avec elles — les instants (entrée, arrivées) ne changent pas — ; les textes grandissent de KT. Sinon : comme avant. */
let KX = 1, KT = 1;
function disposer(L) {
  const large = L >= 1000;
  KT = large ? 1.25 : 1;
  XL = large ? 118 : 104; XR = large ? L - 300 : 564; KX = (XR - XL) / 460;
  XV = XL + 220 * KX; VPX = 200 * KX;
}
const P = { n: 1.5 };
const PISTES = [
  { id: 'air', y: 128, n: () => 1.0003, couleur: 'cyan' },
  { id: 'eau', y: 222, n: () => 1.33, couleur: 'bleu' },
  { id: 'verre', y: 316, n: () => P.n, couleur: 'violet' },
];
const nomPiste = p => (p.id !== 'verre' ? (p.id === 'air' ? 'Air' : 'Eau') : Math.abs(P.n - 1.5) < 1e-6 ? 'Verre' : P.n >= 2.4 ? 'Diamant' : P.n <= 1.0001 ? 'Vide' : 'Bloc');
const tEntree = T0 + (XV - XL) / VPX;
const tArrivee = p => tEntree + (XR - XV) * p.n() / VPX;
const T = () => ({ trace: T0 + 0.8, celerite: tEntree + 0.9, indice: Math.max(...PISTES.map(tArrivee)) + 0.3 });
const tfin = () => T().indice + 0.2;
const S = { t: 0, running: false, pause: false, fait: false, jusqua: null, motif: '', emis: 0 };
const vu = nom => S.t >= T()[nom] - 1e-6;
const sci = v => { const e = Math.floor(Math.log10(v)); return `${fr(v / 10 ** e, 2)}·10^{${e}}`; };
const position = p => { const t = S.t - T0; if (t <= 0) return XL; const xv = XL + VPX * t; return xv <= XV ? xv : Math.min(XR, XV + (VPX / p.n()) * (S.t - tEntree)); };

/* ── Peinture des objets réels (canvas brut, AVANT la craie ; règle 32) ─── */
// Un bloc du milieu, en coupe : air (à peine teinté), eau dans une cuve de verre, verre ou diamant taillé.
function peindreBloc(ctx, p) {
  const x = XV + 2, w = XR - XV - 4, y = p.y - 26, h = 52, n = p.n();
  ctx.save();
  if (p.id === 'air') {
    const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, 'rgba(180,220,255,.05)'); g.addColorStop(.5, 'rgba(180,220,255,.13)'); g.addColorStop(1, 'rgba(180,220,255,.05)');
    ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = 'rgba(210,235,255,.3)';
    for (let i = 0; i < 26; i++) { ctx.beginPath(); ctx.arc(x + ((i * .618) % 1) * w, y + 4 + ((i * .382 * 5) % 1) * (h - 8), 1, 0, Math.PI * 2); ctx.fill(); }
  } else if (p.id === 'eau') {
    // Cuve de verre : parois claires ; l'eau bleue translucide, surface claire en haut.
    const ys = y + 6, g = ctx.createLinearGradient(0, ys, 0, y + h); g.addColorStop(0, 'rgba(110,190,245,.36)'); g.addColorStop(1, 'rgba(20,80,170,.48)');
    ctx.fillStyle = g; ctx.fillRect(x, ys, w, y + h - ys);
    ctx.strokeStyle = 'rgba(225,245,255,.85)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, ys); ctx.lineTo(x + w, ys); ctx.stroke();
    ctx.strokeStyle = 'rgba(200,230,240,.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y - 2); ctx.lineTo(x, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y - 2); ctx.stroke();
  } else if (n > 1.0001) {
    // Verre (ou diamant) : bloc taillé, teinte verdâtre qui fonce avec n, chanfreins et reflets.
    const k = clamp((n - 1) / 1.4), diamant = n >= 2.4;
    ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 8; ctx.shadowOffsetX = 3; ctx.shadowOffsetY = 4;
    const g = ctx.createLinearGradient(x, y, x + w * .4, y + h);
    if (diamant) { g.addColorStop(0, 'rgba(235,248,255,.55)'); g.addColorStop(.5, 'rgba(170,215,240,.32)'); g.addColorStop(1, 'rgba(225,240,255,.5)'); }
    else { g.addColorStop(0, `rgba(200,240,235,${(.22 + .25 * k).toFixed(3)})`); g.addColorStop(.6, `rgba(110,185,180,${(.2 + .3 * k).toFixed(3)})`); g.addColorStop(1, `rgba(70,140,140,${(.28 + .3 * k).toFixed(3)})`); }
    ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(x, y, w, h, 3); ctx.fill(); ctx.shadowColor = 'transparent';
    ctx.strokeStyle = 'rgba(230,255,250,.7)'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(x + 2, y + h - 2); ctx.lineTo(x + 2, y + 2); ctx.lineTo(x + w - 2, y + 2); ctx.stroke();
    ctx.strokeStyle = 'rgba(30,70,70,.55)'; ctx.beginPath(); ctx.moveTo(x + w - 1, y + 2); ctx.lineTo(x + w - 1, y + h - 1); ctx.lineTo(x + 2, y + h - 1); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.moveTo(x + 20, y + 3); ctx.lineTo(x + 60, y + 3); ctx.lineTo(x + 34, y + h - 3); ctx.lineTo(x + 8, y + h - 3); ctx.closePath(); ctx.fill();
    if (diamant) for (const [a, b] of [[.3, .3], [.62, .7], [.85, .25]]) {
      const sx = x + a * w, sy = y + b * h; ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(sx - 5, sy); ctx.lineTo(sx + 5, sy); ctx.moveTo(sx, sy - 5); ctx.lineTo(sx, sy + 5); ctx.stroke();
    }
  }
  ctx.restore();
}
// La source : une petite lampe-torche (corps sombre, lentille qui brille quand elle est allumée).
function peindreLampe(ctx, y, allumee) {
  const x = XL - 4;
  // Lampe agrandie (16 novembre 2026) : 1,5 fois, autour de sa lentille.
  ctx.save(); ctx.translate(x, y); ctx.scale(1.5, 1.5); ctx.translate(-x, -y); ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 4; ctx.shadowOffsetY = 2;
  let g = ctx.createLinearGradient(0, y - 6, 0, y + 6); g.addColorStop(0, '#6b737c'); g.addColorStop(.4, '#c9d0d7'); g.addColorStop(1, '#3a4148');
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(x - 26, y - 5, 18, 10, 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - 9, y - 5); ctx.lineTo(x, y - 8); ctx.lineTo(x, y + 8); ctx.lineTo(x - 9, y + 5); ctx.closePath(); ctx.fill(); ctx.shadowColor = 'transparent';
  g = ctx.createRadialGradient(x, y, 1, x, y, allumee ? 14 : 7); g.addColorStop(0, allumee ? '#fffbe6' : '#c8d2da'); g.addColorStop(1, allumee ? 'rgba(255,245,200,0)' : 'rgba(150,165,175,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, allumee ? 14 : 7, -Math.PI / 2, Math.PI / 2); ctx.fill();
  ctx.restore();
}

function dessiner(c) {
  scene.cadre(23); disposer(scene.L);
  // Deux colonnes : le vide à gauche, le milieu à droite.
  c.texte('le vide', (XL + XV) / 2, 30, { couleur: 'blanc', taille: 19 * KT, align: 'center' });
  c.texte('le milieu', (XV + XR) / 2, 30, { couleur: 'blanc', taille: 19 * KT, align: 'center' });
  c.ligne(XV, 44, XV, 360, { couleur: 'faible', largeur: 1.4, pointille: [6, 6], duree: .3 });
  c.repere('vide', XL, 10, XV - XL, 350, 'le vide, à gauche');
  c.repere('milieu', XV, 10, XR - XV, 350, 'le milieu, à droite');
  for (const p of PISTES) {
    c.ligne(XL, p.y + 22, XR, p.y + 22, { couleur: 'tresfaible', largeur: 1, duree: .15 });
  }
  c.direct(() => {
    // Les blocs (air, eau dans sa cuve, verre ou diamant) et les lampes sont peints, sous la craie.
    for (const p of PISTES) { peindreBloc(c.ctx, p); peindreLampe(c.ctx, p.y, S.running || S.pause || S.fait); }
    c.texte('c = 3,00·10⁸ m/s', XL + 6, 62, { couleur: 'jaune', taille: 16 * KT });
    for (const p of PISTES) {
      const n = p.n(), x = position(p), dans = x > XV, lam = (dans ? 14 / n : 14) * KX, k = 2 * Math.PI / lam;
      c.texte(nomPiste(p), 14, p.y + 6, { couleur: p.couleur, taille: 18 * KT, max: XL - 50 });
      c.repere(p.id, 8, p.y - 28, XR - 4, 56, nomPiste(p).toLowerCase());
      if (S.t > T0 && (S.running || S.pause || S.fait)) {
        // Un train d'onde (l'éclair) : il se resserre en entrant dans le milieu.
        // L'éclair est de la lumière : une lueur douce de sa couleur derrière le train d'onde, la trace brille.
        const coul = c.couleur(p.couleur), xc = x - 25 * KX;
        if (x < XR && xc > XL - 10) {
          const h = c.ctx.createRadialGradient(xc, p.y, 2, xc, p.y, 34 * KX);
          h.addColorStop(0, coul + '55'); h.addColorStop(1, coul + '00');
          c.ctx.save(); c.ctx.fillStyle = h; c.ctx.beginPath(); c.ctx.ellipse(xc, p.y, 34 * KX, 26, 0, 0, Math.PI * 2); c.ctx.fill(); c.ctx.restore();
        }
        c.ctx.save(); c.ctx.shadowColor = coul; c.ctx.shadowBlur = 8;
        if (x < XR) c.courbe(u => { const xx = x - 50 * KX + u * 50 * KX; if (xx < XL) return null; const g = Math.exp(-(((xx - x + 25 * KX) / (15 * KX)) ** 2)); return [xx, p.y - 16 * g * Math.sin(k * (xx - x))]; }, 60, { couleur: p.couleur, largeur: 2.6, tremble: .2 });
        c.ctx.restore();
        if (x < XR) c.texte(dans ? 'v' : 'c', x - 25 * KX, p.y - 24, { couleur: p.couleur, taille: 15 * KT, align: 'center' });
      }
      if (S.t >= tArrivee(p)) {
        const v = 3e8 / n;
        c.point(XR, p.y, 5, p.couleur);
        c.texte(`v = ${sci(v)} m/s`, XR + 12, p.y - 2, { couleur: p.couleur, taille: 16 * KT });
        if (vu('indice')) c.texte(`n = c / v ${n < 1.001 && n > 1 ? '≈ 1,00' : '= ' + fr(n, 2)}`, XR + 12, p.y + 22 * KT, { couleur: 'vert', taille: 16 * KT });
      }
    }
    if (vu('celerite')) c.texte('v < c', (XV + XR) / 2, 62, { couleur: 'orange', taille: 16 * KT, align: 'center' });
    if (vu('indice')) {
      c.texte('n sans unité, n ≥ 1', XR + 12, 392, { couleur: 'vert', taille: 15 * KT });
      c.repere('indices', XR + 6, 90, 190 * KT, 310, 'les indices n = c / v');
    }
    if (S.running || S.pause) c.texte('(très ralenti)', scene.L - 12, 30, { couleur: 'faible', taille: 13 * KT, align: 'right' });
  });
  return c.fin();
}

const canvas = $('canvas');
const scene = window.OndesTableau.Scene(canvas, dessiner, { large: true });
scene.avancer = dt => {
  if (!S.running) return false;
  S.t = Math.min(tfin(), S.t + dt);
  if (arreterSiInstantAtteint()) return true;
  if (S.t >= tfin()) {
    S.running = false; S.fait = true; $('run').textContent = 'Allumer';
    bulle($('feedback'), 'Plus le milieu ralentit la lumière, plus son indice n = c / v est grand.', 'good');
    pont.noter('finished'); pont.emettre();
  } else if (performance.now() - S.emis > 400) { S.emis = performance.now(); pont.emettre(); }
  return true;
};
const MOTIFS = { trace: 'les trois éclairs avancent ensemble dans le vide, à c', celerite: 'dans les milieux ils ralentissent : v < c', indice: 'tous arrivés : v et n = c / v écrits au bout' };
function playUntil(p) {
  const M = T(), nom = p.moment in M ? p.moment : null, cible = nom ? M[nom] : +p.progress * tfin();
  if (!Number.isFinite(cible)) return;
  if (!(S.running || S.pause) || S.t >= cible - 1e-3) start();
  S.jusqua = cible; S.motif = nom ? MOTIFS[nom] : '';
  if (S.pause) { S.running = true; S.pause = false; $('run').textContent = 'Pause'; }
  pont.noter('play_until', { moment: nom }); pont.emettre();
}
function arreterSiInstantAtteint() {
  if (S.jusqua == null || S.t < S.jusqua) return false;
  S.t = S.jusqua; S.jusqua = null; S.running = false; S.pause = true; $('run').textContent = 'Reprendre';
  bulle($('feedback'), 'Arrêt sur image : ' + (S.motif || 'instant choisi') + '.'); pont.noter('pause'); pont.emettre();
  return true;
}
function ceQuiSeVoit() {
  const m = [`Deux colonnes : le vide à gauche, le milieu à droite. Trois pistes : air (n ≈ 1), eau (1,33), ${nomPiste(PISTES[2]).toLowerCase()} (n = ${fr(P.n, 2)}) ; les milieux sont peints (air léger, eau bleue dans une cuve de verre, bloc de verre verdâtre), une lampe au départ de chaque piste. Écrit en haut à gauche : c = 3,00·10⁸ m/s.`];
  if (S.t <= T0) m.push('Les éclairs ne sont pas encore partis.');
  else if (S.t < tEntree) m.push('Les trois éclairs avancent ensemble dans le vide, à la même vitesse c.');
  else m.push('Dans le milieu, chaque éclair ralentit et son onde se resserre ; l’air est devant, le verre derrière.');
  for (const p of PISTES) if (S.t >= tArrivee(p)) m.push(`${nomPiste(p)} arrivé : v = ${fr(3 / p.n(), 2)}·10⁸ m/s${vu('indice') ? `, n = ${fr(p.n(), 2)}` : ''}.`);
  return m.join(' ');
}
function start() { S.jusqua = null; S.t = 0; S.running = true; S.pause = false; S.fait = false; $('run').textContent = 'Pause'; bulle($('feedback'), 'Trois éclairs partent ensemble…'); pont.noter('start'); pont.emettre(); }
function pause() { if (!S.running) return; S.jusqua = null; S.running = false; S.pause = true; $('run').textContent = 'Reprendre'; bulle($('feedback'), 'Arrêt sur image.'); pont.noter('pause'); pont.emettre(); }
function resume() { if (S.running || !S.pause) return start(); S.running = true; S.pause = false; $('run').textContent = 'Pause'; pont.noter('resume'); pont.emettre(); }
function reset() { S.t = 0; S.running = false; S.pause = false; S.fait = false; S.jusqua = null; scene.sale = true; $('run').textContent = 'Allumer'; bulle($('feedback'), 'Allume : qui arrive le premier au bout de son milieu ?'); pont.emettre(); }
function setParameters(p) {
  if (!Number.isFinite(+p.n)) return;
  P.n = Math.min(2.4, Math.max(1, Math.round(+p.n * 100) / 100)); regl.maj(P.n); reset();
  bulle($('feedback'), `Indice ${fr(P.n, 2)} : v = c / n = ${fr(3 / P.n, 2)}·10⁸ m/s. Allume pour comparer.`);
  pont.noter('set_parameters', { n: P.n }); pont.emettre();
}
const regl = window.Tableau.curseur({ id: 'n', label: '3ᵉ bloc : n =', min: 1, max: 2.4, step: 0.05, valeur: 1.5, unite: '', commande: 'set_parameters', decimales: 2, onchange: x => setParameters({ n: x }) });
$('reglage').replaceChildren(regl);
$('run').onclick = () => (S.running ? pause() : S.pause ? resume() : start());
window.Tableau.explication({ indice: [
  { repere: 'vide', texte: 'Dans le vide, toutes les lumières vont à c, trois fois dix puissance huit mètres par seconde.' },
  { repere: 'milieu', texte: 'Dans un milieu transparent, la lumière ralentit : v est plus petite que c.' },
  { repere: 'indices', texte: 'L’indice n = c sur v : sans unité, toujours au moins un.' },
  { repere: 'eau', texte: 'L’eau : n = 1,33.' },
  { repere: 'verre', texte: 'Le verre : n ≈ 1,5.' },
] });
const commandes = ['start', 'pause', 'resume', 'reset', 'set_parameters', 'play_until'];
const config = { id: 'ondes_lumineuses_indice', version: '1.0', title: 'L’indice de réfraction', variants: [{ id: 'indice', label: 'indice' }], commands: commandes,
  command_schema: { set_parameters: { n: '1.00..2.40 (pas de 0,05), indice du troisième bloc (verre 1,5)' }, play_until: { moment: Object.keys(MOTIFS).join(' | ') + ' (rejoue et se fige à cet instant clé)' } } };
const pont = protocole({ id: config.id, commandes, config,
  texte: 'Trois éclairs : dans le vide à c = 3,00·10⁸ m/s, puis dans l’air (n ≈ 1,00), l’eau (n = 1,33) et le verre (n = 1,5, réglable 1,00–2,40). Dans le milieu ils ralentissent : v = c / n ; à l’arrivée v et n = c / v s’écrivent. n sans unité, n ≥ 1.',
  etat: () => ({ simulation_status: S.running ? 'running' : S.pause ? 'paused' : (S.fait ? 'finished' : 'idle'), ce_qui_se_voit: ceQuiSeVoit(), moments: T(), parameters: { ...P }, time_s: +S.t.toFixed(2) }),
  progression: () => (S.fait ? 1 : clamp(S.t / tfin())),
  executer: (cmd, p) => ({ start, pause, resume, reset, set_parameters: () => setParameters(p), play_until: () => playUntil(p) })[cmd]?.() });
bulle($('feedback'), 'Allume : qui arrive le premier au bout de son milieu ?');
</script>
<script src="/media/simulations/professor-locate.js" defer></script>
</body></html>
