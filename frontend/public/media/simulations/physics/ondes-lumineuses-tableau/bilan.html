<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ce qu'il faut retenir — ondes lumineuses</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="lumiere.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Fiche de révision écrite à la craie sur une page : pour chaque partie du cours sur la propagation d'une onde lumineuse, la définition à apprendre, les formules encadrées et le piège ; deuxième page : ce que l'élève doit retravailler"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="suiv" data-professor-control="next previous start reset play_until">Ma page →</button>
    <button class="craie-btn secondaire" id="imprimer" title="Imprimer ou enregistrer en PDF">🖨️ Imprimer / PDF</button>
    <span class="lecture" id="page"></span>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="commun.js"></script>
<script src="exposants.js"></script>
<script src="/media/simulations/shared/tableau/imprimer.js"></script>
<script>
/*
 * « Ce qu’il faut retenir » du cours « Propagation d’une onde lumineuse » (phys_ch3_ondes_lumineuses), même forme que
 * ondes-periodiques-tableau/bilan.html. TOUTE la fiche tient sur UNE page : huit blocs en trois colonnes (un par partie
 * du cours), chacun avec la définition à savoir par cœur (mot pour mot), les formules encadrées (indices et exposants
 * rendus : « λ_0 » s’écrit λ₀, « 10⁸ » par exposants.js) et le piège en orange (⚠). La voix la parcourt bloc par
 * bloc : play_until {moment: <bloc>} écrit ce bloc à cet instant et le met en lumière ; les blocs déjà dits (ou
 * sautés) sont écrits d’un coup ; ceux pas encore dits attendent leur moment (« fiche » écrit tout d’un coup).
 * La hauteur de chaque bloc est mesurée, puis les blocs d’une colonne se répartissent la hauteur du cadre.
 * La deuxième page est celle de l’élève (set_parameters {lacunes, acquis, acquis_ids}).
 * Petit écran (18 novembre 2026, téléphone en paysage : texte à 6 px) : la page garde son plancher de 15 px (indices et
 * exposants compris) et, quand la fiche ne tient pas sur une page, la coupe en PARTIES (autant qu’il faut, jusqu’à un
 * bloc par écran), chacune remplit le tableau ; compteur « partie n sur N · touche : la suite » ; la voix montre la
 * partie du bloc qu’elle dit. À l’impression, la fiche entière sur une page.
 * Compétences du cours : C1 à C8 (relations du prisme retirées le 15 novembre 2026).
 */
const { bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);

const BLOCS = [
  { id: 'diffraction', titre: '1 · Diffraction de la lumière', comps: ['C1'],
    def: 'La diffraction de la lumière par une fente fine ou un fil met en évidence l’aspect ondulatoire de la lumière. La figure s’étale perpendiculairement à la fente.',
    attention: 'Diffraction, pas réfraction ; ondulatoire, pas monochromatique.' },
  { id: 'ecart', titre: '2 · Écart angulaire θ', comps: ['C2'], formules: ['θ = ⟦λ|a⟧'],
    def: 'θ : du centre de la tache centrale à la première extinction. θ en rad, λ et a en m.',
    attention: 'a diminue → θ augmente.' },
  { id: 'largeur', titre: '3 · Largeur L de la tache', comps: ['C3'], formules: ['tan θ = ⟦L|2D⟧', 'θ petit : tan θ ≈ θ', 'L = ⟦2λD|a⟧'],
    def: 'Dans le triangle : ⟦L|2⟧ en face de θ, D collé à θ. Donc ⟦λ|a⟧ = ⟦L|2D⟧.',
    attention: 'Le côté opposé est ⟦L|2⟧, pas L. Tout en mètre.' },
  { id: 'comparer', titre: '4 · Fil, deux expériences, liquide', comps: ['C4'], formules: ['⟦λ_2|λ_1⟧ = ⟦L_2|L_1⟧', 'n = ⟦L|L′⟧'],
    def: 'Fil (cheveu) : d à la place de a. Deux sources, mêmes a et D : écrire deux fois, diviser. Dans un liquide : L′ = ⟦L|n⟧.',
    attention: 'λ appartient à la source : changer a ou D ne la change pas.' },
  { id: 'courbes', titre: '5 · Exploiter une courbe', comps: ['C5'], formules: ['y = k · x', 'L = f(⟦1|a⟧) : k = 2λD', 'θ = f(⟦1|a⟧) : k = λ', 'L = f(D) : k = ⟦2λ|a⟧'],
    def: 'Droite passant par l’origine : fonction linéaire ; k = la pente, puis on identifie.',
    attention: 'Convertir les unités des axes en SI (mm → m, mm⁻¹ → m⁻¹).' },
  { id: 'radiation', titre: '6 · Lumière monochromatique', comps: ['C6'], formules: ['λ_0 = ⟦c|ν⟧', 'c = 3,00·10⁸ m/s'],
    def: 'Une lumière monochromatique est constituée d’une seule radiation, caractérisée par sa fréquence ν. Visible : 400 nm à 800 nm.',
    attention: 'nm, pas µm ; λ_0 en m dans le calcul (1 nm = 10⁻⁹ m).' },
  { id: 'milieu', titre: '7 · Dans un milieu d’indice n', comps: ['C7'], formules: ['n = ⟦c|v⟧', 'λ = ⟦λ_0|n⟧'],
    def: 'ν ne change pas : même couleur. Air : n = 1 ; eau : 1,33 ; verre : 1,5.',
    attention: 'n ≥ 1, donc v < c et λ < λ_0.' },
  { id: 'dispersion', titre: '8 · Milieu dispersif', comps: ['C8'],
    def: 'Un milieu est dispersif si la célérité de la lumière dépend de sa fréquence. La lumière blanche est polychromatique ; dans le prisme, le violet est le plus dévié.',
    attention: 'Dispersion ≠ diffraction.' },
];
const STATUTS = { non_acquis: ['à reprendre', 'rouge'], partiel: ['à revoir', 'orange'], acquis: ['acquis', 'vert'] };
const AVANT = -1e9;   // instant d'un bloc déjà dit : il est écrit d'un coup
// apparu[i] : null = pas encore dit (pas écrit) ; un nombre = l'instant (s de la scène) où il commence à s'écrire.
// feuille : la partie de la fiche montrée (petit écran) ; impression : sur papier, la fiche entière, sans plancher d'écran.
const S = { page: 1, feuille: 0, focus: null, lacunes: null, acquis: null, acquis_ids: null, apparu: [], impression: false };
window.__debordeBlocs = [];   // vérification : un bloc dont le texte dépasse son cadre ou une colonne trop pleine

/* Texte pour la bulle et ce_qui_se_voit (HTML) : « λ_0 » → « λ₀ » (jamais de « _ » visible). */
const SOUS = { 0: '₀', 1: '₁', 2: '₂', 3: '₃' };
const lisible = s => window.Tableau.lisible(String(s)).replace(/_([0-3])/g, (m, d) => SOUS[d]);

/* Plancher du texte : 15 px à l'écran, vraiment (18 novembre 2026, téléphone en paysage : le kit baisse son plancher
 * jusqu'à 45 % sur un petit tableau, la fiche tombait à 6 px). Indices et exposants compris : sur cette page ils ne
 * descendent jamais sous le plancher non plus (la craie de la page, rien de partagé n'est changé). */
const PLANCHER = 15;
const plancher = () => (S.impression ? 0 : PLANCHER);
const CHIFFRES = { '⁻': '−', '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9' };
const EXPOSANT = /[⁻⁰¹²³⁴⁵⁶⁷⁸⁹]/, INDICE = /[A-Za-zτθΔλωφν]_/;
const versExposants = s => String(s).replace(/[⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, g => '^{' + [...g].map(ch => CHIFFRES[ch]).join('') + '}');
/** Taille d'un indice ou d'un exposant : 62 % de la ligne, jamais sous le plancher. */
const petitDe = (c, t) => Math.max(t * .62, c.echelle && c.tailleMin ? c.tailleMin / c.echelle : 0);
/** Largeur d'un texte à la craie telle qu'elle sera écrite (fractions, indices, exposants, plancher compris). */
const larg = (c, s, t) => { s = versExposants(s); return s.includes('⟦') ? c.largeurTexte(s, t) : c._largeur(s, t); };
let TROP = false;   // mesure : un mot, un titre ou une formule plus large que sa place (la disposition est refusée)

/* Coupe un texte en lignes qui tiennent dans `max` px. */
function lignes(c, texte, taille, max) {
  const out = []; let ligne = '';
  // une formule dans la phrase ne se coupe pas : « λ / a = L / (2D) » reste sur une ligne
  const t = String(texte).replace(/ ([=\/·→<>≥≤≈≠−+]) /g, ' $1 ')
    .replace(/ ([;:!?])/g, ' $1');   // « ; » ou « : » ne commence jamais une ligne
  for (const mot of t.split(/[ \t\n]+/)) {
    const essai = ligne ? ligne + ' ' + mot : mot;
    if (larg(c, mot, taille) > max + 1) TROP = true;
    if (larg(c, essai, taille) > max && ligne) { out.push(ligne); ligne = mot; } else ligne = essai;
  }
  if (ligne) out.push(ligne);
  return out;
}
function paragraphe(c, texte, x, y, taille, max, o, dessiner, interligne = 1.2) {
  // une ligne qui porte une fraction « ⟦num|dén⟧ » (deux étages, comme dans le cahier) prend plus de hauteur ;
  // un exposant (relevé) ou un indice (abaissé), écrits au plancher, prennent un peu de place au-dessus ou dessous
  for (const l of lignes(c, texte, taille, max)) {
    const fr = l.includes('⟦'), sup = EXPOSANT.test(l), sub = INDICE.test(l);
    if (fr) y += taille * .45; else if (sup) y += taille * .22;
    if (dessiner) c.texte(l, x, y, { taille, ...o });
    y += taille * (interligne + (fr ? .35 : sub ? .15 : 0));
  }
  return y;
}

// Colonnes sur toute la largeur du tableau (scene.L : 760 à 1596) ; hauteurs mesurées, réparties dans la colonne.
// Toutes les tailles passent par F, le plus grand facteur pour lequel la fiche (ou la partie) tient dans la hauteur ;
// MIN = le plancher de 15 px à l'écran, en unités du cadre.
let COL = [{ x: 18, w: 228 }, { x: 266, w: 228 }, { x: 514, w: 228 }], HAUT = 50, BAS = 418, LARG = 760;
const POS = [];   // position calculée de chaque bloc : { x, w, y0, h }
let F = 1, MIN = 0;                                  // facteur des tailles ; plus petite taille lisible (unités du cadre)
const T = t => Math.max(t * F, MIN);
const TF = () => T(12.5);  // taille des formules
/* Petit écran : la fiche en PARTIES (autant qu'il faut, jusqu'à un bloc par écran), chacune remplit le tableau avec
 * son propre facteur F. Une seule partie (tous les blocs) sur un grand écran et à l'impression. */
let PARTIES = [{ blocs: BLOCS.map((b, i) => i), F: 1, haut: 50, cols: 3 }];
const partieDe = i => Math.max(0, PARTIES.findIndex(p => p.blocs.includes(i)));
const blocsDe = k => (PARTIES[k] || PARTIES[0]).blocs;

/** L'état de l'élève écrit à droite du titre d'un bloc (ou null). */
function etiquette(st) {
  if (st === 'acquis') return { texte: '✓', taille: T(15), couleur: 'vert' };
  return st && STATUTS[st] ? { texte: STATUTS[st][0], taille: T(11), couleur: STATUTS[st][1] } : null;
}
/* Écrit (ou mesure seulement) le contenu d'un bloc ; rend l'ordonnée de fin. */
function contenu(c, b, x, y0, w, st, dessiner) {
  const tt = T(14), tf = TF(), td = T(11.5), ta = T(11), e = etiquette(st);
  // le titre, sur deux lignes s'il le faut (l'état de l'élève garde sa place à droite)
  const we = e ? larg(c, e.texte, e.taille) + T(8) : 0;
  let y = paragraphe(c, b.titre, x, y0 + tt * .85, tt, w - we, { couleur: 'jaune' }, dessiner, 1.15) - tt * 1.15;
  y += tt * 1.2;
  if (b.formules) {
    // formules encadrées, à la ligne quand la suivante ne tient plus
    let fx = x;
    // une formule à fraction (« ⟦num|dén⟧ », sur deux étages comme dans le cahier) prend un cadre plus haut ; un
    // indice au dénominateur (« ⟦λ_2|λ_1⟧ ») ou un exposant (« 10⁸ ») un peu plus encore
    const fs = b.formules, etages = fs.some(fo => fo.includes('⟦')), subBas = fs.some(fo => /\|[^⟧]*_/.test(fo));
    const haut = etages ? 1.45 : fs.some(fo => EXPOSANT.test(fo)) ? 1.25 : .98;
    const bas = subBas ? .95 : etages ? .62 : fs.some(fo => INDICE.test(fo)) ? .55 : .38;
    const hb = tf * (haut + bas), pad = tf * .5;
    y += tf * (haut - .98);
    for (const f of fs) {
      const lf = larg(c, f, tf) + 2 * pad;
      if (lf > w + .5) TROP = true;
      const l = Math.min(w, lf);
      if (fx > x && fx + l > x + w) { fx = x; y += hb + 4; }
      if (dessiner) {
        c.rect(fx, y - tf * haut, l, hb, { couleur: 'faible', arrondi: 6, largeur: 1.2, duree: .25 });
        c.texte(f, fx + pad, y + tf * .1, { couleur: 'jaune', taille: tf });
      }
      fx += l + 7;
    }
    y += tf * (bas + .98);
  }
  y = paragraphe(c, b.def, x, y, td, w, { couleur: 'blanc' }, dessiner);
  if (dessiner) c.texte('⚠', x, y + (EXPOSANT.test(b.attention) ? ta * .22 : 0), { couleur: 'orange', taille: ta });
  const r = Math.max(ta * 1.3, larg(c, '⚠', ta) + ta * .3);
  y = paragraphe(c, b.attention, x + r, y, ta, w - r, { couleur: 'orange', alpha: .92 }, dessiner);
  return y - ta * .7;   // la dernière ligne descend d'environ 0,3 taille sous sa base
}
/* Les blocs, dans l'ordre, coupés en n colonnes de hauteurs les plus égales possible. */
function decouper(h, n) {
  let best = null;
  const essayer = (coupes) => {
    const bornes = [0, ...coupes, h.length], g = [];
    for (let k = 0; k < n; k++) g.push([bornes[k], bornes[k + 1]]);
    const m = Math.max(...g.map(([a, b]) => h.slice(a, b).reduce((s, v) => s + v, 0)));
    if (!best || m < best.m) best = { m, g };
  };
  (function suite(depart, coupes) {
    if (coupes.length === n - 1) return essayer(coupes);
    for (let i = depart; i <= h.length - (n - 1 - coupes.length); i++) suite(i + 1, [...coupes, i]);
  })(1, []);
  return best;
}
/** L'en-tête : titre (et, en parties, le compteur à droite, 15 px au moins). */
const COMPTEUR = (k, N) => `partie ${k} sur ${N} · touche : la suite`;
function entete(c, parties) {
  if (!parties) return { titre: 'Ce qu’il faut retenir · la lumière', tT: T(22), tC: T(12) };
  const g = Math.min(F, 1.25), tC = Math.max(13 * g, MIN), wc = larg(c, COMPTEUR(8, 8), tC);
  for (const titre of ['Ce qu’il faut retenir · la lumière', 'Ce qu’il faut retenir']) {
    for (let tT = Math.max(22 * g, MIN); tT >= MIN; tT -= 1) if (larg(c, titre, tT) + wc + 30 <= LARG - 28) return { titre, tT, tC };
  }
  return { titre: 'Ce qu’il faut retenir', tT: MIN, tC };
}
let clePlace = '';
if (document.fonts) document.fonts.ready.then(() => { clePlace = ''; if (window.__bilan) window.__bilan.scene.sale = true; });
function placer(c) {
  // la police de la craie peut arriver après la première image : la mesure est refaite quand elle est chargée
  const cle = [scene.L, (scene.s || 1).toFixed(3), S.impression, BLOCS.map(statut).join(), document.fonts ? document.fonts.status : ''].join(':');
  if (cle === clePlace && POS.length) return;   // même tableau : la disposition est déjà calculée
  clePlace = cle;
  LARG = scene.L; MIN = plancher() / Math.max(.1, scene.s || 1);
  const memo = new Map(), sts = BLOCS.map(statut);
  const colonnes = n => {
    const marge = 12, ecart = Math.round(LARG / (n >= 4 ? 80 : n === 3 ? 60 : 45)), w = (LARG - 2 * marge - (n - 1) * ecart) / n;
    return Array.from({ length: n }, (_, k) => ({ x: marge + k * (w + ecart), w }));
  };
  const hauteur = (i, w) => {
    const k = `${i}|${F}|${w.toFixed(2)}`;
    if (!memo.has(k)) { TROP = false; const h = contenu(c, BLOCS[i], 0, 0, w, sts[i], false) + 4; memo.set(k, { h, trop: TROP }); }
    return memo.get(k);
  };
  /** Les blocs `ids` en n colonnes au facteur Fx : la disposition, ou null s'ils ne tiennent pas. */
  const essai = (ids, n, Fx, parties) => {
    F = Fx; const haut = 18 + entete(c, parties).tT, cols = colonnes(n);
    const hs = ids.map(i => hauteur(i, cols[0].w));
    if (hs.some(h => h.trop)) return null;
    const d = decouper(hs.map(h => h.h), n);
    return d.m <= BAS - haut ? { ids, n, F: Fx, haut, cols, d, H: hs.map(h => h.h) } : null;
  };
  const FS = Array.from({ length: 25 }, (_, i) => 1 + (24 - i) * .05);   // 2,2 → 1 (pas de 0,05)
  // 1) toute la fiche sur une page : trois colonnes, sinon quatre (le plus grand facteur qui tient)
  let choix = null;
  for (const n of [3, 4]) { for (const Fx of FS) if ((choix = essai(BLOCS.map((b, i) => i), n, Fx, false))) break; if (choix) break; }
  let parts;
  if (choix || S.impression) {
    if (!choix) { F = 1; const cols = colonnes(3), H = BLOCS.map((b, i) => hauteur(i, cols[0].w).h); choix = { ids: BLOCS.map((b, i) => i), n: 3, F: 1, haut: 18 + T(22), cols, d: decouper(H, 3), H }; }
    parts = [choix];
  } else {
    // 2) petit écran : le moins de parties possible (blocs consécutifs), chacune au plus grand facteur qui tient ;
    //    à nombre égal, la découpe dont la plus petite écriture est la plus grande
    const cache = new Map();
    const meilleure = (a, b) => {
      const k = a + '-' + b; if (cache.has(k)) return cache.get(k);
      const ids = []; for (let i = a; i < b; i++) ids.push(i);
      let m = null;
      for (const n of [3, 2, 1]) {
        if (n > ids.length) continue;
        for (const Fx of FS) { if (m && Fx <= m.F) break; const r = essai(ids, n, Fx, true); if (r) { m = r; break; } }
      }
      cache.set(k, m); return m;
    };
    for (let N = 2; N <= BLOCS.length && !parts; N++) {
      let mieux = null;
      (function couper(depart, coupes) {
        if (coupes.length === N - 1) {
          const bornes = [0, ...coupes, BLOCS.length], ps = [];
          for (let k = 0; k < N; k++) { const m = meilleure(bornes[k], bornes[k + 1]); if (!m) return; ps.push(m); }
          const note = [Math.min(...ps.map(p => p.F)), ps.reduce((s, p) => s + p.F, 0)];
          if (!mieux || note[0] > mieux.note[0] + 1e-9 || (Math.abs(note[0] - mieux.note[0]) < 1e-9 && note[1] > mieux.note[1])) mieux = { note, ps };
          return;
        }
        for (let i = depart; i <= BLOCS.length - (N - 1 - coupes.length); i++) couper(i + 1, [...coupes, i]);
      })(1, []);
      if (mieux) parts = mieux.ps;
    }
    if (!parts) {   // dernier recours : un bloc par partie, à la taille la plus petite lisible
      parts = BLOCS.map((b, i) => { F = 1; const cols = colonnes(1), H = [hauteur(i, cols[0].w).h]; return { ids: [i], n: 1, F: 1, haut: 18 + entete(c, true).tT, cols, d: decouper(H, 1), H }; });
    }
  }
  window.__debordeBlocs = [];
  PARTIES = parts.map(p => {
    p.d.g.forEach(([a, b], k) => {
      const { x, w } = p.cols[k], ids = p.ids.slice(a, b), hs = p.H.slice(a, b);
      const libre = BAS - p.haut - hs.reduce((s, v) => s + v, 0), g = Math.max(0, libre / ids.length);
      if (libre < 0) ids.forEach(i => window.__debordeBlocs.push(BLOCS[i].id));
      let y = p.haut;
      ids.forEach((i, j) => { POS[i] = { x, w, y0: y, h: hs[j] + g * .7 }; y += hs[j] + g; });
    });
    return { blocs: p.ids, F: p.F, haut: p.haut, cols: p.n };
  });
  S.feuille = S.focus ? partieDe(BLOCS.findIndex(b => b.id === S.focus)) : Math.min(S.feuille, PARTIES.length - 1);
  F = PARTIES[S.feuille].F; HAUT = PARTIES[S.feuille].haut;
  window.__bilanF = PARTIES.map(p => p.F); window.__bilanCols = PARTIES.map(p => p.cols);
  etiquettes();
}
function bloc(c, b, i) {
  const { x, w, y0, h } = POS[i], enLumiere = S.focus === b.id, st = statut(b), e = etiquette(st);
  const cx = x - 6, cy = y0 - 6, cw = w + 12, ch = h + 4;
  // Le cadre de lumière et l'état de l'élève apparaissent d'un coup : ils ne décalent pas l'écriture du bloc.
  c.direct(() => {
    if (enLumiere) c.rect(cx, cy, cw, ch, { couleur: 'jaune', arrondi: 10, largeur: 1.6, alpha: .7 });
    else if (st && STATUTS[st] && st !== 'acquis') c.rect(cx, cy, cw, ch, { couleur: STATUTS[st][1], arrondi: 10, largeur: 1.4, pointille: [5, 6], alpha: .8 });
    if (e) c.texte(e.texte, x + w, y0 + T(14) * .85, { couleur: e.couleur, taille: e.taille, align: 'right' });
  });
  const fin = contenu(c, b, x, y0, w, st, true);
  if (fin > cy + ch + 1 && !window.__debordeBlocs.includes(b.id)) window.__debordeBlocs.push(b.id);
  c.repere(b.id, cx, cy, cw, ch, b.titre.replace(/^\d+ · /, ''));
}

function dessinerFiche(c) {
  placer(c);
  const N = PARTIES.length, P = PARTIES[S.feuille] || PARTIES[0];
  F = P.F; HAUT = P.haut;

  } else c.texte('définition · formule · ⚠ piège', LARG - 14, e.tT - 2, { couleur: 'faible', taille: e.tC, align: 'right' });
  c.ligne(14, e.tT + 7, LARG - 14, e.tT + 7, { couleur: 'tresfaible', largeur: 1.4 });

}

/* La page de l'élève : texte plus grand quand le tableau est large, jamais sous le plancher ; sur un petit tableau,
 * les acquis en une ligne puis moins de lacunes (« … et n autre(s) ») pour que tout reste dans le cadre. */
function pageEleve(c, nLac, court, dessiner) {
  const L = scene.L, k = L >= 1000 ? 1.25 : 1, W = L - 60, t = v => Math.max(v * k, MIN);
  const ecrire = (s, x, y, o) => { if (dessiner) c.texte(s, x, y, o); };
  const tT = t(22);
  ecrire('Ta page : ce qu’il te reste à retravailler', 22, tT * 1.05 + 7, { couleur: 'jaune', taille: tT });
  if (dessiner) c.ligne(22, tT * 1.05 + 15, L - 20, tT * 1.05 + 15, { couleur: 'tresfaible', largeur: 1.4 });

  }

  } else {

      ecrire(l.statut === 'partiel' ? '⟳' : '✗', 22, y, { couleur: coul, taille: t(17) });
      y = paragraphe(c, `${l.label} — ${etiq}`, xl, y, t(16), L - 22 - xl, { couleur: 'blanc' }, dessiner);
      if (l.reprendre_avec && l.reprendre_avec.length) y = paragraphe(c, 'reprendre avec ' + l.reprendre_avec.join(', puis '), xl, y, t(13), L - 22 - xl, { couleur: coul, alpha: .85 }, dessiner);
      y += 4 * k;

    if (lac.length > nLac) { ecrire(`… et ${lac.length - nLac} autre(s)`, xl, y, { couleur: 'faible', taille: t(13) }); y += t(13) * 1.3; }

    else { ecrire('✓ Acquis', 22, y, { couleur: 'vert', taille: t(15) }); y += t(15) * 1.35; y = paragraphe(c, acq.join(' · '), 22, y, t(14), W, { couleur: 'vert', alpha: .85 }, dessiner); }

function dessinerLacunes(c) {
  LARG = scene.L; MIN = plancher() / Math.max(.1, scene.s || 1);
  let n = S.lacunes ? Math.min(5, S.lacunes.length) : 0, court = false;

const canvas = $('canvas');
const scene = window.OndesTableau.Scene(canvas, (c) => { scene.cadre(61 + S.page); if (S.page === 1) dessinerFiche(c); else dessinerLacunes(c); return c.fin(); }, { large: true });
/* La fiche est faite de phrases : sur un cadre de téléphone, commun.js tait les phrases (la voix les dit) — pas ici,
 * la fiche est ce que l'élève relit ; elle se coupe déjà en plus de parties sur un petit cadre (18 novembre 2026). */
{ const ecrire = scene.craie.texte; scene.craie.texte = function (s, x, y, o = {}) { return ecrire.call(this, s, x, y, { ...o, garder: true }); }; }
/* Le plancher de 15 px tenu par la page (le kit le baisserait jusqu'à 45 % sur un petit tableau) ; à l'impression, pas de
 * plancher d'écran : la fiche entière sur une page. Indices et exposants : jamais sous le plancher non plus. */
Object.defineProperty(scene.craie, 'tailleMin', { get: () => plancher(), set: () => {}, configurable: true });
(function () {
  const craie = scene.craie, Craie = window.Tableau.Craie, POLICE = window.Tableau.POLICE;
  craie._largeur = function (s, taille, gras) {
    const c = this.ctx, p = petitDe(this, taille);
    return Craie.segments(String(s)).reduce((w, seg) => { c.font = `${gras ? '700 ' : ''}${seg.sub || seg.sup ? p : taille}px ${POLICE}`; return w + c.measureText(seg.t).width; }, 0);
  };

    const petit = petitDe(this, taille), tailleDe = seg => (seg.sub || seg.sup ? petit : taille);
    const total = segs.reduce((w, seg) => { c.font = police(tailleDe(seg)); return w + c.measureText(seg.t).width; }, 0);
    const plain = segs.map(seg => seg.t).join('');

})();
const maintenant = () => (performance.now() - scene.ouvert) / 1000;

/* Page n ; `focus` = le bloc que la voix dit maintenant ; `tout` = toute la fiche d'un coup ; `feuille` = la partie de
 * la fiche à montrer (petit écran) : un bloc dit par la voix montre SA partie. */
function aller(n, par, focus, tout, feuille) {
  n = n === 2 ? 2 : 1;
  const k = focus ? BLOCS.findIndex(b => b.id === focus) : -1;
  const fe = n === 1 ? (k >= 0 ? partieDe(k) : Number.isInteger(feuille) ? Math.max(0, Math.min(feuille, PARTIES.length - 1)) : S.feuille) : S.feuille;
  if (par === 'start' || par === 'reset') { scene.reecrire(); S.apparu = []; }   // rejouer : la fiche se réécrit depuis le début

    scene.reecrire(); S.apparu = S.apparu.map(a => (a == null ? null : AVANT));
  }
  if (n === 1) {
    if (tout) BLOCS.forEach((b, i) => { if (S.apparu[i] == null) S.apparu[i] = AVANT; });
    // une partie ouverte à la main (suite, touche) : ses blocs sont écrits d'un coup
    if (k < 0 && Number.isInteger(feuille)) blocsDe(fe).forEach(i => { if (S.apparu[i] == null) S.apparu[i] = AVANT; });
    if (k >= 0) {
      for (let i = 0; i < k; i++) if (S.apparu[i] == null) S.apparu[i] = AVANT;   // sautés : écrits d'un coup

/** Bouton et numéro : « Suite → » tant qu'il reste une partie de la fiche, puis « Ma page → ». */
function etiquettes() {
  const N = PARTIES.length, fiche = S.page === 1;

  $('page').textContent = fiche ? `${S.feuille + 1} / ${N + 1}` : `${N + 1} / ${N + 1}`;

/** La partie suivante de la fiche, puis la page de l'élève. */
function suite(par = 'next') {
  if (S.page === 1 && S.feuille < PARTIES.length - 1) return aller(1, par, null, false, S.feuille + 1);
  aller(2, par);
}
/** La partie précédente de la fiche ; depuis la page de l'élève, la fiche (entière) là où on l'avait laissée. */
function precedent(par = 'previous') {
  if (S.page === 1 && S.feuille > 0) return aller(1, par, null, true, S.feuille - 1);
  aller(1, par, null, true);
}
function statut(b) {
  if (!S.lacunes) return null;
  const lac = S.lacunes.filter(l => b.comps.includes(l.id));
  if (lac.some(l => l.statut === 'non_acquis')) return 'non_acquis';
  if (lac.length) return 'partiel';

}
/* Les valeurs des moments (18 novembre 2026) : le kit ignore un play_until vers un moment ≤ time_s (« pas de retour en
 * arrière ») ; avec tous les blocs à 1 et time_s = 1 sur la fiche, la voix ne pouvait ni écrire ni éclairer un bloc.
 * Fiche 1,01, blocs 1,1 à 1,8 (tous > 1 : rien n'est jamais effacé ici), la page de l'élève 2. */
function moments() { const m = { fiche: 1.01 }; BLOCS.forEach((b, i) => { m[b.id] = Math.round((1.1 + i / 10) * 100) / 100; }); m.lacunes = 2; return m; }

/** Le professeur montre un bloc d'une autre partie (petit écran) : la fiche passe à cette partie. */
function montrer(p) {

  if (S.page === 1 && k >= 0 && S.apparu[k] != null && partieDe(k) !== S.feuille) aller(1, 'highlight', null, false, partieDe(k));
}
function setParameters(p) {
  if (Array.isArray(p.lacunes)) S.lacunes = p.lacunes.map(l => ({ id: String(l.id || ''), label: String(l.label || l.id || ''), statut: String(l.statut || 'non_acquis'), reprendre_avec: Array.isArray(l.reprendre_avec) ? l.reprendre_avec.map(String) : [] }));
  if (Array.isArray(p.acquis)) S.acquis = p.acquis.map(String);

  const f = S.focus && BLOCS.find(b => b.id === S.focus), N = PARTIES.length;

  return lisible(`Page 1/2, la fiche du chapitre « Propagation d’une onde lumineuse » : ${ecrits}/8 blocs écrits (définition, formule encadrée, piège)${partie}${f ? ` ; en lumière « ${f.titre} » : ${f.def}${f.formules ? ' Formules : ' + f.formules.join(' ; ') + '.' : ''} Piège : ${f.attention}` : '.'}${S.lacunes ? ` Blocs à reprendre : ${BLOCS.filter(b => statut(b) && statut(b) !== 'acquis').map(b => b.titre).join(', ') || 'aucun'}.` : ''}`);

$('suiv').onclick = () => (S.page === 1 ? suite('next') : aller(1, 'previous', null, true));
// Imprimer / PDF : la fiche entière (sur une page, sans plancher d'écran) et la page de l'élève, sur fond blanc (shared/tableau/imprimer.js).
$('imprimer').onclick = () => {
  const avant = { page: S.page, feuille: S.feuille, focus: S.focus, apparu: S.apparu.slice() };
  window.Tableau.imprimer({ titre: 'Ce qu’il faut retenir — propagation d’une onde lumineuse', scene,
    pages: [{ nom: 'la fiche', preparer: () => { S.impression = true; S.page = 1; S.feuille = 0; S.focus = null; S.apparu = BLOCS.map(() => AVANT); } },
            { nom: 'ta page : à retravailler', preparer: () => { S.impression = true; S.page = 2; S.focus = null; } }],
    restaurer: () => { Object.assign(S, avant, { impression: false }); clePlace = ''; scene.sale = true; } });

canvas.addEventListener('pointerdown', e => {
  if (S.page !== 1) return;
  const r = canvas.getBoundingClientRect(), [x, y] = scene.local(e.clientX - r.left, e.clientY - r.top), ici = blocsDe(S.feuille);
  const i = BLOCS.findIndex((b, k) => { const p = POS[k]; return p && ici.includes(k) && S.apparu[k] != null && x >= p.x - 6 && x <= p.x + p.w + 6 && y >= p.y0 - 6 && y <= p.y0 + p.h; });

  S.focus = BLOCS[i].id; scene.sale = true; bulle($('feedback'), lisible(BLOCS[i].def));

const commandes = ['start', 'reset', 'play_until', 'set_parameters', 'next', 'previous', 'highlight'];
const config = { id: 'ondes_lumineuses_bilan', version: '1.1', title: 'Ce qu’il faut retenir — ondes lumineuses', variants: [{ id: 'bilan', label: 'fiche' }], commands: commandes,
  command_schema: { play_until: { moment: Object.keys(moments()).join(' | ') + ' (écrit ce bloc de la fiche et le met en lumière ; fiche = toute la fiche ; lacunes = la page de l’élève)' },

  texte: 'Fiche « Ce qu’il faut retenir » du chapitre « Propagation d’une onde lumineuse », sur une page (huit blocs : diffraction, écart angulaire, largeur de la tache centrale, fil · deux expériences · liquide, courbes, lumière monochromatique, milieu d’indice n, milieu dispersif ; chacun avec définition, formule encadrée, piège ; sur un petit écran, en parties successives), puis la page de l’élève (ce qu’il lui reste à retravailler).',
