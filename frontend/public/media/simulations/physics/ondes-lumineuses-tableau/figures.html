<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Figures à la craie — ondes lumineuses</title>

<body>
<div class="tableau">

  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start reset pause resume play_until set_time set_parameters">Pause</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="commun.js"></script>
<script src="exposants.js"></script>
<script>
/*
 * Figures fixes du cours « Propagation d’une onde lumineuse » (phys_ch3_ondes_lumineuses, 10 novembre 2026), écrites à la
 * craie pas à pas, comme un professeur au tableau : ?fig=fig_eau_lumiere | fig_unites | fig_isoler | fig_montage_examen |
 * fig_deux_experiences | fig_soleil_vide | fig_vide_milieu | fig_trois_phenomenes | fig_cas_types | fig_enonce_2023 |
 * fig_enonce_2021 | fig_enonce_2025. Même architecture que ondes-periodiques-tableau/figures.html.
 * Chaque figure : des étapes nommées (les moments), puis `fin`. Le tuteur fige l’écriture sur une étape (`play_until {moment}`)
 * et montre chaque élément (`highlight {target}`) : le repère `figure`, et un repère par étape (même nom que l’étape).
 * Les milieux réels (eau, faisceau, Soleil, cloche de verre, prisme, liquide) sont peints (règle 7) ; la craie écrit le reste.
 * Les énoncés d’examen sont des paraphrases courtes, données exactes (nationaux 2021 N, 2023 R, 2025 R, exercice 2).
 */
const { bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search);
const FIGS = {
  fig_eau_lumiere: { titre: 'L’eau et la lumière se diffractent', etapes: ['eau', 'lumiere', 'conclusion', 'fin'] },
  fig_unites: { titre: 'L’escalier des longueurs vers le mètre', etapes: ['trace', 'exemples', 'retour', 'fin'] },
  fig_isoler: { titre: 'Isoler une grandeur dans λ/a = L/(2D)', etapes: ['egalite', 'croix', 'L', 'lambda', 'a', 'D', 'fin'] },
  fig_montage_examen: { titre: 'Le schéma de l’examen et les quatre lignes', etapes: ['trace', 'ligne1', 'ligne2', 'ligne3', 'ligne4', 'fin'] },
  fig_deux_experiences: { titre: 'Deux expériences, mêmes conditions (national 2023 R)', etapes: ['trace', 'exp1', 'exp2', 'barre', 'rapport', 'fin'] },
  fig_soleil_vide: { titre: 'La lumière traverse le vide, le son non', etapes: ['lumiere', 'son', 'conclusion', 'fin'] },
  fig_vide_milieu: { titre: 'Du vide à un milieu d’indice n', etapes: ['trace', 'celerite', 'indice', 'longueur', 'frequence', 'fin'] },
  fig_trois_phenomenes: { titre: 'Diffraction, réfraction, dispersion', etapes: ['diffraction', 'refraction', 'dispersion', 'definition', 'fin'] },
  fig_cas_types: { titre: 'Le mot de la question → la méthode', etapes: ['trace', 'nommer', 'etablir', 'fil', 'rapport', 'courbe', 'milieu', 'frequence', 'fin'] },
  fig_enonce_2023: { titre: 'Énoncé type national 2023 R : fente horizontale', etapes: ['trace', 'donnees', 'fin'] },
  fig_enonce_2021: { titre: 'Énoncé type national 2021 N : courbe L = f(D), puis cheveu', etapes: ['trace', 'courbe', 'donnees', 'fin'] },
  fig_enonce_2025: { titre: 'Énoncé type national 2025 R : air, puis liquide', etapes: ['trace', 'liquide', 'donnees', 'fin'] },
};
let fig = FIGS[P.get('fig')] ? P.get('fig') : 'fig_eau_lumiere';
const VITESSE = 1.6;                              // l’écriture va un peu plus vite que la craie du kit
const S = { tw: 0, running: true, pause: false, fait: false, jusqua: null, motif: '', emis: 0 };
let M = {};                                       // étape → instant d’écriture (s), relevé pendant le dessin

const canvas = $('canvas');
const scene = window.OndesTableau.Scene(canvas, dessiner);
const craie = scene.craie;
/* Même cadre que commun.js, mais l’écriture suit l’horloge de la figure (S.tw) : le tuteur peut la figer sur une étape. */
scene.cadre = function (graine) {
  const W = craie.W, H = craie.H, VW = 760, VH = 420;
  craie.debut(graine, S.tw);
  const s = Math.min(W / VW, H / VH);
  scene.s = s; scene.ox = (W - VW * s) / 2; scene.oy = (H - VH * s) / 2;
  craie.ctx.translate(scene.ox, scene.oy); craie.ctx.scale(s, s);
  craie.echelle = s; craie.tailleMin = 11; craie.cadre = { w: VW, h: VH, haut: 0 };
  return craie;
};
let MM = {};
const marque = (c, nom) => { MM[nom] = c.cur; };
/* Une partie peinte (eau, faisceau, Soleil, verre) apparaît quand l’écriture arrive à elle, d’un coup. */
const peindre = (c, fn) => { if (c.t >= c.cur) c.direct(() => { c.ctx.save(); try { fn(c.ctx); } finally { c.ctx.restore(); } }); };
const vu = nom => M[nom] !== undefined && S.tw >= M[nom] - 1e-6;

// ───────────────────────── Le rendu « réel » (peint, pour l’œil ; la physique reste dans les cotes) ─────────────────────────
const rgba = (k, a) => `rgba(${k[0]},${k[1]},${k[2]},${a})`;
/** Couleur perçue d’une radiation de longueur d’onde nm (approximation usuelle du spectre visible, 380 – 780 nm). */
function couleurDe(nm) {
  let r = 0, g = 0, b = 0;
  if (nm < 440) { r = (440 - nm) / 60; b = 1; } else if (nm < 490) { g = (nm - 440) / 50; b = 1; }
  else if (nm < 510) { g = 1; b = (510 - nm) / 20; } else if (nm < 580) { r = (nm - 510) / 70; g = 1; }
  else if (nm < 645) { r = 1; g = (645 - nm) / 65; } else { r = 1; }
  const f = nm < 420 ? .3 + .7 * (nm - 380) / 40 : nm > 700 ? .3 + .7 * (780 - nm) / 80 : 1;
  return [r, g, b].map(v => Math.round(255 * Math.pow(Math.max(0, Math.min(1, v * Math.max(.3, f))), .8)));
}
const ROUGE = couleurDe(650), JAUNE = couleurDe(580), BLANC = [255, 250, 235];
function chemin(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
/** Salle sombre, dans le cadre de la vue seulement (le tableau du cours reste visible autour). */
function salle(ctx, x, y, w, h) {
  chemin(ctx, x, y, w, h, 10); const g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, 'rgba(5,8,16,.74)'); g.addColorStop(1, 'rgba(12,16,28,.64)'); ctx.fillStyle = g; ctx.fill();
}
/** Le boîtier du laser (ou de la source), ombré, et sa sortie lumineuse. */
function boitier(ctx, x, y, w, h, k) {
  chemin(ctx, x, y, w, h, 4); const g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, '#6b7280'); g.addColorStop(.35, '#a3aab5'); g.addColorStop(1, '#2f3744'); ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = rgba(k, .95); ctx.shadowColor = rgba(k, 1); ctx.shadowBlur = 8; ctx.beginPath(); ctx.arc(x + w, y + h / 2, 2.6, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
}
/** Faisceau laser : halo large et pâle, cœur étroit presque blanc. */
function faisceau(ctx, x1, y1, x2, y2, k, w = 2.4) {
  ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  for (const [lw, a] of [[w * 6, .07], [w * 3, .16], [w * 1.4, .55]]) { ctx.strokeStyle = rgba(k, a); ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = w * .45; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
}
/** La lumière qui s’étale après la fente : un éventail qui pâlit en s’éloignant, plus lumineux au centre. */
function eventail(ctx, x0, y0, x1, yh, yb, k, a = .36) {
  ctx.globalCompositeOperation = 'lighter';
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, yh); ctx.lineTo(x1, yb); ctx.closePath();
  const g = ctx.createLinearGradient(x0, y0, x1, y0); g.addColorStop(0, rgba(k, a)); g.addColorStop(1, rgba(k, a * .42)); ctx.fillStyle = g; ctx.fill();
  const m = (yh + yb) / 2, d = (yb - yh) * .16;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, m - d); ctx.lineTo(x1, m + d); ctx.closePath(); ctx.fillStyle = rgba(k, a * .45); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
}
/* Tache centrale de largeur L, taches secondaires deux fois plus étroites. Leur éclat est renforcé pour l’œil (en vrai bien plus pâles). */
const TACHES = (L, n = 2) => [[0, L / 2, 1], [.75 * L, L / 4, .42], [-.75 * L, L / 4, .42], [1.25 * L, L / 4, .22], [-1.25 * L, L / 4, .22]].slice(0, 1 + 2 * n);
/** L’éventail dirigé vers chaque tache : rien ne va vers les extinctions (secteurs sombres entre deux taches). */
function eventailTaches(ctx, xf, yc, xe, L, k, n = 1, a = .34) {
  for (const [c0, h, I] of TACHES(L, n)) eventail(ctx, xf, yc, xe, yc + c0 - h * .85, yc + c0 + h * .85, k, a * Math.sqrt(I));
}
/** Les taches sur l’écran vu par la tranche (une ligne lumineuse coupée d’extinctions sombres). */
function tachesLigne(ctx, x, yc, L, k, ep = 4, n = 1) {
  ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  for (const [c0, h, I] of TACHES(L, n)) for (const [lw, a] of [[ep * 3.4, .18], [ep * 1.8, .45], [ep * .9, .95], [ep * .35, 1.6]]) {
    ctx.strokeStyle = a > 1 ? `rgba(255,255,255,${.6 * I})` : rgba(k, a * I); ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(x, yc + c0 - h * .82); ctx.lineTo(x, yc + c0 + h * .82); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}
/** Les taches sur l’écran vu de face : ellipses en dégradé d’intensité, alignées verticalement ou horizontalement. */
function tachesFace(ctx, cx, cy, L, k, vertical, ep = 7) {
  ctx.globalCompositeOperation = 'lighter';
  for (const [c0, h, I] of TACHES(L)) {
    const r = h * .85; ctx.save(); ctx.translate(vertical ? cx : cx + c0, vertical ? cy + c0 : cy);
    if (vertical) ctx.scale(ep / r, 1); else ctx.scale(1, ep / r);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r); g.addColorStop(0, `rgba(255,255,255,${.75 * I})`); g.addColorStop(.3, rgba(k, .9 * I)); g.addColorStop(1, rgba(k, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill(); ctx.restore();
  }
  ctx.globalCompositeOperation = 'source-over';
}
/** Eau vue de dessus : fond de cuve en dégradé, crêtes claires et creux sombres (ondes planes, puis arcs derrière l’ouverture). */
function eauDiffraction(ctx, A, xo, yo, lam) {
  chemin(ctx, A.x, A.y, A.w, A.h, 6); ctx.clip();
  const g = ctx.createLinearGradient(A.x, A.y, A.x + A.w, A.y + A.h); g.addColorStop(0, 'rgba(40,125,155,.30)'); g.addColorStop(1, 'rgba(18,78,108,.24)');
  ctx.fillStyle = g; ctx.fillRect(A.x, A.y, A.w, A.h);
  ctx.fillStyle = 'rgba(255,255,255,.035)'; ctx.fillRect(A.x, A.y, A.w, A.h * .35);     // reflet du ciel, très léger
  ctx.lineCap = 'round';
  for (let k = 0; xo - k * lam > A.x; k++) {
    const x = xo - (k + .5) * lam;
    ctx.strokeStyle = 'rgba(4,36,56,.30)'; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(x + lam / 2, A.y); ctx.lineTo(x + lam / 2, A.y + A.h); ctx.stroke();
    ctx.strokeStyle = 'rgba(215,243,255,.55)'; ctx.lineWidth = 2.6; ctx.beginPath(); ctx.moveTo(x, A.y); ctx.lineTo(x, A.y + A.h); ctx.stroke();
  }
  for (let k = 1; k * lam < A.w; k++) {
    const r = (k - .5) * lam, a = Math.max(.12, .6 - k * .045);                       // pâlit avec la distance (pour l’œil seulement)
    ctx.strokeStyle = `rgba(4,36,56,${a * .5})`; ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(xo, yo, k * lam, -1.3, 1.3); ctx.stroke();
    ctx.strokeStyle = `rgba(215,243,255,${a})`; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.arc(xo, yo, r, -1.3, 1.3); ctx.stroke();
  }
}
function soleil(ctx, x, y, r) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 2.6);
  g.addColorStop(0, '#fffbe8'); g.addColorStop(.28, '#fde047'); g.addColorStop(.4, 'rgba(251,160,60,.75)'); g.addColorStop(.6, 'rgba(251,146,60,.18)'); g.addColorStop(1, 'rgba(251,146,60,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 2.6, 0, 7); ctx.fill();
}
function terre(ctx, x, y, r) {
  const g = ctx.createRadialGradient(x - r * .4, y - r * .4, r * .1, x, y, r);
  g.addColorStop(0, '#bfdbfe'); g.addColorStop(.45, '#3b82f6'); g.addColorStop(1, '#0b1f4d'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(74,222,128,.45)'; ctx.beginPath(); ctx.ellipse(x - r * .2, y + r * .1, r * .35, r * .22, .6, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(147,197,253,.35)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, r + 2, 0, 7); ctx.stroke();
}
function espace(ctx, A) {
  chemin(ctx, A.x, A.y, A.w, A.h, 8); const g = ctx.createLinearGradient(A.x, 0, A.x + A.w, 0);
  g.addColorStop(0, 'rgba(10,10,26,.78)'); g.addColorStop(1, 'rgba(4,6,18,.74)'); ctx.fillStyle = g; ctx.fill();
  let s = 7; const r = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  for (let i = 0; i < 40; i++) { ctx.globalAlpha = .25 + .5 * r(); ctx.beginPath(); ctx.arc(A.x + 6 + r() * (A.w - 12), A.y + 6 + r() * (A.h - 12), .6 + r() * .9, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
}
/** Cloche de verre posée sur son plateau, sonnette dorée à l’intérieur, tuyau vers la pompe. */
function cloche(ctx, cx, base, w, h, px) {
  ctx.strokeStyle = '#4b5563'; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(cx + w / 2 + 14, base + 6); ctx.lineTo(px, base + 6); ctx.lineTo(px, base - 20); ctx.stroke();
  let g = ctx.createLinearGradient(px - 22, 0, px + 22, 0); g.addColorStop(0, '#374151'); g.addColorStop(.4, '#9ca3af'); g.addColorStop(1, '#1f2937');
  ctx.fillStyle = g; chemin(ctx, px - 22, base - 56, 44, 40, 5); ctx.fill();
  g = ctx.createLinearGradient(0, base, 0, base + 12); g.addColorStop(0, '#9ca3af'); g.addColorStop(1, '#374151');
  ctx.fillStyle = g; chemin(ctx, cx - w / 2 - 22, base, w + 44, 12, 3); ctx.fill();
  // la sonnette : tige, timbre doré ombré, marteau
  ctx.strokeStyle = '#6b7280'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cx, base); ctx.lineTo(cx, base - 52); ctx.stroke();
  g = ctx.createRadialGradient(cx - 8, base - 72, 2, cx, base - 62, 24); g.addColorStop(0, '#fff7cc'); g.addColorStop(.4, '#eab308'); g.addColorStop(1, '#713f12');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, base - 52, 22, Math.PI, 0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#9ca3af'; ctx.beginPath(); ctx.arc(cx + 26, base - 40, 5, 0, 7); ctx.fill();
  ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx + 26, base - 40); ctx.lineTo(cx + 40, base - 20); ctx.stroke();
  // le verre : teinte légère, arêtes éclairées, un reflet
  const yt = base - h + w / 2;
  ctx.beginPath(); ctx.moveTo(cx - w / 2, base); ctx.lineTo(cx - w / 2, yt); ctx.arc(cx, yt, w / 2, Math.PI, 0); ctx.lineTo(cx + w / 2, base); ctx.closePath();
  g = ctx.createLinearGradient(cx - w / 2, 0, cx + w / 2, 0); g.addColorStop(0, 'rgba(190,225,245,.16)'); g.addColorStop(.5, 'rgba(190,225,245,.05)'); g.addColorStop(1, 'rgba(190,225,245,.13)');
  ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = 'rgba(225,242,255,.55)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(cx - w / 2 + 12, base - 14); ctx.lineTo(cx - w / 2 + 12, yt); ctx.arc(cx, yt, w / 2 - 12, Math.PI, Math.PI * 1.35); ctx.stroke();
}
/** Verre (prisme) : teinte légère, arêtes éclairées. */
function verre(ctx, pts) {
  ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.closePath();
  const g = ctx.createLinearGradient(pts[0][0], pts[0][1], pts[1][0], pts[1][1]); g.addColorStop(0, 'rgba(195,228,245,.26)'); g.addColorStop(1, 'rgba(120,170,205,.12)');
  ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = 'rgba(230,246,255,.6)'; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(...pts[0]); ctx.lineTo(...pts[1]); ctx.stroke();
}
/** Eau ou liquide vu de côté : plus clair en haut, plus sombre en profondeur, surface brillante. */
function liquide(ctx, x, y, w, h) {
  const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, 'rgba(80,160,210,.34)'); g.addColorStop(1, 'rgba(20,70,125,.46)');
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = 'rgba(200,235,255,.7)'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.stroke();
}
/** Les couleurs qui sortent d’un prisme : un éventail du rouge (le moins dévié) au violet (le plus dévié). */
function spectreSortie(ctx, x0, y0, x1, yRouge, yViolet) {
  ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  for (let nm = 700; nm >= 400; nm -= 6) {
    const u = (700 - nm) / 300, y = yRouge + (yViolet - yRouge) * u, k = couleurDe(nm);
    ctx.strokeStyle = rgba(k, .35); ctx.lineWidth = 2.6; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}

// ───────────────────────── Morceaux de craie ─────────────────────────
/** Une fraction écrite à la craie : numérateur, barre, dénominateur ; renvoie les positions (pour barrer). */
function fraction(c, x, y, num, den, o = {}) {
  const t = o.taille ?? 26, col = o.couleur ?? 'blanc', net = s => s.replace(/_/g, '');
  const w = Math.max(c.largeurTexte(net(num), t), c.largeurTexte(net(den), t)) + 12;
  c.texte(num, x, y - 7, { couleur: col, taille: t, align: 'center' });
  c.ligne(x - w / 2, y, x + w / 2, y, { couleur: col, largeur: 2, duree: .12 });
  c.texte(den, x, y + t * .9 + 2, { couleur: col, taille: t, align: 'center' });
  return { w, haut: y - t * .45, bas: y + t * .55, wn: c.largeurTexte(net(num), t), wd: c.largeurTexte(net(den), t) };
}
/** Arc d’angle à la craie, de l’angle a0 à a1 (radians, sens du canvas). */
const arc = (c, x, y, r, a0, a1, o) => c.courbe(u => [x + r * Math.cos(a0 + (a1 - a0) * u), y + r * Math.sin(a0 + (a1 - a0) * u)], 14, o);
/** Montage de diffraction vu de dessus, à la manière d’un document d’examen. Renvoie les abscisses utiles. */
function montage(c, o) {
  const { x0, yc, xf, xe, h, k, salleR, lettreL = 'L', theta = true } = o;
  peindre(c, ctx => {
    if (salleR) salle(ctx, ...salleR);
    if (o.liquide) liquide(ctx, xf + 8, o.liquide[0], xe - xf - 4, o.liquide[1]);
    boitier(ctx, x0, yc - 12, 66, 24, k); faisceau(ctx, x0 + 66, yc, xf, yc, k);
    eventailTaches(ctx, xf, yc, xe, 2 * h, k); tachesLigne(ctx, xe, yc, 2 * h, k);
  });
  c.ligne(xf, yc - 70 * o.ech, xf, yc - 4, { couleur: 'blanc', largeur: 3 }).ligne(xf, yc + 4, xf, yc + 70 * o.ech, { couleur: 'blanc', largeur: 3 });
  c.ligne(xe, yc - 86 * o.ech, xe, yc + 86 * o.ech, { couleur: 'blanc', largeur: 4 });
  c.ligne(xf, yc, xe, yc, { couleur: 'faible', largeur: 1.2, pointille: [6, 5] });

  return c.fin() || !S.running;   // figée sur une étape : l’image ne change plus, on cesse de la redessiner
}

const etapes = () => FIGS[fig].etapes;
const etiquette = () => { $('run').textContent = S.running ? 'Pause' : S.pause ? 'Reprendre' : 'Rejouer'; };
scene.avancer = dt => {
  if (!S.running) return false;
  S.tw += dt * VITESSE;
  if (S.jusqua != null && S.tw >= S.jusqua) {
    S.tw = S.jusqua; S.jusqua = null; S.running = false;
    if (M.fin !== undefined && S.tw >= M.fin - 1e-6) { S.pause = false; S.fait = true; etiquette(); bulle($('feedback'), 'Arrêt sur image : figure complète.'); pont.noter('measurement', { figure: fig }); pont.emettre(); return true; }
    S.pause = true; etiquette();
    bulle($('feedback'), 'Arrêt sur image : ' + (S.motif || 'instant choisi') + '.'); pont.noter('pause', { moment: S.motif }); pont.emettre();
    return true;
  }
  if (M.fin !== undefined && S.tw >= M.fin + 0.05) {
    S.running = false; S.pause = false; S.fait = true; etiquette(); pont.noter('measurement', { figure: fig }); pont.emettre();
  } else if (performance.now() - S.emis > 500) { S.emis = performance.now(); pont.emettre(); }
  return true;
};
function calculer() { if (M.fin === undefined) { const t = S.tw; S.tw = 1e6; dessiner(craie); S.tw = t; scene.sale = true; } }
function start() { S.tw = 0; S.jusqua = null; S.motif = ''; S.running = true; S.pause = false; S.fait = false; scene.sale = true; etiquette(); bulle($('feedback'), ''); pont.noter('start', { figure: fig }); pont.emettre(); }
function pause() { if (!S.running) return; S.running = false; S.pause = true; S.jusqua = null; etiquette(); bulle($('feedback'), 'Pause.'); pont.noter('pause'); pont.emettre(); }
function resume() { if (S.running) return; if (!S.pause) return start(); S.running = true; S.pause = false; etiquette(); bulle($('feedback'), ''); pont.noter('resume'); pont.emettre(); }
function playUntil(p) {
  calculer();
  const nom = p.moment in M && etapes().includes(p.moment) ? p.moment : null, cible = nom ? M[nom] : +p.time_s;
  if (!Number.isFinite(cible)) return;
  if (S.fait || !(S.running || S.pause) || S.tw >= cible - 1e-3) { S.tw = 0; S.fait = false; }
  S.jusqua = cible; S.motif = nom ? MOTIFS[fig][nom] : `t = ${cible.toFixed(1).replace('.', ',')} s d’écriture`; S.running = true; S.pause = false; etiquette(); bulle($('feedback'), '');
  pont.noter('play_until', { moment: nom, time_s: +cible.toFixed(2) }); pont.emettre();
}
function setTime(p) {
  calculer(); const t = Math.max(0, Math.min(+p.time_s, M.fin ?? 0)); if (!Number.isFinite(t)) return;
  S.tw = t; S.jusqua = null; S.running = false; S.fait = t >= (M.fin ?? 0) - 1e-6; S.pause = !S.fait; scene.sale = true; etiquette();
  bulle($('feedback'), 'Arrêt sur image : ' + (S.fait ? 'figure complète' : `t = ${t.toFixed(1).replace('.', ',')} s d’écriture`) + '.'); pont.noter('set_time', { time_s: t }); pont.emettre();
}
function setParameters(p) {
  const f = p.fig || p.figure || p.variant;
  if (!f || !FIGS[f] || f === fig) return;
  fig = f; M = {}; config.title = 'Figure — ' + FIGS[fig].titre; config.variants = [{ id: fig, label: FIGS[fig].titre }];
  config.command_schema.play_until.moment = FIGS[fig].etapes.join(' | ') + ' (réécrit la figure et s’arrête après cette étape)';
  start(); setTimeout(() => pont.manifeste(), 400);
}
$('run').onclick = () => (S.running ? pause() : S.pause ? resume() : start());

function ceQuiSeVoit() {
  const D = DESCRIPTIONS[fig], faites = etapes().filter(n => vu(n));
  const m = [`Figure « ${fig} » : ${FIGS[fig].titre}.`];
  if (!faites.length) m.push(S.running ? 'La figure est en train de s’écrire à la craie (première étape pas encore finie).' : 'Rien d’écrit encore.');
  faites.forEach(n => { if (D[n]) m.push(D[n]); });
  m.push(S.running ? 'La craie écrit encore.' : S.pause ? `Écriture arrêtée après l’étape « ${faites.length ? faites[faites.length - 1] : 'aucune'} ».` : 'Figure complète.');
  return m.join(' ');
}
window.Tableau.explication(Object.fromEntries(Object.keys(FIGS).map(f => [f,
  FIGS[f].etapes.filter(e => DESCRIPTIONS[f][e]).map(e => ({ repere: e, texte: DESCRIPTIONS[f][e] }))])));
const commandes = ['start', 'reset', 'pause', 'resume', 'play_until', 'set_time', 'set_parameters'];
const config = { id: 'ondes_lumineuses_figures', version: '1.0', title: 'Figure — ' + FIGS[fig].titre, variants: [{ id: fig, label: FIGS[fig].titre }], commands: commandes,
  command_schema: { play_until: { moment: FIGS[fig].etapes.join(' | ') + ' (réécrit la figure et s’arrête après cette étape)', time_s: 'instant d’écriture (s)' },
    set_time: { time_s: 'instant d’écriture (s), figé' }, set_parameters: { fig: Object.keys(FIGS).join(' | ') } } };
const pont = protocole({ id: config.id, commandes, config,
  texte: `Figure du cours « Propagation d’une onde lumineuse » : ${FIGS[fig].titre}. Étapes d’écriture : ${FIGS[fig].etapes.join(', ')}.`,
  etat: () => ({ simulation_status: S.running ? 'running' : S.pause ? 'paused' : 'finished', ce_qui_se_voit: ceQuiSeVoit(), current_variant: fig,
    time_s: +S.tw.toFixed(2), parameters: { fig },
    moments: Object.fromEntries(etapes().filter(n => M[n] !== undefined).map(n => [n, +M[n].toFixed(2)])), etapes_ecrites: etapes().filter(n => vu(n)) }),
  progression: () => (S.fait ? 1 : 0),
  executer: (cmd, p) => ({ start, reset: start, pause, resume, play_until: () => playUntil(p), set_time: () => setTime(p), set_parameters: () => setParameters(p) })[cmd]?.() });
etiquette();
