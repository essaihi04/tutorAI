<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Le spectre visible — au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="lumiere.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Le spectre de la lumière de 300 à 900 nm : ultraviolet, visible du violet au rouge, infrarouge ; un curseur de longueur d’onde donne λ₀ en nm et en m, la couleur et la fréquence ν = c/λ₀"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start reset pause resume play_until set_time">Lancer</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="commun.js"></script>
<script src="exposants.js"></script>
<script>
/*
 * Le spectre visible, λ₀ et ν (cours « Propagation d’une onde lumineuse », 10 novembre 2026).
 * Une vue « Le spectre » : bande de 300 à 900 nm, peinte dans une petite salle sombre (dans le cadre de la vue seulement) :
 * ultraviolet (< 400 nm, sombre) | visible (400 à 800 nm, dégradé continu du violet au rouge) | infrarouge (> 800 nm, sombre).
 * Un curseur (poignée glissée sur le dessin) donne λ₀ en nm et en m, la couleur, ν = c/λ₀ (c = 3,00·10⁸ m/s) et « visible »
 * ou « non visible ». Hors de 300..900 nm (lambda_nm de 100 à 100 000), le curseur reste collé au bord avec une flèche
 * « bien plus loin : pas visible ».
 * La couleur peinte (couleurDe) est une approximation réaliste pour l’œil (pâlit vers 400 et 800 nm) ; les valeurs
 * écrites (λ₀, ν) sont exactes.
 * Moments : bande_peinte, violet_400, vert_520, rouge_800, ultraviolet (350 nm), infrarouge (900 nm), valeur (lambda_nm), fin.
 */
const { fr, bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);
const C_LUM = 3.00e8;
const qs = new URLSearchParams(location.search);
const vue = 'spectre';
const borne = l => Math.min(100000, Math.max(100, Math.round(l)));
const S = { t: 0, running: false, pause: false, fait: false, jusqua: null, motif: '', lambda: borne(+qs.get('lambda_nm') || 650), glisse: false, ecrit: {}, emis: 0 };

/* ── Dessin : 1 nm = 1 px, 300 nm en x = 80, 900 nm en x = 680 ─────────────────────────── */
const X = nm => 80 + (nm - 300);
const NM = x => x - 80 + 300;
const BY0 = 70, BY1 = 136, YK = 190;                // bande ; bouton du curseur

/* Couleur d’une radiation (approximation réaliste, pour l’œil) : [r, g, b] de 0 à 1 et l’éclat. */
function rgbDe(l) {
  let r = 0, g = 0, b = 0;
  if (l < 440) { r = Math.max(0, (440 - l) / 60); b = 1; }
  else if (l < 490) { g = (l - 440) / 50; b = 1; }
  else if (l < 510) { g = 1; b = (510 - l) / 20; }
  else if (l < 580) { r = (l - 510) / 70; g = 1; }
  else if (l < 645) { r = 1; g = (645 - l) / 65; }
  else r = 1;
  let k = 0;
  if (l >= 400 && l < 425) k = 0.35 + 0.65 * (l - 400) / 25;
  else if (l >= 425 && l <= 700) k = 1;
  else if (l > 700 && l <= 800) k = 1 - 0.7 * (l - 700) / 100;
  return { r: r ** 0.8, g: g ** 0.8, b: b ** 0.8, k };
}
function couleurDe(l, alpha = 1, blanc = 0) {
  const c = rgbDe(l), k = blanc ? 1 : c.k, m = v => Math.round(255 * ((v * k) * (1 - blanc) + blanc));
  return `rgba(${m(c.r)},${m(c.g)},${m(c.b)},${alpha})`;
}
function nomCouleur(l) {
  if (l < 400) return null; if (l > 800) return null;
  if (l < 445) return 'violet'; if (l < 490) return 'bleu'; if (l < 570) return 'vert';
  if (l < 590) return 'jaune'; if (l < 620) return 'orange'; return 'rouge';
}
const domaine = l => (l < 400 ? 'ultraviolet' : l > 800 ? 'infrarouge' : 'visible');

/* Écriture scientifique « 6,5·10⁻⁷ » (exposants écrits par exposants.js). */
const SUPS = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
function sci(v, sig = 3, court = true) {
  if (!(v > 0)) return '0';
  let e = Math.floor(Math.log10(v)), s = (v / 10 ** e).toPrecision(sig);
  if (+s >= 10) { e += 1; s = (v / 10 ** e).toPrecision(sig); }
  if (court && s.includes('.')) { s = s.replace(/0+$/, ''); if (s.endsWith('.')) s += '0'; }
  return s.replace('.', ',') + '·10' + String(e).split('').map(ch => SUPS[ch]).join('');
}
const nmTexte = l => (l >= 10000 ? String(l).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') : String(l));
const nu = l => C_LUM / (l * 1e-9);

/* ── Le temps de la scène : instants clés et trajet du curseur ─────────────────────────── */
const T_BANDE0 = 0.2, T_APP = 1.8, MAINTIEN = 0.35;
const ARRETS = [['violet_400', 400, 3.0], ['vert_520', 520, 4.5], ['rouge_800', 800, 6.0], ['ultraviolet', 350, 7.5], ['infrarouge', 900, 9.0], ['valeur', null, 10.5]];
const visibleSurBande = l => Math.min(900, Math.max(300, l));
function moments() {
  const m = { bande_peinte: 1.5 };
  for (const [nom, , t] of ARRETS) m[nom] = t;
  m.fin = 11.5;
  return m;
}
const FIN = () => moments().fin;
const lisse = u => u * u * (3 - 2 * u);
/** Position du curseur sur la bande (nm), ou null s’il n’est pas encore posé. */
function curseurNm(t = S.t) {
  if (S.glisse) return visibleSurBande(S.lambda);
  if (t < T_APP) return null;
  let avant = 600, depart = T_APP + MAINTIEN;
  for (const [, nm, ta] of ARRETS) {
    const cible = nm ?? visibleSurBande(S.lambda);
    if (t < ta) { const u = Math.max(0, Math.min(1, (t - depart) / (ta - depart))); return avant + (cible - avant) * lisse(u); }
    avant = cible; depart = ta + MAINTIEN;
  }
  return avant;
}
/** La valeur affichée : la position du curseur, ou la vraie lambda_nm une fois le curseur arrivé (même hors bande). */
function lambdaLue() {
  if (S.glisse) return S.lambda;
  const k = curseurNm(); if (k == null) return null;
  return S.t >= moments().valeur - 1e-6 ? S.lambda : Math.round(k);
}
const MOTIFS = {
  bande_peinte: 'la bande est peinte : ultraviolet, visible, infrarouge', violet_400: 'le curseur à 400 nm : le violet, bord du visible',
  vert_520: 'le curseur à 520 nm : le vert', rouge_800: 'le curseur à 800 nm : le rouge, autre bord du visible',
  ultraviolet: 'le curseur à 350 nm : ultraviolet, non visible', infrarouge: 'le curseur à 900 nm : infrarouge, non visible',
  valeur: 'le curseur à la valeur demandée', fin: 'λ₀, la couleur et ν sont écrits',
};

/* ── Peinture : salle sombre, bande du spectre, lueur ─────────────────────────────────── */
function peindreBande(ctx, part) {
  ctx.save();
  // La salle sombre, seulement autour de la bande.
  ctx.fillStyle = 'rgba(3,5,9,.86)'; ctx.beginPath(); ctx.roundRect(70, BY0 - 9, 620, BY1 - BY0 + 18, 8); ctx.fill();
  if (part > 0) {
    const xmax = X(300 + 600 * part);
    ctx.beginPath(); ctx.rect(X(300), BY0 - 14, xmax - X(300), BY1 - BY0 + 28); ctx.clip();
    const g = ctx.createLinearGradient(X(300), 0, X(900), 0);
    for (let l = 300; l <= 900; l += 5) {
      let col;
      if (l < 400) col = `rgba(${16 + Math.round(10 * (l - 300) / 100)},8,${26 + Math.round(16 * (l - 300) / 100)},1)`;     // ultraviolet : sombre
      else if (l > 800) col = `rgba(${30 - Math.round(12 * (l - 800) / 100)},7,7,1)`;                                          // infrarouge : sombre
      else col = couleurDe(l);
      g.addColorStop((l - 300) / 600, col);
    }
    // Lueur autour du visible (pour l’œil).
    ctx.save(); ctx.filter = 'blur(9px)'; ctx.globalAlpha = .55; ctx.fillStyle = g; ctx.fillRect(X(300), BY0 - 4, 600, BY1 - BY0 + 8); ctx.restore();
    ctx.fillStyle = g; ctx.fillRect(X(300), BY0, 600, BY1 - BY0);
    // Bords haut et bas plus sombres : une bande de lumière projetée.
    const v = ctx.createLinearGradient(0, BY0, 0, BY1);
    v.addColorStop(0, 'rgba(0,0,0,.45)'); v.addColorStop(.22, 'rgba(0,0,0,0)'); v.addColorStop(.78, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.45)');
    ctx.fillStyle = v; ctx.fillRect(X(300), BY0, 600, BY1 - BY0);
    // Un léger éclat au centre de la bande.
    const h = ctx.createLinearGradient(0, BY0, 0, BY1);
    h.addColorStop(.35, 'rgba(255,255,255,0)'); h.addColorStop(.5, 'rgba(255,255,255,.10)'); h.addColorStop(.65, 'rgba(255,255,255,0)');
    ctx.fillStyle = h; ctx.fillRect(X(400), BY0, 400, BY1 - BY0);
  }
  ctx.restore();
}
/* La pastille de couleur (lumière de la radiation, avec halo). */
function pastille(ctx, x, y, l) {
  ctx.save();
  if (l >= 400 && l <= 800) {
    const g = ctx.createRadialGradient(x, y, 1, x, y, 16);
    g.addColorStop(0, couleurDe(l, 1, .45)); g.addColorStop(.45, couleurDe(l, .95)); g.addColorStop(1, couleurDe(l, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 16, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(3,5,9,.9)'; ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(226,232,240,.35)'; ctx.lineWidth = 1.2; ctx.stroke();
  }
  ctx.restore();
}

function dessiner(c) {
  scene.cadre(41);
  const actif = S.running || S.pause || S.fait, M = moments();
  const part = S.glisse ? 1 : actif ? Math.max(0, Math.min(1, (S.t - T_BANDE0) / (M.bande_peinte - T_BANDE0))) : 0;
  c.direct(() => peindreBande(c.ctx, part));
  c.texte('Le spectre', 20, 28, { couleur: 'cyan', taille: 20 });
  c.texte('λ_0 : longueur d’onde dans le vide (ou dans l’air)', 740, 28, { couleur: 'faible', taille: 15, align: 'right' });
  c.repere('spectre', 70, BY0 - 9, 620, BY1 - BY0 + 18, 'le spectre, de 300 à 900 nm');

  // Les trois domaines, au-dessus de la bande.
  const accolade = (a, b, coul) => { c.trait([[X(a) + 2, 64], [X(a) + 2, 57], [X(b) - 2, 57], [X(b) - 2, 64]], { couleur: coul, largeur: 1.6 }); };
  accolade(300, 400, 'violet'); c.texte('ultraviolet', X(350), 51, { couleur: 'violet', taille: 15, align: 'center' });
  accolade(400, 800, 'vert'); c.texte('visible', X(600), 51, { couleur: 'vert', taille: 17, align: 'center' });
  accolade(800, 900, 'rouge'); c.texte('infrarouge', X(850), 51, { couleur: 'rouge', taille: 15, align: 'center' });
  c.repere('uv', X(300), 36, 100, BY1 - 36, 'l’ultraviolet (moins de 400 nm) : non visible');
  c.repere('visible', X(400), 36, 400, BY1 - 36, 'le visible, de 400 nm (violet) à 800 nm (rouge)');
  c.repere('ir', X(800), 36, 100, BY1 - 36, 'l’infrarouge (plus de 800 nm) : non visible');

  // Les graduations (nm) et les bornes du visible.
  c.ligne(X(300), BY1 + 1, X(900), BY1 + 1, { couleur: 'faible', largeur: 1.4 });
  for (let l = 300; l <= 900; l += 50) c.ligne(X(l), BY1 + 1, X(l), BY1 + (l % 100 ? 6 : 11), { couleur: 'faible', largeur: 1.3, duree: .02 });
  for (let l = 400; l <= 800; l += 100) c.texte(String(l), X(l), BY1 + 28, { couleur: l === 400 || l === 800 ? 'blanc' : 'faible', taille: 15, align: 'center', duree: .12 });
  c.texte('300', X(300), BY1 + 28, { couleur: 'tresfaible', taille: 13, align: 'center', duree: .1 });
  c.texte('900', X(900), BY1 + 28, { couleur: 'tresfaible', taille: 13, align: 'center', duree: .1 });
  c.texte('nm', 712, BY1 + 28, { couleur: 'faible', taille: 15, align: 'center' });
  for (const l of [400, 800]) c.ligne(X(l), BY0 - 6, X(l), BY1 + 12, { couleur: 'blanc', largeur: 1.3, pointille: [4, 4], alpha: .7 });
  c.repere('borne_400', X(400) - 18, BY0 - 6, 36, BY1 - BY0 + 38, '400 nm : la borne violette du visible');
  c.repere('borne_800', X(800) - 18, BY0 - 6, 36, BY1 - BY0 + 38, '800 nm : la borne rouge du visible');
  c.texte('c = 3,00·10⁸ m/s ;  1 nm = 10⁻⁹ m', 740, 392, { couleur: 'faible', taille: 17, align: 'right' });

  // ── Le curseur et la lecture, qui bougent ──
  c.direct(() => {
    const k = actif || S.glisse ? curseurNm() : null;
    if (k == null) { c.texte('Le curseur arrive…', 60, 240, { couleur: 'tresfaible', taille: 16 }); return; }
    const x = X(k), ctx = c.ctx;
    // Trait du curseur dans la bande : un fil clair bordé de sombre (lisible sur toutes les couleurs).
    ctx.save(); ctx.strokeStyle = 'rgba(0,0,0,.65)'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(x, BY0 - 4); ctx.lineTo(x, BY1 + 4); ctx.stroke();
    ctx.strokeStyle = '#fff8d6'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
    c.trait([[x - 7, BY1 + 15], [x, BY1 + 5], [x + 7, BY1 + 15]], { couleur: 'jaune', largeur: 2, ferme: true });
    c.ligne(x, BY1 + 16, x, YK - 10, { couleur: 'jaune', largeur: 1.2, pointille: [3, 4] });
    c.cercle(x, YK, 9, { couleur: 'jaune', largeur: 2.2, fond: 'jaune', fondAlpha: .25 });
    const l = lambdaLue();
    if (l >= 300 && l <= 900) c.texte('⇠ glisse ⇢', x, YK + 26, { couleur: 'tresfaible', taille: 13, align: 'center' });
    c.repere('curseur', x - 16, BY0 - 6, 32, YK + 12 - BY0 + 6, 'le curseur de longueur d’onde');

    // Hors de la bande : collé au bord, flèche « bien plus loin ».
    if (l < 300 || l > 900) {
      const g = l < 300, x0 = g ? X(300) - 14 : X(900) + 14, x1 = g ? 22 : 738;
      c.fleche(x0, YK, x1, YK, { couleur: 'orange', largeur: 2 });
      c.texte('bien plus loin : pas visible', g ? 20 : 740, YK + 26, { couleur: 'orange', taille: 15, align: g ? 'left' : 'right' });
    }
    const dom = domaine(l), nom = nomCouleur(l), coulTexte = nom ? couleurDe(Math.min(780, Math.max(410, l)), 1, .3) : 'faible';
    c.texte(`λ_0 = ${nmTexte(l)} nm = ${sci(l * 1e-9)} m`, 60, 248, { couleur: 'jaune', taille: 22 });
    c.repere('valeur_m', 54, 226, 470, 28, 'λ₀ en nm et en m');
    c.texte('couleur :', 60, 280, { couleur: 'faible', taille: 19 });
    c.texte(nom || 'aucune (l’œil ne la voit pas)', 136, 280, { couleur: coulTexte, taille: 20 });
    c.direct(() => pastille(ctx, nom ? 136 + c.largeurTexte(nom, 20) + 26 : 360, 274, l));
    c.repere('couleur', 54, 260, 330, 28, 'la couleur de la radiation');
    c.texte(`ν = c/λ_0 = 3,00·10⁸ / ${sci(l * 1e-9)} = ${sci(nu(l), 3, false)} Hz`, 60, 314, { couleur: 'blanc', taille: 20, max: 660 });
    c.repere('frequence', 54, 292, 600, 28, 'la fréquence ν = c/λ₀');
    c.texte(dom === 'visible' ? 'visible' : `non visible (${dom})`, 60, 348, { couleur: dom === 'visible' ? 'vert' : 'orange', taille: 21 });
    c.repere('nature', 54, 326, 300, 28, 'visible ou non visible');
  });
  return c.fin();
}

const canvas = $('canvas');
const scene = window.OndesTableau.Scene(canvas, dessiner);
const etiquette = () => { $('run').textContent = S.running ? 'Pause' : S.pause ? 'Reprendre' : S.fait ? 'Rejouer' : 'Lancer'; };
scene.avancer = dt => {
  if (!S.running) return false;
  S.t = Math.min(FIN(), S.t + dt);
  if (S.jusqua != null && S.t >= S.jusqua) {
    S.t = S.jusqua; S.jusqua = null; S.running = false; S.pause = S.t < FIN(); S.fait = !S.pause; etiquette();
    bulle($('feedback'), 'Arrêt sur image : ' + (S.motif || `t = ${fr(S.t, 1)} s`) + '.'); pont.noter('pause', { time_s: +S.t.toFixed(2) }); pont.emettre();
    return true;
  }
  if (S.t >= FIN()) {
    S.running = false; S.pause = false; S.fait = true; etiquette();
    bulle($('feedback'), message(), 'good'); pont.noter('measurement', mesure()); pont.emettre();
  } else if (performance.now() - S.emis > 500) { S.emis = performance.now(); pont.emettre(); }
  return true;
};
function message() {
  const l = S.lambda, d = domaine(l);
  return `λ₀ = ${nmTexte(l)} nm = ${sci(l * 1e-9)} m : ${d === 'visible' ? nomCouleur(l) + ', visible' : 'non visible (' + d + ')'} ; ν = ${sci(nu(l), 3, false)} Hz.`;
}
const mesure = () => ({ lambda_nm: S.lambda, lambda_m: +(S.lambda * 1e-9).toPrecision(3), frequence_hz: +nu(S.lambda).toPrecision(3), couleur: nomCouleur(S.lambda), domaine: domaine(S.lambda) });

function start() {
  S.t = 0; S.jusqua = null; S.motif = ''; S.ecrit = {}; S.glisse = false; S.running = true; S.pause = false; S.fait = false; etiquette();
  bulle($('feedback'), 'La bande du spectre se peint…'); pont.noter('start', { lambda_nm: S.lambda }); pont.emettre();
}
function pause() { if (!S.running) return; S.running = false; S.pause = true; S.jusqua = null; etiquette(); bulle($('feedback'), 'Arrêt sur image.'); pont.noter('pause', { time_s: +S.t.toFixed(2) }); pont.emettre(); }
function resume() { if (S.running) return; if (!S.pause) return start(); S.running = true; S.pause = false; etiquette(); bulle($('feedback'), 'Observe…'); pont.noter('resume'); pont.emettre(); }
function playUntil(p) {
  const M = moments(), nom = p.moment in M ? p.moment : null, cible = nom ? M[nom] : +p.time_s;
  if (!Number.isFinite(cible)) return;
  if (S.fait || S.glisse || !(S.running || S.pause) || S.t >= cible - 1e-3) start();
  S.jusqua = Math.min(FIN(), Math.max(0.01, cible)); S.motif = nom ? MOTIFS[nom] : '';
  S.running = true; S.pause = false; etiquette(); bulle($('feedback'), 'Observe…');
  pont.noter('play_until', { moment: nom, time_s: S.jusqua }); pont.emettre();
}
function setTime(p) {
  const t = +p.time_s; if (!Number.isFinite(t)) return;
  S.glisse = false; S.running = false; S.jusqua = null; S.t = Math.min(FIN(), Math.max(0, t)); S.fait = S.t >= FIN(); S.pause = !S.fait;
  etiquette(); scene.sale = true; bulle($('feedback'), `Arrêt sur image : t = ${fr(S.t, 1)} s.`); pont.noter('set_time', { time_s: S.t }); pont.emettre();
}
function setParameters(p) {
  const l = +p.lambda_nm; if (!Number.isFinite(l)) return;
  S.lambda = borne(l); scene.sale = true;
  bulle($('feedback'), `Longueur d’onde réglée : λ₀ = ${nmTexte(S.lambda)} nm.`);
  pont.noter('set_parameters', { lambda_nm: S.lambda }); pont.emettre();
}
$('run').onclick = () => (S.running ? pause() : S.pause ? resume() : start());

/* La poignée : le curseur (le trait dans la bande ou le bouton dessous), glissé de 300 à 900 nm, pas de 10 nm. */
window.Tableau.glisser(canvas, {
  toucher: (px, py) => {
    const [x, y] = scene.local(px, py), k = curseurNm();
    if (k != null && Math.abs(x - X(k)) < 16 && y > BY0 - 10 && y < YK + 14) return 'curseur';
    return y > BY0 - 4 && y < BY1 + 4 && x > X(300) && x < X(900) ? 'curseur' : null;
  },
  bouger: (id, px, py) => {
    const [x] = scene.local(px, py), l = Math.round(Math.min(900, Math.max(300, NM(x))) / 10) * 10;
    if (!S.glisse || l !== S.lambda) {
      S.glisse = true; S.lambda = l; S.running = false; S.pause = false; S.fait = true; S.jusqua = null; S.t = FIN(); etiquette(); scene.sale = true;
      if (scene.craie.complet === false) scene.ouvert = performance.now() - 60000;
    }
  },
  lacher: () => { bulle($('feedback'), message(), 'good'); pont.noter('set_parameters', { lambda_nm: S.lambda }); pont.emettre(); },
});

function ceQuiSeVoit() {
  const actif = S.running || S.pause || S.fait || S.glisse, M = moments();
  const m = ['Vue « Le spectre » : une bande graduée de 300 à 900 nm (graduations 400, 500, 600, 700, 800 nm), ultraviolet à gauche (sombre, moins de 400 nm), visible de 400 nm (violet) à 800 nm (rouge) en dégradé continu, infrarouge à droite (sombre, plus de 800 nm).'];
  if (!actif) { m.push('La bande n’est pas encore peinte.'); return m.join(' '); }
  m.push(`${S.glisse ? 'L’élève a placé le curseur. ' : S.pause ? 'Scène arrêtée, ' : S.fait ? 'Fin, ' : ''}t = ${fr(S.t, 1)} s.`);
  if (!S.glisse && S.t < M.bande_peinte) m.push(`La bande se peint de gauche à droite (${Math.round(100 * Math.max(0, (S.t - T_BANDE0) / (M.bande_peinte - T_BANDE0)))} %).`);
  const k = curseurNm();
  if (k == null) { m.push('Le curseur n’est pas encore posé.'); return m.join(' '); }
  const l = lambdaLue(), d = domaine(l);
  m.push(`Curseur sur la bande à ${Math.round(k)} nm${l < 300 || l > 900 ? ', collé au bord, avec une flèche « bien plus loin : pas visible »' : ''}.`);
  m.push(`Écrit sous la bande : λ₀ = ${nmTexte(l)} nm = ${sci(l * 1e-9)} m ; couleur : ${nomCouleur(l) || 'aucune (l’œil ne la voit pas)'} ; ν = c/λ₀ = 3,00·10⁸ / ${sci(l * 1e-9)} = ${sci(nu(l), 3, false)} Hz ; ${d === 'visible' ? 'visible' : 'non visible (' + d + ')'}.`);
  if (!S.glisse && !S.running) {
    const ici = Object.entries(M).find(([, t]) => Math.abs(t - S.t) < 1e-3);
    if (ici) m.push(`Instant clé : ${ici[0]}.`);
  }
  return m.join(' ');
}
