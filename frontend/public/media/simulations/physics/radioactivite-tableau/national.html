 * en haut : la courbe tracée dans le temps ; à droite en bas : l’étape en cours, écrite comme le barème la lit.
 * ?depart=<moment> : la page s’ouvre figée sur ce moment (tout ce qui précède est écrit) ; `reset` y revient, figé.
 */
const { fr, bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lisse = u => { u = clamp(u); return u * u * (3 - 2 * u); };
const Q = new URLSearchParams(location.search);
const LN2 = 0.693;

/* ── Les quatre exercices : déroulé (nom, durée, ce qu’on voit), courbe, étapes ─────────────────────────────── */
const VUES = {

      { nom: 'etape1', titre: '3 : étape 1 — la relation', res: '① t_1 = ⟦1|λ⟧·ln(⟦a_0|a_1⟧)', lignes: ['a_1 = a_0·e^{−λ·t₁}  donc  ⟦a_0|a_1⟧ = e^{λ·t₁}', 'ln(⟦a_0|a_1⟧) = λ·t_1', 't_1 = ⟦1|λ⟧·ln(⟦a_0|a_1⟧)'] },
      { nom: 'etape2', titre: '3 : étape 2 — la constante λ', res: '② λ ≈ 1,21·10⁻⁴ an⁻¹', lignes: ['λ = ⟦ln2|t½⟧', 'λ = ⟦0,693|5730 ans⟧', 'λ ≈ 1,21·10⁻⁴ an⁻¹'] },
      { nom: 'etape3', titre: '3 : étape 3 — l’âge t₁', res: '③ t_1 ≈ 2,26·10³ ans', lignes: ['t_1 = ⟦1|λ⟧·ln(⟦a_0|a_1⟧)', '⟦1|λ⟧ ≈ 8,26·10³ ans ;  ln(⟦418|318⟧) ≈ 0,273', 't_1 ≈ 8,26·10³ × 0,273 ≈ 2,26·10³ ans'] },

  },

      xt: [[20, '20'], [40, '40'], [60, '60'], [80, '80'], [100, '100']], yt: [[2.5, '2,5.10¹⁰'], [5, '5.10¹⁰'], [7.5, '7,5.10¹⁰'], [10, '10¹¹']] },

      { nom: 'n0', titre: '2.3 : le nombre N₀', res: 'N_0 ≈ 4,0·10²⁰ noyaux', lignes: ['a_0 = λ·N_0  donc  N_0 = ⟦a_0|λ⟧', 'N_0 = ⟦10¹¹|2,50·10⁻¹⁰⟧', 'N_0 ≈ 4,0·10²⁰ noyaux'] },
      { nom: 't_max', titre: '3 : 30 % désintégrés', res: 't_max ≈ 45 ans', lignes: ['il reste 70 % : N = 0,70·N_0', 'ln(0,70) = −λ·t_max', 't_max = ⟦t½|ln2⟧·ln(⟦1|0,70⟧) = ⟦88|0,693⟧ × 0,357', 't_max ≈ 45 ans'] },
      { nom: 'verif', titre: '3 : on vérifie', lignes: ['70 % restent : plus que la moitié', 'donc t_max < t½ = 88 ans', '45 ans < 88 ans : cohérent ✓'] }],

      ['equation', 3.4, 'l’équation à compléter : ¹³¹₅₃I → ᴬ_Z X + ⁰₋₁e, et le tableau Te 52, Xe 54, Cs 55'],
      ['soddy', 5.4, 'correction : Soddy donne A = 131, Z = 54 : le noyau fils est le xénon 131'],

      ['t1', 6.4, 'il reste 5 % : 0,05 = e^(−λ·t₁), t₁ ≈ 34,6 jours, marqué sur la courbe'],
      ['verif', 4.4, 'vérification : à 4t½ = 32 j il reste 6,25 %, à 5t½ = 40 j 3,1 % : 5 % tombe entre les deux'], ['fin', .4, 'fin']],
    g: { a0: 4, td: 8, tmax: 44, ymax: 4.4, xnom: 't (jour)', ynom: 'a (Bq)',   // la figure 3 du sujet (règle 50)
      xt: [[0, '0'], [8, '8'], [16, '16'], [24, '24'], [32, ''], [40, '']], yt: [[1, '10⁶'], [2, '2.10⁶'], [3, '3.10⁶'], [4, '4.10⁶']] },
    eq: { pere: ['I', 131, 53], fils: ['Xe', 131, 54], inconnu: ['X', 'A', 'Z'], part: '[0,-1]e', tab: 'Te : 52   Xe : 54   Cs : 55' },
    etapes: [
      { nom: 'soddy', titre: '1 : lois de Soddy', lignes: ['A : 131 = A + 0  ⇒  A = 131', 'Z : 53 = Z − 1  ⇒  Z = 54', 'Z = 54 : xénon'] },
      { nom: 't1', titre: '3.3 : 95 % désintégrés', res: 't_1 ≈ 34,6 jours', lignes: ['il reste 5 % : N = 0,05·N_0', 'ln(0,05) = −λ·t_1', 't_1 = ⟦t½|ln2⟧·ln(⟦1|0,05⟧) = ⟦8|0,693⟧ × ln 20', 't_1 ≈ 34,6 jours'] },
      { nom: 'verif', titre: '3.3 : on vérifie', lignes: ['4·t½ = 32 j : il reste 6,25 %', '5·t½ = 40 j : il reste 3,1 %', '32 j < 34,6 j < 40 j : cohérent ✓'] }],
  },
  cd2025: {

      ['soddy', 5.0, 'correction : Soddy donne A = 0, Z = 1 : un positon, la désintégration est β⁺'],

    g: { a0: 1, td: 6.93, tmax: 27.72, ymax: 1.1, xnom: 't', ynom: 'N', N: true,
      xt: [[0, '0'], [6.93, 't½'], [13.86, '2t½'], [20.79, '3t½'], [27.72, '4t½']], yt: [[1, 'N_0'], [.5, '0,5·N_0'], [.25, '0,25·N_0']] },
    eq: { pere: ['Cd', 107, 48], fils: ['Ag', 107, 47], inconnu: ['e', 'A', 'Z'], part: null, fixe: true, tab: ['t½ = 6,93 h', 'a_0 = 1,25·10¹² Bq'] },
    etapes: [
      { nom: 'soddy', titre: '2 : lois de Soddy', lignes: ['A : 107 = 107 + A  ⇒  A = 0', 'Z : 48 = 47 + Z  ⇒  Z = 1', '⁰₁e : un positon → β⁺'] },
      { nom: 'n0', titre: '3-2 : le nombre N₀', res: 'N_0 ≈ 4,5·10¹⁶ noyaux', lignes: ['t½ = 6,93 × 3600 s ≈ 2,49·10⁴ s', 'N_0 = ⟦a_0|λ⟧ = ⟦a_0·t½|ln2⟧', 'N_0 = ⟦1,25·10¹² × 2,49·10⁴|0,693⟧ ≈ 4,5·10¹⁶'] },
      { nom: 'nd', titre: '3-1 et 3-2 : entre 2t½ et 3t½', res: 'N_d ≈ 5,6·10¹⁵ noyaux', lignes: ['3-1 : a = λ·N : a_2 = ⟦a_0|8⟧ = ⟦a_1|2⟧', '3-2 : N_d = N_1 − N_2 = ⟦N_0|4⟧ − ⟦N_0|8⟧ = ⟦N_0|8⟧', 'N_d = ⟦a_0·t½|8 ln2⟧ ≈ 5,6·10¹⁵ noyaux'] }],
  },
};
/* Chaque étape dure au moins le temps de l’écrire (titre, puis chaque ligne à la vitesse de la craie) : figée sur la fin
 * d’une étape, la scène montre l’étape entière. */
for (const v of Object.values(VUES)) for (const e of v.etapes) {
  const besoin = .9 + e.lignes.reduce((t, l) => t + Math.max(.5, l.length / 14) + .3, 0), s = v.suite.find(x => x[0] === e.nom);
  if (s && s[1] < besoin) s[1] = +besoin.toFixed(2);
}
const VUE = VUES[Q.get('vue')] ? Q.get('vue') : 'datation';
const V = VUES[VUE];
const D = {}, M = {}; { let t = 0; for (const [n, d] of V.suite) { D[n] = t; t += d; M[n] = t; } }
const FIN = M.fin;
const MOTIF = Object.fromEntries(V.suite.map(s => [s[0], s[2]]));
const DEPART = Q.get('depart') in M ? M[Q.get('depart')] : 0;
const S = { t: DEPART, running: false, jusqua: null, motif: '', fait: false, emis: 0 };
const commence = nom => S.fait || S.t > D[nom] + 1e-4;       // le moment a commencé (figé sur la fin du moment d’avant : pas encore)
const vu = nom => S.fait || S.t >= M[nom] - 1e-6;           // le moment est fini
const apparait = (t0, d = .6) => (S.fait ? 1 : clamp((S.t - t0) / d));

/* ── Géométrie (cadre de hauteur 420, largeur scene.L ≥ 760) ─────────────────────────────────────────────── */
const GA = { x: 12, w: 292 };                       // colonne de gauche : document, équation, données, résultats
let L = 760;
const G = () => ({ x0: 386, x1: L - 30, y0: 190, y1: 46 });   // la courbe
const SX = () => 332;
const YE = 236;                                     // ligne de base de l’équation (A et Z au-dessus et au-dessous)                                // l’étape en cours (sous la courbe)
const xT = t => { const g = G(); return g.x0 + t / V.g.tmax * (g.x1 - g.x0); };
const yA = a => { const g = G(); return g.y0 - a / V.g.ymax * (g.y0 - g.y1); };
const aDe = t => V.g.a0 * Math.exp(-LN2 / V.g.td * t);
const tDe = a => V.g.td / LN2 * Math.log(V.g.a0 / a);

/* ── Peinture (pour l’œil : les valeurs écrites restent exactes) ─────────────────────────────────────────── */
/* Mêmes dessins que dans le reste du cours (professeur règle 43, simulations-au-tableau règle 15) : l’éclair d’une
 * désintégration, le noyau en grappe, la sphère du positon et l’onde γ, le stimulateur sont ceux de figures.html ;
 * la fiole d’iode 131 (liquide et noyaux violets, bouchon brun) celle d’activite.html ; le compteur Geiger (boîtier
 * sombre, afficheur vert, tube gris à fenêtre brune) et le bois ancien ceux de datation.html. Copiés ici parce
 * qu’aucun module commun n’existe encore pour la radioactivité (fichiers partagés non modifiés). */
const hasard = k => { const x = Math.sin(k * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const rgba = (k, a) => `rgba(${k[0]},${k[1]},${k[2]},${a})`;
const PROTON = ['#fde2ef', '#f472b6', '#9d174d'], NEUTRON = ['#e3ebf3', '#8fa3b8', '#3a4757'], POSITON = [246, 162, 44];   // lexique visuel (docs/lexique-visuel/README.md : proton rose, neutron gris-bleu, 18 novembre 2026)
function eclair(ctx, x, y, r) {
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, 'rgba(255,255,240,.95)'); g.addColorStop(.3, 'rgba(253,224,71,.6)'); g.addColorStop(1, 'rgba(253,224,71,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,250,210,.7)'; ctx.lineWidth = 1.2; ctx.beginPath();
  for (let i = 0; i < 4; i++) { const a = i * Math.PI / 4; ctx.moveTo(x - r * Math.cos(a), y - r * Math.sin(a)); ctx.lineTo(x + r * Math.cos(a), y + r * Math.sin(a)); }
  ctx.stroke(); ctx.globalCompositeOperation = 'source-over';
}
/** Quelques éclairs au hasard dans une zone (pour l’œil : des noyaux se désintègrent). */
function eclairs(ctx, x, y, w, h, n, graine) {
  const k = Math.floor(S.t / .14);
  for (let i = 0; i < n; i++) {
    const p = hasard(k * 17 + i * 5 + graine); if (p > .6) continue;
    eclair(ctx, x + hasard(k * 3 + i + graine) * w, y + hasard(k * 11 + i * 7 + graine) * h, 5 + 8 * (1 - p));
  }
}
function sphere(ctx, x, y, r, k) {
  const g = ctx.createRadialGradient(x - r * .38, y - r * .42, r * .08, x, y, r);
  if (typeof k[0] === 'string') { g.addColorStop(0, k[0]); g.addColorStop(.45, k[1]); g.addColorStop(1, k[2]); }   // palette du lexique : clair, couleur, ombre
  else { g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(.3, rgba(k, 1)); g.addColorStop(1, rgba(k.map(v => Math.round(v * .3)), 1)); }
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
}
function grappe(ctx, cx, cy, nP, nN, r, kP = PROTON, kN = NEUTRON) {
  const n = nP + nN, pts = [];
  for (let i = 0; i < n; i++) {
    const rr = r * .95 * Math.sqrt(i + .4), a = i * 2.39996;
    pts.push({ x: cx + rr * Math.cos(a), y: cy + rr * Math.sin(a), p: Math.floor((i + 1) * nP / n) > Math.floor(i * nP / n), d: rr });
  }
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(cx + 2, cy + r * Math.sqrt(n) + 3, r * Math.sqrt(n), r * .9, 0, 0, 7); ctx.fill();
  pts.sort((u, v) => v.d - u.d).forEach(q => sphere(ctx, q.x, q.y, r, q.p ? kP : kN));
}
function ondeGamma(ctx, x1, y1, x2, y2, amp = 6, lam = 14) {
  const Lg = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / Lg, uy = (y2 - y1) / Lg;
  const chemin = () => { ctx.beginPath(); for (let s = 0; s <= Lg; s += 2) { const w = amp * Math.sin(2 * Math.PI * s / lam), x = x1 + ux * s - uy * w, y = y1 + uy * s + ux * w; s ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } };
  ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  for (const [lw, a] of [[9, .1], [4.5, .26], [2, .95]]) { ctx.strokeStyle = `rgba(186,116,255,${a})`; ctx.lineWidth = lw; chemin(); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = .8; chemin(); ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
}
function arrondi(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

        c.ligne(xT(13.86), yA(.25), xT(13.86), g.y0, { couleur: 'orange', largeur: 1.5, pointille: [5, 6], duree: .3 });
        c.ligne(xT(20.79), yA(.125), xT(20.79), g.y0, { couleur: 'orange', largeur: 1.5, pointille: [5, 6], duree: .3 });

        c.ligne(xT(13.86), yA(.25), x, yA(.25), { couleur: 'vert', largeur: 1.2, pointille: [4, 5], duree: .2 });

}

function etapeCourante() {
  let e = null; for (const x of V.etapes) if (commence(x.nom)) e = x;
  return e;
}
function etape(c) {
  const e = etapeCourante(); if (!e) return;
  const x = SX(), y0 = 230;
  c.repere('etape', x - 6, y0 - 22, L - x - 6, 150, `${e.titre} : ${e.lignes.map(window.Tableau.lisible || (s => s)).join(' ; ')}`);
  ecrit(c, D[e.nom], () => {
    c.texte(e.titre, x, y0, { taille: 20, couleur: 'cyan', duree: .5 });
    let y = y0, k = 0, avant = e.titre;
    for (const l of e.lignes) {
      const der = ++k === e.lignes.length && e.nom !== 'verif' && e.nom !== 'soddy';
      y += ecart(avant, l, 22) + (der ? 4 : 0); avant = l;            // place des étages de fraction et du cadre
      if (der) c.rect(x - 6, y - haut(l, 22) - 3, Math.min(L - x - 10, c.largeurTexte(l, 22) + 18), haut(l, 22) + bas(l, 22) + 6, { couleur: 'vert', arrondi: 8, largeur: 1.8, duree: .2 });
      c.texte(l, x + (der ? 4 : 0), y, { taille: 22, couleur: der ? 'vert' : 'blanc', duree: Math.max(.5, l.length / 14) });
      c.pause(.25);
    }
  });
}

function dessiner(c) {
  c.direct(() => peindre(c.ctx));
  gauche(c); courbe(c); etape(c);
}

const canvas = $('canvas');
const scene = window.OndesTableau.Scene(canvas, () => {
  const c = scene.cadre(53); L = scene.L;
  dessiner(c);
  return c.fin();
}, { large: true });
/* Texte jamais sous 15 px à l’écran, même sur un téléphone en paysage (724 × 350, 18 novembre 2026), comme
 * ondes-lumineuses-tableau/national.html : le kit baisse son plancher sur un petit tableau et écrit indices et exposants
 * à 62 % de la ligne ; cette page garde 15 px pour tout, indices et exposants compris, sur SA craie (rien de partagé
 * n’est changé), et se met en page pour que ça tienne (TROIT : graduations espacées, étiquettes plus courtes). */
Object.defineProperty(scene.craie, 'tailleMin', { get: () => 15, set: () => {}, configurable: true });
{
  const k = scene.craie, ind = k._texteIndices, larg = k._largeur;
  const petitMin = taille => (k.echelle ? Math.max(.62, 15 / k.echelle / taille) : .62);
  // indices et exposants : la même écriture, avec un « petit » qui ne descend pas sous 15 px à l’écran
  k._texteIndices = function (s, x, y, o, taille) {
    const c = this.ctx, segs = window.Tableau.Craie.segments(s), police = t => `${o.gras ? '700 ' : ''}${t}px ${window.Tableau.POLICE}`;
    const petit = taille * petitMin(taille), tailleDe = seg => (seg.sub || seg.sup ? petit : taille);
    const largeur = seg => { c.font = police(tailleDe(seg)); return c.measureText(seg.t).width; };
    const total = segs.reduce((w, seg) => w + largeur(seg), 0);
    const plain = segs.map(seg => seg.t).join('');
    const part = this._part(o.duree ?? Math.max(.1, plain.length / 16));
    if (part <= 0) return this;
    let reste = part < 1 ? Math.max(1, Math.ceil(part * plain.length)) : plain.length;
    c.fillStyle = this.couleur(o.couleur); c.globalAlpha = o.alpha ?? .96; c.textBaseline = o.base || 'alphabetic';
    c.shadowColor = 'rgba(255,255,255,.25)'; c.shadowBlur = 1; c.textAlign = 'left';
    let px = (o.align === 'center') ? x - total / 2 : (o.align === 'right') ? x - total : x;
    for (const seg of segs) {
      if (reste <= 0) break;
      const t = seg.t.slice(0, reste); reste -= seg.t.length;
      c.font = police(tailleDe(seg));
      c.fillText(t, px, y + (seg.sub ? taille * .28 : seg.sup ? -taille * .42 : 0));
      px += c.measureText(t).width;
      if (t.length < seg.t.length) break;
    }
    if (part < 1) this.tip = [px, y - taille * .3];
    c.shadowBlur = 0; c.globalAlpha = 1;
    return this;
  };
  k._largeur = function (s, taille, gras) {
    const c = this.ctx, CH = { '⁻': '−', '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9' };
    s = String(s).replace(/[⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, g => '^{' + [...g].map(ch => CH[ch]).join('') + '}');
    const t0 = Math.max(taille, k.echelle ? 15 / k.echelle : 0);
    return window.Tableau.Craie.segments(s).reduce((w, seg) => { c.font = `${gras ? '700 ' : ''}${seg.sub || seg.sup ? t0 * petitMin(t0) : t0}px ${window.Tableau.POLICE}`; return w + c.measureText(seg.t).width; }, 0);
  };
  void ind; void larg;
  // ᴬ_Z X : A et Z gardent 15 px, et s’écartent d’autant (sinon A et Z, agrandis, se chevauchent)
  const azT = taille => Math.max(taille * .6, k.echelle ? 15 / k.echelle : 0);
  const lg = (s, t) => { k.ctx.font = `${t}px ${window.Tableau.POLICE}`; return k.ctx.measureText(String(s).replace('-', '−')).width; };
  k.largeurNucleide = function (X, A, Z, taille = 18) { const p = azT(taille); return Math.max(lg(A, p), lg(Z, p)) + 1.5 + lg(X, taille); };
  k.nucleide = function (X, A, Z, x, y, o = {}) {

    const wAZ = Math.max(lg(A, p), lg(Z, p)), xs = x + wAZ + 1.5, cAZ = o.couleurAZ || o.couleur, d = o.duree != null ? o.duree / 3 : undefined;
    this.texte(String(A).replace('-', '−'), xs - 1, y - taille * .42 - plus * .9, { taille: p, couleur: cAZ, align: 'right', duree: d, gras: o.gras });
    this.texte(String(Z).replace('-', '−'), xs - 1, y + taille * .22 + plus * .5, { taille: p, couleur: cAZ, align: 'right', duree: d, gras: o.gras });

}
scene.avancer = dt => {
  if (!S.running) return false;
  S.t = Math.min(FIN, S.t + dt);
  if (S.jusqua != null && S.t >= S.jusqua && S.jusqua < FIN) {
    S.t = S.jusqua; S.running = false; S.jusqua = null; $('run').textContent = 'Reprendre';
    bulle($('feedback'), 'Arrêt sur image : ' + (S.motif || `t = ${fr(S.t, 2)} s`) + '.'); pont.noter('pause', { time_s: +S.t.toFixed(3) }); pont.emettre();
    return true;
  }
  if (S.t >= FIN) { S.running = false; S.fait = true; $('run').textContent = 'Rejouer'; bulle($('feedback'), 'Fin de l’exercice : chaque étape est écrite.', 'good'); pont.emettre(); }
  else if (performance.now() - S.emis > 500) { S.emis = performance.now(); pont.emettre(); }
  return true;
};

/* ── Ce que voit le tuteur ──────────────────────────────────────────────────────────────────────────────── */
function ceQuiSeVoit() {
  const etat = S.running ? 'la scène se déroule' : S.fait ? 'fin de la scène' : S.t > 0 ? 'scène arrêtée' : 'scène pas encore lancée';
  const m = [`${V.titre}. t (scène) = ${fr(S.t, 2)} s (${etat}).`];
  const vus = V.suite.filter(([n]) => n !== 'fin' && commence(n)).map(([n, , d]) => d);
  m.push(vus.length ? 'Au tableau, dans l’ordre : ' + vus.join(' ; ') + '.' : 'Le tableau est encore vide.');
  const e = etapeCourante(); if (e) m.push(`Étape écrite en bas à droite : « ${e.titre} » — ${e.lignes.map(window.Tableau.lisible || (s => s)).join(' ; ')}.`);
  return m.join(' ');
}

/* ── Commandes ──────────────────────────────────────────────────────────────────────────────────────────── */
function playUntil(p) {
  const nom = p && p.moment in M ? p.moment : null, cible = nom ? M[nom] : +p.time_s;
  if (!Number.isFinite(cible)) return;
  if (S.fait || S.t >= cible - 1e-4) S.t = DEPART < cible ? DEPART : 0;   // déjà passé : on rejoue depuis le départ de la diapositive
  S.jusqua = Math.min(FIN, Math.max(0.001, cible));
  S.motif = nom ? MOTIF[nom] : '';
  S.running = true; S.fait = false; $('run').textContent = 'Pause'; bulle($('feedback'), 'Observe…');
  pont.noter('play_until', { moment: nom, time_s: S.jusqua }); pont.emettre();
}
function start() { S.jusqua = null; S.t = 0; S.running = true; S.fait = false; $('run').textContent = 'Pause'; bulle($('feedback'), V.titre + '…'); pont.noter('start', params()); pont.emettre(); }
/* reset : revient au départ de la diapositive (?depart=…), FIGÉ — la voix fait avancer la scène par ses play_until. */
function reset() { S.jusqua = null; S.running = false; S.fait = false; S.t = DEPART; scene.sale = true; $('run').textContent = DEPART > 0 ? 'Reprendre' : 'Lancer'; bulle($('feedback'), V.titre + '.'); pont.noter('reset', params()); pont.emettre(); }
function pause() { if (!S.running) return; S.running = false; S.jusqua = null; $('run').textContent = 'Reprendre'; bulle($('feedback'), 'Arrêt sur image.'); pont.noter('pause', { time_s: +S.t.toFixed(3) }); pont.emettre(); }
function resume() { if (S.running) return; if (S.fait || S.t >= FIN) return start(); S.running = true; $('run').textContent = 'Pause'; bulle($('feedback'), 'Observe…'); pont.noter('resume'); pont.emettre(); }
function setTime(p) {
  const t = +p.time_s; if (!Number.isFinite(t)) return;
  S.running = false; S.jusqua = null; S.t = clamp(t, 0, FIN); S.fait = S.t >= FIN;
  $('run').textContent = S.fait ? 'Rejouer' : 'Reprendre'; scene.sale = true;
  bulle($('feedback'), `Arrêt sur image : t = ${fr(S.t, 2)} s.`); pont.noter('set_time', { time_s: S.t }); pont.emettre();
}
function params() { return { vue: VUE, depart: Q.get('depart') || null }; }
$('run').onclick = () => (S.running ? pause() : (S.t < FIN && !S.fait && (S.t > 0) ? resume() : start()));

window.Tableau.explication({ [VUE]: V.etapes.map(e => ({ repere: 'etape', texte: `${e.titre} : ${e.lignes.map(window.Tableau.lisible || (s => s)).join(' ; ')}` })) });
const commandes = ['start', 'reset', 'pause', 'resume', 'set_time', 'play_until'];
const config = { id: 'radioactivite_national_' + VUE, version: '1.0', title: V.titre, variants: Object.keys(VUES).map(id => ({ id, label: VUES[id].titre })), commands: commandes,
  command_schema: {

const pont = protocole({ id: config.id, commandes, config,
  texte: V.titre + ' : ' + V.suite.filter(s => s[0] !== 'fin').map(s => s[2]).join(' ; ') + '.',
  etat: () => ({ simulation_status: S.running ? 'running' : (S.fait ? 'finished' : (S.t > 0 ? 'paused' : 'idle')), ce_qui_se_voit: ceQuiSeVoit(), current_variant: VUE,
    time_s: +S.t.toFixed(3), parameters: params(), moments: { ...M } }),
