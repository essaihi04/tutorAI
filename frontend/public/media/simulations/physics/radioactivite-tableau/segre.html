<script>
/*
 * Diagramme (N, Z) (cours « Décroissance radioactive », phys_ch4_radioactivite, 2e Bac PC BIOF, novembre 2026).
 * Vues (?vue=) : vallee (défaut), zones, isotopes, famille, famille2024.
 *  - Le diagramme : Z en abscisse (0 → 100), N en ordonnée (0 → 150), la droite N = Z en pointillé.
 *  - Les noyaux stables (petits carrés sombres) : la liste réelle des isotopes stables de H (Z = 1) à Pb (Z = 82), jusqu’à ²⁰⁸₈₂Pb.
 *    Les noyaux instables connus (bande autour de la vallée, largeur approchée, pour l’œil) sont colorés par zone : au-dessus de la
 *    vallée (N plus grand que le centre de la vallée pour ce Z) bleu → β⁻ ; au-dessous orange → β⁺ ; Z > 82 jaune → α.
 *    Centre de la vallée : moyenne des N stables pour Z ≤ 82 ; au-delà, la relation empirique A = Z·(1,98 + 0,0155·A^{2/3}).
 *    C’est la règle simple du programme (prévision du type), pas un tableau des modes réels de chaque noyau.
 *  - famille : la famille de l’uranium 238 (8 α et 6 β⁻) flèche par flèche sur un zoom (Z 80 → 93, N 122 → 147), compteurs ;
 *  - famille2024 : schéma type national 2024 R (A en ordonnée, Z en abscisse), flèches (1) β⁻ et (2) α, nucléide X = ²⁰⁸₈₂Pb.
 * Poignée élève (vues vallee, zones, isotopes) : le noyau-curseur qu’on fait glisser ; la bulle donne Z, N, A, la zone et le type prévu.
 * La peinture (carrés colorés, sphères) ne change pas la physique : Z, N, A et les bilans écrits sont exacts.
 */
const { fr, bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);
const VUES = ['vallee', 'zones', 'isotopes', 'famille', 'famille2024'];
const URLP = new URLSearchParams(location.search);
let vue = VUES.includes(URLP.get('vue')) ? URLP.get('vue') : 'vallee';
const S = { t: 0, running: false, jusqua: null, motif: '', fait: false, emis: 0 };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lisse = u => { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); };
const CURSEUR_DEFAUT = { vallee: [53, 78], zones: [53, 78], isotopes: [6, 8], famille: [92, 146], famille2024: [83, 129] };
const P = { Z: CURSEUR_DEFAUT[vue][0], N: CURSEUR_DEFAUT[vue][1] };
{ const z = +URLP.get('noyau_Z'), n = +URLP.get('noyau_N'); if (URLP.has('noyau_Z') && Number.isFinite(z)) P.Z = clamp(Math.round(z), 1, 100); if (URLP.has('noyau_N') && Number.isFinite(n)) P.N = clamp(Math.round(n), 0, 150); }

/* ── Données : symboles et noyaux stables (Z → liste des N stables) ──────────────────────────── */
const SYM = ('H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd ' +
  'In Sn Sb Te I Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa U Np Pu Am Cm Bk Cf Es Fm').split(' ');
const STABLES = { 1: [0, 1], 2: [1, 2], 3: [3, 4], 4: [5], 5: [5, 6], 6: [6, 7], 7: [7, 8], 8: [8, 9, 10], 9: [10], 10: [10, 11, 12], 11: [12], 12: [12, 13, 14],
  13: [14], 14: [14, 15, 16], 15: [16], 16: [16, 17, 18, 20], 17: [18, 20], 18: [18, 20, 22], 19: [20, 22], 20: [20, 22, 23, 24, 26, 28], 21: [24],
  22: [24, 25, 26, 27, 28], 23: [28], 24: [26, 28, 29, 30], 25: [30], 26: [28, 30, 31, 32], 27: [32], 28: [30, 32, 33, 34, 36], 29: [34, 36],
  30: [34, 36, 37, 38, 40], 31: [38, 40], 32: [38, 40, 41, 42, 44], 33: [42], 34: [40, 42, 43, 44, 46], 35: [44, 46], 36: [42, 44, 46, 47, 48, 50],
  37: [48], 38: [46, 48, 49, 50], 39: [50], 40: [50, 51, 52, 54], 41: [52], 42: [50, 52, 53, 54, 55, 56], 44: [52, 54, 55, 56, 57, 58, 60], 45: [58],
  46: [56, 58, 59, 60, 62, 64], 47: [60, 62], 48: [58, 60, 62, 63, 64, 66], 49: [64], 50: [62, 64, 65, 66, 67, 68, 69, 70, 72, 74], 51: [70, 72],
  52: [68, 70, 71, 72, 73, 74], 53: [74], 54: [70, 72, 74, 75, 76, 77, 78, 80], 55: [78], 56: [74, 76, 78, 79, 80, 81, 82], 57: [82], 58: [78, 80, 82, 84],
  59: [82], 60: [82, 83, 84, 85, 86, 88], 62: [82, 87, 88, 90, 92], 63: [88, 90], 64: [90, 91, 92, 93, 94, 96], 65: [94], 66: [90, 92, 94, 95, 96, 97, 98],
  67: [98], 68: [94, 96, 98, 99, 100, 102], 69: [100], 70: [98, 100, 101, 102, 103, 104, 106], 71: [104], 72: [104, 105, 106, 107, 108], 73: [108],
  74: [106, 108, 109, 110, 112], 75: [110], 76: [108, 111, 112, 113, 114, 116], 77: [114, 116], 78: [114, 116, 117, 118, 120], 79: [118],
  80: [116, 118, 119, 120, 121, 122, 124], 81: [122, 124], 82: [122, 124, 125, 126] };
const estStable = (Z, N) => !!(STABLES[Z] && STABLES[Z].includes(N));
const moyenne = l => l.reduce((s, v) => s + v, 0) / l.length;
const CENTRE = {};
for (let Z = 1; Z <= 100; Z++) {
  if (STABLES[Z]) CENTRE[Z] = moyenne(STABLES[Z]);
  else if (Z <= 82) CENTRE[Z] = (moyenne(STABLES[Z - 1]) + moyenne(STABLES[Z + 1])) / 2;
  else { let A = 2.5 * Z; for (let i = 0; i < 30; i++) A = Z * (1.98 + 0.0155 * Math.pow(A, 2 / 3)); CENTRE[Z] = A - Z; }
}
const bas = Z => Math.max(0, Math.ceil(CENTRE[Z] - (2 + .36 * Z)));
const haut = Z => Math.min(150, Math.floor(CENTRE[Z] + (3 + .25 * Z)));
const connu = (Z, N) => Z >= 1 && Z <= 100 && N >= bas(Z) && N <= haut(Z);
/** Zone d’un noyau (Z, N) : stable, beta_moins, beta_plus, alpha, ou hors (aucun noyau connu ici). */
function zone(Z, N) {
  if (estStable(Z, N)) return 'stable';
  if (!connu(Z, N)) return 'hors';
  if (Z > 82) return 'alpha';
  return N > CENTRE[Z] ? 'beta_moins' : 'beta_plus';
}
const ZONE_TXT = {
  stable: ['dans la vallée de stabilité', 'stable : pas de désintégration'],
  beta_moins: ['au-dessus de la vallée (excès de neutrons)', 'β⁻'],
  beta_plus: ['au-dessous de la vallée (excès de protons)', 'β⁺'],
  alpha: ['noyaux lourds (Z > 82)', 'α'],
  hors: ['hors des noyaux connus', 'aucun noyau connu ici'],
};
const CELLULES = [];
for (let Z = 1; Z <= 100; Z++) for (let N = bas(Z); N <= haut(Z); N++) CELLULES.push({ Z, N, z: zone(Z, N) });

/* ── Instants clés : [nom, instant (s), ce qu’on voit, avance] — l’annotation s’écrit pendant « avance » s avant l’instant. ── */
const FAM = [['U', 238, 92], ['Th', 234, 90], ['Pa', 234, 91], ['U', 234, 92], ['Th', 230, 90], ['Ra', 226, 88], ['Rn', 222, 86], ['Po', 218, 84],
  ['Pb', 214, 82], ['Bi', 214, 83], ['Po', 214, 84], ['Pb', 210, 82], ['Bi', 210, 83], ['Po', 210, 84], ['Pb', 206, 82]];
const COTE = ['g', 'g', 'hd', 'd', 'g', 'g', 'g', 'g', 'g', 'hd', 'd', 'g', 'hd', 'd', 'g'];          // où s’écrit le nom de chaque noyau
const typeEtape = k => (FAM[k - 1][1] - FAM[k][1] === 4 ? 'alpha' : 'beta');
const debutEtape = k => 1.8 + .8 * (k - 1) + (k > 6 ? 1.0 : 0);                                // pause après ²²²Rn (milieu)
const finEtape = k => debutEtape(k) + .7;
const SUITES = {
  vallee: [['axes', 1.8, 'les axes : Z (protons) en abscisse, N (neutrons) en ordonnée', 1.6], ['droite_N_egal_Z', 3.4, 'la droite N = Z en pointillé', 1.2],
    ['vallee', 6.0, 'la vallée de stabilité : les noyaux stables', 2.2], ['legers', 8.2, 'noyaux légers stables : N ≈ Z', 1.4],
    ['lourds', 10.6, 'noyaux lourds stables : N > Z', 1.8], ['fin', 12.2, 'fin', .4]],
  zones: [['vallee', 1.8, 'le diagramme et la vallée de stabilité', 1.6], ['zone_beta_moins', 4.0, 'zone bleue : excès de neutrons → β⁻', 1.6],
    ['zone_beta_plus', 6.2, 'zone orange : excès de protons → β⁺', 1.6], ['zone_alpha', 8.4, 'zone jaune : noyaux lourds → α', 1.6],
    ['fleches', 11.4, 'trois flèches depuis un même noyau : β⁻ vers (Z+1, N−1), β⁺ vers (Z−1, N+1), α vers (Z−2, N−2)', 2.4], ['fin', 13.0, 'fin', .4]],
  isotopes: [['vallee', 1.8, 'le diagramme et la vallée de stabilité', 1.6], ['ligne_isotopes', 5.0, 'la ligne verticale Z = 6 : ¹²C stable dans la vallée, ¹⁴C au-dessus → β⁻', 3.0],
    ['fin', 6.8, 'fin', .4]],
  famille: [['depart', 1.6, 'départ : l’uranium 238', 1.2], ['premiere_alpha', finEtape(1), 'première désintégration α : ²³⁸U → ²³⁴Th', .7],
    ['premiere_beta', finEtape(2), 'première désintégration β⁻ : ²³⁴Th → ²³⁴Pa', .7], ['milieu', finEtape(6) + .6, 'à mi-chemin, ²²²Rn : 4 α et 2 β⁻', .6],
    ['arrivee', finEtape(14) + .6, 'arrivée : ²⁰⁶Pb, stable', .6], ['bilan', finEtape(14) + 3.0, '²³⁸U → ²⁰⁶Pb : 8 α et 6 β⁻', 2.2],
    ['fin', finEtape(14) + 3.4, 'fin', .4]],
  famille2024: [['trace', 2.2, 'le schéma : A en ordonnée, Z en abscisse, cinq nucléides de la famille du thorium', 2.0],
    ['fleche_1', 4.6, '(1) : A ne change pas, Z augmente de 1 : β⁻', 1.8], ['fleche_2', 7.0, '(2) : A diminue de 4, Z de 2 : α', 1.8],
    ['nucleide_X', 9.6, 'X : Z = 82, A = 208, donc X = ²⁰⁸₈₂Pb', 2.0], ['fin', 11.2, 'fin', .4]],
};
let SUITE, M, FIN;
function choisirSuite() { SUITE = SUITES[vue]; M = {}; for (const [n, t] of SUITE) M[n] = +t.toFixed(2); FIN = M.fin; }
choisirSuite();
const moments = () => ({ ...M });
const avance = nom => (SUITE.find(s => s[0] === nom) || [])[3] ?? 1.2;
const a_ = nom => (nom in M ? M[nom] - avance(nom) : Infinity);
const vu = nom => nom in M && S.t >= a_(nom);
const apres = (t0, d = .5) => clamp((S.t - t0) / d, 0, 1);
const PLEIN = () => ['vallee', 'zones', 'isotopes'].includes(vue);

/* ── Géométrie ─────────────────────────────────────────────────────────────────────────────── */
const O = { x: 52, y: 356 }, KX = 3.3, KY = 2.0;                       // diagramme complet : Z 0 → 100, N 0 → 150
const XY = (Z, N) => [O.x + Z * KX, O.y - N * KY];
const RX = 432;                                                          // colonne de droite (texte)
const FZ = { x0: 84, kx: 25, y0: 362, ky: 12.6, Z0: 80, N0: 122 };      // zoom de la famille : Z 80 → 93, N 122 → 147
const XYf = (Z, N) => [FZ.x0 + (Z - FZ.Z0) * FZ.kx, FZ.y0 - (N - FZ.N0) * FZ.ky];
const XY24 = (Z, A) => [90 + (Z - 80) * 62, 360 - (A - 205) * 38];     // national 2024 : Z 80 → 85, A 205 → 213
const IX = Z => 470 + (Z - 2) * 28 + 14, IY = N => 262 - (N - 2) * 18 - 9;   // zoom des isotopes : Z 2 → 10, N 2 → 12
const G = { x: 432, y: 166, c: 26 };                                     // grille des trois flèches
const GXY = (i, j) => [G.x + G.c / 2 + G.c * (i + 3), G.y + G.c / 2 + G.c * (3 - j)];

/* ── Peinture ──────────────────────────────────────────────────────────────────────────────── */
const TEINTES = { p: ['#ffd9c4', '#f2683a', '#8a280c'], n: ['#f4f8ff', '#a9b9cd', '#55657a'], e: ['#e3efff', '#5b9cf5', '#1c3d96'], v: ['#d9ffe6', '#38c172', '#14532d'] };
function sphere(ctx, x, y, r, type, o = {}) {
  const [c0, c1, c2] = TEINTES[type];
  ctx.save(); ctx.globalAlpha = o.alpha ?? 1;
  if (o.eclat > 0) { ctx.shadowColor = 'rgba(255,240,200,.95)'; ctx.shadowBlur = 4 + r * 2 * o.eclat; }
  const g = ctx.createRadialGradient(x - r * .35, y - r * .4, r * .08, x, y, r);
  g.addColorStop(0, c0); g.addColorStop(.45, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
  if (r > 3) { ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(x - r * .36, y - r * .42, r * .24, r * .15, -.6, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
}
/** Un petit noyau peint (3 sphères), pour le curseur et les nœuds de la famille. */
function miniNoyau(ctx, x, y, r, o = {}) {
  sphere(ctx, x - r * .55, y + r * .35, r * .7, 'n', o); sphere(ctx, x + r * .55, y + r * .35, r * .7, 'p', o); sphere(ctx, x, y - r * .35, r * .7, o.vert ? 'v' : 'p', o);
}
function eclair(ctx, x, y, f) {
  if (f <= 0 || f >= 1) return;
  const r = 6 + 22 * f, g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(255,255,230,${.9 * (1 - f)})`); g.addColorStop(1, 'rgba(255,255,200,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}
const COULEURS_ZONE = { beta_moins: '96,165,250', beta_plus: '251,146,60', alpha: '250,204,21', stable: '10,14,18' };
/** Les carrés du diagramme complet : alpha de chaque zone (0..1) et Z maximal de la vallée (elle se peint de gauche à droite). */
function peindreCases(ctx, { gris = 0, bleu = 0, orange = 0, jaune = 0, zmax = 82, xy = XY, kx = KX, ky = KY, filtre = null, clip = null }) {
  ctx.save();
  if (clip) { ctx.beginPath(); ctx.rect(...clip); ctx.clip(); }
  const lots = { gris: [], beta_moins: [], beta_plus: [], alpha: [], stable: [] };
  for (const c of CELLULES) {
    if (filtre && !filtre(c)) continue;
    if (c.z === 'stable') { if (c.Z <= zmax) lots.stable.push(c); continue; }
    const a = c.z === 'beta_moins' ? bleu : c.z === 'beta_plus' ? orange : jaune;
    (a > 0 ? lots[c.z] : lots.gris).push(c);
  }
  const remplir = (liste, style, marge = 0) => {
    if (!liste.length) return; ctx.fillStyle = style; ctx.beginPath();
    for (const c of liste) { const [x, y] = xy(c.Z, c.N); ctx.rect(x - kx / 2 - marge / 2 + .3, y - ky / 2 - marge / 2 + .3, kx + marge - .6, ky + marge - .6); }
    ctx.fill();
  };
  if (gris > 0) remplir(lots.gris, `rgba(226,232,240,${.16 * gris})`);
  remplir(lots.beta_moins, `rgba(${COULEURS_ZONE.beta_moins},${.6 * bleu})`);
  remplir(lots.beta_plus, `rgba(${COULEURS_ZONE.beta_plus},${.6 * orange})`);
  remplir(lots.alpha, `rgba(${COULEURS_ZONE.alpha},${.6 * jaune})`);
  // La vallée : un halo clair, puis les carrés sombres des noyaux stables (une bande sombre lisible sur le tableau).
  if (lots.stable.length) {
    if (!clip) {
    ctx.save(); ctx.strokeStyle = 'rgba(236,240,245,.16)'; ctx.lineWidth = Math.max(9, kx * 2.2); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath();
    for (let Z = 1; Z <= Math.min(82, zmax); Z++) { const [x, y] = xy(Z, CENTRE[Z]); Z === 1 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.stroke(); ctx.restore();
    }
    remplir(lots.stable, `rgb(${COULEURS_ZONE.stable})`, .8);
  }
  ctx.restore();
}
function peindreCurseur(ctx) {
  const [x, y] = XY(P.Z, P.N);
  ctx.save(); const g = ctx.createRadialGradient(x, y, 0, x, y, 16); g.addColorStop(0, 'rgba(250,204,21,.35)'); g.addColorStop(1, 'rgba(250,204,21,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 16, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  miniNoyau(ctx, x, y, 6);
}
function peindre(ctx) {
  if (vue === 'vallee') {
    const f = apres(a_('vallee'), 1.8), zmax = Math.round(1 + 81 * f);
    if (f > 0) peindreCases(ctx, { gris: f, zmax });
  } else if (vue === 'zones') {
    peindreCases(ctx, { gris: apres(.3, 1), zmax: Math.round(1 + 81 * apres(.3, 1.2)), bleu: apres(a_('zone_beta_moins'), .8), orange: apres(a_('zone_beta_plus'), .8), jaune: apres(a_('zone_alpha'), .8) });
    if (vu('fleches')) peindreFleches(ctx);
  } else if (vue === 'isotopes') {
    const f = apres(.3, 1.2);
    peindreCases(ctx, { gris: 0, bleu: .55 * f, orange: .55 * f, jaune: .55 * f, zmax: Math.round(1 + 81 * f) });
    if (vu('ligne_isotopes')) peindreCases(ctx, { bleu: apres(a_('ligne_isotopes'), .6), orange: apres(a_('ligne_isotopes'), .6), xy: (Z, N) => [IX(Z), IY(N)], kx: 28, ky: 18, filtre: c => c.Z >= 2 && c.Z <= 10 && c.N >= 2 && c.N <= 12, clip: [IX(2) - 14, IY(12) - 9, 9 * 28, 11 * 18] });
  } else if (vue === 'famille') peindreFamille(ctx);
  else peindre2024(ctx);
  if (PLEIN()) peindreCurseur(ctx);
}
function peindreFleches(ctx) {
  const f = apres(a_('fleches'), .5); if (f <= 0) return;
  ctx.save(); ctx.globalAlpha = f; ctx.strokeStyle = 'rgba(226,232,240,.14)'; ctx.lineWidth = 1;
  for (let i = 0; i <= 7; i++) { ctx.beginPath(); ctx.moveTo(G.x + i * G.c, G.y); ctx.lineTo(G.x + i * G.c, G.y + 7 * G.c); ctx.moveTo(G.x, G.y + i * G.c); ctx.lineTo(G.x + 7 * G.c, G.y + i * G.c); ctx.stroke(); }
  ctx.restore();
  const [x, y] = GXY(0, 0); miniNoyau(ctx, x, y, 8, { alpha: f });
}

/* ── Craie ─────────────────────────────────────────────────────────────────────────────────── */
/**
 * Écrit `fn` à la craie au rythme de la scène, à partir de l’instant t0 (s) : une annotation apparaît quand elle arrive.
 * Le bloc doit être fini à l’instant clé suivant (`t1`, sinon le premier moment après t0) : s’il est plus long, son écriture
 * est accélérée d’autant (première passe « à blanc » qui mesure sa durée), pour qu’un arrêt sur image le montre en entier.
 */
function ecrit(c, t0, fn, t1) {
  const t = c.t, cur = c.cur, comp = c.complet;
  try {
    let k = 1;
    if (!S.fait) {
      const fin = t1 ?? Math.min(...SUITE.map(s => s[1]).filter(m => m > t0 + 1e-6));
      if (Number.isFinite(fin)) { c.t = -1; c.cur = t0; fn(); const d = c.cur - t0; if (d > fin - t0) k = d / Math.max(.05, fin - t0); }
    }
    c.t = S.fait ? Infinity : t0 + (S.t - t0) * k; c.cur = t0; c.complet = true;
    fn();
    // Contrôle : sur une image figée, un bloc commencé doit être fini (sinon l’annotation de l’instant clé n’est pas lisible).
    if (!c.complet && !S.running && SUITE.some(s => Math.abs(s[1] - S.t) < 1e-3)) { const l = (window.__ecritureInachevee ||= []), m = `${fr(S.t, 2)} s : bloc commencé à ${fr(t0, 2)} s`; if (!l.includes(m)) l.push(m); }
  }
  finally { c.t = t; c.cur = cur; c.complet = comp; }
}
function axesPrincipaux(c) {
  const xf = O.x + 100 * KX + 16, yf = O.y - 150 * KY - 14;
  c.fleche(O.x, O.y, xf, O.y, { couleur: 'blanc', largeur: 1.8, duree: .3 });
