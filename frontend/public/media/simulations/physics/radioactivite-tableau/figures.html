<script>
/*
 * Figures fixes du cours « Décroissance radioactive » (phys_ch4_radioactivite, 11 novembre 2026), écrites à la craie pas à pas,
 * comme un professeur au tableau : ?fig=fig_soddy_systeme | fig_rappel_exp_ln | fig_equation_diff | fig_demo_t_demi | fig_unites |
 * fig_masse_N | fig_activite_demo | fig_datation_demo | fig_pourcentages | fig_rapport_fils_pere | fig_cas_types | fig_enonce_2021 |
 * fig_enonce_2025 | fig_enonce_2022. Même architecture que ondes-lumineuses-tableau/figures.html.
 * Chaque figure : des étapes nommées (les moments), puis `fin`. Le tuteur fige l’écriture sur une étape (`play_until {moment}`)
 * et montre chaque élément (`highlight {target}`) : le repère `figure`, et un repère par étape (même nom que l’étape).
 * Les noyaux s’écrivent avec noyaux.js (A en haut, Z en bas). Ce qui est réel (noyaux, particules, γ, fiole, bois, pile) est peint
 * (règle 7) ; une grappe peinte est stylisée (moins de sphères que de nucléons) : la physique est dans la craie, jamais dans le peint.
 * Les énoncés d’examen sont des paraphrases courtes, données exactes (nationaux 2012 N, 2020 R, 2021 N, 2022 N, 2023 N, 2025 N).
 */
const { bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search);
const FIGS = {
  fig_soddy_systeme: { titre: 'Combien de désintégrations α et β⁻ ? (national 2012 N)', etapes: ['equation', 'systeme', 'y', 'x', 'conclusion', 'fin'] },
  fig_rappel_exp_ln: { titre: 'Rappel de maths : e et ln', etapes: ['exp', 'decroit', 'ln', 'ln_demi', 'valeur', 'fin'] },
  fig_equation_diff: { titre: 'L’équation différentielle de la décroissance', etapes: ['pendant', 'relation', 'equation', 'solution', 'verification', 'fin'] },
  fig_demo_t_demi: { titre: 'Démontrer t½ = ln2/λ', etapes: ['loi', 'condition', 'egalite', 'ln', 'resultat', 'fin'] },
  fig_unites: { titre: 'λ et t½ : la même unité de temps', etapes: ['trace', 'conversion', 'bq', 'fin'] },
  fig_masse_N: { titre: 'De la masse au nombre de noyaux', etapes: ['quantite', 'nombre', 'exemple', 'piege', 'fin'] },
  fig_activite_demo: { titre: 'L’activité : a = λ·N', etapes: ['definition', 'derivee', 'resultat', 'fin'] },
  fig_datation_demo: { titre: 'Dater : t = (1/λ)·ln(a₀/a)', etapes: ['loi', 'rapport', 'ln', 'resultat', 'fin'] },
  fig_pourcentages: { titre: '« restants » ↔ « désintégrés »', etapes: ['trace', 'trente', 'quatre_vingt_dix', 'deux_t_demi', 'fin'] },
  fig_rapport_fils_pere: { titre: 'Le rapport fils / père (national 2020 R)', etapes: ['pere', 'fils', 'rapport', 'fin'] },
  fig_cas_types: { titre: 'Le mot de la question → la méthode', etapes: ['trace', 'composition', 'equation', 'type', 'famille', 't_demi', 'lambda', 'nombre', 'date', 'pourcentage', 'fin'] },
  fig_enonce_2021: { titre: 'Énoncé type national 2021 N : la pile au plutonium 238', etapes: ['trace', 'donnees', 'fin'] },
  fig_enonce_2025: { titre: 'Énoncé type national 2025 N : le cadmium 107', etapes: ['trace', 'donnees', 'fin'] },
  fig_enonce_2022: { titre: 'Énoncé type national 2022 N : l’iode 131', etapes: ['trace', 'donnees', 'fin'] },
};
let fig = FIGS[P.get('fig')] ? P.get('fig') : 'fig_soddy_systeme';
const VITESSE = 1.6;                              // l’écriture va un peu plus vite que la craie du kit
const S = { tw: 0, running: true, pause: false, fait: false, jusqua: null, motif: '', emis: 0 };
let M = {};                                       // étape → instant d’écriture (s), relevé pendant le dessin

const canvas = $('canvas');
const scene = window.OndesTableau.Scene(canvas, dessiner);
const craie = scene.craie;
/* Même cadre que commun.js, mais l’écriture suit l’horloge de la figure (S.tw) : le tuteur peut la figer sur une étape. */
scene.cadre = function (graine) {
  const W = craie.W, H = craie.H, VW = 760, VH = 420;
  craie.debut(graine, S.tw);
  const s = Math.min(W / VW, H / VH);
  scene.s = s; scene.ox = (W - VW * s) / 2; scene.oy = (H - VH * s) / 2;
  craie.ctx.translate(scene.ox, scene.oy); craie.ctx.scale(s, s);
  craie.echelle = s; craie.tailleMin = 11; craie.cadre = { w: VW, h: VH, haut: 0 };
  return craie;
};
let MM = {};
const marque = (c, nom) => { MM[nom] = c.cur; };
/* Une partie peinte (noyau, particule, fiole, bois) apparaît quand l’écriture arrive à elle, d’un coup. */
const peindre = (c, fn) => { if (c.t >= c.cur) c.direct(() => { c.ctx.save(); try { fn(c.ctx); } finally { c.ctx.restore(); } }); };
const vu = nom => M[nom] !== undefined && S.tw >= M[nom] - 1e-6;

// ───────────────────────── Le rendu « réel » (peint, pour l’œil ; la physique reste à la craie) ─────────────────────────
const rgba = (k, a) => `rgba(${k[0]},${k[1]},${k[2]},${a})`;
const PROTON = [228, 96, 54], NEUTRON = [172, 194, 216], ELECTRON = [59, 130, 246], POSITON = [246, 162, 44], FILS = [86, 186, 166];
/** Petite sphère ombrée : dégradé radial, reflet en haut à gauche, bord sombre. */
function sphere(ctx, x, y, r, k) {
  const g = ctx.createRadialGradient(x - r * .38, y - r * .42, r * .08, x, y, r);
  g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(.3, rgba(k, 1)); g.addColorStop(1, rgba(k.map(v => Math.round(v * .3)), 1));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
}
/** Noyau : grappe de nP protons et nN neutrons (spirale serrée, le centre peint en dernier, comme en relief). */
function grappe(ctx, cx, cy, nP, nN, r, kP = PROTON, kN = NEUTRON) {
  const n = nP + nN, pts = [];
  for (let i = 0; i < n; i++) {
    const rr = r * .95 * Math.sqrt(i + .4), a = i * 2.39996;
    pts.push({ x: cx + rr * Math.cos(a), y: cy + rr * Math.sin(a), p: Math.floor((i + 1) * nP / n) > Math.floor(i * nP / n), d: rr });
  }
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(cx + 2, cy + r * Math.sqrt(n) + 3, r * Math.sqrt(n), r * .9, 0, 0, 7); ctx.fill();
  pts.sort((u, v) => v.d - u.d).forEach(q => sphere(ctx, q.x, q.y, r, q.p ? kP : kN));
}
const alpha = (ctx, x, y, r = 4.5) => grappe(ctx, x, y, 2, 2, r);
/** Onde γ peinte : sinusoïde violette brillante avec son halo. */
function ondeGamma(ctx, x1, y1, x2, y2, amp = 6, lam = 14) {
  const L = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / L, uy = (y2 - y1) / L;
  const chemin = () => { ctx.beginPath(); for (let s = 0; s <= L; s += 2) { const w = amp * Math.sin(2 * Math.PI * s / lam), x = x1 + ux * s - uy * w, y = y1 + uy * s + ux * w; s ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } };
  ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  for (const [lw, a] of [[9, .1], [4.5, .26], [2, .95]]) { ctx.strokeStyle = `rgba(186,116,255,${a})`; ctx.lineWidth = lw; chemin(); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = .8; chemin(); ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
}
/** Petit éclair bref (un noyau qui se désintègre). */
function eclair(ctx, x, y, r) {
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, 'rgba(255,255,240,.95)'); g.addColorStop(.3, 'rgba(253,224,71,.6)'); g.addColorStop(1, 'rgba(253,224,71,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,250,210,.7)'; ctx.lineWidth = 1.2; ctx.beginPath();
  for (let i = 0; i < 4; i++) { const a = i * Math.PI / 4; ctx.moveTo(x - r * Math.cos(a), y - r * Math.sin(a)); ctx.lineTo(x + r * Math.cos(a), y + r * Math.sin(a)); }
  ctx.stroke(); ctx.globalCompositeOperation = 'source-over';
}
function arrondi(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
/** Fiole de verre (col, corps arrondi) avec un liquide teinté dans le bas. */
function fiole(ctx, x, y, w, h, k) {
  const col = w * .36, yc = y + h * .28;
  const forme = () => { ctx.beginPath(); ctx.moveTo(x + (w - col) / 2, y); ctx.lineTo(x + (w - col) / 2, yc); ctx.lineTo(x, yc + h * .14); ctx.lineTo(x, y + h - 8);
    ctx.quadraticCurveTo(x, y + h, x + 8, y + h); ctx.lineTo(x + w - 8, y + h); ctx.quadraticCurveTo(x + w, y + h, x + w, y + h - 8); ctx.lineTo(x + w, yc + h * .14);
    ctx.lineTo(x + (w + col) / 2, yc); ctx.lineTo(x + (w + col) / 2, y); ctx.closePath(); };
  ctx.save(); forme(); ctx.clip();
  let g = ctx.createLinearGradient(0, y + h * .5, 0, y + h); g.addColorStop(0, rgba(k, .55)); g.addColorStop(1, rgba(k.map(v => Math.round(v * .5)), .75));
  ctx.fillStyle = g; ctx.fillRect(x, y + h * .52, w, h * .5);
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(x, y + h * .52); ctx.lineTo(x + w, y + h * .52); ctx.stroke();
  ctx.restore();
  forme(); g = ctx.createLinearGradient(x, 0, x + w, 0); g.addColorStop(0, 'rgba(200,230,250,.18)'); g.addColorStop(.5, 'rgba(200,230,250,.05)'); g.addColorStop(1, 'rgba(200,230,250,.14)');
  ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = 'rgba(225,242,255,.6)'; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x + 6, yc + h * .2); ctx.lineTo(x + 6, y + h - 12); ctx.stroke();
  ctx.fillStyle = '#9ca3af'; arrondi(ctx, x + (w - col) / 2 - 3, y - 7, col + 6, 9, 2); ctx.fill();
}
/** Bout de bois vu en coupe : écorce, cernes. */
function bois(ctx, cx, cy, rx, ry) {
  let g = ctx.createLinearGradient(cx - rx - 70, 0, cx, 0); g.addColorStop(0, '#3b2414'); g.addColorStop(1, '#6b4426');
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(cx, cy - ry); ctx.lineTo(cx - 80, cy - ry + 4); ctx.ellipse(cx - 80, cy + 2, rx * .9, ry - 2, 0, -Math.PI / 2, Math.PI / 2, true); ctx.lineTo(cx, cy + ry); ctx.closePath(); ctx.fill();
  g = ctx.createRadialGradient(cx - rx * .2, cy - ry * .2, 2, cx, cy, rx); g.addColorStop(0, '#e8c58f'); g.addColorStop(1, '#a87a46');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(110,70,35,.55)'; ctx.lineWidth = 1.2;
  for (let k = 1; k <= 5; k++) { ctx.beginPath(); ctx.ellipse(cx + k * .6, cy, rx * k / 6, ry * k / 6, 0, 0, 7); ctx.stroke(); }
  ctx.strokeStyle = '#3b2414'; ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, 7); ctx.stroke();
}
/** Stimulateur cardiaque : boîtier de titane arrondi, la pile visible par transparence, son fil. */
function stimulateur(ctx, x, y, w, h) {
  ctx.strokeStyle = 'rgba(203,213,225,.7)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x + w * .3, y + 4); ctx.bezierCurveTo(x + w * .2, y - 26, x - 14, y - 22, x - 10, y + 12); ctx.stroke();
  arrondi(ctx, x, y, w, h, h * .38);
  let g = ctx.createLinearGradient(x, y, x + w, y + h); g.addColorStop(0, '#e5e7eb'); g.addColorStop(.45, '#9ca3af'); g.addColorStop(1, '#374151');
  ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.2; ctx.stroke();
  g = ctx.createRadialGradient(x + w * .5, y + h * .55, 2, x + w * .5, y + h * .55, h * .4); g.addColorStop(0, 'rgba(253,224,71,.85)'); g.addColorStop(1, 'rgba(234,88,12,.35)');
  ctx.fillStyle = g; arrondi(ctx, x + w * .25, y + h * .3, w * .5, h * .5, 5); ctx.fill();
}
/** Quadrillage léger d’un graphe (bleu pâle, comme du papier millimétré). */
function quadrillage(ctx, X, Y, xmax, ymax, dx, dy) {
  ctx.strokeStyle = 'rgba(96,165,250,.16)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let v = 0; v <= xmax + 1e-9; v += dx) { ctx.moveTo(X(v), Y(0)); ctx.lineTo(X(v), Y(ymax)); }
  for (let v = 0; v <= ymax + 1e-9; v += dy) { ctx.moveTo(X(0), Y(v)); ctx.lineTo(X(xmax), Y(v)); }
  ctx.stroke();
}

// ───────────────────────── Morceaux de craie ─────────────────────────
const net = s => String(s).replace(/[_^{}]/g, '');
const W = (c, s, t = 20) => c.largeurTexte(net(s), t);
/** Une fraction écrite à la craie : numérateur, barre, dénominateur ; renvoie les positions (pour barrer). */
function fraction(c, x, y, num, den, o = {}) {
  const t = o.taille ?? 26, col = o.couleur ?? 'blanc';
  const w = Math.max(W(c, num, t), W(c, den, t)) + 12;
  c.texte(num, x, y - 7, { couleur: col, taille: t, align: 'center' });
  c.ligne(x - w / 2, y, x + w / 2, y, { couleur: col, largeur: 2, duree: .12 });
  c.texte(den, x, y + t * .9 + 2, { couleur: col, taille: t, align: 'center' });
  return { w, wn: W(c, num, t), wd: W(c, den, t) };
}
/** Texte centré entouré d’un cadre de craie (le résultat à retenir). */
function encadre(c, s, x, y, o = {}) {
  const t = o.taille ?? 26, w = W(c, s, t) + 26;
  c.texte(s, x, y, { couleur: o.couleur ?? 'vert', taille: t, align: 'center' });
  c.rect(x - w / 2, y - t * .95, w, t * 1.42, { couleur: o.cadre ?? 'jaune', arrondi: 8, largeur: 2 });
  return { x: x - w / 2, y: y - t * .95, w, h: t * 1.42 };
}
/** Axes d’un graphe, graduations, noms et unités. Renvoie les fonctions de passage X(v), Y(v). */
function graphe(c, g) {
  const X = v => g.ox + v / g.xmax * g.w, Y = v => g.oy - v / g.ymax * g.h;
  peindre(c, ctx => quadrillage(ctx, X, Y, g.xmax, g.ymax, g.dx, g.dy));
  c.fleche(g.ox, g.oy, g.ox + g.w + 16, g.oy, { couleur: 'blanc', largeur: 2 }).fleche(g.ox, g.oy, g.ox, g.oy - g.h - 16, { couleur: 'blanc', largeur: 2 });
  for (const v of g.xt) { c.ligne(X(v), g.oy - 4, X(v), g.oy + 4, { couleur: 'blanc', largeur: 1.4, duree: .04 }); c.texte(String(v), X(v), g.oy + 18, { couleur: 'blanc', align: 'center', taille: 13, duree: .1 }); }
  for (const v of g.yt) { c.ligne(g.ox - 4, Y(v), g.ox + 4, Y(v), { couleur: 'blanc', largeur: 1.4, duree: .04 }); c.texte(String(v).replace('.', ','), g.ox - 7, Y(v) + 5, { couleur: 'blanc', align: 'right', taille: 13, duree: .1 }); }
  c.texte('0', g.ox - 7, g.oy + 15, { couleur: 'blanc', align: 'right', taille: 13 });
  c.texte(g.yl, g.ox + 8, g.oy - g.h - 8, { couleur: 'jaune', taille: 15 });
  c.texte(g.xl, g.ox + g.w + 16, g.oy - 30, { couleur: 'jaune', align: 'right', taille: 15 });
  return { X, Y };
}
/** Le tableau des symboles d’un énoncé : une ligne Z, une ligne symbole. */
function tableauZ(c, x, y, cases, o = {}) {
  const cw = o.cw ?? 66, h = 28, n = cases.length;
  c.rect(x, y, 70 + cw * n, 2 * h, { couleur: 'faible', arrondi: 4 });
  c.ligne(x, y + h, x + 70 + cw * n, y + h, { couleur: 'faible', largeur: 1.4, duree: .1 });
  for (let i = 0; i <= n - 1; i++) c.ligne(x + 70 + cw * i, y, x + 70 + cw * i, y + 2 * h, { couleur: 'faible', largeur: 1.2, duree: .06 });
  c.texte('Z', x + 35, y + 20, { couleur: 'cyan', align: 'center', taille: 17 }).texte('symbole', x + 35, y + h + 20, { couleur: 'cyan', align: 'center', taille: 15 });
  cases.forEach(([z, s], i) => { c.texte(String(z), x + 70 + cw * (i + .5), y + 20, { couleur: 'blanc', align: 'center', taille: 17 }); c.texte(s, x + 70 + cw * (i + .5), y + h + 20, { couleur: 'blanc', align: 'center', taille: 17 }); });
  return { w: 70 + cw * n, h: 2 * h };
}

// ───────────────────────── Les figures ─────────────────────────
const DESSINS = {
  fig_soddy_systeme(c) {
    c.texte('Combien de désintégrations α et β⁻ ? (national 2012 N)', 40, 30, { couleur: 'cyan', taille: 20, max: 690 });
    c.repere('figure', 16, 40, 728, 376, 'la famille de l’uranium 238 : le système en x et y');
    c.noyaux('[238,92]U → [206,82]Pb + x [0,-1]e + y [4,2]He', 380, 86, { taille: 30, align: 'center' });
    c.texte('x et y : les nombres de désintégrations β⁻ et α', 380, 120, { couleur: 'faible', taille: 16, align: 'center' });
    c.repere('equation', 110, 50, 540, 78, 'l’équation : x électrons et y noyaux d’hélium');
    marque(c, 'equation');
    c.pause(.4);
    c.texte('Lois de Soddy :', 40, 166, { couleur: 'cyan', taille: 19 });
    c.texte('A : 238 = 206 + 0·x + 4y', 56, 204, { couleur: 'blanc', taille: 23, max: 330 });
    c.texte('Z : 92 = 82 − x + 2y', 56, 244, { couleur: 'blanc', taille: 23, max: 330 });
    c.trait([[46, 184], [40, 190], [40, 214], [34, 220], [40, 226], [40, 248], [46, 254]], { couleur: 'rose', largeur: 2 });
    c.repere('systeme', 28, 144, 360, 116, 'le système : 238 = 206 + 0·x + 4y ; 92 = 82 − x + 2y');
    marque(c, 'systeme');
    c.pause(.4);
    c.texte('y = (238 − 206)/4 = 8', 420, 186, { couleur: 'vert', taille: 24, max: 320 });
    c.texte('(A d’abord : β ne change pas A)', 420, 212, { couleur: 'orange', taille: 15, max: 320 });
    c.repere('y', 412, 160, 330, 60, 'y = (238 − 206)/4 = 8');
    marque(c, 'y');
    c.pause(.4);
    c.texte('x = 82 + 2y − 92', 420, 252, { couleur: 'vert', taille: 24, max: 320 });
    c.texte('x = 82 + 16 − 92 = 6', 420, 282, { couleur: 'vert', taille: 24, max: 320 });
    c.repere('x', 412, 228, 330, 64, 'x = 82 + 2y − 92 = 6');
    marque(c, 'x');
    c.pause(.4);
    encadre(c, '8 désintégrations α et 6 désintégrations β⁻', 380, 330, { taille: 23, couleur: 'jaune', cadre: 'vert' });
    peindre(c, ctx => {
      for (let i = 0; i < 8; i++) alpha(ctx, 110 + 26 * i, 372, 4.2);
      for (let i = 0; i < 6; i++) sphere(ctx, 470 + 26 * i, 372, 5.5, ELECTRON);
    });
    c.texte('8 α', 52, 378, { couleur: 'blanc', taille: 17 }).texte('6 e⁻', 410, 378, { couleur: 'blanc', taille: 17 });
    c.repere('conclusion', 90, 300, 580, 108, '8 désintégrations α et 6 désintégrations β⁻');
    marque(c, 'conclusion');
    c.pause(.3);
    c.texte('Bilan :', 230, 410, { couleur: 'vert', taille: 18 });
    c.noyaux('[238,92]U → [206,82]Pb + 6 [0,-1]e + 8 [4,2]He', 300, 410, { taille: 20, couleur: 'vert' });
    c.repere('fin', 220, 388, 420, 30, 'l’équation bilan');
    marque(c, 'fin');
  },

  fig_rappel_exp_ln(c) {
    c.texte('Rappel de maths : e et ln', 40, 30, { couleur: 'cyan', taille: 20 });

const etapes = () => FIGS[fig].etapes;
const etiquette = () => { $('run').textContent = S.running ? 'Pause' : S.pause ? 'Reprendre' : 'Rejouer'; };
scene.avancer = dt => {
  if (!S.running) return false;
  S.tw += dt * VITESSE;
  if (S.jusqua != null && S.tw >= S.jusqua) {
    S.tw = S.jusqua; S.jusqua = null; S.running = false;
    if (M.fin !== undefined && S.tw >= M.fin - 1e-6) { S.pause = false; S.fait = true; etiquette(); bulle($('feedback'), 'Arrêt sur image : figure complète.'); pont.noter('measurement', { figure: fig }); pont.emettre(); return true; }
    S.pause = true; etiquette();
    bulle($('feedback'), 'Arrêt sur image : ' + (S.motif || 'instant choisi') + '.'); pont.noter('pause', { moment: S.motif }); pont.emettre();
    return true;
  }
  if (M.fin !== undefined && S.tw >= M.fin + 0.05) {
    S.running = false; S.pause = false; S.fait = true; etiquette(); pont.noter('measurement', { figure: fig }); pont.emettre();
  } else if (performance.now() - S.emis > 500) { S.emis = performance.now(); pont.emettre(); }
  return true;
};
function calculer() { if (M.fin === undefined) { const t = S.tw; S.tw = 1e6; dessiner(craie); S.tw = t; scene.sale = true; } }
function start() { S.tw = 0; S.jusqua = null; S.motif = ''; S.running = true; S.pause = false; S.fait = false; scene.sale = true; etiquette(); bulle($('feedback'), ''); pont.noter('start', { figure: fig }); pont.emettre(); }
function pause() { if (!S.running) return; S.running = false; S.pause = true; S.jusqua = null; etiquette(); bulle($('feedback'), 'Pause.'); pont.noter('pause'); pont.emettre(); }
function resume() { if (S.running) return; if (!S.pause) return start(); S.running = true; S.pause = false; etiquette(); bulle($('feedback'), ''); pont.noter('resume'); pont.emettre(); }
function playUntil(p) {
  calculer();
  const nom = p.moment in M && etapes().includes(p.moment) ? p.moment : null, cible = nom ? M[nom] : +p.time_s;
  if (!Number.isFinite(cible)) return;
  if (S.fait || !(S.running || S.pause) || S.tw >= cible - 1e-3) { S.tw = 0; S.fait = false; }
  S.jusqua = cible; S.motif = nom ? MOTIFS[fig][nom] : `t = ${cible.toFixed(1).replace('.', ',')} s d’écriture`; S.running = true; S.pause = false; etiquette(); bulle($('feedback'), '');
  pont.noter('play_until', { moment: nom, time_s: +cible.toFixed(2) }); pont.emettre();
}
function setTime(p) {
  calculer(); const t = Math.max(0, Math.min(+p.time_s, M.fin ?? 0)); if (!Number.isFinite(t)) return;
  S.tw = t; S.jusqua = null; S.running = false; S.fait = t >= (M.fin ?? 0) - 1e-6; S.pause = !S.fait; scene.sale = true; etiquette();
  bulle($('feedback'), 'Arrêt sur image : ' + (S.fait ? 'figure complète' : `t = ${t.toFixed(1).replace('.', ',')} s d’écriture`) + '.'); pont.noter('set_time', { time_s: t }); pont.emettre();
}
function setParameters(p) {
  const f = p.fig || p.figure || p.variant;
  if (!f || !FIGS[f] || f === fig) return;
  fig = f; M = {}; config.title = 'Figure — ' + FIGS[fig].titre; config.variants = [{ id: fig, label: FIGS[fig].titre }];
  config.command_schema.play_until.moment = FIGS[fig].etapes.join(' | ') + ' (réécrit la figure et s’arrête après cette étape)';
  start(); setTimeout(() => pont.manifeste(), 400);
}
$('run').onclick = () => (S.running ? pause() : S.pause ? resume() : start());

function ceQuiSeVoit() {
  const D = DESCRIPTIONS[fig], faites = etapes().filter(n => vu(n));
  const m = [`Figure « ${fig} » : ${FIGS[fig].titre}.`];
  if (!faites.length) m.push(S.running ? 'La figure est en train de s’écrire à la craie (première étape pas encore finie).' : 'Rien d’écrit encore.');
  faites.forEach(n => { if (D[n]) m.push(D[n]); });
  m.push(S.running ? 'La craie écrit encore.' : S.pause ? `Écriture arrêtée après l’étape « ${faites.length ? faites[faites.length - 1] : 'aucune'} ».` : 'Figure complète.');
  return m.join(' ');
}
window.Tableau.explication(Object.fromEntries(Object.keys(FIGS).map(f => [f,
  FIGS[f].etapes.filter(e => DESCRIPTIONS[f][e]).map(e => ({ repere: e, texte: DESCRIPTIONS[f][e] }))])));
const commandes = ['start', 'reset', 'pause', 'resume', 'play_until', 'set_time', 'set_parameters'];
const config = { id: 'radioactivite_figures', version: '1.0', title: 'Figure — ' + FIGS[fig].titre, variants: [{ id: fig, label: FIGS[fig].titre }], commands: commandes,
  command_schema: { play_until: { moment: FIGS[fig].etapes.join(' | ') + ' (réécrit la figure et s’arrête après cette étape)', time_s: 'instant d’écriture (s)' },
    set_time: { time_s: 'instant d’écriture (s), figé' }, set_parameters: { fig: Object.keys(FIGS).join(' | ') } } };
const pont = protocole({ id: config.id, commandes, config,
  texte: `Figure du cours « Décroissance radioactive » : ${FIGS[fig].titre}. Étapes d’écriture : ${FIGS[fig].etapes.join(', ')}.`,
  etat: () => ({ simulation_status: S.running ? 'running' : S.pause ? 'paused' : 'finished', ce_qui_se_voit: ceQuiSeVoit(), current_variant: fig,
    time_s: +S.tw.toFixed(2), parameters: { fig },
    moments: Object.fromEntries(etapes().filter(n => M[n] !== undefined).map(n => [n, +M[n].toFixed(2)])), etapes_ecrites: etapes().filter(n => vu(n)) }),
  progression: () => (S.fait ? 1 : 0),
  executer: (cmd, p) => ({ start, reset: start, pause, resume, play_until: () => playUntil(p), set_time: () => setTime(p), set_parameters: () => setParameters(p) })[cmd]?.() });
etiquette();
</script>
