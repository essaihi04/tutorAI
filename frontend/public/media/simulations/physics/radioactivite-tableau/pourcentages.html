<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Désintégrés ou restants — au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="radio.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Cent noyaux en grille : on en désintègre trente, puis quatre-vingt-dix, puis on attend deux demi-vies ; à chaque fois le pourcentage restant s'écrit à côté"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start pause resume play_until">Lancer</button>
    <span id="reglage" data-professor-control="set_parameters"></span>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="commun.js"></script>
<script src="exposants.js"></script>
<script>
/*
 * Désintégrés ou restants ? (14 novembre 2026, règle 28 du professeur) : remplace les trois lignes écrites de la diapo
 * ra_t4_pourcentages. Cent noyaux en grille (violet : restant ; gris : désintégré) :
 *   30 désintégrés → il en reste 70 : N = 0,70·N₀ ;  90 désintégrés → il en reste 10 : N = 0,10·N₀ ;
 *   un nouvel échantillon, deux demi-vies : 100 → 50 → 25 restants, donc 75 % désintégrés.
 * Curseur : « désintégrés : x % » — la grille se colore et la traduction « il reste (100 − x) % » s'écrit.
 */
const { fr, bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const GX = 40, GY = 64, PAS = 27, N0 = 100;
/* Ordre de désintégration tiré une fois (graine fixe) : le même à chaque lancement. */
const ORDRE = (() => { const r = window.Tableau.graine(31), a = [...Array(N0).keys()]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; })();
const RANG = (() => { const r = new Array(N0); ORDRE.forEach((n, k) => { r[n] = k; }); return r; })();
/* Calendrier (s) : [début, fin, désintégrés au début, à la fin] */
const ETAPES = [
  { de: 0.3, a: 2.1, n0: 0, n1: 30 },
  { de: 2.6, a: 4.6, n0: 30, n1: 90 },
  { de: 5.5, a: 7.0, n0: 0, n1: 50, tdemi: 1 },
  { de: 7.3, a: 8.8, n0: 50, n1: 75, tdemi: 2 },
];
const T = { trente: 2.4, quatre_vingt_dix: 4.9, nouveau: 5.4, deux_t_demi: 9.1 };
const TFIN = 9.4;
const S = { t: 0, running: false, pause: false, fait: false, jusqua: null, motif: '', emis: 0, libre: null };
const vu = nom => S.t >= T[nom] - 1e-6;
/** Nombre de désintégrés à l'instant t, et l'instant où le k-ième s'est désintégré (pour son éclair). */
function etat(t) {
  let n = 0, date = new Array(N0).fill(-1);
  for (const e of ETAPES) {
    if (t < e.de) break;
    if (e.n0 === 0 && e.tdemi) date = new Array(N0).fill(-1);     // nouvel échantillon
    const f = clamp((t - e.de) / (e.a - e.de)); n = Math.round(e.n0 + f * (e.n1 - e.n0));
    for (let k = e.n0; k < n; k++) date[ORDRE[k]] = e.de + (k - e.n0 + 0.5) / (e.n1 - e.n0) * (e.a - e.de);
  }
  if (t >= T.nouveau && t < ETAPES[2].de) { n = 0; date = new Array(N0).fill(-1); }
  return { n, date };
}

function sphere(ctx, x, y, r, [clair, milieu, sombre]) {
  // Noyau peint (règle 32) : une ombre douce posée sous la bille, puis la bille éclairée en haut à gauche.
  ctx.fillStyle = 'rgba(0,0,0,.32)'; ctx.beginPath(); ctx.ellipse(x + r * .25, y + r * .35, r * 1.02, r * .95, 0, 0, Math.PI * 2); ctx.fill();
  const g = ctx.createRadialGradient(x - r * .35, y - r * .4, r * .1, x, y, r); g.addColorStop(0, clair); g.addColorStop(.45, milieu); g.addColorStop(1, sombre);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}
function eclair(ctx, x, y, r, a) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(255,255,240,${.95 * a})`); g.addColorStop(.4, `rgba(255,228,120,${.6 * a})`); g.addColorStop(1, 'rgba(255,200,80,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
}
const PERE = ['#f5ebff', '#b06cf0', '#43186f'], FILS = ['#e8edf3', '#7d8a99', '#2f3842'];

function lignesEcrites(c) {
  const L = [];
  if (vu('trente')) L.push(['30 % désintégrés → il reste 70 %', 'N = 0,70·N_0', 'trente']);
  if (vu('quatre_vingt_dix')) L.push(['90 % désintégrés → il reste 10 %', 'N = 0,10·N_0', 'quatre_vingt_dix']);
  if (vu('deux_t_demi')) L.push(['2 t½ : il reste le quart, soit 25 %', '→ 75 % désintégrés', 'deux_t_demi']);
  L.forEach(([a, b, id], i) => {
    const y = 96 + i * 82;
    c.texte(a, 330, y, { couleur: 'blanc', taille: 18 });
    c.texte(b, 350, y + 28, { couleur: id === 'deux_t_demi' ? 'orange' : 'vert', taille: 19 });
    c.repere('ligne_' + id, 322, y - 22, 420, 60, a);
  });
}

function dessiner(c) {
  scene.cadre(29);
  c.texte('100 noyaux', GX, 40, { couleur: 'blanc', taille: 18 });
  c.texte('restant', 160, 40, { couleur: 'violet', taille: 15 }); c.texte('désintégré', 226, 40, { couleur: 'faible', taille: 15 });
  c.direct(() => {
    const libre = S.libre != null, { n, date } = libre ? { n: S.libre, date: new Array(N0).fill(-1) } : etat(S.t);
    const ctx = c.ctx;
    for (let i = 0; i < N0; i++) {
      const x = GX + 12 + (i % 10) * PAS, y = GY + 12 + Math.floor(i / 10) * PAS, parti = libre ? RANG[i] < n : date[i] >= 0;
      sphere(ctx, x, y, 9.5, parti ? FILS : PERE);
      if (!libre && date[i] >= 0 && S.t - date[i] < 0.35) eclair(ctx, x, y, 18, 1 - (S.t - date[i]) / 0.35);
    }
    c.repere('echantillon', GX, GY, 10 * PAS, 10 * PAS, 'les cent noyaux');
    const yb = GY + 10 * PAS + 26;
    c.texte(`désintégrés : ${n}`, GX, yb, { couleur: 'faible', taille: 17 });
    c.texte(`restants : ${N0 - n}`, GX + 150, yb, { couleur: 'violet', taille: 17 });
    if (!libre && S.t >= T.nouveau) {
      const k = S.t >= ETAPES[3].a ? 't = 2 t½' : S.t > ETAPES[3].de ? 't½ → 2 t½' : S.t >= ETAPES[2].a ? 't = t½' : S.t > ETAPES[2].de ? '0 → t½' : 't = 0';
      c.texte(`nouvel échantillon : ${k}`, GX, yb + 28, { couleur: 'orange', taille: 16 });
    }
    lignesEcrites(c);
    if (libre) {
      const r = N0 - n;
      c.texte(`${n} % désintégrés → il reste ${r} %`, 330, 362, { couleur: 'jaune', taille: 18 });
      c.texte(`N = ${fr(r / 100, 2)}·N_0`, 350, 392, { couleur: 'jaune', taille: 19 });
      c.repere('a_toi', 322, 340, 420, 60, 'ta traduction');
    }
  });
  return c.fin();
}

const canvas = $('canvas');
const scene = window.OndesTableau.Scene(canvas, dessiner);
scene.avancer = dt => {
  if (!S.running) return false;
  S.t = Math.min(TFIN, S.t + dt);
  if (arreterSiInstantAtteint()) return true;
  if (S.t >= TFIN) {
    S.running = false; S.fait = true; $('run').textContent = 'Lancer';
    bulle($('feedback'), 'On traduit toujours : x % désintégrés, donc (100 − x) % restants.', 'good');
    pont.noter('finished'); pont.emettre();
  } else if (performance.now() - S.emis > 400) { S.emis = performance.now(); pont.emettre(); }
  return true;
};
const MOTIFS = { trente: '30 désintégrés, il en reste 70', quatre_vingt_dix: '90 désintégrés, il en reste 10', nouveau: 'un nouvel échantillon de 100 noyaux', deux_t_demi: 'deux demi-vies : il en reste 25, donc 75 % désintégrés' };
function playUntil(p) {
  const nom = p.moment in T ? p.moment : null, cible = nom ? T[nom] : +p.progress * TFIN;
  if (!Number.isFinite(cible)) return;
  S.libre = null;
  if (!(S.running || S.pause) || S.t >= cible - 1e-3) start();
  S.jusqua = cible; S.motif = nom ? MOTIFS[nom] : '';
  if (S.pause) { S.running = true; S.pause = false; $('run').textContent = 'Pause'; }
  pont.noter('play_until', { moment: nom }); pont.emettre();
}
function arreterSiInstantAtteint() {
  if (S.jusqua == null || S.t < S.jusqua) return false;
  S.t = S.jusqua; S.jusqua = null; S.running = false; S.pause = true; $('run').textContent = 'Reprendre';
  bulle($('feedback'), 'Arrêt sur image : ' + (S.motif || 'instant choisi') + '.'); pont.noter('pause'); pont.emettre();
  return true;
}
function ceQuiSeVoit() {
  const m = ['À gauche, une grille de 100 noyaux (violet : restant, gris : désintégré) et les compteurs ; à droite, les traductions écrites.'];
  const n = S.libre != null ? S.libre : etat(S.t).n;
  m.push(`Désintégrés : ${n}, restants : ${N0 - n}.`);
  if (vu('trente')) m.push('Écrit : « 30 % désintégrés → il reste 70 % ; N = 0,70·N₀ ».');
  if (vu('quatre_vingt_dix')) m.push('Écrit : « 90 % désintégrés → il reste 10 % ; N = 0,10·N₀ ».');
  if (vu('deux_t_demi')) m.push('Écrit : « 2 t½ : il reste ¼, soit 25 % → 75 % désintégrés ».');
  if (S.libre != null) m.push(`L’élève a réglé ${S.libre} % désintégrés : « il reste ${N0 - S.libre} %, N = ${fr((N0 - S.libre) / 100, 2)}·N₀ ».`);
  return m.join(' ');
}
function start() { S.libre = null; S.jusqua = null; S.t = 0; S.running = true; S.pause = false; S.fait = false; $('run').textContent = 'Pause'; bulle($('feedback'), 'Les noyaux se désintègrent…'); pont.noter('start'); pont.emettre(); }
function pause() { if (!S.running) return; S.jusqua = null; S.running = false; S.pause = true; $('run').textContent = 'Reprendre'; bulle($('feedback'), 'Arrêt sur image.'); pont.noter('pause'); pont.emettre(); }
function resume() { if (S.running || !S.pause) return start(); S.libre = null; S.running = true; S.pause = false; $('run').textContent = 'Pause'; pont.noter('resume'); pont.emettre(); }
function reset() { S.libre = null; S.t = 0; S.running = false; S.pause = false; S.fait = false; S.jusqua = null; scene.sale = true; $('run').textContent = 'Lancer'; bulle($('feedback'), 'Lance, ou règle toi-même le pourcentage désintégré.'); pont.emettre(); }
function setParameters(p) {
  if (!Number.isFinite(+p.desintegres_pct)) return;
  const x = Math.min(100, Math.max(0, Math.round(+p.desintegres_pct / 5) * 5));
  if (S.running) { S.running = false; S.pause = true; S.jusqua = null; $('run').textContent = 'Reprendre'; }
  S.libre = x; regl.maj(x); scene.sale = true;
  bulle($('feedback'), `${x} % désintégrés : il reste ${100 - x} % des noyaux.`);
  pont.noter('set_parameters', { desintegres_pct: x }); pont.emettre();
}
const regl = window.Tableau.curseur({ id: 'x', label: 'Désintégrés :', min: 0, max: 100, step: 5, valeur: 30, unite: '%', commande: 'set_parameters', decimales: 0, onchange: v => setParameters({ desintegres_pct: v }) });
$('reglage').replaceChildren(regl);
$('run').onclick = () => (S.running ? pause() : S.pause ? resume() : start());
window.Tableau.explication({ pourcentages: [
  { repere: 'echantillon', texte: 'Cent noyaux : un noyau, c’est un pour cent.' },
  { repere: 'ligne_trente', texte: 'Trente pour cent désintégrés : il en reste soixante-dix pour cent.' },
  { repere: 'ligne_quatre_vingt_dix', texte: 'Quatre-vingt-dix pour cent désintégrés : il en reste dix pour cent.' },
  { repere: 'ligne_deux_t_demi', texte: 'Deux demi-vies : il reste le quart, donc soixante-quinze pour cent sont désintégrés.' },
] });
const commandes = ['start', 'pause', 'resume', 'reset', 'set_parameters', 'play_until'];
const config = { id: 'radioactivite_pourcentages', version: '1.0', title: 'Désintégrés ou restants', variants: [{ id: 'pourcentages', label: 'pourcentages' }], commands: commandes,
  command_schema: { set_parameters: { desintegres_pct: '0..100 (pas de 5), pourcentage de noyaux désintégrés' }, play_until: { moment: Object.keys(MOTIFS).join(' | ') + ' (rejoue et se fige à cet instant clé)' } } };
const pont = protocole({ id: config.id, commandes, config,
  texte: '100 noyaux : 30 % désintégrés → il reste 70 %, N = 0,70·N₀ ; 90 % désintégrés → il reste 10 %, N = 0,10·N₀ ; après deux demi-vies il reste 25 %, donc 75 % désintégrés. Curseur : pourcentage désintégré, la traduction s’écrit.',
  etat: () => ({ simulation_status: S.running ? 'running' : S.pause ? 'paused' : (S.fait ? 'finished' : 'idle'), ce_qui_se_voit: ceQuiSeVoit(), moments: { ...T },
    parameters: { desintegres_pct: S.libre }, desintegres: S.libre != null ? S.libre : etat(S.t).n, time_s: +S.t.toFixed(2) }),
  progression: () => (S.fait ? 1 : clamp(S.t / TFIN)),
  executer: (cmd, p) => ({ start, pause, resume, reset, set_parameters: () => setParameters(p), play_until: () => playUntil(p) })[cmd]?.() });
bulle($('feedback'), 'Lance, ou règle toi-même le pourcentage désintégré.');
</script>
<script src="/media/simulations/professor-locate.js" defer></script>
</body></html>
