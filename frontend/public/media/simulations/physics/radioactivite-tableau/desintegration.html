<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Désintégration d’un noyau — au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="radio.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Un noyau se désintègre : à gauche le noyau père peint (protons et neutrons) tremble puis éclate en noyau fils et particule ; à droite l’équation de désintégration s’écrit à la craie avec les lois de Soddy (conservation de A et de Z)"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start reset pause resume play_until set_time">Lancer</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="commun.js"></script>
<script src="exposants.js"></script>
<script src="noyaux.js"></script>
<script>
/*
 * Désintégration d’un noyau : α, β⁻, β⁺, γ et les lois de Soddy (cours « Décroissance radioactive », 2e Bac PC BIOF, novembre 2026).
 * Vue « Le noyau » (gauche, peinte) : le noyau père, une grappe de sphères ombrées (protons rouge-orangé, neutrons gris-bleu),
 * tremble puis éclate : le noyau fils recule un peu, la particule part vite (α : grappe 2 + 2 ; β⁻ : sphère bleue « e⁻ » ;
 * β⁺ : sphère jaune-orangé « e⁺ » ; γ : onde violette). Tous les nucléons sont dessinés (210 pour le polonium).
 * Vue « L’équation » (droite, craie) : l’équation s’écrit avec noyaux.js, puis les deux lignes de Soddy cochées.
 * Types (?type= ou set_parameters {type} ; la pastille touchée = type suivant) : alpha (défaut), beta_moins, beta_plus, gamma,
 * soddy, inconnu (national 2021 R : ³²₁₅P → ᴬ_Z X + ⁰₋₁e).
 * Le peint ne change pas la physique : A, Z, la particule émise et les équations sont exacts ; le tremblement, l’éclair et
 * la vitesse de la particule sont pour l’œil.
 */
const { fr, bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lisse = u => { u = clamp(u); return u * u * (3 - 2 * u); };
const TYPES = ['alpha', 'beta_moins', 'beta_plus', 'gamma', 'soddy', 'inconnu'];
const demande = new URLSearchParams(location.search).get('type');
let type = TYPES.includes(demande) ? demande : 'alpha';

/* ── Les six types : noyaux, particule, instants (s de la scène), textes ─────────────────────────── */
const DONNEES = {
  alpha: {
    titre: 'désintégration α', pere: ['Po', 210, 84], fils: ['Pb', 206, 82], particule: 'alpha', te: 2.6,
    eq: ['[210,84]Po → [206,82]Pb + [4,2]He'], soddyA: 'A : 210 = 206 + 4', soddyZ: 'Z : 84 = 82 + 2',
    conclusion: 'désintégration α : émission d’un noyau d’hélium [4,2]He',
    sortie: 'une particule α, noyau d’hélium ⁴₂He (2 protons + 2 neutrons), qui part très vite',
    suite: [['noyau_pere', 1.2, 'le noyau père ²¹⁰₈₄Po tremble'], ['emission', 2.95, 'la particule α (2 protons + 2 neutrons) part très vite'],
      ['noyau_fils', 4.6, 'il reste le noyau fils ²⁰⁶₈₂Pb'], ['equation', 6.4, 'l’équation est écrite'],
      ['soddy_A', 8.2, 'A se conserve : 210 = 206 + 4'], ['soddy_Z', 10.0, 'Z se conserve : 84 = 82 + 2'],
      ['conclusion', 12.0, 'désintégration α : émission d’un noyau d’hélium ⁴₂He'], ['fin', 13.2, 'fin']],
  },
  beta_moins: {
    titre: 'désintégration β⁻', pere: ['C', 14, 6], fils: ['N', 14, 7], particule: 'electron', te: 3.4,
    eq: ['[14,6]C → [14,7]N + [0,-1]e'], soddyA: 'A : 14 = 14 + 0', soddyZ: 'Z : 6 = 7 + (−1)',
    interne: 'dans le noyau : [1,0]n → [1,1]p + [0,-1]e', change: ['n', 'p'],
    conclusion: 'désintégration β⁻ : un neutron devient un proton, un électron [0,-1]e est émis',
    sortie: 'un électron ⁰₋₁e (petite sphère bleue « e⁻ ») qui part très vite',
    suite: [['noyau_pere', 1.2, 'le noyau père ¹⁴₆C tremble'], ['transformation', 3.35, 'dans le noyau, un neutron devient un proton et un électron sort'],
      ['emission', 3.75, 'l’électron ⁰₋₁e part très vite'], ['noyau_fils', 5.2, 'il reste le noyau fils ¹⁴₇N'], ['equation', 7.0, 'l’équation est écrite'],
      ['soddy_A', 8.8, 'A se conserve : 14 = 14 + 0'], ['soddy_Z', 10.6, 'Z se conserve : 6 = 7 + (−1)'],
      ['conclusion', 12.8, 'désintégration β⁻ : un neutron devient un proton, un électron est émis'], ['fin', 14.0, 'fin']],
  },
  beta_plus: {
    titre: 'désintégration β⁺', pere: ['P', 30, 15], fils: ['Si', 30, 14], particule: 'positon', te: 3.4,
    eq: ['[30,15]P → [30,14]Si + [0,1]e'], soddyA: 'A : 30 = 30 + 0', soddyZ: 'Z : 15 = 14 + 1',
    interne: 'dans le noyau : [1,1]p → [1,0]n + [0,1]e', change: ['p', 'n'],
    conclusion: 'désintégration β⁺ : un proton devient un neutron, un positon [0,1]e est émis',
    sortie: 'un positon ⁰₁e (petite sphère jaune-orangé « e⁺ ») qui part très vite',
    suite: [['noyau_pere', 1.2, 'le noyau père ³⁰₁₅P tremble'], ['transformation', 3.35, 'dans le noyau, un proton devient un neutron et un positon sort'],
      ['emission', 3.75, 'le positon ⁰₁e part très vite'], ['noyau_fils', 5.2, 'il reste le noyau fils ³⁰₁₄Si'], ['equation', 7.0, 'l’équation est écrite'],
      ['soddy_A', 8.8, 'A se conserve : 30 = 30 + 0'], ['soddy_Z', 10.6, 'Z se conserve : 15 = 14 + 1'],
      ['conclusion', 12.8, 'désintégration β⁺ : un proton devient un neutron, un positon est émis'], ['fin', 14.0, 'fin']],
  },
  gamma: {
    titre: 'désintégration β⁻ puis rayonnement γ', pere: ['Co', 60, 27], fils: ['Ni', 60, 28], particule: 'electron', te: 2.4, tg: 5.2, change: ['n', 'p'],
    eq: ['[60,27]Co → [60,28]Ni* + [0,-1]e', '[60,28]Ni* → [60,28]Ni + γ'], soddyA: 'γ :  A : 60 = 60 + 0', soddyZ: 'γ :  Z : 28 = 28 + 0',
    conclusion: 'γ : A et Z ne changent pas',
    sortie: 'd’abord un électron ⁰₋₁e, puis le rayonnement γ (onde violette) émis par le noyau fils excité',
    suite: [['noyau_pere', 1.0, 'le noyau père ⁶⁰₂₇Co tremble'], ['emission', 2.75, 'l’électron ⁰₋₁e part'],
      ['noyau_excite', 4.2, 'le noyau fils ⁶⁰₂₈Ni* est excité : il brille'], ['emission_gamma', 5.5, 'le noyau excité émet le rayonnement γ et se calme'],
      ['equation', 8.4, 'les deux équations sont écrites'], ['soddy_A', 10.0, 'γ : A ne change pas (60 = 60 + 0)'],
      ['soddy_Z', 11.6, 'γ : Z ne change pas (28 = 28 + 0)'], ['conclusion', 13.2, 'γ : A et Z ne changent pas'], ['fin', 14.4, 'fin']],
  },
  soddy: {
    titre: 'les lois de Soddy', pere: ['X', 'A', 'Z'], fils: ['Y', 'A_1', 'Z_1'], particule: 'x', te: 2.2, generique: [24, 11],
    sortie: 'une particule x (A₂ nucléons, nombre de charge Z₂)',
    suite: [['pere', 1.4, 'le noyau père ᴬ_Z X'], ['fils', 3.2, 'le noyau fils Y (A₁ nucléons, Z₁)'], ['particule', 4.8, 'la particule x (A₂, Z₂)'],
      ['loi_A', 6.8, 'A = A₁ + A₂ : conservation du nombre de nucléons'], ['loi_Z', 8.8, 'Z = Z₁ + Z₂ : conservation du nombre de charge'], ['fin', 10.0, 'fin']],
  },
  inconnu: {
    titre: 'exercice : identifier le noyau fils', pere: ['P', 32, 15], fils: ['S', 32, 16], particule: 'electron', te: 1.6, change: ['n', 'p'],
    sortie: 'un électron ⁰₋₁e (désintégration β⁻)',
    suite: [['noyau_pere', 0.9, 'le noyau ³²₁₅P tremble'], ['emission', 1.95, 'un électron ⁰₋₁e part'], ['equation', 3.4, '³²₁₅P → ᴬ_Z X + ⁰₋₁e est écrite'],
      ['ligne_A', 5.2, 'conservation de A : 32 = A + 0, donc A = 32'], ['ligne_Z', 7.0, 'conservation de Z : 15 = Z − 1, donc Z = 16'],
      ['tableau', 9.2, 'le tableau des symboles : Z = 13 Al, 14 Si, 15 P, 16 S'], ['fils', 10.8, 'Z = 16 : X est le soufre ³²₁₆S'], ['fin', 12.0, 'fin']],
  },
};
const D = () => DONNEES[type];
let M = {}, FIN = 0;
function calculer() { M = {}; for (const [n, t] of D().suite) M[n] = t; FIN = M.fin; }
calculer();
const S = { t: 0, running: false, jusqua: null, motif: '', fait: false, emis: 0 };

/* ── Géométrie ─────────────────────────────────────────────────────────────────────────────────── */
const R1 = { x: 8, y: 34, w: 364, h: 300 }, R2 = { x: 384, y: 34, w: 368, h: 300 };
const FX = 160, FY = 176, CXE = R2.x + R2.w / 2;
const DIR = (() => { const l = Math.hypot(.86, -.5); return [.86 / l, -.5 / l]; })();         // la particule part vers le haut à droite
const DIRG = (() => { const l = Math.hypot(.94, .34); return [.94 / l, .34 / l]; })();        // l’onde γ part vers le bas à droite
const PAST = { x: 344, y: 296, r: 14 };
const SYMB = { alpha: 'α', beta_moins: 'β⁻', beta_plus: 'β⁺', gamma: 'γ', soddy: 'loi', inconnu: '?' };

/* ── La grappe de nucléons (disposition en tournesol, tirage fixe des protons) ─────────────────── */
let G = null;
function construire() {
  const d = D(), n = d.generique ? d.generique[0] : d.pere[1], Z = d.generique ? d.generique[1] : d.pere[2];
  const r = window.Tableau.graine(n * 7 + Z), s = Array.from({ length: n }, (_, i) => (i < Z ? 'p' : 'n'));
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [s[i], s[j]] = [s[j], s[i]]; }
  const pos = []; for (let i = 0; i < n; i++) { const q = Math.sqrt((i + .5) / n), a = i * 2.399963; pos.push([q * Math.cos(a), q * Math.sin(a)]); }
  if (d.change && s[0] !== d.change[0]) { const j = s.indexOf(d.change[0], 1); [s[0], s[j]] = [s[j], s[0]]; }   // le nucléon qui change est devant, au centre
  const rn = Math.min(10, 58 / (Math.sqrt(n) * .95)), R = rn * Math.sqrt(n) * .95;
  // α (2 p + 2 n) ou x (1 p + 1 n) : les nucléons du bord tourné vers la sortie quittent le noyau.
  const part = new Set();
  if (d.particule === 'alpha' || d.particule === 'x') {
    const besoin = d.particule === 'alpha' ? { p: 2, n: 2 } : { p: 1, n: 1 };
    const ordre = pos.map((p, i) => [p[0] * DIR[0] + p[1] * DIR[1], i]).sort((a, b) => b[0] - a[0]);
    for (const [, i] of ordre) if (besoin[s[i]] > 0) { besoin[s[i]]--; part.add(i); }
  }
  let mx = 0, my = 0; for (const i of part) { mx += pos[i][0]; my += pos[i][1]; }
  const k = part.size || 1;
  G = { n, Z, s, pos, rn, R, part, depart: [FX + mx / k * R, FY + my / k * R] };
}
construire();

/* ── Peinture ─────────────────────────────────────────────────────────────────────────────────── */
const TEINTES = {
  p: ['#ffe0c8', '#f26b3a', '#7c1d06'], n: ['#f4f8fc', '#a7bdd2', '#455a6e'],
  e: ['#e0f2fe', '#3b82f6', '#1e3a8a'], pos: ['#fff7cc', '#fbbf24', '#a8520a'],
};
function sphere(ctx, x, y, r, t, alpha = 1) {
  ctx.globalAlpha = alpha;
  const g = ctx.createRadialGradient(x - r * .35, y - r * .4, r * .08, x, y, r);
  g.addColorStop(0, t[0]); g.addColorStop(.5, t[1]); g.addColorStop(1, t[2]);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  if (r > 3) { ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(x - r * .38, y - r * .42, r * .26, r * .16, -.6, 0, Math.PI * 2); ctx.fill(); }
  ctx.globalAlpha = 1;
}
function chemin(ctx, R, r = 8) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(R.x, R.y, R.w, R.h, r) : ctx.rect(R.x, R.y, R.w, R.h); }
/** Le fond de la vue du noyau : un vide sombre (le tableau reste visible autour). */
function vide(ctx) {
  const g = ctx.createRadialGradient(FX, FY, 20, FX, FY, 330);
  g.addColorStop(0, 'rgba(18,22,34,.92)'); g.addColorStop(1, 'rgba(5,7,12,.92)');
  ctx.fillStyle = g; chemin(ctx, R1); ctx.fill();
}
/** Petit éclair bref (pour l’œil) : un noyau qui se désintègre. */
function eclair(ctx, x, y, age, taille = 46) {
  if (age < 0 || age > .4) return;
  const k = age / .4, r = 6 + taille * k;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(255,255,235,${.95 * (1 - k)})`); g.addColorStop(.4, `rgba(255,220,140,${.5 * (1 - k)})`); g.addColorStop(1, 'rgba(255,200,120,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
}
/** L’onde γ : une sinusoïde violette brillante avec un halo, qui file depuis le noyau. */
function ondeGamma(ctx, x0, y0, tete, long = 84) {
  const debut = Math.max(0, tete - long), [dx, dy] = DIRG, nx = -dy, ny = dx, pts = [];
  for (let s = debut; s <= tete; s += 1.5) {
    const env = Math.sin(Math.PI * clamp((s - debut) / Math.max(1, tete - debut))), w = 7 * env * Math.sin((s - tete) / 5.5);
    pts.push([x0 + dx * s + nx * w, y0 + dy * s + ny * w]);
  }
  if (pts.length < 2) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const [w, col, flou] of [[9, 'rgba(168,85,247,.22)', 14], [4, 'rgba(192,132,252,.55)', 8], [1.6, 'rgba(245,232,255,.95)', 0]]) {
    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.shadowColor = '#a855f7'; ctx.shadowBlur = flou;
    ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke();
  }
  ctx.restore();
}

/* État visuel à l’instant t (tout se déduit de t : une scène figée se redessine à l’identique). */
function visuel(t = S.t) {
  const d = D(), te = d.te, apres = t >= te;
  const apparait = clamp((t - .15) / .45);
  const tremble = apres ? (d.tg && t < d.tg ? 1.2 : 0) : (.5 + 2.6 * clamp((t - (te - 1.4)) / 1.4)) * apparait;
  const recul = apres ? lisse((t - te) / .5) * (d.particule === 'alpha' ? 9 : d.particule === 'x' ? 6 : 3) : 0;
  const ox = -DIR[0] * recul + tremble * Math.sin(t * 53), oy = -DIR[1] * recul + tremble * Math.cos(t * 41);
  const f = d.change ? lisse((t - (te - .9)) / .6) : 0;                       // le nucléon du centre change de couleur
  return { te, apres, apparait, ox, oy, f, cx: FX + ox, cy: FY + oy };
}
/** Position de la particule (null si pas encore partie ou sortie de la vue). */
function particule(t = S.t) {
  const d = D(), te = d.te, v = visuel(t);
  if (d.particule === 'alpha' || d.particule === 'x') {
    if (t < te) return null;
    const [sx, sy] = G.depart;
    if (d.particule === 'x') { const u = lisse((t - te) / .9); return { x: sx + DIR[0] * 150 * u, y: sy + DIR[1] * 150 * u, dedans: true }; }
    const s = 300 * (t - te), x = sx + DIR[0] * s, y = sy + DIR[1] * s;
    return { x, y, dedans: x < R1.x + R1.w + 10 && y > R1.y - 10 };
  }
  // électron ou positon : apparaît au centre, monte à la surface, puis file.
  if (t < te - .3) return null;
  const s = t < te ? G.R * lisse((t - (te - .3)) / .3) : G.R + 360 * (t - te);
  const x = v.cx + DIR[0] * s, y = v.cy + DIR[1] * s;
  return { x, y, dedans: x < R1.x + R1.w + 10 && y > R1.y - 10 };
}
const tetteGamma = (t = S.t) => (D().tg && t >= D().tg ? 320 * (t - D().tg) : -1);
const lueur = (t = S.t) => { const d = D(); if (!d.tg) return 0; if (t < d.te + .2) return 0; if (t < d.tg) return lisse((t - d.te - .2) / .6) * (.75 + .25 * Math.sin(t * 11)); return 1 - lisse((t - d.tg) / .7); };

function peindreNoyau(ctx) {
  const d = D(), t = S.t, v = visuel(), p = particule();
  ctx.save(); vide(ctx); chemin(ctx, R1); ctx.clip();
  if (v.apparait > 0) {
    const L = lueur();
    if (L > 0) {                                                              // le noyau fils excité brille
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(v.cx, v.cy, G.R * .5, v.cx, v.cy, G.R * 1.9);
      g.addColorStop(0, `rgba(253,224,71,${.45 * L})`); g.addColorStop(1, 'rgba(253,224,71,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(v.cx, v.cy, G.R * 1.9, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
    // Les nucléons, du bord vers le centre (ceux du centre sont devant).
    for (let i = G.n - 1; i >= 0; i--) {
      if (v.apres && G.part.has(i)) continue;
      const x = v.cx + G.pos[i][0] * G.R, y = v.cy + G.pos[i][1] * G.R;
      if (i === 0 && d.change && v.f > 0) {
        sphere(ctx, x, y, G.rn, TEINTES[d.change[0]], v.apparait * (1 - v.f)); sphere(ctx, x, y, G.rn, TEINTES[d.change[1]], v.apparait * v.f);
      } else sphere(ctx, x, y, G.rn, TEINTES[G.s[i]], v.apparait);
    }
    if (d.change && v.f > 0 && v.f < 1) {                                     // le nucléon qui change : un petit halo
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .5 * Math.sin(Math.PI * v.f);
      const x = v.cx + G.pos[0][0] * G.R, y = v.cy + G.pos[0][1] * G.R, g = ctx.createRadialGradient(x, y, 0, x, y, G.rn * 2.4);
      g.addColorStop(0, '#fff'); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, G.rn * 2.4, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
    if (L > 0) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .18 * L; ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.arc(v.cx, v.cy, G.R, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
  }
  // La particule.
  if (p) {
    if (d.particule === 'alpha' || d.particule === 'x') {
      const r = Math.max(G.rn, 5.5), off = d.particule === 'alpha' ? [[-.55, -.55, 'p'], [.55, -.55, 'n'], [-.55, .55, 'n'], [.55, .55, 'p']] : [[-.5, 0, 'p'], [.5, 0, 'n']];
      for (const [a, b, s] of off) sphere(ctx, p.x + a * r * 1.5, p.y + b * r * 1.5, r, TEINTES[s]);
    } else sphere(ctx, p.x, p.y, 6, d.particule === 'positon' ? TEINTES.pos : TEINTES.e);
  }
  // L’éclair au départ de la particule (et au départ de γ).
  const bord = [FX + DIR[0] * G.R, FY + DIR[1] * G.R];
  eclair(ctx, bord[0], bord[1], t - d.te);
  if (d.tg) eclair(ctx, FX + DIRG[0] * G.R, FY + DIRG[1] * G.R, t - d.tg, 36);
  const tg = tetteGamma();
  if (tg >= 0) ondeGamma(ctx, FX + DIRG[0] * G.R, FY + DIRG[1] * G.R, tg);
  ctx.restore();
}

/* ── Craie ─────────────────────────────────────────────────────────────────────────────────────── */
/** Écrit `fn` au rythme de la scène à partir de t0 (s) ; à la fin tout est écrit. */
function ecrit(c, t0, fn) {
  const t = c.t, cur = c.cur, comp = c.complet;
  c.t = S.fait ? Infinity : S.t; c.cur = t0;
  try { fn(); } finally { c.t = t; c.cur = cur; c.complet = comp; }
}
/** L’annotation du moment `nom` s’écrit pendant les `dur` s qui le précèdent. */
function quand(c, nom, dur, fn) { if (nom in M && (S.fait || S.t >= M[nom] - dur)) ecrit(c, M[nom] - dur, fn); }
const vu = nom => nom in M && (S.fait || S.t >= M[nom] - 1e-6);
/* Texte avec noyaux : « [A,Z]X » (A et Z quelconques : 210, A_1…) écrit avec craie.nucleide (noyaux.js). */
const RE_N = /\[([^,\]]+),([^\]]+)\]([A-Za-zαβγ]+)/g;
function morceaux(s) {
  const out = []; let i = 0, m; RE_N.lastIndex = 0;

  const d = D(), t = S.t, v = visuel(), p = particule();
  if (t < .15) return 'vide pour l’instant';
  const pere = `${uni(d.pere)} (${compo(d.pere)})`, fils = `${type === 'inconnu' && !vu('fils') ? 'ᴬ_Z X (encore inconnu)' : uni(d.fils) + (d.tg && t < d.tg + .5 ? '*' : '')} (${compo(d.fils)})`;
  const m = [];
  if (!v.apres) {
    m.push(`le noyau père ${pere}${t > d.te - 1.4 ? ' tremble de plus en plus' : ' tremble'}`);
    if (d.change && v.f > 0) m.push(v.f < 1 ? `au centre, un ${d.change[0] === 'n' ? 'neutron devient proton' : 'proton devient neutron'} (il change de couleur)` : `au centre, ${d.change[0] === 'n' ? 'un neutron est devenu proton' : 'un proton est devenu neutron'}`);
    if (p) m.push(`${d.particule === 'positon' ? 'un positon' : 'un électron'} sort du noyau`);
  } else {
    m.push(`le noyau père s’est désintégré ; il reste le noyau fils ${fils}${d.tg ? (t < d.tg ? ', excité (marqué *) : il brille' : t < d.tg + .7 ? ', il émet le rayonnement γ et se calme' : ', calmé') : ''}`);
    if (p && p.dedans) m.push(d.particule === 'x' ? 'la particule x s’est écartée' : `${d.particule === 'alpha' ? 'la particule α (2 protons + 2 neutrons)' : d.particule === 'positon' ? 'le positon e⁺' : 'l’électron e⁻'} part très vite vers le haut à droite`);
    else if (d.particule !== 'x') m.push('la particule est sortie de la vue');
    const tg = tetteGamma(); if (tg >= 0 && tg < 330) m.push('l’onde γ (violette) file vers le bas à droite');
  }
  if (d.interne && vu('transformation')) m.push(`écrit sous le noyau : « ${d.interne.replace('dans le noyau : ', '').replace(/\[([^,\]]+),([^\]]+)\]([A-Za-z]+)/g, (_, A, Z, X) => uni([X, A, Z]))} »`);
  return m.join(' ; ');
}
function ceQuiSeVoit() {
  const d = D(), etat = S.running ? 'la scène se déroule' : S.fait ? 'fin de la scène' : S.t > 0 ? 'scène arrêtée' : 'scène pas encore lancée';
  const m = [`Type « ${type} » : ${d.titre}. t = ${fr(S.t, 2)} s (${etat}).`];
  m.push(`Vue « Le noyau » (à gauche, peinte : protons rouge-orangé, neutrons gris-bleu) : ${gauche()}.`);
  const e = ecritsEquation();
  m.push(`Vue « L’équation » (à droite, à la craie) : ${e.length ? 'écrit ' + e.join(' ; ') : 'rien n’est encore écrit'}.`);
  if (typeof d.pere[1] === 'number') m.push(`Côté gauche : A = ${d.pere[1]}, Z = ${d.pere[2]} ; côté droit : A = ${d.fils[1]} + ${partA()} = ${d.pere[1]}, Z = ${d.fils[2]} + ${partZ()} = ${d.pere[2]}.`);
  else m.push('Côté gauche : A et Z ; côté droit : A₁ + A₂ et Z₁ + Z₂.');
  if (visuel().apres) m.push(`Ce qui sort : ${d.sortie}.`);
  m.push(`Phase : ${phase()}.`);
  return m.join(' ');
}
const partA = () => (D().particule === 'alpha' ? 4 : 0);
const partZ = () => ({ alpha: '2', electron: '(−1)', positon: '1' }[D().particule] ?? '0');
function message() {
  return { alpha: 'α : A diminue de 4, Z de 2.', beta_moins: 'β⁻ : A ne change pas, Z augmente de 1.', beta_plus: 'β⁺ : A ne change pas, Z diminue de 1.',
    gamma: 'γ : A et Z ne changent pas.', soddy: 'Lois de Soddy : A = A₁ + A₂ et Z = Z₁ + Z₂.', inconnu: 'X = ³²₁₆S, le soufre.' }[type];
}

/* ── Commandes ───────────────────────────────────────────────────────────────────────────────── */
function playUntil(p) {
  const nom = p && p.moment in M ? p.moment : null, cible = nom ? M[nom] : +p.time_s;
  if (!Number.isFinite(cible)) return;
  if (S.fait || S.t >= cible - 1e-4) S.t = 0;
  S.jusqua = Math.min(FIN, Math.max(0.001, cible));
  S.motif = nom ? D().suite.find(s => s[0] === nom)[2] : '';
  S.running = true; S.fait = false; $('run').textContent = 'Pause'; bulle($('feedback'), 'Observe…');
  pont.noter('play_until', { moment: nom, time_s: S.jusqua }); pont.emettre();
}
function start() { S.jusqua = null; S.t = 0; S.running = true; S.fait = false; $('run').textContent = 'Pause'; bulle($('feedback'), `${D().titre[0].toUpperCase() + D().titre.slice(1)} : observe le noyau…`); pont.noter('start', params()); pont.emettre(); }
function reset() { start(); }
function pause() { if (!S.running) return; S.running = false; S.jusqua = null; $('run').textContent = 'Reprendre'; bulle($('feedback'), 'Arrêt sur image.'); pont.noter('pause', { time_s: +S.t.toFixed(3) }); pont.emettre(); }
function resume() { if (S.running) return; if (S.fait || S.t >= FIN) return start(); S.running = true; $('run').textContent = 'Pause'; bulle($('feedback'), 'Observe…'); pont.noter('resume'); pont.emettre(); }
function setTime(p) {
  const t = +p.time_s; if (!Number.isFinite(t)) return;
  S.running = false; S.jusqua = null; S.t = clamp(t, 0, FIN); S.fait = S.t >= FIN;
  $('run').textContent = S.fait ? 'Rejouer' : 'Reprendre'; scene.sale = true;
  bulle($('feedback'), `Arrêt sur image : t = ${fr(S.t, 2)} s.`); pont.noter('set_time', { time_s: S.t }); pont.emettre();
}
function changerType(t) {
  if (!TYPES.includes(t)) return false;
  type = t; calculer(); construire(); scene.reecrire(); return true;
}
function setParameters(p) {
  p = p || {};
  if (p.type && changerType(String(p.type))) { pont.noter('set_parameters', params()); start(); return; }
  bulle($('feedback'), `Type : ${D().titre}.`); pont.noter('set_parameters', params()); pont.emettre();
}
function params() {
  const d = D();
  return { type, pere: d.pere.join(' '), fils: d.fils.join(' '), particule: { alpha: 'alpha (⁴₂He)', electron: 'electron (⁰₋₁e)', positon: 'positon (⁰₁e)', x: 'x (A₂, Z₂)' }[d.particule], gamma: !!d.tg };
}
$('run').onclick = () => (S.running ? pause() : (S.t > 0 && S.t < FIN && !S.fait ? resume() : start()));

/* La pastille : touchée, elle passe au type suivant et relance. */
window.Tableau.glisser(canvas, {
  toucher: (px, py) => { const [x, y] = scene.local(px, py); return Math.hypot(x - PAST.x, y - PAST.y) < PAST.r + 8 ? 'type' : null; },
  bouger: () => {},
  lacher: () => { changerType(TYPES[(TYPES.indexOf(type) + 1) % TYPES.length]); pont.noter('set_parameters', params()); start(); },
});

window.Tableau.explication({

const commandes = ['start', 'reset', 'pause', 'resume', 'set_time', 'set_parameters', 'play_until'];
const momentsDe = t => DONNEES[t].suite.map(s => s[0]).join(' | ');
const config = { id: 'radioactivite_desintegration', version: '1.0', title: 'Désintégration d’un noyau : α, β⁻, β⁺, γ et lois de Soddy', variants: TYPES.map(t => ({ id: t, label: DONNEES[t].titre })), commands: commandes,
  command_schema: {
    set_parameters: { type: TYPES.join(' | ') + ' (change le type et relance depuis le début)' },
    set_time: { time_s: '0..fin (arrêt sur cet instant, s ; la fin dépend du type)' },
    play_until: { moment: `instant clé du type courant (alpha : ${momentsDe('alpha')} ; beta_moins et beta_plus : ${momentsDe('beta_moins')} ; gamma : ${momentsDe('gamma')} ; soddy : ${momentsDe('soddy')} ; inconnu : ${momentsDe('inconnu')})`, time_s: 'ou un instant en s' } } };
const pont = protocole({ id: config.id, commandes, config,
  texte: 'Désintégration d’un noyau : le noyau père (grappe de protons et de neutrons) tremble puis éclate en noyau fils + particule. α : ²¹⁰₈₄Po → ²⁰⁶₈₂Pb + ⁴₂He ; β⁻ : ¹⁴₆C → ¹⁴₇N + ⁰₋₁e (¹₀n → ¹₁p + ⁰₋₁e) ; β⁺ : ³⁰₁₅P → ³⁰₁₄Si + ⁰₁e (¹₁p → ¹₀n + ⁰₁e) ; γ : ⁶⁰₂₇Co → ⁶⁰₂₈Ni* + ⁰₋₁e puis ⁶⁰₂₈Ni* → ⁶⁰₂₈Ni + γ ; lois de Soddy : A = A₁ + A₂, Z = Z₁ + Z₂ ; exercice : ³²₁₅P → ᴬ_Z X + ⁰₋₁e, X = ³²₁₆S.',
  etat: () => ({ simulation_status: S.running ? 'running' : (S.fait ? 'finished' : (S.t > 0 ? 'paused' : 'idle')), ce_qui_se_voit: ceQuiSeVoit(), current_variant: type,
    time_s: +S.t.toFixed(3), parameters: params(), moments: { ...M } }),
  progression: () => (S.fait ? 1 : 0),
  executer: (cmd, p) => ({ start, reset, pause, resume, set_time: () => setTime(p), set_parameters: () => setParameters(p), play_until: () => playUntil(p) })[cmd]?.() });
bulle($('feedback'), `${D().titre[0].toUpperCase() + D().titre.slice(1)} : le noyau va apparaître…`);
setTimeout(() => { if (!S.running && S.t === 0) start(); }, 1600);
