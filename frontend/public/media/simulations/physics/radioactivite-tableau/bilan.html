<script>
/*
 * « Ce qu’il faut retenir » du cours « Décroissance radioactive » (phys_ch4_radioactivite), même forme que
 * ondes-lumineuses-tableau/bilan.html et ondes-periodiques-tableau/bilan.html. TOUTE la fiche tient sur UNE page :
 * neuf blocs en trois colonnes (un par compétence C1 à C9), chacun avec la définition à savoir par cœur (mot pour mot),
 * les formules encadrées (indices et exposants rendus : « N_0 » s’écrit N₀, « e^{−λt} » par exposants.js ; les noyaux
 * « [14,6]C » par noyaux.js, A en haut et Z en bas à gauche) et le piège en orange (⚠). La voix la parcourt bloc par
 * bloc : play_until {moment: <bloc>} écrit ce bloc à cet instant et le met en lumière ; les blocs déjà dits (ou
 * sautés) sont écrits d’un coup ; ceux pas encore dits attendent leur moment (« fiche » ou « fin » : tout d’un coup).
 * La hauteur de chaque bloc est mesurée, puis les blocs d’une colonne se répartissent la hauteur du cadre.
 * La deuxième page est celle de l’élève (set_parameters {lacunes, acquis, acquis_ids}).
 * Téléphone en paysage (18 novembre 2026) : le kit baisse son plancher de texte jusqu’à 45 % sur un petit tableau ;
 * cette page garde un VRAI plancher de 15 px à l’écran (sa craie, plus bas : rien de partagé n’est changé), y compris
 * pour les indices, les exposants, A et Z des noyaux et les étages des fractions, et se partage en autant de parties
 * qu’il faut (jusqu’à un bloc par écran), avec le compteur « partie n sur N · touche : la suite ».
 */
const { bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);

const BLOCS = [
  { id: 'noyau', titre: '1 · Le noyau', comps: ['C1'], formules: ['[A,Z]X : Z protons, A nucléons', 'N = A − Z'],
    def: 'Des isotopes sont des noyaux qui ont le même nombre de protons Z et des nombres de nucléons A différents : [12,6]C, [14,6]C.',
    attention: 'Z = nombre de protons, pas de neutrons.' },
  { id: 'stabilite', titre: '2 · Stabilité : diagramme (N, Z)', comps: ['C2'], formules: ['au-dessus → β⁻', 'au-dessous → β^{+}'],
    def: 'Les noyaux stables forment la vallée de stabilité. Au-dessus : excès de neutrons ; au-dessous : excès de protons ; noyaux lourds (A > 200) : α.',
    attention: 'Isotopes : une ligne perpendiculaire à l’axe des Z.' },
  { id: 'radioactivite', titre: '3 · Radioactivité · lois de Soddy', comps: ['C3'], formules: ['A = A_1 + A_2', 'Z = Z_1 + Z_2'],
    def: 'La radioactivité est une transformation nucléaire naturelle, spontanée et aléatoire, au cours de laquelle un noyau instable se transforme en un noyau plus stable avec émission d’une particule.',
    attention: 'Soddy : on conserve A et Z, pas le nombre de protons.' },
  { id: 'desintegrations', titre: '4 · α, β⁻, β^{+}, γ', comps: ['C4'], formules: ['α : [4,2]He', 'β⁻ : [0,-1]e', 'β^{+} : [0,1]e', 'Y* → Y + γ'],
    def: 'β⁻ : [1,0]n → [1,1]p + [0,-1]e. β^{+} : [1,1]p → [1,0]n + [0,1]e. γ : le noyau fils excité Y* se désexcite.',
    attention: 'γ ne change ni A ni Z.' },
  { id: 'famille', titre: '5 · Famille : x α et y β⁻', comps: ['C5'], formules: ['[238,92]U → [206,82]Pb + x [0,-1]e + y [4,2]He'],
    def: 'Système en x et y : conservation de A, puis de Z. 238 = 206 + 4y ; 92 = 82 − x + 2y : 8 α et 6 β⁻.',
    attention: 'β ne change pas A : y d’abord.' },
  { id: 'loi', titre: '6 · Loi de décroissance', comps: ['C6'], formules: ['N(t) = N_0·e^{−λt}', 'τ = ⟦1|λ⟧'],
    def: 'λ : constante radioactive, en s⁻¹ (ou jour⁻¹, an⁻¹). τ : la tangente à l’origine coupe l’axe des temps en t = τ.',
    attention: 'N(t) = noyaux restants (pas désintégrés).' },
  { id: 'demi_vie', titre: '7 · Demi-vie t½', comps: ['C7'], formules: ['t½ = ⟦ln2|λ⟧', 'N(n·t½) = ⟦N_0|2^{n}⟧'],
    def: 'La demi-vie t½ est la durée au bout de laquelle la moitié des noyaux initialement présents se sont désintégrés.',
    attention: 'À 2t½ il reste 25 %, 75 % sont désintégrés.' },
  { id: 'activite', titre: '8 · Activité a', comps: ['C8'], formules: ['a = λ·N', 'a(t) = a_0·e^{−λt}', 'N = ⟦m|M⟧·N_A'],
    def: 'L’activité a est le nombre de désintégrations par seconde ; elle s’exprime en becquerel (Bq).',
    attention: 'λ en s⁻¹ pour a en Bq.' },
  { id: 'datation', titre: '9 · Datation', comps: ['C9'], formules: ['t = ⟦1|λ⟧·ln(⟦a_0|a⟧)'],
    def: 'Carbone 14 : t½ = 5730 ans. On mesure a, on compare à a_0.',
    attention: 'a_0 : même masse d’un échantillon vivant (récent).' },
];
const STATUTS = { non_acquis: ['à reprendre', 'rouge'], partiel: ['à revoir', 'orange'], acquis: ['acquis', 'vert'] };
const AVANT = -1e9;   // instant d'un bloc déjà dit : il est écrit d'un coup
// apparu[i] : null = pas encore dit (pas écrit) ; un nombre = l'instant (s de la scène) où il commence à s'écrire.
// loin : le dernier bloc dit par la voix (ses moments vont croissant : le kit ignore un play_until déjà dépassé) ;
// fin : toute la fiche écrite ; impression : la fiche se met en page pour le papier (sans « touche : la suite »).
const S = { page: 1, feuille: 0, focus: null, lacunes: null, acquis: null, acquis_ids: null, apparu: [], loin: -1, fin: false, impression: false };
window.__debordeBlocs = [];   // vérification : un bloc dont le texte dépasse son cadre ou une colonne trop pleine

/* ---- Noyaux et indices ------------------------------------------------------------------------------------------
 * « [14,6]C » (et « [A,Z]X » pour la notation générale) s’écrit avec noyaux.js (craie.nucleide : A en haut à gauche,
 * Z en bas à gauche) ; le reste avec Craie.texte (indices « N_0 », exposants « e^{−λt} » par exposants.js). */
const RE_NOYAU = /\[([-−]?[0-9A-Z]+),([-−]?[0-9A-Z]+)\]([A-Za-z]+\*?)/g;
function morceaux(s) {
  const out = []; let i = 0, m; s = String(s); RE_NOYAU.lastIndex = 0;
  while ((m = RE_NOYAU.exec(s))) { if (m.index > i) out.push({ t: s.slice(i, m.index) }); out.push({ A: m[1], Z: m[2], X: m[3] }); i = RE_NOYAU.lastIndex; }
  if (i < s.length) out.push({ t: s.slice(i) });
  return out;
}
const EXP = { '⁻': '−', '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9' };
const EXPO = s => String(s).replace(/[⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, g => '^{' + [...g].map(ch => EXP[ch]).join('') + '}');
const SUP = /[⁻⁰¹²³⁴⁵⁶⁷⁸⁹]|\^/, A_NOYAU = /\[[^\]]+,[^\]]+\]/;
/* ---- Plancher réel de 15 px à l’écran (18 novembre 2026) --------------------------------------------------------
 * plancher(c) : la plus petite taille (unités du cadre) qui fait 15 px à l’écran. Les indices et exposants (62 %),
 * A et Z des noyaux (60 %) ne descendent plus dessous : ils grandissent et s’écartent (noyauM, hautLigne, etendue),
 * et la mise en page en tient compte. Au-dessus du plancher (ordinateur), tout est écrit exactement comme avant. */
const plancher = c => (c && c.echelle && c.tailleMin ? c.tailleMin / c.echelle : 0);
const petitDe = (c, t) => Math.max(t * .62, plancher(c));   // taille d'un indice ou d'un exposant
const txtAZ = v => String(v).replace('-', '−');
/** Un noyau ᴬ_Z X : taille de A et Z, hauteur de la ligne de base de A au-dessus, de Z en dessous. */
function noyauM(c, t) {
  const pA = Math.max(t * .6, plancher(c)), d = Math.max(.64 * t, .8 * pA) - .64 * t;
  return { pA, hA: .42 * t + d / 2, bZ: .22 * t + d / 2 };
}
function largeurNoyau(c, m, t) {
  const { pA } = noyauM(c, t);
  return Math.max(c.largeurTexte(txtAZ(m.A), pA), c.largeurTexte(txtAZ(m.Z), pA)) + 1.5 + c.largeurTexte(m.X, t);
}
/** Comme craie.nucleide (noyaux.js), avec A et Z jamais sous le plancher : rend l'abscisse de fin. */
function ecrireNoyau(c, m, x, y, o) {
  const t = o.taille ?? 18, { pA, hA, bZ } = noyauM(c, t);
  const xs = x + Math.max(c.largeurTexte(txtAZ(m.A), pA), c.largeurTexte(txtAZ(m.Z), pA)) + 1.5;
  const st = { couleur: o.couleur, alpha: o.alpha, duree: o.duree != null ? o.duree / 3 : undefined };
  c.texte(txtAZ(m.A), xs - 1, y - hA, { ...st, taille: pA, align: 'right' });
  c.texte(txtAZ(m.Z), xs - 1, y + bZ, { ...st, taille: pA, align: 'right' });
  c.texte(m.X, xs, y, { ...st, taille: t });
  return xs + c.largeurTexte(m.X, t);
}
/** Largeur d'un texte de craie (indices et exposants plus petits, comme ils sont écrits : craie._largeur, plus bas). */
function largeurTexte(c, t, taille) {
  if (String(t).includes('⟦')) return c.largeurTexte(t, taille);   // une fraction « ⟦num|dén⟧ » : mesurée par le kit (étages à 78 %)
  return c._largeur(t, taille);
}
function largeur(c, s, taille) {
  return morceaux(s).reduce((w, m) => w + (m.t != null ? largeurTexte(c, m.t, taille) : largeurNoyau(c, m, taille)), 0);
}
/** Écrit une ligne (texte, indices, exposants, noyaux) ; o : taille, couleur, align, max, alpha, duree. */
function ecrire(c, s, x, y, o = {}) {
  const ms = morceaux(s);
  if (!ms.some(m => m.t == null)) return c.texte(s, x, y, o);
  let taille = o.taille ?? 18, w = largeur(c, s, taille);
  if (o.max && w > o.max) { taille *= o.max / w; w = o.max; }
  let px = o.align === 'center' ? x - w / 2 : o.align === 'right' ? x - w : x;
  const oo = { ...o, taille, align: 'left', max: 0 };
  for (const m of ms) {
    if (m.t != null) { if (m.t.trim()) c.texte(m.t, px, y, oo); px += largeurTexte(c, m.t, taille); }
    else px = ecrireNoyau(c, m, px, y, oo);
  }
  return c;
}
/** Ce qui dépasse d'une ligne au-dessus de sa ligne de base (A d'un noyau, exposant), en unités du cadre. */
function hautLigne(c, l, t) {
  let h = .78 * t;
  if (A_NOYAU.test(l)) { const n = noyauM(c, t); h = Math.max(h, n.hA + .75 * n.pA); }
  if (SUP.test(String(l).replace(RE_NOYAU, ''))) h = Math.max(h, .42 * t + .75 * petitDe(c, t));
  return h;
}
/** Le dénominateur d'une fraction qui porte un exposant (« 2^{n} ») descend assez pour que l'exposant ne touche pas le trait. */
const extraDen = (c, d, tf) => (SUP.test(d) ? Math.max(0, .54 * tf + .72 * petitDe(c, tf) - .95 * tf) : 0);
/** Étendue verticale d'une formule (au-dessus et au-dessous de sa ligne de base) : le cadre de la formule l'entoure. */
function etendue(c, f, t) {
  let h = .78 * t, b = .22 * t;
  const reste = String(f).replace(RE_NOYAU, () => { const n = noyauM(c, t); h = Math.max(h, n.hA + .75 * n.pA); b = Math.max(b, n.bZ + .1 * n.pA); return 'X'; })
    .replace(/⟦([^|⟧]*)\|?([^⟧]*)⟧/g, (m0, nu, de) => {
      const tf = c._tailleEtage(Math.max(t, plancher(c))), yb = .32 * t, nb = yb + tf * .3 + (/_/.test(nu) ? tf * .2 : 0);
      h = Math.max(h, nb + (SUP.test(nu) ? .42 * tf + .75 * petitDe(c, tf) : .78 * tf));
      b = Math.max(b, tf * .95 + extraDen(c, de, tf) - yb + (/_/.test(de) ? .28 * tf + .1 * petitDe(c, tf) : .22 * tf));
      return 'X';
    });
  if (SUP.test(reste)) h = Math.max(h, .42 * t + .75 * petitDe(c, t));
  if (/[A-Za-zλ]_/.test(reste)) b = Math.max(b, .28 * t + .1 * petitDe(c, t));
  return { h, b };
}
/* Texte pour la bulle et ce_qui_se_voit (HTML) : jamais de « _ » ni de « [A,Z] » visibles. */
const HAUT_U = { 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹', '-': '⁻', '−': '⁻', '+': '⁺', n: 'ⁿ', A: 'ᴬ' };
const BAS_U = { 0: '₀', 1: '₁', 2: '₂', 3: '₃', 4: '₄', 5: '₅', 6: '₆', 7: '₇', 8: '₈', 9: '₉', '-': '₋', '−': '₋', A: 'ₐ' };
const enHaut = s => [...s].every(ch => ch in HAUT_U) ? [...s].map(ch => HAUT_U[ch]).join('') : '^(' + s + ')';
const enBas = s => [...s].every(ch => ch in BAS_U) ? [...s].map(ch => BAS_U[ch]).join('') : '_' + s;
const lisible = s => window.Tableau.lisible(s)
  .replace(RE_NOYAU, (m, A, Z, X) => (A === 'A' ? `${X} (A nucléons, Z protons)` : enHaut(A) + enBas(Z) + X))
  .replace(/\^\{([^}]+)\}/g, (m, e) => enHaut(e))
  .replace(/([A-Za-zλ])_([0-9A])/g, (m, l, d) => l + BAS_U[d]);

/* Coupe un texte en lignes qui tiennent dans `max` px (mesure avec les indices et les noyaux). */
function lignes(c, texte, taille, max) {
  const out = []; let ligne = '';
  // une formule dans la phrase ne se coupe pas : « ¹₀n → ¹₁p + ⁰₋₁e » reste sur une ligne
  const t = String(texte).replace(/ ([=\/·→<>≥≤≈≠−+]) /g, ' $1 ');
  for (const mot of t.split(/[ \t\n]+/)) {
    const essai = ligne ? ligne + ' ' + mot : mot;
    if (largeur(c, essai, taille) > max && ligne) { out.push(ligne); ligne = mot; } else ligne = essai;
  }
  if (ligne) out.push(ligne);
  return out;
}
function paragraphe(c, texte, x, y, taille, max, o, dessiner) {
  lignes(c, texte, taille, max).forEach((l, i) => {
    // un noyau [A,Z]X : son nombre A, écrit en haut, ne touche pas la ligne du dessus ; de même un exposant tenu à 15 px
    y += Math.max(i && A_NOYAU.test(l) ? taille * .25 : 0, hautLigne(c, l, taille) - .9 * taille);
    if (dessiner) ecrire(c, l, x, y, { taille, ...o }); y += taille * 1.2;
  });
  return y;
}

// Trois colonnes de trois blocs, dans le cadre 760 × 420 ; hauteurs mesurées, réparties dans la colonne.
let COL = [{ x: 18, w: 228 }, { x: 266, w: 228 }, { x: 514, w: 228 }];
const HAUT = 50, BAS = 414;
const POS = [];   // position calculée de chaque bloc : { x, w, y0, h }
let TF = 12.5;    // taille des formules
let TD = 11.5;    // taille des définitions
let TT = 14, TA = 11;   // titres des blocs, pièges
/* Agrandissement du 15 novembre 2026 (« ce qu'il faut retenir : cases serrées, petits textes qui se chevauchent ») :
 * les trois colonnes prennent toute la largeur du cadre (scene.L, jusqu'à 1596 sur un portable) et les tailles sont
 * les plus grandes qui tiennent (de 1,7 × à 1 × les tailles d'origine), jamais sous le minimum lisible du kit
 * (15 px à l'écran) : avant, ce minimum grossissait le texte APRÈS la mesure et les lignes se chevauchaient. */
let CLE = '';
/* Règle de l'utilisateur (15 novembre 2026) : jamais de texte sous 15 px à l'écran. Quand les neuf blocs ne tiennent
 * pas sur un tableau bas (portable, surtout avec la bande de formules : 1114 × 273), la fiche se partage en FEUILLES
 * successives (blocs 1 à k, puis k+1 à 9) ; la feuille montrée suit le bloc que dit la voix, « Suite → » ou un clic sur
 * l'en-tête passe à la suivante, puis à la page de l'élève. Modèle : chimie/transformations-deux-sens-tableau/bilan.html. */
let FEUILLES = [BLOCS.map((_, i) => i)];   // chaque feuille : les indices de ses blocs, dans l'ordre
let GROUPES_F = [[[0, 1, 2], [3, 4, 5], [6, 7, 8]]];   // par feuille : les blocs de chaque colonne
const feuilleDe = i => Math.max(0, FEUILLES.findIndex(f => f.includes(i)));
/** Les neuf blocs en nf feuilles (dans l'ordre, feuilles à peu près égales). */
function feuilles(nf) {
  const fs = []; let i = 0;
  for (let k = 0; k < nf; k++) { const t = Math.ceil((BLOCS.length - i) / (nf - k)); fs.push([...Array(t).keys()].map(j => i + j)); i += t; }
  return fs;
}
let COMPRIME = false;   // mesure : un titre ou une formule serait rétréci sous le plancher pour tenir dans sa colonne
function disposer(c) {
  const L = scene.L, cle = `${L}|${c.echelle.toFixed(3)}|${document.fonts ? document.fonts.status : ''}`;   // remesuré quand la police de craie est chargée
  if (cle !== CLE) {
    CLE = cle; window.__debordeBlocs.length = 0;   // la vérification porte sur la mise en page en cours
    const m = plancher(c) ? plancher(c) + .2 : 0;
    const tente = (fs, F, n) => {
      const gs = fs.map(f => repartir(f, n)); essayer(L, n, F, m); COMPRIME = false;
      if (gs.every(g => tient(c, g)) && !COMPRIME) { FEUILLES = fs; GROUPES_F = gs; return true; }
      return false;
    };
    // 1) Comme avant (ordinateur) : 1, 2 puis 3 feuilles ; dans chaque cas les plus grandes tailles (1,7 × à 1 ×) et 3, 4 ou 5 colonnes qui tiennent.
    // 2) Petit tableau (téléphone en paysage, 18 novembre 2026) : autant de parties qu'il faut, jusqu'à un bloc par écran, 1 à 5 colonnes.
    let ok = false;
    //    Là, l'écriture peut grandir jusqu'à 3 × quand la partie a de la place (15 px est un plancher, pas un but).
    for (const [nmax, ns, Fmax] of [[3, [3, 4, 5], 1.7], [BLOCS.length, [1, 2, 3, 4, 5], 3]]) {
      for (let nf = 1; nf <= nmax && !ok; nf++) {
        const fs = feuilles(nf);
        for (let F = Fmax; F >= .999 && !ok; F -= .05) for (const n of ns) { if (n <= fs[0].length && tente(fs, F, n)) { ok = true; break; } }
      }
      if (ok) break;
    }
    if (!ok) { const fs = feuilles(BLOCS.length); FEUILLES = fs; GROUPES_F = fs.map(f => repartir(f, 1)); essayer(L, 1, 1, m); }
    S.feuille = Math.min(S.feuille, FEUILLES.length - 1); etiquettes();
  }
  GROUPES = GROUPES_F[S.feuille] || GROUPES_F[0];
}
/** Place réservée à droite du titre d'un bloc pour l'état de l'élève (« à reprendre », ✓). */
const reserve = c => largeurTexte(c, 'à reprendre', Math.max(11, plancher(c))) + 14;
/** Les blocs d'une feuille répartis en n colonnes (dans l'ordre, colonnes à peu près égales). */
function repartir(f, n) {
  n = Math.min(n, f.length); const g = []; let i = 0;
  for (let k = 0; k < n; k++) { const t = Math.ceil((f.length - i) / (n - k)); g.push(f.slice(i, i + t)); i += t; }
  return g;
}
function essayer(L, n, F, m) {
  const w = (L - 36 - (n - 1) * 22) / n;
  COL = [...Array(n).keys()].map(k => ({ x: 18 + k * (w + 22), w }));
  TF = Math.max(12.5 * F, m); TD = Math.max(11.5 * F, m); TT = Math.max(14 * F, m); TA = Math.max(11 * F, m);
}
let GROUPES = [[0, 1, 2], [3, 4, 5], [6, 7, 8]];
function tient(c, groupes = GROUPES) {
  return groupes.every((ids, k) => {
    const { x, w } = COL[k];
    return ids.reduce((t, i) => t + contenu(c, BLOCS[i], x, 0, w, true, false) + 6, 0) <= BAS - HAUT;
  });
}

/* Écrit (ou mesure seulement) le contenu d'un bloc ; rend l'ordonnée de fin. */
function contenu(c, b, x, y0, w, st, dessiner) {
  const kf = TF / 12.5, pl = plancher(c);

  const feuille = nf > 1 ? ` Feuille ${S.feuille + 1}/${nf} visible : ${FEUILLES[S.feuille].map(i => BLOCS[i].titre).join(', ')}.` : '';
  return lisible(`Page 1, la fiche du chapitre « Décroissance radioactive »${nf > 1 ? ` en ${nf} feuilles` : ''} :${feuille} ${ecrits}/9 blocs écrits (définition, formule encadrée, piège)${f ? ` ; en lumière « ${f.titre} » : ${f.def}${f.formules ? ' Formules : ' + f.formules.join(' ; ') + '.' : ''} Piège : ${f.attention}` : '.'}${S.lacunes ? ` Blocs à reprendre : ${BLOCS.filter(b => statut(b) && statut(b) !== 'acquis').map(b => b.titre).join(', ') || 'aucun'}.` : ''}`);
}
$('suiv').onclick = () => (S.page === 1 ? suite() : aller(1, 'previous', null, true));
// Imprimer / PDF : la fiche entière et la page de l'élève, sur fond blanc (shared/tableau/imprimer.js).
// Sur un petit écran, le papier reçoit la mise en page d'un ordinateur (canvas de 1280 × 600 le temps des images) :
// la fiche entière en peu de pages, pas une partie par feuille.
$('imprimer').onclick = () => {
  const avant = { page: S.page, feuille: S.feuille, focus: S.focus, apparu: S.apparu.slice() };
  const force = canvas.clientWidth < 1000 || canvas.clientHeight < 460;
  S.impression = true; CLE = '';
  if (force) { canvas.style.width = '1280px'; canvas.style.height = '600px'; scene.craie.resize(); }
  S.page = 1; S.focus = null; S.apparu = BLOCS.map(() => AVANT); scene.image();   // la mise en page du papier
  const nf = FEUILLES.length;
  window.Tableau.imprimer({ titre: 'Ce qu’il faut retenir — décroissance radioactive', scene,
    pages: [...FEUILLES.map((f, k) => ({ nom: nf > 1 ? `la fiche (${k + 1}/${nf})` : 'la fiche', preparer: () => { S.page = 1; S.feuille = k; S.focus = null; S.apparu = BLOCS.map(() => AVANT); } })),
            { nom: 'ta page : à retravailler', preparer: () => { S.page = 2; S.focus = null; } }],
    restaurer: () => {
      S.impression = false; CLE = '';
      if (force) { canvas.style.width = canvas.style.height = ''; scene.craie.resize(); }
      Object.assign(S, avant); etiquettes(); scene.sale = true;
    } });
  pont.noter('imprimer', { pages: nf + 1 }); pont.emettre();
};
canvas.addEventListener('pointerdown', e => {
  if (S.page !== 1) return;
  const r = canvas.getBoundingClientRect(), [x, y] = scene.local(e.clientX - r.left, e.clientY - r.top);
  if (y < 42 && FEUILLES.length > 1) return suite('next');   // clic sur l'en-tête : la feuille suivante
  const i = BLOCS.findIndex((b, k) => { const p = POS[k]; return p && S.apparu[k] != null && FEUILLES[S.feuille].includes(k) && x >= p.x - 6 && x <= p.x + p.w + 6 && y >= p.y0 - 6 && y <= p.y0 + p.h; });
  if (i < 0) { if (FEUILLES.length > 1) suite('next'); return; }   // « touche : la suite » : hors d'un bloc, la partie suivante
  S.focus = BLOCS[i].id; scene.sale = true; bulle($('feedback'), lisible(BLOCS[i].def));
  pont.noter('touche', { moment: BLOCS[i].id }); pont.emettre();
});

window.Tableau.explication({ bilan: BLOCS.map(b => ({ repere: b.id, texte: lisible(b.def) })) });
const commandes = ['start', 'reset', 'play_until', 'set_parameters', 'next', 'previous'];
const config = { id: 'radioactivite_bilan', version: '1.0', title: 'Ce qu’il faut retenir — décroissance radioactive', variants: [{ id: 'bilan', label: 'fiche' }], commands: commandes,
  command_schema: { play_until: { moment: Object.keys(moments()).join(' | ') + ' (écrit ce bloc de la fiche et le met en lumière ; fiche ou fin = toute la fiche ; lacunes = la page de l’élève)' },
    set_parameters: { lacunes: '[{id: C1..C9, label, statut: non_acquis|partiel, reprendre_avec: [..]}] (bilan de l’élève)', acquis: '[labels acquis]', acquis_ids: '[C1, ..]' } } };
const pont = protocole({ id: config.id, commandes, config,
  texte: 'Fiche « Ce qu’il faut retenir » du chapitre « Décroissance radioactive », sur une page (neuf blocs : le noyau, la stabilité et le diagramme (N, Z), la radioactivité et les lois de Soddy, les désintégrations α, β⁻, β⁺ et γ, la famille radioactive, la loi de décroissance, la demi-vie, l’activité, la datation ; chacun avec définition, formule encadrée, piège), puis la page de l’élève (ce qu’il lui reste à retravailler).',
  etat: () => ({ simulation_status: 'paused', ce_qui_se_voit: ceQuiSeVoit(), current_variant: 'bilan', time_s: tempsFiche(), parameters: { page: S.page, focus: S.focus, lacunes: S.lacunes ? S.lacunes.length : null }, moments: moments() }),
  progression: () => (S.page === 2 ? 1 : (S.feuille + 1) / (FEUILLES.length + 1)),
  executer: (cmd, p) => ({ start: () => aller(1, 'start', 'noyau'), reset: () => aller(1, 'reset', 'noyau'), play_until: () => playUntil(p), set_parameters: () => setParameters(p),
    next: () => suite('next'), previous: () => aller(1, 'previous', null, true) })[cmd]?.() });
aller(1, 'start', 'noyau');   // la voix commence par le noyau : le premier bloc s'écrit et est en lumière
window.__bilan = { S, scene, BLOCS, POS, lisible, get FEUILLES() { return FEUILLES; } };   // pour les vérifications automatiques
</script>
