<script>
/*
 * Exercices du national sur les ondes mécaniques progressives (professeur règle 41, simulations-au-tableau règle 14,
 * 17 novembre 2026) : le schéma du sujet redessiné et annoté, animé avec les valeurs du sujet ; la courbe
 * (oscillogramme, graphe) se trace en même temps que le phénomène, puis on se fige sur chaque lecture.
 * Une vue par sujet : ?vue=national_<année>_<session>.
 *   national_2022_normale     émetteur E et récepteur R, L = 85 cm, 0,5 ms/div (Δt = 5 div, v = 340 m/s)
 *   national_2024_rattrapage  émetteur entre M₁ et M₂, d = 2,85 m, 0,5 ms/div (τ = 4 div = 2 ms, ℓ ≈ 1,09 m)
 *   national_2024_normale     caillou dans l’eau, r₁ = 14 cm, r₂ = 56 cm, t₂ = t₁ + 1,5 s (v = 0,28 m/s, t₂ = 2 s)
 *   national_2021_rattrapage  barre métallique, droite Δt = f(d) (pente 2 × 10⁻⁴ s/m, v = 5000 m/s, aluminium)
 *   national_2020_rattrapage  échographie, t₁ = 100 µs, t₂ = 180 µs, v = 1540 m/s (d₂ ≈ 6,16 cm)
 *   national_2018_normale     air et pétrole, L = 1,84 m, 2 ms/div (τ = 2 div = 4 ms, V_p ≈ 1303 m/s)
 *   national_2022_rattrapage  S vibre à t = 0, M à L = 2,5 cm ; y_M(t) nulle jusqu’à 10 ms (τ = 0,01 s, v = 2,5 m/s)
 * Deux paramètres d’adresse (2ᵉ passe, 18 novembre 2026), absents = comportement d’avant :
 *   &arret=<étape>   la page ne joue pas au-delà de cette étape (bouton compris) : la lecture et le calcul restent
 *                    cachés pendant que l’élève répond ; seul un play_until explicite du tuteur va plus loin.
 *   &depart=<étape>  la page s’ouvre figée à la fin de cette étape (diapositive de correction qui suit l’énoncé) ;
 *                    reset y revient.
 * Chaque vue est une suite d’étapes (phases) ; la fin de chaque étape est un moment (`play_until {moment}`).
 * Les étapes de lecture et de calcul viennent APRÈS le phénomène : leurs résultats restent cachés jusqu’à leur moment.
 */
const { fr, bulle, protocole, lisible } = window.Tableau;
const P = window.OndesTableau.P;
const $ = id => document.getElementById(id);

/* ── Petits outils de dessin ─────────────────────────────────────────────────────────────── */
function arcCraie(c, x, y, r, a0, a1, o) {
  const n = Math.max(14, Math.round(r * Math.abs(a1 - a0) / 6)), pts = [];
  for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; pts.push([x + r * Math.cos(a), y + r * Math.sin(a)]); }
  c.trait(pts, o);
}
/** Salve : `n` oscillations de durée `duree`, à partir de s0 (même unité que s). */
const salve = (s, s0, duree, n = 8) => (s < s0 || s > s0 + duree ? 0 : Math.sin(2 * Math.PI * n * (s - s0) / duree));
/** Haut-parleur peint (émetteur) tourné vers la droite (sens = 1) ou la gauche (sens = −1). */
function peindreHP(ctx, x, y, sens = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(sens, 1);
  ctx.fillStyle = 'rgba(0,0,0,.3)'; P.rr(ctx, -14, -15, 22, 34, 4); ctx.fill();
  ctx.fillStyle = P.lin(ctx, 0, -16, 0, 16, [[0, '#6b7280'], [.5, '#374151'], [1, '#111827']]); P.rr(ctx, -18, -18, 20, 36, 4); ctx.fill();
  ctx.fillStyle = P.lin(ctx, 2, 0, 16, 0, [[0, '#9ca3af'], [1, '#374151']]);
  ctx.beginPath(); ctx.moveTo(2, -9); ctx.lineTo(16, -18); ctx.lineTo(16, 18); ctx.lineTo(2, 9); ctx.closePath(); ctx.fill();
  ctx.restore();
}
/** Source ponctuelle (émetteur vu de dessus) : un disque ombré. */
function peindreSource(ctx, x, y) { P.perle(ctx, x, y, 9, 'gris'); }
/* Le fœtus peint (19/11/2026, l'utilisateur : « améliorer le dessin du fœtus, il n'est pas réaliste ») : la poche de
   liquide amniotique, puis un fœtus recroquevillé vu de profil (tête, corps, bras replié, jambes repliées, cordon).
   Il tient exactement entre yF (face avant) et yB (face arrière) : son épaisseur reste d₂, celle que mesurent les échos. */
function peindreFoetus(ctx, cx, yF, yB) {
  const h = yB - yF, ym = (yF + yB) / 2;
  const peau = (x, y, r) => { const g = ctx.createRadialGradient(x - r * .3, y - r * .35, r * .1, x, y, r * 1.1);
    g.addColorStop(0, '#f8dcc8'); g.addColorStop(.6, '#eab497'); g.addColorStop(1, '#c98466'); return g; };
  ctx.save();
  // la poche de liquide amniotique, sombre comme à l'échographie, bord clair de la paroi de l'utérus
  ctx.beginPath(); ctx.ellipse(cx, ym, 80, h / 2 + 16, 0, 0, Math.PI * 2);
  const liq = ctx.createRadialGradient(cx, ym, 10, cx, ym, 90);
  liq.addColorStop(0, 'rgba(70,52,74,.92)'); liq.addColorStop(1, 'rgba(46,32,52,.95)');
  ctx.fillStyle = liq; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(214,150,140,.85)'; ctx.stroke();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const bord = '#a9624b';
  // le cordon ombilical, du ventre vers la paroi
  ctx.beginPath(); ctx.moveTo(cx + 8, yF + .78 * h);
  ctx.bezierCurveTo(cx + 30, yB + 6, cx + 52, yF + .62 * h, cx + 70, ym + 4);
  ctx.lineWidth = 5; ctx.strokeStyle = '#d9a3b6'; ctx.stroke(); ctx.lineWidth = 1.6; ctx.strokeStyle = '#b07a8e'; ctx.stroke();
  // les jambes repliées (cuisse puis jambe, pied)
  ctx.beginPath(); ctx.ellipse(cx + 38, yF + .76 * h, 22, 11, -.35, 0, Math.PI * 2);
  ctx.fillStyle = peau(cx + 38, yF + .76 * h, 22); ctx.fill(); ctx.lineWidth = 1.2; ctx.strokeStyle = bord; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(cx + 22, yF + .9 * h, 20, 8, .15, 0, Math.PI * 2);
  ctx.fillStyle = peau(cx + 22, yF + .9 * h, 20); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(cx + 4, yF + .9 * h, 7, 5, .3, 0, Math.PI * 2); ctx.fillStyle = '#e7ab8e'; ctx.fill(); ctx.stroke();
  // le corps, courbé (le dos en haut à droite)
  ctx.beginPath();
  ctx.moveTo(cx - 14, yF + .3 * h);
  ctx.bezierCurveTo(cx + 18, yF + .02 * h, cx + 62, yF + .22 * h, cx + 56, yF + .6 * h);
  ctx.bezierCurveTo(cx + 50, yF + .92 * h, cx + 6, yB - 2, cx - 12, yF + .74 * h);
  ctx.closePath(); ctx.fillStyle = peau(cx + 20, yF + .45 * h, 46); ctx.fill(); ctx.lineWidth = 1.3; ctx.strokeStyle = bord; ctx.stroke();
  // la tête, grosse, penchée vers la poitrine
  const rt = .37 * h, xt = cx - 30, yt = yF + rt + 1;
  ctx.beginPath(); ctx.arc(xt, yt, rt, 0, Math.PI * 2); ctx.fillStyle = peau(xt, yt, rt); ctx.fill(); ctx.stroke();
  // le visage : œil fermé, nez, bouche, oreille
  ctx.lineWidth = 1.4; ctx.strokeStyle = '#8f4f3c';
  ctx.beginPath(); ctx.arc(xt - rt * .42, yt + rt * .05, rt * .14, .2, Math.PI - .2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(xt - rt * .86, yt + rt * .18); ctx.quadraticCurveTo(xt - rt * 1.02, yt + rt * .32, xt - rt * .84, yt + rt * .38); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(xt - rt * .74, yt + rt * .58); ctx.lineTo(xt - rt * .58, yt + rt * .6); ctx.stroke();
  ctx.beginPath(); ctx.arc(xt + rt * .18, yt + rt * .1, rt * .17, -1.2, 1.9); ctx.stroke();
  // le bras replié devant la poitrine, la main près du visage
  ctx.beginPath(); ctx.moveTo(cx + 2, yF + .42 * h); ctx.quadraticCurveTo(cx + 10, yF + .66 * h, xt - rt * .25, yt + rt * .82);
  ctx.lineWidth = 9; ctx.strokeStyle = '#e3a78b'; ctx.stroke(); ctx.lineWidth = 1.1; ctx.strokeStyle = bord; ctx.stroke();
  ctx.beginPath(); ctx.arc(xt - rt * .25, yt + rt * .82, 5.5, 0, Math.PI * 2); ctx.fillStyle = '#eab497'; ctx.fill(); ctx.stroke();
  ctx.restore();
}
/** Oscilloscope : écran, voies tracées par le spot jusqu’au temps d’écran `t` (unité de `sens`). */
function oscillo(c, o) {
  c.direct(() => P.oscillo(c.ctx, o.x, o.y, o.nx * o.dx, o.ny * o.dy, o.nx, o.ny));
  const smax = o.nx * o.sens, tf = Math.min(Math.max(0, o.t), smax);
  c.direct(() => {
    for (const v of o.voies) {
      const y0 = o.y + v.ligne * o.dy;
      if (tf <= 0) continue;
      const N = 1200, pts = [];
      for (let i = 0; i <= N; i++) { const s = tf * i / N; pts.push([o.x + s / o.sens * o.dx, y0 - v.amp * salve(s, v.debut, v.duree, v.n || 8)]); }
      P.trace(c.ctx, pts, c.couleur(v.couleur), 1.6);
      if (tf < smax) {   // le spot, là où il écrit
        const ctx = c.ctx, x = o.x + tf / o.sens * o.dx, y = pts[pts.length - 1][1];
        ctx.save(); ctx.fillStyle = '#fff'; ctx.shadowColor = c.couleur(v.couleur); ctx.shadowBlur = 10; ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      }
    }
  });
}

/* ── Le moteur des étapes ─────────────────────────────────────────────────────────────────── */
const S = { a: 0, running: false, pause: false, fait: false, jusqua: null, motif: '', emis: 0 };
let VUE = null, PH = [], TOTAL = 1;
const ph = id => PH.find(p => p.id === id);
/** Part écoulée de l’étape `id` (0 avant, 1 après). */
const part = id => { const p = ph(id); return p ? Math.max(0, Math.min(1, (S.a - p.debut) / p.d)) : 0; };
/** L’étape `id` est atteinte (on est figé à sa fin ou après). */
const vu = id => part(id) >= 0.999;
/** Le temps physique de la vue (ms, µs ou s selon la vue), interpolé dans les étapes qui en portent un. */
function tPhys() {
  let dernier = null;
  for (const p of PH) {
    if (!p.t) continue;
    if (dernier === null) dernier = p.t[0];
    if (S.a < p.debut) return dernier;
    if (S.a <= p.debut + p.d) return p.t[0] + (p.t[1] - p.t[0]) * (S.a - p.debut) / p.d;
    dernier = p.t[1];
  }
  return dernier ?? 0;
}
/**
 * Compter en allumant (simulations-au-tableau règle 16, 19 novembre 2026) : la division k s’allume à la fin de l’étape
 * ids[k−1] — bande douce sur l’écran, trait jaune sous la grille, son numéro écrit proprement dessous — et reste allumée ;
 * le total s’écrit une seule fois à l’étape `total`. Un repère par division (`div_k`) et un pour le total.
 */
function compterDivisions(c, o, x0, ids, total, texteTotal) {
  const ybas = o.y + o.ny * o.dy;
  ids.forEach((id, k) => {
    if (!vu(id)) return;
    const x = x0 + k * o.dx, recente = !ids[k + 1] || !vu(ids[k + 1]);
    c.direct(() => {
      const ctx = c.ctx; ctx.save();
      ctx.fillStyle = recente && !vu(total) ? 'rgba(250,204,21,.24)' : 'rgba(250,204,21,.13)'; ctx.fillRect(x + 1, o.y + 1, o.dx - 2, o.ny * o.dy - 2);
      ctx.strokeStyle = c.couleur('jaune'); ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.shadowColor = 'rgba(250,204,21,.9)'; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.moveTo(x + 3, ybas + 9); ctx.lineTo(x + o.dx - 3, ybas + 9); ctx.stroke(); ctx.restore();
      c.texte(String(k + 1), x + o.dx / 2, ybas + 30, { couleur: 'jaune', align: 'center', taille: 18 });
    });
    c.repere(id, x, o.y, o.dx, o.ny * o.dy + 36, `la division ${k + 1}`);
  });
  if (vu(total)) {
    const xm = x0 + ids.length * o.dx / 2;
    c.direct(() => c.texte(texteTotal, xm, ybas + 56, { couleur: 'jaune', align: 'center', taille: 19 }));
    c.repere(total, x0, ybas + 4, ids.length * o.dx, 58, `le total : ${texteTotal}`);
  }
}
/** Ce que le comptage montre, pour le tuteur. */
function comptees() {
  const ids = PH.filter(p => /^div_\d+$/.test(p.id)).map(p => p.id), n = ids.filter(vu).length;
  return !n ? '' : vu('divisions') ? `Total écrit : ${ids.length} divisions.` : `Comptage en cours : ${n} division${n > 1 ? 's' : ''} allumée${n > 1 ? 's' : ''} (numérotées 1 à ${n}).`;
}
/*
 * Allumages (règle 17, contrat du lecteur : ligne de démonstration `allume`) : la commande `allume {target}` (un repère ou
 * une liste) fait paraître l’étape qui dessine ce repère si elle n’est pas encore jouée, puis l’entoure d’une lueur douce
 * qui reste jusqu’à `eteins`. Les rectangles des repères sont relevés à chaque dessin (coordonnées du dessin).
 */
const LUM = new Set(), RECTS = {};
const lum = id => LUM.has(id);
function lueurs(c) {
  c.direct(() => {
    const ctx = c.ctx;
    for (const id of LUM) {
      const r = RECTS[id]; if (!r) continue;
      const [x, y, w, h] = r;
      ctx.save(); ctx.shadowColor = 'rgba(250,204,21,.95)'; ctx.shadowBlur = 16; ctx.strokeStyle = 'rgba(250,204,21,.9)'; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.roundRect(x - 5, y - 4, w + 10, h + 8, 8); ctx.stroke();
      ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(250,204,21,.07)'; ctx.fill(); ctx.restore();
    }
  });
}
/** `&calculs=0` : la page n’écrit pas ses lignes de calcul (la démonstration est écrite par le lecteur à côté de la figure). */
const CALCULS = new URLSearchParams(location.search).get('calculs') !== '0';
/** Les lignes de calcul : chaque ligne paraît à la fin de son étape ; on garde les `max` dernières.
 *  La simulation d'abord (18 novembre 2026) : l'interligne suit la taille RÉELLEMENT écrite (jamais sous 15 px à
 *  l'écran, donc plus grande dans le dessin sur un téléphone) et la hauteur des fractions ; une ligne trop large pour
 *  le cadre est coupée avant un « = » et sa suite écrite en retrait sur la ligne suivante : rien ne se chevauche. */
function calculs(c, x, y, lignes, o = {}) {
  if (!CALCULS) return;
  const vues = lignes.filter(l => vu(l.id)).slice(-(o.max || 6));
  let yy = y;
  c.direct(() => {
    const larg = Math.max(160, (c.cadre ? c.cadre.w : 760) - x - 6), bas = (c.cadre ? c.cadre.h : 420) - 4;
    // les morceaux à écrire (une ligne trop large est coupée avant un « = », la suite en retrait), avec leur hauteur
    const morceaux = [];
    const ajouter = (txt, xx, l) => {
      const t = l.taille || o.taille || 19, E = window.OndesTableau.etages(c, t, txt), frac = txt.includes('⟦');
      morceaux.push({ txt, xx, l, t, avant: frac ? E.haut : 0, apres: Math.max(frac ? 40 : 32, 1.2 * E.T + (frac ? E.bas : 0)) });
    };
    for (const l of vues) {
      const txt = String(l.texte), t = l.taille || o.taille || 19, T = window.OndesTableau.etages(c, t).T;
      let coupe = -1;
      if (c.largeurTexte(txt, T) > larg) for (let i = txt.indexOf(' = ', 1); i > 0; i = txt.indexOf(' = ', i + 1)) if (c.largeurTexte(txt.slice(0, i), T) <= larg) coupe = i;
      if (coupe < 0) ajouter(txt, x, l); else { ajouter(txt.slice(0, coupe), x, l); ajouter(txt.slice(coupe + 1), x + 16, l); }
    }
    // sur un petit cadre, les plus anciennes lignes s'effacent : les dernières (celles qu'on dit) restent entières
    const haut = m => m.reduce((h, k, i) => h + (i ? k.avant : 0) + k.apres, 0);
    while (morceaux.length > 1 && y + haut(morceaux) - morceaux[morceaux.length - 1].apres + 8 > bas) morceaux.shift();
    morceaux.forEach((k, i) => { if (i) yy += k.avant; c.texte(k.txt, k.xx, yy, { couleur: k.l.couleur || 'vert', taille: k.t }); yy += k.apres; });
  });
  if (vues.length) c.repere('calcul', x - 8, y - 26, o.largeur || 230, Math.max(40, yy - y + 6), 'le calcul');
}

/* ══ Les vues ═══════════════════════════════════════════════════════════════════════════════ */
const VUES = {};

/* ── National 2022, session normale : E et R à L = 85 cm, signal (a) émis et (b) reçu, 0,5 ms/div ── */
VUES.national_2022_normale = {
  titre: 'National 2022 normale : célérité du son dans l’air',
  phases: [
    { id: 'signal_emis', d: 1.4, t: [0, 0.95], motif: 'E émet : le signal (a) apparaît sur l’écran' },
    { id: 'son_arrive', d: 3.2, t: [0.95, 3.0], motif: 'le front sonore arrive au récepteur R' },
    { id: 'signal_recu', d: 1.2, t: [3.0, 3.45], motif: 'le signal (b) reçu apparaît, plus tard' },
    { id: 'ecran_complet', d: 1.4, t: [3.45, 5.0], motif: 'le spot a balayé tout l’écran' },
    { id: 'debuts', d: 1, motif: 'le début de chaque signal est marqué' },
    { id: 'div_1', d: 0.5, motif: 'on compte : la 1ʳᵉ division s’allume' },
    { id: 'div_2', d: 0.5, motif: 'on compte : la 2ᵉ division s’allume' },
    { id: 'div_3', d: 0.5, motif: 'on compte : la 3ᵉ division s’allume' },
    { id: 'div_4', d: 0.5, motif: 'on compte : la 4ᵉ division s’allume' },
    { id: 'div_5', d: 0.5, motif: 'on compte : la 5ᵉ division s’allume' },
    { id: 'divisions', d: 0.6, motif: 'le total : 5 divisions entre les deux débuts' },
    { id: 'retard', d: 1, motif: 'Δt = divisions × sensibilité' },
    { id: 'celerite', d: 1, motif: 'v = L/Δt' },
  ],
  dessin(c) {
    const PX = 440, xE = 110, xR = xE + 0.85 * PX, yM = 74, t = tPhys();
    c.texte('E (émetteur)', xE - 10, yM - 34, { couleur: 'cyan', align: 'center', taille: 18 });
    c.direct(() => peindreHP(c.ctx, xE, yM, 1));
    c.texte('R (récepteur)', xR, yM - 34, { couleur: 'orange', align: 'center', taille: 18 });
    c.direct(() => P.micro(c.ctx, xR, yM - 4, c.couleur('orange'), 1.1));
    c.cote(xE, yM + 40, xR, yM + 40, 'L = 85 cm', { couleur: 'jaune', dessous: true, taille: 19 });
    c.repere('montage', xE - 40, yM - 54, xR - xE + 90, 140, 'le montage : E et R à L = 85 cm');
    c.direct(() => { if (t > 0.5 && t < 3.25) P.front(c.ctx, xE + 16, yM, (t - 0.5) / 1000 * 340 * PX, -0.55, 0.55, '250,204,21', 1); });
    const o = { x: 70, y: 196, nx: 10, ny: 6, dx: 44, dy: 30, sens: 0.5, t,
      voies: [{ ligne: 1.6, debut: 0.5, duree: 0.4, amp: 20, couleur: 'cyan' }, { ligne: 3.6, debut: 3.0, duree: 0.4, amp: 20, couleur: 'orange' }] };
    c.texte('Écran : 0,5 ms/div', o.x, o.y - 18, { couleur: 'cyan', taille: 19 });
    c.repere('sensibilite', o.x - 4, o.y - 40, 190, 30, 'la sensibilité horizontale : 0,5 ms/div');
    oscillo(c, o);
    c.repere('oscillogramme', o.x, o.y, o.nx * o.dx, o.ny * o.dy, 'l’oscillogramme');
    const xa = o.x + 1 * o.dx, xb = o.x + 6 * o.dx, ybas = o.y + o.ny * o.dy;
    c.direct(() => {
      if (t > 0.5) c.texte('(a) émis', xa + 4, o.y + 1.6 * o.dy - 28, { couleur: 'cyan', taille: 17 });
      if (t > 3.0) c.texte('(b) reçu', xb + 4, o.y + 3.6 * o.dy - 28, { couleur: 'orange', taille: 17 });
      if (vu('debuts')) {
        c.ligne(xa, o.y + 1.6 * o.dy, xa, ybas + 8, { couleur: 'jaune', largeur: 1.5, pointille: [4, 4] });
        c.ligne(xb, o.y + 3.6 * o.dy, xb, ybas + 8, { couleur: 'jaune', largeur: 1.5, pointille: [4, 4] });
      }
    });

      { id: 'relation', texte: 'τ = L·(⟦1|V_air⟧ − ⟦1|V_p⟧)' },
      { id: 'celerite', texte: 'V_p = ⟦L·V_air|L − τ·V_air⟧' }, { id: 'celerite', texte: 'V_p ≈ 1303 m/s', couleur: 'jaune' },
    ], { taille: 18, max: 3, largeur: 225 });
  },
  vu() {
    const t = tPhys(), m = ['Cuve : air en haut (E₁ → R₁, voie A), pétrole en bas (E₂ → R₂, voie B), même distance L = 1,84 m ; écran à 2 ms/div.'];
    m.push(t < SE18 ? 'Le spot balaie ; rien n’est encore émis.' : t < 6 ? 'E₁ et E₂ ont émis ensemble ; les deux fronts avancent, celui du pétrole plus vite.'
      : t < 10 ? 'Le pétrole a déjà livré son onde à R₂ (voie B à 3 div) ; celle de l’air avance encore.' : 'Voie B commence à 3 div, voie A à 5 div.');
    if (vu('debuts')) m.push('Débuts marqués.');
    m.push(comptees());
    if (vu('divisions')) m.push('Divisions comptées une à une, allumées et numérotées 1 et 2 : 2 divisions.');
    if (vu('retard')) m.push('Écrit : τ = 2 × 2 ms = 4 ms.');
    if (vu('relation')) m.push('Écrit : τ = L·(1/V_air − 1/V_p).');
    if (vu('celerite')) m.push('Écrit : V_p ≈ 1303 m/s.');
    return m.join(' ');
  },
};

/* ── National 2022, rattrapage : S vibre à t = 0, M à L = 2,5 cm ; la courbe y_M(t) est nulle jusqu’à τ = 10 ms ──
 * 2ᵉ passe (18 novembre 2026) : cas type « retard lu sur y_M(t) ». La surface de l’eau vue de côté (la ride part de S
 * et atteint M) et la courbe y_M(t) tracée EN MÊME TEMPS ; la date où M démarre, τ et v ne s’écrivent qu’à leurs
 * étapes (debut_m, retard, celerite), jouées après la réponse de l’élève. Valeurs du sujet : y_M en mm (amplitude
 * 6 mm), t en ms, M démarre à 10 ms, v = L/τ = 2,5 m/s (2,5 mm par ms). */
const L22 = 25, V22 = 2.5, T0_22 = 10, A22 = 6, P22 = 20;   // mm, mm/ms, ms, mm, ms (la forme du sujet)
const yS22 = t => (t <= 0 ? 0 : A22 * Math.sin(2 * Math.PI * t / P22));   // le mouvement de S (mm), t en ms
VUES.national_2022_rattrapage = {
  titre: 'National 2022 rattrapage : lire le retard sur la courbe de M',
  phases: [
    { id: 'source_part', d: 1.4, t: [0, 1.5], motif: 'à t = 0, S commence à vibrer ; M est encore au repos' },
    { id: 'front_avance', d: 3, t: [1.5, 6], motif: 'le front avance de S vers M ; la courbe y_M reste sur l’axe' },
    { id: 'm_atteint', d: 1.6, t: [6, 10], motif: 'le front atteint M : M commence à bouger' },
    { id: 'courbe_complete', d: 5, t: [10, 50], motif: 'M refait le mouvement de S : sa courbe est tracée' },
    { id: 'debut_m', d: 1, motif: 'la date où M commence à bouger est marquée' },
    { id: 'retard', d: 1, motif: 'S part à t = 0, donc τ = 10 ms = 0,01 s' },
    { id: 'celerite', d: 1.2, motif: 'v = L/τ' },
  ],
  dessin(c) {
    const t = tPhys(), wx0 = 70, k = 10, wy = 92, ka = 2.4, xM = wx0 + L22 * k, wlarg = 420;   // px par mm (côté), px par mm d’élongation
    const yAt = x => { const tt = t - x / V22; return tt > 0 ? yS22(tt) : 0; };   // élongation (mm) du point d’abscisse x (mm)
    // ── La surface de l’eau vue de côté (peinte), S à gauche, M à L = 2,5 cm
    c.texte('Vue de côté', wx0 + 24, 30, { couleur: 'cyan', taille: 18 });
    c.direct(() => {
      const ctx = c.ctx, N = 160, bas = wy + 46;
      ctx.save(); ctx.beginPath(); ctx.moveTo(wx0, bas);
      for (let i = 0; i <= N; i++) { const x = wlarg / k * i / N; ctx.lineTo(wx0 + x * k, wy - ka * yAt(x)); }
      ctx.lineTo(wx0 + wlarg, bas); ctx.closePath();
      const g = ctx.createLinearGradient(0, wy - 16, 0, bas);
      g.addColorStop(0, 'rgba(110,225,245,.92)'); g.addColorStop(.35, 'rgba(28,150,195,.92)'); g.addColorStop(1, 'rgba(8,58,96,.96)');
      ctx.fillStyle = g; ctx.fill();
      ctx.beginPath();
      for (let i = 0; i <= N; i++) { const x = wlarg / k * i / N, px = wx0 + x * k, py = wy - ka * yAt(x); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
      ctx.strokeStyle = 'rgba(225,250,255,.95)'; ctx.lineWidth = 2.4; ctx.shadowColor = 'rgba(160,235,255,.8)'; ctx.shadowBlur = 6; ctx.stroke();
      ctx.restore();
      // la pointe du vibreur en S (elle monte et descend avec la surface)
      const yS = wy - ka * yS22(t);
      ctx.save(); ctx.fillStyle = P.lin(ctx, wx0 - 4, 0, wx0 + 4, 0, [[0, '#4b5563'], [.5, '#d1d5db'], [1, '#374151']]);
      P.rr(ctx, wx0 - 4, yS - 46, 8, 46, 2); ctx.fill(); ctx.restore();
      P.perle(ctx, xM, wy - ka * yAt(L22) - 6, 6, 'orange');   // le point M, posé sur la surface
    });
    c.texte('S', wx0 - 14, wy - 50, { couleur: 'blanc', align: 'right', taille: 19 });
    c.texte('M', xM, wy - 34, { couleur: 'orange', align: 'center', taille: 19 });
    c.cote(wx0, wy + 62, xM, wy + 62, 'L = 2,5 cm', { couleur: 'jaune', dessous: true, taille: 18 });
    c.repere('cuve', wx0, wy - 40, wlarg, 90, 'la surface de l’eau, vue de côté');
    c.repere('source', wx0 - 20, wy - 56, 40, 70, 'la source S (la pointe du vibreur)');
    c.repere('point_m', xM - 18, wy - 50, 36, 64, 'le point M, à L = 2,5 cm de S');
    c.direct(() => {   // le front : là où la ride est arrivée
      const xf = Math.min(wlarg / k, V22 * t);
      if (t > 0 && xf < wlarg / k) c.fleche(wx0 + xf * k, wy + 30, wx0 + xf * k, wy + 8, { couleur: 'vert', largeur: 1.6 });
    });
    // ── Le graphe y_M(t) du sujet, tracé en même temps que la ride avance
    const gx = 70, gy = 300, kx = 8, ky = 11, X = tt => gx + tt * kx, Y = y => gy - y * ky, tmax = 50;
    c.direct(() => {
      const ctx = c.ctx; ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.13)'; ctx.lineWidth = 1;
      for (let tt = 5; tt <= tmax; tt += 5) { ctx.beginPath(); ctx.moveTo(X(tt), Y(6.6)); ctx.lineTo(X(tt), Y(-6.6)); ctx.stroke(); }
      for (const y of [-6, -3, 3, 6]) { ctx.beginPath(); ctx.moveTo(X(0), Y(y)); ctx.lineTo(X(tmax), Y(y)); ctx.stroke(); }
      ctx.restore();
    });
    c.fleche(X(0), gy, X(tmax) + 22, gy, { couleur: 'faible', largeur: 1.4 });
    c.fleche(X(0), Y(-7), X(0), Y(7.6), { couleur: 'faible', largeur: 1.4 });
    c.texte('y_M (mm)', X(0) + 8, Y(7.6) + 4, { couleur: 'jaune', taille: 17 });
    c.texte('t (ms)', X(tmax) + 22, gy - 10, { couleur: 'jaune', align: 'right', taille: 17 });
    for (const tt of [25, 35, 45]) c.texte(String(tt), X(tt), gy + 20, { couleur: 'blanc', align: 'center', taille: 16 });
    for (const y of [6, 3, -3, -6]) c.texte(String(y), X(0) - 8, Y(y) + 6, { couleur: 'blanc', align: 'right', taille: 16 });
    c.texte('0', X(0) - 8, gy + 6, { couleur: 'blanc', align: 'right', taille: 16 });
    c.repere('graphe', X(0) - 30, Y(7.6) - 16, tmax * kx + 60, 15.4 * ky + 30, 'la courbe y_M(t) du point M');
    c.direct(() => {
      const tf = Math.min(Math.max(0, t), tmax);
      if (tf <= 0) return;
      const pts = []; for (let i = 0; i <= 500; i++) { const tt = tf * i / 500; pts.push([X(tt), Y(yS22(tt - T0_22))]); }
      P.trace(c.ctx, pts, c.couleur('orange'), 2.2);
      if (tf < tmax) { const ctx = c.ctx, [x, y] = pts[pts.length - 1]; ctx.save(); ctx.fillStyle = '#fff'; ctx.shadowColor = c.couleur('orange'); ctx.shadowBlur = 10; ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
      if (vu('debut_m')) {
        c.ligne(X(T0_22), Y(-6.6), X(T0_22), gy + 4, { couleur: 'jaune', largeur: 1.6, pointille: [4, 4] });
        c.texte('10', X(T0_22), gy + 20, { couleur: 'jaune', align: 'center', taille: 17 });
        c.texte('M démarre', X(T0_22) - 6, Y(-4.6), { couleur: 'jaune', align: 'right', taille: 16 });
      } else c.texte('10', X(T0_22), gy + 20, { couleur: 'blanc', align: 'center', taille: 16 });
    });
    if (vu('debut_m')) c.repere('debut_m', X(T0_22) - 14, Y(1.5), 28, 3 * ky + 22, 'la date où M commence à bouger : t = 10 ms');
    calculs(c, 520, 64, [
      { id: 'retard', texte: 'S part à t = 0 :' }, { id: 'retard', texte: 'τ = 10 ms = 0,01 s' },
      { id: 'celerite', texte: 'v = ⟦L|τ⟧' }, { id: 'celerite', texte: 'v = ⟦2,5 × 10⁻²|0,01⟧' }, { id: 'celerite', texte: 'v = 2,5 m/s', couleur: 'jaune' },
    ], { taille: 19, max: 5, largeur: 220 });
  },
  vu() {
    const t = tPhys(), m = ['Vue de côté : S vibre, M est à L = 2,5 cm. En bas, la courbe y_M(t) du sujet (y en mm, t en ms).'];
    m.push(t <= 0 ? 'Rien ne bouge encore.' : t < T0_22 ? `La ride s’éloigne de S (front à ${fr(V22 * t, 1)} mm) ; M est au repos : la courbe y_M reste sur l’axe.`
      : t < 50 ? 'M bouge : il refait le mouvement de S ; la courbe y_M(t) monte et descend, le spot la trace.' : 'La courbe y_M(t) est tracée jusqu’à 50 ms : nulle au début, puis M oscille.');
    if (vu('debut_m')) m.push('Marqué en jaune : M commence à bouger à t = 10 ms.');
    if (vu('retard')) m.push('Écrit : S part à t = 0, donc τ = 10 ms = 0,01 s.');
    if (vu('celerite')) m.push('Écrit : v = L/τ = 2,5 × 10⁻²/0,01 = 2,5 m/s.');
    return m.join(' ');
  },
};

/* ── Choix de la vue, boucle et pont avec le tuteur ───────────────────────────────────────── */
const VUE_ID = (new URLSearchParams(location.search).get('vue') || '').trim() in VUES ? new URLSearchParams(location.search).get('vue').trim() : 'national_2022_normale';
VUE = VUES[VUE_ID]; PH = VUE.phases;
{ let acc = 0; for (const p of PH) { p.debut = acc; acc += p.d; } TOTAL = acc; }
const QS = new URLSearchParams(location.search);
const finEtape = id => { const p = ph(String(id || '').trim()); return p ? p.debut + p.d : null; };
let LIMITE = finEtape(QS.get('arret'));          // null : aucune limite
const A0 = finEtape(QS.get('depart')) ?? 0;      // 0 : la page s’ouvre au début
const borner = () => { if (LIMITE != null && S.jusqua == null && LIMITE < TOTAL - 1e-6) S.jusqua = LIMITE; };

function dessiner(c) {
  scene.cadre(11);
  for (const k in RECTS) delete RECTS[k];
  if (!c.__releve) { const r0 = c.repere; c.repere = function (id, x, y, w, h, l) { RECTS[id] = [x, y, w, h]; return r0.call(this, id, x, y, w, h, l); }; c.__releve = true; }
  VUE.dessin(c); lueurs(c); return c.fin();
}
const canvas = $('canvas');
const scene = window.OndesTableau.Scene(canvas, dessiner, { ajuster: true, complet: fn => { const a = S.a, f = S.fait; S.a = TOTAL; S.fait = true; try { fn(); } finally { S.a = a; S.fait = f; } } });

function moments() { const m = {}; for (const p of PH) m[p.id] = +((p.debut + p.d) / TOTAL).toFixed(4); return m; }
const MOTIFS = Object.fromEntries(PH.map(p => [p.id, p.motif]));
scene.avancer = dt => {
  if (!S.running) return false;
  S.a = Math.min(TOTAL, S.a + dt);
  if (S.jusqua != null && S.a >= S.jusqua - 1e-6) {
    S.a = S.jusqua; S.jusqua = null; S.running = false; S.pause = true; $('run').textContent = 'Reprendre';
    bulle($('feedback'), 'Arrêt sur image : ' + (S.motif || 'instant choisi') + '.'); pont.noter('pause'); pont.emettre();
    return true;
  }
  if (S.a >= TOTAL) {
    S.running = false; S.pause = false; S.fait = true; $('run').textContent = 'Rejouer';
    bulle($('feedback'), 'Tout est écrit : relis chaque étape au tableau.', 'good'); pont.emettre();
  } else if (performance.now() - S.emis > 500) { S.emis = performance.now(); pont.emettre(); }
  return true;
};
function start() { S.jusqua = null; S.a = 0; borner(); S.running = true; S.pause = false; S.fait = false; $('run').textContent = 'Pause'; bulle($('feedback'), PH[0].motif + '…'); pont.noter('start'); pont.emettre(); }
function pause() { if (!S.running) return; S.jusqua = null; S.running = false; S.pause = true; $('run').textContent = 'Reprendre'; bulle($('feedback'), 'Arrêt sur image.'); pont.noter('pause'); pont.emettre(); }
function resume() {
  if (S.running) return; if (!S.pause) return start();
  if (LIMITE != null && S.a >= LIMITE - 1e-6) { bulle($('feedback'), 'La suite s’écrit après ta réponse.'); return; }
  borner(); S.running = true; S.pause = false; $('run').textContent = 'Pause'; pont.noter('resume'); pont.emettre(); }
function reset() { LUM.clear(); S.a = A0; S.running = false; S.pause = A0 > 0; S.fait = false; S.jusqua = null; $('run').textContent = A0 > 0 ? 'Reprendre' : 'Lancer'; scene.sale = true; bulle($('feedback'), A0 > 0 ? 'Arrêt sur image : ' + MOTIFS[QS.get('depart').trim()] + '.' : 'Lance l’exercice.'); pont.noter('reset'); pont.emettre(); }
/** Joue (ou continue) jusqu’à la fin d’une étape, puis se fige. Une étape déjà passée : on revient à elle, figé. */
function playUntil(p) {
  const M = moments(), nom = p.moment in M ? p.moment : null, cible = nom ? M[nom] * TOTAL : +p.progress * TOTAL;
  if (!Number.isFinite(cible)) return;
  S.motif = nom ? MOTIFS[nom] : '';
  if (cible < S.a - 1e-6) { S.a = cible; S.running = false; S.pause = true; S.fait = false; S.jusqua = null; scene.sale = true; $('run').textContent = 'Reprendre'; bulle($('feedback'), 'Arrêt sur image : ' + (S.motif || 'instant choisi') + '.'); pont.noter('play_until', { moment: nom }); pont.emettre(); return; }
  if (LIMITE != null && cible > LIMITE + 1e-6) LIMITE = null;   // le tuteur va plus loin : la limite tombe
  if (cible >= TOTAL - 1e-6) { S.jusqua = null; } else S.jusqua = cible;
  if (S.fait) { S.a = 0; S.fait = false; }
  S.running = true; S.pause = false; $('run').textContent = 'Pause';
  pont.noter('play_until', { moment: nom }); pont.emettre();
}
/** `allume {target}` : l’étape qui dessine le repère est jouée d’un coup si elle ne l’est pas encore, puis il s’allume. */
function allumer(p) {
  const ids = [].concat(p.targets || p.target || p.cible || p.repere || p.id || []).map(String).filter(Boolean);
  for (const id of ids) {
    const etape = (VUE.etapeDe && VUE.etapeDe[id]) || (ph(id) ? id : null);
    if (etape && !vu(etape)) {
      const fin = finEtape(etape);
      if (LIMITE != null && fin > LIMITE + 1e-6) LIMITE = null;
      S.a = fin; S.running = false; S.pause = true; S.fait = false; S.jusqua = null; $('run').textContent = 'Reprendre';
      bulle($('feedback'), 'Arrêt sur image : ' + MOTIFS[etape] + '.');
    }
    LUM.add(id);
  }
  scene.sale = true; pont.noter('allume', { target: ids }); pont.emettre();
}
function eteindre(p) {
  const ids = [].concat(p.targets || p.target || p.cible || p.repere || []).map(String).filter(Boolean);
  if (ids.length) ids.forEach(id => LUM.delete(id)); else LUM.clear();
  scene.sale = true; pont.noter('eteins', { target: ids }); pont.emettre();
}
$('run').onclick = () => (S.running ? pause() : S.pause ? resume() : start());

function etat() {
  return { simulation_status: S.running ? 'running' : S.pause ? 'paused' : (S.fait ? 'finished' : 'idle'), vue: VUE_ID, progress: +(S.a / TOTAL).toFixed(4),
    moments: moments(), etape: (PH.find(p => S.a < p.debut + p.d - 1e-6) || PH[PH.length - 1]).id, allumes: [...LUM],
    ce_qui_se_voit: lisible(VUE.vu()) + (LUM.size ? ` Allumé sur la figure : ${[...LUM].join(', ')}.` : '') };
}
window.Tableau.explication({ [VUE_ID]: PH.map(p => ({ texte: p.motif })) });
const commandes = ['start', 'pause', 'resume', 'reset', 'play_until', 'allume', 'eteins'];
const config = { id: 'ondes_tableau_national', version: '1.0', title: 'Exercices du national joués au tableau', variants: Object.keys(VUES).map(id => ({ id, label: VUES[id].titre })), commands: commandes,
  command_schema: { play_until: { moment: PH.map(p => p.id).join(' | ') + ' (joue et se fige à la fin de cette étape)' },
    allume: { target: 'un repère ou une liste (l’étape qui le dessine est jouée, il reste allumé)' }, eteins: { target: 'un repère, ou rien pour tout éteindre' } } };
const pont = protocole({ id: config.id, commandes, config,
  texte: `${VUE.titre}. Étapes : ${PH.map(p => p.motif).join(' ; ')}.`,
  etat, progression: () => S.a / TOTAL,
  executer: (cmd, p) => ({ start, pause, resume, reset, play_until: () => playUntil(p), allume: () => allumer(p), eteins: () => eteindre(p) })[cmd]?.() });
if (A0 > 0) { S.a = A0; S.pause = true; $('run').textContent = 'Reprendre'; scene.sale = true; bulle($('feedback'), 'Arrêt sur image : ' + MOTIFS[QS.get('depart').trim()] + '.'); pont.emettre(); }
else bulle($('feedback'), 'Lance l’exercice, ou laisse le professeur le jouer étape par étape.');
</script>
