<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La course du son — au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="ondes.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Course du son dans l'acier, l'eau et l'air, dessinée à la craie"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start pause resume play_until">Frapper</button>
    <span id="reglage" data-professor-control="set_parameters"></span>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="commun.js"></script>
<script>
/*
 * La course du son (14 novembre 2026) : une même frappe, au même instant, envoie le son sur 1 km
 * d'acier, d'eau et d'air. L'acier arrive le premier, l'air le dernier : la célérité dépend du milieu.
 * Quatrième piste : l'air frappé plus fort, qui arrive en même temps que l'air : l'amplitude ne change pas v.
 * Curseur de température de l'air : v ≈ 331·√(T / 273) m/s, l'air chaud transmet le son plus vite.
 * Remplace le tableau « milieu / célérité » de la diapo wx_c2_facteurs. Un seul bouton (Frapper).
 */
const { fr, bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);
const D = 1000;                       // m
const RALENTI = 2.5;                  // l'image va 2,5 fois moins vite que le vrai son
const X0 = 170, X1 = 640;
const S0 = { theta: 20 };
const vAir = () => Math.round(331.3 * Math.sqrt(1 + S0.theta / 273.15));
const PISTES = [
  { id: 'acier', nom: 'Acier', v: 5000, y: 100, couleur: 'cyan', fort: false },
  { id: 'eau', nom: 'Eau', v: 1500, y: 185, couleur: 'bleu', fort: false },
  { id: 'air', nom: 'Air', v: 340, y: 270, couleur: 'jaune', fort: false },
  { id: 'air_fort', nom: 'Air, frappé', nom2: 'plus fort', v: 340, y: 355, couleur: 'orange', fort: true },
];
const vit = p => (p.id.startsWith('air') ? vAir() : p.v);
const arrivee = p => D / vit(p);         // s
const tfin = () => arrivee(PISTES[2]) + 0.15;
const S = { t: 0, running: false, pause: false, fait: false, jusqua: null, motif: '', emis: 0 };

/* ── Peinture des objets réels (canvas brut, AVANT la craie ; règle 32) ─── */
function lin(ctx, x0, y0, x1, y1, arrets) { const g = ctx.createLinearGradient(x0, y0, x1, y1); arrets.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function ombre(ctx, flou = 6, dx = 2, dy = 3) { ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = flou; ctx.shadowOffsetX = dx; ctx.shadowOffsetY = dy; }
// Barreau d'acier brossé : dégradé métallique, reflet, fines stries de brossage.
function peindreAcier(ctx, x0, x1, y) {
  const h = 16, yh = y - h / 2;
  ctx.save(); ombre(ctx);
  ctx.fillStyle = lin(ctx, 0, yh, 0, yh + h, [[0, '#59626c'], [.25, '#c9d0d7'], [.45, '#eef1f4'], [.7, '#8d969f'], [1, '#3f464e']]);
  ctx.beginPath(); ctx.roundRect(x0, yh, x1 - x0, h, 2); ctx.fill(); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.rect(x0, yh, x1 - x0, h); ctx.clip(); ctx.lineWidth = .6;
  for (let i = 0; i < 14; i++) {
    const yy = yh + 1.5 + i * (h - 3) / 13;
    ctx.strokeStyle = i % 2 ? 'rgba(255,255,255,.10)' : 'rgba(30,35,40,.10)';
    ctx.beginPath(); ctx.moveTo(x0, yy); ctx.lineTo(x1, yy + ((i * 37) % 5 - 2) * .2); ctx.stroke();
  }
  ctx.restore();
}
// Eau dans une auge de verre : bleu translucide, surface claire ondulée, fond plus sombre.
function peindreEau(ctx, x0, x1, y) {
  const yb = y + 13, surf = u => y - 9 + 1.6 * Math.sin(u * 46);
  const surface = () => { for (let i = 0; i <= 90; i++) { const u = i / 90; i ? ctx.lineTo(x0 + u * (x1 - x0), surf(u)) : ctx.moveTo(x0, surf(0)); } };
  ctx.beginPath(); surface(); ctx.lineTo(x1, yb); ctx.lineTo(x0, yb); ctx.closePath();
  ctx.fillStyle = lin(ctx, 0, y - 10, 0, yb, [[0, 'rgba(120,200,255,.55)'], [.5, 'rgba(40,130,220,.55)'], [1, 'rgba(14,60,140,.7)']]); ctx.fill();
  ctx.strokeStyle = 'rgba(220,245,255,.85)'; ctx.lineWidth = 1.4; ctx.beginPath(); surface(); ctx.stroke();
  // Parois de l'auge (verre).
  ctx.strokeStyle = 'rgba(200,230,240,.45)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x0 - 2, y - 14); ctx.lineTo(x0 - 2, yb + 2); ctx.lineTo(x1 + 2, yb + 2); ctx.lineTo(x1 + 2, y - 14); ctx.stroke();
}
// Air : une bande d'air léger, bleuté, avec quelques molécules éparses.
function peindreAir(ctx, x0, x1, y, graine) {
  ctx.fillStyle = lin(ctx, 0, y - 13, 0, y + 13, [[0, 'rgba(170,215,255,0)'], [.5, 'rgba(170,215,255,.14)'], [1, 'rgba(170,215,255,0)']]);
  ctx.fillRect(x0, y - 13, x1 - x0, 26);
  ctx.fillStyle = 'rgba(200,230,255,.35)';
  for (let i = 0; i < 40; i++) {
    const u = (i * 0.6180339 + graine) % 1, v = (i * 0.381966 * 7 + graine * 3) % 1;
    ctx.beginPath(); ctx.arc(x0 + u * (x1 - x0), y - 10 + v * 20, 1.1, 0, Math.PI * 2); ctx.fill();
  }
}
// Marteau : manche en bois veiné, tête en acier ; la face de frappe touche le bout du milieu.
function peindreMarteau(ctx, xFace, y, k) {
  const L = 24 * k, H = 11 * k, xh = xFace - L, cx = xh + L * 0.45;
  const bx = cx - 16 * k, by = y - 30 * k, ang = Math.atan2(by - y, bx - cx), lg = Math.hypot(bx - cx, by - y), e = 3.2 * k;
  ctx.save(); ctx.translate(cx, y); ctx.rotate(ang); ombre(ctx, 5, 2, 2);
  ctx.fillStyle = lin(ctx, 0, -e, 0, e, [[0, '#6b3e1c'], [.4, '#c8894a'], [.6, '#b0733b'], [1, '#5a3216']]);
  ctx.beginPath(); ctx.roundRect(0, -e, lg + 2 * k, 2 * e, e * .9); ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.strokeStyle = 'rgba(70,35,10,.35)'; ctx.lineWidth = .6;
  for (const d of [-1.4, .3, 1.6]) { ctx.beginPath(); ctx.moveTo(4, d * k); ctx.quadraticCurveTo(lg / 2, d * k + 1, lg, d * k - .5); ctx.stroke(); }
  ctx.restore();
  ctx.save(); ombre(ctx, 6, 2, 3);
  ctx.fillStyle = lin(ctx, 0, y - H / 2, 0, y + H / 2, [[0, '#7c858e'], [.3, '#e6eaee'], [.55, '#a9b1b9'], [1, '#3e454c']]);
  ctx.beginPath(); ctx.roundRect(xh, y - H / 2, L, H, 2 * k); ctx.fill(); ctx.restore();
  ctx.fillStyle = lin(ctx, xFace - 4 * k, 0, xFace, 0, [[0, 'rgba(0,0,0,0)'], [1, 'rgba(255,255,255,.35)']]); ctx.fillRect(xFace - 4 * k, y - H / 2, 4 * k, H);
}
// Oreille : pavillon couleur peau, ourlet et conque plus sombres ; tournée vers la gauche, d'où vient le son.
function peindreOreille(ctx, x, y) {
  ctx.save(); ombre(ctx, 5, 2, 2);
  ctx.fillStyle = lin(ctx, x, 0, x + 20, 0, [[0, '#f1c7a3'], [.6, '#e0a982'], [1, '#b97c58']]);
  ctx.beginPath(); ctx.moveTo(x + 2, y - 13);
  ctx.bezierCurveTo(x + 12, y - 19, x + 22, y - 12, x + 19, y - 2);
  ctx.bezierCurveTo(x + 17, y + 6, x + 11, y + 7, x + 11, y + 13);
  ctx.bezierCurveTo(x + 10, y + 19, x + 2, y + 19, x + 1, y + 12);
  ctx.bezierCurveTo(x + 4, y + 6, x - 1, y - 4, x + 2, y - 13); ctx.closePath(); ctx.fill(); ctx.restore();
  ctx.strokeStyle = 'rgba(140,75,50,.75)'; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x + 5, y - 10); ctx.bezierCurveTo(x + 13, y - 14, x + 18, y - 7, x + 15, y - 1); ctx.stroke();
  ctx.fillStyle = 'rgba(120,60,40,.6)'; ctx.beginPath(); ctx.ellipse(x + 8, y + 2, 3.2, 4.6, 0, 0, Math.PI * 2); ctx.fill();
}
function peindrePistes(ctx) {
  for (const p of PISTES) {
    if (p.id === 'acier') peindreAcier(ctx, X0, X1, p.y);
    else if (p.id === 'eau') peindreEau(ctx, X0, X1, p.y);
    else peindreAir(ctx, X0, X1, p.y, p.fort ? .37 : .11);
    peindreMarteau(ctx, X0 - 3, p.y, p.fort ? 1.5 : 1);
    peindreOreille(ctx, X1 + 10, p.y);
  }
}

function dessiner(c) {
  scene.cadre(11);
  c.direct(() => peindrePistes(c.ctx));
  c.texte('Une seule frappe, au même instant, sur 1 km de chaque milieu', 380, 24, { couleur: 'blanc', taille: 17, align: 'center' });
  c.cote(X0, 66, X1, 66, 'd = 1 km', { couleur: 'faible' });
  for (const p of PISTES) {
    c.texte(p.nom, 20, p.y + (p.nom2 ? -2 : 6), { couleur: p.couleur, taille: 17 });
    if (p.nom2) c.texte(p.nom2, 20, p.y + 18, { couleur: p.couleur, taille: 17 });
    // Le milieu (barreau d'acier, eau, air), le marteau et l'oreille sont peints plus haut, sous la craie.
    c.repere(p.id, 14, p.y - 26, 720, 52, p.id === 'air_fort' ? 'l’air frappé plus fort' : 'piste ' + p.nom);
  }
  c.direct(() => {
    c.texte(`${fr(S0.theta, 0)} °C`, 20, PISTES[2].y + 24, { couleur: S0.theta > 25 ? 'orange' : S0.theta < 5 ? 'cyan' : 'faible', taille: 15 });
    c.repere('temperature', 14, PISTES[2].y + 8, 90, 24, 'la température de l’air');
    for (const p of PISTES) {
      const ta = arrivee(p), f = Math.min(1, S.t / ta);
      if ((S.running || S.pause || S.fait) && S.t > 0 && f < 1) {
        const x = X0 + f * (X1 - X0), h = p.fort ? 22 : 11;
        for (let k = 0; k < 3; k++) c.courbe(u => [x - k * 7 + 5 * Math.sin(Math.PI * u), p.y - h + 2 * h * u], 16, { couleur: p.couleur, largeur: p.fort ? 3.4 : 2.2 });
      }
      if (S.t >= ta) {
        c.texte('arrivé', X1 + 34, p.y + 6, { couleur: p.couleur, taille: 15 });
        c.texte(`${fr(ta, ta < 1 ? 2 : 1)} s  →  v ≈ ${vit(p)} m/s`, X1 - 4, p.y + 32, { couleur: p.couleur, taille: 15, align: 'right' });
      }
    }
    c.texte(`t = ${fr(Math.min(S.t, tfin()), 2)} s`, 740, 30, { couleur: 'vert', taille: 16, align: 'right' });
    if (S.running || S.pause) c.texte('(ralenti)', 740, 50, { couleur: 'faible', taille: 13, align: 'right' });
    if (S.fait) {
      c.texte('même v : la force de la frappe ne change rien', 400, 405, { couleur: 'orange', taille: 15, align: 'center' });
      c.repere('meme_v', 180, 330, 520, 85, 'même célérité dans l’air, frappe forte ou faible');
    }
  });
  return c.fin();
}

const canvas = $('canvas');
const scene = window.OndesTableau.Scene(canvas, dessiner);
scene.avancer = dt => {
  if (!S.running) return false;
  S.t = Math.min(tfin(), S.t + dt / RALENTI);
  if (arreterSiInstantAtteint()) return true;
  if (S.t >= tfin()) {
    S.running = false; S.fait = true; $('run').textContent = 'Frapper';
    bulle($('feedback'), 'Acier d’abord, puis l’eau, l’air en dernier : la célérité dépend du milieu.', 'good');
    pont.noter('finished'); pont.emettre();
  } else if (performance.now() - S.emis > 400) { S.emis = performance.now(); pont.emettre(); }
  return true;
};
/* Instants clés (en secondes de vrai temps) ; le tuteur les vise avec `play_until {moment}`. */
function moments() { return { depart: 0.06, acier_arrive: arrivee(PISTES[0]), eau_arrive: arrivee(PISTES[1]), air_arrive: tfin() }; }
const MOTIFS = { depart: 'le son part en même temps dans les quatre pistes', acier_arrive: 'le son est déjà arrivé au bout de l’acier',
  eau_arrive: 'le son arrive au bout de l’eau ; dans l’air il n’a pas fait le quart', air_arrive: 'le son arrive enfin dans l’air, frappe forte et faible ensemble' };
function playUntil(p) {
  const M = moments(), nom = p.moment in M ? p.moment : null, cible = nom ? M[nom] : +p.progress * tfin();
  if (!Number.isFinite(cible)) return;
  if (cible >= tfin()) { if (S.pause) resume(); else if (!S.running) start(); else S.jusqua = null; return; }
  if (!(S.running || S.pause) || S.t >= cible - 1e-3) start();
  S.jusqua = cible; S.motif = nom ? MOTIFS[nom] : '';
  if (S.pause) { S.running = true; S.pause = false; $('run').textContent = 'Pause'; }
  pont.noter('play_until', { moment: nom }); pont.emettre();
}
function arreterSiInstantAtteint() {
  if (S.jusqua == null || S.t < S.jusqua) return false;
  S.t = S.jusqua; S.jusqua = null; S.running = false; S.pause = true; $('run').textContent = 'Reprendre';
  bulle($('feedback'), 'Arrêt sur image : ' + (S.motif || 'instant choisi') + '.'); pont.noter('pause'); pont.emettre();
  return true;
}
function ceQuiSeVoit() {
  const m = [`Quatre pistes de 1 km : acier, eau, air, et air frappé plus fort. Air à ${fr(S0.theta, 0)} °C. Marteau peint (manche en bois, tête d’acier) à gauche, oreille à droite ; barreau d’acier brossé, eau bleue dans une auge, air léger.`];
  if (S.t <= 0) m.push('Pas encore frappé.');
  else {
    const arr = PISTES.filter(p => S.t >= arrivee(p)).map(p => p.nom + (p.nom2 ? ' ' + p.nom2 : ''));
    m.push(`t = ${fr(S.t, 2)} s. Arrivés : ${arr.length ? arr.join(', ') : 'aucun'}.`);
    if (S.fait) m.push('Écrit à droite : acier 0,2 s (5000 m/s), eau 0,7 s (1500 m/s), air ${fr(arrivee(PISTES[2]), 1)} s (${vAir()} m/s, air à ${fr(S0.theta, 0)} °C) ; la frappe forte arrive en même temps que la faible.');
  }
  return m.join(' ');
}
function start() { S.jusqua = null; S.t = 0; S.running = true; S.pause = false; S.fait = false; $('run').textContent = 'Pause'; bulle($('feedback'), 'Le son part dans les quatre pistes…'); pont.noter('start'); pont.emettre(); }
function pause() { if (!S.running) return; S.jusqua = null; S.running = false; S.pause = true; $('run').textContent = 'Reprendre'; bulle($('feedback'), 'Arrêt sur image.'); pont.noter('pause'); pont.emettre(); }
function resume() { if (S.running || !S.pause) return start(); S.running = true; S.pause = false; $('run').textContent = 'Pause'; pont.noter('resume'); pont.emettre(); }
function reset() { S.t = 0; S.running = false; S.pause = false; S.fait = false; scene.sale = true; $('run').textContent = 'Frapper'; bulle($('feedback'), 'Frappe, puis regarde qui arrive le premier.'); pont.emettre(); }
function setParameters(p) {
  if (!Number.isFinite(+p.temperature_c)) return;
  S0.theta = Math.min(40, Math.max(-20, Math.round(+p.temperature_c / 5) * 5)); regl.maj(S0.theta); reset();
  bulle($('feedback'), `Air à ${fr(S0.theta, 0)} °C : v ≈ ${vAir()} m/s. Frappe pour comparer.`);
  pont.noter('set_parameters', { temperature_c: S0.theta }); pont.emettre();
}
const regl = window.Tableau.curseur({ id: 'theta', label: 'Air : θ =', min: -20, max: 40, step: 5, valeur: 20, unite: '°C', commande: 'set_parameters', onchange: v => setParameters({ temperature_c: v }) });
$('reglage').replaceChildren(regl);
$('run').onclick = () => (S.running ? pause() : S.pause ? resume() : start());
window.Tableau.explication({ milieux: [
  { repere: 'acier', texte: 'Dans l’acier, le son fait le kilomètre en deux dixièmes de seconde.' },
  { repere: 'eau', texte: 'Dans l’eau, environ mille cinq cents mètres par seconde.' },
  { repere: 'air', texte: 'Dans l’air, environ trois cent quarante mètres par seconde : il arrive le dernier.' },
  { repere: 'temperature', texte: 'Plus l’air est chaud, plus le son y va vite.' },
  { repere: 'air_fort', texte: 'Frapper plus fort ne fait pas aller le son plus vite.' },
] });
const commandes = ['start', 'pause', 'resume', 'reset', 'set_parameters', 'play_until'];
const config = { id: 'ondes_tableau_milieux', version: '1.0', title: 'La course du son', variants: [{ id: 'milieux', label: 'milieux' }], commands: commandes,
  command_schema: { set_parameters: { temperature_c: '-20..40 (pas de 5 °C), température de l’air' }, play_until: { moment: Object.keys(MOTIFS).join(' | ') + ' (rejoue et se fige à cet instant clé)' } } };
const pont = protocole({ id: config.id, commandes, config,
  texte: 'Course du son sur 1 km : acier 5000 m/s (0,2 s), eau 1500 m/s (0,67 s), air 340 m/s à 20 °C (2,9 s) ; la température de l’air se règle de -20 à 40 °C (v ≈ 331·√(1+θ/273)). Une piste d’air frappé plus fort arrive en même temps que l’air : l’amplitude ne change pas la célérité.',
  etat: () => ({ simulation_status: S.running ? 'running' : S.pause ? 'paused' : (S.fait ? 'finished' : 'idle'), ce_qui_se_voit: ceQuiSeVoit(), moments: moments(), parameters: { temperature_c: S0.theta }, v_air_m_s: vAir(), time_s: +S.t.toFixed(2) }),
  progression: () => (S.fait ? 1 : 0),
  executer: (cmd, p) => ({ start, pause, resume, reset, set_parameters: () => setParameters(p), play_until: () => playUntil(p) })[cmd]?.() });
bulle($('feedback'), 'Frappe, puis regarde qui arrive le premier.');
</script>
<script src="/media/simulations/professor-locate.js" defer></script>
</body></html>
