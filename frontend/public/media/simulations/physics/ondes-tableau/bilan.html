<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ce qu'il faut retenir — au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="ondes.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Fiche de révision écrite à la craie sur une page : pour chaque partie du cours, la définition à apprendre, les formules et le point d'attention ; deuxième page : ce que l'élève doit retravailler"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="suiv" data-professor-control="next previous start reset play_until">Ma page →</button>
    <button class="craie-btn secondaire" id="imprimer" title="Imprimer ou enregistrer en PDF">🖨️ Imprimer / PDF</button>
    <span class="lecture" id="page"></span>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="commun.js"></script>
<script src="/media/simulations/shared/tableau/imprimer.js"></script>
<script>
/*
 * « Ce qu'il faut retenir » (demande du 8 novembre 2026, deux pages au plus) : TOUTE la fiche du chapitre tient sur
 * UNE page — huit blocs en deux colonnes : la définition à apprendre (français, mot pour mot), la formule telle
 * qu'on l'écrit, et le piège en orange. La voix la parcourt bloc par bloc (play_until {moment: <bloc>} met le bloc
 * en lumière). La deuxième page est celle de l'élève : ce qu'il lui reste à retravailler (le lecteur lui donne son
 * bilan des acquis avec set_parameters {lacunes, acquis}). Contenu dans le cadre de référence 2 Bac PC (OMP1–OMP8).
 */
const { fr, bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);

const BLOCS = [
  { id: 'definition', titre: "1 · L'onde mécanique progressive", comps: ['C1'],
    def: "Propagation d'une perturbation dans un milieu matériel élastique, avec transport d'énergie et sans transport de matière.",
    attention: "M monte, descend et revient à sa place : la matière n'avance pas." },
  { id: 'types', titre: '2 · Transversale ou longitudinale', comps: ['C2'],
    def: "Transversale : perturbation ⊥ à la propagation (corde, eau). Longitudinale : même direction (ressort, son).",
    attention: "Le son est longitudinal. Dimensions : corde 1, eau 2, son 3." },
  { id: 'celerite', titre: '3 · La célérité', comps: ['C3'], formules: ['v = ⟦d|Δt⟧'],
    def: "d (m) mesurée de front à front, Δt (s), v (m/s). Dépend du milieu, pas de la source ni de l'amplitude.",
    attention: "Son : ≈ 340 m/s dans l'air, ≈ 1500 m/s dans l'eau." },
  { id: 'retard', titre: '4 · Le retard τ', comps: ['C4'], formules: ['τ = ⟦SM|v⟧', 'y_M(t) = y_S(t − τ)'],
    def: "M refait le mouvement de S, avec le retard τ : même courbe, décalée de τ.",
    attention: "Convertir les ms et les cm avant de calculer." },
  { id: 'longueur', titre: '5 · Durée θ et longueur L', comps: ['C5'], formules: ['L = v · θ'],
    def: "θ : durée pendant laquelle un point bouge (sur y(t)). L : longueur du milieu perturbé (sur y(x)).",
    attention: "Ne pas confondre θ (durée) et τ (retard)." },
  { id: 'aspect', titre: '6 · Lire une onde', comps: ['C6'],
    def: "y(x) : l'aspect du milieu, une photo (front à droite). y(t) : le mouvement d'un point (front à gauche).",
    attention: "Lire l'axe avant la valeur. Devant le sommet, les points montent." },
  { id: 'mesures', titre: '7 · Mesurer', comps: ['C7', 'C8'], formules: ['τ = divisions × sensibilité', 'v = ⟦d|τ⟧', 'd = ⟦v·τ|2⟧'],
    def: "Deux micros : τ lu sur l'oscilloscope (divisions × sensibilité). Écho : aller-retour, 2d = v·τ.",
    attention: "Début avec début ; ne pas oublier le 2 de l'aller-retour." },
  { id: 'methode', titre: '8 · Rédiger comme le barème', comps: ['C9'], formules: ['relation → A.N. → résultat → unité'],
    def: "Lire l'axe, reconnaître le cas (mot-code de l'énoncé), puis les quatre temps du calcul.",
    attention: "Unités SI ; vérifier l'ordre de grandeur." },
];
const STATUTS = { non_acquis: ['à reprendre', 'rouge'], partiel: ['à revoir', 'orange'], acquis: ['acquis', 'vert'] };
const S = { page: 1, feuille: 0, focus: null, lacunes: null, acquis: null, apparu: [], impression: false };   // apparu[i] : l'instant où la voix a allumé le bloc i

/* Coupe un texte en lignes qui tiennent dans `max` px (mesure sans les « _ » des indices). */
/* La taille vraiment écrite : la craie ne descend jamais sous `tailleMin` px à l'écran (15 novembre 2026). */
const eff = (c, t) => (c.echelle && c.tailleMin ? Math.max(t, c.tailleMin / c.echelle) : t);
let TROP = false;   // mesure : un mot, un titre ou une formule plus large que sa colonne (la disposition est refusée)
function lignes(c, texte, taille, max) {
  const ctx = c.ctx; ctx.font = `${eff(c, taille)}px ${window.Tableau.POLICE}`;
  const out = []; let ligne = '';
  for (const mot of String(texte).split(/\s+/)) {
    const essai = ligne ? ligne + ' ' + mot : mot;
    if (ctx.measureText(essai.replace(/_/g, '')).width > max && ligne) { out.push(ligne); ligne = mot; } else ligne = essai;
    if (ctx.measureText(mot.replace(/_/g, '')).width > max + 1) TROP = true;
  }
  if (ligne) out.push(ligne);
  return out;
}
function paragraphe(c, texte, x, y, taille, max, o = {}, gr = GR) {
  for (const l of lignes(c, texte, taille, max)) { c.texte(l, x, y, { taille, ...o }); y += eff(c, taille) * (gr ? 1.13 : 1.22); }
  return y;
}
/* Une formule à indices (« y_M(t) = y_S(t − τ) ») : l'indice s'écrit à 62 % de la ligne mais jamais sous le plancher
 * de 15 px à l'écran (le kit l'écrirait à 62 % du plancher, soit 9 px sur un téléphone) ; mesure et écriture. */
function indices(c, s, x, y, taille, o, dessiner) {
  const T = eff(c, taille), segs = window.Tableau.Craie.segments(s);
  for (const g of segs) {
    const t = g.sub ? eff(c, T * .62) : T;
    if (dessiner) c.texte(g.t, x, y + (g.sub ? T * .28 : 0), { ...o, taille: g.sub ? T * .62 : taille });
    c.ctx.font = `${t}px ${window.Tableau.POLICE}`; x += c.ctx.measureText(g.t).width;
  }
  return x;
}
const largeurFormule = (c, fo, taille) => (/[A-Za-zτθΔλωφ]_/.test(fo) && !fo.includes('⟦') ? indices(c, fo, 0, 0, taille, {}, false) : scene.craie.largeurTexte(fo.replace(/_/g, ''), eff(c, taille)));

/* Disposition (18 novembre 2026, téléphone en paysage : « textes de 10 px, le ⚠ du bloc 1 écrit sur le titre du bloc 2 ») :
 * la page garde son propre plancher de 15 px à l'écran (le kit le baisse jusqu'à 45 % sur un petit tableau) et chaque
 * bloc est mesuré avec la taille vraiment écrite. Dans l'ordre : le tableau large d'origine (quatre colonnes, deux
 * blocs par colonne, × 1,6), les deux colonnes d'origine, puis, quand la fiche ne tient pas, des PARTIES successives
 * (autant qu'il faut, jusqu'à un bloc par écran) : « partie n sur N · touche : la suite » dans l'en-tête, la partie
 * montrée suit le bloc que dit la voix. À l'impression (S.impression), la fiche entière sur une page. */
let L = 760, GR = false, F = 1, DX = 0, HAUT = 50, CLE = '', CHOIX = [1, false, 50];
const f = n => Math.round(n * F * 10) / 10;
const ECART = 18, BAS = 414, POS = [], DEBUT = [];   // DEBUT[i] : l'instant (s) où le bloc i commence à s'écrire dans l'ordre de la fiche
let PARTIES = [[[0, 1, 2, 3], [4, 5, 6, 7]]];   // chaque partie : ses colonnes, chaque colonne : ses blocs (indices)
const partieDe = i => Math.max(0, PARTIES.findIndex(p => p.some(col => col.includes(i))));
const blocsDe = k => (PARTIES[k] || PARTIES[0]).flat();
function mesureur(c) {
  return { ctx: c.ctx, echelle: c.echelle, tailleMin: c.tailleMin, mesure: true, texte() { return this; }, rect() { return this; }, repere() { return this; }, ligne() { return this; },
    largeurTexte: (s, t) => c.largeurTexte(s, t) };
}
/** Place les colonnes d'une partie (largeur L) : rend false si un bloc déborde (largeur ou hauteur). */
function placer(m, cols, out) {
  const n = cols.length, w = (L - 36 - (n - 1) * ECART) / n;
  for (let k = 0; k < n; k++) {
    let y = HAUT;
    for (const i of cols[k]) {
      const g = { x: 18 + k * (w + ECART), w, y0: y, h: 0 };
      TROP = false; g.h = bloc(m, BLOCS[i], i, g) - y;
      if (TROP) return false;
      if (out) out[i] = g;
      y += g.h + 8;
    }
    if (y - 8 > BAS) return false;
  }
  return true;
}
/** L'en-tête (titre, trait) : la ligne de base du titre, le trait, le haut des blocs — selon la taille vraiment écrite. */
function entete(c) {
  const yT = Math.max(GR ? 31 : 30, eff(c, f(22)) + 1), yL = yT + (GR ? 9 : 8);
  return { yT, yL, haut: Math.max(GR ? 52 : 50, yL + 12) };
}
function disposer() {
  const c = scene.craie;
  L = scene.L; DX = 0;
  /* Le cadre large est plafonné (L ≤ 1,7 × 760) alors que le tableau d'un portable est encore plus large : la fiche,
   * très écrite, prend toute la largeur visible du canvas (décalage DX, repères et clics suivent). */
  if (scene.s > 0 && !scene.mesurant) {
    const xa = Math.min(0, -scene.ox / scene.s), xb = Math.max(L, (c.W - scene.ox) / scene.s);
    DX = xa + 6; L = xb - xa - 12; c.ctx.translate(DX, 0); if (c.cadre) c.cadre = { ...c.cadre, w: L };
  }
  const cle = `${L.toFixed(1)}|${(c.echelle || 1).toFixed(4)}|${c.tailleMin}|${BLOCS.map(statut).join()}|${document.fonts ? document.fonts.status : ''}`;
  if (cle === CLE) { [F, GR, HAUT] = CHOIX; return; }
  CLE = cle;
  const m = mesureur(c), large = scene.L >= 1000;
  const essai = (Fx, parties) => {
    F = Fx; GR = Fx >= 1.5; HAUT = entete(c).haut;
    const pos = [];
    for (const p of parties) if (!placer(m, p, pos)) return null;
    return pos;
  };
  // 1) la disposition d'origine du tableau large, sur une page
  if (large) {
    const cols = [[0, 1], [2, 3], [4, 5], [6, 7]], pos = essai(1.6, [cols]);
    if (pos) { PARTIES = [cols]; pos.forEach((g, i) => { POS[i] = g; }); return fin(); }
  }
  // 2) pour chaque taille et nombre de colonnes, on remplit colonne après colonne (une page si possible, sinon des
  //    parties) ; le moins de parties l'emporte, puis la plus grande écriture, puis les colonnes les plus larges.
  let mieux = null;
  for (const Fx of [1.6, 1.45, 1.3, 1.15, 1]) for (const n of [4, 3, 2, 1]) {
    F = Fx; GR = Fx >= 1.5; HAUT = entete(c).haut;
    const parties = []; let cols = [[]], h = 0, ok = true;
    for (let i = 0; i < BLOCS.length && ok; i++) {
      const pos = [], seul = placer(m, Array.from({ length: n }, (_, k) => (k ? [] : [i])), pos);
      if (!seul) { ok = false; break; }
      const hi = pos[i].h + 8;
      if (cols[cols.length - 1].length && HAUT + h + hi - 8 > BAS) {
        if (cols.length === n) { parties.push(cols); cols = [[]]; } else cols.push([]);
        h = 0;
      }
      cols[cols.length - 1].push(i); h += hi;
    }
    if (!ok) continue;
    parties.push(cols);
    // chaque partie reprend toute la largeur avec ses colonnes (une partie de deux colonnes a des colonnes plus larges)
    const pos = essai(Fx, parties);
    if (!pos) continue;
    const note = [parties.length, -Fx, n];
    if (!mieux || note[0] < mieux.note[0] || (note[0] === mieux.note[0] && (note[1] < mieux.note[1] || (note[1] === mieux.note[1] && note[2] < mieux.note[2])))) mieux = { note, parties, pos, Fx };
  }
  if (!mieux) {   // dernier recours : un bloc par partie, à la taille d'origine
    const parties = BLOCS.map((_, i) => [[i]]);
    mieux = { parties, Fx: 1, pos: essai(1, parties) || [] };
  }
  F = mieux.Fx; GR = F >= 1.5; HAUT = entete(c).haut; PARTIES = mieux.parties; mieux.pos.forEach((g, i) => { if (g) POS[i] = g; });
  return fin();
  function fin() { CHOIX = [F, GR, HAUT]; S.feuille = Math.min(S.feuille, PARTIES.length - 1); etiquettes(); }
}
function geo(i) { return POS[i]; }
function bloc(c, b, i, g) {
  const col = g || geo(i), x = col.x, y0 = col.y0, HB = col.h, enLumiere = S.focus === b.id;
  const st = statut(b), mesure = !!c.mesure;
  // Un bloc allumé par la voix s'écrit à partir de cet instant ; les autres suivent l'ordre naturel de la fiche.
  // Rien n'est effacé ni réécrit : chaque bloc garde sa place dans le temps (demande du 8 novembre 2026).
  if (enLumiere) c.rect(x - 8, y0 - 6, col.w + 16, HB - 4, { couleur: 'jaune', arrondi: 10, largeur: 1.6, alpha: .7, duree: .3 });
  else if (st && STATUTS[st] && st !== 'acquis') c.rect(x - 8, y0 - 6, col.w + 16, HB - 4, { couleur: STATUTS[st][1], arrondi: 10, largeur: 1.4, pointille: [5, 6], alpha: .8, duree: .3 });
  const TT = eff(c, f(15)), ctx = c.ctx;
  let y = y0 + Math.max(12, TT * .78);
  // le titre (sur deux lignes s'il le faut) ; l'état de l'élève à droite, ou dessous s'il n'y a pas la place
  const etiq = st === 'acquis' ? '✓' : st && STATUTS[st] ? STATUTS[st][0] : '', te = st === 'acquis' ? f(15) : f(11);
  ctx.font = `${eff(c, te)}px ${window.Tableau.POLICE}`; const we = etiq ? ctx.measureText(etiq).width + 10 : 0;
  ctx.font = `${TT}px ${window.Tableau.POLICE}`; const wt = ctx.measureText(b.titre).width;
  const aCote = !etiq || wt + we <= col.w;
  const yt = y;
  y = paragraphe(c, b.titre, x, y, f(15), aCote ? col.w - we : col.w, { couleur: 'jaune' }) - TT * (GR ? 1.13 : 1.22);   // la dernière ligne du titre
  if (etiq) {
    if (!aCote) y += eff(c, te) * 1.2;
    c.texte(etiq, x + col.w, aCote ? yt : y, { couleur: st === 'acquis' ? 'vert' : STATUTS[st][1], taille: te, align: 'right' });
  }
  y += GR ? TT + 4 : Math.max(17, TT * 1.3 - 2.5);
  if (b.formules) {
    let fx = x;
    // une formule à fraction (« ⟦num|dén⟧ », écrite sur deux étages comme dans le cahier) prend un cadre plus haut
    const etages = b.formules.some(fo => fo.includes('⟦')), indice = b.formules.some(fo => /[A-Za-zτθΔλωφ]_/.test(fo));
    const t = eff(c, f(15)), tf = eff(c, t * .78), ti = eff(c, t * .62);
    // en multiples de t : le haut du numérateur et le bas du dénominateur (ou de l'indice), tels qu'ils sont écrits
    const haut = Math.max(etages ? 1.45 : .9, etages ? (.32 * t + 1.05 * tf + 3) / t : 0);
    const bas = Math.max(etages ? .62 : .4, etages ? (-.32 * t + 1.22 * tf + 3) / t : 0, indice ? (.28 * t + .25 * ti + 3) / t : 0);
    if (etages) y += t * (haut - 1);
    for (const fo of b.formules) {
      const wf = largeurFormule(c, fo, f(15)) + 16;
      if (wf > col.w + .5) TROP = true;
      const l = Math.min(col.w, wf);
      if (fx > x && fx + l > x + col.w) { fx = x; y += t * (haut + bas) + 6; }   // la formule suivante passe à la ligne
      c.rect(fx, y - t * haut + 2, l, t * (haut + bas), { couleur: 'faible', arrondi: 6, largeur: 1.3 });
      if (/[A-Za-zτθΔλωφ]_/.test(fo) && !fo.includes('⟦')) { if (!mesure) indices(c, fo, fx + 8, y + 2, f(15), { couleur: 'jaune' }, true); }
      else c.texte(fo, fx + 8, y + 2, { couleur: 'jaune', taille: f(15), max: l - 12 });
      fx += l + 8;
    }
    y += t * bas + Math.max(GR ? 10 : 13, eff(c, f(12.5)) * .8 + 4);   // la définition commence sous le cadre de la formule
  }
  y = paragraphe(c, b.def, x, y, f(12.5), col.w, { couleur: 'blanc' });
  // le ⚠ et le piège : le texte commence après le ⚠ tel qu'il est vraiment écrit (plancher compris)
  ctx.font = `${eff(c, f(12))}px ${window.Tableau.POLICE}`;
  const retrait = Math.max(GR ? 22 : 16, ctx.measureText('⚠').width + 6);
  c.texte('⚠', x, y, { couleur: 'orange', taille: f(12) });
  y = paragraphe(c, b.attention, x + retrait, y, f(11.5), col.w - retrait, { couleur: 'orange', alpha: .9 });
  c.repere(b.id, x - 8, y0 - 6, col.w + 16, HB - 4, b.titre.replace(/^\d+ · /, ''));
  return y - eff(c, f(11.5)) * 0.78 + 12;   // le bas du bloc (mesure)
}

function dessinerFiche(c) {
  if (S.focus) S.feuille = partieDe(BLOCS.findIndex(b => b.id === S.focus));   // la partie du bloc que dit la voix
  const N = PARTIES.length, ici = blocsDe(S.feuille), { yT, yL } = entete(c);
  c.texte('Ce qu’il faut retenir', 22, yT, { couleur: 'jaune', taille: f(22) });
  if (N > 1) {
    // petit écran : la fiche par parties ; le compteur (15 px au moins) dit comment passer à la suite
    c.texte(`partie ${S.feuille + 1} sur ${N} · touche : la suite`, L - 20, yT - 1, { couleur: 'cyan', taille: f(13), align: 'right' });
    c.repere('parties', L / 2, 4, L / 2 - 14, yL - 2, `petit écran : partie ${S.feuille + 1} sur ${N} de la fiche (touche : la suite)`);
  } else c.texte('définition · formule · ⚠ piège', L - 20, yT - 2, { couleur: 'faible', taille: f(12), align: 'right' });
  c.ligne(22, yL, L - 20, yL, { couleur: 'tresfaible', largeur: 1.4 });
  const cols = PARTIES[S.feuille] || PARTIES[0];
  for (let k = 1; k < cols.length; k++) {
    const xs = POS[cols[k][0]].x - ECART / 2, bas = Math.max(...[cols[k - 1], cols[k]].map(cl => { const g = POS[cl[cl.length - 1]]; return g.y0 + g.h - 10; }));
    c.ligne(xs, HAUT - 4, xs, bas, { couleur: 'tresfaible', largeur: 1, pointille: [4, 6] });
  }
  // Les blocs allumés par la voix s'écrivent d'abord (dans l'ordre où elle les a dits), puis les autres suivent l'ordre
  // de la fiche : le bloc dont le professeur parle n'attend jamais l'écriture des précédents.
  // Un bloc allumé par la voix a SA ligne de temps : il s'écrit dès l'instant où elle l'a dit, sans attendre les autres.
  // Les blocs pas encore dits suivent l'ordre naturel de la fiche, à la suite du titre.
  let naturel = c.cur, fin = c.cur;
  BLOCS.forEach((b, i) => {
    if (!ici.includes(i)) return;   // sur une autre partie
    if (S.apparu[i] != null) { c.cur = S.apparu[i]; bloc(c, b, i); }
    else { c.cur = naturel; DEBUT[i] = naturel; bloc(c, b, i); naturel = c.cur; }
    fin = Math.max(fin, c.cur);
  });
  c.cur = fin;
}

function dessinerLacunes(c) {
  F = scene.L >= 1000 ? 1.6 : 1; GR = F >= 1.5;   // la page de l'élève garde ses tailles d'origine (plancher de 15 px compris)
  const { yT, yL } = entete(c);
  c.texte('Ta page : ce qu’il te reste à retravailler', 22, yT, { couleur: 'jaune', taille: f(22) });
  c.ligne(22, yL, L - 20, yL, { couleur: 'tresfaible', largeur: 1.4 });
  let y = yL + Math.max(GR ? 38 : 32, eff(c, f(18)) + 12);
  const lac = S.lacunes, acq = S.acquis || [];
  // les sauts de ligne suivent la taille vraiment écrite (plancher de 15 px compris)
  const T = n => eff(c, f(n)), saut = (n, base) => Math.max(base, T(n) * 1.3), lh = n => T(n) * (GR ? 1.13 : 1.22);
  if (!lac) {
    c.texte('Pas encore de réponses notées.', 22, y, { couleur: 'faible', taille: f(18) }); y += saut(18, GR ? 36 : 28);
    paragraphe(c, 'Réponds aux questions du cours : ton bilan par compétence s’écrira ici, et le professeur y reviendra en mode libre.', 22, y, f(16), L - 60, { couleur: 'faible' });
    return;
  }
  if (!lac.length) {
    c.texte('✓ Toutes les compétences évaluées sont acquises. Bravo !', 22, y, { couleur: 'vert', taille: f(20) }); y += saut(20, GR ? 38 : 30);
  } else {
    // ce qui ne tient pas dans le cadre est résumé (« … et n autre(s) »), comme au-delà de cinq
    c.texte('À reprendre en mode libre, avec le professeur :', 22, y, { couleur: 'orange', taille: f(15) }); y += saut(15, GR ? 30 : 24);
    const y0 = y - Math.max(GR ? 24 : 18, T(16));
    c.ctx.font = `${T(17)}px ${window.Tableau.POLICE}`;
    const xr = 22 + Math.max(GR ? 28 : 20, c.ctx.measureText('⟳').width + 8), wr = L - xr - 28;
    const avec = l => (l.reprendre_avec && l.reprendre_avec.length ? 'reprendre avec ' + l.reprendre_avec.join(', puis ') : '');
    const hauteur = l => lignes(c, l.label + ' — ' + STATUTS.partiel[0], f(16), wr).length * lh(16) + (avec(l) ? lignes(c, avec(l), f(13), wr).length * lh(13) : 0) + 4;
    const reste = (acq.length ? 6 + saut(15, GR ? 26 : 20) + lignes(c, acq.join(' · '), f(14), L - 60).length * lh(14) : 0) + saut(13, GR ? 24 : 18);
    let montres = 0;
    for (const l of lac.slice(0, 5)) {
      if (montres && y + hauteur(l) - lh(16) + reste > BAS) break;
      const [etiq, coul] = STATUTS[l.statut] || STATUTS.non_acquis;
      c.texte(l.statut === 'partiel' ? '⟳' : '✗', 22, y, { couleur: coul, taille: f(17) });
      y = paragraphe(c, `${l.label} — ${etiq}`, xr, y, f(16), wr, { couleur: 'blanc' });
      if (avec(l)) y = paragraphe(c, avec(l), xr, y, f(13), wr, { couleur: coul, alpha: .85 });
      y += 4; montres++;
    }
    if (lac.length > montres) { c.texte(`… et ${lac.length - montres} autre(s)`, xr, y, { couleur: 'faible', taille: f(13) }); y += saut(13, GR ? 24 : 18); }
    c.repere('lacunes', 18, y0, L - 40, y - y0, 'ce qu’il reste à retravailler');
  }
  if (acq.length) {
    y += 6; c.texte('✓ Acquis', 22, y, { couleur: 'vert', taille: f(15) }); y += saut(15, GR ? 26 : 20);
    paragraphe(c, acq.join(' · '), 22, y, f(14), L - 60, { couleur: 'vert', alpha: .85 });
  }
}

const canvas = $('canvas');
const scene = window.OndesTableau.Scene(canvas, (c) => { scene.cadre(21 + S.page); disposer(); if (S.page === 1) dessinerFiche(c); else dessinerLacunes(c); return c.fin(); }, { large: true });
/* La fiche est faite de phrases : sur un cadre de téléphone, commun.js tait les phrases (la voix les dit) — pas ici,
 * la fiche est ce que l'élève relit ; elle se coupe déjà en plus de parties sur un petit cadre (18 novembre 2026). */
{ const ecrire = scene.craie.texte; scene.craie.texte = function (s, x, y, o = {}) { return ecrire.call(this, s, x, y, { ...o, garder: true }); }; }

/* `feuille` : la partie de la fiche à montrer (petit écran) ; un bloc dit par la voix montre SA partie. */
function aller(n, par, focus, feuille) {
  n = n === 2 ? 2 : 1;
  const i = focus ? BLOCS.findIndex(b => b.id === focus) : -1;
  const fe = n === 1 ? (i >= 0 ? partieDe(i) : Number.isInteger(feuille) ? Math.max(0, Math.min(feuille, PARTIES.length - 1)) : S.feuille) : S.feuille;
  // nouvelle page, nouvelle partie ou rejouer : on réécrit depuis le début
  if (n !== S.page || (n === 1 && fe !== S.feuille) || par === 'start' || par === 'reset') { scene.reecrire(); S.apparu = []; DEBUT.length = 0; }
  const maintenant = (performance.now() - scene.ouvert) / 1000;
  // dit par la voix : le bloc s'écrit dès maintenant, sauf s'il est déjà écrit à sa place (il s'allume seulement)
  if (n === 1 && i >= 0 && S.apparu[i] == null && !(DEBUT[i] <= maintenant)) S.apparu[i] = maintenant;
  S.page = n; S.feuille = fe; S.focus = n === 1 ? (focus || null) : null; scene.sale = true;
  etiquettes();
  const N = PARTIES.length;
  bulle($('feedback'), n === 2 ? 'Ta page à toi.' : focus ? BLOCS.find(b => b.id === focus).titre.replace(/^\d+ · /, '') : N > 1 ? `La fiche du chapitre, partie ${S.feuille + 1} sur ${N}.` : 'La fiche du chapitre.');
  pont.noter(par || 'page', { page: n, moment: focus || (n === 2 ? 'lacunes' : 'fiche') }); pont.emettre();
}
/** Bouton et numéro : « Suite → » tant qu'il reste une partie de la fiche, puis « Ma page → ». */
function etiquettes() {
  const N = PARTIES.length, fiche = S.page === 1;
  $('suiv').textContent = fiche ? (S.feuille < N - 1 ? 'Suite →' : 'Ma page →') : '← La fiche';
  $('page').textContent = fiche ? `${S.feuille + 1} / ${N + 1}` : `${N + 1} / ${N + 1}`;
}
/** La partie suivante de la fiche, puis la page de l'élève. */
function suite(par = 'next') {
  if (S.page === 1 && S.feuille < PARTIES.length - 1) return aller(1, par, null, S.feuille + 1);
  aller(2, par);
}
/** La partie précédente de la fiche (depuis la page de l'élève : la fiche, là où on l'avait laissée). */
function precedent(par = 'previous') {
  if (S.page === 1 && S.feuille > 0) return aller(1, par, null, S.feuille - 1);
  aller(1, par);
}
function statut(b) {
  if (!S.lacunes) return null;
  const lac = S.lacunes.filter(l => b.comps.includes(l.id));
  if (lac.some(l => l.statut === 'non_acquis')) return 'non_acquis';
  if (lac.length) return 'partiel';
  return (S.acquis_ids || []).some(a => b.comps.includes(a)) ? 'acquis' : null;
}
/* Moments (18 novembre 2026) : chaque bloc a son instant entre la fiche (1) et la page de l'élève (2), sinon le kit
 * (tableau.js, « pas de retour en arrière ») jetait tout play_until {moment: <bloc>} reçu sur la fiche (time_s = 1) : le
 * bloc n'était ni allumé ni montré (sur un petit écran, sa partie ne venait jamais). « fin » : la fiche sans bloc en
 * lumière, sa dernière partie sur un petit écran. */
function moments() { const m = { fiche: 1 }; BLOCS.forEach((b, i) => { m[b.id] = +(1 + (i + 1) / 10).toFixed(1); }); m.fin = 1.9; m.lacunes = 2; return m; }
function playUntil(p) {
  const nom = p.moment in moments() ? p.moment : null;
  if (!nom && !Number.isFinite(+p.time_s)) return;
  if (nom === 'lacunes' || +p.time_s === 2) aller(2, 'play_until');
  else if (nom === 'fin') aller(1, 'play_until', null, PARTIES.length - 1);
  else aller(1, 'play_until', BLOCS.some(b => b.id === nom) ? nom : null);
}
function setParameters(p) {
  if (Array.isArray(p.lacunes)) S.lacunes = p.lacunes.map(l => ({ id: String(l.id || ''), label: String(l.label || l.id || ''), statut: String(l.statut || 'non_acquis'), reprendre_avec: Array.isArray(l.reprendre_avec) ? l.reprendre_avec.map(String) : [] }));
  if (Array.isArray(p.acquis)) S.acquis = p.acquis.map(String);
  if (Array.isArray(p.acquis_ids)) S.acquis_ids = p.acquis_ids.map(String);
  scene.sale = true; pont.noter('set_parameters', { lacunes: (S.lacunes || []).length, acquis: (S.acquis || []).length }); pont.emettre();
}
function ceQuiSeVoit() {
  if (S.page === 2) return `Page 2/2, la page de l'élève : ${!S.lacunes ? 'pas encore de bilan' : S.lacunes.length ? 'à retravailler : ' + S.lacunes.map(l => l.label).join(' ; ') : 'toutes les compétences évaluées sont acquises'}.`;
  const f = S.focus && BLOCS.find(b => b.id === S.focus), N = PARTIES.length;
  const partie = N > 1 ? `, petit écran : la fiche en ${N} parties, partie ${S.feuille + 1} visible (${blocsDe(S.feuille).map(i => BLOCS[i].titre).join(', ')})` : '';
  return `Page 1/2, la fiche du chapitre : huit blocs (définition, formule, piège)${partie}${f ? ` ; en lumière « ${f.titre} » : ${f.def}${f.formules ? ' Formules : ' + f.formules.map(window.Tableau.lisible).join(' ; ') + '.' : ''} Piège : ${f.attention}` : ''}${S.lacunes ? ` Blocs à reprendre : ${BLOCS.filter(b => statut(b) && statut(b) !== 'acquis').map(b => b.titre).join(', ') || 'aucun'}.` : ''}`;
}
$('suiv').onclick = () => (S.page === 1 ? suite('next') : aller(1, 'previous'));
// Imprimer / PDF : la fiche entière et la page de l'élève, sur fond blanc (shared/tableau/imprimer.js).
$('imprimer').onclick = () => {
  // Sur papier, la fiche entière sur une page (S.impression : pas de plancher d'écran, donc pas de parties).
  const avant = { page: S.page, feuille: S.feuille, focus: S.focus, apparu: S.apparu.slice() };
  window.Tableau.imprimer({ titre: 'Ce qu’il faut retenir — ondes mécaniques progressives', scene,
    pages: [{ nom: 'la fiche', preparer: () => { S.impression = true; S.page = 1; S.feuille = 0; S.focus = null; S.apparu = []; } },
            { nom: 'ta page : à retravailler', preparer: () => { S.impression = true; S.page = 2; S.focus = null; } }],
    restaurer: () => { Object.assign(S, avant, { impression: false }); CLE = ''; scene.sale = true; } });
  pont.noter('imprimer', { pages: 2 }); pont.emettre();
};
canvas.addEventListener('pointerdown', e => {
  if (S.page !== 1) return;
  const r = canvas.getBoundingClientRect(), [x0, y] = scene.local(e.clientX - r.left, e.clientY - r.top), x = x0 - DX;
  const ici = blocsDe(S.feuille);
  const i = BLOCS.findIndex((b, k) => { const g = geo(k); return g && ici.includes(k) && x >= g.x - 8 && x <= g.x + g.w + 8 && y >= g.y0 - 6 && y <= g.y0 + g.h - 10; });
  if (i < 0) { if (PARTIES.length > 1) suite('touche'); return; }   // petit écran : toucher le tableau hors d'un bloc, c'est la suite
  S.focus = BLOCS[i].id; scene.sale = true; bulle($('feedback'), BLOCS[i].def);
  pont.noter('touche', { moment: BLOCS[i].id }); pont.emettre();
});

window.Tableau.explication({ bilan: BLOCS.map(b => ({ repere: b.id, texte: b.def })) });
const commandes = ['start', 'reset', 'play_until', 'set_parameters', 'next', 'previous', 'highlight'];
/** La baguette vise un bloc d'une autre partie (petit écran) : on montre sa partie ; le kit l'entoure dès qu'il paraît. */
function montrer(p) {
  const i = BLOCS.findIndex(b => b.id === (p.target || p.repere || p.element || p.id));
  if (S.page === 1 && i >= 0 && partieDe(i) !== S.feuille) aller(1, 'highlight', null, partieDe(i));
}
const config = { id: 'ondes_tableau_bilan', version: '2.0', title: 'Ce qu’il faut retenir', variants: [{ id: 'bilan', label: 'fiche' }], commands: commandes,
  command_schema: { play_until: { moment: Object.keys(moments()).join(' | ') + ' (met ce bloc de la fiche en lumière ; lacunes = la page de l’élève)' },
    set_parameters: { lacunes: '[{id: C1.., label, statut: non_acquis|partiel, reprendre_avec: [..]}] (bilan de l’élève)', acquis: '[labels acquis]', acquis_ids: '[C1, ..]' } } };
const pont = protocole({ id: config.id, commandes, config,
  texte: 'Fiche « Ce qu’il faut retenir » du chapitre des ondes mécaniques progressives, sur une page (huit blocs : définition, formule, piège), puis la page de l’élève (ce qu’il lui reste à retravailler).',
  etat: () => ({ simulation_status: 'paused', ce_qui_se_voit: ceQuiSeVoit(), current_variant: 'bilan', time_s: S.page, parameters: { page: S.page, focus: S.focus, lacunes: S.lacunes ? S.lacunes.length : null }, moments: moments() }),
  progression: () => (S.page === 2 ? 1 : (S.feuille + 1) / (PARTIES.length + 1)),
  executer: (cmd, p) => ({ start: () => aller(1, 'start', 'definition'), reset: () => aller(1, 'reset', 'definition'), play_until: () => playUntil(p), set_parameters: () => setParameters(p),
    next: () => suite('next'), previous: () => precedent('previous'), highlight: () => montrer(p) })[cmd]?.() });
/* Texte jamais sous 15 px à l'écran, même sur un téléphone en paysage (18 novembre 2026) : le kit baisse son plancher
 * sur un petit tableau ; cette page garde 15 px (sa propre craie, rien de partagé n'est changé) et se partage en parties
 * pour que ça tienne. À l'impression, pas de plancher d'écran : la fiche entière, sur une page. */
Object.defineProperty(scene.craie, 'tailleMin', { get: () => (S.impression ? 0 : 15), set: () => {}, configurable: true });
aller(1, 'start', 'definition');   // la voix commence par la définition : le premier bloc est déjà en lumière
window.__bilan = { S, scene, BLOCS, POS, parties: () => PARTIES };   // pour les vérifications automatiques
</script>
