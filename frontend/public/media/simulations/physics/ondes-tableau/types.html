<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transversale ou longitudinale — au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="ondes.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Quatre ondes à la craie : une corde, un ressort, le son dans l'air et des rides sur l'eau ; on compare le mouvement d'un point à la direction de propagation"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start pause resume play_until">Secouer</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="commun.js"></script>
<script>
/*
 * Transversale ou longitudinale ? (14 novembre 2026, règle 28 du professeur) : remplace le tableau
 * « onde / perturbation-propagation / type / dimensions » de la diapo wx_i3_types.
 * Quatre cases, jouées l'une après l'autre au rythme de la voix :
 *   corde   : la bosse avance vers la droite, le point M monte et descend → perpendiculaires → transversale ;
 *   ressort : la compression avance, la spire M avance et recule → même direction → longitudinale ;
 *   son     : le haut-parleur pousse l'air, les grains d'air vont et viennent dans le sens de propagation → longitudinale ;
 *   eau     : vue de dessus, les rides s'étalent dans le plan.
 * À la fin, le nombre de dimensions s'écrit dans chaque case (1, 1, 3, 2). Un seul bouton.
 */
const { bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const CASES = {
  corde: { x: 10, y: 8, w: 365, h: 200, titre: 'Une corde' },
  ressort: { x: 385, y: 8, w: 365, h: 200, titre: 'Un ressort' },
  son: { x: 10, y: 214, w: 365, h: 200, titre: 'Le son dans l’air' },
  eau: { x: 385, y: 214, w: 365, h: 200, titre: 'L’eau (vue de dessus)' },
};
/* Calendrier (s) : chaque case joue à son tour. */
const A0 = 0.2; let VA = 150, XA0 = 40, XM = 200, XA1 = 355;         // corde
const B0 = 2.9, NSP = 27, IM = 13; let VB = 150, XB0 = 405, PAS = 12; // ressort (spire M = n° 13)
const C0 = 5.6, SPX = 52, SPY = 318; let VC = 120, LC = 30;           // son (longueur entre deux compressions)
const D0 = 8.3, VD = 60, EY = 320; let EX = 567;                      // eau
const T = {
  corde: A0 + (XM - XA0) / VA, ressort: B0 + (XB0 + IM * PAS - XB0) / VB,
  son: C0 + 2.0, eau: D0 + 1.4, fin: 10.6,
};
const TFIN = 11.0;
/* Agrandissement (15 novembre 2026, « mieux exploiter tout le tableau ») : Scene en { large: true } ; sur le
 * tableau large (scene.L ≥ 1000) les quatre cases prennent toute la largeur (corde, ressort et grains d'air
 * s'étirent avec elles, vitesses mises à l'échelle : les instants clés ne changent pas) et les textes grossissent
 * (× 1,35) ; sur un grand écran (L < 1000) la disposition d'origine reste. */
let L = 760, GR = false, kA = 1, kB = 1, KC = 1;
const f = n => (GR ? Math.round(n * 1.35) : n);
function disposer() {
  L = scene.L; GR = L >= 1000;
  const W = GR ? (L - 30) / 2 : 365, x2 = W + 20;
  for (const k of Object.values(CASES)) k.w = W;
  CASES.ressort.x = CASES.eau.x = x2;
  kA = (W - 50) / 315; XA1 = XA0 + 315 * kA; XM = XA0 + 160 * kA; VA = 150 * kA;
  kB = GR ? (W - 35) / (NSP * 12) : 1; XB0 = x2 + 20; PAS = 12 * kB; VB = 150 * kB;
  KC = W / 365; VC = 120 * KC; LC = 30 * KC;
  EX = x2 + W / 2;
}
const S = { t: 0, running: false, pause: false, fait: false, jusqua: null, motif: '', emis: 0 };
const vu = nom => S.t >= T[nom] - 1e-6;

function bosse(x, xc, w) { return Math.exp(-(((x - xc) / w) ** 2)); }

/* ── Peinture des objets réels (canvas brut, AVANT la craie ; règle 32) ─── */
function lin(ctx, x0, y0, x1, y1, arrets) { const g = ctx.createLinearGradient(x0, y0, x1, y1); arrets.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
// Corde de chanvre torsadée : un cordon beige ombré, des torons en biais le long du tracé.
function peindreCorde(ctx, f, x0, x1) {
  const n = 120, pts = []; for (let i = 0; i <= n; i++) { const x = x0 + (x1 - x0) * i / n; pts.push([x, f(x)]); }
  const tracer = () => { ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); };
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 5; ctx.shadowOffsetY = 3;
  ctx.strokeStyle = '#7a5530'; ctx.lineWidth = 7; tracer(); ctx.stroke(); ctx.shadowColor = 'transparent';
  ctx.strokeStyle = '#c9a06a'; ctx.lineWidth = 5; tracer(); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,235,200,.55)'; ctx.lineWidth = 1.4; ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y - 1.6) : ctx.moveTo(x, y - 1.6))); ctx.stroke();
  // Torons : petits traits obliques, perpendiculaires au tracé, inclinés.
  ctx.strokeStyle = 'rgba(90,60,30,.75)'; ctx.lineWidth = 1.1;
  for (let x = x0 + 3; x < x1 - 2; x += 4.5) {
    const y = f(x), d = (f(x + 1) - f(x - 1)) / 2, L = Math.hypot(1, d), tx = 1 / L, ty = d / L, nx = -ty, ny = tx;
    ctx.beginPath(); ctx.moveTo(x - nx * 3 - tx * 1.8, y - ny * 3 - ty * 1.8); ctx.lineTo(x + nx * 3 + tx * 1.8, y + ny * 3 + ty * 1.8); ctx.stroke();
  }
  ctx.restore();
}
// Ressort à boudin en acier : brins avant clairs et brillants, brins arrière plus sombres.
function peindreRessort(ctx, pts) {
  ctx.save(); ctx.lineCap = 'round';
  const acier = (y0, y1, sombre) => lin(ctx, 0, y0, 0, y1, sombre
    ? [[0, '#4b535b'], [1, '#2c3137']]
    : [[0, '#8e98a2'], [.35, '#f3f6f8'], [.6, '#aeb7c0'], [1, '#59626b']]);
  ctx.lineWidth = 3; ctx.strokeStyle = acier(96, 144, true);
  for (let i = 1; i + 1 < pts.length; i += 2) { ctx.beginPath(); ctx.moveTo(...pts[i]); ctx.lineTo(...pts[i + 1]); ctx.stroke(); }   // brins arrière (bas → haut)
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 4; ctx.shadowOffsetX = 1; ctx.shadowOffsetY = 2;
  ctx.lineWidth = 3.6; ctx.strokeStyle = acier(96, 144, false);
  for (let i = 0; i + 1 < pts.length; i += 2) {                       // brins avant (haut → bas), légèrement bombés
    const [ax, ay] = pts[i], [bx, by] = pts[i + 1];
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo((ax + bx) / 2 + 3, (ay + by) / 2, bx, by); ctx.stroke();
  }
  ctx.restore();
}
// Haut-parleur : caisson noir, membrane conique grise, cache-noyau au centre.
function peindreHautParleur(ctx, x, y) {
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 6; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 3;
  ctx.fillStyle = lin(ctx, x - 34, 0, x - 12, 0, [[0, '#1d2126'], [.5, '#3b424a'], [1, '#22272c']]);
  ctx.beginPath(); ctx.roundRect(x - 34, y - 18, 22, 36, 3); ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.fillStyle = lin(ctx, 0, y - 32, 0, y + 32, [[0, '#9aa1a8'], [.5, '#50575e'], [1, '#2b3035']]);
  ctx.beginPath(); ctx.moveTo(x - 14, y - 12); ctx.lineTo(x, y - 32); ctx.lineTo(x + 2, y - 32); ctx.lineTo(x + 2, y + 32); ctx.lineTo(x, y + 32); ctx.lineTo(x - 14, y + 12); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(20,20,20,.8)'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(x + 1, y - 32); ctx.lineTo(x + 1, y + 32); ctx.stroke();   // suspension
  ctx.fillStyle = lin(ctx, 0, y - 7, 0, y + 7, [[0, '#d5dadf'], [1, '#5f666d']]);
  ctx.beginPath(); ctx.ellipse(x - 6, y, 3, 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
// Surface de l'eau vue de dessus : bassin bleu, reflets ; la goutte tombe au centre.
const BASSIN = k => [k.x + 8, k.y + 34, k.w - 16, k.h - 68];
function peindreBassin(ctx, k) {
  const [x, y, w, h] = BASSIN(k);
  const g = ctx.createRadialGradient(EX, EY, 6, EX, EY, w * 0.6);
  g.addColorStop(0, 'rgba(70,160,220,.55)'); g.addColorStop(1, 'rgba(18,70,130,.6)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(x, y, w, h, 10); ctx.fill();
  ctx.strokeStyle = 'rgba(190,225,245,.35)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.strokeStyle = 'rgba(230,248,255,.18)'; ctx.lineWidth = 1.2;
  for (const [a, b, l] of [[.12, .2, 40], [.7, .15, 55], [.2, .8, 50], [.78, .78, 35]]) { ctx.beginPath(); ctx.moveTo(x + a * w, y + b * h); ctx.lineTo(x + a * w + l, y + b * h - 3); ctx.stroke(); }
  // La goutte (vue de dessus) : perle d'eau claire.
  const gg = ctx.createRadialGradient(EX - 1.5, EY - 1.5, .5, EX, EY, 5); gg.addColorStop(0, '#ffffff'); gg.addColorStop(1, 'rgba(120,200,255,.9)');
  ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(EX, EY, 4.5, 0, Math.PI * 2); ctx.fill();
}

function dessiner(c) {
  scene.cadre(13); disposer();
  for (const [id, k] of Object.entries(CASES)) {
    c.rect(k.x, k.y, k.w, k.h, { couleur: 'tresfaible', largeur: 1.4, duree: .35 });
    c.texte(k.titre, k.x + 12, k.y + 24, { couleur: 'blanc', taille: f(17) });
    c.repere(id, k.x, k.y, k.w, k.h, { corde: 'la corde', ressort: 'le ressort', son: 'le son dans l’air', eau: 'les rides sur l’eau' }[id]);
  }
  // Décor fixe : la main en S, le haut-parleur, le point de chute de la goutte.
  c.texte('S', XA0 - 18, 126, { couleur: 'faible', taille: f(15) });
  c.texte('S', XB0 - 18, 126, { couleur: 'faible', taille: f(15) });
  // Le haut-parleur et le bassin d'eau sont peints (ci-dessous, sous la craie).
  c.direct(() => {
    const t = S.t, joue = S.running || S.pause || S.fait;
    peindreHautParleur(c.ctx, SPX - 2, SPY);
    peindreBassin(c.ctx, CASES.eau);
    /* ── La corde (peinte : une vraie corde torsadée) ── */
    const xa = XA0 + VA * (t - A0), ya = x => 120 - (joue && t > A0 ? 38 * bosse(x, xa, 22) : 0);
    peindreCorde(c.ctx, ya, XA0, XA1);
    c.point(XM, ya(XM), 6, 'rouge'); c.texte('M', XM - 6, 146, { couleur: 'rouge', taille: f(15) });
    if (t >= T.corde - 0.35) {
      c.fleche(XA0 + 40, 64, XA1 - 30, 64, { couleur: 'cyan', largeur: 2 }); c.texte('propagation', XA0 + 80 * kA, 56, { couleur: 'cyan', taille: f(15) });
      c.fleche(XM + 18, 128, XM + 18, 78, { couleur: 'orange', largeur: 2.2, tete: 9 }); c.fleche(XM + 18, 78, XM + 18, 128, { couleur: 'orange', largeur: 2.2, tete: 9 });
      c.texte('M monte, descend', XM + 28, 100, { couleur: 'orange', taille: f(15) });
      c.repere('fleches_corde', XA0 + 30, 44, XA1 - XA0 - 30, 90, 'le mouvement de M et la propagation');
    }
    if (t >= T.corde + 0.5) {
      c.texte('⊥ : onde transversale', 24, 194, { couleur: 'jaune', taille: f(17) });
      c.repere('corde_type', 18, 174, 220, 28, 'perpendiculaires : transversale');
    }
    /* ── Le ressort ── */
    const xb = XB0 + VB * (t - B0), dep = x0 => (joue && t > B0 ? 11 * bosse(x0, xb, 24) : 0);
    const pts = [];
    for (let i = 0; i <= NSP; i++) { const x0 = XB0 + i * PAS; pts.push([x0 + dep(x0), 100], [x0 + PAS / 2 + dep(x0 + PAS / 2), 140]); }
    peindreRessort(c.ctx, pts);
    const xm = XB0 + IM * PAS; c.point(xm + dep(xm), 100, 6, 'rouge'); c.texte('M', xm - 6, 92, { couleur: 'rouge', taille: f(15) });
    if (t >= T.ressort - 0.35) {
      c.fleche(XB0 + 30, 64, XB0 + 315 * kB, 64, { couleur: 'cyan', largeur: 2 }); c.texte('propagation', XB0 + 65 * kB, 56, { couleur: 'cyan', taille: f(15) });
      c.fleche(xm - 22, 158, xm + 24, 158, { couleur: 'orange', largeur: 2.2, tete: 9 }); c.fleche(xm + 24, 158, xm - 22, 158, { couleur: 'orange', largeur: 2.2, tete: 9 });
      c.texte('M avance, recule', xm + 34, 164, { couleur: 'orange', taille: f(15) });
      c.repere('fleches_ressort', XB0, 44, 340 * kB, 130, 'le mouvement de M et la propagation');
    }
    if (t >= T.ressort + 0.5) {
      c.texte('∥ : onde longitudinale', CASES.ressort.x + 14, 194, { couleur: 'jaune', taille: f(17) });
      c.repere('ressort_type', CASES.ressort.x + 8, 174, GR ? 300 : 230, 28, 'même direction : longitudinale');
    }
    /* ── Le son ── */
    const fc = VC * (t - C0);                       // rayon du front
    if (joue && t > C0) {
      for (let r = fc % LC; r <= Math.min(fc, 300 * KC); r += LC) {
        if (r < 8) continue;
        const k = CASES.son, dans = (x, y) => x > k.x + 4 && x < k.x + k.w - 4 && y > k.y + 34 && y < k.y + k.h - 30;
        c.courbe(u => { const a = -1.3 + 2.6 * u, x = SPX + r * Math.cos(a), y = SPY + r * Math.sin(a); return dans(x, y) ? [x, y] : null; }, 40, { couleur: 'cyan', largeur: 1.6, alpha: .75 });
      }
    }
    // Grains d'air : ils vont et viennent le long de la propagation (longitudinale), seulement là où le son est arrivé.
    for (let i = 0; i < 9; i++) for (let j = -2; j <= 2; j++) {
      const x0 = SPX + 40 + i * 30 * KC, y0 = SPY + j * 26, r = Math.hypot(x0 - SPX, y0 - SPY), a = Math.atan2(y0 - SPY, x0 - SPX);
      const d = joue && t > C0 && r < fc ? 6 * KC * Math.sin(2 * Math.PI * (r - fc) / LC) : 0;
      const marque = i === 4 && j === 0;
      c.point(x0 + d * Math.cos(a), y0 + d * Math.sin(a), marque ? 5 : 2.4, marque ? 'rouge' : 'faible');
    }
    if (t >= T.son - 0.4) {
      c.fleche(SPX + 40 + 80 * KC - 16, SPY + 22, SPX + 40 + 80 * KC + 16, SPY + 22, { couleur: 'orange', largeur: 2, tete: 8 }); c.fleche(SPX + 40 + 80 * KC + 16, SPY + 22, SPX + 40 + 80 * KC - 16, SPY + 22, { couleur: 'orange', largeur: 2, tete: 8 });
      c.texte('∥ : longitudinale', 24, 400, { couleur: 'jaune', taille: f(17) });
      c.texte('pas dans le vide', GR ? 240 : 200, 400, { couleur: 'blanc', taille: f(15) });
      c.repere('son_type', 18, 380, GR ? 420 : 330, 28, 'le son : longitudinale, il lui faut un milieu matériel');
    }
    /* ── L'eau, vue de dessus ── */
    const fd = VD * (t - D0);
    if (joue && t > D0) {   // les rides restent sur l'eau du bassin
      c.ctx.save(); c.ctx.beginPath(); c.ctx.roundRect(...BASSIN(CASES.eau), 10); c.ctx.clip();
      for (let k = 0; k < 4; k++) { const r = fd - k * 24; if (r > 4 && r < 92) c.cercle(EX, EY, r, { couleur: '#bfe6ff', largeur: 1.8, alpha: .85 - k * .15 }); }
      c.ctx.restore();
    }
    if (t >= T.eau - 0.2) {
      // Les flèches verticales s'arrêtent dans le bassin (il est moins haut que large) : rien ne sort du cadre.
      for (const a of [0, Math.PI / 2, Math.PI, -Math.PI / 2]) { const l = Math.abs(Math.sin(a)) > .5 ? 50 : 72; c.fleche(EX + 30 * Math.cos(a), EY + 30 * Math.sin(a), EX + l * Math.cos(a), EY + l * Math.sin(a), { couleur: 'cyan', largeur: 1.6, tete: 7 }); }
      c.texte('⊥ : transversale', CASES.eau.x + 14, 400, { couleur: 'jaune', taille: f(17) });
      c.repere('eau_type', CASES.eau.x + 8, 380, GR ? 260 : 200, 28, 'l’eau monte et descend : transversale');
    }
    /* ── Les dimensions, écrites à la fin ── */
    if (vu('fin')) {
      const dims = { corde: '1 dimension', ressort: '1 dimension', son: '3 dimensions', eau: '2 dimensions' };
      for (const [id, k] of Object.entries(CASES)) {
        c.texte(dims[id], k.x + k.w - 12, k.y + 24, { couleur: 'vert', taille: f(17), align: 'right' });
        c.repere({ corde: 'dim_corde', ressort: 'dim_ressort', son: 'dim_son', eau: 'dim_eau' }[id], k.x + k.w - (GR ? 160 : 120), k.y + 6, GR ? 154 : 114, GR ? 30 : 26, dims[id]);
      }
    }
  });
  return c.fin();
}

const canvas = $('canvas');
const scene = window.OndesTableau.Scene(canvas, dessiner, { large: true });
scene.avancer = dt => {
  if (!S.running) return false;
  S.t = Math.min(TFIN, S.t + dt);
  if (arreterSiInstantAtteint()) return true;
  if (S.t >= TFIN) {
    S.running = false; S.fait = true; $('run').textContent = 'Secouer';
    bulle($('feedback'), 'Corde et eau : transversales. Ressort et son : longitudinales.', 'good');
    pont.noter('finished'); pont.emettre();
  } else if (performance.now() - S.emis > 400) { S.emis = performance.now(); pont.emettre(); }
  return true;
};
const MOTIFS = {
  corde: 'la bosse passe en M : M monte pendant que l’onde va vers la droite',
  ressort: 'la compression passe en M : M avance dans le sens de la propagation',
  son: 'le son avance dans l’air : les grains d’air vont et viennent dans le même sens',
  eau: 'les rides s’étalent sur la surface de l’eau',
  fin: 'les dimensions sont écrites : 1, 1, 3 et 2',
};
function playUntil(p) {
  const nom = p.moment in T ? p.moment : null, cible = nom ? T[nom] : +p.progress * TFIN;
  if (!Number.isFinite(cible)) return;
  if (!(S.running || S.pause) || S.t >= cible - 1e-3) start();
  S.jusqua = cible; S.motif = nom ? MOTIFS[nom] : '';
  if (S.pause) { S.running = true; S.pause = false; $('run').textContent = 'Pause'; }
  pont.noter('play_until', { moment: nom }); pont.emettre();
}
function arreterSiInstantAtteint() {
  if (S.jusqua == null || S.t < S.jusqua) return false;
  S.t = S.jusqua; S.jusqua = null; S.running = false; S.pause = true; $('run').textContent = 'Reprendre';
  bulle($('feedback'), 'Arrêt sur image : ' + (S.motif || 'instant choisi') + '.'); pont.noter('pause'); pont.emettre();
  return true;
}
function ceQuiSeVoit() {
  const m = ['Quatre cases : une corde torsadée (en haut à gauche), un ressort d’acier (en haut à droite), le son dans l’air sortant d’un haut-parleur (en bas à gauche), un bassin d’eau vu de dessus (en bas à droite). Un point M rouge dans chaque onde.'];
  if (S.t <= 0) m.push('Rien n’a encore été secoué.');
  else {
    m.push(`t = ${S.t.toFixed(1)} s.`);
    if (S.t < T.corde + 1.4 && S.t > A0) m.push('Une bosse avance sur la corde vers la droite ; M monte puis descend.');
    if (vu('corde')) m.push('Corde : M bouge de haut en bas (flèche orange), la propagation va vers la droite (flèche cyan) : perpendiculaires, « ⊥ : onde transversale » écrit.');
    if (vu('ressort')) m.push('Ressort : la spire M avance et recule dans le sens de la propagation : « ∥ : onde longitudinale » écrit.');
    if (vu('son')) m.push('Son : des arcs de compression partent du haut-parleur ; les grains d’air vont et viennent dans le sens de propagation : « ∥ : longitudinale », « pas dans le vide ».');
    if (vu('eau')) m.push('Eau : des cercles s’étalent autour du point de chute : « ⊥ : transversale ».');
    if (vu('fin')) m.push('Écrit en vert : corde 1 dimension, ressort 1 dimension, son 3 dimensions, eau 2 dimensions.');
  }
  return m.join(' ');
}
function start() { S.jusqua = null; S.t = 0; S.running = true; S.pause = false; S.fait = false; $('run').textContent = 'Pause'; bulle($('feedback'), 'Regarde le point M rouge et la direction où va l’onde…'); pont.noter('start'); pont.emettre(); }
function pause() { if (!S.running) return; S.jusqua = null; S.running = false; S.pause = true; $('run').textContent = 'Reprendre'; bulle($('feedback'), 'Arrêt sur image.'); pont.noter('pause'); pont.emettre(); }
function resume() { if (S.running || !S.pause) return start(); S.running = true; S.pause = false; $('run').textContent = 'Pause'; pont.noter('resume'); pont.emettre(); }
// Diapositive pilotée (professeur 39) : `reset` FIGE la scène — sur ?depart=<moment> (tout ce qui précède déjà
// écrit) ou sur zéro — et rien ne court seul ; la voix avance ensuite par play_until.
const URL_DEPART = new URLSearchParams(location.search).get('depart');
function reset() {
