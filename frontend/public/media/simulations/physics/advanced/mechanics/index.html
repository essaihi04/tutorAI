:'ΣMΔ = JΔ·α',title:'Mesure l’accélération angulaire',instruction:'Garde le couple constant et change J.',goal:'Vérifier α = M/J et Ec = ½Jω².'},oscillator:{label:'6 · Oscillateurs et résonance',image:IMG+'oscillations_lab.webp',step:'EXPÉRIENCE 6/6',scene:'La résonance dépend de la fréquence et de l’amortissement',caption:'L’amplitude culmine près de la fréquence propre.',kicker:'ω₀ = √(k/m)',title:'Trace une courbe de résonance',instruction:'Mesure sous, près et au-dessus de la fréquence propre.',goal:'Identifier la résonance et l’effet de l’amortissement.'}};

const G=6.67430e-11,Mearth=5.972e24,Rearth=6.371e6,g=9.81;const requested=new URLSearchParams(location.search).get('variant');const S={variant:DATA[requested]?requested:'newton',status:'idle',actions:[],completed:[],attempts:0,hints:0,measurements:Object.fromEntries(Object.keys(DATA).map(k=>[k,[]])),params:{mass:1,force:6,mu:.12,drag:.35,time:2,motionMode:'projectile',v0:18,particleV:2e6,angle:45,B:.4,charge:1.602e-19,particleMass:1.673e-27,altitude:400,inertia:.25,torque:1.5,springK:20,damping:.3,driverF:.7}};

function values(){const p=S.params;if(S.variant==='newton'){const friction=p.mu*p.mass*g,net=Math.max(0,p.force-friction),a=net/p.mass,v=a*p.time,x=.5*a*p.time*p.time;return{friction_n:+friction.toFixed(3),net_force_n:+net.toFixed(3),acceleration_m_s2:+a.toFixed(3),velocity_m_s:+v.toFixed(3),position_m:+x.toFixed(3),work_j:+(net*x).toFixed(3),kinetic_energy_j:+(.5*p.mass*v*v).toFixed(3)}}if(S.variant==='fall'){const tau=p.mass/p.drag,vlim=p.mass*g/p.drag,t=p.time*tau,v=vlim*(1-Math.exp(-p.time)),z=vlim*(t-tau*(1-Math.exp(-p.time)));return{time_constant_s:+tau.toFixed(3),time_s:+t.toFixed(3),terminal_speed_m_s:+vlim.toFixed(2),speed_m_s:+v.toFixed(2),speed_over_terminal:+(v/vlim).toFixed(3),distance_m:+z.toFixed(2),acceleration_m_s2:+(g*Math.exp(-p.time)).toFixed(2)}}if(S.variant==='projectile'){if(p.motionMode==='lorentz'){const r=p.particleMass*p.particleV/(Math.abs(p.charge)*p.B),period=2*Math.PI*p.particleMass/(Math.abs(p.charge)*p.B);return{motion_mode:'lorentz',radius_m:+r.toFixed(4),period_s:+period.toExponential(3),speed_m_s:p.particleV,magnetic_field_t:p.B,kinetic_energy_j:+(.5*p.particleMass*p.particleV*p.particleV).toExponential(3)}}const th=p.angle*Math.PI/180,T=2*p.v0*Math.sin(th)/g,R=p.v0*p.v0*Math.sin(2*th)/g,H=p.v0*p.v0*Math.sin(th)**2/(2*g);return{motion_mode:'projectile',flight_time_s:+T.toFixed(3),range_m:+R.toFixed(3),max_height_m:+H.toFixed(3),vx_m_s:+(p.v0*Math.cos(th)).toFixed(3),initial_vy_m_s:+(p.v0*Math.sin(th)).toFixed(3)}}if(S.variant==='orbit'){const r=Rearth+p.altitude*1000,v=Math.sqrt(G*Mearth/r),T=2*Math.PI*Math.sqrt(r**3/(G*Mearth));return{altitude_km:p.altitude,orbital_radius_km:+(r/1000).toFixed(1),orbital_speed_km_s:+(v/1000).toFixed(3),period_s:+T.toFixed(1),period_h:+(T/3600).toFixed(3),geostationary:Math.abs(T-86164)<1800&&p.altitude>30000,gravity_m_s2:+(G*Mearth/r**2).toFixed(3)}}if(S.variant==='rotation'){const alpha=p.torque/p.inertia,w=alpha*p.time,theta=.5*alpha*p.time*p.time;return{angular_acceleration_rad_s2:+alpha.toFixe function snap(extra={}){return Object.assign({simulation_status:S.status,current_variant:S.variant,skill:DATA[S.variant].goal,parameters:{...S.params},derived_values:values(),measurements:[...S.measurements[S.variant]],attempts:S.attempts,hints_used:S.hints,completed_variants:[...S.completed],expected_answer:DATA[S.variant].goal},extra)}function emit(extra={}){parent.postMessage({type:'simulation_state',simulation_id:window.SIMULATION_CONFIG.id,student_actions:S.actions,current_state:snap(extra),objective_progress:S.completed.length/6,timestamp:Date.now()},'*')}function manifest(){window.__SIMULATION_MANIFEST_SENT__=true;parent.postMessage({type:'simulation_manifest',simulation_id:window.SIMULATION_CONFIG.id,capabilities:{commands:window.SIMULATION_CONFIG.commands,globals:['executeAICommand','setVariant','setParameters','runModel','recordMeasurement','checkExperiment'],config:window.SIMULATION_CONFIG,command_schema:window.SIMULATION_CONFIG.command_schema,state_schema:window.SIMULATION_CONFIG.state_schema},page_text:'MecaLab calcule Newton, énergie, chute freinée, projectile, Lorentz, orbites, rotation et résonance. Le tuteur reçoit paramètres, résultats, essais et objectifs.'},'*')}
function slider(id,label,min,max,step,value,unit){return`<div class="control"><label for="${id}"><span>${label}</span><b>${value} ${unit}</b></label><input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${value}"></div>`}function metric(l,v){return`<div class="metric"><small>${l}</small><strong>${v}</strong></div>`}function bind(id,key){$(id).onchange=e=>{S.params[key]=+e.target.value;act('set_parameter',{parameter:key,value:S.params[key]});renderControls();emit({last_manipulation:{parameter:key,value:S.params[key]}})}}
function renderControls(){const p=S.params,d=values();if(S.variant==='newton'){E.controls.innerHTML=`${slider('mass','Masse m',.2,5,.1,p.mass,'kg')}${slider('force','Force appliquée',0,20,.5,p.force,'N')}${slider('mu','Frottement μ',0,.5,.02,p.mu,'')}${slider('time','Temps',.5,5,.5,p.time,'s')}<div class="metrics">${metric('ΣF',d.net_force_n+' N')}${metric('a',d.acceleration_m_s2+' m/s²')}${metric('ΔEc',d.kinetic_energy_j+' J')}${metric('Travail',d.work_j+' J')}</div>`;bindAll(['mass','force','mu','time'])}else if(S.variant==='fall'){E.controls.innerHTML=`${slider('mass','Masse m',.05,2,.05,p.mass,'kg')}${slider('drag','Coefficient k',.05,1,.05,p.drag,'kg/s')}${slider('time','Temps',0,6,.25,p.time,'× τ')}<div class="metrics">${metric('τ',d.time_constant_s+' s')}${metric('vlim',d.terminal_speed_m_s+' m/s')}${metric('v/vlim',d.speed_over_terminal)}${metric('a',d.acceleration_m_s2+' m/s²')}</div>`;bindAll(['mass','drag','time'])}else if(S.variant==='projectile'){E.controls.innerHTML=`<div class="control"><div class="control-title"><span>Mouvement</span></div><div class="seg"><button data-motion="projectile" class="${p.motionMode==='projectile'?'active':''}">Projectile</button><button data-motion="lorentz" class="${p.motionMode==='lorentz'?'active':''}">Charge dans B</button></div></div>${slider('v0','Vitesse v₀',5,40,1,p.v0,'m/s')}${p.motionMode==='projectile'?slider('angle','Angle α',10,80,1,p.angle,'°'):slider('B','Champ B',.1,1,.05,p.B,'T')}<div class="metrics">${p.motionMode==='projectile'?metric('Portée',d.range_m+' m')+metric('Hauteur',d.max_height_m+' m')+metric('Durée',d.flight_time_s+' s')+metric('vx',d.vx_m_s+' m/s'):metric('Rayon',d.radius_m+' m')+metric('Période',d.period_s+' s')+metric('Vitesse',d.speed_m_s+' m/s')+metric('Énergie',d.kinetic_energy_j+' J')}</div>`;bind('v0','v0');if(p.motionMode==='projectile')bind('angle','angle');else bind('B','B');document.querySelectorAll('[data-motion]').forEach(b=>b.onclick=()=>{p.motionMode=b.dataset.motion;act('set const baseRenderControls=renderControls;renderControls=function(){baseRenderControls();if(S.variant==='projectile'&&S.params.motionMode==='lorentz'){const input=$('v0'),label=input?.closest('.control')?.querySelector('label'),speedMetric=[...document.querySelectorAll('.metric')].find(x=>x.querySelector('small')?.textContent==='Vitesse');if(speedMetric)speedMetric.querySelector('strong').textContent=(S.params.particleV/1e6).toFixed(1)+'×10⁶ m/s';if(input&&label){input.min='.5';input.max='8';input.step='.1';input.value=String(S.params.particleV/1e6);label.querySelector('span').textContent='Vitesse v';label.querySelector('b').textContent=(S.params.particleV/1e6).toFixed(1)+' ×10⁶ m/s';input.onchange=e=>{S.params.particleV=+e.target.value*1e6;act('set_parameter',{parameter:'particleV',value:S.params.particleV});renderControls();emit({last_manipulation:{parameter:'particleV',value:S.params.particleV}})}}}};
function bindAll(ids){ids.forEach(id=>bind(id,id))}function setVariant(id){if(!DATA[id])return;S.variant=id;S.status='running';S.attempts=0;const d=DATA[id];act('set_variant',{variant_id:id});E.variant.value=id;E.image.src=d.image;E.sceneStep.textContent=d.step;E.sceneTitle.textContent=d.scene;E.sceneCaption.textContent=d.caption;E.kicker.textContent=d.kicker;E.title.textContent=d.title;E.instruction.textContent=d.instruction;E.status.textContent='En manipulation';renderHotspots();renderControls();feedback('Fais une prédiction, puis simule.');progress();emit()}
function renderHotspots(){const sets=S.variant==='orbit'?[['earth','Terre',34,48],['low','Orbite basse',59,42],['geo','Géostationnaire',78,28]]:S.variant==='oscillator'?[['spring','Ressort',24,56],['pendulum','Pendule',58,48],['driver','Excitateur',82,57]]:[['sensor','Capteur',25,48],['object','Mobile',53,53],['screen','Repère',80,42]];E.hotspots.innerHTML=sets.map(x=>`<button class="hotspot" id="hot-${x[0]}" style="left:${x[2]}%;top:${x[3]}%">${x[1]}</button>`).join('');E.hotspots.querySelectorAll('button').forEach(b=>b.onclick=()=>highlight(b.id.slice(4)))}
function runModel(){S.status='running';act('run_model',{parameters:{...S.params},result:values()});E.status.textContent='Calcul terminé';feedback('Trajectoire et grandeurs calculées : enregistre pour comparer.','ok');draw();emit({last_manipulation:{type:'run_model',result:values()}})}function recordMeasurement(){const item={...values(),parameters:{...S.params},index:S.measurements[S.variant].length+1};S.measurements[S.variant].push(item);act('record_measurement',item);feedback('Essai '+item.index+' enregistré.','ok');updateLog();emit({last_measurement:item})}
function checkExperiment(){S.attempts++;const m=S.measurements[S.variant];let correct=false,errors=[];if(S.variant==='newton'){correct=m.length>=2&&new Set(m.map(x=>x.parameters.mass)).size>=2&&m.every(x=>Math.abs(x.work_j-x.kinetic_energy_j)<Math.max(.02,.03*x.kinetic_energy_j));if(m.length<2)errors.push('deux masses');if(!m.every(x=>Math.abs(x.work_j-x.kinetic_energy_j)<Math.max(.02,.03*x.kinetic_energy_j)))errors.push('travail = ΔEc')}else if(S.variant==='fall'){correct=m.length>=2&&new Set(m.map(x=>x.parameters.drag)).size>=2&&m.some(x=>x.speed_over_terminal>.98);if(m.length<2)errors.push('deux frottements');if(!m.some(x=>x.speed_over_terminal>.98))errors.push('atteindre au moins 4τ')}else if(S.variant==='projectile'){correct=m.some(x=>x.motion_mode==='projectile')&&m.some(x=>x.motion_mode==='lorentz');if(!m.some(x=>x.motion_mode==='projectile'))errors.push('projectile');if(!m.some(x=>x.motion_mode==='lorentz'))errors.push('charge dans B')}else if(S.variant==='orbit'){correct=m.some(x=>x.altitude_km<2000)&&m.some(x=>x.geostationary);if(!m.some(x=>x.altitude_km<2000))errors.push('orbite basse');if(!m.some(x=>x.geostationary))errors.push('orbite géostationnaire')}else if(S.variant==='rotation'){correct=m.length>=2&&new Set(m.map(x=>x.parameters.inertia)).size>=2&&m.every(x=>Math.abs(x.kinetic_energy_j-x.torque_work_j)<Math.max(.03,.03*x.kinetic_energy_j));if(m.length<2)errors.push('deux moments d’inertie')}else{const ratios=m.map(x=>x.frequency_ratio);correct=ratios.some(x=>x<.8)&&ratios.some(x=>Math.abs(x-1)<.16)&&ratios.some(x=>x>1.2);if(!ratios.some(x=>x<.8))errors.push('f < 0,8f₀');if(!ratios.some(x=>Math.abs(x-1)<.16))errors.push('f ≈ f₀');if(!ratios.some(x=>x>1.2))errors.push('f > 1,2f₀')}act('check_experiment',{correct,errors});if(!correct){feedback('À compléter : '+errors.join(' · '),'no');emit({correct:false,errors});return}if(!S.completed.includes(S.variant))S.completed.push(S.variant);S.status='finished';E.status.textContent='Expérience réussie';feedback('✓ La comparaison confirme la loi physique.','ok');progress();emit({correct:true,validated_measurements:m})}
function updateLog(){E.log.innerHTML=Object.keys(DATA).map(id=>`<span class="chip ${S.completed.includes(id)?'done':''}">${S.completed.includes(id)?'✓ ':''}${DATA[id].label.split('·')[1]}</span>`).join('')}function progress(){E.progressText.textContent=S.completed.length+'/6';E.progressFill.style.width=S.completed.length/6*100+'%';updateLog()}function feedback(t,type=''){E.feedback.className='feedback'+(type?' '+type:'');E.feedback.textContent=t}
function revealHint(level=++S.hints){const h={newton:['Commence par identifier la résultante.','À force constante, a diminue quand m augmente.','Compare travail de ΣF et variation de Ec.'],fall:['τ = m/k.','Après 4τ, v est proche de vlim.','Compare deux valeurs de k.'],projectile:['Le projectile conserve vx.','La force magnétique est perpendiculaire à v.','Enregistre les deux modes.'],orbit:['Plus l’orbite est haute, plus v diminue et T augmente.','La période géostationnaire vaut environ 23 h 56 min.','Utilise les deux boutons de préréglage.'],rotation:['J remplace m dans la dynamique de rotation.','À couple constant, α diminue lorsque J augmente.','Compare Mθ à Ec.'],oscillator:['Calcule d’abord f₀.','Le maximum apparaît près de f/f₀ = 1.','Mesure en dessous, au voisinage et au-dessus.']}[S.variant];const t=h[Math.min(level-1,2)];S.hints=Math.max(S.hints,level);act('request_hint',{level});feedback('💡 '+t);show(t);emit({last_hint:t})}function highlight(target){const b=$('hot-'+target);if(b){b.classList.remove('active');void b.offsetWidth;b.classList.add('active')}act('highlight',{target});show('Observe : '+target);emit({last_highlight:target})}function show(t){E.guide.textContent='🤖 '+t;E.guide.classList.add('show');clearTimeout(show.timer);show.timer=setTimeout(()=>E.guide.classList.remove('show'),3500)}
function resize(){const r=E.canvas.getBoundingClientRect(),d=devicePixelRatio||1;E.canvas.width=Math.max(1,r.width*d);E.canvas.height=Math.max(1,r.height*d);draw()}function prep(){const ctx=E.canvas.getContext('2d'),d=devicePixelRatio||1,W=E.canvas.width/d,H=E.canvas.height/d;ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,W,H);ctx.fillStyle='#f8fbff';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#e0e6ef';for(let x=35;x<W;x+=45){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=30;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}return{ctx,W,H}}
function draw(){const {ctx,W,H}=prep();if(S.variant==='newton')drawNewton(ctx,W,H);else if(S.variant==='fall')drawFall(ctx,W,H);else if(S.variant==='projectile')drawPlane(ctx,W,H);else if(S.variant==='orbit')drawOrbit(ctx,W,H);else if(S.variant==='rotation')drawRotation(ctx,W,H);else drawOscillator(ctx,W,H)}
function arrow(ctx,x1,y1,x2,y2,color,label){ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();const a=Math.atan2(y2-y1,x2-x1);ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-12*Math.cos(a-.5),y2-12*Math.sin(a-.5));ctx.lineTo(x2-12*Math.cos(a+.5),y2-12*Math.sin(a+.5));ctx.fill();ctx.font='bold 12px sans-serif';ctx.fillText(label,x2+5,y2-5)}
function drawNewton(ctx,W,H){const d=values(),x=Math.min(W*.75,60+d.position_m*14),y=H*.65;ctx.fillStyle='#3157c8';ctx.fillRect(x,y-45,85,38);ctx.fillStyle='#172033';for(const dx of[15,70]){ctx.beginPath();ctx.arc(x+dx,y,12,0,Math.PI*2);ctx.fill()}arrow(ctx,x+42,y-22,x+42+Math.min(130,S.params.force*7),y-22,'#ef7d32','F');arrow(ctx,x+42,y-15,x+42-Math.min(100,d.friction_n*8),y-15,'#c83a55','f');E.note.textContent=`a = ${d.acceleration_m_s2} m/s² · WΣF = ${d.work_j} J · Ec = ${d.kinetic_energy_j} J`}
function drawFall(ctx,W,H){const d=values(),y=35+Math.min(H-90,d.distance_m*3);ctx.strokeStyle='#8895a8';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W*.5,20);ctx.lineTo(W*.5,H-30);ctx.stroke();ctx.fillStyle='#3157c8';ctx.beginPath();ctx.arc(W*.5,y,18,0,Math.PI*2);ctx.fill();arrow(ctx,W*.5+25,y,W*.5+25,y+65,'#ef7d32','P');arrow(ctx,W*.5-25,y,W*.5-25,y-50*d.speed_over_terminal,'#16a6b6','f');E.note.textContent=`v/vlim = ${d.speed_over_terminal} · a = ${d.acceleration_m_s2} m/s²`}
function drawPlane(ctx,W,H){const d=values();ctx.strokeStyle='#8793a7';ctx.beginPath();ctx.moveTo(35,H-35);ctx.lineTo(W-20,H-35);ctx.stroke();if(d.motion_mode==='lorentz'){const r=Math.min(H*.32,W*.25),cx=W*.53,cy=H*.5;ctx.strokeStyle='#3157c8';ctx.lineWidth=4;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();for(let x=40;x<W;x+=50)for(let y=35;y<H-35;y+=50){ctx.fillStyle='#778499';ctx.fillText('×',x,y)}E.note.textContent=`r = mv/(|q|B) = ${d.radius_m} m`}else{const th=S.params.angle*Math.PI/180,T=d.flight_time_s,R=d.range_m,Hm=d.max_height_m;ctx.strokeStyle='#3157c8';ctx.lineWidth=4;ctx.beginPath();for(let i=0;i<=100;i++){const t=T*i/100,x=35+(W-70)*(S.params.v0*Math.cos(th)*t/R),yy=H-35-(H-75)*(S.params.v0*Math.sin(th)*t-.5*g*t*t)/Hm;i?ctx.lineTo(x,yy):ctx.moveTo(x,yy)}ctx.stroke();E.note.textContent=`Portée = ${d.range_m} m · Hmax = ${d.max_height_m} m`}}
function drawOrbit(ctx,W,H){const d=values(),cx=W*.48,cy=H*.5,earth=Math.min(W,H)*.13,scale=earth+Math.min(Math.min(W,H)*.34,S.params.altitude/45000*Math.min(W,H)*.25+30);ctx.fillStyle='#2b72c4';ctx.beginPath();ctx.arc(cx,cy,earth,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ef7d32';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,scale,0,Math.PI*2);ctx.stroke();const a=-.6;ctx.fillStyle='#172033';ctx.fillRect(cx+scale*Math.cos(a)-8,cy+scale*Math.sin(a)-5,16,10);E.note.textContent=`h = ${d.altitude_km} km · v = ${d.orbital_speed_km_s} km/s · T = ${d.period_h} h`}
function drawRotation(ctx,W,H){const d=values(),cx=W*.5,cy=H*.52,r=Math.min(W,H)*.25;ctx.strokeStyle='#3157c8';ctx.lineWidth=12;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#172033';ctx.beginPath();ctx.arc(cx,cy,9,0,Math.PI*2);ctx.fill();arrow(ctx,cx+r*.65,cy-r*.75,cx+r*1.12,cy-r*.28,'#ef7d32','M');E.note.textContent=`α = ${d.angular_acceleration_rad_s2} rad/s² · Ec = ${d.kinetic_energy_j} J`}
function drawOscillator(ctx,W,H){const p=S.params,d=values(),y=H*.5,x0=50,xm=W*.45,amp=Math.min(W*.18,d.amplitude_m*2000);ctx.strokeStyle='#3157c8';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x0,y);for(let i=1;i<=20;i++){const x=x0+(xm-x0)*i/20,yy=y+(i%2?18:-18);ctx.lineTo(x,yy)}ctx.lineTo(xm,y);ctx.stroke();ctx.fillStyle='#ef7d32';ctx.fillRect(xm+amp*.35,y-35,65,70);ctx.strokeStyle='#16a6b6';ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<=200;i++){const ratio=.2+i/200*2,omega=2*Math.PI*d.natural_frequency_hz*ratio,A=1/Math.sqrt((p.springK-p.mass*omega*omega)**2+(p.damping*omega)**2),x=W*.55+i/200*(W*.42),yy=H*.85-Math.min(H*.65,A*H*18);i?ctx.lineTo(x,yy):ctx.moveTo(x,yy)}ctx.stroke();E.note.textContent=`f/f₀ = ${d.frequency_ratio} · A = ${d.amplitude_m} m`}
function setParameters(p){const map={mass_kg:'mass',force_n:'force',friction_coefficient:'mu',drag_kg_s:'drag',time_s:'time',motion_mode:'motionMode',initial_speed_m_s:'v0',particle_speed_m_s:'particleV',launch_angle_deg:'angle',magnetic_field_t:'B',altitude_km:'altitude',moment_inertia_kg_m2:'inertia',torque_n_m:'torque',spring_constant_n_m:'springK',damping_kg_s:'damping',driver_frequency_hz:'driverF'};Object.entries(p||{}).forEach(([k,v])=>{const key=map[k]||k;if(key in S.params)S.params[key]=typeof S.params[key]==='number'?+v:v});act('set_parameters',{...p});renderControls();emit({last_manipulation:{type:'set_parameters',...p}})}function reset(){S.measurements[S.variant]=[];S.attempts=0;act('reset');setVariant(S.variant)}
E.variant.innerHTML=Object.entries(DATA).map(([id,d])=>`<option value="${id}">${d.label}</option>`).join('');E.variant.onchange=e=>setVariant(e.target.value);$('run').onclick=runModel;$('record').onclick=recordMeasurement;$('check').onclick=checkExperiment;$('reset').onclick=reset;$('hint').onclick=()=>revealHint();addEventListener('resize',resize);addEventListener('message',e=>{const d=e.data||{};if(d.type==='simulation_control'&&(!d.simulation_id||d.simulation_id===window.SIMULATION_CONFIG.id))executeAICommand(d.command,d.parameters||{})});window.setVariant=setVariant;window.setParameters=setParameters;window.runModel=runModel;window.recordMeasurement=recordMeasurement;window.checkExperiment=checkExperiment;window.executeAICommand=(c,p={})=>{if(c==='start')S.status='running';else if(c==='set_variant')setVariant(p.variant_id);else if(c==='set_parameters')setParameters(p);else if(c==='run_model')runModel();else if(c==='record_measurement')recordMeasurement();else if(c==='check')checkExperiment();else if(c==='reset')reset();else if(c==='reveal_hint')revealHint(+p.level||1);else if(c==='highlight')highlight(p.target);emit()};setVariant(S.variant);resize();manifest();setTimeout(manifest,350);
</script></body></html>
