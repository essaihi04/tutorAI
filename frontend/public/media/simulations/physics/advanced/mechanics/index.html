  params: { mass: 1, force: 6, mu: .12, drag: .35, time: 2, motionMode: 'projectile', v0: 18, particleV: 2e6, angle: 45, B: .4, charge: 1.602e-19, particleMass: 1.673e-27, altitude: 400, inertia: .25, torque: 1.5, springK: 20, damping: .3, driverF: .7 },

  page_text: 'MecaLab, dessiné au tableau, calcule Newton, énergie, chute freinée, projectile, Lorentz, orbites, rotation et résonance. Le schéma, les vecteurs forces et la courbe s’écrivent à la craie ; le tuteur reçoit paramètres, résultats, essais et objectifs.',

  values(v, p) {

    if (v === 'rotation') { const alpha = p.torque / p.inertia, w = alpha * p.time, theta = .5 * alpha * p.time * p.time; return { angular_acceleration_rad_s2: +alpha.toFixed(3), angular_speed_rad_s: +w.toFixed(3), angle_rad: +theta.toFixed(3), kinetic_energy_j: +(.5 * p.inertia * w * w).toFixed(3), torque_work_j: +(p.torque * theta).toFixed(3) }; }

  },
  hints: { newton: ['Commence par identifier la résultante.', 'À force constante, a diminue quand m augmente.', 'Compare travail de ΣF et variation de Ec.'], fall: ['τ = m/k.', 'Après 4τ, v est proche de vlim.', 'Compare deux valeurs de k.'], projectile: ['Le projectile conserve vx.', 'La force magnétique est perpendiculaire à v.', 'Note les deux modes.'], orbit: ['Plus l’orbite est haute, plus v diminue et T augmente.', 'La période géostationnaire vaut environ 23 h 56 min.', 'Utilise les deux préréglages.'], rotation: ['J remplace m dans la dynamique de rotation.', 'À couple constant, α diminue lorsque J augmente.', 'Compare Mθ à Ec.'], oscillator: ['Calcule d’abord f₀.', 'Le maximum apparaît près de f/f₀ = 1.', 'Mesure en dessous, au voisinage et au-dessus.'] },

      craie.cercle(cx, cy, re, { couleur: 'bleu', fond: 'bleu', largeur: 2.4 }); craie.texte('Terre', cx, cy + 6, { couleur: 'bleu', taille: 15, align: 'center' }); a.zone('terre', cx - re, cy - re, 2 * re, 2 * re);
      craie.cercle(cx, cy, ro, { couleur: 'orange', largeur: 2, pointille: [6, 5] }); a.zone('orbite', cx - ro, cy - ro, 2 * ro, 2 * ro);
      const ang = -.7, sx = cx + ro * Math.cos(ang), sy = cy + ro * Math.sin(ang);
      craie.rect(sx - 9, sy - 6, 18, 12, { couleur: 'jaune', fond: 'jaune', arrondi: 2 }); vecteur(sx, sy, sx - 55 * Math.sin(ang), sy + 55 * Math.cos(ang), 'v⃗', 'cyan'); vecteur(sx, sy, sx + (cx - sx) * .5, sy + (cy - sy) * .5, 'F⃗', 'rouge');
      craie.cote(cx, cy, cx + ro * Math.cos(.8), cy + ro * Math.sin(.8), '', { couleur: 'faible', largeur: 1.2 }); craie.texte(`r = RT + h`, cx + 30, cy + 70, { couleur: 'faible', taille: 14 });
      a.lignes(400, 230, [`h = ${p.altitude} km → r = ${fr(d.orbital_radius_km, 0)} km`, `v = √(GM/r) = ${fr(d.orbital_speed_km_s, 2)} km·s⁻¹`, `T = 2π√(r³/GM) = ${fr(d.period_h, 2)} h`, d.geostationary ? 'T ≈ 23 h 56 min : géostationnaire ✓' : 'non géostationnaire'], { pas: 24, max: 330 });
    } else if (v === 'rotation') {
      const cx = 190, cy = 150, r = 80;
      craie.cercle(cx, cy, r, { couleur: 'cyan', largeur: 3 }).cercle(cx, cy, 6, { couleur: 'blanc', fond: 'blanc' }); craie.texte('axe Δ', cx + 12, cy - 10, { couleur: 'faible', taille: 13 });
      const pts = []; for (let k = 0; k <= 14; k++) { const ang = -2.4 + k / 14 * 1.6; pts.push([cx + (r + 22) * Math.cos(ang), cy + (r + 22) * Math.sin(ang)]); } craie.trait(pts, { couleur: 'orange', largeur: 2.4 }); craie.fleche(pts[13][0], pts[13][1], pts[14][0], pts[14][1], { couleur: 'orange', largeur: 2.4 }); craie.texte('M', cx + r + 30, cy - r + 6, { couleur: 'orange', taille: 17 });
      const theta = Math.min(d.angle_rad, 2 * Math.PI); craie.direct(() => craie.ligne(cx, cy, cx + r * Math.cos(theta - Math.PI / 2), cy + r * Math.sin(theta - Math.PI / 2), { couleur: 'jaune', largeur: 2.2 }));
      a.zone('mobile', cx - r - 30, cy - r - 30, 2 * r + 60, 2 * r + 60);
      graphe(430, 330, 270, 110, (x0, y0, w, h) => { craie.courbe(u => [x0 + u * w, y0 - h * .9 * u], 20, { couleur: 'cyan', largeur: 2.4 }); craie.point(x0 + w, y0 - h * .9, 5, 'orange'); }, { xl: 't', yl: 'ω' });
      a.lignes(330, 60, [`α = M/J = ${fr(p.torque, 1)} / ${fr(p.inertia, 2)} = ${fr(d.angular_acceleration_rad_s2, 2)} rad·s⁻²`, `ω(${fr(p.time, 1)} s) = ${fr(d.angular_speed_rad_s, 2)} rad·s⁻¹   θ = ${fr(d.angle_rad, 2)} rad`, `Ec = ½Jω² = ${fr(d.kinetic_energy_j, 2)} J   M·θ = ${fr(d.torque_work_j, 2)} J`], { pas: 24, max: 400 });
    } else {
      const y = 120, x0 = 40, xm = 200, amp = Math.min(60, d.amplitude_m * 2000);
      craie.ligne(x0, y - 30, x0, y + 30, { largeur: 3 }); const pts = [[x0, y]]; for (let i = 1; i <= 16; i++) pts.push([x0 + (xm - x0) * i / 16, y + (i % 2 ? 16 : -16)]); pts.push([xm, y]); craie.trait(pts, { couleur: 'cyan', largeur: 2 }); a.zone('ressort', x0, y - 20, xm - x0, 40);
      craie.direct(() => craie.rect(xm + amp * .4, y - 28, 56, 56, { couleur: 'orange', arrondi: 5 })); craie.texte('m', xm + amp * .4 + 28, y + 6, { couleur: 'orange', taille: 17, align: 'center' }); a.zone('mobile', xm, y - 30, 120, 60);
      craie.fleche(xm + 120, y, xm + 170, y, { couleur: 'jaune' }).fleche(xm + 170, y + 12, xm + 120, y + 12, { couleur: 'jaune' }); craie.texte(`excitateur f = ${fr(p.driverF, 2)} Hz`, xm + 145, y + 36, { couleur: 'jaune', taille: 13, align: 'center' }); a.zone('excitateur', xm + 115, y - 15, 60, 40);
      graphe(400, 340, 300, 160, (x0g, y0g, w, h) => { const f0 = d.natural_frequency_hz; craie.courbe(u => { const ratio = .2 + u * 2, om = 2 * Math.PI * f0 * ratio, A = 1 / Math.sqrt((p.springK - p.mass * om * om) ** 2 + (p.damping * om) ** 2); return [x0g + u * w, y0g - Math.min(h, A * h * .35 * 18 / 10)]; }, 200, { couleur: 'cyan', largeur: 2.2 }); const u = (d.frequency_ratio - .2) / 2; if (u >= 0 && u <= 1) { const om = 2 * Math.PI * d.driver_frequency_hz, A = 1 / Math.sqrt((p.springK - p.mass * om * om) ** 2 + (p.damping * om) ** 2); craie.point(x0g + u * w, y0g - Math.min(h, A * h * .35 * 18 / 10), 6, 'orange'); } craie.ligne(x0g + .4 * w, y0g, x0g + .4 * w, y0g - h, { couleur: 'tresfaible', largeur: 1, pointille: [4, 5] }); }, { xt: [[.4 * 300 / 314, 'f₀']], xl: 'f', yl: 'A' });
      a.lignes(40, 200, [`f₀ = (1/2π)√(k/m) = ${fr(d.natural_frequency_hz, 2)} Hz   f/f₀ = ${fr(d.frequency_ratio, 2)}`, `amplitude A = ${fr(d.amplitude_m, 4)} m   ζ = ${fr(d.damping_ratio, 2)} (${d.regime})`], { pas: 24, max: 340 });
    }
    if (a.ran && a.resultat != null) { craie.depuis(a.resultat); craie.texte('simulation faite ✓', 560, 170, { couleur: 'vert', taille: 16, align: 'center' }); }
  },
};
