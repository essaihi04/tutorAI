<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WaveLab — Ondes</title><link rel="stylesheet" href="../shared/lab.css"></head><body>
<div class="app"><header class="top"><div class="brand"><div class="icon">〰️</div><div><div class="eyebrow">LABORATOIRE RÉEL · 2BAC PC BIOF</div><h1>WaveLab · Ondes</h1></div></div><select id="variant" class="variant-select" aria-label="Expérience"></select><div class="progress"><div class="progress-row"><span>Compétences</span><span id="progressText">0/3</span></div><div class="track"><div class="fill" id="progressFill"></div></div></div></header>
<main><section class="scene"><img id="sceneImage" alt="Laboratoire d’ondes"><div id="hotspots"></div><div class="scene-caption"><span class="step" id="sceneStep"></span><h2 id="sceneTitle"></h2><p id="sceneCaption"></p></div></section><section class="panel"><div class="panel-head"><div><div class="kicker" id="kicker"></div><h2 id="title"></h2><p class="instruction" id="instruction"></p></div><span class="status" id="status">Prêt</span></div><div class="lab"><div class="controls" id="controls"></div><div class="visual"><canvas id="canvas" aria-label="Modèle calculé de l’onde"></canvas><div class="visual-note" id="note"></div></div></div><div class="log" id="log"></div><div class="feedback" id="feedback">Choisis les paramètres puis effectue une mesure.</div><div class="actions"><button id="reset">Réinitialiser</button><button class="hint" id="hint">💡 Indice</button><button class="run" id="run">Lancer</button><button id="record">Enregistrer la mesure</button><button class="primary" id="check">Vérifier</button></div></section></main><div class="guide" id="guide"></div></div>
<script>
const IMG='/media/images/physics/advanced_labs/';
const DATA={
 progressive:{label:'1 · Onde progressive et retard',image:IMG+'waves_lab.webp',step:'EXPÉRIENCE 1/3',scene:'Le signal voyage, la matière oscille',caption:'Deux capteurs mesurent le même front d’onde à des instants différents.',kicker:'CÉLÉRITÉ · RETARD',title:'Mesure la vitesse d’une perturbation',instruction:'Déplace les capteurs, lance une impulsion et calcule v = d / τ.',goal:'Mesurer deux retards et retrouver la célérité à moins de 5 %.'},
 periodic:{label:'2 · Périodicité et diffraction',image:IMG+'waves_lab.webp',step:'EXPÉRIENCE 2/3',scene:'Période, fréquence et longueur d’onde',caption:'La fréquence vient de la source ; la célérité dépend du milieu.',kicker:'λ = v / f',title:'Relie fréquence, longueur d’onde et diffraction',instruction:'Fais varier f et l’ouverture a ; observe λ et l’étalement.',goal:'Enregistrer deux couples f–λ et une forte diffraction.'},
 optics:{label:'3 · Lumière, diffraction et dispersion',image:IMG+'optics_lab.webp',step:'EXPÉRIENCE 3/3',scene:'Une onde lumineuse laisse des signatures mesurables',caption:'La fente produit une tache ; le prisme sépare les longueurs d’onde.',kicker:'θ ≈ λ / a',title:'Mesure la diffraction puis disperse la lumière',instruction:'Change λ, a et D ; compare la largeur de la tache et le spectre.',goal:'Enregistrer une diffraction et une dispersion.'}
};
window.SIMULATION_CONFIG={id:'physics_waves_advanced_lab',version:'2.0',title:'WaveLab avancé',variants:Object.keys(DATA).map(id=>({id,label:DATA[id].label,objective:DATA[id].goal})),commands:['start','set_variant','set_parameters','fire_pulse','record_measurement','check','reset','reveal_hint','highlight'],command_schema:{set_variant:{variant_id:'progressive | periodic | optics'},set_parameters:{speed_m_s:'number',frequency_hz:'number',amplitude:'number',sensor_1_m:'number',sensor_2_m:'number',aperture_m:'number',wavelength_nm:'number',slit_um:'number',screen_distance_m:'number',optical_mode:'diffraction | dispersion'},highlight:{target:'source | sensor1 | sensor2 | slit | screen | prism'}},state_schema:{current_variant:'id',parameters:'entrées réglées',derived_values:'valeurs calculées',measurements:'mesures enregistrées',student_actions:'historique',completed_variants:'compétences validées',objective_progress:'0..1'}};
const requested=new URLSearchParams(location.search).get('variant');
const S={variant:DATA[requested]?requested:'progressive',status:'idle',actions:[],completed:[],attempts:0,hints:0,measurements:{progressive:[],periodic:[],optics:[]},startTime:0,running:false,params:{speed:4,frequency:2,amplitude:40,sensor1:2,sensor2:7,aperture:.8,wavelength:650,slit:80,distance:1.5,opticalMode:'diffraction'}};
const $=id=>document.getElementById(id),els={variant:$('variant'),progressText:$('progressText'),progressFill:$('progressFill'),image:$('sceneImage'),hotspots:$('hotspots'),sceneStep:$('sceneStep'),sceneTitle:$('sceneTitle'),sceneCaption:$('sceneCaption'),kicker:$('kicker'),title:$('title'),instruction:$('instruction'),status:$('status'),controls:$('controls'),canvas:$('canvas'),note:$('note'),log:$('log'),feedback:$('feedback'),guide:$('guide'),run:$('run'),record:$('record'),check:$('check'),hint:$('hint')};
function record(action,details={}){S.actions.push({action,variant:S.variant,details,timestamp:Date.now()});if(S.actions.length>80)S.actions=S.actions.slice(-80)}
function derived(){const p=S.params;if(S.variant==='progressive'){const delay=Math.abs(p.sensor2-p.sensor1)/p.speed;return{distance_m:+Math.abs(p.sensor2-p.sensor1).toFixed(2),arrival_1_s:+(p.sensor1/p.speed).toFixed(3),arrival_2_s:+(p.sensor2/p.speed).toFixed(3),delay_s:+delay.toFixed(3),calculated_speed_m_s:+(Math.abs(p.sensor2-p.sensor1)/delay).toFixed(2)}}if(S.variant==='periodic'){const lambda=p.speed/p.frequency,ratio=p.aperture/lambda;return{period_s:+(1/p.frequency).toFixed(3),wavelength_m:+lambda.toFixed(3),aperture_over_lambda:+ratio.toFixed(2),diffraction:ratio<=1.5?'forte':ratio<=3?'visible':'faible',theta_rad:+Math.min(1,lambda/p.aperture).toFixed(3)}}const lambda=p.wavelength*1e-9,a=p.slit*1e-6,theta=lambda/a;return{wavelength_m:lambda,theta_rad:+theta.toFixed(5),central_width_m:+(2*p.distance*theta).toFixed(4),central_width_mm:+(2000*p.distance*theta).toFixed(1),optical_mode:p.opticalMode}}
function snapshot(extra={}){return Object.assign({simulation_status:S.status,current_variant:S.variant,skill:DATA[S.variant].goal,parameters:{...S.params},derived_values:derived(),measurements:[...S.measurements[S.variant]],attempts:S.attempts,hints_used:S.hints,completed_variants:[...S.completed],expected_answer:DATA[S.variant].goal},extra)}
function emit(extra={}){parent.postMessage({type:'simulation_state',simulation_id:window.SIMULATION_CONFIG.id,student_actions:S.actions,current_state:snapshot(extra),objective_progress:S.completed.length/3,timestamp:Date.now()},'*')}
function manifest(){window.__SIMULATION_MANIFEST_SENT__=true;parent.postMessage({type:'simulation_manifest',simulation_id:window.SIMULATION_CONFIG.id,capabilities:{commands:window.SIMULATION_CONFIG.commands,globals:['executeAICommand','setVariant','setParameters','firePulse','recordMeasurement','checkExperiment'],config:window.SIMULATION_CONFIG,command_schema:window.SIMULATION_CONFIG.command_schema,state_schema:window.SIMULATION_CONFIG.state_schema},page_text:'WaveLab calcule réellement propagation, retard, longueur d’onde, diffraction et dispersion. Le tuteur reçoit paramètres, valeurs dérivées, mesures et erreurs.'},'*')}
function slider(id,label,min,max,step,value,unit){return`<div class="control"><label for="${id}"><span>${label}</span><b>${value} ${unit}</b></label><input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${value}"></div>`}
function metric(label,value){return`<div class="metric"><small>${label}</small><strong>${value}</strong></div>`}
function bindRange(id,key){$(id).onchange=e=>{S.params[key]=+e.target.value;record('set_parameter',{parameter:key,value:S.params[key]});renderControls();emit({last_manipulation:{parameter:key,value:S.params[key]}})}}
function renderControls(){const p=S.params,d=derived();if(S.variant==='progressive'){els.controls.innerHTML=`<div class="control"><div class="control-title"><span>Direction de vibration</span></div><div class="seg"><button data-mode="transverse" class="active">Transversale</button><button data-mode="longitudinal">Longitudinale</button></div></div>${slider('speed','Célérité',1,10,.5,p.speed,'m·s⁻¹')}${slider('sensor1','Capteur A',1,5,.5,p.sensor1,'m')}${slider('sensor2','Capteur B',5.5,9,.5,p.sensor2,'m')}<div class="metrics">${metric('Distance',d.distance_m+' m')}${metric('Retard τ',d.delay_s+' s')}${metric('Arrivée A',d.arrival_1_s+' s')}${metric('Arrivée B',d.arrival_2_s+' s')}</div>`;bindRange('speed','speed');bindRange('sensor1','sensor1');bindRange('sensor2','sensor2');document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));record('set_wave_type',{type:b.dataset.mode});emit()})}else if(S.variant==='periodic'){els.controls.innerHTML=`${slider('speed','Célérité',1,10,.5,p.speed,'m·s⁻¹')}${slider('frequency','Fréquence f',.5,8,.5,p.frequency,'Hz')}${slider('amplitude','Amplitude',10,60,5,p.amplitude,'px')}${slider('aperture','Ouverture a',.2,5,.1,p.aperture,'m')}<div class="metrics">${metric('Période T',d.period_s+' s')}${metric('λ',d.wavelength_m+' m')}${metric('a / λ',d.aperture_over_lambda)}${metric('Diffraction',d.diffraction)}</div>`;bindRange('speed','speed');bindRange('frequency','frequency');bindRange('amplitude','amplitude');bindRange('aperture','aperture')}else{els.controls.innerHTML=`<div class="control"><div class="control-title"><span>Montage</span></div><div class="seg"><button data-opt="diffraction" class="${p.opticalMode==='diffraction'?'active':''}">Diffraction</button><button data-opt="dispersion" class="${p.opticalMode==='dispersion'?'active':''}">Dispersion</button></div></div>${slider('wavelength','Longueur d’onde',400,700,10,p.wavelength,'nm')}${slider('slit','Largeur de fente a',30,250,5,p.slit,'µm')}${slider('distance','Distance écran D',.5,3,.1,p.distance,'m')}<div class="metrics">${metric('θ',d.theta_rad+' rad')}${metric('Tache centrale',d.central_width_mm+' mm')}${metric('Couleur',colorName(p.wavelength))}${metric('Mode',p.opticalMode)}</div>`;bindRange('wavelength','wavelength');bindRange('slit','slit');bindRange('distance','distance');document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{S.params.opticalMode=b.dataset.opt;record('set_optical_mode',{mode:b.dataset.opt});renderControls();draw();emit()})}updateLog();draw()}
function colorName(n){return n<460?'violet':n<500?'bleu':n<570?'vert':n<590?'jaune':n<625?'orange':'rouge'}
function setVariant(id){if(!DATA[id])return;S.variant=id;S.status='running';S.running=false;S.attempts=0;record('set_variant',{variant_id:id});const d=DATA[id];els.variant.value=id;els.image.src=d.image;els.image.alt=d.scene;els.sceneStep.textContent=d.step;els.sceneTitle.textContent=d.scene;els.sceneCaption.textContent=d.caption;els.kicker.textContent=d.kicker;els.title.textContent=d.title;els.instruction.textContent=d.instruction;els.status.textContent='En manipulation';els.run.textContent=id==='progressive'?'Lancer l’impulsion':'Actualiser';renderHotspots();renderControls();feedback('Observe puis mesure.');progress();emit()}
function renderHotspots(){const sets=S.variant==='progressive'?[['source','Source',12,49],['sensor1','Capteur A',48,52],['sensor2','Capteur B',82,52]]:S.variant==='periodic'?[['source','Source',15,49],['slit','Ouverture',55,50],['screen','Fronts d’onde',82,45]]:[['laser','Laser',18,48],['slit','Fente',47,48],['prism','Prisme',70,52],['screen','Écran',88,45]];els.hotspots.innerHTML=sets.map(x=>`<button class="hotspot" id="hot-${x[0]}" style="left:${x[2]}%;top:${x[3]}%">${x[1]}</button>`).join('');els.hotspots.querySelectorAll('button').forEach(b=>b.onclick=()=>highlight(b.id.slice(4)))}
function firePulse(){S.running=true;S.startTime=performance.now();S.status='running';record('fire_pulse',{...S.params});els.status.textContent='Acquisition…';feedback('Les capteurs attendent le front d’onde.');emit({last_manipulation:{type:'fire_pulse'}})}
function recordMeasurement(){const d=derived();const item={...d,parameters:{...S.params},index:S.measurements[S.variant].length+1};S.measurements[S.variant].push(item);record('record_measurement',item);feedback('Mesure '+item.index+' enregistrée. Modifie un paramètre pour comparer.','ok');updateLog();emit({last_measurement:item});draw()}
function checkExperiment(){S.attempts++;const m=S.measurements[S.variant];let correct=false,errors=[];if(S.variant==='progressive'){correct=m.length>=2&&new Set(m.map(x=>x.distance_m)).size>=2&&m.every(x=>Math.abs(x.calculated_speed_m_s-x.parameters.speed)/x.parameters.speed<.05);if(m.length<2)errors.push('deux mesures nécessaires');if(new Set(m.map(x=>x.distance_m)).size<2)errors.push('déplace un capteur')}else if(S.variant==='periodic'){correct=m.length>=2&&new Set(m.map(x=>x.parameters.frequency)).size>=2&&m.some(x=>x.diffraction==='forte');if(m.length<2)errors.push('deux couples f–λ nécessaires');if(!m.some(x=>x.diffraction==='forte'))errors.push('réduis a jusqu’à a ≈ λ')}else{correct=m.some(x=>x.optical_mode==='diffraction')&&m.some(x=>x.optical_mode==='dispersion');if(!m.some(x=>x.optical_mode==='diffraction'))errors.push('mesure de diffraction manquante');if(!m.some(x=>x.optical_mode==='dispersion'))errors.push('observation du prisme manquante')}record('check_experiment',{correct,errors});if(!correct){feedback(errors.join(' · '),'no');emit({correct:false,errors});return}if(!S.completed.includes(S.variant))S.completed.push(S.variant);S.status='finished';els.status.textContent='Expérience réussie';feedback('✓ Objectif atteint. Justifie maintenant la relation observée.','ok');progress();emit({correct:true,validated_measurements:m})}
function updateLog(){els.log.innerHTML=Object.keys(DATA).map(id=>`<span class="chip ${S.completed.includes(id)?'done':''}">${S.completed.includes(id)?'✓ ':''}${DATA[id].label.split('·')[1]}</span>`).join('')}
function progress(){els.progressText.textContent=S.completed.length+'/3';els.progressFill.style.width=S.completed.length/3*100+'%';updateLog()}
function feedback(text,type=''){els.feedback.className='feedback'+(type?' '+type:'');els.feedback.textContent=text}
function revealHint(level=++S.hints){const h={progressive:['Le retard est la différence des dates d’arrivée.','Utilise la distance entre les deux capteurs, pas leur position absolue.','v = (xB − xA) / (tB − tA).'],periodic:['Quand f augmente à vitesse constante, λ diminue.','La diffraction devient forte lorsque a est du même ordre que λ.','Enregistre deux fréquences puis règle a / λ ≤ 1,5.'],optics:['La tache s’élargit quand la fente se rétrécit.','À fente identique, le rouge diffracte plus que le bleu.','Enregistre une mesure dans chaque montage.']}[S.variant];const t=h[Math.min(level-1,2)];S.hints=Math.max(S.hints,level);record('request_hint',{level});feedback('💡 '+t);show(t);emit({last_hint:t})}
function highlight(target){const b=$('hot-'+target);if(b){b.classList.remove('active');void b.offsetWidth;b.classList.add('active')}show('Observe : '+target);record('highlight',{target});emit({last_highlight:target})}
function show(text){els.guide.textContent='🤖 '+text;els.guide.classList.add('show');clearTimeout(show.timer);show.timer=setTimeout(()=>els.guide.classList.remove('show'),3500)}
function resize(){const r=els.canvas.getBoundingClientRect(),d=devicePixelRatio||1;els.canvas.width=Math.max(1,r.width*d);els.canvas.height=Math.max(1,r.height*d);draw()}
function draw(){const c=els.canvas,ctx=c.getContext('2d'),w=c.width,h=c.height,dpr=devicePixelRatio||1;ctx.clearRect(0,0,w,h);ctx.save();ctx.scale(dpr,dpr);const W=w/dpr,H=h/dpr;ctx.fillStyle='#f8fbff';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#d7dfeb';ctx.lineWidth=1;for(let x=40;x<W;x+=55){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=35;y<H;y+=45){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}if(S.variant==='progressive')drawPulse(ctx,W,H);else if(S.variant==='periodic')drawPeriodic(ctx,W,H);else drawOptics(ctx,W,H);ctx.restore()}
function drawPulse(ctx,W,H){const p=S.params,t=S.running?(performance.now()-S.startTime)/1000:0,center=Math.min(10,p.speed*t);ctx.strokeStyle='#2855c7';ctx.lineWidth=3;ctx.beginPath();for(let x=0;x<=W;x+=3){const xm=x/W*10,y=H*.5-p.amplitude*Math.exp(-Math.pow(xm-center,2)/.15);x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();[[p.sensor1,'A'],[p.sensor2,'B']].forEach(([pos,label])=>{const x=pos/10*W;ctx.strokeStyle='#ef7d32';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,H*.18);ctx.lineTo(x,H*.82);ctx.stroke();ctx.fillStyle='#162033';ctx.font='bold 14px sans-serif';ctx.fillText(label,x+6,H*.2)});els.note.textContent=`t = ${t.toFixed(2)} s · front = ${center.toFixed(2)} m`;if(S.running&&center>=9.8){S.running=false;els.status.textContent='Acquisition terminée';feedback('Les deux dates sont disponibles : enregistre la mesure.','ok');emit({acquisition_complete:true})}}
function drawPeriodic(ctx,W,H){const p=S.params,d=derived(),lambda=d.wavelength_m,mid=H*.5;ctx.strokeStyle='#2855c7';ctx.lineWidth=3;ctx.beginPath();for(let x=0;x<=W*.6;x+=2){const xm=x/W*10,y=mid-p.amplitude*Math.sin(2*Math.PI*xm/lambda);x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();const wall=W*.64,gap=Math.max(18,Math.min(H*.7,p.aperture/5*H));ctx.strokeStyle='#263653';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(wall,0);ctx.lineTo(wall,mid-gap/2);ctx.moveTo(wall,mid+gap/2);ctx.lineTo(wall,H);ctx.stroke();ctx.strokeStyle='#16a6b6';ctx.lineWidth=2;for(let r=22;r<W*.38;r+=25){ctx.beginPath();ctx.arc(wall,mid,r,-1.25,1.25);ctx.stroke()}els.note.textContent=`λ = ${lambda.toFixed(2)} m · a/λ = ${d.aperture_over_lambda} · diffraction ${d.diffraction}`}
function waveColor(n,a=1){let r=0,g=0,b=0;if(n<440){r=-(n-440)/40;b=1}else if(n<490){g=(n-440)/50;b=1}else if(n<510){g=1;b=-(n-510)/20}else if(n<580){r=(n-510)/70;g=1}else if(n<645){r=1;g=-(n-645)/65}else r=1;return`rgba(${r*255|0},${g*255|0},${b*255|0},${a})`}
function drawOptics(ctx,W,H){const p=S.params,d=derived(),mid=H*.5;if(p.opticalMode==='dispersion'){ctx.fillStyle='#d8dde8';ctx.beginPath();ctx.moveTo(W*.46,H*.25);ctx.lineTo(W*.58,H*.72);ctx.lineTo(W*.35,H*.65);ctx.closePath();ctx.fill();ctx.strokeStyle='#ddd';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(0,mid);ctx.lineTo(W*.44,mid);ctx.stroke();for(let n=420;n<=680;n+=20){ctx.strokeStyle=waveColor(n,.85);ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(W*.49,mid);ctx.lineTo(W*.95,mid+(n-550)*.65);ctx.stroke()}els.note.textContent='Le prisme dévie davantage les courtes longueurs d’onde.';return}const col=waveColor(p.wavelength);ctx.strokeStyle=col;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,mid);ctx.lineTo(W*.32,mid);ctx.stroke();ctx.fillStyle='#263653';ctx.fillRect(W*.32,0,8,H*.46);ctx.fillRect(W*.32,H*.54,8,H*.46);const scale=Math.min(W*.35,d.central_width_mm*2.2);for(let i=-5;i<=5;i++){const x=W*.82+i*scale*.55,alpha=Math.exp(-i*i*.35);ctx.fillStyle=waveColor(p.wavelength,alpha);ctx.fillRect(x-scale*.18,H*.15,Math.max(2,scale*.36),H*.7)}els.note.textContent=`θ = ${d.theta_rad} rad · largeur centrale = ${d.central_width_mm} mm`}
function setParameters(p){const map={speed_m_s:'speed',frequency_hz:'frequency',sensor_1_m:'sensor1',sensor_2_m:'sensor2',aperture_m:'aperture',wavelength_nm:'wavelength',slit_um:'slit',screen_distance_m:'distance',optical_mode:'opticalMode'};Object.entries(p||{}).forEach(([k,v])=>{const key=map[k]||k;if(key in S.params)S.params[key]=typeof S.params[key]==='number'?+v:v});record('set_parameters',{...p});renderControls();emit({last_manipulation:{type:'set_parameters',...p}})}
function reset(){S.measurements[S.variant]=[];S.running=false;S.attempts=0;record('reset');setVariant(S.variant)}
els.variant.innerHTML=Object.entries(DATA).map(([id,d])=>`<option value="${id}">${d.label}</option>`).join('');els.variant.onchange=e=>setVariant(e.target.value);els.run.onclick=()=>S.variant==='progressive'?firePulse():(draw(),record('run_model',derived()),emit({last_manipulation:{type:'run_model'}}));els.record.onclick=recordMeasurement;els.check.onclick=checkExperiment;$('reset').onclick=reset;els.hint.onclick=()=>revealHint();addEventListener('resize',resize);addEventListener('message',e=>{const d=e.data||{};if(d.type==='simulation_control'&&(!d.simulation_id||d.simulation_id===window.SIMULATION_CONFIG.id))executeAICommand(d.command,d.parameters||{})});
window.setVariant=setVariant;window.setParameters=setParameters;window.firePulse=firePulse;window.recordMeasurement=recordMeasurement;window.checkExperiment=checkExperiment;window.executeAICommand=(cmd,p={})=>{if(cmd==='start')S.status='running';else if(cmd==='set_variant')setVariant(p.variant_id);else if(cmd==='set_parameters')setParameters(p);else if(cmd==='fire_pulse')firePulse();else if(cmd==='record_measurement')recordMeasurement();else if(cmd==='check')checkExperiment();else if(cmd==='reset')reset();else if(cmd==='reveal_hint')revealHint(+p.level||1);else if(cmd==='highlight')highlight(p.target);emit()};
function loop(){if(S.running)draw();requestAnimationFrame(loop)}setVariant(S.variant);resize();loop();manifest();setTimeout(manifest,350);
</script></body></html>
