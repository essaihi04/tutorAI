<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WaveLab — Ondes au tableau</title>
<script>const waveVariant=new URLSearchParams(location.search).get('variant');if(!waveVariant||waveVariant==='progressive'){location.replace('../../progressive/index.html?variant=progressive&scope=single');}</script>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="../shared/lab.css"></head><body>
<script>
// WaveLab : périodicité et diffraction, lumière (diffraction, dispersion) — dessinés à la craie. La variante
// « progressive » (retard, célérité) est le laboratoire ../../progressive. Modèle inchangé.
const couleurNm = n => n < 440 ? 'violet' : n < 490 ? 'bleu' : n < 570 ? 'vert' : n < 590 ? 'jaune' : n < 625 ? 'orange' : 'rouge';
const nomCouleur = n => n < 460 ? 'violet' : n < 500 ? 'bleu' : n < 570 ? 'vert' : n < 590 ? 'jaune' : n < 625 ? 'orange' : 'rouge';
// Pont tuteur (Tableau.protocole, shared/tableau/tableau.js) : simulation_manifest, simulation_state et simulation_control
// passent par parent.postMessage ; commandes : start, set_variant, set_parameters, run_model, record_measurement, check, reset, reveal_hint, highlight.
window.LAB = {
  id: 'physics_waves_advanced_lab', title: 'WaveLab avancé', eyebrow: 'Physique · 2 BAC PC · ondes', seed: 51,
  DATA: {
    progressive: { label: 'Onde progressive et retard', kicker: 'v = d / τ', title: 'Mesure la vitesse d’une perturbation', instruction: 'Déplace les capteurs, lance une impulsion et calcule v = d / τ.', goal: 'Mesurer deux retards et retrouver la célérité à moins de 5 %.' },
    periodic: { label: 'Périodicité et diffraction', kicker: 'λ = v / f', title: 'Relie fréquence, longueur d’onde et diffraction', instruction: 'Fais varier f et l’ouverture a ; observe λ et l’étalement.', goal: 'Enregistrer deux couples f–λ et une forte diffraction.' },
    optics: { label: 'Lumière : diffraction et dispersion', kicker: 'θ ≈ λ / a', title: 'Mesure la diffraction puis disperse la lumière', instruction: 'Change λ, a et D ; compare la largeur de la tache et le spectre.', goal: 'Enregistrer une diffraction et une dispersion.' },
  },
  params: { speed: 4, frequency: 2, amplitude: 40, sensor1: 2, sensor2: 7, aperture: .8, wavelength: 650, slit: 80, distance: 1.5, opticalMode: 'diffraction' },
  paramMap: { speed_m_s: 'speed', frequency_hz: 'frequency', sensor_1_m: 'sensor1', sensor_2_m: 'sensor2', aperture_m: 'aperture', wavelength_nm: 'wavelength', slit_um: 'slit', screen_distance_m: 'distance', optical_mode: 'opticalMode' },
  commandsExtra: ['fire_pulse'], commandAliases: { fire_pulse: 'run_model' },
  command_schema: { set_variant: { variant_id: 'progressive | periodic | optics' }, set_parameters: { speed_m_s: 'number', frequency_hz: 'number', amplitude: 'number', sensor_1_m: 'number', sensor_2_m: 'number', aperture_m: 'number', wavelength_nm: 'number', slit_um: 'number', screen_distance_m: 'number', optical_mode: 'diffraction | dispersion' }, highlight: { target: 'source | sensor1 | sensor2 | slit | screen | prism' } },
  state_schema: { current_variant: 'id', parameters: 'entrées réglées', derived_values: 'valeurs calculées', measurements: 'mesures enregistrées', student_actions: 'historique', completed_variants: 'compétences validées', objective_progress: '0..1' },
  page_text: 'WaveLab, dessiné au tableau, calcule période, longueur d’onde, diffraction et dispersion ; l’onde progressive et le retard sont dans le laboratoire « Capteurs et retard ». Vibreur, fronts d’onde, fente, écran et prisme s’écrivent à la craie ; le tuteur reçoit paramètres, valeurs dérivées, mesures et erreurs.',
  aliases: { source: 'source', sensor1: 'source', sensor2: 'ecran', slit: 'fente', screen: 'ecran', prism: 'prisme' }, labels: { source: 'la source', fente: 'la fente', ecran: 'l’écran', prisme: 'le prisme' },
  onVariant: id => { if (id === 'progressive') { location.replace('../../progressive/index.html?variant=progressive&scope=single'); return false; } },
  runLabel: () => 'Actualiser',
  controls(v, p) {
    if (v === 'periodic') return [{ type: 'range', key: 'speed', label: 'célérité v', min: 1, max: 10, step: .5, unit: 'm·s⁻¹' }, { type: 'range', key: 'frequency', label: 'fréquence f', min: .5, max: 8, step: .5, unit: 'Hz' }, { type: 'range', key: 'amplitude', label: 'amplitude', min: 10, max: 60, step: 5, unit: '' }, { type: 'range', key: 'aperture', label: 'ouverture a', min: .2, max: 5, step: .1, unit: 'm' }];
    return [{ type: 'choice', key: 'opticalMode', options: [['diffraction', 'diffraction'], ['dispersion', 'dispersion']], action: 'set_optical_mode' }, { type: 'range', key: 'wavelength', label: 'longueur d’onde λ', min: 400, max: 700, step: 10, unit: 'nm' }, { type: 'range', key: 'slit', label: 'largeur de fente a', min: 30, max: 250, step: 5, unit: 'µm' }, { type: 'range', key: 'distance', label: 'distance écran D', min: .5, max: 3, step: .1, unit: 'm' }];
  },
  values(v, p) {
    if (v === 'progressive') { const delay = Math.abs(p.sensor2 - p.sensor1) / p.speed; return { distance_m: +Math.abs(p.sensor2 - p.sensor1).toFixed(2), arrival_1_s: +(p.sensor1 / p.speed).toFixed(3), arrival_2_s: +(p.sensor2 / p.speed).toFixed(3), delay_s: +delay.toFixed(3), calculated_speed_m_s: +(Math.abs(p.sensor2 - p.sensor1) / delay).toFixed(2) }; }
    if (v === 'periodic') { const lambda = p.speed / p.frequency, ratio = p.aperture / lambda; return { period_s: +(1 / p.frequency).toFixed(3), wavelength_m: +lambda.toFixed(3), aperture_over_lambda: +ratio.toFixed(2), diffraction: ratio <= 1.5 ? 'forte' : ratio <= 3 ? 'visible' : 'faible', theta_rad: +Math.min(1, lambda / p.aperture).toFixed(3) }; }
    const lambda = p.wavelength * 1e-9, a = p.slit * 1e-6, theta = lambda / a;
    return { wavelength_m: lambda, theta_rad: +theta.toFixed(5), central_width_m: +(2 * p.distance * theta).toFixed(4), central_width_mm: +(2000 * p.distance * theta).toFixed(1), optical_mode: p.opticalMode };
  },
  columns(v) {
    if (v === 'periodic') return [{ label: 'f (Hz)', get: x => x.parameters.frequency }, { label: 'λ (m)', get: x => x.wavelength_m }, { label: 'diffraction', get: x => x.diffraction }];
    return [{ label: 'montage', get: x => x.optical_mode }, { label: 'λ (nm)', get: x => x.parameters.wavelength }, { label: 'tache (mm)', get: x => x.central_width_mm }];
  },
  check(v, m) {
    const errors = []; let correct = false;
    if (v === 'periodic') { correct = m.length >= 2 && new Set(m.map(x => x.parameters.frequency)).size >= 2 && m.some(x => x.diffraction === 'forte'); if (m.length < 2 || new Set(m.map(x => x.parameters.frequency)).size < 2) errors.push('deux couples f–λ nécessaires'); if (!m.some(x => x.diffraction === 'forte')) errors.push('réduis a jusqu’à a ≈ λ'); }
    else { correct = m.some(x => x.optical_mode === 'diffraction') && m.some(x => x.optical_mode === 'dispersion'); if (!m.some(x => x.optical_mode === 'diffraction')) errors.push('mesure de diffraction manquante'); if (!m.some(x => x.optical_mode === 'dispersion')) errors.push('observation du prisme manquante'); }
    return { correct, errors };
  },
  hints: { progressive: ['Le retard est la différence des dates d’arrivée.', 'Utilise la distance entre les deux capteurs.', 'v = (xB − xA) / (tB − tA).'], periodic: ['Quand f augmente à vitesse constante, λ diminue.', 'La diffraction devient forte lorsque a est du même ordre que λ.', 'Note deux fréquences puis règle a / λ ≤ 1,5.'], optics: ['La tache s’élargit quand la fente se rétrécit.', 'À fente identique, le rouge diffracte plus que le bleu.', 'Note une mesure dans chaque montage.'] },

  draw(craie, a) {
    const { p, d, variant: v } = a, fr = window.Tableau.fr;
    if (v === 'periodic') {
      const y = 120, L = 40, mur = 440, lambda = d.wavelength_m, amp = p.amplitude * .6;
      // Vibreur, onde sinusoïdale, mur percé d'une ouverture, fronts circulaires derrière
      craie.rect(L - 20, y - 22, 20, 44, { couleur: 'orange', arrondi: 4 }); craie.texte('vibreur', L - 10, y + 44, { couleur: 'orange', taille: 13, align: 'center' }).texte(`f = ${fr(p.frequency, 1)} Hz`, L - 10, y - 32, { couleur: 'orange', taille: 13, align: 'center' }); a.zone('source', L - 24, y - 26, 28, 52);
      craie.fleche(120, y - 60, 300, y - 60, { couleur: 'vert', largeur: 2 }).texte('sens de propagation', 210, y - 70, { couleur: 'vert', taille: 15, align: 'center' });
      craie.direct(() => craie.courbe(u => [L + u * (mur - 30 - L), y - amp * Math.sin(2 * Math.PI * u * 10 / lambda)], 300, { couleur: 'cyan', largeur: 2.4 }));
      const gap = Math.max(16, Math.min(120, p.aperture / 5 * 120));
      craie.ligne(mur, 30, mur, y - gap / 2, { largeur: 5 }).ligne(mur, y + gap / 2, mur, 210, { largeur: 5 }); craie.texte(`a = ${fr(p.aperture, 1)} m`, mur + 10, y - gap / 2 - 8, { couleur: 'jaune', taille: 14 }); a.zone('fente', mur - 8, y - gap / 2 - 4, 16, gap + 8);
      const nb = d.diffraction === 'forte' ? 1.25 : d.diffraction === 'visible' ? .7 : .3;
      craie.direct(() => { for (let r = 24; r < 230; r += Math.max(14, lambda * 41)) { const pts = []; for (let k = 0; k <= 30; k++) { const ang = -nb + k / 30 * 2 * nb; pts.push([mur + r * Math.cos(ang), y + r * Math.sin(ang)]); } craie.trait(pts, { couleur: 'cyan', largeur: 1.8, tremble: .3 }); } });
      a.zone('ecran', mur + 20, 30, 250, 180);
      craie.cote(L + 40, y + 70, L + 40 + lambda * 41, y + 70, 'λ', { couleur: 'jaune', largeur: 1.4, taille: 16, dessous: true });
      a.lignes(400, 250, [`T = 1/f = ${fr(d.period_s, 3)} s`, `λ = v·T = ${fr(p.speed, 1)} / ${fr(p.frequency, 1)} = ${fr(d.wavelength_m, 2)} m`, `a / λ = ${fr(d.aperture_over_lambda, 2)} → diffraction ${d.diffraction}`, `θ ≈ λ / a = ${fr(d.theta_rad, 2)} rad`], { pas: 24, max: 330 });
    } else if (p.opticalMode === 'dispersion') {
      // Lumière blanche → prisme → spectre sur l'écran
      craie.rect(30, 95, 50, 30, { couleur: 'faible', arrondi: 4 }); craie.texte('lumière blanche', 55, 145, { couleur: 'faible', taille: 13, align: 'center' }); a.zone('source', 30, 95, 50, 30);
      craie.ligne(80, 110, 230, 110, { largeur: 4 });
      craie.trait([[240, 60], [310, 170], [180, 160]], { couleur: 'cyan', largeur: 2.4, ferme: true }); craie.texte('prisme', 245, 190, { couleur: 'cyan', taille: 14, align: 'center' }); a.zone('prisme', 175, 55, 140, 120);
      for (let n = 420; n <= 680; n += 40) craie.ligne(255, 112, 440, 112 + (n - 550) * .5, { couleur: couleurNm(n), largeur: 2.2, duree: .12 });
      craie.ligne(445, 30, 445, 200, { largeur: 3 }); craie.texte('écran', 445, 218, { couleur: 'faible', taille: 13, align: 'center' }); a.zone('ecran', 435, 30, 20, 170);
      craie.texte('violet', 470, 50, { couleur: 'violet', taille: 14 }).texte('rouge', 470, 182, { couleur: 'rouge', taille: 14 });
      a.lignes(400, 250, ['le prisme dévie davantage les courtes longueurs d’onde', 'indice n(λ) plus grand pour le violet que pour le rouge', 'la lumière blanche est polychromatique'], { pas: 24, max: 330 });
    } else {
      // Laser → fente → écran : tache centrale et taches secondaires
      const col = couleurNm(p.wavelength), y = 110;
      craie.rect(30, y - 14, 60, 28, { couleur: col, arrondi: 4 }); craie.texte(`laser ${nomCouleur(p.wavelength)}`, 60, y + 36, { couleur: col, taille: 13, align: 'center' }); a.zone('source', 30, y - 14, 60, 28);
      craie.ligne(90, y, 220, y, { couleur: col, largeur: 3 });
      craie.ligne(224, 40, 224, y - 6, { largeur: 5 }).ligne(224, y + 6, 224, 180, { largeur: 5 }); craie.texte(`fente a = ${p.slit} µm`, 224, 200, { couleur: 'jaune', taille: 13, align: 'center' }); a.zone('fente', 216, 36, 16, 148);
      const ex = 480, demi = Math.min(70, d.central_width_mm * 1.6);
      craie.ligne(228, y, ex, y - demi, { couleur: col, largeur: 1, pointille: [4, 5] }).ligne(228, y, ex, y + demi, { couleur: col, largeur: 1, pointille: [4, 5] });
      craie.ligne(ex, 30, ex, 190, { largeur: 3 }); craie.texte('écran', ex, 208, { couleur: 'faible', taille: 13, align: 'center' }); a.zone('ecran', ex - 10, 30, 60, 160);
      craie.direct(() => { for (let i = -3; i <= 3; i++) { const h = i === 0 ? 2 * demi : demi * .7, cy = y + i * demi * 1.6; if (cy - h / 2 < 32 || cy + h / 2 > 188) continue; craie.ctx.globalAlpha = i === 0 ? .8 : .35; craie.ctx.fillStyle = craie.couleur(col); craie.ctx.fillRect(ex + 6, cy - h / 2, 22, h); craie.ctx.globalAlpha = 1; } });
      craie.cote(ex + 40, y - demi, ex + 40, y + demi, '', { couleur: 'jaune', largeur: 1.4 }); craie.texte(`L = ${fr(d.central_width_mm, 1)} mm`, ex + 50, y + 6, { couleur: 'jaune', taille: 14 });
      craie.cote(228, 230, ex, 230, `D = ${fr(p.distance, 1)} m`, { couleur: 'faible', largeur: 1.2, taille: 13, dessous: true });
      a.lignes(400, 275, [`θ ≈ λ / a = ${p.wavelength}·10⁻⁹ / ${p.slit}·10⁻⁶ = ${fr(d.theta_rad * 1000, 2)} mrad`, `L = 2·D·θ = ${fr(d.central_width_mm, 1)} mm`], { pas: 24, max: 330 });
    }
    if (a.ran && a.resultat != null) { craie.depuis(a.resultat); craie.texte('observation faite ✓', 560, 230, { couleur: 'vert', taille: 16, align: 'center' }); }
  },
};
</script>
<script src="/media/simulations/shared/tableau/tableau.js"></script><script src="../shared/lab-tableau.js"></script><script src="/media/simulations/professor-locate.js" defer></script>
