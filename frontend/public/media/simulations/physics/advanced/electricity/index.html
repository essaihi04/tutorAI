      graphe(400, 300, 300, 200, (x0, y0, w, h) => {
        const mid = y0 - h / 2, amp = h * .42;
        craie.courbe(u => { const t = u * 2, env = 1 + p.m * Math.sin(2 * Math.PI * 2 * t); return [x0 + u * w, mid - amp * .45 * env * Math.cos(2 * Math.PI * 20 * t)]; }, 600, { couleur: 'cyan', largeur: 1.6, tremble: 0 });
        for (const sign of [-1, 1]) craie.courbe(u => [x0 + u * w, mid + sign * amp * .45 * (1 + p.m * Math.sin(2 * Math.PI * 2 * u * 2))], 120, { couleur: 'orange', largeur: 2, pointille: [5, 4] });
      }, { yl: 'uAM' });
      a.zone('sonde', 400, 100, 60, 30); a.zone('enveloppe', 400, 116, 300, 170); a.zone('formules', 30, 212, 350, 80);
      a.lignes(40, 230, [`m = ${fr(p.m, 2)} → enveloppe entre ${fr(d.envelope_min, 2)} et ${fr(d.envelope_max, 2)} Uc`, `fc / fs = ${fr(d.frequency_ratio, 1)}`, `${d.quality}${d.demodulation_error_percent ? ' : erreur ' + fr(d.demodulation_error_percent, 1) + ' %' : ''}`], { pas: 24, max: 330 });
    }
    if (a.ran && a.resultat != null) { craie.depuis(a.resultat); craie.texte('acquisition faite ✓', 560, 170, { couleur: 'vert', taille: 16, align: 'center' }); }
  },
};
