<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CircuitLab — Électricité</title><link rel="stylesheet" href="../shared/lab.css"></head><body>
<div class="app"><header class="top"><div class="brand"><div class="icon">⚡</div><div><div class="eyebrow">LABORATOIRE RÉEL · 2BAC PC BIOF</div><h1>CircuitLab</h1></div></div><select id="variant" class="variant-select" aria-label="Expérience"></select><div class="progress"><div class="progress-row"><span>Compétences</span><span id="progressText">0/4</span></div><div class="track"><div class="fill" id="progressFill"></div></div></div></header>
<main><section class="scene"><img id="sceneImage" src="/media/images/physics/advanced_labs/circuits_lab.webp" alt="Banc d’électronique avec oscilloscope"><div id="hotspots"></div><div class="scene-caption"><span class="step" id="sceneStep"></span><h2 id="sceneTitle"></h2><p id="sceneCaption"></p></div></section><section class="panel"><div class="panel-head"><div><div class="kicker" id="kicker"></div><h2 id="title"></h2><p class="instruction" id="instruction"></p></div><span class="status" id="status">Prêt</span></div><div class="lab"><div class="controls" id="controls"></div><div class="visual"><canvas id="canvas" aria-label="Oscilloscope calculé"></canvas><div class="visual-note" id="note"></div></div></div><div class="log" id="log"></div><div class="feedback" id="feedback">Règle le circuit puis effectue une acquisition.</div><div class="actions"><button id="reset">Réinitialiser</button><button class="hint" id="hint">💡 Indice</button><button class="run" id="run">Acquérir</button><button id="record">Enregistrer</button><button class="primary" id="check">Vérifier</button></div></section></main><div class="guide" id="guide"></div></div>
<script>
const DATA={rc:{label:'1 · Dipôle RC',step:'EXPÉRIENCE 1/4',scene:'Le condensateur mémorise une tension',caption:'La charge et la décharge suivent une exponentielle de constante τ = RC.',kicker:'τ = R · C',title:'Détermine la constante de temps RC',instruction:'Mesure uC à t = τ en charge puis en décharge.',goal:'Retrouver 63 % en charge et 37 % en décharge.'},rl:{label:'2 · Dipôle RL',step:'EXPÉRIENCE 2/4',scene:'La bobine retarde l’établissement du courant',caption:'L’auto-induction s’oppose aux variations de i et stocke une énergie magnétique.',kicker:'τ = L / R',title:'Mesure le retard du courant',instruction:'Change L et R ; mesure i(τ) et l’énergie de la bobine.',goal:'Vérifier i(τ) ≈ 0,63 I∞ et l’énergie ½Li².'},rlc:{label:'3 · Oscillations libres RLC',step:'EXPÉRIENCE 3/4',scene:'R échange l’énergie et change le régime',caption:'C et L échangent leur énergie ; R contrôle l’amortissement.',kicker:'ω₀ = 1 / √LC',title:'Produis les trois régimes libres',instruction:'Fais varier R pour obtenir périodique, pseudo-périodique et apériodique.',goal:'Enregistrer les trois régimes et comparer leurs énergies.'},modulation:{label:'4 · Modulation et démodulation AM',step:'EXPÉRIENCE 4/4',scene:'Une porteuse transporte le signal',caption:'L’enveloppe de l’onde modulée reproduit le signal lorsque m ≤ 1.',kicker:'uAM = Uc(1 + m·s)cos(2πfct)',title:'Transmets puis récupère un signal',instruction:'Règle fs, fc et m ; repère la surmodulation puis démodule.',goal:'Comparer une modulation correcte et une surmodulation.'}};
window.SIMULATION_CONFIG={id:'physics_electricity_advanced_lab',version:'2.0',title:'CircuitLab avancé',variants:Object.keys(DATA).map(id=>({id,label:DATA[id].label,objective:DATA[id].goal})),commands:['start','set_variant','set_parameters','run_model','record_measurement','check','reset','reveal_hint','highlight'],command_schema:{set_variant:{variant_id:'rc | rl | rlc | modulation'},set_parameters:{resistance_ohm:'number',capacitance_uf:'number',inductance_h:'number',voltage_v:'number',time_in_tau:'0..5',mode:'charge | discharge',signal_frequency_khz:'number',carrier_frequency_khz:'number',modulation_index:'0..1.5'}},state_schema:{parameters:'réglages réels',derived_values:'τ, courant, énergie, régime ou modulation',measurements:'acquisitions',student_actions:'historique',completed_variants:'liste'}};
const requested=new URLSearchParams(location.search).get('variant');const S={variant:DATA[requested]?requested:'rc',status:'idle',actions:[],completed:[],attempts:0,hints:0,measurements:{rc:[],rl:[],rlc:[],modulation:[]},params:{R:1000,C:100,L:.5,E:6,tauTime:1,mode:'charge',fs:2,fc:20,m:.7}};
const $=id=>document.getElementById(id),E={variant:$('variant'),progressText:$('progressText'),progressFill:$('progressFill'),hotspots:$('hotspots'),sceneStep:$('sceneStep'),sceneTitle:$('sceneTitle'),sceneCaption:$('sceneCaption'),kicker:$('kicker'),title:$('title'),instruction:$('instruction'),status:$('status'),controls:$('controls'),canvas:$('canvas'),note:$('note'),log:$('log'),feedback:$('feedback'),guide:$('guide')};function act(action,details={}){S.actions.push({action,variant:S.variant,details,timestamp:Date.now()});if(S.actions.length>90)S.actions=S.actions.slice(-90)}
function values(){const p=S.params;if(S.variant==='rc'){const tau=p.R*p.C*1e-6,t=p.tauTime*tau,ratio=p.mode==='charge'?1-Math.exp(-p.tauTime):Math.exp(-p.tauTime),uc=p.E*ratio,i=p.mode==='charge'?p.E/p.R*Math.exp(-p.tauTime):-p.E/p.R*Math.exp(-p.tauTime);return{tau_s:+tau.toFixed(6),time_s:+t.toFixed(6),mode:p.mode,uc_v:+uc.toFixed(3),uc_over_e:+ratio.toFixed(3),current_ma:+(i*1000).toFixed(3),electric_energy_mj:+(.5*p.C*1e-6*uc*uc*1000).toFixed(3)}}if(S.variant==='rl'){const tau=p.L/p.R,t=p.tauTime*tau,ratio=1-Math.exp(-p.tauTime),i=p.E/p.R*ratio;return{tau_s:+tau.toFixed(6),time_s:+t.toFixed(6),current_a:+i.toFixed(4),current_over_final:+ratio.toFixed(3),final_current_a:+(p.E/p.R).toFixed(4),magnetic_energy_mj:+(.5*p.L*i*i*1000).toFixed(3)}}if(S.variant==='rlc'){const C=p.C*1e-6,w0=1/Math.sqrt(p.L*C),alpha=p.R/(2*p.L),critical=2*Math.sqrt(p.L/C),regime=alpha<w0*.08?'périodique':alpha<w0?'pseudo-périodique':'apériodique',wd=alpha<w0?Math.sqrt(w0*w0-alpha*alpha):0;return{natural_pulsation_rad_s:+w0.toFixed(2),damping_s_1:+alpha.toFixed(2),critical_resistance_ohm:+critical.toFixed(1),regime,damped_pulsation_rad_s:+wd.toFixed(2),quality_factor:+(w0/(2*Math.max(alpha,.001))).toFixed(2),initial_energy_mj:+(.5*C*p.E*p.E*1000).toFixed(3)}}const valid=p.m<=1;return{signal_frequency_khz:p.fs,carrier_frequency_khz:p.fc,frequency_ratio:+(p.fc/p.fs).toFixed(1),modulation_index:p.m,envelope_min:+(1-p.m).toFixed(2),envelope_max:+(1+p.m).toFixed(2),quality:valid?'modulation exploitable':'surmodulation',demodulation_error_percent:valid?0:+((p.m-1)*35).toFixed(1)}}
function snap(extra={}){return Object.assign({simulation_status:S.status,current_variant:S.variant,skill:DATA[S.variant].goal,parameters:{...S.params},derived_values:values(),measurements:[...S.measurements[S.variant]],attempts:S.attempts,hints_used:S.hints,completed_variants:[...S.completed],expected_answer:DATA[S.variant].goal},extra)}function emit(extra={}){parent.postMessage({type:'simulation_state',simulation_id:window.SIMULATION_CONFIG.id,student_actions:S.actions,current_state:snap(extra),objective_progress:S.completed.length/4,timestamp:Date.now()},'*')}function manifest(){window.__SIMULATION_MANIFEST_SENT__=true;parent.postMessage({type:'simulation_manifest',simulation_id:window.SIMULATION_CONFIG.id,capabilities:{commands:window.SIMULATION_CONFIG.commands,globals:['executeAICommand','setVariant','setParameters','runModel','recordMeasurement','checkExperiment'],config:window.SIMULATION_CONFIG,command_schema:window.SIMULATION_CONFIG.command_schema,state_schema:window.SIMULATION_CONFIG.state_schema},page_text:'CircuitLab calcule les réponses RC, RL, RLC et AM, avec constantes de temps, énergies, régimes et défaut de surmodulation. Toutes les acquisitions sont lisibles par le tuteur.'},'*')}
function slider(id,label,min,max,step,value,unit){return`<div class="control"><label for="${id}"><span>${label}</span><b>${value} ${unit}</b></label><input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${value}"></div>`}function metric(l,v){return`<div class="metric"><small>${l}</small><strong>${v}</strong></div>`}function bind(id,key){$(id).onchange=e=>{S.params[key]=+e.target.value;act('set_parameter',{parameter:key,value:S.params[key]});renderControls();emit({last_manipulation:{parameter:key,value:S.params[key]}})}}
function renderControls(){const p=S.params,d=values();if(S.variant==='rc'){E.controls.innerHTML=`<div class="control"><div class="control-title"><span>Commutation</span></div><div class="seg"><button data-mode="charge" class="${p.mode==='charge'?'active':''}">Charge</button><button data-mode="discharge" class="${p.mode==='discharge'?'active':''}">Décharge</button></div></div>${slider('R','Résistance R',100,5000,100,p.R,'Ω')}${slider('C','Capacité C',10,1000,10,p.C,'µF')}${slider('tauTime','Temps t',0,5,.1,p.tauTime,'× τ')}<div class="metrics">${metric('τ',d.tau_s+' s')}${metric('uC',d.uc_v+' V')}${metric('uC/E',d.uc_over_e)}${metric('Énergie',d.electric_energy_mj+' mJ')}</div>`;bind('R','R');bind('C','C');bind('tauTime','tauTime');modes()}else if(S.variant==='rl'){E.controls.innerHTML=`${slider('R','Résistance R',20,1000,20,p.R,'Ω')}${slider('L','Inductance L',.1,2,.1,p.L,'H')}${slider('E0','Tension E',2,12,.5,p.E,'V')}${slider('tauTime','Temps t',0,5,.1,p.tauTime,'× τ')}<div class="metrics">${metric('τ',d.tau_s+' s')}${metric('i / I∞',d.current_over_final)}${metric('i',d.current_a+' A')}${metric('Eₘ',d.magnetic_energy_mj+' mJ')}</div>`;bind('R','R');bind('L','L');bind('E0','E');bind('tauTime','tauTime')}else if(S.variant==='rlc'){E.controls.innerHTML=`${slider('R','Résistance R',0,400,5,p.R,'Ω')}${slider('L','Inductance L',.1,2,.1,p.L,'H')}${slider('C','Capacité C',20,500,10,p.C,'µF')}<div class="metrics">${metric('R critique',d.critical_resistance_ohm+' Ω')}${metric('Régime',d.regime)}${metric('ω₀',d.natural_pulsation_rad_s+' rad/s')}${metric('Q',d.quality_factor)}</div>`;bind('R','R');bind('L','L');bind('C','C')}else{E.controls.innerHTML=`${slider('fs','Signal fs',.5,5,.5,p.fs,'kHz')}${slider('fc','Porteuse fc',10,60,2,p.fc,'kHz')}${slider('m','Indice m',0,1.5,.05,p.m,'')}<div class="metrics">${metric('fc / fs',d.frequency_ratio)}${metric('Enveloppe min',d.envelope_min)}${metric('État',d.quality)}${metric('Erreur',d.demodulation_error_percent+' %')}</div>`;bind('fs','fs');bind('fc','fc');bind('m','m')}draw();updateLog()}
function modes(){document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{S.params.mode=b.dataset.mode;act('set_mode',{mode:S.params.mode});renderControls();emit()})}
function setVariant(id){if(!DATA[id])return;S.variant=id;S.status='running';S.attempts=0;if(id==='rlc'&&S.params.R>400)S.params.R=100;const d=DATA[id];act('set_variant',{variant_id:id});E.variant.value=id;E.sceneStep.textContent=d.step;E.sceneTitle.textContent=d.scene;E.sceneCaption.textContent=d.caption;E.kicker.textContent=d.kicker;E.title.textContent=d.title;E.instruction.textContent=d.instruction;E.status.textContent='En manipulation';renderHotspots();renderControls();feedback('Prédit la courbe avant l’acquisition.');progress();emit()}
function renderHotspots(){const sets=[['generator','Générateur',20,46],['circuit','Circuit',50,62],['scope','Oscilloscope',75,26],['probe','Sondes',77,55]];E.hotspots.innerHTML=sets.map(x=>`<button class="hotspot" id="hot-${x[0]}" style="left:${x[2]}%;top:${x[3]}%">${x[1]}</button>`).join('');E.hotspots.querySelectorAll('button').forEach(b=>b.onclick=()=>highlight(b.id.slice(4)))}
function runModel(){S.status='running';act('run_model',{parameters:{...S.params},result:values()});E.status.textContent='Acquisition terminée';feedback('La trace est calculée. Place-toi à une valeur utile puis enregistre.','ok');draw();emit({last_manipulation:{type:'run_model',result:values()}})}function recordMeasurement(){const item={...values(),parameters:{...S.params},index:S.measurements[S.variant].length+1};S.measurements[S.variant].push(item);act('record_measurement',item);feedback('Acquisition '+item.index+' enregistrée.','ok');updateLog();emit({last_measurement:item})}
function checkExperiment(){S.attempts++;const m=S.measurements[S.variant];let correct=false,errors=[];if(S.variant==='rc'){const ch=m.some(x=>x.mode==='charge'&&Math.abs(x.uc_over_e-.632)<.04),dis=m.some(x=>x.mode==='discharge'&&Math.abs(x.uc_over_e-.368)<.04);correct=ch&&dis;if(!ch)errors.push('charge à t = τ');if(!dis)errors.push('décharge à t = τ')}else if(S.variant==='rl'){correct=m.some(x=>Math.abs(x.current_over_final-.632)<.04&&x.magnetic_energy_mj>0);if(!correct)errors.push('mesure de i et énergie à t = τ')}else if(S.variant==='rlc'){const seen=new Set(m.map(x=>x.regime));correct=['périodique','pseudo-périodique','apériodique'].every(x=>seen.has(x));errors=['périodique','pseudo-périodique','apériodique'].filter(x=>!seen.has(x))}else{correct=m.some(x=>x.modulation_index<=1)&&m.some(x=>x.modulation_index>1);if(!m.some(x=>x.modulation_index<=1))errors.push('modulation correcte');if(!m.some(x=>x.modulation_index>1))errors.push('surmodulation')}act('check_experiment',{correct,errors});if(!correct){feedback('À compléter : '+errors.join(' · '),'no');emit({correct:false,errors});return}if(!S.completed.includes(S.variant))S.completed.push(S.variant);S.status='finished';E.status.textContent='Expérience réussie';feedback('✓ Le modèle, la courbe et la mesure sont cohérents.','ok');progress();emit({correct:true,validated_measurements:m})}
function updateLog(){E.log.innerHTML=Object.keys(DATA).map(id=>`<span class="chip ${S.completed.includes(id)?'done':''}">${S.completed.includes(id)?'✓ ':''}${DATA[id].label.split('·')[1]}</span>`).join('')}function progress(){E.progressText.textContent=S.completed.length+'/4';E.progressFill.style.width=S.completed.length/4*100+'%';updateLog()}function feedback(t,type=''){E.feedback.className='feedback'+(type?' '+type:'');E.feedback.textContent=t}
function revealHint(level=++S.hints){const h={rc:['τ = RC.','À t = τ : charge 0,63E ; décharge 0,37E.','Enregistre charge et décharge avec t = 1τ.'],rl:['τ = L/R.','À t = τ, i atteint 63 % de I∞.','L’énergie vaut ½Li².'],rlc:['R = 0 approche le régime périodique.','Sous R critique : pseudo-périodique.','Au-dessus de R critique : apériodique.'],modulation:['Une enveloppe ne doit pas se croiser.','m ≤ 1 est exploitable.','Compare m = 0,7 et m = 1,3.']}[S.variant];const t=h[Math.min(level-1,2)];S.hints=Math.max(S.hints,level);act('request_hint',{level});feedback('💡 '+t);show(t);emit({last_hint:t})}function highlight(target){const b=$('hot-'+target);if(b){b.classList.remove('active');void b.offsetWidth;b.classList.add('active')}act('highlight',{target});show('Observe : '+target);emit({last_highlight:target})}function show(t){E.guide.textContent='🤖 '+t;E.guide.classList.add('show');clearTimeout(show.timer);show.timer=setTimeout(()=>E.guide.classList.remove('show'),3500)}
function resize(){const r=E.canvas.getBoundingClientRect(),d=devicePixelRatio||1;E.canvas.width=Math.max(1,r.width*d);E.canvas.height=Math.max(1,r.height*d);draw()}function axes(ctx,W,H){ctx.strokeStyle='#91a0b4';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(40,18);ctx.lineTo(40,H-30);ctx.lineTo(W-12,H-30);ctx.stroke();ctx.strokeStyle='#e1e6ee';for(let y=30;y<H-30;y+=35){ctx.beginPath();ctx.moveTo(40,y);ctx.lineTo(W-12,y);ctx.stroke()}}
function draw(){const ctx=E.canvas.getContext('2d'),dpr=devicePixelRatio||1,W=E.canvas.width/dpr,H=E.canvas.height/dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.fillStyle='#f9fbfe';ctx.fillRect(0,0,W,H);axes(ctx,W,H);if(S.variant==='modulation')drawAM(ctx,W,H);else if(S.variant==='rlc')drawRLC(ctx,W,H);else drawExp(ctx,W,H)}
function plot(ctx,W,H,fn,color){ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<=300;i++){const x=40+i/300*(W-58),y=H-30-fn(i/300)*(H-58);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}
function drawExp(ctx,W,H){const charge=S.variant==='rc'?S.params.mode==='charge':true;plot(ctx,W,H,x=>charge?1-Math.exp(-5*x):Math.exp(-5*x),'#2855c7');const t=Math.min(5,S.params.tauTime),ratio=S.variant==='rc'&&S.params.mode==='discharge'?Math.exp(-t):1-Math.exp(-t),x=40+t/5*(W-58),y=H-30-ratio*(H-58);ctx.fillStyle='#ef7d32';ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fill();const d=values();E.note.textContent=S.variant==='rc'?`uC/E = ${d.uc_over_e} · τ = ${d.tau_s} s`:`i/I∞ = ${d.current_over_final} · Eₘ = ${d.magnetic_energy_mj} mJ`}
function drawRLC(ctx,W,H){const d=values(),p=S.params,C=p.C*1e-6,w0=d.natural_pulsation_rad_s,alpha=d.damping_s_1,T=2*Math.PI/w0,tmax=8*T;plot(ctx,W,H,x=>{const t=x*tmax;if(d.regime==='apériodique')return .5+.5*Math.exp(-Math.min(alpha,w0)*t);return .5+.45*Math.exp(-alpha*t)*Math.cos((d.damped_pulsation_rad_s||w0)*t)},'#2855c7');ctx.strokeStyle='#ef7d32';ctx.lineWidth=2;ctx.setLineDash([5,5]);plot(ctx,W,H,x=>.5+.45*Math.exp(-alpha*x*tmax),'#ef7d32');ctx.setLineDash([]);E.note.textContent=`${d.regime} · Rcrit = ${d.critical_resistance_ohm} Ω · E₀ = ${d.initial_energy_mj} mJ`}
function drawAM(ctx,W,H){const p=S.params,mid=H/2,amp=H*.34;ctx.strokeStyle='#2855c7';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<=600;i++){const x=40+i/600*(W-58),t=i/600*2,env=1+p.m*Math.sin(2*Math.PI*2*t),y=mid-amp*.45*env*Math.cos(2*Math.PI*20*t);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();ctx.strokeStyle='#ef7d32';ctx.lineWidth=2;for(const sign of[-1,1]){ctx.beginPath();for(let i=0;i<=300;i++){const x=40+i/300*(W-58),t=i/300*2,y=mid+sign*amp*.45*(1+p.m*Math.sin(2*Math.PI*2*t));i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}E.note.textContent=`m = ${p.m.toFixed(2)} · ${values().quality}`}
function setParameters(p){const map={resistance_ohm:'R',capacitance_uf:'C',inductance_h:'L',voltage_v:'E',time_in_tau:'tauTime',signal_frequency_khz:'fs',carrier_frequency_khz:'fc',modulation_index:'m'};Object.entries(p||{}).forEach(([k,v])=>{const key=map[k]||k;if(key in S.params)S.params[key]=typeof S.params[key]==='number'?+v:v});act('set_parameters',{...p});renderControls();emit({last_manipulation:{type:'set_parameters',...p}})}function reset(){S.measurements[S.variant]=[];S.attempts=0;act('reset');setVariant(S.variant)}
E.variant.innerHTML=Object.entries(DATA).map(([id,d])=>`<option value="${id}">${d.label}</option>`).join('');E.variant.onchange=e=>setVariant(e.target.value);$('run').onclick=runModel;$('record').onclick=recordMeasurement;$('check').onclick=checkExperiment;$('reset').onclick=reset;$('hint').onclick=()=>revealHint();addEventListener('resize',resize);addEventListener('message',e=>{const d=e.data||{};if(d.type==='simulation_control'&&(!d.simulation_id||d.simulation_id===window.SIMULATION_CONFIG.id))executeAICommand(d.command,d.parameters||{})});window.setVariant=setVariant;window.setParameters=setParameters;window.runModel=runModel;window.recordMeasurement=recordMeasurement;window.checkExperiment=checkExperiment;window.executeAICommand=(c,p={})=>{if(c==='start')S.status='running';else if(c==='set_variant')setVariant(p.variant_id);else if(c==='set_parameters')setParameters(p);else if(c==='run_model')runModel();else if(c==='record_measurement')recordMeasurement();else if(c==='check')checkExperiment();else if(c==='reset')reset();else if(c==='reveal_hint')revealHint(+p.level||1);else if(c==='highlight')highlight(p.target);emit()};setVariant(S.variant);resize();manifest();setTimeout(manifest,350);
</script></body></html>
