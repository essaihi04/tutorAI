<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NucleoLab — Physique nucléaire</title><link rel="stylesheet" href="../shared/lab.css"></head><body>
<div class="app"><header class="top"><div class="brand"><div class="icon">⚛️</div><div><div class="eyebrow">LABORATOIRE RÉEL · 2BAC PC BIOF</div><h1>NucleoLab</h1></div></div><select id="variant" class="variant-select" aria-label="Expérience"></select><div class="progress"><div class="progress-row"><span>Compétences</span><span id="progressText">0/4</span></div><div class="track"><div class="fill" id="progressFill"></div></div></div></header>
<main><section class="scene"><img id="sceneImage" alt="Laboratoire de physique nucléaire"><div id="hotspots"></div><div class="scene-caption"><span class="step" id="sceneStep"></span><h2 id="sceneTitle"></h2><p id="sceneCaption"></p></div></section><section class="panel"><div class="panel-head"><div><div class="kicker" id="kicker"></div><h2 id="title"></h2><p class="instruction" id="instruction"></p></div><span class="status" id="status">Prêt</span></div><div class="lab"><div class="controls" id="controls"></div><div class="visual"><canvas id="canvas" aria-label="Modèle nucléaire calculé"></canvas><div class="visual-note" id="note"></div></div></div><div class="log" id="log"></div><div class="feedback" id="feedback">Sélectionne un noyau puis lance une mesure.</div><div class="actions"><button id="reset">Réinitialiser</button><button class="hint" id="hint">💡 Indice</button><button class="run" id="run">Simuler</button><button id="record">Enregistrer</button><button class="primary" id="check">Vérifier</button></div></section></main><div class="guide" id="guide"></div></div>
<script>
const IMG='/media/images/physics/advanced_labs/';
const DATA={decay:{label:'1 · Décroissance et demi-vie',image:IMG+'nuclear_lab.webp',step:'EXPÉRIENCE 1/4',scene:'Un comptage fluctue, la loi reste prévisible',caption:'Le nombre de noyaux décroît exponentiellement malgré le caractère aléatoire.',kicker:'N(t) = N₀ · 2⁻ᵗ⁄ᵗ½',title:'Retrouve la demi-vie par comptage',instruction:'Change l’isotope et le temps ; relève trois points dont t = t½.',goal:'Identifier t½ et vérifier N(t½) ≈ N₀/2.'},transformations:{label:'2 · α, β⁻, β⁺ et γ',image:IMG+'nuclear_lab.webp',step:'EXPÉRIENCE 2/4',scene:'Le diagramme N–Z conserve A et Z selon la particule',caption:'Chaque désintégration déplace le noyau d’une manière précise.',kicker:'CONSERVATION DE A ET Z',title:'Construis les équations nucléaires',instruction:'Choisis α, β⁻ ou β⁺ puis observe le déplacement sur N–Z.',goal:'Valider les trois transformations et leurs conservations.'},mass_energy:{label:'3 · Masse, liaison, fission et fusion',image:IMG+'nuclear_lab.webp',step:'EXPÉRIENCE 3/4',scene:'Une petite perte de masse libère beaucoup d’énergie',caption:'Le bilan repose sur ΔE = Δm·c² et 1 u·c² = 931,5 MeV.',kicker:'ΔE = Δm · c²',title:'Compare fusion, fission et stabilité',instruction:'Calcule l’énergie libérée et compare l’énergie de liaison par nucléon.',goal:'Comparer une fusion, une fission et le noyau le plus lié.'},spectra:{label:'4 · Quantification et spectres',image:IMG+'spectra_lab.webp',step:'EXPÉRIENCE 4/4',scene:'Les raies révèlent des niveaux d’énergie discrets',caption:'Chaque photon correspond exactement à une transition atomique.',kicker:'ΔE = hν = hc/λ',title:'Relie transition, photon et raie',instruction:'Change les niveaux de l’hydrogène puis compare au doublet du sodium.',goal:'Enregistrer deux raies de Balmer et un spectre de sodium.'}};
const ISO={C14:{label:'Carbone 14',Z:6,N:8,half:5730,unit:'ans',mode:'β⁻'},I131:{label:'Iode 131',Z:53,N:78,half:8.02,unit:'jours',mode:'β⁻'},Ra226:{label:'Radium 226',Z:88,N:138,half:1600,unit:'ans',mode:'α'},F18:{label:'Fluor 18',Z:9,N:9,half:109.8,unit:'min',mode:'β⁺'}};
const REACTIONS={fusion:{label:'Fusion D + T → He-4 + n',massBefore:5.030151,massAfter:5.011268,energy:17.59,binding:7.07},fission:{label:'Fission U-235 + n',massBefore:236.0526,massAfter:235.8352,energy:202.5,binding:8.45},iron:{label:'Fer 56 · noyau très lié',massBefore:56,massAfter:55.471,energy:492.3,binding:8.79}};
window.SIMULATION_CONFIG={id:'physics_nuclear_advanced_lab',version:'2.0',title:'NucleoLab avancé',variants:Object.keys(DATA).map(id=>({id,label:DATA[id].label,objective:DATA[id].goal})),commands:['start','set_variant','set_parameters','run_model','record_measurement','check','reset','reveal_hint','highlight'],command_schema:{set_variant:{variant_id:'decay | transformations | mass_energy | spectra'},set_parameters:{isotope:'C14 | I131 | Ra226 | F18',initial_nuclei:'100..5000',time_half_lives:'0..5',decay_mode:'alpha | beta_minus | beta_plus',reaction:'fusion | fission | iron',atom:'hydrogen | sodium',n_initial:'3..6',n_final:'1..2'}},state_schema:{parameters:'réglages',derived_values:'résultats physiques',measurements:'observations enregistrées',student_actions:'historique',completed_variants:'liste',objective_progress:'0..1'}};
const requested=new URLSearchParams(location.search).get('variant');const S={variant:DATA[requested]?requested:'decay',status:'idle',actions:[],completed:[],attempts:0,hints:0,measurements:{decay:[],transformations:[],mass_energy:[],spectra:[]},params:{isotope:'C14',N0:1000,halfMultiples:1,decayMode:'beta_minus',reaction:'fusion',atom:'hydrogen',ni:3,nf:2}};
const $=id=>document.getElementById(id),E={variant:$('variant'),progressText:$('progressText'),progressFill:$('progressFill'),image:$('sceneImage'),hotspots:$('hotspots'),sceneStep:$('sceneStep'),sceneTitle:$('sceneTitle'),sceneCaption:$('sceneCaption'),kicker:$('kicker'),title:$('title'),instruction:$('instruction'),status:$('status'),controls:$('controls'),canvas:$('canvas'),note:$('note'),log:$('log'),feedback:$('feedback'),guide:$('guide')};
function act(action,details={}){S.actions.push({action,variant:S.variant,details,timestamp:Date.now()});if(S.actions.length>80)S.actions=S.actions.slice(-80)}function rnd(seed){const x=Math.sin(seed*999.91+17.17)*43758.5453;return x-Math.floor(x)}
function decayValues(){const iso=ISO[S.params.isotope],t=S.params.halfMultiples*iso.half,expected=S.params.N0*Math.pow(.5,S.params.halfMultiples),observed=Math.max(0,Math.round(expected+(rnd(S.params.N0+S.params.halfMultiples*31)-.5)*2*Math.sqrt(expected)));return{isotope:iso.label,half_life:iso.half,unit:iso.unit,time:+t.toFixed(2),expected_nuclei:+expected.toFixed(1),observed_nuclei:observed,remaining_ratio:+(observed/S.params.N0).toFixed(3),activity_relative:+(expected/S.params.N0).toFixed(3)}}
function transformValues(){const iso=ISO[S.params.isotope],mode=S.params.decayMode,A=iso.Z+iso.N;let Z=iso.Z,N=iso.N,particle='',law='';if(mode==='alpha'){Z-=2;N-=2;particle='⁴₂He';law='A−4 ; Z−2'}else if(mode==='beta_minus'){Z+=1;N-=1;particle='⁰₋₁e';law='A constant ; Z+1'}else{Z-=1;N+=1;particle='⁰₊₁e';law='A constant ; Z−1'}return{parent:{A,Z:iso.Z,N:iso.N},daughter:{A:Z+N,Z,N},emitted_particle:particle,conservation:law,mode}}
function energyValues(){const r=REACTIONS[S.params.reaction],dm=r.massBefore-r.massAfter,calc=S.params.reaction==='fission'?r.energy:dm*931.5;return{reaction:r.label,mass_before_u:r.massBefore,mass_after_u:r.massAfter,mass_defect_u:+dm.toFixed(6),released_energy_mev:+calc.toFixed(2),binding_energy_per_nucleon_mev:r.binding}}
function spectrumValues(){if(S.params.atom==='sodium')return{atom:'Sodium',lines_nm:[589.0,589.6],transition:'doublet jaune',photon_energy_ev:2.11};const ni=Math.max(S.params.nf+1,S.params.ni),nf=S.params.nf,dE=13.6*(1/(nf*nf)-1/(ni*ni)),lambda=1240/dE;return{atom:'Hydrogène',n_initial:ni,n_final:nf,photon_energy_ev:+dE.toFixed(3),wavelength_nm:+lambda.toFixed(1),series:nf===2?'Balmer':nf===1?'Lyman':'Paschen'}}
function derived(){return S.variant==='decay'?decayValues():S.variant==='transformations'?transformValues():S.variant==='mass_energy'?energyValues():spectrumValues()}
function snap(extra={}){return Object.assign({simulation_status:S.status,current_variant:S.variant,skill:DATA[S.variant].goal,parameters:{...S.params},derived_values:derived(),measurements:[...S.measurements[S.variant]],attempts:S.attempts,hints_used:S.hints,completed_variants:[...S.completed],expected_answer:DATA[S.variant].goal},extra)}function emit(extra={}){parent.postMessage({type:'simulation_state',simulation_id:window.SIMULATION_CONFIG.id,student_actions:S.actions,current_state:snap(extra),objective_progress:S.completed.length/4,timestamp:Date.now()},'*')}function manifest(){window.__SIMULATION_MANIFEST_SENT__=true;parent.postMessage({type:'simulation_manifest',simulation_id:window.SIMULATION_CONFIG.id,capabilities:{commands:window.SIMULATION_CONFIG.commands,globals:['executeAICommand','setVariant','setParameters','runModel','recordMeasurement','checkExperiment'],config:window.SIMULATION_CONFIG,command_schema:window.SIMULATION_CONFIG.command_schema,state_schema:window.SIMULATION_CONFIG.state_schema},page_text:'NucleoLab calcule décroissance, conservations nucléaires, bilans masse-énergie et spectres atomiques. Le tuteur reçoit chaque réglage, mesure et comparaison.'},'*')}
function slider(id,label,min,max,step,value,unit){return`<div class="control"><label for="${id}"><span>${label}</span><b>${value} ${unit}</b></label><input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${value}"></div>`}function metric(l,v){return`<div class="metric"><small>${l}</small><strong>${v}</strong></div>`}function selectButtons(attr,items,current){return`<div class="seg">${items.map(([v,l])=>`<button data-${attr}="${v}" class="${v===current?'active':''}">${l}</button>`).join('')}</div>`}
function renderControls(){const p=S.params,d=derived();if(S.variant==='decay'){E.controls.innerHTML=`<div class="control"><div class="control-title"><span>Isotope</span></div>${selectButtons('isotope',Object.entries(ISO).map(([k,v])=>[k,v.label]),p.isotope)}</div>${slider('N0','Noyaux initiaux N₀',100,5000,100,p.N0,'')}${slider('halfMultiples','Temps',0,5,.25,p.halfMultiples,'× t½')}<div class="metrics">${metric('t½',d.half_life+' '+d.unit)}${metric('Temps',d.time+' '+d.unit)}${metric('N théorique',d.expected_nuclei)}${metric('Comptage',d.observed_nuclei)}</div>`;bind('N0','N0');bind('halfMultiples','halfMultiples');document.querySelectorAll('[data-isotope]').forEach(b=>b.onclick=()=>{p.isotope=b.dataset.isotope;act('select_isotope',{isotope:p.isotope});renderControls();emit()})}else if(S.variant==='transformations'){E.controls.innerHTML=`<div class="control"><div class="control-title"><span>Noyau parent</span></div>${selectButtons('isotope',Object.entries(ISO).map(([k])=>[k,k]),p.isotope)}</div><div class="control"><div class="control-title"><span>Transformation</span></div>${selectButtons('decay',['alpha','beta_minus','beta_plus'].map(x=>[x,x==='alpha'?'α':x==='beta_minus'?'β⁻':'β⁺']),p.decayMode)}</div><div class="metrics">${metric('Parent',`A=${d.parent.A} · Z=${d.parent.Z}`)}${metric('Fils',`A=${d.daughter.A} · Z=${d.daughter.Z}`)}${metric('Particule',d.emitted_particle)}${metric('Loi',d.conservation)}</div>`;document.querySelectorAll('[data-isotope]').forEach(b=>b.onclick=()=>{p.isotope=b.dataset.isotope;renderControls();emit()});document.querySelectorAll('[data-decay]').forEach(b=>b.onclick=()=>{p.decayMode=b.dataset.decay;act('select_decay_mode',{mode:p.decayMode});renderControls();emit()})}else if(S.variant==='mass_energy'){E.controls.innerHTML=`<div class="control"><div class="control-title"><span>Système</span></div>${selectButtons('reaction',Object.entries(REACTIONS).map(([k,v])=>[k,k==='iron'?'Fer 56':k==='fusion'?'Fusion':'Fission']),p.reaction)}</div><div class="metrics">${metric('Δm',d.mass_defect_u+' u')}${metric('Énergie',d.released_energy_mev+' MeV')}${metric('Eₗ/A',d.binding_energy_per_nucleon_mev+' MeV')}${metric('Processus',p.reaction)}</div><div class="control"><div class="control-title"><span>Interprétation</span><b>${d.reaction}</b></div></div>`;document.querySelectorAll('[data-reaction]').forEach(b=>b.onclick=()=>{p.reaction=b.dataset.reaction;act('select_reaction',{reaction:p.reaction});renderControls();emit()})}else{E.controls.innerHTML=`<div class="control"><div class="control-title"><span>Atome</span></div>${selectButtons('atom',[['hydrogen','Hydrogène'],['sodium','Sodium']],p.atom)}</div>${p.atom==='hydrogen'?slider('ni','Niveau initial nᵢ',3,6,1,p.ni,'')+slider('nf','Niveau final n𝒇',1,2,1,p.nf,''):''}<div class="metrics">${metric('Atome',d.atom)}${metric('Transition',d.transition||`${d.n_initial} → ${d.n_final}`)}${metric('Énergie',d.photon_energy_ev+' eV')}${metric('λ',d.wavelength_nm?d.wavelength_nm+' nm':d.lines_nm.join(' / ')+' nm')}</div>`;if(p.atom==='hydrogen'){bind('ni','ni');bind('nf','nf')}document.querySelectorAll('[data-atom]').forEach(b=>b.onclick=()=>{p.atom=b.dataset.atom;act('select_atom',{atom:p.atom});renderControls();emit()})}updateLog();draw()}
function bind(id,key){$(id).onchange=e=>{S.params[key]=+e.target.value;if(key==='ni'&&S.params.ni<=S.params.nf)S.params.ni=S.params.nf+1;act('set_parameter',{parameter:key,value:S.params[key]});renderControls();emit({last_manipulation:{parameter:key,value:S.params[key]}})}}
function setVariant(id){if(!DATA[id])return;S.variant=id;S.status='running';S.attempts=0;const d=DATA[id];act('set_variant',{variant_id:id});E.variant.value=id;E.image.src=d.image;E.sceneStep.textContent=d.step;E.sceneTitle.textContent=d.scene;E.sceneCaption.textContent=d.caption;E.kicker.textContent=d.kicker;E.title.textContent=d.title;E.instruction.textContent=d.instruction;E.status.textContent='En manipulation';renderHotspots();renderControls();feedback('Formule une prédiction puis simule.');progress();emit()}
function renderHotspots(){const sets=S.variant==='spectra'?[['tube','Tube',20,55],['grating','Réseau',55,55],['lines','Raies',84,43]]:[['source','Source scellée',18,48],['detector','Détecteur',52,50],['counter','Compteur',78,42]];E.hotspots.innerHTML=sets.map(x=>`<button class="hotspot" id="hot-${x[0]}" style="left:${x[2]}%;top:${x[3]}%">${x[1]}</button>`).join('');E.hotspots.querySelectorAll('button').forEach(b=>b.onclick=()=>highlight(b.id.slice(4)))}
function runModel(){S.status='running';act('run_model',{parameters:{...S.params},result:derived()});E.status.textContent='Mesure calculée';feedback('Résultat produit par le modèle. Enregistre-le pour comparer.','ok');draw();emit({last_manipulation:{type:'run_model',result:derived()}})}
function recordMeasurement(){const item={...derived(),parameters:{...S.params},index:S.measurements[S.variant].length+1};S.measurements[S.variant].push(item);act('record_measurement',item);feedback('Observation '+item.index+' enregistrée.','ok');updateLog();emit({last_measurement:item})}
function checkExperiment(){S.attempts++;const m=S.measurements[S.variant];let correct=false,errors=[];if(S.variant==='decay'){correct=m.length>=3&&m.some(x=>x.remaining_ratio>=.45&&x.remaining_ratio<=.55);if(m.length<3)errors.push('trois temps nécessaires');if(!m.some(x=>x.remaining_ratio>=.45&&x.remaining_ratio<=.55))errors.push('mesure à t = t½ manquante')}else if(S.variant==='transformations'){const modes=new Set(m.map(x=>x.mode));correct=['alpha','beta_minus','beta_plus'].every(x=>modes.has(x));errors=['alpha','beta_minus','beta_plus'].filter(x=>!modes.has(x))}else if(S.variant==='mass_energy'){const r=new Set(m.map(x=>x.parameters.reaction));correct=['fusion','fission','iron'].every(x=>r.has(x));errors=['fusion','fission','iron'].filter(x=>!r.has(x))}else{correct=m.filter(x=>x.atom==='Hydrogène'&&x.n_final===2).length>=2&&m.some(x=>x.atom==='Sodium');if(m.filter(x=>x.atom==='Hydrogène').length<2)errors.push('deux transitions de Balmer');if(!m.some(x=>x.atom==='Sodium'))errors.push('spectre du sodium')}act('check_experiment',{correct,errors});if(!correct){feedback('À compléter : '+errors.join(' · '),'no');emit({correct:false,errors});return}if(!S.completed.includes(S.variant))S.completed.push(S.variant);S.status='finished';E.status.textContent='Expérience réussie';feedback('✓ Les données justifient la loi demandée.','ok');progress();emit({correct:true,validated_measurements:m})}
function updateLog(){E.log.innerHTML=Object.keys(DATA).map(id=>`<span class="chip ${S.completed.includes(id)?'done':''}">${S.completed.includes(id)?'✓ ':''}${DATA[id].label.split('·')[1]}</span>`).join('')}function progress(){E.progressText.textContent=S.completed.length+'/4';E.progressFill.style.width=S.completed.length/4*100+'%';updateLog()}function feedback(t,type=''){E.feedback.className='feedback'+(type?' '+type:'');E.feedback.textContent=t}
function revealHint(level=++S.hints){const h={decay:['Cherche le temps où le comptage vaut environ la moitié.','Les fluctuations n’annulent pas la loi exponentielle.','Relève 0, t½ et 2t½.'],transformations:['α emporte 4 nucléons et 2 protons.','β⁻ transforme un neutron en proton.','β⁺ transforme un proton en neutron.'],mass_energy:['Multiplie le défaut de masse en u par 931,5.','Compare l’énergie de liaison par nucléon.','Enregistre fusion, fission et fer 56.'],spectra:['Une raie correspond à un seul ΔE.','La série de Balmer finit sur n = 2.','Compare deux transitions H puis le doublet Na.']}[S.variant];const t=h[Math.min(level-1,2)];S.hints=Math.max(S.hints,level);act('request_hint',{level});feedback('💡 '+t);show(t);emit({last_hint:t})}
function highlight(target){const b=$('hot-'+target);if(b){b.classList.remove('active');void b.offsetWidth;b.classList.add('active')}act('highlight',{target});show('Observe : '+target);emit({last_highlight:target})}function show(t){E.guide.textContent='🤖 '+t;E.guide.classList.add('show');clearTimeout(show.timer);show.timer=setTimeout(()=>E.guide.classList.remove('show'),3500)}
function resize(){const r=E.canvas.getBoundingClientRect(),d=devicePixelRatio||1;E.canvas.width=Math.max(1,r.width*d);E.canvas.height=Math.max(1,r.height*d);draw()}
function draw(){const ctx=E.canvas.getContext('2d'),dpr=devicePixelRatio||1,W=E.canvas.width/dpr,H=E.canvas.height/dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.fillStyle='#f8fbff';ctx.fillRect(0,0,W,H);if(S.variant==='decay')drawDecay(ctx,W,H);else if(S.variant==='transformations')drawNZ(ctx,W,H);else if(S.variant==='mass_energy')drawEnergy(ctx,W,H);else drawSpectrum(ctx,W,H)}
function axes(ctx,W,H){ctx.strokeStyle='#8793a7';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(48,20);ctx.lineTo(48,H-38);ctx.lineTo(W-20,H-38);ctx.stroke()}
function drawDecay(ctx,W,H){axes(ctx,W,H);const p=S.params,d=decayValues();ctx.strokeStyle='#2855c7';ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<=100;i++){const x=48+i/100*(W-75),y=H-38-(H-65)*Math.pow(.5,i/20);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();for(let k=0;k<=5;k++){const x=48+k/5*(W-75),n=p.N0*Math.pow(.5,k),y=H-38-(H-65)*n/p.N0;ctx.fillStyle=k===p.halfMultiples?'#ef7d32':'#16a6b6';ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fill()}const x=48+p.halfMultiples/5*(W-75),y=H-38-(H-65)*d.remaining_ratio;ctx.fillStyle='#ef7d32';ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.fill();E.note.textContent=`N/N₀ = ${d.remaining_ratio} · t = ${d.time} ${d.unit}`}
function drawNZ(ctx,W,H){axes(ctx,W,H);const d=transformValues(),scale=Math.min((W-80)/160,(H-70)/160),ox=55,oy=H-42;ctx.fillStyle='#dbe5f8';for(let z=2;z<100;z+=4){const n=z*(1+.004*z);ctx.fillRect(ox+n*scale,oy-z*scale,5,5)}function point(o,color,label){const x=ox+o.N*scale,y=oy-o.Z*scale;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#172033';ctx.font='bold 12px sans-serif';ctx.fillText(label,x+12,y)}point(d.parent,'#2855c7','parent');point(d.daughter,'#ef7d32','fils');ctx.strokeStyle='#c83a55';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(ox+d.parent.N*scale,oy-d.parent.Z*scale);ctx.lineTo(ox+d.daughter.N*scale,oy-d.daughter.Z*scale);ctx.stroke();E.note.textContent=`${d.mode} · ${d.conservation}`}
function drawEnergy(ctx,W,H){const vals=Object.entries(REACTIONS),max=220;vals.forEach(([id,r],i)=>{const active=id===S.params.reaction,y=45+i*(H-75)/3,h=30,w=(r.energy/max)*(W-140);ctx.fillStyle=active?'#ef7d32':'#aec5ee';ctx.fillRect(110,y,w,h);ctx.fillStyle='#172033';ctx.font='bold 13px sans-serif';ctx.fillText(id==='iron'?'Fe-56 liaison':id,y+20);ctx.fillText(r.energy+' MeV',115+w,y+20)});E.note.textContent=`Eₗ/A = ${energyValues().binding_energy_per_nucleon_mev} MeV · nucléon⁻¹`}
function spectralColor(n){if(n<440)return'#7b2cff';if(n<490)return'#245cff';if(n<510)return'#16a6d5';if(n<570)return'#19b85a';if(n<590)return'#f3d328';if(n<625)return'#ff8a24';return'#ef334f'}
function drawSpectrum(ctx,W,H){ctx.fillStyle='#071020';ctx.fillRect(0,0,W,H);const d=spectrumValues(),lines=d.lines_nm||[d.wavelength_nm];lines.forEach((n,i)=>{const x=35+(n-390)/310*(W-70);ctx.strokeStyle=spectralColor(n);ctx.lineWidth=d.atom==='Sodium'?4:7;ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=12;ctx.beginPath();ctx.moveTo(x,H*.16);ctx.lineTo(x,H*.82);ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font='12px sans-serif';ctx.fillText(n.toFixed(1)+' nm',x-24,H*.9-i*16)});E.note.textContent=d.atom==='Hydrogène'?`n ${d.n_initial} → ${d.n_final} · ${d.wavelength_nm} nm`:'Doublet 589,0 / 589,6 nm'}
function setParameters(p){const map={initial_nuclei:'N0',time_half_lives:'halfMultiples',decay_mode:'decayMode',n_initial:'ni',n_final:'nf'};Object.entries(p||{}).forEach(([k,v])=>{const key=map[k]||k;if(key in S.params)S.params[key]=typeof S.params[key]==='number'?+v:v});act('set_parameters',{...p});renderControls();emit({last_manipulation:{type:'set_parameters',...p}})}function reset(){S.measurements[S.variant]=[];S.attempts=0;act('reset');setVariant(S.variant)}
E.variant.innerHTML=Object.entries(DATA).map(([id,d])=>`<option value="${id}">${d.label}</option>`).join('');E.variant.onchange=e=>setVariant(e.target.value);$('run').onclick=runModel;$('record').onclick=recordMeasurement;$('check').onclick=checkExperiment;$('reset').onclick=reset;$('hint').onclick=()=>revealHint();addEventListener('resize',resize);addEventListener('message',e=>{const d=e.data||{};if(d.type==='simulation_control'&&(!d.simulation_id||d.simulation_id===window.SIMULATION_CONFIG.id))executeAICommand(d.command,d.parameters||{})});window.setVariant=setVariant;window.setParameters=setParameters;window.runModel=runModel;window.recordMeasurement=recordMeasurement;window.checkExperiment=checkExperiment;window.executeAICommand=(c,p={})=>{if(c==='start')S.status='running';else if(c==='set_variant')setVariant(p.variant_id);else if(c==='set_parameters')setParameters(p);else if(c==='run_model')runModel();else if(c==='record_measurement')recordMeasurement();else if(c==='check')checkExperiment();else if(c==='reset')reset();else if(c==='reveal_hint')revealHint(+p.level||1);else if(c==='highlight')highlight(p.target);emit()};setVariant(S.variant);resize();manifest();setTimeout(manifest,350);
</script></body></html>
