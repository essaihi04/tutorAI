<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NucleoLab — Physique nucléaire au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="../shared/lab.css"></head><body>
<script>
// NucleoLab : décroissance, transformations α/β, masse-énergie, spectres — dessinés à la craie. Modèle inchangé.
const ISO = { C14: { label: 'Carbone 14', sym: '¹⁴C', Z: 6, N: 8, half: 5730, unit: 'ans', mode: 'β⁻' }, I131: { label: 'Iode 131', sym: '¹³¹I', Z: 53, N: 78, half: 8.02, unit: 'jours', mode: 'β⁻' }, Ra226: { label: 'Radium 226', sym: '²²⁶Ra', Z: 88, N: 138, half: 1600, unit: 'ans', mode: 'α' }, F18: { label: 'Fluor 18', sym: '¹⁸F', Z: 9, N: 9, half: 109.8, unit: 'min', mode: 'β⁺' } };
const REACTIONS = { fusion: { label: 'Fusion D + T → He-4 + n', eq: '²H + ³H → ⁴He + n', massBefore: 5.030151, massAfter: 5.011268, energy: 17.59, binding: 7.07 }, fission: { label: 'Fission U-235 + n', eq: '²³⁵U + n → ⁹⁴Sr + ¹⁴⁰Xe + 2n', massBefore: 236.0526, massAfter: 235.8352, energy: 202.5, binding: 8.45 }, iron: { label: 'Fer 56 · noyau très lié', eq: '⁵⁶Fe : 26 p + 30 n', massBefore: 56, massAfter: 55.471, energy: 492.3, binding: 8.79 } };
const rnd = seed => { const x = Math.sin(seed * 999.91 + 17.17) * 43758.5453; return x - Math.floor(x); };
// Pont tuteur (Tableau.protocole, shared/tableau/tableau.js) : simulation_manifest, simulation_state et simulation_control
// passent par parent.postMessage ; commandes : start, set_variant, set_parameters, run_model, record_measurement, check, reset, reveal_hint, highlight.
window.LAB = {
  id: 'physics_nuclear_advanced_lab', title: 'NucleoLab avancé', eyebrow: 'Physique · 2 BAC PC · nucléaire et quantique', seed: 41,
  DATA: {
    decay: { label: 'Demi-vie', kicker: 'N(t) = N₀ · 2⁻ᵗ⁄ᵗ½', title: 'Retrouve la demi-vie par comptage', instruction: 'Change l’isotope et le temps ; relève trois points dont t = t½.', goal: 'Identifier t½ et vérifier N(t½) ≈ N₀/2.' },
    transformations: { label: 'α, β⁻, β⁺', kicker: 'conservation de A et Z', title: 'Construis les équations nucléaires', instruction: 'Choisis α, β⁻ ou β⁺ puis observe le déplacement sur le diagramme N–Z.', goal: 'Valider les trois transformations et leurs conservations.' },
    mass_energy: { label: 'Masse · énergie', kicker: 'ΔE = Δm · c²', title: 'Compare fusion, fission et stabilité', instruction: 'Calcule l’énergie libérée et compare l’énergie de liaison par nucléon.', goal: 'Comparer une fusion, une fission et le noyau le plus lié.' },
    spectra: { label: 'Spectres', kicker: 'ΔE = hν = hc/λ', title: 'Relie transition, photon et raie', instruction: 'Change les niveaux de l’hydrogène puis compare au doublet du sodium.', goal: 'Enregistrer deux raies de Balmer et un spectre de sodium.' },
  },
  params: { isotope: 'C14', N0: 1000, halfMultiples: 1, decayMode: 'beta_minus', reaction: 'fusion', atom: 'hydrogen', ni: 3, nf: 2 },
  paramMap: { initial_nuclei: 'N0', time_half_lives: 'halfMultiples', decay_mode: 'decayMode', n_initial: 'ni', n_final: 'nf' },
  afterParams: p => { if (p.ni <= p.nf) p.ni = p.nf + 1; },
  command_schema: { set_variant: { variant_id: 'decay | transformations | mass_energy | spectra' }, set_parameters: { isotope: 'C14 | I131 | Ra226 | F18', initial_nuclei: '100..5000', time_half_lives: '0..5', decay_mode: 'alpha | beta_minus | beta_plus', reaction: 'fusion | fission | iron', atom: 'hydrogen | sodium', n_initial: '3..6', n_final: '1..2' }, highlight: { target: 'source | detector | counter | tube | grating | lines' } },
  state_schema: { parameters: 'réglages', derived_values: 'résultats physiques', measurements: 'observations enregistrées', student_actions: 'historique', completed_variants: 'liste', objective_progress: '0..1' },
  page_text: 'NucleoLab, dessiné au tableau, calcule décroissance, conservations nucléaires, bilans masse-énergie et spectres atomiques. Source, détecteur, courbe N(t), diagramme N–Z, équations et raies s’écrivent à la craie ; le tuteur reçoit chaque réglage, mesure et comparaison.',
  aliases: { source: 'source', detector: 'detecteur', counter: 'courbe', tube: 'source', grating: 'reseau', lines: 'raies' }, labels: { source: 'la source', detecteur: 'le détecteur', courbe: 'la courbe', reseau: 'le réseau', raies: 'les raies' },
  runLabel: v => v === 'decay' ? 'Compter' : 'Simuler',
  controls(v, p) {
    const isotopes = Object.entries(ISO).map(([k, i]) => [k, i.label]);
    if (v === 'decay') return [{ type: 'choice', key: 'isotope', options: isotopes, action: 'select_isotope' }, { type: 'range', key: 'N0', label: 'noyaux initiaux N₀', min: 100, max: 5000, step: 100, unit: '' }, { type: 'range', key: 'halfMultiples', label: 'temps', min: 0, max: 5, step: .25, unit: '× t½' }];
    if (v === 'transformations') return [{ type: 'choice', key: 'isotope', label: 'parent', options: Object.keys(ISO).map(k => [k, ISO[k].sym]), action: 'select_isotope' }, { type: 'choice', key: 'decayMode', label: 'émission', options: [['alpha', 'α'], ['beta_minus', 'β⁻'], ['beta_plus', 'β⁺']], action: 'select_decay_mode' }];
    if (v === 'mass_energy') return [{ type: 'choice', key: 'reaction', options: [['fusion', 'fusion'], ['fission', 'fission'], ['iron', 'fer 56']], action: 'select_reaction' }];
    const c = [{ type: 'choice', key: 'atom', options: [['hydrogen', 'hydrogène'], ['sodium', 'sodium']], action: 'select_atom' }];
    if (p.atom === 'hydrogen') c.push({ type: 'range', key: 'ni', label: 'niveau initial nᵢ', min: 3, max: 6, step: 1, unit: '' }, { type: 'range', key: 'nf', label: 'niveau final n𝒇', min: 1, max: 2, step: 1, unit: '', after: q => { if (q.ni <= q.nf) q.ni = q.nf + 1; } });
    return c;
  },
  values(v, p) {
    if (v === 'decay') { const iso = ISO[p.isotope], t = p.halfMultiples * iso.half, expected = p.N0 * Math.pow(.5, p.halfMultiples), observed = Math.max(0, Math.round(expected + (rnd(p.N0 + p.halfMultiples * 31) - .5) * 2 * Math.sqrt(expected))); return { isotope: iso.label, half_life: iso.half, unit: iso.unit, time: +t.toFixed(2), expected_nuclei: +expected.toFixed(1), observed_nuclei: observed, remaining_ratio: +(observed / p.N0).toFixed(3), activity_relative: +(expected / p.N0).toFixed(3) }; }
    if (v === 'transformations') { const iso = ISO[p.isotope], mode = p.decayMode, A = iso.Z + iso.N; let Z = iso.Z, N = iso.N, particle = '', law = ''; if (mode === 'alpha') { Z -= 2; N -= 2; particle = '⁴₂He'; law = 'A−4 ; Z−2'; } else if (mode === 'beta_minus') { Z += 1; N -= 1; particle = '⁰₋₁e'; law = 'A constant ; Z+1'; } else { Z -= 1; N += 1; particle = '⁰₊₁e'; law = 'A constant ; Z−1'; } return { parent: { A, Z: iso.Z, N: iso.N }, daughter: { A: Z + N, Z, N }, emitted_particle: particle, conservation: law, mode }; }
    if (v === 'mass_energy') { const r = REACTIONS[p.reaction], dm = r.massBefore - r.massAfter, calc = p.reaction === 'fission' ? r.energy : dm * 931.5; return { reaction: r.label, mass_before_u: r.massBefore, mass_after_u: r.massAfter, mass_defect_u: +dm.toFixed(6), released_energy_mev: +calc.toFixed(2), binding_energy_per_nucleon_mev: r.binding }; }
    if (p.atom === 'sodium') return { atom: 'Sodium', lines_nm: [589.0, 589.6], transition: 'doublet jaune', photon_energy_ev: 2.11 };
    const ni = Math.max(p.nf + 1, p.ni), nf = p.nf, dE = 13.6 * (1 / (nf * nf) - 1 / (ni * ni)), lambda = 1240 / dE;
    return { atom: 'Hydrogène', n_initial: ni, n_final: nf, photon_energy_ev: +dE.toFixed(3), wavelength_nm: +lambda.toFixed(1), series: nf === 2 ? 'Balmer' : nf === 1 ? 'Lyman' : 'Paschen' };
  },
  columns(v) {
    if (v === 'decay') return [{ label: 't / t½', get: x => x.parameters.halfMultiples }, { label: 'N / N₀', get: x => x.remaining_ratio }];
    if (v === 'transformations') return [{ label: 'parent', get: x => ISO[x.parameters.isotope].sym }, { label: 'mode', get: x => x.mode === 'alpha' ? 'α' : x.mode === 'beta_minus' ? 'β⁻' : 'β⁺' }];
    if (v === 'mass_energy') return [{ label: 'système', get: x => x.parameters.reaction }, { label: 'E (MeV)', get: x => x.released_energy_mev }];
    return [{ label: 'atome', get: x => x.atom }, { label: 'λ (nm)', get: x => x.wavelength_nm ?? x.lines_nm.join('/') }];
  },
  check(v, m) {
    const errors = []; let correct = false;
    if (v === 'decay') { const half = m.some(x => x.remaining_ratio >= .45 && x.remaining_ratio <= .55); correct = m.length >= 3 && half; if (m.length < 3) errors.push('trois temps nécessaires'); if (!half) errors.push('mesure à t = t½ manquante'); }
    else if (v === 'transformations') { const modes = new Set(m.map(x => x.mode)); correct = ['alpha', 'beta_minus', 'beta_plus'].every(x => modes.has(x)); ['alpha', 'beta_minus', 'beta_plus'].filter(x => !modes.has(x)).forEach(x => errors.push(x)); }
    else if (v === 'mass_energy') { const r = new Set(m.map(x => x.parameters.reaction)); correct = ['fusion', 'fission', 'iron'].every(x => r.has(x)); ['fusion', 'fission', 'iron'].filter(x => !r.has(x)).forEach(x => errors.push(x)); }
    else { correct = m.filter(x => x.atom === 'Hydrogène' && x.n_final === 2).length >= 2 && m.some(x => x.atom === 'Sodium'); if (m.filter(x => x.atom === 'Hydrogène').length < 2) errors.push('deux transitions de Balmer'); if (!m.some(x => x.atom === 'Sodium')) errors.push('spectre du sodium'); }
    return { correct, errors };
  },
  hints: { decay: ['Cherche le temps où le comptage vaut environ la moitié.', 'Les fluctuations n’annulent pas la loi exponentielle.', 'Relève 0, t½ et 2t½.'], transformations: ['α emporte 4 nucléons et 2 protons.', 'β⁻ transforme un neutron en proton.', 'β⁺ transforme un proton en neutron.'], mass_energy: ['Multiplie le défaut de masse en u par 931,5.', 'Compare l’énergie de liaison par nucléon.', 'Note fusion, fission et fer 56.'], spectra: ['Une raie correspond à un seul ΔE.', 'La série de Balmer finit sur n = 2.', 'Compare deux transitions H puis le doublet Na.'] },

  draw(craie, a) {
    const { p, d, variant: v } = a, fr = window.Tableau.fr;
    if (v === 'decay') {
      // Source scellée → détecteur → compteur, puis la courbe N(t)
      craie.rect(40, 70, 70, 60, { couleur: 'orange', arrondi: 6 }); craie.cercle(75, 100, 10, { couleur: 'orange', fond: 'orange' }); craie.texte('source', 75, 150, { couleur: 'orange', taille: 14, align: 'center' }).texte(ISO[p.isotope].sym, 75, 60, { couleur: 'orange', taille: 15, align: 'center' }); a.zone('source', 40, 70, 70, 60);
      for (let i = 0; i < 3; i++) craie.trait([[115, 85 + i * 15], [130, 80 + i * 15], [145, 90 + i * 15], [160, 85 + i * 15]], { couleur: 'faible', largeur: 1.2 });
      craie.rect(170, 70, 50, 60, { couleur: 'cyan', arrondi: 6 }); craie.texte('GM', 195, 106, { couleur: 'cyan', taille: 14, align: 'center' }).texte('détecteur', 195, 150, { couleur: 'cyan', taille: 14, align: 'center' }); a.zone('detecteur', 170, 70, 50, 60);
      craie.ligne(220, 100, 260, 100, { largeur: 1.5 }); craie.rect(260, 80, 90, 40, { arrondi: 5 }); craie.texte(a.ran ? String(d.observed_nuclei) : '— —', 305, 108, { couleur: 'jaune', taille: 20, align: 'center' }); craie.texte('compteur', 305, 150, { couleur: 'faible', taille: 14, align: 'center' });
      const x0 = 400, y0 = 330, w = 300, h = 160;
      craie.axe(x0, y0, x0 + w + 14, y0, [1, 2, 3, 4, 5].map(k => [k / 5 * w / (w + 14), k === 1 ? 't½' : k + 't½']), { taille: 12 }).axe(x0, y0, x0, y0 - h - 12, [[1, 'N₀'], [.5, 'N₀/2']], { vertical: true, taille: 12 }); craie.texte('N', x0 + 6, y0 - h - 14, { couleur: 'faible', taille: 14 });
      craie.courbe(u => [x0 + u * w, y0 - h * Math.pow(.5, u * 5)], 100, { couleur: 'cyan', largeur: 2.4 });
      craie.ligne(x0, y0 - h / 2, x0 + w / 5, y0 - h / 2, { couleur: 'orange', largeur: 1.2, pointille: [4, 4] }).ligne(x0 + w / 5, y0 - h / 2, x0 + w / 5, y0, { couleur: 'orange', largeur: 1.2, pointille: [4, 4] });
      a.zone('courbe', x0, y0 - h - 12, w + 14, h + 12);
      craie.direct(() => { for (const m of a.S.measurements.decay) craie.point(x0 + m.parameters.halfMultiples / 5 * w, y0 - h * m.remaining_ratio, 5, 'jaune'); if (a.ran) craie.point(x0 + p.halfMultiples / 5 * w, y0 - h * d.remaining_ratio, 7, 'orange'); });
      a.lignes(40, 200, [`${d.isotope} : t½ = ${fr(d.half_life, 1)} ${d.unit}`, `t = ${fr(p.halfMultiples, 2)} × t½ = ${fr(d.time, 1)} ${d.unit}`, `N théorique = N₀·2^(−t/t½) = ${fr(d.expected_nuclei, 0)}`, a.ran ? `comptage : ${d.observed_nuclei} noyaux, soit N/N₀ = ${fr(d.remaining_ratio, 2)}` : 'lance le comptage…'], { pas: 24, max: 330 });
    } else if (v === 'transformations') {
      const x0 = 70, y0 = 250, w = 300, h = 190, scale = Math.min(w / 150, h / 100);
      craie.axe(x0, y0, x0 + w + 14, y0, [[50 * scale / (w + 14), '50'], [100 * scale / (w + 14), '100'], [150 * scale / (w + 14), '150']], { taille: 12 }).axe(x0, y0, x0, y0 - h - 12, [[50 * scale / (h + 12), '50']], { vertical: true, taille: 12 });
      craie.texte('N', x0 + w + 18, y0 + 5, { couleur: 'faible', taille: 14 }).texte('Z', x0 + 6, y0 - h - 14, { couleur: 'faible', taille: 14 });
      craie.courbe(u => { const z = 2 + u * 96, n = z * (1 + .004 * z); return [x0 + n * scale, y0 - z * scale]; }, 40, { couleur: 'tresfaible', largeur: 6, tremble: 0 }); craie.texte('vallée de stabilité', x0 + 150, y0 - 40, { couleur: 'faible', taille: 12 });
      const P = d.parent, F = d.daughter, px = x0 + P.N * scale, py = y0 - P.Z * scale, fx = x0 + F.N * scale, fy = y0 - F.Z * scale;
      craie.point(px, py, 7, 'cyan'); craie.texte('parent', px + 12, py - 6, { couleur: 'cyan', taille: 14 });
      craie.fleche(px, py, fx + (fx > px ? -8 : fx < px ? 8 : 0), fy + (fy > py ? -8 : fy < py ? 8 : 0), { couleur: 'rouge', largeur: 2.4 });
      craie.point(fx, fy, 7, 'orange'); craie.texte('fils', fx + 12, fy + 18, { couleur: 'orange', taille: 14 });
      a.zone('source', px - 14, py - 14, 28, 28); a.zone('courbe', x0, y0 - h - 12, w + 14, h + 12);
      const sym = (A, Z) => `${A}₍${Z}₎X`;
      a.lignes(400, 230, [`${ISO[p.isotope].sym} (A = ${P.A}, Z = ${P.Z}, N = ${P.N})`, `→ fils : A = ${F.A}, Z = ${F.Z}, N = ${F.N}  +  ${d.emitted_particle}`, `loi : ${d.conservation}`, d.mode === 'alpha' ? 'ᴬ₂X → ᴬ⁻⁴₂₋₂Y + ⁴₂He' : d.mode === 'beta_minus' ? 'ᴬ₂X → ᴬ₂₊₁Y + ⁰₋₁e + ν̄' : 'ᴬ₂X → ᴬ₂₋₁Y + ⁰₊₁e + ν'], { pas: 26, max: 330 });
    } else if (v === 'mass_energy') {
      const r = REACTIONS[p.reaction];
      craie.texte(r.eq, 40, 70, { couleur: 'cyan', taille: 22, max: 330 });
      craie.texte(`m(avant) = ${fr(r.massBefore, 4)} u`, 40, 110, { couleur: 'faible', taille: 16 }).texte(`m(après) = ${fr(r.massAfter, 4)} u`, 40, 134, { couleur: 'faible', taille: 16 });
      craie.texte(`Δm = ${fr(d.mass_defect_u, 4)} u`, 40, 170, { couleur: 'jaune', taille: 18 });
      craie.texte(`ΔE = Δm·c² = ${fr(d.mass_defect_u, 4)} × 931,5 = ${fr(d.released_energy_mev, 1)} MeV`, 40, 200, { couleur: 'jaune', taille: 18, max: 340 });
      craie.texte(`Eₗ/A = ${fr(d.binding_energy_per_nucleon_mev, 2)} MeV par nucléon`, 40, 230, { couleur: 'violet', taille: 17 });
      a.zone('source', 30, 45, 340, 40);
      const x0 = 430, y0 = 330, w = 270, h = 150; const vals = Object.entries(REACTIONS);
      craie.axe(x0, y0, x0, y0 - h - 12, [[7.07 / 9, '7'], [8 / 9, '8'], [8.79 / 9, '8,8']], { vertical: true, taille: 12 }); craie.texte('Eₗ/A (MeV)', x0 + 6, y0 - h - 14, { couleur: 'faible', taille: 13 }); craie.ligne(x0, y0, x0 + w, y0, { couleur: 'faible', largeur: 1.5 });
      vals.forEach(([id, rr], i) => { const bx = x0 + 30 + i * 85, bh = rr.binding / 9 * h, actif = id === p.reaction; craie.rect(bx, y0 - bh, 50, bh, { couleur: actif ? 'orange' : 'faible', fond: actif ? 'orange' : null, arrondi: 3 }); craie.texte(id === 'iron' ? 'Fe-56' : id, bx + 25, y0 + 20, { couleur: actif ? 'orange' : 'faible', taille: 13, align: 'center' }); craie.texte(fr(rr.binding, 2), bx + 25, y0 - bh - 6, { couleur: actif ? 'orange' : 'faible', taille: 12, align: 'center' }); });
      a.zone('courbe', x0, y0 - h - 12, w, h + 30);
    } else {
      // Tube → réseau → écran avec raies
      craie.rect(40, 90, 60, 40, { couleur: p.atom === 'sodium' ? 'jaune' : 'rose', arrondi: 8 }); craie.texte(p.atom === 'sodium' ? 'lampe Na' : 'tube H', 70, 150, { couleur: 'faible', taille: 13, align: 'center' }); a.zone('source', 40, 90, 60, 40);
      craie.ligne(100, 110, 180, 110, { couleur: 'blanc', largeur: 2 }); craie.ligne(180, 80, 180, 140, { couleur: 'cyan', largeur: 3 }); for (let y = 84; y < 140; y += 8) craie.ligne(176, y, 184, y, { couleur: 'cyan', largeur: 1, duree: .02 }); craie.texte('réseau', 180, 160, { couleur: 'cyan', taille: 13, align: 'center' }); a.zone('reseau', 170, 80, 20, 60);
      const lines = d.lines_nm || [d.wavelength_nm], couleurNm = n => n < 440 ? 'violet' : n < 490 ? 'bleu' : n < 570 ? 'vert' : n < 590 ? 'jaune' : n < 625 ? 'orange' : 'rouge';
      const ex = 300, ey = 40, ew = 420, eh = 150; craie.rect(ex, ey, ew, eh, { couleur: 'faible', arrondi: 4 }); craie.texte('écran · 400 → 700 nm', ex + ew / 2, ey + eh + 20, { couleur: 'faible', taille: 13, align: 'center' }); a.zone('raies', ex, ey, ew, eh);
      [400, 500, 600, 700].forEach(n => craie.texte(String(n), ex + (n - 390) / 320 * ew, ey + eh + 36, { couleur: 'tresfaible', taille: 11, align: 'center', duree: .05 }));
      lines.forEach(n => { const x = ex + (n - 390) / 320 * ew; craie.ligne(180, 110, x, ey + eh * .5, { couleur: couleurNm(n), largeur: 1, pointille: [3, 5] }); craie.ligne(x, ey + 10, x, ey + eh - 10, { couleur: couleurNm(n), largeur: d.atom === 'Sodium' ? 3 : 6 }); });
      lines.forEach((n, i) => craie.texte(`${fr(n, 1)} nm`, ex + (n - 390) / 320 * ew, ey - 8 - i * 16, { couleur: couleurNm(n), taille: 13, align: 'center' }));
      if (d.atom === 'Hydrogène') {
        // Niveaux d'énergie et transition
        const nx = 60, ny = 340, lev = n => ny - (1 - 1 / (n * n)) * 140;
        for (let n = 1; n <= 6; n++) { craie.ligne(nx, lev(n), nx + 140, lev(n), { couleur: n === d.n_initial || n === d.n_final ? 'jaune' : 'faible', largeur: n <= 2 ? 2 : 1.2 }); if (n <= 3 || n === 6) craie.texte(`n = ${n}`, nx + 150, lev(n) + 5, { couleur: 'faible', taille: 12 }); }
        craie.fleche(nx + 70, lev(d.n_initial) + 3, nx + 70, lev(d.n_final) - 3, { couleur: couleurNm(d.wavelength_nm), largeur: 2.4 });
        a.lignes(240, 250, [`${d.series} : n = ${d.n_initial} → n = ${d.n_final}`, `ΔE = 13,6 (1/n𝒇² − 1/nᵢ²) = ${fr(d.photon_energy_ev, 3)} eV`, `λ = hc/ΔE = 1240 / ${fr(d.photon_energy_ev, 3)} = ${fr(d.wavelength_nm, 1)} nm`], { pas: 24, max: 300 });
      } else a.lignes(240, 250, ['doublet jaune du sodium : 589,0 et 589,6 nm', `ΔE ≈ ${fr(d.photon_energy_ev, 2)} eV : deux niveaux très proches`], { pas: 24, max: 330 });
    }
    if (a.ran && a.resultat != null) { craie.depuis(a.resultat); craie.texte(v === 'decay' ? 'comptage fait ✓' : 'simulation faite ✓', 560, 200, { couleur: 'vert', taille: 16, align: 'center' }); }
  },
};
</script>
<script src="/media/simulations/shared/tableau/tableau.js"></script><script src="../shared/lab-tableau.js"></script><script src="/media/simulations/professor-locate.js" defer></script>
