<body>
<div class="tableau">

<script>
/*
 * « Ce qu’il faut retenir » du cours « Oscillations libres d’un circuit RLC série » (phys_ch8_circuit_RLC), même forme et même
 * protocole que dipole-rl-tableau/bilan.html (contrat circuit_RLC_contrat_simulations.md, groupe C). Sur un écran assez grand, TOUTE
 * la fiche tient sur UNE page : onze blocs en trois colonnes (quatre sur un tableau large) : oscillations, régimes, équation, LC idéal, solution, période propre,
 * conditions initiales, lecture, énergie, amortissement, entretien ; chacun avec les formules encadrées (indices « u_C » rendus
 * par le kit, exposants par exposants.js), ce qu’il faut savoir et le piège en orange (⚠). Compétences C1 à C8 du cours.
 * La voix la parcourt bloc par bloc : play_until {moment: <bloc>} écrit ce bloc à cet instant et le met en lumière ;
 * les blocs déjà dits (ou sautés) sont écrits d’un coup ; « fiche » ou « fin » : tout d’un coup.
 * La deuxième page est celle de l’élève (set_parameters {lacunes, acquis, acquis_ids}), moment « lacunes ».
 * Couleurs : rouge = condensateur, vert = bobine, blanc = énergie totale, jaune = cadres (surlignage) seulement.
 * Petit écran (18 novembre 2026, téléphone en paysage : texte à 5,7 px) : la page garde son plancher de 15 px (indices,
 * exposants et étages des fractions compris) et, quand la fiche ne tient pas sur une page, la coupe en PARTIES (autant
 * qu’il faut, jusqu’à un bloc par écran), chacune remplit le tableau ; compteur « partie n sur N · touche : la suite » ;
 * la voix montre la partie du bloc qu’elle dit. À l’impression, la fiche entière sur une page.
 */
const { bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);

const BLOCS = [
  { id: 'oscillations', titre: '1 · Oscillations libres', comps: ['C1'], formules: ['i = ⟦dq|dt⟧ = C·⟦du_C|dt⟧', 'u_b(0⁺) = −u_C(0)'],
    def: 'Le condensateur chargé se décharge dans la bobine : u_C change de signe.',
    attention: 'i(0⁺) = 0 : i est continu dans la bobine.' },
  { id: 'regimes', titre: '2 · Trois régimes', comps: ['C2'], formules: ['périodique', 'pseudo-périodique', 'apériodique'],
    def: 'L’amortissement augmente avec R + r.',
    attention: 'apériodique : retour à 0 sans osciller.' },
  { id: 'equation', titre: '3 · Équation différentielle', comps: ['C3'], formules: ['L·⟦d²q|dt²⟧ + (R + r)·⟦dq|dt⟧ + ⟦q|C⟧ = 0', 'LC·⟦d²u_C|dt²⟧ + (R + r)·C·⟦du_C|dt⟧ + u_C = 0'],
    def: 'Additivité sans générateur : u_C + u_R + u_b = 0.',
    attention: 'second membre 0 : pas de E.' },
  { id: 'lc', titre: '4 · Circuit LC idéal', comps: ['C3'], formules: ['⟦d²u_C|dt²⟧ + ⟦u_C|LC⟧ = 0'],
    def: 'R + r = 0 : le terme en ⟦du_C|dt⟧ disparaît.',
    attention: 'r = 0 seulement si l’énoncé le dit.' },
  { id: 'solution', titre: '5 · Solution', comps: ['C4'], formules: ['u_C(t) = U_m·cos(⟦2πt|T₀⟧ + φ)'],
    def: 'On dérive deux fois : ⟦d²u_C|dt²⟧ = −(⟦2π|T₀⟧)²·u_C.',
    attention: 'U_m : amplitude ; φ : phase à l’origine.' },
  { id: 'periode', titre: '6 · Période propre', comps: ['C4'], formules: ['T₀ = 2π√(LC)', '√(LC) : un temps'],
    def: '(⟦2π|T₀⟧)² = ⟦1|LC⟧. T₀ ne dépend pas de E.',
    attention: 'L en H, C en F : T₀ en s.' },
  { id: 'conditions', titre: '7 · Conditions initiales', comps: ['C4'], formules: ['u_C(0) = U_m·cos φ'],
    def: 'Chargé sous E, i(0) = 0 : U_m = E et φ = 0.',
    attention: 'cos φ donne ±φ : le sens de départ choisit.' },
  { id: 'lecture', titre: '8 · Lire un oscillogramme', comps: ['C5'], formules: ['T ≈ T₀', 'C = ⟦T₀²|4π²·L⟧', 'π² = 10'],
    def: 'T entre deux sommets, sur plusieurs périodes.',
    attention: 'T, pas ⟦T|2⟧ ; élever au carré d’abord.' },
  { id: 'energie', titre: '9 · Énergie', comps: ['C6'], formules: ['E = ½·C·u_C² + ½·L·i²'],
    def: 'Échange condensateur ↔ bobine ; E constante si R + r = 0.',
    attention: 'sommet de u_C : i = 0, E = ½·C·u_C².' },
  { id: 'amortissement', titre: '10 · Amortissement', comps: ['C7'], formules: ['⟦dE|dt⟧ = −(R + r)·i²', '|ΔE| = ½·C·(U_1² − U_2²)'],
    def: 'E diminue : effet Joule dans R et dans r.',
    attention: 'énergie perdue = E(début) − E(fin) > 0.' },
  { id: 'entretien', titre: '11 · Entretien', comps: ['C8'], formules: ['u_G = k·i', 'k = R + r'],
    def: 'G rend l’énergie perdue : oscillations à T₀.',
    attention: 'k = résistance totale, pas r seule.' },
];
const STATUTS = { non_acquis: ['à reprendre', 'rouge'], partiel: ['à revoir', 'orange'], acquis: ['acquis', 'vert'] };
const AVANT = -1e9;   // instant d'un bloc déjà dit : il est écrit d'un coup
// apparu[i] : null = pas encore dit (pas écrit) ; un nombre = l'instant (s de la scène) où il commence à s'écrire.
// feuille : la partie de la fiche montrée (petit écran) ; impression : sur papier, la fiche entière, sans plancher d'écran.
const S = { page: 1, feuille: 0, focus: null, lacunes: null, acquis: null, acquis_ids: null, apparu: [], impression: false };
window.__debordeBlocs = [];   // vérification : un bloc dont le texte dépasse son cadre ou une colonne trop pleine

/* Texte pour la bulle et ce_qui_se_voit : pas de « _ » ni d’accolades visibles ; une fraction « ⟦a|b⟧ » redevient « a/b ». */
const BAS_U = { 0: '₀', 1: '₁', 2: '₂', 3: '₃', 4: '₄', 5: '₅', 6: '₆', 7: '₇', 8: '₈', 9: '₉', a: 'ₐ', e: 'ₑ', m: 'ₘ', x: 'ₓ' };
const lisible = s => window.Tableau.lisible(String(s)).replace(/\^\{([^}]+)\}/g, '^($1)').replace(/_\{?([A-Za-z0-9]+)\}?/g, (m, g) => ([...g].every(ch => ch in BAS_U) ? [...g].map(ch => BAS_U[ch]).join('') : g));

/* Plancher du texte : 15 px à l’écran, vraiment (18 novembre 2026, téléphone en paysage : le kit baisse son plancher
 * jusqu’à 45 % sur un petit tableau et écrit indices et exposants à 62 %, la fiche tombait à 5,7 px). Indices,
 * exposants et étages des fractions compris : sur cette page ils ne descendent jamais sous le plancher (la craie de la
 * page, rien de partagé n’est changé). À l’impression, pas de plancher d’écran. */
const PLANCHER = 15;
const plancher = () => (S.impression ? 0 : PLANCHER);
const CHIFFRES = { '⁻': '−', '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9' };
const versExposants = s => String(s).replace(/[⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, g => '^{' + [...g].map(ch => CHIFFRES[ch]).join('') + '}');
/** Le plus petit texte lisible, en unités du cadre. */
const mini = c => (c.echelle && c.tailleMin ? c.tailleMin / c.echelle : 0);
/** Taille d'un indice ou d'un exposant : 62 % de la ligne, jamais sous le plancher. */
const petitDe = (c, t) => Math.max(t * .62, mini(c));
/** Largeur d'un texte à la craie telle qu'elle sera écrite (fractions, indices, exposants, plancher compris). */
const larg = (c, s, t) => { s = versExposants(s); return s.includes('⟦') ? c.largeurTexte(s, t) : c._largeur(s, t); };
/** Encre d'un texte écrit à la taille t (déjà au plancher) : [haut, bas] par rapport à sa ligne de base (haut < 0) ;
 *  un exposant relevé, un indice abaissé, les deux étages d'une fraction (comme les écrit le kit) montent ou descendent plus loin. */
const ASC = .82, DESC = .3;
function etendue(c, s, t) {
  s = versExposants(s);
  let a = -ASC * t, d = (/[₀-₉]/.test(s) ? .45 : DESC) * t;   // « T₀ » : le ₀ de la police descend plus bas
  for (const m of s.match(/⟦[^⟧]*⟧/g) || []) {
    const [n, dn = ''] = m.slice(1, -1).split('|'), tf = Math.max(t * .78, mini(c)), yb = -t * .32, e = etages(c, n, dn, tf);
    a = Math.min(a, yb - e.n + etendue(c, n, tf)[0]); d = Math.max(d, yb + e.d + etendue(c, dn, tf)[1]);
  }
  for (const g of window.Tableau.Craie.segments(s.replace(/⟦[^⟧]*⟧/g, ''))) {
    const p = petitDe(c, t);
    if (g.sub) { a = Math.min(a, t * .28 - ASC * p); d = Math.max(d, t * .28 + DESC * p); }
    if (g.sup) { a = Math.min(a, -t * .42 - ASC * p); d = Math.max(d, -t * .42 + DESC * p); }
  }
  return [a, d];
}
/** Place des deux étages d'une fraction sous et sur le trait (distances à la ligne du trait, étages de taille tf) : celles du
 *  kit (0,3 et 0,95 × tf), plus bas pour un exposant au dénominateur (« ⟦dq|dt²⟧ » : écrit au plancher, le ² montait sur le
 *  « q »), plus haut pour un indice au numérateur ; l'encre d'un étage ne touche jamais l'autre. */
function etages(c, n, dn, tf) {
  return { n: Math.max(.3 * tf + (/_/.test(n) ? tf * .2 : 0), etendue(c, n, tf)[1] + tf * .04),
           d: Math.max(.95 * tf, -etendue(c, dn, tf)[0] + tf * .1) };
}
let TROP = false;   // mesure : un mot, un titre ou une formule plus large que sa place (la disposition est refusée)

/* Coupe un texte en lignes qui tiennent dans `max` px. */
function lignes(c, texte, taille, max) {
  const out = []; let ligne = '';
  const t = String(texte).replace(/ ([=\/·→<>≥≤≈≠−+×]) /g, ' $1 ')   // une formule dans la phrase ne se coupe pas
    .replace(/ ([;:!?])/g, ' $1');   // « ; » ou « : » ne commence jamais une ligne
  for (const mot of t.split(/[ \t\n]+/)) {
    const essai = ligne ? ligne + ' ' + mot : mot;
    if (larg(c, mot, taille) > max + 1) TROP = true;
    if (larg(c, essai, taille) > max && ligne) { out.push(ligne); ligne = mot; } else ligne = essai;
  }
  if (ligne) out.push(ligne);
  return out;
}
/* Écrit (ou mesure) un paragraphe ; `y` = ligne de base de la première ligne ; rend celle de la ligne suivante. Une ligne
 * qui porte une fraction, un exposant ou un indice (écrits au plancher) prend la place de son encre au-dessus et dessous. */
function paragraphe(c, texte, x, y, taille, max, o, dessiner, interligne = 1.2) {
  const t = Math.max(taille, mini(c));
  let bas = null;
  for (const l of lignes(c, texte, taille, max)) {
    const [a, d] = etendue(c, l, t);
    y = bas == null ? y + Math.max(0, -a - ASC * t) : Math.max(y, bas - a + t * .12);
    if (dessiner) c.texte(l, x, y, { taille, ...o });
    bas = y + d; y += t * interligne;
  }
  return bas == null ? y : Math.max(y, bas + ASC * t + t * .12);
}

/* Disposition (18 novembre 2026, téléphone en paysage : texte à 5,7 px, blocs hors du cadre) : colonnes sur toute la
 * largeur du tableau (scene.L : 760 à 1596) ; toutes les tailles passent par F, le plus grand facteur pour lequel la fiche
 * (ou la partie) tient dans la hauteur, jamais sous MIN (le plancher de 15 px à l'écran, en unités du cadre). Une page :
 * trois colonnes (quatre sur un tableau large, comme avant), une de plus seulement s'il le faut. Sinon (petit écran) la
 * fiche en PARTIES successives (autant qu'il faut, jusqu'à un bloc par écran), chacune remplit le tableau ; compteur
 * « partie n sur N · touche : la suite » ; la voix montre la partie du bloc qu'elle dit. À l'impression : une page. */
let LARG = 760, BAS = 408, HAUT = 50, F = 1, MIN = 0;
const POS = [];   // position calculée de chaque bloc : { x, w, y0, h }
const T = t => Math.max(t * F, MIN);
let PARTIES = [{ blocs: BLOCS.map((b, i) => i), F: 1, haut: 50, cols: 3 }];
const partieDe = i => Math.max(0, PARTIES.findIndex(p => p.blocs.includes(i)));
const blocsDe = k => (PARTIES[k] || PARTIES[0]).blocs;

/** L'état de l'élève écrit à droite du titre d'un bloc (ou null). */
function etiquette(st) {
  if (st === 'acquis') return { texte: '✓', taille: T(15), couleur: 'vert' };
  return st && STATUTS[st] ? { texte: STATUTS[st][0], taille: T(11), couleur: STATUTS[st][1] } : null;
}
/* Écrit (ou mesure seulement) le contenu d'un bloc ; rend l'ordonnée de fin. */
function contenu(c, b, x, y0, w, st, dessiner) {
  const tt = T(14), tf = T(12.5), td = T(11.5), ta = T(11), e = etiquette(st);
  // le titre, sur deux lignes s'il le faut (l'état de l'élève garde sa place à droite)
  const we = e ? larg(c, e.texte, e.taille) + T(8) : 0;
  let y = paragraphe(c, b.titre, x, y0 + tt * .85, tt, w - we, { couleur: 'cyan' }, dessiner, 1.15) - tt * 1.15;
  // formules encadrées, à la ligne quand la suivante ne tient plus ; le cadre suit l'encre (fraction sur deux étages
  // comme dans le cahier, exposant relevé, indice abaissé)
  const pad = Math.max(7, tf * .5), ext = b.formules.map(f => etendue(c, f, tf));
  const haut = Math.max(...ext.map(v => -v[0])) + tf * .2, bas = Math.max(...ext.map(v => v[1])) + tf * .18;
  y += Math.max(6, tt * .35) + haut;
  let fx = x;
  for (const f of b.formules) {
    const lf = larg(c, f, tf) + 2 * pad;
    if (lf > w + .5) TROP = true;
    const l = Math.min(w, lf);
    if (fx > x && fx + l > x + w) { fx = x; y += haut + bas + 5; }
    if (dessiner) {
      c.rect(fx, y - haut, l, haut + bas, { couleur: 'jaune', arrondi: 6, largeur: 1.2, alpha: .7, duree: .25 });
      c.texte(f, fx + pad, y, { couleur: 'blanc', taille: tf });
    }
    fx += l + 7;
  }
  y += bas + td * 1.15 + 2;
  y = paragraphe(c, b.def, x, y, td, w, { couleur: 'blanc', alpha: .9 }, dessiner);
  // le ⚠ et le piège : le texte commence après le ⚠ tel qu'il est vraiment écrit (plancher compris), sur la même ligne
  const r = Math.max(ta * 1.3, larg(c, '⚠', ta) + ta * .3), l0 = lignes(c, b.attention, ta, w - r)[0] || '';
  if (dessiner) c.texte('⚠', x, y + Math.max(0, -etendue(c, l0, ta)[0] - ASC * ta), { couleur: 'orange', taille: ta });
  y = paragraphe(c, b.attention, x + r, y, ta, w - r, { couleur: 'orange', alpha: .92 }, dessiner);
  return y - ta * .7;   // la dernière ligne descend d'environ 0,3 taille sous sa base
}
/* Les blocs, dans l'ordre, coupés en n colonnes de hauteurs les plus égales possible. */
function decouper(h, n) {
  let best = null;
  const essayer = (coupes) => {
    const bornes = [0, ...coupes, h.length], g = [];
    for (let k = 0; k < n; k++) g.push([bornes[k], bornes[k + 1]]);
    const m = Math.max(...g.map(([a, b]) => h.slice(a, b).reduce((s, v) => s + v, 0)));
    if (!best || m < best.m) best = { m, g };
  };
  (function suite(depart, coupes) {
    if (coupes.length === n - 1) return essayer(coupes);
    for (let i = depart; i <= h.length - (n - 1 - coupes.length); i++) suite(i + 1, [...coupes, i]);
  })(1, []);
  return best;
}
/** L'en-tête : titre et, à droite, la légende (une page) ou le compteur (en parties), 15 px au moins. */
const TITRES = ['Ce qu’il faut retenir · le circuit RLC série', 'Ce qu’il faut retenir · circuit RLC', 'Ce qu’il faut retenir'];
const LEGENDE = 'formules · à savoir · ⚠ piège';
const COMPTEUR = (k, N) => `partie ${k} sur ${N} · touche : la suite`;
function entete(c, parties) {
  const tC = Math.max(parties ? 13 * Math.min(F, 1.25) : 12, MIN), droite = parties ? COMPTEUR(8, 8) : LEGENDE, wc = larg(c, droite, tC);
  const tT0 = Math.max(parties ? 22 * Math.min(F, 1.25) : 22, MIN);
  for (const titre of TITRES) for (let tT = tT0; tT >= Math.max(MIN, tT0 * .8); tT -= 1) {
    if (larg(c, titre, tT) + wc + 30 <= LARG - 32) return { titre, tT, tC, droite: true, yT: Math.max(30, tT * .9 + 10) };
  }
  // la légende n'a plus la place : le titre seul (le compteur, lui, reste)
  const tT = Math.max(MIN, tT0 * .8), titre = TITRES.find(s => larg(c, s, tT) + (parties ? wc + 30 : 0) <= LARG - 32) || TITRES[2];
  return { titre, tT, tC, droite: parties, yT: Math.max(30, tT * .9 + 10) };
}
const hautDe = e => e.yT + Math.max(20, e.tT * .3 + 14);   // le haut des blocs, sous le trait de l'en-tête
let clePlace = '';
if (document.fonts) document.fonts.ready.then(() => { clePlace = ''; if (window.__bilan) window.__bilan.scene.sale = true; });
function placer(c) {
  // la police de la craie peut arriver après la première image : la mesure est refaite quand elle est chargée
  const cle = [scene.L, (scene.s || 1).toFixed(3), S.impression, BLOCS.map(statut).join(), document.fonts ? document.fonts.status : ''].join(':');
  if (cle === clePlace && POS.length) return;   // même tableau : la disposition est déjà calculée
  clePlace = cle;
  LARG = scene.L; BAS = LARG >= 1000 ? 414 : 408; MIN = plancher() / Math.max(.1, scene.s || 1);
  const memo = new Map(), sts = BLOCS.map(statut);
  const colonnes = n => {
    const marge = 16, ecart = n <= 3 ? 22 : 20, w = (LARG - 2 * marge - (n - 1) * ecart) / n;
    return Array.from({ length: n }, (_, k) => ({ x: marge + k * (w + ecart), w }));
  };
  const hauteur = (i, w) => {
    const k = `${i}|${F}|${w.toFixed(2)}`;
    if (!memo.has(k)) { TROP = false; const h = contenu(c, BLOCS[i], 0, 0, w, sts[i], false) + 6; memo.set(k, { h, trop: TROP }); }
    return memo.get(k);
  };
  /** Les blocs `ids` en n colonnes au facteur Fx : la disposition, ou null s'ils ne tiennent pas. */
  const essai = (ids, n, Fx, parties) => {
    F = Fx; const haut = hautDe(entete(c, parties)), cols = colonnes(n);
    const hs = ids.map(i => hauteur(i, cols[0].w));
    if (hs.some(h => h.trop)) return null;
    const d = decouper(hs.map(h => h.h), n);
    return d.m <= BAS - haut ? { ids, n, F: Fx, haut, cols, d, H: hs.map(h => h.h) } : null;
  };
  const FS = Array.from({ length: 13 }, (_, i) => 1 + (12 - i) * .05);   // 1,6 → 1 (pas de 0,05)
  // une page : jusqu'à 0,8 (tout est alors écrit au plancher de 15 px, comme la fiche d'origine sur un ordinateur)
  const FS1 = FS.concat([.95, .9, .85, .8]);
  const tous = BLOCS.map((b, i) => i);
  // 1) toute la fiche sur une page : les colonnes d'origine (trois, quatre sur un tableau large), une de plus s'il le faut
  let choix = null;
  for (const n of LARG >= 1000 ? [4, 5] : [3, 4]) { for (const Fx of FS1) if ((choix = essai(tous, n, Fx, false))) break; if (choix) break; }
  let parts;
  if (choix || S.impression) {
    if (!choix) { F = 1; const cols = colonnes(4), H = tous.map(i => hauteur(i, cols[0].w).h); choix = { ids: tous, n: 4, F: 1, haut: hautDe(entete(c, false)), cols, d: decouper(H, 4), H }; }
    parts = [choix];
  } else {
    // 2) petit écran : le moins de parties possible (blocs consécutifs), chacune au plus grand facteur qui tient ;
    //    à nombre égal, la découpe dont la plus petite écriture est la plus grande
    const cache = new Map();
    const meilleure = (a, b) => {
      const k = a + '-' + b; if (cache.has(k)) return cache.get(k);
      const ids = []; for (let i = a; i < b; i++) ids.push(i);
      let m = null;

  // petit écran : toucher hors d'un bloc (ou le bloc déjà en lumière), c'est la suite
  if (i < 0 || (PARTIES.length > 1 && S.focus === BLOCS[i].id)) { if (PARTIES.length > 1) suite('touche'); return; }
  S.focus = BLOCS[i].id; scene.sale = true; bulle($('feedback'), lisible(BLOCS[i].def));
  pont.noter('touche', { moment: BLOCS[i].id }); pont.emettre();
});
