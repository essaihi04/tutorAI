<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Carte du chapitre dessinée à la craie : « Circuit RLC série : oscillations libres » au centre, onze branches autour (depuis le RC et le RL, la décharge dans la bobine, les trois régimes, l’équation différentielle, la solution, la période propre, les conditions initiales, la lecture, l’énergie, l’amortissement, l’entretien), un encadré sur les sujets du national et la suite du programme"></canvas></section>

<script>
/*
 * La carte du chapitre « Oscillations libres d’un circuit RLC série » (phys_ch8_circuit_RLC), ouverture et fin du cours ;
 * même forme que dipole-rl-tableau/carte.html (contrat circuit_RLC_contrat_simulations.md, groupe C). Au centre « Circuit RLC
 * série : oscillations libres » (moment `centre` : sa phrase et un condensateur + une bobine peints), puis les branches
 * dessinées l’une après l’autre au rythme de la voix (play_until {moment: <branche>}) : depuis, decharge, regimes, equation,
 * solution, periode, conditions, lecture, energie, amortissement, entretien, national, suite ; puis `complete` : toutes les
 * branches visibles, entourées une à une (jaune = surlignage) ; `fin` = la carte complète.
 * Une branche sautée s’écrit d’un coup ; celle qu’on dit s’écrit à cet instant. Indices « u_C » par le kit, exposants par
 * exposants.js. Couleurs : rouge = condensateur, vert = bobine, blanc = énergie totale ; le reste en couleurs de craie.
 * L’élève touche une branche : sa phrase s’écrit dans la bulle. Le lecteur donne le bilan de l’élève
 * (set_parameters {lacunes, acquis_ids}, compétences C1 à C8) : branches à reprendre entourées en rouge (à revoir : orange),
 * acquises cochées.
 */
const { bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);

const CENTRE = { x: 380, y: 210, w: 230, h: 96, comps: [],
  phrase: 'Le circuit RLC série : un condensateur chargé se décharge dans une bobine (L, r) et un résistor R ; la tension u_C oscille, de moins en moins si R + r n’est pas nul.' };
// Cinq en haut, deux à droite, cinq en bas, une à gauche (le cadre 760 × 420) : la carte se lit dans le sens des aiguilles d’une montre.
const HAUT_Y = 60, BAS_Y = 352, W = 140, H = 66;
const NOEUDS = [
  { id: 'depuis', x: 78, y: HAUT_Y, w: W, h: H, couleur: 'faible', comps: [], titre: 'Depuis le RC et le RL',
    lignes: ['q = C·u_C', 'u_b = L·di/dt + r·i'],
    phrase: 'Depuis le RC et le RL : q = C·u_C et u_b = L·di/dt + r·i servent de nouveau.' },
  { id: 'decharge', x: 229, y: HAUT_Y, w: W, h: H, couleur: 'rouge', comps: ['C1'], titre: 'Décharge',
    lignes: ['u_C change de signe', 'u_b(0⁺) = −u_C(0)'],
    phrase: 'La décharge d’un condensateur chargé dans la bobine : u_C change de signe, i = dq/dt = C·du_C/dt, et u_b(0⁺) = −u_C(0) car i est continu.' },
  { id: 'regimes', x: 380, y: HAUT_Y, w: W, h: H, couleur: 'cyan', comps: ['C2'], titre: 'Trois régimes',
    lignes: ['périodique, pseudo-', 'périodique, apériodique'],
    phrase: 'Trois régimes : périodique (R + r = 0), pseudo-périodique, apériodique ; l’amortissement augmente avec R + r.' },
  { id: 'equation', x: 531, y: HAUT_Y, w: W, h: H, couleur: 'orange', comps: ['C3'], titre: 'Équation',
    lignes: ['L·d²q/dt² + (R + r)·dq/dt', '+ q/C = 0'],
    phrase: 'L’équation différentielle : L·d²q/dt² + (R + r)·dq/dt + q/C = 0 (ou en u_C) ; LC idéal : d²u_C/dt² + u_C/(LC) = 0.' },
  { id: 'solution', x: 682, y: HAUT_Y, w: W, h: H, couleur: 'orange', comps: ['C4'], titre: 'Solution (LC)',
    lignes: ['u_C = U_m·cos(2πt/T₀ + φ)', 'on dérive deux fois'],
    phrase: 'La solution du circuit LC : u_C(t) = U_m·cos(2πt/T₀ + φ) ; on la dérive deux fois et on remplace.' },
  { id: 'periode', x: 682, y: 162, w: W, h: H, couleur: 'violet', comps: ['C4'], titre: 'T₀ = 2π√(LC)',
    lignes: ['période propre, en s', 'L ou C × 4 → T₀ × 2'],
    phrase: 'La période propre T₀ = 2π√(LC), un temps en secondes ; L ou C multiplié par 4 double T₀.' },
  { id: 'conditions', x: 682, y: 257, w: W, h: H, couleur: 'violet', comps: ['C4'], titre: 'Conditions initiales',
    lignes: ['u_C(0) = U_m·cos φ', 'sens de départ → φ'],
    phrase: 'Les conditions initiales donnent U_m et φ : u_C(0) = U_m·cos φ, et le sens de départ choisit le signe de φ.' },
  { id: 'lecture', x: 682, y: BAS_Y, w: W, h: H, couleur: 'violet', comps: ['C5'], titre: 'Lire T',
    lignes: ['T ≈ T₀ ; π² = 10', 'C = T₀²/(4π²·L)'],
    phrase: 'Lire T sur l’oscillogramme, entre deux sommets : T ≈ T₀, puis L ou C avec T₀² = 4π²·L·C (π² = 10).' },
  { id: 'energie', x: 531, y: BAS_Y, w: W, h: H, couleur: 'blanc', comps: ['C6'], titre: 'Énergie',
    lignes: ['E = ½·C·u_C² + ½·L·i²', 'constante si R + r = 0'],
    phrase: 'L’énergie totale E = ½·C·u_C² + ½·L·i² passe du condensateur à la bobine ; elle reste constante si R + r = 0.' },
  { id: 'amortissement', x: 380, y: BAS_Y, w: W, h: H, couleur: 'rose', comps: ['C7'], titre: 'Amortissement',
    lignes: ['dE/dt = −(R + r)·i²', 'effet Joule'],
    phrase: 'L’amortissement : dE/dt = −(R + r)·i², l’énergie perdue devient de la chaleur (effet Joule) ; |ΔE| = ½·C·(U₁² − U₂²).' },
  { id: 'entretien', x: 229, y: BAS_Y, w: W, h: H, couleur: 'cyan', comps: ['C8'], titre: 'Entretien',
    lignes: ['u_G = k·i', 'k = R + r : période T₀'],
    phrase: 'L’entretien : un générateur G délivre u_G = k·i ; pour k = R + r, les oscillations gardent leur amplitude, à la période T₀.' },
  { id: 'national', x: 78, y: BAS_Y, w: W, h: H, couleur: 'blanc', comps: [], titre: 'Au national', encadre: true,
    lignes: ['17 sessions sur 20', 'lire T → L ou C ; énergie'],
    phrase: 'Au national : le RLC tombe dans 17 sessions sur 20 ; presque toujours lire T et trouver L ou C, et un calcul d’énergie.' },
  { id: 'suite', x: 78, y: 210, w: W, h: H, couleur: 'faible', comps: [], titre: 'La suite', encadre: true,
    lignes: ['T₀ = 2π√(LC) resservira :', 'circuit d’accord (modulation)'],
    phrase: 'La suite : T₀ = 2π√(LC) resservira pour le circuit d’accord de la modulation.' },
];
const ANNEAUX = { non_acquis: ['rouge', 'à reprendre'], partiel: ['orange', 'à revoir'] };
const AVANT = -1e9;   // instant d'un élément déjà dit : écrit d'un coup

// def : instant où la phrase du centre s'écrit (null = pas encore dite) ; n branches dessinées ; apparu[i] leur instant.
// entoure : instant où les branches commencent à être entourées une à une (moment `complete`), null sinon.
const S = { def: null, n: 0, cible: 0, running: false, lacunes: null, acquis: null, apparu: [], choisi: null, entoure: null };
const DUREE_BRANCHE = 2.6;   // s par branche quand la carte se dessine seule

const BAS_U = { 0: '₀', 1: '₁', 2: '₂', 3: '₃', 4: '₄', 5: '₅', 6: '₆', 7: '₇', 8: '₈', 9: '₉', a: 'ₐ', e: 'ₑ', m: 'ₘ', x: 'ₓ' };
/* Texte pour la bulle et ce_qui_se_voit : pas de « _ » ni d’accolades visibles. */
const lisible = s => String(s).replace(/\^\{([^}]+)\}/g, '^($1)').replace(/_\{?([A-Za-z0-9]+)\}?/g, (m, g) => ([...g].every(ch => ch in BAS_U) ? [...g].map(ch => BAS_U[ch]).join('') : g));

function statut(comps) {
  if (!S.lacunes || !comps.length) return null;
  const lac = S.lacunes.filter(l => comps.includes(l.id));
  if (lac.some(l => l.statut === 'non_acquis')) return 'non_acquis';
  if (lac.length) return 'partiel';
  return (S.acquis || []).some(a => comps.includes(a)) ? 'acquis' : null;
}
/* Anneau rouge/orange ou coche verte autour d'un cadre (état de l'élève). */
function etat(c, comps, x, y, w, h) {
  const st = statut(comps);
  c.direct(() => {
    if (st && ANNEAUX[st]) {
      const [coul, etiq] = ANNEAUX[st];
      c.rect(x - 5, y - 5, w + 10, h + 10, { couleur: coul, arrondi: 16, largeur: 2, pointille: [6, 6] });
      c.texte(etiq, x + w - 4, y - 8, { couleur: coul, taille: 12, align: 'right' });
    } else if (st === 'acquis') c.texte('✓', x + w - 14, y + 16, { couleur: 'vert', taille: 18 });
  });
}

function branche(c, n) {
  const x = n.x - n.w / 2, y = n.y - n.h / 2;
  if (!n.seul) {
    const dx = n.x - CENTRE.x, dy = n.y - CENTRE.y, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
    // du bord du centre au bord de la branche, avec une légère courbure
    const d0 = Math.min(CENTRE.w / 2 / Math.max(.2, Math.abs(ux)), CENTRE.h / 2 / Math.max(.2, Math.abs(uy)));
    const d1 = Math.min(n.w / 2 / Math.max(.2, Math.abs(ux)), n.h / 2 / Math.max(.2, Math.abs(uy)));
    const a = [CENTRE.x + ux * d0, CENTRE.y + uy * d0], b = [n.x - ux * d1, n.y - uy * d1];
    const m = [(a[0] + b[0]) / 2 - uy * 12, (a[1] + b[1]) / 2 + ux * 12];
    c.courbe(u => [(1 - u) * (1 - u) * a[0] + 2 * (1 - u) * u * m[0] + u * u * b[0], (1 - u) * (1 - u) * a[1] + 2 * (1 - u) * u * m[1] + u * u * b[1]], 24, { couleur: 'faible', largeur: 2, pointille: n.encadre ? [6, 6] : undefined });
  }
  if (n.seul) {
    // la suite du programme : une flèche et une ligne, sans cadre de branche
    c.texte('→ ' + n.titre, n.x, n.y + 6, { couleur: 'faible', taille: 17, align: 'center', max: n.w - 10, duree: .9 });
  } else {
    c.rect(x, y, n.w, n.h, { couleur: n.couleur, arrondi: n.encadre ? 4 : 14, largeur: n.encadre ? 1.6 : 2.4, pointille: n.encadre ? [6, 5] : undefined });
    c.texte(n.titre, n.x, y + 21, { couleur: n.couleur, taille: 17, align: 'center', max: n.w - 16, duree: .8 });
    n.lignes.forEach((l, k) => c.texte(l, n.x, y + 42 + k * 18, { couleur: 'blanc', taille: 14, align: 'center', max: n.w - 14, alpha: .92, duree: 1 }));
  }
  c.repere(n.id, x - 5, y - 5, n.w + 10, n.h + 10, lisible(n.titre));
  etat(c, n.comps, x, y, n.w, n.h);
  if (S.choisi === n.id) c.direct(() => c.rect(x - 3, y - 3, n.w + 6, n.h + 6, { couleur: 'blanc', arrondi: 15, largeur: 1.2, alpha: .6 }));
}

function dessiner(c) {
  const x = CENTRE.x - CENTRE.w / 2, y = CENTRE.y - CENTRE.h / 2;
  if (S.def === AVANT) c.cur = AVANT;   // déjà dit (saut ou retour en arrière) : le centre est écrit d'un coup
  c.rect(x, y, CENTRE.w, CENTRE.h, { couleur: 'blanc', arrondi: 18, largeur: 3 });
  c.texte('Circuit RLC série', CENTRE.x, y + 30, { couleur: 'blanc', taille: 25, align: 'center', gras: true });
  c.texte('oscillations libres', CENTRE.x, y + 53, { couleur: 'cyan', taille: 18, align: 'center' });
  c.repere('centre', x, y, CENTRE.w, CENTRE.h, 'le centre : circuit RLC série, oscillations libres');
  const apres = c.cur;   // fin du titre du centre
  if (S.def != null) {
    c.depuis(S.def);
    peindre(c, ctx => { condensateurPeint(ctx, CENTRE.x - 100, y + 62, 14, 24); bobinePeinte(ctx, CENTRE.x + 66, y + 70, 44, 14); });
    c.texte('C chargé → (L, r) + R', CENTRE.x - 12, y + 82, { couleur: 'faible', taille: 13, align: 'center', duree: .8 });
    if (S.choisi === 'centre') c.direct(() => c.rect(x - 3, y - 3, CENTRE.w + 6, CENTRE.h + 6, { couleur: 'blanc', arrondi: 19, largeur: 1.2, alpha: .6 }));
  }
  // chaque branche a sa ligne de temps : elle s'écrit dès que la voix la dit, sans attendre la précédente
  for (let i = 0; i < S.n; i++) { c.cur = S.apparu[i] === AVANT ? AVANT : Math.max(apres, S.apparu[i]); branche(c, NOEUDS[i]); }
  // complete : toutes les branches entourées une à une (jaune = surlignage)
  if (S.entoure != null) {
    c.cur = S.entoure === AVANT ? AVANT : Math.max(apres, S.entoure);
    for (const n of NOEUDS) c.rect(n.x - n.w / 2 - 7, n.y - n.h / 2 - 7, n.w + 14, n.h + 14, { couleur: 'jaune', arrondi: 17, largeur: 1.8, alpha: .8, duree: .35 });
  }
  if (S.lacunes) c.direct(() => c.texte('✓ acquis · ⟳ à revoir · ✗ à reprendre', 744, 22, { couleur: 'faible', taille: 12, align: 'right' }));
}
/* Le peint (résistor, bobine de cuivre) apparaît quand l’écriture arrive à lui. */
const peindre = (c, fn) => { if (c.t >= c.cur) c.direct(() => { c.ctx.save(); try { fn(c.ctx); } finally { c.ctx.restore(); } }); };
function arrondi(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
/** Condensateur chimique peint (cylindre bleu, chapeau argenté). (x, y) = haut gauche. */
function condensateurPeint(ctx, x, y, w = 14, h = 24) {
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  g.addColorStop(0, '#1e3a8a'); g.addColorStop(.35, '#3b82f6'); g.addColorStop(.55, '#60a5fa'); g.addColorStop(1, '#1e3a8a');
  ctx.fillStyle = g; arrondi(ctx, x, y, w, h, 3); ctx.fill();
  ctx.fillStyle = 'rgba(226,232,240,.55)'; ctx.fillRect(x + w - 5, y + 3, 3, h - 6);
  const a = ctx.createLinearGradient(x, 0, x + w, 0); a.addColorStop(0, '#94a3b8'); a.addColorStop(.5, '#e2e8f0'); a.addColorStop(1, '#94a3b8');
  ctx.fillStyle = a; ctx.beginPath(); ctx.ellipse(x + w / 2, y + 1.5, w / 2, 2.5, 0, 0, Math.PI * 2); ctx.fill();
}
/** Bobine : spires de cuivre orangées sur un mandrin (deux flasques). (x, y) = haut gauche. */
function bobinePeinte(ctx, x, y, w = 44, h = 14) {
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, '#7c2d12'); g.addColorStop(.22, '#ea8a1a'); g.addColorStop(.42, '#fcd34d'); g.addColorStop(.68, '#c2410c'); g.addColorStop(1, '#6b2410');
  ctx.fillStyle = g; ctx.fillRect(x + 4, y, w - 8, h);
  ctx.strokeStyle = 'rgba(67,20,7,.55)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let sx = x + 6; sx < x + w - 5; sx += 2.6) { ctx.moveTo(sx, y + .5); ctx.lineTo(sx + 1, y + h - .5); }
  ctx.stroke();
  for (const fx of [x, x + w - 4]) {
    const f = ctx.createLinearGradient(fx, 0, fx + 4, 0); f.addColorStop(0, '#efe0bd'); f.addColorStop(1, '#a8895a');
    ctx.fillStyle = f; arrondi(ctx, fx, y - 3, 4, h + 6, 1.2); ctx.fill();
  }
}

const canvas = $('canvas');
const scene = window.OndesTableau.Scene(canvas, (c) => { scene.cadre(71); dessiner(c); return c.fin(); });
const maintenant = () => (performance.now() - scene.ouvert) / 1000;
let horloge = 0;
scene.avancer = dt => {
  if (!S.running) return false;
  horloge += dt;
  if (S.n < S.cible && horloge >= 0) {
    // la branche suivante apparaît quand la précédente a fini de s'écrire
    S.n += 1; S.apparu[S.n - 1] = maintenant(); horloge = -DUREE_BRANCHE;
    bulle($('feedback'), lisible(NOEUDS[S.n - 1].titre) + (S.n >= NOEUDS.length ? ' — la carte est complète.' : ''));
    pont.noter('branche', { n: S.n, moment: NOEUDS[S.n - 1].id }); pont.emettre();
    if (S.n >= S.cible) S.running = false;
  }
  return true;
};
function moments() { const m = { centre: 0 }; NOEUDS.forEach((n, i) => { m[n.id] = i + 1; }); m.complete = NOEUDS.length + 1; m.fin = NOEUDS.length + 2; return m; }
/* Dessine la carte jusqu'à la branche `cible` (0 = le centre et sa phrase). `pasAPas` : la carte se dessine seule,
 * une branche après l'autre (bouton) ; sinon (la voix) les branches sautées s'écrivent d'un coup et la dernière à cet instant. */
function montrer(cible, par, pasAPas) {
  const entourer = cible > NOEUDS.length ? cible : 0;   // complete (NOEUDS.length + 1) ou fin (+ 2)
  cible = Math.max(0, Math.min(NOEUDS.length, cible));
  if (cible < S.n || (!entourer && S.entoure != null)) { S.n = 0; S.apparu = []; S.def = null; S.entoure = null; scene.reecrire(); }   // retour en arrière : on redessine jusque-là
  if (S.def == null) S.def = pasAPas || cible === 0 ? maintenant() : AVANT;
  if (!pasAPas && cible > S.n) {
    for (let i = S.n; i < cible - 1; i++) S.apparu[i] = AVANT;
    S.apparu[cible - 1] = maintenant(); S.n = cible;
    bulle($('feedback'), lisible(NOEUDS[cible - 1].titre) + (cible >= NOEUDS.length ? ' — la carte est complète.' : ''));
  } else if (cible === 0) bulle($('feedback'), 'Au centre : le circuit RLC série, oscillations libres.');
  if (entourer) {
    // complete : les branches s'entourent une à une maintenant ; fin : tout d'un coup
    if (S.entoure == null || entourer === NOEUDS.length + 2) S.entoure = entourer === NOEUDS.length + 2 ? AVANT : maintenant();
    bulle($('feedback'), 'La carte est complète : toutes les branches du chapitre.');
  }
  S.cible = cible; S.running = S.n < cible; horloge = pasAPas ? -1.5 : 0; scene.sale = true;
  pont.noter(par || 'play_until', { moment: entourer ? (entourer === NOEUDS.length + 1 ? 'complete' : 'fin') : NOEUDS[cible - 1]?.id || 'centre' }); pont.emettre();
}
function playUntil(p) { const M = moments(); const n = p.moment in M ? M[p.moment] : +p.time_s; if (Number.isFinite(n)) montrer(n, 'play_until'); }
function start() { S.n = 0; S.apparu = []; S.def = null; S.choisi = null; S.entoure = null; scene.reecrire(); montrer(NOEUDS.length, 'start', true); bulle($('feedback'), 'La carte se dessine…'); }
function setParameters(p) {
  if (Array.isArray(p.lacunes)) S.lacunes = p.lacunes.map(l => ({ id: String(l.id || ''), label: String(l.label || ''), statut: String(l.statut || 'non_acquis') }));
  if (Array.isArray(p.acquis_ids)) S.acquis = p.acquis_ids.map(String);
  scene.sale = true; pont.noter('set_parameters', { lacunes: (S.lacunes || []).length }); pont.emettre();
}
function ceQuiSeVoit() {
  const vues = NOEUDS.slice(0, S.n).map(n => lisible(n.titre));
  const aReprendre = NOEUDS.slice(0, S.n).filter(n => statut(n.comps) && statut(n.comps) !== 'acquis').map(n => lisible(n.titre));
  const etatEleve = S.lacunes ? ` Branches à reprendre : ${aReprendre.join(', ') || 'aucune'}.` : '';
  const detail = NOEUDS.slice(0, S.n).map(n => lisible(n.phrase)).join(' ');
  return `Carte du chapitre : « Circuit RLC série : oscillations libres » au centre${S.def != null ? ' (un condensateur chargé se décharge dans la bobine (L, r) et R)' : ''}, ${S.n}/${NOEUDS.length} élément(s) dessiné(s)${vues.length ? ' (' + vues.join(', ') + ')' : ''}${S.running ? ', la carte se dessine' : ''}${S.entoure != null ? ' ; carte complète : toutes les branches entourées une à une en jaune' : ''}.${detail ? ' ' + detail : ''}${etatEleve}${S.choisi ? ` L'élève a touché « ${S.choisi === 'centre' ? 'le centre' : lisible(NOEUDS.find(n => n.id === S.choisi).titre)} ».` : ''}`;
}
$('run').onclick = start;
// Imprimer / PDF : la carte complète, sur fond blanc (shared/tableau/imprimer.js).
$('imprimer').onclick = () => {
  const avant = { n: S.n, cible: S.cible, running: S.running, apparu: S.apparu.slice(), def: S.def, choisi: S.choisi, entoure: S.entoure };
  window.Tableau.imprimer({ titre: 'Carte du chapitre — circuit RLC', scene,
    pages: [{ nom: 'la carte complète', preparer: () => { S.n = NOEUDS.length; S.running = false; S.def = AVANT; S.apparu = NOEUDS.map(() => AVANT); S.choisi = null; S.entoure = null; } }],
    restaurer: () => { Object.assign(S, avant); } });
  pont.noter('imprimer', { pages: 1 }); pont.emettre();
};
canvas.addEventListener('pointerdown', e => {
  const r = canvas.getBoundingClientRect(), [x, y] = scene.local(e.clientX - r.left, e.clientY - r.top);
  const n = NOEUDS.slice(0, S.n).find(n => Math.abs(x - n.x) <= n.w / 2 + 6 && Math.abs(y - n.y) <= n.h / 2 + 6);
  if (n) { S.choisi = n.id; bulle($('feedback'), lisible(n.phrase)); }
  else if (Math.abs(x - CENTRE.x) <= CENTRE.w / 2 && Math.abs(y - CENTRE.y) <= CENTRE.h / 2) { S.choisi = 'centre'; bulle($('feedback'), lisible(CENTRE.phrase)); }
  else return;
  scene.sale = true; pont.noter('touche', { moment: S.choisi }); pont.emettre();
});

window.Tableau.explication({ carte: [{ repere: 'centre', texte: lisible(CENTRE.phrase) }, ...NOEUDS.map(n => ({ repere: n.id, texte: lisible(n.phrase) }))] });
const commandes = ['start', 'reset', 'play_until', 'set_parameters'];
const config = { id: 'circuit_rlc_carte', version: '1.0', title: 'Carte du chapitre — circuit RLC', variants: [{ id: 'carte', label: 'carte' }], commands: commandes,
  command_schema: { play_until: { moment: Object.keys(moments()).join(' | ') + ' (centre = le centre et sa phrase ; sinon dessine la carte jusqu’à cet élément ; complete = toutes les branches, entourées une à une ; fin = la carte complète d’un coup)' },
    set_parameters: { lacunes: '[{id: C1..C8, statut: non_acquis|partiel}] (bilan de l’élève)', acquis_ids: '[C1, ..] compétences acquises' } } };
const pont = protocole({ id: config.id, commandes, config,
  texte: 'Carte du chapitre « Oscillations libres d’un circuit RLC série » : au centre « Circuit RLC série : oscillations libres » (un condensateur chargé se décharge dans une bobine), puis les branches : depuis le RC et le RL (q = C·u_C, u_b = L·di/dt + r·i) ; la décharge (u_C change de signe, u_b(0⁺) = −u_C(0)) ; trois régimes ; l’équation L·d²q/dt² + (R + r)·dq/dt + q/C = 0 ; la solution u_C = U_m·cos(2πt/T₀ + φ) ; la période propre T₀ = 2π√(LC) ; les conditions initiales ; lire T (T ≈ T₀, π² = 10) ; l’énergie E = ½·C·u_C² + ½·L·i² ; l’amortissement dE/dt = −(R + r)·i² ; l’entretien u_G = k·i, k = R + r ; au national : 17 sessions sur 20 ; la suite : T₀ = 2π√(LC) resservira pour le circuit d’accord de la modulation.',
  etat: () => ({ simulation_status: S.running ? 'running' : 'paused', ce_qui_se_voit: ceQuiSeVoit(), current_variant: 'carte', time_s: S.n, parameters: { centre: S.def != null, branches: S.n, complete: S.entoure != null, lacunes: S.lacunes ? S.lacunes.length : null }, moments: moments() }),
  progression: () => (S.entoure != null ? 1 : S.n / NOEUDS.length),
  executer: (cmd, p) => ({ start, reset: start, play_until: () => playUntil(p), set_parameters: () => setParameters(p) })[cmd]?.() });
bulle($('feedback'), 'Le professeur va dessiner la carte du chapitre.');
window.__carte = { S, scene, NOEUDS, CENTRE, lisible };   // pour les vérifications automatiques
</script>
<script src="/media/simulations/professor-locate.js" defer></script>
