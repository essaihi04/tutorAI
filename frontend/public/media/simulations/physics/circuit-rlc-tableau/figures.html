<script>
/*
 * Figures fixes du cours « Oscillations libres d’un circuit RLC série » (phys_ch8_circuit_RLC, 12 novembre 2026), écrites à la
 * craie pas à pas : ?fig=<nom> (liste dans FIGS, noms exacts du contrat circuit_RLC_contrat_simulations.md, groupe C).
 * Même architecture que dipole-rl-tableau/figures.html. Chaque figure : des étapes nommées (les moments), puis `fin`.
 * Le tuteur fige l’écriture sur une étape (`play_until {moment}`) et montre chaque élément (`highlight {target}`) :
 * le repère `figure`, et un repère par étape (même nom que l’étape).
 * Écriture : indices par le kit (« u_C » → u avec C en indice), exposants par exposants.js (« 10⁻³ », « T₀² »).
 * Couleurs fixes : rouge = condensateur (u_C, q, E_e), vert = bobine (i, E_m), blanc = énergie totale et craie ordinaire,
 * jaune = surlignage seulement (cadres des résultats, éliminations). Seconde courbe de comparaison : même couleur en pointillés.
 * Ce qui est réel (condensateur, bobine de cuivre, boîte G) est peint ; la physique reste à la craie.
 * Données des nationaux vérifiées en Python (outils/cours/notes/cours/circuit_RLC_build/nationaux.md et les figures assets/ des
 * sujets) : 2021 R fig5p6 (q en mC, (a) trait plein R₃, (b) pointillés R₄, T = 45 ms) ; 2022 N fig3p6 (C₁ 12 V, C₂ 10 V qui
 * part de −10 V, C₃ amortie) ; 2023 N fig4p4 (flèches 5 V et 0,5 ms) ; 2020 N fig4p6 et fig6p6 (i part de 0 en descendant) ;
 * 2025 N fig3p5 (flèche 7·10⁻⁵ s, t_A au sommet 7 V, t_B sur la descente qui suit, comme sur la figure du sujet).
 */
const { bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search);

/* Chaque figure : titre ; étapes dans l’ordre : [nom, motif (bulle « Arrêt sur image : … »), ce qui se voit (pour le tuteur)]. */
const FIGS = {
  fig_prerequis: { titre: 'Les outils du chapitre', etapes: [
    ['charge', 'i = dq/dt ; q = C·u_C', 'Le condensateur (vu au RC) : i = dq/dt et q = C·u_C ; à droite un condensateur chimique bleu peint et son symbole (deux traits rouges).'],
    ['bobine', 'u_b = L·di/dt + r·i', 'La bobine (vue au RL) : u_b = L·di/dt + r·i, en convention récepteur ; à droite une bobine de cuivre peinte et son symbole.'],
    ['derivee', 'la dérivée du cosinus', 'Dérivée : (cos(2πt/T₀))’ = −(2π/T₀)·sin(2πt/T₀) ; elle servira à vérifier la solution u_C = U_m·cos(2πt/T₀ + φ).'],
    ['recette', 'additivité → équation → solution', 'La méthode, comme au RC et au RL : additivité des tensions → équation différentielle → solution.'],
    ['fin', 'figure complète', 'Tout le chapitre s’appuie sur ces outils.']] },
  fig_2021R: { titre: 'Deux résistances, deux courbes (national 2021 R)', etapes: [
    ['enonce', 'l’énoncé', 'Énoncé : bobine L = 0,51 H, r = 5 Ω ; condensateur C = 100 µF chargé ; conducteur ohmique R₃ = 10 Ω puis R₄ = 100 Ω ; on enregistre q(t).'],
    ['courbes', 'les deux courbes', 'Graphe q (mC) de −0,6 à 0,6 en fonction de t (ms) de 0 à 140 : courbe (a) rouge en trait plein, peu amortie (sommets 0,6 ; 0,52 ; 0,45 mC) ; courbe (b) rouge en pointillés, très amortie (creux −0,33 mC, sommet 0,18 mC, puis presque 0).'],
    ['comparer', 'R₃ + r et R₄ + r', 'R₃ + r = 10 + 5 = 15 Ω ; R₄ + r = 100 + 5 = 105 Ω ; plus R + r est grande, plus l’amortissement est fort.'],
    ['resultat', '(a) → R₃ ; (b) → R₄', 'Encadré : (a) → R₃ ; (b) → R₄.'],
    ['periode', 'T = 45 ms ≈ T₀', 'Cote entre deux sommets successifs de (a) : T = 45 ms ; T₀ = 2π√(LC) = 2π√(0,51 × 10⁻⁴) ≈ 44,9 ms ≈ T.'],
    ['fin', 'figure complète', 'T ≈ T₀ : la courbe (a) est peu amortie.']] },
  fig_2022N: { titre: 'Choisir la bonne courbe (national 2022 N)', etapes: [
    ['enonce', 'l’énoncé', 'Énoncé : condensateur chargé sous E = 12 V ; C = 50 µF ; bobine de résistance nulle (r = 0) ; on enregistre u_C(t).'],
    ['courbes', 'les trois courbes', 'Trois graphes u_C (V) en fonction de t (ms) de 0 à 20 : C₁ cosinus rouge de 12 V (sommets à 0, 10 et 20 ms) ; C₂ cosinus de 10 V qui part de −10 V (sommets à 5 et 15 ms) ; C₃ amortie qui part de 12 V (creux ≈ −9 V à 5 ms, sommet ≈ 7,4 V à 10 ms).'],
    ['eliminer_C3', 'r = 0 : pas C₃', 'C₃ barrée en jaune : r = 0, régime périodique sans amortissement, donc pas C₃.'],
    ['eliminer_C2', 'u_C(0) = E : pas C₂', 'C₂ barrée en jaune : u_C(0) = E = 12 V, donc pas C₂ (10 V).'],
    ['lecture', 'T₀ = 10 ms', 'Sur C₁, cote entre deux sommets successifs : T₀ = 10 ms.'],
    ['L', 'L = 0,05 H', 'Encadré : L = T₀²/(4π²·C) = (10⁻²)²/(40 × 5·10⁻⁵) = 0,05 H.'],
    ['fin', 'figure complète', 'π² = 10 ; sans arrondi, L ≈ 0,051 H.']] },
  fig_carre: { titre: 'Isoler L ou C dans T₀ = 2π√(LC)', etapes: [
    ['formule', 'T₀ = 2π√(LC)', 'En haut : T₀ = 2π√(LC).'],
    ['carre', 'T₀² = 4π²·L·C', 'Flèche « on élève au carré » : T₀² = 4π²·L·C.'],
    ['isoler', 'C = T₀²/(4π²·L)', 'Deux encadrés : C = T₀²/(4π²·L) et L = T₀²/(4π²·C).'],
    ['an', 'C = 2,5 µF', 'Application (2020 N) : T ≈ T₀ = 10 ms = 10⁻² s, L = 1 H, π² = 10 ; encadré : C = (10⁻²)²/(40 × 1) = 2,5·10⁻⁶ F = 2,5 µF.'],
    ['fin', 'figure complète', 'En orange : élever au carré d’abord ; T₀ en secondes.']] },
  fig_2023N: { titre: 'u_C(t) dans un circuit LC (national 2023 N)', etapes: [
    ['enonce', 'l’énoncé', 'Énoncé : circuit LC idéal ; L = 1 H ; on enregistre u_C(t).'],
    ['courbe', 'la courbe u_C(t)', 'Graphe quadrillé : u_C(t) rouge, un cosinus qui part de son sommet ; flèches d’échelle « 5 V » (2 carreaux) et « 0,5 ms » (2 carreaux) ; U_m = 10 V.'],
    ['lecture', 'T₀ = 2 ms', 'Cote entre deux sommets : T₀ = 4 × 0,5 = 2 ms ; U_m = 2 × 5 = 10 V.'],
    ['C', 'C = 0,1 µF', 'C = T₀²/(4π²·L) = (2·10⁻³)²/(40 × 1) ; encadré : C = 10⁻⁷ F = 0,1 µF.'],
    ['Em', 'E_m = 1,8·10⁻⁶ J', 'Point à t = 1,8 ms sur la courbe : u_C = 8 V ; E_m = E − ½·C·u_C² ; encadré : E_m = ½·C·(10² − 8²) = 1,8·10⁻⁶ J.'],
    ['fin', 'figure complète', 'LC idéal : E = ½·C·U_m² = 5·10⁻⁶ J reste constante.']] },
  fig_2020N: { titre: 'Du pseudo-périodique à l’entretien (national 2020 N)', etapes: [
    ['enonce', 'l’énoncé', 'Énoncé : bobine L = 1 H, r = 10 Ω ; conducteur ohmique R = 90 Ω ; condensateur C chargé, puis décharge.'],
    ['courbe_uC', 'la courbe u_C(t)', 'Graphe en haut à gauche : u_C(t) rouge pseudo-périodique, t (ms) de 0 à 30 ; sommets qui baissent ; T = 10 ms.'],
    ['regime', 'pseudo-périodique', 'Écrit : régime pseudo-périodique (R + r = 100 Ω).'],
    ['equation', 'l’équation en u_C', 'LC·d²u_C/dt² + (R + r)·C·du_C/dt + u_C = 0.'],
    ['C', 'C = 2,5·10⁻⁶ F', 'T ≈ T₀ = 10 ms ; encadré : C = T₀²/(4π²·L) = (10⁻²)²/(40 × 1) = 2,5·10⁻⁶ F.'],
    ['entretien', 'u_G = k·i ; k₀ = 100 Ω', 'On ajoute la boîte G (peinte) : u_G = k·i ; oscillations sinusoïdales pour k₀ = R + r = 100 Ω.'],
    ['courbe_i', 'la courbe i(t)', 'Graphe en bas à gauche : i(t) verte entretenue, i (mA) de −8 à 8, t (ms) de 0 à 30 : I_m = 8 mA, T₀ = 10 ms, part de 0 en descendant.'],
    ['phase', 'φ = +π/2', 'i = I_m·cos(2πt/T₀ + φ) ; i(0) = 0 → cos φ = 0 → φ = ±π/2 ; i descend → sin φ > 0 → φ = +π/2 rad.'],
    ['energie', 'E_t = 3,2·10⁻⁵ J', 'E_t = ½·L·I_m² = ½ × 1 × (8·10⁻³)² = 3,2·10⁻⁵ J.'],
    ['Ee', 'E_e ≈ 2,05·10⁻⁵ J', 'Point à 16 ms sur i(t) : i = 4,8 mA ; E_e = 3,2·10⁻⁵ − ½ × 1 × (4,8·10⁻³)² ≈ 2,05·10⁻⁵ J (encadré).'],
    ['fin', 'figure complète', 'Entretenu : k₀ = R + r, le circuit oscille à la période propre T₀.']] },
  fig_2025N: { titre: 'Pseudo-période et énergie perdue (national 2025 N)', etapes: [
    ['enonce', 'l’énoncé', 'Énoncé : condensateur C₀ = 1 µF chargé à U₀ = 10 V ; décharge dans une bobine (L, r) seule.'],
    ['equation', 'l’équation en u_C', 'L·C₀·d²u_C/dt² + r·C₀·du_C/dt + u_C = 0.'],
    ['courbe', 'la courbe u_C(t)', 'Graphe quadrillé : u_C(t) rouge pseudo-périodique qui part de 10 V ; graduations 7, 4, −4 V ; flèche d’échelle « 7·10⁻⁵ s » = 1 carreau ; t_A au sommet suivant (7 V, pointillé), t_B un peu plus loin sur la descente.'],
    ['periode', 'T = 2,8·10⁻⁴ s', 'Cote de 0 à t_A : 4 carreaux ; T = 4 × 7·10⁻⁵ = 2,8·10⁻⁴ s.'],
    ['signe_i', 'i < 0 entre t_A et t_B', 'Entre t_A et t_B, u_C décroît : i = C₀·du_C/dt < 0.'],
    ['dE_dt', 'dE_T/dt = −r·i²', 'dE_T/dt = C₀·u_C·du_C/dt + L·i·di/dt = i·(u_C + L·di/dt) = −r·i².'],
    ['energie', '|E_th| = 2,55·10⁻⁵ J', 'Encadré : |E_th| = ½·C₀·(U₀² − u_C(t_A)²) = ½ × 10⁻⁶ × (10² − 7²) = 2,55·10⁻⁵ J.'],
    ['fin', 'figure complète', 'Cette énergie est partie en chaleur dans r (effet Joule).']] },
};
let fig = FIGS[P.get('fig')] ? P.get('fig') : 'fig_prerequis';
const VITESSE = 1.6;                              // l’écriture va un peu plus vite que la craie du kit
const S = { tw: 0, running: true, pause: false, fait: false, jusqua: null, motif: '', emis: 0 };
let M = {};                                       // étape → instant d’écriture (s), relevé pendant le dessin

const canvas = $('canvas');
const scene = window.OndesTableau.Scene(canvas, dessiner);
const craie = scene.craie;
/* Même cadre que commun.js, mais l’écriture suit l’horloge de la figure (S.tw) : le tuteur peut la figer sur une étape. */
scene.cadre = function (graine) {
  const W = craie.W, H = craie.H, VW = 760, VH = 420;
  craie.debut(graine, S.tw);
  const s = Math.min(W / VW, H / VH);
  scene.s = s; scene.ox = (W - VW * s) / 2; scene.oy = (H - VH * s) / 2;
  craie.ctx.translate(scene.ox, scene.oy); craie.ctx.scale(s, s);
  craie.echelle = s; craie.tailleMin = 11; craie.cadre = { w: VW, h: VH, haut: 0 };
  return craie;
};
let MM = {};
const marque = (c, nom) => { MM[nom] = c.cur; };
/* Une partie peinte apparaît quand l’écriture arrive à elle, d’un coup. */
const peindre = (c, fn) => { if (c.t >= c.cur) c.direct(() => { c.ctx.save(); try { fn(c.ctx); } finally { c.ctx.restore(); } }); };
const vu = nom => M[nom] !== undefined && S.tw >= M[nom] - 1e-6;

// ───────────────────────── Le rendu « réel » (peint, pour l’œil ; la physique reste à la craie) ─────────────────────────
function arrondi(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
/** Bobine : fil de cuivre enroulé en spires orangées sur un mandrin (deux flasques), deux pattes. (x, y) = haut gauche. */
function bobinePeinte(ctx, x, y, w = 56, h = 22) {
  ctx.strokeStyle = 'rgba(234,88,12,.9)'; ctx.lineWidth = 1.5; ctx.beginPath();
  ctx.moveTo(x + 7, y + h); ctx.lineTo(x + 5, y + h + 9); ctx.moveTo(x + w - 7, y + h); ctx.lineTo(x + w - 5, y + h + 9); ctx.stroke();
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, '#7c2d12'); g.addColorStop(.22, '#ea8a1a'); g.addColorStop(.42, '#fcd34d'); g.addColorStop(.68, '#c2410c'); g.addColorStop(1, '#6b2410');
  ctx.fillStyle = g; ctx.fillRect(x + 5, y, w - 10, h);
  ctx.strokeStyle = 'rgba(67,20,7,.55)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let sx = x + 7; sx < x + w - 6; sx += 3) { ctx.moveTo(sx, y + .5); ctx.lineTo(sx + 1.3, y + h - .5); }
  ctx.stroke();
  for (const fx of [x, x + w - 5]) {
    const f = ctx.createLinearGradient(fx, 0, fx + 5, 0); f.addColorStop(0, '#efe0bd'); f.addColorStop(1, '#a8895a');
    ctx.fillStyle = f; arrondi(ctx, fx, y - 4, 5, h + 8, 1.5); ctx.fill();
  }
}
/** Condensateur chimique peint (cylindre bleu, chapeau argenté, bande claire « − »). (x, y) = haut gauche. */
function condensateurPeint(ctx, x, y, w = 26, h = 46) {
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(x + w / 2 + 3, y + h + 3, w / 2 + 2, 4, 0, 0, Math.PI * 2); ctx.fill();
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  g.addColorStop(0, '#1e3a8a'); g.addColorStop(.35, '#3b82f6'); g.addColorStop(.55, '#60a5fa'); g.addColorStop(1, '#1e3a8a');
  ctx.fillStyle = g; arrondi(ctx, x, y, w, h, 5); ctx.fill();
  ctx.fillStyle = 'rgba(226,232,240,.55)'; ctx.fillRect(x + w - 9, y + 4, 5, h - 8);
  const a = ctx.createLinearGradient(x, 0, x + w, 0); a.addColorStop(0, '#94a3b8'); a.addColorStop(.5, '#e2e8f0'); a.addColorStop(1, '#94a3b8');
  ctx.fillStyle = a; ctx.beginPath(); ctx.ellipse(x + w / 2, y + 2, w / 2, 3.5, 0, 0, Math.PI * 2); ctx.fill();
}
/** La boîte G (générateur d’entretien) : boîtier sombre, voyant, deux bornes. (x, y) = haut gauche. */
function boiteG(ctx, x, y, w = 50, h = 36) {
  const g = ctx.createLinearGradient(x, y, x + w, y + h); g.addColorStop(0, '#475569'); g.addColorStop(1, '#1e293b');
  arrondi(ctx, x, y, w, h, 6); ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = '#e2e8f0'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('G', x + w / 2 - 6, y + h / 2 + 6);
  ctx.fillStyle = 'rgba(74,222,128,.85)'; ctx.beginPath(); ctx.arc(x + w - 11, y + 10, 3, 0, 7); ctx.fill();
  const borne = (bx, k) => { ctx.fillStyle = k; ctx.beginPath(); ctx.arc(bx, y + h - 7, 3.5, 0, 7); ctx.fill(); };
  borne(x + w - 18, '#dc2626'); borne(x + w - 8, '#111827');
}
/** Quadrillage léger d’un graphe (comme du papier millimétré). */
function quadrillage(ctx, g, X, Y) {
  ctx.strokeStyle = 'rgba(96,165,250,.15)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let v = g.xmin; v <= g.xmax + 1e-9; v += g.dx) { ctx.moveTo(X(v), Y(g.ymin)); ctx.lineTo(X(v), Y(g.ymax)); }
  for (let v = g.ymin; v <= g.ymax + 1e-9; v += g.dy) { ctx.moveTo(X(g.xmin), Y(v)); ctx.lineTo(X(g.xmax), Y(v)); }
  ctx.stroke();
}

// ───────────────────────── Morceaux de craie ─────────────────────────
const EXP = { '⁻': '−', '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9' };
/** Largeur d’un texte de craie (indices et exposants plus petits, comme le kit et exposants.js les écrivent). */
function larg(c, s, t = 24) {
  s = String(s).replace(/[⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, g => '^{' + [...g].map(ch => EXP[ch]).join('') + '}');
  return window.Tableau.Craie.segments(s).reduce((w, g) => w + c.largeurTexte(g.t, g.sub || g.sup ? t * .62 : t), 0);
}
/** Texte entouré d’un cadre jaune (le résultat à retenir). Renvoie le rectangle. */
function encadre(c, s, x, y, o = {}) {
  const t = o.taille ?? 24, w = Math.min(o.max ?? 1e9, larg(c, s, t)) + 22, x0 = o.align === 'left' ? x : x - w / 2, cx = x0 + w / 2;
  c.texte(s, cx, y, { couleur: o.couleur ?? 'blanc', taille: t, align: 'center', max: o.max });
  c.rect(x0, y - t * .95, w, t * 1.42, { couleur: 'jaune', arrondi: 8, largeur: 2 });
  return { x: x0, y: y - t * .95, w, h: t * 1.42 };
}
/** Titre de la figure, et le repère `figure` (tout le dessin). */
function titre(c, s, label) {
  c.texte(s, 40, 32, { couleur: 'cyan', taille: 21, max: 680 });
  c.ligne(40, 42, 40 + Math.min(680, larg(c, s, 21)), 42, { couleur: 'tresfaible', largeur: 1.2, duree: .2 });
  c.repere('figure', 16, 12, 728, 380, label);
}
/** Symbole de la bobine à la craie : quatre créneaux arrondis, horizontal de (x1, y) à (x2, y). */
function symboleL(c, y, x1, x2, couleur = 'blanc') {
  const n = 4, r = (x2 - x1) / (2 * n), pts = [];
  for (let k = 0; k < n; k++) for (let j = 0; j <= 8; j++) {
    const a = -Math.PI / 2 + j / 8 * Math.PI, cx = x1 + r * (2 * k + 1);
    pts.push([cx + r * Math.sin(a), y - r * 1.1 * Math.cos(a)]);
  }
  c.trait(pts, { couleur, largeur: 2.4, tremble: .3 });
}
/** Symbole du condensateur à la craie : deux traits verticaux (fil horizontal) centrés en (x, y). */
function symboleC(c, x, y, couleur = 'rouge') {
  c.ligne(x - 30, y, x - 6, y, { couleur: 'blanc', largeur: 2 }).ligne(x + 6, y, x + 30, y, { couleur: 'blanc', largeur: 2 });
  c.ligne(x - 6, y - 16, x - 6, y + 16, { couleur, largeur: 3 }).ligne(x + 6, y - 16, x + 6, y + 16, { couleur, largeur: 3 });
}
/**
 * Axes d’un graphe (les valeurs négatives sont sous l’axe des temps), graduations, noms et unités.
 * g = { x, y, w, h, xmin, xmax, ymin, ymax, dx, dy (quadrillage), xt, yt (graduations écrites), xl, yl, sansY }. Renvoie X(v), Y(v).
 */
function graphe(c, g) {
  g = { xmin: 0, ...g };
  const X = v => g.x + (v - g.xmin) / (g.xmax - g.xmin) * g.w, Y = v => g.y + (g.ymax - v) / (g.ymax - g.ymin) * g.h;
  if (g.dx) peindre(c, ctx => quadrillage(ctx, g, X, Y));
  const nb = v => String(+v.toFixed(4)).replace('.', ',').replace('-', '−');
  c.fleche(X(g.xmin), Y(0), X(g.xmax) + 16, Y(0), { couleur: 'blanc', largeur: 2 });
  c.fleche(X(0), Y(g.ymin), X(0), Y(g.ymax) - 14, { couleur: 'blanc', largeur: 2 });
  for (const v of g.xt || []) { c.ligne(X(v), Y(0) - 4, X(v), Y(0) + 4, { couleur: 'blanc', largeur: 1.4, duree: .04 }); c.texte(nb(v), X(v), Y(0) + 17, { couleur: 'blanc', align: 'center', taille: 12, duree: .1 }); }
  for (const v of g.yt || []) { c.ligne(X(0) - 4, Y(v), X(0) + 4, Y(v), { couleur: 'blanc', largeur: 1.4, duree: .04 }); c.texte(nb(v), X(0) - 7, Y(v) + 4, { couleur: 'blanc', align: 'right', taille: 12, duree: .1 }); }
  c.texte('0', X(0) - 7, Y(0) + 15, { couleur: 'blanc', align: 'right', taille: 12 });

/** Une croix jaune qui barre une courbe éliminée. */
function barrer(c, x, y, w, h) { c.ligne(x, y, x + w, y + h, { couleur: 'jaune', largeur: 3 }).ligne(x + w, y, x, y + h, { couleur: 'jaune', largeur: 3 }); }
/** Oscillation amortie qui part d’un sommet : A·k^(t/T)·(cos + a·sin), a = −ln k/(2π) (dérivée nulle à t = 0 ; sommets à t = nT valant A·kⁿ). */
const amortie = (A, T, k) => { const a = -Math.log(k) / (2 * Math.PI); return t => A * k ** (t / T) * (Math.cos(2 * Math.PI * t / T) + a * Math.sin(2 * Math.PI * t / T)); };

    const r2 = encadre(c, 'à 16 ms : E_e = 3,2·10⁻⁵ − ½ × 1 × (4,8·10⁻³)² ≈ 2,05·10⁻⁵ J', x, 384, { taille: 16, align: 'left', couleur: 'rouge', max: 360 });

  },

};

function dessiner(c) {
  scene.cadre(41);
  MM = {};
  DESSINS[fig](c);
  M = MM;
  return c.fin() || !S.running;   // figée sur une étape : l’image ne change plus, on cesse de la redessiner
}

// ───────────────────────── Ce que le tuteur voit et peut faire ─────────────────────────
/* Texte pour la bulle (lu par l’élève) : jamais de « _ » ni d’accolades visibles. */
const BAS = { 0: '₀', 1: '₁', 2: '₂', 3: '₃', 4: '₄', 5: '₅', 6: '₆', 7: '₇', 8: '₈', 9: '₉', a: 'ₐ', e: 'ₑ', m: 'ₘ', x: 'ₓ' };
const lisible = s => String(s).replace(/\^\{([^}]+)\}/g, '^($1)').replace(/_\{?([A-Za-z0-9]+)\}?/g, (m, g) => ([...g].every(ch => ch in BAS) ? [...g].map(ch => BAS[ch]).join('') : g));
const etapes = () => FIGS[fig].etapes.map(e => e[0]);
const info = nom => FIGS[fig].etapes.find(e => e[0] === nom) || [nom, nom, ''];
const etiquette = () => { $('run').textContent = S.running ? 'Pause' : S.pause ? 'Reprendre' : 'Rejouer'; };
scene.avancer = dt => {
  if (!S.running) return false;
  S.tw += dt * VITESSE;
  if (S.jusqua != null && S.tw >= S.jusqua) {
    S.tw = S.jusqua; S.jusqua = null; S.running = false;
    if (M.fin !== undefined && S.tw >= M.fin - 1e-6) { S.pause = false; S.fait = true; etiquette(); bulle($('feedback'), 'Arrêt sur image : figure complète.'); pont.noter('measurement', { figure: fig }); pont.emettre(); return true; }
    S.pause = true; etiquette();
    bulle($('feedback'), 'Arrêt sur image : ' + lisible(S.motif || 'instant choisi') + '.'); pont.noter('pause', { moment: S.motif }); pont.emettre();
    return true;
  }
  if (M.fin !== undefined && S.tw >= M.fin + 0.05) {
    S.running = false; S.pause = false; S.fait = true; etiquette(); pont.noter('measurement', { figure: fig }); pont.emettre();
  } else if (performance.now() - S.emis > 500) { S.emis = performance.now(); pont.emettre(); }
  return true;
};
function calculer() { if (M.fin === undefined) { const t = S.tw; S.tw = 1e6; dessiner(craie); S.tw = t; scene.sale = true; } }
function start() { S.tw = 0; S.jusqua = null; S.motif = ''; S.running = true; S.pause = false; S.fait = false; scene.sale = true; etiquette(); bulle($('feedback'), ''); pont.noter('start', { figure: fig }); pont.emettre(); }
function pause() { if (!S.running) return; S.running = false; S.pause = true; S.jusqua = null; etiquette(); bulle($('feedback'), 'Pause.'); pont.noter('pause'); pont.emettre(); }
function resume() { if (S.running) return; if (!S.pause) return start(); S.running = true; S.pause = false; etiquette(); bulle($('feedback'), ''); pont.noter('resume'); pont.emettre(); }
function playUntil(p) {
  calculer();
  const nom = p.moment in M && etapes().includes(p.moment) ? p.moment : null, cible = nom ? M[nom] : +p.time_s;
  if (!Number.isFinite(cible)) return;
  if (S.fait || !(S.running || S.pause) || S.tw >= cible - 1e-3) { S.tw = 0; S.fait = false; }
  S.jusqua = cible; S.motif = nom ? info(nom)[1] : `t = ${cible.toFixed(1).replace('.', ',')} s d’écriture`; S.running = true; S.pause = false; etiquette(); bulle($('feedback'), '');
  pont.noter('play_until', { moment: nom, time_s: +cible.toFixed(2) }); pont.emettre();
}
function setTime(p) {
  calculer(); const t = Math.max(0, Math.min(+p.time_s, M.fin ?? 0)); if (!Number.isFinite(t)) return;
  S.tw = t; S.jusqua = null; S.running = false; S.fait = t >= (M.fin ?? 0) - 1e-6; S.pause = !S.fait; scene.sale = true; etiquette();
  bulle($('feedback'), 'Arrêt sur image : ' + (S.fait ? 'figure complète' : `t = ${t.toFixed(1).replace('.', ',')} s d’écriture`) + '.'); pont.noter('set_time', { time_s: t }); pont.emettre();
}
function setParameters(p) {
  const f = p.fig || p.figure || p.variant;
  if (!f || !FIGS[f] || f === fig) return;
  fig = f; M = {}; config.title = 'Figure — ' + lisible(FIGS[fig].titre); config.variants = [{ id: fig, label: lisible(FIGS[fig].titre) }];
  config.command_schema.play_until.moment = etapes().join(' | ') + ' (réécrit la figure et s’arrête après cette étape)';
  start(); setTimeout(() => pont.manifeste(), 400);
}
$('run').onclick = () => (S.running ? pause() : S.pause ? resume() : start());

function ceQuiSeVoit() {
  const faites = etapes().filter(n => vu(n));
  const m = [`Figure « ${fig} » : ${lisible(FIGS[fig].titre)}.`];
  if (!faites.length) m.push(S.running ? 'La figure est en train de s’écrire à la craie (première étape pas encore finie).' : 'Rien d’écrit encore.');
  faites.forEach(n => { const d = info(n)[2]; if (d) m.push(lisible(d)); });
  m.push(S.running ? 'La craie écrit encore.' : S.pause ? `Écriture arrêtée après l’étape « ${faites.length ? faites[faites.length - 1] : 'aucune'} ».` : 'Figure complète.');
  return m.join(' ');
}
window.Tableau.explication(Object.fromEntries(Object.keys(FIGS).map(f => [f, FIGS[f].etapes.map(([e, , d]) => ({ repere: e, texte: d }))])));
const commandes = ['start', 'reset', 'pause', 'resume', 'play_until', 'set_time', 'set_parameters'];
const config = { id: 'circuit_rlc_figures', version: '1.0', title: 'Figure — ' + lisible(FIGS[fig].titre), variants: [{ id: fig, label: lisible(FIGS[fig].titre) }], commands: commandes,
  command_schema: { play_until: { moment: etapes().join(' | ') + ' (réécrit la figure et s’arrête après cette étape)', time_s: 'instant d’écriture (s)' },
    set_time: { time_s: 'instant d’écriture (s), figé' }, set_parameters: { fig: Object.keys(FIGS).join(' | ') } } };
const pont = protocole({ id: config.id, commandes, config,
  texte: `Figure du cours « Oscillations libres d’un circuit RLC série » : ${lisible(FIGS[fig].titre)}. Étapes d’écriture : ${etapes().join(', ')}.`,
  etat: () => ({ simulation_status: S.running ? 'running' : S.pause ? 'paused' : 'finished', ce_qui_se_voit: ceQuiSeVoit(), current_variant: fig,
    time_s: +S.tw.toFixed(2), parameters: { fig },
    moments: (calculer(), Object.fromEntries(etapes().filter(n => M[n] !== undefined).map(n => [n, +M[n].toFixed(2)]))), etapes_ecrites: etapes().filter(n => vu(n)) }),
  progression: () => (S.fait ? 1 : 0),
  executer: (cmd, p) => ({ start, reset: start, pause, resume, play_until: () => playUntil(p), set_time: () => setTime(p), set_parameters: () => setParameters(p) })[cmd]?.() });
etiquette();
window.__figures = { FIGS, S, scene };   // pour les vérifications automatiques
</script>
