<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Le circuit RL — au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="rl.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Le montage RL : un générateur E, un interrupteur K à deux positions (1 : le générateur est dans la maille ; 2 : R et la bobine seuls), un résistor R et une bobine (L, r) ; les flèches i, u_R et u_b ; à droite un oscilloscope, voie 1 aux bornes de R, voie 2 aux bornes de la bobine, masse au point commun ; u_R(t), image de i, monte en vert à l’établissement et descend en bleu à la rupture"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start reset pause resume play_until set_time">Lancer</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="commun.js"></script>
<script src="exposants.js"></script>
<script>
/*
 * Le montage RL, l’oscilloscope, l’établissement et la rupture du courant (cours « Dipôle RL », 2e Bac PC BIOF, novembre 2026).
 * Valeurs : E = 6 V, R = 50 Ω, bobine L = 0,12 H et r = 10 Ω → I₀ = E/(R + r) = 0,1 A = 100 mA ; τ = L/(R + r) = 2 ms ;
 * U_R = R·I₀ = 5 V ; u_R(τ) = 0,63 × 5 = 3,15 V.
 * Vues (?vue=) :
 *  - montage (défaut) : le circuit (positions 1 et 2), les flèches i, u_R, u_b (convention récepteur), l’oscilloscope
 *    (voie 1 aux bornes de R : u_R = R·i, image de i ; voie 2 aux bornes de la bobine ; masse au point commun).
 *  - etablissement : K passe en 1 ; u_R(t) = U_R(1 − e^{−t/τ}) s’enregistre en vert ; régime transitoire puis permanent.
 *  - rupture : régime permanent ; K passe en 2 ; u_R(t) = U_R·e^{−t/τ} descend en bleu (i garde son sens).
 * Masse au point commun de R et de la bobine : la voie 1 lit +u_R ; la voie 2 lit −u_b (on l’inverse pour lire u_b) —
 * seule u_R est tracée ici. Axe des temps en valeurs rondes (2,5 ms) qui ne tombent pas sur τ. La courbe s’enregistre en
 * 4 s réelles (ralenti). Paramètres : vue ; K (1 | 2) ; R_ohm (20 → 200) ; L_H (0,02 → 0,5) ; E (1 → 12 V). r = 10 Ω fixe.
 * Couleurs fixes : vert = établissement, bleu = rupture (jaune réservé au surlignage).
 * Poignée : l’interrupteur K (un clic le bascule : 1 → établissement, 2 → rupture).
 */
/* ── Moteur du déroulé (commun aux pages « appareils » des dossiers dipole-rc-tableau et dipole-rl-tableau, recopié dans chaque page) ──────────────
 * Une page déclare des étapes par vue : { nom, anim (s), ecritDes (s, défaut = anim), motif, bulle() }.
 * Chaque étape : d’abord son animation (aiguille, électrons, courbe qui s’enregistre…), puis la craie écrit ce
 * qu’il faut dire ; le moment `nom` est la fin de cette écriture (l’animation est finie, le texte est écrit).
 * Les durées d’écriture sont mesurées au dessin (calculer), donc les moments suivent les paramètres.
 * Les parties fixes (titres, axes, montage déjà dessiné) s’écrivent à l’horloge de la scène, ECRITURE fois plus vite.
 */
const { fr, bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lisse = p => p * p * (3 - 2 * p);
const fx = (v, d = 2) => fr(v, d).replace(/(,\d*?)0+$/, '$1').replace(/,$/, '');   // 1,50 → 1,5 ; 2,00 → 2
const ECRITURE = 2.5;
function Moteur(o) {
  const q = new URLSearchParams(location.search);
  const S = { vue: o.vues.includes(q.get('vue')) ? q.get('vue') : o.vues[0], t: 0, running: false, pause: false, fait: false,
    jusqua: null, motif: '', emis: 0, dit: '', mesure: false };
  const V = o.vitesse ?? 1.7, T0 = o.T0 ?? .8, HOLD = {};
  let TL = null;
  function construire() {
    let s = T0; const ev = [];
    for (const e of o.etapes(S.vue)) {
      const anim = e.anim || 0, d = { ...e, anim, debut: s, ecrit: s + (e.ecritDes ?? anim) };
      d.fin = Math.max(s + anim, d.ecrit + (HOLD[e.nom] ?? 1.5)) + .35;
      s = d.fin; ev.push(d);
    }
    const mom = {}; for (const e of ev) mom[e.nom] = e.fin; mom.fin = s + (o.queue ?? .6);
    TL = { ev, M: mom };
  }
  const ev = nom => TL.ev.find(e => e.nom === nom);
  const M = {
    S, ev, Moments: () => TL.M,
    /** Avancement (0 → 1) de l’animation de l’étape `nom`. */
    p(nom) { const e = ev(nom); if (!e) return 0; return e.anim > 0 ? clamp((S.t - e.debut) / e.anim, 0, 1) : (S.t >= e.debut - 1e-6 ? 1 : 0); },
    commence(nom) { const e = ev(nom); return !!e && S.t > e.debut + 1e-6; },
    vu(nom) { if (nom === 'fin') return S.t >= TL.M.fin - 1e-6; const e = ev(nom); return !!e && S.t >= e.fin - 1e-6; },
    /** Ce qui s’écrit à l’étape `nom` : la craie écrit à partir de la fin de son animation. */
    etape(c, nom, fn) {
      const e = ev(nom); if (!e) return;
      const t = c.t, cur = c.cur, comp = c.complet, w0 = e.ecrit;
      c.t = S.t > 1e5 ? 1e9 : w0 + (S.t - w0) * V; c.cur = w0;
      try { fn(); } finally { if (S.mesure) HOLD[nom] = (c.cur - w0) / V; c.t = t; c.cur = cur; if (!S.running) c.complet = comp; }
    },
    etat() { return S.running ? 'en cours' : S.fait ? 'fin' : S.pause ? 'arrêt sur image' : 'pas encore lancée'; },
  };
  const scene = window.OndesTableau.Scene($('canvas'), (c) => o.dessiner(c, M));
  const cadreBase = scene.cadre;
  scene.cadre = function (g) { const k = cadreBase.call(scene, g); if (Number.isFinite(k.t)) k.t *= ECRITURE; return k; };
  M.scene = scene; M.craie = scene.craie;
  function calculer() {
    construire();
    const t = S.t, r = S.running; S.t = 1e6; S.running = false; S.mesure = true;
    try { o.dessiner(scene.craie, M); } finally { S.t = t; S.running = r; S.mesure = false; }
    construire(); scene.sale = true;
  }
  // La bulle est du texte simple : jamais de « _ » visible (u_C → uC, I_0 → I₀).
  const sansSouligne = s => String(s).replace(/([A-Za-zΔτ])_\{?([A-Za-z0-9]+)\}?/g, (m, a, i) => a + (/^\d+$/.test(i) ? [...i].map(d => '₀₁₂₃₄₅₆₇₈₉'[d]).join('') : i));
  const dire = (texte, kind = '') => { texte = sansSouligne(texte); S.dit = texte; bulle($('feedback'), texte, kind); };
  const etiquette = () => { $('run').textContent = S.running ? 'Pause' : S.pause ? 'Reprendre' : S.fait ? 'Rejouer' : 'Lancer'; };
  let pont = null;
  const emettre = () => pont && pont.emettre();
  const noter = (a, d) => pont && pont.noter(a, d);
  scene.avancer = dt => {
    if (!S.running) return !!(o.anime && o.anime());
    const avant = S.t; S.t += dt;
    for (const e of TL.ev) if (avant < e.debut && S.t >= e.debut && e.bulle) dire(e.bulle());
    if (S.jusqua != null && S.t >= S.jusqua) {
      S.t = S.jusqua; S.jusqua = null; S.running = false;
      if (S.t >= TL.M.fin - 1e-6) { finir(); return true; }
      S.pause = true; etiquette(); dire('Arrêt sur image : ' + (S.motif || `t = ${fx(S.t, 1)} s`) + '.');
      noter('pause', { time_s: +S.t.toFixed(2) }); emettre(); return true;
    }
    if (S.t >= TL.M.fin) { S.t = TL.M.fin; finir(); return true; }
    if (performance.now() - S.emis > 500) { S.emis = performance.now(); emettre(); }
    return true;
  };
  function finir() { S.running = false; S.fait = true; S.pause = false; S.jusqua = null; etiquette(); dire(o.messageFin(M), 'good'); noter('measurement', o.params(M)); emettre(); }
  function start() { o.reprise && o.reprise(); S.t = 0; S.jusqua = null; S.motif = ''; S.running = true; S.pause = false; S.fait = false; etiquette(); dire(o.depart(M)); noter('start', o.params(M)); emettre(); }
  function pause() { if (!S.running) return; S.running = false; S.pause = true; S.jusqua = null; etiquette(); dire('Arrêt sur image.'); noter('pause', { time_s: +S.t.toFixed(2) }); emettre(); }
  function resume() { if (S.running) return; o.reprise && o.reprise(); if (!S.pause) return start(); S.running = true; S.pause = false; etiquette(); dire('Ça repart…'); noter('resume'); emettre(); }
  function setTime(p) {
    const t = +p.time_s; if (p.time_s === null || p.time_s === '' || !Number.isFinite(t)) return;
    o.reprise && o.reprise(); S.running = false; S.jusqua = null; S.t = clamp(t, 0, TL.M.fin); S.fait = S.t >= TL.M.fin - 1e-6; S.pause = !S.fait && S.t > 0;
    etiquette(); scene.sale = true; dire(`Arrêt sur image : t = ${fx(S.t, 1)} s.`); noter('set_time', { time_s: S.t }); emettre();
  }
  function playUntil(p) {
    const noms = o.etapes(S.vue).map(e => e.nom).concat('fin');
    const nom = noms.includes(p.moment) ? p.moment : null, cible = nom ? TL.M[nom] : +p.time_s;
    if (!Number.isFinite(cible) || (p.moment && !nom && (p.time_s == null || p.time_s === ''))) { dire(`Moment inconnu : ${p.moment}.`, 'bad'); emettre(); return; }
    o.reprise && o.reprise();
    if (S.fait || S.t >= cible - 1e-3) { S.t = 0; S.fait = false; }
    S.jusqua = clamp(cible, .01, TL.M.fin); S.motif = nom ? (o.motifs[nom] || nom) : ''; S.running = true; S.pause = false; etiquette(); dire('Observe…');
    noter('play_until', { moment: nom, time_s: S.jusqua }); emettre();
  }
  function setParameters(p) {
    p = p || {};
    const r = o.appliquer(p, M) || {};
    if (r.vue && o.vues.includes(r.vue) && r.vue !== S.vue) { S.vue = r.vue; r.change = true; r.vueChange = true; }
    if (r.change) { calculer(); if (r.vueChange) scene.reecrire(); }
    noter('set_parameters', o.params(M));
    if (r.apres) r.apres();
    else if (r.change && !r.garder) start();
    else { scene.sale = true; emettre(); }
  }
  Object.assign(M, { noter, calculer, dire, start, pause, resume, setTime, playUntil, setParameters, emettre, etiquette });
  $('run').onclick = () => (S.running ? pause() : S.pause ? resume() : start());
  window.Tableau.explication(o.explications);
  const commandes = ['start', 'reset', 'pause', 'resume', 'set_time', 'set_parameters', 'play_until'];
  M.lancer = () => {
    calculer();
    const listeMoments = o.vues.map(v => `${o.vues.length > 1 ? v + ' : ' : ''}${o.etapes(v).map(e => e.nom).concat('fin').join(' | ')}`).join(' ; ');
    const config = { id: o.id, version: '1.0', title: o.titre, variants: o.vues.length > 1 ? o.vues.map(id => ({ id, label: o.titres[id] })) : [], commands: commandes,
      command_schema: { set_parameters: o.schema, set_time: { time_s: '0..fin (arrêt sur cet instant de la scène, en s ; voir moments)' },
        play_until: { moment: listeMoments, time_s: 'ou un instant en s' } } };
    pont = protocole({ id: o.id, commandes, config, texte: o.texte,
      etat: () => ({ simulation_status: S.running ? 'running' : S.fait ? 'finished' : S.pause ? 'paused' : 'idle',
        ce_qui_se_voit: o.voir(M) + (S.dit ? ` La bulle dit : « ${S.dit} »` : ''), current_variant: S.vue, time_s: +S.t.toFixed(2),
        parameters: o.params(M), moments: Object.fromEntries(Object.entries(TL.M).map(([k, v]) => [k, +v.toFixed(2)])) }),
      progression: () => (S.fait ? 1 : 0),
      executer: (cmd, p) => ({ start, reset: start, pause, resume, set_time: () => setTime(p), set_parameters: () => setParameters(p), play_until: () => playUntil(p) })[cmd]?.() });
    dire(o.depart(M));
    setTimeout(() => { if (!S.running && S.t === 0 && !S.pause && !S.fait) start(); }, 900);
  };
  return M;
}

/* ── Appareils peints (règle 7 : ils ressemblent aux vrais ; le peint ne change jamais la physique) ── */
const Peint = {
  /** Sphère ombrée (électron : bleu). */
  sphere(ctx, x, y, r, [clair, milieu, sombre] = ['#e3f3ff', '#3b9cff', '#0a3a8c'], a = 1) {
    ctx.save(); ctx.globalAlpha = a;
    const g = ctx.createRadialGradient(x - r * .35, y - r * .4, r * .1, x, y, r); g.addColorStop(0, clair); g.addColorStop(.45, milieu); g.addColorStop(1, sombre);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  },
  /** Boîtier d’un générateur (vu de face) : coffret gris, afficheur, deux bornes (rouge +, noire −). */
  generateur(ctx, x, y, w, h, affiche, a = 1) {
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.roundRect(x + 3, y + 4, w, h, 7); ctx.fill();
    const g = ctx.createLinearGradient(x, y, x + w, y + h); g.addColorStop(0, '#5b6670'); g.addColorStop(.5, '#3b444c'); g.addColorStop(1, '#262c32');
    ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(x, y, w, h, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1; ctx.stroke();
    const ex = x + w * .14, ey = y + h * .3, ew = w * .72, eh = h * .26;
    ctx.fillStyle = '#0d1a10'; ctx.beginPath(); ctx.roundRect(ex, ey, ew, eh, 3); ctx.fill();
    ctx.fillStyle = '#7dfc8a'; ctx.font = `600 ${Math.round(eh * .72)}px monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(affiche, ex + ew / 2, ey + eh / 2 + 1);
    ctx.restore();
  },
  /** Borne ronde (rouge ou noire). */
  borne(ctx, x, y, rouge, a = 1) { Peint.sphere(ctx, x, y, 5, rouge ? ['#ffd0d0', '#e0393e', '#6d0f12'] : ['#9aa0a6', '#2b2f33', '#050607'], a); },
  /** Appareil à cadran (ampèremètre ou voltmètre) : boîtier, cadran crème, graduations, aiguille (f de 0 à 1). */
  cadran(ctx, cx, cy, r, f, lettre, graduations = null, a = 1) {
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.roundRect(cx - r - 4 + 3, cy - r - 4 + 4, 2 * r + 8, 2 * r + 8, 9); ctx.fill();
    const g = ctx.createLinearGradient(cx - r, cy - r, cx + r, cy + r); g.addColorStop(0, '#3a3f45'); g.addColorStop(1, '#1b1e22');
    ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(cx - r - 4, cy - r - 4, 2 * r + 8, 2 * r + 8, 9); ctx.fill();
    const f2 = ctx.createRadialGradient(cx - r * .3, cy - r * .4, r * .1, cx, cy, r); f2.addColorStop(0, '#fffaf0'); f2.addColorStop(1, '#e4dcc8');
    ctx.fillStyle = f2; ctx.beginPath(); ctx.roundRect(cx - r, cy - r, 2 * r, 2 * r * .92, 6); ctx.fill();
    const px = cx, py = cy + r * .55, R = r * 1.05, a0 = -Math.PI * .78, a1 = -Math.PI * .22;
    ctx.strokeStyle = '#333'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(px, py, R * .82, a0, a1); ctx.stroke();
    const n = graduations ? graduations.length - 1 : 10;
    for (let i = 0; i <= n * 2; i++) {
      const an = a0 + (a1 - a0) * i / (n * 2), l = i % 2 ? .07 : .13;
      ctx.beginPath(); ctx.moveTo(px + Math.cos(an) * R * .82, py + Math.sin(an) * R * .82); ctx.lineTo(px + Math.cos(an) * R * (.82 + l), py + Math.sin(an) * R * (.82 + l)); ctx.stroke();
    }
    ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.arc(px + Math.cos(a1) * R * .86, py + Math.sin(a1) * R * .86, 1.6, 0, 7); ctx.fill();
    if (graduations) {
      ctx.fillStyle = '#333'; ctx.font = `${Math.round(r * .2)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      graduations.forEach((s, i) => { const an = a0 + (a1 - a0) * i / n; ctx.fillText(s, px + Math.cos(an) * R * 1.08, py + Math.sin(an) * R * 1.08 + 1); });
    }
    ctx.fillStyle = '#222'; ctx.font = `700 ${Math.round(r * .42)}px serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(lettre, cx, cy + r * .38);
    const an = a0 + (a1 - a0) * clamp(f, -.02, 1.03);
    ctx.strokeStyle = '#111'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(an) * R * .9, py + Math.sin(an) * R * .9); ctx.stroke();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(px, py, 2.6, 0, 7); ctx.fill();
    // Verre : un reflet léger (pour l’œil seulement).
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.ellipse(cx - r * .35, cy - r * .55, r * .5, r * .16, -.3, 0, 7); ctx.fill();
    ctx.restore();
  },
  /** Résistor : corps beige en cylindre, bandes de couleur lues sur la valeur (Ω). */
  resistor(ctx, x, y, w, h, ohm, a = 1) {
    const COUL = ['#111', '#7b4a1e', '#d32f2f', '#f57c00', '#fbc02d', '#2e7d32', '#1565c0', '#7b1fa2', '#9e9e9e', '#fafafa'];
    const e = Math.floor(Math.log10(ohm) + 1e-9) - 1, m = Math.round(ohm / 10 ** e), d1 = Math.floor(m / 10) % 10, d2 = m % 10;
    ctx.save(); ctx.globalAlpha = a;
    const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, '#f3e1bf'); g.addColorStop(.45, '#d9bf8f'); g.addColorStop(1, '#9c8358');
    ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(x, y, w, h, h / 2.2); ctx.fill();
    [[.24, d1], [.38, d2], [.52, clamp(e, 0, 9)], [.78, -1]].forEach(([f, k]) => {
      ctx.fillStyle = k < 0 ? '#c9a227' : COUL[k]; ctx.fillRect(x + w * f, y + 1, w * .07, h - 2);
    });
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(x + h * .3, y + h * .18, w - h * .6, h * .12);
    ctx.restore();
  },
  /** Interrupteur : socle sombre, plots laiton, levier métallique (pivot → bout). */
  levier(ctx, px, py, bx, by, a = 1) {
    ctx.save(); ctx.globalAlpha = a; ctx.lineCap = 'round';
    ctx.strokeStyle = '#4a4f55'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(bx, by); ctx.stroke();
    ctx.strokeStyle = '#c8ccd2'; ctx.lineWidth = 3.4; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(bx, by); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(px, py - 1); ctx.lineTo(bx, by - 1); ctx.stroke();
    Peint.sphere(ctx, bx, by, 4.2, ['#ffe9c2', '#c98a2a', '#5a3a08']);
    ctx.restore();
  },
  plot(ctx, x, y, a = 1) { Peint.sphere(ctx, x, y, 4.6, ['#fff1c9', '#cfa046', '#5e4210'], a); },
};
/* ── Appareils du dipôle RL (peints : bobine, noyau de fer, lampe, oscilloscope, ohmmètre, GBF) ── */
Object.assign(Peint, {
  /**
   * Bobine couchée : mandrin clair (deux joues) et fil de cuivre enroulé en spires orangées.
   * Renvoie les deux bornes (bout des fils de sortie, sous les joues). Le noyau se peint AVANT (il passe dans le mandrin).
   */
  bobine(ctx, x, y, w, h, a = 1) {
    const j = Math.max(6, h * .2), n = Math.max(7, Math.round((w - 2 * j) / 6.5));
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(x + w / 2 + 3, y + h + 9, w / 2, 4.5, 0, 0, 7); ctx.fill();
    // Fils de sortie (cuivre nu) : de chaque joue vers le bas.
    ctx.strokeStyle = '#d98a3d'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x + j + 3, y + h - 3); ctx.quadraticCurveTo(x + j - 2, y + h + 8, x + j * .5, y + h + 14);
    ctx.moveTo(x + w - j - 3, y + h - 3); ctx.quadraticCurveTo(x + w - j + 2, y + h + 8, x + w - j * .5, y + h + 14); ctx.stroke();
    // Enroulement : cylindre de cuivre (clair au milieu, sombre aux bords).
    const g = ctx.createLinearGradient(0, y + 3, 0, y + h - 3);
    g.addColorStop(0, '#4a2207'); g.addColorStop(.22, '#b8621f'); g.addColorStop(.45, '#ffbe7a'); g.addColorStop(.62, '#d9802f'); g.addColorStop(1, '#3d1b05');
    ctx.fillStyle = g; ctx.fillRect(x + j, y + 3, w - 2 * j, h - 6);
    // Les spires : un trait sombre légèrement penché, puis un reflet.
    const pas = (w - 2 * j) / n;
    for (let k = 0; k <= n; k++) {
      const sx = x + j + k * pas;
      ctx.strokeStyle = 'rgba(60,25,5,.75)'; ctx.lineWidth = 1.1; ctx.beginPath(); ctx.moveTo(sx, y + 3); ctx.lineTo(sx + pas * .35, y + h - 3); ctx.stroke();

  c.ligne(XC, YM, MS[0] - 7, MS[1], { largeur: 1.8 }); c.point(XC, YM, 3.4);
  c.ligne(XC, YV2, V2[0] - 7, V2[1], { largeur: 1.8 }); c.point(XC, YV2, 3.4);
  c.texte('voie 1', 404, 72, { couleur: 'blanc', taille: 14, align: 'center' });
  c.texte('masse', 404, YM - 7, { couleur: 'blanc', taille: 14, align: 'center' });
  c.texte('voie 2', 404, YV2 - 7, { couleur: 'blanc', taille: 14, align: 'center' });
}
function axesEcran(c) {
  const ax = axeT(), au = axeU(), tg = [], ug = [];
  for (let k = 1; k <= ax.n; k++) { const v = k * ax.pas; tg.push([v / ax.max * O.w / (O.w + 12), k % 2 && ax.n > 6 ? null : ms(v)]); }
  for (let v = au.pas; v <= au.max + 1e-9; v += au.pas) ug.push([v / au.max * O.h / (O.h + 12), fx(v, 1)]);
  c.axe(O.x, O.y, O.x + O.w + 12, O.y, tg, { taille: 12 });
  c.axe(O.x, O.y, O.x, O.y - O.h - 12, ug, { taille: 12, vertical: true });
  c.texte('0', O.x - 6, O.y + 16, { couleur: 'faible', taille: 12, align: 'right' });
  c.texte('u_R (V)', O.x + 8, O.y - O.h - 2, { couleur: 'blanc', taille: 15 });
  c.texte('t (ms)', ECR.x + ECR.w - 6, O.y - 8, { couleur: 'blanc', taille: 14, align: 'right' });
  c.texte('oscilloscope', CAS.x + CAS.w - 12, CAS.y + CAS.h - 12, { couleur: 'faible', taille: 13, align: 'right' });
}

/* ── Dessin ──────────────────────────────────────────────────────────── */
function dessiner(c, M) {
  MO = M; M.scene.cadre(23);
  const v = M.S.vue;
  c.texte(`Le circuit RL : ${TITRES[v]}`, 14, 28, { couleur: 'cyan', taille: 20 });
  const a = v === 'montage' ? lisse(M.p('montage')) : 1;
  appareils(c, a);
  if (v === 'montage') {
    M.etape(c, 'montage', () => {
      fils(c); axesEcran(c);
      c.texte('position 1 : le générateur est dans la maille (établissement)', 14, 330, { couleur: 'vert', taille: 15, max: 400 });
      c.texte('position 2 : R et la bobine seuls (rupture)', 14, 352, { couleur: 'bleu', taille: 15, max: 400 });
    });
    M.etape(c, 'fleches', () => { fleches(c); c.texte('convention récepteur : u_R et u_b opposées à i', 14, 376, { couleur: 'blanc', taille: 15, max: 400 }); });
    M.etape(c, 'oscillo', () => {
      filsOscillo(c);
      c.texte('voie 1 : u_R = R·i, image de i ; masse au point commun', 14, 400, { couleur: 'orange', taille: 15, max: 400 });
      c.texte('voie 1 : u_R = R·i', CAS.x + 14, CAS.y + CAS.h - 36, { couleur: 'orange', taille: 14 });
      c.texte('image de i', CAS.x + 14, CAS.y + CAS.h - 16, { couleur: 'orange', taille: 14 });
    });
  } else {
    fils(c); fleches(c, true); filsOscillo(c); axesEcran(c);
    c.texte('voie 1 : u_R = R·i', CAS.x + 14, CAS.y + CAS.h - 36, { couleur: 'orange', taille: 14 });
    c.texte('image de i', CAS.x + 14, CAS.y + CAS.h - 16, { couleur: 'orange', taille: 14 });
    // La flèche i : verte quand le courant s’établit (K en 1), bleue pendant la rupture (même sens).
    c.direct(() => {
      const passe = v === 'etablissement' ? M.commence('fermeture') && positionK() === 1 : true;
      const col = !passe ? 'faible' : v === 'etablissement' ? 'vert' : (M.commence('bascule') ? 'bleu' : 'vert');
      c.fleche(310, PV[1], 344, PV[1], { couleur: col, largeur: col === 'faible' ? 2 : 2.8, tete: 9 }); c.texte('i', 326, PV[1] - 8, { couleur: col, taille: 17, align: 'center' });
      const t = tEcran(), U = UR(), T = tau();
      if (v === 'etablissement' && M.commence('courbe_i')) c.courbe(u => [PX(u * t), PY(U * (1 - Math.exp(-u * t / T)))], 90, { couleur: 'vert', largeur: 2.6 });
      if (v === 'rupture') {
        if (M.commence('courbe_rupture')) c.courbe(u => [PX(u * t), PY(U * Math.exp(-u * t / T))], 90, { couleur: 'bleu', largeur: 2.6 });
        else c.point(PX(0), PY(U), 4.5, 'bleu');
      }
      c.texte(`u_R = ${fr(uR(), 2)} V`, ECR.x + ECR.w - 10, ECR.y + 22, { couleur: 'blanc', taille: 15, align: 'right' });
    });
    if (v === 'etablissement') {
      M.etape(c, 'fermeture', () => c.texte('K en position 1 : le courant s’établit', 14, 338, { couleur: 'vert', taille: 16, max: 400 }));
      M.etape(c, 'courbe_i', () => c.texte(`u_R = R·i monte de 0 vers ${fx(UR(), 2)} V, comme i`, 14, 364, { couleur: 'vert', taille: 16, max: 400 }));
      M.etape(c, 'permanent', () => {
        const ax = axeT(), x5 = PX(Math.min(5 * tau(), ax.max));
        c.ligne(O.x, PY(UR()), O.x + O.w, PY(UR()), { couleur: 'blanc', largeur: 1.4, pointille: [6, 5] });
        c.texte(`U_R = ${fx(UR(), 2)} V`, O.x + 6, PY(UR()) - 6, { couleur: 'blanc', taille: 14 });
        c.cote(O.x, O.y - 30, x5, O.y - 30, '', { couleur: 'orange', largeur: 1.4 });
        c.texte('régime transitoire', (O.x + x5) / 2 + 16, O.y - 38, { couleur: 'orange', taille: 14, align: 'center' });
        c.texte('régime permanent', ECR.x + ECR.w - 10, PY(UR()) + 22, { couleur: 'vert', taille: 14, align: 'right' });
        c.texte(`régime permanent : I_0 = E/(R + r) = ${fx(I0() * 1000, 1)} mA`, 14, 390, { couleur: 'vert', taille: 16, max: 400 });
        c.texte('avant : régime transitoire (i varie)', 14, 412, { couleur: 'orange', taille: 15, max: 400 });
      });
    } else {
      c.texte(`au départ : u_R = ${fx(UR(), 2)} V, i = I_0 = ${fx(I0() * 1000, 1)} mA`, 14, 330, { couleur: 'blanc', taille: 15, max: 400 });
      M.etape(c, 'bascule', () => c.texte('K en position 2 : R et la bobine seuls, sans générateur', 14, 356, { couleur: 'bleu', taille: 16, max: 400 }));
      M.etape(c, 'courbe_rupture', () => {
        c.texte(`u_R descend de ${fx(UR(), 2)} V vers 0 : i ne s’annule pas d’un coup`, 14, 382, { couleur: 'bleu', taille: 16, max: 400 });
        c.texte('i garde son sens : la bobine fait durer le courant', 14, 406, { couleur: 'bleu', taille: 15, max: 400 });
      });
    }
  }
  reperes(c, M);
  return c.fin();
}
function reperes(c, M) {
  const v = M.S.vue, ici = w => (v === w ? '' : ` (vue « ${w} »)`), ax = axeT(), x5 = PX(Math.min(5 * tau(), ax.max));
  c.repere('generateur', GEN.x - 4, GEN.y - 6, 120, GEN.h + 12, `le générateur : E = ${fx(S2.E, 1)} V`);
  c.repere('interrupteur', C1[0] - 22, 56, PV[0] - C1[0] + 50, 96, `l’interrupteur K, en position ${positionK()} (poignée : clic pour basculer)`);
  c.repere('position_1', C1[0] - 24, C1[1] - 24, 34, 32, 'position 1 : le générateur est dans la maille (établissement)');
  c.repere('position_2', C2[0] - 24, C2[1] - 8, 34, 32, 'position 2 : R et la bobine seuls (rupture)');
  c.repere('resistance', RES.x - 4, RES.y - 4, RES.w + 8, 46, `le résistor : R = ${fR(S2.R)}`);
  c.repere('bobine', BOB.x - 6, 150, XC + 70 - BOB.x, 110, `la bobine (L = ${fx(S2.L, 2)} H ; r = ${RB} Ω) : la vraie et son symbole`);
  c.repere('fleche_i', 306, PV[1] - 26, 42, 34, 'la flèche du courant i');
  c.repere('fleche_uR', RES.x - 6, 56, RES.w + 12, 30, 'la flèche u_R, opposée à i (convention récepteur)');
  c.repere('fleche_ub', 388, 158, 40, 84, 'la flèche u_b, opposée à i (convention récepteur)');
  c.repere('voie_1', 380, 56, 76, 34, 'la voie 1, aux bornes de R : u_R = R·i, image de i');
  c.repere('voie_2', 380, YV2 - 24, 76, 34, 'la voie 2, aux bornes de la bobine');
  c.repere('masse', 380, YM - 24, 76, 34, 'la masse, au point commun de R et de la bobine');
  c.repere('ecran', ECR.x, ECR.y, ECR.w, ECR.h, 'l’écran de l’oscilloscope : u_R(t)');
  c.repere('courbe', O.x, O.y - O.h, O.w, O.h, v === 'rupture' ? 'la courbe u_R(t) de la rupture (bleue)' : `la courbe u_R(t) de l’établissement (verte)${ici('etablissement')}`);
  c.repere('regime_transitoire', O.x, PY(UR()), x5 - O.x, O.y - PY(UR()), `le régime transitoire : i varie${ici('etablissement')}`);
  c.repere('regime_permanent', x5, PY(UR()) - 22, O.x + O.w - x5, 56, `le régime permanent : i = I₀ = ${fx(I0() * 1000, 1)} mA${ici('etablissement')}`);
}

/* ── Ce que voit le tuteur ─────────────────────────────────────────────── */
function voir(M) {
  const v = M.S.vue, T = tau(), ax = axeT(), au = axeU();
  const m = [`Vue « ${v} » (${TITRES[v]}), ${M.etat()}. E = ${fx(S2.E, 1)} V, R = ${fR(S2.R)}, bobine L = ${fx(S2.L, 2)} H et r = ${RB} Ω (I₀ = E/(R + r) = ${fx(I0() * 1000, 1)} mA ; U_R = R·I₀ = ${fx(UR(), 2)} V ; τ = L/(R + r) = ${ms(T)} ms, non écrit au tableau).`];
  m.push(`Montage : générateur (boîtier peint) ; interrupteur K en position ${positionK()} (1 : le générateur est dans la maille ; 2 : R et la bobine seuls) ; résistor peint (bandes de couleur) ; bobine peinte (spires de cuivre) à côté de son symbole à la craie ; à droite l’oscilloscope, axes t (ms, 0 à ${ms(ax.max)}, pas ${ms(ax.pas)}) et u_R (V, 0 à ${fx(au.max, 1)}).`);
  const e = [];
  if (v === 'montage') {
    if (M.vu('montage')) e.push('le circuit, « 1 » et « 2 » aux deux positions de K, « position 1 : le générateur est dans la maille (établissement) », « position 2 : R et la bobine seuls (rupture) »');
    if (M.vu('fleches')) e.push('les flèches i (vers la bobine), u_R et u_b opposées à i, « convention récepteur : u_R et u_b opposées à i »');
    if (M.vu('oscillo')) e.push('les fils de l’oscilloscope : voie 1 à la borne de R côté K, masse au point commun de R et de la bobine, voie 2 à l’autre borne de la bobine (avec cette masse, la voie 2 donne −u_b) ; « voie 1 : u_R = R·i, image de i ; masse au point commun »');
  } else {
    const t = tEcran();
    m.push(`Écran : t = ${ms(t)} ms ; u_R = ${fr(uR(), 2)} V ; i = u_R/R = ${fr(iA() * 1000, 1)} mA. Flèche i ${v === 'etablissement' ? (M.commence('fermeture') && positionK() === 1 ? 'allumée en vert' : 'éteinte') : (M.commence('bascule') ? 'en bleu, même sens qu’avant' : 'en vert (courant établi)')}.`);
    if (v === 'etablissement') {
      if (M.commence('courbe_i')) m.push(`Courbe verte u_R(t) = U_R(1 − e^{−t/τ}) tracée jusqu’à t = ${ms(t)} ms.`);
      if (M.vu('fermeture')) e.push('« K en position 1 : le courant s’établit »');
      if (M.vu('courbe_i')) e.push(`« u_R = R·i monte de 0 vers ${fx(UR(), 2)} V, comme i »`);
      if (M.vu('permanent')) e.push(`palier U_R = ${fx(UR(), 2)} V en pointillé, « régime transitoire » (de 0 à 5τ = ${ms(5 * T)} ms), « régime permanent », « régime permanent : I₀ = E/(R + r) = ${fx(I0() * 1000, 1)} mA », « avant : régime transitoire (i varie) »`);
    } else {
      e.push(`« au départ : u_R = ${fx(UR(), 2)} V, i = I₀ = ${fx(I0() * 1000, 1)} mA »`);
      if (M.commence('courbe_rupture')) m.push(`Courbe bleue u_R(t) = U_R·e^{−t/τ} tracée jusqu’à t = ${ms(t)} ms.`);
      else m.push(`Point bleu à u_R = ${fx(UR(), 2)} V au début de l’écran.`);
      if (M.vu('bascule')) e.push('« K en position 2 : R et la bobine seuls, sans générateur »');
      if (M.vu('courbe_rupture')) e.push(`« u_R descend de ${fx(UR(), 2)} V vers 0 : i ne s’annule pas d’un coup », « i garde son sens : la bobine fait durer le courant »`);
    }
  }
  if (e.length) m.push(`Écrit à la craie : ${e.join(' ; ')}.`);
  return m.join(' ');
}
const params = M => ({ vue: M.S.vue, K: positionK(), R_ohm: S2.R, L_H: S2.L, r_ohm: RB, E: S2.E, I0_mA: +(I0() * 1000).toFixed(2), tau_ms: +(tau() * 1000).toFixed(3), t_ecran_ms: +(tEcran() * 1000).toFixed(3), u_R_V: +uR().toFixed(3), i_mA: +(iA() * 1000).toFixed(2) });
const MOT = Moteur({
  id: 'dipole_rl_circuit', titre: 'Le circuit RL : montage, oscilloscope, établissement et rupture du courant', vues: VUES, titres: TITRES,
  etapes: v => ETAPES[v], motifs: MOTIFS, dessiner, voir, params,
  depart: M => ({ montage: 'Construisons le montage RL.', etablissement: 'Aucun courant, K est en position 2. On bascule en 1…', rupture: `Le courant est établi (i = I₀ = ${fx(I0() * 1000, 1)} mA). On bascule en 2…` })[M.S.vue],
  messageFin: M => ({ montage: 'Le montage : K en 1, le courant s’établit ; en 2, il est rompu. La voie 1 montre u_R = R·i, image de i.',
    etablissement: `Établissement : u_R monte de 0 à ${fx(UR(), 2)} V, donc i monte de 0 à I₀ = ${fx(I0() * 1000, 1)} mA ; régime transitoire, puis régime permanent.`,
    rupture: 'Rupture : u_R descend vers 0 ; i ne s’annule pas d’un coup et garde son sens.' })[M.S.vue],
  appliquer: (p, M) => {
    const r = {}; let change = false;
    if (VUES.includes(p.vue)) r.vue = p.vue;
    const nb = x => (x != null && x !== '' && Number.isFinite(+String(x).replace(',', '.')) ? +String(x).replace(',', '.') : null);
    const R = nb(p.R_ohm), L = nb(p.L_H), E = nb(p.E), K = nb(p.K);
    if (R !== null) { const v = clamp(Math.round(R), 20, 200); if (v !== S2.R) { S2.R = v; change = true; } }
    if (L !== null) { const v = clamp(Math.round(L * 100) / 100, .02, .5); if (v !== S2.L) { S2.L = v; change = true; } }
    if (E !== null) { const v = clamp(Math.round(E * 10) / 10, 1, 12); if (v !== S2.E) { S2.E = v; change = true; } }
    if (K === 1 || K === 2) { r.vue = K === 1 ? 'etablissement' : 'rupture'; change = true; }
    r.change = change || (r.vue && r.vue !== M.S.vue);
    return r;
  },
  schema: { vue: VUES.join(' | ') + ' (change la vue et relance)', K: '1 | 2 (1 : vue etablissement, K bascule en 1 ; 2 : vue rupture, K bascule en 2 ; relance)', R_ohm: '20..200 (Ω, pas 1 ; relance)', L_H: '0.02..0.5 (H, pas 0,01 ; relance)', E: '1..12 (V, pas 0,1 ; relance)' },
  texte: 'Le montage RL : générateur E, interrupteur K à deux positions (1 : le générateur est dans la maille ; 2 : R et la bobine seuls), résistor R, bobine (L, r) ; i, puis u_R et u_b en convention récepteur (flèches opposées à i). Oscilloscope : voie 1 aux bornes de R (u_R = R·i, image de i), voie 2 aux bornes de la bobine, masse au point commun. Établissement (K en 1) : u_R monte de 0 vers U_R = R·E/(R + r) = 5 V, donc i monte de 0 vers I₀ = E/(R + r) = 100 mA ; régime transitoire puis régime permanent. Rupture (K en 2) : u_R descend de 5 V vers 0, i ne s’annule pas d’un coup et garde son sens. Valeurs : E = 6 V, R = 50 Ω, L = 0,12 H, r = 10 Ω.',
  explications: {
    montage: [
      { repere: 'generateur', texte: 'Le générateur de tension E.' },
      { repere: 'position_1', texte: 'Position 1 : le générateur est dans la maille, le courant s’établit.' },
      { repere: 'position_2', texte: 'Position 2 : R et la bobine seuls, le courant est rompu.' },
      { repere: 'bobine', texte: 'La bobine, avec son inductance L et sa résistance r.' },
      { repere: 'fleche_i', texte: 'On oriente le courant i.' },
      { repere: 'fleche_uR', texte: 'u_R en convention récepteur : la flèche est opposée à i.' },
      { repere: 'fleche_ub', texte: 'Pareil pour u_b.' },
      { repere: 'voie_1', texte: 'La voie 1 aux bornes de R : u_R = R·i, c’est l’image de i.' },
      { repere: 'masse', texte: 'La masse au point commun de R et de la bobine.' },
      { repere: 'voie_2', texte: 'La voie 2 aux bornes de la bobine.' },
    ],
    etablissement: [
      { repere: 'interrupteur', texte: 'K passe en position 1.' },
      { repere: 'courbe', texte: 'u_R monte vite au début, puis de plus en plus lentement : i fait pareil.' },
      { repere: 'regime_transitoire', texte: 'Tant que i varie, c’est le régime transitoire.' },
      { repere: 'regime_permanent', texte: 'Puis i reste égal à I₀ : c’est le régime permanent.' },
    ],
    rupture: [
      { repere: 'ecran', texte: 'Au départ le courant est établi : u_R = 5 V.' },
      { repere: 'interrupteur', texte: 'K passe en position 2 : R et la bobine seuls.' },
      { repere: 'courbe', texte: 'u_R descend de 5 V vers 0 : le courant ne s’annule pas d’un coup.' },
      { repere: 'fleche_i', texte: 'Et il garde son sens.' },
    ],
  },
});
MOT.lancer();
window.Tableau.glisser(MOT.scene.craie.canvas, {
  toucher: (px, py) => { const [x, y] = MOT.scene.local(px, py); return x > C1[0] - 14 && x < PV[0] + 12 && y > 56 && y < 146 ? 'K' : null; },
  bouger: () => {},
  lacher: () => { MOT.setParameters({ K: positionK() === 1 ? 2 : 1 }); },
});
</script>
