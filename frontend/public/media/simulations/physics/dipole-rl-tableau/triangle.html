<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Courant triangulaire dans une bobine — au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="rl.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Un GBF fait passer dans une bobine de résistance négligeable (L = 20 mH) un courant triangulaire : i monte de 0 à 0,2 A en 10 ms puis redescend en 10 ms. Sous le graphe de i(t), la tension u_b(t) est en créneaux : +0,4 V pendant la montée, −0,4 V pendant la descente. Pente 20 A/s, palier 0,4 V : leur rapport vaut 0,02 H = L"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start reset pause resume play_until set_time">Lancer</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="/media/simulations/shared/lexique/lexique-physique.js"></script>
<script src="commun.js"></script>
<script src="exposants.js"></script>
<script>
/*
 * Bobine idéale (r négligeable) alimentée par un GBF : courant triangulaire (cours « Dipôle RL », RL1 : u_b = L·di/dt).
 * i(t) : de 0 à 0,2 A en 10 ms, puis de 0,2 A à 0 en 10 ms (période 20 ms) ; deux périodes tracées (0 à 40 ms).
 * di/dt = +20 A/s à la montée, −20 A/s à la descente ; u_b = L·di/dt = ±L × 20 (L = 20 mH → ±0,4 V).
 * Deux graphes l’un sous l’autre, même axe du temps (verticales en pointillé à 10, 20, 30, 40 ms).
 * Moments : courant (i se trace), pente_montee (triangle de pente coté), palier_haut (u_b = +0,4 V se trace pendant les
 * montées), pente_descente, palier_bas (u_b = −0,4 V pendant les descentes), rapport (« u_b/(di/dt) = L »), fin.
 * Paramètre : L_mH (10 → 40, pas 5 ; palier = L × 20). Poignée : le point sur la petite règle « L » sous la bobine.
 */
/* ── Moteur du déroulé (commun aux pages « appareils » des dossiers dipole-rc-tableau et dipole-rl-tableau, recopié dans chaque page) ──────────────
 * Une page déclare des étapes par vue : { nom, anim (s), ecritDes (s, défaut = anim), motif, bulle() }.
 * Chaque étape : d’abord son animation (aiguille, électrons, courbe qui s’enregistre…), puis la craie écrit ce
 * qu’il faut dire ; le moment `nom` est la fin de cette écriture (l’animation est finie, le texte est écrit).
 * Les durées d’écriture sont mesurées au dessin (calculer), donc les moments suivent les paramètres.
 * Les parties fixes (titres, axes, montage déjà dessiné) s’écrivent à l’horloge de la scène, ECRITURE fois plus vite.
 */
const { fr, bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lisse = p => p * p * (3 - 2 * p);
const fx = (v, d = 2) => fr(v, d).replace(/(,\d*?)0+$/, '$1').replace(/,$/, '');   // 1,50 → 1,5 ; 2,00 → 2
const ECRITURE = 2.5;
function Moteur(o) {
  const q = new URLSearchParams(location.search);
  const S = { vue: o.vues.includes(q.get('vue')) ? q.get('vue') : o.vues[0], t: 0, running: false, pause: false, fait: false,
    jusqua: null, motif: '', emis: 0, dit: '', mesure: false };
  const V = o.vitesse ?? 1.7, T0 = o.T0 ?? .8, HOLD = {};
  let TL = null;
  function construire() {
    let s = T0; const ev = [];
    for (const e of o.etapes(S.vue)) {
      const anim = e.anim || 0, d = { ...e, anim, debut: s, ecrit: s + (e.ecritDes ?? anim) };
      d.fin = Math.max(s + anim, d.ecrit + (HOLD[e.nom] ?? 1.5)) + .35;
      s = d.fin; ev.push(d);
    }
    const mom = {}; for (const e of ev) mom[e.nom] = e.fin; mom.fin = s + (o.queue ?? .6);
    TL = { ev, M: mom };
  }
  const ev = nom => TL.ev.find(e => e.nom === nom);
  const M = {
    S, ev, Moments: () => TL.M,
    /** Avancement (0 → 1) de l’animation de l’étape `nom`. */
    p(nom) { const e = ev(nom); if (!e) return 0; return e.anim > 0 ? clamp((S.t - e.debut) / e.anim, 0, 1) : (S.t >= e.debut - 1e-6 ? 1 : 0); },
    commence(nom) { const e = ev(nom); return !!e && S.t > e.debut + 1e-6; },
    vu(nom) { if (nom === 'fin') return S.t >= TL.M.fin - 1e-6; const e = ev(nom); return !!e && S.t >= e.fin - 1e-6; },
    /** Ce qui s’écrit à l’étape `nom` : la craie écrit à partir de la fin de son animation. */
    etape(c, nom, fn) {
      const e = ev(nom); if (!e) return;
      const t = c.t, cur = c.cur, comp = c.complet, w0 = e.ecrit;
      c.t = S.t > 1e5 ? 1e9 : w0 + (S.t - w0) * V; c.cur = w0;
      try { fn(); } finally { if (S.mesure) HOLD[nom] = (c.cur - w0) / V; c.t = t; c.cur = cur; if (!S.running) c.complet = comp; }
    },
    etat() { return S.running ? 'en cours' : S.fait ? 'fin' : S.pause ? 'arrêt sur image' : 'pas encore lancée'; },
  };
  /* `large` + `ajuster` (15 novembre 2026, « la simulation n'occupe qu'une bande étroite ») : la boîte de l'encre (image
   * de départ et image complète) remplit le tableau. */
  const complet = f => { const t = S.t; try { S.t = 0; f(); S.t = 1e6; f(); } finally { S.t = t; } };
  const scene = window.OndesTableau.Scene($('canvas'), (c) => o.dessiner(c, M), { large: true, ajuster: true, complet, camera: f => { const t = S.t; S.t = 1e6; try { f(); } finally { S.t = t; } } });
  const cadreBase = scene.cadre;
  scene.cadre = function (g) { const k = cadreBase.call(scene, g); if (Number.isFinite(k.t)) k.t *= ECRITURE; return k; };
  M.scene = scene; M.craie = scene.craie;
  function calculer() {
    construire();
    const t = S.t, r = S.running; S.t = 1e6; S.running = false; S.mesure = true;
    try { o.dessiner(scene.craie, M); } finally { S.t = t; S.running = r; S.mesure = false; }
    construire(); scene.sale = true;
  }
  // La bulle est du texte simple : jamais de « _ » visible (u_C → uC, I_0 → I₀).
  const sansSouligne = s => String(s).replace(/([A-Za-zΔτ])_\{?([A-Za-z0-9]+)\}?/g, (m, a, i) => a + (/^\d+$/.test(i) ? [...i].map(d => '₀₁₂₃₄₅₆₇₈₉'[d]).join('') : i));
  const dire = (texte, kind = '') => { texte = sansSouligne(texte); S.dit = texte; bulle($('feedback'), texte, kind); };
  const etiquette = () => { $('run').textContent = S.running ? 'Pause' : S.pause ? 'Reprendre' : S.fait ? 'Rejouer' : 'Lancer'; };
  let pont = null;
  const emettre = () => pont && pont.emettre();
  const noter = (a, d) => pont && pont.noter(a, d);
  scene.avancer = dt => {
    if (!S.running) return !!(o.anime && o.anime());
    const avant = S.t; S.t += dt;
    for (const e of TL.ev) if (avant < e.debut && S.t >= e.debut && e.bulle) dire(e.bulle());
    if (S.jusqua != null && S.t >= S.jusqua) {
      S.t = S.jusqua; S.jusqua = null; S.running = false;
      if (S.t >= TL.M.fin - 1e-6) { finir(); return true; }
      S.pause = true; etiquette(); dire('Arrêt sur image : ' + (S.motif || `t = ${fx(S.t, 1)} s`) + '.');
      noter('pause', { time_s: +S.t.toFixed(2) }); emettre(); return true;
    }
    if (S.t >= TL.M.fin) { S.t = TL.M.fin; finir(); return true; }
    if (performance.now() - S.emis > 500) { S.emis = performance.now(); emettre(); }
    return true;
  };
  function finir() { S.running = false; S.fait = true; S.pause = false; S.jusqua = null; etiquette(); dire(o.messageFin(M), 'good'); noter('measurement', o.params(M)); emettre(); }
  function start() { o.reprise && o.reprise(); S.t = 0; S.jusqua = null; S.motif = ''; S.running = true; S.pause = false; S.fait = false; etiquette(); dire(o.depart(M)); noter('start', o.params(M)); emettre(); }
  function pause() { if (!S.running) return; S.running = false; S.pause = true; S.jusqua = null; etiquette(); dire('Arrêt sur image.'); noter('pause', { time_s: +S.t.toFixed(2) }); emettre(); }
  function resume() { if (S.running) return; o.reprise && o.reprise(); if (!S.pause) return start(); S.running = true; S.pause = false; etiquette(); dire('Ça repart…'); noter('resume'); emettre(); }
  function setTime(p) {
    const t = +p.time_s; if (p.time_s === null || p.time_s === '' || !Number.isFinite(t)) return;
    o.reprise && o.reprise(); S.running = false; S.jusqua = null; S.t = clamp(t, 0, TL.M.fin); S.fait = S.t >= TL.M.fin - 1e-6; S.pause = !S.fait && S.t > 0;
    etiquette(); scene.sale = true; dire(`Arrêt sur image : t = ${fx(S.t, 1)} s.`); noter('set_time', { time_s: S.t }); emettre();
  }
  function playUntil(p) {
    const noms = o.etapes(S.vue).map(e => e.nom).concat('fin');
    const nom = noms.includes(p.moment) ? p.moment : null, cible = nom ? TL.M[nom] : +p.time_s;
    if (!Number.isFinite(cible) || (p.moment && !nom && (p.time_s == null || p.time_s === ''))) { dire(`Moment inconnu : ${p.moment}.`, 'bad'); emettre(); return; }
    o.reprise && o.reprise();
    if (S.fait || S.t >= cible - 1e-3) { S.t = 0; S.fait = false; }
    S.jusqua = clamp(cible, .01, TL.M.fin); S.motif = nom ? (o.motifs[nom] || nom) : ''; S.running = true; S.pause = false; etiquette(); dire('Observe…');
    noter('play_until', { moment: nom, time_s: S.jusqua }); emettre();
  }
  function setParameters(p) {
    p = p || {};
    const r = o.appliquer(p, M) || {};
    if (r.vue && o.vues.includes(r.vue) && r.vue !== S.vue) { S.vue = r.vue; r.change = true; r.vueChange = true; }
    if (r.change) { calculer(); if (r.vueChange) { scene.boite = null; scene.remesurer(); scene.reecrire(); } }
    noter('set_parameters', o.params(M));
    if (r.apres) r.apres();
    else if (r.change && !r.garder) start();
    else { scene.sale = true; emettre(); }
  }
  Object.assign(M, { noter, calculer, dire, start, pause, resume, setTime, playUntil, setParameters, emettre, etiquette });
  $('run').onclick = () => (S.running ? pause() : S.pause ? resume() : start());
  window.Tableau.explication(o.explications);
  const commandes = ['start', 'reset', 'pause', 'resume', 'set_time', 'set_parameters', 'play_until'];
  M.lancer = () => {
    calculer();
    const listeMoments = o.vues.map(v => `${o.vues.length > 1 ? v + ' : ' : ''}${o.etapes(v).map(e => e.nom).concat('fin').join(' | ')}`).join(' ; ');
    const config = { id: o.id, version: '1.0', title: o.titre, variants: o.vues.length > 1 ? o.vues.map(id => ({ id, label: o.titres[id] })) : [], commands: commandes,
      command_schema: { set_parameters: o.schema, set_time: { time_s: '0..fin (arrêt sur cet instant de la scène, en s ; voir moments)' },
        play_until: { moment: listeMoments, time_s: 'ou un instant en s' } } };
    pont = protocole({ id: o.id, commandes, config, texte: o.texte,
      etat: () => ({ simulation_status: S.running ? 'running' : S.fait ? 'finished' : S.pause ? 'paused' : 'idle',
        ce_qui_se_voit: o.voir(M) + (S.dit ? ` La bulle dit : « ${S.dit} »` : ''), current_variant: S.vue, time_s: +S.t.toFixed(2),
        parameters: o.params(M), moments: Object.fromEntries(Object.entries(TL.M).map(([k, v]) => [k, +v.toFixed(2)])) }),
      progression: () => (S.fait ? 1 : 0),
      executer: (cmd, p) => ({ start, reset: start, pause, resume, set_time: () => setTime(p), set_parameters: () => setParameters(p), play_until: () => playUntil(p) })[cmd]?.() });
    dire(o.depart(M));
    setTimeout(() => { if (!S.running && S.t === 0 && !S.pause && !S.fait) start(); }, 900);
  };
  return M;
}

/* ── Appareils peints (règle 7 : ils ressemblent aux vrais ; le peint ne change jamais la physique) ── */
const Peint = {
  sphere(...a) { return window.Lexique.physique.sphere(...a); },
  generateur(...a) { return window.Lexique.physique.generateur(...a); },
  borne(...a) { return window.Lexique.physique.borne(...a); },
  cadran(...a) { return window.Lexique.physique.cadran(...a); },
  resistor(...a) { return window.Lexique.physique.resistor(...a); },
  levier(...a) { return window.Lexique.physique.levier(...a); },
  plot(...a) { return window.Lexique.physique.plot(...a); },
};
/* ── Appareils du dipôle RL (peints : bobine, noyau de fer, lampe, oscilloscope, ohmmètre, GBF) ── */
Object.assign(Peint, {
  bobine(...a) { return window.Lexique.physique.bobine(...a); },
  noyau(...a) { return window.Lexique.physique.noyau(...a); },
  lampe(...a) { return window.Lexique.physique.lampe(...a); },
  oscillo(...a) { return window.Lexique.physique.oscillo(...a); },
  ohmmetre(...a) { return window.Lexique.physique.ohmmetre(...a); },
  cordon(...a) { return window.Lexique.physique.cordon(...a); },
  gbf(...a) { return window.Lexique.physique.gbf(...a); },
});
/** Symbole de la bobine à la craie, couché entre (x1, y) et (x2, y) : fils, puis créneaux arrondis (boucles). */
function symboleBobine(c, x1, y, x2, o = {}) {
  const n = o.n ?? 4, larg = o.largeur ?? 80, xa = (x1 + x2) / 2 - larg / 2, xb = xa + larg, h = o.h ?? 16, coul = o.couleur ?? 'blanc';
  c.ligne(x1, y, xa, y, { largeur: 2, couleur: o.fil ?? 'blanc' });
  c.courbe(u => { const k = u * n, f = k - Math.floor(k), xx = xa + u * larg; return [xx, y - Math.sin(Math.min(1, f) * Math.PI) * h]; }, n * 14, { net: false, couleur: coul, largeur: 2.4 });
  c.ligne(xb, y, x2, y, { largeur: 2, couleur: o.fil ?? 'blanc' });
  return [xa, xb];
}
/** Le même symbole, debout entre (x, y1) en haut et (x, y2) en bas (boucles vers la droite). */
function symboleBobineV(c, x, y1, y2, o = {}) {
  const n = o.n ?? 4, haut = o.hauteur ?? 76, ya = (y1 + y2) / 2 - haut / 2, yb = ya + haut, h = o.h ?? 15, coul = o.couleur ?? 'blanc';
  c.ligne(x, y1, x, ya, { largeur: 2 });
  c.courbe(u => { const k = u * n, f = k - Math.floor(k); return [x + Math.sin(Math.min(1, f) * Math.PI) * h, ya + u * haut]; }, n * 14, { net: false, couleur: coul, largeur: 2.4 });
  c.ligne(x, yb, x, y2, { largeur: 2 });
  return [ya, yb];
}

const q0 = new URLSearchParams(location.search);
const S2 = { L: 20 };
{ const l = +q0.get('L_mH'); if (l >= 10 && l <= 40) S2.L = Math.round(l / 5) * 5; }
const IMAX = 0.2, DEMI = 10, PENTE = IMAX / (DEMI / 1000);   // 0,2 A en 10 ms → 20 A/s
const palier = () => S2.L / 1000 * PENTE;                      // V
const ETAPES = [
  { nom: 'courant', anim: 3.0, motif: 'i(t) : dents de scie, de 0 à 0,2 A en 10 ms puis retour', bulle: () => 'Le GBF impose le courant i…' },
  { nom: 'pente_montee', anim: 0, motif: 'la pente de la montée : 20 A/s', bulle: () => 'Quelle est la pente de la montée ?' },
  { nom: 'palier_haut', anim: 1.2, motif: 'pendant la montée, u_b reste constante', bulle: () => 'Et u_b pendant la montée ?' },
  { nom: 'pente_descente', anim: 0, motif: 'la pente de la descente : −20 A/s', bulle: () => 'Et à la descente ?' },
  { nom: 'palier_bas', anim: 1.2, motif: 'pendant la descente, u_b reste constante et négative', bulle: () => 'u_b pendant la descente…' },
  { nom: 'rapport', anim: 0, motif: 'u_b/(di/dt) = L', bulle: () => 'Divisons le palier par la pente…' },
];
const MOTIFS = { fin: 'fin' }; for (const e of ETAPES) MOTIFS[e.nom] = e.motif;

/* ── Géométrie (cadre 760 × 420) ─────────────────────────────────────── */
const Y0I = 180, KI = 520, Y0U = 314, KU = 78, TMAX = 40;
/* Tableau large (scene.L ≥ 1000, 15 novembre 2026 : « la simulation n'occupe qu'une bande étroite ») : les deux graphes
 * s'étirent sur toute la largeur libre à droite du montage ; sinon l'échelle d'origine (cadre 760 × 420). */
let X0 = 300, KX = 11;
function disposer(L) { if (L < 1000) { X0 = 300; KX = 11; } else { X0 = 320; KX = (L - 14 - 12 - X0) / TMAX; } }
const XR = () => X0 + TMAX * KX + 12;   // bout droit des axes des temps (752 dans le cadre d'origine)
const X = t => X0 + t * KX, YI = i => Y0I - i * KI, YU = u => Y0U - u * KU;
const GBF = { x: 20, y: 52, w: 110, h: 70 }, BOB = { x: 34, y: 150, w: 120, h: 30 }, XS = 226;
const REG = { x0: 40, x1: 220, y: 268 };
let MO = null;
/** i(t) en A (t en ms). */
const iDe = t => { const f = ((t % 20) + 20) % 20; return f <= DEMI ? IMAX * f / DEMI : IMAX * (20 - f) / DEMI; };
const monte = t => (((t % 20) + 20) % 20) < DEMI;
const fA = v => fx(v, 2);

/* ── Dessin ──────────────────────────────────────────────────────────── */
function montage(c) {
  c.direct(() => {
    const ctx = c.ctx;
    Peint.gbf(ctx, GBF.x, GBF.y, GBF.w, GBF.h);
    Peint.borne(ctx, GBF.x + GBF.w, GBF.y + 20, true); Peint.borne(ctx, GBF.x + GBF.w, GBF.y + 50, false);
    Peint.bobine(ctx, BOB.x, BOB.y, BOB.w, BOB.h);
  });
  c.texte('GBF', GBF.x + GBF.w / 2, GBF.y + GBF.h + 18, { taille: 15, align: 'center' });
  c.trait([[GBF.x + GBF.w + 5, GBF.y + 20], [XS, GBF.y + 20], [XS, 90]], { largeur: 2 });
  symboleBobineV(c, XS, 90, 200, { hauteur: 64, h: 13 });
  c.trait([[XS, 200], [170, 200], [170, GBF.y + 50], [GBF.x + GBF.w + 5, GBF.y + 50]], { largeur: 2 });
  c.texte(`L = ${S2.L} mH`, 30, 228, { taille: 16 });
  c.texte('r ≈ 0', 140, 228, { taille: 16 });
  // Petite règle de la poignée L.
  c.ligne(REG.x0, REG.y, REG.x1, REG.y, { couleur: 'faible', largeur: 1.6 });
  c.texte('10', REG.x0, REG.y + 18, { couleur: 'faible', taille: 12, align: 'center' });
  c.texte('40 mH', REG.x1, REG.y + 18, { couleur: 'faible', taille: 12, align: 'center' });
  c.direct(() => { const px = REG.x0 + (S2.L - 10) / 30 * (REG.x1 - REG.x0); c.point(px, REG.y, 6.5, 'cyan'); c.texte('L', px, REG.y - 10, { couleur: 'cyan', taille: 14, align: 'center' }); });
}
function axes(c) {
  // Graphe de i.
  c.axe(X0, Y0I, X0 + TMAX * KX + 12, Y0I, [10, 20, 30, 40].map(t => [t / (TMAX + 12 / KX), null]));
  c.axe(X0, Y0I, X0, YI(.25) - 12, [[.1 / (.25 + 12 / KI), '0,1'], [.2 / (.25 + 12 / KI), '0,2']], { vertical: true, taille: 13 });
  c.texte('i (A)', X0 + 8, YI(.25) - 4, { taille: 15 });
  // Graphe de u_b.
  c.axe(X0, Y0U, X0 + TMAX * KX + 12, Y0U, [10, 20, 30, 40].map(t => [t / (TMAX + 12 / KX), null]));
  c.fleche(X0, YU(-1) + 4, X0, YU(1) - 10, { couleur: 'faible', largeur: 1.6 });
  for (const u of [-.8, -.4, .4, .8]) { c.ligne(X0 - 5, YU(u), X0 + 5, YU(u), { couleur: 'faible', largeur: 1.4, duree: .04 }); c.texte(fx(u, 1).replace('-', '−'), X0 - 10, YU(u) + 5, { couleur: 'faible', taille: 13, align: 'right', duree: .1 }); }
  c.texte('u_b (V)', X0 + 8, YU(1) - 2, { taille: 15 });
  c.texte('0', X0 - 10, Y0U + 5, { couleur: 'faible', taille: 13, align: 'right' });
  // Le même axe du temps : verticales communes, graduations en bas.
  for (const t of [10, 20, 30, 40]) c.ligne(X(t), YI(.22), X(t), YU(-1), { couleur: 'tresfaible', largeur: 1, pointille: [3, 6], duree: .1 });
  for (const t of [0, 10, 20, 30, 40]) c.texte(String(t), X(t), 410, { couleur: 'faible', taille: 13, align: 'center' });
  c.texte('t (ms)', XR(), Y0U - 8, { couleur: 'blanc', taille: 14, align: 'right' });
}
function dessiner(c, M) {
  MO = M; M.scene.cadre(53); disposer(M.scene.L);
  c.texte('Un courant triangulaire dans une bobine', 14, 28, { couleur: 'cyan', taille: 20 });
  montage(c); axes(c);
  const P = palier();
  c.direct(() => {
    // i(t) se trace (orange).
    const ti = TMAX * M.p('courant');
    if (ti > 0) c.courbe(u => { const t = u * ti; return [X(t), YI(iDe(t))]; }, Math.max(8, Math.round(ti * 4)), { couleur: 'orange', largeur: 2.6, tremble: .2 });
    // u_b(t) : paliers des montées (palier_haut), puis des descentes avec les sauts (palier_bas).
    const th = TMAX * M.p('palier_haut'), tb = TMAX * M.p('palier_bas');
    for (const d of [0, 20]) { const f = Math.min(th, d + DEMI); if (f > d) c.ligne(X(d), YU(P), X(f), YU(P), { couleur: 'rose', largeur: 2.6, tremble: .3 }); }
    for (const d of [10, 30]) {
      const f = Math.min(tb, d + DEMI); if (tb <= d) continue;
      c.ligne(X(d), YU(P), X(d), YU(-P), { couleur: 'rose', largeur: 1.4, pointille: [4, 4] });
      if (f > d) c.ligne(X(d), YU(-P), X(f), YU(-P), { couleur: 'rose', largeur: 2.6, tremble: .3 });
      if (d === 10 && tb >= 20) c.ligne(X(20), YU(-P), X(20), YU(P), { couleur: 'rose', largeur: 1.4, pointille: [4, 4] });
    }
    if (ti > 0) c.texte(`i = ${fA(iDe(ti))} A`, XR(), YI(.25) - 4, { couleur: 'orange', taille: 15, align: 'right' });
  });
  const L = 14, col = 250;
  M.etape(c, 'pente_montee', () => {
    c.ligne(X(DEMI), Y0I, X(DEMI), YI(IMAX), { couleur: 'blanc', largeur: 1.4, pointille: [5, 4] });
    c.cote(X(0), Y0I + 12, X(DEMI), Y0I + 12, 'Δt = 10 ms', { couleur: 'blanc', largeur: 1.2, dessous: true, taille: 13 });
    c.texte('Δi = 0,2 A', X(DEMI) - 9, YI(.06), { couleur: 'blanc', taille: 13, align: 'right' });
    c.texte('montée : ⟦di|dt⟧ = ⟦0,2|0,01⟧ = 20 A/s', L, 300, { couleur: 'orange', taille: 15, max: col });
  });
  M.etape(c, 'palier_haut', () => {
    c.texte(`+${fx(P, 2)} V`, X(5), YU(P) - 8, { couleur: 'rose', taille: 14, align: 'center' });
    c.texte(`montée : u_b = ${fx(P, 2)} V (constante)`, L, 324, { couleur: 'rose', taille: 15, max: col });
  });
  M.etape(c, 'pente_descente', () => {
    c.cote(X(DEMI), Y0I + 12, X(20), Y0I + 12, 'Δt = 10 ms', { couleur: 'blanc', largeur: 1.2, dessous: true, taille: 13 });
    c.texte('Δi = −0,2 A', X(DEMI) + 9, YI(.06), { couleur: 'blanc', taille: 13 });
    c.texte('descente : ⟦di|dt⟧ = −20 A/s', L, 348, { couleur: 'orange', taille: 15, max: col });
  });
  M.etape(c, 'palier_bas', () => {
    c.texte(`−${fx(P, 2)} V`, X(15), YU(-P) + 20, { couleur: 'rose', taille: 14, align: 'center' });
    c.texte(`descente : u_b = −${fx(P, 2)} V`, L, 372, { couleur: 'rose', taille: 15, max: col });
  });
  M.etape(c, 'rapport', () => {
    // sur deux étages comme dans le cahier ; di/dt reste en ligne dans le dénominateur (pas de fraction dans une fraction)
    const s = `⟦u_b|di/dt⟧ = ⟦${fx(P, 2)}|20⟧ = ${fx(S2.L / 1000, 3)} H = L`;
    c.texte(s, L, 402, { couleur: 'blanc', taille: 16, max: col - 4 });
    c.rect(L - 6, 380, col + 8, 34, { couleur: 'jaune', largeur: 1.8 });
  });
  reperes(c);
  return c.fin();
}
function reperes(c) {
  const P = palier();
  c.repere('gbf', GBF.x - 4, GBF.y - 4, GBF.w + 16, GBF.h + 28, 'le GBF : il impose un courant triangulaire');
  c.repere('bobine', BOB.x - 6, 84, XS + 24 - BOB.x, 156, `la bobine : L = ${S2.L} mH, r négligeable (poignée : la règle L)`);
  c.repere('graphe_i', X0 - 30, YI(.25) - 20, TMAX * KX + 50, Y0I - YI(.25) + 24, 'le graphe de i(t) : dents de scie');
  c.repere('graphe_u', X0 - 40, YU(1) - 18, TMAX * KX + 60, YU(-1) - YU(1) + 24, 'le graphe de u_b(t) : créneaux');
  c.repere('pente', X(0), YI(IMAX) - 4, X(DEMI) - X(0) + 4, Y0I - YI(IMAX) + 40, 'la pente de la montée : di/dt = 0,2/0,01 = 20 A/s');
  c.repere('palier', X(0), YU(P) - 26, X(DEMI) - X(0), 34, `le palier : u_b = ${fx(P, 2)} V pendant la montée`);
  c.repere('rapport', 8, 380, 262, 34, `le rapport : u_b/(di/dt) = ${fx(S2.L / 1000, 3)} H = L`);
}

/* ── Ce que voit le tuteur ─────────────────────────────────────────────── */
function voir(M) {
  const P = palier(), ti = TMAX * M.p('courant');
  const m = [`Courant triangulaire, ${M.etat()}. À gauche : un GBF (boîtier) relié à une bobine de résistance négligeable (bobine peinte et son symbole à la craie), « L = ${S2.L} mH », « r ≈ 0 », une petite règle L (10 à 40 mH) avec un point cyan (poignée). À droite, deux graphes l’un sous l’autre, même axe du temps (0 à 40 ms) : i (A, 0 à 0,25) en haut, u_b (V, −1 à 1) en bas.`];
  if (ti > 0) m.push(`Courbe orange i(t) tracée jusqu’à t = ${fx(ti, 1)} ms (i = ${fA(iDe(ti))} A, ${monte(ti) ? 'en montée' : 'en descente'}) : de 0 à 0,2 A en 10 ms, puis retour à 0 en 10 ms ; période 20 ms.`);
  if (M.commence('palier_haut')) m.push(`u_b(t) (rose) : +${fx(P, 2)} V pendant les montées (0–10 ms, 20–30 ms)${M.commence('palier_bas') ? `, −${fx(P, 2)} V pendant les descentes (10–20 ms, 30–40 ms) : des créneaux` : ''}.`);
  const e = [];
  if (M.vu('pente_montee')) e.push('triangle de pente sur la première montée : « Δt = 10 ms », « Δi = 0,2 A », « montée : di/dt = 0,2/0,01 = 20 A/s »');
  if (M.vu('palier_haut')) e.push(`« +${fx(P, 2)} V », « montée : u_b = ${fx(P, 2)} V (constante) »`);
  if (M.vu('pente_descente')) e.push('« Δt = 10 ms », « Δi = −0,2 A », « descente : di/dt = −20 A/s »');
  if (M.vu('palier_bas')) e.push(`« −${fx(P, 2)} V », « descente : u_b = −${fx(P, 2)} V »`);
  if (M.vu('rapport')) e.push(`encadré en jaune : « u_b/(di/dt) = ${fx(P, 2)}/20 = ${fx(S2.L / 1000, 3)} H = L »`);
  if (e.length) m.push(`Écrit à la craie : ${e.join(' ; ')}.`);
  return m.join(' ');
}
const params = M => ({ L_mH: S2.L, pente_A_par_s: PENTE, palier_V: +palier().toFixed(3), rapport_H: +(palier() / PENTE).toFixed(4), t_trace_ms: +(TMAX * M.p('courant')).toFixed(2) });
const MOT = Moteur({
  id: 'dipole_rl_triangle', titre: 'Courant triangulaire dans une bobine : u_b = L·di/dt', vues: ['triangle'], titres: { triangle: 'courant triangulaire' },
  etapes: () => ETAPES, motifs: MOTIFS, dessiner, voir, params,
  depart: () => `Une bobine de résistance négligeable (L = ${S2.L} mH) parcourue par un courant triangulaire.`,
  messageFin: () => `Pente 20 A/s, palier ${fx(palier(), 2)} V : u_b = L·di/dt, donc L = ${fx(palier(), 2)}/20 = ${fx(S2.L / 1000, 3)} H.`,
  appliquer: p => {
    const v = p.L_mH ?? p.L;
    if (v == null || v === '') return {};
    let l = +String(v).replace(',', '.'); if (!Number.isFinite(l)) return {};
    if (l < 1) l *= 1000;                                       // accepte aussi L en henry (0,02)
    l = clamp(Math.round(l / 5) * 5, 10, 40);
    if (l === S2.L) return {};
    S2.L = l; return { change: true };
  },
  schema: { L_mH: '10..40 (mH, pas 5 ; palier u_b = L × 20 ; relance)' },
  texte: 'Un GBF impose dans une bobine de résistance négligeable (L = 20 mH) un courant triangulaire : i monte de 0 à 0,2 A en 10 ms (pente 20 A/s), puis redescend en 10 ms (pente −20 A/s) ; période 20 ms. Sous le graphe de i, u_b(t) est en créneaux : +0,4 V pendant la montée, −0,4 V pendant la descente. Comme u_b = L·di/dt (r négligeable), le rapport palier/pente donne L : 0,4/20 = 0,02 H.',
  explications: {
    triangle: [
      { repere: 'gbf', texte: 'Le GBF impose dans la bobine un courant triangulaire.' },
      { repere: 'graphe_i', texte: 'i monte de 0 à 0,2 A en 10 ms, puis redescend.' },
      { repere: 'pente', texte: 'La pente de la montée : di/dt = 20 A/s.' },
      { repere: 'palier', texte: 'Pendant la montée, u_b reste constante : 0,4 V.' },
      { repere: 'graphe_u', texte: 'À la descente, la pente change de signe : u_b aussi. Des créneaux.' },
      { repere: 'rapport', texte: 'Palier divisé par la pente : 0,4/20 = 0,02 H, c’est L.' },
    ],
  },
});
MOT.lancer();
window.Tableau.glisser(MOT.scene.craie.canvas, {
  toucher: (px, py) => { const [x, y] = MOT.scene.local(px, py); return x > REG.x0 - 12 && x < REG.x1 + 12 && y > REG.y - 16 && y < REG.y + 12 ? 'L' : null; },
  bouger: (id, px) => { const [x] = MOT.scene.local(px, 0); const l = clamp(Math.round((10 + (x - REG.x0) / (REG.x1 - REG.x0) * 30) / 5) * 5, 10, 40); if (l !== S2.L) { S2.L = l; MOT.scene.sale = true; } },
  lacher: () => { MOT.calculer(); MOT.noter('set_parameters', { L_mH: S2.L }); MOT.start(); },
});
