<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ondes mécaniques — au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="lab.css"></head>
<body>
<div class="tableau">
  <header class="titre">
    <div><small>Physique · 2 BAC · ondes mécaniques progressives</small><h1 id="title"></h1><p class="objectif" id="objective"></p></div>
    <nav class="onglets" id="onglets" aria-label="Expériences"></nav>
  </header>
  <section class="scene">
    <canvas id="canvas" role="img" aria-label="Schéma de propagation d’une perturbation, dessiné à la craie"></canvas>
    <div class="panneau haut-droite" id="answers"><h3 id="question"></h3><div id="response"></div><div class="rangee"><button class="craie-btn attention" id="check" data-professor-control="check record_measurement">Vérifier</button></div><p id="history" class="legende"></p></div>
    <div class="panneau bas-gauche" id="settings" data-professor-control="set_parameters" hidden><div id="controls"></div></div>
  </section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start fire_pulse run_until pause">Lancer</button>
    <button class="craie-btn secondaire" id="step" data-professor-control="step set_time">+ 0,1 s</button>
    <button class="craie-btn secondaire" id="reset" data-professor-control="reset">Recommencer</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
    <button class="craie-btn secondaire" id="hint" data-professor-control="reveal_hint">Un indice</button>
    <output class="lecture" id="clock">t = <b>0,00</b> s</output>
    <span class="lecture" id="progress"></span>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script type="module" src="lab.js"></script>
<script src="/media/simulations/professor-locate.js" defer></script>
</body></html>
