<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>u_C, q, u_R et i pendant la charge — au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="rc.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Petits graphes tracés à la craie rouge pendant la charge d’un condensateur, même axe des temps : u_C et q montent, u_R et i descendent, chacun avec son expression"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start reset pause resume play_until set_time">Lancer</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="commun.js"></script>
<script src="exposants.js"></script>
<script>
/*
 * u_C, q, u_R et i pendant la charge (cours « Dipôle RC », 2e Bac PC BIOF, 12 novembre 2026).
 * E = 12 V, R = 1 kΩ, C = 220 µF : τ = R·C = 0,22 s ; Q_m = C·E = 2,64 mC ; I₀ = E/R = 12 mA ; 0,37 × 12 mA = 4,44 mA.
 * Même axe des temps pour tous les graphes (graduations rondes de 0,1 s, de 0 à 1,4 s par défaut ; elles ne tombent pas sur τ).
 * Vues (?vue= ou set_parameters {vue}) :
 *  - quatre (défaut) : uC, q, uR, i, fin (quatre petits graphes).
 *  - q_i : q, i, fin.
 *  - uC_uR : uC, uR, somme (à un instant marqué : u_C + u_R = E), fin.
 *  - descente : i, tangente_descente (tangente à l’origine → τ sur l’axe des temps), ligne_37 (0,37 × I₀ → τ), fin.
 * Chaque moment = fin de l’écriture de sa phase (play_until s’y fige). Rouge = charge ; jaune = surlignage seulement.
 */
const { fr, bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const fx = (v, d = 2) => fr(v, d).replace(/(,\d*?)0+$/, '$1').replace(/,$/, '');
const sig = (v, n = 3) => fx(Number(v.toPrecision(n)), 6);
const VUES = {
  quatre: ['uC', 'q', 'uR', 'i', 'fin'],
  q_i: ['q', 'i', 'fin'],
  uC_uR: ['uC', 'uR', 'somme', 'fin'],
  descente: ['i', 'tangente_descente', 'ligne_37', 'fin'],
};
const TITRES = { quatre: 'les quatre grandeurs', q_i: 'q(t) et i(t)', uC_uR: 'u_C(t) et u_R(t)', descente: 'i(t) : lire τ' };
const q = new URLSearchParams(location.search);
const S = { vue: VUES[q.get('vue')] ? q.get('vue') : 'quatre', R: 1000, C: 220, E: 12, t: 0, running: false, pause: false, fait: false, jusqua: null, motif: '', emis: 0, dit: '' };
let M = {}, MM = {};
const VITESSE = 2;

/* ── Physique ──────────────────────────────────────────────────────────── */
const tau = () => S.R * S.C * 1e-6;
const I0 = () => S.E / S.R;                                   // A
const Qm = () => S.C * 1e-6 * S.E;                            // C
const ex = t => Math.exp(-t / tau());
const fR = R => (R >= 1000 ? `${fx(R / 1000, 2)} kΩ` : `${fx(R, 0)} Ω`);
const fC = C => `${fx(C, 1)} µF`;
function echelleT(span) {
  const k = span < 0.1 ? 1000 : 1, u = k === 1 ? 's' : 'ms', v = span * k;
  const p10 = 10 ** Math.floor(Math.log10(v / 15)); let pas = 10 * p10;
  for (const m of [1, 2, 5, 10]) if (v / (m * p10) <= 15 + 1e-9) { pas = m * p10; break; }
  return { k, u, pas: pas / k, max: Math.ceil(v / pas - 1e-9) * pas / k, lab: 2 * pas / k };
}
const ET = () => echelleT(6.3 * tau());
const fT = t => `${sig(t * ET().k, 3)} ${ET().u}`;
/** Échelle d’un axe des ordonnées : de 0 à ≈ 1,15 × la valeur maximale, graduations rondes. */
function echelleY(v) {
  const p10 = 10 ** Math.floor(Math.log10(v)); let lab = p10;
  for (const m of [.1, .2, .5, 1, 2, 5, 10]) if (Math.ceil(1.15 * v / (m * p10) - 1e-9) <= 7) { lab = m * p10; break; }
  return { lab, pas: lab / 2, max: Math.ceil(1.15 * v / lab - 1e-9) * lab };
}
/** Les quatre grandeurs : valeur affichée (dans l’unité de l’axe), noms, expressions. */
const GR = {
  uC: { nom: 'u_C', unite: 'V', k: 1, haut: () => S.E, f: t => S.E * (1 - ex(t)), monte: true, expr: 'u_C(t) = E(1 − e^{−t/τ})', exprTxt: 'u_C(t) = E(1 − e^(−t/τ))',
    note: () => `u_C → E = ${fx(S.E, 1)} V` },
  q: { nom: 'q', monte: true, expr: 'q(t) = C·E(1 − e^{−t/τ})', exprTxt: 'q(t) = C·E(1 − e^(−t/τ))',
    get unite() { return Qm() >= 1e-3 ? 'mC' : 'µC'; }, get k() { return Qm() >= 1e-3 ? 1e3 : 1e6; },
    haut: () => Qm(), f: t => Qm() * (1 - ex(t)), note: () => `Q_m = C·E = ${sig(Qm() * GR.q.k, 3)} ${GR.q.unite}` },
  uR: { nom: 'u_R', unite: 'V', k: 1, haut: () => S.E, f: t => S.E * ex(t), monte: false, expr: 'u_R(t) = E·e^{−t/τ}', exprTxt: 'u_R(t) = E·e^(−t/τ)',
    note: () => `u_R(0) = E = ${fx(S.E, 1)} V` },
  i: { nom: 'i', unite: 'mA', k: 1e3, haut: () => I0(), f: t => I0() * ex(t), monte: false, expr: 'i(t) = (E/R)·e^{−t/τ}', exprTxt: 'i(t) = (E/R)·e^(−t/τ)',
    note: () => `i(0) = E/R = ${sig(I0() * 1e3, 3)} mA` },
};
const val = (g, v) => `${sig(v * GR[g].k, 3)} ${GR[g].unite}`;

/* ── Géométrie (cadre 760 × 420) : les panneaux de chaque vue ──────────── */
const PANNEAUX = {
  quatre: { uC: { x: 8, y: 40, w: 368, h: 182 }, q: { x: 384, y: 40, w: 368, h: 182 }, uR: { x: 8, y: 230, w: 368, h: 182 }, i: { x: 384, y: 230, w: 368, h: 182 } },
  q_i: { q: { x: 8, y: 40, w: 368, h: 372 }, i: { x: 384, y: 40, w: 368, h: 372 } },
  uC_uR: { uC: { x: 8, y: 40, w: 500, h: 372 }, uR: { x: 8, y: 40, w: 500, h: 372 } },
  descente: { i: { x: 8, y: 40, w: 500, h: 372 } },
};
const RL = { x: 516, y: 40, w: 236, h: 372 }, LX = RL.x + 8, LW = RL.w - 16;
/** Repère d’un graphe dans un panneau : origine, longueurs des axes, conversions. */
function graphe(nom) {
  const P = PANNEAUX[S.vue][nom] || PANNEAUX.quatre[nom], g = GR[nom], ey = echelleY(g.haut() * g.k);
  const bas = P.h < 250 ? 30 : 44, O = { x: P.x + 54, y: P.y + P.h - bas }, AXL = P.w - 54 - 62, AYL = P.h - bas - 60;
  return { P, O, AXL, AYL, ey, g, PX: t => O.x + t * AXL / ET().max, PY: v => O.y - v * g.k * AYL / ey.max };
}
const marque = (c, nom) => { MM[nom] = c.cur; };
const lire = (c, y, s, o = {}) => c.texte(s, LX, y, { couleur: 'blanc', taille: 16, max: LW, ...o });

function axes(c, G, ylab, cadre = true) {
  const et = ET(), { O, AXL, AYL, ey, P } = G, L = AXL + 14, petit = P.h < 250;
  if (cadre) c.rect(P.x, P.y, P.w, P.h, { couleur: 'tresfaible', arrondi: 10, duree: .3 });
  const tg = []; for (let i = 1; i * et.pas <= et.max + 1e-9; i++) { const v = i * et.pas; tg.push([(G.PX(v) - O.x) / L, i % 2 === 0 ? fx(v * et.k, 3) : null]); }
  c.axe(O.x, O.y, O.x + L, O.y, tg, { taille: petit ? 11 : 13 });
  const yg = []; for (let i = 1; i * ey.pas <= ey.max + 1e-9; i++) { const v = i * ey.pas; yg.push([(v * AYL / ey.max) / (AYL + 14), i % 2 === 0 ? fx(v, 3) : null]); }
  c.axe(O.x, O.y, O.x, O.y - AYL - 14, yg, { taille: petit ? 11 : 13, vertical: true });
  c.texte('0', O.x - 8, O.y + 16, { couleur: 'faible', taille: 12, align: 'right', duree: .05 });
  c.texte(ylab, O.x + 8, O.y - AYL - 12, { couleur: 'blanc', taille: petit ? 14 : 16, duree: .3 });
  c.texte(`t (${et.u})`, O.x + L + 6, O.y + 5, { couleur: 'blanc', taille: petit ? 13 : 15, duree: .2 });
}
/** Un graphe complet : cadre, axes, courbe rouge, expression en tête, note dans la place libre. */
function tracer(c, nom, o = {}) {
  const G = graphe(nom), g = G.g, { P, O, AXL, AYL } = G, petit = P.h < 250;
  if (!o.sansAxes) axes(c, G, `${g.nom} (${g.unite})`);
  c.courbe(u => { const t = u * ET().max; return [G.PX(t), G.PY(g.f(t))]; }, 80, { couleur: 'rouge', largeur: 2.5, duree: 1.3, ...(o.trait || {}) });
  if (g.monte) c.ligne(O.x, G.PY(g.haut()), O.x + AXL, G.PY(g.haut()), { couleur: 'faible', largeur: 1.2, pointille: [6, 6], duree: .3 });
  if (!o.sansExpr) {
    c.texte(g.expr, P.x + 10, P.y + 22, { couleur: 'rouge', taille: petit ? 16 : 18, max: P.w - 20 });
    const nx = O.x + AXL, ny = g.monte ? O.y - AYL * .22 : O.y - AYL * .78;
    c.texte(g.note(), nx, ny, { couleur: 'cyan', taille: petit ? 14 : 16, align: 'right', max: AXL - 70 });
  }
  return G;
}

function dessiner(c) {
  scene.cadre(31); MM = {};
  if (S.vue === 'quatre') {
    for (const n of ['uC', 'q', 'uR', 'i']) { tracer(c, n); marque(c, n); c.pause(.4); }
  } else if (S.vue === 'q_i') {
    for (const n of ['q', 'i']) { tracer(c, n); marque(c, n); c.pause(.4); }
  } else if (S.vue === 'uC_uR') vueUCUR(c);
  else vueDescente(c);
  c.pause(.6); marque(c, 'fin');
  declarerReperes(c);
  const fini = c.fin();
  M = MM;
  return fini || !S.running;
}
const t1 = () => 3 * ET().pas;                     // instant marqué (vue uC_uR) : 0,3 s par défaut
function vueUCUR(c) {
  const E = S.E;
  c.texte('Lecture', RL.x + 6, 30, { couleur: 'cyan', taille: 17, duree: .3 });
  c.rect(RL.x, RL.y, RL.w, RL.h, { couleur: 'tresfaible', arrondi: 10, duree: .3 });
  lire(c, 64, `E = ${fx(E, 1)} V ; R = ${fR(S.R)} ; C = ${fC(S.C)}`, { couleur: 'faible', taille: 14, duree: .8 });
  const G = graphe('uC');
  c.texte('Charge : u_C(t) et u_R(t)', G.P.x + 6, 30, { couleur: 'cyan', taille: 17, duree: .8 });
  axes(c, G, 'u (V)');
  c.courbe(u => { const t = u * ET().max; return [G.PX(t), G.PY(GR.uC.f(t))]; }, 80, { couleur: 'rouge', largeur: 2.6, duree: 1.3 });
  c.texte('u_C', G.PX(ET().max) - 6, G.PY(E) - 10, { couleur: 'rouge', taille: 18, align: 'right' });
  lire(c, 100, GR.uC.expr, { couleur: 'rouge', taille: 18 });
  lire(c, 124, 'u_C monte de 0 vers E', { couleur: 'faible', taille: 14 });
  marque(c, 'uC');
  c.pause(.4);
  c.courbe(u => { const t = u * ET().max; return [G.PX(t), G.PY(GR.uR.f(t))]; }, 80, { couleur: 'rouge', largeur: 2.4, pointille: [10, 6], duree: 1.3 });
  c.texte('u_R', G.PX(ET().max) - 6, G.PY(0) - 12, { couleur: 'rouge', taille: 18, align: 'right' });
  lire(c, 162, GR.uR.expr, { couleur: 'rouge', taille: 18 });
  lire(c, 186, 'u_R descend de E vers 0', { couleur: 'faible', taille: 14 });
  lire(c, 208, '(trait en pointillé)', { couleur: 'faible', taille: 13 });
  marque(c, 'uR');
  c.pause(.4);
  const ta = t1(), a = GR.uC.f(ta), b = GR.uR.f(ta), x = G.PX(ta);
  c.cote(x - 10, G.PY(0), x - 10, G.PY(a), '', { couleur: 'cyan', largeur: 1.8 });
  c.texte('u_C', x + 18, G.PY(a / 2) + 5, { couleur: 'cyan', taille: 17 });
  c.cote(x + 10, G.PY(a), x + 10, G.PY(E), '', { couleur: 'cyan', largeur: 1.8 });
  c.texte('u_R', x - 18, G.PY(a + b / 2) + 5, { couleur: 'cyan', taille: 17, align: 'right' });
  c.ligne(x, G.O.y, x, G.PY(E) - 6, { couleur: 'faible', largeur: 1.2, pointille: [3, 5] });
  c.cercle(x, G.PY(b), 5, { couleur: 'cyan', largeur: 1.8 });
  c.texte(`t = ${fT(ta)}`, x, G.O.y + 38, { couleur: 'cyan', taille: 15, align: 'center' });
  lire(c, 240, `à t = ${fT(ta)} : u_C = ${fx(a, 2)} V`, { couleur: 'cyan', taille: 15 });
  lire(c, 260, `et u_R = ${fx(b, 2)} V`, { couleur: 'cyan', taille: 15 });
  lire(c, 284, `${fx(a, 2)} + ${fx(b, 2)} = ${fx(E, 1)} V`, { couleur: 'cyan', taille: 18 });
  lire(c, 318, 'u_C + u_R = E', { couleur: 'blanc', taille: 20 });
  c.rect(LX - 4, 296, 150, 32, { couleur: 'jaune', largeur: 1.5, arrondi: 6 });
  lire(c, 350, 'à chaque instant', { couleur: 'blanc', taille: 16 });
  marque(c, 'somme');
}
function vueDescente(c) {
  const G = graphe('i'), T = tau(), I = I0(), t37 = -T * Math.log(.37);
  c.texte('Lecture', RL.x + 6, 30, { couleur: 'cyan', taille: 17, duree: .3 });
  c.rect(RL.x, RL.y, RL.w, RL.h, { couleur: 'tresfaible', arrondi: 10, duree: .3 });
  lire(c, 64, `E = ${fx(S.E, 1)} V ; R = ${fR(S.R)} ; C = ${fC(S.C)}`, { couleur: 'faible', taille: 14, duree: .8 });
  c.texte('Charge : i(t) descend', G.P.x + 6, 30, { couleur: 'cyan', taille: 17, duree: .8 });
  axes(c, G, 'i (mA)');
  c.courbe(u => { const t = u * ET().max; return [G.PX(t), G.PY(GR.i.f(t))]; }, 80, { couleur: 'rouge', largeur: 2.6, duree: 1.3 });
  lire(c, 100, GR.i.expr, { couleur: 'rouge', taille: 18 });
  lire(c, 128, GR.i.note(), { couleur: 'rouge', taille: 16 });
  marque(c, 'i');
  c.pause(.4);
  c.ligne(G.PX(0), G.PY(I), G.PX(T), G.PY(0), { couleur: 'cyan', largeur: 2.2 });
  c.cercle(G.PX(T), G.O.y, 5, { couleur: 'cyan', largeur: 1.8 });
  c.texte('τ', G.PX(T), G.O.y + 38, { couleur: 'cyan', taille: 19, align: 'center' });
  lire(c, 164, 'la tangente à l’origine', { couleur: 'cyan' });
  lire(c, 186, 'coupe l’axe des temps en t = τ', { couleur: 'cyan' });
  marque(c, 'tangente_descente');
  c.pause(.4);
  const y37 = G.PY(.37 * I);
  c.ligne(G.O.x, y37, G.PX(t37), y37, { couleur: 'vert', largeur: 1.8, pointille: [7, 5] });
  c.ligne(G.PX(t37), y37, G.PX(t37), G.O.y, { couleur: 'vert', largeur: 1.8, pointille: [7, 5] });
  c.cercle(G.PX(t37), y37, 5, { couleur: 'vert', largeur: 1.8 });
  c.texte('0,37·I_0', G.PX(t37) + 10, y37 - 8, { couleur: 'vert', taille: 15 });
  lire(c, 222, 'à t = τ : i = 0,37·I_0', { couleur: 'blanc', taille: 16 });
  lire(c, 250, `0,37 × ${sig(I * 1e3, 3)} mA = ${sig(.37 * I * 1e3, 3)} mA`, { couleur: 'vert', taille: 17 });
  lire(c, 274, 'horizontale jusqu’à la courbe,', { couleur: 'faible', taille: 14 });
  lire(c, 294, 'puis verticale vers l’axe', { couleur: 'faible', taille: 14 });
  lire(c, 330, `τ ≈ ${fT(T)}`, { couleur: 'blanc', taille: 20 });
  c.rect(LX - 4, 308, 130, 32, { couleur: 'jaune', largeur: 1.5, arrondi: 6 });
  marque(c, 'ligne_37');
}
function declarerReperes(c) {
  const T = tau(), ici = v => (S.vue === v ? '' : ` (vue « ${v} »)`);
  const P = PANNEAUX[S.vue];
  for (const n of ['uC', 'q', 'uR', 'i']) {
    const g = GR[n], G = graphe(n), absent = !P[n] ? ` (vue « quatre »${n === 'q' || n === 'i' ? ' ou « q_i »' : ' ou « uC_uR »'})` : '';
    c.repere('graphe_' + n, G.P.x, G.P.y, G.P.w, G.P.h, `le graphe ${g.nom}(t) : ${g.monte ? 'il monte' : 'il descend'}${absent}`);
    const ey = S.vue === 'uC_uR' ? (n === 'uC' ? 84 : n === 'uR' ? 146 : 0) : S.vue === 'descente' && n === 'i' ? 84 : 0;
    if (ey) c.repere('expression_' + n, LX - 4, ey, LW, 26, `${g.exprTxt}${absent}`);
    else c.repere('expression_' + n, G.P.x + 4, G.P.y + 4, Math.min(G.P.w - 8, 230), 24, `${g.exprTxt} ; ${g.note().replace(/_m/, 'm').replace('_', '')}${absent}`);
  }
  const G = graphe(S.vue === 'descente' ? 'i' : 'uC'), x = G.PX(t1());
  c.repere('somme', x - 20, G.PY(S.E) - 6, 40, G.O.y - G.PY(S.E) + 12, `u_C + u_R = E à chaque instant (marqué à t = ${fT(t1())})${ici('uC_uR')}`);
  const Gi = graphe('i'), I = I0(), t37 = -T * Math.log(.37);
  c.repere('tangente', Gi.PX(0), Gi.PY(I), Math.max(24, Gi.PX(T) - Gi.PX(0)), Gi.O.y - Gi.PY(I), `la tangente à l’origine de i(t) : elle coupe l’axe des temps en τ${ici('descente')}`);
  c.repere('ligne_37', Gi.O.x, Gi.PY(.37 * I) - 12, Math.max(24, Gi.PX(t37) - Gi.O.x + 10), 24, `0,37 × ${sig(I * 1e3, 3)} mA = ${sig(.37 * I * 1e3, 3)} mA${ici('descente')}`);
  c.repere('tau', Gi.PX(T) - 16, Gi.O.y - 10, 32, Math.min(52, 420 - Gi.O.y + 8), `τ = R·C = ${fT(T)}${ici('descente')}`);
}

const canvas = $('canvas');
const scene = window.OndesTableau.Scene(canvas, dessiner);
const craie = scene.craie;
scene.cadre = function (graine) {
  const W = craie.W, H = craie.H, VW = 760, VH = 420;
  craie.debut(graine, S.t);
  const s = Math.min(W / VW, H / VH) || 1;
  scene.s = s; scene.ox = (W - VW * s) / 2; scene.oy = (H - VH * s) / 2;
  craie.ctx.translate(scene.ox, scene.oy); craie.ctx.scale(s, s);
  craie.echelle = s; craie.tailleMin = 11; craie.cadre = { w: VW, h: VH, haut: 0 };
  return craie;
};
function calculer() { const t = S.t, r = S.running; S.t = 1e6; S.running = false; try { dessiner(craie); dessiner(craie); } finally { S.t = t; S.running = r; } scene.sale = true; }
function moments() { if (M.fin === undefined) calculer(); const out = {}; for (const k of VUES[S.vue]) out[k] = +M[k].toFixed(2); return out; }
const vu = n => M[n] !== undefined && S.t >= M[n] - 1e-6;

const etiquette = () => { $('run').textContent = S.running ? 'Pause' : S.pause ? 'Reprendre' : S.fait ? 'Rejouer' : 'Lancer'; };
/** La bulle est du texte HTML : pas de « _ » visible (E_e → Eₑ, I_0 → I₀, u_C → uC). */
const INDICES = { 0: '₀', 1: '₁', 2: '₂', e: 'ₑ', m: 'ₘ', a: 'ₐ', o: 'ₒ', x: 'ₓ' };
const lisible = s => String(s).replace(/_\{?([A-Za-z0-9]+)\}?/g, (_, x) => [...x].map(ch => INDICES[ch] || ch).join(''));
const dire = (texte, kind = '') => { S.dit = texte; bulle($('feedback'), lisible(texte), kind); };
scene.avancer = dt => {
  if (!S.running) return false;
  S.t += dt * VITESSE;
  if (S.jusqua != null && S.t >= S.jusqua) {
    S.t = S.jusqua; S.jusqua = null; S.running = false;
    if (S.t >= M.fin - 1e-6) { finir(); return true; }
    S.pause = true; etiquette(); dire('Arrêt sur image : ' + (S.motif || `t = ${fr(S.t, 1)} s`) + '.');
    pont.noter('pause', { time_s: +S.t.toFixed(2) }); pont.emettre(); return true;
  }
  if (M.fin !== undefined && S.t >= M.fin) { S.t = M.fin; finir(); return true; }
  if (performance.now() - S.emis > 500) { S.emis = performance.now(); pont.emettre(); }
  return true;
};
function conclusion() {
  const T = tau();
  return {
    quatre: `Pendant la charge, u_C et q montent (vers E et Q_m = C·E = ${val('q', Qm())}), u_R et i descendent (de E et E/R = ${val('i', I0())} vers 0), avec le même τ = ${fT(T)}.`,
    q_i: `q(t) = C·E(1 − e^(−t/τ)) monte vers Q_m = C·E = ${val('q', Qm())} ; i(t) = (E/R)·e^(−t/τ) descend de i(0) = E/R = ${val('i', I0())} vers 0.`,
    uC_uR: `u_C monte, u_R descend : à chaque instant u_C + u_R = E = ${fx(S.E, 1)} V.`,
    descente: `La tangente à l’origine coupe l’axe des temps en τ ; 0,37 × ${sig(I0() * 1e3, 3)} mA = ${sig(.37 * I0() * 1e3, 3)} mA donne aussi τ ≈ ${fT(T)}.`,
  }[S.vue];
}
function finir() { S.running = false; S.fait = true; S.pause = false; etiquette(); dire(conclusion(), 'good'); pont.noter('measurement', { vue: S.vue }); pont.emettre(); }
const MOTIFS = {
  uC: 'u_C(t) = E(1 − e^(−t/τ)) monte', q: 'q(t) = C·E(1 − e^(−t/τ)) monte vers Q_m = C·E', uR: 'u_R(t) = E·e^(−t/τ) descend',
  i: 'i(t) = (E/R)·e^(−t/τ) descend', somme: 'u_C + u_R = E à chaque instant', tangente_descente: 'la tangente à l’origine coupe l’axe des temps en τ',
  ligne_37: '0,37 × I₀ jusqu’à la courbe, puis τ', fin: 'tout est écrit',
};

/* ── Ce que voit le tuteur ─────────────────────────────────────────────── */
function ceQuiSeVoit() {
  if (M.fin === undefined) calculer();
  const T = tau(), et = ET();
  const m = [`Vue « ${S.vue} » (${TITRES[S.vue]})${S.running ? ', la craie écrit' : S.fait ? ', fin : tout est écrit' : S.pause ? ', arrêt sur image' : ', pas encore lancée'}.`,
    `Charge : E = ${fx(S.E, 1)} V, R = ${fR(S.R)}, C = ${fC(S.C)}, τ = R·C = ${fT(T)}. Même axe des temps pour tous les graphes : t (${et.u}) de 0 à ${fx(et.max * et.k, 3)}, graduations de ${fx(et.pas * et.k, 3)} ${et.u}.`];
  const L = [], D = {
    uC: `graphe u_C(t) (V) : courbe rouge qui monte de 0 vers E = ${fx(S.E, 1)} V ; « u_C(t) = E(1 − e^(−t/τ)) »`,
    q: `graphe q(t) (${GR.q.unite}) : courbe rouge qui monte vers Q_m = C·E = ${val('q', Qm())} ; « q(t) = C·E(1 − e^(−t/τ)) »`,
    uR: `graphe u_R(t) (V) : courbe rouge qui descend de E = ${fx(S.E, 1)} V vers 0 ; « u_R(t) = E·e^(−t/τ) »`,
    i: `graphe i(t) (mA) : courbe rouge qui descend de i(0) = E/R = ${val('i', I0())} vers 0 ; « i(t) = (E/R)·e^(−t/τ) »`,
  };
  if (S.vue === 'uC_uR') {
    if (vu('uC')) L.push(`u_C(t) en rouge (trait plein), monte de 0 vers E = ${fx(S.E, 1)} V ; « u_C(t) = E(1 − e^(−t/τ)) »`);
    if (vu('uR')) L.push(`u_R(t) en rouge pointillé, descend de E vers 0 ; « u_R(t) = E·e^(−t/τ) »`);
    if (vu('somme')) { const a = GR.uC.f(t1()), b = GR.uR.f(t1()); L.push(`instant marqué t = ${fT(t1())} : u_C = ${fx(a, 2)} V et u_R = ${fx(b, 2)} V, ${fx(a, 2)} + ${fx(b, 2)} = ${fx(S.E, 1)} V : « u_C + u_R = E à chaque instant »`); }
  } else if (S.vue === 'descente') {
    if (vu('i')) L.push(D.i);
    if (vu('tangente_descente')) L.push(`tangente cyan à l’origine : elle coupe l’axe des temps en t = τ`);
    if (vu('ligne_37')) L.push(`0,37 × ${sig(I0() * 1e3, 3)} mA = ${sig(.37 * I0() * 1e3, 3)} mA : horizontale verte jusqu’à la courbe, puis verticale : τ ≈ ${fT(T)} (encadré)`);
  } else for (const n of VUES[S.vue]) if (D[n] && vu(n)) L.push(D[n]);
  m.push(L.length ? `Au tableau : ${L.join(' ; ')}.` : 'Rien encore de tracé.');
  if (S.fait) m.push(`Conclusion : ${conclusion()}`);
  return m.join(' ');
}

/* ── Commandes ─────────────────────────────────────────────────────────── */
function start() { S.t = 0; S.jusqua = null; S.motif = ''; S.running = true; S.pause = false; S.fait = false; etiquette(); dire('La craie trace les graphes de la charge…'); pont.noter('start', { vue: S.vue }); pont.emettre(); }
function reset() { start(); }
function pause() { if (!S.running) return; S.running = false; S.pause = true; S.jusqua = null; etiquette(); dire('Arrêt sur image.'); pont.noter('pause', { time_s: +S.t.toFixed(2) }); pont.emettre(); }
function resume() { if (S.running) return; if (!S.pause) return start(); S.running = true; S.pause = false; etiquette(); dire('La craie continue…'); pont.noter('resume'); pont.emettre(); }
function setTime(p) {
  calculer(); const t = +p.time_s; if (p.time_s === null || p.time_s === '' || !Number.isFinite(t)) return;
  S.running = false; S.jusqua = null; S.t = clamp(t, 0, M.fin); S.fait = S.t >= M.fin - 1e-6; S.pause = !S.fait && S.t > 0;
  etiquette(); scene.sale = true; dire(`Arrêt sur image : t = ${fr(S.t, 1)} s.`); pont.noter('set_time', { time_s: S.t }); pont.emettre();
}
function playUntil(p) {
  calculer();
  const nom = VUES[S.vue].includes(p.moment) ? p.moment : null, cible = nom ? M[nom] : +p.time_s;
  if (!Number.isFinite(cible)) return;
  if (S.fait || S.t >= cible - 1e-3) { S.t = 0; S.fait = false; }
  S.jusqua = clamp(cible, .01, M.fin); S.motif = nom ? MOTIFS[nom] : ''; S.running = true; S.pause = false; etiquette(); dire('Observe…');
  pont.noter('play_until', { moment: nom, time_s: S.jusqua }); pont.emettre();
}
const PLAGES = { R_ohm: [100, 10000], C_uF: [10, 1000] };
function setParameters(p) {
  p = p || {}; let vue = false, phys = false;
  if (p.vue && VUES[p.vue] && p.vue !== S.vue) { S.vue = p.vue; vue = true; }
  for (const [k, cle] of [['R_ohm', 'R'], ['C_uF', 'C']]) {
    if (p[k] === undefined || p[k] === null || p[k] === '' || !Number.isFinite(+p[k])) continue;
    const v = clamp(+p[k], ...PLAGES[k]); if (v !== S[cle]) { S[cle] = v; phys = true; }
  }
  M = {}; calculer();
  pont.noter('set_parameters', { vue: S.vue, R_ohm: S.R, C_uF: S.C });
  if (vue) { start(); return; }
  if (phys) { S.running = false; S.jusqua = null; S.t = M.fin; S.fait = true; S.pause = false; etiquette(); scene.sale = true; dire(`R = ${fR(S.R)}, C = ${fC(S.C)} : τ = R·C = ${fT(tau())}.`); }
  pont.emettre();
}
$('run').onclick = () => (S.running ? pause() : S.pause ? resume() : start());

window.Tableau.explication({
  quatre: [
    { repere: 'graphe_uC', texte: 'u_C monte de 0 vers E = 12 V.' },
    { repere: 'graphe_q', texte: 'q = C·u_C : même forme, elle monte vers Q_m = C·E = 2,64 mC.' },
    { repere: 'graphe_uR', texte: 'u_R = E − u_C : elle descend de 12 V vers 0.' },
    { repere: 'graphe_i', texte: 'i = u_R/R : elle descend de E/R = 12 mA vers 0.' },
  ],
  q_i: [
    { repere: 'expression_q', texte: 'q(t) = C·E(1 − e^(−t/τ)), elle tend vers Q_m = C·E.' },
    { repere: 'expression_i', texte: 'i(t) = (E/R)·e^(−t/τ) ; à t = 0, i = E/R = 12 mA.' },
  ],
  uC_uR: [
    { repere: 'expression_uC', texte: 'u_C(t) = E(1 − e^(−t/τ)) monte.' },
    { repere: 'expression_uR', texte: 'u_R(t) = E·e^(−t/τ) descend.' },
    { repere: 'somme', texte: 'À chaque instant, u_C + u_R = E.' },
  ],
  descente: [
    { repere: 'graphe_i', texte: 'i part de E/R = 12 mA et descend vers 0.' },
    { repere: 'tangente', texte: 'La tangente à l’origine coupe l’axe des temps en t = τ.' },
    { repere: 'ligne_37', texte: '0,37 × 12 mA = 4,44 mA : horizontale jusqu’à la courbe.' },
    { repere: 'tau', texte: 'Puis verticale : τ ≈ 0,22 s.' },
  ],
});
const commandes = ['start', 'reset', 'pause', 'resume', 'set_time', 'set_parameters', 'play_until'];
calculer();
const config = { id: 'dipole_rc_quatre_courbes', version: '1.0', title: 'u_C, q, u_R et i pendant la charge', variants: Object.keys(VUES).map(id => ({ id, label: TITRES[id] })), commands: commandes,
  command_schema: {
    set_parameters: { vue: 'quatre | q_i | uC_uR | descente (change la vue et la retrace depuis le début)', R_ohm: '100..10000 pas 100 (Ω)', C_uF: '10..1000 pas 10 (µF)' },
    set_time: { time_s: '0..fin (arrêt sur cet instant de l’écriture, en s ; voir moments)' },
    play_until: { moment: 'quatre : uC | q | uR | i | fin ; q_i : q | i | fin ; uC_uR : uC | uR | somme | fin ; descente : i | tangente_descente | ligne_37 | fin', time_s: 'ou un instant en s' } } };
const pont = protocole({ id: config.id, commandes, config,
  texte: 'Pendant la charge (E = 12 V, R = 1 kΩ, C = 220 µF, τ = 0,22 s) : u_C(t) = E(1 − e^(−t/τ)) et q(t) = C·E(1 − e^(−t/τ)) montent (Q_m = C·E = 2,64 mC) ; u_R(t) = E·e^(−t/τ) et i(t) = (E/R)·e^(−t/τ) descendent (i(0) = E/R = 12 mA). u_C + u_R = E à chaque instant. Sur i(t) : la tangente à l’origine coupe l’axe des temps en τ ; 0,37 × 12 mA = 4,44 mA donne τ.',
  etat: () => ({ simulation_status: S.running ? 'running' : S.fait ? 'finished' : S.pause ? 'paused' : 'idle', ce_qui_se_voit: ceQuiSeVoit(), current_variant: S.vue,
    time_s: +S.t.toFixed(2), parameters: { vue: S.vue, R_ohm: S.R, C_uF: S.C, E: S.E, tau_s: +tau().toFixed(6), I0_mA: +(I0() * 1e3).toFixed(3), Qm_mC: +(Qm() * 1e3).toFixed(4) }, moments: moments() }),
  progression: () => (S.fait ? 1 : 0),
  executer: (cmd, p) => ({ start, reset, pause, resume, set_time: () => setTime(p), set_parameters: () => setParameters(p), play_until: () => playUntil(p) })[cmd]?.() });
dire('Les graphes de la charge vont s’écrire…');
setTimeout(() => { if (!S.running && S.t === 0 && !S.pause) start(); }, 900);
</script>
