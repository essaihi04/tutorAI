<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carte du chapitre — dipôle RC</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="rc.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Carte du chapitre dessinée à la craie : « Dipôle RC » au centre, sept branches autour (le condensateur, l’échelon de tension, l’équation différentielle, la solution, τ = R·C, lire τ, l’énergie), un encadré sur les sujets du national et la suite du programme"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start reset play_until">Redessiner</button>
    <button class="craie-btn secondaire" id="imprimer" title="Imprimer ou enregistrer en PDF">🖨️ Imprimer / PDF</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="commun.js"></script>
<script src="exposants.js"></script>
<script src="/media/simulations/shared/tableau/imprimer.js"></script>
<script>
/*
 * La carte du chapitre « Dipôle RC » (phys_ch6_dipole_RC), ouverture (o1) et fin (b2) du cours ; même forme que
 * radioactivite-tableau/carte.html. Au centre « Dipôle RC » (moment `centre` : sa phrase « R et C en série »), puis les
 * branches dessinées l’une après l’autre au rythme de la voix (play_until {moment: <branche>}) : condensateur, echelon,
 * equation, solution, tau, courbes, energie ; puis l’encadré `national` et la `suite` du programme. Une branche sautée
 * s’écrit d’un coup ; celle qu’on dit s’écrit à cet instant. Indices « u_C » par le kit, exposants par exposants.js.
 * L’élève touche une branche : sa phrase s’écrit dans la bulle. Le lecteur donne le bilan de l’élève
 * (set_parameters {lacunes, acquis_ids}) : branches à reprendre entourées en rouge (à revoir : orange), acquises cochées.
 */
const { bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);

const CENTRE = { x: 380, y: 200, w: 200, h: 82, comps: [],
  phrase: 'Le dipôle RC : un résistor R et un condensateur C en série ; on étudie la charge et la décharge du condensateur.' };
const NOEUDS = [
  { id: 'condensateur', x: 128, y: 70, w: 216, h: 70, couleur: 'cyan', comps: ['C1', 'C2'], titre: 'Le condensateur',
    lignes: ['q = C·u_C', 'C en farad (F) ; i = dq/dt'],
    phrase: 'Le condensateur : deux armatures séparées par un isolant ; q = C·u_C, C en farad ; i = dq/dt = C·du_C/dt.' },
  { id: 'echelon', x: 380, y: 62, w: 220, h: 70, couleur: 'cyan', comps: ['C3'], titre: 'Échelon de tension',
    lignes: ['0 → E : charge ; E → 0 : décharge', 'transitoire, puis permanent'],
    phrase: 'Un échelon de tension : la tension passe de 0 à E (charge) ou de E à 0 (décharge) ; régime transitoire puis régime permanent.' },
  { id: 'equation', x: 632, y: 70, w: 224, h: 70, couleur: 'orange', comps: ['C4'], titre: 'Équation différentielle',
    lignes: ['RC·du_C/dt + u_C = E', 'décharge : 0 à droite'],
    phrase: 'L’équation différentielle de la charge : RC·du_C/dt + u_C = E ; à la décharge : RC·du_C/dt + u_C = 0.' },
  { id: 'solution', x: 644, y: 200, w: 210, h: 70, couleur: 'orange', comps: ['C5'], titre: 'Solution u_C(t)',
    lignes: ['u_C(t) = E(1 − e^{−t/τ})', 'décharge : u_C(t) = E·e^{−t/τ}'],
    phrase: 'La solution : u_C(t) = E(1 − e^{−t/τ}) à la charge, u_C(t) = E·e^{−t/τ} à la décharge.' },
  { id: 'tau', x: 632, y: 326, w: 210, h: 66, couleur: 'vert', comps: ['C6'], titre: 'τ = R·C',
    lignes: ['la constante de temps', 'un temps, en s ; à 5τ : fini'],
    phrase: 'τ = R·C est la constante de temps, un temps en secondes ; à 5τ, le régime permanent est atteint.' },
  { id: 'courbes', x: 380, y: 332, w: 210, h: 66, couleur: 'vert', comps: ['C7'], titre: 'Lire τ',
    lignes: ['tangente à l’origine', '0,63·E (charge) ; 0,37·E'],
    phrase: 'Lire τ sur une courbe : la tangente à l’origine, ou l’instant où u_C = 0,63·E (charge), 0,37·E (décharge).' },
  { id: 'energie', x: 128, y: 326, w: 210, h: 66, couleur: 'violet', comps: ['C8'], titre: 'Énergie',
    lignes: ['E_e = ½·C·u_C²', 'rendue à la décharge'],
    phrase: 'L’énergie stockée dans le condensateur : E_e = ½·C·u_C² ; il la rend à la décharge.' },
  { id: 'national', x: 116, y: 200, w: 196, h: 66, couleur: 'blanc', comps: [], titre: 'Au national', encadre: true,
    lignes: ['une partie RC dans 11 sujets sur 20', 'lire τ dans 8'],
    phrase: 'Au national : une partie RC dans 11 sujets sur 20 ; lire τ dans 8.' },
  { id: 'suite', x: 380, y: 404, w: 330, h: 26, couleur: 'faible', comps: [], titre: 'après : dipôle RL, puis circuit RLC', seul: true, lignes: [],
    phrase: 'Après ce chapitre : le dipôle RL, puis le circuit RLC.' },
];
const ANNEAUX = { non_acquis: ['rouge', 'à reprendre'], partiel: ['orange', 'à revoir'] };
const AVANT = -1e9;   // instant d'un élément déjà dit : écrit d'un coup

// def : instant où la phrase du centre s'écrit (null = pas encore dite) ; n branches dessinées ; apparu[i] leur instant.
const S = { def: null, n: 0, cible: 0, running: false, lacunes: null, acquis: null, apparu: [], choisi: null };
const DUREE_BRANCHE = 2.6;   // s par branche quand la carte se dessine seule

const BAS_U = { 0: '₀', 1: '₁', 2: '₂', 3: '₃', 4: '₄', 5: '₅', 6: '₆', 7: '₇', 8: '₈', 9: '₉', a: 'ₐ', e: 'ₑ', m: 'ₘ', x: 'ₓ' };
/* Texte pour la bulle et ce_qui_se_voit : pas de « _ » ni d’accolades visibles. */
const lisible = s => String(s).replace(/\^\{([^}]+)\}/g, '^($1)').replace(/_\{?([A-Za-z0-9]+)\}?/g, (m, g) => ([...g].every(ch => ch in BAS_U) ? [...g].map(ch => BAS_U[ch]).join('') : g));

function statut(comps) {
  if (!S.lacunes || !comps.length) return null;
  const lac = S.lacunes.filter(l => comps.includes(l.id));
  if (lac.some(l => l.statut === 'non_acquis')) return 'non_acquis';
  if (lac.length) return 'partiel';
  return (S.acquis || []).some(a => comps.includes(a)) ? 'acquis' : null;
}
/* Anneau rouge/orange ou coche verte autour d'un cadre (état de l'élève). */
function etat(c, comps, x, y, w, h) {
  const st = statut(comps);
  c.direct(() => {
    if (st && ANNEAUX[st]) {
      const [coul, etiq] = ANNEAUX[st];
      c.rect(x - 5, y - 5, w + 10, h + 10, { couleur: coul, arrondi: 16, largeur: 2, pointille: [6, 6] });
      c.texte(etiq, x + w - 4, y - 8, { couleur: coul, taille: 12, align: 'right' });
    } else if (st === 'acquis') c.texte('✓', x + w - 14, y + 16, { couleur: 'vert', taille: 18 });
  });
}

function branche(c, n) {
  const x = n.x - n.w / 2, y = n.y - n.h / 2;
  if (!n.seul) {
    const dx = n.x - CENTRE.x, dy = n.y - CENTRE.y, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
    // du bord du centre au bord de la branche, avec une légère courbure
    const d0 = Math.min(CENTRE.w / 2 / Math.max(.2, Math.abs(ux)), CENTRE.h / 2 / Math.max(.2, Math.abs(uy)));
    const d1 = Math.min(n.w / 2 / Math.max(.2, Math.abs(ux)), n.h / 2 / Math.max(.2, Math.abs(uy)));
    const a = [CENTRE.x + ux * d0, CENTRE.y + uy * d0], b = [n.x - ux * d1, n.y - uy * d1];
    const m = [(a[0] + b[0]) / 2 - uy * 12, (a[1] + b[1]) / 2 + ux * 12];
    c.courbe(u => [(1 - u) * (1 - u) * a[0] + 2 * (1 - u) * u * m[0] + u * u * b[0], (1 - u) * (1 - u) * a[1] + 2 * (1 - u) * u * m[1] + u * u * b[1]], 24, { couleur: 'faible', largeur: 2, pointille: n.encadre ? [6, 6] : undefined });
  }
  if (n.seul) {
    // la suite du programme : une flèche et une ligne, sans cadre de branche
    c.texte('→ ' + n.titre, n.x, n.y + 6, { couleur: 'faible', taille: 17, align: 'center', max: n.w - 10, duree: .9 });
  } else {
    c.rect(x, y, n.w, n.h, { couleur: n.couleur, arrondi: n.encadre ? 4 : 14, largeur: n.encadre ? 1.6 : 2.4, pointille: n.encadre ? [6, 5] : undefined });
    c.texte(n.titre, n.x, y + 21, { couleur: n.couleur, taille: 17, align: 'center', max: n.w - 16, duree: .8 });
    n.lignes.forEach((l, k) => c.texte(l, n.x, y + 42 + k * 18, { couleur: 'blanc', taille: 14, align: 'center', max: n.w - 14, alpha: .92, duree: 1 }));
  }
  c.repere(n.id, x - 5, y - 5, n.w + 10, n.h + 10, lisible(n.titre));
  etat(c, n.comps, x, y, n.w, n.h);
  if (S.choisi === n.id) c.direct(() => c.rect(x - 3, y - 3, n.w + 6, n.h + 6, { couleur: 'blanc', arrondi: 15, largeur: 1.2, alpha: .6 }));
}

function dessiner(c) {
  const x = CENTRE.x - CENTRE.w / 2, y = CENTRE.y - CENTRE.h / 2;
  if (S.def === AVANT) c.cur = AVANT;   // déjà dit (saut ou retour en arrière) : le centre est écrit d'un coup
  c.rect(x, y, CENTRE.w, CENTRE.h, { couleur: 'blanc', arrondi: 18, largeur: 3 });
  c.texte('Dipôle RC', CENTRE.x, y + 34, { couleur: 'blanc', taille: 28, align: 'center', gras: true });
  c.repere('centre', x, y, CENTRE.w, CENTRE.h, 'le centre : le dipôle RC');
  const apres = c.cur;   // fin du titre du centre
  if (S.def != null) {
    c.depuis(S.def);
    peindre(c, ctx => { resistorPeint(ctx, CENTRE.x - 44, y + 58); condoPeint(ctx, CENTRE.x + 26, y + 44); });
    c.texte('R et C en série', CENTRE.x, y + 76, { couleur: 'faible', taille: 13, align: 'center', duree: .8 });
    if (S.choisi === 'centre') c.direct(() => c.rect(x - 3, y - 3, CENTRE.w + 6, CENTRE.h + 6, { couleur: 'blanc', arrondi: 19, largeur: 1.2, alpha: .6 }));
  }
  // chaque branche a sa ligne de temps : elle s'écrit dès que la voix la dit, sans attendre la précédente
  for (let i = 0; i < S.n; i++) { c.cur = S.apparu[i] === AVANT ? AVANT : Math.max(apres, S.apparu[i]); branche(c, NOEUDS[i]); }
  if (S.lacunes) c.direct(() => c.texte('✓ acquis · ⟳ à revoir · ✗ à reprendre', 744, 412, { couleur: 'faible', taille: 12, align: 'right' }));
}
/* Le peint (résistor, condensateur chimique) apparaît quand l’écriture arrive à lui. */
const peindre = (c, fn) => { if (c.t >= c.cur) c.direct(() => { c.ctx.save(); try { fn(c.ctx); } finally { c.ctx.restore(); } }); };
function arrondi(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function condoPeint(ctx, x, y, w = 13, h = 22) {
  let g = ctx.createLinearGradient(x, 0, x + w, 0);
  g.addColorStop(0, '#1e3a8a'); g.addColorStop(.35, '#3b82f6'); g.addColorStop(.6, '#2563eb'); g.addColorStop(1, '#172554');
  arrondi(ctx, x, y, w, h, 3); ctx.fillStyle = g; ctx.fill();
  ctx.fillStyle = 'rgba(226,232,240,.75)'; ctx.fillRect(x + w * .68, y + 2, w * .2, h - 4);
  ctx.fillStyle = '#d1d5db'; ctx.beginPath(); ctx.ellipse(x + w / 2, y + 1.5, w / 2 - 1, 2, 0, 0, 7); ctx.fill();
}
function resistorPeint(ctx, cx, cy, L = 34, e = 10) {
  const g = ctx.createLinearGradient(0, cy - e / 2, 0, cy + e / 2);
  g.addColorStop(0, '#f5deb3'); g.addColorStop(.45, '#d6b98c'); g.addColorStop(1, '#8b6f47');
  arrondi(ctx, cx - L / 2, cy - e / 2, L, e, e / 2.2); ctx.fillStyle = g; ctx.fill();
  [['#7c4a1e', -.28], ['#111827', -.12], ['#dc2626', .04], ['#d4a017', .3]].forEach(([k, f]) => { ctx.fillStyle = k; ctx.fillRect(cx + f * L - 1.5, cy - e / 2 + 1, 3, e - 2); });
  ctx.strokeStyle = 'rgba(203,213,225,.7)'; ctx.lineWidth = 1.4; ctx.beginPath();
  ctx.moveTo(cx + L / 2, cy); ctx.lineTo(cx + 62, cy); ctx.moveTo(cx - L / 2, cy); ctx.lineTo(cx - L / 2 - 8, cy); ctx.stroke();
}

const canvas = $('canvas');
const scene = window.OndesTableau.Scene(canvas, (c) => { scene.cadre(71); dessiner(c); return c.fin(); });
const maintenant = () => (performance.now() - scene.ouvert) / 1000;
let horloge = 0;
scene.avancer = dt => {
  if (!S.running) return false;
  horloge += dt;
  if (S.n < S.cible && horloge >= 0) {
    // la branche suivante apparaît quand la précédente a fini de s'écrire
    S.n += 1; S.apparu[S.n - 1] = maintenant(); horloge = -DUREE_BRANCHE;
    bulle($('feedback'), lisible(NOEUDS[S.n - 1].titre) + (S.n >= NOEUDS.length ? ' — la carte est complète.' : ''));
    pont.noter('branche', { n: S.n, moment: NOEUDS[S.n - 1].id }); pont.emettre();
    if (S.n >= S.cible) S.running = false;
  }
  return true;
};
function moments() { const m = { centre: 0 }; NOEUDS.forEach((n, i) => { m[n.id] = i + 1; }); m.fin = NOEUDS.length; return m; }
/* Dessine la carte jusqu'à la branche `cible` (0 = le centre et sa phrase). `pasAPas` : la carte se dessine seule,
 * une branche après l'autre (bouton) ; sinon (la voix) les branches sautées s'écrivent d'un coup et la dernière à cet instant. */
function montrer(cible, par, pasAPas) {
  cible = Math.max(0, Math.min(NOEUDS.length, cible));
  if (cible < S.n) { S.n = 0; S.apparu = []; S.def = null; scene.reecrire(); }   // retour en arrière : on redessine jusque-là
  if (S.def == null) S.def = pasAPas || cible === 0 ? maintenant() : AVANT;
  if (!pasAPas && cible > S.n) {
    for (let i = S.n; i < cible - 1; i++) S.apparu[i] = AVANT;
    S.apparu[cible - 1] = maintenant(); S.n = cible;
    bulle($('feedback'), lisible(NOEUDS[cible - 1].titre) + (cible >= NOEUDS.length ? ' — la carte est complète.' : ''));
  } else if (cible === 0) bulle($('feedback'), 'Au centre : le dipôle RC.');
  S.cible = cible; S.running = S.n < cible; horloge = pasAPas ? -1.5 : 0; scene.sale = true;
  pont.noter(par || 'play_until', { moment: NOEUDS[cible - 1]?.id || 'centre' }); pont.emettre();
}
function playUntil(p) { const M = moments(); const n = p.moment in M ? M[p.moment] : +p.time_s; if (Number.isFinite(n)) montrer(n, 'play_until'); }
function start() { S.n = 0; S.apparu = []; S.def = null; S.choisi = null; scene.reecrire(); montrer(NOEUDS.length, 'start', true); bulle($('feedback'), 'La carte se dessine…'); }
function setParameters(p) {
  if (Array.isArray(p.lacunes)) S.lacunes = p.lacunes.map(l => ({ id: String(l.id || ''), label: String(l.label || ''), statut: String(l.statut || 'non_acquis') }));
  if (Array.isArray(p.acquis_ids)) S.acquis = p.acquis_ids.map(String);
  scene.sale = true; pont.noter('set_parameters', { lacunes: (S.lacunes || []).length }); pont.emettre();
}
function ceQuiSeVoit() {
  const vues = NOEUDS.slice(0, S.n).map(n => lisible(n.titre));
  const aReprendre = NOEUDS.slice(0, S.n).filter(n => statut(n.comps) && statut(n.comps) !== 'acquis').map(n => lisible(n.titre));
  const etatEleve = S.lacunes ? ` Branches à reprendre : ${aReprendre.join(', ') || 'aucune'}.` : '';
  const detail = NOEUDS.slice(0, S.n).map(n => lisible(n.phrase)).join(' ');
  return `Carte du chapitre : « Dipôle RC » au centre${S.def != null ? ' (R et C en série)' : ''}, ${S.n}/${NOEUDS.length} élément(s) dessiné(s)${vues.length ? ' (' + vues.join(', ') + ')' : ''}${S.running ? ', la carte se dessine' : ''}.${detail ? ' ' + detail : ''}${etatEleve}${S.choisi ? ` L'élève a touché « ${S.choisi === 'centre' ? 'le centre' : lisible(NOEUDS.find(n => n.id === S.choisi).titre)} ».` : ''}`;
}
$('run').onclick = start;
// Imprimer / PDF : la carte complète, sur fond blanc (shared/tableau/imprimer.js).
$('imprimer').onclick = () => {
  const avant = { n: S.n, cible: S.cible, running: S.running, apparu: S.apparu.slice(), def: S.def, choisi: S.choisi };
  window.Tableau.imprimer({ titre: 'Carte du chapitre — dipôle RC', scene,
    pages: [{ nom: 'la carte complète', preparer: () => { S.n = NOEUDS.length; S.running = false; S.def = AVANT; S.apparu = NOEUDS.map(() => AVANT); S.choisi = null; } }],
    restaurer: () => { Object.assign(S, avant); } });
  pont.noter('imprimer', { pages: 1 }); pont.emettre();
};
canvas.addEventListener('pointerdown', e => {
  const r = canvas.getBoundingClientRect(), [x, y] = scene.local(e.clientX - r.left, e.clientY - r.top);
  const n = NOEUDS.slice(0, S.n).find(n => Math.abs(x - n.x) <= n.w / 2 + 6 && Math.abs(y - n.y) <= n.h / 2 + 6);
  if (n) { S.choisi = n.id; bulle($('feedback'), lisible(n.phrase)); }
  else if (Math.abs(x - CENTRE.x) <= CENTRE.w / 2 && Math.abs(y - CENTRE.y) <= CENTRE.h / 2) { S.choisi = 'centre'; bulle($('feedback'), lisible(CENTRE.phrase)); }
  else return;
  scene.sale = true; pont.noter('touche', { moment: S.choisi }); pont.emettre();
});

window.Tableau.explication({ carte: [{ repere: 'centre', texte: lisible(CENTRE.phrase) }, ...NOEUDS.map(n => ({ repere: n.id, texte: lisible(n.phrase) }))] });
const commandes = ['start', 'reset', 'play_until', 'set_parameters'];
const config = { id: 'dipole_rc_carte', version: '1.0', title: 'Carte du chapitre — dipôle RC', variants: [{ id: 'carte', label: 'carte' }], commands: commandes,
  command_schema: { play_until: { moment: Object.keys(moments()).join(' | ') + ' (centre = le centre et sa phrase ; sinon dessine la carte jusqu’à cet élément ; fin = la carte complète)' },
    set_parameters: { lacunes: '[{id: C1..C8, statut: non_acquis|partiel}] (bilan de l’élève)', acquis_ids: '[C1, ..] compétences acquises' } } };
const pont = protocole({ id: config.id, commandes, config,
  texte: 'Carte du chapitre « Dipôle RC » : « Dipôle RC » au centre (R et C en série), sept branches autour (le condensateur q = C·u_C, l’échelon de tension, l’équation différentielle, la solution u_C(t), τ = R·C, lire τ sur les courbes, l’énergie E_e = ½·C·u_C²), un encadré « au national : une partie RC dans 11 sujets sur 20 ; lire τ dans 8 » et la suite : dipôle RL, puis circuit RLC.',
  etat: () => ({ simulation_status: S.running ? 'running' : 'paused', ce_qui_se_voit: ceQuiSeVoit(), current_variant: 'carte', time_s: S.n, parameters: { centre: S.def != null, branches: S.n, lacunes: S.lacunes ? S.lacunes.length : null }, moments: moments() }),
  progression: () => S.n / NOEUDS.length,
  executer: (cmd, p) => ({ start, reset: start, play_until: () => playUntil(p), set_parameters: () => setParameters(p) })[cmd]?.() });
bulle($('feedback'), 'Le professeur va dessiner la carte du chapitre.');
window.__carte = { S, scene, NOEUDS, CENTRE, lisible };   // pour les vérifications automatiques
</script>
<script src="/media/simulations/professor-locate.js" defer></script>
</body></html>
