<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rappels d’électricité et de maths — au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="rc.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Rappels peints et à la craie : le courant, la tension, la loi d’Ohm, l’additivité des tensions, les puissances de dix, la dérivée, l’exponentielle, la sinusoïde et la dérivée d’un cosinus ; chaque notion montrée de deux façons"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start reset pause resume play_until set_time">Lancer</button>
    <span id="reglage" data-professor-control="set_parameters"></span>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="/media/simulations/shared/lexique/lexique-physique.js"></script>
<script src="commun.js"></script>
<script src="colonne.js"></script>
<script>
/*
 * Rappels d’électricité et de maths — au tableau (audit « rythme et départ de zéro », 14 novembre 2026 — règles 33 et 34 du professeur).
 * Moteur du déroulé et appareils peints recopiés de dipole-rc-tableau/condensateur.html (même protocole, mêmes commandes).
 */
const { fr, bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lisse = p => p * p * (3 - 2 * p);
const fx = (v, d = 2) => fr(v, d).replace(/(,\d*?)0+$/, '$1').replace(/,$/, '');   // 1,50 → 1,5 ; 2,00 → 2
const ECRITURE = 2.5;
function Moteur(o) {
  const q = new URLSearchParams(location.search);
  const S = { vue: o.vues.includes(q.get('vue')) ? q.get('vue') : o.vues[0], t: 0, running: false, pause: false, fait: false,
    jusqua: null, motif: '', emis: 0, dit: '', mesure: false };
  const V = o.vitesse ?? 1.7, T0 = o.T0 ?? .8, HOLD = {};
  let TL = null;
  function construire() {
    let s = T0; const ev = [];
    for (const e of o.etapes(S.vue)) {
      const anim = e.anim || 0, d = { ...e, anim, debut: s, ecrit: s + (e.ecritDes ?? anim) };
      d.fin = Math.max(s + anim, d.ecrit + (HOLD[e.nom] ?? 1.5)) + .35;
      s = d.fin; ev.push(d);
    }
    const mom = {}; for (const e of ev) mom[e.nom] = e.fin; mom.fin = s + (o.queue ?? .6);
    TL = { ev, M: mom };
  }
  const ev = nom => TL.ev.find(e => e.nom === nom);
  const M = {
    S, ev, Moments: () => TL.M,
    /** Avancement (0 → 1) de l’animation de l’étape `nom`. */
    p(nom) { const e = ev(nom); if (!e) return 0; return e.anim > 0 ? clamp((S.t - e.debut) / e.anim, 0, 1) : (S.t >= e.debut - 1e-6 ? 1 : 0); },
    commence(nom) { const e = ev(nom); return !!e && S.t > e.debut + 1e-6; },
    vu(nom) { if (nom === 'fin') return S.t >= TL.M.fin - 1e-6; const e = ev(nom); return !!e && S.t >= e.fin - 1e-6; },
    /** Ce qui s’écrit à l’étape `nom` : la craie écrit à partir de la fin de son animation. */
    etape(c, nom, fn) {
      const e = ev(nom); if (!e) return;
      const t = c.t, cur = c.cur, comp = c.complet, w0 = e.ecrit;
      c.t = S.t > 1e5 ? 1e9 : w0 + (S.t - w0) * V; c.cur = w0;
      try { fn(); } finally { if (S.mesure) HOLD[nom] = (c.cur - w0) / V; c.t = t; c.cur = cur; if (!S.running) c.complet = comp; }
    },
    etat() { return S.running ? 'en cours' : S.fait ? 'fin' : S.pause ? 'arrêt sur image' : 'pas encore lancée'; },
  };
  const scene = window.OndesTableau.Scene($('canvas'), (c) => o.dessiner(c, M), { large: true });
  const cadreBase = scene.cadre;
  scene.cadre = function (g) { const k = cadreBase.call(scene, g); if (Number.isFinite(k.t)) k.t *= ECRITURE; return k; };
  M.scene = scene; M.craie = scene.craie;
  function calculer() {
    construire();
    const t = S.t, r = S.running; S.t = 1e6; S.running = false; S.mesure = true;
    try { o.dessiner(scene.craie, M); } finally { S.t = t; S.running = r; S.mesure = false; }
    construire(); scene.sale = true;
  }
  // La bulle est du texte simple : jamais de « _ » visible (u_C → uC, I_0 → I₀).
  const sansSouligne = s => String(s).replace(/([A-Za-zΔτ])_\{?([A-Za-z0-9]+)\}?/g, (m, a, i) => a + (/^\d+$/.test(i) ? [...i].map(d => '₀₁₂₃₄₅₆₇₈₉'[d]).join('') : i));
  const dire = (texte, kind = '') => { texte = sansSouligne(texte); S.dit = texte; bulle($('feedback'), texte, kind); };
  const etiquette = () => { $('run').textContent = S.running ? 'Pause' : S.pause ? 'Reprendre' : S.fait ? 'Rejouer' : 'Lancer'; };
  let pont = null;
  const emettre = () => pont && pont.emettre();
  const noter = (a, d) => pont && pont.noter(a, d);
  scene.avancer = dt => {
    if (!S.running) return !!(o.anime && o.anime());
    const avant = S.t; S.t += dt;
    for (const e of TL.ev) if (avant < e.debut && S.t >= e.debut && e.bulle) dire(e.bulle());
    if (S.jusqua != null && S.t >= S.jusqua) {
      S.t = S.jusqua; S.jusqua = null; S.running = false;
      if (S.t >= TL.M.fin - 1e-6) { finir(); return true; }
      S.pause = true; etiquette(); dire('Arrêt sur image : ' + (S.motif || `t = ${fx(S.t, 1)} s`) + '.');
      noter('pause', { time_s: +S.t.toFixed(2) }); emettre(); return true;
    }
    if (S.t >= TL.M.fin) { S.t = TL.M.fin; finir(); return true; }
    if (performance.now() - S.emis > 500) { S.emis = performance.now(); emettre(); }
    return true;
  };
  function finir() { S.running = false; S.fait = true; S.pause = false; S.jusqua = null; etiquette(); dire(o.messageFin(M), 'good'); noter('measurement', o.params(M)); emettre(); }
  function start() { o.reprise && o.reprise(); S.t = 0; S.jusqua = null; S.motif = ''; S.running = true; S.pause = false; S.fait = false; etiquette(); dire(o.depart(M)); noter('start', o.params(M)); emettre(); }
  function pause() { if (!S.running) return; S.running = false; S.pause = true; S.jusqua = null; etiquette(); dire('Arrêt sur image.'); noter('pause', { time_s: +S.t.toFixed(2) }); emettre(); }
  function resume() { if (S.running) return; o.reprise && o.reprise(); if (!S.pause) return start(); S.running = true; S.pause = false; etiquette(); dire('Ça repart…'); noter('resume'); emettre(); }
  function setTime(p) {
    const t = +p.time_s; if (p.time_s === null || p.time_s === '' || !Number.isFinite(t)) return;
    o.reprise && o.reprise(); S.running = false; S.jusqua = null; S.t = clamp(t, 0, TL.M.fin); S.fait = S.t >= TL.M.fin - 1e-6; S.pause = !S.fait && S.t > 0;
    etiquette(); scene.sale = true; dire(`Arrêt sur image : t = ${fx(S.t, 1)} s.`); noter('set_time', { time_s: S.t }); emettre();
  }
  function playUntil(p) {
    const noms = o.etapes(S.vue).map(e => e.nom).concat('fin');
    const nom = noms.includes(p.moment) ? p.moment : null, cible = nom ? TL.M[nom] : +p.time_s;
    if (!Number.isFinite(cible) || (p.moment && !nom && (p.time_s == null || p.time_s === ''))) { dire(`Moment inconnu : ${p.moment}.`, 'bad'); emettre(); return; }
    o.reprise && o.reprise();
    if (S.fait || S.t >= cible - 1e-3) { S.t = 0; S.fait = false; }
    S.jusqua = clamp(cible, .01, TL.M.fin); S.motif = nom ? (o.motifs[nom] || nom) : ''; S.running = true; S.pause = false; etiquette(); dire('Observe…');
    noter('play_until', { moment: nom, time_s: S.jusqua }); emettre();
  }
  function setParameters(p) {
    p = p || {};
    const r = o.appliquer(p, M) || {};
    if (r.vue && o.vues.includes(r.vue) && r.vue !== S.vue) { S.vue = r.vue; r.change = true; r.vueChange = true; }
    if (r.change) { calculer(); if (r.vueChange) scene.reecrire(); }
    noter('set_parameters', o.params(M));
    if (r.apres) r.apres();
    else if (r.change && !r.garder) start();
    else { scene.sale = true; emettre(); }
  }
  Object.assign(M, { noter, calculer, dire, start, pause, resume, setTime, playUntil, setParameters, emettre, etiquette });
  $('run').onclick = () => (S.running ? pause() : S.pause ? resume() : start());
  window.Tableau.explication(o.explications);
  const commandes = ['start', 'reset', 'pause', 'resume', 'set_time', 'set_parameters', 'play_until'];
  M.lancer = () => {
    calculer();
    const listeMoments = o.vues.map(v => `${o.vues.length > 1 ? v + ' : ' : ''}${o.etapes(v).map(e => e.nom).concat('fin').join(' | ')}`).join(' ; ');
    const config = { id: o.id, version: '1.0', title: o.titre, variants: o.vues.length > 1 ? o.vues.map(id => ({ id, label: o.titres[id] })) : [], commands: commandes,
      command_schema: { set_parameters: o.schema, set_time: { time_s: '0..fin (arrêt sur cet instant de la scène, en s ; voir moments)' },
        play_until: { moment: listeMoments, time_s: 'ou un instant en s' } } };
    pont = protocole({ id: o.id, commandes, config, texte: o.texte,
      etat: () => ({ simulation_status: S.running ? 'running' : S.fait ? 'finished' : S.pause ? 'paused' : 'idle',
        ce_qui_se_voit: o.voir(M) + (S.dit ? ` La bulle dit : « ${S.dit} »` : ''), current_variant: S.vue, time_s: +S.t.toFixed(2),
        parameters: o.params(M), moments: Object.fromEntries(Object.entries(TL.M).map(([k, v]) => [k, +v.toFixed(2)])) }),
      progression: () => (S.fait ? 1 : 0),
      executer: (cmd, p) => ({ start, reset: start, pause, resume, set_time: () => setTime(p), set_parameters: () => setParameters(p), play_until: () => playUntil(p) })[cmd]?.() });
    dire(o.depart(M));
    setTimeout(() => { if (!S.running && S.t === 0 && !S.pause && !S.fait) start(); }, 900);
  };
  return M;
}

/* ── Appareils peints (règle 7 : ils ressemblent aux vrais ; le peint ne change jamais la physique) ── */
const Peint = {
  sphere(...a) { return window.Lexique.physique.sphere(...a); },
  generateur(...a) { return window.Lexique.physique.generateur(...a); },
  borne(...a) { return window.Lexique.physique.borne(...a); },
  cadran(...a) { return window.Lexique.physique.cadran(...a); },
  chimique(...a) { return window.Lexique.physique.chimique(...a); },
  resistor(...a) { return window.Lexique.physique.resistor(...a); },
  levier(...a) { return window.Lexique.physique.levier(...a); },
  plot(...a) { return window.Lexique.physique.plot(...a); },
};
/* ── Rappels des années précédentes (règle 34 du professeur : on part de zéro, chaque notion dite deux fois, de deux façons) ──
 * Vues (?vue=) et moments (play_until) :
 *  - courant      : circuit, ferme, sens, amperemetre, eau            (le courant = des charges qui circulent ; l’eau dans un tuyau)
 *  - tension      : circuit, fleche, voltmetre, niveaux, fil          (la tension entre deux points ; deux réservoirs à deux hauteurs)
 *  - ohm          : montage, mesure_1, mesure_2, droite, convention   (u_R = R·i ; curseur R)
 *  - additivite   : circuit, tensions, somme, escalier                (u_R + u_C = E ; curseur u_C ; l’escalier)
 *  - puissances   : milli, micro, nano, exemple, decoupe              (10⁻³, 10⁻⁶, 10⁻⁹ ; la virgule qui recule)
 *  - derivee      : courbe, corde, tangente, pente_nulle, voiture     (la dérivée = la pente de la tangente ; le compteur de vitesse)
 *  - exponentielle: depart, tau, jamais_zero, montee, reservoir       (e^(−t/τ) : 1, 0,37, jamais 0 ; 1 − e^(−t/τ) ; le réservoir qui se vide)
 *  - sinusoide    : cercle, courbe, amplitude, periode, balancoire    (U_m·cos(2πt/T) ; la balançoire)
 * set_parameters : vue ; R_ohm (ohm, 50..200) ; u_C_V (additivite, 0..6) ; t_s (derivee 0..10, exponentielle 0..5) ; T_ms (sinusoide, 2..8).
 * Les dessins des objets réels (pile, lampe, appareils, voiture, réservoir, balançoire) sont peints (règle 32) ; la craie garde
 * fils, flèches, axes, valeurs et phrases. Le peint ne change jamais les valeurs (i, u, pentes, e^(−t/τ) sont exacts).
 */
Peint.lampe = function (ctx, cx, yf, eclat = 0, a = 1) {
  const e = clamp(eclat, 0, 1), gy = yf - 30, R = 14;
  ctx.save(); ctx.globalAlpha = a;
  if (e > .01) {
    const h = ctx.createRadialGradient(cx, gy, 2, cx, gy, R + 50 * Math.sqrt(e));
    h.addColorStop(0, `rgba(255,236,160,${.75 * e})`); h.addColorStop(.35, `rgba(255,214,110,${.32 * e})`); h.addColorStop(1, 'rgba(255,200,90,0)');
    ctx.fillStyle = h; ctx.beginPath(); ctx.arc(cx, gy, R + 50 * Math.sqrt(e), 0, 7); ctx.fill();
  }
  const gs = ctx.createLinearGradient(0, yf - 9, 0, yf + 9); gs.addColorStop(0, '#4a5058'); gs.addColorStop(1, '#1d2125');
  ctx.fillStyle = gs; ctx.beginPath(); ctx.roundRect(cx - 21, yf - 8, 42, 16, 4); ctx.fill();
  Peint.plot(ctx, cx - 21, yf, a); Peint.plot(ctx, cx + 21, yf, a);
  const gc = ctx.createLinearGradient(cx - 7, 0, cx + 7, 0); gc.addColorStop(0, '#7d7a6e'); gc.addColorStop(.5, '#e4e0d0'); gc.addColorStop(1, '#6c695e');
  ctx.fillStyle = gc; ctx.fillRect(cx - 7, yf - 19, 14, 11);
  const gv = ctx.createRadialGradient(cx - 4, gy - 5, 1, cx, gy, R);
  gv.addColorStop(0, `rgba(255,255,255,${.55 + .4 * e})`); gv.addColorStop(.6, `rgba(${200 + 55 * e},${215 + 30 * e},${230 - 70 * e},${.18 + .55 * e})`); gv.addColorStop(1, `rgba(190,205,220,${.28 + .4 * e})`);
  ctx.fillStyle = gv; ctx.beginPath(); ctx.arc(cx, gy, R, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(230,240,255,.55)'; ctx.lineWidth = 1; ctx.stroke();
  const f = e < .3 ? [120 + 400 * e, 70 + 100 * e, 60] : [255, 150 + 105 * Math.min(1, (e - .3) / .7), 60 + 150 * Math.min(1, (e - .3) / .7)];
  ctx.strokeStyle = `rgb(${f.map(Math.round).join(',')})`; ctx.lineWidth = 1.3 + e;
  if (e > .05) { ctx.shadowColor = 'rgba(255,230,150,.9)'; ctx.shadowBlur = 10 * e; }
  ctx.beginPath(); ctx.moveTo(cx - 5, yf - 19); ctx.lineTo(cx - 5, gy + 2);
  for (let k = 0; k <= 6; k++) ctx.lineTo(cx - 5 + k * 10 / 6, gy + (k % 2 ? -3 : 2));
  ctx.lineTo(cx + 5, yf - 19); ctx.stroke(); ctx.shadowBlur = 0;
  ctx.restore();
};
/** Pile ronde (debout) : corps cuivré et noir, capuchon « + » en haut. */
Peint.pile = function (ctx, x, y, w, h, a = 1) {
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.roundRect(x + 3, y + 4, w, h, 5); ctx.fill();
  const g = ctx.createLinearGradient(x, 0, x + w, 0); g.addColorStop(0, '#2a2a2a'); g.addColorStop(.45, '#5a5a5a'); g.addColorStop(1, '#151515');
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(x, y + h * .3, w, h * .7, [0, 0, 5, 5]); ctx.fill();
  const g2 = ctx.createLinearGradient(x, 0, x + w, 0); g2.addColorStop(0, '#8a4b12'); g2.addColorStop(.45, '#e39a3b'); g2.addColorStop(1, '#6b3609');
  ctx.fillStyle = g2; ctx.beginPath(); ctx.roundRect(x, y, w, h * .3, [5, 5, 0, 0]); ctx.fill();
  ctx.fillStyle = '#b9bec4'; ctx.fillRect(x + w * .32, y - 6, w * .36, 6);
  ctx.fillStyle = '#fff'; ctx.font = `700 ${Math.round(w * .5)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('+', x + w / 2, y + h * .16); ctx.fillText('−', x + w / 2, y + h * .82);
  ctx.restore();
};
/** Voiture vue de côté (carrosserie rouge, vitres, roues). */
Peint.voiture = function (ctx, x, y, a = 1) {
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(x + 30, y + 20, 32, 4, 0, 0, 7); ctx.fill();
  const g = ctx.createLinearGradient(0, y - 18, 0, y + 14); g.addColorStop(0, '#ff7a6b'); g.addColorStop(.5, '#d62f22'); g.addColorStop(1, '#7c140c');
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x, y + 12); ctx.lineTo(x, y); ctx.lineTo(x + 14, y - 2); ctx.lineTo(x + 22, y - 14); ctx.lineTo(x + 44, y - 14); ctx.lineTo(x + 52, y - 2); ctx.lineTo(x + 62, y); ctx.lineTo(x + 62, y + 12); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(190,225,255,.85)'; ctx.beginPath(); ctx.moveTo(x + 18, y - 2); ctx.lineTo(x + 24, y - 11); ctx.lineTo(x + 32, y - 11); ctx.lineTo(x + 32, y - 2); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + 35, y - 2); ctx.lineTo(x + 35, y - 11); ctx.lineTo(x + 42, y - 11); ctx.lineTo(x + 48, y - 2); ctx.closePath(); ctx.fill();
  for (const rx of [x + 14, x + 48]) Peint.sphere(ctx, rx, y + 12, 7, ['#8a8f96', '#2a2d31', '#050607']);
  ctx.restore();
};
/** Eau dans un récipient : tranche peinte (claire en surface, foncée en profondeur). */
function eau(ctx, x, y, w, h) {
  if (h <= 0) return;
  const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, 'rgba(110,190,255,.85)'); g.addColorStop(1, 'rgba(20,80,170,.9)');
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = 'rgba(230,245,255,.9)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.stroke();
}
function verre(ctx, x, y, w, h) {
  ctx.save(); ctx.strokeStyle = 'rgba(220,235,250,.75)'; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(x + 3, y + 4, 4, h - 8); ctx.restore();
}

const VUES = ['courant', 'tension', 'ohm', 'additivite', 'puissances', 'derivee', 'exponentielle', 'sinusoide', 'derivee_cos'];
const TITRES = {
  courant: 'le courant électrique', tension: 'la tension électrique', ohm: 'la loi d’Ohm', additivite: 'la loi d’additivité des tensions',
  puissances: 'les puissances de dix', derivee: 'la dérivée : la pente', exponentielle: 'la fonction exponentielle', sinusoide: 'la sinusoïde', derivee_cos: 'la dérivée d’un cosinus',
};
const P = { R: 100, uC: 4, t: 1, T: 4 };
/* ?dipole=bobine (vue additivite, cours du dipôle RL) : la bobine remplace le condensateur ; u_b remplace u_C (u_C_V ou u_b_V). */
const BOB = new URLSearchParams(location.search).get('dipole') === 'bobine', UX = BOB ? 'u_b' : 'u_C', NX = BOB ? 'bobine' : 'C';
Peint.bobine = function (ctx, x, y, w, h) {
  ctx.save();
  const g = ctx.createLinearGradient(x, 0, x + w, 0); g.addColorStop(0, '#5a5f66'); g.addColorStop(.5, '#aab1b9'); g.addColorStop(1, '#4a4f55');
  ctx.fillStyle = g; ctx.fillRect(x + w * .2, y, w * .6, h);
  for (let k = 0; k < 9; k++) { const yy = y + 4 + k * (h - 8) / 8, gc = ctx.createLinearGradient(x, 0, x + w, 0); gc.addColorStop(0, '#7a3d12'); gc.addColorStop(.45, '#f0a35a'); gc.addColorStop(1, '#6b3209');
    ctx.strokeStyle = gc; ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(x + w / 2, yy, w / 2, 3.2, 0, 0, Math.PI); ctx.stroke(); }
  ctx.restore();
};
const ETAPES = {
  courant: [
    { nom: 'circuit', anim: .8, motif: 'le circuit : pile, interrupteur K, lampe, ampèremètre ; K ouvert', bulle: () => 'Un circuit simple, K ouvert : rien ne passe.' },
    { nom: 'ferme', anim: 3.2, motif: 'K fermé : les électrons circulent, la lampe brille', bulle: () => 'On ferme K…' },
    { nom: 'sens', anim: 1, motif: 'le sens de i : du + vers le − à l’extérieur de la pile', bulle: () => 'Dans quel sens ?' },
    { nom: 'amperemetre', anim: 1.6, motif: 'l’ampèremètre, en série, mesure i = 0,2 A', bulle: () => 'Combien de courant ?' },
    { nom: 'eau', anim: 3.2, motif: 'comme l’eau dans un tuyau : i = la charge qui passe en une seconde', bulle: () => 'Une autre façon de le voir…' },
  ],
  tension: [

/** La balançoire : portique en bois (poutres veinées, pieds en A), deux cordes, siège en bois ; `a` = angle (rad). */
function peindreBalancoire(ctx, ox, oy, a) {
  const bois = (x0, y0, x1, y1) => { const g = ctx.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, '#9a6a3a'); g.addColorStop(.45, '#d39a5c'); g.addColorStop(1, '#5e3b1c'); return g; };
  ctx.save(); ctx.lineCap = 'round';
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 6; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 3;
  for (const s of [-1, 1]) {           // pieds en A
    ctx.strokeStyle = bois(ox + s * 50, oy, ox + s * 70, oy); ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(ox + s * 58, oy); ctx.lineTo(ox + s * 50, oy + 92); ctx.moveTo(ox + s * 62, oy); ctx.lineTo(ox + s * 72, oy + 92); ctx.stroke();
  }
  ctx.fillStyle = bois(0, oy - 5, 0, oy + 4); ctx.beginPath(); ctx.roundRect(ox - 70, oy - 5, 140, 9, 3); ctx.fill();
  ctx.shadowColor = 'transparent';
  const sx = ox + 70 * Math.sin(a), sy = oy + 70 * Math.cos(a);
  ctx.strokeStyle = '#e4d3a8'; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(ox - 10, oy + 3); ctx.lineTo(sx - 13 * Math.cos(a), sy + 13 * Math.sin(a)); ctx.moveTo(ox + 10, oy + 3); ctx.lineTo(sx + 13 * Math.cos(a), sy - 13 * Math.sin(a)); ctx.stroke();
  ctx.translate(sx, sy); ctx.rotate(-a);
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 5; ctx.shadowOffsetY = 3;
  ctx.fillStyle = bois(0, -3, 0, 6); ctx.beginPath(); ctx.roundRect(-19, -3, 38, 8, 2); ctx.fill();
  ctx.restore();
  Peint.sphere(ctx, ox - 10, oy + 1, 2.5, ['#ffffff', '#9aa3ad', '#333a42']); Peint.sphere(ctx, ox + 10, oy + 1, 2.5, ['#ffffff', '#9aa3ad', '#333a42']);
}
const SC = { cx: 100, cy: 150, r: 70 }, SG = { x0: 210, x1: 735, y0: 230, a: 100 };
function vueSinus(c, M) {
  const T = P.T, msPx = (SG.x1 - SG.x0 - 20) / (2.2 * T);
  const tx = t => SG.x0 + t * msPx, ty = u => SG.y0 - u / 6 * SG.a;
  c.direct(() => peindreRoue(c.ctx));
  c.cercle(SC.cx, SC.cy, SC.r, { couleur: 'faible', largeur: 1.6 });
  c.fleche(SG.x0, SG.y0, SG.x1, SG.y0, { couleur: 'faible', largeur: 1.6 }); c.fleche(SG.x0, SG.y0 + SG.a + 20, SG.x0, SG.y0 - SG.a - 30, { couleur: 'faible', largeur: 1.6 });
  c.texte('t (ms)', SG.x1, SG.y0 + 20, { couleur: 'faible', taille: 14, align: 'right' }); c.texte('u (V)', SG.x0 + 8, SG.y0 - SG.a - 22, { couleur: 'faible', taille: 14 });
  // Le temps tracé : un tour pendant « courbe », un deuxième pendant « periode ».
  let tt = 0;
  if (M.commence('courbe')) tt = T * M.p('courbe');
  if (M.commence('periode')) tt = T + T * M.p('periode');
  const th = 2 * Math.PI * tt / T, px = SC.cx + SC.r * Math.sin(th), py = SC.cy - SC.r * Math.cos(th);
  c.direct(() => {
    const ctx = c.ctx;
    // Le rayon qui tourne, et une traînée lumineuse derrière le point (le chemin déjà parcouru).
    ctx.save(); ctx.strokeStyle = 'rgba(248,113,113,.55)'; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(SC.cx, SC.cy); ctx.lineTo(px, py); ctx.stroke();
    if (tt > 0) {
      const n = 24, d = Math.min(th, 1.6);
      for (let k = 0; k < n; k++) {
        const a0 = th - d * (k + 1) / n, a1 = th - d * k / n;
        ctx.strokeStyle = `rgba(248,113,113,${.5 * (1 - k / n)})`; ctx.lineWidth = 6 * (1 - k / n) + 1;
        ctx.beginPath(); ctx.arc(SC.cx, SC.cy, SC.r, a0 - Math.PI / 2, a1 - Math.PI / 2); ctx.stroke();
      }
      // Lueur douce sous la courbe tracée.
      ctx.shadowColor = 'rgba(248,113,113,.8)'; ctx.shadowBlur = 10; ctx.strokeStyle = 'rgba(248,113,113,.35)'; ctx.lineWidth = 5; ctx.beginPath();
      for (let i = 0; i <= 120; i++) { const u = i / 120, X = tx(u * tt), Y = ty(6 * Math.cos(2 * Math.PI * u * tt / T)); i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }
      ctx.stroke();
    }
    ctx.restore();
    ctx.save(); ctx.shadowColor = 'rgba(248,113,113,.9)'; ctx.shadowBlur = 12;
    Peint.sphere(ctx, px, py, 8, ['#ffe0e0', '#e04848', '#6d1010']); ctx.restore();
    c.ligne(px, py, tx(tt), ty(6 * Math.cos(th)), { couleur: 'tresfaible', pointille: [3, 5], tremble: 0 });
    if (tt > 0) c.courbe(u => [tx(u * tt), ty(6 * Math.cos(2 * Math.PI * u * tt / T))], 120, { couleur: 'rouge', largeur: 2.8, tremble: 0 });
    c.point(tx(tt), ty(6 * Math.cos(th)), 4.5, 'rouge');
  });
  c.repere('cercle', SC.cx - SC.r - 10, SC.cy - SC.r - 10, 2 * SC.r + 20, 2 * SC.r + 20, 'le point qui tourne sur le cercle');
  c.repere('courbe', SG.x0, SG.y0 - SG.a - 10, SG.x1 - SG.x0, 2 * SG.a + 20, 'la courbe u = U_m·cos(2πt/T)');
  M.etape(c, 'courbe', () => c.texte('u = U_m·cos(⟦2πt|T⟧)', 520, 60, { couleur: 'rouge', taille: 20, align: 'center' }));
  M.etape(c, 'amplitude', () => {
    c.ligne(SG.x0, ty(6), SG.x1 - 20, ty(6), { couleur: 'jaune', pointille: [4, 6] }); c.ligne(SG.x0, ty(-6), SG.x1 - 20, ty(-6), { couleur: 'jaune', pointille: [4, 6] });
    c.cote(SG.x0 + 18, SG.y0, SG.x0 + 18, ty(6), null, { couleur: 'jaune' });
    c.texte('U_m = 6 V', tx(T / 2), ty(2) + 6, { couleur: 'jaune', taille: 16, align: 'center' }); c.texte('−U_m', SG.x0 - 6, ty(-6) + 5, { couleur: 'jaune', taille: 14, align: 'right' });
    c.texte('U_m : l’amplitude, la hauteur d’un sommet à partir de 0', 470, 366, { couleur: 'jaune', taille: 15, align: 'center', max: 520 });
    c.repere('amplitude', SG.x0, ty(6) - 10, 160, SG.a + 20, 'U_m, l’amplitude');   // « U_m = 6 V » écrit dans le creux de la courbe, plus sur elle
  });
  M.etape(c, 'periode', () => {
    c.cote(tx(0), ty(6) - 14, tx(T), ty(6) - 14, null, { couleur: 'vert' });
    c.texte(`T = ${fx(T, 1)} ms`, tx(T / 2), ty(6) - 24, { couleur: 'vert', taille: 16, align: 'center' });
    c.texte('T : la période, la durée entre deux sommets successifs (un tour)', 470, 389, { couleur: 'vert', taille: 15, align: 'center', max: 520 });
    c.repere('periode', tx(0), ty(6) - 44, tx(T) - tx(0), 40, 'T, la période');
  });
  if (M.commence('balancoire')) {
    const p = M.p('balancoire'), a = .5 * Math.cos(2 * Math.PI * p * 2), ox = 100, oy = 256;
    c.direct(() => {
      peindreBalancoire(c.ctx, ox, oy, a);
    });
    c.texte('la balançoire va et vient : même amplitude, même période', 470, 412, { couleur: 'bleu', taille: 15, align: 'center', max: 520 });
    c.repere('balancoire', 30, 250, 140, 100, 'la balançoire qui va et vient');
  }
}


/* Dérivée d'un cosinus : f(t) = cos(2πt/T) (T = 4 ms), f′(t) = −(2π/T)·sin(2πt/T), tracée à l'échelle de sa propre amplitude. */
const DC = { x0: 60, x1: 735, yf: 150, yd: 311, a: 56, T: 4, tmax: 8.6 };   // a 56, yd 311 : la place de f′(t) écrite en fractions (deux étages) entre les deux courbes
const dcx = t => DC.x0 + t / DC.tmax * (DC.x1 - DC.x0 - 20);
function vueDcos(c, M) {
  const T = DC.T, w = 2 * Math.PI / T, f = t => Math.cos(w * t), fp = t => -Math.sin(w * t);
  c.fleche(DC.x0, DC.yf, DC.x1, DC.yf, { couleur: 'faible', largeur: 1.4 }); c.fleche(DC.x0, DC.yf + DC.a + 12, DC.x0, DC.yf - DC.a - 22, { couleur: 'faible', largeur: 1.4 });
  c.texte('t (ms)', DC.x1, DC.yf + 18, { couleur: 'faible', taille: 13, align: 'right' });
  const pc = M.p('courbe');
  if (pc > 0) c.direct(() => c.courbe(u => [dcx(u * DC.tmax * pc), DC.yf - DC.a * f(u * DC.tmax * pc)], 160, { couleur: 'rouge', largeur: 2.8, tremble: 0 }));
  M.etape(c, 'courbe', () => c.texte('f(t) = cos(⟦2πt|T⟧)', 520, 46, { couleur: 'rouge', taille: 19, align: 'center' }));
  c.repere('courbe', DC.x0, DC.yf - DC.a - 10, DC.x1 - DC.x0, 2 * DC.a + 20, 'la courbe du cosinus');
  const tangente = (t, coul) => {
    const x = dcx(t), y = DC.yf - DC.a * f(t), pente = -DC.a * w * fp(t) / ((DC.x1 - DC.x0 - 20) / DC.tmax), L = 55 / Math.sqrt(1 + pente * pente);
    c.ligne(x - L, y - pente * L, x + L, y + pente * L, { couleur: coul, largeur: 2.4, tremble: 0 });
    c.point(x, y, 5, coul);
  };
  M.etape(c, 'sommet', () => {
    c.direct(() => tangente(T, 'jaune'));
    c.texte('au sommet : tangente horizontale, pente nulle', dcx(T) + 14, DC.yf - DC.a - 14, { couleur: 'jaune', taille: 14 });
    c.repere('sommet', dcx(T) - 60, DC.yf - DC.a - 30, 120, 40, 'le sommet : pente nulle');
  });
  M.etape(c, 'descente', () => {
    c.direct(() => tangente(T / 4 + T, 'vert'));
    c.texte('en passant par 0 : pente la plus forte', dcx(1.25 * T) + 86, DC.yf - 50, { couleur: 'vert', taille: 14, align: 'center' });   // à droite du point, au-dessus de l’axe : ni sur la courbe ni sur la tangente
    c.repere('descente', dcx(1.25 * T) - 40, DC.yf - 40, 80, 80, 'le passage par zéro : la pente la plus forte');
  });
  if (M.commence('derivee')) {
    const pd = M.p('derivee');
    c.fleche(DC.x0, DC.yd, DC.x1, DC.yd, { couleur: 'faible', largeur: 1.4 }); c.fleche(DC.x0, DC.yd + DC.a + 10, DC.x0, DC.yd - DC.a - 12, { couleur: 'faible', largeur: 1.4 });
    c.direct(() => c.courbe(u => [dcx(u * DC.tmax * pd), DC.yd - DC.a * fp(u * DC.tmax * pd)], 160, { couleur: 'cyan', largeur: 2.6, tremble: 0 }));
    c.repere('derivee', DC.x0, DC.yd - DC.a - 10, DC.x1 - DC.x0, 2 * DC.a + 20, 'la courbe de la dérivée (la pente du cosinus)');
  }
  // écrite comme dans le cahier (fractions sur deux étages) : elle tient entre le creux du cosinus et la bosse de la dérivée
  M.etape(c, 'derivee', () => c.texte('f’(t) = −⟦2π|T⟧·sin(⟦2πt|T⟧)', 520, DC.yd - DC.a - 17, { couleur: 'cyan', taille: 18, align: 'center' }));
  M.etape(c, 'decalage', () => {
    for (const t of [T, 2 * T]) c.ligne(dcx(t), DC.yf - DC.a, dcx(t), DC.yd, { couleur: 'jaune', largeur: 1.2, pointille: [4, 5] });
    // « T/4 » écrit en fraction (deux étages) : posé un peu plus haut pour que son étage du bas ne touche pas la cote
    c.cote(dcx(T), DC.yd + DC.a + 16, dcx(1.25 * T), DC.yd + DC.a + 16, '', { couleur: 'jaune' });
    c.texte('⟦T|4⟧', (dcx(T) + dcx(1.25 * T)) / 2, DC.yd + DC.a + 4, { couleur: 'jaune', taille: 14, align: 'center' });
    c.texte('la dérivée : la même sinusoïde, décalée d’un quart de période', 380, 410, { couleur: 'jaune', taille: 15, align: 'center', max: 700 });
    c.repere('decalage', dcx(T) - 10, DC.yd + DC.a, dcx(1.25 * T) - dcx(T) + 20, 40, 'le décalage d’un quart de période');
  });
  if (M.S.libre) c.direct(() => { const t = clamp(P.t, 0, 8); tangente(t, 'rose'); c.texte(`pente en t = ${fx(t, 1)} ms : ${fx(-w * Math.sin(w * t), 2)}`, 380, 386, { couleur: 'rose', taille: 15, align: 'center' }); });
}

function voir(M) {

  etapes: v => ETAPES[v], motifs: MOTIFS_PROXY, dessiner, voir, params,

    ohm: 'u_R = R·i : la tension est proportionnelle à l’intensité.', additivite: `En série : u_R + ${UX} = E.`, puissances: 'milli 10⁻³, micro 10⁻⁶, nano 10⁻⁹.',
    derivee: 'La dérivée en un point : la pente de la tangente.', exponentielle: 'e^(−t/τ) : 1 au départ, 0,37 à τ, jamais 0.', sinusoide: 'U_m : l’amplitude ; T : la période.', derivee_cos: 'La dérivée de cos(2πt/T) : −(2π/T)·sin(2πt/T).' })[M.S.vue],

  },
  schema: { vue: VUES.join(' | '), R_ohm: '50..200 (pas de 50 ; vue ohm)', u_C_V: '0..6 (vue additivite : u_R = 6 − u_C)', u_b_V: '0..6 (vue additivite avec ?dipole=bobine : u_R = 6 − u_b)', t_s: '0..10 (vue derivee : place le point M) ; 0..5 en τ (vue exponentielle)', T_ms: '2..8 (vue sinusoide, relance)', t_ms: '0..8 (vue derivee_cos : tangente en ce point)' },
  texte: 'Rappels des années précédentes, chacun en deux façons : le courant (des électrons qui circulent ; l’eau dans un tuyau), la tension (entre deux points ; deux réservoirs à deux hauteurs), la loi d’Ohm (u_R = R·i, droite par l’origine, convention récepteur), l’additivité (u_R + u_C = E ; l’escalier), les puissances de dix (milli, micro, nano ; la virgule qui recule), la dérivée (la pente de la tangente ; le compteur de vitesse), l’exponentielle (e^(−t/τ) : 1, 0,37 à τ, jamais 0 ; le réservoir qui se vide), la sinusoïde (U_m, T ; la balançoire).',

    derivee: [{ repere: 'tangente', texte: 'La dérivée en M est la pente de la tangente.' }, { repere: 'compteur', texte: 'Le compteur de vitesse montre la pente de d(t).' }],
    exponentielle: [{ repere: 'courbe_descend', texte: 'e^(−t/τ) part de 1 et descend.' }, { repere: 'point_tau', texte: 'À τ, il reste 0,37.' }, { repere: 'reservoir', texte: 'Comme un réservoir qui se vide.' }],
    sinusoide: [{ repere: 'amplitude', texte: 'U_m : la hauteur d’un sommet.' }, { repere: 'periode', texte: 'T : la durée d’un tour.' }, { repere: 'balancoire', texte: 'Comme une balançoire.' }],
    derivee_cos: [{ repere: 'sommet', texte: 'Au sommet, la pente est nulle.' }, { repere: 'descente', texte: 'Au passage par 0, la pente est la plus forte.' }, { repere: 'decalage', texte: 'La dérivée : la même sinusoïde, décalée d’un quart de période.' }],

});
MOT.lancer();

  additivite: () => window.Tableau.curseur({ id: 'uC', label: `${UX} =`, min: 0, max: 6, step: .5, valeur: P.uC, unite: 'V', decimales: 1, commande: 'set_parameters', onchange: v => MOT.setParameters({ u_C_V: v }) }),
  derivee: () => window.Tableau.curseur({ id: 't', label: 't =', min: 0, max: 10, step: .5, valeur: P.t, unite: 's', decimales: 1, commande: 'set_parameters', onchange: v => MOT.setParameters({ t_s: v }) }),
  derivee_cos: () => window.Tableau.curseur({ id: 't', label: 't =', min: 0, max: 8, step: .25, valeur: 1, unite: 'ms', decimales: 2, commande: 'set_parameters', onchange: v => MOT.setParameters({ t_ms: v }) }),
  exponentielle: () => window.Tableau.curseur({ id: 't', label: 't/τ =', min: 0, max: 5, step: .25, valeur: P.t, decimales: 2, commande: 'set_parameters', onchange: v => MOT.setParameters({ t_s: v }) }),
};
