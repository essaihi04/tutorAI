<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carte du chapitre — noyaux, masse et énergie</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="nucleaire.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Carte conceptuelle dessinée à la craie : « Noyaux, masse et énergie » au centre (la masse peut devenir énergie : E = m·c²), huit branches autour (masse et énergie, défaut de masse, énergie de liaison, stabilité, fission et fusion, énergie libérée par les masses, énergie libérée par les énergies de liaison, échantillon)"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start reset play_until">Redessiner</button>
    <button class="craie-btn secondaire" id="imprimer" title="Imprimer ou enregistrer en PDF">🖨️ Imprimer / PDF</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="commun.js"></script>
<script src="exposants.js"></script>
<script src="/media/simulations/shared/tableau/imprimer.js"></script>
<script>
/*
 * La carte conceptuelle du cours « Noyaux, masse et énergie » (phys_ch5_energie_nucleaire), même forme que
 * ondes-lumineuses-tableau/carte.html. Au centre « Noyaux, masse et énergie » ; sa phrase (« la masse peut devenir
 * énergie : E = m·c² ») s’écrit sous le titre au moment `definition`. Puis huit branches dessinées l’une après l’autre
 * au rythme de la voix (play_until {moment: <branche>}) : masse_energie, defaut, liaison, stabilite, reactions,
 * bilan_masses, bilan_liaison, echantillon. Une branche sautée (la voix est déjà plus loin) s’écrit d’un coup ; celle
 * qu’on dit s’écrit à cet instant. Chaque branche porte sa notion et sa formule (indices rendus : « E_{ℓ} »).
 * L’élève touche une branche : sa phrase s’écrit dans la bulle. Le lecteur donne le bilan de l’élève
 * (set_parameters {lacunes, acquis_ids}) : branches à reprendre entourées en rouge (à revoir : orange), acquises cochées.
 * C9 « rédiger comme le barème » n’a pas de branche propre : elle se lit sur la page 2 du bilan.
 */
const { bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);

const CENTRE = { x: 380, y: 212, w: 220, h: 104, comps: [],
  phrase: 'Noyaux, masse et énergie : la masse peut devenir énergie, E = m·c².' };
const NOEUDS = [
  { id: 'masse_energie', x: 136, y: 72, w: 232, h: 64, couleur: 'cyan', comps: ['C1'], titre: 'Masse et énergie',
    lignes: ['E = m·c² · 1 u = 931,5 MeV/c²', '1 MeV = 1,6·10⁻¹³ J'],
    phrase: 'Toute masse correspond à une énergie : E = m·c². 1 u = 1,66·10⁻²⁷ kg = 931,5 MeV/c² ; 1 MeV = 1,6·10⁻¹³ J.' },
  { id: 'defaut', x: 380, y: 60, w: 212, h: 64, couleur: 'cyan', comps: ['C2'], titre: 'Défaut de masse Δm',
    lignes: ['noyau plus léger que ses nucléons', 'Δm > 0 · N = A − Z'],
    phrase: 'La masse d’un noyau est inférieure à la somme des masses de ses nucléons séparés : Δm = Z·mₚ + (A − Z)·mₙ − m(ᴬZX) > 0.' },
  { id: 'liaison', x: 626, y: 72, w: 228, h: 64, couleur: 'jaune', comps: ['C3'], titre: 'Énergie de liaison',
    lignes: ['E_{ℓ} = Δm·c²', 'E_{ℓ}/A en MeV/nucléon'],
    phrase: 'L’énergie de liaison Eℓ est l’énergie qu’il faut fournir à un noyau au repos pour le séparer en ses nucléons au repos : Eℓ = Δm·c² ; Eℓ/A en MeV/nucléon.' },
  { id: 'stabilite', x: 640, y: 212, w: 222, h: 64, couleur: 'jaune', comps: ['C4'], titre: 'Stabilité',
    lignes: ['courbe d’Aston −E_{ℓ}/A = f(A)', 'creux vers le fer (A ≈ 56)'],
    phrase: 'Un noyau est d’autant plus stable que son énergie de liaison par nucléon Eℓ/A est grande ; sur la courbe d’Aston −Eℓ/A = f(A), le creux est vers le fer (A ≈ 56).' },
  { id: 'reactions', x: 626, y: 352, w: 228, h: 80, couleur: 'orange', comps: ['C5'], titre: 'Fission · fusion',
    lignes: ['fission : lourd → deux plus légers', 'fusion : deux légers → un plus lourd', 'Soddy : A et Z conservés'],
    phrase: 'Fission : un noyau lourd frappé par un neutron se scinde en deux noyaux plus légers. Fusion : deux noyaux légers s’unissent en un noyau plus lourd. A et Z se conservent (lois de Soddy).' },
  { id: 'bilan_masses', x: 380, y: 362, w: 244, h: 64, couleur: 'orange', comps: ['C6'], titre: 'Énergie libérée : les masses',
    lignes: ['Δm = Σm(produits) − Σm(réactifs)', 'ΔE = Δm·c² · E_lib = |ΔE|'],
    phrase: 'Δm = Σm(produits) − Σm(réactifs) ; ΔE = Δm·c² ; l’énergie libérée est Elib = |ΔE|. Toutes les particules entrent dans Δm.' },
  { id: 'bilan_liaison', x: 136, y: 352, w: 232, h: 64, couleur: 'vert', comps: ['C7'], titre: 'Énergie libérée : les E_{ℓ}',
    lignes: ['ΔE = Σ E_{ℓ}(réactifs) − Σ E_{ℓ}(produits)', 'diagramme : nucléons séparés en haut'],
    phrase: 'ΔE = Σ Eℓ(réactifs) − Σ Eℓ(produits), avec Eℓ = A·(Eℓ/A) ; sur le diagramme d’énergie, les nucléons séparés sont en haut.' },
  { id: 'echantillon', x: 122, y: 212, w: 204, h: 80, couleur: 'violet', comps: ['C8'], titre: 'Un échantillon',
    lignes: ['N = m·N_A/M', 'E = N·E_lib', 'à masse égale : fusion > fission'],
    phrase: 'Dans un échantillon de masse m : N = m·NA/M noyaux et E = N·Elib. À masse égale, la fusion libère plus d’énergie que la fission.' },
];
const ANNEAUX = { non_acquis: ['rouge', 'à reprendre'], partiel: ['orange', 'à revoir'] };
const AVANT = -1e9;   // instant d'un élément déjà dit : écrit d'un coup

// def : instant où la phrase du centre s'écrit (null = pas encore dite) ; n branches dessinées ; apparu[i] leur instant.
const S = { def: null, n: 0, cible: 0, running: false, lacunes: null, acquis: null, apparu: [], choisi: null };
const DUREE_BRANCHE = 2.6;   // s par branche quand la carte se dessine seule

function statut(comps) {
  if (!S.lacunes || !comps.length) return null;
  const lac = S.lacunes.filter(l => comps.includes(l.id));
  if (lac.some(l => l.statut === 'non_acquis')) return 'non_acquis';
  if (lac.length) return 'partiel';
  return (S.acquis || []).some(a => comps.includes(a)) ? 'acquis' : null;
}
/* Anneau rouge/orange ou coche verte autour d'un cadre (état de l'élève). */
function etat(c, comps, x, y, w, h) {
  const st = statut(comps);
  c.direct(() => {
    if (st && ANNEAUX[st]) {
      const [coul, etiq] = ANNEAUX[st];
      c.rect(x - 6, y - 6, w + 12, h + 12, { couleur: coul, arrondi: 16, largeur: 2, pointille: [6, 6] });
      c.texte(etiq, x + w - 4, y - 9, { couleur: coul, taille: 12, align: 'right' });
    } else if (st === 'acquis') c.texte('✓', x + w - 14, y + 14, { couleur: 'vert', taille: 18 });
  });
}

function branche(c, n) {
  const dx = n.x - CENTRE.x, dy = n.y - CENTRE.y, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
  // du bord du centre au bord de la branche, avec une légère courbure
  const d0 = Math.min(CENTRE.w / 2 / Math.max(.2, Math.abs(ux)), CENTRE.h / 2 / Math.max(.2, Math.abs(uy)));
  const d1 = Math.min(n.w / 2 / Math.max(.2, Math.abs(ux)), n.h / 2 / Math.max(.2, Math.abs(uy)));
  const a = [CENTRE.x + ux * d0, CENTRE.y + uy * d0], b = [n.x - ux * d1, n.y - uy * d1];
  const m = [(a[0] + b[0]) / 2 - uy * 12, (a[1] + b[1]) / 2 + ux * 12];
  c.courbe(u => [(1 - u) * (1 - u) * a[0] + 2 * (1 - u) * u * m[0] + u * u * b[0], (1 - u) * (1 - u) * a[1] + 2 * (1 - u) * u * m[1] + u * u * b[1]], 24, { couleur: 'faible', largeur: 2 });
  const x = n.x - n.w / 2, y = n.y - n.h / 2;
  c.rect(x, y, n.w, n.h, { couleur: n.couleur, arrondi: 14, largeur: 2.4 });
  c.texte(n.titre, n.x, y + 20, { couleur: n.couleur, taille: 16, align: 'center', max: n.w - 16, duree: .8 });
  n.lignes.forEach((l, k) => c.texte(l, n.x, y + 38 + k * 16, { couleur: 'blanc', taille: 13, align: 'center', max: n.w - 14, alpha: .92, duree: 1 }));
  c.repere(n.id, x - 6, y - 6, n.w + 12, n.h + 12, lisible(n.titre));
  etat(c, n.comps, x, y, n.w, n.h);
  if (S.choisi === n.id) c.direct(() => c.rect(x - 3, y - 3, n.w + 6, n.h + 6, { couleur: 'blanc', arrondi: 15, largeur: 1.2, alpha: .6 }));
}

function dessiner(c) {
  const x = CENTRE.x - CENTRE.w / 2, y = CENTRE.y - CENTRE.h / 2;
  if (S.def === AVANT) c.cur = AVANT;   // déjà dit (saut ou retour en arrière) : le centre est écrit d'un coup
  c.rect(x, y, CENTRE.w, CENTRE.h, { couleur: 'jaune', arrondi: 18, largeur: 3 });
  c.texte('Noyaux, masse', CENTRE.x, y + 27, { couleur: 'jaune', taille: 20, align: 'center', gras: true });
  c.texte('et énergie', CENTRE.x, y + 50, { couleur: 'jaune', taille: 20, align: 'center', gras: true });
  c.repere('centre', x, y, CENTRE.w, CENTRE.h, 'le centre : noyaux, masse et énergie');
  c.repere('definition', x, y, CENTRE.w, CENTRE.h, 'la masse peut devenir énergie : E = m·c²');
  const apres = c.cur;   // fin du titre du centre
  if (S.def != null) {
    c.depuis(S.def);
    ['la masse peut devenir énergie :', 'E = m·c²'].forEach((l, k) =>
      c.texte(l, CENTRE.x, y + 72 + k * 17, { couleur: k ? 'jaune' : 'blanc', taille: k ? 15 : 13, align: 'center', max: CENTRE.w - 16, alpha: .92, duree: 1.1 }));
    etat(c, CENTRE.comps, x, y, CENTRE.w, CENTRE.h);
    if (S.choisi === 'centre') c.direct(() => c.rect(x - 3, y - 3, CENTRE.w + 6, CENTRE.h + 6, { couleur: 'blanc', arrondi: 19, largeur: 1.2, alpha: .6 }));
  }
  // chaque branche a sa ligne de temps : elle s'écrit dès que la voix la dit, sans attendre la précédente
  for (let i = 0; i < S.n; i++) { c.cur = S.apparu[i] === AVANT ? AVANT : Math.max(apres, S.apparu[i]); branche(c, NOEUDS[i]); }
  if (S.lacunes) c.direct(() => c.texte('✓ acquis · ⟳ à revoir · ✗ à reprendre', 290, 412, { couleur: 'faible', taille: 12 }));
}

const canvas = $('canvas');
const scene = window.OndesTableau.Scene(canvas, (c) => { scene.cadre(91); dessiner(c); return c.fin(); });
const maintenant = () => (performance.now() - scene.ouvert) / 1000;
/* Texte lisible (bulle, ce_qui_se_voit) : jamais de « _ » ni d'accolade visible. */
const lisible = s => String(s).replace(/_\{([^}]+)\}/g, '$1').replace(/_([A-Za-z0-9]+)/g, '$1');
let horloge = 0;
scene.avancer = dt => {
  if (!S.running) return false;
  horloge += dt;
  if (S.n < S.cible && horloge >= 0) {
    // la branche suivante apparaît quand la précédente a fini de s'écrire
    S.n += 1; S.apparu[S.n - 1] = maintenant(); horloge = -DUREE_BRANCHE;
    bulle($('feedback'), lisible(NOEUDS[S.n - 1].titre) + (S.n >= NOEUDS.length ? ' — la carte est complète.' : ''));
    pont.noter('branche', { n: S.n, moment: NOEUDS[S.n - 1].id }); pont.emettre();
    if (S.n >= S.cible) S.running = false;
  }
  return true;
};
function moments() { const m = { definition: 0 }; NOEUDS.forEach((n, i) => { m[n.id] = i + 1; }); m.fin = NOEUDS.length; m.complet = NOEUDS.length; return m; }
/* Dessine la carte jusqu'à la branche `cible` (0 = la phrase du centre). `pasAPas` : la carte se dessine seule,
 * une branche après l'autre (bouton) ; sinon (la voix) les branches sautées s'écrivent d'un coup et la dernière à cet instant. */
function montrer(cible, par, pasAPas) {
  cible = Math.max(0, Math.min(NOEUDS.length, cible));
  if (cible < S.n) { S.n = 0; S.apparu = []; S.def = null; scene.reecrire(); }   // retour en arrière : on redessine jusque-là
  if (S.def == null) S.def = pasAPas || cible === 0 ? maintenant() : AVANT;
  if (!pasAPas && cible > S.n) {
    for (let i = S.n; i < cible - 1; i++) S.apparu[i] = AVANT;
    S.apparu[cible - 1] = maintenant(); S.n = cible;
    bulle($('feedback'), lisible(NOEUDS[cible - 1].titre) + (cible >= NOEUDS.length ? ' — la carte est complète.' : ''));
  } else if (cible === 0) bulle($('feedback'), 'Au centre : la masse peut devenir énergie, E = m·c².');
  S.cible = cible; S.running = S.n < cible; horloge = pasAPas ? -1.5 : 0; scene.sale = true;
  pont.noter(par || 'play_until', { moment: NOEUDS[cible - 1]?.id || 'definition' }); pont.emettre();
}
function playUntil(p) { const M = moments(); const n = p.moment in M ? M[p.moment] : +p.time_s; if (Number.isFinite(n)) montrer(n, 'play_until'); }
function start() { S.n = 0; S.apparu = []; S.def = null; S.choisi = null; scene.reecrire(); montrer(NOEUDS.length, 'start', true); bulle($('feedback'), 'La carte se dessine…'); }
function setParameters(p) {
  if (Array.isArray(p.lacunes)) S.lacunes = p.lacunes.map(l => ({ id: String(l.id || ''), label: String(l.label || ''), statut: String(l.statut || 'non_acquis') }));
  if (Array.isArray(p.acquis_ids)) S.acquis = p.acquis_ids.map(String);
  scene.sale = true; pont.noter('set_parameters', { lacunes: (S.lacunes || []).length }); pont.emettre();
}
function ceQuiSeVoit() {
  const vues = NOEUDS.slice(0, S.n).map(n => lisible(n.titre));
  const aReprendre = NOEUDS.slice(0, S.n).filter(n => statut(n.comps) && statut(n.comps) !== 'acquis').map(n => lisible(n.titre));
  const etatEleve = S.lacunes ? ` Branches à reprendre : ${aReprendre.join(', ') || 'aucune'}.` : '';
  return `Carte conceptuelle : « Noyaux, masse et énergie » au centre${S.def != null ? ' avec sa phrase (la masse peut devenir énergie : E = m·c²)' : ''}, ${S.n}/${NOEUDS.length} branche(s) dessinée(s)${vues.length ? ' (' + vues.join(', ') + ')' : ''}${S.running ? ', la carte se dessine' : ''}.${etatEleve}${S.choisi ? ` L'élève a touché « ${S.choisi === 'centre' ? 'le centre' : lisible(NOEUDS.find(n => n.id === S.choisi).titre)} ».` : ''}`;
}
$('run').onclick = start;
// Imprimer / PDF : la carte complète, sur fond blanc (shared/tableau/imprimer.js).
$('imprimer').onclick = () => {
  const avant = { n: S.n, cible: S.cible, running: S.running, apparu: S.apparu.slice(), def: S.def, choisi: S.choisi };
  window.Tableau.imprimer({ titre: 'Carte du chapitre — noyaux, masse et énergie', scene,
    pages: [{ nom: 'la carte complète', preparer: () => { S.n = NOEUDS.length; S.running = false; S.def = AVANT; S.apparu = NOEUDS.map(() => AVANT); S.choisi = null; } }],
    restaurer: () => { Object.assign(S, avant); } });
  pont.noter('imprimer', { pages: 1 }); pont.emettre();
};
canvas.addEventListener('pointerdown', e => {
  const r = canvas.getBoundingClientRect(), [x, y] = scene.local(e.clientX - r.left, e.clientY - r.top);
  const n = NOEUDS.slice(0, S.n).find(n => Math.abs(x - n.x) <= n.w / 2 + 6 && Math.abs(y - n.y) <= n.h / 2 + 6);
  if (n) { S.choisi = n.id; bulle($('feedback'), n.phrase); }
  else if (S.def != null && Math.abs(x - CENTRE.x) <= CENTRE.w / 2 && Math.abs(y - CENTRE.y) <= CENTRE.h / 2) { S.choisi = 'centre'; bulle($('feedback'), CENTRE.phrase); }
  else return;
  scene.sale = true; pont.noter('touche', { moment: S.choisi === 'centre' ? 'definition' : S.choisi }); pont.emettre();
});

window.Tableau.explication({ carte: [{ repere: 'centre', texte: CENTRE.phrase }, ...NOEUDS.map(n => ({ repere: n.id, texte: n.phrase }))] });
const commandes = ['start', 'reset', 'play_until', 'set_parameters'];
const config = { id: 'energie_nucleaire_carte', version: '1.0', title: 'Carte du chapitre — noyaux, masse et énergie', variants: [{ id: 'carte', label: 'carte' }], commands: commandes,
  command_schema: { play_until: { moment: Object.keys(moments()).join(' | ') + ' (definition = la phrase du centre ; sinon dessine la carte jusqu’à cette branche ; fin = la carte complète)' },
    set_parameters: { lacunes: '[{id: C1..C9, statut: non_acquis|partiel}] (bilan de l’élève)', acquis_ids: '[C1, ..] compétences acquises' } } };
const pont = protocole({ id: config.id, commandes, config,
  texte: 'Carte conceptuelle du chapitre « Noyaux, masse et énergie » : au centre, la masse peut devenir énergie (E = m·c²) ; huit branches autour (masse et énergie, défaut de masse, énergie de liaison, stabilité et courbe d’Aston, fission et fusion, énergie libérée par les masses, énergie libérée par les énergies de liaison, énergie d’un échantillon).',
  etat: () => ({ simulation_status: S.running ? 'running' : 'paused', ce_qui_se_voit: ceQuiSeVoit(), current_variant: 'carte', time_s: S.n, parameters: { definition: S.def != null, branches: S.n, lacunes: S.lacunes ? S.lacunes.length : null }, moments: moments() }),
  progression: () => S.n / NOEUDS.length,
  executer: (cmd, p) => ({ start, reset: start, play_until: () => playUntil(p), set_parameters: () => setParameters(p) })[cmd]?.() });
bulle($('feedback'), 'Le professeur va dessiner la carte du chapitre.');
window.__carte = { S, scene, NOEUDS, CENTRE };   // pour les vérifications automatiques
</script>
<script src="/media/simulations/professor-locate.js" defer></script>
</body></html>
