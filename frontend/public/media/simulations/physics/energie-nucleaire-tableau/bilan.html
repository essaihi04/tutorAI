<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ce qu'il faut retenir — noyaux, masse et énergie</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="nucleaire.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Fiche de révision écrite à la craie sur une page : pour chaque partie du cours « Noyaux, masse et énergie », la définition à apprendre, les formules encadrées et le piège ; deuxième page : ce que l'élève doit retravailler"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="suiv" data-professor-control="next previous start reset play_until">Ma page →</button>
    <button class="craie-btn secondaire" id="imprimer" title="Imprimer ou enregistrer en PDF">🖨️ Imprimer / PDF</button>
    <span class="lecture" id="page"></span>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="commun.js"></script>
<script src="exposants.js"></script>
<script src="/media/simulations/shared/tableau/imprimer.js"></script>
<script>
/*
 * « Ce qu’il faut retenir » du cours « Noyaux, masse et énergie » (phys_ch5_energie_nucleaire), même forme que
 * ondes-lumineuses-tableau/bilan.html. TOUTE la fiche tient sur UNE page : huit blocs en trois colonnes (un par partie
 * du cours), chacun avec la définition à savoir par cœur (mot pour mot), les formules encadrées (indices et exposants
 * rendus : « E_{ℓ} » s’écrit E avec ℓ en indice, « 10⁻²⁷ » par exposants.js, le noyau ᴬ_ZX par noyauTexte) et le piège
 * en orange (⚠). La voix la parcourt bloc par bloc : play_until {moment: <bloc>} écrit ce bloc à cet instant et le met
 * en lumière ; les blocs déjà dits (ou sautés) sont écrits d’un coup ; ceux pas encore dits attendent leur moment
 * (« fiche » et « fin » écrivent tout d’un coup). La deuxième page est celle de l’élève (set_parameters {lacunes,
 * acquis, acquis_ids}), avec la compétence C9 « rédiger comme le barème » qui n’a pas de bloc propre.
 */
const { bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);

const NOYAU = '⟦X⟧';   // dans une formule : le noyau ᴬ_ZX, écrit par noyauTexte (A en haut, Z en bas, à gauche du symbole)
// Une fraction « ⟦num|dén⟧ » (avec la barre « | ») est écrite comme dans le cahier par le kit : numérateur, trait, dénominateur.
const BLOCS = [
  { id: 'masse_energie', titre: '1 · Masse et énergie', comps: ['C1'], formules: ['E = m·c²', '1 u = 1,66·10⁻²⁷ kg = 931,5 MeV/c²', '1 MeV = 1,6·10⁻¹³ J'],
    def: 'Toute masse correspond à une énergie : E en J, m en kg, c = 3,00·10⁸ m/s.',
    attention: 'Δm en u × 931,5 → MeV.' },
  { id: 'defaut', titre: '2 · Défaut de masse Δm', comps: ['C2'], formules: ['Δm = Z·m_p + (A − Z)·m_n − m(' + NOYAU + ')', 'N = A − Z'],
    def: 'La masse d’un noyau est inférieure à la somme des masses de ses nucléons séparés.',
    attention: 'Δm > 0 ; neutrons : N = A − Z.' },
  { id: 'liaison', titre: '3 · Énergie de liaison E_{ℓ}', comps: ['C3'], formules: ['E_{ℓ} = Δm·c²', '⟦E_{ℓ}|A⟧'],
    def: 'L’énergie de liaison E_{ℓ} est l’énergie qu’il faut fournir à un noyau au repos pour le séparer en ses nucléons au repos.',
    attention: 'E_{ℓ}/A en MeV/nucléon : diviser par A.' },
  { id: 'stabilite', titre: '4 · Stabilité, courbe d’Aston', comps: ['C4'], formules: ['−⟦E_{ℓ}|A⟧ = f(A)'],
    def: 'Un noyau est d’autant plus stable que son énergie de liaison par nucléon E_{ℓ}/A est grande. Courbe d’Aston : creux vers le fer (A ≈ 56).',
    attention: 'Comparer E_{ℓ}/A, pas E_{ℓ}.' },
  { id: 'reactions', titre: '5 · Fission et fusion', comps: ['C5'],
    def: 'Fission : un noyau lourd frappé par un neutron se scinde en deux noyaux plus légers. Fusion : deux noyaux légers s’unissent en un noyau plus lourd. Conservation de A et de Z (lois de Soddy).',
    attention: 'Ne pas oublier les neutrons.' },
  { id: 'bilan_masses', titre: '6 · Énergie libérée : les masses', comps: ['C6'], formules: ['Δm = Σm(produits) − Σm(réactifs)', 'ΔE = Δm·c²', 'E_lib = |ΔE|'],
    def: 'ΔE < 0 : la réaction libère l’énergie E_lib.',
    attention: 'Toutes les particules (e^{−}, e^{+}, n) entrent dans Δm.' },
  { id: 'bilan_liaison', titre: '7 · Énergie libérée : les E_{ℓ}', comps: ['C7'], formules: ['ΔE = Σ E_{ℓ}(réactifs) − Σ E_{ℓ}(produits)'],
    def: 'Diagramme d’énergie : les nucléons séparés en haut. Un nucléon seul : E_{ℓ} = 0.',
    attention: 'E_{ℓ} = A·(E_{ℓ}/A) pour chaque noyau.' },
  { id: 'echantillon', titre: '8 · Énergie d’un échantillon', comps: ['C8'], formules: ['N = ⟦m·N_A|M⟧', 'E = N·E_lib'],
    def: 'À masse égale, la fusion libère plus d’énergie que la fission.',
    attention: 'm en g si M en g/mol.' },
];
const C9 = { id: 'C9', label: 'Rédiger comme le barème', texte: 'formule littérale, application numérique, résultat avec son unité.' };
const STATUTS = { non_acquis: ['à reprendre', 'rouge'], partiel: ['à revoir', 'orange'], acquis: ['acquis', 'vert'] };
const AVANT = -1e9;   // instant d'un bloc déjà dit : il est écrit d'un coup
// apparu[i] : null = pas encore dit (pas écrit) ; un nombre = l'instant (s de la scène) où il commence à s'écrire.
const S = { page: 1, focus: null, lacunes: null, acquis: null, acquis_ids: null, apparu: [], loupe: false, groupes: [], impression: false };
window.__debordeBlocs = [];   // vérification : un bloc dont le texte dépasse son cadre ou une colonne trop pleine

/* Texte pour la bulle et ce_qui_se_voit (HTML) : jamais de « _ » ni d'accolade visible. */
const SOUS = { p: 'ₚ', n: 'ₙ', 0: '₀', 1: '₁', 2: '₂' };
const lisible = s => window.Tableau.lisible(String(s)).replace(/⟦X⟧/g, 'ᴬZX').replace(/\^\{([^}]+)\}/g, (m, e) => e === '+' ? '⁺' : e === '−' ? '⁻' : e)
  .replace(/_\{([^}]+)\}/g, '$1').replace(/_([A-Za-z0-9]+)/g, (m, i) => [...i].map(ch => SOUS[ch] || ch).join(''));

/* Taille réellement écrite (le kit grossit le texte pour qu'il reste lisible sur un petit écran). */
const eff = (c, t) => (c.echelle && c.tailleMin ? Math.max(t, c.tailleMin / c.echelle) : t);
/* 18 novembre 2026 : un indice ou un exposant (écrit à 62 % par le kit) ne descend pas non plus sous 15 px à l'écran,
 * à toutes les tailles (« E_ℓ », « m_p », « 10⁸ » restaient à 6–12 px) ; pas de plancher à l'impression. */
const petitEcran = () => !S.impression && (scene.craie.W < 900 || scene.craie.H < 400);
const plancherIndices = () => !S.impression;
const petit = (c, t) => (plancherIndices() && c.echelle && c.tailleMin ? Math.max(t * .62, c.tailleMin / c.echelle) : t * .62);
const EXP = { '⁻': '−', '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9' };
/* Largeur d'un texte de craie (indices et exposants plus petits, comme les écrit le kit). */
function mesure(c, s, t) {
  // une fraction « ⟦num|dén⟧ » : son plus long étage (écrit à 78 %) plus une marge, comme la mesure du kit
  if (/⟦[^⟧]*\|/.test(String(s))) return String(s).split(/(⟦[^⟧]*\|[^⟧]*⟧)/).filter(Boolean).reduce((w, p) => w + (p[0] !== '⟦' ? mesure(c, p, t)
    : Math.max(...p.slice(1, -1).split('|').map(e => mesure(c, e, eff(c, t) * .78))) + eff(c, t) * .36), 0);
  t = eff(c, t);
  const segs = window.Tableau.Craie.segments(String(s).replace(/[⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, g => '^{' + [...g].map(ch => EXP[ch]).join('') + '}'));
  return segs.reduce((w, g) => { c.ctx.font = `${g.sub || g.sup ? petit(c, t) : t}px ${window.Tableau.POLICE}`; return w + c.ctx.measureText(g.t).width; }, 0);
}
/* Le noyau ᴬ_ZX : A en haut à gauche, Z en bas à gauche, alignés à droite contre le symbole, 0,6 × la taille. Rend la largeur. */
function noyauTexte(c, A, Z, X, x, y, o = {}) {
  const t = o.taille ?? 18, p = t * .6, wa = Math.max(mesure(c, A, p), mesure(c, Z, p));
  // A et Z écrits à 15 px au moins : écartés d'autant pour ne pas se toucher
  const e = plancherIndices() ? Math.max(0, (.85 * eff(c, p) + 2 - .75 * t) / 2) : 0;
  if (o.dessiner !== false) {
    c.texte(A, x + wa, y - t * .45 - e, { ...o, taille: p, align: 'right' });
    c.texte(Z, x + wa, y + t * .3 + e, { ...o, taille: p, align: 'right' });
    c.texte(X, x + wa + 1, y, { ...o, taille: t });
  }
  return wa + 1 + mesure(c, X, t);
}
/* Une formule encadrée ; le jeton ⟦X⟧ devient le noyau ᴬ_ZX. Rend la largeur (dessinée ou mesurée seulement). */
function formule(c, f, x, y, t, o) {
  const parts = f.split(NOYAU); let px = x;
  parts.forEach((part, k) => {
    if (part) { if (o.dessiner) c.texte(part, px, y, { couleur: 'jaune', taille: t }); px += mesure(c, part, t); }
    if (k < parts.length - 1) px += noyauTexte(c, 'A', 'Z', 'X', px, y, { couleur: 'jaune', taille: t, dessiner: o.dessiner });
  });
  return px - x;
}

/* Coupe un texte en lignes qui tiennent dans `max` px (mesure avec indices et exposants). */
function lignes(c, texte, taille, max) {
  const out = []; let ligne = '';
  // une formule dans la phrase ne se coupe pas : « E_ℓ = A·(E_ℓ/A) » reste sur une ligne
  const t = String(texte).replace(/ ([=\/·→<>≥≤≈≠−+×]) /g, ' $1 ');
  for (const mot of t.split(/[ \t\n]+/)) {
    const essai = ligne ? ligne + ' ' + mot : mot;
    if (mesure(c, essai, taille) > max && ligne) { out.push(ligne); ligne = mot; } else ligne = essai;
  }
  if (ligne) out.push(ligne);
  return out;
}
function paragraphe(c, texte, x, y, taille, max, o, dessiner) {
  // interligne : 1,2 × la taille, ou plus quand un indice (en bas) ou un exposant (en haut), écrits à 15 px au moins,
  // toucheraient la ligne voisine
  const te = eff(c, taille), p = petit(c, te), L = lignes(c, texte, taille, max);
  const bas = l => (/[A-Za-zτθΔλωφ]_/.test(l) ? .28 * te + .3 * p : .25 * te), haut = l => (/[⁻⁰¹²³⁴⁵⁶⁷⁸⁹^]/.test(l) ? .42 * te + .78 * p : .78 * te);
  L.forEach((l, k) => {
    if (dessiner) c.texte(l, x, y, { taille, ...o });
    y += k < L.length - 1 ? Math.max(te * 1.2, bas(l) + haut(L[k + 1]) + 2) : te * 1.2;
  });
  return y;
}

// Trois colonnes (3 + 2 + 3 blocs), dans le cadre 760 × 420 ; hauteurs mesurées, réparties dans la colonne.
// Tableau large (15 novembre 2026, « cases serrées, petits textes ») : Scene({ large: true }) ; si scene.L ≥ 1000, quatre
// colonnes (2 blocs chacune) sur toute la largeur, et le texte grossit (facteur K) tant que tout tient sur la page.
let COL = [{ x: 18, w: 228, ids: [0, 1, 2] }, { x: 266, w: 228, ids: [3, 4] }, { x: 514, w: 228, ids: [5, 6, 7] }];
const HAUT = 50, BAS = 414;
let K = 1, LD = 742;  // K : agrandissement du texte de la fiche ; LD : bord droit écrit
function colonnes(L) {
  LD = L - 18;
  if (L < 1000) { COL = [{ x: 18, w: 228, ids: [0, 1, 2] }, { x: 266, w: 228, ids: [3, 4] }, { x: 514, w: 228, ids: [5, 6, 7] }]; return; }
  const g = 26, w = (L - 36 - 3 * g) / 4;
  COL = [[0, 1], [2, 3], [4, 5], [6, 7]].map((ids, j) => ({ x: 18 + j * (w + g), w, ids }));
}
const POS = [];   // position calculée de chaque bloc : { x, w, y0, h }
const TF = 12.5;  // taille des formules

/* Écrit (ou mesure seulement) le contenu d'un bloc ; rend l'ordonnée de fin. */
function contenu(c, b, x, y0, w, st, dessiner) {
  let y = y0 + 12 * K;
  if (st === true) st = statut(b.comps);   // mesure : l'état réel de l'élève (sa place à droite du titre)
  if (plancherIndices()) {
    // l'état de l'élève (« à reprendre », ✓) en haut à droite ; si le titre ne tient pas à côté, il passe
    // dessous (jamais rétréci sous 15 px pour tenir)
    const r = STATUTS[st] ? largeurEtat(c, st) + 12 : 0;
    if (r && mesure(c, b.titre, 14 * K) > w - r) y += eff(c, 11) * 1.3;
    if (dessiner) c.texte(b.titre, x, y, { couleur: 'jaune', taille: 14 * K });
  } else if (dessiner) c.texte(b.titre, x, y, { couleur: 'jaune', taille: 14 * K, max: st ? w - 62 : w });
  const yt = y;   // ligne de base du titre
  y += Math.max(18 * K, eff(c, 14 * K) * 1.25);
  if (b.formules) {
    // formules encadrées, à la ligne quand la suivante ne tient plus (une formule trop longue s'écrit plus petit)
    let fx = x;
    // une formule à fraction (« ⟦num|dén⟧ », sur deux étages comme dans le cahier) prend des cadres plus hauts
    const etages = b.formules.some(f => /⟦[^⟧]*\|/.test(f)), efb = eff(c, TF * K) / (TF * K);
    if (etages) y += 5 * K * efb;
    // cadre : `haut` au-dessus de la ligne de base, `bas` dessous. Indices, exposants et étages écrits à
    // 15 px au moins dépassaient du cadre (« 10⁻²⁷ ») ; le cadre se règle alors sur ce qui est vraiment écrit.
    const T0 = TF * K, hf0 = (etages ? 27 : 19) * K * efb;
    let haut = hf0 * (etages ? .6 : .68), bas = hf0 - haut;
    if (plancherIndices()) {
      const te = eff(c, T0), p = petit(c, te), tf = Math.max(.78 * te, c.tailleMin / (c.echelle || 1));
      for (const f of b.formules) {
        if (/⟦[^⟧]*\|/.test(f)) { haut = Math.max(haut, .32 * te + 1.3 * tf + 4); bas = Math.max(bas, 1.25 * tf - .32 * te + 4); }
        else {
          haut = Math.max(haut, (/[⁻⁰¹²³⁴⁵⁶⁷⁸⁹^]/.test(f) ? .42 * te + .9 * p : .78 * te) + 3, f.includes(NOYAU) ? .45 * te + .78 * p + 4 : 0);
          bas = Math.max(bas, (/_/.test(f) || f.includes(NOYAU) ? .28 * te + .3 * p : .3 * te) + 3);
        }
      }
      y = Math.max(y, yt + .3 * eff(c, 14 * K) + haut + 3);   // le cadre ne touche pas le titre
    }
    for (const f of b.formules) {
      const T = TF * K, brut = formule(c, f, 0, 0, T, { dessiner: false }), tf = brut + 14 > w ? T * (w - 14) / brut : T;
      const l = Math.min(w, (brut + 14 > w ? w - 14 : brut) + 14), hf = haut + bas;
      if (fx > x && fx + l > x + w) { fx = x; y += hf + 3; }
      if (dessiner) {
        c.rect(fx, y - haut, l, hf, { couleur: 'faible', arrondi: 6, largeur: 1.2, duree: .25 });
        formule(c, f, fx + 7, y + 1, tf, { dessiner: true });
      }
      fx += l + 7;
    }
    y += Math.max(21 * K, eff(c, TF * K) * 1.6, plancherIndices() ? bas + .8 * eff(c, 11.5 * K) + 4 : 0) + (etages ? 6 * K * efb : 0);
  }
  y = paragraphe(c, b.def, x, y, 11.5 * K, w, { couleur: 'blanc' }, dessiner);
  if (dessiner) c.texte('⚠', x, y, { couleur: 'orange', taille: 11 * K });
  const dx = Math.max(14, eff(c, 11 * K) * 1.3);   // le ⚠ grossit aussi sur un petit écran
  y = paragraphe(c, b.attention, x + dx, y, 11 * K, w - dx, { couleur: 'orange', alpha: .92 }, dessiner);
  return y - 8;   // la dernière ligne descend d'environ 0,3 taille sous sa base
}
/*
 * Indices et exposants à 15 px sur grand écran aussi (18 novembre 2026) : les blocs sont plus hauts, la répartition
 * fixe (3 + 2 + 3, ou 2 par colonne) ne tenait plus à 1024 ou 1280 de large. Si elle ne tient pas, les blocs (toujours
 * dans l'ordre) sont répartis entre les colonnes pour que la plus haute soit la plus basse possible, et l'écart entre
 * les lignes (K, jamais sous 0,8 ; le texte reste à 15 px au moins) se resserre. Sinon : la fiche par parties.
 */
function repartir(c) {
  const dispo = n => BAS - HAUT - 8 * n;
  const tient = () => COL.every(({ x, w, ids }) => ids.reduce((t, i) => t + contenu(c, BLOCS[i], x, 0, w, true, false) + 6, 0) <= dispo(ids.length));
  if (tient()) return;
  const cle = [Math.round(c.W), Math.round(c.H), scene.L, K, BLOCS.map(b => statut(b.comps)).join(), document.fonts ? document.fonts.status : ''].join('|');
  if (REPARTI.cle !== cle) REPARTI = { cle, ...chercherRepartition(c) };
  if (REPARTI.col) { K = REPARTI.K; COL = REPARTI.col.map(o => ({ ...o, ids: o.ids.slice() })); }
}
let REPARTI = { cle: '' };
function chercherRepartition(c) {
  const K0 = K;
  // autant de colonnes qu'avant, puis une de plus (4 au plus), écart 16 au lieu de 26 : moins de lignes coupées
  for (let n = COL.length; n <= Math.max(COL.length, 4); n++) {
    const gl = 16, wl = (LD - 18 - (n - 1) * gl) / n;
    for (K = Math.min(K0, 1); K >= .8; K = Math.round((K - .05) * 100) / 100) {
      const h = BLOCS.map(b => contenu(c, b, 0, 0, wl, true, false) + 6 + 8);
      let best = null;
      // coupures croissantes de 0..8 en n morceaux non vides (les blocs restent dans l'ordre)
      const essayer = (debut, reste, coupes) => {
        if (reste === 1) {
          const parts = [...coupes, BLOCS.length], hs = parts.map((f, j) => h.slice(j ? parts[j - 1] : 0, f).reduce((t, v) => t + v, 0));
          const m = Math.max(...hs); if (!best || m < best.m) best = { m, parts };
          return;
        }
        for (let f = debut + 1; f <= BLOCS.length - reste + 1; f++) essayer(f, reste - 1, [...coupes, f]);
      };
      essayer(0, n, []);
      if (best && best.m <= BAS - HAUT) {
        const col = best.parts.map((f, j) => { const d = j ? best.parts[j - 1] : 0; return { x: 18 + j * (wl + gl), w: wl, ids: [...Array(f - d).keys()].map(k => k + d) }; });
        const r = { K, col }; K = K0; return r;
      }
    }
  }
  K = K0; return { col: null };   // rien ne tient : placer() passera par parties
}
const largeurEtat = (c, st) => (st === 'acquis' ? mesure(c, '✓', 15) : mesure(c, STATUTS[st][0], 11));
function placer(c) {
  window.__debordeBlocs = [];   // recalculé à chaque image (le canvas change de taille au chargement)
  S.loupe = false;
  colonnes(scene.L); K = 1;
  if (scene.L >= 1000) {
    // le plus grand texte qui laisse toute la fiche sur la page
    const tient = () => COL.every(({ x, w, ids }) => ids.reduce((s, i) => s + contenu(c, BLOCS[i], x, 0, w, true, false) + 6, 0) <= BAS - HAUT - 8 * ids.length);
    for (K = 2; K > 1 && !tient(); K = Math.round((K - .05) * 100) / 100);
  }
  if (!S.impression) repartir(c);
  for (const { x, w, ids } of COL) {
    const h = ids.map(i => contenu(c, BLOCS[i], x, 0, w, true, false) + 6);
    const libre = BAS - HAUT - h.reduce((s, v) => s + v, 0), g = Math.max(0, libre / ids.length);
    if (libre < 0) S.loupe = true;
    let y = HAUT;
    ids.forEach((i, j) => { POS[i] = { x, w, y0: y, h: h[j] + g * .7 }; y += h[j] + g; });
  }
  if (S.loupe) partiesLoupe(c);
}
/*
 * Petit écran (téléphone en paysage, 18 novembre 2026 : « partie 1 sur 3 », un seul bloc dans un tableau presque vide,
 * textes à 10 px) : le texte ne descend jamais sous 15 px à l'écran (indices et exposants compris), et la fiche se lit
 * par parties qui remplissent le tableau. On choisit le nombre de colonnes (1 à 4) qui donne le plus gros texte (à 10 %
 * près, le plus de colonnes : moins de parties), on range les blocs dans l'ordre (colonne après colonne, autant de
 * parties qu'il faut), puis chaque partie grossit son texte tant qu'elle tient. On montre la partie du bloc que la voix
 * dit (ou celle que l'élève touche). Le rangement est gardé tant que le tableau et l'état de l'élève ne changent pas.
 */
let RANGE = { cle: '', parties: [] };
const LOUPE_HAUT = 56, LOUPE_BAS = 414;
function partiesLoupe(c) {
  POS.length = 0;
  const dispo = LOUPE_BAS - LOUPE_HAUT, UW = LD - 30, g = 26, s = c.echelle || 1;   // 12 de marge : le garde-fou du kit mesure « E_{ℓ} » accolades comprises
  const Kmax = Math.max(1, 26 / (11.5 * s));   // la définition jusqu'à 26 px à l'écran, pas plus

    pont.noter('touche', { moment: BLOCS[k].id }); pont.emettre(); return;
  }
  const i = BLOCS.findIndex((b, k) => { const p = POS[k]; return p && S.apparu[k] != null && x >= p.x - 6 && x <= p.x + p.w + 6 && y >= p.y0 - 6 && y <= p.y0 + p.h; });
  if (i < 0) return;
  S.focus = BLOCS[i].id; scene.sale = true; bulle($('feedback'), lisible(BLOCS[i].def));
  pont.noter('touche', { moment: BLOCS[i].id }); pont.emettre();
});
