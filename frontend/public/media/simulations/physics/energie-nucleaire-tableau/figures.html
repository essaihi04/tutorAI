<script>
/*
 * Figures fixes du cours « Noyaux, masse et énergie » (phys_ch5_energie_nucleaire, 2e Bac PC BIOF, novembre 2026), écrites
 * à la craie pas à pas, comme un professeur au tableau : ?fig=fig_soleil | fig_einstein | fig_unites | fig_931 |
 * fig_composition | fig_defaut | fig_liaison | fig_stabilite | fig_spontanee_provoquee | fig_soddy | fig_methode_masses |
 * fig_methode_liaison | fig_echantillon | fig_comparaison | fig_cas_types | fig_enonce_2016 | fig_enonce_2017 |
 * fig_enonce_2023 | fig_enonce_2025. Même architecture que ondes-lumineuses-tableau/figures.html.
 * Chaque figure : des étapes nommées (les moments), puis `fin`. Le tuteur fige l’écriture sur une étape (`play_until {moment}`)
 * et montre chaque élément (`highlight {target}`) : le repère `figure`, et un repère par étape (même nom que l’étape).
 * Rendu « réel » (règle 7) : le Soleil, les nucléons (sphères ombrées : proton rouge #d9534f, neutron gris-bleu #8fa3b8,
 * comme balance.html), le baril de pétrole sont peints ; la craie écrit le reste. Les valeurs sont celles du cours.
 * Les énoncés d’examen sont des paraphrases courtes, données exactes (nationaux 2016 N, 2017 R, 2023 N, 2025 N).
 */
const { bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search);
const FIGS = {
  fig_soleil: { titre: 'Le Soleil rayonne : d’où vient son énergie ?', etapes: ['soleil', 'masse', 'question', 'fin'] },
  fig_einstein: { titre: 'La relation d’Einstein E = m·c²', etapes: ['relation', 'termes', 'exemple', 'sens', 'fin'] },
  fig_unites: { titre: 'L’escalier des unités : u, eV, MeV, MeV/c²', etapes: ['u', 'eV', 'MeV', 'MeV_c2', 'fin'] },
  fig_931: { titre: 'Démonstration : 1 u = 931,5 MeV/c²', etapes: ['E', 'joule', 'mev', 'resultat', 'fin'] },
  fig_composition: { titre: 'La composition d’un noyau', etapes: ['noyau', 'protons', 'neutrons', 'exemples', 'fin'] },
  fig_defaut: { titre: 'Le défaut de masse Δm', etapes: ['formule', 'signe', 'calcul', 'kg', 'fin'] },
  fig_liaison: { titre: 'L’énergie de liaison E_ℓ', etapes: ['formule', 'calcul', 'par_nucleon', 'joule', 'fin'] },
  fig_stabilite: { titre: 'Le plus stable : ⁶⁰Ni ou ⁵⁶Ni (national 2017 R)', etapes: ['trace', 'calcul', 'compare', 'conclusion', 'piege', 'fin'] },
  fig_spontanee_provoquee: { titre: 'Réaction spontanée, réaction provoquée', etapes: ['trace', 'spontanee', 'provoquee', 'soddy', 'fin'] },
  fig_soddy: { titre: 'Trouver x neutrons : les lois de Soddy', etapes: ['equation', 'A', 'Z', 'fin'] },
  fig_methode_masses: { titre: 'Énergie libérée à partir des masses', etapes: ['equation', 'delta_m', 'delta_E', 'E_lib', 'fin'] },
  fig_methode_liaison: { titre: 'Énergie libérée à partir des énergies de liaison', etapes: ['formule', 'A_fois', 'nucleon_libre', 'E_lib', 'fin'] },
  fig_echantillon: { titre: 'L’énergie libérée par un échantillon', etapes: ['un_noyau', 'nombre', 'total', 'joule', 'petrole', 'fin'] },
  fig_comparaison: { titre: 'Fission ou fusion : laquelle libère le plus ?', etapes: ['trace', 'par_reaction', 'par_nucleon', 'conclusion', 'fin'] },
  fig_cas_types: { titre: 'Le mot de la question → la méthode', etapes: ['trace', 'liaison', 'stabilite', 'masses', 'energies', 'diagramme', 'echantillon', 'equation', 'fin'] },
  fig_enonce_2016: { titre: 'Énoncé type national 2016 N : la fusion ²H + ³H', etapes: ['trace', 'donnees', 'fin'] },
  fig_enonce_2017: { titre: 'Énoncé type national 2017 R : le cobalt 60', etapes: ['trace', 'donnees', 'fin'] },
  fig_enonce_2023: { titre: 'Énoncé type national 2023 N : un tableau d’énergies de liaison', etapes: ['trace', 'donnees', 'fin'] },
  fig_enonce_2025: { titre: 'Énoncé type national 2025 N : le cadmium 107', etapes: ['trace', 'donnees', 'fin'] },
};
let fig = FIGS[P.get('fig')] ? P.get('fig') : 'fig_soleil';
const VITESSE = 1.6;                              // l’écriture va un peu plus vite que la craie du kit
const S = { tw: 0, running: true, pause: false, fait: false, jusqua: null, motif: '', emis: 0 };
let M = {};                                       // étape → instant d’écriture (s), relevé pendant le dessin

const canvas = $('canvas');
const scene = window.OndesTableau.Scene(canvas, dessiner);
const craie = scene.craie;
/* Même cadre que commun.js, mais l’écriture suit l’horloge de la figure (S.tw) : le tuteur peut la figer sur une étape. */
scene.cadre = function (graine) {
  const W = craie.W, H = craie.H, VW = 760, VH = 420;
  craie.debut(graine, S.tw);
  const s = Math.min(W / VW, H / VH);
  scene.s = s; scene.ox = (W - VW * s) / 2; scene.oy = (H - VH * s) / 2;
  craie.ctx.translate(scene.ox, scene.oy); craie.ctx.scale(s, s);
  craie.echelle = s; craie.tailleMin = 11; craie.cadre = { w: VW, h: VH, haut: 0 };
  return craie;
};
let MM = {};
const marque = (c, nom) => { MM[nom] = c.cur; };
/* Une partie peinte (Soleil, nucléons, baril) apparaît quand l’écriture arrive à elle, d’un coup. */
const peindre = (c, fn) => { if (c.t >= c.cur) c.direct(() => { c.ctx.save(); try { fn(c.ctx); } finally { c.ctx.restore(); } }); };
const vu = nom => M[nom] !== undefined && S.tw >= M[nom] - 1e-6;

// ───────────────────────── Le rendu « réel » (peint, pour l’œil ; la physique reste dans la craie) ─────────────────────────
/* Les nucléons : mêmes sphères ombrées que balance.html (proton rouge, neutron gris-bleu). */
const TEINTES = { p: ['#f6b6b0', '#d9534f', '#6e1d1a'], n: ['#e3ebf3', '#8fa3b8', '#3a4757'] };
function sphere(ctx, x, y, r, k) {
  const [cl, cb, cf] = TEINTES[k];
  const g = ctx.createRadialGradient(x - r * .35, y - r * .4, r * .08, x, y, r);
  g.addColorStop(0, cl); g.addColorStop(.42, cb); g.addColorStop(1, cf);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  if (r > 3.5) { ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(x - r * .38, y - r * .42, r * .22, r * .14, -.6, 0, Math.PI * 2); ctx.fill(); }
}
function ombre(ctx, x, y, rx) {
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(x, y, rx, Math.max(2, rx * .18), 0, 0, Math.PI * 2); ctx.fill();
}
const MELANGE = {};
const estProton = (i, Z, A) => {                                // protons et neutrons mêlés au hasard (fixé), sans motif
  if (A <= 4) return Math.floor((i + 1) * Z / A) > Math.floor(i * Z / A);
  const h = k => { let x = (k + 1) * 2654435761 % 4294967296; x ^= x >>> 15; x = Math.imul(x, 2246822519) >>> 0; return x / 4294967296; };
  const cle = A + '/' + Z;
  if (!MELANGE[cle]) { const rang = Array.from({ length: A }, (_, k) => k).sort((a, b) => h(a) - h(b)); MELANGE[cle] = new Set(rang.slice(0, Z)); }
  return MELANGE[cle].has(i);
};
/** Positions (relatives au centre) des nucléons d’un amas compact de A nucléons de rayon r. */
function positionsAmas(A, r) {
  const d = 1.7 * r;
  if (A === 1) return [[0, 0]];
  if (A === 2) return [[-.5 * d, 0], [.5 * d, 0]];
  if (A === 3) return [[-.5 * d, .29 * d], [.5 * d, .29 * d], [0, -.58 * d]];
  if (A === 4) return [[-.5 * d, .25 * d], [.5 * d, .25 * d], [0, -.6 * d], [0, .05 * d]];
  const pts = []; for (let i = 0; i < A; i++) { const rho = r * 1.05 * Math.sqrt(i), th = i * 2.39996; pts.push([rho * Math.cos(th), rho * Math.sin(th)]); }
  return pts;
}
const rayonAmas = (A, r) => Math.max(...positionsAmas(A, r).map(([x, y]) => Math.hypot(x, y))) + r;
/** Un noyau : amas compact de sphères qui se touchent, centré en (cx, cy) ; renvoie son rayon. */
function amas(ctx, cx, cy, A, Z, r) {
  const R = rayonAmas(A, r), pts = positionsAmas(A, r).map(([x, y], i) => [x, y, i]);
  if (A > 4) pts.sort((a, b) => Math.hypot(b[0], b[1]) - Math.hypot(a[0], a[1]));   // le cœur devant : une boule
  ombre(ctx, cx + 2, cy + R + 1, R * .9);
  for (const [x, y, i] of pts) sphere(ctx, cx + x, cy + y, r, A === 1 ? (Z ? 'p' : 'n') : (estProton(i, Z, A) ? 'p' : 'n'));
  return R;
}
const nucleon = (ctx, x, y, r, k) => { ombre(ctx, x + 1, y + r + 1, r * .9); sphere(ctx, x, y, r, k); };
/** Le Soleil : disque lumineux, halo, rayons qui partent (pour l’œil seulement). */
function soleil(ctx, x, y, r) {
  ctx.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 18; k++) {
    const a = k * Math.PI / 9 + .1, r0 = r * 1.15, r1 = r * (k % 2 ? 2.05 : 2.45);
    const g = ctx.createLinearGradient(x + r0 * Math.cos(a), y + r0 * Math.sin(a), x + r1 * Math.cos(a), y + r1 * Math.sin(a));
    g.addColorStop(0, 'rgba(255,214,102,.55)'); g.addColorStop(1, 'rgba(251,146,60,0)');
    ctx.strokeStyle = g; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x + r0 * Math.cos(a), y + r0 * Math.sin(a)); ctx.lineTo(x + r1 * Math.cos(a), y + r1 * Math.sin(a)); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
  let g = ctx.createRadialGradient(x, y, 0, x, y, r * 2.4);
  g.addColorStop(0, '#fffbe8'); g.addColorStop(.3, '#fde047'); g.addColorStop(.42, 'rgba(251,160,60,.75)'); g.addColorStop(.62, 'rgba(251,146,60,.16)'); g.addColorStop(1, 'rgba(251,146,60,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 2.4, 0, 7); ctx.fill();
  g = ctx.createRadialGradient(x - r * .3, y - r * .3, r * .1, x, y, r * .98);           // le disque, un peu plus sombre au bord
  g.addColorStop(0, 'rgba(255,255,240,.95)'); g.addColorStop(.7, 'rgba(254,224,120,.9)'); g.addColorStop(1, 'rgba(249,150,50,.85)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * .98, 0, 7); ctx.fill();
}
/** Un baril de pétrole (métal sombre, cerclages, reflet). */
function baril(ctx, x, y, w, h) {
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  g.addColorStop(0, '#1f2937'); g.addColorStop(.3, '#4b5563'); g.addColorStop(.45, '#9ca3af'); g.addColorStop(.7, '#374151'); g.addColorStop(1, '#111827');
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(x + w / 2 + 3, y + h + 2, w * .55, 4, 0, 0, 7); ctx.fill();
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#6b7280'; ctx.beginPath(); ctx.ellipse(x + w / 2, y, w / 2, 5, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#111827'; ctx.beginPath(); ctx.ellipse(x + w / 2, y, w / 2 - 4, 3.2, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(15,23,42,.9)'; ctx.lineWidth = 3;
  for (const f of [.3, .7]) { ctx.beginPath(); ctx.moveTo(x, y + h * f); ctx.lineTo(x + w, y + h * f); ctx.stroke(); }
  ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(x + w * .38, y + 6, 4, h - 12);
}

// ───────────────────────── Morceaux de craie ─────────────────────────
const SUPC = { '⁻': '−', '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9' };
/** Largeur écrite d’une chaîne de craie (indices et exposants plus petits, comme exposants.js). */
function largeur(c, s, t) {
  s = String(s).replace(/[⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, g => '^{' + [...g].map(ch => SUPC[ch]).join('') + '}');
  return window.Tableau.Craie.segments(s).reduce((w, seg) => w + c.largeurTexte(seg.t, seg.sub || seg.sup ? t * .62 : t), 0);
}
/** Écrit un noyau ᴬ_ZX : A en haut à gauche, Z en bas à gauche, alignés à droite contre le symbole. Renvoie la largeur. */
function noyauTexte(c, A, Z, X, x, y, o = {}) {
  const t = o.taille ?? 18, tn = t * .6, wN = Math.max(c.largeurTexte(String(A), tn), c.largeurTexte(String(Z), tn));
  const w = wN + 1 + c.largeurTexte(X, t);
  const x0 = o.align === 'center' ? x - w / 2 : o.align === 'right' ? x - w : x;
  if (o.mesure) return w;
  const d = s => Math.max(.06, String(s).length / 16);
  c.texte(String(A), x0 + wN, y - .45 * t, { couleur: o.couleur, taille: tn, align: 'right', duree: d(A) });
  c.texte(String(Z), x0 + wN, y + .3 * t, { couleur: o.couleur, taille: tn, align: 'right', duree: d(Z) });
  c.texte(X, x0 + wN + 1, y, { couleur: o.couleur, taille: t, duree: d(X) });
  return w;
}
const N = (A, Z, X) => ({ A, Z, X });
const NEUTRON = N(1, 0, 'n');
/** Une ligne faite de morceaux : texte (chaîne ou {t, couleur}) ou noyau {A, Z, X}. Options : taille, couleur, align, max. */
function ligne(c, parts, x, y, o = {}) {
  let taille = o.taille ?? 20;
  const larg = (p, t) => (typeof p === 'string' || p.t != null ? largeur(c, p.t ?? p, t) : noyauTexte(c, p.A, p.Z, p.X, 0, 0, { taille: t, mesure: true }));
  let tot = parts.reduce((s, p) => s + larg(p, taille), 0);
  if (o.max && tot > o.max) { taille *= o.max / tot; tot = parts.reduce((s, p) => s + larg(p, taille), 0); }
  let px = o.align === 'center' ? x - tot / 2 : o.align === 'right' ? x - tot : x;
  for (const p of parts) {
    if (typeof p === 'string' || p.t != null) c.texte(String(p.t ?? p), px, y, { couleur: p.couleur || o.couleur, taille });
    else noyauTexte(c, p.A, p.Z, p.X, px, y, { taille, couleur: p.couleur || o.couleur });
    px += larg(p, taille);
  }
  return tot;
}
/** Un tableau à la craie : colonnes X[], lignes Y[] (traits extérieurs plus marqués). */
function grille(c, X, Y) {
  c.rect(X[0], Y[0], X[X.length - 1] - X[0], Y[Y.length - 1] - Y[0], { couleur: 'faible', arrondi: 6 });
  for (let i = 1; i < X.length - 1; i++) c.ligne(X[i], Y[0], X[i], Y[Y.length - 1], { couleur: 'faible', largeur: 1.5, duree: .15 });
  for (let j = 1; j < Y.length - 1; j++) c.ligne(X[0], Y[j], X[X.length - 1], Y[j], { couleur: j === 1 ? 'faible' : 'tresfaible', largeur: j === 1 ? 1.6 : 1.2, duree: .12 });
}
/** Encadré « Données » des énoncés : renvoie l’ordonnée sous la dernière ligne. */
function donnees(c, x, y, w, lignes, o = {}) {
  const pas = o.pas ?? 32, h = 46 + pas * lignes.length;
  c.rect(x, y, w, h, { couleur: 'faible', arrondi: 8 });
  c.texte('Données', x + 12, y + 28, { couleur: 'cyan', taille: 19 });
  lignes.forEach((l, i) => (Array.isArray(l) ? ligne(c, l, x + 12, y + 62 + pas * i, { taille: o.taille ?? 18, couleur: 'blanc', max: w - 22 })
    : c.texte(l, x + 12, y + 62 + pas * i, { couleur: 'blanc', taille: o.taille ?? 18, max: w - 22 })));
  return y + h;
}
function cherche(c, x, y, lignes, w) {
  c.texte('On cherche :', x, y, { couleur: 'cyan', taille: 18 });
  lignes.forEach((t, i) => c.texte('• ' + t, x, y + 25 + 23 * i, { couleur: 'blanc', taille: 16, max: w }));
}

// ───────────────────────── Les figures ─────────────────────────
const DESSINS = {
  fig_soleil(c) {
    c.texte('Le Soleil et son énergie', 40, 30, { couleur: 'cyan', taille: 20 });
    c.repere('figure', 20, 44, 720, 360, 'le Soleil qui rayonne et la question : d’où vient cette énergie ?');
    const xs = 190, ys = 214, r = 60;
    peindre(c, ctx => soleil(ctx, xs, ys, r));
    c.texte('le Soleil', xs, ys + r + 74, { couleur: 'jaune', align: 'center', taille: 19 });
    c.texte('Le Soleil rayonne de l’énergie', 384, 108, { couleur: 'blanc', taille: 23, max: 350 });
    c.texte('depuis des milliards d’années', 384, 140, { couleur: 'blanc', taille: 23, max: 350 });
    c.repere('soleil', 30, 54, 704, 300, 'le Soleil rayonne de l’énergie depuis des milliards d’années');
    marque(c, 'soleil');
    c.pause(.4);
    c.fleche(372, 186, 372, 236, { couleur: 'rose', largeur: 2 });
    c.texte('Chaque seconde, sa masse diminue', 384, 204, { couleur: 'jaune', taille: 21, max: 350 });
    c.texte('d’environ 4 millions de tonnes', 384, 236, { couleur: 'jaune', taille: 21, max: 350 });
    c.repere('masse', 364, 180, 372, 66, 'chaque seconde, sa masse diminue d’environ 4 millions de tonnes');
    marque(c, 'masse');
    c.pause(.4);
    c.texte('D’où vient cette énergie ?', 558, 316, { couleur: 'vert', align: 'center', taille: 30, max: 350 });
    c.repere('question', 384, 284, 350, 46, 'd’où vient cette énergie ?');
    marque(c, 'question');
    marque(c, 'fin');
  },

  fig_einstein(c) {
    c.texte('La relation d’Einstein', 40, 30, { couleur: 'cyan', taille: 20 });
    c.repere('figure', 20, 44, 720, 340, 'la relation E = m·c², ses unités, un exemple et son sens');
    c.texte('E = m·c²', 380, 118, { couleur: 'jaune', align: 'center', taille: 56 });
    c.rect(256, 64, 248, 74, { couleur: 'jaune', arrondi: 10 });
    c.repere('relation', 252, 60, 256, 82, 'E = m·c²');
    marque(c, 'relation');
    c.pause(.4);
    c.texte('E en joule (J)', 130, 186, { couleur: 'blanc', align: 'center', taille: 21 });
    c.texte('m en kilogramme (kg)', 380, 186, { couleur: 'blanc', align: 'center', taille: 21 });
    c.texte('c = 3,00·10⁸ m/s', 630, 186, { couleur: 'blanc', align: 'center', taille: 21 });
    c.repere('termes', 30, 160, 700, 36, 'E en joule (J), m en kilogramme (kg), c = 3,00·10⁸ m/s');
    marque(c, 'termes');
    c.pause(.4);
    c.texte('Exemple', 40, 238, { couleur: 'cyan', taille: 18 });
    c.texte('m = 1 g = 10⁻³ kg → E = 10⁻³ × (3,00·10⁸)² = 9·10¹³ J', 380, 272, { couleur: 'vert', align: 'center', taille: 23, max: 700 });
    c.repere('exemple', 30, 218, 700, 64, 'm = 1 g = 10⁻³ kg → E = 10⁻³ × (3,00·10⁸)² = 9·10¹³ J');
    marque(c, 'exemple');
    c.pause(.4);
    c.texte('Toute masse correspond à une énergie :', 40, 330, { couleur: 'jaune', taille: 21, max: 690 });
    c.texte('si la masse d’un système diminue de Δm, il libère ΔE = Δm·c²', 40, 362, { couleur: 'jaune', taille: 21, max: 690 });
    c.repere('sens', 30, 306, 700, 66, 'toute masse correspond à une énergie : si la masse d’un système diminue de Δm, il libère ΔE = Δm·c²');
    marque(c, 'sens');
    marque(c, 'fin');
  },

  fig_unites(c) {
    c.texte('L’escalier des unités', 40, 30, { couleur: 'cyan', taille: 20 });
    c.repere('figure', 20, 44, 720, 340, 'l’escalier des unités : u, eV, MeV, MeV/c²');
    const L = [['u', '1 u = 1,66·10⁻²⁷ kg : un douzième de la masse d’un atome de carbone 12', 'blanc'],
      ['eV', '1 eV = 1,6·10⁻¹⁹ J', 'blanc'], ['MeV', '1 MeV = 10⁶ eV = 1,6·10⁻¹³ J', 'blanc'],
      ['MeV_c2', 'MeV/c² : une unité de masse, car m = E/c²', 'jaune']];
    const X = i => 30 + 60 * i, Y = i => 110 + 74 * i;

const etapes = () => FIGS[fig].etapes;
const etiquette = () => { $('run').textContent = S.running ? 'Pause' : S.pause ? 'Reprendre' : 'Rejouer'; };
const sansIndice = s => String(s).replace(/_\{?([^}\s]*)\}?/g, '$1');   // la bulle : jamais de « _ » visible
scene.avancer = dt => {
  if (!S.running) return false;
  S.tw += dt * VITESSE;
  if (S.jusqua != null && S.tw >= S.jusqua) {
    S.tw = S.jusqua; S.jusqua = null; S.running = false;
    if (M.fin !== undefined && S.tw >= M.fin - 1e-6) { S.pause = false; S.fait = true; etiquette(); bulle($('feedback'), 'Arrêt sur image : figure complète.'); pont.noter('measurement', { figure: fig }); pont.emettre(); return true; }
    S.pause = true; etiquette();
    bulle($('feedback'), 'Arrêt sur image : ' + sansIndice(S.motif || 'instant choisi') + '.'); pont.noter('pause', { moment: S.motif }); pont.emettre();
    return true;
  }
  if (M.fin !== undefined && S.tw >= M.fin + 0.05) {
    S.running = false; S.pause = false; S.fait = true; etiquette(); pont.noter('measurement', { figure: fig }); pont.emettre();
  } else if (performance.now() - S.emis > 500) { S.emis = performance.now(); pont.emettre(); }
  return true;
};
function calculer() { if (M.fin === undefined) { const t = S.tw; S.tw = 1e6; dessiner(craie); S.tw = t; scene.sale = true; } }
function start() { S.tw = 0; S.jusqua = null; S.motif = ''; S.running = true; S.pause = false; S.fait = false; scene.sale = true; etiquette(); bulle($('feedback'), ''); pont.noter('start', { figure: fig }); pont.emettre(); }
function pause() { if (!S.running) return; S.running = false; S.pause = true; S.jusqua = null; etiquette(); bulle($('feedback'), 'Pause.'); pont.noter('pause'); pont.emettre(); }
function resume() { if (S.running) return; if (!S.pause) return start(); S.running = true; S.pause = false; etiquette(); bulle($('feedback'), ''); pont.noter('resume'); pont.emettre(); }
function playUntil(p) {
  calculer();
  const nom = p.moment in M && etapes().includes(p.moment) ? p.moment : null, cible = nom ? M[nom] : +p.time_s;
  if (!Number.isFinite(cible)) return;
  if (S.fait || !(S.running || S.pause) || S.tw >= cible - 1e-3) { S.tw = 0; S.fait = false; }
  S.jusqua = cible; S.motif = nom ? MOTIFS[fig][nom] : `t = ${cible.toFixed(1).replace('.', ',')} s d’écriture`; S.running = true; S.pause = false; etiquette(); bulle($('feedback'), '');
  scene.sale = true;
  pont.noter('play_until', { moment: nom, time_s: +cible.toFixed(2) }); pont.emettre();
}
function setTime(p) {
  calculer(); const t = Math.max(0, Math.min(+p.time_s, M.fin ?? 0)); if (!Number.isFinite(t)) return;
  S.tw = t; S.jusqua = null; S.running = false; S.fait = t >= (M.fin ?? 0) - 1e-6; S.pause = !S.fait; scene.sale = true; etiquette();
  bulle($('feedback'), 'Arrêt sur image : ' + (S.fait ? 'figure complète' : `t = ${t.toFixed(1).replace('.', ',')} s d’écriture`) + '.'); pont.noter('set_time', { time_s: t }); pont.emettre();
}
function setParameters(p) {
  const f = p.fig || p.figure || p.variant;
  if (!f || !FIGS[f] || f === fig) return;
  fig = f; M = {}; config.title = 'Figure — ' + FIGS[fig].titre; config.variants = [{ id: fig, label: FIGS[fig].titre }];
  config.command_schema.play_until.moment = FIGS[fig].etapes.join(' | ') + ' (réécrit la figure et s’arrête après cette étape)';
  start(); setTimeout(() => pont.manifeste(), 400);
}
$('run').onclick = () => (S.running ? pause() : S.pause ? resume() : start());

function ceQuiSeVoit() {
  const D = DESCRIPTIONS[fig], faites = etapes().filter(n => vu(n));
  const m = [`Figure « ${fig} » : ${FIGS[fig].titre}.`];
  if (!faites.length) m.push(S.running ? 'La figure est en train de s’écrire à la craie (première étape pas encore finie).' : 'Rien d’écrit encore.');
  faites.forEach(n => { if (D[n]) m.push(D[n]); });
  m.push(S.running ? 'La craie écrit encore.' : S.pause ? `Écriture arrêtée après l’étape « ${faites.length ? faites[faites.length - 1] : 'aucune'} ».` : 'Figure complète.');
  return m.join(' ');
}

  FIGS[f].etapes.filter(e => DESCRIPTIONS[f][e]).map(e => ({ repere: e, texte: DESCRIPTIONS[f][e] }))])));

const config = { id: 'energie_nucleaire_figures', version: '1.0', title: 'Figure — ' + FIGS[fig].titre, variants: [{ id: fig, label: FIGS[fig].titre }], commands: commandes,
  command_schema: { play_until: { moment: FIGS[fig].etapes.join(' | ') + ' (réécrit la figure et s’arrête après cette étape)', time_s: 'instant d’écriture (s)' },
    set_time: { time_s: 'instant d’écriture (s), figé' }, set_parameters: { fig: Object.keys(FIGS).join(' | ') } } };
const pont = protocole({ id: config.id, commandes, config,
  texte: `Figure du cours « Noyaux, masse et énergie » : ${FIGS[fig].titre}. Étapes d’écriture : ${FIGS[fig].etapes.join(', ')}.`,
  etat: () => ({ simulation_status: S.running ? 'running' : S.pause ? 'paused' : 'finished', ce_qui_se_voit: ceQuiSeVoit(), current_variant: fig,
    time_s: +S.tw.toFixed(2), parameters: { fig },
    moments: Object.fromEntries(etapes().filter(n => M[n] !== undefined).map(n => [n, +M[n].toFixed(2)])), etapes_ecrites: etapes().filter(n => vu(n)) }),
  progression: () => (S.fait ? 1 : 0),
  executer: (cmd, p) => ({ start, reset: start, pause, resume, play_until: () => playUntil(p), set_time: () => setTime(p), set_parameters: () => setParameters(p) })[cmd]?.() });
