<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Les réactions nucléaires — au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="nucleaire.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Des noyaux faits de protons (rouges) et de neutrons (gris-bleu) : un noyau qui se transforme seul, une fission, une réaction en chaîne ou une fusion, avec l’équation écrite à la craie"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start reset pause resume play_until set_time">Lancer</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="commun.js"></script>
<script src="exposants.js"></script>
<script>
/*
 * Les réactions nucléaires (cours « Noyaux, masse et énergie », 2e Bac PC BIOF, novembre 2026).
 * Paramètre vue (?vue= ou set_parameters {vue}) :
 *   fission (défaut) : un neutron lent frappe un noyau ²³⁵₉₂U qui s’allonge, se coupe en ⁹⁴₃₈Sr + ¹⁴⁰₅₄Xe, 2 neutrons partent ;
 *   chaine           : 1 fission → 2 neutrons → 2 fissions → 4 neutrons → 4 fissions (schéma qualitatif) ;
 *   fusion           : ²₁H et ³₁H se repoussent à basse température, on chauffe (≈ 10⁸ K), ils fusionnent en ⁴₂He + ¹₀n ;
 *                      paramètre temperature (basse | haute, poignée : le thermomètre) = la température de départ ;
 *   spontanee        : un noyau ²¹⁰₈₄Po seul émet une particule α et devient ²⁰⁶₈₂Pb.
 * Peint : nucléons en sphères ombrées (proton rouge, neutron gris-bleu), énergie libérée en éclair jaune-orangé.
 * Pour l’œil seulement : les vitesses et les tailles ne sont pas à l’échelle ; l’instant de l’émission α est fixé
 * (la scène doit se rejouer à l’identique). Les valeurs (équations, E_lib) sont celles du cours, exactes.
 */
const { fr, protocole } = window.Tableau;
const bulle = (el, t, k) => window.Tableau.bulle(el, String(t).replace(/_\{?([^}\s]*)\}?/g, '$1'), k);   // jamais de « _ » visible
const $ = id => document.getElementById(id);
const VUES = ['fission', 'chaine', 'fusion', 'spontanee'];
const TEMPERATURES = ['basse', 'haute'];
const q = new URLSearchParams(location.search);
const P = { vue: VUES.includes(q.get('vue')) ? q.get('vue') : 'fission', temperature: TEMPERATURES.includes(q.get('temperature')) ? q.get('temperature') : 'basse' };
const S = { t: 0, running: false, jusqua: null, motif: '', fait: false, emis: 0 };
const NOMS_VUES = { fission: 'La fission', chaine: 'La réaction en chaîne', fusion: 'La fusion', spontanee: 'La réaction spontanée' };
const EQUATIONS = {
  fission: '²³⁵₉₂U + ¹₀n → ⁹⁴₃₈Sr + ¹⁴⁰₅₄Xe + 2 ¹₀n',
  fusion: '²₁H + ³₁H → ⁴₂He + ¹₀n',
  spontanee: '²¹⁰₈₄Po → ²⁰⁶₈₂Pb + ⁴₂He',
};

/* ── Instants clés (s de la scène) : [nom, instant, ce qu’on voit] ─────────────────────────── */
function suite() {
  if (P.vue === 'chaine') return [
    ['premiere_fission', 2.6, 'la première fission : un neutron frappe un noyau d’uranium 235, il se scinde et libère 2 neutrons'],
    ['deux_fissions', 4.6, 'les 2 neutrons provoquent 2 fissions, qui libèrent 4 neutrons'],
    ['quatre_fissions', 6.6, 'les 4 neutrons provoquent 4 fissions, qui libèrent 8 neutrons'],
    ['legende', 9.6, 'la légende de la réaction en chaîne est écrite'], ['fin', 10.4, 'fin']];
  if (P.vue === 'fusion') {
    if (P.temperature === 'haute') return [
      ['chauffage', 1.0, 'la température est déjà très élevée : ≈ 10⁸ K'],
      ['approche', 1.6, 'deux noyaux légers ²₁H et ³₁H foncent l’un vers l’autre'],
      ['repulsion', 2.2, 'ils se repoussent, mais vont assez vite pour se toucher'],
      ['fusion', 3.0, 'ils se touchent et fusionnent'], ['produits', 4.8, 'les produits : ⁴₂He et un neutron qui part'],
      ['energie', 5.6, 'l’énergie libérée : E_lib = 17,6 MeV'], ['equation', 8.2, 'l’équation de la fusion est écrite'],
      ['definition', 10.4, 'la définition de la fusion est écrite'], ['fin', 11.4, 'fin']];
    return [
      ['approche', 1.6, 'deux noyaux légers ²₁H et ³₁H s’approchent l’un de l’autre (basse température)'],
      ['repulsion', 3.6, 'ils se repoussent et rebondissent : deux charges positives'],
      ['chauffage', 5.8, 'on chauffe : température très élevée, ≈ 10⁸ K'],
      ['fusion', 7.6, 'ils foncent l’un vers l’autre, se touchent et fusionnent'], ['produits', 9.4, 'les produits : ⁴₂He et un neutron qui part'],
      ['energie', 10.2, 'l’énergie libérée : E_lib = 17,6 MeV'], ['equation', 12.8, 'l’équation de la fusion est écrite'],
      ['definition', 15.0, 'la définition de la fusion est écrite'], ['fin', 16.0, 'fin']];
  }
  if (P.vue === 'spontanee') return [
    ['noyau_seul', 1.6, 'un noyau de polonium 210 seul : rien ne le touche'],
    ['emission', 3.2, 'à un instant, le noyau émet une particule α'],
    ['produits', 5.0, 'les produits : un noyau de plomb 206 et une particule α (⁴₂He)'],
    ['legende', 8.0, 'l’équation et la légende « réaction spontanée » sont écrites'], ['fin', 9.0, 'fin']];
  return [
    ['neutron_arrive', 1.8, 'un neutron lent arrive de la gauche vers le noyau d’uranium 235'],
    ['choc', 2.6, 'le neutron frappe le noyau et y entre'],
    ['noyau_deforme', 4.2, 'le noyau se déforme : il s’allonge en cacahuète'],
    ['coupure', 5.0, 'le noyau se coupe en deux noyaux moyens'],
    ['produits_partent', 6.4, 'le strontium 94 et le xénon 140 s’écartent vite, 2 neutrons partent'],
    ['energie', 7.0, 'l’énergie libérée : E_lib ≈ 185 MeV'],
    ['equation', 10.6, 'l’équation de la fission est écrite'],
    ['definition', 13.0, 'la définition de la fission est écrite'], ['fin', 14.0, 'fin']];
}
let SUITE = suite();
const moments = () => Object.fromEntries(SUITE.map(([n, t]) => [n, t]));
let M = moments();
const FIN = () => M.fin;
/** Temps d’écriture (s) d’une annotation avant son instant. */
const AV = { equation: 2.8, definition: 2.0, legende: 3.0, energie: 0.8, produits: 1.0, produits_partent: 1.0 };
const av = nom => AV[nom] ?? 0.9;
const a_ = nom => (nom in M ? M[nom] - av(nom) : Infinity);
const fini = nom => nom in M && (S.fait || S.t >= M[nom] - 1e-6);
const vu = nom => nom in M && (S.fait || S.t >= a_(nom));
const tv = () => (S.fait ? FIN() : S.t);                   // le temps de la physique (fin : tout est posé)

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lisse = u => { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); };
const sortie = u => { u = clamp(u, 0, 1); return 1 - (1 - u) ** 3; };     // part vite, ralentit
const lerp = (a, b, u) => a + (b - a) * u;
const lerp2 = (p, q2, u) => [lerp(p[0], q2[0], u), lerp(p[1], q2[1], u)];

/* ── Peinture : nucléons (sphères ombrées), amas, traînée, éclair ──────────────────────────── */
const TEINTES = { p: ['#f6b6b0', '#d9534f', '#6e1d1a'], n: ['#e3ebf3', '#8fa3b8', '#3a4757'] };
function sphere(ctx, x, y, r, k) {
  const [cl, cb, cf] = TEINTES[k];
  const g = ctx.createRadialGradient(x - r * .35, y - r * .4, r * .08, x, y, r);
  g.addColorStop(0, cl); g.addColorStop(.42, cb); g.addColorStop(1, cf);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  if (r > 3.5) { ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(x - r * .38, y - r * .42, r * .22, r * .14, -.6, 0, Math.PI * 2); ctx.fill(); }
}
/** Petite ombre douce sous un objet qui flotte (décalée vers le bas). */
function ombre(ctx, x, y, R) {
  const g = ctx.createRadialGradient(x + R * .12, y + R * .28, R * .2, x + R * .12, y + R * .28, R * 1.08);
  g.addColorStop(0, 'rgba(0,0,0,.30)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x + R * .12, y + R * .28, R * 1.08, 0, Math.PI * 2); ctx.fill();
}
function nucleonLibre(ctx, x, y, r, k) { ombre(ctx, x, y, r); sphere(ctx, x, y, r, k); }
/** Traînée derrière une particule : (dx, dy) = son déplacement récent. */
function trainee(ctx, x, y, dx, dy, r, k = 'n') {
  if (Math.hypot(dx, dy) < 3) return;
  const g = ctx.createLinearGradient(x - dx, y - dy, x, y), c = k === 'p' ? '240,140,130' : '186,204,222';
  g.addColorStop(0, `rgba(${c},0)`); g.addColorStop(1, `rgba(${c},.55)`);
  ctx.save(); ctx.strokeStyle = g; ctx.lineWidth = r * 1.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x - dx, y - dy); ctx.lineTo(x, y); ctx.stroke(); ctx.restore();
}
const MELANGE = {};
const hache = (k, s = 0) => { let x = ((k + 1) * 2654435761 + s * 40503) % 4294967296; x ^= x >>> 15; x = Math.imul(x, 2246822519) >>> 0; x ^= x >>> 13; return x / 4294967296; };
const estProton = (i, Z, A) => {                                // protons et neutrons mêlés au hasard (fixé), sans motif
  if (A <= 4) return Math.floor((i + 1) * Z / A) > Math.floor(i * Z / A);
  const cle = A + '/' + Z;
  if (!MELANGE[cle]) { const rang = Array.from({ length: A }, (_, k) => k).sort((a, b) => hache(a) - hache(b)); MELANGE[cle] = new Set(rang.slice(0, Z)); }
  return MELANGE[cle].has(i);
};
/** Positions (relatives au centre) des nucléons d’un amas compact de A nucléons de rayon r (comme balance.html). */
function positionsAmas(A, r) {
  const d = 1.7 * r;
  if (A === 1) return [[0, 0]];
  if (A === 2) return [[-.5 * d, 0], [.5 * d, 0]];
  if (A === 3) return [[-.5 * d, .29 * d], [.5 * d, .29 * d], [0, -.58 * d]];
  if (A === 4) return [[-.5 * d, .25 * d], [.5 * d, .25 * d], [0, -.6 * d], [0, .05 * d]];
  const pts = []; for (let i = 0; i < A; i++) { const rho = r * 1.05 * Math.sqrt(i), th = i * 2.39996; pts.push([rho * Math.cos(th), rho * Math.sin(th)]); }
  return pts;
}
const rayonAmas = (A, r) => Math.max(...positionsAmas(A, r).map(([x, y]) => Math.hypot(x, y))) + r;
/** Un amas peint une fois dans une image (les gros noyaux ont des centaines de sphères) puis recopié. */
const CACHE = {};
function imageAmas(A, Z, r) {
  const cle = A + '/' + Z + '/' + r; if (CACHE[cle]) return CACHE[cle];
  const R = rayonAmas(A, r), K = 4, m = 2, cv = document.createElement('canvas');
  cv.width = cv.height = Math.ceil((2 * R + 2 * m) * K);
  const g = cv.getContext('2d'); g.scale(K, K); g.translate(R + m, R + m);
  const pts = positionsAmas(A, r).map(([x, y], i) => [x, y, i]);
  if (A > 4) pts.sort((a, b) => Math.hypot(b[0], b[1]) - Math.hypot(a[0], a[1]));   // le cœur devant : une boule
  for (const [x, y, i] of pts) sphere(g, x, y, r, A === 1 ? (Z ? 'p' : 'n') : (estProton(i, Z, A) ? 'p' : 'n'));
  return (CACHE[cle] = { cv, R, L: R + m });
}
/** Un noyau peint au centre (x, y) ; sx, sy : étirement (le noyau qui s’allonge). Renvoie son rayon. */
function noyauPeint(ctx, A, Z, r, x, y, sx = 1, sy = 1) {
  const im = imageAmas(A, Z, r);
  ombre(ctx, x, y, im.R * Math.max(sx, sy));
  ctx.drawImage(im.cv, x - im.L * sx, y - im.L * sy, 2 * im.L * sx, 2 * im.L * sy);
  return im.R;
}
/** L’énergie libérée : un halo jaune-orangé qui s’étend puis s’efface (u de 0 à 1). */
function eclair(ctx, x, y, u, Rmax) {
  if (u <= 0 || u >= 1) return;
  const R = Rmax * (.15 + .85 * Math.sqrt(u)), al = Math.sin(Math.PI * Math.min(1, u * 1.15)) * .9;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(x, y, 0, x, y, R);
  g.addColorStop(0, `rgba(255,250,215,${al})`); g.addColorStop(.25, `rgba(255,214,102,${al * .8})`); g.addColorStop(.6, `rgba(251,146,60,${al * .35})`); g.addColorStop(1, 'rgba(251,146,60,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = `rgba(255,230,150,${al * .7})`; ctx.lineWidth = 2;
  for (let k = 0; k < 12; k++) { const a = k * Math.PI / 6 + .2, r0 = R * .35, r1 = R * .85; ctx.beginPath(); ctx.moveTo(x + r0 * Math.cos(a), y + r0 * Math.sin(a)); ctx.lineTo(x + r1 * Math.cos(a), y + r1 * Math.sin(a)); ctx.stroke(); }
  ctx.restore();
}

/* ── Craie ─────────────────────────────────────────────────────────────────────────────────── */
const VIT = 40;                                  // lettres par seconde pour les annotations
/**
 * Écrit `fn` à la craie au rythme de la scène entre t0 et t1 (s de la scène) : la durée d’écriture est mesurée,
 * puis comprimée s’il le faut, pour que tout soit écrit à t1. Rien avant t0.
 */
function ecritA(c, t0, t1, fn) {
  if (!S.fait && S.t < t0) return;
  const t = c.t, cur = c.cur, comp = c.complet, tip = c.tip;
  let k = 1;
  if (!S.fait) { c.t = -1e9; c.cur = t0; try { fn(); } finally { k = Math.max(1, (c.cur - t0) / Math.max(.1, t1 - t0)); } }
  c.t = S.fait ? Infinity : t0 + (S.t - t0) * k; c.cur = t0; c.tip = tip;
  try { fn(); } finally { const nt = c.tip; c.t = t; c.cur = cur; c.complet = comp; c.tip = nt; }
}
/** Écrit pendant les av(nom) s qui précèdent le moment `nom`. */
const ecrit = (c, nom, fn) => { if (vu(nom)) ecritA(c, a_(nom), M[nom], fn); };
const T = (c, s, x, y, o = {}) => c.texte(s, x, y, { duree: Math.max(.12, String(s).length / VIT), ...o });
/** Écrit un noyau ᴬ_ZX : A en haut à gauche, Z en bas à gauche, alignés à droite contre le symbole. Renvoie la largeur. */
function noyauTexte(c, A, Z, X, x, y, o = {}) {
  const t = o.taille ?? 18, tn = t * .6, wN = Math.max(c.largeurTexte(String(A), tn), c.largeurTexte(String(Z), tn));
  const w = wN + 1 + c.largeurTexte(X, t);
  const x0 = o.align === 'center' ? x - w / 2 : o.align === 'right' ? x - w : x;
  if (o.mesure) return w;
  const d = s => Math.max(.06, String(s).length / VIT);
  c.texte(String(A), x0 + wN, y - .45 * t, { couleur: o.couleur, taille: tn, align: 'right', duree: d(A) });
  c.texte(String(Z), x0 + wN, y + .3 * t, { couleur: o.couleur, taille: tn, align: 'right', duree: d(Z) });
  c.texte(X, x0 + wN + 1, y, { couleur: o.couleur, taille: t, duree: d(X) });
  return w;
}
/** Une ligne faite de morceaux : texte (chaîne ou {t, couleur}) ou noyau {A, Z, X}. `o.pause` : silence entre les termes. */
function ligne(c, parts, x, y, o = {}) {
  const taille = o.taille ?? 16;
  const larg = p => (typeof p === 'string' || p.t != null ? c.largeurTexte(String(p.t ?? p).replace(/[_{}]/g, ''), taille) : noyauTexte(c, p.A, p.Z, p.X, 0, 0, { taille, mesure: true }));
  const tot = parts.reduce((s, p) => s + larg(p), 0);
  let px = o.align === 'center' ? x - tot / 2 : o.align === 'right' ? x - tot : x;
  for (const p of parts) {
    if (typeof p === 'string' || p.t != null) { const s = String(p.t ?? p); if (s.trim()) T(c, s, px, y, { couleur: p.couleur || o.couleur, taille }); }
    else { noyauTexte(c, p.A, p.Z, p.X, px, y, { taille, couleur: p.couleur || o.couleur }); if (o.pause) c.pause(o.pause); }
    px += larg(p);
  }
  return { x: o.align === 'center' ? x - tot / 2 : o.align === 'right' ? x - tot : x, w: tot };
}
const N1 = { A: 1, Z: 0, X: 'n' };
const PARTS_EQ = {
  fission: [{ A: 235, Z: 92, X: 'U' }, ' + ', N1, ' → ', { A: 94, Z: 38, X: 'Sr' }, ' + ', { A: 140, Z: 54, X: 'Xe' }, ' + 2 ', N1],
  fusion: [{ A: 2, Z: 1, X: 'H' }, ' + ', { A: 3, Z: 1, X: 'H' }, ' → ', { A: 4, Z: 2, X: 'He' }, ' + ', N1],
  spontanee: [{ A: 210, Z: 84, X: 'Po' }, ' → ', { A: 206, Z: 82, X: 'Pb' }, ' + ', { A: 4, Z: 2, X: 'He' }],
};
const VB = { x: 6, y: 32, w: 748, h: 382 };
const Y_EQ = 330, Y_DEF = 384;
/** L’équation, terme par terme, et son repère. */
function equation(c, vue, nom) {
  const parts = PARTS_EQ[vue];
  c.repere('equation', 380 - 190, Y_EQ - 30, 380, 42, `l’équation : ${EQUATIONS[vue]}`);
  ecrit(c, nom, () => ligne(c, parts, 380, Y_EQ, { taille: 24, couleur: 'blanc', align: 'center', pause: .22 }));
}
/** La phrase de définition (encadrée) et son repère. */
function definition(c, nom, texte, id = 'definition') {
  c.repere(id, 14, Y_DEF - 22, 732, 32, texte);
  ecrit(c, nom, () => {
    T(c, texte, 380, Y_DEF, { couleur: 'jaune', taille: 17, align: 'center', max: 716 });
    c.rect(16, Y_DEF - 21, 728, 30, { couleur: 'jaune', arrondi: 7, largeur: 1.3, alpha: .7 });
  });
}
/** Commun à toutes les vues : titre, cadre de la vue, légende des couleurs. */
function cadreVue(c) {
  c.texte(NOMS_VUES[P.vue], 14, 24, { couleur: 'cyan', taille: 17 });
  c.rect(VB.x, VB.y, VB.w, VB.h, { couleur: 'tresfaible', arrondi: 8, duree: .5 });
  c.repere('vue_' + P.vue, VB.x, VB.y, VB.w, VB.h, 'la vue « ' + NOMS_VUES[P.vue] + ' »');
  c.direct(() => { sphere(c.ctx, 22, 50, 6, 'p'); sphere(c.ctx, 84, 50, 6, 'n'); });
  c.texte('proton', 32, 55, { couleur: 'faible', taille: 13 });
  c.texte('neutron', 94, 55, { couleur: 'faible', taille: 13 });
}
/** Une légende de phase, visible de son écriture jusqu’à `jusqua` (le professeur l’efface ensuite). */
function legendePhase(c, nom, texte, x, y, jusqua = Infinity, o = {}) {
  if (!vu(nom) || (!S.fait && S.t >= jusqua) || (S.fait && jusqua < FIN())) return;
  ecrit(c, nom, () => T(c, texte, x, y, { couleur: 'faible', taille: 15, align: 'center', ...o }));
}

/* ══ Vue « La fission » ══════════════════════════════════════════════════════════════════════ */
const FI = (() => {
  const C = [330, 165], r = 3.2, A = 235, R = rayonAmas(A, r), RN = 6;
  const pts = positionsAmas(A, r); pts.push([-(R - r), 0]);              // + le neutron absorbé (indice 235)
  const n = pts.length, ordre = [...pts.keys()].sort((a, b) => pts[a][0] - pts[b][0]);
  const xe = ordre.slice(0, 140), nn = ordre.slice(140, 142), sr = ordre.slice(142);   // 140 + 2 + 94 = 236
  const sorte = new Array(n).fill('n');
  const choisir = (g, nb, s) => g.filter(i => i !== 235).sort((a, b) => hache(a, s) - hache(b, s)).slice(0, nb).forEach(i => { sorte[i] = 'p'; });
  choisir(xe, 54, 1); choisir(sr, 38, 2);                                 // Z(Xe) = 54, Z(Sr) = 38 : 92 protons en tout
  const xb = (pts[nn[0]][0] + pts[nn[1]][0]) / 2;                          // le col de la cacahuète
  const deforme = ([x, y], e) => [xb + (x - xb) * (1 + .6 * e), y * (1 - .1 * e) * (1 - .62 * e * Math.exp(-(((x - xb) / (.4 * R)) ** 2)))];
  const centre = g => g.reduce(([sx, sy], i) => { const p = deforme(pts[i], 1); return [sx + p[0] / g.length, sy + p[1] / g.length]; }, [0, 0]);
  const gXe = centre(xe), gSr = centre(sr);
  const places = (g, c0, Ag) => {                                        // chaque nucléon garde sa direction depuis le centre du groupe :
    const Rf = rayonAmas(Ag, r) - r, out = {}, d = i => { const p = deforme(pts[i], 1); return [p[0] - c0[0], p[1] - c0[1]]; };   // l’amas s’arrondit sans se brouiller
    g.slice().sort((a, b) => Math.hypot(...d(a)) - Math.hypot(...d(b))).forEach((i, k) => {
      const [dx, dy] = d(i), L = Math.hypot(dx, dy) || 1, rho = Rf * Math.sqrt((k + .5) / g.length);
      out[i] = [dx / L * rho, dy / L * rho];
    });

function resume() { if (S.running) return; if (S.fait || S.t >= FIN()) return start(); S.running = true; $('run').textContent = 'Pause'; bulle($('feedback'), 'Observe…'); pont.noter('resume'); pont.emettre(); }
function setTime(p) {
  const t = +p.time_s; if (!Number.isFinite(t)) return;
  S.running = false; S.jusqua = null; S.t = clamp(t, 0, FIN()); S.fait = S.t >= FIN();
  $('run').textContent = S.fait ? 'Rejouer' : 'Reprendre'; scene.sale = true;
  bulle($('feedback'), `Arrêt sur image : t = ${fr(S.t, 2)} s.`); pont.noter('set_time', { time_s: S.t }); pont.emettre();
}
function recalculer() { SUITE = suite(); M = moments(); }
function remettre() { S.running = false; S.jusqua = null; S.t = 0; S.fait = false; $('run').textContent = 'Lancer'; scene.reecrire(); }
function setParameters(p) {
  p = p || {};
  const avant = P.vue + '/' + P.temperature;
  if (VUES.includes(p.vue)) P.vue = p.vue;
  if (TEMPERATURES.includes(p.temperature)) P.temperature = p.temperature;
  recalculer();
  if (P.vue + '/' + P.temperature !== avant) remettre();
  scene.sale = true;
  bulle($('feedback'), reglage());
  pont.noter('set_parameters', params()); pont.emettre(); pont.manifeste();
}
function reglage() {
  if (P.vue === 'fusion') return `Fusion : ${EQUATIONS.fusion} — température de départ ${P.temperature}.`;
  return { fission: `Fission : ${EQUATIONS.fission}.`, chaine: 'La réaction en chaîne : 1 → 2 → 4 fissions.', spontanee: `Réaction spontanée : ${EQUATIONS.spontanee}.` }[P.vue];
}
function params() {
  return { vue: P.vue, temperature: P.vue === 'fusion' ? P.temperature : null,
    equation: EQUATIONS[P.vue] || null, E_lib_MeV: { fission: '≈ 185', fusion: '17,6', spontanee: '5,4', chaine: null }[P.vue] };
}
$('run').onclick = () => (S.running ? pause() : (S.t > 0 && S.t < FIN() && !S.fait ? resume() : start()));

/* Poignée de l’élève (vue fusion) : le thermomètre — une touche bascule la température de départ (basse ↔ haute), et la scène repart. */
window.Tableau.glisser(canvas, {
  toucher: (px, py) => {
    if (P.vue !== 'fusion') return null;
    const [x, y] = scene.local(px, py), { x: tx, y0, by } = FU.TH;
    return Math.abs(x - tx) < 26 && y > y0 - 12 && y < by + 56 ? 'thermometre' : null;
  },
  bouger: () => {},
  lacher: () => {
    P.temperature = P.temperature === 'basse' ? 'haute' : 'basse';
    recalculer(); S.jusqua = null; S.t = 0; S.fait = false; scene.sale = true;
    pont.noter('set_parameters', params()); start(); bulle($('feedback'), reglage());
  },
});

const EXPLICATIONS = {

    { repere: 'neutron', texte: 'Un neutron lent arrive sur un noyau d’uranium 235.' },

  ],
};
window.Tableau.explication(EXPLICATIONS);
const commandes = ['start', 'reset', 'pause', 'resume', 'set_time', 'set_parameters', 'play_until'];
const config = { id: 'energie_nucleaire_reactions', version: '1.0', title: 'Les réactions nucléaires', variants: VUES.map(v => ({ id: v, label: NOMS_VUES[v] })), commands: commandes,
  command_schema: {
    set_parameters: { vue: 'fission | chaine | fusion | spontanee (change la scène et la remet à zéro)', temperature: 'basse | haute (vue fusion : température de départ ; basse = ils se repoussent puis on chauffe ; haute = déjà ≈ 10⁸ K, ils fusionnent tout de suite)' },
    set_time: { time_s: '0..fin (arrêt sur cet instant, s ; voir moments)' },
    play_until: { moment: 'fission : neutron_arrive | choc | noyau_deforme | coupure | produits_partent | energie | equation | definition | fin ; chaine : premiere_fission | deux_fissions | quatre_fissions | legende | fin ; fusion : approche | repulsion | chauffage | fusion | produits | energie | equation | definition | fin ; spontanee : noyau_seul | emission | produits | legende | fin (rejoue et se fige à cet instant clé)', time_s: 'ou un instant en s' } } };
const pont = protocole({ id: config.id, commandes, config,
  texte: 'Les réactions nucléaires, dessinées au tableau (protons rouges, neutrons gris-bleu). Réaction spontanée : ²¹⁰₈₄Po → ²⁰⁶₈₂Pb + ⁴₂He, le noyau se transforme seul (radioactivité). Fission : ²³⁵₉₂U + ¹₀n → ⁹⁴₃₈Sr + ¹⁴⁰₅₄Xe + 2 ¹₀n, un noyau lourd frappé par un neutron se scinde en deux noyaux plus légers (E_lib ≈ 185 MeV). Réaction en chaîne : chaque fission libère des neutrons qui provoquent d’autres fissions (1, 2, 4…). Fusion : ²₁H + ³₁H → ⁴₂He + ¹₀n, deux noyaux légers s’unissent en un noyau plus lourd ; il faut une température très élevée (≈ 10⁸ K) car ils se repoussent (E_lib = 17,6 MeV).',
  etat: () => ({ simulation_status: S.running ? 'running' : (S.fait ? 'finished' : (S.t > 0 ? 'paused' : 'idle')), ce_qui_se_voit: ceQuiSeVoit(), current_variant: P.vue,
    time_s: +S.t.toFixed(3), parameters: params(), moments: moments(), equation_ecrite: equationEcrite() }),
  progression: () => (S.fait ? 1 : 0),
  executer: (cmd, p) => ({ start, reset, pause, resume, set_time: () => setTime(p), set_parameters: () => setParameters(p), play_until: () => playUntil(p) })[cmd]?.() });
bulle($('feedback'), 'On va regarder des noyaux se transformer…');
setTimeout(() => { if (!S.running && S.t === 0) start(); }, 1600);
