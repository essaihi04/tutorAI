<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Combien de termes ? — les arbres et la colonne</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="/media/simulations/maths/commun/maths.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Trois arbres numérotés 5, 6, 7 le long d’une route : 7 − 5 + 1 = 3 ; une colonne de termes uₖ = 1 + vₖ dont on sépare les 1 et les vₖ"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start reset pause resume play_until set_time set_parameters">Pause</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="/media/simulations/maths/commun/exposants.js"></script>
<script src="/media/simulations/maths/commun/maths-tableau.js"></script>
<script src="/media/simulations/maths/commun/compter.js"></script>
<script src="/media/simulations/maths/suites-tableau/su-outils.js"></script>
<script>
/*
 * Cours « Suites numériques » (math_ch3_suites_numeriques) : nombre de termes d’une somme (a8) et somme d’une suite
 * uₖ = 1 + vₖ (p2, national 2022 R). Vues : ?vue=arbres | colonne.
 */
function arbre(c, x, base) {
  c.ligne(x - 4, base, x - 3, base - 58, { couleur: 'orange', largeur: 2.2 });
  c.ligne(x + 4, base, x + 3, base - 58, { couleur: 'orange', largeur: 2.2 });
  c.cercle(x, base - 86, 34, { couleur: 'vert', largeur: 2.2, fond: 'vert', fondAlpha: .1 });
}
/* Tableau large (SU.large, 15 novembre 2026) : la vue remonte et l'exemple / la somme passent à droite ; le kit l'agrandit
 * alors sur toute la largeur. */
let LG = false;
MathsTableau.page({ net: true,
  id: 'su_arbres', titre: 'Combien de termes ?',
  texte: 'Constructions à la craie : trois arbres numérotés 5, 6, 7 (de uₚ à uₙ il y a n − p + 1 termes) ; la somme des uₖ = 1 + vₖ séparée en 2022 fois 1 et une somme géométrique',
  vues: {
    arbres: {
      titre: 'De uₚ à uₙ : n − p + 1 termes',
      dessiner(c, K) {
        LG = SU.large(c);
        K.titre('Combien de termes dans une somme ?');
        const XS = [90, 200, 310], BASE = LG ? 214 : 250, d = LG ? -36 : 0;
        c.ligne(30, BASE + 4, 380, BASE + 4, { couleur: 'faible', largeur: 1.8 });
        c.ligne(30, BASE + 40, 380, BASE + 40, { couleur: 'faible', largeur: 1.8 });
        XS.forEach((x, i) => { c.pause(.2); arbre(c, x, BASE); c.texte(String(5 + i), x, BASE + 30, { couleur: 'jaune', taille: 22, align: 'center' }); });
        c.repere('arbres', 40, 120 + d, 320, 180, 'les arbres numéros 5, 6 et 7');
        K.marque('arbres');
        // on compte les arbres en les allumant un à un (règle 16) : 1, 2, 3 — puis le total s'écrit
        MathsCompte.compter(c, K, XS.map((x, i) => ({ x: x - 42, y: BASE - 124, w: 84, h: 160, libelle: `l’arbre numéro ${5 + i}` })), { prefixe: 'arbre', couleur: 'cyan', pas: .55 });
        c.pause(.4);
        c.texte('du 5 au 7 :', 420, 110 + d, { couleur: 'blanc', taille: 20 });
        c.texte('7 − 5 + 1 = 3 arbres', 420, 146 + d, { couleur: 'jaune', taille: 22 });
        c.texte('(et pas 7 − 5 = 2)', 420, 176 + d, { couleur: 'orange', taille: 17 });
        K.marque('compte');
        c.pause(.4);
        c.rect(410, 200 + d, 330, 70, { couleur: 'jaune', arrondi: 8, largeur: 1.8 });
        c.texte('de u_p à u_n :', 425, 228 + d, { couleur: 'blanc', taille: 19 });
        c.texte('n − p + 1 termes', 425, 258 + d, { couleur: 'jaune', taille: 22 });
        c.repere('regle', 406, 196 + d, 338, 78, 'la règle : n − p + 1 termes');
        K.marque('regle');
        c.pause(.4);
        c.texte('de u_0 à u_{2021} :', LG ? 420 : 30, LG ? 268 : 322, { couleur: 'cyan', taille: 19 });
        c.texte('2021 − 0 + 1 = 2022 termes', LG ? 420 : 220, LG ? 298 : 322, { couleur: 'cyan', taille: 21 });
        if (LG) c.repere('exemple', 414, 248, 330, 58, 'de u₀ à u₂₀₂₁ : 2022 termes');
        else c.repere('exemple', 26, 300, 470, 30, 'de u₀ à u₂₀₂₁ : 2022 termes');
        K.marque('exemple');
      },
      decrire: {
        arbres: 'Trois arbres à la craie le long d’une route, numérotés 5, 6 et 7.',
        arbre_1: 'On compte : l’arbre numéro 5 s’allume, pastille 1.',
        arbre_2: 'L’arbre numéro 6 s’allume, pastille 2.',
        arbre_3: 'L’arbre numéro 7 s’allume, pastille 3 : trois arbres.',
        compte: 'Écrit : du 5 au 7 : 7 − 5 + 1 = 3 arbres (et pas 7 − 5 = 2).',
        regle: 'Encadré : de uₚ à uₙ : n − p + 1 termes.',
        exemple: 'En bas : de u₀ à u₂₀₂₁ : 2021 − 0 + 1 = 2022 termes.',
      },
      explication: [{ repere: 'arbres', texte: 'Trois arbres, du numéro 5 au numéro 7.' }, { repere: 'regle', texte: 'Dernier moins premier, plus un.' }],
    },
    colonne: {
      titre: 'La somme des uₖ = 1 + vₖ',
      dessiner(c, K) {
        LG = SU.large(c);
        K.titre('Une somme qui n’est pas géométrique');
        const L = [['u_0 = ', 'v_0'], ['u_1 = ', 'v_1'], ['u_2 = ', 'v_2'], null, ['u_{2021} = ', 'v_{2021}']];
        const uns = [], vs = [];
        L.forEach((l, i) => {
          const y = LG ? 76 + i * 34 : 82 + i * 40;
          c.pause(.15);
          if (!l) { c.texte('⋮', 120, y, { couleur: 'faible', taille: 22 }); return; }
          const xs = SU.morceaux(c, 40, y, [{ t: l[0] }, { t: '1', couleur: 'vert' }, { t: ' + ' }, { t: l[1], couleur: 'jaune' }], { taille: 21 });
          uns.push([xs[1], y]); vs.push([xs[3], xs[4], y]);
        });
        c.repere('colonne', 34, LG ? 52 : 58, 260, LG ? 172 : 200, 'la colonne uₖ = 1 + vₖ');
        K.marque('colonne');
        c.pause(.4);
        // les 1 comptés en les allumant un à un (règle 16) : 1, 2, 3, … puis le dernier, le 2022ᵉ
        MathsCompte.compter(c, K, uns.map(([x, y], i) => ({ x: x + 5, y: y - 7, r: 11, bx: 16, n: i === uns.length - 1 ? 2022 : i + 1, libelle: i === uns.length - 1 ? 'le 1 de u₂₀₂₁ : le 2022ᵉ' : `le 1 de u${'₀₁₂'[i]}` })),
          { prefixe: 'un', couleur: 'vert', pas: .5, rayonPastille: 13, taille: 14 });
        c.texte('2022 fois 1 = 2022', 360, LG ? 100 : 110, { couleur: 'vert', taille: 21 });
        c.repere('les_un', 340, LG ? 76 : 86, 260, 34, 'les 1 : 2022 fois 1');
        K.marque('les_un');
        c.pause(.4);
        const xv = Math.max(...vs.map(v => v[1])) + 12;
        SU.accolade(c, xv, LG ? 56 : 62, LG ? 218 : 252, { couleur: 'jaune' });
        c.texte('v_0 + … + v_{2021} :', 360, LG ? 156 : 180, { couleur: 'jaune', taille: 20 });
        c.texte('somme géométrique', 360, LG ? 184 : 210, { couleur: 'jaune', taille: 20 });
        c.repere('les_v', xv - 4, LG ? 56 : 62, 380, LG ? 162 : 190, 'les vₖ : une somme géométrique');
        K.marque('les_v');
        c.pause(.4);
        c.rect(LG ? 330 : 40, LG ? 226 : 290, LG ? 420 : 560, 46, { couleur: 'blanc', arrondi: 8, largeur: 1.6 });
        c.texte('S = 2022 + (v_0 + v_1 + … + v_{2021})', LG ? 344 : 60, LG ? 257 : 321, { couleur: 'blanc', taille: 22, max: LG ? 396 : 540 });
        c.repere('somme', LG ? 326 : 36, LG ? 222 : 286, LG ? 428 : 568, 54, 'la somme S');
        K.marque('somme');
      },
      decrire: {
        colonne: 'Une colonne : u₀ = 1 + v₀, u₁ = 1 + v₁, u₂ = 1 + v₂, ⋮, u₂₀₂₁ = 1 + v₂₀₂₁ ; les 1 en vert, les vₖ en jaune.',
        un_1: 'Le 1 de u₀ s’allume : 1.', un_2: 'Le 1 de u₁ : 2.', un_3: 'Le 1 de u₂ : 3.', un_4: 'Le 1 de u₂₀₂₁ : 2022.',
        les_un: 'Les 1 allumés un à un en vert (1, 2, 3, …, 2022) : 2022 fois 1 = 2022.',
        les_v: 'Une accolade jaune rassemble les vₖ : v₀ + … + v₂₀₂₁, une somme géométrique.',
        somme: 'Encadré : S = 2022 + (v₀ + v₁ + … + v₂₀₂₁).',
      },
      explication: [{ repere: 'les_un', texte: 'Autant de 1 que de termes : 2022.' }, { repere: 'les_v', texte: 'Le reste est une somme géométrique.' }],
    },
  },
});
</script>
<script src="/media/simulations/professor-locate.js" defer></script>
</body></html>
