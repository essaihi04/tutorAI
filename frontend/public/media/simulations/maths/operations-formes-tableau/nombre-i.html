<script>
/*
 * Cours « Nombres complexes, première partie » (math_ch6_nombres_complexes) : le nombre i.
 * Vues : ?vue=droite | quart | cycle (param n).
 * droite : droite, carres, bloque (repères du même nom).
 * quart : demi_tour, quart_de_tour, deux_quarts, solutions (repères du même nom).
 * cycle : un, tours, cycle, compteur (repères du même nom).
 */
const fr = MathsTableau.fr;
const SUPS = { '⁻': '−', '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9' };
const BARRE = '̄';
/** Taille réellement écrite par le kit (petit écran : taille minimale). */
const tv = (c, t) => (c.echelle && c.tailleMin ? Math.max(t, c.tailleMin / c.echelle) : t);
/** Largeur réelle d’un texte à la craie, exposants et indices compris. */
function L(c, s, t = 18) {
  s = String(s).split(BARRE).join('').replace(/[⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, g => '^{' + [...g].map(ch => SUPS[ch]).join('') + '}');
  let w = 0;
  for (const seg of Tableau.Craie.segments(s)) { c.ctx.font = `${seg.sub || seg.sup ? t * .62 : t}px ${Tableau.POLICE}`; w += c.ctx.measureText(seg.t).width; }
  return w;
}
/** Écrit s ; une lettre suivie de U+0304 (z̄) reçoit une barre DESSINÉE au trait au-dessus. Renvoie la largeur. */
function ecrire(c, s, x, y, o = {}) {
  const t = tv(c, o.taille ?? 18), barres = []; let net = '';
  for (const ch of String(s)) { if (ch === BARRE) { if (net) barres.push(net.length - 1); } else net += ch; }
  const w = L(c, net, t), x0 = o.align === 'center' ? x - w / 2 : o.align === 'right' ? x - w : x;
  c.texte(net, x, y, o);
  for (const i of barres) barre(c, x0 + L(c, net.slice(0, i), t), y - t * .66, L(c, net[i], t), o.couleur);
  return w;
}
/** La barre du conjugué, tracée au trait au-dessus de la lettre. */
function barre(c, x, y, largeur, couleur) { c.ligne(x + largeur * .05, y, x + largeur * .95, y, { couleur: couleur || 'blanc', largeur: 1.8, duree: .08, tremble: .3 }); }
/** Morceaux de couleurs différentes sur une ligne : [[texte, couleur], …]. */
function morceaux(c, parts, x, y, o = {}) {
  const t = tv(c, o.taille ?? 18);
  let w = parts.reduce((s, [p]) => s + L(c, p, t), 0), px = o.align === 'center' ? x - w / 2 : o.align === 'right' ? x - w : x;
  for (const [p, col] of parts) px += ecrire(c, p, px, y, { ...o, align: 'left', couleur: col });
  return w;
}
/** Texte encadré ; renvoie le rectangle [x, y, w, h]. */
function encadre(c, s, x, y, taille, couleur, coulTexte) {
  const w = L(c, s, tv(c, taille)) + 18;
  ecrire(c, s, x, y, { couleur: coulTexte || couleur, taille });
  c.rect(x - 9, y - taille - 4, w, taille + 14, { couleur, arrondi: 8, largeur: 1.6 });
  return [x - 9, y - taille - 4, w, taille + 14];
}
/** Petite flèche au-dessus d’une lettre (vecteur u, v). */
function vecL(c, xc, y, w, couleur = 'blanc') {
  c.ligne(xc - w / 2, y, xc + w / 2, y, { couleur, largeur: 1.3, duree: .05 });
  c.trait([[xc + w / 2 - 4, y - 3], [xc + w / 2, y], [xc + w / 2 - 4, y + 3]], { couleur, largeur: 1.3, duree: .05 });
}
/** z = a + ib écrit à la française. */
function zs(a, b) {
  if (b === 0) return fr(a);
  const B = Math.abs(b) === 1 ? '' : fr(Math.abs(b));
  if (a === 0) return (b < 0 ? '−' : '') + B + 'i';
  return fr(a) + (b < 0 ? ' − ' : ' + ') + B + 'i';
}
/** Un repère orthonormé : O en (ox ; oy) px, u px par unité. */
function rep(o) {
  return MathsTableau.grille({ x0: o.ox + o.xmin * o.u, y0: o.oy - o.ymax * o.u, w: (o.xmax - o.xmin) * o.u, h: (o.ymax - o.ymin) * o.u, xmin: o.xmin, xmax: o.xmax, ymin: o.ymin, ymax: o.ymax });
}
/** Le plan complexe : axe réel, axe imaginaire, O, u, v, graduations. */
function plan(c, o) {
  const G = rep(o), X = G.X, Y = G.Y, f = { couleur: 'faible', largeur: 1.6 };
  if (o.quadrillage) {
    for (let k = Math.ceil(o.xmin); k <= o.xmax - .3; k++) if (k) c.ligne(X(k), Y(o.ymin), X(k), Y(o.ymax), { couleur: 'tresfaible', largeur: .8, duree: .02 });
    for (let k = Math.ceil(o.ymin); k <= o.ymax - .3; k++) if (k) c.ligne(X(o.xmin), Y(k), X(o.xmax), Y(k), { couleur: 'tresfaible', largeur: .8, duree: .02 });
  }
  c.fleche(X(o.xmin), Y(0), X(o.xmax), Y(0), f);
  c.fleche(X(0), Y(o.ymin), X(0), Y(o.ymax), f);
  const pas = o.pas || 1;
  for (let k = Math.ceil(o.xmin); k <= o.xmax - .3; k++) if (k) {
    c.ligne(X(k), Y(0) - 4, X(k), Y(0) + 4, { couleur: 'faible', largeur: 1.2, duree: .02 });
    if (k % pas === 0) c.texte(fr(k), X(k), Y(0) + 19, { couleur: 'faible', taille: 13, align: 'center', duree: .04 });
  }
  for (let k = Math.ceil(o.ymin); k <= o.ymax - .3; k++) if (k) {
    c.ligne(X(0) - 4, Y(k), X(0) + 4, Y(k), { couleur: 'faible', largeur: 1.2, duree: .02 });
    if (k % pas === 0) c.texte(fr(k), X(0) - 8, Y(k) + 5, { couleur: 'faible', taille: 13, align: 'right', duree: .04 });
  }
  c.texte('O', X(0) - 13, Y(0) + 18, { couleur: 'faible', taille: 14 });
  c.texte('axe réel', X(o.xmax) - 2, Y(0) - 9, { couleur: 'faible', taille: 14, align: 'right' });
  c.texte('axe imaginaire', X(0) + 9, Y(o.ymax) + 10, { couleur: 'faible', taille: 14 });
  c.fleche(X(0), Y(0), X(1), Y(0), { couleur: 'blanc', largeur: 2.6, tete: 8 });
  c.fleche(X(0), Y(0), X(0), Y(1), { couleur: 'blanc', largeur: 2.6, tete: 8 });
  c.texte('u', X(.5), Y(0) - 8, { couleur: 'blanc', taille: 15, align: 'center' }); vecL(c, X(.5), Y(0) - 21, 9);
  c.texte('v', X(0) - 11, Y(.5) + 5, { couleur: 'blanc', taille: 15, align: 'center' }); vecL(c, X(0) - 11, Y(.5) - 8, 9);
  return G;
}
/** Le cadre d’un repère entier (pour c.repere). */
const cadreRep = (G) => [G.x0, G.y0, G.w, G.h];

/** Arc orienté de centre (cx ; cy), rayon r, de l’angle a0 à a1 (radians, sens direct = vers le haut), pointe de flèche au bout. */
function arcF(c, cx, cy, r, a0, a1, o = {}) {
  const P = a => [cx + r * Math.cos(a), cy - r * Math.sin(a)];
  c.courbe(u => P(a0 + (a1 - a0) * u), Math.max(8, Math.round(Math.abs(a1 - a0) * r / 6)), { couleur: o.couleur || 'blanc', largeur: o.largeur ?? 2, pointille: o.pointille, duree: o.duree });
  if (o.tete === false) return;
  const [x, y] = P(a1), s = Math.sign(a1 - a0) || 1, dx = -Math.sin(a1) * s, dy = -Math.cos(a1) * s, t = o.tete ?? 9, an = Math.atan2(dy, dx);
  c.trait([[x - t * Math.cos(an - .45), y - t * Math.sin(an - .45)], [x, y], [x - t * Math.cos(an + .45), y - t * Math.sin(an + .45)]], { couleur: o.couleur || 'blanc', largeur: o.largeur ?? 2, duree: .06 });
}
const PUISS = ['1', 'i', '−1', '−i'];
const XR = 480;

        bloque: 'La demi-droite des négatifs est repassée en rouge : « aucun carré ici » ; en haut, « x² = −1 : aucun réel » (« aucun réel » en rouge), toute la ligne barrée en rouge ; à droite, en jaune : « il faut un nouveau nombre ».',

        c.texte('i⁵ = i, i⁶ = −1, i⁷ = −i, i⁸ = 1…', XC, 140, { couleur: 'blanc', taille: 18 });
        c.repere('cycle', r[0], r[1], Math.max(r[2], 300), 140 - r[1] + 8, 'tous les 4, on revient : i⁴ = 1');
        K.marque('cycle');
        c.pause(.4);
        K.anime(Math.max(.8, .35 * n), p => {
          const [x, y] = P(n * Math.PI / 2 * p);
          c.cercle(x, y, 11, { couleur: 'jaune', largeur: 2 });
          c.point(x, y, 7, 'jaune');
        });
        const q = Math.floor(n / 4), rr = n % 4;
        c.texte(`i^{${n}} = ${PUISS[rr]}`, XC, 210, { couleur: 'jaune', taille: 28 });
        c.texte(`${n} = 4 × ${q} + ${rr} : i^{${n}} = i^{${rr}} = ${PUISS[rr]}`, XC, 248, { couleur: 'blanc', taille: 18 });
        c.texte('glisse le point jaune : n change', XC, 300, { couleur: 'faible', taille: 16 });
        const [px, py] = P(n * Math.PI / 2);
        c.repere('compteur', Math.min(px, XC) - 16, Math.min(py, 180) - 16, Math.max(px, XC + 240) - Math.min(px, XC) + 32, Math.max(py, 256) - Math.min(py, 180) + 32, `i^${n} = ${PUISS[rr]}`);
        K.marque('compteur');
      },
      poignees(K) {
        const ox = 250, oy = 200, u = 95, n = Math.round(K.P.n), a = n * Math.PI / 2;
        return [{ id: 'n', x: ox + u * Math.cos(a), y: oy - u * Math.sin(a), bouger: (px, py) => {
          const k = ((Math.round(Math.atan2(oy - py, px - ox) / (Math.PI / 2)) % 4) + 4) % 4;
          let best = n, d = 99;
          for (let m = 0; m <= 12; m++) if (m % 4 === k && Math.abs(m - n) < d) { d = Math.abs(m - n); best = m; }
          return { n: best };
        } }];
      },
      lecture: K => { const n = Math.round(K.P.n); return `n = ${n} : ${n} = 4 × ${Math.floor(n / 4)} + ${n % 4}, donc i^${n} = i^${n % 4} = ${PUISS[n % 4]}.`; },
      decrire: K => {
        const n = Math.round(K.P.n);
        return {
          un: 'Deux axes et un cercle pointillé de rayon 1 ; le point 1 sur l’axe réel : « i⁰ = 1 ».',
          tours: 'Un quart de tour à la fois, une flèche courbe entre chaque : i¹ = i en haut, i² = −1 à gauche, i³ = −i en bas, i⁴ = 1 de retour à droite.',
          cycle: 'À droite, encadré jaune « tous les 4, on revient : i⁴ = 1 » ; dessous « i⁵ = i, i⁶ = −1, i⁷ = −i, i⁸ = 1… ».',
          compteur: `Un point jaune tourne de ${n} quart${n > 1 ? 's' : ''} de tour et se pose sur i^${n} = ${PUISS[n % 4]} ; à droite « i^${n} = ${PUISS[n % 4]} » et « ${n} = 4 × ${Math.floor(n / 4)} + ${n % 4} : i^${n} = i^${n % 4} = ${PUISS[n % 4]} ».`,
        };
      },
      motifs: { un: 'i⁰ = 1', tours: 'les quarts de tour', cycle: 'le cycle de 4', compteur: 'iⁿ' },
      explication: [
        { repere: 'un', texte: 'On part de 1 : i⁰ = 1.' },
        { repere: 'tours', texte: 'Chaque multiplication par i fait un quart de tour : i, −1, −i, puis 1.' },
        { repere: 'cycle', texte: 'Tous les 4, on revient au départ : i⁴ = 1.' },
        { repere: 'compteur', texte: 'Pour iⁿ, on divise n par 4 et on garde le reste.' },
      ],
    },
  },
});
</script>
