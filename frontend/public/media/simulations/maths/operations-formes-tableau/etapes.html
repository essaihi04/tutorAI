<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Une étape à la fois — nombres complexes</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="/media/simulations/maths/commun/maths.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Plan complexe à la craie : a = r cos θ et b = r sin θ ; puis l’angle d’un point dans chacun des trois autres quarts du plan"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start reset pause resume play_until set_time">Pause</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="/media/simulations/maths/commun/exposants.js"></script>
<script src="/media/simulations/maths/commun/maths-tableau.js"></script>
<script>
/*
 * Cours « Nombres complexes (première partie) » (math_ch6_nombres_complexes), audit rythme du 14 novembre 2026 :
 * les étapes qui étaient dites d'un seul souffle, une à la fois (professeur règle 33).
 *   cos_sin : point, projections, formules, division        (diapo nc_g4)
 *   quarts  : reference, haut_gauche, bas_gauche, bas_droite, regle   (diapo nc_t3_b)
 * Chaque moment porte aussi un repère du même nom.
 */
const PI = Math.PI;
const T = (c, s, x, y, couleur, taille, o = {}) => c.texte(s, x, y, { couleur, taille, ...o });
function arc(c, ox, oy, r, a0, a1, couleur) {
  const n = Math.max(8, Math.ceil(Math.abs(a1 - a0) * r / 6)), pts = [];
  for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; pts.push([ox + r * Math.cos(a), oy - r * Math.sin(a)]); }
  c.trait(pts, { couleur, largeur: 2 });
  const s = Math.sign(a1 - a0), ex = ox + r * Math.cos(a1), ey = oy - r * Math.sin(a1), ang = Math.atan2(-s * Math.cos(a1), -s * Math.sin(a1));
  c.trait([[ex - 8 * Math.cos(ang - .5), ey - 8 * Math.sin(ang - .5)], [ex, ey], [ex - 8 * Math.cos(ang + .5), ey - 8 * Math.sin(ang + .5)]], { couleur, largeur: 2, duree: .08 });
}
function axes(c, ox, oy, L) {
  c.fleche(ox - L, oy, ox + L + 10, oy, { couleur: 'faible', largeur: 1.5 });
  c.fleche(ox, oy + L - 20, ox, oy - L, { couleur: 'faible', largeur: 1.5 });
  T(c, 'O', ox - 15, oy + 18, 'faible', 14);
  T(c, 'axe réel', ox + L + 8, oy + 20, 'faible', 13, { align: 'right' });
}

MathsTableau.page({
  id: 'nc_etapes', titre: 'Nombres complexes : une étape à la fois',
  texte: 'Constructions à la craie : a = r cos θ et b = r sin θ ; l’angle d’un point dans les quarts du plan à gauche et en bas',
  vues: {
    cos_sin: {
      titre: 'a = r cos θ, b = r sin θ',
      dessiner(c, K) {
        K.titre('Du point M à son angle : a = r cos θ, b = r sin θ');
        const ox = 120, oy = 330, u = 100, r = 2, th = PI / 3;
        const mx = ox + u * r * Math.cos(th), my = oy - u * r * Math.sin(th);
        axes(c, ox, oy, 250);
        c.ligne(ox, oy, mx, my, { couleur: 'jaune', largeur: 2.6 });
        c.point(mx, my, 6, 'cyan'); T(c, 'M(a ; b)', mx + 10, my - 8, 'cyan', 19);
        T(c, 'r = |z|', (ox + mx) / 2 - 14, (oy + my) / 2 - 6, 'jaune', 18, { align: 'right' });
        arc(c, ox, oy, 46, 0, th, 'rose'); T(c, 'θ', ox + 52, oy - 22, 'rose', 20);
        c.repere('point', mx - 14, my - 14, 28, 28, 'le point M, à la distance r de O, à l’angle θ');
        K.marque('point');
        c.pause(.4);
        c.ligne(mx, my, mx, oy, { couleur: 'vert', largeur: 1.6, pointille: [5, 5] });
        c.ligne(ox, oy + 2, mx, oy + 2, { couleur: 'vert', largeur: 4 });
        T(c, 'a', (ox + mx) / 2, oy + 26, 'vert', 22, { align: 'center' });
        c.ligne(mx, my, ox, my, { couleur: 'orange', largeur: 1.6, pointille: [5, 5] });
        c.ligne(ox - 2, oy, ox - 2, my, { couleur: 'orange', largeur: 4 });
        T(c, 'b', ox - 12, (oy + my) / 2, 'orange', 22, { align: 'right' });
        c.repere('projections', ox - 30, my - 10, mx - ox + 40, oy - my + 40, 'a sur l’axe réel, b sur l’axe imaginaire');
        K.marque('projections');
        c.pause(.4);
        K.lignes(430, 110, [
          { t: 'cercle de rayon 1 : (cos θ ; sin θ)', couleur: 'faible', taille: 17 },
          { t: 'cercle de rayon r : tout est fois r', couleur: 'faible', taille: 17 },
          { t: 'a = r cos θ', couleur: 'vert', taille: 25 },
          { t: 'b = r sin θ', couleur: 'orange', taille: 25 },
        ], 36);
        c.repere('formules', 422, 84, 320, 150, 'a = r cos θ et b = r sin θ');
        K.marque('formules');
        c.pause(.4);
        K.lignes(430, 270, [
          { t: 'cos θ = a / r', couleur: 'vert', taille: 25, cadre: 'vert' },
          { t: 'sin θ = b / r', couleur: 'orange', taille: 25, cadre: 'orange' },
        ], 48);
        c.repere('division', 422, 240, 220, 90, 'cos θ = a/r et sin θ = b/r');
        K.marque('division');
      },
      decrire: {
        point: 'Un plan ; le point M(a ; b) à la distance r = |z| de O, segment jaune ; l’angle θ en rose depuis l’axe réel.',
        projections: 'Les projections de M : a en vert sur l’axe réel, b en orange sur l’axe imaginaire.',
        formules: 'À droite : sur le cercle de rayon 1 on lit (cos θ ; sin θ) ; sur le cercle de rayon r tout est multiplié par r : a = r cos θ, b = r sin θ.',
        division: 'Encadrés : cos θ = a/r et sin θ = b/r.',
      },
      motifs: { point: 'le point M', projections: 'a et b', formules: 'a = r cos θ, b = r sin θ', division: 'cos θ = a/r, sin θ = b/r' },
    },

    quarts: {
      titre: 'L’angle dans les trois autres quarts',
      dessiner(c, K) {
        K.titre('Le tableau donne π/6 ; les signes donnent le quart');
        const ox = 230, oy = 215, u = 72, al = PI / 6, R3 = Math.sqrt(3);
        axes(c, ox, oy, 200);
        c.cercle(ox, oy, 2 * u, { couleur: 'tresfaible', largeur: 1, pointille: [3, 6], duree: .3 });
        const pose = (x, y, nom, coul, dx, dy) => { const px = ox + u * x, py = oy - u * y; c.ligne(ox, oy, px, py, { couleur: coul, largeur: 2.2 }); c.point(px, py, 5.5, coul); T(c, nom, px + dx, py + dy, coul, 17, { align: dx < 0 ? 'right' : 'left' }); return [px, py]; };
        const [p0x, p0y] = pose(R3, 1, '√3 + i', 'cyan', 10, -6);
        arc(c, ox, oy, 40, 0, al, 'cyan'); T(c, 'π/6', ox + 46, oy - 8, 'cyan', 16);
        K.lignes(470, 90, [{ t: 'a > 0, b > 0 : θ = π/6', couleur: 'cyan', taille: 19 }]);
        c.repere('reference', p0x - 14, p0y - 14, 120, 40, '√3 + i : l’angle du tableau, π/6');
        K.marque('reference');
        c.pause(.6);
        const [p1x, p1y] = pose(-R3, 1, '−√3 + i', 'jaune', -10, -6);
        arc(c, ox, oy, 54, 0, PI - al, 'jaune'); T(c, '5π/6', ox - 56, oy - 30, 'jaune', 16, { align: 'right' });
        K.lignes(470, 140, [{ t: 'a < 0, b > 0 : θ = π − π/6 = 5π/6', couleur: 'jaune', taille: 19 }]);
        c.repere('haut_gauche', p1x - 90, p1y - 24, 110, 40, 'à gauche en haut : π − π/6');
        K.marque('haut_gauche');
        c.pause(.6);
        const [p2x, p2y] = pose(-R3, -1, '−√3 − i', 'vert', -10, 22);
        arc(c, ox, oy, 68, 0, PI + al, 'vert'); T(c, '7π/6', ox - 70, oy + 44, 'vert', 16, { align: 'right' });
        K.lignes(470, 190, [{ t: 'a < 0, b < 0 : θ = π + π/6 = 7π/6', couleur: 'vert', taille: 19 }]);
        c.repere('bas_gauche', p2x - 90, p2y - 14, 110, 44, 'à gauche en bas : π + π/6');
        K.marque('bas_gauche');
        c.pause(.6);
        const [p3x, p3y] = pose(R3, -1, '√3 − i', 'orange', 10, 22);
        arc(c, ox, oy, 40, 0, -al, 'orange'); T(c, '−π/6', ox + 46, oy + 28, 'orange', 16);
        K.lignes(470, 240, [{ t: 'a > 0, b < 0 : θ = −π/6', couleur: 'orange', taille: 19 }]);
        c.repere('bas_droite', p3x - 14, p3y - 14, 110, 44, 'à droite en bas : −π/6');
        K.marque('bas_droite');
        c.pause(.6);
        K.lignes(470, 300, [
          { t: 'le module est le même : 2', couleur: 'blanc', taille: 18 },
          { t: 'seul le quart change l’angle', couleur: 'blanc', taille: 18 },
        ], 28);
        c.repere('regle', 462, 276, 280, 64, 'le module est le même, le quart change l’angle');
        K.marque('regle');
      },
      decrire: {
        reference: 'Un plan et un cercle pointillé de rayon 2. Le point √3 + i en cyan, à droite en haut, avec l’angle π/6 ; écrit : a > 0, b > 0 : θ = π/6.',
        haut_gauche: 'Le point −√3 + i en jaune, à gauche en haut ; l’arc jaune va jusqu’à 5π/6 ; écrit : a < 0, b > 0 : θ = π − π/6 = 5π/6.',
        bas_gauche: 'Le point −√3 − i en vert, à gauche en bas ; l’arc vert va jusqu’à 7π/6 ; écrit : a < 0, b < 0 : θ = π + π/6 = 7π/6.',
        bas_droite: 'Le point √3 − i en orange, à droite en bas ; l’arc orange descend de π/6 sous l’axe ; écrit : a > 0, b < 0 : θ = −π/6.',
        regle: 'Écrit : le module est le même (2), seul le quart change l’angle.',
      },
      motifs: { reference: 'l’angle du tableau', haut_gauche: 'à gauche en haut', bas_gauche: 'à gauche en bas', bas_droite: 'à droite en bas', regle: 'le quart change l’angle' },
    },
  },
});
</script>
<script src="/media/simulations/professor-locate.js" defer></script>
</body></html>
