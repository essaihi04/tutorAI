<script>
/*
 * Cours « Nombres complexes (première partie) » (math_ch6_nombres_complexes) : le produit en forme trigonométrique.
 * Vues : ?vue=carre | regle (params t1, t2 en degrés) | fois_i | inverses.
 * carre : facteur, carre, verification.   regle : deux, regle, formules.
 * fois_i : point, tourne, calcul.          inverses : point, conjugue, inverse, quotient.
 * Chaque moment est aussi un repère du même nom. Le conjugué : barre dessinée au trait (« z¯ » dans les chaînes).
 */
const fr = MathsTableau.fr;
const PI = Math.PI, R2 = Math.SQRT2, R3 = Math.sqrt(3);
const SUPS = { '⁻': '−', '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9' };
/** Largeur réelle d’un texte à la craie (exposants et indices compris, sans le signe ¯ de la barre). */
function L(c, s, t = 18) {
  s = String(s).replace(/¯/g, '').replace(/[⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, g => '^{' + [...g].map(ch => SUPS[ch]).join('') + '}');
  let w = 0;
  for (const seg of Tableau.Craie.segments(s)) { c.ctx.font = `${seg.sub || seg.sup ? t * .62 : t}px ${Tableau.POLICE}`; w += c.ctx.measureText(seg.t).width; }
  return w;
}
/** La barre du conjugué, dessinée au trait au-dessus de la lettre. */
function barre(c, x, y, w, couleur) { c.ligne(x + 1, y, x + w - 1, y, { couleur: couleur || 'blanc', largeur: 1.7, tremble: .2, duree: .08 }); }
/** Texte à la craie ; « z¯ » s’écrit z surmonté d’une barre dessinée. Renvoie la largeur. */
function ecrire(c, s, x, y, o = {}) {
  const t = o.taille ?? 18, total = L(c, s, t);
  let px = o.align === 'center' ? x - total / 2 : o.align === 'right' ? x - total : x;
  const morceaux = String(s).split('¯');
  morceaux.forEach((m, i) => {
    if (m) c.texte(m, px, y, { ...o, align: 'left' });
    const w = L(c, m, t);
    if (i < morceaux.length - 1 && m) { const lw = L(c, m.slice(-1), t); barre(c, px + w - lw, y - t * .66, lw, o.couleur); }
    px += w;
  });
  return total;
}
/** Texte encadré ; renvoie le rectangle [x, y, w, h]. */
function encadre(c, s, x, y, taille, couleur, coulTexte) {
  const w = L(c, s, taille) + 18;
  ecrire(c, s, x, y, { couleur: coulTexte || couleur, taille });
  c.rect(x - 9, y - taille - 4, w, taille + 14, { couleur, arrondi: 8, largeur: 1.6 });
  return [x - 9, y - taille - 4, w, taille + 14];
}
/** Plusieurs lignes dans un même cadre ; renvoie le rectangle. */
function bloc(c, lignes, x, y, taille, couleur, inter = 30) {
  const w = Math.max(...lignes.map(l => L(c, l.t, taille))) + 20, h = (lignes.length - 1) * inter + taille + 16;
  lignes.forEach((l, i) => ecrire(c, l.t, x, y + i * inter, { couleur: l.c || 'blanc', taille }));
  c.rect(x - 10, y - taille - 5, w, h, { couleur, arrondi: 9, largeur: 1.7 });
  return [x - 10, y - taille - 5, w, h];
}
function pgcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; }
/** n·π/d écrit au tableau : π/4, −π/3, 5π/12, 0… */
function piSur(n, d = 12) {
  if (n === 0) return '0';
  const g = pgcd(n, d); n /= g; d /= g;
  const a = Math.abs(n);
  return (n < 0 ? '−' : '') + (a === 1 ? '' : a) + 'π' + (d === 1 ? '' : '/' + d);
}
const angleDeg = deg => piSur(Math.round(deg / 15), 12);
/** Petit nom de vecteur (u, v) avec sa flèche au-dessus. */
function nomVec(c, l, x, y, t = 14) {
  c.texte(l, x, y, { couleur: 'blanc', taille: t, align: 'center', duree: .1 });
  c.fleche(x - 4, y - t * .8, x + 5, y - t * .8, { couleur: 'blanc', largeur: 1.1, tete: 3.5, duree: .06 });
}
/** Plan complexe orthonormé : o = {ox, oy (origine en px), u (px par unité), xmin, xmax, ymin, ymax}. */
function plan(c, o, dessin = true) {
  const G = { ...o, X: x => o.ox + x * o.u, Y: y => o.oy - y * o.u, inv: (px, py) => [(px - o.ox) / o.u, (o.oy - py) / o.u] };
  if (!dessin) return G;
  if (o.grad) {
    for (let k = Math.ceil(o.xmin); k <= o.xmax - .3; k++) if (k) c.ligne(G.X(k), o.oy - 3, G.X(k), o.oy + 3, { couleur: 'faible', largeur: 1.1, duree: .02 });
    for (let k = Math.ceil(o.ymin); k <= o.ymax - .3; k++) if (k) c.ligne(o.ox - 3, G.Y(k), o.ox + 3, G.Y(k), { couleur: 'faible', largeur: 1.1, duree: .02 });
  }
  c.fleche(G.X(o.xmin), o.oy, G.X(o.xmax), o.oy, { couleur: 'faible', largeur: 1.5 });
  c.fleche(o.ox, G.Y(o.ymin), o.ox, G.Y(o.ymax), { couleur: 'faible', largeur: 1.5 });
  c.texte('axe réel', G.X(o.xmax), o.oy + (o.reelDessus ? -8 : 18), { couleur: 'faible', taille: o.taille || 13, align: 'right' });
  if (o.imGauche) c.texte('axe imaginaire', o.ox - 8, G.Y(o.ymax) + 8, { couleur: 'faible', taille: o.taille || 13, align: 'right' });
  else c.texte('axe imaginaire', o.ox + 8, G.Y(o.ymax) + 8, { couleur: 'faible', taille: o.taille || 13 });
  c.texte('O', o.ox - 14, o.oy + 16, { couleur: 'faible', taille: 14 });
  c.fleche(o.ox, o.oy, G.X(1), o.oy, { couleur: 'blanc', largeur: 2, tete: 7 });
  c.fleche(o.ox, o.oy, o.ox, G.Y(1), { couleur: 'blanc', largeur: 2, tete: 7 });
  nomVec(c, 'u', G.X(.5), o.oy + 17); nomVec(c, 'v', o.ox - 12, G.Y(.5) + 5);
  return G;
}
/** Arc d’angle orienté (angles en radians, sens direct vers le haut), avec sa pointe de flèche au bout. */
function arc(c, cx, cy, r, a0, a1, o = {}) {
  const couleur = o.couleur || 'jaune', largeur = o.largeur ?? 1.8;
  const n = Math.max(6, Math.ceil(Math.abs(a1 - a0) * r / 6)), pts = [];
  for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; pts.push([cx + r * Math.cos(a), cy - r * Math.sin(a)]); }
  c.trait(pts, { tremble: .3, couleur, largeur, duree: o.duree, pointille: o.pointille });
  if (o.tete === 0 || Math.abs(a1 - a0) * r < 5) return;
  const s = Math.sign(a1 - a0), ex = cx + r * Math.cos(a1), ey = cy - r * Math.sin(a1);
  const ang = Math.atan2(-s * Math.cos(a1), -s * Math.sin(a1)), t = o.tete ?? 8;
  c.trait([[ex - t * Math.cos(ang - .5), ey - t * Math.sin(ang - .5)], [ex, ey], [ex - t * Math.cos(ang + .5), ey - t * Math.sin(ang + .5)]], { couleur, largeur, duree: .08, tremble: .2 });
}
/** Texte placé à l’angle a (radians) et à la distance r du centre. */
function auBout(c, s, G, a, r, o = {}) {
  const x = G.ox + r * Math.cos(a), y = G.oy - r * Math.sin(a) + (o.taille || 16) * .35;
  ecrire(c, s, x, y, { align: 'center', taille: 16, ...o });
}
function pt(c, G, x, y, couleur = 'cyan', r = 4.5) { c.point(G.X(x), G.Y(y), r, couleur); }

/* --- vue carre --- */
const PC = { ox: 120, oy: 290, u: 90, xmin: -.8, xmax: 2.4, ymin: -.6, ymax: 2.5 };
/* --- vue regle --- */
const PR = { ox: 185, oy: 205, u: 46, xmin: -3.4, xmax: 3.4, ymin: -3.2, ymax: 3.2, imGauche: true };
const R1 = 1.5, R2b = 2;
const degRad = d => d * PI / 180;
/* --- vue fois_i --- */
const PF = { ox: 210, oy: 280, u: 52, xmin: -2, xmax: 3.8, ymin: -.8, ymax: 4.1, grad: true };
/* --- vue inverses --- */
const PI_ = { ox: 140, oy: 205, u: 70, xmin: -.7, xmax: 2.5, ymin: -2.1, ymax: 2.1 };

const angleDepuis = (G, px, py) => { let a = Math.atan2(G.oy - py, px - G.ox) * 180 / PI; return a < -90 ? 180 : a < 0 ? 0 : a; };

MathsTableau.page({
  id: 'nc_produit', titre: 'Nombres complexes : le produit',
  texte: 'Construction à la craie dans le plan complexe : multiplier deux complexes, c’est multiplier les modules et ajouter les arguments ; (1 + i)² = 2i ; multiplier par i fait tourner d’un quart de tour ; le conjugué et l’inverse ont l’argument −θ ; le quotient retranche les arguments',
  vues: {
    carre: {
      titre: '(1 + i)² : angles ajoutés, longueurs multipliées',
      dessiner(c, K) {
        K.titre('(1 + i)² : angles ajoutés, longueurs multipliées');
        const G = plan(c, PC), XR = 390;
        c.pause(.2);
        c.fleche(G.X(0), G.Y(0), G.X(1), G.Y(1), { couleur: 'cyan', largeur: 2.4 });
        pt(c, G, 1, 1, 'cyan');
        c.texte('1 + i', G.X(1) + 9, G.Y(1) - 8, { couleur: 'cyan', taille: 17 });
        c.texte('√2', G.X(.72) - 12, G.Y(.72) - 4, { couleur: 'cyan', taille: 16, align: 'right' });
        arc(c, G.ox, G.oy, 34, 0, PI / 4, { couleur: 'jaune' });
        auBout(c, 'π/4', G, PI / 8, 50, { couleur: 'jaune', taille: 15 });
        K.lignes(XR, 84, [
          { t: 'z = 1 + i', couleur: 'cyan' },
          { t: '|1 + i| = √(1² + 1²) = √2', couleur: 'cyan', taille: 18 },
          { t: 'arg(1 + i) ≡ π/4 [2π]', couleur: 'jaune', taille: 18 },
        ], 30);
        c.repere('facteur', G.ox - 4, G.Y(1.15), G.X(1.6) - G.ox + 4, G.oy - G.Y(1.15) + 6, '1 + i : longueur √2, angle π/4');
        K.marque('facteur');
        c.pause(.4);
        arc(c, G.ox, G.oy, 34, PI / 4, PI / 2, { couleur: 'jaune' });
        auBout(c, 'π/4', G, 3 * PI / 8, 50, { couleur: 'jaune', taille: 15 });
        // le point tourne de π/4 et sa longueur passe de √2 à 2
        K.anime(1.8, p => {
          const a = PI / 4 + p * PI / 4, r = R2 * (1 + p * (R2 - 1));
          c.trait(Array.from({ length: 21 }, (_, i) => { const q = p * i / 20, aa = PI / 4 + q * PI / 4, rr = R2 * (1 + q * (R2 - 1)); return [G.X(rr * Math.cos(aa)), G.Y(rr * Math.sin(aa))]; }), { couleur: 'faible', largeur: 1.3, pointille: [5, 5] });
          c.ligne(G.X(0), G.Y(0), G.X(r * Math.cos(a)), G.Y(r * Math.sin(a)), { couleur: 'jaune', largeur: 3 });
          c.point(G.X(r * Math.cos(a)), G.Y(r * Math.sin(a)), 5, 'jaune');
        });
        c.texte('2i', G.ox - 10, G.Y(2) + 6, { couleur: 'jaune', taille: 18, align: 'right' });
        c.texte('2', G.ox + 9, G.Y(1.45), { couleur: 'jaune', taille: 16 });
        K.lignes(XR, 186, [
          { t: '(1 + i)² = (1 + i) × (1 + i)', couleur: 'blanc', taille: 17 },
          { t: 'angles ajoutés : π/4 + π/4 = π/2', couleur: 'jaune', taille: 17 },
          { t: 'longueurs multipliées : √2 × √2 = 2', couleur: 'cyan', taille: 17 },
        ], 28);
        c.repere('carre', G.ox - 34, G.Y(2.2), G.X(1.2) - G.ox + 34, G.oy - G.Y(2.2), 'π/4 + π/4 = π/2 ; √2 × √2 = 2 : le point 2i');
        K.marque('carre');
        c.pause(.4);
        c.texte('calcul : 1 + 2i + i² = 1 + 2i − 1 = 2i', XR, 286, { couleur: 'blanc', taille: 16 });
        const b = encadre(c, '(1 + i)² = 2i', XR + 9, 333, 21, 'jaune');
        c.repere('verification', b[0], b[1], b[2], b[3], '(1 + i)² = 2i');
        K.marque('verification');
      },
      decrire: {
        facteur: 'Un plan complexe (axe réel, axe imaginaire, O, u, v) ; le vecteur cyan vers le point 1 + i, sa longueur √2 écrite le long, un arc orienté π/4 depuis l’axe réel. À droite : « |1 + i| = √2 » et « arg(1 + i) ≡ π/4 [2π] ».',
        carre: 'Un second arc π/4 s’empile sur le premier : π/2. Le point tourne et s’éloigne jusqu’à 2i sur l’axe imaginaire (segment jaune de longueur 2). À droite : « π/4 + π/4 = π/2 » et « √2 × √2 = 2 ».',
        verification: 'Le calcul « 1 + 2i + i² = 2i » et l’encadré jaune « (1 + i)² = 2i ».',
      },
      motifs: { facteur: '1 + i : √2 et π/4', carre: 'les angles s’ajoutent', verification: '(1 + i)² = 2i' },
      explication: [
        { repere: 'facteur', texte: '1 + i a pour longueur √2 et pour angle π/4.' },
        { repere: 'carre', texte: 'Au carré, on ajoute l’angle à lui-même : π/2 ; on multiplie la longueur par elle-même : 2. On arrive sur 2i.' },
        { repere: 'verification', texte: 'Le calcul algébrique confirme : (1 + i)² = 1 + 2i + i² = 2i.' },
      ],
    },

    regle: {
      titre: 'Le produit : r × r’, θ + θ’',
      params: { t1: { min: 0, max: 180, pas: 15, defaut: 30, sens: 'angle θ de z en degrés' }, t2: { min: 0, max: 180, pas: 15, defaut: 45, sens: 'angle θ’ de z’ en degrés' } },
      dessiner(c, K) {
        K.titre('Le produit : r × r’, θ + θ’');
        const G = plan(c, PR), XR = 380;
        const a1 = degRad(K.P.t1), a2 = degRad(K.P.t2), s = a1 + a2, deg = K.P.t1 + K.P.t2;
        const z = [R1 * Math.cos(a1), R1 * Math.sin(a1)], zp = [R2b * Math.cos(a2), R2b * Math.sin(a2)];
        c.pause(.2);
        c.fleche(G.ox, G.oy, G.X(z[0]), G.Y(z[1]), { couleur: 'cyan', largeur: 2.4 });
        pt(c, G, z[0], z[1], 'cyan');
        auBout(c, 'z', G, a1 - .3, R1 * G.u + 2, { couleur: 'cyan', taille: 18 });
        arc(c, G.ox, G.oy, 24, 0, a1, { couleur: 'cyan', largeur: 1.6, tete: 6 });
        if (a1 > .1) auBout(c, 'θ', G, a1 / 2, 34, { couleur: 'cyan', taille: 15 });
        c.fleche(G.ox, G.oy, G.X(zp[0]), G.Y(zp[1]), { couleur: 'violet', largeur: 2.4 });
        pt(c, G, zp[0], zp[1], 'violet');
        auBout(c, 'z’', G, a2 - .22, R2b * G.u + 2, { couleur: 'violet', taille: 18 });
        arc(c, G.ox, G.oy, 44, 0, a2, { couleur: 'violet', largeur: 1.6, tete: 6 });
        if (a2 > .1) auBout(c, 'θ’', G, a2 / 2, 56, { couleur: 'violet', taille: 15 });
        K.lignes(XR, 84, [
          { t: `z : r = 1,5 ; θ = ${angleDeg(K.P.t1)}`, couleur: 'cyan', taille: 18 },
          { t: `z’ : r’ = 2 ; θ’ = ${angleDeg(K.P.t2)}`, couleur: 'violet', taille: 18 },
        ], 30);
        c.repere('deux', G.ox - 100, G.oy - 100, 200, 104, 'z et z’ avec leurs angles θ et θ’');
        K.marque('deux');
        c.pause(.4);
        // les deux arcs bout à bout : θ puis θ’
        arc(c, G.ox, G.oy, 114, 0, a1, { couleur: 'cyan', largeur: 2.2, tete: 0 });
        arc(c, G.ox, G.oy, 114, a1, s, { couleur: 'violet', largeur: 2.2 });
        if (s > .1) auBout(c, 'θ + θ’', G, s / 2, 132, { couleur: 'jaune', taille: 15 });
        K.anime(1.4, p => {
          const r = R1 + (R1 * R2b - R1) * p;
          c.ligne(G.ox, G.oy, G.X(r * Math.cos(s)), G.Y(r * Math.sin(s)), { couleur: 'jaune', largeur: 3 });
          c.point(G.X(r * Math.cos(s)), G.Y(r * Math.sin(s)), 5, 'jaune');
        });
        auBout(c, 'zz’', G, s + (s > 3 ? -.13 : .13), 3 * G.u - 2, { couleur: 'jaune', taille: 18 });
        const lr = [
          { t: 'zz’ : r × r’ = 1,5 × 2 = 3', couleur: 'jaune', taille: 18 },
          { t: `θ + θ’ = ${angleDeg(K.P.t1)} + ${angleDeg(K.P.t2)} = ${angleDeg(deg)}`, couleur: 'jaune', taille: 18 },
        ];
        if (deg > 180) lr.push({ t: `≡ ${angleDeg(deg - 360)} [2π]`, couleur: 'jaune', taille: 17, dx: 60 });
        K.lignes(XR, 150, lr, 28);
        c.repere('regle', G.ox - 140, G.oy - 145, 280, 290, 'les arcs bout à bout : θ + θ’ ; la longueur rr’ = 3');
        K.marque('regle');
        c.pause(.4);
        const b = bloc(c, [{ t: '|zz’| = |z|·|z’|', c: 'jaune' }, { t: 'arg(zz’) ≡ arg z + arg z’ [2π]', c: 'jaune' }], XR + 10, 276, 19, 'jaune', 30);
        c.repere('formules', b[0], b[1], b[2], b[3], '|zz’| = |z|·|z’| ; arg(zz’) ≡ arg z + arg z’');
        K.marque('formules');
      },
      poignees(K) {
        const G = plan(null, PR, false), a1 = degRad(K.P.t1), a2 = degRad(K.P.t2);
        return [
          { id: 'z', x: G.X(R1 * Math.cos(a1)), y: G.Y(R1 * Math.sin(a1)), bouger: (px, py) => ({ t1: angleDepuis(G, px, py) }) },
          { id: 'zp', x: G.X(R2b * Math.cos(a2)), y: G.Y(R2b * Math.sin(a2)), bouger: (px, py) => ({ t2: angleDepuis(G, px, py) }) },
        ];
      },
      lecture: K => `θ = ${angleDeg(K.P.t1)}, θ’ = ${angleDeg(K.P.t2)} : zz’ a pour longueur 1,5 × 2 = 3 et pour angle θ + θ’ = ${angleDeg(K.P.t1 + K.P.t2)}${K.P.t1 + K.P.t2 > 180 ? ' ≡ ' + angleDeg(K.P.t1 + K.P.t2 - 360) + ' [2π]' : ''}.`,
      decrire: K => ({
        deux: `Un plan complexe ; z en cyan (longueur 1,5, angle θ = ${angleDeg(K.P.t1)}) et z’ en violet (longueur 2, angle θ’ = ${angleDeg(K.P.t2)}), chacun avec son arc orienté depuis l’axe réel.`,
        regle: `Un grand arc fait de θ (cyan) puis θ’ (violet) bout à bout : θ + θ’ = ${angleDeg(K.P.t1 + K.P.t2)} ; le vecteur jaune zz’ de longueur 3 au bout de cet angle. À droite : « r × r’ = 1,5 × 2 = 3 ».`,
        formules: 'Un encadré jaune : « |zz’| = |z|·|z’| » et « arg(zz’) ≡ arg z + arg z’ [2π] ».',
      }),
      motifs: { deux: 'z et z’', regle: 'θ + θ’ et rr’', formules: 'les formules du produit' },
      explication: [
        { repere: 'deux', texte: 'z a pour longueur 1,5 et pour angle θ ; z’ a pour longueur 2 et pour angle θ’.' },
        { repere: 'regle', texte: 'Le produit zz’ : on met les angles bout à bout, θ + θ’, et on multiplie les longueurs, 1,5 × 2 = 3.' },
        { repere: 'formules', texte: 'Le module d’un produit est le produit des modules ; un argument du produit est la somme des arguments, à 2π près.' },
      ],
    },

    fois_i: {
      titre: 'Multiplier par i : un quart de tour',
      dessiner(c, K) {
        K.titre('Multiplier par i : un quart de tour');
        const G = plan(c, PF), XR = 450, a0 = Math.atan2(1, 3), r = Math.sqrt(10);
        c.pause(.2);
        c.fleche(G.ox, G.oy, G.X(3), G.Y(1), { couleur: 'cyan', largeur: 2.4 });
        pt(c, G, 3, 1, 'cyan');
        c.texte('3 + i', G.X(3) - 4, G.Y(1) - 12, { couleur: 'cyan', taille: 17 });
        K.lignes(XR, 84, [
          { t: 'z = 3 + i', couleur: 'cyan' },
          { t: '|z| = √(9 + 1) = √10', couleur: 'cyan', taille: 18 },
        ], 30);
        c.repere('point', G.X(2.7), G.Y(1.5), 70, 50, 'le point 3 + i');
        K.marque('point');
        c.pause(.4);
        K.anime(2, p => {
          const a = a0 + p * PI / 2;
          c.trait(Array.from({ length: 31 }, (_, i) => { const aa = a0 + p * PI / 2 * i / 30; return [G.X(r * Math.cos(aa)), G.Y(r * Math.sin(aa))]; }), { couleur: 'faible', largeur: 1.3, pointille: [5, 5] });
          c.ligne(G.ox, G.oy, G.X(r * Math.cos(a)), G.Y(r * Math.sin(a)), { couleur: 'jaune', largeur: 2.6 });
          c.point(G.X(r * Math.cos(a)), G.Y(r * Math.sin(a)), 5, 'jaune');
        });
        c.texte('−1 + 3i', G.X(-1) - 10, G.Y(3) - 6, { couleur: 'jaune', taille: 17, align: 'right' });
        arc(c, G.ox, G.oy, 36, a0, a0 + PI / 2, { couleur: 'jaune' });
        auBout(c, 'π/2', G, a0 + PI / 4, 52, { couleur: 'jaune', taille: 15 });
        K.lignes(XR, 150, [
          { t: '× i : un quart de tour', couleur: 'jaune' },
          { t: 'i = cos π/2 + i sin π/2', couleur: 'blanc', taille: 17 },
          { t: 'même longueur : √10', couleur: 'cyan', taille: 17 },
        ], 28);
        c.repere('tourne', G.X(-1.6), G.Y(3.5), G.X(3.3) - G.X(-1.6), G.oy - G.Y(3.5), 'un quart de tour autour de O : 3 + i va en −1 + 3i');
        K.marque('tourne');
        c.pause(.4);
        c.texte('i(3 + i) = 3i + i² = 3i − 1', XR, 256, { couleur: 'blanc', taille: 17 });
        const b = encadre(c, 'i(3 + i) = −1 + 3i', XR + 9, 306, 20, 'jaune');
        c.repere('calcul', b[0], 236, Math.max(b[2], 240), b[1] + b[3] - 236, 'i(3 + i) = −1 + 3i');
        K.marque('calcul');
      },
      decrire: {
        point: 'Un plan complexe gradué ; le vecteur cyan vers le point 3 + i. À droite : « z = 3 + i », « |z| = √10 ».',
        tourne: 'Le point tourne d’un quart de tour autour de O (trajet en pointillé sur le cercle de rayon √10) et arrive en −1 + 3i ; un arc orienté π/2 entre les deux vecteurs. À droite : « × i : un quart de tour », « i = cos π/2 + i sin π/2 », « même longueur : √10 ».',
        calcul: 'Le calcul « i(3 + i) = 3i + i² = 3i − 1 » et l’encadré jaune « i(3 + i) = −1 + 3i ».',
      },
      motifs: { point: 'le point 3 + i', tourne: 'le quart de tour', calcul: 'i(3 + i) = −1 + 3i' },
      explication: [
        { repere: 'point', texte: 'Le point 3 + i, de longueur √10.' },
        { repere: 'tourne', texte: 'Multiplier par i, c’est ajouter π/2 à l’angle sans changer la longueur : un quart de tour autour de O.' },
        { repere: 'calcul', texte: 'Le calcul le confirme : i(3 + i) = 3i + i² = −1 + 3i.' },
      ],
    },

    inverses: {
      titre: '1/z, z̄, z/z’',
      dessiner(c, K) {
        c.texte('1/z, ', 20, 30, { couleur: 'cyan', taille: 20 });
        ecrire(c, 'z¯, z/z’ : les angles qui reculent', 20 + L(c, '1/z, ', 20), 30, { couleur: 'cyan', taille: 20 });
        const G = plan(c, PI_), XR = 360;
        c.pause(.2);
        c.fleche(G.ox, G.oy, G.X(1), G.Y(R3), { couleur: 'cyan', largeur: 2.4 });
        pt(c, G, 1, R3, 'cyan');
        c.texte('z', G.X(1) + 9, G.Y(R3) + 2, { couleur: 'cyan', taille: 19 });
        c.texte('2', G.X(.62) + 6, G.Y(.62 * R3) + 4, { couleur: 'cyan', taille: 15 });
        arc(c, G.ox, G.oy, 56, 0, PI / 3, { couleur: 'cyan' });
        auBout(c, 'π/3', G, 1.33, 72, { couleur: 'cyan', taille: 15 });
        c.texte('z = 2(cos π/3 + i sin π/3)', XR, 80, { couleur: 'cyan', taille: 18 });
        c.repere('point', G.ox - 4, G.Y(R3) - 14, G.X(1.3) - G.ox + 4, G.oy - G.Y(R3) + 18, 'z = 2(cos π/3 + i sin π/3)');
        K.marque('point');
        c.pause(.4);
        c.ligne(G.X(1), G.Y(R3) + 6, G.X(1), G.Y(-R3) - 6, { couleur: 'orange', largeur: 1.3, pointille: [5, 5] });
        c.fleche(G.ox, G.oy, G.X(1), G.Y(-R3), { couleur: 'blanc', largeur: 2.4 });
        pt(c, G, 1, -R3, 'blanc');
        ecrire(c, 'z¯', G.X(1) + 9, G.Y(-R3) + 6, { couleur: 'blanc', taille: 19 });
        arc(c, G.ox, G.oy, 30, 0, -PI / 3, { couleur: 'blanc' });
        auBout(c, '−π/3', G, -PI / 5, 52, { couleur: 'blanc', taille: 15 });
        ecrire(c, 'z¯ : même longueur 2, angle −π/3', XR, 114, { couleur: 'blanc', taille: 18 });
        c.repere('conjugue', G.ox - 4, G.oy, G.X(1.3) - G.ox + 4, G.Y(-R3) - G.oy + 16, 'le conjugué : le reflet, angle −π/3');
        K.marque('conjugue');
        c.pause(.4);
        const ix = .25, iy = -R3 / 4;
        c.ligne(G.ox, G.oy, G.X(ix), G.Y(iy), { couleur: 'jaune', largeur: 4 });
        pt(c, G, ix, iy, 'jaune', 5);
        c.texte('1/z', G.X(ix) - 8, G.Y(iy) + 18, { couleur: 'jaune', taille: 17, align: 'right' });
        K.lignes(XR, 150, [
          { t: '1/z : longueur 1/2, angle −π/3', couleur: 'jaune', taille: 18 },
          { t: '1/z = (1/2)(cos(−π/3) + i sin(−π/3))', couleur: 'jaune', taille: 17 },
        ], 28);
        c.repere('inverse', G.ox - 30, G.oy, 70, 55, '1/z : longueur 1/2, angle −π/3');
        K.marque('inverse');
        c.pause(.4);
        const h = Math.SQRT1_2, qx = 2 * Math.cos(PI / 12), qy = 2 * Math.sin(PI / 12);
        c.fleche(G.ox, G.oy, G.X(h), G.Y(h), { couleur: 'violet', largeur: 2.2 });
        pt(c, G, h, h, 'violet');
        c.texte('z’', G.X(h) + 6, G.Y(h) + 13, { couleur: 'violet', taille: 17 });
        arc(c, G.ox, G.oy, 100, PI / 3, PI / 12, { couleur: 'jaune', largeur: 2 });
        auBout(c, '− π/4', G, (PI / 3 + PI / 12) / 2, 117, { couleur: 'jaune', taille: 15 });
        c.fleche(G.ox, G.oy, G.X(qx), G.Y(qy), { couleur: 'jaune', largeur: 2.6 });
        pt(c, G, qx, qy, 'jaune', 5);
        c.texte('z/z’', G.X(qx) + 9, G.Y(qy) + 5, { couleur: 'jaune', taille: 18 });
        c.texte('z’ = cos π/4 + i sin π/4 : on recule de π/4', XR, 216, { couleur: 'violet', taille: 17 });
        c.texte('z/z’ = 2(cos π/12 + i sin π/12)', XR, 244, { couleur: 'jaune', taille: 17 });
        const b = bloc(c, [{ t: 'arg(z/z’) ≡ arg z − arg z’ [2π]', c: 'jaune' }, { t: '|z/z’| = |z| / |z’|', c: 'jaune' }], XR + 10, 296, 18, 'jaune', 28);
        c.repere('quotient', b[0], 200, b[2], b[1] + b[3] - 200, 'arg(z/z’) ≡ arg z − arg z’ : on recule de θ’');
        K.marque('quotient');
      },
      decrire: {
        point: 'Un plan complexe ; le vecteur cyan vers z = 2(cos π/3 + i sin π/3) = 1 + i√3, longueur 2, arc orienté π/3.',
        conjugue: 'Le reflet par l’axe réel (pointillé orange) : le vecteur blanc vers z barre, même longueur 2, arc orienté −π/3 (vers le bas). À droite : « z barre : même longueur 2, angle −π/3 ».',
        inverse: 'Un court segment jaune sur la même direction que z barre : 1/z, longueur 1/2, angle −π/3 ; à droite « 1/z = (1/2)(cos(−π/3) + i sin(−π/3)) ».',
        quotient: 'z’ = cos π/4 + i sin π/4 en violet ; un arc jaune recule de π/3 à π/12 (on retire π/4) ; le vecteur jaune z/z’ = 2(cos π/12 + i sin π/12). Encadré : « arg(z/z’) ≡ arg z − arg z’ [2π] » et « |z/z’| = |z| / |z’| ».',
      },
      motifs: { point: 'z = 2(cos π/3 + i sin π/3)', conjugue: 'le conjugué', inverse: 'l’inverse 1/z', quotient: 'le quotient z/z’' },
      explication: [
        { repere: 'point', texte: 'z a pour longueur 2 et pour angle π/3.' },
        { repere: 'conjugue', texte: 'Le conjugué est le reflet : même longueur, angle opposé −π/3.' },
        { repere: 'inverse', texte: 'L’inverse 1/z a la longueur 1/2 et l’angle −π/3 : même direction que le conjugué.' },
        { repere: 'quotient', texte: 'Diviser par z’, c’est reculer de l’angle de z’ et diviser par sa longueur : arg(z/z’) ≡ arg z − arg z’.' },
      ],
    },
  },
});
