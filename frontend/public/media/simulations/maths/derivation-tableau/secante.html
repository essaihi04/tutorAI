<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>De la sécante à la tangente — nombre dérivé</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="/media/simulations/maths/commun/maths.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Repère à la craie : une parabole, un point A fixe et un point M qui glisse vers A ; la sécante (AM) devient la tangente en A"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start reset pause resume play_until set_time set_parameters">Pause</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="/media/simulations/maths/commun/exposants.js"></script>
<script src="/media/simulations/maths/commun/maths-tableau.js"></script>
<script>
/*
 * Cours « Dérivation et étude des fonctions » (math_ch2_derivation_etude_fonctions).
 * Vues : ?vue=secante | equation.
 *   secante  : f(x) = x², A(1 ; 1) ; M glisse sur la parabole vers A ; pente de (AM) = (f(x) − f(1))/(x − 1) = x + 1 → 2 = f′(1).
 *   equation : f(x) = x + 1/x, f′(x) = 1 − 1/x² ; tangente en A(a ; f(a)) : y = f′(a)(x − a) + f(a) = f′(a)x + 2/a.
 * Au tableau, le prime s'écrit avec l'apostrophe droite ' : le ′ (U+2032) de la police du tableau ne fait que 2 px, il ne se voit pas.
 * Moments nommés (play_until) : voir chaque vue ; `fin` = construction complète.
 */
const fr = MathsTableau.fr;
/* Taille réduite pour qu’un texte tienne dans `maxw` px (le contrôle du cadre du kit mesure à la taille demandée). */
const tient = (c, s, taille, maxw) => Math.min(taille, Math.floor(taille * maxw / Math.max(1, c.largeurTexte(String(s).replace(/[_^{}]/g, ''), taille)) * 10) / 10);
const temps = (c) => (Number.isFinite(c.t) ? c.t : Infinity);
/* Valeur animée au temps t : [[début, durée, de, à], …] (null avant le premier segment), ease en cosinus. */
function piste(t, segs) {
  let v = null;
  for (const [t0, d, de, a] of segs) {
    if (t < t0) break;
    const p = d > 0 ? Math.min(1, (t - t0) / d) : 1, e = (1 - Math.cos(Math.PI * p)) / 2;
    v = de + (a - de) * e;
  }
  return v;
}
/* Droite de pente m passant par (x1 ; y1), entre xa et xb, coupée au cadre du repère ; part = fraction tracée. */
function droite(c, G, x1, y1, m, xa, xb, o = {}, part = 1) {
  let a = Math.max(xa, G.xmin), b = Math.min(xb, G.xmax);
  if (Math.abs(m) > 1e-9) {
    const u = x1 + (G.ymin - y1) / m, v = x1 + (G.ymax - y1) / m;
    a = Math.max(a, Math.min(u, v)); b = Math.min(b, Math.max(u, v));
  }
  if (b <= a) return;
  b = a + (b - a) * part;
  const y = (x) => y1 + m * (x - x1);
  c.ligne(G.X(a), G.Y(y(a)), G.X(b), G.Y(y(b)), { couleur: 'orange', largeur: 2.2, ...o });
}

/* ── vue secante ───────────────────────────────────────────── */
const f = (x) => x * x;
const OPT_S = { x0: 50, y0: 55, w: 400, h: 300, xmin: -1.2, xmax: 3.6, ymin: -1, ymax: 10.5, gx: [[1, '1'], [2, '2'], [3, '3']], gy: [[1, '1'], [4, '4'], [9, '9']] };
const COL = 482;
const LIGNES = [[3, '3', '4'], [2, '2', '3'], [1.5, '1,5', '2,5'], [1.1, '1,1', '2,1'], [1.01, '1,01', '2,01']];
const surA = (x) => Math.abs(x - 1) < 0.005;

/* ── vue equation : fractions exactes ──────────────────────── */
const pgcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
const Q = (n, d) => { if (d < 0) { n = -n; d = -d; } const g = pgcd(n, d); return { n: n / g, d: d / g, v: n / d }; };
/* Écriture d'un rationnel : entier, fraction simple (dénominateur ≤ 16) ou décimal (exact = false si arrondi) ; dec = décimal imposé. */
function ecr(q, par = false, dec = false) {
  const neg = q.n < 0 ? '−' : '';
  if (q.d === 1) return { s: neg + Math.abs(q.n), exact: true, frac: false };
  if (q.d <= 16 && !dec) { const s = `${neg}${Math.abs(q.n)}/${q.d}`; return { s: par ? `(${s})` : s, exact: true, frac: true }; }
  const exact = Math.abs(+q.v.toFixed(2) - q.v) < 1e-12;
  return { s: fr(q.v, 2), exact, frac: false };
}
/* Toutes les valeurs de la tangente en a = n/20 : f(a) = (n² + 400)/(20n), f′(a) = (n² − 400)/n², ordonnée à l'origine 2/a = 40/n. */
function tangente(a) {
  const n = Math.round(a * 20);
  const fa = Q(n * n + 400, 20 * n), m = Q(n * n - 400, n * n), b = Q(40, n);
  // si une valeur n'est pas une fraction simple, toutes s'écrivent en décimal (une seule écriture par ligne)
  const simple = [fa, m, b].every((q) => q.d <= 16), D = !simple;
  const A = fr(a, 2), F = ecr(fa, false, D), Mq = ecr(m, true, D), Mc = ecr(m, false, D), B = ecr(b, false, D);
  const exact = F.exact && Mq.exact && B.exact, eg = exact ? '=' : '≈';
  const coef = m.n === 0 ? '0' : Mq.s;
  const reduite = m.n === 0 ? `y = ${B.s}` : `y ${eg} ${Mq.s}x + ${B.s}`;
  return { n, a, fa, m, b, A, F, Mq, Mc, B, exact, eg,
    lf: `f(${A}) ${F.exact ? '=' : '≈'} ${F.s}`,
    lfp: `f'(${A}) = 1 − 1/${A}² ${Mc.exact ? '=' : '≈'} ${Mc.s}`,
    ldev: `y ${eg} ${coef}(x − ${A}) + ${F.s}`,
    lred: m.n === 0 ? `tangente horizontale : y = ${B.s}` : reduite,
    reduite,
    lver: `${m.n === 0 ? '0' : Mq.s} × ${A} + ${B.s} ${eg} ${F.s} ✓ : A est sur (T)` };
}
const OPT_E = { x0: 50, y0: 55, w: 400, h: 290, xmin: -0.3, xmax: 5.5, ymin: -0.5, ymax: 6.2 };
const g = (x) => x + 1 / x;

MathsTableau.page({
  id: 'de_secante', titre: 'De la sécante à la tangente',
  texte: 'Construction à la craie du cours Dérivation et étude des fonctions : un point M glisse sur la courbe vers A, la pente de la sécante (AM) tend vers le nombre dérivé ; puis l’équation de la tangente y = f′(x_0)(x − x_0) + f(x_0)',
  vues: {
    secante: {
      titre: 'La sécante (AM) devient la tangente en A',
      params: { x_m: { min: 0.2, max: 3.2, pas: 0.01, defaut: 3, sens: 'abscisse du point M sur la parabole (M sur A si x_m = 1)' } },
      dessiner(c, K) {
        const t = temps(c), xm = K.P.x_m;
        K.titre('Du taux d’accroissement au nombre dérivé');
        const G = K.axes(OPT_S); K.marque('repere_pose');
        K.anime(2, (p) => K.courbePart(G, f, -1.05, 3.3, p, { couleur: 'cyan' }));
        c.texte('y = x²', G.X(-1.05) + 2, G.Y(f(-1.05)) - 30, { couleur: 'cyan', taille: 17 });
        K.marque('courbe_tracee');
        c.pause(.3); K.rond(G, 1, 1, true, 'jaune');
        c.texte('A(1 ; 1)', G.X(1) + 10, G.Y(1) + 21, { couleur: 'jaune', taille: 16 });
        c.repere('point_a', G.X(1) - 12, G.Y(1) - 12, 80, 38, 'le point A(1 ; 1)');
        K.marque('point_a');
        // M apparaît en 3 ; la sécante se trace
        c.pause(.4); const tM = c.cur; K.anime(.9, () => {});
        c.texte('pente de (AM) = (f(x) − f(1)) / (x − 1)', COL, 66, { couleur: 'blanc', taille: tient(c, 'pente de (AM) = (f(x) − f(1)) / (x − 1)', 17, 266) });
        c.texte('= (x² − 1)/(x − 1) = x + 1', COL + 60, 90, { couleur: 'faible', taille: 15 });
        const tLab = c.cur; c.pause(.4);
        // le tableau x_M | pente de (AM)
        c.texte('x_M', 522, 150, { couleur: 'faible', taille: 16, align: 'center' });
        c.texte('pente de (AM)', 640, 150, { couleur: 'faible', taille: 16, align: 'center' });
        c.ligne(484, 158, 712, 158, { couleur: 'faible', largeur: 1.2 });
        c.ligne(562, 134, 562, 280, { couleur: 'faible', largeur: 1.2 });
        c.repere('tableau_pentes', 478, 132, 240, 152, 'le tableau des pentes de (AM)');
        const ligne = (i) => { const [, sx, sp] = LIGNES[i]; const y = 176 + 24 * i;
          c.texte(sx, 522, y, { couleur: 'blanc', taille: 16, align: 'center' }); c.texte(sp, 640, y, { couleur: 'orange', taille: 16, align: 'center' }); };
        ligne(0); K.marque('secante_loin');
        // M glisse jusqu'à 1,5
        c.pause(.4); const t1 = c.cur; K.anime(1.6, () => {}); ligne(1);
        c.pause(.2); const t2 = c.cur; K.anime(1.2, () => {}); ligne(2);
        K.marque('secante_proche');
        // M en 1,1 puis 1,01
        c.pause(.4); const t3 = c.cur; K.anime(1.2, () => {}); ligne(3);
        c.pause(.2); const t4 = c.cur; K.anime(1.0, () => {}); ligne(4);
        K.marque('presque_confondus');
        // M arrive sur A : la tangente
        c.pause(.4); const t5 = c.cur; K.anime(.6, () => {});
        droite(c, G, 1, 1, 2, 0.05, 3.0, { couleur: 'jaune', largeur: 2.6 });
        c.texte('tangente en A', G.X(2.4) + 10, G.Y(3.8) + 24, { couleur: 'jaune', taille: 17 });
        c.repere('tangente', G.X(0.05) - 4, G.Y(5) - 4, G.X(3) - G.X(0.05) + 8, G.Y(-0.9) - G.Y(5) + 8, 'la tangente en A');
        K.marque('tangente');
        // la pente lue : f′(1) = 2
        c.pause(.4);
        c.texte('la pente se rapproche de 2', COL, 302, { couleur: 'blanc', taille: 17 });
        c.texte("f'(1) = 2", COL + 8, 334, { couleur: 'jaune', taille: 20 });
        const wb = c.largeurTexte("f'(1) = 2", 20) + 16;
        c.rect(COL, 334 - 22, wb, 32, { couleur: 'jaune', arrondi: 6, largeur: 1.6 });
        c.texte('le nombre dérivé', COL + wb + 10, 332, { couleur: 'faible', taille: 15 });
        c.repere('nombre_derive', COL - 4, 334 - 26, wb + 8, 40, 'le nombre dérivé f′(1) = 2');
        K.marque('pente_lue');
        // pour finir, M revient au réglage x_m : la poignée de l'élève
        c.pause(.4); const t6 = c.cur; K.anime(1.2, () => {}); K.marque('m_libre');

        const x = piste(t, [[tM, 0, 3, 3], [t1, 1.6, 3, 2], [t2, 1.2, 2, 1.5], [t3, 1.2, 1.5, 1.1], [t4, 1.0, 1.1, 1.01], [t5, .6, 1.01, 1], [t6, 1.2, 1, xm]]);
        c.direct(() => {
          if (x === null) return;
          const rev = t === Infinity ? 1 : Math.min(1, Math.max(0, (t - tM) / .9));
          if (!surA(x)) {
            droite(c, G, 1, 1, x + 1, Math.min(1, x) - 0.35, Math.max(1, x) + 0.35, {}, rev);
            K.rond(G, x, f(x), true, 'orange');
            c.texte('M', G.X(x) - 22, G.Y(f(x)) - 8, { couleur: 'orange', taille: 17 });
          }
          c.repere('point_m', G.X(x) - 12, G.Y(f(x)) - 12, 24, 24, 'le point M');
          c.repere('secante', G.X(Math.min(1, x)) - 6, G.Y(f(Math.max(1, x))) - 6, Math.abs(G.X(x) - G.X(1)) + 12, Math.abs(G.Y(f(x)) - G.Y(1)) + 12, 'la sécante (AM)');
          if (t >= tLab) {
            const s = surA(x) ? "M sur A : tangente, pente f'(1) = 2" : `x_M = ${fr(x, 2)} : pente de (AM) = ${fr(x + 1, 2)}`;
            c.texte(s, COL, 120, { couleur: surA(x) ? 'jaune' : 'orange', taille: tient(c, s, 17, 266) });
            c.repere('pente', COL - 4, 102, 268, 26, 'la pente de (AM)');
          }
        });
      },
      poignees(K) { const G = K.grille(OPT_S), x = K.P.x_m;
        return [{ id: 'x_m', x: G.X(x), y: G.Y(f(x)), bouger: (px, py) => ({ x_m: G.inv(px, py)[0] }) }]; },
      lecture: (K) => (surA(K.P.x_m) ? "M sur A : tangente, pente f'(1) = 2." : `M en x = ${fr(K.P.x_m, 2)}, pente de (AM) = ${fr(K.P.x_m + 1, 2)}` + (K.P.x_m < 1 ? ' (M à gauche de A : pente < 2).' : ' (M à droite de A : pente > 2).')),
      decrire: (K) => ({
        repere_pose: 'Un repère : x de −1 à 3, y de 0 à 10.',
        courbe_tracee: 'La parabole y = x² (cyan) est tracée.',
        point_a: 'Le point A(1 ; 1) est placé en jaune sur la parabole.',
        secante_loin: 'M(3 ; 9) est placé sur la parabole ; la sécante (AM) orange passe par A et M. Écrit : pente de (AM) = (f(x) − f(1))/(x − 1) = x + 1 ; pente = 4 ; dans le tableau, la ligne 3 → 4.',
        secante_proche: 'M a glissé jusqu’à x = 1,5 ; la sécante a pivoté autour de A. Lignes du tableau : 2 → 3, puis 1,5 → 2,5.',
        presque_confondus: 'M est en x = 1,1 puis 1,01 : lignes 1,1 → 2,1 et 1,01 → 2,01 ; M et A sont presque confondus.',
        tangente: 'M arrive sur A : la sécante devient la tangente en A (jaune), écrite « tangente en A ».',
        pente_lue: 'Écrit : « la pente se rapproche de 2 », puis encadré « f′(1) = 2 », le nombre dérivé de f en 1.',
        m_libre: surA(K.P.x_m) ? 'M reste sur A : la tangente, de pente f′(1) = 2.' : `M revient en x = ${fr(K.P.x_m, 2)} (poignée) : la sécante (AM) a pour pente ${fr(K.P.x_m + 1, 2)}.`,
      }),
      motifs: { repere_pose: 'le repère', courbe_tracee: 'la parabole tracée', point_a: 'le point A', secante_loin: 'M loin de A : pente 4', secante_proche: 'M en 1,5 : pente 2,5', presque_confondus: 'M presque sur A', tangente: 'la tangente en A', pente_lue: "f'(1) = 2", m_libre: 'M à la poignée' },
      explication: [
        { repere: 'point_a', texte: 'A reste fixe sur la parabole.' },
        { repere: 'point_m', texte: 'M glisse sur la courbe vers A.' },
        { repere: 'secante', texte: 'La sécante (AM) pivote autour de A.' },
        { repere: 'tableau_pentes', texte: 'Sa pente x + 1 se rapproche de 2.' },
        { repere: 'tangente', texte: 'Quand M arrive sur A, la sécante devient la tangente.' },
        { repere: 'nombre_derive', texte: 'Sa pente est le nombre dérivé f′(1) = 2.' },
      ],
    },
    equation: {
      titre: 'L’équation de la tangente en A(a ; f(a))',
      params: { a: { min: 0.5, max: 4, pas: 0.05, defaut: 2, sens: 'abscisse du point de contact A' } },
      dessiner(c, K) {
        const a = K.P.a, T = tangente(a), fa = T.fa.v, m = T.m.v;
        K.titre('Équation de la tangente');
        const gx = [1, 2, 3, 4, 5].filter((v) => Math.abs(v - a) > 0.3).map((v) => [v, String(v)]);
        const gy = [1, 2, 3, 4, 5, 6].filter((v) => Math.abs(v - fa) > 0.35).map((v) => [v, String(v)]);
        const G = K.axes({ ...OPT_E, gx, gy }); K.marque('repere_pose');
        K.anime(2, (p) => K.courbePart(G, g, 0.17, 5.5, p, { couleur: 'cyan' }));
        c.texte('(Cf) : f(x) = x + 1/x', COL, 70, { couleur: 'cyan', taille: 17 });
        K.marque('courbe_tracee');
        // le point de contact
        c.pause(.3);
        K.proj(G, a, fa, { lx: T.A, ly: T.F.s, couleur: 'faible', couleurTexte: 'jaune' });
        K.rond(G, a, fa, true, 'jaune');
        c.texte('A', G.X(a), G.Y(fa) - 36, { couleur: 'jaune', taille: 18, align: 'center' });
        c.repere('point_contact', G.X(a) - 12, G.Y(fa) - 12, 24, 24, `le point de contact A(${T.A} ; ${T.F.s})`);
        K.marque('point_contact');
        // la tangente et le triangle de pente
        c.pause(.3);
        K.anime(1.1, (p) => droite(c, G, a, fa, m, Math.max(0.12, a - 1.8 * p), a + 1.8 * p, { couleur: 'jaune', largeur: 2.6 }));
        c.repere('tangente', G.X(Math.max(G.xmin, a - 1.8)), G.Y(fa) - 40, G.X(Math.min(G.xmax, a + 1.8)) - G.X(Math.max(G.xmin, a - 1.8)), 80, 'la tangente en A');
        c.pause(.2);
        const X1 = G.X(a), X2 = G.X(a + 1), Y1 = G.Y(fa), Y2 = G.Y(fa + m);
        c.ligne(X1, Y1, X2, Y1, { couleur: 'orange', largeur: 1.8 });
        c.texte('1', (X1 + X2) / 2, m < 0 ? Y1 - 8 : Y1 + 19, { couleur: 'orange', taille: 16, align: 'center' });
        if (Math.abs(Y2 - Y1) > 1) c.ligne(X2, Y1, X2, Y2, { couleur: 'orange', largeur: 1.8 });
        c.texte(T.m.n === 0 ? '0' : T.Mc.s, X2 + 7, (Y1 + Y2) / 2 + 6, { couleur: 'orange', taille: 16 });
        c.repere('triangle_pente', X1 - 4, Math.min(Y1, Y2) - 6, X2 - X1 + 44, Math.abs(Y2 - Y1) + 26, 'le triangle de pente');
        K.marque('pente_tangente');
        // l'équation générale
        c.pause(.4);
        c.texte("(T) : y = f'(x_0)(x − x_0) + f(x_0)", COL, 104, { couleur: 'blanc', taille: tient(c, "(T) : y = f'(x0)(x − x0) + f(x0)", 17, 262) });
        K.marque('equation_generale');
        // l'équation en A
        c.pause(.3);
        const y0 = K.lignes(COL, 138, [
          { t: T.lf, couleur: 'blanc', taille: tient(c, T.lf, 17, 264) },
          { t: T.lfp, couleur: 'blanc', taille: tient(c, T.lfp, 17, 264) },
          { t: T.ldev, couleur: 'blanc', taille: tient(c, T.ldev, 17, 264) },
        ], 26);
        const sRed = T.lred, tr = tient(c, sRed, 18, 248), wr = c.largeurTexte(sRed, tr) + 16;
        c.texte(sRed, COL + 8, y0 + 4, { couleur: 'jaune', taille: tr });
        c.rect(COL, y0 + 4 - 20, wr, 30, { couleur: 'jaune', arrondi: 6, largeur: 1.6 });
        c.repere('equation', COL - 4, 120, 270, y0 + 18 - 120, 'l’équation de la tangente');
        K.marque('equation_tangente');
        // la loupe : près de A, la courbe se confond avec sa tangente
        c.pause(.4);
        c.cercle(G.X(a), G.Y(fa), 30, { couleur: 'violet', largeur: 1.8 });
        c.texte('près de A, la courbe se confond', COL, 268, { couleur: 'violet', taille: 16 });
        c.texte('avec sa tangente', COL, 290, { couleur: 'violet', taille: 16 });
        c.repere('loupe', G.X(a) - 34, G.Y(fa) - 34, 68, 68, 'la loupe autour de A');
        K.marque('se_confond');
        c.pause(.4);
        c.texte(T.lver, COL, 326, { couleur: 'vert', taille: tient(c, T.lver, 16, 264) });
        K.marque('verification');
      },
      poignees(K) { const G = K.grille(OPT_E), a = K.P.a;
        return [{ id: 'a', x: G.X(a), y: G.Y(g(a)), bouger: (px, py) => ({ a: G.inv(px, py)[0] }) }]; },
      lecture: (K) => { const T = tangente(K.P.a); return `a = ${T.A}, f(a) ${T.F.exact ? '=' : '≈'} ${T.F.s}, f'(a) ${T.Mc.exact ? '=' : '≈'} ${T.Mc.s}, (T) : ${T.reduite}${T.m.n === 0 ? ' (tangente horizontale)' : ''}.`; },
      decrire: (K) => { const T = tangente(K.P.a); return {
        repere_pose: 'Un repère : x de 0 à 5, y de 0 à 6.',
        courbe_tracee: 'La courbe de f(x) = x + 1/x (cyan) est tracée sur ]0 ; +∞[.',
        point_contact: `Le point de contact A(${T.A} ; ${T.F.s}) est placé en jaune, avec ses pointillés vers les axes (${T.A} et ${T.F.s}).`,
        pente_tangente: `La tangente en A (jaune) est tracée ; un petit triangle de pente orange : 1 à l’horizontale, ${T.m.n === 0 ? '0' : T.Mc.s} à la verticale.`,
        equation_generale: 'À droite, écrit : (T) : y = f′(x_0)(x − x_0) + f(x_0).',
