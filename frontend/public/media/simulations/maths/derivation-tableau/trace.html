<body>

  <section class="scene"><canvas id="canvas" role="img" aria-label="À la craie : à gauche le tableau de variations de f(x) = x + 1/x, à droite le repère où se tracent les asymptotes, les tangentes horizontales, les points puis la courbe, chaque élément annoncé par une case du tableau qui s’allume"></canvas></section>
  <footer class="barre">

<script>
/*
 * Cours « Dérivation et étude des fonctions » (math_ch2_derivation_etude_fonctions) : tracer la courbe après l’étude.
 * Vues : ?vue=etapes | lecture | etude.
 * etapes  : f(x) = x + 1/x sur ℝ* ; f′(x) = 1 − 1/x² = (x² − 1)/x² ; maximum f(−1) = −2, minimum f(1) = 2 ;
 *           asymptotes x = 0 (lim ±∞ en 0) et y = x (f(x) − x = 1/x → 0 en ±∞), (Cf) au-dessus de y = x pour x > 0 ;
 *           f(−x) = −f(x) : O centre de symétrie. Le tableau à gauche, le repère à droite : chaque élément tracé est
 *           annoncé par la case du tableau qui s’allume au même moment. Ordre : droites, points, courbe.
 * lecture : la même courbe et la droite y = m (poignée) : m > 2 ou m < −2 : 2 solutions ; m = ±2 : 1 ; −2 < m < 2 : 0.
 * etude   : f(x) = x√(x + 1) sur [−1 ; +∞[ ; f′(x) = (3x + 2)/(2√(x + 1)) ; minimum f(−2/3) = −2√3/9 ≈ −0,38 ;
 *           (f(x) − f(−1))/(x + 1) = x/√(x + 1) → −∞ en −1⁺ : demi-tangente verticale (vers le bas) ;
 *           f(x)/x = √(x + 1) → +∞ : branche parabolique de direction l’axe des ordonnées.
 */
const f = x => x + 1 / x;
const X0 = 3 - 2 * Math.SQRT2;                           // f(X0) = 6 : la courbe entre dans le cadre (y ≤ 6)
/* La police de la craie dessine « ′ » (U+2032) vide : au tableau, f′ s’écrit f'. */
function primes(c) {
  if (c.__primes) return; c.__primes = true;
  const texte = c.texte;
  c.texte = function (s, ...r) { return texte.call(this, String(s).replace(/″/g, "''").replace(/′/g, "'"), ...r); };
}
/* Cases du tableau qui s’allument pendant que la craie trace l’élément qu’elles annoncent (et jusqu’au moment marqué). */
function lumieres(c) {
  const L = [], t = c.t;
  return {
    debut(cases, couleur) { const e = { cases, couleur, t0: c.cur, t1: Infinity }; L.push(e); return e; },
    fin(e) { e.t1 = c.cur; },
    dessiner() {
      if (!Number.isFinite(t)) return;
      c.direct(() => { for (const e of L) if (t >= e.t0 - 1e-6 && t <= e.t1 + .35) for (const [x, y, w, h] of e.cases) c.rect(x, y, w, h, { couleur: e.couleur, fond: e.couleur, fondAlpha: .2, largeur: 2, arrondi: 4 }); });
    },
  };
}

/* ---------- vue etapes : tableau à gauche, repère à droite ---------- */
const OPT1 = { x0: 360, y0: 52, w: 370, h: 300, xmin: -4.5, xmax: 4.5, ymin: -6, ymax: 6, origine: false,
  gx: [[-1, ''], [1, '1']], gy: [[2, '2'], [-2, '']] };
const TB = { g: 12, lab: 60, d: 335, haut: 74, l1: 100, l2: 126, bas: 206, yx: 93, yfp: 119, yh: 146, yb: 200 };
const COL = { minf: 80, m1: 128, z: 196, u: 264, pinf: 316 };
const NOTE = { x: 16, y: [234, 260, 286, 312, 338] };
// Cases (x, y, w, h) du tableau
const CASE = {
  barre: [COL.z - 26, TB.l1 + 2, 52, TB.bas - TB.l1 - 4],
  bouts: [[COL.minf - 16, TB.yb - 19, 32, 25], [COL.pinf - 16, TB.yh - 19, 32, 25]],
  zeros: [[COL.m1 - 12, TB.l1 + 3, 24, 22], [COL.u - 12, TB.l1 + 3, 24, 22]],
  extremums: [[COL.m1 - 16, TB.yh - 19, 32, 25], [COL.u - 13, TB.yb - 19, 26, 25]],
  droite: [COL.z + 3, TB.l2 + 2, TB.d - COL.z - 5, TB.bas - TB.l2 - 4],
  gauche: [TB.lab + 2, TB.l2 + 2, COL.z - 3 - TB.lab - 2, TB.bas - TB.l2 - 4],
  ligneF: [TB.lab + 2, TB.l2 + 2, TB.d - TB.lab - 4, TB.bas - TB.l2 - 4],
};
const caseNote = (c, i, s, taille = 15) => [NOTE.x - 5, NOTE.y[i] - taille - 2, c.largeurTexte(s, taille) + 10, taille + 9];

function tableauX(c) {
  const o = { couleur: 'faible', largeur: 1.4 };
  c.texte('f(x) = x + 1/x   pour x ≠ 0', 20, 60, { couleur: 'cyan', taille: 18 });
  c.ligne(TB.g, TB.haut, TB.d, TB.haut, o); c.ligne(TB.g, TB.l1, TB.d, TB.l1, o); c.ligne(TB.g, TB.l2, TB.d, TB.l2, o);
  c.ligne(TB.g, TB.bas, TB.d, TB.bas, o); c.ligne(TB.lab, TB.haut, TB.lab, TB.bas, o);
  c.texte('x', 36, TB.yx, { couleur: 'blanc', taille: 17, align: 'center' });
  c.texte('f′(x)', 36, TB.yfp, { couleur: 'blanc', taille: 17, align: 'center' });
  c.texte('f(x)', 36, (TB.yh + TB.yb) / 2 + 4, { couleur: 'blanc', taille: 17, align: 'center' });
  // ligne x
  [['−∞', COL.minf], ['−1', COL.m1], ['0', COL.z], ['1', COL.u], ['+∞', COL.pinf]].forEach(([s, x]) => c.texte(s, x, TB.yx, { couleur: 'blanc', taille: 17, align: 'center', duree: .12 }));
  // ligne f′(x) et double barre
  c.texte('+', (COL.minf + COL.m1) / 2, TB.yfp, { couleur: 'vert', taille: 20, align: 'center' });
  c.texte('0', COL.m1, TB.yfp, { couleur: 'jaune', taille: 18, align: 'center' });
  c.texte('−', (COL.m1 + COL.z) / 2, TB.yfp, { couleur: 'rouge', taille: 20, align: 'center' });
  c.ligne(COL.z - 2, TB.l1, COL.z - 2, TB.bas, { couleur: 'blanc', largeur: 1.6 });
  c.ligne(COL.z + 2, TB.l1, COL.z + 2, TB.bas, { couleur: 'blanc', largeur: 1.6 });
  c.texte('−', (COL.z + COL.u) / 2, TB.yfp, { couleur: 'rouge', taille: 20, align: 'center' });
  c.texte('0', COL.u, TB.yfp, { couleur: 'jaune', taille: 18, align: 'center' });
  c.texte('+', (COL.u + COL.pinf) / 2 + 2, TB.yfp, { couleur: 'vert', taille: 20, align: 'center' });
  // ligne f(x)
  c.texte('−∞', COL.minf, TB.yb, { couleur: 'blanc', taille: 17, align: 'center' });
  c.fleche(92, TB.yb - 14, 117, TB.yh + 6, { couleur: 'vert', largeur: 2, tete: 8 });
  c.texte('−2', COL.m1, TB.yh, { couleur: 'jaune', taille: 17, align: 'center' });
  c.fleche(140, TB.yh + 6, 170, TB.yb - 16, { couleur: 'rouge', largeur: 2, tete: 8 });
  c.texte('−∞', COL.z - 6, TB.yb, { couleur: 'blanc', taille: 17, align: 'right' });
  c.texte('+∞', COL.z + 6, TB.yh, { couleur: 'blanc', taille: 17 });
  c.fleche(222, TB.yh + 6, 254, TB.yb - 16, { couleur: 'rouge', largeur: 2, tete: 8 });
  c.texte('2', COL.u, TB.yb, { couleur: 'jaune', taille: 17, align: 'center' });
  c.fleche(275, TB.yb - 14, 304, TB.yh + 6, { couleur: 'vert', largeur: 2, tete: 8 });
  c.texte('+∞', COL.pinf, TB.yh, { couleur: 'blanc', taille: 17, align: 'center' });
}
/* Les quatre limites, encadrées une à une. */
const LIMITES = [[COL.minf - 15, TB.yb - 18, 30, 23], [COL.z - 26, TB.yb - 18, 23, 23], [COL.z + 3, TB.yh - 18, 23, 23], [COL.pinf - 15, TB.yh - 18, 30, 23]];

/* ---------- vue lecture ---------- */
const OPT2 = { x0: 40, y0: 50, w: 420, h: 300, xmin: -5.5, xmax: 5.5, ymin: -6, ymax: 6,
  gx: [[-1, '−1'], [1, '1']], gy: [[2, '2'], [-2, '']] };
function solutions(m) {
  const D = m * m - 4;
  if (Math.abs(D) < 1e-9) return [m / 2];
  if (D < 0) return [];
  const r = Math.sqrt(D); return [(m - r) / 2, (m + r) / 2];
}
const NB = ['aucune solution', 'une solution', 'deux solutions'];
const valeurs = (m, fr) => { const s = solutions(m);
  return s.length === 2 ? `x ≈ ${fr(s[0], 2)} et x ≈ ${fr(s[1], 2)}` : s.length === 1 ? `x = ${fr(s[0], 2)}` : 'la droite passe entre −2 et 2'; };

/* ---------- vue etude ---------- */
const g = x => x * Math.sqrt(x + 1);
const XM = -2 / 3, YM = -2 * Math.sqrt(3) / 9;       // minimum : f(−2/3) = −2√3/9 ≈ −0,385
const OPT3 = { x0: 420, y0: 50, w: 310, h: 300, xmin: -1.5, xmax: 3.2, ymin: -1, ymax: 6, origine: false,
  gx: [[-1, ''], [1, '1'], [2, '2'], [3, '3']], gy: [[2, '2'], [4, '4']] };
const TE = { g: 12, lab: 74, d: 395, haut: 74, l1: 100, l2: 126, bas: 200, yx: 93, yfp: 119, yh: 148, yb: 194 };
const CE = { a: 105, m: 230, p: 370 };
const NE = { x: 16, y: [224, 248, 272, 296, 320, 344] };
function tableauE(c) {
  const o = { couleur: 'faible', largeur: 1.4 };
  c.texte('f′(x) = (3x + 2)/(2√(x + 1))', 20, 62, { couleur: 'cyan', taille: 18 });
  c.ligne(TE.g, TE.haut, TE.d, TE.haut, o); c.ligne(TE.g, TE.l1, TE.d, TE.l1, o); c.ligne(TE.g, TE.l2, TE.d, TE.l2, o);
  c.ligne(TE.g, TE.bas, TE.d, TE.bas, o); c.ligne(TE.lab, TE.haut, TE.lab, TE.bas, o);
  c.texte('x', 43, TE.yx, { couleur: 'blanc', taille: 17, align: 'center' });
  c.texte('f′(x)', 43, TE.yfp, { couleur: 'blanc', taille: 17, align: 'center' });
  c.texte('f(x)', 43, (TE.yh + TE.yb) / 2 + 4, { couleur: 'blanc', taille: 17, align: 'center' });
  [['−1', CE.a], ['−2/3', CE.m], ['+∞', CE.p]].forEach(([s, x]) => c.texte(s, x, TE.yx, { couleur: 'blanc', taille: 17, align: 'center', duree: .15 }));
  c.ligne(CE.a - 2, TE.l1, CE.a - 2, TE.l2, { couleur: 'blanc', largeur: 1.6 });
  c.ligne(CE.a + 2, TE.l1, CE.a + 2, TE.l2, { couleur: 'blanc', largeur: 1.6 });
  c.texte('−∞', CE.a + 7, TE.yfp - 1, { couleur: 'orange', taille: 14 });
  c.texte('−', (CE.a + CE.m) / 2 + 10, TE.yfp, { couleur: 'rouge', taille: 20, align: 'center' });
  c.texte('0', CE.m, TE.yfp, { couleur: 'jaune', taille: 18, align: 'center' });
  c.texte('+', (CE.m + CE.p) / 2, TE.yfp, { couleur: 'vert', taille: 20, align: 'center' });
  c.texte('0', CE.a, TE.yh, { couleur: 'blanc', taille: 17, align: 'center' });
  c.fleche(CE.a + 14, TE.yh + 6, CE.m - 28, TE.yb - 18, { couleur: 'rouge', largeur: 2, tete: 8 });
  c.texte('−2√3/9', CE.m, TE.yb, { couleur: 'jaune', taille: 16, align: 'center' });
  c.fleche(CE.m + 28, TE.yb - 18, CE.p - 16, TE.yh + 6, { couleur: 'vert', largeur: 2, tete: 8 });
  c.texte('+∞', CE.p, TE.yh, { couleur: 'blanc', taille: 17, align: 'center' });
}

MathsTableau.page({
  id: 'de_trace', titre: 'Tracer la courbe d’une fonction',
  texte: 'Construction à la craie du cours Dérivation et étude des fonctions : la courbe de f(x) = x + 1/x tracée à partir de son tableau de variations (asymptotes, tangentes horizontales, points, puis la courbe, la branche x < 0 par symétrie de centre O) ; lecture du nombre de solutions de f(x) = m ; étude complète de x√(x + 1)',
  vues: {
    etapes: {
      titre: 'Du tableau de variations à la courbe',
      dessiner(c, K) {
        primes(c);
        const Lu = lumieres(c);
        K.titre('Tracer la courbe de f(x) = x + 1/x');
        // 1. Le tableau, puis les limites encadrées une à une
        tableauX(c);
        c.texte('f′(x) = 1 − 1/x² = (x² − 1)/x²', NOTE.x, NOTE.y[0], { couleur: 'cyan', taille: 15 });
        c.repere('tableau', TB.g, TB.haut, TB.d - TB.g, TB.bas - TB.haut, 'le tableau de variations');
        c.repere('case_double_barre', CASE.barre[0], CASE.barre[1], CASE.barre[2], CASE.barre[3], 'la double barre en 0 : lim f = −∞ à gauche, +∞ à droite');
        for (const [x, y, w, h] of LIMITES) { c.pause(.35); c.rect(x, y, w, h, { couleur: 'jaune', largeur: 1.5, arrondi: 5 }); }
        K.marque('tableau_lu');
        // 2. Le repère
        c.pause(.3);
        const G = K.axes(OPT1);
        c.texte('−1', G.X(-1), G.Y(0) - 8, { couleur: 'faible', taille: 14, align: 'center' });
        c.texte('−2', G.X(0) + 8, G.Y(-2) + 5, { couleur: 'faible', taille: 14 });
        c.texte('O', G.X(0) + 6, G.Y(0) + 18, { couleur: 'faible', taille: 14 });
        c.repere('repere', G.x0, G.y0, G.w, G.h, 'le repère');
        K.marque('repere_pose');
        // 3. Asymptote verticale x = 0
        c.pause(.4);
        let e = Lu.debut([CASE.barre], 'rouge');
        c.ligne(G.X(0), G.Y(6), G.X(0), G.Y(-6), { couleur: 'rouge', largeur: 2.2, pointille: [8, 7] });
        c.texte('x = 0', G.X(0) + 7, G.Y(-5.2), { couleur: 'rouge', taille: 16 });
        c.repere('asymptote_v', G.X(0) - 9, G.y0, 18, G.h, 'l’asymptote verticale x = 0');
        Lu.fin(e); K.marque('asymptote_verticale');
        // 4. Asymptote oblique y = x
        c.pause(.4);
        e = Lu.debut(CASE.bouts.concat([caseNote(c, 1, 'f(x) − x = 1/x → 0 en ±∞')]), 'rouge');
        c.texte('f(x) − x = 1/x → 0 en ±∞', NOTE.x, NOTE.y[1], { couleur: 'rouge', taille: 15 });
        c.ligne(G.X(-4.5), G.Y(-4.5), G.X(4.5), G.Y(4.5), { couleur: 'rouge', largeur: 2.2, pointille: [8, 7] });
        K.rond(G, 0, 0, true, 'rouge'); K.rond(G, 2, 2, true, 'rouge');
        c.texte('(2 ; 2)', G.X(2) + 7, G.Y(2) + 16, { couleur: 'rouge', taille: 13 });
        c.texte('y = x', G.X(3.4), G.Y(2.6), { couleur: 'rouge', taille: 16 });
        c.repere('asymptote_o', G.X(-4.5), G.Y(4.5), G.X(4.5) - G.X(-4.5), G.Y(-4.5) - G.Y(4.5), 'l’asymptote oblique y = x');
        Lu.fin(e); K.marque('asymptote_oblique');
        // 5. Tangentes horizontales
        c.pause(.4);
        e = Lu.debut(CASE.zeros, 'orange');
        c.ligne(G.X(0.55), G.Y(2), G.X(1.45), G.Y(2), { couleur: 'orange', largeur: 2.4 });
        c.ligne(G.X(-1.45), G.Y(-2), G.X(-0.55), G.Y(-2), { couleur: 'orange', largeur: 2.4 });
        Lu.fin(e); K.marque('tangentes_horizontales');
        // 6. Points
        c.pause(.4);
        e = Lu.debut(CASE.extremums.concat([caseNote(c, 2, 'A(2 ; 2,5) et B(0,5 ; 2,5)')]), 'jaune');
        K.proj(G, 1, 2, { couleur: 'jaune' }); K.rond(G, 1, 2, true, 'jaune');
        c.repere('minimum', G.X(1) - 16, G.Y(2) - 16, 32, 32, 'le minimum f(1) = 2');
        K.proj(G, -1, -2, { couleur: 'jaune' }); K.rond(G, -1, -2, true, 'jaune');
        c.repere('maximum', G.X(-1) - 16, G.Y(-2) - 16, 32, 32, 'le maximum f(−1) = −2');
        c.texte('A(2 ; 2,5) et B(0,5 ; 2,5)', NOTE.x, NOTE.y[2], { couleur: 'jaune', taille: 15 });
        K.rond(G, 2, 2.5, true, 'blanc'); c.texte('A', G.X(2) - 4, G.Y(2.5) - 9, { couleur: 'blanc', taille: 15, align: 'center' });
        K.rond(G, 0.5, 2.5, true, 'blanc'); c.texte('B', G.X(0.5) + 8, G.Y(2.5) - 6, { couleur: 'blanc', taille: 15 });
        Lu.fin(e); K.marque('points_places');
        // 7. Branche droite, d’un trait
        c.pause(.4);
        e = Lu.debut([CASE.droite, caseNote(c, 3, '1/x > 0 : (Cf) au-dessus de y = x pour x > 0')], 'cyan');
        c.texte('1/x > 0 : (Cf) au-dessus de y = x pour x > 0', NOTE.x, NOTE.y[3], { couleur: 'cyan', taille: 15 });
        K.anime(2.6, p => K.courbePart(G, f, X0, 4.5, p, { couleur: 'cyan' }));
        c.repere('branche_droite', G.X(0), G.Y(6), G.X(4.5) - G.X(0), G.Y(2) - G.Y(6) + 6, 'la branche x > 0');
        Lu.fin(e); K.marque('branche_droite');
        // 8. Branche gauche par symétrie de centre O
        c.pause(.4);
        e = Lu.debut([CASE.gauche, caseNote(c, 4, 'f(−x) = −f(x) : O centre de symétrie')], 'violet');
        c.texte('f(−x) = −f(x) : O centre de symétrie', NOTE.x, NOTE.y[4], { couleur: 'violet', taille: 15 });
        c.cercle(G.X(0), G.Y(0), 9, { couleur: 'violet', largeur: 1.8 });
        c.texte('O centre de symétrie', G.X(0) + 34, G.Y(-1.5), { couleur: 'violet', taille: 15 });
        c.repere('centre_o', G.X(0) - 12, G.Y(0) - 12, 24, 24, 'O, centre de symétrie');
        K.anime(2.6, p => {
          K.courbePart(G, f, -X0, -4.5, p, { couleur: 'cyan' });
          if (p < 1) { const x = X0 + (4.5 - X0) * p;     // M sur la branche droite, son image M′ par la symétrie de centre O
            c.ligne(G.X(x), G.Y(f(x)), G.X(-x), G.Y(-f(x)), { couleur: 'violet', largeur: 1.3, pointille: [4, 6] });
            c.point(G.X(x), G.Y(f(x)), 4.5, 'violet'); c.point(G.X(-x), G.Y(-f(x)), 4.5, 'violet'); }
        });
        c.ligne(G.X(2), G.Y(2.5), G.X(-2), G.Y(-2.5), { couleur: 'violet', largeur: 1.3, pointille: [4, 6] });
        K.rond(G, -2, -2.5, true, 'violet'); c.texte('A′', G.X(-2) + 8, G.Y(-2.5) + 16, { couleur: 'violet', taille: 15 });
        c.repere('branche_gauche', G.X(-4.5), G.Y(-2) - 6, G.X(0) - G.X(-4.5), G.Y(-6) - G.Y(-2) + 6, 'la branche x < 0, image de la branche x > 0');
        Lu.fin(e); K.marque('branche_gauche_par_symetrie');
        // 9. La courbe nommée
        c.pause(.3);
        e = Lu.debut([CASE.ligneF], 'cyan');
        c.texte('(Cf)', G.X(2.2), G.Y(4.8), { couleur: 'cyan', taille: 20 });
        c.repere('courbe', G.x0, G.y0, G.w, G.h, 'la courbe (Cf)');
        Lu.fin(e); K.marque('courbe_complete');
        Lu.dessiner();
      },
      decrire: {
        tableau_lu: 'À gauche, le tableau de variations de f(x) = x + 1/x sur ℝ* : x : −∞, −1, 0, 1, +∞ ; f′(x) : + 0 − ‖ − 0 + (double barre en 0) ; f(x) monte de −∞ à −2, descend vers −∞, puis redescend de +∞ à 2 et remonte vers +∞ ; dessous, f′(x) = (x² − 1)/x². Les quatre limites s’encadrent une à une en jaune.',
        repere_pose: 'À droite, le repère : x de −4,5 à 4,5, y de −6 à 6.',
        asymptote_verticale: 'La case de la double barre s’allume en rouge (−∞ en 0 à gauche, +∞ en 0 à droite) : l’axe des ordonnées est repassé en pointillé rouge, « x = 0 », asymptote verticale.',
        asymptote_oblique: 'Les cases −∞ et +∞ des deux bouts s’allument avec f(x) − x = 1/x → 0 en ±∞ : la droite y = x en pointillé rouge, avec ses points (0 ; 0) et (2 ; 2), asymptote oblique au voisinage de +∞ et de −∞.',
