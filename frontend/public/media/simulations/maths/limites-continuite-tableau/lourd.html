<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Le terme le plus lourd — limites à l'infini</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="/media/simulations/maths/commun/maths.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Deux barres à la craie : en haut 3x² et 1, en bas x² et x ; quand x grandit, 3x² et x² prennent toute la barre et le quotient se rapproche de 3"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start reset pause resume play_until set_time set_parameters">Pause</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="/media/simulations/maths/commun/exposants.js"></script>
<script src="/media/simulations/maths/commun/maths-tableau.js"></script>
<script src="/media/simulations/maths/limites-continuite-tableau/lc-outils.js"></script>
<script>
/*
 * Cours « Limites et continuité » (math_ch1_limites_continuite), diapo lc_l7_plus_lourd (14 novembre 2026,
 * professeur règle 28 : montrer au lieu d'écrire). Une barre pour le haut (3x² et 1), une pour le bas (x² et x) :
 * x grandit de 2 à 1000, la part de 3x² et de x² mange toute la barre ; le quotient écrit à côté se rapproche de 3.
 * En bas : en un point (x → 2) on remplace, la règle du plus lourd ne vaut qu'à l'infini.
 * Curseur : x = 2, 5, 10, 100, 1000, 10 000 (paramètre i, indice 0 à 5).
 * Moments : forme, croissance, lourds, resultat, attention. Repères : forme, haut, bas, lourds, resultat, attention.
 */
const { fr } = MathsTableau;
const XS = [2, 5, 10, 100, 1000, 10000];
const f = x => (3 * x * x + 1) / (x * x - x);
const grand = v => (v >= 1e4 ? Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') : fr(v, v < 10 ? 2 : 0));
/** La part du terme léger, en % : deux chiffres significatifs (0,00003 % en x = 1000). */
const pourcent = q => { const v = 100 * q; return v >= 1 ? fr(v, 0) : fr(+v.toPrecision(1), 8); };
const BX = 190, BH = 26;
/* Tableau large : les barres s'allongent (BW) et les textes grossissent (TT) ; posés au début de chaque dessin. */
let BW = 440, TT = (t) => t;

/** Une barre partagée : le terme lourd (part p) à gauche, le terme léger à droite. */
function barre(c, y, part, lourd, leger, vLourd, vLeger, coulLourd) {
  const w = Math.max(2, BW * part);
  c.rect(BX, y, w, BH, { couleur: coulLourd, fond: coulLourd, fondAlpha: .35, arrondi: 4, largeur: 1.6, duree: 0 });
  if (BW - w > 1.5) c.rect(BX + w, y, BW - w, BH, { couleur: 'orange', fond: 'orange', fondAlpha: .35, arrondi: 4, largeur: 1.6, duree: 0 });
  else c.ligne(BX + BW, y - 4, BX + BW, y + BH + 4, { couleur: 'orange', largeur: 2, duree: 0 });
  c.texte(`${lourd} = ${grand(vLourd)}`, BX + 4, y - 8, { couleur: coulLourd, taille: TT(17), duree: 0 });
  c.texte(leger === String(vLeger) ? leger : `${leger} = ${grand(vLeger)}`, BX + BW, y - 8, { couleur: 'orange', taille: TT(17), align: 'right', duree: 0 });
  c.texte(`${leger} : ${pourcent(1 - part)} %`, BX + BW + 8, y + 19, { couleur: 'orange', taille: TT(15), duree: 0 });
}

LC.page({ net: true,
  id: 'lc_lourd', titre: 'Limites à l’infini',
  texte: 'Construction à la craie : lim (3x² + 1)/(x² − x) quand x → +∞. Deux barres : en haut 3x² et 1, en bas x² et x ; x grandit de 2 à 1000 et les termes de plus haut degré prennent toute la barre ; le quotient se rapproche de 3x²/x² = 3. En un point (x → 2), on remplace : 13/2',
  vues: {
    lourd: {
      titre: 'Le terme le plus lourd',
      params: { i: { min: 0, max: 5, pas: 1, defaut: 4, label: 'x =', affiche: i => grand(XS[i]), sens: 'indice de x : 0 → 2, 1 → 5, 2 → 10, 3 → 100, 4 → 1000, 5 → 10 000' } },
      curseurs: ['i'],
      dessiner(c, K) {
        const X = XS[K.P.i];
        BW = 440 + LC.e(K) * 0.7; TT = (t) => LC.t(K, t); const k = LC.k(K);
        K.titre('x → +∞ : qui pèse le plus ?');
        c.texte('f(x) = (3x² + 1) / (x² − x)', 30, 76, { couleur: 'blanc', taille: LC.t(K, 24) });
        c.texte('x → +∞ : « ∞ / ∞ », forme indéterminée', 380 * k, 76, { couleur: 'orange', taille: LC.t(K, 18) });
        c.repere('forme', 380 * k - 6, 50, 370 * k, 34, 'la forme ∞/∞');
        K.marque('infini_infini');
        c.pause(.3);
        c.texte('le haut', 30, 160, { couleur: 'cyan', taille: LC.t(K, 19) });
        c.texte('le bas', 30, 246, { couleur: 'vert', taille: LC.t(K, 19) });
        // x grandit de 2 jusqu'à la valeur du curseur : les barres se partagent en direct.
        K.anime(3.6, p => {
          const x = 2 * Math.pow(X / 2, p);
          barre(c, 140, 3 * x * x / (3 * x * x + 1), '3x²', '1', 3 * x * x, 1, 'cyan');
          barre(c, 226, x * x / (x * x + x), 'x²', 'x', x * x, x, 'vert');
          c.texte(`x = ${grand(x)}`, 30, 196, { couleur: 'jaune', taille: LC.t(K, 20), duree: 0 });
        });
        c.repere('haut', BX - 4, 116, BW + 8, BH + 30, '3x² écrase 1');
        c.repere('bas', BX - 4, 202, BW + 8, BH + 30, 'x² écrase x');
        K.marque('croissance');
        c.pause(.3);
        c.texte('il ne reste que', 30, 312, { couleur: 'blanc', taille: LC.t(K, 19) });
        c.texte('3x² / x²', 172 * k, 312, { couleur: 'jaune', taille: LC.t(K, 24) });
        c.rect(172 * k - 10, 312 - LC.t(K, 24), LC.t(K, 104), LC.t(K, 34), { couleur: 'jaune', arrondi: 7, largeur: 1.5 });
        c.repere('lourds', 26, 286, 246 * k, 38, 'les termes de plus haut degré');
        K.marque('lourds');
        c.pause(.2);
        c.texte('= 3', 276 * k + (k > 1 ? 20 : 0), 312, { couleur: 'jaune', taille: LC.t(K, 24) });
        c.texte(`en x = ${grand(X)} :  f(x) ≈ ${fr(f(X), X >= 1000 ? 4 : 3)}`, 380 * k + (k > 1 ? 20 : 0), 312, { couleur: 'vert', taille: LC.t(K, 19) });
        c.repere('resultat', 270 * k, 286, 470 * k, 38, 'le quotient se rapproche de 3');
        K.marque('resultat');
        c.pause(.4);
        c.texte('Seulement à l’infini ! En un point, on remplace :', 30, 368, { couleur: 'orange', taille: LC.t(K, 18) });
        c.texte('x → 2 :  (12 + 1) / (4 − 2) = 13/2  (et pas 3)', 60, 400, { couleur: 'orange', taille: LC.t(K, 18) });
        c.repere('attention', 26, 346, LC.t(K, 480), 64, 'en un point, on remplace');
        K.marque('attention');
      },
      lecture: K => { const X = XS[K.P.i], x2 = X * X; return `x = ${grand(X)} : 3x² fait ${fr(100 * 3 * x2 / (3 * x2 + 1), 2)} % du haut, x² fait ${fr(100 * x2 / (x2 + X), 2)} % du bas ; f(x) ≈ ${fr(f(X), 4)}` + (X >= 100 ? ', presque 3.' : ' : x n’est pas encore assez grand, pousse-le.'); },
      decrire: K => { const X = XS[K.P.i]; return {
        infini_infini: 'En haut : f(x) = (3x² + 1)/(x² − x) ; en orange : x → +∞, « ∞/∞ », forme indéterminée.',
        croissance: `Deux barres : le haut partagé entre 3x² (cyan) et 1 (orange), le bas entre x² (vert) et x (orange). x grandit de 2 à ${grand(X)} : 3x² et x² mangent toute la barre (3x² = ${grand(3 * X * X)} contre 1).`,
        lourds: 'Encadré jaune : il ne reste que 3x²/x².',
        resultat: `« = 3 » et, en vert, f(${grand(X)}) ≈ ${fr(f(X), 4)} : le quotient se rapproche de 3.`,
        attention: 'En orange : seulement à l’infini ; en un point on remplace : x → 2 donne 13/2, pas 3.',
      }; },
      motifs: { infini_infini: 'la forme ∞/∞', croissance: 'x grandit', lourds: 'les termes lourds', resultat: 'la limite 3', attention: 'en un point, on remplace' },
      finale: 'Glisse x : plus il est grand, plus 3x² et x² prennent toute la place.',
      explication: [
        { repere: 'haut', texte: 'Quand x est grand, 1 ne compte plus à côté de 3x².' },
        { repere: 'bas', texte: 'Et x ne compte plus à côté de x².' },
        { repere: 'resultat', texte: 'Il reste 3x²/x², c’est-à-dire 3.' },
        { repere: 'attention', texte: 'Cette règle ne vaut qu’à l’infini : en un point, on remplace.' },
      ],
    },
  },
});
</script>
<script src="/media/simulations/professor-locate.js" defer></script>
</body></html>
