<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Six questions sur une courbe — limites et continuité</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="/media/simulations/maths/commun/maths.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Au centre une courbe avec une asymptote, un trou et un croisement de l’axe ; autour, six questions du chapitre et leur outil"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start reset pause resume play_until set_time">Pause</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="/media/simulations/maths/commun/exposants.js"></script>
<script src="/media/simulations/maths/commun/maths-tableau.js"></script>
<script src="/media/simulations/maths/limites-continuite-tableau/lc-outils.js"></script>
<script>
/*
 * Cours « Limites et continuité » (math_ch1_limites_continuite), diapositive o1 : la carte du chapitre en six questions.
 * Vue : ?vue=carte. Moments : courbe, q_limite, q_continuite, q_image, q_tvi, q_reciproque, q_racine, national ; `fin`.
 */
const h = x => 0.7 * x - 0.4 / (x + 2), TROU = 1.5;
MathsTableau.page({
  id: 'lc_ouverture', titre: 'Six questions sur une courbe',
  texte: 'Ouverture du cours Limites et continuité : ce qu’on va savoir dire d’une courbe, question par question, et ce qui tombe au national',
  vues: {
    carte: {
      titre: 'La carte du chapitre : six questions sur une courbe',
      dessiner(c, K) {
        K.titre('Que va-t-on savoir dire d’une courbe ?');
        const G = K.axes({ x0: 274, y0: 92, w: 212, h: 200, xmin: -2.6, xmax: 3, ymin: -3, ymax: 3, gx: [], gy: [], origine: false });
        c.ligne(G.X(-2), G.y0, G.X(-2), G.y0 + G.h, { couleur: 'orange', largeur: 1.3, pointille: [5, 5] });
        K.anime(1.6, p => K.courbePart(G, x => (Math.abs(x - TROU) < 0.04 ? NaN : h(x)), -1.93, 2.9, p, { couleur: 'cyan' }));
        K.rond(G, TROU, h(TROU), false, 'cyan');
        K.rond(G, 0.6, 0, true, 'jaune');
        c.repere('courbe', G.x0, G.y0, G.w, G.h, 'la courbe');
        K.marque('courbe');
        const Q = [
          { id: 'q_limite', x: 18, y: 104, q: 'Où va-t-elle ?', o: 'la limite' },
          { id: 'q_continuite', x: 18, y: 190, q: 'Est-elle soudée ?', o: 'la continuité' },
          { id: 'q_image', x: 18, y: 276, q: 'Quelles hauteurs atteint-elle ?', o: 'l’image d’un intervalle' },
          { id: 'q_tvi', x: 506, y: 104, q: 'Coupe-t-elle l’axe ?', o: 'les valeurs intermédiaires' },
          { id: 'q_reciproque', x: 506, y: 190, q: 'Peut-on revenir en arrière ?', o: 'la fonction réciproque' },
          { id: 'q_racine', x: 506, y: 276, q: 'Que défait ⁿ√ ?', o: 'la racine n-ième' },
        ];
        Q.forEach(k => {
          c.pause(.3);
          c.texte(k.q, k.x, k.y, { couleur: 'blanc', taille: 17, max: 240 });
          c.texte('→ ' + k.o, k.x + 10, k.y + 24, { couleur: 'cyan', taille: 17, max: 230 });
          c.repere(k.id, k.x - 6, k.y - 20, 250, 52, k.q);
          K.marque(k.id);
        });
        c.pause(.4);
        c.texte('national : 20 sujets sur 20', 28, 152, { couleur: 'orange', taille: 14 });
        c.texte('national : 6 sur 20', 516, 152, { couleur: 'orange', taille: 14 });
        c.texte('national : 8 sur 20', 516, 238, { couleur: 'orange', taille: 14 });
        c.texte('Le théorème des valeurs intermédiaires dit « au moins une solution » sans résoudre.', 380, 346, { couleur: 'jaune', taille: 16, align: 'center', max: 730 });
        K.marque('national');
      },
      decrire: {
        courbe: 'Au centre, une courbe avec une asymptote verticale (pointillés), un trou et un point où elle coupe l’axe.',
        q_limite: 'En haut à gauche : « Où va-t-elle ? → la limite ».',
        q_continuite: 'À gauche : « Est-elle soudée ? → la continuité ».',
        q_image: 'En bas à gauche : « Quelles hauteurs atteint-elle ? → l’image d’un intervalle ».',
        q_tvi: 'En haut à droite : « Coupe-t-elle l’axe ? → les valeurs intermédiaires ».',
        q_reciproque: 'À droite : « Peut-on revenir en arrière ? → la fonction réciproque ».',
        q_racine: 'En bas à droite : « Que défait ⁿ√ ? → la racine n-ième ».',
        national: 'En orange, la fréquence au national : limites 20 sujets sur 20, solution unique 6 sur 20, réciproque 8 sur 20.',
      },
      motifs: { q_limite: 'la limite', q_continuite: 'la continuité', q_image: 'l’image d’un intervalle', q_tvi: 'les valeurs intermédiaires', q_reciproque: 'la réciproque', q_racine: 'la racine n-ième', national: 'ce qui tombe au national' },
      explication: [{ repere: 'q_limite', texte: 'Où va la courbe : la limite.' }, { repere: 'q_tvi', texte: 'Coupe-t-elle l’axe : le théorème des valeurs intermédiaires.' }],
    },
  },
});
</script>
<script src="/media/simulations/professor-locate.js" defer></script>
</body></html>
