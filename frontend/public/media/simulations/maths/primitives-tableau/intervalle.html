<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toujours sur un intervalle</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="/media/simulations/maths/commun/maths.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Axe gradué à la craie : 1/x² n’existe pas en 0, le trou coupe la droite en deux intervalles ; une primitive se donne sur un seul intervalle"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start reset pause resume play_until set_time">Pause</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="/media/simulations/maths/commun/exposants.js"></script>
<script src="/media/simulations/maths/commun/maths-tableau.js"></script>
<script>
/*
 * Cours « Fonctions primitives » (math_ch4_primitives) : une primitive se cherche sur un intervalle.
 * Vue : ?vue=trou. Moments : axe, trou, deux_intervalles, phrase. Repères : trou, gauche, droite, phrase.
 */
const YA = 176, X0 = 385, U = 95;          // axe : y, abscisse de 0, pixels par unité
const X = v => X0 + v * U;

MathsTableau.page({
  id: 'pr_intervalle', titre: 'Fonctions primitives',
  texte: 'Construction à la craie du cours Fonctions primitives : 1/x² n’est pas définie en 0 ; ℝ* n’est pas un intervalle, il se coupe en ]−∞ ; 0[ et ]0 ; +∞[ ; les primitives se donnent sur un intervalle',
  vues: {
    trou: {
      titre: 'Toujours sur un intervalle',
      dessiner(c, K) {
        K.titre('Toujours sur un intervalle');
        c.texte('f(x) = 1/x²', 40, 74, { couleur: 'blanc', taille: 22 });
        c.pause(.2);
        // L'axe gradué de −3 à 3.
        c.fleche(X(-3.3), YA, X(3.4), YA, { couleur: 'faible', largeur: 1.8 });
        for (let v = -3; v <= 3; v++) {
          c.ligne(X(v), YA - 6, X(v), YA + 6, { couleur: 'faible', largeur: 1.4, duree: .03 });
          c.texte(v < 0 ? '−' + (-v) : String(v), X(v), YA + 28, { couleur: 'faible', taille: 17, align: 'center', duree: .06 });
        }
        c.texte('x', X(3.4) + 6, YA + 24, { couleur: 'faible', taille: 17 });
        K.marque('axe');
        // Le trou en 0.
        c.pause(.4);
        c.cercle(X(0), YA, 8, { couleur: 'rouge', largeur: 2.4 });
        c.fleche(X(0), YA - 52, X(0), YA - 16, { couleur: 'rouge', largeur: 1.8, tete: 8 });
        c.texte('1/x² n’existe pas en 0', X(0), YA - 60, { couleur: 'rouge', taille: 20, align: 'center' });
        c.repere('trou', X(0) - 20, YA - 20, 40, 40, 'le trou en 0');
        K.marque('trou');
        // Deux intervalles.
        c.pause(.4);
        c.ligne(X(-3.3), YA, X(0) - 11, YA, { couleur: 'orange', largeur: 7, alpha: .55 });
        c.texte(']−∞ ; 0[', X(-1.6), YA + 66, { couleur: 'orange', taille: 22, align: 'center' });
        c.repere('gauche', X(-3.3), YA - 14, X(0) - 11 - X(-3.3), 88, 'l’intervalle ]−∞ ; 0[');
        c.pause(.2);
        c.ligne(X(0) + 11, YA, X(3.3), YA, { couleur: 'vert', largeur: 7, alpha: .55 });
        c.texte(']0 ; +∞[', X(1.6), YA + 66, { couleur: 'vert', taille: 22, align: 'center' });
        c.repere('droite', X(0) + 11, YA - 14, X(3.3) - X(0) - 11, 88, 'l’intervalle ]0 ; +∞[');
        K.marque('deux_intervalles');
        // La phrase : pas sur ℝ*, sur un intervalle.
        c.pause(.4);
        c.texte('Primitives de f :', 80, 292, { couleur: 'blanc', taille: 22 });
        c.texte('sur ℝ*', 270, 292, { couleur: 'blanc', taille: 22 });
        c.pause(.15);
        c.ligne(264, 290, 336, 278, { couleur: 'rouge', largeur: 3 });
        c.texte('ℝ* n’est pas un intervalle', 360, 292, { couleur: 'rouge', taille: 18 });
        c.pause(.3);
        c.texte('sur ]0 ; +∞[ : x ↦ −1/x + k, k ∈ ℝ', 80, 336, { couleur: 'vert', taille: 24 });
        c.repere('phrase', 70, 266, 560, 82, 'la phrase : sur ]0 ; +∞[');
        K.marque('phrase');
      },
      decrire: {
        axe: 'En haut, f(x) = 1/x² ; un axe gradué de −3 à 3.',
        trou: 'En 0, un rond rouge vide ; une flèche rouge : « 1/x² n’existe pas en 0 ».',
        deux_intervalles: 'À gauche du trou l’axe est colorié en orange, nommé ]−∞ ; 0[ ; à droite en vert, nommé ]0 ; +∞[.',
        phrase: 'Dessous : « Primitives de f : sur ℝ* » barré en rouge (ℝ* n’est pas un intervalle) ; puis en vert « sur ]0 ; +∞[ : x ↦ −1/x + k, k ∈ ℝ ».',
      },
      motifs: { axe: 'l’axe gradué', trou: 'le trou en 0', deux_intervalles: 'deux intervalles', phrase: 'sur un intervalle' },
      explication: [
        { repere: 'trou', texte: 'En 0, 1/x² n’est pas définie : la droite est coupée.' },
        { repere: 'gauche', texte: 'D’un côté, l’intervalle ]−∞ ; 0[.' },
        { repere: 'droite', texte: 'De l’autre, ]0 ; +∞[.' },
        { repere: 'phrase', texte: 'On donne les primitives sur UN intervalle, par exemple ]0 ; +∞[.' },
      ],
    },
  },
});
</script>
<script src="/media/simulations/professor-locate.js" defer></script>
</body></html>
