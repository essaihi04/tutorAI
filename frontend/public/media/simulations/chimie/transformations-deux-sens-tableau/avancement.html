<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avancement final et taux d’avancement — au tableau</title>

<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Réaction d’un acide et d’une base avec l’eau, tableau d’avancement de l’acide éthanoïque, x_max, x_f, taux d’avancement τ, réaction totale ou limitée, τ = 10^(−pH)/C, deux exercices des nationaux"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start reset pause resume play_until set_time set_parameters">Lancer</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="commun.js"></script>

<script>
/*
 * Avancement final et taux d’avancement (cours « Transformations chimiques s’effectuant dans les deux sens », 2e Bac PC BIOF, novembre 2026).
 * Contrat : outils/cours/notes/cours/transformations_deux_sens_contrat_simulations.md § 3.
 * Vues (?vue=) : acide_eau (défaut) | base_eau | attendu | tableau | x_max | x_f | taux | totale | relation | proportion | dosage.
 * Aucune poignée (le contrat n’en met pas) : set_parameters ne change que la vue.
 */
/* ── Formules chimiques à la craie : indices ₂ et charges ⁺ ⁻ rendus (copie de cinetique-tableau/avancement.html) ───────── */
(function () {
  const C = window.Tableau.Craie, P = C.prototype, texteAvant = P.texte, segAvant = C.segments;
  const SUP = { '⁺': '+', '⁻': '−', '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9' };
  const SUB = { '₀': '0', '₁': '1', '₂': '2', '₃': '3', '₄': '4', '₅': '5', '₆': '6', '₇': '7', '₈': '8', '₉': '9' };
  const chim = s => String(s).replace(/[⁺⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, g => '^{' + [...g].map(ch => SUP[ch]).join('') + '}')
    .replace(/[₀₁₂₃₄₅₆₇₈₉]+/g, g => '_{' + [...g].map(ch => SUB[ch]).join('') + '}');
  C.segments = function (s) {
    const out = [], re = /_\{([^}]+)\}/g; let i = 0, m;
    while ((m = re.exec(s))) { if (m.index > i) out.push(...segAvant(s.slice(i, m.index))); out.push({ t: m[1], sub: true }); i = re.lastIndex; }
    if (i < s.length) out.push(...segAvant(s.slice(i)));
    return out;
  };
  P.texte = function (s, x, y, o) { return texteAvant.call(this, chim(s), x, y, o); };
  window.chim = chim;
})();

/* ── Moteur du déroulé (copie de cinetique-tableau/avancement.html, lui-même copié de circuit-lc.html) ────────────────── */
const { fr, bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lisse = p => p * p * (3 - 2 * p);
const lerp = (a, b, f) => a + (b - a) * f;
const fx = (v, d = 2) => fr(v, d).replace(/(,\d*?)0+$/, '$1').replace(/,$/, '');
const ECRITURE = 2.5;
function Moteur(o) {
  const q = new URLSearchParams(location.search);
  const S = { vue: o.vues.includes(q.get('vue')) ? q.get('vue') : o.vues[0], t: 0, running: false, pause: false, fait: false,
    jusqua: null, motif: '', emis: 0, dit: '', mesure: false };
  const V = o.vitesse ?? 1.7, T0 = o.T0 ?? .8, HOLD = {};
  let TL = null;
  function construire() {
    let s = T0; const ev = [];
    for (const e of o.etapes(S.vue)) {
      const anim = e.anim || 0, d = { ...e, anim, debut: s, ecrit: s + (e.ecritDes ?? anim) };
      d.fin = Math.max(s + anim, d.ecrit + (HOLD[e.nom] ?? 1.5)) + .35;
      s = d.fin; ev.push(d);
    }
    const mom = {}; for (const e of ev) mom[e.nom] = e.fin; mom.fin = s + (o.queue ?? .6);
    TL = { ev, M: mom };
  }
  const ev = nom => TL.ev.find(e => e.nom === nom);
  const M = {
    S, ev, evs: () => TL.ev, Moments: () => TL.M,
    p(nom) { const e = ev(nom); if (!e) return 0; return e.anim > 0 ? clamp((S.t - e.debut) / e.anim, 0, 1) : (S.t >= e.debut - 1e-6 ? 1 : 0); },
    commence(nom) { const e = ev(nom); return !!e && S.t > e.debut + 1e-6; },
    vu(nom) { if (nom === 'fin') return S.t >= TL.M.fin - 1e-6; const e = ev(nom); return !!e && S.t >= e.fin - 1e-6; },
    etape(c, nom, fn) {
      const e = ev(nom); if (!e) return;
      const t = c.t, cur = c.cur, comp = c.complet, w0 = e.ecrit;
      c.t = S.t > 1e5 ? 1e9 : w0 + (S.t - w0) * V; c.cur = w0;
      try { fn(); } finally { if (S.mesure) HOLD[nom] = Math.max(HOLD[nom] || 0, (c.cur - w0) / V); c.t = t; c.cur = cur; if (!S.running) c.complet = comp; }
    },
    etat() { return S.running ? 'en cours' : S.fait ? 'fin' : S.pause ? 'arrêt sur image' : 'pas encore lancée'; },
  };
  const scene = window.OndesTableau.Scene($('canvas'), (c) => o.dessiner(c, M));
  const cadreBase = scene.cadre;
  scene.cadre = function (g) { const k = cadreBase.call(scene, g); if (Number.isFinite(k.t)) k.t *= ECRITURE; return k; };
  M.scene = scene; M.craie = scene.craie;
  function calculer() {
    construire();
    const t = S.t, r = S.running; S.t = 1e6; S.running = false; S.mesure = true;
    for (const k of Object.keys(HOLD)) delete HOLD[k];
    try { o.dessiner(scene.craie, M); } finally { S.t = t; S.running = r; S.mesure = false; }
    construire(); scene.sale = true;
  }
  const sansSouligne = s => String(s).replace(/([A-Za-zΔτθ])_\{?([A-Za-z0-9]+)\}?/g, (m, a, i) => a + (/^\d+$/.test(i) ? [...i].map(d => '₀₁₂₃₄₅₆₇₈₉'[d]).join('') : i));
  const dire = (texte, kind = '') => { texte = sansSouligne(texte); S.dit = texte; bulle($('feedback'), texte, kind); };
  const etiquette = () => { $('run').textContent = S.running ? 'Pause' : S.pause ? 'Reprendre' : S.fait ? 'Rejouer' : 'Lancer'; };
  let pont = null;
  const emettre = () => pont && pont.emettre();
  const noter = (a, d) => pont && pont.noter(a, d);
  scene.avancer = dt => {
    if (!S.running) return !!(o.anime && o.anime());
    const avant = S.t; S.t += dt;
    for (const e of TL.ev) if (avant < e.debut && S.t >= e.debut && e.bulle) dire(e.bulle());
    if (S.jusqua != null && S.t >= S.jusqua) {
      S.t = S.jusqua; S.jusqua = null; S.running = false;
      if (S.t >= TL.M.fin - 1e-6) { finir(); return true; }
      S.pause = true; etiquette(); dire('Arrêt sur image : ' + (S.motif || `t = ${fx(S.t, 1)} s`) + '.');
      noter('pause', { time_s: +S.t.toFixed(2) }); emettre(); return true;
    }
    if (S.t >= TL.M.fin) { S.t = TL.M.fin; finir(); return true; }
    if (performance.now() - S.emis > 500) { S.emis = performance.now(); emettre(); }
    return true;
  };
  function finir() { S.running = false; S.fait = true; S.pause = false; S.jusqua = null; etiquette(); dire(o.messageFin(M), 'good'); noter('measurement', o.params(M)); emettre(); }
  function start() { S.t = 0; S.jusqua = null; S.motif = ''; S.running = true; S.pause = false; S.fait = false; etiquette(); dire(o.depart(M)); noter('start', o.params(M)); emettre(); }
  function pause() { if (!S.running) return; S.running = false; S.pause = true; S.jusqua = null; etiquette(); dire('Arrêt sur image.'); noter('pause', { time_s: +S.t.toFixed(2) }); emettre(); }
  function resume() { if (S.running) return; if (!S.pause) return start(); S.running = true; S.pause = false; etiquette(); dire('Ça repart…'); noter('resume'); emettre(); }
  function setTime(p) {
    const t = +p.time_s; if (p.time_s === null || p.time_s === '' || !Number.isFinite(t)) return;
    S.running = false; S.jusqua = null; S.t = clamp(t, 0, TL.M.fin); S.fait = S.t >= TL.M.fin - 1e-6; S.pause = !S.fait && S.t > 0;
    etiquette(); scene.sale = true; dire(`Arrêt sur image : t = ${fx(S.t, 1)} s.`); noter('set_time', { time_s: S.t }); emettre();
  }
  function playUntil(p) {
    const noms = o.etapes(S.vue).map(e => e.nom).concat('fin');
    const nom = noms.includes(p.moment) ? p.moment : null, cible = nom ? TL.M[nom] : +p.time_s;
    if (!Number.isFinite(cible) || (p.moment && !nom && (p.time_s == null || p.time_s === ''))) { dire(`Moment inconnu : ${p.moment}.`, 'bad'); emettre(); return; }
    if (S.fait || S.t >= cible - 1e-3) { S.t = 0; S.fait = false; }
    S.jusqua = clamp(cible, .01, TL.M.fin); S.motif = nom ? (o.motifs[nom] || nom) : ''; S.running = true; S.pause = false; etiquette(); dire('Observe…');
    noter('play_until', { moment: nom, time_s: S.jusqua }); emettre();
  }
  function setParameters(p) {
    p = p || {};
    const r = o.appliquer(p, M) || {};
    if (r.vue && o.vues.includes(r.vue) && r.vue !== S.vue) { S.vue = r.vue; r.change = true; r.vueChange = true; }
    if (r.change) { calculer(); if (r.vueChange) scene.reecrire(); }
    noter('set_parameters', o.params(M));
    if (r.change) start();
    else { scene.sale = true; emettre(); }
  }
  Object.assign(M, { noter, calculer, dire, start, pause, resume, setTime, playUntil, setParameters, emettre, etiquette });
  $('run').onclick = () => (S.running ? pause() : S.pause ? resume() : start());
  window.Tableau.explication(o.explications);
  const commandes = ['start', 'reset', 'pause', 'resume', 'set_time', 'set_parameters', 'play_until'];
  M.lancer = () => {
    calculer();
    const listeMoments = o.vues.map(v => `${v} : ${o.etapes(v).map(e => e.nom).concat('fin').join(' | ')}`).join(' ; ');
    const config = { id: o.id, version: '1.0', title: o.titre, variants: o.vues.map(id => ({ id, label: o.titres[id] })), commands: commandes,
      command_schema: { set_parameters: o.schema, set_time: { time_s: '0..fin (arrêt sur cet instant de la scène, en s ; voir moments)' },
        play_until: { moment: listeMoments, time_s: 'ou un instant en s' } } };
    pont = protocole({ id: o.id, commandes, config, texte: o.texte,
      etat: () => ({ simulation_status: S.running ? 'running' : S.fait ? 'finished' : S.pause ? 'paused' : 'idle',
        ce_qui_se_voit: o.voir(M) + (S.dit ? ` La bulle dit : « ${S.dit} »` : ''), current_variant: S.vue, time_s: +S.t.toFixed(2),
        parameters: o.params(M), moments: Object.fromEntries(Object.entries(TL.M).map(([k, v]) => [k, +v.toFixed(2)])) }),
      progression: () => (S.fait ? 1 : 0),
      executer: (cmd, p) => ({ start, reset: start, pause, resume, set_time: () => setTime(p), set_parameters: () => setParameters(p), play_until: () => playUntil(p) })[cmd]?.() });
    dire(o.depart(M));
    setTimeout(() => { if (!S.running && S.t === 0 && !S.pause && !S.fait) start(); }, 900);
  };
  return M;
}

/* ── Aides d’écriture : largeur d’une formule, flèches dessinées (→, ⇌), suites de morceaux, fractions ────────────────── */
function larg(c, s, taille = 17) {
  const T = window.Tableau, ctx = c.ctx; if (c.echelle && c.tailleMin) taille = Math.max(taille, c.tailleMin / c.echelle);
  return T.Craie.segments(window.chim(s)).reduce((w, g) => { ctx.font = `${(g.sub || g.sup) ? taille * .62 : taille}px ${T.POLICE}`; return w + ctx.measureText(g.t).width; }, 0);
}
const FL = 34;
/** Flèche simple → (milieu à la hauteur y). */
function flecheSimple(c, x, y, w, col = 'blanc') { c.fleche(x + 2, y, x + w - 2, y, { couleur: col, largeur: 1.9, tete: 8 }); }
/** Double flèche ⇌ (deux demi-flèches), milieu à la hauteur y. */
function flecheDouble(c, x, y, w, col = 'blanc') {
  c.trait([[x + 2, y - 3.5], [x + w - 2, y - 3.5], [x + w - 10, y - 10]], { couleur: col, largeur: 1.9 });
  c.trait([[x + w - 2, y + 3.5], [x + 2, y + 3.5], [x + 10, y + 10]], { couleur: col, largeur: 1.9, duree: .12 });
}
/** Morceau : texte, '→', '⇌', ou { frac: [numérateur, dénominateur] }. */
function largeurMorceau(c, p, t) {
  if (p === '→' || p === '⇌') return FL;
  if (p && p.frac) return Math.max(larg(c, p.frac[0], t), larg(c, p.frac[1], t)) + 14;
  return larg(c, p, t);
}
/** Positions x de chaque morceau d’une ligne (gap entre deux) : elles ne dépendent pas du temps, chaque étape écrit les siens. */
function placer(c, x, morceaux, t, o = {}) {
  const gap = o.gap ?? 8, ws = morceaux.map(p => largeurMorceau(c, p, t)), tot = ws.reduce((a, b) => a + b, 0) + gap * (morceaux.length - 1);
  let px = o.align === 'center' ? x - tot / 2 : o.align === 'right' ? x - tot : x;
  const xs = ws.map(w => { const r = px; px += w + gap; return r; });
  return { xs, ws, x0: xs[0], tot };
}
function morceau(c, p, x, y, t, col = 'blanc') {
  if (p === '→') return flecheSimple(c, x, y - t * .32, FL, col);
  if (p === '⇌') return flecheDouble(c, x, y - t * .32, FL, col);
  if (p && p.frac) {
    const w = largeurMorceau(c, p, t), yb = y - t * .32;
    c.texte(p.frac[0], x + w / 2, yb - 7, { taille: t, align: 'center', couleur: col });
    c.ligne(x, yb, x + w, yb, { couleur: col, largeur: 1.8, duree: .1 });
    c.texte(p.frac[1], x + w / 2, yb + t * .98, { taille: t, align: 'center', couleur: col });
    return;
  }
  c.texte(p, x, y, { taille: t, couleur: col });
}
/** Écrit une ligne entière ; `cols[i]` colore le morceau i. Renvoie les positions. */
function ligneM(c, x, y, morceaux, o = {}) {
  const t = o.taille ?? 20, P = placer(c, x, morceaux, t, o);
  morceaux.forEach((p, i) => morceau(c, p, P.xs[i], y, t, (o.cols && o.cols[i]) || o.couleur || 'blanc'));
  return P;
}
/** Encadré à la craie autour d’un texte (ligne de base y, taille t). */
function encadre(c, x, y, w, t, col = 'jaune') { c.rect(x - 8, y - t - 4, w + 16, t + 14, { couleur: col, largeur: 2, arrondi: 8 }); }
/** Petit triangle « attention » à la craie (orange), le « ! » dedans. */
function attention(c, x, y, o = {}) {
  const col = o.couleur ?? 'orange', h = o.h ?? 16;
  c.trait([[x, y], [x + h * .58, y - h], [x + h * 1.16, y]], { couleur: col, largeur: 1.8, ferme: true });
  c.texte('!', x + h * .58, y - 3, { couleur: col, taille: h * .8, align: 'center' });
}

/* ── Pièces peintes : bécher, pH-mètre, sonde, câble, atomes et molécules ─────────────────────────────────────────── */
const rgba = ([r, g, b, a], k = 1) => `rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},${Math.min(1, a * k).toFixed(3)})`;
const eclair = (c, k) => [lerp(c[0], 255, k), lerp(c[1], 255, k), lerp(c[2], 255, k), c[3]];
const sombre = (c, k) => [c[0] * (1 - k), c[1] * (1 - k), c[2] * (1 - k), Math.min(1, c[3] * (1 + k * .4))];
const EAU = [214, 230, 246, .16];   // solutions acides et basiques incolores (comme en vrai)
const Peint = {
  sphere(ctx, x, y, r, [clair, milieu, fonce], a = 1) {
    ctx.save(); ctx.globalAlpha = a;
    const g = ctx.createRadialGradient(x - r * .35, y - r * .4, r * .1, x, y, r); g.addColorStop(0, clair); g.addColorStop(.45, milieu); g.addColorStop(1, fonce);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  },
  /** Bécher vu de face : verre, solution (dégradé, ménisque, reflet), bec, graduations. niveau 0 → 1. */
  becher(ctx, B, niveau, col, a = 1) {
    const { x, y, w, h } = B, ep = 3, fond = y + h, yS = fond - ep - niveau * (h - 16);
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(x + w / 2 + 3, fond + 4, w / 2, 4.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(210,230,250,.06)'; ctx.beginPath(); ctx.roundRect(x, y, w, h, [2, 2, 10, 10]); ctx.fill();
    if (niveau > .004) {
      ctx.save(); ctx.beginPath(); ctx.roundRect(x + ep, y, w - 2 * ep, h - ep, [0, 0, 8, 8]); ctx.clip();
      const g = ctx.createLinearGradient(0, yS, 0, fond); g.addColorStop(0, rgba(eclair(col, .18))); g.addColorStop(1, rgba(sombre(col, .22)));
      ctx.fillStyle = g; ctx.fillRect(x, yS, w, fond - yS);
      ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(x + w * .64, yS + 5, w * .09, Math.max(0, fond - yS - 10));
      ctx.restore();
      ctx.fillStyle = rgba(eclair(col, .35), 1.1); ctx.beginPath(); ctx.ellipse(x + w / 2, yS, w / 2 - ep, 3, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.32)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x + ep + 2, yS); ctx.lineTo(x + w - ep - 2, yS); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(225,238,250,.78)'; ctx.lineWidth = 2.2; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(x - 6, y - 4); ctx.quadraticCurveTo(x - 1, y - 2, x, y + 5); ctx.lineTo(x, fond - 10); ctx.quadraticCurveTo(x, fond, x + 10, fond);
    ctx.lineTo(x + w - 10, fond); ctx.quadraticCurveTo(x + w, fond, x + w, fond - 10); ctx.lineTo(x + w, y); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fillRect(x + w * .11, y + 12, w * .05, h - 28);
    ctx.strokeStyle = 'rgba(225,238,250,.35)'; ctx.lineWidth = 1;
    for (let k = 1; k <= 4; k++) { const gy = fond - 8 - k * (h - 24) / 5; ctx.beginPath(); ctx.moveTo(x + w - 14, gy); ctx.lineTo(x + w - 4, gy); ctx.stroke(); }
    ctx.restore();
    return yS;
  },
  /** Sonde de verre du pH-mètre : tête noire en haut (yH), tube de verre, boule en bas (yB). */
  sonde(ctx, x, yH, yB) {
    ctx.save();
    const g = ctx.createLinearGradient(x - 7, 0, x + 7, 0); g.addColorStop(0, '#15181b'); g.addColorStop(.45, '#4a5157'); g.addColorStop(1, '#101214');
    ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(x - 7, yH, 14, 24, 3); ctx.fill();
    ctx.fillStyle = 'rgba(225,238,250,.16)'; ctx.fillRect(x - 5, yH + 24, 10, yB - yH - 34);
    ctx.strokeStyle = 'rgba(225,238,250,.8)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(x - 5, yH + 24); ctx.lineTo(x - 5, yB - 11); ctx.moveTo(x + 5, yH + 24); ctx.lineTo(x + 5, yB - 11); ctx.stroke();
    const gb = ctx.createRadialGradient(x - 2, yB - 8, 1, x, yB - 5, 8); gb.addColorStop(0, 'rgba(255,255,255,.75)'); gb.addColorStop(1, 'rgba(190,215,240,.22)');
    ctx.fillStyle = gb; ctx.beginPath(); ctx.arc(x, yB - 5, 7, 0, 7); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(200,210,220,.6)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, yH + 26); ctx.lineTo(x, yB - 10); ctx.stroke();
    ctx.restore();
  },
  cable(ctx, x1, y1, x2, y2, creux = 30) {
    ctx.save(); ctx.strokeStyle = '#2b2f35'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.bezierCurveTo(x1, y1 + creux, x2, y2 - creux, x2, y2); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1; ctx.stroke(); ctx.restore();
  },
};
const ATOME = {
  C: { r: 9, col: ['#a3a9ae', '#3d4247', '#0e1012'] }, O: { r: 9, col: ['#ffb7ab', '#e0412f', '#6d140b'] },
  N: { r: 9, col: ['#bcd5ff', '#3b6fd8', '#13306e'] }, H: { r: 5.5, col: ['#ffffff', '#d6dce2', '#7d868f'] },
  P: { r: 6.5, col: ['#fff7b8', '#facc15', '#8a6a00'] },   // le proton H⁺ : petite boule jaune
};
/* Molécules (coordonnées relatives, échelle 1) : [dx, dy, atome]. Les liaisons relient l’atome 0 (ou l’indiqué) aux autres. */
const MOL = {

};
const KM = 1.3;   // échelle des molécules dans la loupe
function molecule(ctx, m, x, y, a = 1) {
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = 'rgba(230,236,242,.55)'; ctx.lineWidth = 3;
  for (const [i, j] of m.li) { const A = m.at[i], B = m.at[j]; ctx.beginPath(); ctx.moveTo(x + A[0] * KM, y + A[1] * KM); ctx.lineTo(x + B[0] * KM, y + B[1] * KM); ctx.stroke(); }
  ctx.restore();
  for (const [dx, dy, e] of m.at) Peint.sphere(ctx, x + dx * KM, y + dy * KM, ATOME[e].r * KM, ATOME[e].col, a);
}
function proton(ctx, x, y, a = 1, lien = null) {
  if (lien) { ctx.save(); ctx.globalAlpha = a * .7; ctx.strokeStyle = 'rgba(250,204,21,.7)'; ctx.lineWidth = 2.6; ctx.beginPath(); ctx.moveTo(lien[0], lien[1]); ctx.lineTo(x, y); ctx.stroke(); ctx.restore(); }
  Peint.sphere(ctx, x, y, ATOME.P.r * KM, ATOME.P.col, a);
}
/** pH-mètre peint : boîtier gris, écran vert, « pH » et la valeur (à 0,1 près), deux boutons. */
const ecranPH = A => ({ x: A.x + 10, y: A.y + 10, w: A.w - 20, h: 40 });
function phmetre(c, A, valeur) {
  c.direct(() => {
    const ctx = c.ctx, { x, y, w, h } = A; ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.roundRect(x + 4, y + 5, w, h, 9); ctx.fill();
    const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, '#9aa3ab'); g.addColorStop(1, '#4e565e');
    ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(x, y, w, h, 9); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 1.2; ctx.stroke();
    const e = ecranPH(A), ge = ctx.createLinearGradient(0, e.y, 0, e.y + e.h); ge.addColorStop(0, '#c2e0ae'); ge.addColorStop(1, '#8fb47c');
    ctx.fillStyle = ge; ctx.beginPath(); ctx.roundRect(e.x, e.y, e.w, e.h, 4); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(e.x + 3, e.y + 3, e.w - 6, 3);
    ctx.fillStyle = '#16260f'; ctx.textBaseline = 'middle';
    ctx.font = '700 14px "Courier New", monospace'; ctx.textAlign = 'left'; ctx.fillText('pH', e.x + 6, e.y + e.h / 2 + 1);
    ctx.font = '700 24px "Courier New", monospace'; ctx.textAlign = 'right'; ctx.fillText(valeur, e.x + e.w - 7, e.y + e.h / 2 + 1);
    for (let i = 0; i < 2; i++) Peint.sphere(ctx, x + 18 + i * 22, y + h - 14, 6, ['#e5e9ec', '#9aa3ab', '#4a5158']);
    ctx.restore();
  });
}

/** Géométrie : grand tableau (vue tableau) ou compact en haut (vues x_max, x_f). */
function TB(v = MO.S.vue) {
  const g = v === 'tableau' ? { x: 20, y: 46, wl: 186, cols: [150, 108, 136, 136], h: 40, taille: 19 }
    : { x: 14, y: 42, wl: 150, cols: [140, 96, 120, 120], h: 30, taille: 16 };
  g.xs = []; let x = g.x + g.wl; for (const w of g.cols) { g.xs.push(x); x += w; } g.xf = x;
  g.ys = { entete: g.y, initial: g.y + g.h, en_cours: g.y + 2 * g.h, final: g.y + 3 * g.h }; g.yf = g.y + 4 * g.h;
  g.cx = k => g.xs[k] + g.cols[k] / 2;
  return g;
}
function grille(c, g) {

  c.ligne(g.xs[0], g.y, g.xs[0], g.yf, { largeur: 1.4, duree: .1 });
  for (let k = 1; k < 4; k++) c.ligne(g.xs[k], g.ys.initial, g.xs[k], g.yf, { largeur: 1.2, couleur: 'faible', duree: .08 });
}

  c.texte('équation', g.x + 8, yb, { couleur: 'cyan', taille: g.taille });
  ESP.forEach((s, k) => {

    if (k < 3) { const xb = g.xs[k + 1]; if (SIGNES[k] === '⇌') flecheDouble(c, xb - 15, yb - t * .32, 30); else c.texte('+', xb, yb, { taille: t, align: 'center' }); }
  });
}
function ligneT(c, g, id, o = {}) {
  const L = LIGNES[id], yb = g.ys[id] + g.h * .68;

}
function tableauComplet(c, g) { grille(c, g); entete(c, g); for (const id of ['initial', 'en_cours', 'final']) ligneT(c, g, id); }

/* Loupe (vues acide_eau et base_eau) : donneur de proton, accepteur, proton jaune qui saute. */
const BE = { x: 34, y: 122, w: 112, h: 128 }, LP = { x: 318, y: 162, r: 100 };
const POS_G = [LP.x - 46, LP.y - 8], POS_D = [LP.x + 50, LP.y - 8];

  const a0 = lisse(clamp(M.p('becher') * 1.4, 0, 1));

      const gl = ctx.createRadialGradient(LP.x - 30, LP.y - 40, 10, LP.x, LP.y, LP.r); gl.addColorStop(0, `rgba(225,240,255,${(.13 * a).toFixed(3)})`); gl.addColorStop(1, `rgba(200,225,250,${(.05 * a).toFixed(3)})`);
      ctx.fillStyle = gl; ctx.fillRect(LP.x - LP.r, LP.y - LP.r, 2 * LP.r, 2 * LP.r);

        depart = [dx + e.proton[0] * KM, dy + e.proton[1] * KM]; lienD = [dx, dy];
        arrivee = [gx + m.arrivee[0] * KM, gy + m.arrivee[1] * KM]; lienA = [gx, gy];
      }

    c.cercle(LP.x, LP.y, LP.r, { largeur: 2.6 });
    c.texte('loupe', LP.x + LP.r * .74, LP.y + LP.r * .86, { couleur: 'faible', taille: 15 });

    c.texte('proton H⁺', 486, 78, { couleur: 'jaune', taille: 17 });

  // Noms sous les molécules (dans la loupe) : avant, puis après le saut du proton.

  }

    if (base) { c.texte('H₂O cède un proton H⁺', 452, 124, { taille: 18 }); c.texte('NH₃ le capte : il devient NH₄⁺', 452, 152, { taille: 18 }); c.texte('H₂O devient HO⁻', 452, 180, { taille: 18, couleur: 'faible' }); }

/* ── Repères (déclarés à chaque image ; le libellé dit à quel moment l’élément apparaît) ───────────── */
function reperes(c, M) {
  const v = M.S.vue, quand = nom => (M.vu(nom) ? '' : ` (au moment « ${nom} »)`);
  const R = (id, x, y, w, h, l) => c.repere(id, x, y, w, h, l);
  if (v === 'acide_eau' || v === 'base_eau') {
    const base = v === 'base_eau', eq = M.geo.eq;
    R('becher', BE.x - 8, BE.y - 8, BE.w + 16, BE.h + 16, `le bécher : ${base ? 'solution d’ammoniac' : 'acide éthanoïque, C = 1,0·10⁻² mol/L'}${quand('becher')}`);
    R('loupe', LP.x - LP.r, LP.y - LP.r, 2 * LP.r, 2 * LP.r, `la loupe : ${base ? 'NH₃ et H₂O' : 'CH₃COOH et H₂O'}, le proton H⁺ en jaune${quand('loupe')}`);
    R('equation', eq.x - 6, eq.y - 28, eq.w + 12, 40, `l’équation « ${base ? 'NH₃ + H₂O ⇌ NH₄⁺ + HO⁻' : 'CH₃COOH + H₂O ⇌ CH₃COO⁻ + H₃O⁺'} »${quand('equation')}`);
    if (!base) {
      R('molecule_acide', POS_G[0] - 48, POS_G[1] - 36, 96, 100, `la molécule d’acide CH₃COOH (devient CH₃COO⁻)${quand('loupe')}`);
      R('molecule_eau', POS_D[0] - 32, POS_D[1] - 36, 64, 100, `la molécule d’eau H₂O (devient H₃O⁺)${quand('loupe')}`);
      const k = M.geo.couples; R('couples', k.x, k.y, k.w, k.h, `les couples CH₃COOH/CH₃COO⁻ et H₃O⁺/H₂O${quand('couples')}`);
    } else {
      R('couples', 14, 332, 260, 30, `les couples NH₄⁺/NH₃ et H₂O/HO⁻${quand('equation')}`);
      R('renvoi', 450, 208, 290, 62, `« τ d’une base : au chapitre des réactions acide-base »${quand('renvoi')}`);
    }
  } else if (v === 'attendu') {
    const e = ecranPH(PA);
    R('hypothese', 14, 48, 440, 64, `« si la réaction était totale : [H₃O⁺] = C = 1,0·10⁻² mol/L »${quand('hypothese')}`);
    R('ph_attendu', 14, 154, 200, 36, `« pH attendu = 2,0 »${quand('calcul_attendu')}`);
    R('afficheur', e.x, e.y, e.w, e.h, `l’afficheur du pH-mètre : 3,4${quand('mesure')}`);
    R('ph_mesure', PA.x - 6, PA.y + PA.h + 30, PA.w + 12, 28, `« pH mesuré = 3,4 »${quand('mesure')}`);
    R('conclusion', 14, 264, 360, 70, `« moins de H₃O⁺ que prévu : la réaction n’est pas totale »${quand('conclusion')}`);
  } else if (v === 'tableau' || v === 'x_max' || v === 'x_f') {
    const g = TB(), rang = (id, k, l, nom) => R(id, g.x, g.ys[k], g.xf - g.x, g.h, l + (nom ? quand(nom) : ''));
    const colH = (l, nom) => R('colonne_h3o', g.xs[3], g.y, g.cols[3], g.yf - g.y, l + (nom ? quand(nom) : ''));
    if (v === 'tableau') {
      R('equation', g.x, g.y, g.xf - g.x, g.h, `la ligne de l’équation : CH₃COOH + H₂O ⇌ CH₃COO⁻ + H₃O⁺${quand('equation')}`);
      rang('ligne_initial', 'initial', 'la ligne « état initial (x = 0) » : C·V · excès · 0 · 0', 'etat_initial');
      rang('ligne_en_cours', 'en_cours', 'la ligne « en cours (x) » : C·V − x · excès · x · x', 'en_cours');
      rang('ligne_final', 'final', 'la ligne « état final (x_f) » : C·V − x_f · excès · x_f · x_f', 'etat_final');
      colH('la colonne de H₃O⁺ : 0 ; x ; x_f');
    } else if (v === 'x_max') {
      R('hypothese', 14, 184, 520, 66, `« si la réaction était totale : C·V − x_max = 0 »${quand('hypothese')}`);
      const P = M.geo.xmax, y = 292;
      R('relation', P.xs[0] - 4, y - 28, P.ws[0] + 8, 38, `« x_max = C·V »${quand('relation')}`);

    } else {

      R('relation', 14, 210, 400, 36, `« x_f = [H₃O⁺]éq·V = 10^(−pH)·V »${quand('relation')}`);
      R('application', 14, 256, 430, 62, `« x_f = 4,0·10⁻⁴ × 0,100 »${quand('application')}`);
      R('resultat', 262, 284, 190, 36, `« x_f = 4,0·10⁻⁵ mol »${quand('resultat')}`);
      const B = M.geo.barres; R('barres', B.xf - 16, B.base - B.hmax - 30, B.xm + B.w - B.xf + 32, B.hmax + 58, `les deux barres : x_f (petite) et x_max (25 fois plus haute)${quand('comparer')}`);

    R('taux', 14, 196, 150, 60, `« τ = x_f / x_max = 1 »${quand('taux')}`);
