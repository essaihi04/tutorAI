<script>
/*
 * National 2019 N, partie 2 (acide benzoïque), JOUÉ question par question (cours phys_ch12_etat_equilibre, 2ᵉ passe du
 * 18 novembre 2026, skill professeur règle 41). Sujet : backend/data/exams/physique/2019-normale/exam.json, ex. 1, 2.1 à 2.4.
 * Vues (?vue=) : q1 (2.1 l’équation) | q2 (2.2 le tableau d’avancement) | q3 (2.3.1 σ mesurée, σ = (λ₁ + λ₂)·[H₃O⁺]éq) |
 *               q4 (2.3.2 τ = σ/(C·(λ₁ + λ₂)) = 0,22) | q5 (2.4 K = C·τ²/(1 − τ) = 6,2·10⁻⁵).
 * Chaque vue : un bandeau vert rappelle ce que les questions d’avant ont trouvé, puis une étape à la fois (moments) ; l’étape
 * DÉCISIVE (la réponse de la question d’observation) et tout ce qui suit sont tus tant que `conclusions` vaut false
 * (set_parameters, question d’observation : sim_avant / sim_apres). `?depart=debut` : la scène attend, vide, la première
 * commande de la voix (pas de départ seul) ; `reset` la remet à zéro sans la lancer.
 * Moteur, peinture et aides : copies de conductimetrie.html du même dossier (le kit partagé n’est pas modifié).
 */
/* ── Formules chimiques à la craie : indices ₂ et charges ⁺ ⁻ ²⁻ rendus (sans modifier exposants.js ni le kit) ──────────
 * « MnO₄⁻ » devient « MnO_{4}^{−} » ; le découpage « _{…} » accepte tout caractère avant (« [I⁻]₀ »). */
(function () {
  const C = window.Tableau.Craie, P = C.prototype, texteAvant = P.texte, segAvant = C.segments;
  const SUP = { '⁺': '+', '⁻': '−', '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9' };
  const SUB = { '₀': '0', '₁': '1', '₂': '2', '₃': '3', '₄': '4', '₅': '5', '₆': '6', '₇': '7', '₈': '8', '₉': '9' };
  const chim = s => String(s).replace(/[⁺⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, g => '^{' + [...g].map(ch => SUP[ch]).join('') + '}')
    .replace(/[₀₁₂₃₄₅₆₇₈₉]+/g, g => '_{' + [...g].map(ch => SUB[ch]).join('') + '}');
  C.segments = function (s) {
    const out = [], re = /_\{([^}]+)\}/g; let i = 0, m;
    while ((m = re.exec(s))) { if (m.index > i) out.push(...segAvant(s.slice(i, m.index))); out.push({ t: m[1], sub: true }); i = re.lastIndex; }
    if (i < s.length) out.push(...segAvant(s.slice(i)));
    return out;
  };
  P.texte = function (s, x, y, o) { return texteAvant.call(this, chim(s), x, y, o); };
  window.chim = chim;
})();

/* ── Indices après n’importe quel caractère (« [H₃O⁺]_{éq} », « [AH]_{éq} », « Q_{r,éq} ») : on passe toujours par
 * l’écriture à indices et exposants d’exposants.js quand la chaîne contient « _{ » ou « ^ » (le kit n’est pas modifié). */
(function () {
  const T = window.Tableau, P = T.Craie.prototype, avant = P.texte;
  P.texte = function (s, x, y, o = {}) {
    const t = window.chim ? window.chim(String(s)) : String(s);
    if (!/_\{|\^/.test(t)) return avant.call(this, s, x, y, o);
    let taille = o.taille ?? 18;
    this.ctx.font = `${o.gras ? '700 ' : ''}${taille}px ${T.POLICE}`;
    this._verifierCadre(t.replace(/[_^{}]/g, ''), x, y, taille, o.align);
    if (this.echelle && this.tailleMin) taille = Math.max(taille, this.tailleMin / this.echelle);
    return this._texteIndices(t, x, y, o, taille);
  };
})();

/* ── Moteur du déroulé (copie de physics/circuit-rlc-tableau/circuit-lc.html, + M.evs) ─────────────────────────────────── */
const { fr, bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lisse = p => p * p * (3 - 2 * p);
const lerp = (a, b, f) => a + (b - a) * f;
const fx = (v, d = 2) => fr(v, d).replace(/(,\d*?)0+$/, '$1').replace(/,$/, '');
const ECRITURE = 2.5;
const FIGEE = new URLSearchParams(location.search).get('depart') === 'debut';
function Moteur(o) {
  const q = new URLSearchParams(location.search);
  const S = { vue: o.vues.includes(q.get('vue')) ? q.get('vue') : o.vues[0], t: 0, running: false, pause: false, fait: false,
    jusqua: null, motif: '', emis: 0, dit: '', mesure: false };
  const V = o.vitesse ?? 1.7, T0 = o.T0 ?? .8, HOLD = {};
  let TL = null;
  function construire() {
    let s = T0; const ev = [];
    for (const e of o.etapes(S.vue)) {
      const anim = e.anim || 0, d = { ...e, anim, debut: s, ecrit: s + (e.ecritDes ?? anim) };
      d.fin = Math.max(s + anim, d.ecrit + (HOLD[e.nom] ?? 1.5)) + .35;
      s = d.fin; ev.push(d);
    }
    const mom = {}; for (const e of ev) mom[e.nom] = e.fin; mom.fin = s + (o.queue ?? .6);
    TL = { ev, M: mom };
  }
  const ev = nom => TL.ev.find(e => e.nom === nom);
  const M = {
    S, ev, evs: () => TL.ev, Moments: () => TL.M,
    p(nom) { const e = ev(nom); if (!e) return 0; return e.anim > 0 ? clamp((S.t - e.debut) / e.anim, 0, 1) : (S.t >= e.debut - 1e-6 ? 1 : 0); },
    commence(nom) { const e = ev(nom); return !!e && S.t > e.debut + 1e-6; },
    vu(nom) { if (nom === 'fin') return S.t >= TL.M.fin - 1e-6; const e = ev(nom); return !!e && S.t >= e.fin - 1e-6; },
    etape(c, nom, fn) {
      const e = ev(nom); if (!e) return;
      const t = c.t, cur = c.cur, comp = c.complet, w0 = e.ecrit;
      c.t = S.t > 1e5 ? 1e9 : w0 + (S.t - w0) * V; c.cur = w0;
      try { fn(); } finally { if (S.mesure) HOLD[nom] = Math.max(HOLD[nom] || 0, (c.cur - w0) / V); c.t = t; c.cur = cur; if (!S.running) c.complet = comp; }
    },
    etat() { return S.running ? 'en cours' : S.fait ? 'fin' : S.pause ? 'arrêt sur image' : 'pas encore lancée'; },
  };
  /* Agrandissement du 15 novembre 2026 : le cadre prend le format du tableau et la boîte de l'encre de l'image complète
   * (fin du déroulé) remplit le tableau ; elle est remesurée à chaque changement de vue. */
  const scene = window.OndesTableau.Scene($('canvas'), (c) => o.dessiner(c, M), { large: true, ajuster: true, complet: f => { const t = S.t; S.t = 1e6; try { f(); } finally { S.t = t; } } });
  const cadreBase = scene.cadre;
  scene.cadre = function (g) { const k = cadreBase.call(scene, g); if (Number.isFinite(k.t)) k.t *= ECRITURE; poser(k, M); return k; };
  M.scene = scene; M.craie = scene.craie;
  function calculer() {
    construire();
    const t = S.t, r = S.running; S.t = 1e6; S.running = false; S.mesure = true;
    for (const k of Object.keys(HOLD)) delete HOLD[k];   // une étape dessinée en plusieurs morceaux garde le plus long (max ci-dessus)
    try { o.dessiner(scene.craie, M); } finally { S.t = t; S.running = r; S.mesure = false; }
    construire(); scene.sale = true;
  }
  const sansSouligne = s => String(s).replace(/([A-Za-zΔτθ])_\{?([A-Za-z0-9]+)\}?/g, (m, a, i) => a + (/^\d+$/.test(i) ? [...i].map(d => '₀₁₂₃₄₅₆₇₈₉'[d]).join('') : i));
  const dire = (texte, kind = '') => { texte = sansSouligne(texte); S.dit = texte; bulle($('feedback'), texte, kind); };
  const etiquette = () => { $('run').textContent = S.running ? 'Pause' : S.pause ? 'Reprendre' : S.fait ? 'Rejouer' : 'Lancer'; };
  let pont = null;
  const emettre = () => pont && pont.emettre();
  const noter = (a, d) => pont && pont.noter(a, d);
  scene.avancer = dt => {
    if (!S.running) return !!(o.anime && o.anime());
    const avant = S.t; S.t += dt;
    for (const e of TL.ev) if (avant < e.debut && S.t >= e.debut && e.bulle) dire(e.bulle());
    if (S.jusqua != null && S.t >= S.jusqua) {
      S.t = S.jusqua; S.jusqua = null; S.running = false;
      if (S.t >= TL.M.fin - 1e-6) { finir(); return true; }
      S.pause = true; etiquette(); dire('Arrêt sur image : ' + (S.motif || `t = ${fx(S.t, 1)} s`) + '.');
      noter('pause', { time_s: +S.t.toFixed(2) }); emettre(); return true;
    }
    if (S.t >= TL.M.fin) { S.t = TL.M.fin; finir(); return true; }
    if (performance.now() - S.emis > 500) { S.emis = performance.now(); emettre(); }
    return true;
  };
  function finir() { S.running = false; S.fait = true; S.pause = false; S.jusqua = null; etiquette(); dire(o.messageFin(M), 'good'); noter('measurement', o.params(M)); emettre(); }
  function start() { o.reprise && o.reprise(); S.t = 0; S.jusqua = null; S.motif = ''; S.running = true; S.pause = false; S.fait = false; etiquette(); dire(o.depart(M)); noter('start', o.params(M)); emettre(); }
  /** Remise à zéro sans lancer (?depart=debut) : le tableau est vide, la voix lance chaque étape. */
  function remettre() { S.t = 0; S.jusqua = null; S.motif = ''; S.running = false; S.pause = false; S.fait = false; etiquette(); scene.sale = true; dire(o.depart(M)); noter('reset'); emettre(); }
  function pause() { if (!S.running) return; S.running = false; S.pause = true; S.jusqua = null; etiquette(); dire('Arrêt sur image.'); noter('pause', { time_s: +S.t.toFixed(2) }); emettre(); }
  function resume() { if (S.running) return; o.reprise && o.reprise(); if (!S.pause) return start(); S.running = true; S.pause = false; etiquette(); dire('Ça repart…'); noter('resume'); emettre(); }
  function setTime(p) {
    const t = +p.time_s; if (p.time_s === null || p.time_s === '' || !Number.isFinite(t)) return;
    o.reprise && o.reprise(); S.running = false; S.jusqua = null; S.t = clamp(t, 0, TL.M.fin); S.fait = S.t >= TL.M.fin - 1e-6; S.pause = !S.fait && S.t > 0;
    etiquette(); scene.sale = true; dire(`Arrêt sur image : t = ${fx(S.t, 1)} s.`); noter('set_time', { time_s: S.t }); emettre();
  }
  function playUntil(p) {
    const noms = o.etapes(S.vue).map(e => e.nom).concat('fin');
    const nom = noms.includes(p.moment) ? p.moment : null, cible = nom ? TL.M[nom] : +p.time_s;
    if (!Number.isFinite(cible) || (p.moment && !nom && (p.time_s == null || p.time_s === ''))) { dire(`Moment inconnu : ${p.moment}.`, 'bad'); emettre(); return; }
    o.reprise && o.reprise();
    if (S.fait || S.t >= cible - 1e-3) { S.t = 0; S.fait = false; }
    S.jusqua = clamp(cible, .01, TL.M.fin); S.motif = nom ? (o.motifs[nom] || nom) : ''; S.running = true; S.pause = false; etiquette(); dire('Observe…');
    noter('play_until', { moment: nom, time_s: S.jusqua }); emettre();
  }
  function setParameters(p) {
    p = p || {};
    const r = o.appliquer(p, M) || {};
    if (r.vue && o.vues.includes(r.vue) && r.vue !== S.vue) { S.vue = r.vue; r.change = true; r.vueChange = true; }
    if (r.change) { calculer(); if (r.vueChange) { scene.boite = null; scene.reecrire(); } else scene.remesurer(); }
    noter('set_parameters', o.params(M));
    if (r.apres) r.apres();
    else if (r.change && !r.garder) start();
    else { scene.sale = true; emettre(); }
  }
  Object.assign(M, { noter, calculer, dire, start, pause, resume, setTime, playUntil, setParameters, emettre, etiquette });
  $('run').onclick = () => (S.running ? pause() : S.pause ? resume() : start());
  window.Tableau.explication(o.explications);
  const commandes = ['start', 'reset', 'pause', 'resume', 'set_time', 'set_parameters', 'play_until'];
  M.lancer = () => {
    calculer();
    const listeMoments = o.vues.map(v => `${o.vues.length > 1 ? v + ' : ' : ''}${o.etapes(v).map(e => e.nom).concat('fin').join(' | ')}`).join(' ; ');
    const config = { id: o.id, version: '1.0', title: o.titre, variants: o.vues.length > 1 ? o.vues.map(id => ({ id, label: o.titres[id] })) : [], commands: commandes,
      command_schema: { set_parameters: o.schema, set_time: { time_s: '0..fin (arrêt sur cet instant de la scène, en s ; voir moments)' },
        play_until: { moment: listeMoments, time_s: 'ou un instant en s' } } };
    pont = protocole({ id: o.id, commandes, config, texte: o.texte,
      etat: () => ({ simulation_status: S.running ? 'running' : S.fait ? 'finished' : S.pause ? 'paused' : 'idle',
        ce_qui_se_voit: o.voir(M) + (S.dit ? ` La bulle dit : « ${S.dit} »` : ''), current_variant: S.vue, time_s: +S.t.toFixed(2),
        parameters: o.params(M), moments: Object.fromEntries(Object.entries(TL.M).map(([k, v]) => [k, +v.toFixed(2)])) }),
      progression: () => (S.fait ? 1 : 0),
      executer: (cmd, p) => ({ start, reset: FIGEE ? remettre : start, pause, resume, set_time: () => setTime(p), set_parameters: () => setParameters(p), play_until: () => playUntil(p) })[cmd]?.() });
    dire(o.depart(M));
    if (!FIGEE) setTimeout(() => { if (!S.running && S.t === 0 && !S.pause && !S.fait) start(); }, 900);
  };
  return M;
}
/* ── Tableau large (15 novembre 2026, « la simulation n'occupe qu'une bande étroite, textes minuscules ») ──────────────
 * Sur un tableau large (scene.L ≥ 1000, écran de portable), une vue déclarée dans LARGE[vue] = { k, x, y, g } est agrandie
 * k fois et posée en (x, y) du cadre ; chaque groupe g[nom] = [dx, dy] (la conclusion du bas, la suite d'un calcul…) est
 * déplacé dans la place libre à droite (grp(c, nom, fn) entoure son dessin ET son repère, que le professeur pointe donc
 * au bon endroit). Les autres vues, et tout le grand écran (L < 1000), gardent l'ajustement automatique. */
const LARGE = {};
/* Deuxième passe (15 novembre 2026, « agrandir les figures elles-mêmes ») : une vue déclarée dans BLOCS[vue] est
 * redistribuée en colonnes par blocs.js (la figure sur toute la hauteur, les colonnes de texte agrandies autour) ;
 * elle passe avant LARGE. */
const BLOCS = {};
let LG = null;
function poser(c, M) {
  const bl = window.Blocs && window.Blocs.poser(c, M.scene, BLOCS[M.S.vue]);
  if (bl) { LG = bl.lg ? {} : null; return; }   // bl.lg : les variantes « tableau large » du dessin (sur deux lignes…), sans déplacement
  const sc = M.scene, d = !sc.mesurant && sc.L >= 1000 && LARGE[M.S.vue];
  LG = d || null; if (!d) return;
  const s0 = Math.min(c.W / sc.L, c.H / 420), ox0 = (c.W - sc.L * s0) / 2, oy0 = (c.H - 420 * s0) / 2;
  const cx = Math.max(0, (sc.L - (d.L || 1292)) / 2);   // tableau plus large (jusqu'à 1596) : la disposition est centrée
  const ns = s0 * d.k, nox = ox0 + (d.x + cx) * s0, noy = oy0 + d.y * s0;
  c.ctx.scale(1 / sc.s, 1 / sc.s); c.ctx.translate(-sc.ox, -sc.oy);   // défait le cadrage de l'ajustement
  c.ctx.translate(nox, noy); c.ctx.scale(ns, ns);
  sc.s = ns; sc.ox = nox; sc.oy = noy; c.echelle = ns;
  c.cadre = { w: (sc.L - d.x) / d.k, h: (420 - d.y) / d.k, haut: 0 };
}
/** Dessine `fn` dans le groupe `nom` : déplacé sur un tableau large si la vue le demande. */
function grp(c, nom, fn) {
  const d = LG && LG.g && LG.g[nom]; if (!d) return fn();
  c.ctx.save(); c.ctx.translate(d[0], d[1]); try { return fn(); } finally { c.ctx.restore(); }
}
/** Zone d’écriture du bas : le professeur efface les plus vieilles lignes (copie du modèle). */
function zoneEcriture(c, M, liste, ys, o = {}) {
  const S = M.S, x = o.x ?? 14, max = o.max ?? 730, taille = o.taille ?? 17, n = ys.length, vues = [];
  if (S.mesure) {
    for (const e of liste) M.etape(c, e.nom, () => { for (const [t, col] of e.lignes) c.texte(t, x, ys[0], { couleur: col, taille, max }); e.plus && e.plus(c); });
    return vues;
  }
  let k = -1;
  liste.forEach((e, j) => { const ev = M.ev(e.nom); if (ev && S.t > ev.ecrit + .05) k = j; });
  const garde = new Set(); let nb = 0;
  for (let j = k; j >= 0; j--) { const l = liste[j].lignes.length; if (nb + l > n) break; garde.add(j); nb += l; }
  let y = 0;
  liste.forEach((e, j) => {
    if (j > k) return;
    M.etape(c, e.nom, () => {
      if (garde.has(j)) for (const [t, col] of e.lignes) { c.texte(t, x, ys[y++], { couleur: col, taille, max }); vues.push(t); }
      e.plus && e.plus(c);
    });
  });
  return vues;
}
/* larg(c, s, taille) : plus bas, avec le plancher des indices de cette page. */
/** Équation « gauche → droite » : la flèche est DESSINÉE (la police n’a pas toutes les flèches). Renvoie { x, w }. */
function eqn(c, x, y, gauche, droite, o = {}) {
  if (window.Etats) { [gauche, droite] = window.Etats.cotes(gauche, droite); o = window.Etats.ajuste(c, x, gauche, droite, o); }   // états physiques (aq), (l), (s), (g)
  const t = o.taille ?? 17, w1 = larg(c, gauche, t), w2 = larg(c, droite, t), fl = 30, tot = w1 + fl + 16 + w2;
  const x0 = o.align === 'center' ? x - tot / 2 : o.align === 'right' ? x - tot : x, col = o.couleur ?? 'blanc';
  c.texte(gauche, x0, y, { couleur: col, taille: t });
  c.fleche(x0 + w1 + 8, y - t * .3, x0 + w1 + 8 + fl, y - t * .3, { couleur: col, largeur: 1.8, tete: 7 });
  c.texte(droite, x0 + w1 + 16 + fl, y, { couleur: col, taille: t });
  return { x: x0, w: tot };
}
/** Petit triangle « attention » à la craie (orange), le « ! » dedans. */
function attention(c, x, y, o = {}) {
  const col = o.couleur ?? 'orange', h = o.h ?? 16;
  c.trait([[x, y], [x + h * .58, y - h], [x + h * 1.16, y]], { couleur: col, largeur: 1.8, ferme: true });
  c.texte('!', x + h * .58, y - 3, { couleur: col, taille: h * .8, align: 'center' });
}
/* ── Fractions et flèches dessinées (copie de transformations-deux-sens-tableau/avancement.html) ── */
const FL = 34;
/** Flèche simple → (milieu à la hauteur y). */
function flecheSimple(c, x, y, w, col = 'blanc') { c.fleche(x + 2, y, x + w - 2, y, { couleur: col, largeur: 1.9, tete: 8 }); }
/** Double flèche ⇌ (deux demi-flèches), milieu à la hauteur y. */
function flecheDouble(c, x, y, w, col = 'blanc') {
  c.trait([[x + 2, y - 3.5], [x + w - 2, y - 3.5], [x + w - 10, y - 10]], { couleur: col, largeur: 1.9 });
  c.trait([[x + w - 2, y + 3.5], [x + 2, y + 3.5], [x + 10, y + 10]], { couleur: col, largeur: 1.9, duree: .12 });
}
/** Morceau : texte, '→', '⇌', ou { frac: [numérateur, dénominateur] }. */
function largeurMorceau(c, p, t) {
  if (p === '→' || p === '⇌') return FL;
  if (p && p.frac) return Math.max(larg(c, p.frac[0], t), larg(c, p.frac[1], t)) + 14;
  return larg(c, p, t);
}
/** Positions x de chaque morceau d’une ligne (gap entre deux) : elles ne dépendent pas du temps, chaque étape écrit les siens. */
function placer(c, x, morceaux, t, o = {}) {
  if (window.Etats) morceaux = window.Etats.morceaux(morceaux);   // états physiques
  const gap = o.gap ?? 8, ws = morceaux.map(p => largeurMorceau(c, p, t)), tot = ws.reduce((a, b) => a + b, 0) + gap * (morceaux.length - 1);

/* q2 — le tableau d’avancement, ligne par ligne */
const TB = { x: 14, y: 42, ws: [104, 66, 150, 86, 150, 100], h: 42 };

  ligne.forEach((t, i) => { if (t != null) c.texte(t, x + TB.ws[i] / 2, y, { taille: T, align: 'center', couleur: (cols && cols[i]) || 'blanc' }); x += TB.ws[i]; });
}
function vueQ2(c, M) {
  rappel(c, M, '2.1 :', (x, y) => eqn2(c, x, y, 'C₆H₅COOH + H₂O', 'C₆H₅COO⁻ + H₃O⁺', { taille: T, couleur: 'vert' }));
  const W = TB.ws.reduce((a, b) => a + b, 0);
  E(c, M, 'grille', () => {
    for (let k = 0; k <= 4; k++) c.ligne(TB.x, TB.y + k * TB.h, TB.x + W, TB.y + k * TB.h, { couleur: 'blanc', largeur: 1.3 });
    let x = TB.x; for (let i = 0; i <= TB.ws.length; i++) { c.ligne(x, TB.y, x, TB.y + 4 * TB.h, { couleur: 'blanc', largeur: 1.3 }); x += TB.ws[i] || 0; }
    cellules(c, ['état', 'x', 'C₆H₅COOH', 'H₂O', 'C₆H₅COO⁻', 'H₃O⁺'], 0, ['cyan', 'cyan', 'cyan', 'cyan', 'cyan', 'cyan']);
  });
  E(c, M, 'initial', () => cellules(c, ['initial', '0', 'C·V', 'excès', '0', '0'], 1));
  const reponse = montre(M, 'en_cours');

  const vu = [];
  if (montre(M, 'rappel')) vu.push('en vert, déjà trouvé (2.1) : l’équation C₆H₅COOH + H₂O ⇌ C₆H₅COO⁻ + H₃O⁺');

  if (montre(M, 'x_max')) vu.push('« x_max = C·V = 1,0·10⁻³ mol : l’acide est limitant » (l’eau est en excès)');

}

function vueQ3(c, M) {
  rappel(c, M, '2.2 :', (x, y) => c.texte('C·V − x_{éq} | x_{éq} | x_{éq}', x, y, { couleur: 'vert', taille: T }));

    Peint.becher(ctx, BQ, .62, BENZ);
    cellule(ctx, cx, BQ.y - 30 + dy, BQ.y + BQ.h - 56 + dy, 24, 40);
    fil(ctx, cx, BQ.y - 30 + dy, AQ.x + AQ.w / 2, AQ.y + AQ.h, '#2b2f35', 12);

  E(c, M, 'somme', () => {

  });

  if (M.commence('mesure')) vu.push(`en haut à droite : le conductimètre qui affiche ${p > .38 ? fx(val, 1) + ' mS/m' : 'rien encore'}, relié à la cellule ${p < .35 ? 'qui descend' : 'plongée'} dans le bécher de solution S`);
  if (montre(M, 'mesure') && M.vu('mesure')) vu.push('« σ = 8,6·10⁻³ S/m »');
  if (montre(M, 'lambdas')) vu.push('« λ₁ = 35·10⁻³ ; λ₂ = 3,23·10⁻³ S·m²·mol⁻¹ »');
  if (montre(M, 'somme')) vu.push('« 2.3.1 σ = λ₁·[H₃O⁺]éq + λ₂·[C₆H₅COO⁻]éq »');
  if (M.commence('egalite_q')) vu.push(reponse ? '« [C₆H₅COO⁻]éq = [H₃O⁺]éq = x_éq/V » en jaune' : '« [C₆H₅COO⁻]éq ? [H₃O⁺]éq » en orange : la comparaison n’est pas encore écrite');

}

/* ── Ce que voit le tuteur ── */
function voir(M) {
  const v = M.S.vue, m = [`National 2019 N, question ${TITRES[v]} (vue ${v}), ${M.etat()}. Étape en cours : ${etapeEnCours(M)}.`];
