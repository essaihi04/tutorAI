<script>
/*
 * La carte du chapitre « État d’équilibre d’un système chimique » (phys_ch12_etat_equilibre), ouverture et fin du cours ;
 * même forme et même protocole que chimie/transformations-deux-sens-tableau/carte.html (contrat etat_equilibre_contrat_simulations.md, § 8).
 * Au centre « À l’équilibre : Qr,éq = K » (moment `centre` : un petit bécher incolore peint d’acide éthanoïque, « pH = 3,41 » et
 * « K = 1,6·10⁻⁵ »), puis les branches dessinées l’une après l’autre au rythme de la voix (play_until {moment: <branche>}) : rappel,
 * quotient, etat_initial, equilibre, constante, inverse, mesures, facteurs, national, suite ; puis `complete` : toutes les branches
 * entourées une à une (jaune = surlignage) ; `fin` = la carte complète. Une branche sautée s’écrit d’un coup ; celle qu’on dit s’écrit à cet instant.
 * L’élève touche une branche : sa phrase s’écrit dans la bulle. Le lecteur donne le bilan de l’élève
 * (set_parameters {lacunes, acquis_ids}, compétences C1 à C7 : C1 quotient, C2 etat_initial, C3 equilibre, C4 constante et inverse,
 * C5 mesures, C6 facteurs, C7 national) : branches à reprendre entourées en rouge (à revoir : orange), acquises cochées.
 */
/* Indices après n’importe quel caractère (« [H₃O⁺]_{éq} ») : le découpage « _{…} » est fait avant celui du kit (copie de bilan.html). */
(function () {
  const C = window.Tableau.Craie, segAvant = C.segments;
  C.segments = function (s) {
    const out = [], re = /_\{([^}]+)\}/g; let i = 0, m;
    while ((m = re.exec(s))) { if (m.index > i) out.push(...segAvant(s.slice(i, m.index))); out.push({ t: m[1], sub: true }); i = re.lastIndex; }
    if (i < s.length) out.push(...segAvant(s.slice(i)));
    return out;
  };
})();
/* ── Indices après n’importe quel caractère (« [H₃O⁺]_{éq} », « [AH]_{éq} », « Q_{r,éq} ») : on passe toujours par
 * l’écriture à indices et exposants d’exposants.js quand la chaîne contient « _{ » ou « ^ » (le kit n’est pas modifié). */
(function () {
  const T = window.Tableau, P = T.Craie.prototype, avant = P.texte;
  P.texte = function (s, x, y, o = {}) {
    const t = window.chim ? window.chim(String(s)) : String(s);
    if (!/_\{|\^/.test(t)) return avant.call(this, s, x, y, o);
    let taille = o.taille ?? 18;
    this.ctx.font = `${o.gras ? '700 ' : ''}${taille}px ${T.POLICE}`;
    this._verifierCadre(t.replace(/[_^{}]/g, ''), x, y, taille, o.align);
    if (this.echelle && this.tailleMin) taille = Math.max(taille, this.tailleMin / this.echelle);
    return this._texteIndices(t, x, y, o, taille);
  };
})();
const { bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);

/* Formules chimiques à la craie : indices (₄) et charges (²⁺, ⁻) en notation du kit (« O_{4} », « ^{2+} », écrits plus petits
 * par le kit et exposants.js : la police du tableau n’a ni « ₄ » ni « ⁺ ») ; les flèches « → » et « ⇌ » sont DESSINÉES au trait. */
const IND = { '₀': '0', '₁': '1', '₂': '2', '₃': '3', '₄': '4', '₅': '5', '₆': '6', '₇': '7', '₈': '8', '₉': '9' };
const EXPO = { '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9', '⁺': '+', '⁻': '−' };
const chimie = s => String(s).replace(/t₁\/₂/g, 't_{1/2}')
  .replace(/([A-Za-z])([₀-₉]+)/g, (m, l, g) => l + '_{' + [...g].map(ch => IND[ch]).join('') + '}')
  .replace(/[₀-₉]+/g, g => [...g].map(ch => IND[ch]).join(''))
  .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻]+/g, g => '^{' + [...g].map(ch => EXPO[ch]).join('') + '}');
const FLECHE = /(⇌|→)/;
const longFleche = taille => taille * 1.5, marge = taille => taille * .32;
/** Largeur d'un morceau de texte (indices et charges plus petits, comme le kit les écrit). */
function largeurMorceau(c, t, taille) {
  return window.Tableau.Craie.segments(chimie(t)).reduce((w, g) => w + c.largeurTexte(g.t, g.sub || g.sup ? taille * .62 : taille), 0);
}
/** Largeur d'une ligne qui peut contenir des flèches dessinées. */
function largeur(c, s, taille) {
  return String(s).split(FLECHE).reduce((w, p, i) => w + (i % 2 ? longFleche(taille) + 2 * marge(taille) : p.trim() ? largeurMorceau(c, p.trim(), taille) : 0), 0);
}
/** Flèche de réaction (→) ou double flèche des demi-équations (⇌ : deux demi-flèches), au trait. */
function flecheDessinee(c, x0, y, taille, type, o) {
  const x1 = x0 + longFleche(taille), yc = y - taille * .3, t = Math.max(4, taille * .32), st = { couleur: o.couleur || 'blanc', largeur: Math.max(1.1, taille * .1), alpha: o.alpha, duree: .18 };
  if (type === '→') {
    c.trait([[x0, yc], [x1, yc]], st);
    c.trait([[x1 - t, yc - t * .6], [x1, yc], [x1 - t, yc + t * .6]], { ...st, duree: .08 });
  } else {
    const e = taille * .14;
    c.trait([[x0, yc - e], [x1, yc - e], [x1 - t, yc - e - t * .6]], st);
    c.trait([[x1, yc + e], [x0, yc + e], [x0 + t, yc + e + t * .6]], st);
  }
}
/** Écrit une ligne (formule ou phrase) : morceaux de craie et flèches dessinées. o : couleur, taille, align, max, alpha, duree. */
function ecrire(c, s, x, y, o = {}) {
  let taille = o.taille ?? 18;
  const total = largeur(c, s, taille);
  if (o.max && total > o.max) taille = Math.max(9, taille * o.max / total);
  if (c.echelle && c.tailleMin) taille = Math.max(taille, c.tailleMin / c.echelle);   // même plancher que le kit : morceaux et flèches restent alignés
  const L = largeur(c, s, taille);
  let px = o.align === 'center' ? x - L / 2 : o.align === 'right' ? x - L : x;
  String(s).split(FLECHE).forEach((p, i) => {
    if (i % 2) { px += marge(taille); flecheDessinee(c, px, y, taille, p, o); px += longFleche(taille) + marge(taille); return; }
    const t = p.trim(); if (!t) return;
    c.texte(chimie(t), px, y, { couleur: o.couleur, taille, alpha: o.alpha, gras: o.gras, duree: o.duree });
    px += largeurMorceau(c, t, taille);
  });
  return L;
}

const CENTRE = { x: 380, y: 210, w: 236, h: 100, comps: [],
  phrase: 'À l’équilibre, le quotient de réaction prend une valeur qui ne dépend que de la température : Qr,éq = K. Acide éthanoïque à 1,0·10⁻² mol/L : pH = 3,41, Qr,éq = 1,57·10⁻⁵ ; avec trois concentrations, on trouve toujours K = 1,6·10⁻⁵ à 25 °C.' };
// Quatre en haut, une à droite, quatre en bas, une à gauche (le cadre 760 × 420) : la carte se lit dans le sens des aiguilles d’une montre.
const HAUT_Y = 60, BAS_Y = 352, W = 156, H = 66, XS = [95, 285, 475, 665];
const NOEUDS = [
  { id: 'rappel', x: XS[0], y: HAUT_Y, w: W, h: H, couleur: 'cyan', comps: [], titre: 'Rappel',
    lignes: ['τ < 1 : réaction limitée', 'équilibre dynamique'],
    phrase: 'Rappel du chapitre précédent : acide éthanoïque à 1,0·10⁻² mol/L, pH = 3,41, τ = 0,039 < 1, la réaction est limitée ; à l’état d’équilibre, les concentrations ne changent plus, les deux sens continuent à la même vitesse.' },
  { id: 'quotient', x: XS[1], y: HAUT_Y, w: W, h: H, couleur: 'violet', comps: ['C1'], titre: 'Quotient Q_{r}',
    lignes: ['produits en haut,', 'réactifs en bas'],
    phrase: 'Quotient de réaction : pour aA + bB ⇌ cC + dD, Qr = [C]^c·[D]^d divisé par [A]^a·[B]^b ; concentrations en mol/L ; l’eau solvant et les solides n’y apparaissent pas ; Qr est sans unité.' },
  { id: 'etat_initial', x: XS[2], y: HAUT_Y, w: W, h: H, couleur: 'violet', comps: ['C2'], titre: 'État initial',
    lignes: ['Q_{r,i}', 'mélange : V_{T}'],
    phrase: 'Qr,i : le quotient de réaction dans l’état initial ; acide versé dans l’eau : Qr,i = 0 ; pour un mélange, concentrations après mélange, dans le volume total V_T (exemple : Qr,i = 0,25).' },
  { id: 'equilibre', x: XS[3], y: HAUT_Y, w: W, h: H, couleur: 'bleu', comps: ['C3'], titre: 'État d’équilibre',
    lignes: ['Q_{r,éq}', '= 1,57·10⁻⁵'],
    phrase: 'Qr,éq : le quotient de réaction dans l’état d’équilibre ; avec le pH : [H₃O⁺]éq = [CH₃COO⁻]éq = 10^(−pH), [CH₃COOH]éq = C − 10^(−pH) ; exemple : Qr,éq = 1,57·10⁻⁵.' },
  { id: 'constante', x: 670, y: 210, w: W, h: H, couleur: 'jaune', comps: ['C4'], titre: 'Constante K',
    lignes: ['K = Q_{r,éq}', 'dépend de la température'],
    phrase: 'La constante d’équilibre K = Qr,éq ne dépend que de la température, pas de l’état initial : acide éthanoïque + eau, K = 1,6·10⁻⁵ à 25 °C, que l’on parte de l’acide ou des produits.' },
  { id: 'inverse', x: XS[3], y: BAS_Y, w: W, h: H, couleur: 'rose', comps: ['C4'], titre: 'Réaction inverse',
    lignes: ['K’ = 1/K', 'K’ = 6,3·10⁴'],
    phrase: 'Réaction écrite dans l’autre sens : CH₃COO⁻ + H₃O⁺ ⇌ CH₃COOH + H₂O ; le quotient se retourne, K’ est l’inverse de K : 6,25·10⁴ ≈ 6,3·10⁴.' },
  { id: 'mesures', x: XS[2], y: BAS_Y, w: W, h: H, couleur: 'bleu', comps: ['C5'], titre: 'Mesurer K',
    lignes: ['pH ou σ → τ → K', '⚠ mol/m³ → mol/L'],
    phrase: 'Mesurer K : avec le pH ou avec σ, on trouve τ, puis K = C·τ² divisé par (1 − τ) ; σ = 4,6 mS/m donne [H₃O⁺]éq = 0,118 mol/m³ = 1,18·10⁻⁴ mol/L, τ = 0,118 et K = 1,6·10⁻⁵ ; attention : mol/m³ → mol/L.' },
  { id: 'facteurs', x: XS[1], y: BAS_Y, w: W, h: H, couleur: 'vert', comps: ['C6'], titre: 'τ dépend de…',
    lignes: ['K et C', 'diluer : τ monte, K fixe'],
    phrase: 'τ dépend de K (la réaction) et de l’état initial (C) : diluer fait monter τ (0,039 ; 0,055 ; 0,117) sans changer K ; à même C, plus K est grande, plus τ est grand (acide méthanoïque : K = 1,8·10⁻⁴, τ = 0,13).' },
  { id: 'national', x: XS[0], y: BAS_Y, w: W, h: H, couleur: 'blanc', comps: ['C7'], titre: 'Au national', encadre: true,
    lignes: ['Q_{r,i}, Q_{r,éq}, K', 'pH, σ, courbe'],
    phrase: 'Au national : calculer Qr,i d’un mélange, Qr,éq à partir du pH ou de σ, K = C·τ² divisé par (1 − τ), lire une quantité à l’équilibre sur une courbe ; résultat sans unité.' },
  { id: 'suite', x: 90, y: 210, w: W, h: 104, couleur: 'faible', comps: [], titre: 'La suite', encadre: true,
    lignes: ['chapitre suivant :', 'réactions acide-base', 'semestre 2 : piles', '(Q_{r,i} comparé à K)'],
    phrase: 'Chapitre suivant : réactions acide-base ; semestre 2 : piles (Qr,i comparé à K).' },
];
const nomDe = n => n.titre.replace(/_\{([^}]+)\}/g, '$1');   // « Quotient Qr » pour la bulle et le tuteur
const ANNEAUX = { non_acquis: ['rouge', 'à reprendre'], partiel: ['orange', 'à revoir'] };
const AVANT = -1e9;   // instant d'un élément déjà dit : écrit d'un coup

// def : instant où le centre se peint (null = pas encore dit) ; n branches dessinées ; apparu[i] leur instant.
// entoure : instant où les branches commencent à être entourées une à une (moment `complete`), null sinon.
const S = { def: null, n: 0, cible: 0, running: false, lacunes: null, acquis: null, apparu: [], choisi: null, entoure: null };
const DUREE_BRANCHE = 2.6;   // s par branche quand la carte se dessine seule

function statut(comps) {
  if (!S.lacunes || !comps.length) return null;
  const lac = S.lacunes.filter(l => comps.includes(l.id));
  if (lac.some(l => l.statut === 'non_acquis')) return 'non_acquis';
  if (lac.length) return 'partiel';
  return (S.acquis || []).some(a => comps.includes(a)) ? 'acquis' : null;
}
/* Anneau rouge/orange ou coche verte autour d'un cadre (état de l'élève). */
function etat(c, comps, x, y, w, h) {
  const st = statut(comps);
  c.direct(() => {
    if (st && ANNEAUX[st]) {
      const [coul, etiq] = ANNEAUX[st];
      c.rect(x - 5, y - 5, w + 10, h + 10, { couleur: coul, arrondi: 16, largeur: 2, pointille: [6, 6] });
      c.texte(etiq, x + w - 4, y - 8, { couleur: coul, taille: 12, align: 'right' });
    } else if (st === 'acquis') c.texte('✓', x + w - 14, y + 16, { couleur: 'vert', taille: 18 });
  });
}

function branche(c, n) {
  const x = n.x - n.w / 2, y = n.y - n.h / 2;
  const dx = n.x - CENTRE.x, dy = n.y - CENTRE.y, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
  // du bord du centre au bord de la branche, avec une légère courbure
  const d0 = Math.min(CENTRE.w / 2 / Math.max(.2, Math.abs(ux)), CENTRE.h / 2 / Math.max(.2, Math.abs(uy)));
  const d1 = Math.min(n.w / 2 / Math.max(.2, Math.abs(ux)), n.h / 2 / Math.max(.2, Math.abs(uy)));
  const a = [CENTRE.x + ux * d0, CENTRE.y + uy * d0], b = [n.x - ux * d1, n.y - uy * d1];
  const m = [(a[0] + b[0]) / 2 - uy * 12, (a[1] + b[1]) / 2 + ux * 12];
  c.courbe(u => [(1 - u) * (1 - u) * a[0] + 2 * (1 - u) * u * m[0] + u * u * b[0], (1 - u) * (1 - u) * a[1] + 2 * (1 - u) * u * m[1] + u * u * b[1]], 24, { couleur: 'faible', largeur: 2, pointille: n.encadre ? [6, 6] : undefined });
  c.rect(x, y, n.w, n.h, { couleur: n.couleur, arrondi: n.encadre ? 4 : 14, largeur: n.encadre ? 1.6 : 2.4, pointille: n.encadre ? [6, 5] : undefined });
  c.texte(n.titre, n.x, y + 21, { couleur: n.couleur, taille: 17, align: 'center', max: n.w - 16, duree: .8 });
  n.lignes.forEach((l, k) => ecrire(c, l, n.x, y + 42 + k * 18, { couleur: 'blanc', taille: 14, align: 'center', max: n.w - 14, alpha: .92, duree: .6 }));
  c.repere(n.id, x - 5, y - 5, n.w + 10, n.h + 10, nomDe(n));
  etat(c, n.comps, x, y, n.w, n.h);
  if (S.choisi === n.id) c.direct(() => c.rect(x - 3, y - 3, n.w + 6, n.h + 6, { couleur: 'blanc', arrondi: 15, largeur: 1.2, alpha: .6 }));
}

function dessiner(c) {
  const x = CENTRE.x - CENTRE.w / 2, y = CENTRE.y - CENTRE.h / 2;
  if (S.def === AVANT) c.cur = AVANT;   // déjà dit (saut ou retour en arrière) : le centre est écrit d'un coup
  c.rect(x, y, CENTRE.w, CENTRE.h, { couleur: 'blanc', arrondi: 18, largeur: 3 });
  c.texte('À l’équilibre :', CENTRE.x, y + 30, { couleur: 'blanc', taille: 24, align: 'center', gras: true });
  c.texte('Q_{r,éq} = K', CENTRE.x, y + 56, { couleur: 'jaune', taille: 21, align: 'center' });
  c.repere('centre', x, y, CENTRE.w, CENTRE.h, 'le centre : à l’équilibre, Qr,éq = K');
  const apres = c.cur;   // fin du titre du centre
  if (S.def != null) {
    c.depuis(S.def);
    // un petit bécher peint, incolore comme l’acide éthanoïque (exemple A), son pH mesuré au centième, et la valeur de K
    peindre(c, ctx => becherPeint(ctx, x + 22, y + 62, 22, 30, 'rgba(205,228,245,.20)', 'rgba(165,200,228,.38)'));
    c.texte('pH = 3,41', x + 54, y + 86, { couleur: 'vert', taille: 15, duree: .5 });
    c.texte('K = 1,6·10⁻⁵', x + 132, y + 86, { couleur: 'jaune', taille: 15, duree: .5 });
    if (S.choisi === 'centre') c.direct(() => c.rect(x - 3, y - 3, CENTRE.w + 6, CENTRE.h + 6, { couleur: 'blanc', arrondi: 19, largeur: 1.2, alpha: .6 }));
  }
  // chaque branche a sa ligne de temps : elle s'écrit dès que la voix la dit, sans attendre la précédente
  for (let i = 0; i < S.n; i++) { c.cur = S.apparu[i] === AVANT ? AVANT : Math.max(apres, S.apparu[i]); branche(c, NOEUDS[i]); }
  // complete : toutes les branches entourées une à une (jaune = surlignage)
  if (S.entoure != null) {
    c.cur = S.entoure === AVANT ? AVANT : Math.max(apres, S.entoure);
    for (const n of NOEUDS) c.rect(n.x - n.w / 2 - 7, n.y - n.h / 2 - 7, n.w + 14, n.h + 14, { couleur: 'jaune', arrondi: 17, largeur: 1.8, alpha: .8, duree: .35 });
  }
  if (S.lacunes) c.direct(() => c.texte('✓ acquis · ⟳ à revoir · ✗ à reprendre', 744, 140, { couleur: 'faible', taille: 12, align: 'right' }));
}
/* Le peint (béchers) apparaît quand l’écriture arrive à lui. */
const peindre = (c, fn) => { if (c.t >= c.cur) c.direct(() => { c.ctx.save(); try { fn(c.ctx); } finally { c.ctx.restore(); } }); };
/** Petit bécher de verre peint avec sa solution (dégradé haut → bas, ménisque, reflet). (x, y) = haut gauche. */
function becherPeint(ctx, x, y, w, h, haut, bas) {
  const n = y + h * .35;   // niveau du liquide
  const g = ctx.createLinearGradient(0, n, 0, y + h);
  g.addColorStop(0, haut); g.addColorStop(1, bas);
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x + 1.5, n); ctx.quadraticCurveTo(x + w / 2, n + 2.2, x + w - 1.5, n); ctx.lineTo(x + w - 1.5, y + h - 3); ctx.quadraticCurveTo(x + w - 1.5, y + h - 1, x + w - 4, y + h - 1); ctx.lineTo(x + 4, y + h - 1); ctx.quadraticCurveTo(x + 1.5, y + h - 1, x + 1.5, y + h - 3); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(226,240,255,.75)'; ctx.lineWidth = 1.4; ctx.beginPath();
  ctx.moveTo(x - 2, y); ctx.lineTo(x, y + 1.5); ctx.lineTo(x, y + h - 3); ctx.quadraticCurveTo(x, y + h, x + 3, y + h); ctx.lineTo(x + w - 3, y + h); ctx.quadraticCurveTo(x + w, y + h, x + w, y + h - 3); ctx.lineTo(x + w, y); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fillRect(x + 3, y + 4, 2, h - 9);   // reflet du verre
}

const canvas = $('canvas');
const scene = window.OndesTableau.Scene(canvas, (c) => { scene.cadre(73); dessiner(c); return c.fin(); });
const maintenant = () => (performance.now() - scene.ouvert) / 1000;
let horloge = 0;
scene.avancer = dt => {
  if (!S.running) return false;
  horloge += dt;
  if (S.n < S.cible && horloge >= 0) {
    // la branche suivante apparaît quand la précédente a fini de s'écrire
    S.n += 1; S.apparu[S.n - 1] = maintenant(); horloge = -DUREE_BRANCHE;
    bulle($('feedback'), nomDe(NOEUDS[S.n - 1]) + (S.n >= NOEUDS.length ? ' — la carte est complète.' : ''));
    pont.noter('branche', { n: S.n, moment: NOEUDS[S.n - 1].id }); pont.emettre();
    if (S.n >= S.cible) S.running = false;
  }
  return true;
};
function moments() { const m = { centre: 0 }; NOEUDS.forEach((n, i) => { m[n.id] = i + 1; }); m.complete = NOEUDS.length + 1; m.fin = NOEUDS.length + 2; return m; }
/* Dessine la carte jusqu'à la branche `cible` (0 = le centre). `pasAPas` : la carte se dessine seule,
 * une branche après l'autre (bouton) ; sinon (la voix) les branches sautées s'écrivent d'un coup et la dernière à cet instant. */
function montrer(cible, par, pasAPas) {
  const entourer = cible > NOEUDS.length ? cible : 0;   // complete (NOEUDS.length + 1) ou fin (+ 2)
  cible = Math.max(0, Math.min(NOEUDS.length, cible));
  if (cible < S.n || (!entourer && S.entoure != null)) { S.n = 0; S.apparu = []; S.def = null; S.entoure = null; scene.reecrire(); }   // retour en arrière : on redessine jusque-là
  if (S.def == null) S.def = pasAPas || cible === 0 ? maintenant() : AVANT;
  if (!pasAPas && cible > S.n) {
    for (let i = S.n; i < cible - 1; i++) S.apparu[i] = AVANT;
    S.apparu[cible - 1] = maintenant(); S.n = cible;
    bulle($('feedback'), nomDe(NOEUDS[cible - 1]) + (cible >= NOEUDS.length ? ' — la carte est complète.' : ''));
  } else if (cible === 0) bulle($('feedback'), 'Au centre : à l’équilibre, Qr,éq = K.');
  if (entourer) {
    // complete : les branches s'entourent une à une maintenant ; fin : tout d'un coup
    if (S.entoure == null || entourer === NOEUDS.length + 2) S.entoure = entourer === NOEUDS.length + 2 ? AVANT : maintenant();
    bulle($('feedback'), 'La carte est complète : toutes les branches du chapitre.');
  }
  S.cible = cible; S.running = S.n < cible; horloge = pasAPas ? -1.5 : 0; scene.sale = true;
  pont.noter(par || 'play_until', { moment: entourer ? (entourer === NOEUDS.length + 1 ? 'complete' : 'fin') : NOEUDS[cible - 1]?.id || 'centre' }); pont.emettre();
}
function playUntil(p) { const M = moments(); const n = p.moment in M ? M[p.moment] : +p.time_s; if (Number.isFinite(n)) montrer(n, 'play_until'); }
function start() { S.n = 0; S.apparu = []; S.def = null; S.choisi = null; S.entoure = null; scene.reecrire(); montrer(NOEUDS.length, 'start', true); bulle($('feedback'), 'La carte se dessine…'); }
function setParameters(p) {
  if (Array.isArray(p.lacunes)) S.lacunes = p.lacunes.map(l => ({ id: String(l.id || ''), label: String(l.label || ''), statut: String(l.statut || 'non_acquis') }));
  if (Array.isArray(p.acquis_ids)) S.acquis = p.acquis_ids.map(String);
  scene.sale = true; pont.noter('set_parameters', { lacunes: (S.lacunes || []).length }); pont.emettre();
}
function ceQuiSeVoit() {
  const vues = NOEUDS.slice(0, S.n).map(nomDe);
  const aReprendre = NOEUDS.slice(0, S.n).filter(n => statut(n.comps) && statut(n.comps) !== 'acquis').map(nomDe);
  const etatEleve = S.lacunes ? ` Branches à reprendre : ${aReprendre.join(', ') || 'aucune'}.` : '';
  const detail = NOEUDS.slice(0, S.n).map(n => n.phrase).join(' ');
  return `Carte du chapitre : « À l’équilibre : Qr,éq = K » au centre${S.def != null ? ' (un petit bécher incolore d’acide éthanoïque, « pH = 3,41 » et « K = 1,6·10⁻⁵ »)' : ''}, ${S.n}/${NOEUDS.length} élément(s) dessiné(s)${vues.length ? ' (' + vues.join(', ') + ')' : ''}${S.running ? ', la carte se dessine' : ''}${S.entoure != null ? ' ; carte complète : toutes les branches entourées une à une en jaune' : ''}.${detail ? ' ' + detail : ''}${etatEleve}${S.choisi ? ` L'élève a touché « ${S.choisi === 'centre' ? 'le centre' : nomDe(NOEUDS.find(n => n.id === S.choisi))} ».` : ''}`;
}
$('run').onclick = start;
// Imprimer / PDF : la carte complète, sur fond blanc (shared/tableau/imprimer.js).
$('imprimer').onclick = () => {
  const avant = { n: S.n, cible: S.cible, running: S.running, apparu: S.apparu.slice(), def: S.def, choisi: S.choisi, entoure: S.entoure };
  window.Tableau.imprimer({ titre: 'Carte du chapitre — état d’équilibre', scene,
    pages: [{ nom: 'la carte complète', preparer: () => { S.n = NOEUDS.length; S.running = false; S.def = AVANT; S.apparu = NOEUDS.map(() => AVANT); S.choisi = null; S.entoure = null; } }],
    restaurer: () => { Object.assign(S, avant); } });
  pont.noter('imprimer', { pages: 1 }); pont.emettre();
};
canvas.addEventListener('pointerdown', e => {
  const r = canvas.getBoundingClientRect(), [x, y] = scene.local(e.clientX - r.left, e.clientY - r.top);
  const n = NOEUDS.slice(0, S.n).find(n => Math.abs(x - n.x) <= n.w / 2 + 6 && Math.abs(y - n.y) <= n.h / 2 + 6);
  if (n) { S.choisi = n.id; bulle($('feedback'), n.phrase); }
  else if (Math.abs(x - CENTRE.x) <= CENTRE.w / 2 && Math.abs(y - CENTRE.y) <= CENTRE.h / 2) { S.choisi = 'centre'; bulle($('feedback'), CENTRE.phrase); }
  else return;
  scene.sale = true; pont.noter('touche', { moment: S.choisi }); pont.emettre();
});

window.Tableau.explication({ carte: [{ repere: 'centre', texte: CENTRE.phrase }, ...NOEUDS.map(n => ({ repere: n.id, texte: n.phrase }))] });
const commandes = ['start', 'reset', 'play_until', 'set_parameters'];
const config = { id: 'etat_equilibre_carte', version: '1.0', title: 'Carte du chapitre — état d’équilibre', variants: [{ id: 'carte', label: 'carte' }], commands: commandes,
  command_schema: { play_until: { moment: Object.keys(moments()).join(' | ') + ' (centre = le centre ; sinon dessine la carte jusqu’à cet élément ; complete = toutes les branches, entourées une à une ; fin = la carte complète d’un coup)' },
    set_parameters: { lacunes: '[{id: C1..C7, statut: non_acquis|partiel}] (bilan de l’élève ; C1 quotient, C2 etat_initial, C3 equilibre, C4 constante et inverse, C5 mesures, C6 facteurs, C7 national)', acquis_ids: '[C1, ..] compétences acquises' } } };
const pont = protocole({ id: config.id, commandes, config,
  texte: 'Carte du chapitre « État d’équilibre d’un système chimique » : au centre « à l’équilibre : Qr,éq = K » (acide éthanoïque 1,0·10⁻² mol/L, pH 3,41, K = 1,6·10⁻⁵ à 25 °C), puis les branches : rappel (τ < 1, réaction limitée, équilibre dynamique) ; quotient de réaction Qr (produits en haut, réactifs en bas, eau solvant et solides absents, sans unité) ; état initial (Qr,i ; mélange : concentrations dans le volume total V_T) ; état d’équilibre (Qr,éq = 1,57·10⁻⁵) ; constante K (K = Qr,éq, ne dépend que de la température) ; réaction inverse (K’ = 1/K = 6,3·10⁴) ; mesurer K (pH ou σ → τ → K ; ⚠ mol/m³ → mol/L) ; τ dépend de K et de C (diluer : τ monte, K ne change pas) ; au national (Qr,i, Qr,éq, K ; pH, σ, courbe) ; la suite : chapitre suivant, réactions acide-base ; semestre 2 : piles (Qr,i comparé à K).',
  etat: () => ({ simulation_status: S.running ? 'running' : 'paused', ce_qui_se_voit: ceQuiSeVoit(), current_variant: 'carte', time_s: S.n, parameters: { centre: S.def != null, branches: S.n, complete: S.entoure != null, lacunes: S.lacunes ? S.lacunes.length : null }, moments: moments() }),
  progression: () => (S.entoure != null ? 1 : S.n / NOEUDS.length),
  executer: (cmd, p) => ({ start, reset: start, play_until: () => playUntil(p), set_parameters: () => setParameters(p) })[cmd]?.() });
bulle($('feedback'), 'Le professeur va dessiner la carte du chapitre.');
window.__carte = { S, scene, NOEUDS, CENTRE };   // pour les vérifications automatiques
</script>
