<script>
/*
 * Le quotient de réaction Qr (cours « État d’équilibre d’un système chimique », 2e Bac PC BIOF, novembre 2026).
 * Contrat : outils/cours/notes/cours/etat_equilibre_contrat_simulations.md § 2.
 * Vues (?vue=) : definition (défaut) | generale | eau | solides | sans_unite | initial | melange | au_cours | national | pile.
 * Une seule poignée (vue au_cours) : x, avancement relatif 0 → 1 (défaut 0), [H₃O⁺] = x × 3,89·10⁻⁴ mol/L.
 */
/* ── Formules chimiques à la craie : indices ₂ et charges ⁺ ⁻ ²⁻ rendus (sans modifier exposants.js ni le kit) ──────────
 * « MnO₄⁻ » devient « MnO_{4}^{−} » ; le découpage « _{…} » accepte tout caractère avant (« [I⁻]₀ »). */
(function () {
  const C = window.Tableau.Craie, P = C.prototype, texteAvant = P.texte, segAvant = C.segments;
  const SUP = { '⁺': '+', '⁻': '−', '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9' };
  const SUB = { '₀': '0', '₁': '1', '₂': '2', '₃': '3', '₄': '4', '₅': '5', '₆': '6', '₇': '7', '₈': '8', '₉': '9' };
  const chim = s => String(s).replace(/[⁺⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, g => '^{' + [...g].map(ch => SUP[ch]).join('') + '}')
    .replace(/[₀₁₂₃₄₅₆₇₈₉]+/g, g => '_{' + [...g].map(ch => SUB[ch]).join('') + '}');
  C.segments = function (s) {
    const out = [], re = /_\{([^}]+)\}/g; let i = 0, m;
    while ((m = re.exec(s))) { if (m.index > i) out.push(...segAvant(s.slice(i, m.index))); out.push({ t: m[1], sub: true }); i = re.lastIndex; }
    if (i < s.length) out.push(...segAvant(s.slice(i)));
    return out;
  };
  P.texte = function (s, x, y, o = {}) {
    const s2 = chim(s);
    // « [HCOOH]_{i} » : un indice après un crochet, sans exposant — le kit ne le verrait pas ; on passe par l’écriture à indices.
    if (/_\{/.test(s2) && !/\^/.test(s2) && !/[A-Za-zτθΔλωφ]_/.test(s2)) {
      let taille = o.taille ?? 18;
      this.ctx.font = `${o.gras ? '700 ' : ''}${taille}px ${window.Tableau.POLICE}`;
      this._verifierCadre(s2.replace(/[_^{}]/g, ''), x, y, taille, o.align);
      if (this.echelle && this.tailleMin) taille = Math.max(taille, this.tailleMin / this.echelle);
      return this._texteIndices(s2, x, y, o, taille);
    }
    return texteAvant.call(this, s2, x, y, o);
  };
  window.chim = chim;
})();

/* ── Moteur du déroulé (copie de transformations-deux-sens-tableau/ph.html, + M.finir) ─────────────────────────────────── */
const { fr, bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lisse = p => p * p * (3 - 2 * p);
const lerp = (a, b, f) => a + (b - a) * f;
const fx = (v, d = 2) => fr(v, d).replace(/(,\d*?)0+$/, '$1').replace(/,$/, '');
const ECRITURE = 2.5;
function Moteur(o) {
  const q = new URLSearchParams(location.search);
  const S = { vue: o.vues.includes(q.get('vue')) ? q.get('vue') : o.vues[0], t: 0, running: false, pause: false, fait: false,
    jusqua: null, motif: '', emis: 0, dit: '', mesure: false };
  const V = o.vitesse ?? 1.7, T0 = o.T0 ?? .8, HOLD = {};
  let TL = null;
  function construire() {
    let s = T0; const ev = [];
    for (const e of o.etapes(S.vue)) {
      const anim = e.anim || 0, d = { ...e, anim, debut: s, ecrit: s + (e.ecritDes ?? anim) };
      d.fin = Math.max(s + anim, d.ecrit + (HOLD[e.nom] ?? 1.5)) + .35;
      s = d.fin; ev.push(d);
    }
    const mom = {}; for (const e of ev) mom[e.nom] = e.fin; mom.fin = s + (o.queue ?? .6);
    TL = { ev, M: mom };
  }
  const ev = nom => TL.ev.find(e => e.nom === nom);
  const M = {
    S, ev, evs: () => TL.ev, Moments: () => TL.M,
    p(nom) { const e = ev(nom); if (!e) return 0; return e.anim > 0 ? clamp((S.t - e.debut) / e.anim, 0, 1) : (S.t >= e.debut - 1e-6 ? 1 : 0); },
    commence(nom) { const e = ev(nom); return !!e && S.t > e.debut + 1e-6; },
    vu(nom) { if (nom === 'fin') return S.t >= TL.M.fin - 1e-6; const e = ev(nom); return !!e && S.t >= e.fin - 1e-6; },
    etape(c, nom, fn) {
      const e = ev(nom); if (!e) return;
      const t = c.t, cur = c.cur, comp = c.complet, w0 = e.ecrit;
      c.t = S.t > 1e5 ? 1e9 : w0 + (S.t - w0) * V; c.cur = w0;
      try { fn(); } finally { if (S.mesure) HOLD[nom] = Math.max(HOLD[nom] || 0, (c.cur - w0) / V); c.t = t; c.cur = cur; if (!S.running) c.complet = comp; }
    },
    etat() { return S.running ? 'en cours' : S.fait ? 'fin' : S.pause ? 'arrêt sur image' : 'pas encore lancée'; },
  };
  const scene = window.OndesTableau.Scene($('canvas'), (c) => o.dessiner(c, M));
  const cadreBase = scene.cadre;
  scene.cadre = function (g) { const k = cadreBase.call(scene, g); if (Number.isFinite(k.t)) k.t *= ECRITURE; return k; };
  M.scene = scene; M.craie = scene.craie;
  function calculer() {
    construire();
    const t = S.t, r = S.running; S.t = 1e6; S.running = false; S.mesure = true;
    for (const k of Object.keys(HOLD)) delete HOLD[k];   // une étape dessinée en plusieurs morceaux garde le plus long (max ci-dessus)
    try { o.dessiner(scene.craie, M); } finally { S.t = t; S.running = r; S.mesure = false; }
    construire(); scene.sale = true;
  }
  const sansSouligne = s => String(s).replace(/([A-Za-zΔτθ])_\{?([A-Za-z0-9]+)\}?/g, (m, a, i) => a + (/^\d+$/.test(i) ? [...i].map(d => '₀₁₂₃₄₅₆₇₈₉'[d]).join('') : i));
  const dire = (texte, kind = '') => { texte = sansSouligne(texte); S.dit = texte; bulle($('feedback'), texte, kind); };
  const etiquette = () => { $('run').textContent = S.running ? 'Pause' : S.pause ? 'Reprendre' : S.fait ? 'Rejouer' : 'Lancer'; };
  let pont = null;
  const emettre = () => pont && pont.emettre();
  const noter = (a, d) => pont && pont.noter(a, d);
  scene.avancer = dt => {
    if (!S.running) return !!(o.anime && o.anime());
    const avant = S.t; S.t += dt;
    for (const e of TL.ev) if (avant < e.debut && S.t >= e.debut && e.bulle) dire(e.bulle());
    if (S.jusqua != null && S.t >= S.jusqua) {
      S.t = S.jusqua; S.jusqua = null; S.running = false;
      if (S.t >= TL.M.fin - 1e-6) { finir(); return true; }
      S.pause = true; etiquette(); dire('Arrêt sur image : ' + (S.motif || `t = ${fx(S.t, 1)} s`) + '.');
      noter('pause', { time_s: +S.t.toFixed(2) }); emettre(); return true;
    }
    if (S.t >= TL.M.fin) { S.t = TL.M.fin; finir(); return true; }
    if (performance.now() - S.emis > 500) { S.emis = performance.now(); emettre(); }
    return true;
  };
  function finir() { S.running = false; S.fait = true; S.pause = false; S.jusqua = null; etiquette(); dire(o.messageFin(M), 'good'); noter('measurement', o.params(M)); emettre(); }
  function start() { o.reprise && o.reprise(); S.t = 0; S.jusqua = null; S.motif = ''; S.running = true; S.pause = false; S.fait = false; etiquette(); dire(o.depart(M)); noter('start', o.params(M)); emettre(); }
  function pause() { if (!S.running) return; S.running = false; S.pause = true; S.jusqua = null; etiquette(); dire('Arrêt sur image.'); noter('pause', { time_s: +S.t.toFixed(2) }); emettre(); }
  function resume() { if (S.running) return; o.reprise && o.reprise(); if (!S.pause) return start(); S.running = true; S.pause = false; etiquette(); dire('Ça repart…'); noter('resume'); emettre(); }
  function setTime(p) {
    const t = +p.time_s; if (p.time_s === null || p.time_s === '' || !Number.isFinite(t)) return;
    o.reprise && o.reprise(); S.running = false; S.jusqua = null; S.t = clamp(t, 0, TL.M.fin); S.fait = S.t >= TL.M.fin - 1e-6; S.pause = !S.fait && S.t > 0;
    etiquette(); scene.sale = true; dire(`Arrêt sur image : t = ${fx(S.t, 1)} s.`); noter('set_time', { time_s: S.t }); emettre();
  }
  function playUntil(p) {
    const noms = o.etapes(S.vue).map(e => e.nom).concat('fin');
    const nom = noms.includes(p.moment) ? p.moment : null, cible = nom ? TL.M[nom] : +p.time_s;
    if (!Number.isFinite(cible) || (p.moment && !nom && (p.time_s == null || p.time_s === ''))) { dire(`Moment inconnu : ${p.moment}.`, 'bad'); emettre(); return; }
    o.reprise && o.reprise();
    if (S.fait || S.t >= cible - 1e-3) { S.t = 0; S.fait = false; }
    S.jusqua = clamp(cible, .01, TL.M.fin); S.motif = nom ? (o.motifs[nom] || nom) : ''; S.running = true; S.pause = false; etiquette(); dire('Observe…');
    noter('play_until', { moment: nom, time_s: S.jusqua }); emettre();
  }
  function setParameters(p) {
    p = p || {};
    const r = o.appliquer(p, M) || {};
    if (r.vue && o.vues.includes(r.vue) && r.vue !== S.vue) { S.vue = r.vue; r.change = true; r.vueChange = true; }
    if (r.change) { calculer(); if (r.vueChange) scene.reecrire(); }
    noter('set_parameters', o.params(M));
    if (r.apres) r.apres();
    else if (r.change && !r.garder) start();
    else { scene.sale = true; emettre(); }
  }
  Object.assign(M, { noter, calculer, dire, start, pause, resume, setTime, playUntil, setParameters, emettre, etiquette, finir });
  $('run').onclick = () => (S.running ? pause() : S.pause ? resume() : start());
  window.Tableau.explication(o.explications);
  const commandes = ['start', 'reset', 'pause', 'resume', 'set_time', 'set_parameters', 'play_until'];
  M.lancer = () => {
    calculer();
    const listeMoments = o.vues.map(v => `${o.vues.length > 1 ? v + ' : ' : ''}${o.etapes(v).map(e => e.nom).concat('fin').join(' | ')}`).join(' ; ');
    const config = { id: o.id, version: '1.0', title: o.titre, variants: o.vues.length > 1 ? o.vues.map(id => ({ id, label: o.titres[id] })) : [], commands: commandes,
      command_schema: { set_parameters: o.schema, set_time: { time_s: '0..fin (arrêt sur cet instant de la scène, en s ; voir moments)' },
        play_until: { moment: listeMoments, time_s: 'ou un instant en s' } } };
    pont = protocole({ id: o.id, commandes, config, texte: o.texte,
      etat: () => ({ simulation_status: S.running ? 'running' : S.fait ? 'finished' : S.pause ? 'paused' : 'idle',
        ce_qui_se_voit: o.voir(M) + (S.dit ? ` La bulle dit : « ${S.dit} »` : ''), current_variant: S.vue, time_s: +S.t.toFixed(2),
        parameters: o.params(M), moments: Object.fromEntries(Object.entries(TL.M).map(([k, v]) => [k, +v.toFixed(2)])) }),
      progression: () => (S.fait ? 1 : 0),
      executer: (cmd, p) => ({ start, reset: start, pause, resume, set_time: () => setTime(p), set_parameters: () => setParameters(p), play_until: () => playUntil(p) })[cmd]?.() });
    dire(o.depart(M));
    setTimeout(() => { if (!S.running && S.t === 0 && !S.pause && !S.fait) start(); }, 900);
  };
  return M;
}

/* ── Aides d’écriture : largeur, flèches dessinées (→, ⇌), expressions avec fractions dessinées (imbriquées) ─────────── */
function larg(c, s, taille = 17) {
  const T = window.Tableau, ctx = c.ctx; if (c.echelle && c.tailleMin) taille = Math.max(taille, c.tailleMin / c.echelle);
  return T.Craie.segments(window.chim(s)).reduce((w, g) => { ctx.font = `${(g.sub || g.sup) ? taille * .62 : taille}px ${T.POLICE}`; return w + ctx.measureText(g.t).width; }, 0);
}
const FL = 34;
function flecheSimple(c, x, y, w, col = 'blanc') { c.fleche(x + 2, y, x + w - 2, y, { couleur: col, largeur: 1.9, tete: 8 }); }
function flecheDouble(c, x, y, w, col = 'blanc') {
  c.trait([[x + 2, y - 3.5], [x + w - 2, y - 3.5], [x + w - 10, y - 10]], { couleur: col, largeur: 1.9 });
  c.trait([[x + w - 2, y + 3.5], [x + 2, y + 3.5], [x + 10, y + 10]], { couleur: col, largeur: 1.9, duree: .12 });
}
/*
 * Expression : 'texte' | { t, col, id, ph } | [ … ] (ligne) | { row: […], gap, col, id, ph } | { frac: [haut, bas], k, col, id, ph, phBarre }.
 * La barre de fraction est DESSINÉE (numérateur sur dénominateur). `o.ph` : n’écrire que les morceaux de ces étapes (la mise en page,
 * elle, ne dépend pas du temps : chaque étape écrit les siens à leur place). `o.rec[id]` : boîte de chaque morceau nommé.
 */
const norm = n => (typeof n === 'string' ? { t: n } : Array.isArray(n) ? { row: n } : n);
const SUPS = /[\^⁺⁻⁰¹²³⁴⁵⁶⁷⁸⁹]/;
function exMes(c, n, t) {
  n = norm(n);
  if (n.t != null) {
    if (n.t === '→' || n.t === '⇌') return { w: FL, up: t * .55, down: t * .2 };
    return { w: larg(c, n.t, t), up: t * (SUPS.test(n.t) ? 1.0 : .8), down: t * (/[₀-₉_]/.test(n.t) ? .3 : .22) };
  }
  if (n.row) {
    const g = n.gap ?? t * .32; let w = 0, up = 0, down = 0;
    n.row.forEach((m, i) => { const k = exMes(c, m, t); w += k.w + (i ? g : 0); up = Math.max(up, k.up); down = Math.max(down, k.down); });
    return { w, up, down };
  }
  const tt = t * (n.k ?? 1), a = exMes(c, n.frac[0], tt), b = exMes(c, n.frac[1], tt), m = t * .32, e = 5;
  return { w: Math.max(a.w, b.w) + 12, up: m + e + a.down + a.up, down: e + b.up + b.down - m };
}
function ex(c, n, x, y, t, o = {}, h = {}) {

  if (h.top !== false && o.align === 'center') x -= k.w / 2;
  const ok = p => !o.ph || o.ph.includes(p);
  if (n.id && o.rec) o.rec[n.id] = { x, y, w: k.w, up: k.up, down: k.down, t };
  const sous = { ph, col, top: false };
  if (n.t != null) {
    if (ok(ph)) {

      else if (n.t === '⇌') flecheDouble(c, x, y - t * .32, FL, col);

  }
  if (n.row) {
    const g = n.gap ?? t * .32; let px = x;

    return { ...k, x };
  }
  const tt = t * (n.k ?? 1), a = exMes(c, n.frac[0], tt), b = exMes(c, n.frac[1], tt), yb = y - t * .32, e = 5, xc = x + k.w / 2;

}
const boite = r => [r.x - 6, r.y - r.up - 5, r.w + 12, r.up + r.down + 10];
/** Encadré à la craie autour d’une boîte d’expression. */
function encadreR(c, r, col = 'jaune') { const [x, y, w, h] = boite(r); c.rect(x - 2, y - 2, w + 4, h + 4, { couleur: col, largeur: 2, arrondi: 8 }); }
/** Barre (orange) un morceau : trait en biais sur sa boîte. */
function barrer(c, r, col = 'orange') { c.ligne(r.x - 3, r.y + r.down - 1, r.x + r.w + 3, r.y - r.up + 3, { couleur: col, largeur: 2.6, duree: .12 }); }
/** Encadré autour d’un texte simple (ligne de base y, taille t). */
function encadre(c, x, y, w, t, col = 'jaune') { c.rect(x - 8, y - t - 4, w + 16, t + 14, { couleur: col, largeur: 2, arrondi: 8 }); }
/** Petit triangle « attention » à la craie (orange), le « ! » dedans. */
function attention(c, x, y, o = {}) {
  const col = o.couleur ?? 'orange', h = o.h ?? 18;
  c.trait([[x, y], [x + h * .58, y - h], [x + h * 1.16, y]], { couleur: col, largeur: 1.8, ferme: true });

}
/** Flèche courbe (Bézier quadratique) à la craie, tête à l’arrivée. */
function flecheCourbe(c, P0, P1, P2, col = 'jaune') {
  const B = u => [(1 - u) ** 2 * P0[0] + 2 * (1 - u) * u * P1[0] + u * u * P2[0], (1 - u) ** 2 * P0[1] + 2 * (1 - u) * u * P1[1] + u * u * P2[1]];
  c.courbe(B, 28, { couleur: col, largeur: 2 });
  const [x, y] = P2, [xa, ya] = B(.94), a = Math.atan2(y - ya, x - xa), T = 10;
  c.trait([[x - T * Math.cos(a - .45), y - T * Math.sin(a - .45)], [x, y], [x - T * Math.cos(a + .45), y - T * Math.sin(a + .45)]], { couleur: col, largeur: 2, duree: .1 });
}
/** « 1,57·10⁻⁵ » : trois chiffres significatifs, virgule, exposant. */
const SUPC = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
function sci(v, d = 2) {
  if (!v) return '0';
  let e = Math.floor(Math.log10(Math.abs(v))), m = v / 10 ** e;
  if (+m.toFixed(d) >= 10) { e += 1; m = v / 10 ** e; }
  return `${fr(m, d)}·10${String(e).split('').map(ch => SUPC[ch]).join('')}`;
}

/* ── Pièces peintes : bécher, flacon, lame de métal ─────────────────────────────────────────────────────────────────── */
const rgba = ([r, g, b, a], k = 1) => `rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},${Math.min(1, a * k).toFixed(3)})`;
const eclair = (c, k) => [lerp(c[0], 255, k), lerp(c[1], 255, k), lerp(c[2], 255, k), c[3]];
const sombre = (c, k) => [c[0] * (1 - k), c[1] * (1 - k), c[2] * (1 - k), Math.min(1, c[3] * (1 + k * .4))];
const EAU = [214, 230, 246, .16];      // solutions acides, sulfate de zinc, sulfate d’aluminium : incolores (comme en vrai)
const BLEU = [52, 120, 226, .62];      // solution de sulfate de cuivre : bleue
const Peint = {
  /** Bécher vu de face : verre, solution (dégradé, ménisque, reflet), graduations. niveau 0 → 1. */
  becher(ctx, B, niveau, col, a = 1) {
    const { x, y, w, h } = B, ep = 3, fond = y + h, yS = fond - ep - niveau * (h - 16);
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(x + w / 2 + 3, fond + 4, w / 2, 4.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(210,230,250,.06)'; ctx.beginPath(); ctx.roundRect(x, y, w, h, [2, 2, 10, 10]); ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(x + w * .3, y + 4, w * .12, h - 8);

      }

/* Vue au_cours : exemple F, Qr en fonction de [H₃O⁺] ; poignée x. */
const G = { x0: 96, y0: 300, w: 330, h: 220, hmax: 4.0e-4, qmax: 2.0e-5 };
const GX = h => G.x0 + h / G.hmax * G.w, GY = q => G.y0 - q / G.qmax * G.h;
const TA = { x: 466, y: 54, w1: 146, w2: 134, h: 30 };
function poignee(ctx, x, y) {
  ctx.save(); ctx.strokeStyle = '#c084fc'; ctx.fillStyle = 'rgba(192,132,252,.35)'; ctx.lineWidth = 2.4; ctx.globalAlpha = .98;
  ctx.beginPath(); ctx.arc(x, y, 8, 0, 7); ctx.fill(); ctx.stroke();
  ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(x - 14, y - 4); ctx.lineTo(x - 19, y); ctx.lineTo(x - 14, y + 4); ctx.moveTo(x + 14, y - 4); ctx.lineTo(x + 19, y); ctx.lineTo(x + 14, y + 4); ctx.stroke();
  ctx.restore();
}
VUE_FN.au_cours = (c, M) => {
  const xH = G.x0 + G.w + 20, yQ = G.y0 - G.h - 20;
  M.etape(c, 'axes', () => {
    c.axe(G.x0, G.y0, xH, G.y0, [1, 2, 3, 4].map(i => [i * G.w / 4 / (G.w + 20), `${i},0·10⁻⁴`]), { taille: 14 });
    c.axe(G.x0, G.y0, G.x0, yQ, [1, 2, 3, 4].map(i => [i * G.h / 4 / (G.h + 20), `${fr(i * .5, 1)}·10⁻⁵`]), { vertical: true, taille: 14 });
    c.texte('0', G.x0 - 6, G.y0 + 20, { taille: 14, align: 'center', couleur: 'faible' });
    c.texte('Q_r', G.x0 + 12, yQ + 8, { taille: 19, couleur: 'violet' });
    c.texte('[H₃O⁺] (mol/L)', G.x0 + G.w, G.y0 + 44, { taille: 16, align: 'right', couleur: 'faible' });
    // Tableau de valeurs (vide).
    const yf = TA.y + 6 * TA.h;
    c.rect(TA.x, TA.y, TA.w1 + TA.w2, 6 * TA.h, { arrondi: 4, largeur: 1.6 });
    c.ligne(TA.x, TA.y + TA.h, TA.x + TA.w1 + TA.w2, TA.y + TA.h, { largeur: 1.3, duree: .1 });
    c.ligne(TA.x + TA.w1, TA.y, TA.x + TA.w1, yf, { largeur: 1.3, duree: .1 });
    c.texte('[H₃O⁺] (mol/L)', TA.x + TA.w1 / 2, TA.y + 21, { taille: 16, align: 'center', couleur: 'cyan' });
    c.texte('Q_r', TA.x + TA.w1 + TA.w2 / 2, TA.y + 21, { taille: 17, align: 'center', couleur: 'violet' });
  });
  const ligne = i => {
    const y = TA.y + (i + 1) * TA.h + 21;
    c.texte(F_HT[i], TA.x + TA.w1 / 2, y, { taille: 16, align: 'center' });
    c.texte(F_QT[i], TA.x + TA.w1 + TA.w2 / 2, y, { taille: 16, align: 'center', couleur: 'violet' });
    c.point(GX(F_H[i]), GY(qrDe(F_H[i])), 4.5, i === 4 ? 'jaune' : 'blanc');
  };
  M.etape(c, 'depart', () => { ligne(0); c.texte('Q_{r,i} = 0', G.x0 + 28, G.y0 - 18, { taille: 17, couleur: 'violet' }); });
  M.etape(c, 'points', () => { ligne(1); ligne(2); ligne(3); });
  if (M.commence('arrivee')) {
    const p = lisse(M.p('arrivee'));
    c.direct(() => {
      const ctx = c.ctx; ctx.save(); ctx.strokeStyle = 'rgba(192,132,252,.75)'; ctx.lineWidth = 2; ctx.beginPath();
      for (let k = 0; k <= 60 * p; k++) { const h = H_EQ * k / 60; k ? ctx.lineTo(GX(h), GY(qrDe(h))) : ctx.moveTo(GX(h), GY(qrDe(h))); }
      ctx.stroke(); ctx.restore();
    });
  }
  M.etape(c, 'arrivee', () => {
    c.rect(TA.x + 4, TA.y + 5 * TA.h + 3, TA.w1 + TA.w2 - 8, TA.h - 6, { couleur: 'jaune', largeur: 2, arrondi: 6 });
    ligne(4);
    c.texte('Q_{r,éq}', GX(H_EQ) + 10, GY(qrDe(H_EQ)) + 22, { taille: 16, couleur: 'jaune' });
  });
  M.etape(c, 'palier', () => {
    const y = GY(qrDe(H_EQ));
    c.ligne(G.x0, y, G.x0 + G.w + 10, y, { couleur: 'jaune', largeur: 1.8, pointille: [6, 6] });
    c.texte('Q_{r,éq} = 1,57·10⁻⁵ : Q_r ne bouge plus', G.x0 + 10, y - 12, { taille: 17, couleur: 'jaune' });
  });
  M.etape(c, 'phrase', () => {
    c.texte('Q_r augmente de Q_{r,i} = 0 jusqu’à Q_{r,éq} = 1,57·10⁻⁵, puis ne bouge plus', 380, 394, { taille: 20, align: 'center', couleur: 'jaune' });
  });
  // Poignée x (point violet sur la courbe) et sa lecture, dès le départ.
  if (M.commence('depart') || DRAG != null) {
    const x = xVu(), h = hDe(x), q = qrDe(h), px = GX(h), py = GY(q);
    M.geo.poignee = [px, py];
    c.direct(() => poignee(c.ctx, px, py));
    c.direct(() => {
      const ctx = c.ctx, T = window.Tableau; ctx.save(); ctx.font = `15px ${T.POLICE}`; ctx.fillStyle = T.COULEURS.violet; ctx.globalAlpha = .95;
      ctx.fillText(`poignée : x = ${fr(x, 2)}`, TA.x, 270); ctx.restore();
    });
    c.texte(`[H₃O⁺] = ${h ? sci(h) : '0'} mol/L`, TA.x, 296, { taille: 16, couleur: 'violet', duree: .05 });
    c.texte(`Q_r = ${q ? sci(q) : '0'}`, TA.x, 322, { taille: 16, couleur: 'violet', duree: .05 });
  }
  M.geo.poignee ||= [G.x0, G.y0];
};

/* ── Repères (déclarés à chaque image ; le libellé dit à quel moment l’élément apparaît) ───────────── */
function reperes(c, M) {
  const v = M.S.vue, quand = nom => (M.vu(nom) ? '' : ` (au moment « ${nom} »)`), R = M.rec;
  const D = (id, x, y, w, h, l) => c.repere(id, x, y, w, h, l);
  const DR = (id, r, l) => { if (r) { const [x, y, w, h] = boite(r); D(id, x, y, w, h, l); } };
  if (v === 'definition') {
    DR('equation', R.equation, `l’équation « CH₃COOH + H₂O ⇌ CH₃COO⁻ + H₃O⁺ »${quand('equation')}`);
    DR('numerateur', R.num, `le numérateur « [CH₃COO⁻]·[H₃O⁺] » : les produits${quand('produits')}`);
    DR('denominateur', R.den, `le dénominateur « [CH₃COOH] » : le réactif${quand('reactifs')}`);
    DR('quotient', R.quotient, `« Qr = [CH₃COO⁻]·[H₃O⁺] / [CH₃COOH] »${quand('quotient')}`);
    D('phrase', 60, 358, 640, 58, `« quotient de réaction : produits en haut, réactifs en bas »${quand('phrase')}`);
  } else if (v === 'generale') {
    DR('forme', R.forme, `« aA + bB ⇌ cC + dD »${quand('forme')}`);
    DR('formule', R.formule, `« Qr = [C]^c·[D]^d / ([A]^a·[B]^b) »${quand('forme')}`);
    D('exposants', 330, 172, 400, 36, `« les coefficients deviennent des exposants »${quand('exposants')}`);
    DR('exemple', R.exemple, `« 2I⁻ + S₂O₈²⁻ ⇌ I₂ + 2SO₄²⁻ »${quand('exemple')}`);
    DR('qr_exemple', R.qr_exemple, `« Qr = [I₂]·[SO₄²⁻]² / ([I⁻]²·[S₂O₈²⁻]) »${quand('qr_exemple')}`);
  } else if (v === 'eau') {
    DR('equation', R.equation, `l’équation « CH₃COOH + H₂O ⇌ CH₃COO⁻ + H₃O⁺ »${quand('equation')}`);
    if (R.e_eau) { const r = R.e_eau; D('eau', r.x - 16, r.y - 46, r.w + 32, 104, `la molécule d’eau H₂O, entourée : le solvant${quand('eau')}`); }
    DR('quotient', M.geo.quotient, `le quotient : [H₂O] barré, puis « Qr = [CH₃COO⁻]·[H₃O⁺] / [CH₃COOH] »${quand('barree')}`);
    D('phrase', 22, 306, 560, 36, `« l’eau est le solvant : elle n’apparaît pas dans Qr »${quand('phrase')}`);
    D('piege', 22, 354, 470, 38, `⚠ « pas de concentration pour l’eau solvant »${quand('piege')}`);
  } else if (v === 'solides') {
    D('becher', BS.x - 8, BS.y - 8, BS.w + 16, BS.h + 16, `le bécher : solution bleue de Cu²⁺${quand('becher')}`);
    D('lame', LZ.x - 4, LZ.y - 4, LZ.w + 8, 60, `la lame de zinc Zn(s), gris bleuté${quand('becher')}`);
    DR('equation', R.equation, `« Cu²⁺ + Zn(s) ⇌ Cu(s) + Zn²⁺ »${quand('equation')}`);
    if (R.zn && R.cu) { const a = R.zn, b = R.cu; D('solides', a.x - 6, a.y - a.up - 6, b.x + b.w - a.x + 12, a.up + 46, `Zn(s) et Cu(s) barrés : des solides${quand('solides')}`); }
    DR('quotient', R.quotient, `« Qr = [Zn²⁺] / [Cu²⁺] »${quand('quotient')}`);
    D('phrase', 242, 310, 470, 66, `« les solides n’apparaissent pas dans Qr »${quand('phrase')}`);
  } else if (v === 'sans_unite') {
    D('donnees', 22, 56, 440, 98, `les données : [H₃O⁺] = [CH₃COO⁻] = 2,0·10⁻⁴ mol/L ; [CH₃COOH] = 9,8·10⁻³ mol/L${quand('donnees')}`);
    if (R.remplacer && R.resultat) { const r = R.remplacer; D('remplacer', r.x - 6, r.y - r.up - 5, R.resultat.x - r.x, r.up + r.down + 10, `« Qr = (2,0·10⁻⁴ × 2,0·10⁻⁴) / (9,8·10⁻³) »${quand('remplacer')}`); }
    DR('resultat', R.resultat, `« = 4,08·10⁻⁶ »${quand('resultat')}`);
    D('unite', 22, 306, 470, 84, `« concentrations en mol/L ; Qr sans unité »${quand('unite')}`);
  } else if (v === 'initial') {
    D('becher', BI.x - 8, BI.y - 8, BI.w + 16, BI.h + 16, `le bécher : l’acide éthanoïque vient d’être versé dans l’eau${quand('versement')}`);
    DR('concentrations', R.conc, `« [CH₃COO⁻]ᵢ = [H₃O⁺]ᵢ = 0 »${quand('concentrations')}`);
    DR('qr_i', R.qr_i, `« Qr,i = … = 0 »${quand('qr_i')}`);
    D('phrase', 266, 356, 470, 40, `« Qr,i : quotient de réaction dans l’état initial »${quand('phrase')}`);
  } else if (v === 'melange') {
    D('flacons', 14, 40, 290, 160, `les quatre flacons : HCOOH 100 mL, CH₃COO⁻ 100 mL, CH₃COOH 50 mL, HCOO⁻ 50 mL (0,10 mol/L)${quand('flacons')}`);
    D('becher', BM.x - 8, BM.y - 8, BM.w + 16, BM.h + 16, `le grand bécher : le mélange${quand('melange')}`);
    DR('volume_total', R.vt, `« V_T = 300 mL »${quand('melange')}`);
    DR('concentrations', R.conc, `« [X]ᵢ = n/V_T »${quand('concentrations')}`);
    DR('quotient', R.quotient, `« Qr,i = [HCOO⁻]ᵢ·[CH₃COOH]ᵢ / ([HCOOH]ᵢ·[CH₃COO⁻]ᵢ) »${quand('quotient')}`);
    DR('resultat', R.resultat, `« = (5,0·10⁻³ × 5,0·10⁻³) / (1,0·10⁻² × 1,0·10⁻²) = 0,25 »${quand('resultat')}`);
  } else if (v === 'au_cours') {
    D('axe_h3o', G.x0, G.y0 - 10, G.w + 24, 56, `l’axe horizontal : [H₃O⁺] de 0 à 4,0·10⁻⁴ mol/L${quand('axes')}`);
    D('axe_qr', 14, G.y0 - G.h - 30, G.x0 - 4, G.h + 40, `l’axe vertical : Qr de 0 à 2,0·10⁻⁵${quand('axes')}`);
    const [px, py] = M.geo.poignee; D('poignee_x', px - 20, py - 14, 40, 28, `la poignée violette : x = ${fr(xVu(), 2)} (glisser de 0 à 1)${quand('depart')}`);
    D('tableau', TA.x, TA.y, TA.w1 + TA.w2, 6 * TA.h, `le tableau des valeurs [H₃O⁺] et Qr${quand('points')}`);
    D('point_eq', GX(H_EQ) - 14, GY(qrDe(H_EQ)) - 14, 28, 28, `le dernier point : Qr,éq = 1,57·10⁻⁵${quand('arrivee')}`);
    D('phrase', 30, 370, 700, 34, `« Qr augmente de Qr,i = 0 jusqu’à Qr,éq = 1,57·10⁻⁵, puis ne bouge plus »${quand('phrase')}`);
  } else if (v === 'national') {
    D('donnees', 14, 40, 340, 176, `les données : quatre flacons de 100 mL à 0,1 mol/L${quand('donnees')}`);

    D('renvoi', 420, 290, 300, 50, `« la suite (piles) : au semestre 2 »${quand('renvoi')}`);

}
