<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Les rencontres des entités — au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="tlr.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Deux loupes à la craie sur deux béchers du même mélange : des ions iodure (billes violettes) et des molécules d’eau oxygénée (deux O rouges, deux H blancs) qui bougent ; chaque rencontre fait une étoile jaune ; sous chaque loupe, le nombre de rencontres par seconde"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start pause resume play_until">Agiter</button>
    <span id="reglage" data-professor-control="set_parameters"></span>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="commun.js"></script>
<script src="exposants.js"></script>
<script>
/*
 * Les rencontres des entités, à la loupe (14 novembre 2026, règle 28 du professeur : changer la température ou la
 * concentration et voir le changement). Deux loupes côte à côte, le même mélange H₂O₂ + I⁻ acidifié ; celle de gauche est la
 * référence (20 °C, [I⁻]₀ = 0,1 mol/L), celle de droite se règle avec UN curseur.
 * Ions I⁻ en billes violettes (iode, CPK), molécules H₂O₂ en O rouges et H blancs ; une rencontre I⁻–H₂O₂ fait une étoile jaune ; sous chaque loupe s'écrit le nombre
 * de rencontres par seconde (moyenne depuis le dernier réglage) : c'est le RÉSULTAT de ce qu'on voit.
 * Modèle POUR L'ŒIL (jamais écrit) : vitesse ∝ 1 + (θ − 20)/16 (comme facteurs.html) ; nombre d'ions I⁻ = 100 × [I⁻]₀, 6 molécules H₂O₂.
 * Vues (?vue=) :
 *  - temperature (défaut) : curseur θ à droite (20 → 60 °C, 40 °C au départ). Moment : agitation. Diapo tl_f3_agitation.
 *  - concentration : curseur [I⁻]₀ à droite (0,05 → 0,3 mol/L, 0,2 au départ). Moment : rencontres. Diapo tl_f6_rencontres.
 */
const { fr, bulle, protocole, graine } = window.Tableau;
const $ = id => document.getElementById(id);
const fx = (v, d = 2) => fr(v, d).replace(/(,\d*?)0+$/, '$1').replace(/,$/, '');
const VUE = new URLSearchParams(location.search).get('vue') === 'concentration' ? 'concentration' : 'temperature';
const BOX = [{ x: 40, y: 92, w: 300, h: 236 }, { x: 420, y: 92, w: 300, h: 236 }];
const RI = 9, RH = 11, NH = 6;                   // rayons ; molécules H₂O₂ ; fenêtre de comptage (s)
const P = VUE === 'temperature' ? { theta: 40, c: 0.1 } : { theta: 20, c: 0.2 };
const REF = { theta: 20, c: 0.1 };
const vitesse = p => 70 * (1 + (p.theta - 20) / 16);    // px/s, pour l'œil
const nI = p => Math.round(100 * p.c);
const S = { t: 0, running: false, pause: false, lance: false, motif: '', emis: 0, loupes: [] };

function peupler(k, p) {
  const b = BOX[k], r = graine(7 + k * 13 + Math.round(p.c * 100)), v = vitesse(p), parts = [];
  const ajoute = (type, n) => { for (let i = 0; i < n; i++) { const a = r() * 2 * Math.PI; parts.push({ type, x: b.x + 20 + r() * (b.w - 40), y: b.y + 20 + r() * (b.h - 40), vx: v * Math.cos(a), vy: v * Math.sin(a) }); } };
  ajoute('I', nI(p)); ajoute('H', NH);
  return { p: { ...p }, parts, etoiles: [], rencontres: [], proches: new Set(), depuis: S.t };
}
function repeupler() { S.t = 0; S.loupes = [peupler(0, REF), peupler(1, P)]; }
repeupler();
function avancerLoupe(L, k, dt) {
  const b = BOX[k], v = vitesse(L.p);
  for (const q of L.parts) {
    const n = Math.hypot(q.vx, q.vy) || 1; q.vx *= v / n; q.vy *= v / n;   // la vitesse suit la température
    q.x += q.vx * dt; q.y += q.vy * dt;
    const r = q.type === 'I' ? RI : RH;
    if (q.x < b.x + r) { q.x = b.x + r; q.vx = Math.abs(q.vx); } if (q.x > b.x + b.w - r) { q.x = b.x + b.w - r; q.vx = -Math.abs(q.vx); }
    if (q.y < b.y + r) { q.y = b.y + r; q.vy = Math.abs(q.vy); } if (q.y > b.y + b.h - r) { q.y = b.y + b.h - r; q.vy = -Math.abs(q.vy); }
  }
  // Une rencontre : un ion I⁻ touche une molécule H₂O₂ (comptée une fois tant qu'ils restent l'un contre l'autre).
  const proches = new Set();
  L.parts.forEach((a, i) => { if (a.type !== 'I') return; L.parts.forEach((h, j) => {
    if (h.type !== 'H') return;
    if (Math.hypot(a.x - h.x, a.y - h.y) < RI + RH + 2) { const cle = i + '-' + j; proches.add(cle); if (!L.proches.has(cle)) { L.rencontres.push(S.t); L.etoiles.push({ x: (a.x + h.x) / 2, y: (a.y + h.y) / 2, t: S.t }); } }
  }); });
  L.proches = proches;
  L.etoiles = L.etoiles.filter(e => e.t > S.t - 0.5);
}
const parSeconde = L => L.rencontres.length / Math.max(S.t - L.depuis, 0.5);   // moyenne depuis le dernier réglage
const nomLoupe = k => VUE === 'temperature' ? `${S.loupes[k].p.theta} °C` : `${fx(S.loupes[k].p.c)} mol/L`;
/* Peints (règle 32) : les entités en billes ombrées aux couleurs conventionnelles (CPK) — l'ion iodure violet (iode) marqué « − »,
 * la molécule H₂O₂ : deux atomes d'oxygène rouges liés, chacun portant un hydrogène blanc ; la fenêtre de la loupe : la solution
 * aqueuse vue de près (légèrement teintée selon la température) dans une monture chromée. */
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
function sphere(ctx, x, y, r, c) {
  const g = ctx.createRadialGradient(x - r * .38, y - r * .4, r * .12, x, y, r);
  g.addColorStop(0, rgba(c.map(v => Math.round(v + (255 - v) * .75)), 1)); g.addColorStop(.45, rgba(c, 1)); g.addColorStop(1, rgba(c.map(v => Math.round(v * .45)), 1));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}
function ion(ctx, x, y, r) {
  sphere(ctx, x, y, r, [124, 58, 237]);
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(x - r * .4, y + .5); ctx.lineTo(x + r * .4, y + .5); ctx.stroke(); ctx.restore();
}
function h2o2(ctx, x, y, a, k) {
  const c = Math.cos(a), s = Math.sin(a), d = 4.2 * k, ro = 5.2 * k, rh = 3.2 * k;
  // H–O–O–H vu de biais : un H au-dessus d'un O, l'autre en dessous de l'autre O.
  sphere(ctx, x - d * c + 5 * k * s, y - d * s - 5 * k * c, rh, [236, 236, 236]);
  sphere(ctx, x - d * c, y - d * s, ro, [220, 38, 38]);
  sphere(ctx, x + d * c, y + d * s, ro, [220, 38, 38]);
  sphere(ctx, x + d * c - 5 * k * s, y + d * s + 5 * k * c, rh, [236, 236, 236]);
}
function fenetre(ctx, b, chaud) {
  ctx.save();
  const g = ctx.createLinearGradient(b.x, b.y, b.x + b.w, b.y + b.h);
  g.addColorStop(0, chaud ? 'rgba(120,80,60,.22)' : 'rgba(80,130,170,.22)'); g.addColorStop(1, chaud ? 'rgba(90,50,40,.3)' : 'rgba(50,90,130,.3)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 14); ctx.fill();
  const m = ctx.createLinearGradient(b.x, b.y, b.x + b.w, b.y + b.h);
  m.addColorStop(0, '#e9eef2'); m.addColorStop(.35, '#89939b'); m.addColorStop(.65, '#d2d8dd'); m.addColorStop(1, '#4f5860');
  ctx.strokeStyle = m; ctx.lineWidth = 5; ctx.beginPath(); ctx.roundRect(b.x - 4, b.y - 4, b.w + 8, b.h + 8, 17); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(b.x + 26, b.y + 18); ctx.lineTo(b.x + 90, b.y + 18); ctx.stroke();
  ctx.restore();
}
const repereLoupe = k => VUE === 'temperature' ? (k === 0 ? 'becher_froid' : 'becher_chaud') : (k === 0 ? 'becher_dilue' : 'becher_concentre');

/* Tableau large (15 novembre 2026) : le cadre prend la largeur du tableau (scene.L de 760 à 1596) ; les deux loupes
 * s’élargissent (les entités gardent leur place relative dans la fenêtre). */
let LL = 760, LY = 92, LH = 236;
function placerLoupes(L, y = 92, h = 236) {
  if (L === LL && y === LY && h === LH) return;
  const w = (L - 160) / 2, avant = BOX.map(b => ({ ...b }));
  BOX[0].w = w; BOX[1].x = 120 + w; BOX[1].w = w;
  for (const b of BOX) { b.y = y; b.h = h; }
  S.loupes.forEach((Lp, k) => { for (const q of Lp.parts) { q.x = BOX[k].x + (q.x - avant[k].x) / avant[k].w * BOX[k].w; q.y = BOX[k].y + (q.y - avant[k].y) / avant[k].h * BOX[k].h; } });
  LL = L; LY = y; LH = h;
}
/* Deuxième passe (« agrandir les figures elles-mêmes ») : sur un tableau large, tailles en px À L'ÉCRAN (u(px) = px / scene.s),
 * titre interne retiré ; les deux loupes prennent toute la hauteur : leur titre au-dessus, une ligne sous chacune (entités à gauche,
 * rencontres par seconde à droite), en bas la légende (à gauche) et la remarque (à droite). */
function dessiner(c) {
  scene.cadre(41);
  const L = Math.max(760, scene.L || 760), large = L >= 1000, u = px => px / (c.echelle || 1);
  if (large) {
    const haut = u(24) + u(12), bas = 420 - u(10) - u(34) - u(26);
    placerLoupes(L, Math.round(haut), Math.round(bas - haut));
  } else placerLoupes(L);
  const XC = LL / 2;
  const T = large ? { titre: u(22), leg: u(18), sous: u(18), rythme: u(20), note: u(18), ralenti: u(17) } : { titre: 17, leg: 15, sous: 14, rythme: 16, note: 14, ralenti: 13 };
  const yLeg = large ? 420 - u(10) : 57, yNote = large ? 420 - u(10) : 410;
  if (!large) c.texte('À la loupe : le même mélange H₂O₂ + I⁻, deux béchers', XC, 26, { couleur: 'blanc', taille: 17, align: 'center' });
  // La légende : en haut au centre (cadre 760), en bas à gauche (tableau large).
  const xl = large ? BOX[0].x + u(10) : XC - 136, m = s => { c.ctx.font = `${T.leg}px ${window.Tableau.POLICE}`; return c.ctx.measureText(s).width; };
  const lx = large ? [xl + u(14), xl + u(14) + m('ion I⁻') + u(40), xl + u(14) + m('ion I⁻') + m('molécule H₂O₂') + u(70)] : [XC - 118, XC + 6, XC + 140];
  c.direct(() => { ion(c.ctx, lx[0] - (large ? u(14) : 12), yLeg - T.leg * .33, large ? u(8) : 6.5); h2o2(c.ctx, lx[1] - (large ? u(16) : 16), yLeg - T.leg * .33, 0.4, large ? u(1) : 0.8); });
  c.texte('ion I⁻', lx[0], yLeg, { couleur: 'violet', taille: T.leg });
  c.texte('molécule H₂O₂', lx[1], yLeg, { couleur: 'rouge', taille: T.leg });
  c.texte('✦ rencontre', lx[2], yLeg, { couleur: 'jaune', taille: T.leg });
  c.direct(() => {
    S.loupes.forEach((Lp, k) => {
      const b = BOX[k], chaud = VUE === 'temperature' && Lp.p.theta > 25;
      fenetre(c.ctx, b, chaud);
      c.rect(b.x, b.y, b.w, b.h, { arrondi: 14, couleur: chaud ? 'orange' : VUE === 'temperature' ? 'cyan' : 'faible', largeur: 2.2, tremble: 0 });
      Lp.parts.forEach((q, i) => (q.type === 'I' ? ion(c.ctx, q.x, q.y, RI - 1.5) : h2o2(c.ctx, q.x, q.y, i * 1.7 + S.t * 1.3 * (i % 2 ? 1 : -1), 1)));
      for (const e of Lp.etoiles) { const a = 1 - (S.t - e.t) / 0.5; c.texte('✦', e.x, e.y + 7, { couleur: 'jaune', taille: (large ? u(18) : 14) + 10 * a, align: 'center', alpha: Math.max(0.2, a) }); }
      const titre = VUE === 'temperature' ? `${Lp.p.theta} °C` : `[I⁻]₀ = ${fx(Lp.p.c)} mol/L`;
      c.texte(titre, b.x + b.w / 2, b.y - (large ? u(10) : 8), { couleur: chaud ? 'orange' : VUE === 'temperature' ? 'cyan' : 'blanc', taille: T.titre, align: 'center' });
      c.repere(repereLoupe(k), b.x - 6, b.y - (large ? u(34) : 28), b.w + 12, b.h + (large ? u(34) : 34), (k === 0 ? 'la loupe de gauche : ' : 'la loupe de droite : ') + titre);
      const ys = b.y + b.h + (large ? u(26) : 22);
      c.texte(`${nI(Lp.p)} I⁻ et ${NH} H₂O₂`, large ? b.x + u(6) : b.x + b.w / 2, ys, { couleur: 'faible', taille: T.sous, align: large ? 'left' : 'center' });
      if (S.t - Lp.depuis >= 2) {
        const yr = large ? ys : b.y + b.h + 46;
        c.texte(`${fx(parSeconde(Lp), 1)} rencontres par seconde`, large ? b.x + b.w - u(6) : b.x + b.w / 2, yr, { couleur: 'jaune', taille: T.rythme, align: large ? 'right' : 'center' });
        c.repere('compteur_' + repereLoupe(k).replace('becher_', ''), large ? b.x + b.w / 2 : b.x, yr - (large ? u(22) : 18), large ? b.w / 2 : b.w, large ? u(28) : 26, 'le nombre de rencontres par seconde, ' + titre);
      }
    });
    c.repere('loupe', BOX[0].x, BOX[0].y - 30, BOX[1].x + BOX[1].w - BOX[0].x, BOX[0].h + 34, 'les deux loupes : les entités qui bougent et se rencontrent');
    const xn = large ? BOX[1].x + BOX[1].w : XC, an = large ? 'right' : 'center';
    if (VUE === 'temperature') {
      const note = 'même nombre d’entités des deux côtés : même état final';
      c.texte(note, xn, yNote, { couleur: 'faible', taille: T.note, align: an });
      if (large) { c.ctx.font = `${T.note}px ${window.Tableau.POLICE}`; const w = c.ctx.measureText(note).width; c.repere('nombre', xn - w - 6, yNote - T.note - 4, w + 12, T.note + 10, 'les mêmes entités, en même nombre'); }
      else c.repere('nombre', XC - 220, 394, 440, 22, 'les mêmes entités, en même nombre');
    } else c.texte('même température (20 °C) des deux côtés', xn, yNote, { couleur: 'faible', taille: T.note, align: an });
    if (S.running || S.pause) c.texte(`(ralenti)`, LL - 20, large ? u(22) : 30, { couleur: 'faible', taille: T.ralenti, align: 'right' });
  });
  return c.fin();
}

const canvas = $('canvas');
const scene = window.OndesTableau.Scene(canvas, dessiner, { large: true });
scene.avancer = dt => {
  if (!S.running) return false;
  S.t += dt; S.loupes.forEach((L, k) => avancerLoupe(L, k, dt));
  if (performance.now() - S.emis > 700) { S.emis = performance.now(); pont.emettre(); }
  return true;
};
function start(motif) {
  S.running = true; S.pause = false; S.lance = true; $('run').textContent = 'Pause';
  bulle($('feedback'), motif || 'Les entités s’agitent… compte les étoiles : ce sont les rencontres.'); pont.noter('start', { ...P }); pont.emettre();
}
function pause() { if (!S.running) return; S.running = false; S.pause = true; $('run').textContent = 'Reprendre'; bulle($('feedback'), 'Arrêt sur image.'); pont.noter('pause'); pont.emettre(); }
function resume() { if (S.running || !S.pause) return start(); S.running = true; S.pause = false; $('run').textContent = 'Pause'; pont.noter('resume'); pont.emettre(); }
function reset() { S.running = false; S.pause = false; S.lance = false; repeupler(); scene.sale = true; $('run').textContent = 'Agiter'; bulle($('feedback'), accueil); pont.emettre(); }
const MOMENT = VUE === 'temperature' ? 'agitation' : 'rencontres';
function moments() { return { [MOMENT]: 0 }; }
function playUntil(q) {
  if (q.moment !== MOMENT) return;
  if (!S.running) start(VUE === 'temperature' ? 'Au chaud, les entités s’agitent plus : elles se rencontrent plus souvent…' : 'Plus d’ions dans le même volume : plus de rencontres…');
  S.motif = MOMENT; pont.noter('play_until', { moment: q.moment }); pont.emettre();
}
function ceQuiSeVoit() {
  const m = S.loupes.map((L, k) => `Loupe ${k === 0 ? 'de gauche' : 'de droite'} (${VUE === 'temperature' ? L.p.theta + ' °C' : '[I⁻]₀ = ' + fx(L.p.c) + ' mol/L'}) : ${nI(L.p)} ions I⁻ (billes violettes) et ${NH} molécules H₂O₂ (deux O rouges, deux H blancs)` + (S.t - L.depuis >= 2 ? `, ${fx(parSeconde(L), 1)} rencontres par seconde.` : '.'));
  if (!S.lance) m.push('Les entités sont encore immobiles : on n’a pas agité.');
  else m.push(VUE === 'temperature' ? 'À droite, les entités bougent plus vite et se rencontrent plus souvent.' : 'À droite, plus d’ions dans le même volume : plus de rencontres.');
  return m.join(' ');
}
function setParameters(p) {
  const L = S.loupes[1];
  if (VUE === 'temperature' && Number.isFinite(+p.theta_c)) { P.theta = Math.min(60, Math.max(20, Math.round(+p.theta_c / 5) * 5)); L.p.theta = P.theta; regl.maj(P.theta); }
  else if (VUE === 'concentration' && Number.isFinite(+p.c_iodure)) { P.c = Math.min(0.3, Math.max(0.05, Math.round(+p.c_iodure * 20) / 20)); regl.maj(P.c); S.loupes[1] = peupler(1, P); }
  else return;
  L.rencontres = []; S.loupes[1].rencontres = []; S.loupes[1].depuis = S.t;   // la loupe de droite recompte depuis le changement
  pont.noter('set_parameters', { ...P });
  bulle($('feedback'), VUE === 'temperature' ? `À droite : ${P.theta} °C. Regarde l’agitation et compte les rencontres.` : `À droite : [I⁻]₀ = ${fx(P.c)} mol/L, ${nI(P)} ions. Compte les rencontres.`);
  if (!S.running) start(); else pont.emettre();
}
const regl = VUE === 'temperature'
  ? window.Tableau.curseur({ id: 'theta', label: 'À droite : θ =', min: 20, max: 60, step: 5, valeur: P.theta, unite: '°C', commande: 'set_parameters', onchange: v => setParameters({ theta_c: v }) })
  : window.Tableau.curseur({ id: 'c', label: 'À droite : [I⁻]₀ =', min: 0.05, max: 0.3, step: 0.05, valeur: P.c, unite: 'mol/L', commande: 'set_parameters', onchange: v => setParameters({ c_iodure: v }) });
$('reglage').replaceChildren(regl);
$('run').onclick = () => (S.running ? pause() : S.pause ? resume() : start());
const accueil = VUE === 'temperature' ? 'Agite, puis compare les rencontres à 20 °C et au chaud.' : 'Agite, puis compare les rencontres dans les deux béchers.';
window.Tableau.explication({ [VUE]: VUE === 'temperature' ? [
  { repere: 'becher_froid', texte: 'Au froid, les entités bougent lentement : peu de rencontres.' },
  { repere: 'becher_chaud', texte: 'Au chaud, elles s’agitent plus et se rencontrent plus souvent.' },
  { repere: 'nombre', texte: 'Ce sont les mêmes entités, en même nombre : même état final.' },
] : [
  { repere: 'becher_concentre', texte: 'Plus d’ions dans le même volume : ils se rencontrent plus souvent.' },
  { repere: 'becher_dilue', texte: 'Moins d’ions : moins de rencontres, la transformation est plus lente.' },
] });
const commandes = ['start', 'pause', 'resume', 'reset', 'set_parameters', 'play_until'];
const config = { id: 'tlr_tableau_rencontres', version: '1.0', title: 'Les rencontres des entités', variants: [{ id: VUE, label: VUE }], commands: commandes,
  command_schema: { set_parameters: VUE === 'temperature' ? { theta_c: '20..60 (pas de 5 °C), bécher de droite' } : { c_iodure: '0,05..0,3 mol/L (pas de 0,05), bécher de droite' }, play_until: { moment: MOMENT + ' (lance l’agitation)' } } };
const pont = protocole({ id: config.id, commandes, config,
  texte: VUE === 'temperature'
    ? 'Deux loupes sur le même mélange H₂O₂ + I⁻ : à gauche 20 °C, à droite la température se règle (20 à 60 °C, 40 °C au départ). Au chaud les entités s’agitent plus et se rencontrent plus souvent : le nombre de rencontres par seconde s’écrit sous chaque loupe. Mêmes entités en même nombre : même état final.'
    : 'Deux loupes sur le même mélange à 20 °C : à gauche [I⁻]₀ = 0,1 mol/L (10 ions I⁻), à droite [I⁻]₀ se règle (0,05 à 0,3 mol/L, 0,2 au départ). Plus d’entités dans le même volume : plus de rencontres par seconde (écrites sous chaque loupe). Diluer diminue les rencontres.',
  etat: () => ({ simulation_status: S.running ? 'running' : S.pause ? 'paused' : 'idle', ce_qui_se_voit: ceQuiSeVoit(), moments: moments(), vue: VUE,
    parameters: VUE === 'temperature' ? { theta_c: P.theta } : { c_iodure: P.c }, rencontres_par_seconde: S.loupes.map(L => +parSeconde(L).toFixed(1)) }),
  progression: () => (S.t >= 4 ? 1 : 0),
  executer: (cmd, p) => ({ start: () => start(), pause, resume, reset, set_parameters: () => setParameters(p), play_until: () => playUntil(p) })[cmd]?.() });
