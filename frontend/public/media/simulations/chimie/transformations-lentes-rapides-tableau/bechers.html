<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Réactions rapides, réactions lentes — au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="tlr.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Béchers peints : permanganate violet décoloré aussitôt par les ions fer II et lentement par l’acide oxalique ; eau oxygénée et iodure qui jaunit puis brunit ; thiosulfate et acide qui se trouble sur une croix noire ; flèche du temps instantanée, lente, très lente avec un portail rouillé"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start reset pause resume play_until set_time">Lancer</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="commun.js"></script>
<script src="exposants.js"></script>
<script>
/*
 * Réactions rapides, réactions lentes : les béchers (cours « Transformations lentes et transformations rapides », 2e Bac PC BIOF, novembre 2026).
 * Contrat : outils/cours/notes/cours/transformations_lentes_rapides_contrat_simulations.md, § 4.
 * Vues (?vue=) : comparer (défaut) | lente | soufre | echelle. Toutes à 20 °C, en temps accéléré (chronomètre à la craie).
 *  - comparer : deux béchers de permanganate acidifié ; ions fer II à gauche (décoloré aussitôt), acide oxalique à droite (≈ 7 min).
 *  - lente : H₂O₂ + 2I⁻ + 2H⁺ → I₂ + 2H₂O ; incolore → jaune (≈ 2 min) → brun (≈ 12 min) → teinte finale (≈ 40 min) ;
 *    teinte pour l’œil : avancement relatif 1 − e^(−t/6 min) (même τ que courbes.html, jamais écrit à l’écran).
 *  - soufre : thiosulfate + acide sur une croix noire ; le trouble de soufre cache la croix vers 2 min.
 *  - echelle : instantanée / lente / très lente ; le classement dépend des moyens d’observation.
 * Couleurs du contrat : permanganate #7b2a8c, Mn²⁺ presque incolore, Fe³⁺ jaune-orangé pâle, Fe²⁺ vert très pâle, diiode jaune → brun #8a4b12,
 * soufre : trouble blanc-jaune. Craie : blanc texte, jaune surlignage.
 */
/* ── Moteur du déroulé (modèle : physics/circuit-rlc-tableau/circuit-lc.html, recopié dans chaque page) ──────────────
 * Une page déclare des étapes par vue : { nom, anim (s), ecritDes (s, défaut = anim), motif, bulle() }.
 * Chaque étape : d’abord son animation, puis la craie écrit ce qu’il faut dire ; le moment `nom` est la fin de cette écriture.
 * Les durées d’écriture sont mesurées au dessin (calculer). Les parties fixes s’écrivent à l’horloge de la scène, ECRITURE fois plus vite.
 */
const { fr, bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lisse = p => p * p * (3 - 2 * p);
const fx = (v, d = 2) => fr(v, d).replace(/(,\d*?)0+$/, '$1').replace(/,$/, '');   // 1,50 → 1,5 ; 2,00 → 2
const ECRITURE = 2.5;
function Moteur(o) {
  const q = new URLSearchParams(location.search);
  const S = { vue: o.vues.includes(q.get('vue')) ? q.get('vue') : o.vues[0], t: 0, running: false, pause: false, fait: false,
    jusqua: null, motif: '', emis: 0, dit: '', mesure: false };
  const V = o.vitesse ?? 1.7, T0 = o.T0 ?? .8, HOLD = {};
  let TL = null;
  function construire() {
    let s = T0; const ev = [];
    for (const e of o.etapes(S.vue)) {
      const anim = e.anim || 0, d = { ...e, anim, debut: s, ecrit: s + (e.ecritDes ?? anim) };
      d.fin = Math.max(s + anim, d.ecrit + (HOLD[e.nom] ?? 1.5)) + .35;
      s = d.fin; ev.push(d);
    }
    const mom = {}; for (const e of ev) mom[e.nom] = e.fin; mom.fin = s + (o.queue ?? .6);
    TL = { ev, M: mom };
  }
  const ev = nom => TL.ev.find(e => e.nom === nom);
  const M = {
    S, ev, Moments: () => TL.M,
    /** Avancement (0 → 1) de l’animation de l’étape `nom`. */
    p(nom) { const e = ev(nom); if (!e) return 0; return e.anim > 0 ? clamp((S.t - e.debut) / e.anim, 0, 1) : (S.t >= e.debut - 1e-6 ? 1 : 0); },
    commence(nom) { const e = ev(nom); return !!e && S.t > e.debut + 1e-6; },
    vu(nom) { if (nom === 'fin') return S.t >= TL.M.fin - 1e-6; const e = ev(nom); return !!e && S.t >= e.fin - 1e-6; },
    /** Ce qui s’écrit à l’étape `nom` : la craie écrit à partir de la fin de son animation. */
    etape(c, nom, fn) {
      const e = ev(nom); if (!e) return;
      const t = c.t, cur = c.cur, comp = c.complet, w0 = e.ecrit;
      c.t = S.t > 1e5 ? 1e9 : w0 + (S.t - w0) * V; c.cur = w0;
      try { fn(); } finally { if (S.mesure) HOLD[nom] = Math.max(HOLD[nom] || 0, (c.cur - w0) / V); c.t = t; c.cur = cur; if (!S.running) c.complet = comp; }
    },
    etat() { return S.running ? 'en cours' : S.fait ? 'fin' : S.pause ? 'arrêt sur image' : 'pas encore lancée'; },
  };
  const scene = window.OndesTableau.Scene($('canvas'), (c) => o.dessiner(c, M));
  const cadreBase = scene.cadre;
  scene.cadre = function (g) { const k = cadreBase.call(scene, g); if (Number.isFinite(k.t)) k.t *= ECRITURE; return k; };
  M.scene = scene; M.craie = scene.craie;
  function calculer() {
    construire();
    const t = S.t, r = S.running; S.t = 1e6; S.running = false; S.mesure = true;
    for (const k of Object.keys(HOLD)) delete HOLD[k];   // une étape dessinée en plusieurs morceaux garde le plus long (max ci-dessus)
    try { o.dessiner(scene.craie, M); } finally { S.t = t; S.running = r; S.mesure = false; }
    construire(); scene.sale = true;
  }
  // La bulle est du texte simple : jamais de « _ » visible (u_C → uC, I_0 → I₀).
  const sansSouligne = s => String(s).replace(/([A-Za-zΔτ])_\{?([A-Za-z0-9]+)\}?/g, (m, a, i) => a + (/^\d+$/.test(i) ? [...i].map(d => '₀₁₂₃₄₅₆₇₈₉'[d]).join('') : i));
  const dire = (texte, kind = '') => { texte = sansSouligne(texte); S.dit = texte; bulle($('feedback'), texte, kind); };
  const etiquette = () => { $('run').textContent = S.running ? 'Pause' : S.pause ? 'Reprendre' : S.fait ? 'Rejouer' : 'Lancer'; };
  let pont = null;
  const emettre = () => pont && pont.emettre();
  const noter = (a, d) => pont && pont.noter(a, d);
  scene.avancer = dt => {
    if (!S.running) return !!(o.anime && o.anime());
    const avant = S.t; S.t += dt;
    for (const e of TL.ev) if (avant < e.debut && S.t >= e.debut && e.bulle) dire(e.bulle());
    if (S.jusqua != null && S.t >= S.jusqua) {
      S.t = S.jusqua; S.jusqua = null; S.running = false;
      if (S.t >= TL.M.fin - 1e-6) { finir(); return true; }
      S.pause = true; etiquette(); dire('Arrêt sur image : ' + (S.motif || `t = ${fx(S.t, 1)} s`) + '.');
      noter('pause', { time_s: +S.t.toFixed(2) }); emettre(); return true;
    }
    if (S.t >= TL.M.fin) { S.t = TL.M.fin; finir(); return true; }
    if (performance.now() - S.emis > 500) { S.emis = performance.now(); emettre(); }
    return true;
  };
  function finir() { S.running = false; S.fait = true; S.pause = false; S.jusqua = null; etiquette(); dire(o.messageFin(M), 'good'); noter('measurement', o.params(M)); emettre(); }
  function start() { o.reprise && o.reprise(); S.t = 0; S.jusqua = null; S.motif = ''; S.running = true; S.pause = false; S.fait = false; etiquette(); dire(o.depart(M)); noter('start', o.params(M)); emettre(); }
  function pause() { if (!S.running) return; S.running = false; S.pause = true; S.jusqua = null; etiquette(); dire('Arrêt sur image.'); noter('pause', { time_s: +S.t.toFixed(2) }); emettre(); }
  function resume() { if (S.running) return; o.reprise && o.reprise(); if (!S.pause) return start(); S.running = true; S.pause = false; etiquette(); dire('Ça repart…'); noter('resume'); emettre(); }
  function setTime(p) {
    const t = +p.time_s; if (p.time_s === null || p.time_s === '' || !Number.isFinite(t)) return;
    o.reprise && o.reprise(); S.running = false; S.jusqua = null; S.t = clamp(t, 0, TL.M.fin); S.fait = S.t >= TL.M.fin - 1e-6; S.pause = !S.fait && S.t > 0;
    etiquette(); scene.sale = true; dire(`Arrêt sur image : t = ${fx(S.t, 1)} s.`); noter('set_time', { time_s: S.t }); emettre();
  }
  function playUntil(p) {
    const noms = o.etapes(S.vue).map(e => e.nom).concat('fin');
    const nom = noms.includes(p.moment) ? p.moment : null, cible = nom ? TL.M[nom] : +p.time_s;
    if (!Number.isFinite(cible) || (p.moment && !nom && (p.time_s == null || p.time_s === ''))) { dire(`Moment inconnu : ${p.moment}.`, 'bad'); emettre(); return; }
    o.reprise && o.reprise();
    if (S.fait || S.t >= cible - 1e-3) { S.t = 0; S.fait = false; }
    S.jusqua = clamp(cible, .01, TL.M.fin); S.motif = nom ? (o.motifs[nom] || nom) : ''; S.running = true; S.pause = false; etiquette(); dire('Observe…');
    noter('play_until', { moment: nom, time_s: S.jusqua }); emettre();
  }
  function setParameters(p) {
    p = p || {};
    const r = o.appliquer(p, M) || {};
    if (r.vue && o.vues.includes(r.vue) && r.vue !== S.vue) { S.vue = r.vue; r.change = true; r.vueChange = true; }
    if (r.change) { calculer(); if (r.vueChange) scene.reecrire(); }
    noter('set_parameters', o.params(M));
    if (r.apres) r.apres();
    else if (r.change && !r.garder) start();
    else { scene.sale = true; emettre(); }
  }
  Object.assign(M, { noter, calculer, dire, start, pause, resume, setTime, playUntil, setParameters, emettre, etiquette });
  $('run').onclick = () => (S.running ? pause() : S.pause ? resume() : start());
  window.Tableau.explication(o.explications);
  const commandes = ['start', 'reset', 'pause', 'resume', 'set_time', 'set_parameters', 'play_until'];
  M.lancer = () => {
    calculer();
    const listeMoments = o.vues.map(v => `${o.vues.length > 1 ? v + ' : ' : ''}${o.etapes(v).map(e => e.nom).concat('fin').join(' | ')}`).join(' ; ');
    const config = { id: o.id, version: '1.0', title: o.titre, variants: o.vues.length > 1 ? o.vues.map(id => ({ id, label: o.titres[id] })) : [], commands: commandes,
      command_schema: { set_parameters: o.schema, set_time: { time_s: '0..fin (arrêt sur cet instant de la scène, en s ; voir moments)' },
        play_until: { moment: listeMoments, time_s: 'ou un instant en s' } } };
    pont = protocole({ id: o.id, commandes, config, texte: o.texte,
      etat: () => ({ simulation_status: S.running ? 'running' : S.fait ? 'finished' : S.pause ? 'paused' : 'idle',
        ce_qui_se_voit: o.voir(M) + (S.dit ? ` La bulle dit : « ${S.dit} »` : ''), current_variant: S.vue, time_s: +S.t.toFixed(2),
        parameters: o.params(M), moments: Object.fromEntries(Object.entries(TL.M).map(([k, v]) => [k, +v.toFixed(2)])) }),
      progression: () => (S.fait ? 1 : 0),
      executer: (cmd, p) => ({ start, reset: start, pause, resume, set_time: () => setTime(p), set_parameters: () => setParameters(p), play_until: () => playUntil(p) })[cmd]?.() });
    dire(o.depart(M));
    setTimeout(() => { if (!S.running && S.t === 0 && !S.pause && !S.fait) start(); }, 900);
  };
  return M;
}

/**
 * Zone d’écriture : comme au tableau, le professeur efface les plus vieilles lignes. `liste` = [{ nom, lignes: [[texte, couleur], …],
 * plus(c) }] dans l’ordre des étapes ; on garde les lignes des dernières étapes écrites, au plus `n` lignes (aux hauteurs `ys`).
 * `plus` (annotations près des objets : cotes, valeurs) s’écrit dans la même étape, et reste au tableau.
 * Renvoie les lignes visibles (pour ce_qui_se_voit).
 */
function zoneEcriture(c, M, liste, ys, o = {}) {
  const S = M.S, x = o.x ?? 14, max = o.max ?? 406, taille = o.taille ?? 16, n = ys.length, vues = [];
  if (S.mesure) {
    for (const e of liste) M.etape(c, e.nom, () => { for (const [t, col] of e.lignes) ecrireChim(c, t, x, ys[0], { couleur: col, taille, max }); e.plus && e.plus(c); });
    return vues;
  }
  let k = -1;
  liste.forEach((e, j) => { const ev = M.ev(e.nom); if (ev && S.t > ev.ecrit + .05) k = j; });   // l’instant même d’un moment n’efface pas encore ses lignes
  const garde = new Set(); let nb = 0;
  for (let j = k; j >= 0; j--) { const l = liste[j].lignes.length; if (nb + l > n) break; garde.add(j); nb += l; }
  let y = 0;
  liste.forEach((e, j) => {
    if (j > k) return;
    M.etape(c, e.nom, () => {
      if (garde.has(j)) for (const [t, col] of e.lignes) { ecrireChim(c, t, x, ys[y++], { couleur: col, taille, max }); vues.push(t); }
      e.plus && e.plus(c);
    });
  });
  return vues;
}
/** Rejoue une seule étape (depuis son début) et se fige à sa fin : un réglage ne refait pas toute l’histoire. */
function rejouerEtape(M, nom, motif, jusqua) {
  const e = M.ev(nom); if (!e) return;
  const S = M.S; S.t = e.debut; S.fait = false; S.pause = false; S.running = true;
  S.jusqua = jusqua === undefined ? M.Moments()[nom] : jusqua; S.motif = motif || nom;
  M.etiquette(); M.dire('Observe…'); M.noter('play_until', { moment: nom, time_s: S.jusqua }); M.emettre();
}

/* ── Écriture chimique à la craie ─────────────────────────────────────────
 * Les formules s’écrivent en Unicode (MnO₄⁻, Cu²⁺, H₂O₂) ; `chim` les traduit pour le kit : indices « _{4} », charges « ^{2+} ».
 * exposants.js ne gère pas « ⁺ » : la charge entière (« 2+ », « − ») passe donc par « ^{…} », écrite petite et relevée.
 * Les flèches → et ⇌ sont DESSINÉES au trait (la police n’a pas ⇌) : voir `equation`.
 */
const SUPS = { '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9', '⁺': '+', '⁻': '−' };
const SUBS = { '₀': '0', '₁': '1', '₂': '2', '₃': '3', '₄': '4', '₅': '5', '₆': '6', '₇': '7', '₈': '8', '₉': '9' };
const chim = s => String(s)
  .replace(/[₀₁₂₃₄₅₆₇₈₉]+/g, g => '_{' + [...g].map(ch => SUBS[ch]).join('') + '}')
  .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻]+/g, g => '^{' + [...g].map(ch => SUPS[ch]).join('') + '}');
/** Texte chimique à la craie (mêmes options que craie.texte). */
const ecrireChim = (c, s, x, y, o = {}) => c.texte(chim(s), x, y, o);
/** Largeur (unités du dessin) d’un texte chimique : indices et charges plus petits. Avant la mise en page (cadre minuscule), taille nominale. */
function largeur(c, s, taille = 18) {
  const k = c.echelle >= .6 && c.tailleMin ? Math.max(taille, c.tailleMin / c.echelle) : taille, ctx = c.ctx;
  let w = 0;
  for (const ch of String(s)) { const p = SUPS[ch] ?? SUBS[ch]; ctx.font = `${p ? k * .62 : k}px ${window.Tableau.POLICE}`; w += ctx.measureText(p ?? ch).width; }
  return w;
}
/** Double flèche des demi-équations : deux demi-flèches (haut : vers la droite, bas : vers la gauche). */
function doubleFleche(c, x1, x2, y, o = {}) {
  const h = 3.4, t = 8, col = o.couleur || 'blanc', lw = o.largeur ?? 1.8;
  c.trait([[x1, y - h], [x2, y - h], [x2 - t, y - h - t * .62]], { couleur: col, largeur: lw });
  c.trait([[x2, y + h], [x1, y + h], [x1 + t, y + h + t * .62]], { couleur: col, largeur: lw });
}
/**
 * Équation écrite à la craie : `morceaux` = textes et flèches ('→' ou '⇌', dessinées). o : taille, couleur, couleurs[i],
 * couleurFleche, align ('left' | 'center' | 'right'), fleche (longueur). Renvoie [x début, x fin].
 */
function equation(c, morceaux, x, y, o = {}) {
  const taille = o.taille ?? 18, L = o.fleche ?? 32, esp = 7, estF = m => m === '→' || m === '⇌';
  const ws = morceaux.map(m => (estF(m) ? L + 2 * esp : largeur(c, m, taille)));
  const total = ws.reduce((a, b) => a + b, 0);
  let px = o.align === 'center' ? x - total / 2 : o.align === 'right' ? x - total : x;
  const x0 = px, ym = y - taille * .3;
  morceaux.forEach((m, i) => {
    const col = (o.couleurs && o.couleurs[i]) || o.couleur || 'blanc';
    if (m === '→') c.fleche(px + esp, ym, px + esp + L, ym, { couleur: o.couleurFleche || col, largeur: 1.8, tete: 8 });
    else if (m === '⇌') doubleFleche(c, px + esp, px + esp + L, ym, { couleur: o.couleurFleche || col });
    else ecrireChim(c, m, px, y, { couleur: col, taille });
    px += ws[i];
  });
  return [x0, px];
}
/** Une équation en texte simple (bulle, ce_qui_se_voit). */
const enTexte = morceaux => morceaux.join(' ');

/* ── Verrerie et solutions peintes (règle 7 : elles ressemblent aux vraies ; le peint ne change jamais la chimie) ── */
const rgba = (k, a = 1) => `rgba(${Math.round(k[0])},${Math.round(k[1])},${Math.round(k[2])},${((k[3] ?? 1) * a).toFixed(3)})`;
const melange = (a, b, f) => a.map((v, i) => v + ((b[i] ?? 1) - v) * clamp(f, 0, 1));
/** Couleurs des solutions [r, g, b, opacité] (contrat : permanganate #7b2a8c, Cu²⁺ #3a7bd5, diiode brun #8a4b12, cuivre #b5562b). */
const COUL = {
  incolore: [214, 230, 240, .13],
  permanganate: [123, 42, 140, .9],
  mn2: [236, 226, 240, .14],          // Mn²⁺ : presque incolore
  fe3: [246, 214, 120, .2],           // Fe³⁺ : jaune-orangé (très pâle à cette concentration)
  fe2: [196, 228, 178, .3],           // Fe²⁺ : vert très pâle
  cu2: [58, 123, 213, .84],
  cu2pale: [168, 204, 238, .2],
  jaune: [242, 202, 58, .55],
  brun: [138, 75, 18, .93],
  soufre: [238, 232, 196, 1],
};
/** Teinte du diiode selon l’avancement relatif f (0 → 1) : incolore → jaune → brun. */
const teinteIode = f => (f < .3 ? melange(COUL.incolore, COUL.jaune, f / .3) : melange(COUL.jaune, COUL.brun, (f - .3) / .7));
const Peint = {
  /** Sphère ombrée. */
  sphere(ctx, x, y, r, [clair, milieu, sombre], a = 1) {
    ctx.save(); ctx.globalAlpha = a;
    const g = ctx.createRadialGradient(x - r * .35, y - r * .4, r * .1, x, y, r); g.addColorStop(0, clair); g.addColorStop(.45, milieu); g.addColorStop(1, sombre);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  },
  /**
   * Bécher vu de côté : B = {x, y (bord), w, h} ; `niv` = hauteur du liquide (fraction de h) ; `coul` = [r,g,b,opacité].
   * o.trouble (0..1) : soufre en suspension (trouble blanc-jaune) ; o.a : opacité d’ensemble.
   */
  becher(ctx, B, niv, coul, o = {}) {
    const { x, y, w, h } = B, yb = y + h, r = Math.min(14, w * .1), a = o.a ?? 1, yl = yb - h * niv;
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(x + w / 2 + 4, yb + 5, w / 2 + 6, 5.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(200,225,255,.05)'; ctx.beginPath(); ctx.roundRect(x, y, w, h, [0, 0, r, r]); ctx.fill();
    if (niv > 0) {
      const forme = () => { ctx.beginPath(); ctx.roundRect(x + 2.5, yl, w - 5, yb - yl - 2.5, [0, 0, r - 2, r - 2]); };
      const g = ctx.createLinearGradient(0, yl, 0, yb);
      g.addColorStop(0, rgba(melange(coul, [255, 255, 255, coul[3]], .22)));
      g.addColorStop(.35, rgba(coul));
      g.addColorStop(1, rgba(melange(coul, [0, 0, 0, Math.min(1, coul[3] * 1.08)], .28)));
      ctx.fillStyle = g; forme(); ctx.fill();
      if (o.trouble > 0) {
        // Soufre en suspension : un voile laiteux, un peu plus dense vers le bas (pour l’œil).
        const gt = ctx.createLinearGradient(0, yl, 0, yb);
        gt.addColorStop(0, rgba(COUL.soufre, .78 * o.trouble)); gt.addColorStop(1, rgba(COUL.soufre, .97 * o.trouble));

  c.direct(() => {

    ctx.fillStyle = 'rgba(238,236,226,.85)'; ctx.beginPath(); ctx.moveTo(52, BS.y + BS.h - 2); ctx.lineTo(282, BS.y + BS.h - 2); ctx.lineTo(300, BS.y + BS.h + 18); ctx.lineTo(34, BS.y + BS.h + 18); ctx.closePath(); ctx.fill();

/* ── Vue echelle : la flèche des durées ─────────────────────────────────── */

const VR = { x: 86, y: 196, w: 110, h: 100 }, VL = { x: 327, y: 196, w: 110, h: 100 }, PORTAIL = { x: 556, y: 182, w: 138, h: 118 };

function peindrePortail(ctx, P, r) {

}
function dessinerEchelle(c, M) {
