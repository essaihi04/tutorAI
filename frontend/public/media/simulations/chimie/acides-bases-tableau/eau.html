<script>
/*
 * eau.html (contrat acides_bases § 1) — cours « Transformations liées aux réactions acide-base » (phys_ch13_acides_bases, 2e Bac PC BIOF, novembre 2026).
 * Contrat : outils/cours/notes/cours/acides_bases_contrat_simulations.md. Vues (?vue=) : ouverture (défaut) | rappel | autoprotolyse | ke | solutions | ho | soude.

/* ── Formules chimiques à la craie : indices ₂ et charges ⁺ ⁻ ²⁻ rendus (sans modifier exposants.js ni le kit) ──────────
 * « MnO₄⁻ » devient « MnO_{4}^{−} » ; le découpage « _{…} » accepte tout caractère avant (« [I⁻]₀ »). */
(function () {
  const C = window.Tableau.Craie, P = C.prototype, texteAvant = P.texte, segAvant = C.segments;
  const SUP = { '⁺': '+', '⁻': '−', '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9' };
  const SUB = { '₀': '0', '₁': '1', '₂': '2', '₃': '3', '₄': '4', '₅': '5', '₆': '6', '₇': '7', '₈': '8', '₉': '9' };
  const chim = s => String(s).replace(/[⁺⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, g => '^{' + [...g].map(ch => SUP[ch]).join('') + '}')
    .replace(/[₀₁₂₃₄₅₆₇₈₉]+/g, g => '_{' + [...g].map(ch => SUB[ch]).join('') + '}');
  C.segments = function (s) {
    const out = [], re = /_\{([^}]+)\}/g; let i = 0, m;
    while ((m = re.exec(s))) { if (m.index > i) out.push(...segAvant(s.slice(i, m.index))); out.push({ t: m[1], sub: true }); i = re.lastIndex; }
    if (i < s.length) out.push(...segAvant(s.slice(i)));
    return out;
  };
  P.texte = function (s, x, y, o) { return texteAvant.call(this, chim(s), x, y, o); };
  window.chim = chim;
})();

/* ── Moteur du déroulé (copie de physics/circuit-rlc-tableau/circuit-lc.html, + M.evs) ─────────────────────────────────── */
const { fr, bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lisse = p => p * p * (3 - 2 * p);
const lerp = (a, b, f) => a + (b - a) * f;
const fx = (v, d = 2) => fr(v, d).replace(/(,\d*?)0+$/, '$1').replace(/,$/, '');
const ECRITURE = 2.5;
function Moteur(o) {
  const q = new URLSearchParams(location.search);
  const S = { vue: o.vues.includes(q.get('vue')) ? q.get('vue') : o.vues[0], t: 0, running: false, pause: false, fait: false,
    jusqua: null, motif: '', emis: 0, dit: '', mesure: false };
  const V = o.vitesse ?? 1.7, T0 = o.T0 ?? .8, HOLD = {};
  let TL = null;
  function construire() {
    let s = T0; const ev = [];
    for (const e of o.etapes(S.vue)) {
      const anim = e.anim || 0, d = { ...e, anim, debut: s, ecrit: s + (e.ecritDes ?? anim) };
      d.fin = Math.max(s + anim, d.ecrit + (HOLD[e.nom] ?? 1.5)) + .35;
      s = d.fin; ev.push(d);
    }
    const mom = {}; for (const e of ev) mom[e.nom] = e.fin; mom.fin = s + (o.queue ?? .6);
    TL = { ev, M: mom };
  }
  const ev = nom => TL.ev.find(e => e.nom === nom);
  const M = {
    S, ev, evs: () => TL.ev, Moments: () => TL.M,
    p(nom) { const e = ev(nom); if (!e) return 0; return e.anim > 0 ? clamp((S.t - e.debut) / e.anim, 0, 1) : (S.t >= e.debut - 1e-6 ? 1 : 0); },
    commence(nom) { const e = ev(nom); return !!e && S.t > e.debut + 1e-6; },
    vu(nom) { if (nom === 'fin') return S.t >= TL.M.fin - 1e-6; const e = ev(nom); return !!e && S.t >= e.fin - 1e-6; },
    etape(c, nom, fn) {
      const e = ev(nom); if (!e) return;
      const t = c.t, cur = c.cur, comp = c.complet, w0 = e.ecrit;
      c.t = S.t > 1e5 ? 1e9 : w0 + (S.t - w0) * V; c.cur = w0;
      try { fn(); } finally { if (S.mesure) HOLD[nom] = Math.max(HOLD[nom] || 0, (c.cur - w0) / V); c.t = t; c.cur = cur; if (!S.running) c.complet = comp; }
    },
    etat() { return S.running ? 'en cours' : S.fait ? 'fin' : S.pause ? 'arrêt sur image' : 'pas encore lancée'; },
  };
  const scene = window.OndesTableau.Scene($('canvas'), (c) => o.dessiner(c, M));
  const cadreBase = scene.cadre;
  scene.cadre = function (g) { const k = cadreBase.call(scene, g); if (Number.isFinite(k.t)) k.t *= ECRITURE; return k; };
  M.scene = scene; M.craie = scene.craie;
  function calculer() {
    construire();
    const t = S.t, r = S.running; S.t = 1e6; S.running = false; S.mesure = true;
    for (const k of Object.keys(HOLD)) delete HOLD[k];   // une étape dessinée en plusieurs morceaux garde le plus long (max ci-dessus)
    try { o.dessiner(scene.craie, M); } finally { S.t = t; S.running = r; S.mesure = false; }
    construire(); scene.sale = true;
  }
  const sansSouligne = s => String(s).replace(/([A-Za-zΔτθ])_\{?([A-Za-z0-9]+)\}?/g, (m, a, i) => a + (/^\d+$/.test(i) ? [...i].map(d => '₀₁₂₃₄₅₆₇₈₉'[d]).join('') : i));
  const dire = (texte, kind = '') => { texte = sansSouligne(texte); S.dit = texte; bulle($('feedback'), texte, kind); };
  const etiquette = () => { $('run').textContent = S.running ? 'Pause' : S.pause ? 'Reprendre' : S.fait ? 'Rejouer' : 'Lancer'; };
  let pont = null;
  const emettre = () => pont && pont.emettre();
  const noter = (a, d) => pont && pont.noter(a, d);
  scene.avancer = dt => {
    if (!S.running) return !!(o.anime && o.anime());
    const avant = S.t; S.t += dt;
    for (const e of TL.ev) if (avant < e.debut && S.t >= e.debut && e.bulle) dire(e.bulle());
    if (S.jusqua != null && S.t >= S.jusqua) {
      S.t = S.jusqua; S.jusqua = null; S.running = false;
      if (S.t >= TL.M.fin - 1e-6) { finir(); return true; }
      S.pause = true; etiquette(); dire('Arrêt sur image : ' + (S.motif || `t = ${fx(S.t, 1)} s`) + '.');
      noter('pause', { time_s: +S.t.toFixed(2) }); emettre(); return true;
    }
    if (S.t >= TL.M.fin) { S.t = TL.M.fin; finir(); return true; }
    if (performance.now() - S.emis > 500) { S.emis = performance.now(); emettre(); }
    return true;
  };
  function finir() { S.running = false; S.fait = true; S.pause = false; S.jusqua = null; etiquette(); dire(o.messageFin(M), 'good'); noter('measurement', o.params(M)); emettre(); }
  function start() { o.reprise && o.reprise(); S.t = 0; S.jusqua = null; S.motif = ''; S.running = true; S.pause = false; S.fait = false; etiquette(); dire(o.depart(M)); noter('start', o.params(M)); emettre(); }
  function pause() { if (!S.running) return; S.running = false; S.pause = true; S.jusqua = null; etiquette(); dire('Arrêt sur image.'); noter('pause', { time_s: +S.t.toFixed(2) }); emettre(); }
  function resume() { if (S.running) return; o.reprise && o.reprise(); if (!S.pause) return start(); S.running = true; S.pause = false; etiquette(); dire('Ça repart…'); noter('resume'); emettre(); }
  function setTime(p) {
    const t = +p.time_s; if (p.time_s === null || p.time_s === '' || !Number.isFinite(t)) return;
    o.reprise && o.reprise(); S.running = false; S.jusqua = null; S.t = clamp(t, 0, TL.M.fin); S.fait = S.t >= TL.M.fin - 1e-6; S.pause = !S.fait && S.t > 0;
    etiquette(); scene.sale = true; dire(`Arrêt sur image : t = ${fx(S.t, 1)} s.`); noter('set_time', { time_s: S.t }); emettre();
  }
  function playUntil(p) {
    const noms = o.etapes(S.vue).map(e => e.nom).concat('fin');
    const nom = noms.includes(p.moment) ? p.moment : null, cible = nom ? TL.M[nom] : +p.time_s;
    if (!Number.isFinite(cible) || (p.moment && !nom && (p.time_s == null || p.time_s === ''))) { dire(`Moment inconnu : ${p.moment}.`, 'bad'); emettre(); return; }
    o.reprise && o.reprise();
    if (S.fait || S.t >= cible - 1e-3) { S.t = 0; S.fait = false; }
    S.jusqua = clamp(cible, .01, TL.M.fin); S.motif = nom ? (o.motifs[nom] || nom) : ''; S.running = true; S.pause = false; etiquette(); dire('Observe…');
    noter('play_until', { moment: nom, time_s: S.jusqua }); emettre();
  }
  function setParameters(p) {
    p = p || {};
    const r = o.appliquer(p, M) || {};
    if (r.vue && o.vues.includes(r.vue) && r.vue !== S.vue) { S.vue = r.vue; r.change = true; r.vueChange = true; }
    if (r.change) { calculer(); if (r.vueChange) scene.reecrire(); }
    noter('set_parameters', o.params(M));
    if (r.apres) r.apres();
    else if (r.change && !r.garder) start();
    else { scene.sale = true; emettre(); }
  }
  Object.assign(M, { noter, calculer, dire, start, pause, resume, setTime, playUntil, setParameters, emettre, etiquette });
  $('run').onclick = () => (S.running ? pause() : S.pause ? resume() : start());
  window.Tableau.explication(o.explications);
  const commandes = ['start', 'reset', 'pause', 'resume', 'set_time', 'set_parameters', 'play_until'];
  M.lancer = () => {
    calculer();
    const listeMoments = o.vues.map(v => `${o.vues.length > 1 ? v + ' : ' : ''}${o.etapes(v).map(e => e.nom).concat('fin').join(' | ')}`).join(' ; ');
    const config = { id: o.id, version: '1.0', title: o.titre, variants: o.vues.length > 1 ? o.vues.map(id => ({ id, label: o.titres[id] })) : [], commands: commandes,
      command_schema: { set_parameters: o.schema, set_time: { time_s: '0..fin (arrêt sur cet instant de la scène, en s ; voir moments)' },
        play_until: { moment: listeMoments, time_s: 'ou un instant en s' } } };
    pont = protocole({ id: o.id, commandes, config, texte: o.texte,
      etat: () => ({ simulation_status: S.running ? 'running' : S.fait ? 'finished' : S.pause ? 'paused' : 'idle',
        ce_qui_se_voit: o.voir(M) + (S.dit ? ` La bulle dit : « ${S.dit} »` : ''), current_variant: S.vue, time_s: +S.t.toFixed(2),
        parameters: o.params(M), moments: Object.fromEntries(Object.entries(TL.M).map(([k, v]) => [k, +v.toFixed(2)])) }),
      progression: () => (S.fait ? 1 : 0),
      executer: (cmd, p) => ({ start, reset: start, pause, resume, set_time: () => setTime(p), set_parameters: () => setParameters(p), play_until: () => playUntil(p) })[cmd]?.() });
    dire(o.depart(M));
    setTimeout(() => { if (!S.running && S.t === 0 && !S.pause && !S.fait) start(); }, 900);
  };
  return M;
}
/** Zone d’écriture du bas : le professeur efface les plus vieilles lignes (copie du modèle). */
function zoneEcriture(c, M, liste, ys, o = {}) {
  const S = M.S, x = o.x ?? 14, max = o.max ?? 730, taille = o.taille ?? 17, n = ys.length, vues = [];
  if (S.mesure) {
    for (const e of liste) M.etape(c, e.nom, () => { for (const [t, col] of e.lignes) c.texte(t, x, ys[0], { couleur: col, taille, max }); e.plus && e.plus(c); });
    return vues;
  }
  let k = -1;
  liste.forEach((e, j) => { const ev = M.ev(e.nom); if (ev && S.t > ev.ecrit + .05) k = j; });
  const garde = new Set(); let nb = 0;
  for (let j = k; j >= 0; j--) { const l = liste[j].lignes.length; if (nb + l > n) break; garde.add(j); nb += l; }
  let y = 0;
  liste.forEach((e, j) => {
    if (j > k) return;
    M.etape(c, e.nom, () => {
      if (garde.has(j)) for (const [t, col] of e.lignes) { c.texte(t, x, ys[y++], { couleur: col, taille, max }); vues.push(t); }
      e.plus && e.plus(c);
    });
  });
  return vues;
}
/** Largeur (cadre) d’une formule écrite à la craie, indices et charges compris. */
function larg(c, s, taille = 17) {
  const T = window.Tableau, ctx = c.ctx; if (c.echelle && c.tailleMin) taille = Math.max(taille, c.tailleMin / c.echelle);
  return T.Craie.segments(window.chim(s)).reduce((w, g) => { ctx.font = `${(g.sub || g.sup) ? taille * .62 : taille}px ${T.POLICE}`; return w + ctx.measureText(g.t).width; }, 0);
}
/** Équation « gauche → droite » : la flèche est DESSINÉE (la police n’a pas toutes les flèches). Renvoie { x, w }. */
function eqn(c, x, y, gauche, droite, o = {}) {
  const t = o.taille ?? 17, w1 = larg(c, gauche, t), w2 = larg(c, droite, t), fl = 30, tot = w1 + fl + 16 + w2;
  const x0 = o.align === 'center' ? x - tot / 2 : o.align === 'right' ? x - tot : x, col = o.couleur ?? 'blanc';
  c.texte(gauche, x0, y, { couleur: col, taille: t });
  c.fleche(x0 + w1 + 8, y - t * .3, x0 + w1 + 8 + fl, y - t * .3, { couleur: col, largeur: 1.8, tete: 7 });
  c.texte(droite, x0 + w1 + 16 + fl, y, { couleur: col, taille: t });
  return { x: x0, w: tot };
}
/** Petit triangle « attention » à la craie (orange), le « ! » dedans. */
function attention(c, x, y, o = {}) {
  const col = o.couleur ?? 'orange', h = o.h ?? 16;
  c.trait([[x, y], [x + h * .58, y - h], [x + h * 1.16, y]], { couleur: col, largeur: 1.8, ferme: true });
  c.texte('!', x + h * .58, y - 3, { couleur: col, taille: h * .8, align: 'center' });
}


/* Indice après une parenthèse (« (dx/dt)₀ ») : le kit ne le découpe que derrière une lettre ; on passe alors par l’écriture
 * à indices d’exposants.js (qui utilise le découpage « _{…} » ci-dessus). */
(function () {
  const P = window.Tableau.Craie.prototype, avant = P.texte;
  P.texte = function (s, x, y, o = {}) {
    const t = window.chim(s);
    if (!/[^A-Za-zτθΔλωφ_]_\{/.test(t)) return avant.call(this, s, x, y, o);
    let taille = o.taille ?? 18;
    this.ctx.font = `${o.gras ? '700 ' : ''}${taille}px ${window.Tableau.POLICE}`;
    this._verifierCadre(t.replace(/[_^{}]/g, ''), x, y, taille, o.align);
    if (this.echelle && this.tailleMin) taille = Math.max(taille, this.tailleMin / this.echelle);
    return this._texteIndices(t, x, y, o, taille);
  };
})();

/* ── Flèches DESSINÉES (la police n’a pas toutes les flèches) : → sens 1, ← sens 2, ⇌ les deux sens ─────────────────── */
/** Flèche entre xa et xb à la hauteur y : '→', '←' ou '⇌' (demi-flèche haute c1 vers la droite, demi-flèche basse c2 vers la gauche). */
function flecheType(c, xa, xb, y, type, o = {}) {
  const col = o.couleur ?? 'blanc', l = o.largeur ?? 1.8;
  if (type === '→') c.fleche(xa, y, xb, y, { couleur: col, largeur: l, tete: 7 });
  else if (type === '←') c.fleche(xb, y, xa, y, { couleur: col, largeur: l, tete: 7 });
  else {
    const c1 = o.c1 ?? col, c2 = o.c2 ?? col, d = 3.4;
    c.trait([[xa, y - d], [xb, y - d], [xb - 8, y - d - 6]], { couleur: c1, largeur: l });
    c.trait([[xb, y + d], [xa, y + d], [xa + 8, y + d + 6]], { couleur: c2, largeur: l });
  }
}
/** Équation « gauche (flèche) droite » ; renvoie { x, w, xa, xb, ya } (position de la flèche). */
function eqf(c, x, y, gauche, droite, o = {}) {
  let t = o.taille ?? 17;
  const mesure = tt => larg(c, gauche, tt) + (o.fl ?? 34) + 20 + larg(c, droite, tt);
  if (o.max && mesure(t) > o.max) t = t * o.max / mesure(t);
  const w1 = larg(c, gauche, t), fl = o.fl ?? 34, tot = mesure(t);
  const x0 = o.align === 'center' ? x - tot / 2 : o.align === 'right' ? x - tot : x, col = o.couleur ?? 'blanc';
  if (!o.sansTexte) c.texte(gauche, x0, y, { couleur: col, taille: t });
  const xa = x0 + w1 + 10, xb = xa + fl, ya = y - t * .3;
  if (!o.sansFleche) flecheType(c, xa, xb, ya, o.type ?? '→', { couleur: o.couleurFleche ?? col, c1: o.c1, c2: o.c2 });
  if (!o.sansTexte) c.texte(droite, xb + 10, y, { couleur: col, taille: t });
  return { x: x0, w: tot, xa, xb, ya };
}


/* ── Peint (copie de facteurs.html) ── */
const rgba = ([r, g, b, a], k = 1) => `rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},${(a * k).toFixed(3)})`;
const melange = (c1, c2, f) => c1.map((v, i) => lerp(v, c2[i], clamp(f, 0, 1)));
const eclair = (c, k) => [lerp(c[0], 255, k), lerp(c[1], 255, k), lerp(c[2], 255, k), c[3]];
const sombre = (c, k) => [c[0] * (1 - k), c[1] * (1 - k), c[2] * (1 - k), Math.min(1, c[3] * (1 + k * .4))];
const EAU = [222, 234, 244, .12];
const Peint = {
  sphere(ctx, x, y, r, [clair, milieu, foncé], a = 1) {
    ctx.save(); ctx.globalAlpha = a;
    const g = ctx.createRadialGradient(x - r * .35, y - r * .4, r * .1, x, y, r); g.addColorStop(0, clair); g.addColorStop(.45, milieu); g.addColorStop(1, foncé);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  },
  /** Bécher vu de face : verre, solution (dégradé, ménisque, reflet), bec, graduations. niveau 0 → 1. */
  becher(ctx, B, niveau, col, a = 1) {
    const { x, y, w, h } = B, ep = 3, fond = y + h, yS = fond - ep - niveau * (h - 16);
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(x + w / 2 + 3, fond + 4, w / 2, 4.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(210,230,250,.06)'; ctx.beginPath(); ctx.roundRect(x, y, w, h, [2, 2, 10, 10]); ctx.fill();
    if (niveau > .004) {
      ctx.save(); ctx.beginPath(); ctx.roundRect(x + ep, y, w - 2 * ep, h - ep, [0, 0, 8, 8]); ctx.clip();
      const g = ctx.createLinearGradient(0, yS, 0, fond); g.addColorStop(0, rgba(eclair(col, .18))); g.addColorStop(1, rgba(sombre(col, .22)));
      ctx.fillStyle = g; ctx.fillRect(x, yS, w, fond - yS);
      ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(x + w * .64, yS + 5, w * .09, Math.max(0, fond - yS - 10));
      ctx.restore();
      ctx.fillStyle = rgba(eclair(col, .35), 1.1); ctx.beginPath(); ctx.ellipse(x + w / 2, yS, w / 2 - ep, 3, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.32)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x + ep + 2, yS); ctx.lineTo(x + w - ep - 2, yS); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(225,238,250,.78)'; ctx.lineWidth = 2.2; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(x - 6, y - 4); ctx.quadraticCurveTo(x - 1, y - 2, x, y + 5); ctx.lineTo(x, fond - 10); ctx.quadraticCurveTo(x, fond, x + 10, fond);
    ctx.lineTo(x + w - 10, fond); ctx.quadraticCurveTo(x + w, fond, x + w, fond - 10); ctx.lineTo(x + w, y); ctx.stroke();

    SOLS.forEach(s => R('becher_' + s.nom, xPH(s.pH) - 32, 48, 64, 152, `le bécher ${s.etiq} à pH ${fr(s.pH, 2)} : ${s.mot}${q(s.nom)}`));

    R('regle', 12, 334, 318, 80, `la règle : acide, neutre, basique (à 25 °C)${q('regle')}`);
    const x = xPH(phVue()), bx = clamp(x, 40, 720);
    R('poignee_ph', Math.min(x, bx) - 30, AX.y - 12, Math.abs(bx - x) + 60, 120, `la poignée : le bécher violet qu’on glisse sur l’axe des pH (pH = ${fr(phVue(), 2)}, ${motDe(phVue())} ; de 0 à 14)${q('regle')}`);
  } else if (v === 'ho') {
    R('relation', 26, 44, 420, 66, `« [HO⁻] = Ke/[H₃O⁺] »${q('relation')}`);
    R('acide', 24, 126, 610, 100, `acide éthanoïque, pH 3,41 : « [HO⁻] = 1,0·10⁻¹⁴/3,89·10⁻⁴ = 2,57·10⁻¹¹ mol/L »${q('acide')}`);
    R('base', 24, 236, 610, 30, `ammoniac, pH 10,60 : « [H₃O⁺] = 10^(−10,60) = 2,51·10⁻¹¹ mol/L »${q('base')}`);
    R('forme_ph', 34, 276, 620, 62, `« [HO⁻] = 10^(pH − 14) = 10^(−3,40) = 3,98·10⁻⁴ mol/L »${q('forme_ph')}`);
    R('piege', 24, 356, 520, 36, `⚠ « [HO⁻] n’est pas 10^(−pH) »${q('piege')}`);
  } else {
    R('flacon', 40, 50, 300, 130, `le flacon de soude (Na⁺ + HO⁻, 1,0·10⁻² mol/L) versé dans le bécher${q('flacon')}`);
    R('ho', XT - 4, 134, 380, 52, `« [HO⁻] = C = 1,0·10⁻² mol/L »${q('ho')}`);
    R('h3o', XT - 4, 206, 390, 62, `« [H₃O⁺] = Ke/[HO⁻] = 1,0·10⁻¹² mol/L »${q('h3o')}`);
    R('ph', XT - 4, 288, 320, 32, `« pH = −log[H₃O⁺] = 12,00 »${q('ph')}`);
    const e = ecranPH(MS); R('afficheur', e.x, e.y, e.w, e.h, `l’afficheur du pH-mètre : 12,00${q('afficheur')}`);
  }
}

/* ── Ce que voit le tuteur ─────────────────────────────────────────── */
function voir(M) {
  const v = M.S.vue, m = [`Vue « ${v} » (${TITRES[v]}), ${M.etat()}. Étape en cours : ${etapeEnCours(M)}.`];
  if (v === 'ouverture' && M.ouv) {
    const st = M.ouv;
    m.push(`Trois béchers incolores (vinaigre dilué, eau pure, ammoniac dilué)${st.teinte > 0 ? ` qui prennent la couleur du BBT : jaune, vert, bleu (${Math.round(st.teinte * 100)} %)` : ''}. Sonde du pH-mètre ${st.dans >= 0 ? `dans le bécher ${st.dans + 1} (${BO[st.dans].nom})` : 'en l’air'} ; afficheur : ${st.aff === '- - -' ? 'pas de valeur' : 'pH = ' + st.aff}.`);
  }
  if (v === 'autoprotolyse' && M.auto && M.auto.a > 0) {
    const e = M.auto;
    m.push(`Loupe dans l’eau pure : des molécules H₂O ; au centre deux molécules H₂O ${e.apres ? 'sont devenues un ion HO⁻ (à gauche) et un ion H₃O⁺ (à droite)' : e.k > 0 ? 'échangent un proton H⁺ (boule jaune, flèche jaune)' : 'se rapprochent'}.`);
  }
  if (v === 'ke' && M.keT > 0) m.push(`Thermomètre peint à droite : ${Math.round(25 * M.keT)} °C.`);
  if (v === 'solutions' && M.commence('regle')) { const pH = phVue(); m.push(`Bécher violet (poignée) sous l’axe à pH = ${fr(pH, 2)} : [H₃O⁺] = ${sci(Math.pow(10, -pH))} mol/L, [HO⁻] = ${sci(Math.pow(10, pH - 14))} mol/L, solution ${motDe(pH)}.`); }
  if (v === 'soude' && M.sou) {
    const s = M.sou;
    m.push(`Flacon de soude ${s.filet ? 'qui verse dans le bécher' : s.a > 0 ? 'posé' : 'pas encore là'} ; bécher ${s.nivB > 0 ? 'rempli (incolore)' : 'vide'} ; pH-mètre : ${s.aff === '- - -' ? 'pas de valeur' : s.aff}.`);
  }
  if (M.vues && M.vues.length) m.push(`Écrit : ${M.vues.map(s => `« ${s} »`).join(' ; ')}.`);
  return m.join(' ');
}
const params = M => (M.S.vue === 'solutions' ? { vue: 'solutions', pH: +PAR.pH.toFixed(2), solution: motDe(PAR.pH) } : { vue: M.S.vue });
const lirePH = v => { const x = typeof v === 'string' ? Number(v.replace(',', '.')) : Number(v); return v === null || v === '' || !Number.isFinite(x) ? null : Math.round(clamp(x, 0, 14) * 100) / 100; };
const MOT = Moteur({
  id: 'ab_eau', titre: 'L’eau et le pH : ouverture, rappel, autoprotolyse, Ke, solutions acides/neutres/basiques (poignée pH), [HO⁻] = Ke/[H₃O⁺], soude', vues: VUES, titres: TITRES,
  etapes: ETAPES, motifs: MOTIFS, dessiner, voir, params,
  depart: M => ({ ouverture: 'Trois liquides incolores : ont-ils le même pH ?', rappel: 'Rappel des chapitres précédents.', autoprotolyse: 'Y a-t-il des ions dans l’eau pure ?',
    ke: 'Un produit qui ne change pas.', solutions: 'Où placer une solution sur l’axe des pH ?', ho: 'Comment trouver [HO⁻] ?', soude: 'Quel est le pH de cette solution de soude ?' })[M.S.vue],
  messageFin: M => ({ ouverture: 'Même aspect, mais pH 3,41 ; 7,00 ; 10,60 et BBT jaune, vert, bleu : qu’y a-t-il dans l’eau ?',
    rappel: 'pH = 3,41 → [H₃O⁺] = 3,89·10⁻⁴ mol/L.', autoprotolyse: '2H₂O ⇌ H₃O⁺ + HO⁻ : dans l’eau pure, [H₃O⁺] = [HO⁻] = 1,0·10⁻⁷ mol/L.',
    ke: 'Ke = [H₃O⁺]·[HO⁻] = 1,0·10⁻¹⁴ à 25 °C, dans toute solution aqueuse ; pKe = 14.',
    solutions: `pH = ${fr(PAR.pH, 2)} : solution ${motDe(PAR.pH)}.`, ho: '[HO⁻] = Ke/[H₃O⁺] = 10^(pH − 14), jamais 10^(−pH).', soude: '[HO⁻] = 1,0·10⁻² mol/L, [H₃O⁺] = 1,0·10⁻¹² mol/L : pH = 12,00.' })[M.S.vue],
  appliquer: (p, M) => {
    const r = {};
    if (VUES.includes(p.vue)) r.vue = p.vue;
    const pH = lirePH(p.pH);
    if (pH != null) {
      PAR.pH = pH; DRAG = null;
      const dit = () => { M.scene.sale = true; M.dire(`pH = ${fr(pH, 2)} : [H₃O⁺] = ${sci(Math.pow(10, -pH))} mol/L, [HO⁻] = ${sci(Math.pow(10, pH - 14))} mol/L : solution ${motDe(pH)}.`, 'good'); M.emettre(); };
      if (M.S.vue === 'solutions' && (!r.vue || r.vue === 'solutions')) {
        if (M.vu('regle')) { r.garder = true; r.apres = dit; } else r.apres = () => M.playUntil({ moment: 'fin' });
      } else { r.vue = 'solutions'; r.change = true; }
      if (r.vue === 'solutions' && M.S.vue !== 'solutions') r.change = true;
      return r;
    }
    r.change = !!(r.vue && r.vue !== M.S.vue);
    return r;
  },
  schema: { vue: VUES.join(' | ') + ' (change la vue et relance)', pH: '0..14 (vue solutions ; pas de 0,01 ; défaut 3.41) : le bécher violet glisse sur l’axe' },
  texte: 'L’eau et le pH (exemples A, B, C, 25 °C). Ouverture : trois béchers incolores identiques, vinaigre dilué (pH 3,41), eau pure (7,00), ammoniac dilué (10,60) ; une goutte de BBT : jaune, vert, bleu ; même aspect, trois pH : qu’y a-t-il dans l’eau ? Rappel : acide = donneur de proton H⁺, base = accepteur de proton H⁺ ; couple AH/A⁻ : AH ⇌ A⁻ + H⁺ ; CH₃COOH/CH₃COO⁻, NH₄⁺/NH₃, H₃O⁺/H₂O, H₂O/HO⁻ (l’eau dans deux couples) ; pH = −log[H₃O⁺], [H₃O⁺] = 10^(−pH) ; pH 3,41 → [H₃O⁺] = 3,89·10⁻⁴ mol/L. Autoprotolyse : 2H₂O ⇌ H₃O⁺ + HO⁻, réaction entre deux molécules d’eau, très rare ; eau pure : [H₃O⁺] = [HO⁻] = 1,0·10⁻⁷ mol/L (pH 7,00). Ke = [H₃O⁺]·[HO⁻], produit ionique de l’eau, 1,0·10⁻¹⁴ à 25 °C, sans unité, pKe = −log Ke = 14, vrai dans toute solution aqueuse. Solutions : acide [H₃O⁺] > [HO⁻], pH < 7 ; neutre [H₃O⁺] = [HO⁻], pH = 7 ; basique [HO⁻] > [H₃O⁺], pH > 7 (25 °C) ; poignée pH (0 à 14). [HO⁻] = Ke/[H₃O⁺] : acide éthanoïque pH 3,41 → 2,57·10⁻¹¹ mol/L ; ammoniac pH 10,60 → [HO⁻] = 10^(pH − 14) = 3,98·10⁻⁴ mol/L ; [HO⁻] n’est pas 10^(−pH). Soude C = 1,0·10⁻² mol/L : [HO⁻] = 1,0·10⁻² mol/L, [H₃O⁺] = Ke/[HO⁻] = 1,0·10⁻¹² mol/L, pH = 12,00.',
  explications: {
    ouverture: [{ repere: 'becher_1', texte: 'Du vinaigre dilué.' }, { repere: 'becher_2', texte: 'De l’eau pure.' }, { repere: 'becher_3', texte: 'De l’ammoniac dilué : les trois se ressemblent.' },
      { repere: 'afficheur', texte: 'Pourtant le pH-mètre lit 3,41 ; 7,00 et 10,60.' }, { repere: 'couleurs', texte: 'Le BBT devient jaune, vert, bleu.' }, { repere: 'question', texte: 'Qu’y a-t-il dans l’eau ?' }],
    rappel: [{ repere: 'definition', texte: 'Un acide cède un proton, une base le capte.' }, { repere: 'couple', texte: 'L’acide et sa base forment un couple.' }, { repere: 'exemples', texte: 'Deux couples connus.' },
      { repere: 'eau', texte: 'L’eau est dans deux couples.' }, { repere: 'ph', texte: 'Le pH donne [H₃O⁺].' }],
    autoprotolyse: [{ repere: 'loupe', texte: 'L’eau pure à la loupe.' }, { repere: 'proton', texte: 'Un proton passe d’une molécule d’eau à l’autre.' }, { repere: 'equation', texte: 'Deux H₂O donnent H₃O⁺ et HO⁻.' },
      { repere: 'phrase', texte: 'C’est l’autoprotolyse de l’eau.' }, { repere: 'concentrations', texte: 'Autant de H₃O⁺ que de HO⁻ : 1,0·10⁻⁷ mol par litre.' }],
    ke: [{ repere: 'encadre', texte: 'Le produit ionique de l’eau.' }, { repere: 'calcul', texte: 'Dans l’eau pure : 10⁻⁷ fois 10⁻⁷.' }, { repere: 'valeur', texte: '1,0·10⁻¹⁴ à 25 °C, sans unité.' },
      { repere: 'thermometre', texte: 'Il dépend de la température.' }, { repere: 'pke', texte: 'pKe vaut 14.' }, { repere: 'phrase', texte: 'Vrai dans toute solution aqueuse.' }],
    solutions: [{ repere: 'axe_ph', texte: 'L’axe des pH.' }, { repere: 'becher_acide', texte: 'Acide : plus de H₃O⁺ que de HO⁻.' }, { repere: 'becher_neutre', texte: 'Neutre : autant des deux.' },
      { repere: 'becher_basique', texte: 'Basique : plus de HO⁻.' }, { repere: 'barres', texte: 'Les barres comparent les deux concentrations.' }, { repere: 'regle', texte: 'La règle, à 25 °C.' },
      { repere: 'poignee_ph', texte: 'Glisse le bécher violet pour essayer un autre pH.' }],
    ho: [{ repere: 'relation', texte: '[HO⁻] égale Ke divisé par [H₃O⁺].' }, { repere: 'acide', texte: 'Dans l’acide : très peu de HO⁻.' }, { repere: 'base', texte: 'Dans l’ammoniac, [H₃O⁺] est tout petit.' },
      { repere: 'forme_ph', texte: 'Donc [HO⁻] égale 10 puissance pH moins 14.' }, { repere: 'piege', texte: 'Ce n’est pas 10 puissance moins pH.' }],
    soude: [{ repere: 'flacon', texte: 'La soude : des ions Na⁺ et HO⁻.' }, { repere: 'ho', texte: '[HO⁻] égale C.' }, { repere: 'h3o', texte: 'Ke donne [H₃O⁺] : 1,0·10⁻¹².' },
      { repere: 'ph', texte: 'Le pH vaut 12,00.' }, { repere: 'afficheur', texte: 'Le pH-mètre le confirme.' }],
  },
});
MOT.lancer();
window.Tableau.glisser(MOT.scene.craie.canvas, {
  toucher: (px, py) => {
    if (MOT.S.vue !== 'solutions' || !MOT.commence('regle')) return null;
    const [x, y] = MOT.scene.local(px, py), xh = xPH(phVue()), bx = clamp(xh, 40, 720);
    return (Math.abs(x - xh) < 18 && Math.abs(y - AX.y) < 18) || (Math.abs(x - bx) < 30 && y > 240 && y < 306) ? 'pH' : null;
  },
  bouger: (id, px) => { const [x] = MOT.scene.local(px, 0); DRAG = Math.round(clamp((x - AX.x0) / (AX.x1 - AX.x0) * 14, 0, 14) * 20) / 20; MOT.scene.sale = true; },
  lacher: () => { if (DRAG != null) { const pH = DRAG; MOT.setParameters({ pH }); } },
});
