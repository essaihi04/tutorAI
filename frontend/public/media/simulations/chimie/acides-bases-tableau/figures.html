/*
 * figures.html (?fig=fig_2025R | fig_2016N | fig_2022R | fig_2022N | fig_2024R) — cours phys_ch13_acides_bases
 * « Transformations liées aux réactions acide-base » (2e Bac PC BIOF, novembre 2026).
 * Contrat : outils/cours/notes/cours/acides_bases_contrat_simulations.md § 8 ; points relevés : acides_bases_build/nationaux.md § 5.
 * Chaque figure : moments axes · courbe · construction · lecture · calcul · fin ;
 * repères axe_x · axe_y · courbe · construction · point · valeur · calcul (tous déclarés dès le début).
 * Les courbes de dosage passent par les points lus sur le sujet ; les distributions sont tracées avec le pKa du sujet
 * (le modèle de calcul n’est jamais écrit à l’écran). Fractions à barre DESSINÉE, flèche → dessinée.
 * Moteur et aides : copies de chimie/etat-equilibre-tableau/ (gardées dans la page, le kit n’est pas modifié).

/* ── Formules chimiques à la craie : indices ₂ et charges ⁺ ⁻ ²⁻ rendus (sans modifier exposants.js ni le kit) ──────────
 * « MnO₄⁻ » devient « MnO_{4}^{−} » ; le découpage « _{…} » accepte tout caractère avant (« [I⁻]₀ »). */
(function () {
  const C = window.Tableau.Craie, P = C.prototype, texteAvant = P.texte, segAvant = C.segments;
  const SUP = { '⁺': '+', '⁻': '−', '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9' };
  const SUB = { '₀': '0', '₁': '1', '₂': '2', '₃': '3', '₄': '4', '₅': '5', '₆': '6', '₇': '7', '₈': '8', '₉': '9' };
  const chim = s => String(s).replace(/[⁺⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, g => '^{' + [...g].map(ch => SUP[ch]).join('') + '}')
    .replace(/[₀₁₂₃₄₅₆₇₈₉]+/g, g => '_{' + [...g].map(ch => SUB[ch]).join('') + '}');
  C.segments = function (s) {
    const out = [], re = /_\{([^}]+)\}/g; let i = 0, m;
    while ((m = re.exec(s))) { if (m.index > i) out.push(...segAvant(s.slice(i, m.index))); out.push({ t: m[1], sub: true }); i = re.lastIndex; }
    if (i < s.length) out.push(...segAvant(s.slice(i)));
    return out;
  };
  P.texte = function (s, x, y, o) { return texteAvant.call(this, chim(s), x, y, o); };
  window.chim = chim;
})();

/* ── Moteur du déroulé (copie de chimie/etat-equilibre-tableau/rappel.html : HOLD = Math.max ; paramètre d’URL `vue` ou `fig`) ─────────────────────────────────── */
const { fr, bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function Moteur(o) {

  const S = { vue: o.vues.includes(q.get(PARAM)) ? q.get(PARAM) : o.vues[0], t: 0, running: false, pause: false, fait: false,
    jusqua: null, motif: '', emis: 0, dit: '', mesure: false };
  const V = o.vitesse ?? 1.7, T0 = o.T0 ?? .8, HOLD = {};
  let TL = null;
  function construire() {
    let s = T0; const ev = [];
    for (const e of o.etapes(S.vue)) {
      const anim = e.anim || 0, d = { ...e, anim, debut: s, ecrit: s + (e.ecritDes ?? anim) };
      d.fin = Math.max(s + anim, d.ecrit + (HOLD[e.nom] ?? 1.5)) + .35;
      s = d.fin; ev.push(d);
    }
    const mom = {}; for (const e of ev) mom[e.nom] = e.fin; mom.fin = s + (o.queue ?? .6);
    TL = { ev, M: mom };
  }
  const ev = nom => TL.ev.find(e => e.nom === nom);
  const M = {
    S, ev, evs: () => TL.ev, Moments: () => TL.M,
    p(nom) { const e = ev(nom); if (!e) return 0; return e.anim > 0 ? clamp((S.t - e.debut) / e.anim, 0, 1) : (S.t >= e.debut - 1e-6 ? 1 : 0); },
    commence(nom) { const e = ev(nom); return !!e && S.t > e.debut + 1e-6; },
    vu(nom) { if (nom === 'fin') return S.t >= TL.M.fin - 1e-6; const e = ev(nom); return !!e && S.t >= e.fin - 1e-6; },
    etape(c, nom, fn) {
      const e = ev(nom); if (!e) return;

      c.t = S.t > 1e5 ? 1e9 : w0 + (S.t - w0) * V; c.cur = w0;
      try { fn(); } finally { if (S.mesure) HOLD[nom] = Math.max(HOLD[nom] || 0, (c.cur - w0) / V); c.t = t; c.cur = cur; if (!S.running) c.complet = comp; }
    },
    etat() { return S.running ? 'en cours' : S.fait ? 'fin' : S.pause ? 'arrêt sur image' : 'pas encore lancée'; },
  };

  const cadreBase = scene.cadre;
  scene.cadre = function (g) { const k = cadreBase.call(scene, g); if (Number.isFinite(k.t)) k.t *= ECRITURE; return k; };
  M.scene = scene; M.craie = scene.craie;
  function calculer() {
    construire();
    const t = S.t, r = S.running; S.t = 1e6; S.running = false; S.mesure = true;
    for (const k of Object.keys(HOLD)) delete HOLD[k];   // une étape dessinée en plusieurs morceaux garde le plus long (max ci-dessus)
    try { o.dessiner(scene.craie, M); } finally { S.t = t; S.running = r; S.mesure = false; }

  const etiquette = () => { $('run').textContent = S.running ? 'Pause' : S.pause ? 'Reprendre' : S.fait ? 'Rejouer' : 'Lancer'; };
  let pont = null;
  const emettre = () => pont && pont.emettre();
  const noter = (a, d) => pont && pont.noter(a, d);
  scene.avancer = dt => {
    if (!S.running) return !!(o.anime && o.anime());
    const avant = S.t; S.t += dt;
    for (const e of TL.ev) if (avant < e.debut && S.t >= e.debut && e.bulle) dire(e.bulle());
    if (S.jusqua != null && S.t >= S.jusqua) {

  };

  function start() { o.reprise && o.reprise(); S.t = 0; S.jusqua = null; S.motif = ''; S.running = true; S.pause = false; S.fait = false; etiquette(); dire(o.depart(M)); noter('start', o.params(M)); emettre(); }
  function pause() { if (!S.running) return; S.running = false; S.pause = true; S.jusqua = null; etiquette(); dire('Arrêt sur image.'); noter('pause', { time_s: +S.t.toFixed(2) }); emettre(); }
  function resume() { if (S.running) return; o.reprise && o.reprise(); if (!S.pause) return start(); S.running = true; S.pause = false; etiquette(); dire('Ça repart…'); noter('resume'); emettre(); }
  function setTime(p) {
    const t = +p.time_s; if (p.time_s === null || p.time_s === '' || !Number.isFinite(t)) return;
    o.reprise && o.reprise(); S.running = false; S.jusqua = null; S.t = clamp(t, 0, TL.M.fin); S.fait = S.t >= TL.M.fin - 1e-6; S.pause = !S.fait && S.t > 0;
    etiquette(); scene.sale = true; dire(`Arrêt sur image : t = ${fx(S.t, 1)} s.`); noter('set_time', { time_s: S.t }); emettre();
  }
  function playUntil(p) {
    const noms = o.etapes(S.vue).map(e => e.nom).concat('fin');
    const nom = noms.includes(p.moment) ? p.moment : null, cible = nom ? TL.M[nom] : +p.time_s;
    if (!Number.isFinite(cible) || (p.moment && !nom && (p.time_s == null || p.time_s === ''))) { dire(`Moment inconnu : ${p.moment}.`, 'bad'); emettre(); return; }
    o.reprise && o.reprise();
    if (S.fait || S.t >= cible - 1e-3) { S.t = 0; S.fait = false; }
    S.jusqua = clamp(cible, .01, TL.M.fin); S.motif = nom ? (o.motifs[nom] || nom) : ''; S.running = true; S.pause = false; etiquette(); dire('Observe…');
    noter('play_until', { moment: nom, time_s: S.jusqua }); emettre();
  }
  function setParameters(p) {
    p = p || {};
    const r = o.appliquer(p, M) || {};
    if (r.vue && o.vues.includes(r.vue) && r.vue !== S.vue) { S.vue = r.vue; r.change = true; r.vueChange = true; }
    if (r.change) { calculer(); if (r.vueChange) scene.reecrire(); }
    noter('set_parameters', o.params(M));
    if (r.apres) r.apres();
    else if (r.change && !r.garder) start();
    else { scene.sale = true; emettre(); }
  }
  Object.assign(M, { noter, calculer, dire, start, pause, resume, setTime, playUntil, setParameters, emettre, etiquette, finir });
  $('run').onclick = () => (S.running ? pause() : S.pause ? resume() : start());
  window.Tableau.explication(o.explications);
  const commandes = ['start', 'reset', 'pause', 'resume', 'set_time', 'set_parameters', 'play_until'];
  M.lancer = () => {
    calculer();
    const listeMoments = o.vues.map(v => `${o.vues.length > 1 ? v + ' : ' : ''}${o.etapes(v).map(e => e.nom).concat('fin').join(' | ')}`).join(' ; ');
    const config = { id: o.id, version: '1.0', title: o.titre, variants: o.vues.length > 1 ? o.vues.map(id => ({ id, label: o.titres[id] })) : [], commands: commandes,
      command_schema: { set_parameters: o.schema, set_time: { time_s: '0..fin (arrêt sur cet instant de la scène, en s ; voir moments)' },
        play_until: { moment: listeMoments, time_s: 'ou un instant en s' } } };
    pont = protocole({ id: o.id, commandes, config, texte: o.texte,
      etat: () => ({ simulation_status: S.running ? 'running' : S.fait ? 'finished' : S.pause ? 'paused' : 'idle',
        ce_qui_se_voit: o.voir(M) + (S.dit ? ` La bulle dit : « ${S.dit} »` : ''), current_variant: S.vue, time_s: +S.t.toFixed(2),
        parameters: o.params(M), moments: Object.fromEntries(Object.entries(TL.M).map(([k, v]) => [k, +v.toFixed(2)])) }),
      progression: () => (S.fait ? 1 : 0),
      executer: (cmd, p) => ({ start, reset: start, pause, resume, set_time: () => setTime(p), set_parameters: () => setParameters(p), play_until: () => playUntil(p) })[cmd]?.() });
    dire(o.depart(M));

/** Zone d’écriture du bas : le professeur efface les plus vieilles lignes (copie du modèle). */
function zoneEcriture(c, M, liste, ys, o = {}) {
  const S = M.S, x = o.x ?? 14, max = o.max ?? 730, taille = o.taille ?? 17, n = ys.length, vues = [];
  if (S.mesure) {
    for (const e of liste) M.etape(c, e.nom, () => { for (const [t, col] of e.lignes) c.texte(t, x, ys[0], { couleur: col, taille, max }); e.plus && e.plus(c); });
    return vues;
  }
  let k = -1;
  liste.forEach((e, j) => { const ev = M.ev(e.nom); if (ev && S.t > ev.ecrit + .05) k = j; });
  const garde = new Set(); let nb = 0;
  for (let j = k; j >= 0; j--) { const l = liste[j].lignes.length; if (nb + l > n) break; garde.add(j); nb += l; }
  let y = 0;
  liste.forEach((e, j) => {
    if (j > k) return;
    M.etape(c, e.nom, () => {
      if (garde.has(j)) for (const [t, col] of e.lignes) { c.texte(t, x, ys[y++], { couleur: col, taille, max }); vues.push(t); }
      e.plus && e.plus(c);
    });
  });

}
/** Largeur (cadre) d’une formule écrite à la craie, indices et charges compris. */
function larg(c, s, taille = 17) {
  const T = window.Tableau, ctx = c.ctx; if (c.echelle && c.tailleMin) taille = Math.max(taille, c.tailleMin / c.echelle);
  return T.Craie.segments(window.chim(s)).reduce((w, g) => { ctx.font = `${(g.sub || g.sup) ? taille * .62 : taille}px ${T.POLICE}`; return w + ctx.measureText(g.t).width; }, 0);
}
/** Équation « gauche → droite » : la flèche est DESSINÉE (la police n’a pas toutes les flèches). Renvoie { x, w }. */
function eqn(c, x, y, gauche, droite, o = {}) {
  const t = o.taille ?? 17, w1 = larg(c, gauche, t), w2 = larg(c, droite, t), fl = 30, tot = w1 + fl + 16 + w2;
  const x0 = o.align === 'center' ? x - tot / 2 : o.align === 'right' ? x - tot : x, col = o.couleur ?? 'blanc';
  c.texte(gauche, x0, y, { couleur: col, taille: t });
  c.fleche(x0 + w1 + 8, y - t * .3, x0 + w1 + 8 + fl, y - t * .3, { couleur: col, largeur: 1.8, tete: 7 });
  c.texte(droite, x0 + w1 + 16 + fl, y, { couleur: col, taille: t });

}
/** Petit triangle « attention » à la craie (orange), le « ! » dedans. */
function attention(c, x, y, o = {}) {
  const col = o.couleur ?? 'orange', h = o.h ?? 16;
  c.trait([[x, y], [x + h * .58, y - h], [x + h * 1.16, y]], { couleur: col, largeur: 1.8, ferme: true });
  c.texte('!', x + h * .58, y - 3, { couleur: col, taille: h * .8, align: 'center' });

/* Indice après une parenthèse (« (dx/dt)₀ ») : le kit ne le découpe que derrière une lettre ; on passe alors par l’écriture
 * à indices d’exposants.js (qui utilise le découpage « _{…} » ci-dessus). */
(function () {
  const P = window.Tableau.Craie.prototype, avant = P.texte;
  P.texte = function (s, x, y, o = {}) {
    const t = window.chim(s);
    if (!/[^A-Za-zτθΔλωφ_]_\{/.test(t)) return avant.call(this, s, x, y, o);
    let taille = o.taille ?? 18;
    this.ctx.font = `${o.gras ? '700 ' : ''}${taille}px ${window.Tableau.POLICE}`;
    this._verifierCadre(t.replace(/[_^{}]/g, ''), x, y, taille, o.align);
    if (this.echelle && this.tailleMin) taille = Math.max(taille, this.tailleMin / this.echelle);
    return this._texteIndices(t, x, y, o, taille);
  };
})();

/* ── Flèches DESSINÉES (la police n’a pas toutes les flèches) : → sens 1, ← sens 2, ⇌ les deux sens ─────────────────── */
/** Flèche entre xa et xb à la hauteur y : '→', '←' ou '⇌' (demi-flèche haute c1 vers la droite, demi-flèche basse c2 vers la gauche). */
function flecheType(c, xa, xb, y, type, o = {}) {
  const col = o.couleur ?? 'blanc', l = o.largeur ?? 1.8;
  if (type === '→') c.fleche(xa, y, xb, y, { couleur: col, largeur: l, tete: 7 });
  else if (type === '←') c.fleche(xb, y, xa, y, { couleur: col, largeur: l, tete: 7 });
  else {
    const c1 = o.c1 ?? col, c2 = o.c2 ?? col, d = 3.4;
    c.trait([[xa, y - d], [xb, y - d], [xb - 8, y - d - 6]], { couleur: c1, largeur: l });
    c.trait([[xb, y + d], [xa, y + d], [xa + 8, y + d + 6]], { couleur: c2, largeur: l });

}
/** Équation « gauche (flèche) droite » ; renvoie { x, w, xa, xb, ya } (position de la flèche). */
function eqf(c, x, y, gauche, droite, o = {}) {
  let t = o.taille ?? 17;
  const mesure = tt => larg(c, gauche, tt) + (o.fl ?? 34) + 20 + larg(c, droite, tt);
  if (o.max && mesure(t) > o.max) t = t * o.max / mesure(t);
  const w1 = larg(c, gauche, t), fl = o.fl ?? 34, tot = mesure(t);
  const x0 = o.align === 'center' ? x - tot / 2 : o.align === 'right' ? x - tot : x, col = o.couleur ?? 'blanc';
  if (!o.sansTexte) c.texte(gauche, x0, y, { couleur: col, taille: t });
  const xa = x0 + w1 + 10, xb = xa + fl, ya = y - t * .3;
  if (!o.sansFleche) flecheType(c, xa, xb, ya, o.type ?? '→', { couleur: o.couleurFleche ?? col, c1: o.c1, c2: o.c2 });
  if (!o.sansTexte) c.texte(droite, xb + 10, y, { couleur: col, taille: t });
  return { x: x0, w: tot, xa, xb, ya };

/* ── Peint (copie de facteurs.html) ── */
const rgba = ([r, g, b, a], k = 1) => `rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},${(a * k).toFixed(3)})`;

  },
  /** Bécher vu de face : verre, solution (dégradé, ménisque, reflet), bec, graduations. niveau 0 → 1. */
  becher(ctx, B, niveau, col, a = 1) {
    const { x, y, w, h } = B, ep = 3, fond = y + h, yS = fond - ep - niveau * (h - 16);
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(x + w / 2 + 3, fond + 4, w / 2, 4.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(210,230,250,.06)'; ctx.beginPath(); ctx.roundRect(x, y, w, h, [2, 2, 10, 10]); ctx.fill();
    if (niveau > .004) {

      const g = ctx.createLinearGradient(0, yS, 0, fond); g.addColorStop(0, rgba(eclair(col, .18))); g.addColorStop(1, rgba(sombre(col, .22)));
      ctx.fillStyle = g; ctx.fillRect(x, yS, w, fond - yS);

      ctx.restore();
      ctx.fillStyle = rgba(eclair(col, .35), 1.1); ctx.beginPath(); ctx.ellipse(x + w / 2, yS, w / 2 - ep, 3, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.32)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x + ep + 2, yS); ctx.lineTo(x + w - ep - 2, yS); ctx.stroke();
    }

function tangentes(f, s, br1, br2, saut) {
  const der = v => (f(v + 1e-3) - f(v - 1e-3)) / 2e-3;
  const toucher = ([a, b]) => { let best = a, e = 1e9; for (let v = a; v <= b; v += (b - a) / 800) { const d = Math.abs(der(v) - s); if (d < e) { e = d; best = v; } } return best; };
  const v1 = toucher(br1), v2 = toucher(br2), b1 = f(v1) - s * v1, b2 = f(v2) - s * v2, bm = (b1 + b2) / 2;
  let vE = saut[0];

  return { s, v1, v2, b1, b2, bm, vE, pE: f(vE) };
}

    point: { x: 10.8, y: 50, labX: 10.1, labY: 54, lab: 'pKa = 10,8', dit: 'le croisement des deux courbes : 50 % chacune, pH = pKa = 10,8' },
    marque: { x: 11.88, dit: 'pH = 11,88 (la solution du sujet)' },
    calc: { de: 'y', x: 10.2, y: 80, courbe: 0, dit: '80 % de forme acide : pH = 10,2' },
    panneau: {
      axes: [['amine R–NH₂, C_B = 9,0·10⁻² mol/L', 'blanc'], ['pH de la solution : 11,88', 'blanc']],
      courbe: [['forme acide R–NH₃⁺ : trait plein', 'rose'], ['forme basique R–NH₂ : pointillés', 'vert']],
      construction: [['trait à 50 %', 'jaune']],
      lecture: [['croisement : pKa = 10,8', 'jaune'], ['pH = 11,88 > pKa :', 'blanc'], ['R–NH₂ prédomine', 'vert']],
      calcul: [[{ m: ['80 % d’acide :', { frac: ['[R–NH₂]', '[R–NH₃⁺]'] }, '= 0,25'], txt: '80 % d’acide : [R–NH₂]/[R–NH₃⁺] = 0,25' }, 'blanc', 48],
        ['pH = 10,8 + log 0,25 = 10,2', 'jaune']],
    },
    bas: {
      axes: '% de R–NH₃⁺ et de R–NH₂ en fonction du pH (sujet 2024 R, figure 1)',
      courbe: 'forme acide : de 100 % à 0 % ; forme basique : de 0 % à 100 %',
      construction: 'on trace le trait horizontal à 50 % : les deux formes sont alors en même quantité',
      lecture: 'croisement : pKa = 10,8 ; la solution (pH = 11,88) est à droite du croisement : la base R–NH₂ prédomine',
      calcul: '80 % d’acide et 20 % de base : le rapport base/acide vaut 0,25, d’où pH = 10,2 (lu aussi sur la courbe)',
    },
    valeur: 'au croisement, pKa = 10,8 ; pH = 11,88 > pKa : R–NH₂ prédomine',
    calcTxt: '80 % d’acide : [R–NH₂]/[R–NH₃⁺] = 20/80 = 0,25 ; pH = 10,8 + log 0,25 = 10,2',
    resume: 'la forme acide (rose, trait plein) descend de 100 % à 0 % ; la forme basique (verte, pointillés) monte de 0 % à 100 % ; elles se croisent à 50 % pour pH = 10,8.',
    params: { pKa: 10.8, pH_solution: 11.88, pH_80_acide: 10.2 },
  },
};
const CLES = Object.keys(FIGS);
/* Préparation : graphe, courbe lissée, tangentes, dérivée (pour le tracé seulement). */
for (const k of CLES) {
  const f = FIGS[k]; f.G = Graphe({ ...GX, ...f.g });
  if (f.pts) {
    f.f = lissee(f.pts);
    f.courbes = [{ f: f.f, a: f.pts[0][0], b: f.pts[f.pts.length - 1][0], col: 'bleu', nom: 'pH' }];
    if (f.tang) f.T = meilleuresTangentes(f.f, f.tang.pentes, f.tang.br1, f.tang.br2, f.tang.saut, f.tang.E);
    if (f.type === 'derivee') {   // dérivée : différences centrées aux points du sujet, lissées ; échelle libre (sans graduation)
      const P = f.pts, d = P.map((p, i) => [p[0], i === 0 ? (P[1][1] - P[0][1]) / (P[1][0] - P[0][0]) : i === P.length - 1 ? (P[i][1] - P[i - 1][1]) / (P[i][0] - P[i - 1][0]) : (P[i + 1][1] - P[i - 1][1]) / (P[i + 1][0] - P[i - 1][0])]);
      const dmax = Math.max(...d.map(p => p[1])), fd = lissee(d.map(([v, y]) => [v, y / dmax * 12]));
      f.derivee = fd;
    }
  }
}

/* ── Déroulé : axes, courbe, construction, lecture, calcul ─────────────────────────────────────────────────────────── */
const etapesDe = cle => {
  const f = FIGS[cle];
  return [
    { nom: 'axes', anim: .4, motif: `les axes : ${f.g.yNom} en ordonnée, ${f.g.xNom.replace(/_/g, '')} en abscisse`, bulle: () => `Figure du national ${f.session}.` },
    { nom: 'courbe', anim: 2.8, motif: f.courbes.length > 1 ? `les deux courbes : ${f.courbes.map(c => c.nom).join(' et ')}` : 'la courbe du sujet', bulle: () => 'On trace comme sur le sujet.' },
    { nom: 'construction', anim: 2.4, motif: `la construction : ${f.bas.construction}`, bulle: () => 'La construction.' },
    { nom: 'lecture', anim: 2, motif: `la lecture : ${f.valeur}`, bulle: () => 'On lit sur la figure.' },
    { nom: 'calcul', anim: 1.6, motif: `le calcul : ${f.calcTxt}`, bulle: () => 'Le calcul.' },
  ];
};
const MOTIFS = MOTIFS_DE(etapesDe);
const quand = (M, nom) => (M.vu(nom) ? '' : ` (au moment « ${nom} »)`);

/* Construction, lecture et calcul dessinés sur le graphe (en direct, fraction p de l’étape). */
function construction(c, M, p) {
  const f = F, g = f.G;
  if (f.type === 'distribution') { pointille(c, g.x0, g.Y(50), g.X(14), g.Y(50), lisse(p)); return; }
  if (f.type === 'dosage') {
    const T = f.T, l = f.tang.l, ln = (v, b, q) => { const a = v - l, z = v + l; if (q > 0) c.ligne(g.X(a), g.Y(T.s * a + b), g.X(a + (z - a) * q), g.Y(T.s * (a + (z - a) * q) + b), { couleur: 'jaune', largeur: 1.7, pointille: [6, 5] }); };
    ln(T.v1, T.b1, seg(p, 0, .3)); ln(T.v2, T.b2, seg(p, .3, .6));
    const q = seg(p, .6, 1); if (q > 0) { const a = T.vE - l * 1.2, z = T.vE + l * 1.2; c.ligne(g.X(a), g.Y(T.s * a + T.bm), g.X(a + (z - a) * q), g.Y(T.s * (a + (z - a) * q) + T.bm), { couleur: 'jaune', largeur: 2 }); }
    if (p >= .3) c.point(g.X(T.v1), g.Y(f.f(T.v1)), 3, 'jaune');
    if (p >= .6) c.point(g.X(T.v2), g.Y(f.f(T.v2)), 3, 'jaune');
    return;
  }
  // dérivée : la courbe dpH/dV_b (orange clair), puis le trait vertical du pic au saut
  tracer(c, g, f.derivee, 0, 30, seg(p, 0, .75), 'orange', { largeur: 2.2, n: 300 });
  pointille(c, g.X(20), g.Y(f.derivee(20)), g.X(20), g.Y(f.f(20)), seg(p, .75, 1), 'orange');
}
function lecture(c, M, p) {
  const f = F, g = f.G;
  if (f.type === 'distribution') {
    const P = f.point; pointille(c, g.X(P.x), g.Y(50), g.X(P.x), g.y0, seg(p, 0, .5));
    if (p > 0) c.point(g.X(P.x), g.Y(50), 4.5, 'jaune');
    if (f.marque) { const q = seg(p, .5, 1); if (q > 0) c.ligne(g.X(f.marque.x), g.y0, g.X(f.marque.x), g.y0 - (g.h - 6) * q, { couleur: 'violet', largeur: 1.8, pointille: [3, 5] }); }
    return;
  }
  const E = f.E;
  if (f.type === 'dosage') {
    if (p > 0) c.point(g.X(E.x), g.Y(E.y), 4.5, 'jaune');
    pointille(c, g.X(E.x), g.Y(E.y), g.X(E.x), g.y0, seg(p, 0, .5));
    pointille(c, g.X(E.x), g.Y(E.y), g.x0, g.Y(E.y), seg(p, .5, 1));
    return;
  }
  // dérivée : V_bE = 20 mL au pied du trait, puis la lecture à 5 mL
  pointille(c, g.X(20), g.Y(f.derivee(20)), g.X(20), g.y0, seg(p, 0, .3), 'jaune');
  if (p >= .3) c.point(g.X(20), g.y0, 4, 'jaune');
  const L = f.lire; pointille(c, g.X(L.x), g.y0, g.X(L.x), g.Y(L.y), seg(p, .35, .65)); if (p >= .65) c.point(g.X(L.x), g.Y(L.y), 4, 'jaune');
  pointille(c, g.X(L.x), g.Y(L.y), g.x0, g.Y(L.y), seg(p, .65, 1)); if (p >= 1) c.point(g.x0, g.Y(L.y), 3.5, 'jaune');
}
function calculGraphe(c, M, p) {
  const f = F, g = f.G;
  if (f.type === 'distribution') {
    const K = f.calc;
    if (K.de === 'x') {   // pH₁ → courbe → %
      pointille(c, g.X(K.x), g.y0, g.X(K.x), g.Y(K.y), seg(p, 0, .5), 'violet');
      if (p >= .5) c.point(g.X(K.x), g.Y(K.y), 4.5, 'violet');
      pointille(c, g.X(K.x), g.Y(K.y), g.x0, g.Y(K.y), seg(p, .5, 1), 'violet');
    } else {              // % → courbe → pH
      pointille(c, g.x0, g.Y(K.y), g.X(K.x), g.Y(K.y), seg(p, 0, .5), 'violet');
      if (p >= .5) c.point(g.X(K.x), g.Y(K.y), 4.5, 'violet');
      pointille(c, g.X(K.x), g.Y(K.y), g.X(K.x), g.y0, seg(p, .5, 1), 'violet');
    }
    return;
  }
  if (f.bande) c.direct(() => bandeV(c.ctx, g.X(g.xmax) + 14, g.Y(f.bande.a), g.Y(f.bande.b), 12, f.bande.cols, lisse(p)));
}
/* Étiquettes écrites à la craie sur le graphe (une fois l’étape commencée). */
function etiquettes(c, M, nom) {
  const f = F, g = f.G;
  if (nom === 'courbe' && f.type === 'distribution') f.courbes.forEach(k => c.texte(k.nom, g.X(k.lab[0]), g.Y(k.lab[1]), { couleur: k.col, taille: 15 }));
  if (nom === 'construction' && f.type === 'distribution') c.texte('50 %', g.X(14) + 4, g.Y(50) + 5, { couleur: 'jaune', taille: 14 });
  if (nom === 'construction' && f.type === 'derivee') {
    ligneM(c, g.X(23.2), g.Y(5.6), [{ frac: ['dpH', 'dV_b'] }], { taille: 15, couleur: 'orange' });
    c.fleche(g.X(23.6), g.Y(3.6), g.X(21.4), g.Y(f.derivee(21.4)) - 4, { couleur: 'orange', largeur: 1.5, tete: 7 });
  }
  if (nom === 'lecture') {
    if (f.type === 'distribution') c.texte(f.point.lab, g.X(f.point.labX ?? f.point.x) - 10, g.Y(f.point.labY ?? 50) - 8, { couleur: 'jaune', taille: 15, align: 'right' });
    if (f.type === 'distribution' && f.marque) c.texte('11,88', g.X(f.marque.x) + 4, g.Y(64), { couleur: 'violet', taille: 14 });
    if (f.type === 'dosage') c.texte('E', g.X(f.E.x) + (f.T.s > 0 ? -16 : 10), g.Y(f.E.y) + (f.T.s > 0 ? -2 : -6), { couleur: 'jaune', taille: 17 });
    if (f.type === 'derivee') { c.texte('20', g.X(20), g.y0 + 34, { couleur: 'jaune', taille: 14, align: 'center' }); c.texte('4,4', g.x0 + 4, g.Y(4.4) - 6, { couleur: 'jaune', taille: 14 }); }
  }
  if (nom === 'calcul') {
    if (f.type === 'distribution' && f.calc.de === 'x') c.texte('20 %', g.x0 + 4, g.Y(f.calc.y) - 6, { couleur: 'violet', taille: 14 });
    if (f.type === 'distribution' && f.calc.de === 'y') c.texte('10,2', g.X(f.calc.x) - 4, g.Y(30), { couleur: 'violet', taille: 14, align: 'right' });
    if (f.bande) c.texte(f.bande.nom, g.X(g.xmax) + 20, g.Y(f.bande.b) - 8, { couleur: 'blanc', taille: 13, align: 'center' });
  }
}

const ORDRE = ['axes', 'courbe', 'construction', 'lecture', 'calcul'];
function dessiner(c, M) {
  MO = M; F = FIGS[M.S.vue]; const f = F, g = f.G; M.scene.cadre(73);
  c.texte(f.titre, 14, 26, { couleur: 'cyan', taille: 20, max: 560 });
  c.texte(`diapositive ${f.diapo}`, 746, 26, { couleur: 'faible', taille: 15, align: 'right' });
  if (M.commence('axes')) quadrillage(c, g, lisse(M.p('axes')));
  c.direct(() => {
    if (M.commence('courbe')) f.courbes.forEach(k => tracer(c, g, k.f, k.a, k.b, M.p('courbe'), k.col, { pointille: k.pointille }));
    if (M.commence('construction')) construction(c, M, M.p('construction'));
    if (M.commence('lecture')) lecture(c, M, M.p('lecture'));
    if (M.commence('calcul')) calculGraphe(c, M, M.p('calcul'));
  });
  // Panneau à droite : les lignes de chaque étape, les unes sous les autres.
  let y = 64; const ecrites = [], panneau = {};
  for (const nom of ORDRE) {
    const lignes = f.panneau[nom]; if (!lignes) continue;
    const ys = []; let yb = y;
    for (const l of lignes) { const h = l[2] ?? 22; ys.push(yb + h - 22 - (h > 22 ? 6 : 0)); yb += h; }
    y = yb + 7;
    panneau[nom] = () => lignes.forEach(([t, col], i) => {
      if (t && t.m) ligneM(c, PX, ys[i], t.m, { taille: 15, couleur: col, gap: 6 });
      else c.texte(t, PX, ys[i], { couleur: col, taille: 15, max: PW });
    });
    if (M.commence(nom)) ecrites.push(...lignes.map(l => (l[0] && l[0].txt) || l[0]));
  }
  M.panneau = ecrites;
  M.vues = zoneEcriture(c, M, etapesDe(M.S.vue).map(e => ({ nom: e.nom, lignes: [[f.bas[e.nom], e.nom === 'calcul' ? 'jaune' : 'blanc']],
    plus: () => { if (e.nom === 'axes') axesGraphe(c, g); etiquettes(c, M, e.nom); panneau[e.nom] && panneau[e.nom](); } })), ZY, { taille: 16 });
  reperes(c, M);
  return c.fin();
}
const seg = (p, a, b) => clamp((p - a) / (b - a), 0, 1);

/* ── Repères (tous déclarés dès le début ; le libellé dit à quel moment ils apparaissent) ─────────────────────────── */
function panneauY(nom) {
  let y = 64;
  for (const n of ORDRE) {
    const l = F.panneau[n]; if (!l) continue;
    const h = l.reduce((s, x) => s + (x[2] ?? 22), 0);
    if (n === nom) return [y - 18, h + 2];
    y += h + 7;
  }
  return [y - 18, 30];
}
function reperes(c, M) {
  const f = F, g = f.G, R = (id, x, y, w, h, l) => c.repere(id, x, y, w, h, l), q = nom => quand(M, nom);
  R('axe_x', g.x0, g.y0 - 10, g.w + 20, 50, `l’axe des abscisses : ${f.g.xNom.replace(/_/g, '')}, de ${nbr(g.xmin)} à ${nbr(g.xmax)}`);
  R('axe_y', g.x0 - 50, g.y0 - g.h - 20, 60, g.h + 30, `l’axe des ordonnées : ${f.g.yNom}, de ${nbr(g.ymin)} à ${nbr(g.ymax === 13 ? 12 : g.ymax)}`);
  R('courbe', g.x0, g.Y(g.ymax) - 4, g.w + 4, g.h + 4, `${f.courbes.length > 1 ? 'les deux courbes : ' + f.courbes.map(k => k.nom).join(' et ') : 'la courbe pH = f(' + f.g.xNom.split(' ')[0].replace(/_/g, '') + ')'}${q('courbe')}`);
  let cons;
  if (f.type === 'distribution') cons = [g.x0, g.Y(50) - 12, g.w + 40, 24, 'le trait horizontal à 50 %'];
  else if (f.type === 'dosage') { const T = f.T, xs = [T.v1 - f.tang.l, T.v2 + f.tang.l].map(g.X), ys = [T.s * (T.v1 - f.tang.l) + T.b1, T.s * (T.v2 + f.tang.l) + T.b2, T.s * (T.v1 + f.tang.l) + T.b1, T.s * (T.v2 - f.tang.l) + T.b2].map(v => g.Y(clamp(v, g.ymin, g.ymax)));
    cons = [Math.min(...xs) - 6, Math.min(...ys) - 6, Math.abs(xs[1] - xs[0]) + 12, Math.max(...ys) - Math.min(...ys) + 12, 'les deux tangentes parallèles (pointillés jaunes) et leur parallèle équidistante (trait jaune plein)']; }
  else cons = [g.X(17), g.Y(12.4), g.X(26) - g.X(17), g.y0 - g.Y(12.4), 'la courbe dpH/dV_b (orange) et son pic à 20 mL, relié au saut de pH'];
  R('construction', cons[0], cons[1], cons[2], cons[3], cons[4] + q('construction'));
  const P = f.type === 'distribution' ? { x: f.point.x, y: 50, dit: f.point.dit } : f.type === 'derivee' ? { x: 20, y: 8.8, dit: f.E.dit } : f.E;
  R('point', g.X(P.x) - 14, g.Y(P.y) - 14, 28, 28, `${P.dit}${q('lecture')}`);
  const [yv, hv] = panneauY('lecture');
  R('valeur', PX - 6, yv, PW + 10, hv, `les valeurs lues : ${f.valeur}${q('lecture')}`);
  const [yc, hc] = panneauY('calcul');
  R('calcul', PX - 6, yc, PW + 10, hc, `le calcul : ${f.calcTxt}${q('calcul')}`);
}

/* ── Ce que voit le tuteur ─────────────────────────────────────────────────────────────────────────────────────────── */
function voir(M) {
  const f = FIGS[M.S.vue], m = [`Figure ${M.S.vue} (national ${f.session}, diapositive ${f.diapo}), ${M.etat()}. Étape en cours : ${etapeEnCours(M)}.`];
  m.push(`Graphe à la craie : ${f.g.yNom} en ordonnée de ${nbr(f.g.ymin)} à ${nbr(f.g.ymax === 13 ? 12 : f.g.ymax)}, ${f.g.xNom.replace(/_/g, '')} en abscisse de ${nbr(f.g.xmin)} à ${nbr(f.g.xmax)}.`);
  if (M.commence('courbe')) m.push(`Courbe${f.courbes.length > 1 ? 's' : ''} tracée${f.courbes.length > 1 ? 's' : ''} (${M.vu('courbe') ? 'en entier' : 'en cours'}) : ${f.resume}`);
  if (M.commence('construction')) m.push(`Construction : ${f.bas.construction}.`);
  if (M.commence('lecture')) m.push(`Lecture : ${f.valeur}.`);
  if (M.commence('calcul')) m.push(`Calcul écrit : ${f.calcTxt}.`);
  if (M.panneau && M.panneau.length) m.push(`Écrit à droite : ${M.panneau.map(s => `« ${s} »`).join(' ; ')}.`);
  if (M.vues && M.vues.length) m.push(`Lignes écrites en bas : ${M.vues.map(s => `« ${s} »`).join(' ; ')}.`);
  return m.join(' ').replace(/_\{([^}]+)\}/g, '$1').replace(/([A-Za-z])_([A-Za-z]+)/g, '$1$2');
}
const params = M => ({ fig: M.S.vue, session: FIGS[M.S.vue].session, diapositive: FIGS[M.S.vue].diapo, ...FIGS[M.S.vue].params });
const MOT = Moteur({
  id: 'ab_figures', param: 'fig', titre: 'Figures des examens nationaux : acide-base (distribution, dosage pH-métrique)', vues: CLES,
  titres: Object.fromEntries(CLES.map(k => [k, `national ${FIGS[k].session}`])),
  etapes: etapesDe, motifs: MOTIFS, dessiner, voir, params,
  depart: M => `Figure du national ${FIGS[M.S.vue].session}.`,
  messageFin: M => `National ${FIGS[M.S.vue].session} : ${FIGS[M.S.vue].calcTxt}.`,
  appliquer: (p, M) => { const r = {}; if (CLES.includes(p.fig)) r.vue = p.fig; else if (CLES.includes(p.vue)) r.vue = p.vue; r.change = !!(r.vue && r.vue !== M.S.vue); return r; },
  schema: { fig: CLES.join(' | ') + ' (change de figure et relance)' },
  texte: 'Figures des examens nationaux du chapitre acide-base, dessinées comme les sujets : ' + CLES.map(k => `${k} (${FIGS[k].session}) : ${FIGS[k].resume} Construction : ${FIGS[k].bas.construction}. Lecture : ${FIGS[k].valeur}. Calcul : ${FIGS[k].calcTxt}.`).join(' '),
  explications: Object.fromEntries(CLES.map(k => [k, [
    { repere: 'axe_y', texte: `En ordonnée : ${FIGS[k].g.yNom}.` },
    { repere: 'axe_x', texte: `En abscisse : ${FIGS[k].g.xNom.replace(/_/g, '')}.` },
    { repere: 'courbe', texte: FIGS[k].bas.courbe },
    { repere: 'construction', texte: FIGS[k].bas.construction },
    { repere: 'point', texte: (FIGS[k].point || FIGS[k].E).dit },
    { repere: 'valeur', texte: FIGS[k].valeur },
    { repere: 'calcul', texte: FIGS[k].calcTxt },
  ]])),
});
MOT.lancer();
