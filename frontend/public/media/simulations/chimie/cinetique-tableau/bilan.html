<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ce qu'il faut retenir — suivi temporel, vitesse de réaction</title>

<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Fiche de révision écrite à la craie : pour chaque partie du cours sur le suivi temporel et la vitesse de réaction, la définition, la formule encadrée et le piège ; deuxième page : ce que l’élève doit retravailler"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="suiv" data-professor-control="next previous start reset play_until">Ma page →</button>
    <button class="craie-btn secondaire" id="imprimer" title="Imprimer ou enregistrer en PDF">🖨️ Imprimer / PDF</button>
    <span class="lecture" id="page"></span>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="commun.js"></script>
<script src="exposants.js"></script>
<script src="/media/simulations/shared/tableau/imprimer.js"></script>
<script>
/*
 * « Ce qu’il faut retenir » du cours « Suivi temporel d’une transformation, vitesse de réaction » (phys_ch10_cinetique),
 * même forme et même protocole que chimie/transformations-lentes-rapides-tableau/bilan.html (contrat cinetique_contrat_simulations.md, § 9).
 * TOUTE la fiche tient sur UNE page : huit blocs en trois colonnes (2, 3, 3) ; chacun avec la définition, la formule encadrée
 * (indices et charges rendus) et le piège en orange (⚠). Compétences : C1 suivi, C2 avancement, C3 mesure_x, C4 courbe, C5 vitesse,
 * C6 evolution, C7 demi_reaction, C8 redaction.
 * La voix la parcourt bloc par bloc : play_until {moment: <bloc>} écrit ce bloc à cet instant et le met en lumière ;
 * les blocs déjà dits (ou sautés) sont écrits d’un coup ; « fiche » ou « fin » : tout d’un coup.
 * La deuxième page est celle de l’élève (set_parameters {lacunes, acquis, acquis_ids}), moment « lacunes ».
 * Couleurs : jaune = cadres (surlignage) seulement, orange = piège, rouge/orange/vert = état de l’élève.
 */
/* Indices après une lettre grecque (« σ_{0} ») : le découpage « _{…} » accepte tout caractère avant (copie de courbes.html). */
(function () {
  const C = window.Tableau.Craie, segAvant = C.segments;
  C.segments = function (s) {
    const out = [], re = /_\{([^}]+)\}/g; let i = 0, m;
    while ((m = re.exec(s))) { if (m.index > i) out.push(...segAvant(s.slice(i, m.index))); out.push({ t: m[1], sub: true }); i = re.lastIndex; }
    if (i < s.length) out.push(...segAvant(s.slice(i)));
    return out;
  };
})();
const { bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);

const BLOCS = [
  { id: 'suivi', titre: '1 · Suivre une transformation', comps: ['C1'], formules: ['titrage', 'conductimétrie', 'pression'],
    def: 'On mesure une grandeur à des dates (titrage d’un prélèvement, conductimétrie, pression d’un gaz) et on en déduit x(t).',
    attention: 'trempe : le prélèvement versé dans l’eau glacée bloque la réaction avant le titrage.' },
  { id: 'avancement', titre: '2 · Tableau d’avancement', comps: ['C2'], formules: ['2,0 − x_max = 0', '10,0 − 2x_max = 0'],
    def: 'Chaque réactif s’annule pour une valeur de x_max ; le réactif limitant est celui qui donne la plus petite.',
    attention: 'on garde la plus petite valeur : x_max = 2,0 mmol, H₂O₂ limitant.' },
  { id: 'mesure_x', titre: '3 · Mesurer x', comps: ['C3'], formules: ['n(I₂) = x', 'x = x_max·(σ₀ − σ)/(σ₀ − σ_f)', 'x = (P − P₀)·V/(R·T)'],
    def: 'Titrage : n(I₂) = x ; conductimétrie : σ varie avec x ; gaz : P monte avec x.',
    attention: 'unités : V en m³, P en Pa, T en K ; [X] en mol/m³ dans σ.' },
  { id: 'courbe', titre: '4 · La courbe x(t)', comps: ['C4'], formules: ['x_f = x_max : totale'],
    def: 'On lit x à une date sur la courbe, puis la composition avec le tableau d’avancement ; le palier donne x_f.',
    attention: 'lire en pointillés jusqu’à chaque axe, avec l’unité.' },
  { id: 'vitesse', titre: '5 · Vitesse de réaction', comps: ['C5'], formules: ['v(t) = (1/V)·dx/dt'],
    def: 'dx/dt est la pente de la tangente à la courbe x(t) à la date t ; v en mol·L⁻¹·min⁻¹.',
    attention: 'V en litres : V = 100 mL = 0,100 L.' },
  { id: 'evolution', titre: '6 · Évolution de la vitesse', comps: ['C6'], formules: ['v diminue', 'v = 0 à la fin'],
    def: 'Les réactifs sont consommés : v diminue au cours du temps. Plus chaud : plus vite. À la fin, tangente horizontale : v = 0.',
    attention: 'v est maximale à t = 0.' },
  { id: 'demi_reaction', titre: '7 · Temps de demi-réaction', comps: ['C7'], formules: ['x(t₁/₂) = x_f/2'],
    def: 't₁/₂ : durée au bout de laquelle l’avancement atteint la moitié de sa valeur finale.',
    attention: 'x_f/2, pas t/2 ; à 2·t₁/₂ la transformation n’est pas finie.' },
  { id: 'redaction', titre: '8 · Rédiger un calcul', comps: ['C8'], formules: ['relation', 'application numérique', 'résultat + unité'],
    def: 'Écrire la relation littérale, puis l’application numérique, puis le résultat avec son unité.',
    attention: 'un résultat sans unité ne compte pas.' },
];
const STATUTS = { non_acquis: ['à reprendre', 'rouge'], partiel: ['à revoir', 'orange'], acquis: ['acquis', 'vert'] };
const AVANT = -1e9;   // instant d'un bloc déjà dit : il est écrit d'un coup
// apparu[i] : null = pas encore dit (pas écrit) ; un nombre = l'instant (s de la scène) où il commence à s'écrire.
const S = { page: 1, focus: null, lacunes: null, acquis: null, acquis_ids: null, apparu: [] };
window.__debordeBlocs = [];   // vérification : un bloc dont le texte dépasse son cadre ou une colonne trop pleine

/* Formules chimiques à la craie : indices (₄) et charges (²⁺, ⁻) en notation du kit (« O_{4} », « ^{2+} », écrits plus petits
 * par le kit et exposants.js : la police du tableau n’a ni « ₄ » ni « ⁺ ») ; les flèches « → » et « ⇌ » sont DESSINÉES au trait. */
const IND = { '₀': '0', '₁': '1', '₂': '2', '₃': '3', '₄': '4', '₅': '5', '₆': '6', '₇': '7', '₈': '8', '₉': '9' };
const EXPO = { '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9', '⁺': '+', '⁻': '−' };
const chimie = s => String(s).replace(/t₁\/₂/g, 't_{1/2}').replace(/σ₀/g, 'σ_{0}').replace(/σ_f/g, 'σ_{f}')
  .replace(/([A-Za-z])([₀-₉]+)/g, (m, l, g) => l + '_{' + [...g].map(ch => IND[ch]).join('') + '}')
  .replace(/[₀-₉]+/g, g => [...g].map(ch => IND[ch]).join(''))
  .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻]+/g, g => '^{' + [...g].map(ch => EXPO[ch]).join('') + '}');
const FLECHE = /(⇌|→)/;
const longFleche = taille => taille * 1.5, marge = taille => taille * .32;
/** Largeur d'un morceau de texte (indices et charges plus petits, comme le kit les écrit). */
function largeurMorceau(c, t, taille) {
  return window.Tableau.Craie.segments(chimie(t)).reduce((w, g) => w + c.largeurTexte(g.t, g.sub || g.sup ? taille * .62 : taille), 0);
}
/** Largeur d'une ligne qui peut contenir des flèches dessinées. */
function largeur(c, s, taille) {
  return String(s).split(FLECHE).reduce((w, p, i) => w + (i % 2 ? longFleche(taille) + 2 * marge(taille) : p.trim() ? largeurMorceau(c, p.trim(), taille) : 0), 0);
}
/** Flèche de réaction (→) ou double flèche des demi-équations (⇌ : deux demi-flèches), au trait. */
function flecheDessinee(c, x0, y, taille, type, o) {
  const x1 = x0 + longFleche(taille), yc = y - taille * .3, t = Math.max(4, taille * .32), st = { couleur: o.couleur || 'blanc', largeur: Math.max(1.1, taille * .1), alpha: o.alpha, duree: .18 };
  if (type === '→') {
    c.trait([[x0, yc], [x1, yc]], st);
    c.trait([[x1 - t, yc - t * .6], [x1, yc], [x1 - t, yc + t * .6]], { ...st, duree: .08 });
  } else {
    const e = taille * .14;
    c.trait([[x0, yc - e], [x1, yc - e], [x1 - t, yc - e - t * .6]], st);
    c.trait([[x1, yc + e], [x0, yc + e], [x0 + t, yc + e + t * .6]], st);
  }
}
/** Écrit une ligne (formule ou phrase) : morceaux de craie et flèches dessinées. o : couleur, taille, align, max, alpha, duree. */
function ecrire(c, s, x, y, o = {}) {
  let taille = o.taille ?? 18;
  const total = largeur(c, s, taille);
  if (o.max && total > o.max) taille = Math.max(9, taille * o.max / total);
  if (c.echelle && c.tailleMin) taille = Math.max(taille, c.tailleMin / c.echelle);   // même plancher que le kit : morceaux et flèches restent alignés
  const L = largeur(c, s, taille);
  let px = o.align === 'center' ? x - L / 2 : o.align === 'right' ? x - L : x;
  String(s).split(FLECHE).forEach((p, i) => {
    if (i % 2) { px += marge(taille); flecheDessinee(c, px, y, taille, p, o); px += longFleche(taille) + marge(taille); return; }
    const t = p.trim(); if (!t) return;
    c.texte(chimie(t), px, y, { couleur: o.couleur, taille, alpha: o.alpha, gras: o.gras, duree: o.duree });
    px += largeurMorceau(c, t, taille);
  });
  return L;
}

/* Coupe un texte en lignes qui tiennent dans `max` px. */
function lignes(c, texte, taille, max) {
  const out = []; let ligne = '';
  const t = String(texte).replace(/ ([=\/·→⇌<>≥≤≈≠−+×]) /g, ' $1 ');   // une formule dans la phrase ne se coupe pas
  for (const mot of t.split(/[ \t\n]+/)) {
    const essai = ligne ? ligne + ' ' + mot : mot;
    if (largeur(c, essai, taille) > max && ligne) { out.push(ligne); ligne = mot; } else ligne = essai;
  }
  if (ligne) out.push(ligne);
  return out;
}
function paragraphe(c, texte, x, y, taille, max, o, dessiner) {
  for (const l of lignes(c, texte, taille, max)) { if (dessiner) ecrire(c, l.replace(/ /g, ' '), x, y, { taille, ...o }); y += taille * (Z.lh || 1.2); }
  return y;
}

// Trois colonnes de trois blocs dans le cadre 760 × 420 ; hauteurs mesurées, réparties dans la colonne.
let COL = [{ x: 16, w: 228 }, { x: 266, w: 228 }, { x: 516, w: 228 }], HAUT = 52, BAS = 408, PAR_COL = [2, 3, 3];
const POS = [];   // position calculée de chaque bloc : { x, w, y0, h }
let TF = 12.5;    // taille des formules
let TD = 11.5;    // taille du texte
let HL = 16;      // interligne dans un cadre de formule sur deux lignes
/* Tailles du bloc (titre, piège, cadre des formules) ; Z.L = largeur du tableau. */
let Z = { L: 760, large: false, titre: 14, pasTitre: 19, piege: 11, hCadre: 19, hautCadre: 13, statut: 11, entete: 21, sous: 12 };
/* Tableau large (15 novembre 2026, « ce qu'il faut retenir : cases serrées, petits textes qui se chevauchent ») : sur un
 * écran d'ordinateur portable (scene.L ≥ 1000) la fiche prend toute la largeur en QUATRE colonnes, avec des textes bien
 * plus grands (le kit ne descend jamais sous 15 px à l'écran : les tailles d'origine, 11 à 14, étaient gonflées et les
 * lignes se chevauchaient). Les huit blocs sont répartis dans les colonnes pour que la plus pleine soit la moins haute.
 * Grand écran (scene.L < 1000) : les trois colonnes d'origine, étalées sur la largeur. */
let MOITIE = false;   // fiche affichée par moitié (tableau très bas), voir placer()
/** La moitié visible : celle du bloc dit (ou du dernier bloc écrit). */
function moitieVue() { let i = S.focus ? BLOCS.findIndex(b => b.id === S.focus) : -1; if (i < 0) S.apparu.forEach((a, k) => { if (a != null) i = k; }); return i >= 4 ? 1 : 0; }
const colonnes = (L, n, g = n > 4 ? 14 : 22) => { const w = (L - 32 - g * (n - 1)) / n; return Array.from({ length: n }, (_, k) => ({ x: 16 + k * (w + g), w })); };
function disposer(L, e = 1) {
  if (L === Z.L && e === Z.e && POS.length) return;
  POS.length = 0;
  if (L >= 1000) {
    // la craie ne descend jamais sous 15 px à l'écran : sur un tableau bas (e petit), les tailles partent de ce plancher,
    // pour que les largeurs mesurées soient celles qui s'écrivent (sinon les lignes débordent et se chevauchent)
    const p = 15 / (e || 1) + .3, t = v => Math.max(v, p);
    COL = colonnes(L, 4); HAUT = 46; BAS = 414; PAR_COL = null; MOITIE = false; TF = t(18); TD = t(18); HL = TF * (p > 20 ? 1.1 : 1.18);
    Z = { L, e, large: true, titre: t(21), pasTitre: t(21) * (p > 20 ? 1.08 : 1.16), piege: t(17.5), lh: p > 20 ? 1.05 : 1.12, hCadre: TF * (p > 20 ? 1.22 : 1.32), hautCadre: TF, statut: t(15), entete: t(25), sous: t(16) };
  } else {
    const w = (L - 32 - 2 * 22) / 3;
    COL = [0, 1, 2].map(k => ({ x: 16 + k * (w + 22), w })); HAUT = 52; BAS = 408; PAR_COL = [2, 3, 3]; TF = 13.5; TD = 12.5; HL = 17;
    Z = { L, e, large: false, titre: 15, pasTitre: 20, piege: 12, hCadre: 20, hautCadre: 14, statut: 12, entete: 21, sous: 12 };
  }
}
/** Répartit les blocs (dans l'ordre) en colonnes : la colonne la plus haute est la plus basse possible. */
function repartir(h, n) {
  let best = null;
  const essai = (i, k, parts) => {
    if (k === n - 1) { const p = [...parts, h.length - i]; if (p[n - 1] < 1) return;
      let j = 0, m = 0; for (const q of p) { m = Math.max(m, h.slice(j, j + q).reduce((a, b) => a + b, 0)); j += q; }
      if (!best || m < best.m) best = { m, p }; return; }
    for (let q = 1; i + q <= h.length - (n - 1 - k); q++) essai(i + q, k + 1, [...parts, q]);
  };
  essai(0, 0, []);
  return best.p;
}

/* Écrit (ou mesure seulement) le contenu d'un bloc ; rend l'ordonnée de fin. */
function contenu(c, b, x, y0, w, st, dessiner) {
  let y = y0 + Z.hautCadre - 1;
  if (dessiner) c.texte(b.titre, x, y, { couleur: 'cyan', taille: Z.titre, max: st ? w - Z.statut * 5.5 : w });
  y += Z.pasTitre;
  // formules encadrées, à la ligne quand la suivante ne tient plus ; une formule en tableau = un cadre sur plusieurs lignes
  let fx = x, hMax = 0;
  for (const f of b.formules) {
    const ls = Array.isArray(f) ? f : [f];
    const l = Math.min(w, Math.max(...ls.map(s => largeur(c, s, TF))) + 14), h = Z.hCadre + HL * (ls.length - 1);
    if (fx > x && fx + l > x + w) { fx = x; y += hMax + 3; hMax = 0; }
    if (dessiner) {
      c.rect(fx, y - Z.hautCadre, l, h, { couleur: 'jaune', arrondi: 6, largeur: 1.2, alpha: .7, duree: .25 });
      ls.forEach((s, k) => ecrire(c, s, fx + 7, y + 1 + k * HL, { couleur: 'blanc', taille: TF, max: l - 12 }));
    }
    fx += l + 7; hMax = Math.max(hMax, h);
  }
  y += hMax + 3;
  y = paragraphe(c, b.def, x, y, TD, w, { couleur: 'blanc', alpha: .9 }, dessiner);
  if (dessiner) c.texte('⚠', x, y, { couleur: 'orange', taille: Z.piege });
  const ia = Z.large ? 22 : 14;
  y = paragraphe(c, b.attention, x + ia, y, Z.piege, w - ia, { couleur: 'orange', alpha: .92 }, dessiner);
  return y - (Z.large ? 12 : 8);   // la dernière ligne descend d'environ 0,3 taille sous sa base
}
function placer(c) {
  if (!PAR_COL) {
    // quatre colonnes ; cinq si la fiche n'y tient pas (tableau très large et bas)
    let mieux = null;
    for (const n of Z.L >= 1350 ? [4, 5] : [4]) {
      const col = colonnes(Z.L, n), h = BLOCS.map(b => contenu(c, b, col[0].x, 0, col[0].w, true, false) + 6 + 8), p = repartir(h, n);
      let j = 0, m = 0; for (const q of p) { m = Math.max(m, h.slice(j, j + q).reduce((a, b) => a + b, 0)); j += q; }
      if (!mieux || (mieux.m > BAS - HAUT && m < mieux.m)) mieux = { m, col, p };
    }
    COL = mieux.col; PAR_COL = mieux.p;
    // Tableau trop bas pour les huit blocs (lecteur avec la bande de formules : canvas ≈ 273 px de haut, craie au plancher
    // de 15 px) : la fiche s'affiche par MOITIÉ, blocs 1 à 4 puis 5 à 8, un bloc par colonne ; on voit la moitié du bloc dit.
    MOITIE = Z.large && mieux.m > BAS - HAUT;
    if (MOITIE) COL = colonnes(Z.L, 4);
  }
  if (MOITIE) {
    BLOCS.forEach((b, i) => { const { x, w } = COL[i % 4]; POS[i] = { x, w, y0: HAUT, h: Math.min(BAS - HAUT, contenu(c, b, x, 0, w, true, false) + 10) }; });
    return;
  }
  for (let k = 0; k < COL.length; k++) {
    const debut = PAR_COL.slice(0, k).reduce((a, b) => a + b, 0);
    const { x, w } = COL[k], ids = Array.from({ length: PAR_COL[k] }, (_, j) => debut + j).filter(i => BLOCS[i]);
    const h = ids.map(i => contenu(c, BLOCS[i], x, 0, w, true, false) + 6);
    const libre = BAS - HAUT - h.reduce((s, v) => s + v, 0), g = Math.max(0, libre / ids.length);
    if (libre < 0) ids.forEach(i => { if (!window.__debordeBlocs.includes(BLOCS[i].id)) window.__debordeBlocs.push(BLOCS[i].id); });
    let y = HAUT;
    ids.forEach((i, j) => { POS[i] = { x, w, y0: y, h: h[j] + g * .6 }; y += h[j] + g; });
  }
}
function bloc(c, b, i) {
  const { x, w, y0, h } = POS[i], enLumiere = S.focus === b.id, st = statut(b);
  const cx = x - 6, cy = y0 - 6, cw = w + 12, ch = h + 4;
  // Le cadre de lumière et l'état de l'élève apparaissent d'un coup : ils ne décalent pas l'écriture du bloc.
  c.direct(() => {
    if (enLumiere) c.rect(cx, cy, cw, ch, { couleur: 'jaune', arrondi: 10, largeur: 1.6, alpha: .7 });
    else if (st && STATUTS[st] && st !== 'acquis') c.rect(cx, cy, cw, ch, { couleur: STATUTS[st][1], arrondi: 10, largeur: 1.4, pointille: [5, 6], alpha: .8 });
    if (st === 'acquis') c.texte('✓', x + w - 10, y0 + 12, { couleur: 'vert', taille: Z.statut + 4 });
    else if (st && STATUTS[st]) c.texte(STATUTS[st][0], x + w, y0 + 12, { couleur: STATUTS[st][1], taille: Z.statut, align: 'right' });
  });
  const fin = contenu(c, b, x, y0, w, st, true);
  if (fin > cy + ch && !window.__debordeBlocs.includes(b.id)) window.__debordeBlocs.push(b.id);
  c.repere(b.id, cx, cy, cw, ch, b.titre.replace(/^\d+ · /, ''));
}

function dessinerFiche(c) {
  placer(c);
  if (S.apparu.some(a => a === AVANT)) c.cur = AVANT;   // la voix est déjà passée : le titre est écrit d'un coup
  c.texte('Ce qu’il faut retenir · suivi temporel, vitesse de réaction', 16, 30, { couleur: 'cyan', taille: Z.entete, max: Z.L - 300 });
  c.texte(MOITIE ? (moitieVue() ? 'blocs 5 à 8 · ⚠ piège' : 'blocs 1 à 4 · ⚠ piège') : 'à savoir · formule · ⚠ piège', Z.L - 16, 28, { couleur: 'faible', taille: Z.sous, align: 'right' });
  c.ligne(16, 38, Z.L - 16, 38, { couleur: 'tresfaible', largeur: 1.4 });
  c.repere('fiche', 10, 10, Z.L - 20, BAS - 4, 'la fiche du chapitre');
  const debut = c.cur;
  let fin = c.cur;
  BLOCS.forEach((b, i) => {
    if (S.apparu[i] == null) return;   // pas encore dit : il attend son moment
    if (MOITIE && (i >= 4 ? 1 : 0) !== moitieVue()) return;   // l'autre moitié de la fiche
    c.cur = S.apparu[i] === AVANT ? AVANT : Math.max(debut, S.apparu[i]); bloc(c, b, i); fin = Math.max(fin, c.cur);
  });
  c.cur = fin;
}

function dessinerLacunes(c) {
  const g = Z.large ? 1.3 : 1, LW = Z.L - 60;   // tableau large : textes 30 % plus grands, toute la largeur
  c.texte('Ta page : ce qu’il te reste à retravailler', 22, 30, { couleur: 'cyan', taille: 22 * g });
  c.ligne(22, 38, Z.L - 20, 38, { couleur: 'tresfaible', largeur: 1.4 });
  let y = Z.large ? 76 : 70;
  const lac = S.lacunes, acq = S.acquis || [];
  if (!lac) {
    c.texte('Pas encore de réponses notées.', 22, y, { couleur: 'faible', taille: 18 * g }); y += 28 * g;
    y = paragraphe(c, 'Réponds aux questions du cours : ton bilan par compétence s’écrira ici, et le professeur y reviendra en mode libre.', 22, y, 16 * g, LW, { couleur: 'faible' }, true);
    c.repere('lacunes', 18, 50, LW + 20, y - 50, 'ta page : pas encore de bilan');
    return;
  }
  const y0 = y - 18;
  if (!lac.length) {
    c.texte('✓ Toutes les compétences évaluées sont acquises. Bravo !', 22, y, { couleur: 'vert', taille: 20 * g }); y += 30 * g;
  } else {
    c.texte('À reprendre en mode libre, avec le professeur :', 22, y, { couleur: 'orange', taille: 15 * g }); y += 24 * g;
    for (const l of lac.slice(0, 5)) {
      const [etiq, coul] = STATUTS[l.statut] || STATUTS.non_acquis;
      c.texte(l.statut === 'partiel' ? '⟳' : '✗', 22, y, { couleur: coul, taille: 17 * g });
      y = paragraphe(c, `${l.label} — ${etiq}`, 22 + 20 * g, y, 16 * g, LW - 20 * g, { couleur: 'blanc' }, true);
      if (l.reprendre_avec && l.reprendre_avec.length) y = paragraphe(c, 'reprendre avec ' + l.reprendre_avec.join(', puis '), 22 + 20 * g, y, 13 * g, LW - 20 * g, { couleur: coul, alpha: .85 }, true);
      y += 4;
    }
    if (lac.length > 5) { c.texte(`… et ${lac.length - 5} autre(s)`, 22 + 20 * g, y, { couleur: 'faible', taille: 13 * g }); y += 18 * g; }
  }
  if (acq.length) {
    y += 6; c.texte('✓ Acquis', 22, y, { couleur: 'vert', taille: 15 * g }); y += 20 * g;
    y = paragraphe(c, acq.join(' · '), 22, y, 14 * g, LW, { couleur: 'vert', alpha: .85 }, true);
  }
  c.repere('lacunes', 18, y0, LW + 20, Math.max(30, y - y0), 'ce qu’il reste à retravailler');
}

const canvas = $('canvas');
const scene = window.OndesTableau.Scene(canvas, (c) => { scene.cadre(91 + S.page); disposer(scene.L, c.echelle); if (S.page === 1) dessinerFiche(c); else dessinerLacunes(c); return c.fin(); }, { large: true });
const maintenant = () => (performance.now() - scene.ouvert) / 1000;
const nomBloc = b => b.titre.replace(/^\d+ · /, '');

/* Page n ; `focus` = le bloc que la voix dit maintenant ; `tout` = toute la fiche d'un coup. */
function aller(n, par, focus, tout) {
  n = n === 2 ? 2 : 1;
  if (par === 'start' || par === 'reset') { scene.reecrire(); S.apparu = []; }   // rejouer : la fiche se réécrit depuis le début
  else if (n !== S.page) {
    // changement de page : on repart d'une page vierge, mais les blocs déjà dits restent écrits (d'un coup)
    scene.reecrire(); S.apparu = S.apparu.map(a => (a == null ? null : AVANT));
  }
  if (n === 1) {
    const k = focus ? BLOCS.findIndex(b => b.id === focus) : -1;
    if (tout) BLOCS.forEach((b, i) => { if (S.apparu[i] == null) S.apparu[i] = AVANT; });
    if (k >= 0) {
      for (let i = 0; i < k; i++) if (S.apparu[i] == null) S.apparu[i] = AVANT;   // sautés : écrits d'un coup
      if (S.apparu[k] == null) S.apparu[k] = par === 'start' || par === 'reset' ? 0 : maintenant();
    }
  }
  S.page = n; S.focus = n === 1 ? (focus || null) : null; scene.sale = true;
  $('page').textContent = `${n} / 2`; $('suiv').textContent = n === 1 ? 'Ma page →' : '← La fiche';
  bulle($('feedback'), n === 2 ? 'Ta page à toi.' : focus ? nomBloc(BLOCS.find(b => b.id === focus)) : 'La fiche du chapitre.');
  pont.noter(par || 'page', { page: n, moment: focus || (n === 2 ? 'lacunes' : 'fiche') }); pont.emettre();
}
function statut(b) {
  if (!S.lacunes) return null;
  const lac = S.lacunes.filter(l => b.comps.includes(l.id));
  if (lac.some(l => l.statut === 'non_acquis')) return 'non_acquis';
  if (lac.length) return 'partiel';
  return (S.acquis_ids || []).some(a => b.comps.includes(a)) ? 'acquis' : null;
}
// Les moments sont des pages (1 = la fiche, 2 = la page de l'élève) ; « fin » = la fiche entière écrite.
function moments() { const m = { fiche: 1 }; BLOCS.forEach(b => { m[b.id] = 1; }); m.lacunes = 2; m.fin = 1; return m; }
function playUntil(p) {
  const nom = p.moment in moments() ? p.moment : null;
  if (!nom && !Number.isFinite(+p.time_s)) return;
  if (nom === 'lacunes' || (!nom && +p.time_s === 2)) aller(2, 'play_until');
  else if (nom === 'fiche' || nom === 'fin' || !nom) aller(1, 'play_until', null, true);
  else aller(1, 'play_until', nom);
}
function setParameters(p) {
  if (Array.isArray(p.lacunes)) S.lacunes = p.lacunes.map(l => ({ id: String(l.id || ''), label: String(l.label || l.id || ''), statut: String(l.statut || 'non_acquis'), reprendre_avec: Array.isArray(l.reprendre_avec) ? l.reprendre_avec.map(String) : [] }));
  if (Array.isArray(p.acquis)) S.acquis = p.acquis.map(String);
  if (Array.isArray(p.acquis_ids)) S.acquis_ids = p.acquis_ids.map(String);
  scene.sale = true; pont.noter('set_parameters', { lacunes: (S.lacunes || []).length, acquis: (S.acquis || []).length }); pont.emettre();
}
const formulesTexte = b => b.formules.map(f => (Array.isArray(f) ? f.join(' ') : f)).join(' ; ');
function ceQuiSeVoit() {
  if (S.page === 2) return `Page 2/2, la page de l'élève : ${!S.lacunes ? 'pas encore de bilan' : S.lacunes.length ? 'à retravailler : ' + S.lacunes.map(l => l.label).join(' ; ') : 'toutes les compétences évaluées sont acquises'}.`;
  const f = S.focus && BLOCS.find(b => b.id === S.focus);
  const ecrits = BLOCS.filter((b, i) => S.apparu[i] != null).length;
  return `${MOITIE ? `(Tableau bas : la fiche s'affiche par moitié ; on voit les blocs ${moitieVue() ? '5 à 8' : '1 à 4'}.) ` : ''}Page 1/2, la fiche du chapitre « Suivi temporel d’une transformation, vitesse de réaction » : ${ecrits}/${BLOCS.length} blocs écrits (définition, formule encadrée en jaune, piège en orange)${f ? ` ; en lumière « ${nomBloc(f)} » : ${f.def} Encadré : ${formulesTexte(f)}. Piège : ${f.attention}` : '.'}${S.lacunes ? ` Blocs à reprendre : ${BLOCS.filter(b => statut(b) && statut(b) !== 'acquis').map(nomBloc).join(', ') || 'aucun'}.` : ''}`;
}
$('suiv').onclick = () => (S.page === 1 ? aller(2, 'next') : aller(1, 'previous', null, true));
// Imprimer / PDF : la fiche entière et la page de l'élève, sur fond blanc (shared/tableau/imprimer.js).
$('imprimer').onclick = () => {
  const avant = { page: S.page, focus: S.focus, apparu: S.apparu.slice() };
  window.Tableau.imprimer({ titre: 'Ce qu’il faut retenir — suivi temporel, vitesse de réaction', scene,
    pages: [{ nom: 'la fiche', preparer: () => { S.page = 1; S.focus = null; S.apparu = BLOCS.map(() => AVANT); } },
            { nom: 'ta page : à retravailler', preparer: () => { S.page = 2; S.focus = null; } }],
    restaurer: () => { Object.assign(S, avant); } });
  pont.noter('imprimer', { pages: 2 }); pont.emettre();
};
canvas.addEventListener('pointerdown', e => {
  if (S.page !== 1) return;
  const r = canvas.getBoundingClientRect(), [x, y] = scene.local(e.clientX - r.left, e.clientY - r.top);
  const i = BLOCS.findIndex((b, k) => { const p = POS[k]; return p && S.apparu[k] != null && !(MOITIE && (k >= 4 ? 1 : 0) !== moitieVue()) && x >= p.x - 6 && x <= p.x + p.w + 6 && y >= p.y0 - 6 && y <= p.y0 + p.h; });
  if (i < 0 && MOITIE && y < HAUT) { S.focus = BLOCS[moitieVue() ? 0 : 4].id; BLOCS.forEach((b, k) => { if (S.apparu[k] == null) S.apparu[k] = AVANT; }); scene.sale = true; pont.emettre(); return; }   // l'en-tête : l'autre moitié
  if (i < 0) return;
  S.focus = BLOCS[i].id; scene.sale = true; bulle($('feedback'), BLOCS[i].def);
  pont.noter('touche', { moment: BLOCS[i].id }); pont.emettre();
});

window.Tableau.explication({ bilan: BLOCS.map(b => ({ repere: b.id, texte: b.def + ' Encadré : ' + formulesTexte(b) + '. Piège : ' + b.attention })) });
const commandes = ['start', 'reset', 'play_until', 'set_parameters', 'next', 'previous'];
const config = { id: 'cinetique_bilan', version: '1.0', title: 'Ce qu’il faut retenir — suivi temporel, vitesse de réaction', variants: [{ id: 'bilan', label: 'fiche' }], commands: commandes,
  command_schema: { play_until: { moment: Object.keys(moments()).join(' | ') + ' (écrit ce bloc de la fiche et le met en lumière ; fiche ou fin = toute la fiche ; lacunes = la page de l’élève)' },
    set_parameters: { lacunes: '[{id: C1..C8, label, statut: non_acquis|partiel, reprendre_avec: [..]}] (bilan de l’élève)', acquis: '[labels acquis]', acquis_ids: '[C1, ..]' } } };
const pont = protocole({ id: config.id, commandes, config,
  texte: 'Fiche « Ce qu’il faut retenir » du chapitre « Suivi temporel d’une transformation, vitesse de réaction », sur une page (huit blocs : suivre une transformation (titrage, conductimétrie, pression ; trempe) ; tableau d’avancement (x_max, réactif limitant) ; mesurer x (n(I₂) = x ; x = x_max·(σ₀ − σ)/(σ₀ − σ_f) ; x = (P − P₀)·V/(R·T)) ; la courbe x(t) (lire x, composition, x_f) ; vitesse v(t) = (1/V)·dx/dt (tangente, V en L) ; évolution de la vitesse (v diminue, plus chaud plus vite, v = 0 à la fin) ; temps de demi-réaction x(t₁/₂) = x_f/2 (x_f/2, pas t/2 ; à 2·t₁/₂ pas finie) ; rédiger un calcul (relation, application numérique, résultat avec unité) ; chacun avec définition, formule encadrée, piège), puis la page de l’élève (ce qu’il lui reste à retravailler).',
  etat: () => ({ simulation_status: 'paused', ce_qui_se_voit: ceQuiSeVoit(), current_variant: 'bilan', time_s: S.page, parameters: { page: S.page, focus: S.focus, lacunes: S.lacunes ? S.lacunes.length : null }, moments: moments() }),
  progression: () => S.page / 2,
  executer: (cmd, p) => ({ start: () => aller(1, 'start', 'suivi'), reset: () => aller(1, 'reset', 'suivi'), play_until: () => playUntil(p), set_parameters: () => setParameters(p),
    next: () => aller(2, 'next'), previous: () => aller(1, 'previous', null, true) })[cmd]?.() });
aller(1, 'start', 'suivi');   // la voix commence par le suivi : le premier bloc s'écrit et est en lumière
window.__bilan = { S, scene, BLOCS, POS };   // pour les vérifications automatiques
</script>
