</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>

<script>
/*
 * Le temps de demi-réaction (cours « Suivi temporel d’une transformation, vitesse de réaction », phys_ch10_cinetique, 2e Bac PC BIOF).
 * Contrat : outils/cours/notes/cours/cinetique_contrat_simulations.md § 7. Moteur, formules et zone d’écriture : copie de
 * chimie/transformations-lentes-rapides-tableau/courbes.html. Vues (?vue=) : definition (défaut) | lecture | piege | comparer.
 * Pas de poignée : rien à régler (set_parameters ne change que la vue).
 */
/* ── Formules chimiques à la craie : indices ₂ et charges ⁺ ⁻ ²⁻ rendus (sans modifier exposants.js ni le kit) ──────────
 * « MnO₄⁻ » devient « MnO_{4}^{−} » ; le découpage « _{…} » accepte tout caractère avant (« [I⁻]₀ »). */
(function () {
  const C = window.Tableau.Craie, P = C.prototype, texteAvant = P.texte, segAvant = C.segments;
  const SUP = { '⁺': '+', '⁻': '−', '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9' };
  const SUB = { '₀': '0', '₁': '1', '₂': '2', '₃': '3', '₄': '4', '₅': '5', '₆': '6', '₇': '7', '₈': '8', '₉': '9' };
  const chim = s => String(s).replace(/[⁺⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, g => '^{' + [...g].map(ch => SUP[ch]).join('') + '}')
    .replace(/[₀₁₂₃₄₅₆₇₈₉]+/g, g => '_{' + [...g].map(ch => SUB[ch]).join('') + '}');
  C.segments = function (s) {
    const out = [], re = /_\{([^}]+)\}/g; let i = 0, m;
    while ((m = re.exec(s))) { if (m.index > i) out.push(...segAvant(s.slice(i, m.index))); out.push({ t: m[1], sub: true }); i = re.lastIndex; }
    if (i < s.length) out.push(...segAvant(s.slice(i)));
    return out;
  };
  P.texte = function (s, x, y, o) { return texteAvant.call(this, chim(s), x, y, o); };
  window.chim = chim;
})();

/* ── Moteur du déroulé (copie de physics/circuit-rlc-tableau/circuit-lc.html, + M.evs) ─────────────────────────────────── */
const { fr, bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lisse = p => p * p * (3 - 2 * p);
const lerp = (a, b, f) => a + (b - a) * f;
const fx = (v, d = 2) => fr(v, d).replace(/(,\d*?)0+$/, '$1').replace(/,$/, '');
const ECRITURE = 2.5;
function Moteur(o) {
  const q = new URLSearchParams(location.search);
  const S = { vue: o.vues.includes(q.get('vue')) ? q.get('vue') : o.vues[0], t: 0, running: false, pause: false, fait: false,
    jusqua: null, motif: '', emis: 0, dit: '', mesure: false };
  const V = o.vitesse ?? 1.7, T0 = o.T0 ?? .8, HOLD = {};
  let TL = null;
  function construire() {
    let s = T0; const ev = [];
    for (const e of o.etapes(S.vue)) {
      const anim = e.anim || 0, d = { ...e, anim, debut: s, ecrit: s + (e.ecritDes ?? anim) };
      d.fin = Math.max(s + anim, d.ecrit + (HOLD[e.nom] ?? 1.5)) + .35;
      s = d.fin; ev.push(d);
    }
    const mom = {}; for (const e of ev) mom[e.nom] = e.fin; mom.fin = s + (o.queue ?? .6);
    TL = { ev, M: mom };
  }
  const ev = nom => TL.ev.find(e => e.nom === nom);
  const M = {
    S, ev, evs: () => TL.ev, Moments: () => TL.M,
    p(nom) { const e = ev(nom); if (!e) return 0; return e.anim > 0 ? clamp((S.t - e.debut) / e.anim, 0, 1) : (S.t >= e.debut - 1e-6 ? 1 : 0); },
    commence(nom) { const e = ev(nom); return !!e && S.t > e.debut + 1e-6; },
    vu(nom) { if (nom === 'fin') return S.t >= TL.M.fin - 1e-6; const e = ev(nom); return !!e && S.t >= e.fin - 1e-6; },
    etape(c, nom, fn) {
      const e = ev(nom); if (!e) return;
      const t = c.t, cur = c.cur, comp = c.complet, w0 = e.ecrit;
      c.t = S.t > 1e5 ? 1e9 : w0 + (S.t - w0) * V; c.cur = w0;
      try { fn(); } finally { if (S.mesure) HOLD[nom] = Math.max(HOLD[nom] || 0, (c.cur - w0) / V); c.t = t; c.cur = cur; if (!S.running) c.complet = comp; }
    },
    etat() { return S.running ? 'en cours' : S.fait ? 'fin' : S.pause ? 'arrêt sur image' : 'pas encore lancée'; },
  };
  const scene = window.OndesTableau.Scene($('canvas'), (c) => o.dessiner(c, M));
  const cadreBase = scene.cadre;
  scene.cadre = function (g) { const k = cadreBase.call(scene, g); if (Number.isFinite(k.t)) k.t *= ECRITURE; return k; };
  M.scene = scene; M.craie = scene.craie;
  function calculer() {
    construire();
    const t = S.t, r = S.running; S.t = 1e6; S.running = false; S.mesure = true;
    for (const k of Object.keys(HOLD)) delete HOLD[k];   // une étape dessinée en plusieurs morceaux garde le plus long (max ci-dessus)
    try { o.dessiner(scene.craie, M); } finally { S.t = t; S.running = r; S.mesure = false; }
    construire(); scene.sale = true;
  }
  const sansSouligne = s => String(s).replace(/([A-Za-zΔτθ])_\{?([A-Za-z0-9]+)\}?/g, (m, a, i) => a + (/^\d+$/.test(i) ? [...i].map(d => '₀₁₂₃₄₅₆₇₈₉'[d]).join('') : i));
  const dire = (texte, kind = '') => { texte = sansSouligne(texte); S.dit = texte; bulle($('feedback'), texte, kind); };
  const etiquette = () => { $('run').textContent = S.running ? 'Pause' : S.pause ? 'Reprendre' : S.fait ? 'Rejouer' : 'Lancer'; };
  let pont = null;
  const emettre = () => pont && pont.emettre();
  const noter = (a, d) => pont && pont.noter(a, d);
  scene.avancer = dt => {
    if (!S.running) return !!(o.anime && o.anime());
    const avant = S.t; S.t += dt;
    for (const e of TL.ev) if (avant < e.debut && S.t >= e.debut && e.bulle) dire(e.bulle());
    if (S.jusqua != null && S.t >= S.jusqua) {
      S.t = S.jusqua; S.jusqua = null; S.running = false;
      if (S.t >= TL.M.fin - 1e-6) { finir(); return true; }
      S.pause = true; etiquette(); dire('Arrêt sur image : ' + (S.motif || `t = ${fx(S.t, 1)} s`) + '.');
      noter('pause', { time_s: +S.t.toFixed(2) }); emettre(); return true;
    }
    if (S.t >= TL.M.fin) { S.t = TL.M.fin; finir(); return true; }
    if (performance.now() - S.emis > 500) { S.emis = performance.now(); emettre(); }
    return true;
  };
  function finir() { S.running = false; S.fait = true; S.pause = false; S.jusqua = null; etiquette(); dire(o.messageFin(M), 'good'); noter('measurement', o.params(M)); emettre(); }
  function start() { o.reprise && o.reprise(); S.t = 0; S.jusqua = null; S.motif = ''; S.running = true; S.pause = false; S.fait = false; etiquette(); dire(o.depart(M)); noter('start', o.params(M)); emettre(); }
  function pause() { if (!S.running) return; S.running = false; S.pause = true; S.jusqua = null; etiquette(); dire('Arrêt sur image.'); noter('pause', { time_s: +S.t.toFixed(2) }); emettre(); }
  function resume() { if (S.running) return; o.reprise && o.reprise(); if (!S.pause) return start(); S.running = true; S.pause = false; etiquette(); dire('Ça repart…'); noter('resume'); emettre(); }
  function setTime(p) {
    const t = +p.time_s; if (p.time_s === null || p.time_s === '' || !Number.isFinite(t)) return;
    o.reprise && o.reprise(); S.running = false; S.jusqua = null; S.t = clamp(t, 0, TL.M.fin); S.fait = S.t >= TL.M.fin - 1e-6; S.pause = !S.fait && S.t > 0;
    etiquette(); scene.sale = true; dire(`Arrêt sur image : t = ${fx(S.t, 1)} s.`); noter('set_time', { time_s: S.t }); emettre();
  }
  function playUntil(p) {
    const noms = o.etapes(S.vue).map(e => e.nom).concat('fin');
    const nom = noms.includes(p.moment) ? p.moment : null, cible = nom ? TL.M[nom] : +p.time_s;
    if (!Number.isFinite(cible) || (p.moment && !nom && (p.time_s == null || p.time_s === ''))) { dire(`Moment inconnu : ${p.moment}.`, 'bad'); emettre(); return; }
    o.reprise && o.reprise();
    if (S.fait || S.t >= cible - 1e-3) { S.t = 0; S.fait = false; }
    S.jusqua = clamp(cible, .01, TL.M.fin); S.motif = nom ? (o.motifs[nom] || nom) : ''; S.running = true; S.pause = false; etiquette(); dire('Observe…');
    noter('play_until', { moment: nom, time_s: S.jusqua }); emettre();
  }
  function setParameters(p) {
    p = p || {};
    const r = o.appliquer(p, M) || {};
    if (r.vue && o.vues.includes(r.vue) && r.vue !== S.vue) { S.vue = r.vue; r.change = true; r.vueChange = true; }
    if (r.change) { calculer(); if (r.vueChange) scene.reecrire(); }
    noter('set_parameters', o.params(M));
    if (r.apres) r.apres();
    else if (r.change && !r.garder) start();
    else { scene.sale = true; emettre(); }
  }
  Object.assign(M, { noter, calculer, dire, start, pause, resume, setTime, playUntil, setParameters, emettre, etiquette });
  $('run').onclick = () => (S.running ? pause() : S.pause ? resume() : start());
  window.Tableau.explication(o.explications);
  const commandes = ['start', 'reset', 'pause', 'resume', 'set_time', 'set_parameters', 'play_until'];
  M.lancer = () => {
    calculer();
    const listeMoments = o.vues.map(v => `${o.vues.length > 1 ? v + ' : ' : ''}${o.etapes(v).map(e => e.nom).concat('fin').join(' | ')}`).join(' ; ');
    const config = { id: o.id, version: '1.0', title: o.titre, variants: o.vues.length > 1 ? o.vues.map(id => ({ id, label: o.titres[id] })) : [], commands: commandes,
      command_schema: { set_parameters: o.schema, set_time: { time_s: '0..fin (arrêt sur cet instant de la scène, en s ; voir moments)' },
        play_until: { moment: listeMoments, time_s: 'ou un instant en s' } } };
    pont = protocole({ id: o.id, commandes, config, texte: o.texte,
      etat: () => ({ simulation_status: S.running ? 'running' : S.fait ? 'finished' : S.pause ? 'paused' : 'idle',
        ce_qui_se_voit: o.voir(M) + (S.dit ? ` La bulle dit : « ${S.dit} »` : ''), current_variant: S.vue, time_s: +S.t.toFixed(2),
        parameters: o.params(M), moments: Object.fromEntries(Object.entries(TL.M).map(([k, v]) => [k, +v.toFixed(2)])) }),
      progression: () => (S.fait ? 1 : 0),
      executer: (cmd, p) => ({ start, reset: start, pause, resume, set_time: () => setTime(p), set_parameters: () => setParameters(p), play_until: () => playUntil(p) })[cmd]?.() });
    dire(o.depart(M));
    setTimeout(() => { if (!S.running && S.t === 0 && !S.pause && !S.fait) start(); }, 900);
  };
  return M;
}
/** Zone d’écriture du bas : le professeur efface les plus vieilles lignes (copie du modèle). */
function zoneEcriture(c, M, liste, ys, o = {}) {
  const S = M.S, x = o.x ?? 14, max = o.max ?? 730, taille = o.taille ?? 17, n = ys.length, vues = [];
  if (S.mesure) {
    for (const e of liste) M.etape(c, e.nom, () => { for (const [t, col] of e.lignes) c.texte(t, x, ys[0], { couleur: col, taille, max }); e.plus && e.plus(c); });
    return vues;
  }
  let k = -1;
  liste.forEach((e, j) => { const ev = M.ev(e.nom); if (ev && S.t > ev.ecrit + .05) k = j; });
  const garde = new Set(); let nb = 0;
  for (let j = k; j >= 0; j--) { const l = liste[j].lignes.length; if (nb + l > n) break; garde.add(j); nb += l; }
  let y = 0;
  liste.forEach((e, j) => {
    if (j > k) return;
    M.etape(c, e.nom, () => {
      if (garde.has(j)) for (const [t, col] of e.lignes) { c.texte(t, x, ys[y++], { couleur: col, taille, max }); vues.push(t); }
      e.plus && e.plus(c);
    });
  });
  return vues;
}
/** Largeur (cadre) d’une formule écrite à la craie, indices et charges compris. */
function larg(c, s, taille = 17) {
  const T = window.Tableau, ctx = c.ctx; if (c.echelle && c.tailleMin) taille = Math.max(taille, c.tailleMin / c.echelle);
  return T.Craie.segments(window.chim(s)).reduce((w, g) => { ctx.font = `${(g.sub || g.sup) ? taille * .62 : taille}px ${T.POLICE}`; return w + ctx.measureText(g.t).width; }, 0);
}
/** Équation « gauche → droite » : la flèche est DESSINÉE (la police n’a pas toutes les flèches). Renvoie { x, w }. */
function eqn(c, x, y, gauche, droite, o = {}) {
  const t = o.taille ?? 17, w1 = larg(c, gauche, t), w2 = larg(c, droite, t), fl = 30, tot = w1 + fl + 16 + w2;
  const x0 = o.align === 'center' ? x - tot / 2 : o.align === 'right' ? x - tot : x, col = o.couleur ?? 'blanc';
  c.texte(gauche, x0, y, { couleur: col, taille: t });
  c.fleche(x0 + w1 + 8, y - t * .3, x0 + w1 + 8 + fl, y - t * .3, { couleur: col, largeur: 1.8, tete: 7 });
  c.texte(droite, x0 + w1 + 16 + fl, y, { couleur: col, taille: t });
  return { x: x0, w: tot };
}
/** Petit triangle « attention » à la craie (orange), le « ! » dedans. */
function attention(c, x, y, o = {}) {
  const col = o.couleur ?? 'orange', h = o.h ?? 16;
  c.trait([[x, y], [x + h * .58, y - h], [x + h * 1.16, y]], { couleur: col, largeur: 1.8, ferme: true });
  c.texte('!', x + h * .58, y - 3, { couleur: col, taille: h * .8, align: 'center' });
}

/* ── La courbe x(t) de l’exemple A (modèle pour le calcul seulement, jamais écrit) ───────────────────────────────────────
 * x(t) = 2,0·(1 − e^(−t/8)) mmol à 20 °C ; à 40 °C, trois fois plus vite (t/8 → 3t/8). t₁/₂ = 8·ln 2 ≈ 5,5 min ; à 40 °C ≈ 1,8 min.
 * x(11 min) ≈ 1,49 ≈ 1,5 mmol (à 2·t₁/₂ : 1,5 mmol, pas 2,0). */
const VUES = ['definition', 'lecture', 'piege', 'comparer'];
const TITRES = { definition: 'la définition', lecture: 'lire t₁/₂ sur la courbe', piege: 'les pièges', comparer: 'comparer deux températures' };
const G = { x0: 70, y0: 282, w: 400, h: 212 }, TMAX = 40, DT = 5, YMAX = 2.5, DY = .5, XF = 2;
const X = t => G.x0 + t / TMAX * G.w, Y = x => G.y0 - x / YMAX * G.h;
const xDe = (t, k = 1) => XF * (1 - Math.exp(-k * t / 8));
const TD = 8 * Math.LN2, TD40 = 8 * Math.LN2 / 3, T2 = 11, X2 = xDe(T2);   // 5,545 min ; 1,848 min ; x(11) = 1,494 mmol
const COURBES = { courbe: { k: 1, couleur: 'bleu' }, courbe_lente: { k: 1, couleur: 'bleu', tag: '20 °C' }, courbe_rapide: { k: 3, couleur: 'rouge', tag: '40 °C' } };
const ETAPES = {
  definition: [
    { nom: 'courbe', anim: 3, motif: 'la courbe x(t) de l’exemple A', bulle: () => 'Voici la courbe x(t) de l’exemple A, à 20 °C.' },
    { nom: 'palier', anim: .8, motif: 'le palier : x_f = 2,0 mmol', bulle: () => 'À la fin, la courbe atteint un palier.' },
    { nom: 'moitie', anim: .8, motif: 'la moitié : x_f/2 = 1,0 mmol', bulle: () => 'Prenons la moitié de x_f.' },
    { nom: 'definition', anim: .2, motif: 'la définition du temps de demi-réaction t₁/₂', bulle: () => 'Le temps de demi-réaction…' },
    { nom: 'relation', anim: .8, motif: 'la relation x(t₁/₂) = x_f/2', bulle: () => 'Ce qu’on écrit sur la copie.' },
  ],
  lecture: [
    { nom: 'x_f', anim: .8, motif: '1) le palier : x_f = 2,0 mmol', bulle: () => 'Geste 1 : lire x_f sur le palier.' },
    { nom: 'moitie', anim: .6, motif: '2) x_f/2 = 1,0 mmol marqué sur l’axe x', bulle: () => 'Geste 2 : la moitié, sur l’axe x.' },
    { nom: 'horizontale', anim: 1, motif: '3) l’horizontale jusqu’à la courbe', bulle: () => 'Geste 3 : on part à l’horizontale.' },
    { nom: 'verticale', anim: 1, motif: '4) la verticale jusqu’à l’axe t', bulle: () => 'Geste 4 : on descend jusqu’à l’axe t.' },
    { nom: 'valeur', anim: .2, motif: 't₁/₂ ≈ 5,5 min', bulle: () => 'On lit la valeur.' },
  ],
  piege: [
    { nom: 'courbe', anim: 3, motif: 'la courbe x(t), palier x_f = 2,0 mmol', bulle: () => 'La courbe de l’exemple A.' },
    { nom: 't_demi', anim: .8, motif: 'à t₁/₂ ≈ 5,5 min : x = 1,0 mmol', bulle: () => 'À t₁/₂, x vaut la moitié de x_f.' },
    { nom: 'double', anim: .8, motif: 'à 2·t₁/₂ ≈ 11 min', bulle: () => 'Et au double, à 11 min ?' },
    { nom: 'pas_fini', anim: .8, motif: 'à 2·t₁/₂ : x ≈ 1,5 mmol, pas 2,0 : pas finie', bulle: () => 'Attention : x n’est pas encore 2,0 mmol.' },
    { nom: 'piege_axe', anim: .2, motif: 'piège : x_f/2, jamais t_final/2', bulle: () => 'Le second piège : la moitié de quoi ?' },
  ],
  comparer: [
    { nom: 'axes', anim: .2, motif: 'les axes : x en mmol, t en min', bulle: () => 'Même mélange, à deux températures.' },
    { nom: 'courbe_lente', anim: 3, motif: 'la courbe à 20 °C', bulle: () => 'À 20 °C…' },
    { nom: 'courbe_rapide', anim: 2.2, motif: 'la courbe à 40 °C, même palier', bulle: () => 'À 40 °C…' },
    { nom: 'deux_t_demi', anim: 1.2, motif: 'les deux t₁/₂ : 1,8 min (40 °C) et 5,5 min (20 °C)', bulle: () => 'Lisons les deux t₁/₂.' },
    { nom: 'conclusion', anim: .2, motif: 'plus t₁/₂ est petit, plus la transformation est rapide', bulle: () => 'Que conclure ?' },
  ],
};
const MOTIFS = new Proxy({}, { get: (_, nom) => (nom === 'fin' ? 'fin' : (ETAPES[MO ? MO.S.vue : VUES[0]].find(e => e.nom === nom) || {}).motif) });
let MO = null;
const ZY = [352, 376, 400];
const PX = 506;   // panneau de droite

/* ── Dessin ──────────────────────────────────────────────────────────── */
function axes(c) {
  c.fleche(G.x0, G.y0, G.x0 + G.w + 16, G.y0, { largeur: 1.8 });
  c.fleche(G.x0, G.y0, G.x0, G.y0 - G.h - 14, { largeur: 1.8 });
  for (let t = DT; t <= TMAX + 1e-9; t += DT) { c.ligne(X(t), G.y0 - 4, X(t), G.y0 + 4, { largeur: 1.4, duree: .03 }); c.texte(fx(t, 0), X(t), G.y0 + 21, { couleur: 'faible', taille: 15, align: 'center', duree: .1 }); }
  c.texte('0', G.x0 - 8, G.y0 + 18, { couleur: 'faible', taille: 15, align: 'right', duree: .05 });
  for (let n = DY; n <= YMAX - DY / 2; n += DY) { c.ligne(G.x0 - 4, Y(n), G.x0 + 4, Y(n), { largeur: 1.4, duree: .03 }); c.texte(fr(n, 1), G.x0 - 9, Y(n) + 5, { couleur: 'faible', taille: 15, align: 'right', duree: .1 }); }
  c.texte('t (min)', G.x0 + G.w + 18, G.y0 + 5, { couleur: 'blanc', taille: 16 });
  c.texte('x (mmol)', G.x0 + 10, G.y0 - G.h - 6, { couleur: 'blanc', taille: 16 });
}
function quadrillage(c, a) {
  const ctx = c.ctx;
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = 'rgba(226,232,240,.09)'; ctx.lineWidth = 1;
  for (let t = DT / 2; t <= TMAX + 1e-9; t += DT / 2) { ctx.beginPath(); ctx.moveTo(X(t), G.y0); ctx.lineTo(X(t), G.y0 - G.h); ctx.stroke(); }
  for (let n = .25; n <= YMAX + 1e-9; n += .25) { ctx.beginPath(); ctx.moveTo(G.x0, Y(n)); ctx.lineTo(G.x0 + G.w, Y(n)); ctx.stroke(); }
  ctx.restore();
}
/** Trace la courbe `id` jusqu’à la part p (0 → 1) de la durée affichée. */
function trace(c, id, p) {
  const k = COURBES[id]; if (p <= 0) return;
  c.courbe(u => [X(u * p * TMAX), Y(xDe(u * p * TMAX, k.k))], Math.max(16, Math.round(120 * p)), { couleur: k.couleur, largeur: 2.6 });
}
/** Palier : trait pointillé et sa valeur. */
function palier(c, texte, col = 'jaune') {
  c.ligne(G.x0, Y(XF), G.x0 + G.w, Y(XF), { couleur: col, largeur: 1.8, pointille: [6, 6] });
  if (texte) c.texte(texte, G.x0 + G.w - 2, Y(XF) - 9, { couleur: col, taille: 16, align: 'right' });
}
/** Lecture d’un point : horizontale depuis l’axe x (h) et verticale jusqu’à l’axe t (v), en pointillé. */
const horizontale = (c, x, t, col = 'jaune') => c.ligne(G.x0, Y(x), X(t), Y(x), { couleur: col, largeur: 1.8, pointille: [5, 5] });
const verticale = (c, x, t, col = 'jaune') => c.ligne(X(t), Y(x), X(t), G.y0, { couleur: col, largeur: 1.8, pointille: [5, 5] });
/** Panneau de droite : lignes de texte (taille 17), avec un cadre facultatif. */
function panneau(c, y, lignes, o = {}) {
  const col = o.couleur ?? 'blanc', t = o.taille ?? 17, pas = t + 7;
  if (o.cadre) c.rect(PX - 8, y - t - 6, 250, lignes.length * pas + 12, { couleur: o.cadre, largeur: 2, arrondi: 8 });
  lignes.forEach((l, i) => c.texte(l, PX + (o.dx ?? 0), y + i * pas, { couleur: col, taille: t, max: 236 - (o.dx ?? 0) }));
}
function dessiner(c, M) {
  MO = M; M.scene.cadre(61);
  const v = M.S.vue;
  c.texte(`Temps de demi-réaction : ${TITRES[v]}`, 14, 26, { couleur: 'cyan', taille: 20, max: 600 });
  // Lecture : la courbe est déjà au tableau quand le premier geste commence.
  if (v === 'lecture') { c.direct(() => quadrillage(c, 1)); axes(c); trace(c, 'courbe', 1); }
  else {
    const n0 = v === 'comparer' ? 'axes' : 'courbe';
    if (M.commence(n0)) c.direct(() => quadrillage(c, lisse(M.p(n0))));
  }
  c.direct(() => {
    if (v === 'definition' || v === 'piege') { if (M.commence('courbe')) trace(c, 'courbe', M.p('courbe')); }
    if (v === 'comparer') for (const id of ['courbe_lente', 'courbe_rapide']) if (M.commence(id)) trace(c, id, M.p(id));
  });
  let vues = [];
  if (v === 'definition') vues = zoneEcriture(c, M, [
    { nom: 'courbe', lignes: [['exemple A, à 20 °C : on suit l’avancement x au cours du temps', 'blanc']], plus: () => axes(c) },
    { nom: 'palier', lignes: [['palier : x_f = 2,0 mmol, l’avancement final', 'jaune']], plus: () => palier(c, 'palier : x_f = 2,0 mmol') },
    { nom: 'moitie', lignes: [['la moitié de la valeur finale : x_f/2 = 1,0 mmol', 'jaune']],
      plus: () => { horizontale(c, XF / 2, TD); c.point(X(TD), Y(XF / 2), 4.5, 'jaune'); c.texte('x_f/2 = 1,0 mmol', X(TD) + 12, Y(XF / 2) + 22, { couleur: 'jaune', taille: 16 }); } },
    { nom: 'definition', lignes: [['t₁/₂ : durée au bout de laquelle l’avancement atteint la moitié de sa valeur finale', 'blanc']],
      plus: () => panneau(c, 92, ['Temps de demi-réaction', 't₁/₂ : durée au bout de laquelle', 'l’avancement atteint la', 'moitié de sa valeur finale.'], { cadre: 'cyan' }) },
    { nom: 'relation', lignes: [['sur la copie : x(t₁/₂) = x_f/2', 'jaune']],
      plus: () => { verticale(c, XF / 2, TD); c.texte('t₁/₂', X(TD), G.y0 + 44, { couleur: 'jaune', taille: 17, align: 'center' });
        panneau(c, 232, ['x(t₁/₂) = x_f/2'], { cadre: 'jaune', couleur: 'jaune', taille: 22, dx: 30 }); } },
  ], ZY);
  else if (v === 'lecture') vues = zoneEcriture(c, M, [
    { nom: 'x_f', lignes: [['1) sur le palier, on lit x_f = 2,0 mmol', 'jaune']],
      plus: () => { palier(c, 'x_f = 2,0 mmol'); panneau(c, 92, ['1) x_f = 2,0 mmol (palier)']); } },
    { nom: 'moitie', lignes: [['2) on calcule x_f/2 = 1,0 mmol et on le marque sur l’axe x', 'jaune']],
      plus: () => { c.cercle(G.x0 - 22, Y(1) - 1, 17, { couleur: 'jaune', largeur: 1.8 }); c.ligne(G.x0 - 6, Y(1), G.x0 + 6, Y(1), { couleur: 'jaune', largeur: 3 });
        panneau(c, 122, ['2) x_f/2 = 1,0 mmol, axe x']); } },
    { nom: 'horizontale', lignes: [['3) horizontale depuis 1,0 mmol jusqu’à la courbe', 'jaune']],
      plus: () => { horizontale(c, XF / 2, TD); c.point(X(TD), Y(XF / 2), 5, 'jaune'); panneau(c, 152, ['3) horizontale → courbe']); } },
    { nom: 'verticale', lignes: [['4) verticale depuis ce point jusqu’à l’axe t', 'jaune']],
      plus: () => { verticale(c, XF / 2, TD); panneau(c, 182, ['4) verticale → axe t']); } },
    { nom: 'valeur', lignes: [['on lit : t₁/₂ ≈ 5,5 min', 'jaune']],
      plus: () => { c.texte('t₁/₂ ≈ 5,5 min', X(TD) - 8, G.y0 + 44, { couleur: 'jaune', taille: 17 });
        panneau(c, 232, ['t₁/₂ ≈ 5,5 min'], { cadre: 'jaune', couleur: 'jaune', taille: 22, dx: 40 }); } },
  ], ZY);
  else if (v === 'piege') vues = zoneEcriture(c, M, [
    { nom: 'courbe', lignes: [['exemple A : la courbe x(t), palier x_f = 2,0 mmol', 'blanc']], plus: () => { axes(c); palier(c, 'x_f = 2,0 mmol', 'faible'); } },
    { nom: 't_demi', lignes: [['à t₁/₂ ≈ 5,5 min : x = 1,0 mmol, la moitié de x_f', 'jaune']],
      plus: () => { horizontale(c, XF / 2, TD); verticale(c, XF / 2, TD); c.point(X(TD), Y(XF / 2), 4.5, 'jaune'); c.texte('t₁/₂', X(TD), G.y0 + 44, { couleur: 'jaune', taille: 17, align: 'center' }); } },
    { nom: 'double', lignes: [['à 2·t₁/₂ ≈ 11 min : que vaut x ?', 'orange']],
      plus: () => { verticale(c, X2, T2, 'orange'); c.point(X(T2), Y(X2), 4.5, 'orange'); c.texte('2·t₁/₂ ≈ 11 min', X(T2) - 14, G.y0 + 44, { couleur: 'orange', taille: 17 }); } },
    { nom: 'pas_fini', lignes: [['à 2·t₁/₂ : x ≈ 1,5 mmol, PAS 2,0 mmol : la transformation n’est pas finie', 'orange']],
      plus: () => { horizontale(c, X2, T2, 'orange'); c.texte('x ≈ 1,5 mmol', X(T2) + 12, Y(X2) + 24, { couleur: 'orange', taille: 17 });
        attention(c, PX - 6, 92, { h: 18 }); panneau(c, 92, ['à 2·t₁/₂, la transformation', 'n’est pas finie : x ≈ 1,5 mmol,', 'pas 2,0 mmol.'], { couleur: 'orange', dx: 22 }); } },
    { nom: 'piege_axe', lignes: [['⚠ x_f/2, jamais t_final/2 : la moitié se prend sur l’axe x, pas sur l’axe t', 'orange']],
      plus: () => { attention(c, PX - 6, 192, { h: 18 }); panneau(c, 192, ['x_f/2, jamais t_final/2 :', 'la moitié de l’avancement', 'final, pas d’une durée.'], { couleur: 'orange', dx: 22 }); } },
  ], ZY);

    { nom: 'axes', lignes: [['même mélange (exemple A) à 20 °C et à 40 °C ; on suit x(t)', 'blanc']], plus: () => axes(c) },
    { nom: 'courbe_lente', lignes: [['20 °C : la courbe monte lentement vers x_f = 2,0 mmol', 'bleu']], plus: () => tag(c, 'courbe_lente') },
    { nom: 'courbe_rapide', lignes: [['40 °C : même palier x_f = 2,0 mmol, atteint bien plus tôt', 'rouge']], plus: () => { tag(c, 'courbe_rapide'); palier(c, 'même palier : x_f = 2,0 mmol'); } },
    { nom: 'deux_t_demi', lignes: [['à x_f/2 = 1,0 mmol : t₁/₂ ≈ 1,8 min à 40 °C ; t₁/₂ ≈ 5,5 min à 20 °C', 'blanc']],
      plus: () => { horizontale(c, XF / 2, TD, 'faible'); verticale(c, XF / 2, TD40, 'rouge'); verticale(c, XF / 2, TD, 'bleu');
        c.point(X(TD40), Y(1), 4.5, 'rouge'); c.point(X(TD), Y(1), 4.5, 'bleu');
        c.texte('1,8', X(TD40) - 4, G.y0 + 44, { couleur: 'rouge', taille: 17, align: 'center' }); c.texte('5,5', X(TD) + 6, G.y0 + 44, { couleur: 'bleu', taille: 17, align: 'center' });

}
/** Étiquette d’une courbe (comparer) : sous la courbe, là où elle atteint 90 % du palier. */
function tagXY(id) { const k = COURBES[id], t9 = 8 / k.k * Math.LN10; return [X(t9) + 8, Y(.9 * XF) + 20]; }
function tag(c, id) { const k = COURBES[id], [x, y] = tagXY(id); c.texte(k.tag, x, y, { couleur: k.couleur, taille: 16 }); }

/* ── Repères (déclarés dès le début ; leur libellé dit à quel moment ils apparaissent) ─────────────── */
function reperes(c, M) {
  const v = M.S.vue, quand = nom => (M.vu(nom) ? '' : ` (au moment « ${nom} »)`);
  const R = (id, x, y, w, h, l) => c.repere(id, x, y, w, h, l);
  const cadreCourbe = (id, l, nom) => { const k = COURBES[id], x9 = X(Math.min(TMAX, 8 / k.k * Math.LN10)); R(id, G.x0, Y(XF) - 6, Math.max(30, x9 - G.x0 + 40), G.y0 - Y(XF) + 6, l + quand(nom)); };
  const pointT = (id, t, x, l, nom) => R(id, X(t) - 12, Y(x) - 12, 24, 24, l + quand(nom));

  } else if (v === 'lecture') {

/* ── Ce que voit le tuteur ─────────────────────────────────────────────── */
function voir(M) {
  const v = M.S.vue, m = [`Vue « ${v} » (${TITRES[v]}), ${M.etat()}.`], C = n => M.commence(n);

  m.push(`Étape en cours : ${etape}. Graphe à la craie : x (mmol) en ordonnée (0 à 2,5), t (min) en abscisse (0 à 40), quadrillage léger.`);

    if (C('courbe')) m.push('Courbe bleue x(t) de l’exemple A (20 °C) : monte vite au début, puis de moins en moins.');

    if (C('moitie')) m.push('Horizontale à x_f/2 = 1,0 mmol jusqu’à la courbe, point jaune vers t ≈ 5,5 min.');
    if (C('definition')) m.push('Encadré cyan : « t₁/₂ : durée au bout de laquelle l’avancement atteint la moitié de sa valeur finale ».');
    if (C('relation')) m.push('Verticale jusqu’à l’axe t, marquée t₁/₂ ; encadré jaune « x(t₁/₂) = x_f/2 ».');
  } else if (v === 'lecture') {
    m.push('Courbe bleue x(t) de l’exemple A déjà tracée.');
    if (C('x_f')) m.push('1) palier lu : x_f = 2,0 mmol.');
    if (C('moitie')) m.push('2) x_f/2 = 1,0 mmol entouré sur l’axe x.');
    if (C('horizontale')) m.push('3) horizontale de 1,0 mmol jusqu’à la courbe, point jaune.');
    if (C('verticale')) m.push('4) verticale du point jusqu’à l’axe t.');
    if (C('valeur')) m.push('Valeur lue : t₁/₂ ≈ 5,5 min (encadrée).');
  } else if (v === 'piege') {
    if (C('courbe')) m.push('Courbe bleue x(t), palier x_f = 2,0 mmol en pointillé.');
    if (C('t_demi')) m.push('Point jaune : à t₁/₂ ≈ 5,5 min, x = 1,0 mmol.');
    if (C('double')) m.push('Verticale orange à 2·t₁/₂ ≈ 11 min.');
    if (C('pas_fini')) m.push('À 11 min, x ≈ 1,5 mmol (pas 2,0) ; panneau orange ⚠ « à 2·t₁/₂, la transformation n’est pas finie ».');
    if (C('piege_axe')) m.push('Panneau orange ⚠ « x_f/2, jamais t_final/2 : la moitié de l’avancement final, pas d’une durée ».');
  } else {
    if (C('courbe_lente')) m.push('Courbe bleue à 20 °C.');
    if (C('courbe_rapide')) m.push('Courbe rouge à 40 °C, plus raide ; même palier x_f = 2,0 mmol.');
    if (C('deux_t_demi')) m.push('À x_f/2 = 1,0 mmol : t₁/₂ ≈ 1,8 min (40 °C, rouge) et t₁/₂ ≈ 5,5 min (20 °C, bleu).');
    if (C('conclusion')) m.push('Encadré jaune : « plus t₁/₂ est petit, plus la transformation est rapide ».');
  }
  if (M.vues && M.vues.length) m.push(`Lignes écrites en bas : ${M.vues.map(s => `« ${s} »`).join(' ; ')}.`);
  return m.join(' ');
}
const params = M => ({ vue: M.S.vue, x_f_mmol: 2.0, x_f_sur_2_mmol: 1.0, t_demi_min: 5.5, ...(M.S.vue === 'piege' ? { x_a_11_min_mmol: 1.5 } : {}), ...(M.S.vue === 'comparer' ? { t_demi_40C_min: 1.8 } : {}) });
const MOT = Moteur({

  schema: { vue: VUES.join(' | ') + ' (change la vue et relance)' },
  texte: 'Le temps de demi-réaction t₁/₂ sur la courbe x(t) de l’exemple A (H₂O₂ + I⁻ en milieu acide, x_f = x_max = 2,0 mmol). Définition : t₁/₂ est la durée au bout de laquelle l’avancement atteint la moitié de sa valeur finale ; x(t₁/₂) = x_f/2. Lecture en quatre gestes : x_f = 2,0 mmol sur le palier ; x_f/2 = 1,0 mmol sur l’axe x ; horizontale jusqu’à la courbe ; verticale jusqu’à l’axe t : t₁/₂ ≈ 5,5 min. Pièges : à 2·t₁/₂ ≈ 11 min, x ≈ 1,5 mmol et pas 2,0 (pas finie) ; x_f/2, jamais t_final/2. Comparer : à 20 °C t₁/₂ ≈ 5,5 min, à 40 °C t₁/₂ ≈ 1,8 min, même palier ; plus t₁/₂ est petit, plus la transformation est rapide.',
  explications: {
    definition: [
      { repere: 'palier', texte: 'Le palier donne x_f = 2,0 mmol.' },

      { repere: 'valeur', texte: 't₁/₂ ≈ 5,5 min.' },
    ],
    piege: [
      { repere: 't_demi', texte: 'À t₁/₂, x = 1,0 mmol.' },
      { repere: 'valeur_double', texte: 'À 2·t₁/₂, x ≈ 1,5 mmol seulement : pas finie.' },
