<script>
/*
 * Le tableau d’avancement de l’exemple A (cours « Suivi temporel d’une transformation, vitesse de réaction », 2e Bac PC BIOF, novembre 2026).
 * Contrat : outils/cours/notes/cours/cinetique_contrat_simulations.md § 2.
 * Vues (?vue=) : tableau (défaut) | limitant | lien | composition (poignée t, 0 à 40 min, défaut 8).
 * Modèle (pour le calcul seulement, jamais écrit) : x(t) = 2,0·(1 − e^(−t/8)) mmol.

/* ── Formules chimiques à la craie : indices ₂ et charges ⁺ ⁻ ²⁻ rendus (sans modifier exposants.js ni le kit) ──────────
 * « MnO₄⁻ » devient « MnO_{4}^{−} » ; le découpage « _{…} » accepte tout caractère avant (« [I⁻]₀ »). */
(function () {
  const C = window.Tableau.Craie, P = C.prototype, texteAvant = P.texte, segAvant = C.segments;
  const SUP = { '⁺': '+', '⁻': '−', '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9' };
  const SUB = { '₀': '0', '₁': '1', '₂': '2', '₃': '3', '₄': '4', '₅': '5', '₆': '6', '₇': '7', '₈': '8', '₉': '9' };
  const chim = s => String(s).replace(/[⁺⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, g => '^{' + [...g].map(ch => SUP[ch]).join('') + '}')
    .replace(/[₀₁₂₃₄₅₆₇₈₉]+/g, g => '_{' + [...g].map(ch => SUB[ch]).join('') + '}');
  C.segments = function (s) {
    const out = [], re = /_\{([^}]+)\}/g; let i = 0, m;
    while ((m = re.exec(s))) { if (m.index > i) out.push(...segAvant(s.slice(i, m.index))); out.push({ t: m[1], sub: true }); i = re.lastIndex; }
    if (i < s.length) out.push(...segAvant(s.slice(i)));
    return out;
  };
  P.texte = function (s, x, y, o) { return texteAvant.call(this, chim(s), x, y, o); };
  window.chim = chim;
})();

/* ── Moteur du déroulé (copie de physics/circuit-rlc-tableau/circuit-lc.html, + M.evs) ─────────────────────────────────── */
const { fr, bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);

function Moteur(o) {

    etiquette(); scene.sale = true; dire(`Arrêt sur image : t = ${fx(S.t, 1)} s.`); noter('set_time', { time_s: S.t }); emettre();
  }

    o.reprise && o.reprise();

    S.jusqua = clamp(cible, .01, TL.M.fin); S.motif = nom ? (o.motifs[nom] || nom) : ''; S.running = true; S.pause = false; etiquette(); dire('Observe…');

    p = p || {};
    const r = o.appliquer(p, M) || {};

    const config = { id: o.id, version: '1.0', title: o.titre, variants: o.vues.length > 1 ? o.vues.map(id => ({ id, label: o.titres[id] })) : [], commands: commandes,

        play_until: { moment: listeMoments, time_s: 'ou un instant en s' } } };

/** Zone d’écriture du bas : le professeur efface les plus vieilles lignes (copie du modèle). */

  const S = M.S, x = o.x ?? 14, max = o.max ?? 730, taille = o.taille ?? 17, n = ys.length, vues = [];

    for (const e of liste) M.etape(c, e.nom, () => { for (const [t, col] of e.lignes) c.texte(t, x, ys[0], { couleur: col, taille, max }); e.plus && e.plus(c); });

/** Équation « gauche → droite » : la flèche est DESSINÉE (la police n’a pas toutes les flèches). Renvoie { x, w }. */

const rgba = ([r, g, b, a], k = 1) => `rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},${(a * k).toFixed(3)})`;

  M.etape(c, 'lecture', () => c.texte(`x(${k.t} min) = ${f2(k.x)} mmol`, 548, 96, { couleur: 'jaune', taille: 18 }));
  M.etape(c, 'remplir', () => {
    const yb = g.ys.en_cours + 47;
    c.texte(`t = ${k.t} min`, g.x + 8, yb, { couleur: 'jaune', taille: g.taille });
    [[0, k.h2o2], [1, k.iod], [3, k.i2]].forEach(([j, val]) => c.texte(`= ${f2(val)}`, g.cx(j), yb, { couleur: 'jaune', taille: g.taille + 1, align: 'center' }));
  });
  M.etape(c, 'verifier', () => {
    c.texte(`vérification : 2,0 − ${f2(k.x)} = ${f2(k.h2o2)} mmol`, g.x + 8, g.yf + 32, { couleur: 'jaune', taille: 18 });
    c.texte(`et 10,0 − 2 × ${f2(k.x)} = ${f2(k.iod)} mmol`, g.x + 8, g.yf + 58, { couleur: 'faible', taille: 16 });
  });
  return zoneEcriture(c, M, [
    { nom: 'date', lignes: [[`on choisit une date : t = ${k.t} min (glisse l’anneau jaune sur l’axe des temps)`, 'blanc']] },
    { nom: 'lecture', lignes: [[`on lit l’avancement sur la courbe : x = ${f2(k.x)} mmol`, 'blanc']] },
    { nom: 'remplir', lignes: [['on remplace x par sa valeur dans la ligne « en cours » (en mmol)', 'blanc']] },
    { nom: 'verifier', lignes: [[`à t = ${k.t} min : H₂O₂ ${f2(k.h2o2)} ; I⁻ ${f2(k.iod)} ; I₂ ${f2(k.i2)} mmol (H⁺ en excès)`, 'jaune']] },
  ], ZY);
}

/* ── Repères ─────────────────────────────────────────────────────────── */
function reperes(c, M) {
  const v = M.S.vue, g = TB(), quand = nom => (M.vu(nom) ? '' : ` (au moment « ${nom} »)`);
  const R = (id, x, y, w, h, l) => c.repere(id, x, y, w, h, l);
  const rangee = (id, l, nom) => R(id, g.x, g.ys[id === 'ligne_initial' ? 'initial' : id === 'ligne_en_cours' ? 'en_cours' : 'final'], g.xf - g.x, id === 'ligne_en_cours' ? g.hc : g.h, l + (nom ? quand(nom) : ''));
  const colonne = (id, k, l, nom) => R(id, g.xs[k], g.y, g.cols[k], g.yf - g.y, l + (nom ? quand(nom) : ''));
  if (v === 'tableau') {
    R('equation', g.x, g.y, g.xf - g.x, g.h, `la ligne de l’équation : H₂O₂ + 2I⁻ + 2H⁺ → I₂ + 2H₂O${quand('equation')}`);
    rangee('ligne_initial', 'la ligne « état initial (x = 0) » : 2,0 · 10,0 · excès · 0 · solvant', 'etat_initial');
    rangee('ligne_en_cours', 'la ligne « en cours (x) » : 2,0 − x · 10,0 − 2x · excès · x · solvant', 'en_cours');
    rangee('ligne_final', 'la ligne « état final (x_max) » : 2,0 − x_max · 10,0 − 2x_max · excès · x_max · solvant', 'etat_final');
    colonne('colonne_h2o2', 0, 'la colonne de H₂O₂ : 2,0 ; 2,0 − x ; 2,0 − x_max');
    colonne('colonne_iodure', 1, 'la colonne de I⁻ : 10,0 ; 10,0 − 2x ; 10,0 − 2x_max');
    colonne('colonne_i2', 3, 'la colonne de I₂ : 0 ; x ; x_max');
  } else if (v === 'limitant') {
    R('hypothese_1', 18, HY.h1 - 22, 560, 30, `« si H₂O₂ est épuisé : 2,0 − x_max = 0 → x_max = 2,0 mmol »${quand('hypothese_1')}`);
    R('hypothese_2', 18, HY.h2 - 22, 560, 30, `« si I⁻ est épuisé : 10,0 − 2x_max = 0 → x_max = 5,0 mmol »${quand('hypothese_2')}`);
    R('x_max', 228, HY.pp - 26, 180, 36, `« x_max = 2,0 mmol », la plus petite${quand('plus_petite')}`);
    R('limitant', 420, HY.pp - 24, 280, 32, `« H₂O₂ est le réactif limitant »${quand('limitant')}`);
    rangee('ligne_final', 'la ligne « état final (x_max) » : 2,0 − x_max · 10,0 − 2x_max · excès · x_max · solvant', 'tableau');
  } else if (v === 'lien') {
    colonne('colonne_i2', 3, 'la colonne de I₂ (surlignée) : 0 ; x ; x_max', 'colonne_i2');
    R('egalite', g.cx(3) - 70, g.yf + 12, 140, 60, `« n(I₂) = x », à chaque date t${quand('egalite')}`);
    R('becher', BL.x - 8, BL.y - 6, BL.w + 16, BL.h + 40, `le bécher du mélange (diiode brun)${quand('mesure')}`);
    R('fleche', g.cx(3) + 56, BL.y + BL.h - 20, BL.x - g.cx(3) - 56, 32, `la flèche « on mesure n(I₂) → on connaît x »${quand('mesure')}`);
  } else {
    const k = compo(tVu()), xp = XG(k.t), yp = YG(xA(k.t)), yb = g.ys.en_cours + 47;
    R('poignee_t', xp - 18, G2.y0 - 12, 36, 24, `la poignée : glisser l’anneau jaune pour choisir la date t (${k.t} min, de 0 à 40 min)`);
    R('courbe', G2.x0, G2.y0 - G2.h, G2.w, G2.h, 'la petite courbe x(t) de l’exemple A');
    R('point_lu', xp - 10, yp - 10, 20, 20, `le point lu sur la courbe : x(${k.t} min) = ${f2(k.x)} mmol${quand('lecture')}`);
    rangee('ligne_en_cours', `la ligne « en cours » : à t = ${k.t} min, H₂O₂ ${f2(k.h2o2)} ; I⁻ ${f2(k.iod)} ; I₂ ${f2(k.i2)} mmol`, 'remplir');
    R('case_h2o2', g.xs[0], g.ys.en_cours, g.cols[0], g.hc, `la case H₂O₂ en cours : 2,0 − x = ${f2(k.h2o2)} mmol${quand('remplir')}`);
    R('case_iodure', g.xs[1], g.ys.en_cours, g.cols[1], g.hc, `la case I⁻ en cours : 10,0 − 2x = ${f2(k.iod)} mmol${quand('remplir')}`);
    R('case_i2', g.xs[3], g.ys.en_cours, g.cols[3], g.hc, `la case I₂ en cours : x = ${f2(k.i2)} mmol${quand('remplir')}`);
    void yb;
  }
}

/* ── Ce que voit le tuteur ─────────────────────────────────────────────── */
function voir(M) {
  const v = M.S.vue, m = [`Vue « ${v} » (${TITRES[v]}), ${M.etat()}.`];
  const etape = (() => { let n = 'avant le début'; for (const e of M.evs()) if (M.commence(e.nom)) n = e.nom; return n; })();
  m.push(`Étape en cours : ${etape}.`);
  const L = id => `« ${LIGNES[id].nom} » : ${LIGNES[id].v.join(' · ')}`;
  const tout = `Tableau d’avancement (mmol) : équation H₂O₂ + 2I⁻ + 2H⁺ → I₂ + 2H₂O ; ${L('initial')} ; ${L('en_cours')} ; ${L('final')}.`;
  if (v === 'tableau') {
    const vus = [['equation', 'ligne de l’équation (colonnes H₂O₂ · I⁻ · H⁺ · I₂ · H₂O)'], ['etat_initial', L('initial')], ['en_cours', L('en_cours') + ' ; sous le tableau en jaune : − x, − 2x, + x'], ['etat_final', L('final')]].filter(([n]) => M.commence(n)).map(([, s]) => s);
    m.push(vus.length ? `Tableau à la craie (mmol, V = 100 mL) : ${vus.join(' ; ')}.` : 'Tableau pas encore écrit.');
  } else if (v === 'limitant') {
    if (M.commence('tableau')) m.push(tout);
    if (M.commence('hypothese_1')) m.push('Écrit : « si H₂O₂ est épuisé : 2,0 − x_max = 0 → x_max = 2,0 mmol ».');
    if (M.commence('hypothese_2')) m.push('Écrit : « si I⁻ est épuisé : 10,0 − 2x_max = 0 → x_max = 5,0 mmol ».');
    if (M.commence('plus_petite')) m.push('Écrit en jaune : « on garde la plus petite : x_max = 2,0 mmol ».');
    if (M.commence('limitant')) m.push('Écrit : « H₂O₂ est le réactif limitant » ; la case H₂O₂ de l’équation est entourée.');
  } else if (v === 'lien') {
    if (M.commence('tableau')) m.push(tout);
    if (M.commence('colonne_i2')) m.push('La colonne I₂ est surlignée en jaune (0 ; x ; x_max).');
    if (M.commence('egalite')) m.push('Écrit sous la colonne : « n(I₂) = x », à chaque date t.');
    if (M.commence('mesure')) m.push('À droite : un bécher du mélange (diiode brun) et une flèche ; écrit : « on mesure n(I₂) → on connaît x ».');
  } else {
    const k = compo(tVu());
    m.push(`${tout} À droite, petite courbe x(t) (0 à 40 min, palier vers 2,0 mmol). Poignée (anneau jaune sur l’axe des temps) : t = ${k.t} min.`);
    if (M.commence('date')) m.push(`Pointillé vertical à t = ${k.t} min.`);
    if (M.commence('lecture')) m.push(`Point lu sur la courbe et pointillé horizontal : x(${k.t} min) = ${f2(k.x)} mmol.`);
    if (M.commence('remplir')) m.push(`Ligne « en cours » remplie : H₂O₂ = ${f2(k.h2o2)} ; I⁻ = ${f2(k.iod)} ; H⁺ excès ; I₂ = ${f2(k.i2)} mmol.`);
    if (M.commence('verifier')) m.push(`Écrit : « vérification : 2,0 − ${f2(k.x)} = ${f2(k.h2o2)} mmol » et « 10,0 − 2 × ${f2(k.x)} = ${f2(k.iod)} mmol ».`);
  }
  if (M.vues && M.vues.length) m.push(`Lignes écrites en bas : ${M.vues.map(s => `« ${s} »`).join(' ; ')}.`);
  return m.join(' ');
}
const params = M => {
  const v = M.S.vue, p = { vue: v, n0_H2O2_mmol: 2, n0_I_mmol: 10, x_max_mmol: 2 };
  if (v === 'composition') { const k = compo(PAR.t); Object.assign(p, { t: PAR.t, x_mmol: k.x, n_H2O2_mmol: k.h2o2, n_I_mmol: k.iod, n_I2_mmol: k.i2 }); }
  return p;
};
const MOT = Moteur({
  id: 'cin_avancement', titre: 'Le tableau d’avancement de l’exemple A : tableau, réactif limitant, n(I₂) = x, composition à une date', vues: VUES, titres: TITRES,
  etapes: ETAPES, motifs: MOTIFS, dessiner, voir, params,
  depart: M => ({ tableau: 'Construisons le tableau d’avancement de l’exemple A.', limitant: 'Quel réactif est épuisé le premier ?', lien: 'Comment connaître x à une date ?',
    composition: 'Quelle est la composition du mélange à une date t ?' })[M.S.vue],
  messageFin: M => ({ tableau: 'État initial, en cours (x), état final (x_max) : chaque case dépend de x et des coefficients.',
    limitant: 'x_max = 2,0 mmol (la plus petite valeur) : H₂O₂ est le réactif limitant.',
    lien: 'n(I₂) = x : mesurer la quantité de diiode, c’est connaître l’avancement.',
    composition: (() => { const k = compo(PAR.t); return `À t = ${k.t} min : x = ${f2(k.x)} mmol ; H₂O₂ ${f2(k.h2o2)} ; I⁻ ${f2(k.iod)} ; I₂ ${f2(k.i2)} mmol.`; })() })[M.S.vue],
  appliquer: (p, M) => {
    const r = {};
    if (VUES.includes(p.vue)) r.vue = p.vue;
    if (p.t != null && p.t !== '' && Number.isFinite(+p.t)) { PAR.t = clamp(Math.round(+p.t), 0, 40); DRAG = null; r.vue = 'composition'; r.change = true; }
    else r.change = !!(r.vue && r.vue !== M.S.vue);
    return r;
  },
  schema: { vue: VUES.join(' | ') + ' (change la vue et relance)', t: '0..40 (min, pas 1 ; date choisie de la vue composition, défaut 8 ; relance)' },
  texte: 'Tableau d’avancement de l’exemple A : H₂O₂ + 2I⁻ + 2H⁺ → I₂ + 2H₂O (100 mL), en mmol. État initial (x = 0) : 2,0 · 10,0 · excès · 0 · solvant ; en cours (x) : 2,0 − x · 10,0 − 2x · excès · x · solvant ; état final (x_max) : 2,0 − x_max · 10,0 − 2x_max · excès · x_max · solvant. Réactif limitant : 2,0 − x_max = 0 → x_max = 2,0 mmol ; 10,0 − 2x_max = 0 → x_max = 5,0 mmol ; on garde la plus petite : x_max = 2,0 mmol, H₂O₂ limitant. Lien : n(I₂) = x ; on mesure n(I₂) → on connaît x. Composition : poignée t (0 à 40 min, défaut 8) ; à 8 min, x = 1,26 ; H₂O₂ 0,74 ; I⁻ 7,48 ; I₂ 1,26 mmol ; vérification 2,0 − 1,26 = 0,74 mmol.',
  explications: {
    tableau: [
      { repere: 'equation', texte: 'L’équation en tête, une colonne par espèce.' },
      { repere: 'ligne_initial', texte: 'L’état initial : x = 0.' },
      { repere: 'ligne_en_cours', texte: 'En cours : on retire x fois le coefficient aux réactifs, on l’ajoute aux produits.' },
      { repere: 'colonne_i2', texte: 'Le diiode : 0, puis x, puis x_max.' },
      { repere: 'ligne_final', texte: 'À l’état final, x vaut x_max.' },
    ],
    limitant: [
      { repere: 'hypothese_1', texte: 'Si H₂O₂ est épuisé, x_max vaut 2,0 mmol.' },
      { repere: 'hypothese_2', texte: 'Si I⁻ est épuisé, x_max vaut 5,0 mmol.' },
      { repere: 'x_max', texte: 'On garde la plus petite : 2,0 mmol.' },
      { repere: 'limitant', texte: 'H₂O₂ est le réactif limitant.' },
    ],
    lien: [
      { repere: 'colonne_i2', texte: 'Dans la colonne du diiode, on lit x.' },
      { repere: 'egalite', texte: 'n(I₂) = x à chaque date.' },
      { repere: 'fleche', texte: 'On mesure n(I₂) : on connaît x.' },
    ],
    composition: [
      { repere: 'poignee_t', texte: 'Tu peux choisir la date en glissant l’anneau jaune.' },
      { repere: 'point_lu', texte: 'On lit x sur la courbe.' },
      { repere: 'ligne_en_cours', texte: 'On remplace x par sa valeur dans la ligne en cours.' },
      { repere: 'case_h2o2', texte: '2,0 − 1,26 = 0,74 mmol à 8 minutes.' },
    ],
  },
});
MOT.lancer();
window.Tableau.glisser(MOT.scene.craie.canvas, {
  toucher: (px, py) => {
    if (MOT.S.vue !== 'composition') return null;
    const [x, y] = MOT.scene.local(px, py);
    return x > G2.x0 - 14 && x < G2.x0 + G2.w + 14 && Math.abs(y - G2.y0) < 18 ? 't' : null;
  },
  bouger: (id, px, py) => { const [x] = MOT.scene.local(px, py); DRAG = clamp(Math.round((x - G2.x0) / G2.w * 40), 0, 40); MOT.scene.sale = true; },
  lacher: () => { if (DRAG != null) { const t = DRAG; MOT.setParameters({ t }); } },
});
</script>
