/*

 * Outils (moteur, tableau large, peints, appareil, cellule, chrono, graphes) : copie de conductimetrie.html (lignes 23-508).

/* ── Formules chimiques à la craie : indices ₂ et charges ⁺ ⁻ ²⁻ rendus (sans modifier exposants.js ni le kit) ──────────
 * « MnO₄⁻ » devient « MnO_{4}^{−} » ; le découpage « _{…} » accepte tout caractère avant (« [I⁻]₀ »). */
(function () {
  const C = window.Tableau.Craie, P = C.prototype, texteAvant = P.texte, segAvant = C.segments;
  const SUP = { '⁺': '+', '⁻': '−', '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9' };
  const SUB = { '₀': '0', '₁': '1', '₂': '2', '₃': '3', '₄': '4', '₅': '5', '₆': '6', '₇': '7', '₈': '8', '₉': '9' };
  const chim = s => String(s).replace(/[⁺⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, g => '^{' + [...g].map(ch => SUP[ch]).join('') + '}')
    .replace(/[₀₁₂₃₄₅₆₇₈₉]+/g, g => '_{' + [...g].map(ch => SUB[ch]).join('') + '}');
  C.segments = function (s) {
    const out = [], re = /_\{([^}]+)\}/g; let i = 0, m;
    while ((m = re.exec(s))) { if (m.index > i) out.push(...segAvant(s.slice(i, m.index))); out.push({ t: m[1], sub: true }); i = re.lastIndex; }
    if (i < s.length) out.push(...segAvant(s.slice(i)));
    return out;
  };
  P.texte = function (s, x, y, o) { return texteAvant.call(this, chim(s), x, y, o); };
  window.chim = chim;
})();

/* ── Moteur du déroulé (copie de physics/circuit-rlc-tableau/circuit-lc.html, + M.evs) ─────────────────────────────────── */
const { fr, bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lisse = p => p * p * (3 - 2 * p);
const lerp = (a, b, f) => a + (b - a) * f;
const fx = (v, d = 2) => fr(v, d).replace(/(,\d*?)0+$/, '$1').replace(/,$/, '');
const ECRITURE = 2.5;
function Moteur(o) {
  const q = new URLSearchParams(location.search);
  const S = { vue: o.vues.includes(q.get('vue')) ? q.get('vue') : o.vues[0], t: 0, running: false, pause: false, fait: false,
    jusqua: null, motif: '', emis: 0, dit: '', mesure: false };
  const V = o.vitesse ?? 1.7, T0 = o.T0 ?? .8, HOLD = {};
  let TL = null;
  function construire() {
    let s = T0; const ev = [];
    for (const e of o.etapes(S.vue)) {
      const anim = e.anim || 0, d = { ...e, anim, debut: s, ecrit: s + (e.ecritDes ?? anim) };
      d.fin = Math.max(s + anim, d.ecrit + (HOLD[e.nom] ?? 1.5)) + .35;
      s = d.fin; ev.push(d);
    }
    const mom = {}; for (const e of ev) mom[e.nom] = e.fin; mom.fin = s + (o.queue ?? .6);
    TL = { ev, M: mom };
  }
  const ev = nom => TL.ev.find(e => e.nom === nom);
  const M = {
    S, ev, evs: () => TL.ev, Moments: () => TL.M,
    p(nom) { const e = ev(nom); if (!e) return 0; return e.anim > 0 ? clamp((S.t - e.debut) / e.anim, 0, 1) : (S.t >= e.debut - 1e-6 ? 1 : 0); },
    commence(nom) { const e = ev(nom); return !!e && S.t > e.debut + 1e-6; },
    vu(nom) { if (nom === 'fin') return S.t >= TL.M.fin - 1e-6; const e = ev(nom); return !!e && S.t >= e.fin - 1e-6; },
    etape(c, nom, fn) {
      const e = ev(nom); if (!e) return;
      const t = c.t, cur = c.cur, comp = c.complet, w0 = e.ecrit;
      c.t = S.t > 1e5 ? 1e9 : w0 + (S.t - w0) * V; c.cur = w0;
      try { fn(); } finally { if (S.mesure) HOLD[nom] = Math.max(HOLD[nom] || 0, (c.cur - w0) / V); c.t = t; c.cur = cur; if (!S.running) c.complet = comp; }
    },
    etat() { return S.running ? 'en cours' : S.fait ? 'fin' : S.pause ? 'arrêt sur image' : 'pas encore lancée'; },
  };
  const scene = window.OndesTableau.Scene($('canvas'), (c) => o.dessiner(c, M), { large: true });
  const cadreBase = scene.cadre;
  scene.cadre = function (g) { const k = cadreBase.call(scene, g); if (Number.isFinite(k.t)) k.t *= ECRITURE; return k; };
  M.scene = scene; M.craie = scene.craie;
  const local = scene.local;   // tableau large : la figure est agrandie, les poignées suivent
  scene.local = (x, y) => { const [a, b] = local(x, y); return [(a - LARGE.dx) / LARGE.k, (b - LARGE.dy) / LARGE.k]; };
  function calculer() {
    construire();
    const t = S.t, r = S.running; S.t = 1e6; S.running = false; S.mesure = true;
    for (const k of Object.keys(HOLD)) delete HOLD[k];   // une étape dessinée en plusieurs morceaux garde le plus long (max ci-dessus)
    try { o.dessiner(scene.craie, M); } finally { S.t = t; S.running = r; S.mesure = false; }
    construire(); scene.sale = true;
  }
  const sansSouligne = s => String(s).replace(/([A-Za-zΔτθ])_\{?([A-Za-z0-9]+)\}?/g, (m, a, i) => a + (/^\d+$/.test(i) ? [...i].map(d => '₀₁₂₃₄₅₆₇₈₉'[d]).join('') : i));
  const dire = (texte, kind = '') => { texte = sansSouligne(texte); S.dit = texte; bulle($('feedback'), texte, kind); };
  const etiquette = () => { $('run').textContent = S.running ? 'Pause' : S.pause ? 'Reprendre' : S.fait ? 'Rejouer' : 'Lancer'; };
  let pont = null;
  const emettre = () => pont && pont.emettre();
  const noter = (a, d) => pont && pont.noter(a, d);
  scene.avancer = dt => {
    if (!S.running) return !!(o.anime && o.anime());
    const avant = S.t; S.t += dt;
    for (const e of TL.ev) if (avant < e.debut && S.t >= e.debut && e.bulle) dire(e.bulle());
    if (S.jusqua != null && S.t >= S.jusqua) {
      S.t = S.jusqua; S.jusqua = null; S.running = false;
      if (S.t >= TL.M.fin - 1e-6) { finir(); return true; }
      S.pause = true; etiquette(); dire('Arrêt sur image : ' + (S.motif || `t = ${fx(S.t, 1)} s`) + '.');
      noter('pause', { time_s: +S.t.toFixed(2) }); emettre(); return true;
    }
    if (S.t >= TL.M.fin) { S.t = TL.M.fin; finir(); return true; }
    if (performance.now() - S.emis > 500) { S.emis = performance.now(); emettre(); }
    return true;
  };
  function finir() { S.running = false; S.fait = true; S.pause = false; S.jusqua = null; etiquette(); dire(o.messageFin(M), 'good'); noter('measurement', o.params(M)); emettre(); }
  function start() { o.reprise && o.reprise(); S.t = 0; S.jusqua = null; S.motif = ''; S.running = true; S.pause = false; S.fait = false; etiquette(); dire(o.depart(M)); noter('start', o.params(M)); emettre(); }
  function pause() { if (!S.running) return; S.running = false; S.pause = true; S.jusqua = null; etiquette(); dire('Arrêt sur image.'); noter('pause', { time_s: +S.t.toFixed(2) }); emettre(); }
  function resume() { if (S.running) return; o.reprise && o.reprise(); if (!S.pause) return start(); S.running = true; S.pause = false; etiquette(); dire('Ça repart…'); noter('resume'); emettre(); }
  function setTime(p) {
    const t = +p.time_s; if (p.time_s === null || p.time_s === '' || !Number.isFinite(t)) return;
    o.reprise && o.reprise(); S.running = false; S.jusqua = null; S.t = clamp(t, 0, TL.M.fin); S.fait = S.t >= TL.M.fin - 1e-6; S.pause = !S.fait && S.t > 0;
    etiquette(); scene.sale = true; dire(`Arrêt sur image : t = ${fx(S.t, 1)} s.`); noter('set_time', { time_s: S.t }); emettre();
  }
  function playUntil(p) {
    const noms = o.etapes(S.vue).map(e => e.nom).concat('fin');
    const nom = noms.includes(p.moment) ? p.moment : null, cible = nom ? TL.M[nom] : +p.time_s;
    if (!Number.isFinite(cible) || (p.moment && !nom && (p.time_s == null || p.time_s === ''))) { dire(`Moment inconnu : ${p.moment}.`, 'bad'); emettre(); return; }
    o.reprise && o.reprise();
    if (S.fait || S.t >= cible - 1e-3) { S.t = 0; S.fait = false; }
    S.jusqua = clamp(cible, .01, TL.M.fin); S.motif = nom ? (o.motifs[nom] || nom) : ''; S.running = true; S.pause = false; etiquette(); dire('Observe…');
    noter('play_until', { moment: nom, time_s: S.jusqua }); emettre();
  }
  function setParameters(p) {
    p = p || {};
    const r = o.appliquer(p, M) || {};
    if (r.vue && o.vues.includes(r.vue) && r.vue !== S.vue) { S.vue = r.vue; r.change = true; r.vueChange = true; }
    if (r.change) { calculer(); if (r.vueChange) scene.reecrire(); }
    noter('set_parameters', o.params(M));
    if (r.apres) r.apres();
    else if (r.change && !r.garder) start();
    else { scene.sale = true; emettre(); }
  }
  Object.assign(M, { noter, calculer, dire, start, pause, resume, setTime, playUntil, setParameters, emettre, etiquette });
  $('run').onclick = () => (S.running ? pause() : S.pause ? resume() : start());
  window.Tableau.explication(o.explications);
  const commandes = ['start', 'reset', 'pause', 'resume', 'set_time', 'set_parameters', 'play_until'];
  M.lancer = () => {
    calculer();
    const listeMoments = o.vues.map(v => `${o.vues.length > 1 ? v + ' : ' : ''}${o.etapes(v).map(e => e.nom).concat('fin').join(' | ')}`).join(' ; ');
    const config = { id: o.id, version: '1.0', title: o.titre, variants: o.vues.length > 1 ? o.vues.map(id => ({ id, label: o.titres[id] })) : [], commands: commandes,
      command_schema: { set_parameters: o.schema, set_time: { time_s: '0..fin (arrêt sur cet instant de la scène, en s ; voir moments)' },
        play_until: { moment: listeMoments, time_s: 'ou un instant en s' } } };
    pont = protocole({ id: o.id, commandes, config, texte: o.texte,
      etat: () => ({ simulation_status: S.running ? 'running' : S.fait ? 'finished' : S.pause ? 'paused' : 'idle',
        ce_qui_se_voit: o.voir(M) + (S.dit ? ` La bulle dit : « ${S.dit} »` : ''), current_variant: S.vue, time_s: +S.t.toFixed(2),
        parameters: o.params(M), moments: Object.fromEntries(Object.entries(TL.M).map(([k, v]) => [k, +v.toFixed(2)])) }),
      progression: () => (S.fait ? 1 : 0),
      executer: (cmd, p) => ({ start, reset: start, pause, resume, set_time: () => setTime(p), set_parameters: () => setParameters(p), play_until: () => playUntil(p) })[cmd]?.() });
    dire(o.depart(M));
    setTimeout(() => { if (!S.running && S.t === 0 && !S.pause && !S.fait) start(); }, 900);
  };
  return M;
}
/** Zone d’écriture du bas : le professeur efface les plus vieilles lignes (copie du modèle). */
/* ── Tableau large (15 novembre 2026, demande de l'utilisateur : « mieux exploiter tout le tableau, grands calibres de
 * texte, simulations agrandies » ; « le texte du bas mieux à gauche de l'écran, le diagramme plus étendu ») ─────────────
 * Quand le tableau est large (scene.L ≥ 1000 : écran d'ordinateur portable), la figure (tout le dessin sauf les phrases
 * écrites en bas) est agrandie d'un facteur k et posée à droite sur toute la hauteur ; les phrases écrites au fil du
 * déroulé passent dans une colonne à gauche, coupées à la ligne et plus grosses. Les repères pointés par le professeur
 * suivent tout seuls (ils sont pris dans la transformation du dessin), les poignées aussi (scene.local).
 * Sinon (grand écran, scene.L < 1000) : la disposition d'origine 760 × 420, centrée. */
const LARGE = { actif: false, k: 1, dx: 0, dy: 0, base: null, echelle: 1, gauche: 0, taille: 20, ys: [] };
const HAUT_FIGURE = 340;                            // bas de la figure tant que sa boîte n'est pas relevée
const BOITES = {};   // par vue : la boîte de l'encre de la figure (sans les phrases écrites), relevée pendant la passe de mesure du moteur
let RELEVE = null;
/** Pendant la passe de mesure du moteur (image finale) : relève l'encre de la figure, hors colonne de gauche. */
function relever(c, M) {
  if (M.S.mesure && !RELEVE) {
    const b = { x0: Infinity, x1: -Infinity, y0: Infinity, y1: -Infinity }, f = { trait: c.trait, texte: c.texte, point: c.point, repere: c.repere };
    const pt = (x, y) => { if (!LARGE.dansGauche && Number.isFinite(x) && Number.isFinite(y)) { b.x0 = Math.min(b.x0, x); b.x1 = Math.max(b.x1, x); b.y0 = Math.min(b.y0, y); b.y1 = Math.max(b.y1, y); } };
    c.trait = function (pts, o) { for (const p of pts || []) pt(p[0], p[1]); return f.trait.call(this, pts, o); };
    // les objets peints (bécher, appareil…) ne passent pas par la craie : leurs repères donnent leur place
    c.repere = function (id, x, y, w, h, l) { if (w < 600 && h < 400) { pt(x, y); pt(x + w, y + h); } return f.repere.call(this, id, x, y, w, h, l); };
    c.point = function (x, y, r = 4, col) { pt(x - r, y - r); pt(x + r, y + r); return f.point.call(this, x, y, r, col); };
    c.texte = function (s, x, y, o = {}) {
      const t = o.taille ?? 18; let l = larg(this, String(s), t); if (o.max && l > o.max) l = o.max;
      const a = o.align === 'center' ? x - l / 2 : o.align === 'right' ? x - l : x; pt(a, y + t * .3); pt(a + l, y - t * .8);
      return f.texte.call(this, s, x, y, o);
    };
    RELEVE = { b, vue: M.S.vue, gauche: false };
  } else if (!M.S.mesure && RELEVE) {
    delete c.trait; delete c.texte; delete c.point; delete c.repere;
    const b = RELEVE.b; b.gauche = RELEVE.gauche; if (b.x1 > b.x0) BOITES[RELEVE.vue] = b;
    RELEVE = null;

}
/* Deuxième passe (15 novembre 2026, « agrandir les figures elles-mêmes, pas seulement le texte autour ») : sur un tableau
 * large, les tailles sont choisies en PIXELS À L'ÉCRAN (u(px) = px / échelle). La boîte de la figure (haut ET bas relevés)
 * prend toute la hauteur ; la colonne de gauche s'écrit en 20 px à l'écran et ne prend que la largeur que la figure laisse
 * (entre 28 % et 45 % du tableau) ; le titre interne est retiré (le titre de la diapositive le dit déjà) ; aucun texte de la
 * figure sous 17 px à l'écran. Même idée que figures.html (disposer). */
function agrandir(c, scene, M) {
  const L = scene.L;
  relever(c, M);
  LARGE.actif = L >= 1000;
  if (typeof AVANT_LARGE === 'function') AVANT_LARGE(L, LARGE.actif);   // la page adapte sa géométrie au tableau large
  if (!LARGE.actif) {   // grand écran : la figure d'origine, centrée sur la largeur du tableau
    Object.assign(LARGE, { k: 1, dx: Math.max(0, (L - 760) / 2), dy: 0 }); c.ctx.translate(LARGE.dx, 0);
    if (c.cadre) c.cadre = { ...c.cadre, w: 760 };
    return;
  }
  const s0 = c.echelle || 1, u = px => px / s0;
  const b = BOITES[M.S.vue] || { x0: 0, x1: 760, y0: 40, y1: HAUT_FIGURE, gauche: true };
  const AJ = (typeof AJUSTE_LARGE !== 'undefined' && AJUSTE_LARGE[M.S.vue]) || {};
  const x0 = b.x0 - 10, x1 = Math.max(b.x1 + 10, x0 + 300), y0 = Math.max(0, (b.y0 ?? 40) - 8), y1 = Math.max(b.y1 + 8, y0 + 160);
  const HMAX = 420 - 8, kH = HMAX / (y1 - y0), KMAX = AJ.kmax ?? 2;
  LARGE.taille = u(AJ.px ?? 20);

  if (b.gauche) {

    const kNat = Math.min(kH, KMAX), wNat = (x1 - x0) * kNat;
    reserve = Math.min(maxi, Math.max(mini, L - wNat - u(16)));

  const k = Math.min(kH, (L - reserve - u(8)) / (x1 - x0), KMAX);
  const hFig = (y1 - y0) * k, dy = Math.max(2, (420 - hFig) / 2) - y0 * k;
  const dx = b.gauche ? L - u(6) - x1 * k : (L - (x1 - x0) * k) / 2 - x0 * k;
  Object.assign(LARGE, { k, dx, dy, base: c.ctx.getTransform(), echelle: c.echelle, gauche: dx + x0 * k - u(10), ys: [] });
  const pas = Math.round(LARGE.taille * 1.3);
  for (let y = Math.round(LARGE.taille + u(10)); y <= 420 - u(6); y += pas) LARGE.ys.push(y);
  c.ctx.translate(dx, dy); c.ctx.scale(k, k); if (c.echelle) c.echelle *= k;
  c.tailleMin = AJ.min ?? 18;   // aucun texte de la figure sous 18 px à l’écran
  if (c.cadre) c.cadre = { ...c.cadre, w: (L - dx) / k, h: (420 - dy) / k, haut: -dy / k };
}
/** Le titre interne de la figure : seulement hors tableau large (le titre de la diapositive le dit déjà), hors boîte. */
function titreFigure(c, t, o) {
  if (LARGE.actif) return;
  const g = LARGE.dansGauche; LARGE.dansGauche = true;
  try { c.texte(t, 14, 26, o); } finally { LARGE.dansGauche = g; }
}
/** Dessine `fn` dans la colonne de gauche (coordonnées du tableau entier, sans l'agrandissement de la figure). */
function aGauche(c, fn) {
  LARGE.dansGauche = true; if (RELEVE) RELEVE.gauche = true;
  if (!LARGE.actif) { try { return fn(); } finally { LARGE.dansGauche = false; } }
  const ctx = c.ctx, m = ctx.getTransform(), e = c.echelle, k = c.cadre, t0 = c.tip;
  ctx.setTransform(LARGE.base); c.echelle = LARGE.echelle; if (k) c.cadre = { ...k, w: LARGE.gauche, h: 420 };
  try { return fn(); } finally {
    LARGE.dansGauche = false;
    ctx.setTransform(m); c.echelle = e; c.cadre = k;
    if (c.tip && c.tip !== t0) c.tip = [(c.tip[0] - LARGE.dx) / LARGE.k, (c.tip[1] - LARGE.dy) / LARGE.k];
  }
}
/** Une phrase coupée en lignes qui tiennent dans `max` (mesurée à la craie) ; une formule « a = b » ne se coupe pas. */
function couper(c, t, max, taille) {
  const mots = String(t).replace(/ ([=≈×→<>≤≥]) /g, '\u00a0$1\u00a0').replace(/\([^()]{1,18}\)/g, m => m.replace(/ /g, '\u00a0'))
    .replace(/(\d) (?=(mmol|mol|min|mL|L|s|h|K|Pa|g|mS|S|°C)\b)/g, '$1\u00a0').split(' ')
    .flatMap(m => (larg(c, m.replace(/\u00a0/g, ' '), taille) > max ? m.split('\u00a0') : [m])), out = []; let l = '';
  for (const m of mots) { const e = l ? l + ' ' + m : m; if (l && larg(c, e, taille) > max) { out.push(l); l = m; } else l = e; }
  if (l) out.push(l);
  return out.map(s => s.replace(/\u00a0/g, ' '));
}
function zoneEcriture(c, M, liste, ys, o = {}) {
  const S = M.S; let x = o.x ?? 14, max = o.max ?? 730, taille = o.taille ?? 17;
  if (LARGE.actif) {   // tableau large : la colonne de gauche, chaque phrase à la ligne (le tuteur garde la phrase entière)
    x = 14; max = LARGE.gauche - 18; taille = LARGE.taille; ys = LARGE.ys;
    liste = liste.map(e => ({ ...e, lignes: aGauche(c, () => e.lignes.flatMap(([t, col]) => couper(c, t, max, taille).map((l, i) => [l, col, i ? false : t]))) }));
  }
  const n = ys.length, vues = [], ecr = (t, col, y) => aGauche(c, () => c.texte(t, x, y, { couleur: col, taille, max }));
  if (S.mesure) {
    for (const e of liste) M.etape(c, e.nom, () => { for (const [t, col] of e.lignes) ecr(t, col, ys[0]); e.plus && e.plus(c); });
    return vues;

/** Courbe lisse qui passe par des points lus (Hermite monotone ; copie de figures.html). */
function lissee(pts, pentes = {}) {
  const n = pts.length, t = pts.map(p => p[0]), y = pts.map(p => p[1]), d = [], m = [];
  for (let i = 0; i < n - 1; i++) d.push((y[i + 1] - y[i]) / (t[i + 1] - t[i]));

  for (const [k, s] of Object.entries(pentes)) { const i = t.indexOf(+k); if (i >= 0) m[i] = s; }
  return u => {
    if (u <= t[0]) return y[0] + m[0] * (u - t[0]);
    if (u >= t[n - 1]) return y[n - 1];
    let i = 0; while (u > t[i + 1]) i++;

  };
}

}

/* ── Q3 : montrer v = −(1/(160·V₀))·dσ/dt ────────────────────────────────────────────────────── */
const J = { x1: 54, x2: 158, y0: 300, h: 190, w: 40 };
function vueQ3(c, M) {
  const p = M.commence('liees') ? lisse(M.p('liees')) : 0, x = 1e-3 * (1 - Math.pow(2, -p * 3)) / (1 - 1 / 8), sg = .25 - 160 * x;
  if (M.commence('relation')) {
    c.direct(() => {
      const ctx = c.ctx, bar = (bx, f, col) => {
        ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.fillRect(bx, J.y0 - J.h, J.w, J.h);
        const g = ctx.createLinearGradient(bx, 0, bx + J.w, 0); g.addColorStop(0, col[0]); g.addColorStop(.5, col[1]); g.addColorStop(1, col[0]);
        ctx.fillStyle = g; ctx.fillRect(bx, J.y0 - J.h * f, J.w, J.h * f);
      };
      bar(J.x1, x / 1e-3, ['#0f766e', '#5eead4']); bar(J.x2, sg / .25, ['#1e3a8a', '#93c5fd']);

    c.texte('x', J.x1 + J.w / 2, J.y0 + 24, { couleur: 'cyan', taille: 19, align: 'center' });
    c.texte('σ', J.x2 + J.w / 2, J.y0 + 24, { couleur: 'bleu', taille: 19, align: 'center' });
    c.direct(() => {
      c.texte(`${fr(x * 1e4, 1)}·10⁻⁴ mol`, J.x1 + J.w / 2, J.y0 - J.h - 12, { couleur: 'cyan', taille: 15, align: 'center' });
      c.texte(`${fr(sg, 3)} S/m`, J.x2 + J.w / 2, J.y0 - J.h - 12, { couleur: 'bleu', taille: 15, align: 'center' });
    });
    if (M.vu('liees')) { c.fleche(J.x1 + J.w / 2, J.y0 - 70, J.x1 + J.w / 2, J.y0 - 120, { couleur: 'cyan', largeur: 2.4, tete: 8 });
      c.fleche(J.x2 + J.w / 2, J.y0 - 120, J.x2 + J.w / 2, J.y0 - 70, { couleur: 'bleu', largeur: 2.4, tete: 8 }); }
  }
  const X0 = 260;
  const lignes = [
    { nom: 'rappel', plus: () => { c.texte('v = ⟦1|V₀⟧·⟦dx|dt⟧', X0 + 10, 74, { couleur: 'cyan', taille: 22 }); c.texte('(définition)', X0 + 170, 74, { couleur: 'faible', taille: 16 }); } },
    { nom: 'relation', plus: () => { c.texte('σ = 0,25 − 160·x', X0 + 10, 126, { couleur: 'blanc', taille: 22 }); c.texte('(sujet)', X0 + 230, 126, { couleur: 'faible', taille: 16 }); } },
  ];
  if (PAR.conclusions) lignes.push(
    { nom: 'derivee', plus: () => { c.texte('⟦dσ|dt⟧ = 0 − 160·⟦dx|dt⟧', X0 + 10, 180, { couleur: 'jaune', taille: 22 }); c.texte('(0,25 : constante)', X0 + 270, 180, { couleur: 'faible', taille: 16 }); } },
    { nom: 'dxdt', plus: () => c.texte('⟦dx|dt⟧ = −⟦1|160⟧·⟦dσ|dt⟧', X0 + 10, 236, { couleur: 'jaune', taille: 22 }) },
    { nom: 'resultat', plus: () => { c.texte('v = −⟦1|160·V₀⟧·⟦dσ|dt⟧', X0 + 22, 298, { couleur: 'jaune', taille: 24 }); c.rect(X0 + 6, 264, 300, 54, { couleur: 'jaune', largeur: 2, arrondi: 8 }); } });
  c.repere('jauges', J.x1 - 10, J.y0 - J.h - 30, J.x2 + J.w - J.x1 + 20, J.h + 60, `les deux jauges : x = ${fr(x * 1e4, 1)}·10⁻⁴ mol, σ = ${fr(sg, 3)} S/m`);
  c.repere('definition', X0, 46, 330, 46, 'la définition v = (1/V₀)·dx/dt');
  c.repere('relation', X0, 106, 330, 32, 'la relation σ = 0,25 − 160·x');
  c.repere('derivee', X0, 154, 480, 46, `la dérivée dσ/dt = −160·dx/dt${voit(M, 'derivee') ? '' : ' (pas encore écrite)'}`);
  c.repere('resultat', X0, 210, 330, 110, `dx/dt puis v = −(1/(160·V₀))·dσ/dt${voit(M, 'resultat') ? '' : ' (pas encore écrit)'}`);
  return zoneEcriture(c, M, [
    ...lignes.map(l => ({ ...l, lignes: ({ rappel: [['on part de la définition de la vitesse volumique', 'cyan']],
      relation: [['et de la relation donnée : σ = 0,25 − 160·x', 'blanc']],
      derivee: [['on dérive par rapport au temps : la dérivée de 0,25 est nulle', 'jaune']],
      dxdt: [['on isole dx/dt', 'jaune']], resultat: [['on remplace dans v : c’est l’expression demandée', 'jaune']] })[l.nom] })),
    { nom: 'liees', lignes: [['x augmente, σ diminue : σ change 160 fois plus vite que x, dans l’autre sens', 'bleu']] },
  ].sort((a, b) => ETAPES('2021N_q3').findIndex(e => e.nom === a.nom) - ETAPES('2021N_q3').findIndex(e => e.nom === b.nom)), ZY);
}

/* ── Q4 : la tangente à t₁ = 4 min et v₁ ───────────────────────────────────────────────────────── */
const G4 = Graphe({ x0: 64, y0: 300, w: 380, h: 236, xmax: 24, dx: 4, ymax: .25, dy: .05, decx: 0, decy: 2, nomx: '', nomy: 'σ (S·m⁻¹)' });   // « t (min) » écrit au-dessus de la flèche (vueQ4)
const tanT = t => .22 - .0125 * t;
function vueQ4(c, M) {

    axesG(c, G4, 15); quad(c, G4, .8);
    c.texte('t (min)', G4.x0 + G4.w + 14, G4.y0 - 12, { couleur: 'blanc', taille: 16, align: 'right' });
    c.direct(() => { const p = M.p('courbe'), tm = TMAX * p; if (p > 0) c.courbe(u => [G4.X(u * tm), G4.Y(SIG(u * tm))], Math.max(16, Math.round(160 * p)), { net: true, couleur: 'bleu', largeur: 2.6 }); });

  }

    c.direct(() => { const a = 17.6 * M.p('tangente'); c.ligne(G4.X(0), G4.Y(tanT(0)), G4.X(a), G4.Y(tanT(a)), { couleur: 'vert', largeur: 2.2, pointille: [8, 5] }); });
    c.texte('(T)', G4.X(14.4), G4.Y(tanT(14.4)) + 26, { couleur: 'vert', taille: 19 });
  }
  if (voit(M, 'points_lus')) {
    const p = M.p('points_lus');
    c.direct(() => {
      c.point(G4.X(0), G4.Y(.22), 5, 'vert');
      if (p > .4) { c.ligne(G4.X(4), G4.Y(.17), G4.X(4), G4.y0, { couleur: 'jaune', largeur: 1.6, pointille: [5, 5] }); c.ligne(G4.x0, G4.Y(.17), G4.X(4), G4.Y(.17), { couleur: 'jaune', largeur: 1.6, pointille: [5, 5] }); c.point(G4.X(4), G4.Y(.17), 5, 'vert'); }
    });
    c.texte('0,22', G4.x0 + 10, G4.Y(.22) - 10, { couleur: 'vert', taille: 17 });
    c.texte('0,17', G4.x0 + 10, G4.Y(.17) + 22, { couleur: 'jaune', taille: 17 });
  }
  const X0 = 470;
  const lignes = [];
  if (PAR.conclusions) lignes.push(
    { nom: 'points_lus', plus: () => { c.texte('(T) passe par (0 ; 0,22)', X0, 84, { couleur: 'vert', taille: 18 }); c.texte('et (4 ; 0,17)', X0 + 74, 108, { couleur: 'vert', taille: 18 }); } },
    { nom: 'pente', plus: () => { c.texte('(⟦dσ|dt⟧)₁ = ⟦0,17 − 0,22|4 − 0⟧', X0, 160, { couleur: 'jaune', taille: 19 }); c.texte('= −0,0125 S·m⁻¹·min⁻¹', X0 + 40, 200, { couleur: 'jaune', taille: 18 }); } },
    { nom: 'volume', plus: () => c.texte('V₀ = 100 mL = 10⁻⁴ m³', X0, 238, { couleur: 'blanc', taille: 18 }) },
    { nom: 'calcul', plus: () => { c.texte('v₁ = −⟦1|160 × 10⁻⁴⟧ × (−0,0125)', X0, 282, { couleur: 'blanc', taille: 18 });
      c.texte('v₁ ≈ 0,78 mol·m⁻³·min⁻¹', X0 + 8, 330, { couleur: 'jaune', taille: 20 }); c.rect(X0 - 4, 306, 262, 34, { couleur: 'jaune', largeur: 2, arrondi: 8 }); } });
  c.repere('courbe', G4.x0, G4.y0 - G4.h, G4.w, G4.h, 'la courbe σ(t) de la figure 1');
  c.repere('point', G4.X(4) - 14, G4.Y(.17) - 14, 28, 28, 'le point de la courbe de date t₁ = 4 min');
  c.repere('tangente', G4.X(0), G4.Y(.22) - 8, G4.X(17.6) - G4.X(0), G4.Y(0) - G4.Y(.22) + 16, 'la tangente (T) verte au point de date 4 min');
  c.repere('point_axe', G4.x0 - 12, G4.Y(.22) - 14, 28, 28, `le point où (T) coupe l’axe σ, à t = 0${voit(M, 'points_lus') ? ' : 0,22 S·m⁻¹' : ' (valeur pas encore écrite)'}`);
  c.repere('pente', X0 - 6, 132, 280, 76, `la pente de (T)${voit(M, 'pente') ? ' : −0,0125 S·m⁻¹·min⁻¹' : ' (pas encore écrite)'}`);

    { nom: 'point', lignes: [['le point de la courbe de date t₁ = 4 min', 'blanc']] },
    { nom: 'tangente', lignes: [['la tangente (T) en ce point : sa pente vaut (dσ/dt) à t₁', 'vert']] },
    ...lignes.map(l => ({ ...l, lignes: ({ points_lus: [['on lit deux points de (T), loin l’un de l’autre', 'vert']],
      pente: [['la pente est négative (σ diminue), mais v₁ sera positive', 'jaune']],
      volume: [['v en mol·m⁻³·min⁻¹ : V₀ en m³', 'blanc']],
      calcul: [['v₁ = −(1/(160·V₀))·(dσ/dt)₁ ≈ 0,78 mol·m⁻³·min⁻¹', 'jaune']] })[l.nom] })),
  ], ZY);
}

/* ── Dessin, ce que voit le tuteur, moteur ─────────────────────────────────────────────────────── */
function dessiner(c, M) {
  MO = M; M.scene.cadre(67);

  const v = M.S.vue;

  return c.fin();
}
function voir(M) {

  if (v === '2021N_q1') m.push('Bécher : 10⁻³ mol d’ions HO⁻, l’ester versé en excès, V₀ = 100 mL. Tableau d’avancement : '
    + ['etat_initial', 'en_cours', 'etat_final'].filter(n => M.commence(n)).map(n => ({ etat_initial: 'état initial (0 ; en excès ; 10⁻³ ; 0 ; 0)', en_cours: 'en cours (x ; en excès ; 10⁻³ − x ; x ; x)', etat_final: 'état final (x_f ; en excès ; 10⁻³ − x_f ; x_f ; x_f)' })[n]).join(', ') + '.'
    + (voit(M, 'limitant') ? ' Colonne HO⁻ entourée : HO⁻ limitant.' : '') + (voit(M, 'x_f') ? ' Écrit : x_f = x_max = 10⁻³ mol.' : ''));

    + (M.commence('courbe') ? ' Courbe σ(t) bleue tracée par les points, de 0,25 vers 0,09 S/m.' : '') + (M.commence('definition') ? ' Écrit : x = x_f/2 = 5·10⁻⁴ mol.' : '')
    + (voit(M, 'sigma_demi') ? ' Écrit : σ₁/₂ = 0,17 S·m⁻¹.' : '') + (voit(M, 'lecture') ? ' Lecture jaune : 0,17 → t₁/₂ = 4 min.' : '')); }
  if (v === '2021N_q3') m.push(`Jauges : x = ${fr((M.commence('liees') ? 1e-3 * (1 - Math.pow(2, -lisse(M.p('liees')) * 3)) / (7 / 8) : 0) * 1e4, 1)}·10⁻⁴ mol (monte), σ (baisse).`
    + (M.commence('rappel') ? ' Écrit : v = (1/V₀)·dx/dt.' : '') + (M.commence('relation') ? ' Écrit : σ = 0,25 − 160·x.' : '')
    + (voit(M, 'derivee') ? ' Écrit : dσ/dt = 0 − 160·dx/dt.' : '') + (voit(M, 'dxdt') ? ' Écrit : dx/dt = −(1/160)·dσ/dt.' : '') + (voit(M, 'resultat') ? ' Encadré : v = −(1/(160·V₀))·dσ/dt.' : ''));
  if (v === '2021N_q4') m.push((M.commence('courbe') ? 'Courbe σ(t) de 0,25 vers 0,09 S/m.' : '') + (M.commence('point') ? ' Point de date 4 min entouré.' : '') + (M.commence('tangente') ? ' Tangente (T) verte en pointillés.' : '')
    + (voit(M, 'points_lus') ? ' Points de (T) : (0 ; 0,22) et (4 ; 0,17).' : '') + (voit(M, 'pente') ? ' Pente = −0,0125 S·m⁻¹·min⁻¹.' : '') + (voit(M, 'volume') ? ' V₀ = 10⁻⁴ m³.' : '') + (voit(M, 'calcul') ? ' v₁ ≈ 0,78 mol·m⁻³·min⁻¹ encadré.' : ''));
  if (M.vues && M.vues.length) m.push(`Écrit à gauche ou en bas : ${M.vues.map(s => `« ${s} »`).join(' ; ')}.`);
  return m.join(' ');
}
const params = M => ({ vue: M.S.vue, conclusions: PAR.conclusions, sujet: '2021 N', n0_HO_mol: 1e-3, V0_mL: 100, relation: 'σ = 0,25 − 160·x' });
const MOT = Moteur({
  id: 'cin_national_2021N', titre: 'National 2021 N joué pas à pas : tableau, conductimétrie, t₁/₂, vitesse par la tangente', vues: VUES, titres: TITRES,
  etapes: ETAPES, motifs: MOTIFS, dessiner, voir, params,
  depart: M => `National 2021 N, ${TITRES[M.S.vue]}.`,
  messageFin: M => ({ '2021N_q1': 'HO⁻ limitant : x_f = 10⁻³ mol.', '2021N_q2': 'σ₁/₂ = 0,17 S·m⁻¹ : t₁/₂ = 4 min.', '2021N_q3': 'v = −(1/(160·V₀))·dσ/dt.', '2021N_q4': 'v₁ ≈ 0,78 mol·m⁻³·min⁻¹.' })[M.S.vue],

    return r;
  },
  schema: { vue: VUES.join(' | ') + ' (change de question et relance)', conclusions: 'true | false : false tait la réponse de la question d’observation (étapes ' + [...CONCL].join(', ') + ') ; true par défaut' },
  texte: 'National 2021 N (exercice 1, partie 1), joué question par question. Ester (éthanoate d’éthyle) en excès + 10⁻³ mol d’ions HO⁻, V₀ = 100 mL, réaction totale. '
    + 'Q1 : tableau d’avancement, HO⁻ limitant, x_f = 10⁻³ mol. Q2 : le conductimètre lit σ à 0, 2, 4, 8, 12, 16 et 24 min (0,25 ; 0,20 ; 0,17 ; 0,13 ; 0,11 ; 0,10 ; 0,093 S/m), tableau puis graphe ; '
    + 'x(t₁/₂) = x_f/2 = 5·10⁻⁴ mol, σ₁/₂ = 0,25 − 160 × 5·10⁻⁴ = 0,17 S·m⁻¹, t₁/₂ = 4 min. Q3 : σ = 0,25 − 160·x, dσ/dt = −160·dx/dt, v = −(1/(160·V₀))·dσ/dt. '
    + 'Q4 : tangente (T) à 4 min par (0 ; 0,22) et (4 ; 0,17), pente −0,0125 S·m⁻¹·min⁻¹, V₀ = 10⁻⁴ m³, v₁ ≈ 0,78 mol·m⁻³·min⁻¹.',
  explications: {
    '2021N_q1': [{ repere: 'melange', texte: 'Les ions hydroxyde, et l’ester en excès.' }, { repere: 'tableau', texte: 'Le tableau, ligne par ligne.' },

    '2021N_q2': [{ repere: 'conductimetre', texte: 'Le conductimètre lit σ.' }, { repere: 'tableau', texte: 'Chaque valeur va dans le tableau.' },
      { repere: 'courbe', texte: 'Puis sur le graphe, et la courbe passe par les points.' }, { repere: 'lecture', texte: 'σ = 0,17 S/m à t₁/₂ = 4 min.' }],
    '2021N_q3': [{ repere: 'definition', texte: 'La définition de v.' }, { repere: 'relation', texte: 'La relation du sujet.' }, { repere: 'jauges', texte: 'x monte, σ baisse.' },
      { repere: 'derivee', texte: 'On dérive : la dérivée de 0,25 est nulle.' }, { repere: 'resultat', texte: 'On remplace dans v.' }],
    '2021N_q4': [{ repere: 'point', texte: 'Le point de date 4 min.' }, { repere: 'tangente', texte: 'La tangente en ce point.' }, { repere: 'point_axe', texte: 'Elle coupe l’axe à 0,22.' },
      { repere: 'pente', texte: 'Sa pente, négative.' }, { repere: 'calcul', texte: 'V₀ en m³, puis v₁.' }],
  },
});
MOT.lancer();
