<script>
/*
 * Suivi temporel d’une transformation (cours « Suivi temporel d’une transformation, vitesse de réaction », 2e Bac PC BIOF, novembre 2026).
 * Contrat : outils/cours/notes/cours/cinetique_contrat_simulations.md § 1.
 * Vues (?vue=) : methodes (défaut) | mesures | prelevement | titrage. Pas de poignée.
 * Modèle (exemple A, pour le calcul seulement, jamais écrit) : x(t) = 2,0·(1 − e^(−t/8)) mmol.

/* ── Formules chimiques à la craie : indices ₂ et charges ⁺ ⁻ ²⁻ rendus (sans modifier exposants.js ni le kit) ──────────
 * « MnO₄⁻ » devient « MnO_{4}^{−} » ; le découpage « _{…} » accepte tout caractère avant (« [I⁻]₀ »). */
(function () {
  const C = window.Tableau.Craie, P = C.prototype, texteAvant = P.texte, segAvant = C.segments;
  const SUP = { '⁺': '+', '⁻': '−', '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9' };
  const SUB = { '₀': '0', '₁': '1', '₂': '2', '₃': '3', '₄': '4', '₅': '5', '₆': '6', '₇': '7', '₈': '8', '₉': '9' };
  const chim = s => String(s).replace(/[⁺⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, g => '^{' + [...g].map(ch => SUP[ch]).join('') + '}')
    .replace(/[₀₁₂₃₄₅₆₇₈₉]+/g, g => '_{' + [...g].map(ch => SUB[ch]).join('') + '}');
  C.segments = function (s) {
    const out = [], re = /_\{([^}]+)\}/g; let i = 0, m;
    while ((m = re.exec(s))) { if (m.index > i) out.push(...segAvant(s.slice(i, m.index))); out.push({ t: m[1], sub: true }); i = re.lastIndex; }
    if (i < s.length) out.push(...segAvant(s.slice(i)));
    return out;
  };
  P.texte = function (s, x, y, o) { return texteAvant.call(this, chim(s), x, y, o); };
  window.chim = chim;
})();

/* ── Moteur du déroulé (copie de physics/circuit-rlc-tableau/circuit-lc.html, + M.evs) ─────────────────────────────────── */
const { fr, bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

const ECRITURE = 2.5;
function Moteur(o) {

  const S = { vue: o.vues.includes(q.get('vue')) ? q.get('vue') : o.vues[0], t: 0, running: false, pause: false, fait: false,
    jusqua: null, motif: '', emis: 0, dit: '', mesure: false };

  function construire() {

      d.fin = Math.max(s + anim, d.ecrit + (HOLD[e.nom] ?? 1.5)) + .35;
      s = d.fin; ev.push(d);

  const ev = nom => TL.ev.find(e => e.nom === nom);

    p(nom) { const e = ev(nom); if (!e) return 0; return e.anim > 0 ? clamp((S.t - e.debut) / e.anim, 0, 1) : (S.t >= e.debut - 1e-6 ? 1 : 0); },

    vu(nom) { if (nom === 'fin') return S.t >= TL.M.fin - 1e-6; const e = ev(nom); return !!e && S.t >= e.fin - 1e-6; },

    try { o.dessiner(scene.craie, M); } finally { S.t = t; S.running = r; S.mesure = false; }

    }

  };

  function pause() { if (!S.running) return; S.running = false; S.pause = true; S.jusqua = null; etiquette(); dire('Arrêt sur image.'); noter('pause', { time_s: +S.t.toFixed(2) }); emettre(); }

    o.reprise && o.reprise(); S.running = false; S.jusqua = null; S.t = clamp(t, 0, TL.M.fin); S.fait = S.t >= TL.M.fin - 1e-6; S.pause = !S.fait && S.t > 0;
    etiquette(); scene.sale = true; dire(`Arrêt sur image : t = ${fx(S.t, 1)} s.`); noter('set_time', { time_s: S.t }); emettre();
  }
  function playUntil(p) {

    const nom = noms.includes(p.moment) ? p.moment : null, cible = nom ? TL.M[nom] : +p.time_s;

    o.reprise && o.reprise();
    if (S.fait || S.t >= cible - 1e-3) { S.t = 0; S.fait = false; }
    S.jusqua = clamp(cible, .01, TL.M.fin); S.motif = nom ? (o.motifs[nom] || nom) : ''; S.running = true; S.pause = false; etiquette(); dire('Observe…');

  }
  function setParameters(p) {
    p = p || {};
    const r = o.appliquer(p, M) || {};
    if (r.vue && o.vues.includes(r.vue) && r.vue !== S.vue) { S.vue = r.vue; r.change = true; r.vueChange = true; }
    if (r.change) { calculer(); if (r.vueChange) scene.reecrire(); }
    noter('set_parameters', o.params(M));

  window.Tableau.explication(o.explications);
  const commandes = ['start', 'reset', 'pause', 'resume', 'set_time', 'set_parameters', 'play_until'];
  M.lancer = () => {
    calculer();
    const listeMoments = o.vues.map(v => `${o.vues.length > 1 ? v + ' : ' : ''}${o.etapes(v).map(e => e.nom).concat('fin').join(' | ')}`).join(' ; ');
    const config = { id: o.id, version: '1.0', title: o.titre, variants: o.vues.length > 1 ? o.vues.map(id => ({ id, label: o.titres[id] })) : [], commands: commandes,
      command_schema: { set_parameters: o.schema, set_time: { time_s: '0..fin (arrêt sur cet instant de la scène, en s ; voir moments)' },
        play_until: { moment: listeMoments, time_s: 'ou un instant en s' } } };

      etat: () => ({ simulation_status: S.running ? 'running' : S.fait ? 'finished' : S.pause ? 'paused' : 'idle',
        ce_qui_se_voit: o.voir(M) + (S.dit ? ` La bulle dit : « ${S.dit} »` : ''), current_variant: S.vue, time_s: +S.t.toFixed(2),

/** Zone d’écriture du bas : le professeur efface les plus vieilles lignes (copie du modèle). */
function zoneEcriture(c, M, liste, ys, o = {}) {
  const S = M.S, x = o.x ?? 14, max = o.max ?? 730, taille = o.taille ?? 17, n = ys.length, vues = [];
  if (S.mesure) {
    for (const e of liste) M.etape(c, e.nom, () => { for (const [t, col] of e.lignes) c.texte(t, x, ys[0], { couleur: col, taille, max }); e.plus && e.plus(c); });

  }

  for (let j = k; j >= 0; j--) { const l = liste[j].lignes.length; if (nb + l > n) break; garde.add(j); nb += l; }

    if (j > k) return;

/** Largeur (cadre) d’une formule écrite à la craie, indices et charges compris. */
function larg(c, s, taille = 17) {

/** Équation « gauche → droite » : la flèche est DESSINÉE (la police n’a pas toutes les flèches). Renvoie { x, w }. */
function eqn(c, x, y, gauche, droite, o = {}) {

/** Petit triangle « attention » à la craie (orange), le « ! » dedans. */

const rgba = ([r, g, b, a], k = 1) => `rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},${(a * k).toFixed(3)})`;

/** Teinte du diiode : incolore → jaune → brun (#8a4b12 au maximum), selon la part f (0 → 1) de la teinte finale. */
const TEINTE = [[0, EAU], [.2, [246, 226, 120, .40]], [.5, [226, 160, 48, .64]], [.8, [168, 96, 26, .80]], [1, [138, 75, 18, .90]]];

/* Vue prelevement : trempe. */
const GB = { x: 40, y: 150, w: 160, h: 150 }, BG = { x: 300, y: 200, w: 120, h: 100 }, CHP = { x: 548, y: 84, r: 26 };
function pipetteEtat(M) {
  const R = [245, 252], A = [120, 150], dansGB = [120, 262], B = [360, 150], dansBG = [360, 258];
  const P = (p, a, b) => [lerp(a[0], b[0], lisse(p)), lerp(a[1], b[1], lisse(p))];
  if (!M.commence('prelevement')) return { pos: R, rempli: 0, a: 1 };
  if (!M.commence('eau_glacee')) {
    const p = M.p('prelevement');
    if (p < .3) return { pos: P(p / .3, R, A), rempli: 0, a: 1 };
    if (p < .5) return { pos: P((p - .3) / .2, A, dansGB), rempli: 0, a: 1 };
    if (p < .7) return { pos: dansGB, rempli: (p - .5) / .2, a: 1 };
    return { pos: P((p - .7) / .3, dansGB, A), rempli: 1, a: 1 };
  }
  if (!M.commence('fige')) {
    const p = M.p('eau_glacee');
    if (p < .35) return { pos: P(p / .35, A, B), rempli: 1, a: 1 };
    if (p < .55) return { pos: P((p - .35) / .2, B, dansBG), rempli: 1, a: 1 };
    if (p < .9) return { pos: dansBG, rempli: 1 - (p - .55) / .35, a: 1 };
    return { pos: dansBG, rempli: 0, a: 1 };
  }
  const p = M.p('fige');
  return { pos: P(p, dansBG, B), rempli: 0, a: 1 - p };
}
const EAU_FROIDE = [200, 228, 245, .16];
function couleurGlace(M) {
  const verse = M.commence('fige') ? 1 : M.commence('eau_glacee') ? clamp((M.p('eau_glacee') - .55) / .35, 0, 1) : 0;
  return melange(EAU_FROIDE, teinte(fT(TP) * .9), verse);
}
function vuePrelevement(c, M) {
  const t = tSim(), pip = pipetteEtat(M);
  c.ligne(20, 302, 470, 302, { couleur: 'faible', largeur: 1.6 });

    const ctx = c.ctx;
    Peint.becher(ctx, GB, .66, teinte(fT(t)));
    const yS = Peint.becher(ctx, BG, .5, couleurGlace(M));
    [[322, -.2], [346, .25], [392, -.1], [372, .4]].forEach(([gx, ang], i) => Peint.glacon(ctx, gx, yS - 1 + (i % 2) * 3, 17 - (i % 2) * 3, ang));
    Peint.pipette(ctx, pip.pos[0], pip.pos[1], pip.rempli, teinte(fT(TP)), pip.a);
  });
  c.texte('grand bécher (100 mL)', GB.x + GB.w / 2, 326, { couleur: 'blanc', taille: 16, align: 'center' });
  c.texte('eau glacée', BG.x + BG.w / 2, 326, { couleur: 'bleu', taille: 17, align: 'center' });
  chrono(c, CHP, t);
  const pastille = (x, col, l1, l2, coul) => {
    c.direct(() => { const ctx = c.ctx; ctx.save(); const g = ctx.createLinearGradient(0, 150, 0, 196); g.addColorStop(0, rgba(eclair(col, .15))); g.addColorStop(1, rgba(sombre(col, .2))); ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(x, 150, 92, 46, 8); ctx.fill(); ctx.restore(); });
    c.rect(x, 150, 92, 46, { arrondi: 8, largeur: 1.6, couleur: 'faible' });
    c.texte(l1, x + 46, 218, { couleur: coul, taille: 15, align: 'center' }); c.texte(l2, x + 46, 236, { couleur: coul, taille: 15, align: 'center' });
  };
  return zoneEcriture(c, M, [
    { nom: 'reaction', lignes: [['le mélange H₂O₂ + I⁻ (milieu acide) brunit : du diiode I₂ se forme', 'blanc']] },
    { nom: 'prelevement', lignes: [[`à t = ${TP} min, la pipette prélève V_p = 10,0 mL du mélange`, 'blanc']] },
    { nom: 'eau_glacee', lignes: [['on le verse dans de l’eau glacée : refroidi et dilué d’un coup', 'bleu']] },
    { nom: 'fige', lignes: [['sa teinte ne bouge plus : la réaction y est bloquée', 'jaune']],
      plus: () => pastille(500, teinte(fT(TP) * .9), 'prélèvement', 'figé', 'bleu') },
    { nom: 'continue', lignes: [['pendant ce temps, le grand bécher continue de foncer', 'blanc']],
      plus: () => c.direct(() => pastille(620, teinte(fT(tSim())), 'grand bécher', 'continue', 'blanc')) },
    { nom: 'phrase', lignes: [['on titrera ensuite le diiode du prélèvement : on aura x à t = 8 min', 'blanc']],
      plus: () => { c.rect(492, 248, 254, 76, { couleur: 'jaune', largeur: 1.8, arrondi: 8 });
        c.texte('trempe : on bloque la', 502, 272, { couleur: 'jaune', taille: 17 }); c.texte('réaction pour mesurer x', 502, 294, { couleur: 'jaune', taille: 17 }); c.texte('à cette date', 502, 316, { couleur: 'jaune', taille: 17 }); } },
  ], ZY);
}

/* Vue titrage. */
const BUR = { x: 170, yH: 50, yp: 192 }, BT = { x: 100, y: 206, w: 110, h: 96 }, PX = 300;
/** Teinte pendant le titrage : brun → jaune pâle → incolore à l’équivalence (racine : pour l’œil, le jaune pâle reste visible jusqu’au bout). */
const fTitre = Vv => fT(TP) * Math.sqrt(clamp(1 - Vv / VE, 0, 1));
/** Volume versé (mL) selon l’étape. */
function vVerse(M) {
  if (!M.commence('verser')) return 0;
  if (!M.commence('equivalence')) return 12.2 * lisse(M.p('verser'));
  return 12.2 + .4 * M.p('equivalence');
}
function vueTitrage(c, M) {
  const Vv = vVerse(M), f = fTitre(Vv);
  const a = lisse(M.p('burette'));
  c.ligne(60, 304, 280, 304, { couleur: 'faible', largeur: 1.6 });
  c.direct(() => {
    const ctx = c.ctx;
    const yS = Peint.becher(ctx, BT, .45, teinte(f));
    if (M.commence('burette')) Peint.burette(ctx, BUR.x, BUR.yH, BUR.yp, 1 - Vv / 25, THIO, a);
    const enCours = M.commence('verser') && (!M.commence('equivalence') || M.p('equivalence') < .9);
    if (enCours) for (let k = 0; k < 2; k++) { const ph = ((M.S.t * 2.2 + k * .5) % 1); Peint.goutte(ctx, BUR.x, BUR.yp + 4 + ph * (yS - BUR.yp - 6), [235, 240, 248, .3]); }
  });
  M.etape(c, 'burette', () => {
    c.texte('S₂O₃²⁻', BUR.x - 16, 70, { couleur: 'blanc', taille: 16, align: 'right' });
    c.texte('C = 0,020 mol/L', BUR.x - 16, 92, { couleur: 'blanc', taille: 15, align: 'right' });
    c.texte('prélèvement (t = 8 min)', BT.x + BT.w / 2, 326, { couleur: 'blanc', taille: 15, align: 'center' });
  });
  if (M.commence('verser')) c.direct(() => c.texte(`V = ${fr(Vv, 1)} mL`, BUR.x - 16, 132, { couleur: M.commence('equivalence') && M.p('equivalence') >= 1 ? 'jaune' : 'blanc', taille: 17, align: 'right' }));
  M.etape(c, 'equivalence', () => { c.texte('V_E = 12,6 mL', BUR.x - 16, 158, { couleur: 'jaune', taille: 18, align: 'right' }); c.texte('incolore', BT.x + BT.w + 18, 262, { couleur: 'jaune', taille: 15 }); });
  M.etape(c, 'equation', () => { c.texte('équation du titrage :', PX, 74, { couleur: 'cyan', taille: 17 }); eqn(c, PX + 10, 102, 'I₂ + 2S₂O₃²⁻', '2I⁻ + S₄O₆²⁻', { taille: 18 }); });
  M.etape(c, 'relation', () => {
    c.texte('à l’équivalence : n(I₂) = C·V_E/2', PX, 140, { couleur: 'blanc', taille: 18 });
    c.texte('= 0,020 × 12,6·10⁻³ / 2 = 1,26·10⁻⁴ mol (prélèvement)', PX + 20, 166, { couleur: 'faible', taille: 16 });
    c.texte('dans le mélange : × 10', PX, 200, { couleur: 'blanc', taille: 18 });
    c.texte('(10,0 mL prélevés sur 100 mL)', PX + 196, 200, { couleur: 'faible', taille: 15 });
  });
  M.etape(c, 'resultat', () => {
    c.rect(PX - 8, 220, 300, 40, { couleur: 'jaune', largeur: 2, arrondi: 8 });
    c.texte('x = n(I₂) = 1,26 mmol', PX + 6, 248, { couleur: 'jaune', taille: 20 });
    c.texte('à t = 8 min', PX + 214, 248, { couleur: 'jaune', taille: 15 });
  });
  return zoneEcriture(c, M, [
    { nom: 'burette', lignes: [['le prélèvement de t = 8 min (10,0 mL, refroidi) contient du diiode I₂ : il est brun', 'blanc']] },
    { nom: 'verser', lignes: [['le thiosulfate consomme le diiode : le brun pâlit, jaune pâle', 'blanc']] },
    { nom: 'equivalence', lignes: [['équivalence : tout le diiode est consommé, la solution devient incolore', 'jaune']] },
    { nom: 'equation', lignes: [['réaction de titrage : rapide et totale', 'blanc']] },
    { nom: 'relation', lignes: [['n(I₂) = C·V_E/2 car il faut 2 S₂O₃²⁻ pour 1 I₂', 'blanc']] },
    { nom: 'resultat', lignes: [['n(I₂) formé = x (tableau d’avancement) : x(8 min) = 1,26 mmol', 'jaune']] },
  ], ZY);
}

/* ── Repères ─────────────────────────────────────────────────────────── */
function reperes(c, M) {

    R('vignette_conductimetrie', VG[1].x, VG[1].y, VG[1].w, VG[1].h, `la vignette 2 : conductimétrie (bécher, cellule, conductimètre)${quand('conductimetrie')}`);

    R('afficheur', AFF.x - 4, AFF.y - 4, AFF.w + 8, AFF.h + 30, `l’afficheur du conductimètre : σ = 0,170 S/m${quand('conductimetrie')}`);

    R('chrono', CHM.x - CHM.r - 4, CHM.y - CHM.r - 10, 130, 2 * CHM.r + 16, `le chronomètre : t = ${min(t)} (temps accéléré)`);
    R('tableau', TBM.x, TBM.y, TBM.w, TBM.h, 'le tableau des mesures t (min) → x (mmol)');
    R('ligne_premiere', TBM.x + 30, yLigne(0) - 18, 280, 24, `la première ligne : « t = 0 min : x = 0 mmol »${quand('premiere_mesure')}`);
    R('ligne_derniere', TBM.x + 30, yLigne(9) - 18, 280, 24, `la dernière ligne : « t = 40 min : x = 1,99 mmol »${quand('mesures')}`);

    R('teinte_continue', 614, 144, 104, 98, `la teinte du grand bécher, qui continue de foncer${quand('continue')}`);

  } else {

    R('becher', BT.x - 8, BT.y - 6, BT.w + 16, BT.h + 12, `le prélèvement : ${nomTeinte(fTitre(vVerse(M)))}`);

    R('equation', PX - 4, 56, 400, 54, `I₂ + 2S₂O₃²⁻ → 2I⁻ + S₄O₆²⁻${quand('equation')}`);
    R('relation', PX - 4, 122, 446, 86, `« à l’équivalence : n(I₂) = C·V_E/2 » ; « dans le mélange : × 10 »${quand('relation')}`);
    R('resultat', PX - 8, 220, 300, 40, `« x = n(I₂) = 1,26 mmol »${quand('resultat')}`);
  }

/* ── Ce que voit le tuteur ─────────────────────────────────────────────── */
function voir(M) {
  const v = M.S.vue, m = [`Vue « ${v} » (${TITRES[v]}), ${M.etat()}.`];
  const etape = (() => { let n = 'avant le début'; for (const e of M.evs()) if (M.commence(e.nom)) n = e.nom; return n; })();
  m.push(`Étape en cours : ${etape}.`);
  if (v === 'methodes') {
    const vus = [];
    if (M.commence('titrage')) vus.push('1) titrage d’un prélèvement : bécher brun, pipette, burette de thiosulfate');
    if (M.commence('conductimetrie')) vus.push('2) conductimétrie : bécher, cellule à deux plaques, conductimètre dont l’afficheur indique 0,170 (σ en S/m)');
    if (M.commence('pression')) vus.push('3) pression d’un gaz : ballon fermé par un bouchon, ruban de magnésium dans l’acide, bulles de H₂, manomètre à aiguille');
    m.push(vus.length ? `Vignettes dessinées : ${vus.join(' ; ')}. Sous chacune : « mesure → avancement x ».` : 'Pas encore de vignette.');
    if (M.commence('point_commun')) m.push('Cadre jaune : « on mesure une grandeur à des dates, on en déduit x(t) ».');
  } else if (v === 'mesures') {
    const t = tSim(), n = M.commence('premiere_mesure') ? MESURES.filter(([d]) => d <= t + 1e-6).length : 0;
    m.push(`Bécher de l’exemple A (100 mL, H₂O₂ 2,0 mmol + I⁻ 10,0 mmol, milieu acide), teinte ${nomTeinte(fT(t))} ; chronomètre t = ${min(t)} (temps simulé, accéléré).`);
    m.push(n ? `Lignes du tableau écrites (${n}) : ${MESURES.slice(0, n).map(([d, x]) => `t = ${d} min : x = ${x} mmol`).join(' ; ')}.` : 'Tableau des mesures encore vide.');
  } else if (v === 'prelevement') {
    const t = tSim();
    m.push(`Temps simulé t = ${min(t)}. Grand bécher : teinte ${nomTeinte(fT(t))}. Bécher d’eau glacée avec des glaçons${M.commence('fige') ? `, qui contient le prélèvement de t = ${TP} min (10,0 mL), teinte figée ${nomTeinte(fT(TP) * .9)}` : ''}.`);
    if (M.commence('prelevement') && !M.vu('fige')) m.push('La pipette de 10,0 mL est en mouvement (prélèvement puis versement dans l’eau glacée).');
    if (M.commence('continue')) m.push('Deux pastilles : « prélèvement figé » et « grand bécher continue » (plus foncé).');
    if (M.commence('phrase')) m.push('Cadre jaune : « trempe : on bloque la réaction pour mesurer x à cette date ».');
  } else {
    const Vv = vVerse(M);
