<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suivre une transformation — au tableau</title>
<link rel="stylesheet" href="/media/simulations/shared/tableau/tableau.css"><link rel="stylesheet" href="cin.css"></head>
<body>
<div class="tableau">
  <section class="scene"><canvas id="canvas" role="img" aria-label="Suivi d’une transformation lente : trois méthodes (titrage, conductimétrie, pression), un bécher qui brunit, des prélèvements dans l’eau glacée de plus en plus bruns et le tableau des mesures où t et x viennent se ranger, le prélèvement et la trempe dans l’eau glacée, le titrage du diiode par le thiosulfate"></canvas></section>
  <footer class="barre">
    <button class="craie-btn principal" id="run" data-professor-control="start reset pause resume play_until set_time">Lancer</button>
    <p class="bulle" id="feedback" role="status" aria-live="polite"></p>
  </footer>
</div>
<script src="/media/simulations/shared/tableau/tableau.js"></script>
<script src="commun.js"></script>
<script src="exposants.js"></script>
<script>
/*
 * Suivi temporel d’une transformation (cours « Suivi temporel d’une transformation, vitesse de réaction », 2e Bac PC BIOF, novembre 2026).
 * Contrat : outils/cours/notes/cours/cinetique_contrat_simulations.md § 1.
 * Vues (?vue=) : methodes (défaut) | mesures | prelevement | titrage. Pas de poignée.
 * Modèle (exemple A, pour le calcul seulement, jamais écrit) : x(t) = 2,0·(1 − e^(−t/8)) mmol.
 */
/* ── Formules chimiques à la craie : indices ₂ et charges ⁺ ⁻ ²⁻ rendus (sans modifier exposants.js ni le kit) ──────────
 * « MnO₄⁻ » devient « MnO_{4}^{−} » ; le découpage « _{…} » accepte tout caractère avant (« [I⁻]₀ »). */
(function () {
  const C = window.Tableau.Craie, P = C.prototype, texteAvant = P.texte, segAvant = C.segments;
  const SUP = { '⁺': '+', '⁻': '−', '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9' };
  const SUB = { '₀': '0', '₁': '1', '₂': '2', '₃': '3', '₄': '4', '₅': '5', '₆': '6', '₇': '7', '₈': '8', '₉': '9' };
  const chim = s => String(s).replace(/[⁺⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, g => '^{' + [...g].map(ch => SUP[ch]).join('') + '}')
    .replace(/[₀₁₂₃₄₅₆₇₈₉]+/g, g => '_{' + [...g].map(ch => SUB[ch]).join('') + '}');
  C.segments = function (s) {
    const out = [], re = /_\{([^}]+)\}/g; let i = 0, m;
    while ((m = re.exec(s))) { if (m.index > i) out.push(...segAvant(s.slice(i, m.index))); out.push({ t: m[1], sub: true }); i = re.lastIndex; }
    if (i < s.length) out.push(...segAvant(s.slice(i)));
    return out;
  };
  P.texte = function (s, x, y, o) { return texteAvant.call(this, chim(s), x, y, o); };
  window.chim = chim;
})();

/* ── Moteur du déroulé (copie de physics/circuit-rlc-tableau/circuit-lc.html, + M.evs) ─────────────────────────────────── */
const { fr, bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lisse = p => p * p * (3 - 2 * p);
const lerp = (a, b, f) => a + (b - a) * f;
const fx = (v, d = 2) => fr(v, d).replace(/(,\d*?)0+$/, '$1').replace(/,$/, '');
const ECRITURE = 2.5;
function Moteur(o) {
  const q = new URLSearchParams(location.search);
  const S = { vue: o.vues.includes(q.get('vue')) ? q.get('vue') : o.vues[0], t: 0, running: false, pause: false, fait: false,
    jusqua: null, motif: '', emis: 0, dit: '', mesure: false };
  const V = o.vitesse ?? 1.7, T0 = o.T0 ?? .8, HOLD = {};
  let TL = null;
  function construire() {
    let s = T0; const ev = [];
    for (const e of o.etapes(S.vue)) {
      const anim = e.anim || 0, d = { ...e, anim, debut: s, ecrit: s + (e.ecritDes ?? anim) };
      d.fin = Math.max(s + anim, d.ecrit + (HOLD[e.nom] ?? 1.5)) + .35;
      s = d.fin; ev.push(d);
    }
    const mom = {}; for (const e of ev) mom[e.nom] = e.fin; mom.fin = s + (o.queue ?? .6);
    TL = { ev, M: mom };
  }
  const ev = nom => TL.ev.find(e => e.nom === nom);
  const M = {
    S, ev, evs: () => TL.ev, Moments: () => TL.M,
    p(nom) { const e = ev(nom); if (!e) return 0; return e.anim > 0 ? clamp((S.t - e.debut) / e.anim, 0, 1) : (S.t >= e.debut - 1e-6 ? 1 : 0); },
    commence(nom) { const e = ev(nom); return !!e && S.t > e.debut + 1e-6; },
    vu(nom) { if (nom === 'fin') return S.t >= TL.M.fin - 1e-6; const e = ev(nom); return !!e && S.t >= e.fin - 1e-6; },
    etape(c, nom, fn) {
      const e = ev(nom); if (!e) return;
      const t = c.t, cur = c.cur, comp = c.complet, w0 = e.ecrit;
      c.t = S.t > 1e5 ? 1e9 : w0 + (S.t - w0) * V; c.cur = w0;
      try { fn(); } finally { if (S.mesure) HOLD[nom] = Math.max(HOLD[nom] || 0, (c.cur - w0) / V); c.t = t; c.cur = cur; if (!S.running) c.complet = comp; }
    },
    etat() { return S.running ? 'en cours' : S.fait ? 'fin' : S.pause ? 'arrêt sur image' : 'pas encore lancée'; },
  };
  const scene = window.OndesTableau.Scene($('canvas'), (c) => o.dessiner(c, M), { large: true });
  const cadreBase = scene.cadre;
  scene.cadre = function (g) { const k = cadreBase.call(scene, g); if (Number.isFinite(k.t)) k.t *= ECRITURE; return k; };
  M.scene = scene; M.craie = scene.craie;
  const local = scene.local;   // tableau large : la figure est agrandie, les poignées suivent
  scene.local = (x, y) => { const [a, b] = local(x, y); return [(a - LARGE.dx) / LARGE.k, (b - LARGE.dy) / LARGE.k]; };
  function calculer() {
    construire();
    const t = S.t, r = S.running; S.t = 1e6; S.running = false; S.mesure = true;
    for (const k of Object.keys(HOLD)) delete HOLD[k];   // une étape dessinée en plusieurs morceaux garde le plus long (max ci-dessus)
    try { o.dessiner(scene.craie, M); } finally { S.t = t; S.running = r; S.mesure = false; }
    construire(); scene.sale = true;
  }
  const sansSouligne = s => String(s).replace(/([A-Za-zΔτθ])_\{?([A-Za-z0-9]+)\}?/g, (m, a, i) => a + (/^\d+$/.test(i) ? [...i].map(d => '₀₁₂₃₄₅₆₇₈₉'[d]).join('') : i));
  const dire = (texte, kind = '') => { texte = sansSouligne(texte); S.dit = texte; bulle($('feedback'), texte, kind); };
  const etiquette = () => { $('run').textContent = S.running ? 'Pause' : S.pause ? 'Reprendre' : S.fait ? 'Rejouer' : 'Lancer'; };
  let pont = null;
  const emettre = () => pont && pont.emettre();
  const noter = (a, d) => pont && pont.noter(a, d);
  scene.avancer = dt => {
    if (!S.running) return !!(o.anime && o.anime());
    const avant = S.t; S.t += dt;
    for (const e of TL.ev) if (avant < e.debut && S.t >= e.debut && e.bulle) dire(e.bulle());
    if (S.jusqua != null && S.t >= S.jusqua) {
      S.t = S.jusqua; S.jusqua = null; S.running = false;
      if (S.t >= TL.M.fin - 1e-6) { finir(); return true; }
      S.pause = true; etiquette(); dire('Arrêt sur image : ' + (S.motif || `t = ${fx(S.t, 1)} s`) + '.');
      noter('pause', { time_s: +S.t.toFixed(2) }); emettre(); return true;
    }
    if (S.t >= TL.M.fin) { S.t = TL.M.fin; finir(); return true; }
    if (performance.now() - S.emis > 500) { S.emis = performance.now(); emettre(); }
    return true;
  };
  function finir() { S.running = false; S.fait = true; S.pause = false; S.jusqua = null; etiquette(); dire(o.messageFin(M), 'good'); noter('measurement', o.params(M)); emettre(); }
  function start() { o.reprise && o.reprise(); S.t = 0; S.jusqua = null; S.motif = ''; S.running = true; S.pause = false; S.fait = false; etiquette(); dire(o.depart(M)); noter('start', o.params(M)); emettre(); }
  function pause() { if (!S.running) return; S.running = false; S.pause = true; S.jusqua = null; etiquette(); dire('Arrêt sur image.'); noter('pause', { time_s: +S.t.toFixed(2) }); emettre(); }
  function resume() { if (S.running) return; o.reprise && o.reprise(); if (!S.pause) return start(); S.running = true; S.pause = false; etiquette(); dire('Ça repart…'); noter('resume'); emettre(); }
  function setTime(p) {
    const t = +p.time_s; if (p.time_s === null || p.time_s === '' || !Number.isFinite(t)) return;
    o.reprise && o.reprise(); S.running = false; S.jusqua = null; S.t = clamp(t, 0, TL.M.fin); S.fait = S.t >= TL.M.fin - 1e-6; S.pause = !S.fait && S.t > 0;
    etiquette(); scene.sale = true; dire(`Arrêt sur image : t = ${fx(S.t, 1)} s.`); noter('set_time', { time_s: S.t }); emettre();
  }
  function playUntil(p) {
    const noms = o.etapes(S.vue).map(e => e.nom).concat('fin');
    const nom = noms.includes(p.moment) ? p.moment : null, cible = nom ? TL.M[nom] : +p.time_s;
    if (!Number.isFinite(cible) || (p.moment && !nom && (p.time_s == null || p.time_s === ''))) { dire(`Moment inconnu : ${p.moment}.`, 'bad'); emettre(); return; }
    o.reprise && o.reprise();
    if (S.fait || S.t >= cible - 1e-3) { S.t = 0; S.fait = false; }
    S.jusqua = clamp(cible, .01, TL.M.fin); S.motif = nom ? (o.motifs[nom] || nom) : ''; S.running = true; S.pause = false; etiquette(); dire('Observe…');
    noter('play_until', { moment: nom, time_s: S.jusqua }); emettre();
  }
  function setParameters(p) {
    p = p || {};
    const r = o.appliquer(p, M) || {};
    if (r.vue && o.vues.includes(r.vue) && r.vue !== S.vue) { S.vue = r.vue; r.change = true; r.vueChange = true; }
    if (r.change) { calculer(); if (r.vueChange) scene.reecrire(); }
    noter('set_parameters', o.params(M));
    if (r.apres) r.apres();
    else if (r.change && !r.garder) start();
    else { scene.sale = true; emettre(); }
  }
  Object.assign(M, { noter, calculer, dire, start, pause, resume, setTime, playUntil, setParameters, emettre, etiquette });
  $('run').onclick = () => (S.running ? pause() : S.pause ? resume() : start());
  window.Tableau.explication(o.explications);
  const commandes = ['start', 'reset', 'pause', 'resume', 'set_time', 'set_parameters', 'play_until'];
  M.lancer = () => {
    calculer();
    const listeMoments = o.vues.map(v => `${o.vues.length > 1 ? v + ' : ' : ''}${o.etapes(v).map(e => e.nom).concat('fin').join(' | ')}`).join(' ; ');
    const config = { id: o.id, version: '1.0', title: o.titre, variants: o.vues.length > 1 ? o.vues.map(id => ({ id, label: o.titres[id] })) : [], commands: commandes,
      command_schema: { set_parameters: o.schema, set_time: { time_s: '0..fin (arrêt sur cet instant de la scène, en s ; voir moments)' },
        play_until: { moment: listeMoments, time_s: 'ou un instant en s' } } };
    pont = protocole({ id: o.id, commandes, config, texte: o.texte,
      etat: () => ({ simulation_status: S.running ? 'running' : S.fait ? 'finished' : S.pause ? 'paused' : 'idle',
        ce_qui_se_voit: o.voir(M) + (S.dit ? ` La bulle dit : « ${S.dit} »` : ''), current_variant: S.vue, time_s: +S.t.toFixed(2),
        parameters: o.params(M), moments: Object.fromEntries(Object.entries(TL.M).map(([k, v]) => [k, +v.toFixed(2)])) }),
      progression: () => (S.fait ? 1 : 0),
      executer: (cmd, p) => ({ start, reset: start, pause, resume, set_time: () => setTime(p), set_parameters: () => setParameters(p), play_until: () => playUntil(p) })[cmd]?.() });
    dire(o.depart(M));
    setTimeout(() => { if (!S.running && S.t === 0 && !S.pause && !S.fait) start(); }, 900);
  };
  return M;
}
/** Zone d’écriture du bas : le professeur efface les plus vieilles lignes (copie du modèle). */
/* ── Tableau large (15 novembre 2026, demande de l'utilisateur : « mieux exploiter tout le tableau, grands calibres de
 * texte, simulations agrandies » ; « le texte du bas mieux à gauche de l'écran, le diagramme plus étendu ») ─────────────
 * Quand le tableau est large (scene.L ≥ 1000 : écran d'ordinateur portable), la figure (tout le dessin sauf les phrases
 * écrites en bas) est agrandie d'un facteur k et posée à droite sur toute la hauteur ; les phrases écrites au fil du
 * déroulé passent dans une colonne à gauche, coupées à la ligne et plus grosses. Les repères pointés par le professeur
 * suivent tout seuls (ils sont pris dans la transformation du dessin), les poignées aussi (scene.local).
 * Sinon (grand écran, scene.L < 1000) : la disposition d'origine 760 × 420, centrée. */
const LARGE = { actif: false, k: 1, dx: 0, dy: 0, base: null, echelle: 1, gauche: 0, taille: 20, ys: [] };
const HAUT_FIGURE = 340;                            // bas de la figure tant que sa boîte n'est pas relevée
const BOITES = {};   // par vue : la boîte de l'encre de la figure (sans les phrases écrites), relevée pendant la passe de mesure du moteur
let RELEVE = null;
/** Pendant la passe de mesure du moteur (image finale) : relève l'encre de la figure, hors colonne de gauche. */
function relever(c, M) {
  if (M.S.mesure && !RELEVE) {
    const b = { x0: Infinity, x1: -Infinity, y0: Infinity, y1: -Infinity }, f = { trait: c.trait, texte: c.texte, point: c.point, repere: c.repere };
    const pt = (x, y) => { if (!LARGE.dansGauche && Number.isFinite(x) && Number.isFinite(y)) { b.x0 = Math.min(b.x0, x); b.x1 = Math.max(b.x1, x); b.y0 = Math.min(b.y0, y); b.y1 = Math.max(b.y1, y); } };
    c.trait = function (pts, o) { for (const p of pts || []) pt(p[0], p[1]); return f.trait.call(this, pts, o); };
    // les objets peints (bécher, appareil…) ne passent pas par la craie : leurs repères donnent leur place
    c.repere = function (id, x, y, w, h, l) { if (w < 600 && h < 400) { pt(x, y); pt(x + w, y + h); } return f.repere.call(this, id, x, y, w, h, l); };
    c.point = function (x, y, r = 4, col) { pt(x - r, y - r); pt(x + r, y + r); return f.point.call(this, x, y, r, col); };
    c.texte = function (s, x, y, o = {}) {
      const t = o.taille ?? 18; let l = larg(this, String(s), t); if (o.max && l > o.max) l = o.max;
      const a = o.align === 'center' ? x - l / 2 : o.align === 'right' ? x - l : x; pt(a, y + t * .3); pt(a + l, y - t * .8);
      return f.texte.call(this, s, x, y, o);
    };
    RELEVE = { b, vue: M.S.vue, gauche: false };
  } else if (!M.S.mesure && RELEVE) {
    delete c.trait; delete c.texte; delete c.point; delete c.repere;
    const b = RELEVE.b; b.gauche = RELEVE.gauche; if (b.x1 > b.x0) BOITES[RELEVE.vue] = b;

/* Deuxième passe (15 novembre 2026, « agrandir les figures elles-mêmes, pas seulement le texte autour ») : sur un tableau
 * large, les tailles sont choisies en PIXELS À L'ÉCRAN (u(px) = px / échelle). La boîte de la figure (haut ET bas relevés)
 * prend toute la hauteur ; la colonne de gauche s'écrit en 20 px à l'écran et ne prend que la largeur que la figure laisse
 * (entre 28 % et 45 % du tableau) ; le titre interne est retiré (le titre de la diapositive le dit déjà) ; aucun texte de la
 * figure sous 17 px à l'écran. Même idée que figures.html (disposer). */
function agrandir(c, scene, M) {
  const L = scene.L;
  relever(c, M);
  LARGE.actif = L >= 1000;
  if (typeof AVANT_LARGE === 'function') AVANT_LARGE(L, LARGE.actif);   // la page adapte sa géométrie au tableau large
  if (!LARGE.actif) {   // grand écran : la figure d'origine, centrée sur la largeur du tableau
    Object.assign(LARGE, { k: 1, dx: Math.max(0, (L - 760) / 2), dy: 0 }); c.ctx.translate(LARGE.dx, 0);
    if (c.cadre) c.cadre = { ...c.cadre, w: 760 };

  }
  const s0 = c.echelle || 1, u = px => px / s0;
  const b = BOITES[M.S.vue] || { x0: 0, x1: 760, y0: 40, y1: HAUT_FIGURE, gauche: true };
  const AJ = (typeof AJUSTE_LARGE !== 'undefined' && AJUSTE_LARGE[M.S.vue]) || {};
  const x0 = b.x0 - 10, x1 = Math.max(b.x1 + 10, x0 + 300), y0 = Math.max(0, (b.y0 ?? 40) - 8), y1 = Math.max(b.y1 + 8, y0 + 160);
  const HMAX = 420 - 8, kH = HMAX / (y1 - y0), KMAX = AJ.kmax ?? 2;

  if (b.gauche) {

    const kNat = Math.min(kH, KMAX), wNat = (x1 - x0) * kNat;

  const dx = b.gauche ? L - u(6) - x1 * k : (L - (x1 - x0) * k) / 2 - x0 * k;
  Object.assign(LARGE, { k, dx, dy, base: c.ctx.getTransform(), echelle: c.echelle, gauche: dx + x0 * k - u(10), ys: [] });
  const pas = Math.round(LARGE.taille * 1.3);
  for (let y = Math.round(LARGE.taille + u(10)); y <= 420 - u(6); y += pas) LARGE.ys.push(y);
  c.ctx.translate(dx, dy); c.ctx.scale(k, k); if (c.echelle) c.echelle *= k;
  c.tailleMin = AJ.min ?? 18;   // aucun texte de la figure sous 18 px à l’écran

}
/** Le titre interne de la figure : seulement hors tableau large (le titre de la diapositive le dit déjà), hors boîte. */
function titreFigure(c, t, o) {
  if (LARGE.actif) return;
  const g = LARGE.dansGauche; LARGE.dansGauche = true;
  try { c.texte(t, 14, 26, o); } finally { LARGE.dansGauche = g; }
}
/** Dessine `fn` dans la colonne de gauche (coordonnées du tableau entier, sans l'agrandissement de la figure). */
function aGauche(c, fn) {
  LARGE.dansGauche = true; if (RELEVE) RELEVE.gauche = true;
  if (!LARGE.actif) { try { return fn(); } finally { LARGE.dansGauche = false; } }
  const ctx = c.ctx, m = ctx.getTransform(), e = c.echelle, k = c.cadre, t0 = c.tip;
  ctx.setTransform(LARGE.base); c.echelle = LARGE.echelle; if (k) c.cadre = { ...k, w: LARGE.gauche, h: 420 };
  try { return fn(); } finally {
    LARGE.dansGauche = false;
    ctx.setTransform(m); c.echelle = e; c.cadre = k;
    if (c.tip && c.tip !== t0) c.tip = [(c.tip[0] - LARGE.dx) / LARGE.k, (c.tip[1] - LARGE.dy) / LARGE.k];

}
/** Une phrase coupée en lignes qui tiennent dans `max` (mesurée à la craie) ; une formule « a = b » ne se coupe pas. */
function couper(c, t, max, taille) {
  const mots = String(t).replace(/ ([=≈×→<>≤≥]) /g, '\u00a0$1\u00a0').replace(/\([^()]{1,18}\)/g, m => m.replace(/ /g, '\u00a0'))
    .replace(/(\d) (?=(mmol|mol|min|mL|L|s|h|K|Pa|g|mS|S|°C)\b)/g, '$1\u00a0').split(' ')
    .flatMap(m => (larg(c, m.replace(/\u00a0/g, ' '), taille) > max ? m.split('\u00a0') : [m])), out = []; let l = '';
  for (const m of mots) { const e = l ? l + ' ' + m : m; if (l && larg(c, e, taille) > max) { out.push(l); l = m; } else l = e; }
  if (l) out.push(l);
  return out.map(s => s.replace(/\u00a0/g, ' '));
}
function zoneEcriture(c, M, liste, ys, o = {}) {
  const S = M.S; let x = o.x ?? 14, max = o.max ?? 730, taille = o.taille ?? 17;
  if (LARGE.actif) {   // tableau large : la colonne de gauche, chaque phrase à la ligne (le tuteur garde la phrase entière)
    x = 14; max = LARGE.gauche - 18; taille = LARGE.taille; ys = LARGE.ys;
    liste = liste.map(e => ({ ...e, lignes: aGauche(c, () => e.lignes.flatMap(([t, col]) => couper(c, t, max, taille).map((l, i) => [l, col, i ? false : t]))) }));
  }

/** Position de la pipette pendant un prélèvement (p de 0 à 1) vers le tube k. */
function pipetteMesure(p, k, ySol) {
  const P = (f, a, b) => [lerp(a[0], b[0], lisse(f)), lerp(a[1], b[1], lisse(f))];
  const dans = [REPOS[0], ySol + 22], haut = [xTube(k), TUBE.haut - 18], tube = [xTube(k), TUBE.haut + 26];
  if (p < .14) return { pos: P(p / .14, REPOS, dans), r: 0 };
  if (p < .24) return { pos: dans, r: (p - .14) / .1 };
  if (p < .32) return { pos: P((p - .24) / .08, dans, REPOS), r: 1 };
  if (p < .46) return { pos: P((p - .32) / .14, REPOS, haut), r: 1 };
  if (p < .52) return { pos: P((p - .46) / .06, haut, tube), r: 1 };
  if (p < .64) return { pos: tube, r: 1 - (p - .52) / .12 };
  if (p < .78) return { pos: P((p - .64) / .14, tube, REPOS), r: 0 };
  return { pos: REPOS, r: 0 };
}
function vueMesures(c, M) {
  const t = tSim(), niv = .62 * lisse(M.p('melange')), { cours, finis } = etatMesures(M);
  const yLiq = BM.y + BM.h - 3 - .62 * (BM.h - 16);
  eqn(c, 724, 26, 'H₂O₂ + 2I⁻ + 2H⁺', 'I₂ + 2H₂O', { align: 'right', taille: 15 });
  c.direct(() => {
    const ctx = c.ctx;
    Peint.becher(ctx, BM, niv, teinte(fT(t)));
    if (M.commence('melange') && M.p('melange') < 1) Peint.filet(ctx, BM.x + BM.w * .4, 64, BM.y + BM.h - 3 - niv * (BM.h - 16), EAU);
    for (let k = 0; k < MESURES.length; k++) {
      const n = finis.has(k) ? 1 : cours.k === k ? clamp((cours.p - .52) / .12, 0, 1) : 0;
      tubeEssai(ctx, xTube(k), n, teinte(fT(MESURES[k][0])));
    }
    Peint.bain(ctx, BAIN, Y_BAIN, EAU_GLACE);
    [[214, -.2], [298, .3], [372, -.1], [452, .4], [522, .15]].forEach(([gx, ang], i) => Peint.glacon(ctx, gx, Y_BAIN + 2 + (i % 2) * 3, 13 - (i % 2) * 2, ang));
    if (M.vu('melange') || M.commence('premiere_mesure')) {
      const pip = cours.k >= 0 ? pipetteMesure(cours.p, cours.k, yLiq) : { pos: REPOS, r: 0 };
      pipetteCourte(ctx, pip.pos[0], pip.pos[1], pip.r, teinte(fT(cours.k >= 0 ? MESURES[cours.k][0] : t)));
    }
  });
  c.ligne(26, 300, 548, 300, { couleur: 'faible', largeur: 1.6 });
  c.texte('100 mL de mélange', BM.x + BM.w / 2, 322, { couleur: 'blanc', taille: 16, align: 'center' });
  c.texte('prélèvements dans l’eau glacée', BAIN.x + BAIN.w / 2, 156, { couleur: 'bleu', taille: 15, align: 'center' });
  chrono(c, CHM, t);
  // le tableau vide (craie), écrit pendant le montage
  M.etape(c, 'montage', () => {
    c.rect(TBM.x, TBM.y, TBM.w, TBM.h, { couleur: 'blanc', largeur: 1.6, arrondi: 4, duree: .25 });
    c.ligne(TBM.x, TBM.y + TBM.hT, TBM.x + TBM.w, TBM.y + TBM.hT, { largeur: 1.4, duree: .1 });
    c.ligne(TBM.xs, TBM.y, TBM.xs, TBM.y + TBM.h, { largeur: 1.4, duree: .1 });
    c.texte('t (min)', xColT, TBM.y + 20, { couleur: 'cyan', taille: 15, align: 'center' });
    c.texte('x (mmol)', xColX, TBM.y + 20, { couleur: 'cyan', taille: 15, align: 'center' });
    for (let k = 0; k < MESURES.length; k++) c.texte(String(MESURES[k][0]), xTube(k), 318, { couleur: 'faible', taille: 13, align: 'center', duree: .05 });
  });
  // pendant chaque prélèvement : x apparaît sur le tube, puis t et x volent dans leurs cases
  c.direct(() => {
    for (let k = 0; k < MESURES.length; k++) {
      const pk = finis.has(k) ? 1 : cours.k === k ? cours.p : -1;
      if (pk >= .64) c.texte(MESURES[k][1], xTube(k), TUBE.haut - 8, { couleur: 'jaune', taille: 13, align: 'center', alpha: clamp((pk - .64) / .06, 0, 1) * .9 });
      if (pk >= .7 && pk < 1) {
        const f = lisse(clamp((pk - .74) / .26, 0, 1)), a = clamp((pk - .7) / .04, 0, 1);
        c.texte(MESURES[k][1], lerp(xTube(k), xColX, f), lerp(TUBE.haut - 8, yLigne(k), f), { couleur: 'jaune', taille: lerp(13, 15, f), align: 'center', alpha: a });
        c.texte(String(MESURES[k][0]), lerp(xTube(k), xColT, f), lerp(318, yLigne(k), f), { couleur: 'blanc', taille: lerp(13, 15, f), align: 'center', alpha: a });
      }
    }
  });
  const vues = zoneEcriture(c, M, [
    { nom: 'montage', lignes: [['le matériel : le bécher, dix tubes dans l’eau glacée, un chronomètre, le tableau t → x', 'blanc']] },
    { nom: 'melange', lignes: [['t = 0 : H₂O₂ (2,0 mmol) + I⁻ (10,0 mmol) + H⁺ en excès, 100 mL, incolore', 'blanc']] },
    { nom: 'premiere_mesure', lignes: [['à t = 0 : pas encore de diiode, x = 0 mmol', 'blanc']] },
    { nom: 'mesure_2', lignes: [['à chaque date : un prélèvement dans l’eau glacée (trempe), titré : on a x', 'blanc']] },
    { nom: 'mesure_4', lignes: [] },
    { nom: 'mesure_8', lignes: [['les tubes foncent : de plus en plus de diiode, x augmente', 'blanc']] },
    { nom: 'mesures', lignes: [] },
    { nom: 'tableau_fini', lignes: [['x augmente vite au début, puis de moins en moins : x ≈ 2,0 mmol à la fin', 'jaune']],
      plus: () => c.rect(TBM.xs + 4, TBM.y + TBM.hT + 3, TBM.x + TBM.w - TBM.xs - 8, TBM.h - TBM.hT - 6, { couleur: 'jaune', largeur: 2, arrondi: 6 }) },
  ], ZY);
  // la ligne k s’écrit à la craie quand les nombres arrivent dans les cases
  for (const e of M.evs()) {
    if (!e.mes) continue;
    M.etape(c, e.nom, () => {
      const w0 = c.cur, V = 1.7;
      for (const { k, d } of tripsDe(e)) {
        c.depuis(w0 + (d + e.trip) * V);
        c.texte(String(MESURES[k][0]), xColT, yLigne(k), { couleur: 'blanc', taille: 15, align: 'center', duree: .05 });
        c.texte(MESURES[k][1], xColX, yLigne(k), { couleur: k === 9 ? 'jaune' : 'blanc', taille: 15, align: 'center', duree: .08 });
      }
    });
  }
  return vues;
}

/* Vue prelevement : trempe. */
const GB = { x: 40, y: 150, w: 160, h: 150 }, BG = { x: 300, y: 200, w: 120, h: 100 }, CHP = { x: 548, y: 84, r: 26 };
function pipetteEtat(M) {
  const R = [245, 252], A = [120, 150], dansGB = [120, 262], B = [360, 150], dansBG = [360, 258];
  const P = (p, a, b) => [lerp(a[0], b[0], lisse(p)), lerp(a[1], b[1], lisse(p))];
  if (!M.commence('prelevement')) return { pos: R, rempli: 0, a: 1 };
  if (!M.commence('eau_glacee')) {
    const p = M.p('prelevement');
    if (p < .3) return { pos: P(p / .3, R, A), rempli: 0, a: 1 };
    if (p < .5) return { pos: P((p - .3) / .2, A, dansGB), rempli: 0, a: 1 };
    if (p < .7) return { pos: dansGB, rempli: (p - .5) / .2, a: 1 };
    return { pos: P((p - .7) / .3, dansGB, A), rempli: 1, a: 1 };
  }
  if (!M.commence('fige')) {
    const p = M.p('eau_glacee');
    if (p < .35) return { pos: P(p / .35, A, B), rempli: 1, a: 1 };
    if (p < .55) return { pos: P((p - .35) / .2, B, dansBG), rempli: 1, a: 1 };
    if (p < .9) return { pos: dansBG, rempli: 1 - (p - .55) / .35, a: 1 };
    return { pos: dansBG, rempli: 0, a: 1 };
  }
  const p = M.p('fige');
  return { pos: P(p, dansBG, B), rempli: 0, a: 1 - p };
}
const EAU_FROIDE = [200, 228, 245, .16];
function couleurGlace(M) {
  const verse = M.commence('fige') ? 1 : M.commence('eau_glacee') ? clamp((M.p('eau_glacee') - .55) / .35, 0, 1) : 0;
  return melange(EAU_FROIDE, teinte(fT(TP) * .9), verse);
}

  const t = tSim(), pip = pipetteEtat(M);

    Peint.pipette(ctx, pip.pos[0], pip.pos[1], pip.rempli, teinte(fT(TP)), pip.a);

  c.texte('eau glacée', BG.x + BG.w / 2, 326, { couleur: 'bleu', taille: 17, align: 'center' });

  const pastille = (x, col, l1, l2, coul) => {

  };
  return zoneEcriture(c, M, [
    { nom: 'reaction', lignes: [['le mélange H₂O₂ + I⁻ (milieu acide) brunit : du diiode I₂ se forme', 'blanc']] },
    { nom: 'prelevement', lignes: [[`à t = ${TP} min, la pipette prélève V_p = 10,0 mL du mélange`, 'blanc']] },
    { nom: 'eau_glacee', lignes: [['on le verse dans de l’eau glacée : refroidi et dilué d’un coup', 'bleu']] },
    { nom: 'fige', lignes: [['sa teinte ne bouge plus : la réaction y est bloquée', 'jaune']],
      plus: () => pastille(500, teinte(fT(TP) * .9), 'prélèvement', 'figé', 'bleu') },
    { nom: 'continue', lignes: [['pendant ce temps, le grand bécher continue de foncer', 'blanc']],
      plus: () => c.direct(() => pastille(620, teinte(fT(tSim())), 'grand bécher', 'continue', 'blanc')) },
    { nom: 'phrase', lignes: [['on titrera ensuite le diiode du prélèvement : on aura x à t = 8 min', 'blanc']],
      plus: () => { c.rect(492, 248, 254, 76, { couleur: 'jaune', largeur: 1.8, arrondi: 8 });
        c.texte('trempe : on bloque la', 502, 272, { couleur: 'jaune', taille: 17 }); c.texte('réaction pour mesurer x', 502, 294, { couleur: 'jaune', taille: 17 }); c.texte('à cette date', 502, 316, { couleur: 'jaune', taille: 17 }); } },
  ], ZY);
}

/* Vue titrage. */
const BUR = { x: 170, yH: 50, yp: 192 }, BT = { x: 100, y: 206, w: 110, h: 96 }, PX = 300;
/** Teinte pendant le titrage : brun → jaune pâle → incolore à l’équivalence (racine : pour l’œil, le jaune pâle reste visible jusqu’au bout). */
const fTitre = Vv => fT(TP) * Math.sqrt(clamp(1 - Vv / VE, 0, 1));
/** Volume versé (mL) selon l’étape. */
function vVerse(M) {
  if (!M.commence('verser')) return 0;
  if (!M.commence('equivalence')) return 12.2 * lisse(M.p('verser'));
  return 12.2 + .4 * M.p('equivalence');
}
function vueTitrage(c, M) {
  const Vv = vVerse(M), f = fTitre(Vv);
  const a = lisse(M.p('burette'));
  c.ligne(60, 304, 280, 304, { couleur: 'faible', largeur: 1.6 });
  c.direct(() => {
    const ctx = c.ctx;
    const yS = Peint.becher(ctx, BT, .45, teinte(f));
    if (M.commence('burette')) Peint.burette(ctx, BUR.x, BUR.yH, BUR.yp, 1 - Vv / 25, THIO, a);
    const enCours = M.commence('verser') && (!M.commence('equivalence') || M.p('equivalence') < .9);
    if (enCours) for (let k = 0; k < 2; k++) { const ph = ((M.S.t * 2.2 + k * .5) % 1); Peint.goutte(ctx, BUR.x, BUR.yp + 4 + ph * (yS - BUR.yp - 6), [235, 240, 248, .3]); }
  });
  M.etape(c, 'burette', () => {
    c.texte('S₂O₃²⁻', BUR.x - 16, 70, { couleur: 'blanc', taille: 16, align: 'right' });

  });
  if (M.commence('verser')) c.direct(() => c.texte(`V = ${fr(Vv, 1)} mL`, BUR.x - 16, 132, { couleur: M.commence('equivalence') && M.p('equivalence') >= 1 ? 'jaune' : 'blanc', taille: 17, align: 'right' }));
  M.etape(c, 'equivalence', () => { c.texte('V_E = 12,6 mL', BUR.x - 16, 158, { couleur: 'jaune', taille: 18, align: 'right' }); c.texte('incolore', BT.x + BT.w + 18, 262, { couleur: 'jaune', taille: 15 }); });
  M.etape(c, 'equation', () => { c.texte('équation du titrage :', PX, 74, { couleur: 'cyan', taille: 17 }); eqn(c, PX + 10, 102, 'I₂ + 2S₂O₃²⁻', '2I⁻ + S₄O₆²⁻', { taille: 18 }); });
  M.etape(c, 'relation', () => {
    c.texte('à l’équivalence : n(I₂) = C·V_E/2', PX, 140, { couleur: 'blanc', taille: 18 });
    c.texte('= 0,020 × 12,6·10⁻³ / 2 = 1,26·10⁻⁴ mol (prélèvement)', PX + 20, 166, { couleur: 'faible', taille: 16 });
    c.texte('dans le mélange : × 10', PX, 200, { couleur: 'blanc', taille: 18 });
    c.texte('(10,0 mL prélevés sur 100 mL)', PX + 196, 200, { couleur: 'faible', taille: 15 });
  });
  M.etape(c, 'resultat', () => {
    c.rect(PX - 8, 220, 300, 40, { couleur: 'jaune', largeur: 2, arrondi: 8 });
    c.texte('x = n(I₂) = 1,26 mmol', PX + 6, 248, { couleur: 'jaune', taille: 20 });

    { nom: 'burette', lignes: [['le prélèvement de t = 8 min (10,0 mL, refroidi) contient du diiode I₂ : il est brun', 'blanc']] },
    { nom: 'verser', lignes: [['le thiosulfate consomme le diiode : le brun pâlit, jaune pâle', 'blanc']] },
    { nom: 'equivalence', lignes: [['équivalence : tout le diiode est consommé, la solution devient incolore', 'jaune']] },
    { nom: 'equation', lignes: [['réaction de titrage : rapide et totale', 'blanc']] },
    { nom: 'relation', lignes: [['n(I₂) = C·V_E/2 car il faut 2 S₂O₃²⁻ pour 1 I₂', 'blanc']] },
    { nom: 'resultat', lignes: [['n(I₂) formé = x (tableau d’avancement) : x(8 min) = 1,26 mmol', 'jaune']] },

}

  }
}

/* ── Ce que voit le tuteur ─────────────────────────────────────────────── */
function voir(M) {
  const v = M.S.vue, m = [`Vue « ${v} » (${TITRES[v]}), ${M.etat()}.`];
  const etape = (() => { let n = 'avant le début'; for (const e of M.evs()) if (M.commence(e.nom)) n = e.nom; return n; })();
  m.push(`Étape en cours : ${etape}.`);
  if (v === 'methodes') {
    const vus = [];
    if (M.commence('titrage')) vus.push('1) titrage d’un prélèvement : bécher brun, pipette, burette de thiosulfate');
    if (M.commence('conductimetrie')) vus.push('2) conductimétrie : bécher, cellule à deux plaques, conductimètre dont l’afficheur indique 0,170 (σ en S/m)');
    if (M.commence('pression')) vus.push('3) pression d’un gaz : ballon fermé par un bouchon, ruban de magnésium dans l’acide, bulles de H₂, manomètre à aiguille');
    m.push(vus.length ? `Vignettes dessinées : ${vus.join(' ; ')}. Sous chacune : « mesure → avancement x ».` : 'Pas encore de vignette.');
    if (M.commence('point_commun')) m.push('Cadre jaune : « on mesure une grandeur à des dates, on en déduit x(t) ».');
  } else if (v === 'mesures') {
    const t = tSim(), { cours, finis } = etatMesures(M), faits = [...finis].sort((a, b) => a - b);
    m.push(`Bécher peint de l’exemple A (100 mL, H₂O₂ 2,0 mmol + I⁻ 10,0 mmol, milieu acide), teinte ${nomTeinte(fT(t))} ; chronomètre t = ${min(t)} (temps simulé, accéléré). Au milieu, un cristallisoir d’eau glacée avec des glaçons et dix tubes à essais (dates 0, 2, 4, 6, 8, 10, 15, 20, 30, 40 min écrites dessous). À droite, un tableau à deux colonnes t (min) | x (mmol).`);
    if (cours.k >= 0) m.push(`Prélèvement en cours à t = ${MESURES[cours.k][0]} min : la pipette prend le mélange et le verse dans le tube ${MESURES[cours.k][0]} min ; puis x = ${MESURES[cours.k][1]} mmol s’écrit sur le tube et t et x volent dans la ligne du tableau.`);
    m.push(faits.length ? `Tubes remplis (teinte figée par l’eau glacée, x écrit au-dessus) et lignes du tableau écrites (${faits.length}) : ${faits.map(k => `t = ${MESURES[k][0]} min : ${nomTeinte(fT(MESURES[k][0]))}, x = ${MESURES[k][1]} mmol`).join(' ; ')}.` : 'Aucun prélèvement encore : tubes vides, tableau vide.');
    if (M.commence('tableau_fini')) m.push('Colonne x encadrée en jaune ; les tubes vont du plus clair au plus brun.');
  } else if (v === 'prelevement') {
    const t = tSim();
    m.push(`Temps simulé t = ${min(t)}. Grand bécher : teinte ${nomTeinte(fT(t))}. Bécher d’eau glacée avec des glaçons${M.commence('fige') ? `, qui contient le prélèvement de t = ${TP} min (10,0 mL), teinte figée ${nomTeinte(fT(TP) * .9)}` : ''}.`);
    if (M.commence('prelevement') && !M.vu('fige')) m.push('La pipette de 10,0 mL est en mouvement (prélèvement puis versement dans l’eau glacée).');
    if (M.commence('continue')) m.push('Deux petits flacons peints : « prélèvement figé » et « grand bécher continue » (plus foncé).');
    if (M.commence('phrase')) m.push('Cadre jaune : « trempe : on bloque la réaction pour mesurer x à cette date ».');
  } else {
    const Vv = vVerse(M);
    m.push(`Burette de thiosulfate (C = 0,020 mol/L) au-dessus du prélèvement de t = 8 min ; volume versé V = ${fx(Vv, 1)} mL ; teinte du prélèvement : ${nomTeinte(fTitre(Vv))}.`);
    if (M.commence('equivalence')) m.push('Lecture : V_E = 12,6 mL (équivalence : incolore).');
    if (M.commence('equation')) m.push('Écrit : I₂ + 2S₂O₃²⁻ → 2I⁻ + S₄O₆²⁻.');
    if (M.commence('relation')) m.push('Écrit : « à l’équivalence : n(I₂) = C·V_E/2 = 0,020 × 12,6·10⁻³ / 2 = 1,26·10⁻⁴ mol » ; « dans le mélange : × 10 ».');
    if (M.commence('resultat')) m.push('Cadre jaune : « x = n(I₂) = 1,26 mmol » à t = 8 min.');
  }
  if (M.vues && M.vues.length) m.push(`Lignes écrites en bas : ${M.vues.map(s => `« ${s} »`).join(' ; ')}.`);
  return m.join(' ');
}
const params = M => {
  const v = M.S.vue, p = { vue: v };
  if (v === 'mesures' || v === 'prelevement') p.t_min = +tSim(M).toFixed(2);
  if (v === 'prelevement') Object.assign(p, { t_prelevement_min: TP, V_prelevement_mL: 10 });
  if (v === 'titrage') Object.assign(p, { C_mol_L: .02, V_E_mL: VE, n_I2_prelevement_mmol: .126, x_mmol: 1.26 });
  return p;
};
const MOT = Moteur({

  depart: M => ({ methodes: 'Trois façons de suivre l’avancement x au cours du temps.', mesures: 'L’exemple A : mesurons x à des dates successives.',
    prelevement: 'Comment mesurer x à une date précise ?', titrage: 'On titre le diiode du prélèvement de t = 8 min.' })[M.S.vue],
  messageFin: M => ({ methodes: 'Titrage, conductimétrie, pression : on mesure une grandeur à des dates, on en déduit x(t).',

    prelevement: 'Trempe : le prélèvement refroidi et dilué ne réagit plus ; on peut mesurer x à cette date.',
    titrage: 'V_E = 12,6 mL → n(I₂) = 1,26 mmol dans le mélange : x(8 min) = 1,26 mmol.' })[M.S.vue],
  appliquer: (p, M) => { const r = {}; if (VUES.includes(p.vue)) r.vue = p.vue; r.change = !!(r.vue && r.vue !== M.S.vue); return r; },
  schema: { vue: VUES.join(' | ') + ' (change la vue et relance)' },
  texte: 'Suivi temporel d’une transformation (exemple A : H₂O₂ + 2I⁻ + 2H⁺ → I₂ + 2H₂O, 100 mL, n₀(H₂O₂) = 2,0 mmol, n₀(I⁻) = 10,0 mmol). Méthodes : titrage d’un prélèvement, conductimétrie (afficheur σ), pression d’un gaz (manomètre) ; point commun : on mesure une grandeur à des dates, on en déduit x(t). Mesures : à chaque date un prélèvement versé dans un tube de l’eau glacée (trempe), titré ; t (min) 0, 2, 4, 6, 8, 10, 15, 20, 30, 40 ↔ x (mmol) 0 ; 0,44 ; 0,79 ; 1,06 ; 1,26 ; 1,43 ; 1,69 ; 1,84 ; 1,95 ; 1,99. Prélèvement de 10,0 mL à t = 8 min versé dans l’eau glacée (trempe) : sa teinte se fige, le grand bécher continue de foncer. Titrage par le thiosulfate C = 0,020 mol/L : I₂ + 2S₂O₃²⁻ → 2I⁻ + S₄O₆²⁻ ; V_E = 12,6 mL ; n(I₂) = C·V_E/2 ; × 10 dans le mélange ; x = n(I₂) = 1,26 mmol. Temps accéléré : 1 min dure 0,2 s.',
  explications: {
    methodes: [
      { repere: 'vignette_titrage', texte: 'Le titrage : on dose le diiode d’un prélèvement.' },
      { repere: 'afficheur', texte: 'La conductimétrie : on lit la conductivité σ.' },
      { repere: 'manometre', texte: 'La pression : un gaz se forme dans le ballon fermé.' },
      { repere: 'phrase', texte: 'Dans les trois cas, on mesure une grandeur à des dates et on en déduit x(t).' },
    ],
    mesures: [
      { repere: 'becher', texte: 'Le mélange brunit : du diiode se forme.' },
      { repere: 'chrono', texte: 'On note la date de chaque mesure.' },
      { repere: 'tubes', texte: 'À chaque date, un prélèvement dans l’eau glacée : sa teinte se fige, on le titre, on a x.' },
      { repere: 'tableau', texte: 'Puis t et x se rangent dans le tableau.' },
      { repere: 'ligne_derniere', texte: 'À 40 min, x vaut presque 2,0 mmol.' },
    ],
    prelevement: [
      { repere: 'pipette', texte: 'On prélève 10,0 mL du mélange.' },
      { repere: 'glacons', texte: 'Dans l’eau glacée, la réaction est bloquée.' },
      { repere: 'teinte_figee', texte: 'Sa teinte ne bouge plus…' },
      { repere: 'teinte_continue', texte: '… alors que le grand bécher continue de foncer.' },
      { repere: 'phrase', texte: 'C’est la trempe : on mesure x à cette date.' },
    ],
    titrage: [
      { repere: 'burette', texte: 'La burette contient le thiosulfate.' },
      { repere: 'lecture_VE', texte: 'À l’équivalence, on lit V_E = 12,6 mL.' },

});
MOT.lancer();
</script>
