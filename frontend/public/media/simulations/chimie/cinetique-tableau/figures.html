<script>
/*
 * figures.html : les figures des nationaux (?fig=fig_2016R | fig_2024N | fig_2019R | fig_2025R | fig_2017N | fig_2023N | fig_2025N |
 * fig_2021N | fig_2018R | fig_2017R), contrat cinetique_contrat_simulations.md § 8, données de cinetique_build/nationaux.md § 5.
 * Cours phys_ch10_cinetique « Suivi temporel d’une transformation, vitesse de réaction » (2e Bac PC BIOF, novembre 2026).
 * Chaque figure : moments axes · courbe · tangente (si le sujet en donne une) · une étape par pas de la démonstration (FIGS[…].demo :
 * palier, demi, lecture, point_a, point_b, pente…) · fin ; repères axe_t · axe_y · courbe · tangente · un repère par étape (même nom).
 * 19 novembre 2026 : la démonstration se joue sur la figure, qui remplit le tableau (plus de panneau ni de phrases écrites).
 * fig_2017R : le cadre de la figure du sujet (sujet_p3) s’arrête à 0,5 mol et coupe le début de la courbe ; on dessine selon le TEXTE
 * du sujet (0,6 mol d’acide au départ), axe jusqu’à 0,6 mol, et les points lus sur la figure à partir de 2 h.
 */
/* ── Formules chimiques à la craie : indices ₂ et charges ⁺ ⁻ ²⁻ rendus (sans modifier exposants.js ni le kit) ──────────
 * « MnO₄⁻ » devient « MnO_{4}^{−} » ; le découpage « _{…} » accepte tout caractère avant (« [I⁻]₀ »). */
(function () {
  const C = window.Tableau.Craie, P = C.prototype, texteAvant = P.texte, segAvant = C.segments;
  const SUP = { '⁺': '+', '⁻': '−', '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9' };
  const SUB = { '₀': '0', '₁': '1', '₂': '2', '₃': '3', '₄': '4', '₅': '5', '₆': '6', '₇': '7', '₈': '8', '₉': '9' };
  const chim = s => String(s).replace(/[⁺⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, g => '^{' + [...g].map(ch => SUP[ch]).join('') + '}')
    .replace(/[₀₁₂₃₄₅₆₇₈₉]+/g, g => '_{' + [...g].map(ch => SUB[ch]).join('') + '}');
  C.segments = function (s) {
    const out = [], re = /_\{([^}]+)\}/g; let i = 0, m;
    while ((m = re.exec(s))) { if (m.index > i) out.push(...segAvant(s.slice(i, m.index))); out.push({ t: m[1], sub: true }); i = re.lastIndex; }
    if (i < s.length) out.push(...segAvant(s.slice(i)));
    return out;
  };
  P.texte = function (s, x, y, o) { return texteAvant.call(this, chim(s), x, y, o); };
  window.chim = chim;
})();

/* ── Moteur du déroulé (copie de chimie/transformations-lentes-rapides-tableau/courbes.html, + M.finir) ─────────────────────────────────── */
const { fr, bulle, protocole } = window.Tableau;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lisse = p => p * p * (3 - 2 * p);
const lerp = (a, b, f) => a + (b - a) * f;
const fx = (v, d = 2) => fr(v, d).replace(/(,\d*?)0+$/, '$1').replace(/,$/, '');
const ECRITURE = 2.5;
function Moteur(o) {
  const q = new URLSearchParams(location.search);
  const S = { vue: o.vues.includes(q.get('fig')) ? q.get('fig') : o.vues[0], t: 0, running: false, pause: false, fait: false,
    jusqua: null, motif: '', emis: 0, dit: '', mesure: false };
  const V = o.vitesse ?? 1.7, T0 = o.T0 ?? .8, HOLD = {};
  let TL = null;
  function construire() {
    let s = T0; const ev = [];
    for (const e of o.etapes(S.vue)) {
      const anim = e.anim || 0, d = { ...e, anim, debut: s, ecrit: s + (e.ecritDes ?? anim) };
      d.fin = Math.max(s + anim, d.ecrit + (HOLD[e.nom] ?? 1.5)) + .35;
      s = d.fin; ev.push(d);
    }
    const mom = {}; for (const e of ev) mom[e.nom] = e.fin; mom.fin = s + (o.queue ?? .6);
    TL = { ev, M: mom };
  }
  const ev = nom => TL.ev.find(e => e.nom === nom);
  const M = {
    S, ev, evs: () => TL.ev, Moments: () => TL.M,
    p(nom) { const e = ev(nom); if (!e) return 0; return e.anim > 0 ? clamp((S.t - e.debut) / e.anim, 0, 1) : (S.t >= e.debut - 1e-6 ? 1 : 0); },
    commence(nom) { const e = ev(nom); return !!e && S.t > e.debut + 1e-6; },
    vu(nom) { if (nom === 'fin') return S.t >= TL.M.fin - 1e-6; const e = ev(nom); return !!e && S.t >= e.fin - 1e-6; },
    etape(c, nom, fn) {
      const e = ev(nom); if (!e) return;
      const t = c.t, cur = c.cur, comp = c.complet, w0 = e.ecrit;
      c.t = S.t > 1e5 ? 1e9 : w0 + (S.t - w0) * V; c.cur = w0;
      try { fn(); } finally { if (S.mesure) HOLD[nom] = Math.max(HOLD[nom] || 0, (c.cur - w0) / V); c.t = t; c.cur = cur; if (!S.running) c.complet = comp; }
    },
    etat() { return S.running ? 'en cours' : S.fait ? 'fin' : S.pause ? 'arrêt sur image' : 'pas encore lancée'; },
  };
  const scene = window.OndesTableau.Scene($('canvas'), (c) => o.dessiner(c, M), o.scene || {});
  const cadreBase = scene.cadre;
  scene.cadre = function (g) { const k = cadreBase.call(scene, g); if (Number.isFinite(k.t)) k.t *= ECRITURE; return k; };
  M.scene = scene; M.craie = scene.craie;
  function calculer() {
    construire();
    const t = S.t, r = S.running; S.t = 1e6; S.running = false; S.mesure = true;
    for (const k of Object.keys(HOLD)) delete HOLD[k];   // une étape dessinée en plusieurs morceaux garde le plus long (max ci-dessus)
    try { o.dessiner(scene.craie, M); } finally { S.t = t; S.running = r; S.mesure = false; }
    construire(); scene.sale = true;
  }
  const sansSouligne = s => String(s).replace(/([A-Za-zΔτθ])_\{?([A-Za-z0-9]+)\}?/g, (m, a, i) => a + (/^\d+$/.test(i) ? [...i].map(d => '₀₁₂₃₄₅₆₇₈₉'[d]).join('') : i));
  const dire = (texte, kind = '') => { texte = sansSouligne(texte); S.dit = texte; bulle($('feedback'), texte, kind); };
  const etiquette = () => { $('run').textContent = S.running ? 'Pause' : S.pause ? 'Reprendre' : S.fait ? 'Rejouer' : 'Lancer'; };
  let pont = null;
  const emettre = () => pont && pont.emettre();
  const noter = (a, d) => pont && pont.noter(a, d);
  scene.avancer = dt => {
    if (!S.running) return !!(o.anime && o.anime());
    const avant = S.t; S.t += dt;
    for (const e of TL.ev) if (avant < e.debut && S.t >= e.debut && e.bulle) dire(e.bulle());
    if (S.jusqua != null && S.t >= S.jusqua) {
      S.t = S.jusqua; S.jusqua = null; S.running = false;
      if (S.t >= TL.M.fin - 1e-6) { finir(); return true; }
      S.pause = true; etiquette(); dire('Arrêt sur image : ' + (S.motif || `t = ${fx(S.t, 1)} s`) + '.');
      noter('pause', { time_s: +S.t.toFixed(2) }); emettre(); return true;
    }
    if (S.t >= TL.M.fin) { S.t = TL.M.fin; finir(); return true; }
    if (performance.now() - S.emis > 500) { S.emis = performance.now(); emettre(); }
    return true;
  };
  function finir() { S.running = false; S.fait = true; S.pause = false; S.jusqua = null; etiquette(); dire(o.messageFin(M), 'good'); noter('measurement', o.params(M)); emettre(); }
  function start() { o.reprise && o.reprise(); S.t = 0; S.jusqua = null; S.motif = ''; S.running = true; S.pause = false; S.fait = false; etiquette(); dire(o.depart(M)); noter('start', o.params(M)); emettre(); }
  function pause() { if (!S.running) return; S.running = false; S.pause = true; S.jusqua = null; etiquette(); dire('Arrêt sur image.'); noter('pause', { time_s: +S.t.toFixed(2) }); emettre(); }
  function resume() { if (S.running) return; o.reprise && o.reprise(); if (!S.pause) return start(); S.running = true; S.pause = false; etiquette(); dire('Ça repart…'); noter('resume'); emettre(); }
  function setTime(p) {
    const t = +p.time_s; if (p.time_s === null || p.time_s === '' || !Number.isFinite(t)) return;
    o.reprise && o.reprise(); S.running = false; S.jusqua = null; S.t = clamp(t, 0, TL.M.fin); S.fait = S.t >= TL.M.fin - 1e-6; S.pause = !S.fait && S.t > 0;
    etiquette(); scene.sale = true; dire(`Arrêt sur image : t = ${fx(S.t, 1)} s.`); noter('set_time', { time_s: S.t }); emettre();
  }
  function playUntil(p) {
    const noms = o.etapes(S.vue).map(e => e.nom).concat('fin');
    const nom = noms.includes(p.moment) ? p.moment : null, cible = nom ? TL.M[nom] : +p.time_s;
    if (!Number.isFinite(cible) || (p.moment && !nom && (p.time_s == null || p.time_s === ''))) { dire(`Moment inconnu : ${p.moment}.`, 'bad'); emettre(); return; }
    o.reprise && o.reprise();
    if (S.fait || S.t >= cible - 1e-3) { S.t = 0; S.fait = false; }
    S.jusqua = clamp(cible, .01, TL.M.fin); S.motif = nom ? (o.motifs[nom] || nom) : ''; S.running = true; S.pause = false; etiquette(); dire('Observe…');
    noter('play_until', { moment: nom, time_s: S.jusqua }); emettre();
  }
  function setParameters(p) {
    p = p || {};
    const r = o.appliquer(p, M) || {};
    if (r.vue && o.vues.includes(r.vue) && r.vue !== S.vue) { S.vue = r.vue; r.change = true; r.vueChange = true; }
    if (r.change) { calculer(); if (r.vueChange) scene.reecrire(); }
    noter('set_parameters', o.params(M));
    if (r.apres) r.apres();
    else if (r.change && !r.garder) start();
    else { scene.sale = true; emettre(); }
  }
  Object.assign(M, { noter, calculer, dire, start, pause, resume, setTime, playUntil, setParameters, emettre, etiquette, finir });
  $('run').onclick = () => (S.running ? pause() : S.pause ? resume() : start());
  window.Tableau.explication(o.explications);
  const commandes = ['start', 'reset', 'pause', 'resume', 'set_time', 'set_parameters', 'play_until'];
  M.lancer = () => {
    calculer();
    const listeMoments = o.vues.map(v => `${o.vues.length > 1 ? v + ' : ' : ''}${o.etapes(v).map(e => e.nom).concat('fin').join(' | ')}`).join(' ; ');
    const config = { id: o.id, version: '1.0', title: o.titre, variants: o.vues.length > 1 ? o.vues.map(id => ({ id, label: o.titres[id] })) : [], commands: commandes,
      command_schema: { set_parameters: o.schema, set_time: { time_s: '0..fin (arrêt sur cet instant de la scène, en s ; voir moments)' },
        play_until: { moment: listeMoments, time_s: 'ou un instant en s' } } };
    pont = protocole({ id: o.id, commandes, config, texte: o.texte,
      etat: () => ({ simulation_status: S.running ? 'running' : S.fait ? 'finished' : S.pause ? 'paused' : 'idle',
        ce_qui_se_voit: o.voir(M) + (S.dit ? ` La bulle dit : « ${S.dit} »` : ''), current_variant: S.vue, time_s: +S.t.toFixed(2),
        parameters: o.params(M), moments: Object.fromEntries(Object.entries(TL.M).map(([k, v]) => [k, +v.toFixed(2)])) }),
      progression: () => (S.fait ? 1 : 0),
      executer: (cmd, p) => ({ start, reset: start, pause, resume, set_time: () => setTime(p), set_parameters: () => setParameters(p), play_until: () => playUntil(p) })[cmd]?.() });
    dire(o.depart(M));
    setTimeout(() => { if (!S.running && S.t === 0 && !S.pause && !S.fait) start(); }, 900);
  };
  return M;
}
/** Zone d’écriture du bas : le professeur efface les plus vieilles lignes (copie du modèle). */
function zoneEcriture(c, M, liste, ys, o = {}) {
  const S = M.S, x = o.x ?? 14, max = o.max ?? 730, taille = o.taille ?? 17, n = ys.length, vues = [];
  if (S.mesure) {
    for (const e of liste) M.etape(c, e.nom, () => { for (const [t, col] of e.lignes) c.texte(t, x, ys[0], { couleur: col, taille, max }); e.plus && e.plus(c); });
    return vues;
  }
  let k = -1;
  liste.forEach((e, j) => { const ev = M.ev(e.nom); if (ev && S.t > ev.ecrit + .05) k = j; });
  const garde = new Set(); let nb = 0;
  for (let j = k; j >= 0; j--) { const l = liste[j].lignes.length; if (nb + l > n) break; garde.add(j); nb += l; }
  let y = 0;
  liste.forEach((e, j) => {
    if (j > k) return;
    M.etape(c, e.nom, () => {
      if (garde.has(j)) for (const [t, col] of e.lignes) { c.texte(t, x, ys[y++], { couleur: col, taille, max }); vues.push(t); }
      e.plus && e.plus(c);
    });
  });
  return vues;
}
/** Largeur (cadre) d’une formule écrite à la craie, indices et charges compris. */
function larg(c, s, taille = 17) {
  const T = window.Tableau, ctx = c.ctx; if (c.echelle && c.tailleMin) taille = Math.max(taille, c.tailleMin / c.echelle);
  return T.Craie.segments(window.chim(s)).reduce((w, g) => { ctx.font = `${(g.sub || g.sup) ? taille * .62 : taille}px ${T.POLICE}`; return w + ctx.measureText(g.t).width; }, 0);
}
/** Équation « gauche → droite » : la flèche est DESSINÉE (la police n’a pas toutes les flèches). Renvoie { x, w }. */
function eqn(c, x, y, gauche, droite, o = {}) {
  if (window.Etats) { [gauche, droite] = window.Etats.cotes(gauche, droite); o = window.Etats.ajuste(c, x, gauche, droite, o); }   // états physiques (aq), (l), (s), (g)
  const t = o.taille ?? 17, w1 = larg(c, gauche, t), w2 = larg(c, droite, t), fl = 30, tot = w1 + fl + 16 + w2;
  const x0 = o.align === 'center' ? x - tot / 2 : o.align === 'right' ? x - tot : x, col = o.couleur ?? 'blanc';
  c.texte(gauche, x0, y, { couleur: col, taille: t });
  c.fleche(x0 + w1 + 8, y - t * .3, x0 + w1 + 8 + fl, y - t * .3, { couleur: col, largeur: 1.8, tete: 7 });
  c.texte(droite, x0 + w1 + 16 + fl, y, { couleur: col, taille: t });
  return { x: x0, w: tot };
}
/** Petit triangle « attention » à la craie (orange), le « ! » dedans. */
function attention(c, x, y, o = {}) {
  const col = o.couleur ?? 'orange', h = o.h ?? 16;
  c.trait([[x, y], [x + h * .58, y - h], [x + h * 1.16, y]], { couleur: col, largeur: 1.8, ferme: true });
  c.texte('!', x + h * .58, y - 3, { couleur: col, taille: h * .8, align: 'center' });
}

/* ── Le graphe remplit le tableau (19 novembre 2026, simulations-au-tableau règles 17 et 18) ───────────────────────
 * La démonstration se joue SUR la figure : plus de panneau de texte ni de phrases en bas (les lignes de la démonstration
 * sont les cartes de la diapositive, chacune liée au repère qu’elle allume ici ; les données sont lues sur la page du
 * sujet, à la diapositive d’énoncé). Chaque étape de la démonstration allume ce qu’elle utilise (le palier, la moitié de
 * x_f, le point lu, la tangente, ses deux points, le triangle de la pente…) et écrit la valeur sur la figure, là où on la
 * lit ; l’étape en cours est allumée fort, les précédentes restent allumées doucement. Un moment et un repère par étape. */
const G = { x0: 80, y0: 366, w: 600, h: 310 };
let D = null;
function disposer(L) {
  const gauche = 78, droite = 92, A = L - gauche - droite, w = Math.min(A, 2.25 * 310), off = (A - w) / 2;
  Object.assign(G, { x0: gauche + off, y0: 366, w, h: 310 });
  D = { L, axes: 17, nomAxe: 18, eti: 20, val: 19 };
}
let F = null;                                       // figure courante
const X = t => G.x0 + t / F.tmax * G.w, Y = v => G.y0 - v / F.ymax * G.h;
const pointille = (c, x1, y1, x2, y2, p, col = 'jaune') => { if (p > 0) c.ligne(x1, y1, x1 + (x2 - x1) * p, y1 + (y2 - y1) * p, { couleur: col, largeur: 2, pointille: [6, 5] }); };
const quand = (M, nom) => (M.vu(nom) ? '' : ` (au moment « ${nom} »)`);
const etapeEnCours = M => { let n = 'avant le début'; for (const e of M.evs()) if (M.commence(e.nom)) n = e.nom; return n; };
const nb = v => fr(v, 3).replace(/(,\d*?)0+$/, '$1').replace(/,$/, '');   // 0,250 → « 0,25 », 15 → « 15 »
/** Courbe lisse qui passe par des points lus (Hermite monotone ; `pentes` impose la pente en certains points, ex. la tangente donnée). */
function lissee(pts, pentes = {}) {
  const n = pts.length, t = pts.map(p => p[0]), y = pts.map(p => p[1]), d = [], m = [];
  for (let i = 0; i < n - 1; i++) d.push((y[i + 1] - y[i]) / (t[i + 1] - t[i]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : 2 / (1 / d[i - 1] + 1 / d[i]);
  for (const [k, s] of Object.entries(pentes)) { const i = t.indexOf(+k); if (i >= 0) m[i] = s; }
  return u => {
    if (u <= t[0]) return y[0] + m[0] * (u - t[0]);
    if (u >= t[n - 1]) return y[n - 1];
    let i = 0; while (u > t[i + 1]) i++;
    const h = t[i + 1] - t[i], s = (u - t[i]) / h, s2 = s * s, s3 = s2 * s;
    return (2 * s3 - 3 * s2 + 1) * y[i] + (s3 - 2 * s2 + s) * h * m[i] + (-2 * s3 + 3 * s2) * y[i + 1] + (s3 - s2) * h * m[i + 1];
  };
}
/** La date où la courbe f atteint la valeur v (recherche par dichotomie entre a et b). */
function atteint(f, v, a, b) {
  const s = Math.sign(f(b) - f(a));
  for (let k = 0; k < 60; k++) { const m = (a + b) / 2; if ((f(m) - v) * s < 0) a = m; else b = m; }
  return (a + b) / 2;
}

/* ── Les figures (nationaux.md § 5). Les modèles servent seulement au calcul du tracé : jamais écrits à l’écran.
 * `demo` : les étapes de la démonstration, dans l’ordre de la voix. Sortes :
 *   palier {y, lab, at:[t, y]}           le palier (trait horizontal) et sa valeur
 *   demi   {y, courbe, lab}              la valeur lue sur l’axe des ordonnées, le trait jusqu’à la courbe, le point
 *   lecture{y, courbe, lab}              du point jusqu’à l’axe des temps, la date lue écrite sous l’axe
 *   croise {t, y, courbe, ylab, tlab}    une date et sa valeur : les deux traits et le point
 *   point  {qui: 'A'|'B', lab, at}       un point de la tangente, sa valeur écrite sur l’axe (ou à côté)
 *   pente  {lab, dt, dy}                 le triangle de la pente entre A et B, Δt et Δy sur ses côtés
 *   courbes{k:[…], lab:[…]}              une ou plusieurs courbes allumées, avec leur étiquette
 *   pentes {ts:[…], lab:[…]}             de petites tangentes comparées (la pente diminue)
 *   ecart  {t, y1, y2, lab}              une flèche verticale entre deux valeurs (x_f = n₀ − n_f)
 * `concl: true` : l’étape répond à la question d’observation (se tait avec conclusions = false). */
const L2 = Math.LN2;
const FIGS = {
  fig_2016R: {
    session: '2016 R', diapo: 'p4',
    yNom: 'σ (mS·m⁻¹)', ymax: 275, yTop: 250, dy: 50, gy: 25, tNom: 't (min)', tmax: 65, tTop: 65, dt: 15, gt: 7.5, tLab: [15, 30],
    courbes: [{ f: lissee([[0, 250], [5, 209], [10, 190], [15, 174], [20, 163], [30, 144], [45, 112], [60, 94], [63, 91]], { 0: -150 / 18 }), fin: 63, col: 'bleu', nom: 'σ(t)' }],
    tangente: { A: [0, 250], B: [18, 100], contact: [0, 250], de: 0, a: 20, lab: [20.5, 84], dit: 'à l’origine, par (0 ; 250) et (18 ; 100) mS·m⁻¹' },

  if (d.k === 'palier') {
    const ys = [].concat(d.y);
    ys.forEach(y => { if (fort) haloTrait(c, [[G.x0, Y(y)], [X(F.tTop), Y(y)]], true, 8); pointille(c, G.x0, Y(y), X(F.tTop), Y(y), p); });
  } else if (d.k === 'demi') {
    const x = X(d.t), y = Y(d.y);
    haloPoint(c, G.x0, y, fort, 10);
    pointille(c, G.x0, y, x, y, p);
    if (p >= 1) { c.point(x, y, 5, 'jaune'); haloPoint(c, x, y, fort, 10); }
  } else if (d.k === 'lecture') {
    const x = X(d.t), y = Y(d.y);
    pointille(c, x, y, x, G.y0, p);
    if (p >= 1) { c.point(x, G.y0, 5, 'jaune'); haloPoint(c, x, G.y0, fort, 11); }
  } else if (d.k === 'croise') {
    const x = X(d.t), y = Y(d.y);
    pointille(c, x, G.y0, x, y, clamp(p * 2, 0, 1)); if (p >= .5) pointille(c, x, y, G.x0, y, clamp(p * 2 - 1, 0, 1));
    if (p >= .5) { c.point(x, y, 5, 'jaune'); haloPoint(c, x, y, fort, 10); }
  } else if (d.k === 'point') {
    const [t, v] = T[d.qui], x = X(t), y = Y(v);
    if (t > 0) { pointille(c, x, y, G.x0, y, p, 'vert'); pointille(c, x, y, x, G.y0, p, 'vert'); }
    c.point(x, y, 5, 'vert'); haloPoint(c, x, y, fort, 11);
  } else if (d.k === 'pente') {
    const xa = X(T.A[0]), ya = Y(T.A[1]), xb = X(T.B[0]), yb = Y(T.B[1]);
    const ctx = c.ctx; ctx.save(); ctx.fillStyle = fort ? 'rgba(250,204,21,.22)' : 'rgba(250,204,21,.08)';
    ctx.beginPath(); ctx.moveTo(xa, ya); ctx.lineTo(xb, ya); ctx.lineTo(xb, yb); ctx.closePath(); ctx.fill(); ctx.restore();
    c.ligne(xa, ya, xa + (xb - xa) * clamp(p * 2, 0, 1), ya, { couleur: 'jaune', largeur: 2.2 });
    if (p > .5) c.ligne(xb, ya, xb, ya + (yb - ya) * clamp(p * 2 - 1, 0, 1), { couleur: 'jaune', largeur: 2.2 });
  } else if (d.k === 'courbes') {
    d.courbe.forEach(k => haloCourbe(c, k, fort));
  } else if (d.k === 'pentes') {
    const f = F.courbes[0].f, h = .7;
    d.ts.forEach((t, i) => {
      const s = (f(t + 1e-3) - f(t - 1e-3)) / 2e-3, h0 = Math.min(h, t), a = [X(t - h0), Y(f(t) - s * h0)], b = [X(t + h), Y(f(t) + s * h)];
      if (clamp(p * 2 - i, 0, 1) <= 0) return;
      if (fort) haloTrait(c, [a, b], true, 9);
      c.ligne(a[0], a[1], b[0], b[1], { couleur: 'orange', largeur: 2.6 }); c.point(X(t), Y(f(t)), 4, 'orange');
    });
  } else if (d.k === 'ecart') {
    const x = X(d.t), y1 = Y(d.y1), y2 = Y(d.y2), q = clamp(p, 0, 1);
    pointille(c, G.x0, y1, x + 12, y1, q, 'jaune');
    if (fort) haloTrait(c, [[x, y1], [x, y2]], true, 10);
    if (q > .5) c.fleche(x, y1, x, y1 + (y2 - y1) * clamp(q * 2 - 1, 0, 1), { couleur: 'jaune', largeur: 2.2, tete: 8 });
    if (q >= 1) c.fleche(x, y2, x, y1, { couleur: 'jaune', largeur: 2.2, tete: 8 });
  }
}
function ecritDemo(c, d) {
  const T = F.tangente, v = D.val;
  if (d.k === 'palier') [].concat(d.lab).forEach((l, i) => { const at = Array.isArray(d.at[0]) ? d.at[i] : d.at; c.texte(l, X(at[0]), Y(at[1]), { couleur: 'jaune', taille: v }); });
  else if (d.k === 'demi') c.texte(d.lab, G.x0 - 8, Y(d.y) + 6, { couleur: 'jaune', taille: D.axes + 1, align: 'right' });
  else if (d.k === 'lecture') { const al = d.align || 'center'; c.texte(d.lab, X(d.t) + (al === 'right' ? 6 : al === 'left' ? -6 : 0), G.y0 + 44, { couleur: 'jaune', taille: v, align: al }); }
  else if (d.k === 'croise') { c.texte(d.ylab, G.x0 - 8, Y(d.y) + 6, { couleur: 'jaune', taille: D.axes + 1, align: 'right' }); c.texte(d.tlab, X(d.t), G.y0 + 44, { couleur: 'jaune', taille: v, align: 'center' }); }
  else if (d.k === 'point') {
    const [t, val] = T[d.qui];
    c.texte(d.lab, G.x0 - 8, Y(val) + 6, { couleur: 'vert', taille: D.axes + 1, align: 'right' });
    if (d.tlab) c.texte(d.tlab, X(t), G.y0 + 44, { couleur: 'vert', taille: v, align: 'center' });
  } else if (d.k === 'pente') {
    const xa = X(T.A[0]), ya = Y(T.A[1]), xb = X(T.B[0]), yb = Y(T.B[1]);
    // Δt au bout du côté horizontal, Δx (ou Δσ) le long du côté vertical : hors de la courbe et de (T).
    c.texte(d.dt, xb + 8, ya + 6, { couleur: 'jaune', taille: v - 1 });
    c.texte(d.dy, xb + 10, (ya + yb) / 2 + (yb < ya ? -2 : 14), { couleur: 'jaune', taille: v - 1 });
    c.texte(d.lab, X(d.at[0]), Y(d.at[1]), { couleur: 'jaune', taille: v });
  } else if (d.k === 'courbes') d.lab.forEach((l, i) => c.texte(l, X(d.at[i][0]), Y(d.at[i][1]), { couleur: F.courbes[d.courbe[i]].col, taille: v }));
  else if (d.k === 'pentes') { const f = F.courbes[0].f; d.ts.forEach((t, i) => c.texte(d.lab[i], X(t) + (i ? 0 : 12), Y(f(t)) + (i ? 28 : 22), { couleur: 'orange', taille: v - 1, align: i ? 'center' : 'left' })); }   // sous la courbe, loin de (T)
  else if (d.k === 'ecart') c.texte(d.lab, X(d.t) + 14, (Y(d.y1) + Y(d.y2)) / 2 + 6, { couleur: 'jaune', taille: v });
}
/** Le rectangle du repère d’une étape de la démonstration. */
function rectDemo(d) {
  const T = F.tangente;
  if (d.k === 'palier') { const ys = [].concat(d.y).map(Y); return [G.x0, Math.min(...ys) - 26, X(F.tTop) - G.x0, Math.max(...ys) - Math.min(...ys) + 34]; }
  if (d.k === 'demi') return [G.x0 - 60, Y(d.y) - 16, X(d.t) - G.x0 + 76, 32];
  if (d.k === 'lecture') return [X(d.t) - 50, Y(d.y) - 10, 100, G.y0 - Y(d.y) + 50];
  if (d.k === 'croise') return [G.x0 - 60, Y(d.y) - 14, X(d.t) - G.x0 + 100, G.y0 - Y(d.y) + 50];
  if (d.k === 'point') { const [t, v] = T[d.qui]; return [X(t) - 14, Y(v) - 14, 28, 28]; }
  if (d.k === 'pente') { const xa = X(T.A[0]), ya = Y(T.A[1]), xb = X(T.B[0]), yb = Y(T.B[1]); return [xa - 6, Math.min(ya, yb) - 26, xb - xa + 120, Math.abs(yb - ya) + 40]; }
  if (d.k === 'courbes') return [G.x0, Y(F.yTop) - 4, X(F.tTop) - G.x0, G.y0 - Y(F.yTop)];
  if (d.k === 'pentes') return [G.x0, Y(F.yTop) - 4, X(F.tTop) - G.x0, G.y0 - Y(F.yTop)];
  if (d.k === 'ecart') return [X(d.t) - 14, Y(d.y1) - 6, 230, Y(d.y2) - Y(d.y1) + 12];
  return [G.x0, G.y0 - G.h, G.w, G.h];
}

function dessiner(c, M) {
  MO = M; F = FIGS[M.S.vue]; M.scene.cadre(73); disposer(M.scene.L);
  if (M.commence('axes')) c.direct(() => quadrillage(c, lisse(M.p('axes'))));
  c.direct(() => {
    if (M.commence('courbe')) F.courbes.forEach(k => trace(c, k.f, k.fin, M.p('courbe'), k.col));
    if (F.tangente && M.commence('tangente')) {
      const T = F.tangente, p = M.p('tangente'), a = T.de + (T.a - T.de) * p;
      if (enCours(M, 'tangente')) haloTrait(c, [[X(T.de), Y(surT(T, T.de))], [X(a), Y(surT(T, a))]], true, 9);
      c.ligne(X(T.de), Y(surT(T, T.de)), X(a), Y(surT(T, a)), { couleur: 'vert', largeur: 2.4, pointille: [8, 5] });
      if (p >= 1) croix(c, X(T.contact[0]), Y(T.contact[1]), 'blanc');
    }
    for (const d of F.demo) if (voit(M, d)) dessinDemo(c, M, d);
  });
  // Écritures à la craie, chacune dans son étape (la craie écrit au rythme de l’étape) : axes, étiquettes, valeurs lues.
  M.etape(c, 'axes', () => axes(c, M));
  M.etape(c, 'courbe', () => F.courbes.forEach(k => { if (k.lab) c.texte(k.nom, X(k.lab[0]), Y(k.lab[1]), { couleur: k.col, taille: D.eti, align: k.lab[2] || 'left' }); }));
  if (F.tangente) M.etape(c, 'tangente', () => { if (M.commence('tangente')) c.texte('(T)', X(F.tangente.lab[0]), Y(F.tangente.lab[1]), { couleur: 'vert', taille: D.eti }); });
  for (const d of F.demo) M.etape(c, d.nom, () => { if (M.S.mesure || voit(M, d)) ecritDemo(c, d); });
  reperes(c, M);
  return c.fin();
}

/* ── Repères (tous déclarés dès le début ; le libellé dit à quel moment ils apparaissent) ─────────────── */
function reperes(c, M) {
  const R = (id, x, y, w, h, l) => c.repere(id, x, y, w, h, l), q = nom => quand(M, nom);
  R('axe_t', G.x0, G.y0 - 10, G.w + 60, 40, `l’axe des temps : ${F.tNom}, de 0 à ${nb(F.tTop)}`);
  R('axe_y', G.x0 - 60, G.y0 - G.h - 20, 70, G.h + 30, `l’axe des ordonnées : ${F.yNom}, de 0 à ${F.yFmt ? F.yFmt(F.yTop) : nb(F.yTop)}`);
  R('courbe', G.x0, Y(F.yTop) - 4, X(F.tTop) - G.x0 + 8, G.y0 - Y(F.yTop) + 4, `${F.courbes.length > 1 ? 'les courbes ' + F.courbes.map(k => k.nom).join(', ') : 'la courbe du sujet'}${q('courbe')}`);
  if (F.tangente) {
    const T = F.tangente, y1 = Y(surT(T, T.de)), y2 = Y(surT(T, T.a));
    R('tangente', X(T.de) - 6, Math.min(y1, y2) - 6, X(T.a) - X(T.de) + 12, Math.abs(y2 - y1) + 12, `la tangente (T) verte, ${T.dit}${q('tangente')}`);
  }
  for (const d of F.demo) R(d.nom, ...rectDemo(d), `${d.motif}${d.concl && !CONCL ? ' (réponse pas encore écrite)' : q(d.nom)}`);
}

/* ── Ce que voit le tuteur ─────────────────────────────────────────────── */
function voir(M) {
  const f = FIGS[M.S.vue], m = [`Figure ${M.S.vue} (national ${f.session}, diapositive ${f.diapo}), ${M.etat()}. Étape en cours : ${etapeEnCours(M)}.`];
  m.push(`Graphe à la craie sur tout le tableau : ${f.yNom} en ordonnée de 0 à ${f.yFmt ? f.yFmt(f.yTop) : nb(f.yTop)}, ${f.tNom} en abscisse de 0 à ${nb(f.tTop)}.`);
  if (M.commence('courbe')) m.push(`Courbe${f.courbes.length > 1 ? 's' : ''} tracée${f.courbes.length > 1 ? 's' : ''} (${M.vu('courbe') ? 'en entier' : 'en cours'}) : ${f.resume}`);
  if (f.tangente && M.commence('tangente')) m.push(`Tangente (T) verte en pointillés ${f.tangente.dit} ; point de contact marqué ×.`);
  const faites = f.demo.filter(d => voit(M, d));
  if (faites.length) m.push(`Démonstration sur la figure (allumée en jaune, l’étape en cours plus fort) : ${faites.map(d => d.motif).join(' ; ')}.`);
  if (!CONCL && f.demo.some(d => d.concl)) m.push('Question d’observation en cours : la réponse n’est pas encore sur la figure (conclusions = false).');
  return m.join(' ');
}
const params = M => {
  const f = FIGS[M.S.vue];
  return { fig: M.S.vue, conclusions: CONCL, session: f.session, diapositive: f.diapo, tangente: !!f.tangente, valeurs: f.valeur,
    demonstration: f.demo.map(d => d.nom) };
};
const MOT = Moteur({
  id: 'cin_figures', titre: 'Figures des examens nationaux : suivi temporel, tangente, t₁/₂ — la démonstration sur la figure', vues: CLES, scene: { large: true },
  titres: Object.fromEntries(CLES.map(k => [k, `national ${FIGS[k].session}`])),
  etapes: etapesDe, motifs: MOTIFS, dessiner, voir, params,
  depart: M => `Figure du national ${FIGS[M.S.vue].session}.`,
  messageFin: M => `Figure du national ${FIGS[M.S.vue].session} : ${FIGS[M.S.vue].valeur}.`,
  appliquer: (p, M) => { const r = {}; if (typeof p.conclusions === 'boolean') { CONCL = p.conclusions; M.scene.sale = true; } if (CLES.includes(p.fig)) r.vue = p.fig; else if (CLES.includes(p.vue)) r.vue = p.vue; r.change = !!(r.vue && r.vue !== M.S.vue); return r; },
  schema: { fig: CLES.join(' | ') + ' (change de figure et relance)', conclusions: 'true | false : false tait la réponse d’une question d’observation (fig_2019R : x_max ; fig_2025R : « v diminue ») ; true par défaut' },
  texte: 'Figures des examens nationaux (2016-2025) du suivi temporel, dessinées comme les sujets ; la démonstration se joue sur la figure, étape par étape : ' + CLES.map(k => `${k} (${FIGS[k].session}) : ${FIGS[k].resume} Étapes : ${FIGS[k].demo.map(d => d.nom).join(', ')}. Valeurs : ${FIGS[k].valeur}.`).join(' '),
  explications: Object.fromEntries(CLES.map(k => [k, [
    { repere: 'axe_y', texte: `En ordonnée : ${FIGS[k].yNom}.` },
    { repere: 'axe_t', texte: `En abscisse : ${FIGS[k].tNom}.` },
    { repere: 'courbe', texte: FIGS[k].resume },
    ...(FIGS[k].tangente ? [{ repere: 'tangente', texte: `La tangente (T) ${FIGS[k].tangente.dit}.` }] : []),
    ...FIGS[k].demo.map(d => ({ repere: d.nom, texte: d.motif.charAt(0).toUpperCase() + d.motif.slice(1) + '.' })),
  ]])),
});
MOT.lancer();
</script>
