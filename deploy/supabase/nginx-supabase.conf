# =============================================================
# Moalim Supabase — config Nginx ISOLÉE
# Chemin : /etc/nginx/conf.d/moalim-supabase.conf
# Sous-domaine : sb.moalim.online → Kong (127.0.0.1:54321)
#
# Public  : uniquement la lecture des fichiers publics du Storage
#           (images/vidéos des ressources pédagogiques).
# Privé   : tout le reste (auth, rest, storage admin, Studio) n'est
#           accessible que depuis le serveur lui-même. Le backend y
#           arrive via /etc/hosts (sb.moalim.online → 127.0.0.1).
# Studio  : par tunnel SSH, voir README.md.
# =============================================================

upstream moalim_supabase {
    server 127.0.0.1:54321;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name sb.moalim.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sb.moalim.online;

    ssl_certificate     /etc/letsencrypt/live/sb.moalim.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sb.moalim.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Aligné sur FILE_SIZE_LIMIT du storage (50 Mo)
    client_max_body_size 55M;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # ── Public : lecture des fichiers des buckets publics ──
    location ~ ^/storage/v1/(object|render/image)/public/ {
        limit_except GET HEAD {
            deny all;
        }
        proxy_set_header Connection "";
        proxy_pass http://moalim_supabase;
        expires 7d;
    }

    # ── Privé : tout le reste, réservé au serveur ──
    location / {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://moalim_supabase;
    }
}
