# =============================================================
# Moalim — config Nginx ISOLÉE
# Chemin : /etc/nginx/conf.d/moalim.conf
# Ne route que les requêtes sur moalim.online / www.moalim.online.
# Toute autre app (ba9alino, etc.) reste totalement intacte.
# =============================================================

# Shared limits across backend workers. Names are specific to this application.
limit_req_zone $binary_remote_addr zone=moalim_auth:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=moalim_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=moalim_ws:10m;

upstream moalim_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ── HTTP → HTTPS redirect (uniquement pour moalim.online) ──
server {
    listen 80;
    listen [::]:80;
    server_name moalim.online www.moalim.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS principal ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name moalim.online www.moalim.online;

    ssl_certificate     /etc/letsencrypt/live/moalim.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moalim.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25M;
    client_body_timeout 15s;
    limit_req_status 429;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;

    location ~ (^|/)\. {
        deny all;
    }

    # Authentication and application forms receive stricter shared limits.
    location ~ ^/api/v1/(admin/login|auth/(login|refresh)|registration-requests)/?$ {
        limit_req zone=moalim_auth burst=10 nodelay;
        client_max_body_size 64k;
        proxy_pass http://moalim_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Frontend statique servi exclusivement depuis /var/www/moalim
    root /var/www/moalim;
    index index.html;

    # Cache long sur les assets hashés Vite
    location /media/ {
        try_files $uri =404;
        # add_header overrides parent inheritance on supported older Nginx.
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        # expires supplies Cache-Control while retaining security headers.
        gzip_static on;
    }

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # API REST → backend isolé sur 127.0.0.1:8000
    location /api/ {
        limit_req zone=moalim_api burst=100 nodelay;
        proxy_pass http://moalim_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_pass http://moalim_backend/health;
        access_log off;
    }

    # Static exam assets servis par FastAPI
    location /static/ {
        proxy_pass http://moalim_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
    }

    # WebSocket — pipeline voix temps-réel
    location /ws/ {
        limit_conn moalim_ws 5;
        access_log off; # Legacy WebSocket URLs contain bearer tokens.
        proxy_pass http://moalim_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;
    gzip_static on;
}
